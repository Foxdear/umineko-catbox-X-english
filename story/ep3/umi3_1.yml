14913: 'Rudolf@r@v08/31200001."Sheesh.@k@v08/31200002. Aneki''s hatred of cigarettes is a real pain in the neck."'
14914: 'Hideyoshi@r@v06/31100001."Sorry.@k@v06/31100002. She''s been grumpy since last night.@k@v06/31100003. Think you could let it slide?"'
14915: '@rRudolf and Hideyoshi went out onto the deck, and took out some cigarettes.'
14916: '@rEva had always hated the smell of cigarettes, but when she was in a bad mood, she got even more oversensitive.'
14917: '@rThe two of them had attempted to spend some relaxed time smoking until they made it to the island, but they had gotten yelled at and chased out onto the deck.'
14918: '@rHideyoshi tried to use his lighter, but it didn''t go well with all of the strong winds on the deck.@k@rRudolf took out a Zippo with a stylish gesture, and let Hideyoshi borrow the flame.'
14919: 'Rudolf@r@v08/31200003."When did you start smoking, Hideyoshi nii-san?"'
14920: 'Hideyoshi@r@v06/31100004."Just after the war.@k@v06/31100005. In the beginnin'', I was rollin'' ''em.@k@|@y@v06/31100006. Then I started usin'' what I was sellin''.@k@v06/31100007. Wahahahahahahaha."'
14921: 'Rudolf@r@v08/31200004."So you were already smoking when you met Aneki.@k@v08/31200005. I''ll bet she''s always telling you to stop."'
14922: 'Hideyoshi@r@v06/31100008."I never listened to her, so she''s already completely given up on that.@k@v06/31100009. Wahaha, looks like men''ve gotta be stubborn."'
14923: '@rHideyoshi laughed heartily, but Rudolf chuckled.'
14924: '@rAfter being scolded by Eva and told to smoke outside, they had dejectedly fled to the deck together.@k There was almost no doubt he was under her thumb.'
14925: 'Hideyoshi@r@v06/31100010."...She isn''t usually so short-tempered.@k@v06/31100011. ......Nah, she''s usually a more gentle, quiet woman.@k@v06/31100012. Every year, she changes when this day comes."'
14926: 'Rudolf@r@v08/31200006."Is that so?@k @v08/31200007.To me, she looks just like the Aneki we''ve all known for so long."'
14927: 'Hideyoshi@r@v06/31100013."......That''s right.@k@v06/31100014. She goes back to bein'' Eva of the Ushiromiya family.@k@v06/31100015. ...But, that''s different from the Eva who''s with me."'
14928: 'Rudolf@r@v08/31200008."..................@k@v08/31200009. Well, I can understand why she''s grumpy.@k@v08/31200010. ...This family conference is going to be a pain."'
14929: 'Hideyoshi@r@v06/31100016."......Sure is.@k@v06/31100017. ...That plan to threaten money out of Krauss nii-san.@k@v06/31100018. It''s a family conference only in name, really it''s just a fight between siblings."'
14930: '@rWith the family conference ahead of them, the three siblings excluding Krauss had made a secret contract.'
14931: '@rEach of them had a pressing situation to deal with, and urgently needed a lot of money.'
14932: '@rAnd the only one who could help them was Krauss, who spoke for the Ushiromiya head, since Kinzo was shut up in his study.'
14933: '@rThey had long felt that Krauss had started taking advantage of Kinzo''s loss of interest in his own wealth,@k and was embezzling that wealth for his own use.'
14934: '@rWhen everything had been going well for the siblings, even though they had found it detestable, they had pretended not to notice,@k ...but now that they needed money, they couldn''t just quietly accept that.'
14935: '@rEva had called Rudolf and Rosa into an alliance, and they were planning to exploit that knowledge in order to draw money out of Krauss...'
14936: 'Hideyoshi@r@v06/31100019.".........Rudolf-kun, both you and I are company presidents.@k@v06/31100020. We are responsible for the livelihood of our employees."'
14937: 'Rudolf@r@v08/31200011."Rosa is a president too.@k@v08/31200012. Well, as a hobby."'
14938: 'Hideyoshi@r@v06/31100021."That''s right, sorry.@k@|@y@v06/31100022. ......In short, all of us are bearin'' some burden."'
14939: 'Rudolf@r@v08/31200013."...Now that I''ve thrown the gauntlet down in front of the executive board, I gotta bring in the money, even if it means I have to grovel or even drink mud."'
14940: 'Hideyoshi@r@v06/31100023."Same here.@k@v06/31100024. ...I can''t betray my employees who''ve trusted me and followed me for so long.@k@v06/31100025. ......That''s why I gotta get some money out of Krauss nii-san, even if I have to grab him by the neck."'
14941: 'Rudolf@r@v08/31200014."Aneki has always been at odds with Aniki.@k@v08/31200015. ...And now she has to have a full-on confrontation with him.@k@v08/31200016. That''s probably enough to make her grumpy."'
14942: 'Hideyoshi@r@v06/31100026."So, Eva has always been on bad terms with Krauss nii-san, then...?"'
14943: 'Rudolf@r@v08/31200017."She doesn''t talk to you about it?@k @v08/31200018.Definitely, yeah, in a really big way."'
14944: 'Hideyoshi@r@v06/31100027."She won''t tell me about the past even if I ask.@k@v06/31100028. ......She probably doesn''t want to remember."'
14945: 'Rudolf@r@v08/31200019."...Aneki has always been smart and shrewd.@k@v08/31200020. Her grades were good too.@k@v08/31200021. Compared to that, Aniki was just average.@k@v08/31200022. ...Her just being there beside him should have been enough pressure, but Aneki kept boasting about it and driving Aniki into a corner."'
14946: 'Hideyoshi@r@v06/31100029."......Silly girl...@k@v06/31100030. Why be openly hostile like that and drive him into a corner?@k@v06/31100031. That''s not bein'' shrewd."'
14947: 'Rudolf@r@v08/31200023."Hahaha, seriously."'
14948: 'Rudolf@r@v08/31200024.".........Aneki regretted being born a woman.@k@v08/31200025. ...She probably couldn''t forgive Aniki for getting to succeed the head just because he was a man.@k@v08/31200026. ...So she''d always take every opportunity to boast to Dad that she was superior."'
14949: 'Hideyoshi@r@v06/31100032."Father really is an old-fashioned person.@k@v06/31100033. His values discriminate between men and women.@k@|@y@v06/31100034. ...You think that Father disliked Eva a bit, since she likes to make herself conspicuous...?"'
14950: 'Rudolf@r@v08/31200027."..........................."'
14951: 'Krauss@r@v02/30800003."Don''t you think that schooling for women is like sugar in black tea?@k @v02/30800004.Without it, it is bland, but too much of it ruins the tea."'
14952: '@r...Since you can still drink black tea without sugar,@k it was exactly the same as saying that study was unnecessary for a woman.'
14953: '@rThose infuriating words were ones that my older brother had abused me with when I had been in despair, wanting to go to college but denied by Father.'
14954: '@rI had protested that advancing to college was essential if I was to acquire the education and class befitting the eldest daughter of the Ushiromiya family.'
14955: '@rBut the replies I received from Father and my brother were, in summary, exactly the same.'
14956: '@r"How conceited for a woman."'
14957: '@rSince the time I was born into the Ushiromiya family, I hadn''t taken that name lightly even once.@k And furthermore, nor had I ever taken lightly Father''s name, Ushiromiya Kinzo.'
14958: '@rIt was an old family with a long history, but it had lost all its wealth and its business in the Great Kanto Earthquake, and almost sank for a time.@k Then Father, with his ingenious talent, had taken control, and revived it to be even greater than it had been before.'
14959: '@rI hadn''t forgotten even once what it meant to be the daughter of that great Ushiromiya Kinzo.'
14960: '@rTherefore, I had always made every effort to become worthy of that name.'
14961: '@rClass worthy of the Ushiromiya family.@k Schooling.@k Manners.@k And leadership.'
14962: '@rEven if I was far from reaching Father''s level, I deepened my knowledge in economics and finance, and tried to improve myself so that I could help out with that at any time.'
14963: '@r......However, in the end, there never came a time when Father acknowledged that.'
14964: '@rTo Father, a woman was only meant to support a man, and nothing further than that was permissible.'
14965: '@rI wonder when it was that I understood that.@k@r......I probably understood ever since I was a young girl.'
14966: '@r...But to truly accept it, I had to wait until I had grown up.'
14967: '@rCompared to my own effort, you couldn''t have said that Krauss, as my older brother by two years,@k tried at all to become deserving of the Ushiromiya family name.'
14968: '@rEver since we were young, my brother kept saying that it was natural that he''d succeed Father, just because he was born a man.'
14969: '@r...He kept repeating that, as though it were an absolute gap between us.'
14970: '@rI couldn''t stand it.@k Even though I always got better grades than my brother,@k even though I became class president while he was stuck as vice-president of his class,@k ...even so, my brother was considered to be the appropriate person to succeed the Ushiromiya family, just because he was a man.'
14971: '@rOf course, you could get away with gender discrimination in those days.@k@rNo, it was even considered a virtue in those days.'
14972: '@rIt was a time when women were looked down upon, and it was said that when a woman is born, she is to obey her parents; when she gets married, she is to obey her husband; and when she gets old, she is to obey her children.'
14973: '@rBut because that way of thinking existed, I wanted to overturn it.@k@r......Innocently, I kept trying to prove that I was the most fit.'
14974: '@r......However, eventually, I realized that all of my efforts were doomed from the beginning.'
14975: 'Krauss@r@v02/30800001."Don''t you think that schooling for women is like sugar in black tea?@k @v02/30800002.Without it, it is bland, but too much of it ruins the tea."'
14976: 'Eva@r@v05/31000001."...What do you mean by that, Nii-san?"'
14977: 'Krauss@r@v02/30800005."In the same way that there are things that only men can do, there are also things that only women can do, are there not?@k @v02/30800006.I think things like giving birth to children, raising them, and supporting their husband can only be done by women."'
14978: 'Eva@r@v05/31000002."Are you trying to say that there''s no need for a woman to do things like work and study?"'
14979: 'Krauss@r@v02/30800007."I wouldn''t go that far.@k@v02/30800008. Unschooled women are tiring just to talk to.@k@v02/30800009. ...However, women who are too smart are even more tiring.@k@v02/30800010. I think that a woman like you, who vehemently asserts herself, would cause her future husband a lot of trouble."'
14980: 'Eva@r@v05/31000003."Are you trying to say that a woman must marry and stay in the shadow of their husband?@k @v05/31000004.That''s none of your business!"@|@y'
14981: 'Krauss@r@v02/30800011."I admire you as my little sister for feeling that you should respect Father and become a proper daughter for him.@k@v02/30800012. Even I can respect that."'
14982: 'Eva@r@v05/31000005."Disgusting.@k@v05/31000006. What is this "@b"I" (official).@<watashi@>"?@k@v05/31000007. You''ve always used "@b"I" (casual).@<ore@>".@k@v05/31000008. Are you already pretending to be the head?"'
14983: 'Krauss@r@v02/30800013."It was decided that I would succeed the head from the beginning.@k@v02/30800014. And yet you seem to be laboring under the illusion that you can become the head, and have just been making useless and reckless attempts to do that."'
14984: 'Eva@r@v05/31000009."Reckless attempts, you say...?!@k @v05/31000010.Is my saying that I want to go to college really that odd?!"'
14985: 'Krauss@r@v02/30800015."Yes, it''s odd.@k@v02/30800016. Indeed, you are the eldest daughter of the glorious Ushiromiya family.@k@v02/30800017. Eventually, you will bear the responsibility of that family crest, and be wed to the partner who is most valuable for Father."'
14986: 'Krauss@r@v02/30800018."...However, what will be demanded of you then is not an excess of knowledge.@k@v02/30800019. It is gentle feelings to care for your husband and ability in housework, and it is a humble demeanor that will support the master of your household.@k@v02/30800020. You are completely lacking in all of those things.@k@v02/30800021. In the end, is that really proper for a daughter of the Ushiromiya family?"'
14987: 'Eva@r@v05/31000011."I have no intention of being a secluded daughter!@k @v05/31000012.I just want to become the best person who can help Father with his work!"'
14988: 'Krauss@r@v02/30800022."In which case, should you not be aiming to become worthy as a daughter of the Ushiromiya family...?@k @v02/30800023.What is it with you?@k@v02/30800024. Even at this age, you still act like a man, you are careless with housework and cooking, and you never wear any makeup to please men.@k@v02/30800025. Recently I''ve heard that you''ve even been training to learn how to brawl."'
14989: 'Eva@r@v05/31000013."Th-that''s rude!!@|@y@k @v05/31000014.It isn''t brawling, the martial arts are the perfect training for the mind.@k@v05/31000015. And at the proper time, I can act like a woman well enough!!@k @v05/31000016.What are you trying to say?@k@v05/31000017. That women should be slaves who work for men, that women must not step out in front, is that what you''re trying to say?!"'
14990: 'Krauss@r@v02/30800026."It isn''t elegant to admit that,@k@v02/30800027. but in order to correct your mistake, I think that a few unpleasant words are necessary.@k@v02/30800028. So let me say it plainly.@k@v02/30800029. Women exist to serve men.@k@v02/30800030. And men exist to cultivate women.@k@v02/30800031. A woman''s job is to protect a man''s back, to protect their house and raise their children."'
14991: 'Krauss@r@v02/30800032."Normally, they don''t have to be told that to realize it.@k@v02/30800033. They realize it by themselves.@k@v02/30800034. ...But no matter how old you get, you haven''t realized that about yourself.@k@v02/30800035. So as your brother, I will clear away that misunderstanding for you before you exit this house into society.@k@v02/30800036. You should thank me."'
14992: 'Eva@r@v05/31000018."Th-that is an insult to all women...!!@k @v05/31000019.No, ...wait, ...I, I have never thought of myself as a woman, I''ve never depended on anyone because I''m a woman!!"'
14993: 'Eva@r@v05/31000020."How am I inferior to you, Nii-san?!@k @v05/31000021.In grades, in accomplishments, I''m better than you in everything, so how can you look down on me when you don''t have anything I don''t, except being a man?!!"'
14994: 'Krauss@r@v02/30800037."It''s about whether or not you know your place.@k@v02/30800038. Every day, I have been raised so that I would be prepared to be the next head.@k@v02/30800039. In the future, that will definitely be essential.@k@v02/30800040. But you are different.@k@v02/30800041. Even though you will marry and lose the Ushiromiya family name, you keep seeing this illusion that you don''t need to see."'
14995: 'Krauss@r@v02/30800042."......What are you so unsatisfied about?@k@v02/30800043. Even if you were born as a man, it still wouldn''t be you who would succeed the head.@k@v02/30800044. What''s so unsatisfying that you keep attacking me?"'
14996: 'Eva@r@v05/31000022."What''s so unsatisfying, you say?!?!@|@y@k @v05/31000023.Nii-san, you are always, always,@v05/31000024. ......always always always...!@k @v05/31000025.You claim yourself as the successor, look down on me,@v05/31000026. ......and despite that...@v05/31000027.......urrrrrrrgggggggggg!!"@|@y'
14997: '@rWhat''s so unsatisfying, he says...?'
14998: '@rA billion grudges, hard feelings, humiliations that I''ll never forget crossed through the back of my mind.'
14999: '@rAnd all of them built up at the same time, coming out of my throat as nothing more than a shameful moan.'
15000: 'Kinzo@r@v01/31500001."......What is all this noise.@k@|@y@v01/31500002. God isn''t the only one who values silence."'
15001: 'Krauss@r@v02/30800045."Father."'
15002: 'Eva@r@v05/31000028."Father!"'
15003: '@rOur sibling fight was probably overheard.@k@rFather entered with a clearly displeased face.'
15004: 'Kinzo@r@v01/31500003."Krauss.@k@v01/31500004. Are you fighting with your siblings again?@k@v01/31500005. Why do you not have the dignity to lead your siblings?@k@v01/31500006. How shameful!@k @v01/31500007.You are a joke of an eldest son!"'
15005: '@rIn a flash, he struck Krauss''s face.'
15006: '@r...I prepared myself to be struck in the same way, but I wasn''t hit.'
15007: 'Krauss@r@v02/30800046."M-......my apologies,@k@v02/30800047. Father."'
15008: 'Kinzo@r@v01/31500008."Dignity isn''t the only thing that you lack.@k@v01/31500009. There''s much more.@k@v01/31500010. You''re immature in everything!@k @v01/31500011.And even so, you pretend like you''re an adult!@k @v01/31500012.Realize that it''s a hundred years too early for you to talk like that, and devote yourself to your studies!@k @v01/31500013.Don''t make me lament my son''s incompetence any more...!"'
15009: 'Krauss@r@v02/30800048."Yes.@k@v02/30800049. ...I will continue to strive so that I can become a person worthy to succeed you, Father..."'
15010: '@rIt was as if those words were directed at me.'
15011: '@rEven when he was being yelled at by Father, he was still bragging to me about how he was special,@w500. ......about how he was the successor.'
15012: '@rI just couldn''t stand it, and finally spoke what was on my mind.'
15013: '@rEven though I realized that this was improper for a person of the Ushiromiya family.'
15014: 'Eva@r@v05/31000029."Father...!!@k @v05/31000030.Please tell me, how am I inferior?!!@k @v05/31000031.Until today I''ve tried so hard, studied so hard to become a person who would not shame your name...!"'
15015: 'Eva@r@v05/31000032."Please, tell me, in what way am I inferior...?!@k @v05/31000033.How can I improve myself so that you will accept me...!!"'
15016: 'Kinzo@r@v01/31500014."Are you still talking about that?!!@|@y@k @v01/31500015.How many times do I have to tell you?@k@v01/31500016. I have no expectations for you whatsoever!@k @v01/31500017.A woman should just learn cooking and sewing, like a woman!!@k @v01/31500018.You have none of the necessary attitude of a woman!@k @v01/31500019.I can''t sense any of the disposition needed to serve a husband, the heart to devote yourself to a man!!"'
15017: 'Kinzo@r@v01/31500020."What good are you as a woman!@k @v01/31500021.Do you realize that you are a daughter of the Ushiromiya family!!@k @v01/31500022.And yet, the only thing you want to learn is how to act like a man!@k @v01/31500023.Your duty is not to act like Krauss!!@k @v01/31500024.Do you even understand your own duty?!!"'
15018: 'Eva@r@v05/31000034."A-as a person of the Ushiromiya family, I won''t embarrass your na - "'
15019: 'Kinzo@r@v01/31500025."That''s it, right there you''re already wrong!!@|@y@k @v01/31500026.Your duty is to marry out of the family, and bring me a man who is profitable to me!@k @v01/31500027.And then devote yourself to your husband, be fruitful and multiply!@k @v01/31500028.Be a good wife who brings praise to your husband''s family!!"'
15020: 'Kinzo@r@v01/31500029."What can you do that is capable of pleasing a man?@k @v01/31500030.Do you think you can make tea?@k@v01/31500031. Do you have any talent in cooking?@k@v01/31500032. You have nothing!!"'
15021: 'Kinzo@r@v01/31500033."All you have done is to try to act like Krauss!!@k @v01/31500034.Krauss will succeed the Ushiromiya family!@k @v01/31500035.If you are unsatisfied with that, then you are disobeying me!!"'
15022: 'Kinzo@r@v01/31500036."Are you saying that you won''t even listen to what I say, even though you''re my daughter!!!@k @|@y@v01/31500037.Get out!!@k @v01/31500038.You''re disinherited!!@k @v01/31500039.I won''t let you use the name Ushiromiya!!@k @v01/31500040.Disinherited disinherited!!@|@y@k @v01/31500041.Uuug, *cough*cough*!!"@|@y'
15023: 'Krauss@r@v02/30800050."Father, stay strong.@k@v02/30800051. Please calm down.@k@v02/30800052. ......Genji-san, could you bring some water?"'
15024: 'Genji@r@v14/31600001."......Yes.@k@v14/31600002. Immediately."'
15025: 'Krauss@r@v02/30800053."Eva, leave this place.@k@v02/30800054. He doesn''t mean what he says.@k@v02/30800055. I will calm him down."'
15026: 'Kinzo@r@v01/31500042."*cough*, *cough*cough*!!@|@y@k @v01/31500043.Disinherited, if you won''t listen to me, you''re disinherited!!@k @v01/31500044.*cough**cough*, uug, *hack*cough**cough*!!"@|@y'
15027: '@rAs Father struggled with a fit of heavy coughs, my brother patted his back.'
15028: '@r...As if that were naturally his duty.@k@rIt was so vexing for me then to let him monopolize that duty.'
15029: '@rIf I approached Father carelessly, I would probably be hit again.'
15030: '@r...However, I fearlessly tried to approach Father''s back.'
15031: '@rGenji blocked me...'
15032: 'Genji@r@v14/31600003."......Eva-sama, it would probably be better if you stepped outside for now.@k@v14/31600004. The Master is not in a good mood today."'
15033: 'Eva@r@v05/31000035."B-but......"'
15034: 'Kinzo@r@v01/31500045."*cough*cough*!!"@|@y'
15035: 'Kinzo@r@v01/31500046."Why are my children so incompetent?!@k @v01/31500047.Krauss is lacking in dignity, Eva never moves on from being a stubborn tomboy!!@k @v01/31500048.I have no manly son, not even a womanly daughter!"'
15036: 'Kinzo@r@v01/31500049."Where did I go wrong raising them?!@k @v01/31500050.Why Genji, when and where and how did I go wrong?!!"'
15037: 'Genji@r@v14/31600005."......My lord, you have done nothing wrong.@k@v14/31600006. Krauss-sama has grown into a sturdy son, and Eva-sama into a lovely daughter.@k@v14/31600007. You haven''t made any mistakes..."'
15038: 'Kinzo@r@v01/31500051."In what way!!@|@y@k @v01/31500052.In what way is she lovely?!!@k @v01/31500053.Far from a lady, she''s always acting like a man!!@k @v01/31500054.*cough*cough*cough*!!@k @v01/31500055.Disinherited, disinheriteddd!!@k @v01/31500056.*cough*cough*!!"'
15039: 'Krauss@r@v02/30800056."Father, I was just warning Eva about that very thing.@k@v02/30800057. Eva, too, promised that she would have a change of heart and begin acting like a lady.@k@v02/30800058. Couldn''t you postpone that for just a little longer?"'
15040: 'Kinzo@r@v01/31500057."Lady, my foot!!@k @v01/31500058.*cough*cough*!!@k @v01/31500059.Disinherited disinherited... *cough*cough*, uugg, *hack*hack*!"'
15041: '@rGo quickly and I''ll handle this for you.'
15042: '@rKrauss gave me a look telling me that...'
15043: '@r......Did I take the wrong path, just like Father and my brother had said?'
15044: '@rThey were right that I had never studied how to be a lady.@k@r...Everything I had learned was because I''d hoped that I could help Father someday.'
15045: '@r.........Wait, was that really the case?'
15046: '@rHadn''t I always held a growing sense of rivalry with my brother, with whom I''d had a bad relationship since I was a young girl,@k and wasn''t I just trying to get the better of him by stealing his position as successor to the head?'
15047: '@rEvery time, my brother told me that men should be manly and women should be womanly.'
15048: '@rI had been tormented by this unreasonable discrimination because of my sex, something I was born with and couldn''t do anything about.'
15049: '@rI had resisted, had endeavored to study until today so that I could prove that I wasn''t inferior, even though I was a woman.'
15050: '@r...In that case, wasn''t the basis of my love of learning just a boring inferiority complex toward my brother?'
15051: '@rFather had expected me to be a lady with whom he could go out in public and not be embarrassed.'
15052: '@r...Had I betrayed that expectation and earned grades to intimidate my brother just to clear away that pent-up resentment from my childhood...?'
15053: '@r@v34/33300001."That''s not it.@k@v34/33300002. You vowed to me that I would become the successor to the Ushiromiya family."'
15054: 'Eva@r@v05/31000036.".........You........."'
15055: '@rThe one who came whispering to me.........was myself, born in my heart on the day I made that vow - myself on that day as a little girl.'
15056: '@r...That''s right.@k "She" was my only ally.'
15057: '@rWhenever I was suffering, whenever I felt like I could take no more, she would always quietly appear and take my side.'
15058: '@rWhenever I found myself with my head in my hands, stumbling over difficult problems, she would always appear and support me.'
15059: '@rAs I had grown and forgotten my time as a girl, I''d also begun to forget my conversations with "her"...'
15060: '@r@v34/33300003."I, Ushiromiya Eva, will definitely become the head of the Ushiromiya family.@k@v34/33300004. And I''ll triumph over that irritating, arrogant Krauss.@k@v34/33300005. ...On that day, we promised to do our best together to achieve that."'
15061: 'Eva@r@v05/31000037."......That''s right. We promised.@k@v05/31000038. ...On that day, that I would become the successor to the head."'
15062: '@rOn that day, when I had been overcome with sadness, wondering why I was even alive,@k ...you appeared inside me, and lent me your strength.'
15063: 'Eva@r@v05/31000039."......I wanted Father to accept me.@k@v05/31000040. I wanted to get the better of my brother.@k@v05/31000041. I believed that, if I could do that, I could forever part ways with that wretched part of myself."'
15064: '@rIn those days, I had really believed that I had no other purpose in life than to be looked down upon by my brother.'
15065: '@r...It''s painful just remembering those days.@k@rThe wound, the tear that split open in my heart...'
15066: '@r"She" taught me how to sew up that wound...'
15067: '@rI would change my anger into effort and improve myself,@k ......become a person more worthy to be head than Krauss was,@k and triumph over him by making Father accept me - the perfect revenge.'
15068: '@rI knew more or less that a woman couldn''t succeed the head.'
15069: '@rBut if I could become so superior that I could overturn that,@k ...then surely even Father would select me to be his successor.'
15070: '@rIf that happened, ......then I could have the greatest, ultimate, most perfect revenge against my brother,@k who always acted like it was completely natural for him to succeed the head...'
15071: '@r@v34/33300006."Right.@k@v34/33300007. If we do that, then the wounds in our heart will be healed.@k@v34/33300008. ......We promised each other that we would do our best until that day came."'
15072: '@r@v34/33300009."And yet, you''re breaking this promise?@k @v34/33300010.Scum.@k@v34/33300011. Coward.@k@v34/33300012. Why not give up and die forever...?"'
15073: '@rEven though she has the form of my young self, she is still another me.@k ...And she has a sharp tongue - after all, she''s me.'
15074: 'Eva@r@v05/31000042."...It really makes me mad hearing that from myself.@k@v05/31000043. You have no right to speak of me like that."'
15075: '@r@v34/33300013."Then let''s use that anger and learn from it.@k@v34/33300014. ......Changing anger into power is my magic.@k@v34/33300015. I''ve saved you from several predicaments with that power, and allowed you to achieve things that should have been impossible for you.@k@v34/33300016. As long as you have my magic, there''s nothing you can''t do."'
15076: 'Eva@r@v05/31000044."......That''s right.@k@v05/31000045. Anger has always been my driving force.@k@v05/31000046. I wonder when it was that I forgot that..."'
15077: '@r@v34/33300017."If you have remembered me again, that magic is ours once more.@k@v34/33300018. Come on, let''s turn that anger into power, and endeavor in our studies even more, alright?@k @v34/33300019.I''m sure that we still have a lot more studying that we need to do."'
15078: '@r@v34/33300020."Let''s go to college, study more and more, get excellent grades, and drive Krauss into a corner."'
15079: '@r@v34/33300021."That guy makes a face as though we''re nothing, but I''m sure he feels pretty well cornered in his heart.@k@v34/33300022. If only he would just learn his place and die.@k@v34/33300023. If he did, we could become the head.@k@v34/33300024. Rudolf will be nice enough to decline.@k@v34/33300025. That kid can''t go against us."'
15080: 'Eva@r@v05/31000047.".........Stop that.@k@v05/31000048. ...Even if I study more, Father still won''t accept me."'
15081: '@r@v34/33300026."Why...?"'
15082: 'Eva@r@v05/31000049."Father is telling me to be womanly...@k@v05/31000050. No matter how hard I try, as long as I''m a woman, Father will never pass on the headship to me... even if I''d been born before Nii-san..."'
15083: 'Eva@r@v05/31000051."No matter how much effort I put in, ......I can''t become anything more than a woman.@k@v05/31000052. I won''t be accepted.@k@v05/31000053. I can''t surpass Nii-san, who doesn''t try at all.@k@v05/31000054. I will always be looked down upon..."'
15084: '@r@v34/33300027."...Father and Krauss are the worst kind of male supremacists.@k@v34/33300028. I wish they''d just fucking die already."'
15085: '@r......She would curse in my place.'
15086: '@rWords that I couldn''t say carelessly, ...she would say for me.'
15087: '@r...Even though I understood that she was just another part of myself inside of me,@k ...I felt like she was the only ally I had who would sympathize with me.'
15088: '@rHowever, while sympathy might calm my heart somewhat, it wouldn''t do anything to improve my current situation.@k ......In the end, she could only console me when I was dejected by reality, and for the amount of time I needed to accept it.'
15089: 'Eva@r@v05/31000055."......Thank you.@k@v05/31000056. That''s enough, now.@k@v05/31000057. ...Now that it''s come to this, I''ll become such a good lady that I''ll surprise Father...@k@v05/31000058. I''ll find an excellent man that Nii-san can''t even be compared with - "'
15090: '@r@v34/33300029."No, that''s no good."'
15091: 'Eva@r@v05/31000059."............"'
15092: '@r"She" rejected my timid thoughts.'
15093: '@r...I know why.@k@r......Because "she" is me, I know why.'
15094: '@r@v34/33300030."Father says, or at least right now he says, that he won''t let a woman succeed the head.@k@v34/33300031. But that''s never been anything more than a rule that Father decided on.@k@v34/33300032. Since Father decided on it, he can abolish it."'
15095: '@r@v34/33300033.".........People''s feelings can change many more times than there are grains of sand on a beach.@k@v34/33300034. Even if we don''t prove that Krauss is a stupid man, Father will eventually realize it."'
15096: '@r@v34/33300035."...At that time, the ridiculous wall that separates man from woman will be demolished by Father, who set it up in the first place.@k@v34/33300036. That day will surely come."'
15097: 'Eva@r@v05/31000060."......How can you say surely?"'
15098: '@r@v34/33300037."Because that is my...magic."'
15099: 'Eva@r@v05/31000061."....................."'
15100: '@r@v34/33300038."If you''ll just believe, this magic will surely create a miracle.@k@v34/33300039. ......The basis of my magic is nothing more than your believing heart."'
15101: 'Eva@r@v05/31000062."..........................."'
15102: '@rIf I can use that magic, ......then surely, until the day I die, I''ll never have to doubt that someday I will become the head.'
15103: '@r...But I don''t know if that is the right thing for Ushiromiya Eva...'
15104: '@rShouldn''t I aim to become the kind of lady that Father hoped for, someone he can take out into society and boast about?'
15105: '@rFather might take a better view of me if I were reborn.@k ......Maybe my brother could find his own lifestyle, and I could find mine.'
15106: '@rBesides, no matter what, I just can''t imagine that my father, stubborn as he is, would not only allow a woman to succeed the head,@k but also skip my older brother and select me for the headship.'
15107: '@r@v34/33300040.".........You don''t believe?"'
15108: 'Eva@r@v05/31000063."U-...um, I was...just thinking.@k@v05/31000064. .........Maybe I can''t succeed the head, but, as a woman, I can have a child. And Nii-san still isn''t engaged."'
15109: 'Eva@r@v05/31000065."......If Nii-san doesn''t manage to have children, and I do, ...then wouldn''t the next head after Nii-san be my child?@k @v05/31000066.Wouldn''t that basically...mean the same thing as stealing the headship from Nii-san...?"'
15110: '@r@v34/33300041."............Are you serious?"'
15111: 'Eva@r@v05/31000067."Y-...yes. I''m serious.@k@v05/31000068. ......It will indeed be quite sad to throw away the determination from my years as a young girl.@k@v05/31000069. ...It will pain my heart to betray you, my younger self.@k@v05/31000070. ......But this way is the most realistic...!"'
15112: '@rIn that moment, my body changed, and I was no longer myself from back then, but as I am now: a "wife" and "mother".'
15113: '@rYes......this is a "dream".@k Even so, "she" still possessed the same ambition and desire as always, and she argued back, with her expression displaying clear displeasure at this change.'
15114: '@r@v34/33300042."Are you throwing away your dreams?@k @v34/33300043.......And are you even throwing me away?"'
15115: 'Eva@r@v05/31000071."I''m not throwing anything away.@k@v05/31000072. ......It''s just that I''ve become an adult, and the time has come for us to go our separate ways."'
15116: '@r@v34/33300044."That''s right.@k@v34/33300045. You''ve already become an adult.@k@v34/33300046. You''ve even forgotten how to use magic.@k@v34/33300047. ......You are now the mother of a child.@k@v34/33300048. You''ve forgotten the magic that can grant your own dreams, and are now pushing those dreams onto your son."'
15117: '@r@v34/33300049."...Even though you had your own life messed with so much by Father and Krauss, you''re trying to push your dreams onto your son, and mess with his life too.@k@v34/33300050. ......Is that what being an adult is all about?"'
15118: 'Eva@r@v05/31000073."G-George is my pride and joy, who won''t embarrass me no matter where he goes...!@k @v05/31000074.The dream that wasn''t granted me might be granted to George...!@k @v05/31000075.Jessica''s grades and behavior aren''t good at all.@k@v05/31000076. And she''s a woman!@k @v05/31000077.If only Jessica would step down, George could become the heir...!"'
15119: '@rMy heart pained even as I said it.'
15120: '@rAren''t I just forcing my own regrets onto George?'
15121: '@rI don''t have any right to disparage Jessica.@k And to hit her with the same words that had caused me so much suffering is just horrible...'
15122: '@r...I understand.@k I understand...'
15123: '@rWanting to triumph over my brother was nothing more than my personal revenge.@k@r...I mustn''t use George for that...'
15124: 'Eva@r@v05/31000078."......So I''ll take revenge myself.@k@v05/31000079. I have a plan to cheat Nii-san out of some of his money, with Rudolf and Rosa as my allies.@k@v05/31000080. I''ll surely be able to get back at him.@k@v05/31000081. ...I mean, there''s no doubt that Nii-san is embezzling Father''s assets..."'
15125: '@r@v34/33300051."...What a boring plan.@k@v34/33300052. Why don''t you just give that up and cry yourself to sleep forever...?"'
15126: 'Eva@r@v05/31000082."..........................."'
15127: '@r@v34/33300053."We will become the head of the Ushiromiya family.@k@v34/33300054. ......Don''t try to confuse that dream.@k@v34/33300055. So believe me that you can definitely achieve it.@k@v34/33300056. Believe in my magic."'
15128: 'Eva@r@v05/31000083."...If I believe, will the magic have power, I wonder."'
15129: '@r@v34/33300057."Yes.@k@v34/33300058. My magic can grant any wish without fail."'
15130: 'Eva@r@v05/31000084."..................@k@v05/31000085. ......I''ll believe.@k@v05/31000086. ......I''ll believe, ...so create a miracle with that magic...@k@v05/31000087. ......If you don''t, ......the hole in my heart will never heal......"'
15131: '@r@v34/33300059."Yes.@k@v34/33300060. ......Then, listen well.@k@v34/33300061. To my magic words.@k@v34/33300062. ......And understand them. If we can solve the riddle, we can become the Ushiromiya family head.@k@v34/33300063. ......So lend me your ears and listen carefully..."'
15132: '@rBehold the sweetfish river, running through my beloved home of old.@k@rYou who seek the Golden Land, follow its path downstream in search of the key......'
15133: 'Kyrie@r@v09/31300001."Eva nee-san.@k@v09/31300002. It looks like we''re about to arrive."'
15134: '@rAs her shoulder was tapped by Kyrie, Eva jumped and awoke from her doze.'
15135: 'Eva@r@v05/31000088.".........nh.@k@v05/31000089. .........Ah,@v05/31000090. ......I''m sorry.@k@|@y@v05/31000091. I was half asleep."'
15136: 'Kyrie@r@v09/31300003."Sorry for surprising you."'
15137: 'Battler@r@v10/30100020."Auntie Eva, you were out cold.@k@v10/30100021. Did you get up early this morning?"'
15138: 'Eva@r@v05/31000092."......I suppose.@k@v05/31000093. How embarrassing, I must have looked quite disgraceful.@k@v05/31000094. I''m sorry."'
15139: 'Jessica@r@v04/30200001."Pretty impressed that you''re relaxed enough to sleep, though?@k @|@y@v04/30200002.Not like Battler, he''s been yelling the whole time about how he''s gonna "falllll" and "drowwwwn"!@k @v04/30200003.Can''t get bored with this dude around."'
15140: 'Battler@r@v10/30100022."Sh-shut up!@k@v10/30100023. Everyone has one or two things they don''t like...!"'
15141: '@rBattler and Jessica went back out, squabbling merrily.@k@rRudolf also made a face as if asking, "Are you alright?".'
15142: 'Rudolf@r@v08/31200028."Get ahold of yourself.@k@v08/31200029. When you see the faces of Dad and the rest, all that sleepiness''ll go right out the window.@k@v08/31200030. Let''s do our best to stay firm, alright?"'
15143: 'Eva@r@v05/31000095."...That''s right.@k@v05/31000096. We have to stay firm, especially this year..."'
15144: 'Rudolf@r@v08/31200031."That''s it.@k@v08/31200032. ...Let''s tense up our assholes and do this thing."'
15145: '@rRudolf said these strict words in a small voice that only Eva could hear.'
15146: '@rFailure would not be tolerated in this year''s family conference.@k@r......All of their companies were hanging in the balance.'
15147: '@rEven Rudolf''s face looked a little tense.@k@rEva''s expression probably looked tense as well.'
15148: 'George@r@v07/30300001."Mother, I have our luggage.@k@v07/30300002. Let''s go up onto the deck."'
15149: 'Eva@r@v05/31000097."...Thank you.@k@v05/31000098. You really are thoughtful, George."'
15150: 'George@r@v07/30300003."Why are you thanking me so suddenly?@k@v07/30300004. It''s not like you, Mother."'
15151: 'Hideyoshi@r@v06/31100035."Evaaa, Geoorge.@k@v06/31100036. We''ve arrived.@k@v06/31100037. Gather our luggage."'
15152: 'Maria@r@v13/30400001."Uu!@k @v13/30400002.Arrived, arrived!@k @v13/30400003.*giggle*giggle*!"'
15153: 'Rosa@r@v12/31400001."Hey, Maria!@k @v12/31400002.You''ll fall, so stop running!"'
15154: '@rIt seemed Maria was already getting excited.@k She ran circles around Hideyoshi, escaping from Rosa, who was trying to catch her.'
15155: 'Eva@r@v05/31000099.".........belove..................key......"'
15156: 'George@r@v07/30300005."What is it, Mother?@k@|@y@v07/30300006. ...Do you feel sick...?"'
15157: 'Hideyoshi@r@v06/31100038."George.@k@v06/31100039. Take the luggage and go on ahead.@k@v06/31100040. Your mother''s probably anemic, so I''ll lend her a hand."'
15158: 'George@r@v07/30300007."Really...?@k@v07/30300008. I understand, I''ll go on ahead."'
15159: '@rBy looking at Eva''s peculiar expression, Hideyoshi realized that it had not been a pleasant awakening, and made George go on ahead.'
15160: '@rRudolf''s family and Rosa''s family also went up onto the deck, leaving only Eva and Hideyoshi inside the boat.'
15161: '@rEva had a vague expression on her face, as though she still hadn''t been able to escape from her daydream.'
15162: 'Eva@r@v05/31000100."..........................."'
15163: 'Hideyoshi@r@v06/31100041."...What''s wrong?@k@v06/31100042. Why the meek face?"'
15164: 'Eva@r@v05/31000101.".........I...wonder if I''ve been using George as a tool for my own revenge...@k@v05/31000102. ...I wonder if my childish hostility towards Nii-san has caused me to treat that boy''s life like a toy...@k@v05/31000103. Aah, what have I done... What have I......!"'
15165: 'Hideyoshi@r@v06/31100043."That isn''t true.@k@v06/31100044. George is our wonderful son, and he''ll always perform admirably wherever he goes.@k@v06/31100045. Even if your own ends got a little mixed in, everything''s turned out alright in the end, hasn''t it?!"'
15166: 'Hideyoshi@r@v06/31100046."You haven''t done aaaanything wrong.@k@v06/31100047. To the contrary, George is thankful for how you''ve been strictly disciplinin'' him, right?"'
15167: 'Eva@r@v05/31000104."...Really?@k @v05/31000105.Hey, really?!@k @v05/31000106.I wonder, doesn''t George think I''m a horrible mother...?!@k @v05/31000107.Doesn''t he, doesn''t he doesn''t he doesn''t he?!"'
15168: 'Hideyoshi@r@v06/31100048."He''s never said anythin'' like that, not even once.@k@v06/31100049. That''s just your needless anxiety."'
15169: 'Kumasawa@r@v18/31800001."Hideyoshi-sama.@k@v18/31800002. Everyone has left the boat, you know.@k@|@y@v18/31800003.......Oh, did you drop something?@k@v18/31800004. Shall I help you?"'
15170: '@rKumasawa had come to check on them when they hadn''t come up to the deck.'
15171: '@rHideyoshi hid Eva behind his back so that her expression couldn''t be seen.'
15172: 'Hideyoshi@r@v06/31100050."Yeah, sorry.@k@v06/31100051. My necktie pin just got a little crooked!@k @v06/31100052.We''re alright, and we''ll be out in a second.@k@v06/31100053. Wait outside for us!"'
15173: 'Kumasawa@r@v18/31800005."Is that so?@k @v18/31800006.......Hoh-hoh-ho.@k@v18/31800007. Then I will wait outside..."'
15174: '@rFrom that almost incomprehensible excuse, Kumasawa realized that something had come up, and disappeared so that she didn''t trouble them further.'
15175: '@rIf they stayed here any longer, they would probably make everyone else worry too.'
15176: 'Hideyoshi@r@v06/31100054."...It''s about time to go.@k@v06/31100055. We''ll make George and the rest worry."'
15177: 'Eva@r@v05/31000108."............Am I......really not despised by George......?"'
15178: 'Hideyoshi@r@v06/31100056."Yeah.@k@v06/31100057. Nothin'' of the sort.@k@v06/31100058. In fact, he''s very grateful."'
15179: 'Eva@r@v05/31000109.".............................."'
15180: 'Hideyoshi@r@v06/31100059."...Did you have a bad nightmare?@k@v06/31100060. Again?"'
15181: 'Eva@r@v05/31000110."..................@v05/31000111.Yes."'
15182: '@rHideyoshi knew that it wasn''t rare for Eva to be tormented by nightmares.'
15183: '@rAnd they would always become more striking on the days leading up to the family conference...'
15184: '@rHideyoshi knew that Eva''s relationship with Krauss was still so full of antagonism that it could even be called trauma,@k and that she still couldn''t separate herself from how she''d felt as a child.'
15185: 'Hideyoshi@r@v06/31100061."That was a dream.@k@v06/31100062. ...I''m with you now.@k@v06/31100063. If I grasp your hand tightly like this, that dream''ll go flyin'' away."'
15186: 'Hideyoshi@r@v06/31100064."Right?@k @v06/31100065.Look.@k@v06/31100066. Squeeeeze."'
15187: 'Eva@r@v05/31000112."......*giggle*.@k@v05/31000113. That hurts.@k@v05/31000114. ...Thank you.@k@v05/31000115. I''m fine now...@k@v05/31000116. ...Let''s get off the boat."'
15188: 'Hideyoshi@r@v06/31100067."Yeah.@k@v06/31100068. Let''s get off the boat.@k@v06/31100069. Everyone''s waitin'' for us."'
15189: 'Eva@r@v05/31000117."...Umm, ..................I''m sorry."'
15190: 'Hideyoshi@r@v06/31100070."Hmm?"'
15191: 'Eva@r@v05/31000118."......I''m sorry...@v05/31000119....that I yelled at you...@v05/31000120....about the smoke from your cigarettes just now......"'
15192: 'Hideyoshi@r@v06/31100071."C''mon, you normally wouldn''t apologize for that sorta thing.@k@v06/31100072. ...You go all frail after you''ve had a bad dream.@k@v06/31100073. ...Don''t worry about it.@k@v06/31100074. I was wrong for not realizin'' that the smoke was affectin'' you."'
15193: 'Eva@r@v05/31000121."............Have you...started to hate me...?"'
15194: 'Hideyoshi@r@v06/31100075."No way, no way.@k@v06/31100076. Wahahahahahaha.@k@v06/31100077. If I hated you after somethin'' like that, we would''na lasted three days.@k@v06/31100078. C''mon, stand up, stand up.@k@v06/31100079. Off we go, off we go."'
15195: 'Gohda@r@v17/31700001."Hideyoshi-sama, Eva-sama.@k@v17/31700002. Is everything alright?@k @v17/31700003.Are you not feeling well?"'
15196: '@rThis time, Gohda had come.@k It looked like they had kept everyone waiting too long after all.'
15197: '@rEva also stood up without grumbling this time.@k ...She couldn''t keep on forcing her bad mood onto her husband and causing him more trouble.'
15198: '@r......Because that was not something a "good wife" would do.'
15199: 'Gohda@r@v17/31700004."Is everything alright?@k @v17/31700005.If you are worried about your health, shall I call Doctor Nanjo?"'
15200: 'Eva@r@v05/31000122."Thanks.@k@v05/31000123. I''m just a little anemic.@k@v05/31000124. I''m alright now."'
15201: 'Hideyoshi@r@v06/31100080."Just her hormones.@k@v06/31100081. Don''t worry about it.@k@v06/31100082. Wahhahahahahaha."'
15202: 'Eva@r@v05/31000125."For goodness'' sake...@k@v05/31000126. Don''t say stuff like that in front of people, it''s embarrassing."'
15203: 'Hideyoshi@r@v06/31100083."Ohhh, sorry, sorry."'
15204: '@rEva elbowed Hideyoshi in the gut.@k By that time, her normal expression had returned, which allowed Hideyoshi to relax a little.'
15205: '@rThe bright sunlight outside was almost enough to really make a person go giddy.'
15206: '@rA small plank was lowered to get off the boat, and Gohda was waiting there, smiling and ready to lend them a hand.'
15207: 'Gohda@r@v17/31700006."Please, Eva-sama.@k@v17/31700007. Your hand."'
15208: 'Eva@r@v05/31000127."Thank you."'
15209: 'Gohda@r@v17/31700008."Welcome to Rokkenjima."'
15210: '@r@v34/33300064.Welcome back.'
15211: 'Eva@r@v05/31000128."......Huh?"'
15212: '@rWhen she left the boat, .........it seemed to Eva as though she had heard the voice of her young self saying welcome back.'
15213: '@rNo, it hadn''t seemed that way.@k@r...Someone had said "welcome back" to her.'
15214: '@rAfter becoming a shameless adult,@w500. ...the voice of her young self was distant.'
15215: 'Eva@r@v05/31000129."What am I living for......?@k @v05/31000130.......What can I do...to release myself from this obsession......?"'
15216: '@rHideyoshi heard her talking to herself.'
15217: '@rHe drew Eva close to him by her shoulder, and just by his firmness, he communicated that there was no need to say anything more...'
15218: '@rMaybe it was because the typhoon was getting closer.@k The lively cries of the seagulls, which usually greeted them when they arrived, couldn''t be heard at all...'