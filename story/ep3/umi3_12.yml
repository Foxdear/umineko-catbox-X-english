18993: 'Jessica@r@v04/30200098."S-sorry, Auntie Rosa...@k@v04/30200099. We tried to calm her, but she just wouldn''t listen..."'
18994: 'Maria@r@v13/30400102."Uu-uu-uu!!@|@y@k @v13/30400103.Uu-uu-uu!!@|@y@k @v13/30400104.Waaaaaaaaaaaaaaaaahhh!!"@|@y'
18995: 'Rosa@r@v12/31400379."...What is it, Maria?@k@v12/31400380. Could you be a little more quiet?@k @v12/31400381.Everyone''s looking."'
