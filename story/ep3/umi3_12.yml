19102: '@rOnce again, Rosa tested the weight of her gun.'
19103: '@r......It''s alright.@k It''s only a farce.@k@rThere was never a murderer on this island in the first place...'
19104: 'Battler@r@v10/30101073."Damn it, wait, Auntie Rosa...!!@k @v10/30101074.Are Auntie Rosa and Maria......the sacrifices for the second twilight?!@k @v10/30101075.Damn it damn it damn it, someone, notice them, tell them to stop!!@k @v10/30101076.What are those guys in the living room and us kids doing?!!"'
19105: 'BEATRICE@r@v27/30701479."Hmm.@k@v27/30701480. They are being considerate of Rosa''s pitiful relationship with her daughter, and are forcibly changing the subject.@k@v27/30701481. The group you are in went upstairs, and are talking about something else while watching TV."'
19106: 'Battler@r@v10/30101077."Goddammit!!@|@y@k @v10/30101078.Someone, notice them!@k @v10/30101079.Who''s the closest, is it Uncle Hideyoshi?!@k @v10/30101080.Please, notice that those two are leaving through the front door, aaaaaaaaaaaaaahhh!!"'
19107: 'BEATRICE@r@v27/30701482."It won''t reach, it won''t reach, *cackle*!@k @v27/30701483.Don''t disturb their precious time together.@k@v27/30701484. Fuhahahahahahaha...!"'
19108: '@rHideyoshi kept talking kindly, his hand on Eva''s forehead.'
19109: '@rHe didn''t notice that Rosa and Maria were going outside through the front door at all.'
19110: '@rIn that case, there was no way that the others in the lobby, which was even further away, would notice either.@k And the cousins'' room upstairs was even worse...!'
19111: 'BEATRICE@r@v27/30701485."Why are you so panicked?@k@v27/30701486. On the first twilight, didn''t you defeat me with that bold move, saying that the culprit died in an accident on the first twilight?"'
19112: 'BEATRICE@r@v27/30701487."...Doesn''t that mean that there is no longer a culprit on this island...?@k @v27/30701488.*cackle*cackle*cackle*, what is there to be so worried about...?"'
19113: 'Battler@r@v10/30101081."Shut up, I can see right through you!!@k @|@y@v10/30101082.Someone stop them, those two''ll be killed!!@k @v10/30101083.Someone, stop theeeeeeeeeeeeeeem, aaaaaaaaaaaaaahhh!!"'
19114: '@r......There was no way that Battler''s voiceless scream would reach Rosa or Maria.'
19115: '@rThe two of them could be seen in the rose garden.'
19116: '@rThe rain was still awful, but fortunately, the wind had died down a little.'
19117: '@r......No, maybe that wasn''t fortunate.@k Because if the wind had been a little fiercer, Rosa would surely have hesitated to go outside...'
19118: 'Maria@r@v13/30400136."......Uu, uu, uu...@k@|@y@v13/30400137. ............Here it is...!"'
19119: '@rMaria found her own rose with the gold lace and stared at it lovingly.'
19120: '@rRosa had accepted with the promise that Maria would only have one look at it,@k but she didn''t want Maria to complain that it hadn''t been enough later on,@k so she decided to go along with her until she was satisfied.'
19121: '@r......She believed that there wasn''t a culprit,@k but if by any chance she was mistaken, they were now in an extremely dangerous position.'
19122: '@rRosa realized that faintly herself.'
19123: '@rIf things got bad, she would throw away her umbrella and ready her gun.@k@r...Keeping the innocently rejoicing Maria in the corner of her eye, Rosa gazed warily in all directions.'
19124: '@r....................................?@k@r......Were her eyes just tired?'
19125: '@rEven though no one should have been there, she thought she saw something glitter in the dark rose garden with all its wind and rain.'
19126: '@r...Gold-colored......?@k@rIt had to be her imagination.'
19127: '@rBecause, to Rosa, it seemed as though gold butterflies were dancing through the rose bushes...'
19128: 'Hideyoshi@r@v06/31100297."......Are you alright, Eva...?@k@v06/31100298. ...Just take it easy...and should I call Doctor Nanjo after all...?!"'
19129: 'Eva@r@v05/31000679."I...... ......I''m alright...@k@v05/31000680. ......Don''t take your hand away......@k@v05/31000681. ...I''m begging you, ......don''t take your hand away......"'
19130: '@rEva was breathing wildly.@k Beads of sweat were appearing on her forehead.'
19131: '@rIt certainly was true that she had stayed up all night last night, and that things had been rough since early this morning.@k@rIt wasn''t odd that her body wasn''t keeping up.'
19132: '@r......Even though he understood that,@k Hideyoshi suspected that Eva''s sudden fever was the sign of some serious illness.'
19133: '@rSeveral times, Hideyoshi suggested to call Doctor Nanjo, but Eva resisted firmly,@k ...pleading with him and saying that it was even more important that he didn''t take his hand away...'
19134: 'Hideyoshi@r@v06/31100299."I understand...@k@v06/31100300. But you''ve gotta have Doctor Nanjo look at you by lunchtime.@k@v06/31100301. If you can promise me that, I''ll stay here the whole time, grippin'' your hand.@k@v06/31100302. Tightly, like this."'
19135: 'Eva@r@v05/31000682."......Thank you...@k@v05/31000683. ......I''m fine...@k@v05/31000684. The magic of your hand......will definitely make this fever subside......"'
19136: '@rEven as she said that, Eva''s harsh breathing didn''t improve in the slightest.'
19137: 'Eva@r@v05/31000685."......Haah,@v05/31000686. ......haah,@v05/31000687. ......haahh...@k@v05/31000688. ......Don''t let go,@v05/31000689. ...don''t let go......@v05/31000690.haah,@v05/31000691. ......haahh,@k@v05/31000692. ............aaaaaaaaaaaaaaaaaaaaaahhhh!!"'
19138: 'Rosa@r@v12/31400406."Wh-............who''s there...?!"'
19139: '@rShe saw an umbrella moving from beyond the rose bush.'
19140: '@rRosa threw away her umbrella and wildly lifted her gun...'
19141: '@rWhen she did, the figure beyond the bush......showed itself.'
19142: 'Maria@r@v13/30400138.".........Uu?@k @v13/30400139.......Auntie Eva............@k@v13/30400140. .........?"'
19143: 'Rosa@r@v12/31400407."...You scared me.@k@v12/31400408. So it was you, Nee-san?@k @v12/31400409.............Do you have some business?@k @v12/31400410....Do you want to continue our earlier discussion?"'
19144: 'Eva@r@v05/33300171."..............................@k@|@y@v05/33300172. ...Yes, that''s right.@k@v05/33300173. Our discussion about Father''s gold."'
19145: 'Rosa@r@v12/31400411."......Please, restrain yourself in front of Maria.@k@v12/31400412. I''ve been keeping my promise, okay?@k @v12/31400413.I won''t get in the way of your scheming."'
19146: 'Eva@r@v05/33300174."...............Scheming?@k @v05/33300175.What''s that?"'
19147: 'Rosa@r@v12/31400414.".........Whatever you''re thinking, that''s up to you.@k@v12/31400415. I have no desire to get in the way.@k@v12/31400416. So please, not in front of Maria.@k@v12/31400417. As long as I get my share, that will be enough."'
19148: 'Eva@r@v05/33300176."Your share?@k @|@y@v05/33300177.Heheheheh, ahahahahahahahahahahahahahahahaha."'
19149: '@rEva started laughing in a creepy voice...@k@rRosa was startled, but Maria stared blankly.'
19150: '@r.........Then Maria said just one thing.'
19151: 'Maria@r@v13/30400141.".........Uu......?@k @v13/30400142.............Wait,@v13/30400143. ............who are you...?"'
19152: 'EVA@r@v34/33300178."Hahahahahaha, ahhahhahahahahahahahahahahahahahahaha!!@|@y@k @v34/33300179.Your shaaare?!@k @v34/33300180.Who would give that to you...?!@k @v34/33300181.All of that is mine!@k @v34/33300182.It all belongs to me, the Golden Witch, BEATRICE...!!!"'
19153: 'Eva@r@v05/31000693."UaaaAAAAAAAAaaaAaaaaaa—!!"@|@y'
19154: 'Hideyoshi@r@v06/31100303."Eva! Are you alright, Eva?!@|@y@k @v06/31100304.Eva!@k @v06/31100305.Eva!!"'
19155: 'Eva@r@v05/31000694."Hold on...!!@k @v05/31000695.Don''t let go!!@k @v05/31000696.So that I don''t get taken away by someone who isn''t me...!!@k @v05/31000697.Keep holding on to my hand...@k@v05/31000698. Don''t let goooooooooooooo...!!!"'
19156: 'EVA@r@v34/33300183."When did you ever work hard?!@k @v34/33300184.You never worked hard for anything!@k @v34/33300185.You were always hiding in our shadows!@k @v34/33300186.You always ran about from shadow to shadow without fighting,@k@v34/33300187. and yet, you really think yourself qualified to ask me for the Ushiromiya family gold...?!"'
19157: 'EVA@r@v34/33300188."All of that is mine!@k @v34/33300189.It''s all mine and mine alone, as the head of the Ushiromiya family and the new Golden Witch, successor to the name of BEATRICE!!"'
19158: 'Maria@r@v13/30400144.".........BEATRICE.@k@|@y@v13/30400145. ...............It''s BEATRICE!!@|@y@k @v13/30400146.Mama, BEATRICE!"'
19159: '@rFrolicking around, Maria jumped at her mother in ecstasy.@k@r...Rosa treated Maria coldheartedly and raised her gun high.'
19160: 'Rosa@r@v12/31400418."......Y-......you''re Nee-san, right......?@k @v12/31400419.......You are Nee-san, right......?"'
19161: 'EVA@r@v34/33300190."Wrong.@k@v34/33300191. ...I am no longer the one who was your sister."'
19162: 'Rosa@r@v12/31400420."Then who are you?!!@k @v12/31400421.Are you going to say that you''re BEATRICE?!@k @v12/31400422.That''s impossible!@k @v12/31400423.You died 19 years ago!!!"'
19163: 'Rosa@r@v12/31400424."Yes, you were definitely dead, after all, I clearly saw that your head was smashed.@k@v12/31400425. I can remember your insides flowing out like it was yesterday!@k @|@y@v12/31400426.How could you be alive and right here noooooooooow?!?!"@|@y'
19164: 'EVA@r@v34/33300192."The concept of death does not exist for a Golden Witch.@k@v34/33300193. The names of the Golden Witch and BEATRICE will be handed down for all eternity."'
19165: 'EVA@r@v34/33300194."Maybe the BEATRICE you knew met with death, but that name is mine now...!@k @v34/33300195.Therefore it is endless!@k @|@y@v34/33300196.The concept of death does not exist for BEATRICE!!"@|@y'
19166: 'Rosa@r@v12/31400428."......How pitiful, Nee-san...!"'
19167: '@r.........That gold has caused you to lose the distinction between fantasy and reality......'
19168: 'EVA@r@v34/33300197."I said I''m not your sister anymore.@k@v34/33300198. ......Well then, as the new BEATRICE, I have been tasked with my own resurrection ritual.@k@|@y@v34/33300199. .........Ronove!@k @v34/33300200.What should I do?!"'
19169: 'Ronove@r@v31/33100439."That is up to you.@k@v31/33100440. BEATRICE-sama, you already have the power to make whatever you think reality.@k@v31/33100441. You should grow used to it if you use it a little."'
19170: 'EVA@r@v34/33300201."......You worthless former sister.@k@v34/33300202. You should consider it an honor to have been selected as my first sacrifice as a witch.@k@v34/33300203. On the second twilight, I''ll tear apart the two who are close, with my own hands...!!"'
19171: '@rThe first thing the new BEATRICE wished,@k ......no, the first magic she tried to use, was to surpass the limitations given to humans.'
19172: '@r...In particular, gravity.'
19173: '@rShe wanted to become fully aware of her transformation into a witch by being released from those shackles.'
19174: '@rAs the witch and Rosa stayed as they were...'
19175: '@r......The ground retreated all by itself, into the distance below them.@k@rBy now, their feet were no longer attached to the ground.'
19176: '@rRosa finally realized that the ground hadn''t retreated into the distance below her,@k but that she and the witch had been sucked up into the rainy sky.'
19177: 'Rosa@r@v12/31400429."............huh...?@k @v12/31400430................Eeeek...?!"'
19178: 'EVA@r@v34/33300204."Wh-.........whoooooooooaaaa...... Awesome......!"'
19179: '@rTo humans, shackled by gravity, there is nothing more unnerving than not having their feet on solid earth.'
19180: '@r......However, to BEATRICE, who had learned the joy of being released from gravity as a new witch,@k it was enough to cause her whole body to shake with delight.'
19181: 'EVA@r@v34/33300205."......Hey, Rosa.@k@v34/33300206. Do you remember, long ago, when we were small, when we used to talk about what it''d be like to become witches and fly around the sky?@k @|@y@v34/33300207.......It''s come true, you know?@k @v34/33300208.I became a real witch and granted it for you."'
19182: 'Rosa@r@v12/31400431."S-............Stop it, .........wake me from this dream......"'
19183: 'EVA@r@v34/33300209."You said it.@k@v34/33300210. You said that you flew through the sky in your dream.@k@v34/33300211. And you also said that you hadn''t wanted to wake up.@k@|@y@v34/33300212. You were even mad at me for waking you, right?"'
19184: 'EVA@r@v34/33300213."......Don''t worry.@k@v34/33300214. You won''t wake up this time, alright?@k @|@y@v34/33300215.Heheheheheheheheheheheheh!!"'
19185: '@rCome, dance with me in the vast, rainy sky.'
19186: '@rDidn''t we wish together to fly like seagulls in the sky,@k and escape the cramped and boring island of Rokkenjima...?'
19187: '@rNow, I''ll make that dream a reality for you.'
19188: '@rThat is why I want to share this joy with you, and no one else...!'
19189: 'EVA@r@v34/33300216."Ahhahaha ahhahahahaha!!@k @v34/33300217.Isn''t this so fun, Rosa, isn''t this so fun?!!@|@y"'
19190: 'EVA@r@v34/33300218."Take a look, below you!@k @v34/33300219.Look at how small our mansion is.@k@v34/33300220. I wonder how much time we spent in a place that small.@k@v34/33300221. ...Now I''m especially shocked at how cramped and tiny it is."'
19191: 'EVA@r@v34/33300222."So feel.@k@v34/33300223. Enjoy.@k@v34/33300224. Rejoice...!@k @v34/33300225.That power we yearned for, the power to move through the sky at will!@k @|@y@v34/33300226.Come on, let''s dance, Rosa!@k @v34/33300227.Through the rain, through the wind!@k @v34/33300228.Let''s fly around like we''re dancing!@k @|@y@v34/33300229.The lightning will shine on us and bless us!!@k @|@y@v34/33300230.Ahhahahahahahahahahahahahahahahahahahaha!!"'
19192: '@rThe witch and Rosa were like leaves fluttering around in a whirlwind.@k@rAs the rain pounded upon every part of their bodies, as the lightning occasionally shone upon them, they shook with the joy of being released from the ground.'
19193: '@r...However, it was only that way for the witch.@k@rRosa was holding onto her head, voicelessly screaming over and over.'
19194: 'Rosa@r@v12/31400432."Stop iiiiiiiiiiiiiitt!!@|@y@k @v12/31400433.Please no moooooooore, let me doooooooown!!"'
19195: 'EVA@r@v34/33300231."......You''re right, it''s more fitting for Humans to crawl on the ground.@k@v34/33300232. Then why not go back there?"'
19196: '@rA slightly displeased expression rose to the witch''s face when she realized that her own joy was not being shared.@k And she decided to listen to her former sister''s request.'
19197: 'Rosa@r@v12/31400434."............?!@k @|@y@v12/31400435..........aaaaaaaaaaaaaaaAAAAAAAHHHHH!!"'
19198: '@rThe whirlwind that had been making Rosa dance around grew weaker, then stopped.'
19199: '@rIn other words, Rosa was once again bound by the restrictions of gravity, as a Human.'
19200: '@r......Following the laws that were originally correct, Rosa began to descend towards the ground upside-down.@k No, she began to fall.'
19201: 'EVA@r@v34/33300233."Oops...@k@|@y@v34/33300234. That''s right, if I don''t take her down the right way, this is what happens!"'
19202: '@rThe witch hadn''t intended to send Rosa plummeting.@k@rBut she still wasn''t used to using magic.'
19203: '@rAfter plummeting about 100 meters into a rose bush,@k as a very, very natural result, Rosa died instantly.'
19204: '@rBut the witch hadn''t intended to kill her.@k@rSo she willed for Rosa not to die.'
19205: '@rWhen she did, gold butterflies coiled about Rosa''s body, reviving that life just as the witch had wished.'
19206: '@rRosa''s body, which had laid out a radial carpet of fresh blood, rapidly returned to normal.'
19207: '@rThe broken and crushed bones returned to normal.'
19208: '@rThe torn and smashed flesh returned to normal.'
19209: '@r......How easy it is to break things in this world, and how difficult it is to fix them...'
19210: '@rAnyone can take a life.'
19211: '@rBut no Human can revive a lost life!@k By surpassing the irreversible, one proves that they have surpassed Humans.'
19212: '@r......This surely gave her a much, much greater realization that she was a witch than flying through the sky had.'
19213: 'EVA@r@v34/33300235.".........Awesome...@k@|@y@v34/33300236. I can even revive......an ended life......!"'
19214: 'Ronove@r@v31/33100442."Of course.@k@v31/33100443. BEATRICE-sama, you are already an Endless Witch."'
19215: 'Ronove@r@v31/33100444."......To live and to die.@k@v31/33100445. To bring to life and to kill, all of it repeated endlessly.@k@v31/33100446. BEATRICE-sama, as the Endless Witch, you are the queen who controls that cycle of life and death."'
19216: 'EVA@r@v34/33300237."Ahaha, aha.@k@v34/33300238. One time, I dropped a goldfish bowl.@k@v34/33300239. The fragile and beautiful bowl broke, and I couldn''t put it back together again.@k@v34/33300240. That cute pop-eyed goldfish would never swim for me again after it landed on the floor."'
19217: 'EVA@r@v34/33300241.".........No matter how much I cried, the servants shook their heads, saying that broken things and dead things could never be revived."'
19218: 'EVA@r@v34/33300242."...That''s when I learned, you know?@k@v34/33300243. You mustn''t break things, you mustn''t kill people.@k@|@y@v34/33300244. After all, you can''t fix them!!"'
19219: 'EVA@r@v34/33300245."So...if you could fix them...@v34/33300246....then you wouldn''t get in trouble for breaking them, right...?@k @v34/33300247.Haha, ahahahaha, .........awesome...@k@v34/33300248. Awesome, awesome, awesome...!!@k @|@y@v34/33300249.Ahhahahahahahahaahahahahahahaahhahahhahhahhahhaha!!"'
19220: '@rFor a while, the witch became intoxicated with how terrible and wonderful the power she had succeeded was.'
19221: '@rHer laugh was pure, innocent, and also cruel.'
19222: 'Rosa@r@v12/31400436.".........Uuuuuunnghh, ......au......"'
19223: '@rEven though Rosa had been revived, she let out a cry of anguish at the pain from her fall.@k The witch landed in front of her and held out her hand.'
19224: 'EVA@r@v34/33300250."Hahahahahahaha, sorry about that, Rosa.@k@v34/33300251. I didn''t think flying in the sky would be so much fun.@k@v34/33300252. Sorry, I''m really sorry."'
19225: 'EVA@r@v34/33300253."And I didn''t know that Humans could die so easily.@k@v34/33300254. But I''ve brought you back to life, so you''re fine now.@k@v34/33300255. So get up, okay?@k @v34/33300256.Play with me some more, okay?@k @|@y@v34/33300257. *giggle*giggle*, ehehehaahahahahahahahahahahahahahahahaha!!"@|@y'
19226: '@rWhat were those dreams you told me about when you were a kid...?@k Go ahead and tell me about all of them without holding back.'
19227: '@rAs I am now, I can make anything come true, no matter how absurd...!'
19228: '@rI can let you drown in a ocean of jelly!@k@rI can swallow you up in a mountain of cake!@k@rI can even make you grow butterfly wings and let you fly around the garden!'
19229: '@rI''ll do them one after another, let''s start with the ocean of jelly, okay...?!'
19230: 'Rosa@r@v12/31400437."S-stop,@v12/31400438.@|@y@w500. ...............urgg!!"'
19231: '@rRosa was once again thrown high into the rainy sky.@k However, the sky wasn''t filled with raindrops, but with drops of orange juice.'
19232: '@rWhen she looked down, Rosa had to doubt her eyes.@k The rose garden had disappeared, and the ground spread out beneath her was like a pastel-colored jigsaw puzzle.'
19233: '@r......It was from the dream she had talked about when she was young, an ocean of jelly.'
19234: '@rThe black part was coffee jelly.@k@|@y The red was strawberry,@k@|@y the yellow was pineapple,@k@|@y the green was melon.'
19235: '@rWhat was the white part, apple, perhaps...?'
19236: '@r.........Did Rosa even have the time to think something like that?'
19237: '@rRosa fell towards that multi-colored ocean.'
19238: '@r......And sank deep into a grape-flavored purple sea.'
19239: '@rIt really was an ocean of jelly.@k It had no bottom.'
19240: '@rAs Rosa sank, she was shocked to see a school of transparent fish swimming through the grape jelly ocean.'
19241: '@rThey were probably made of grape skin.'
19242: '@rThen she sank on and on, deeper and deeper, as deep as the Mariana Trench,@k ......compressed tight by the water pressure of the jelly ocean,@|@y as her ribs crushed and crunched, as her spine snapped and cracked.'
19243: '@r...In the end, she had become a small, frail meatball.'
19244: 'EVA@r@v34/33300258."Ahhahahahahahahahaha!@|@y@k @|@y@v34/33300259.What a truly wonderful experience, to drown to death in an ocean of jelly...!!@k @v34/33300260.It''s a dream no one else can imitate!!@k @v34/33300261.I granted it for you, ahhyahyahyahya!!"'
19245: '@rThe instant I snapped my fingers, the meatball that had been Rosa was launched up into the sky.'
19246: '@rAnd after being enveloped in a golden brilliance, she returned to her original form.'
19247: '@rIt was as simple and easy as returning dried seaweed to its original form, and anyone could do it.@k If they were a witch!'
19248: '@rThat vacant look on Rosa''s face...@khad to be because of the joy from having that dream she had given up on as a child made into reality.@k Definitely. Probably.'
19249: '@rNext is the mountain of cake.@k@rIn an instant, the sky was covered, and became patterned black and white like a chessboard.'
19250: '@rThat almost transparent white part was her favorite gelatin cheesecake.@k@rThe elegant black part was a slightly bitter gateau au chocolat.'
19251: '@rThey were a ceiling, they were a mountain, ......and those several billion cakes were thrown down towards Rosa.'
19252: '@rIf you piled those cakes up, they would surely be taller than Everest.'
19253: '@rSo they probably weighed...@k......I''m not too sure, but it was probably heavier than all the cakes across Japan put together.'
19254: '@rIt fell down like a ceiling and swallowed Rosa up,@w583. ......so as a very, very natural result, Rosa was crushed to death.'
19255: '@rIn less than a second,@k her bones broke throughout her body and her insides were all smashed and forced out,@|@y spladdasplutslop.'
19256: '@rAnd yet still an even greater number of cakes piled up on top,@k ...and Rosa ended up as a layer of jam wedged between the cakes.'
19257: '@rShe became as thin as a single hair, and was probably smashed out into the area of a tennis court.'
19258: '@rThat world swallowed up by cake was once again absorbed by a golden flash.'
19259: '@rThen, as though it had all been a dream, Rosa was revived once again.'
19260: '@r......Of course, it definitely wasn''t a dream.@k@rShe had been revived after dying.'
19261: '@rBy that point, death, which most Humans only have to experience once after they are born,@k had already been experienced repeatedly by Rosa.'
19262: '@rIn other words, she had gone through that which Humans cannot, the precious experience of dying more than once.'
19263: 'EVA@r@v34/33300262."Ahhahahahahahahaha, kyahhahhahahahahahahahahahahahahahaha!!@k @v34/33300263.Isn''t this fun, Rosa, isn''t this fun?!@k @v34/33300264.Next is the butterflies, look...!!"'
19264: 'Rosa@r@v12/31400439."P-please, have mercy...... .........aaaaaaaaaaaaaaaaahhh!!"'
19265: 'EVA@r@v34/33300265."No waaay!@k @v34/33300266.Let''s play more, let''s play more...!!@k @|@y@v34/33300267.Kyahihihihahahahahahahahahaha!!"'
19266: '@rLaughing innocently, she pointed her gold staff at Rosa as she begged for mercy.'
19267: '@rWhen she did, Rosa glittered gold and rapidly began to shrink.'
19268: '@rShe shrank down to the size of a real butterfly.@k Then, gold wings sprouted from her back...and she joined her fellow gold butterflies.'
19269: '@rHowever, while a human body could withstand this wind, it was a different matter for a butterfly''s body.'
19270: '@rThe gold butterfly Rosa was invited to dance by each gale of wind, and she spun in circles around the rose garden.'
19271: 'Rosa@r@v12/31400440."No, ...nooooooooOOOOOoooooOOOOooo!!@k @|@y@v12/31400441..........ah—"'
19272: '@rA gentle bed caught her as she tired from dancing.'
19273: '@rIt was a soft, knit hammock in the shadows beneath the roof of the arbor.'
19274: '@r...The owner of that hammock lumbered into view, welcoming its rare guest who had wandered in on this stormy night...'
19275: '@rThat owner, which should have been small enough to crush in the palm of your hand,@k now looked as big as the top of a canopy bed to Rosa.'
19276: 'Rosa@r@v12/31400442."Giiyaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa!!!"'
19277: 'EVA@r@v34/33300268."Kyahhahahakyahhahahahahaha!@|@y@k @v34/33300269.What a klutz, you got caught in a spider''s web!@k @v34/33300270.Ahhahaha, ahhahahahahaha!!"'
19278: 'EVA@r@v34/33300271."This time, it''s a dance with a spider.@k@v34/33300272. That takes me back, remember the times we''d find a spider''s web and play around by throwing pebbles at it?@k @v34/33300273.I''ve heard that spiders don''t chew their prey,@k@v34/33300274. but insert their venom, and when the insides melt into a sticky soup, they suck it out."'
19279: 'EVA@r@v34/33300275."......Hey, Rosa, remember?@k @v34/33300276.Remember how we''d throw butterflies into the spider''s web on purpose, and play around by seeing how the spider would attack?"'
19280: 'EVA@r@v34/33300277."Kyahhahahahahahaha,@|@y@v34/33300278. you don''t remember, do you? This happened before you got into grade school...!!@k @v34/33300279.You''ll be able to see it up close this time, you know!@k @v34/33300280.Very close.@k@|@y@v34/33300281. Kyahihihahahahahahakyaahahahahahahahahahahahahahaha!!"@|@y'
19281: 'Rosa@r@v12/31400443."Noooooooooooooooooooooooooooooooooooooooo,@v12/31400444. have mercy, Nee-san,@v12/31400445. help me, Nee-san!!@|@y」'
19282: 'Rosa@r@v12/31400446."Hiiiiiiiiiiiiiiii@|@y@v12/31400447.gaaaaaaaaaaaaaahhh@|@y@v12/31400448.gigyeeehhh@|@y@v12/31400449.gpgyaagh@|@y@v12/31400450.wagaghhggggg@|@y@v12/31400451.ergorblahgehmolgeeaarggaagagaga—@v12/31400452.ga—@v12/31400453....ga—@v12/31400454.......gyuboh!!"@|@y'
19283: 'BEATRICE@r@v27/30701489."This girl''s not bad. She truly can use magic at will!@k @|@y@v27/30701490.Hiihyahhahahahahakkuhihiehiehyahyahya!!"'
19284: 'BEATRICE@r@v27/30701491."Interesting interesting, interesting interesting!@k @v27/30701492.You feel like laughing too, right, Battleeeeeeer?!"'
19285: 'Battler@r@v10/30101084."Stop this bullshit!!!@|@y@k @v10/30101085.Just STOOOOOOP!!!@k @v10/30101086.What''s so fun, you''re insane, you''re insane!!@k @v10/30101087.What''s so fun about doing something like this?!?!"'
19286: 'BEATRICE@r@v27/30701493."Doesn''t she look like she''s having so much fun?@k@v27/30701494. I don''t blame her, magic is fun!!@k @v27/30701495.I remember, when I first became able to use magic, I played around so much!@k @v27/30701496....Yeess, I understand, I understand, I understand that play from the bottom of my heart!"'
19287: 'BEATRICE@r@v27/30701497."......I expect I won''t be able to share this joy and passion with you, Battler, aah, what a shame, what a shame!!@k @v27/30701498.If you accepted me, I''d teach you magic anytime you wanted, you know?!@k @v27/30701499.It''s hard to describe the joy you receive in the instant you are freed from the shackles of Humanity!"'
19288: 'BEATRICE@r@v27/30701500."I want to teach you about it, that joy, that passion!@k @v27/30701501.I definitely would like to see the world of magic you would give birth to, just once!@k @|@y@v27/30701502.Kihhihihihi, hhyahhyahaahhahahahahahaha!!"'
19289: 'BEATRICE@r@v27/30701503."You''re starting to enjoy yourself, right?@k @v27/30701504.You''ve started wanting to use magic, right?!@k @v27/30701505.It''s pretty fun to be a witch, you know?!@k @v27/30701506.Just for you, I''ll teach everything!@k @v27/30701507.About the joy of flying together in the sky, about the joy of diving together through the sea!"'
19290: 'BEATRICE@r@v27/30701508."I will teach you the excitement that you feel,@k@v27/30701509. in the instant you surpass the bounds of Humans and see how wide your world stretches!@k @v27/30701510.Wouldn''t that be fun,@v27/30701511.@|@y wahhyahhyahahhahahahahahahahahahaha!!"'
19291: '@rThere was no malice in Beato''s expression.'
19292: '@r...It was hard to believe, but she was genuinely enjoying this cruel show.'
19293: '@rAnd she thought she was sharing her appreciation with Battler.@k@r......Battler was aghast at that vastly...@khopelessly different measure of value.'
19294: 'Battler@r@v10/30101088."This is unbelievable... There''s definitely something screwed up with you!!@k @v10/30101089.Stop it already, goddammiiiiiiiiit!!@k @v10/30101090.VIRGILIA, make her stop this insane farce!!@k @v10/30101091.What do I have to do?!!"'
19295: 'VIRGILIA@r@v30/33200438.".........We exist outside the board.@k@v30/33200439. We cannot touch the board itself."'
19296: '@rVIRGILIA shook her head apologetically.@k@r...She was one who had already been "killed".@k@rDid that mean she couldn''t interfere in any way...?'
19297: '@rAs Beato continued to enjoy it in a crazed sort of way, Battler lifted her up by the collar and yelled at her.'
19298: 'Battler@r@v10/30101092."Stop it stop it stop iiiiiiiiiiiiiiiiit!!!@|@y@k @v10/30101093.That''s enough, you goddamn witch!!@k @v10/30101094.Are you trying to tell me that''s Auntie Eva?!"'
19299: 'Battler@r@v10/30101095."That''s impossible!!@|@y@k @v10/30101096.While the Auntie Eva I know may be a bit mean at times,@k@v10/30101097. it''s completely impossible that she''s the kind of person that would do something this cruel!!"'
19300: 'Battler@r@v10/30101098."This is all part of your deception!!@k @v10/30101099.Don''t toy with Auntie Rosa!!@k@v10/30101100. Don''t toy with Auntie Eva!!@k @v10/30101101.Stop this farce RIGHT NOOOOOOOOOOOOOOOOOW!!"'
19301: 'BEATRICE@r@v27/30701512."But I already said that it''s not me playing with Rosa anymore.@k@v27/30701513. I told you, that''s the new BEATRICE."'
19302: 'BEATRICE@r@v27/30701514."Is it really so cruel that you have to squeal like that?@k @v27/30701515.You''re also pretty fond of stuff like this, aren''t you?!@k @v27/30701516.You actually have just a bit of interest in magic and -@v27/30701517.@|@y...ouch.@|@y@k @v27/30701518.Wh-what was that—"'
19303: '@rFor the first time, Battler slapped Beato across the cheek.'
19304: '@r...Beato didn''t know why something like that would be done to her, and a stunned expression rose to her face.'
19305: '@rBattler found that expression even more unforgivable, and he roared.'
19306: 'Battler@r@v10/30101102."HUUUUUUH?!@|@y@k @v10/30101103.You call this interesting?!@k @v10/30101104.What the shit is wrong with your head?!!@k @v10/30101105.Go kill yourself!@|@y@k@|@y @v10/30101106.Slice the top of your head off and try looking inside, you''ll definitely find that the insides have been completely removed!!!"'
19307: 'Battler@r@v10/30101107."Make her stop it right now, make her stop this disgusting farce!!@k @v10/30101108.I''ll never forgive you!!@k @v10/30101109.How dare you do something so cruel!!@k @v10/30101110.I''ve sometimes thought that you''re a bit of a funny person, but I''ll never make that mistake again!"'
19308: 'Battler@r@v10/30101111."You''re just a monster who''s nothing but cruel!!!@k @v10/30101112.Don''t show yourself in front of me!!@k @v10/30101113.Never again!!@k @v10/30101114.I won''t accept you, I won''t talk with you, I don''t even want to look at your face!!"'
19309: 'Battler@r@v10/30101115."That get through to you?!!@k @v10/30101116.Don''t show yourself in front of me!!@k @v10/30101117.Just—FUCK—OOOOOOOOOOOOOOOOOOOOOOFF!!!"'
19310: '@rThe instant Battler screamed, the power that resisted the witch became a red wall which repelled Beato, knocking her back onto her butt.'
19311: 'BEATRICE@r@v27/30701519."......Owowowow...@k@v27/30701520. ...What are you talking about, isn''t it an interesting show...?"'
19312: '@rShe spoke as though making an excuse, but the person those words were directed at, Battler, was no longer there.@k His figure had suddenly disappeared into the darkness...'
19313: '@r...But Beato pouted her lips, and continued trying to explain herself.'
19314: 'BEATRICE@r@v27/30701521."......I-it''s not like I completely don''t see where you''re coming from,@k@v27/30701522. ...but this is nothing more than an innocent prank, right...?@k @v27/30701523.No matter how she kills, that person will be brought back to life in the end, right?@k@v27/30701524. ...Aren''t Humans creatures that are fine with anything as long as it ends well......?!"'
19315: 'BEATRICE@r@v27/30701525."R-right, Master?@k@v27/30701526. It''s not something to get so angry about...!"'
19316: '@rShe was hoping for approval, but VIRGILIA simply faced her with an indifferent expression.@k@r...To Beato, at that moment, even an exasperated face would probably have seemed better.'
19317: 'VIRGILIA@r@v30/33200440."............I have nothing in particular to say.@k@v30/33200441. If you think it is fun, you can keep watching as long as you want.@k@v30/33200442. ...Call me when it''s over.@k@v30/33200443. I will erase my form until then."'
19318: '@rFollowing Battler''s lead, VIRGILIA hid herself in the darkness...'
19319: '@rLeft sitting there on her own, Beato didn''t have a clue what was going on, and felt like she had been made out to be the bad guy.'
19320: 'BEATRICE@r@v27/30701527."..............................@k@v27/30701528. ......What''s so wronnng?@k@v27/30701529. It''s an interesting show, isn''t it...?!@k @v27/30701530.I-it might be a little vulgar, ......but it''s fairly interesting, isn''t it...?!!@k @v27/30701531.Right, Ronove...?!@k @v27/30701532.It''s nothing to get so mad about, right...?!"'
19321: 'Ronove@r@v31/33100447."Pu ku ku ku.@k@v31/33100448. ......Something interesting for you, Milady, is not necessarily interesting for Battler-sama."'
19322: 'BEATRICE@r@v27/30701533."Does he really...hate me that much?"'
19323: 'BEATRICE@r@v27/30701534."......Well, certainly, we are playing against each other, so it is true we are enemies,@k@v27/30701535. ...but is our relationship really so bad that we can''t laugh together at entertainment...?!@k @v27/30701536..........Since I applauded together with Battler, I thought I could at least laugh together with him...@k@v27/30701537. ......Does he really reject me so much that we can''t even do that...?"'
19324: 'BEATRICE@r@v27/30701538."...He doesn''t have to accept that I''m a witch.@k@v27/30701539. Because the point of the game is to compete over that.@k@|@y@v27/30701540. But still, saying he won''t look at my face, that he won''t talk to me,@k@v27/30701541. ......surely ignoring me is going too far...@k@v27/30701542. Am I really hated that muuuuuch......!"'
19325: 'Ronove@r@v31/33100449."The moves you have made thus far are certainly worthy of hatred, Milady.@k@v31/33100450. Even a demon such as myself can slightly understand Battler-sama''s feelings.@v31/33100451. ......I wonder if you cannot understand that because you are especially thickheaded, Milady?@k@|@y@v31/33100452. Pukkukukukuku."'
19326: 'BEATRICE@r@v27/30701543."Sh-shut up shut up shut up shut up!!@k @v27/30701544.Why don''t you disappear too?!!"'
19327: 'Ronove@r@v31/33100453."Yes, certainly.@k@v31/33100454. ......Then, if you would excuse me."'
19328: '@rEven Ronove hid himself in the darkness, and Beato was left alone.'
19329: '@rThe only one in the rainy rose garden.'
19330: '@rNo one will play with a lonely witch.'
19331: '@rBecause no one would play with her, she was a lonely witch.'
19332: 'BEATRICE@r@v27/30701545.".....................@k@v27/30701546. ......What''s going on?@k@v27/30701547. ...Why won''t anyone play with me...?@k@|@y@v27/30701548. .........Am I really that weird, that cruel...?@k@v27/30701549. ............Someone, answer meeeeeeeeee!!"'
19333: 'EVA@r@v34/33300282."Kyahhahahahahahaha, isn''t this fun, Rosa, isn''t this fun!@k@|@y@v34/33300283. Hey, how should we play next?@k @v34/33300284.Of course, I''ll play with Maria too, okay?"'
19334: 'EVA@r@v34/33300285."Let''s all have a friendly walk together!@k @v34/33300286.Let''s swim in a pot of boiling chocolate, let''s have a picnic in a cake-rising oven!@k @|@y@v34/33300287.Ahahaha, akyakyakyakyakyakya!!"'
19335: 'BEATRICE@r@v27/30701550.".........H-hey, new BEATRICE."'
19336: '@rBehind the witch who was continuing her spree of tragedy, Beato showed herself.'
19337: '@r...Her expression was very rare for her.@k It was kind of restrained, somehow unreliable, miserable.'
19338: 'EVA@r@v34/33300288."Oh, it''s the predecessor BEATRICE-sama.@k@v34/33300289. Were you watching?"'
19339: 'EVA@r@v34/33300290."The power of magic is truly wonderful!@k @v34/33300291.Until now, I had never thought it would be so fun to be reborn as a witch.@k@v34/33300292. It''s like playtime that never ends...!@k @v34/33300293.Come on, let''s play together, Predecessor-sama...!!"'
19340: 'EVA@r@v34/33300294."But first, wait for a second, okay?!@k @v34/33300295.The two of them were cooked to death in the oven, so I have to revive them again!"'
19341: 'EVA@r@v34/33300296."They''re like bread rising because of yeast!@k @v34/33300297.Like cookies expanding in an oven!@k @v34/33300298.*giggle*giggle*giggle*!!"@|@y'
19342: 'BEATRICE@r@v27/30701551."L-Listen to what I''m saying..."'
19343: 'BEATRICE@r@v27/30701552."......Umm, well.@k@v27/30701553. Isn''t that enough for the sacrifices of the second twilight?@k @v27/30701554....Of course, it isn''t specified how you kill them, but,@k@v27/30701555. umm,@k@v27/30701556. ......maybe you shouldn''t toy with them any more than that..."'
19344: 'EVA@r@v34/33300299."What are you saying, Predecessor-sama?@k@v34/33300300. I heard from Ronove a short while ago.@k @v34/33300301.That your magic was much, much more wonderful, cruel, and self-indulgent!"'
19345: 'EVA@r@v34/33300302."A Halloween party where candies poured out of six people''s stomachs, how truly wonderful!@k @v34/33300303.As for me, maybe I''ll act out Alice''s tea party...!@k @v34/33300304.I''ll invite everyone to a tea party to celebrate a happy unbirthday, and entertain them one by one with my magic!"'
19346: 'EVA@r@v34/33300305."I wonder if I can do it as wonderfully as you?@k @|@y@v34/33300306.I wonder if I can be cruel in my own pop, cute style?!"'
19347: 'EVA@r@v34/33300307."Now that I think about it, all fairy tales are cruel, aren''t they?@k @v34/33300308.Now that I''m a witch inside one of those fairy tales, I finally understand.@k@|@y@v34/33300309. Kyahhahahahakukyahyafuhyahahahahaha!!"'
19348: 'BEATRICE@r@v27/30701557."...............I, I am, umm,@v27/30701558. ...slightly of the opinion that, in the past,@v27/30701559. ...I, too, might have gone a little too far.@k@|@y@v27/30701560. ......Well, I think that as the Golden Witch, it''s a good idea to have a little elegance..."'
19349: 'EVA@r@v34/33300310."..................???@k @v34/33300311.I don''t understand what you''re saying, Predecessor-sama."'
19350: 'EVA@r@v34/33300312."But there''s one thing I do understand.@k@v34/33300313. No matter how hard I try now, I''m no match for how cruel you are.@k@v34/33300314. I''ve gotta try much, much harder.@k@v34/33300315. I''ve gotta become more cruel, and become an excellent Golden Witch...!"'
19351: 'BEATRICE@r@v27/30701561."L-like I said, you''ve already done enough here...!@k @v27/30701562.A-anyway, this is my order, as your predecessor.@k@v27/30701563. That''s enough for the second twilight.@k@|@y@v27/30701564. I''ll show you how it''s done.@k@v27/30701565. Stand back and watch..."'
19352: 'EVA@r@v34/33300316."Yes, Predecessor-sama.@k@v34/33300317. I can''t wait to see what brutal, cruel, and disgusting method of killing you''ll use."'
19353: '@rThe new witch pinched the sides of her skirt and gave a graceful bow,@k stepping back as an expectant gaze rose to her face.'
19354: '@r......She was expecting an even more cruel magic that surpassed even herself.'
19355: 'BEATRICE@r@v27/30701566."............Well, speaking of that...@k@v27/30701567. You''re only half a witch if you can only kill with methods like that.@k@v27/30701568. ...I shall show you an elegant way to kill, worthy of the Golden Witch..."'
19356: '@rWhen Beato waved her pipe, seven colors of smoke poured out, reviving Rosa and Maria.'
19357: '@r......Compared to how the new BEATRICE had done it a short while ago, it was slightly gentler.@k ...It was probably gentler than how Beato had done it herself up until now.'
19358: '@rRosa''s consciousness had already grown dim from the pain of so many repeated deaths.'
19359: '@r...But even so, she pleaded that her daughter be spared...'
19360: 'Rosa@r@v12/31400455."......Please......have mercy......@k@v12/31400456. ...Even......if it''s just Maria......have mercy......"'
19361: 'Maria@r@v13/30400147."Waaaaaaaaaaaaaaahhh, Mama, Mamaaaaaa!!"'
19362: 'BEATRICE@r@v27/30701569.".........Sorry.@k@v27/30701570. My disciple just, umm, ...acted without restraint for a bit.@k@|@y@v27/30701571. ...Umm,@v27/30701572. .........forgive me."'
19363: 'Maria@r@v13/30400148."B-BEATRICEEEEEEEEEEEEE!!@|@y@k @v13/30400149.Waaaaaaaaaahh, waaaaaaaaaaaaaaaaaaaaaaaaahh!!"'
19364: '@rWhen Maria realized it was the real BEATRICE, she jumped onto her.'
19365: 'Maria@r@v13/30400150."...You promised, right, Beato?!@k @v13/30400151.You promised that you would take me to the Golden Land, right?!@k @v13/30400152.There I can be friends with Mama, and everyone will laugh together...!@k @v13/30400153.You promised that you would take us there, right?!"'
19366: 'BEATRICE@r@v27/30701573.".........A-@v27/30701574....about that.@k@v27/30701575. ...I can no longer...@v27/30701576.keep that promise.@k@v27/30701577. .........Because someone appeared who could solve the riddle,@v27/30701578. ......I am no longer the Golden Witch BEATRICE."'
19367: 'BEATRICE@r@v27/30701579."......So, I''m sorry.@k@v27/30701580. ...I can no longer keep my promise with you......"'
19368: 'Maria@r@v13/30400154."Why...?@k @v13/30400155.Why...?@k @v13/30400156.Beato, you promised..."'
19369: 'BEATRICE@r@v27/30701581."......I''m sorry.@k@v27/30701582. ...I''m truly sorry...@k@v27/30701583. .........So at least, in apology for not being able to keep my promise..."'
19370: '@r............I''ll give you a truly quiet sleep,@k@rwhich will never be disrupted again...'
19371: '@rBeato embraced Maria with a loving expression...'
19372: '@rThen, .........softly, a red bruise appeared on Maria''s neck.@k@rIt was a very gentle bruise.'
19373: '@r...It grew redder and redder, ...and when it distinctly formed itself into the shape of a hand...'
19374: '@r......Maria''s neck tilted suddenly.@k@r...Peacefully, as though she had fallen asleep.'
19375: 'Rosa@r@v12/31400457."M-Maria......@k@|@y@v12/31400458. ...MariaaaAAaaaAAAAAaa!!"@|@y'
19376: 'BEATRICE@r@v27/30701584."......Sorry.@k@v27/30701585. ......I won''t apologize that you were the sacrifices for the second twilight.@k@v27/30701586. That is simply your fate."'
19377: 'BEATRICE@r@v27/30701587."However, I must apologize for the vulgar way in which you were offered as sacrifices...@k@v27/30701588. ......This is your final sleep.@k@v27/30701589. ...Never again will it be disturbed..."'
19378: '@rBeato softly, gently lifted her finger, as though touching the empty air in front of her nose.'
19379: '@r...When she did, a light breeze lifted up, making Rosa''s body dance lightly like a feather.'
19380: '@rThen, Rosa''s body floated lightly,@w500. ......and there was the garden fence, with its spear-shaped prongs.'
19381: '@rThe spear of the fence pierced Rosa''s medulla oblongata.'
19382: '@r......Benevolently, without toying with her, in a single blow.@k@rRosa''s life was snuffed out.'
19383: '@rCompared to the earlier innocent yet cruel events, her end was surprisingly tame.'
19384: '@r...It just looked like a doll shaped like Rosa was leaning against the fence.'
19385: '@r...But, she had passed away.'
19386: 'BEATRICE@r@v27/30701590.".........W-...well, that''s pretty much how you do it."'
19387: '@rBeato acted proud, but the new witch wore a blank expression, almost as though this was an anticlimax.@k And she was forthright with that opinion.'
19388: 'EVA@r@v34/33300318."It''s kinda plain...@k@v34/33300319. ......Very different from the person Ronove told me about."'
19389: 'BEATRICE@r@v27/30701591."...Well, um, ...you must use magic with dignity, you see...?@k @v27/30701592.If it''s too, umm, ...undignified, that isn''t very elegant..."'
19390: 'EVA@r@v34/33300320.".............................................@k@v34/33300321. ......But you can do wonderful things endlessly with this magic.@k@v34/33300322. ......How boring."'
19391: 'BEATRICE@r@v27/30701593."Now now! No complaining...!@k @v27/30701594.The path of a Golden Witch cannot be completed in a day.@k@v27/30701595. You are still incomplete until you finish the tenth twilight...@k@v27/30701596. For now, stay quiet and follow my instructions.@k@v27/30701597. ...Alright......?!"'
19392: 'EVA@r@v34/33300323."......................................."'
19393: 'BEATRICE@r@v27/30701598."Wh-what happened to your answer?@k@v27/30701599. Your answer...!"'
19394: 'EVA@r@v34/33300324."...........................@k@|@y@v34/33300325. ...............Fiiine."'
19395: 'BEATRICE@r@v27/30701600."...Better, much better.@k@v27/30701601. ......Well, there is still much to do for the resurrection ritual.@k@v27/30701602. You still have to kill five people...@k@v27/30701603. You should do it without toying with them too much, with beauty and dignity,@v27/30701604. ...and with at least a little decorum, alright...?"'
19396: 'BEATRICE@r@v27/30701605."What Ronove told you about how I did it, ......that was a bad example.@k@v27/30701606. You mustn''t use that as a model.@k@v27/30701607. Engrave that into your heart."'
19397: 'EVA@r@v34/33300326."............Yes, Predecessor-sama."'
19398: 'BEATRICE@r@v27/30701608."A good answer.@k@|@y@v27/30701609. ......Ronove, the Seven Stakes of Purgatory, arise...!"'
19399: 'Ronove@r@v31/33100455."......Yes, Milady.@k@v31/33100456. Ronove, right here."'
