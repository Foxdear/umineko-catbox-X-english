18997: 'George@r@v07/30300052."......I think she''s half asleep.@k@v07/30300053. She suddenly woke up, and started going on about how worried she was for that rose.@k@|@y@v07/30300054. .........Maria-chan, calm down.@k@v07/30300055. That was just a dream..."'
18998: 'Maria@r@v13/30400105."Uu-uu-uu-uu!!@k @v13/30400106.That was BEATRICE''s and my rooose!!@|@y@k @v13/30400107.So if I don''t take care of it, BEATRICE will get mad at meee!!@k @v13/30400108.It might be broken again!@k @v13/30400109.Uu-uu-uu!@k @v13/30400110.Uu-uu-uu-uu!!"@|@y'
18999: 'Rosa@r@v12/31400382."......Haah...!@k@v12/31400383. ...Listen, I''m telling you to quiet down a bit, alright?!?!"@|@y'
19000: '@rThe children were taken aback by the sudden rise in the tone of Rosa''s voice.'
19001: '@rBut Maria''s crying just grew louder, and her tantrum just grew fiercer.'
19002: 'Nanjo@r@v19/31900015."R-...Rosa-san.@k@v19/31900016. You mustn''t scold a child so bluntly without attending to what they say...@k@v19/31900017. ...In times like this, it is good to give them some warm milk or something."'
