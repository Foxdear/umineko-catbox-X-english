19006: 'Rosa@r@v12/31400384."Of course I do!!@|@y@k @v12/31400385.Yes, I''ll search for them now and make her take them!!"'
19007: '@rWithout hiding her displeasure, Rosa grabbed her handbag that she had placed on the sofa and fished around for the medicine.@k ......It seemed that she had brought some child-use sedatives for Maria''s tantrums.'
19008: '@rShe found it and tipped the bottle into her palm, but it seemed to be empty.@k@rIrritated, Rosa shook the bottle several times, but that didn''t change the fact that nothing was in there.'
19009: '@r...All the while, Maria''s crying was growing more and more intense...'
19010: '@rMeanwhile, Eva was lying in bed, covered by the bedding.'
19011: '@rHideyoshi returned from the washroom, folding a handkerchief soaked in water.'
19012: 'Hideyoshi@r@v06/31100245."......My, this is one nasty fever...@k@v06/31100246. ......I''m sure it''s the poisonous air at this family conference that got you...@k@|@y@v06/31100247. ......For now, you can forget all about the other relatives.@k@v06/31100248. ...Alright?"'
19013: '@rAs Hideyoshi spoke to her kindly, he set the soaked handkerchief gently on Eva''s burning forehead.'
19014: '@rEva rested her own hand on top of his.'
19015: 'Eva@r@v05/31000637.".........Your hand...@k@v05/31000638.feels wonderfully cool."'
19016: 'Hideyoshi@r@v06/31100249."If my hand feels wonderful, your fever must be pretty bad.@k@v06/31100250. No worries, the medicine will start workin'' soon.@k@v06/31100251. Plus, my hand is a magic hand.@k@v06/31100252. If I just put my hand up against your forehead like this, see,@k @v06/31100253.any fever will melt right away."'
19017: 'Eva@r@v05/31000639."You''re right.@k@v05/31000640. ......Your hand always makes my fevers fade..."'
19018: 'Hideyoshi@r@v06/31100254."Yep.@k@v06/31100254_1. No need for a doctor when you''ve got my hand.@k@v06/31100255. Don''t worry and close your eyes.@k@v06/31100256. ......The fever will fade right away thanks to my magic..."'
19019: 'Eva@r@v05/31000641."Yes, I know...@k@v05/31000642. ......I can feel your magic."'
19020: '@rHideyoshi was about to say "they call that the placebo effect", but he stopped.'
19021: '@r......If Eva said that she could feel magic from his hand, then that was alright for now...'
19022: 'Eva@r@v05/31000643."............I wonder if magic really exists."'
19023: 'Hideyoshi@r@v06/31100257."Yeah.@k@v06/31100258. Sure does.@k@v06/31100259. Only those who believe can tell, though.@k@v06/31100260. ...There''s actually a lot of magic like that out there in the world."'
19024: 'Eva@r@v05/31000644."...If magic is real, ......then I wonder if witches are real too."'
19025: 'Hideyoshi@r@v06/31100261."Oh?@k @v06/31100262.You mean that witch of the forest, BEATRICE?@k @v06/31100263.She probably does exist for those who believe.@k@v06/31100264. Just like God.@k@v06/31100265. Won''t show himself except in front of those who strongly believe."'
19026: 'Eva@r@v05/31000645."...............You know,@k @v05/31000646....long ago, I was able to use magic too."'
19027: 'Hideyoshi@r@v06/31100266."Oh?@k@v06/31100267. That so?@k@v06/31100268. Then you''ve been a witch once too."'
19028: 'Eva@r@v05/31000647."......You know, whenever I had a dream that I wanted to come true no matter what,@k@v05/31000648. if I wished strongly and tried hard, it came true every time.@k@v05/31000649. ......With my magic, my grades were always the best, and I even became the student council president, and got into the university I wanted by my own ability.@k@v05/31000650. ......Everything I wished for was granted."'
19029: 'Hideyoshi@r@v06/31100269."That''s right.@k@v06/31100270. Your magic was always a thing to be reckoned with...@k@v06/31100271. You''re definitely a witch.@k@v06/31100272. ...And you work harder than anyone.@k@v06/31100273. ......I know aaall about it."'
19030: 'Eva@r@v05/31000651."...............You know,@k@v05/31000652. ever since I was a kid, the whole time, there''s been another me inside myself, who always supported me.@k@v05/31000653. ...And that other self was a witch."'
19031: 'Eva@r@v05/31000654.".........I didn''t believe in BEATRICE, the witch of the forest.@k@v05/31000655. I always believed that if a witch of Rokkenjima did exist, it was the witch inside my heart.@k@v05/31000656. .........I am so grateful to that witch inside myself.@k@v05/31000657. ...I''m always so grateful......that she let me meet up with you..."'
19032: 'Hideyoshi@r@v06/31100274."............You''re always too timid when you get sick.@k@|@y@v06/31100275. ...Don''t say anythin'' for now.@k@v06/31100276. ......I''ll stay like this the whole time, until your fever has gone down, okay?"'
19033: 'Eva@r@v05/31000658."......Yeah.@k@v05/31000659. ......No matter what,@v05/31000660. ......don''t take your hand away.@k@v05/31000661. .........Somehow, I...@v05/31000662....feel like I''m becoming something that isn''t myself,@v05/31000663. ......and it''s been scaring me for a while now.@k@v05/31000664. ...I get the feeling that the witch inside of me...@v05/31000665....was provoked by BEATRICE, and is growing stronger and stronger.@k@v05/31000666. ...Somehow, it feels like she''s going to swallow me up."'
19034: 'Hideyoshi@r@v06/31100277."It''s alright.@k@v06/31100278. As long as I''m with you, there''s not a thiiing to be afraid of!@k @v06/31100279.Remember the time we went to that dangerous country and the whole bus was robbed?@k @v06/31100280.I repelled ''em!"'
19035: 'Eva@r@v05/31000667."...Honey, you just handed over your gold watch and begged them to go away.@k@v05/31000668. ......It was pretty lame, ...but it was cool..."'
19036: 'Eva@r@v05/31000669."............This hand...@k@v05/31000670. ...Please don''t move it away, no matter what...@k@v05/31000671. ......Not even if I fall asleep.@k@v05/31000672. ......And even if something creepy sneaks inside,@v05/31000673. ...protect me..."'
19037: 'Hideyoshi@r@v06/31100281."Yep, leave it to me.@k@v06/31100282. ......So stop worryin'' now and get some sleep.@k@v06/31100283. The medicine and my magic will start workin'' real soon..."'
19038: '@rEva finally calmed her heart and closed her eyes.'
19039: '@r......Just then, there was the sound of a door being opened violently from the direction of the lobby.'
