18973: 'Rosa@r@v12/31400367."...............I won''t say anything.@k@v12/31400368. I would never say something bad about you when you''re away."'
18974: 'Eva@r@v05/31000632."......................................."'
18975: 'Rosa@r@v12/31400369."......What is it?@k @v12/31400370.Nee-san, you''ve been acting strange for a while, you know?@k @v12/31400371.Shouldn''t you get a little rest now?"'
18976: 'Eva@r@v05/31000633."............You''re right.@k@v05/31000634. I started thinking about raising money by March and it made my headache even worse."'
18977: 'Rosa@r@v12/31400372."That isn''t good.@k@v12/31400373. Rest.@k@|@y@v12/31400374. ...I''ll restrain myself so that your headache doesn''t get worse.@k@v12/31400375. I''ve had a bad headache myself for a while now."'
