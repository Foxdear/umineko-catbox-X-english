18985: '@rIt was like the sound of someone stamping their feet in frustration.'
18986: '@rAnd not a moment later, in addition to the apparent sound of feet running out into the upstairs corridor,@k they could hear Maria calling "uu-uu-uu" over and over again, sounding displeased.'
18987: '@rRosa grabbed her head, ruffled up her hair, and voicelessly moaned in anguish...'
18988: '@rThe adults conscientiously turned their backs to her, pretending not to notice.'
