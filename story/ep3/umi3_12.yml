18979: 'Hideyoshi@r@v06/31100241."What''s up, Eva?@k@v06/31100242. Why so bent out of shape all of a sudden?@k@|@y@v06/31100243. ......Sorry ''bout this... Please let us rest a bit longer.@k@v06/31100244. Sorry... Sorry..."'
18980: '@rAfter putting his hands together as though praying and apologizing several times,@k Hideyoshi went after Eva, and left the lobby.'
18981: 'Krauss@r@v02/30800243."............I don''t like this atmosphere.@k@v02/30800244. Everything''s so strained."'
18982: 'Kyrie@r@v09/31300268."That''s no surprise.@k@v09/31300269. ......There was a murder early this morning.@k@v09/31300270. And since then, we''ve been eating canned food and holding guns.@k@v09/31300271. ...It''s natural that we would start to build up stress."'
18983: 'Rosa@r@v12/31400376."I wonder if the kids up there have also built up stress.@k@v12/31400377. ......I''m worried about Maria.@k@v12/31400378. She tends to get irritable in times like this."'
