22200: 'Belphegor@r@v41/32600080."Come on, let''s work.@k@v41/32600081. Don''t keep the guests waiting.@k@v41/32600082. Let''s work studiously and attend to them.@k@|@y@v41/32600083. Don''t let the guests do anything.@k@v41/32600084. Make them lazy, make them slothful, fatten them like pigs.@k@|@y@v41/32600085. Ahhahaha!"'
22201: 'VIRGILIA@r@v30/33200627."......BEATRICE.@k@v30/33200628. Battler-kun.@k@v30/33200629. This way."'
22202: '@rGrandfather and VIRGILIA were standing on the landing at the top of the staircase, beckoning us.'
22203: '@rBeato and I looked at each other quizzically, then climbed the stairs together.'
22204: '@rFrom the hall, it looked like a very high stage.'
22205: '@rA small table had been set up there, as well as a piece of parchment and an old-fashioned quill pen.'
22206: '@rI saw that strange magical characters and Japanese were written side by side.@k@r...And below it, many names were written.'
22207: '@rThere were 17 of them.@k ......Grandfather was the first, and everyone else''s names had been signed below in one long column.'
22208: '@rThe people who arrived at the Golden Land probably signed this one after another.'
22209: 'Kinzo@r@v01/31500126."Battler.@k@v01/31500127. Now that you are here, everyone is gathered.@k@v01/31500128. Listen carefully."'
22210: 'VIRGILIA@r@v30/33200630."The Golden Land is not a world supported by the power of magic alone.@k@v30/33200631. The cooperation and approval of all humans who receive happiness here is required.@k@v30/33200632. For that sake, we must gather the signatures of everyone here."'
22211: 'Kinzo@r@v01/31500129."Last time,@k@v01/31500130. the door to the Golden Land was finally opened, but you refused to sign.@k@v01/31500131. ......Although you probably don''t remember it.@k@v01/31500132. Because you refused to sign, this world was once again sealed in darkness."'
22212: 'Battler@r@v10/30101798."......Just hearing it like that, ...it kinda sounds like I''ve been the only stubborn one,@k@v10/30101799. and I''ve been causing everyone all kinds of trouble..."'
22213: 'BEATRICE@r@v27/30702273."That is because you are a certified hardhead.@k@v27/30702274. It seems that you inherited more than just blood from Kinzo."'
22214: '@rBeato laughed amiably.@k I knew I was being made fun of, but that smile led me to go along with her, and I laughed without thinking.'
22215: 'BEATRICE@r@v27/30702275."Magic is a miracle.@k@v27/30702276. ......Miracles cannot be completed unless everyone believes.@k@v27/30702277. ......And when you do, as the last to do so, this miracle—the Golden Land—will be completed."'
