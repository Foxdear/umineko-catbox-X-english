22117: '@r...Even though it was a pitch-black world where nothing could be seen,@k ......for some reason, I felt Beato''s presence right next to me.'
22118: '@r......So I tried calling out to her.@k@r...You can exchange words with someone whether they''re a human or a witch.'
22119: '@r......So even in a world where witches have been denied......I should be allowed to talk to her...'
22120: 'Battler@r@v10/30101765."...............Beato......"'
22121: 'BEATRICE@r@v27/30702255."......Battler, is it...@k@v27/30702256. ...............It is done.@k@v27/30702257. ......I...did it."'
22122: 'Battler@r@v10/30101766."...Yeah.@k@v10/30101767. ......I didn''t hear it,@v10/30101768. .........but I watched you...until the very end...@k@v10/30101769. I was watching......as you boldly stood up to that evil witch..."'
22123: 'BEATRICE@r@v27/30702258.".........With this, ...I am no longer a witch.@k@v27/30702259. ............But, I will definitely...become a witch again...@k@v27/30702260. ......And...@v27/30702261....I will make it so that I can be called the Golden Witch again,@k@v27/30702262. .........and then,@v27/30702263. ......when I am ready to be accepted as your opponent,@v27/30702264. .........I will return once more......"'
22124: 'Battler@r@v10/30101770."No.@k@v10/30101771. .........You...were a witch."'
22125: 'BEATRICE@r@v27/30702265."...............Huh......?"'
22126: 'Battler@r@v10/30101772."...I...was watching.@k@v10/30101773. .........When you took that evil witch,@k@v10/30101774. ......and blew her away with that awesome magic, exposing her true form,@v10/30101775. ...I was watching with my own eyes..."'
22127: 'BEATRICE@r@v27/30702266."Th-...that wasn''t magic,@v27/30702267. ......but the red—"'
22128: 'Battler@r@v10/30101776."No, it was magic.@k@v10/30101777. .........You were definitely...the Golden Witch.@k@v10/30101778. .........Even if you deny it yourself,@k@v10/30101779. .........I''ll accept it.@k@v10/30101780. ............''You are definitely...@v10/30101781.the Golden Witch''."'
22129: '@r.........When Battler said those words...'
22130: '@rIn the world that had been dark, ...there was suddenly a single grain.'
22131: '@r...A small grain of gold, like a wheat seed, shone brightly.@k@r...Even though it was small, it had a strong, gold-colored glow.'
22132: '@rAnd......it illuminated the two of them, sitting with their backs together...'
22133: '@rSo they each became aware of their own form.'
22134: '@r...They did not exist only as consciousness.'
22135: '@r......They became aware that they had bodies, and definitely existed.'
22136: '@r...No, maybe we should say that they each had been given an existence called a body.'
22137: '@rWhen Battler looked at his own form, he wasn''t that surprised.'
22138: '@r...But when Beato looked at her own form, she was a little startled.'
22139: '@r......From Battler''s perspective, she looked just like normal,@k ......but for a short while, she was surprised by that form...'
22140: 'BEATRICE@r@v27/30702268.".........What............@k@v27/30702269.......is going on.........?"'
22141: 'Battler@r@v10/30101782."The glow from that grain of light......is getting stronger and stronger..."'
22142: '@rThat grain of wheat was no longer simply gold-colored, but was like the light of the sun.'
22143: '@rThen, it softly.........began to approach Beato''s chest.'
22144: '@rWhen that grain of the sun......was sucked inside her chest...'
22145: '@r......the world became wrapped in a deep blue sky, and then a deep blue ocean spread out below them.'
22146: '@rAn island rose up, trees sprouted and created a forest, walls surrounded us and a ceiling swallowed us.'
22147: '@rAnd it became adorned with more and more things,@w416. ......until we realized that this was the hall in the Ushiromiya mansion.'
22148: '@rIn that fantastical hall where many gold butterflies beat their wings,@k ...many tables were set up with white tablecloths, like it was a party,@k and beautiful cooking and fruits were set out.'
22149: '@r...And over there......were a great many figures.@k@rEveryone was there, talking together and smiling.'
22150: 'Battler@r@v10/30101783."G-............guys........."'
22151: '@rThere was Dad and Kyrie-san, Uncle Krauss, Aunt Natsuhi and Auntie Rosa, and of course, even Auntie Eva and Uncle Hideyoshi.'
22152: '@r......George-aniki, Jessica, Maria, ...wait, wait, even Shannon-chan, Kanon-kun, Gohda-san and Kumasawa-san are here.'
22153: '@rEveryone, everyone was at the party, clapping their hands and celebrating our return...'
22154: 'Battler@r@v10/30101784."Wh-...why...?@k@v10/30101785. Everyone was dead...!@k @v10/30101786.Why are they alive...?!"'
22155: 'VIRGILIA@r@v30/33200623."......In the Golden Land, all the dead people''s souls can be revived.@k@v30/33200624. ......Welcome back, BEATRICE.@k@|@y@v30/33200625. And welcome, Battler-kun.@k@v30/33200626. Welcome to the Golden Land."'
22156: 'BEATRICE@r@v27/30702270."............I...made it?@k@v27/30702271. ...I made it...@v27/30702272.to the door of the Golden Land?"'
22157: 'Ronove@r@v31/33100655."Yes.@k@v31/33100656. ......Milady, you have finally been able to invite everyone to the Golden Land.@k@v31/33100657. ...Welcome, Battler-sama, to the Golden Land."'
22158: 'Kinzo@r@v01/31500121."Battler.@k@v01/31500122. .........So, you have finally made it this far."'
