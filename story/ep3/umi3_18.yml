22217: 'VIRGILIA@r@v30/33200633."First, sign here.@k@v30/33200634. Then, BEATRICE, sign here."'
22218: 'Battler@r@v10/30101802."......It''s hard to use a quill pen.@k@|@y@v10/30101803. ...Whoa, it shot."'
22219: 'BEATRICE@r@v27/30702278."You klutz.@k@v27/30702279. Shooting ink is a bad omen.@k@v27/30702280. Can''t you at least write your name quickly?@k@v27/30702281. In that illegible scrawl.@k@v27/30702282. *cackle*cackle*cackle*cackle*...!"'
22220: 'Battler@r@v10/30101804."And what about you...!@k @v10/30101805.Don''t write it in capitals like that!@k @v10/30101806.BEATRICE is a stylish name, so write it in cursive!@k @v10/30101807.You''re making the quill and your name cry!"'
