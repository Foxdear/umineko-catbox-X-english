22222: 'Kinzo@r@v01/31500133."This is a solemn ceremony. Be silent."'
22223: 'VIRGILIA@r@v30/33200635."Very good.@k@v30/33200636. We have gathered the two signatures, as well as the form for the covenant.@k@v30/33200637. ......Both of you, your oath please.@k@v30/33200638. We''ll start with BEATRICE.@k@v30/33200639. Put your hand on the covenant, and take the oath."'
