22169: 'George@r@v07/30300196."......I''m still suspecting that this might be a dream...@k@v07/30300197. I''m sure that we died.@k@|@y@v07/30300198. ......But, ...we''re alive.@k@v07/30300199. And everyone, every one of us is here, ......and we''re all happy.@k@v07/30300200. ...I can''t believe it."'
22170: 'Eva@r@v05/31000951."That''s right, this place must be a dream worrld!@k @v05/31000952.So it doesn''t matter that George is so friendly with a maid girl, it has to be a dreeeam!@k @|@y@v05/31000953.Waaaaaah!"'
22171: 'Hideyoshi@r@v06/31100414."Give it a rest, Eva.@k@v06/31100415. For now, you gotta stay quiet and bless the two young ''uns.@k@|@y@v06/31100416. The Golden Land is a capital of bliss.@k@v06/31100417. We should never quarrel here...!"'
22172: 'Mammon@r@v42/32700025."Here, any people are free to love each other.@k@v42/32700026. ...No one needs to hesitate over it."'
22173: 'Asmodeus@r@v44/32900030."Jessica-chan, Kanon-kun, so wonderfuul!@k @v44/32900031.I''m so jealouuus!"'
22174: 'Jessica@r@v04/30200282."......H-hey, Battler...@k@v04/30200283. This is kinda, umm, wahahahaha..."'
22175: 'Kanon@r@v16/30600172."Battler-sama, welcome.@k@v16/30600173. And welcome home..."'
