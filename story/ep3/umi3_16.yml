20696: '@rThe guesthouse lobby had been engulfed by silence.'
20697: '@rThe strings of tension which bound Krauss, Natsuhi, and Eva had already loosened; they were completely tired; and their consciousness was beginning to waver.'
20698: '@rEvery once in a while, they would stand up and walk around pointlessly, fighting their drowsiness.'
20699: 'Natsuhi@r@v03/30900158.".........Are you alright, Eva-san?@k@v03/30900159. ...Please, do take it easy and rest."'
20700: 'Eva@r@v05/31000824."I told you, I''m fine......@k@v05/31000825. ...The three of us are now the only adults...@k@v05/31000826. There''s no time to rest...@k@v05/31000827. I''ll guard this place even if I have to go through hell and high water......@k@v05/31000828. ......haah......haah......"'
20701: '@rShe spoke a brave line, but she couldn''t hide her rough breathing.@k@r...It seemed that the fever, which had been calmed with medicine for a time, had returned.'
20702: '@rIt was very obvious that Eva''s condition was not good.'
20703: 'Krauss@r@v02/30800286."Don''t push yourself.@k@v02/30800287. At least close your eyes.@k@v02/30800288. If we have to wake you, we definitely will."'
20704: 'Eva@r@v05/31000829."I''m telling you that I''m fine...!@k @v05/31000830.Leave me alone......!!"'
20705: 'Natsuhi@r@v03/30900160.".............................."'
20706: '@rIt seemed that she had now become stubborn.@k ......Krauss and Natsuhi realized that no matter what else they said to her, in her current state, it wouldn''t reach her ears.'
20707: '@rSo they decided to say nothing more, and to let her be.'
20708: '@rTo Eva right now, even an argument like that was putting a burden on her.@k@rIt would probably be better for her if she just sat there with her mouth closed.'
20709: '@rAs a matter of fact, Eva was already on the point of succumbing to her drowsiness.@k ...She might have talked back with a temper because she was trying to encourage herself and throw off her sleepiness.'
20710: '@rThe clock would very soon be pointing to six in the afternoon.'
20711: '@rBecause she had been snacking over and over again to fool her drowsiness, she didn''t feel hungry,@k but instead, her lack of sleep made it feel like it was six in the morning rather than the afternoon.'
20712: '@r......Even supposing that the boat would come at precisely nine in the morning tomorrow,@k ......there were still more than twelve full hours to go.'
20713: '@r...That was a dizzyingly long stretch of time.'
20714: '@r............Long.@k .........Painful......@k ......Hot...'
20715: '@rEven the sound of the clock torments my body now.'
20716: '@rIn times like this, ......he would put his hand on my forehead, and the fever would always fade at once.'
20717: '@r...But he isn''t here anymore.........'
20718: '@rAs Eva''s mind grew foggy, she was once again gripped by a deep sadness...'
20719: '@rShe had already cried herself dry.@k@rEven so, the sadness from losing her beloved husband had not been exhausted...'
20720: 'Eva@r@v05/31000831."...............I...@v05/31000832....was wrong..."'
20721: 'EVA@r@v34/33300677."...Why?"'
20722: '@rOriginally, the new witch had been the same being as Eva.@k@r...If Eva talked to her, she would always respond...'
20723: 'Eva@r@v05/31000833."......If I could only gain the position of family head, ...that was always enough.@k@v05/31000834. ......But as soon as I saw that mountain of gold, my greed grew.@k@v05/31000835. ............I was struck with a desire to have that mountain of gold all to myself......"'
20724: 'EVA@r@v34/33300678."That''s nothing to be embarrassed about.@k@|@y@v34/33300679. After all, it''s your natural right as the Ushiromiya family head.@k@v34/33300680. How could you give up even a bit of it to anyone else?"'
20725: 'Eva@r@v05/31000836."............I was gripped by that temptation, ...which is why you were born.@k@v05/31000837. ......While you are the heart of my young self,@k@v05/31000838. ......at the same time, you are also my self-centered evil heart."'
20726: 'Eva@r@v05/31000839."......It''s my foolish greed, which sprouted thanks to that mountain of gold,@k@v05/31000840. ......that allowed you to break out of the shell of my heart, ...and be born into this world...@k@v05/31000841. .........I''m to blame for giving birth to you......!"'
20727: 'EVA@r@v34/33300681."In that case, when I killed Rosa and Maria,@k@v34/33300682. and then Rudolf, Kyrie and Hideyoshi, you were to blame for that too."'
20728: 'Eva@r@v05/31000842."Why did you kill my husband too...?!@k @v05/31000843.Why......?!!@k @v05/31000844.Uuuuuhghuuhuhhuu!!"'
20729: 'EVA@r@v34/33300683."...I didn''t want to kill Hideyoshi.@k@v34/33300684. He was just so annoying and persistent.@k@|@y@v34/33300685. ...And that''s our, no, your fault.@k@v34/33300686. It''s your fault for choosing a husband like that."'
20730: 'Eva@r@v05/31000845."A child like you can''t possibly understand how good he was!!@k @v05/31000846.Uuuughhhhuuuhuuuuuughh...honey.........uuuuuuuhhuhghhhhuuhuuhuu!"'
20731: 'EVA@r@v34/33300687.".........Come on.@k@v34/33300688. Our dreams were made real with magic, right?@k @v34/33300689.We solved the riddle of the epitaph.@k@v34/33300690. And we found the gold and got the Head''s Ring.@k@v34/33300691. All of our dreams came fully true, right?@k @v34/33300692.What more could you want...?"'
20732: 'Eva@r@v05/31000847."Those weren''t the only dreams I had...!!@k @v05/31000848.Living a wonderful life with that man, and entrusting George with an excellent life...!@k @v05/31000849.I still have so many dreams that I need to fulfil, ...as a wife, as a mother...!!@k @v05/31000850.And yet, ......and yet......!"'
20733: 'EVA@r@v34/33300693."...Those are just extra dreams you gained after becoming an adult.@k@v34/33300694. They aren''t our dreams."'
20734: 'Eva@r@v05/31000851."And that is why you''re a child...!!@k @v05/31000852.It only matters that you get what you want?!@k @v05/31000853.......That''s right, all of this is my fault...!!@k @v05/31000854.Back then, why did I resist doing what Rosa told me to?@k @v05/31000855.Why couldn''t I announce to all of the siblings that I had found the gold...?"'
20735: 'Eva@r@v05/31000856."......It''s all because of the ugliness in my heart!!@k @v05/31000857.My evil heart, which sprouted out of a desire to have all of the gold all to myself, ......caused you to hatch!!"'
20736: 'EVA@r@v34/33300695.".........I don''t see why I deserve that much hate.@k@v34/33300696. Even though the both of us together make up Ushiromiya Eva."'
20737: 'Eva@r@v05/31000858."No, that isn''t true anymore.@k@v05/31000859. And it was you who said it.@k@v05/31000860. I am Ushiromiya Eva.@k@v05/31000861. And you are the Golden Witch, BEATRICE...!!"'
20738: 'Eva@r@v05/31000862."So just disappear already!@k @v05/31000863.Witches are a delusion, a fantasy that can only exist in fairy tales...!!@k @v05/31000864.Just DISAPPEAR!@k @v05/31000865.Don''t ever show yourself to me again!!"'
20739: 'EVA@r@v34/33300697."...Oh, ......so that''s how it is.@k@v34/33300698. ...Alright.@k@v34/33300699. I''ll disappear from your sight."'
20740: 'EVA@r@v34/33300700."...And I am no longer Ushiromiya Eva.@k@v34/33300701. From now on, I''m the Golden Witch BEATRICE.@k@v34/33300702. ...So now I will play however I want."'
20741: 'EVA@r@v34/33300703."I''m done caring about you.@k@v34/33300704. Why don''t you just give up and die forever?!"'
20742: '@rAfter having a fittingly childlike tantrum, the witch who had once been another Eva vanished.'
20743: '@r......Only Eva was left behind in the darkness.@k@rAnd she questioned herself...'
20744: 'Eva@r@v05/31000866."Was it me......?@k @v05/31000867.I......killed them......?@k @v05/31000868.Did I kill...that person......?@k @v05/31000869.......Did I......kill...him............?"'
20745: '@rNow, that question was one she herself would never answer......'
20746: 'Eva@r@v05/31000870."...g... *cough*cough*cough*!!@|@y@k @v05/31000871.*cough*cough*cough*!!"@|@y'
20747: '@rIt seemed that, half-asleep, she had gotten some saliva caught in her windpipe just as she was dozing off.@k ...Eva suddenly started coughing.'
20748: 'Krauss@r@v02/30800289."Are you alright, Eva?@k@|@y@v02/30800290. ...Natsuhi, some water, please."'
20749: 'Natsuhi@r@v03/30900161."Y-yes..."'
20750: 'Eva@r@v05/31000872."I, ......I''m alright, okay...@k@v05/31000873. *cough*cough*cough*!@|@y@k @v05/31000874.*cooough*cough*!!@|@y@k @v05/31000875.I just...choked a bit, that''s all......!@k @v05/31000876.*cough*cough*cough*!"@|@y'
20751: '@rEva pushed away Natsuhi''s hand as she tried to rub her back, and unsteadily rose to her feet.'
20752: 'Eva@r@v05/31000877.".........I''m going to wash my face.@k@v05/31000878. ...Sorry, I fell asleep.@k@v05/31000879. ......When I get back, I''ll make some more coffee.@k@|@y@v05/31000880. .........Extra strong, so that we won''t get drowsy until tomorrow morning."'
20753: 'Krauss@r@v02/30800291."Mm, please do.@k@v02/30800292. ......Your coffee fits my tastes more than the one Gohda makes."'
20754: 'Eva@r@v05/31000881."I''m pleased to hear that, even if you''re just flattering me...@k@|@y@v05/31000882. *cough*cough*!@|@y@k @v05/31000883..........I''ll be back soon."'
20755: '@rEva exited the lobby, heading for the lavatory.@k@rKrauss and Natsuhi watched over her frail back...'
20756: 'Natsuhi@r@v03/30900162."......So you do sometimes care for Eva-san, even though you have always been so much at odds with her."'
20757: 'Krauss@r@v02/30800293."........................@k@v02/30800294. ...Properly speaking, isn''t this what an older brother should do...?"'
20758: 'Natsuhi@r@v03/30900163."......Yes.@k@v03/30900164. I believe it is."'
20759: 'Krauss@r@v02/30800295."Not just Eva.@k@v02/30800296. ......Rudolf, and Rosa too.@k@v02/30800297. ...The only ways in which I have acted like an older brother to them are to speak arrogantly and bully them."'
20760: 'Krauss@r@v02/30800298.".........In my own way, I was frantic in my desire to be like my father.@k@v02/30800299. ...But I could never match up, and I always vented my feelings on them...@k@v02/30800300. However, that is no excuse."'
20761: 'Krauss@r@v02/30800301."...I probably scarred Eva so deep that it still has not healed.@k@v02/30800302. ......I regret it, but even if I apologized after all this time, that would not heal those wounds..."'
20762: 'Natsuhi@r@v03/30900165.".........If you hold on to that emotion, and continue to hold onto it,@k@v03/30900166. ...I''m sure that feeling will come through to your siblings."'
20763: 'Krauss@r@v02/30800303."......At this point, my only sibling left is Eva."'
20764: 'Natsuhi@r@v03/30900167."...............If only...the family you and your siblings were born into had not been the Ushiromiya family......@k@v03/30900168.......you might have had a more normal, a more fun sibling relationship..."'
20765: 'Krauss@r@v02/30800304."...You mustn''t say that...@k@v02/30800305. .........Eva will probably continue to hate me for her whole life.@k@v02/30800306. And she has the right to.@k@|@y@v02/30800307. ...I intend to resign myself to that and accept it."'
20766: 'Natsuhi@r@v03/30900169.".....................Dear......"'
20767: 'Krauss@r@v02/30800308."......Eva,@v02/30800309. .........I am sorry.@k@v02/30800310. ......Of course, you don''t have to forgive me..."'
20768: 'EVA@r@v34/33300705.Of course I won''t. Bit late, don''t you think?'
20769: 'EVA@r@v34/33300706."If you know you''re in the wrong, why don''t you just give up and die right now and forever?!@k @|@y@v34/33300707.Do it, Chiester Sisters!!"'
20770: 'Chiester45@r@v35/33400025."45, firing permission received.@k@v35/33400026. Reconfirming firing curve, correcting for weather.@k@v35/33400027. Data link to 410."'
20771: 'Chiester410@r@v36/33500039."410, data received, firing permission confirmed.@k@v36/33500040. Nihihihihi, firing!"'
20772: '@rTogether, the sisters released the readied magic bowstring.@k A beautiful tail trailed the golden arrow, and it drew a beautiful curve as it flew.'
20773: '@rIt was just like a golden snake.'
20774: '@rIt skillfully avoided a grove of trees and flew towards the front door of the guesthouse.'
20775: '@rThen it flew into the keyhole of the door and snuck into the guesthouse without any problem at all.'
20776: '@rThe gold snake raced down the hall smoothly, yet as fast as an arrow.'
20777: '@rRight in front of it was the door to the lobby.'
20778: '@rIt would only need to fly into that keyhole, and Krauss and Natsuhi would be right there...'
20779: '@rFor an instant, Krauss thought he saw the door''s keyhole sparkle gold.'
20780: '@rHowever, at the same time he strained his eyes to see what it was, that sparkle bent like a whip and attacked,@k wrapping itself around Krauss''s neck.'
20781: 'Krauss@r@v02/30800311."...............ack.........ahkh—khk—"'
20782: '@rJust looking at it, the gold snake looked very supple.@k However, it was as though a wire had tightened around Krauss''s neck.'
20783: '@rAnd while that snake choked Krauss, it extended even more, and also tightened around Natsuhi''s neck.'
20784: '@rWithout even the chance to scream, their eyes bulged as they went into convulsions and then collapsed.'
20785: 'Chiester45@r@v35/33400028."45, hit and kill confirmed.@k@v35/33400029. Forming towing curve, correcting adjustment points.@k@v35/33400030. Data link to 410."'
20786: 'Chiester410@r@v36/33500041."410, data received.@k@v36/33500042. Initiating corpse towing.@k@|@y@v36/33500043. Two on the line at once nyeh, nihi!"'
20787: '@rThe gold snake began to drag Krauss and Natsuhi''s corpses back.'
20788: '@r......It slipped through the door to the corridor, dragging the corpses, gradually increasing in speed,'
20789: '@rand in the blink of an eye, it had pulled them outside the guesthouse.'
20790: '@rSo the lobby was still, as though nothing had happened at all.'
20791: '@r...As though Krauss and Natsuhi had never been there to begin with.'
20792: '@rOnly the sound of the wind and the rain remained, as though feigning ignorance and pretending that they had been the only ones there......'
20793: 'Eva@r@v05/31000884."......Sorry, I''m fine now.@k@v05/31000885. ...Now, I''ll go make some coffee."'
20794: '@rEva returned from the lavatory.@k@rBut no one was in the lobby.'
20795: '@rEven though they had been in that sofa until the very moment she had choked and gone to the lavatory,@k they had now gone, as if they had been an illusion from the beginning.'
20796: 'Eva@r@v05/31000886."...How careless...@k@v05/31000887. ......Where did those two go off together?"'
20797: '@rLike she was pretending to be in a detective novel, Eva put her hand on the sofa.'
20798: '@r......She felt a warmth indicating that they had been sitting there until a short while ago.'
20799: '@rMaybe they had gone to do the rounds or something.'
20800: '@rFor the time being, Eva sat down and waited for their return...'
20801: '@rBeato and George could be seen in the parlor of the mansion.@k@rGeorge was kneeling near Shannon''s body as though praying...@k@rHis face was sincerity itself, and there was even sweat on his forehead.'
20802: '@rHowever, Beato was the same.@k Now that she had handed her name over, most of her previous power had been lost.'
20803: '@r...Of course, she still had more than enough power to be called a witch, but compared to the past, it was a very faint thing.'
20804: 'BEATRICE@r@v27/30701892."......Good.@k@v27/30701893. Don''t talk to her, don''t touch her with your hand.@k@v27/30701894. ...Call to her with the voice of your heart; seek her with the hand of your heart.@k@v27/30701895. ...Only your strong feelings can make my magic reach Shannon''s lost soul."'
20805: 'George@r@v07/30300178.".................................hh."'
20806: '@rGeorge maintained a single-minded focus.@k@rHe kept frantically yelling inside his heart, trying to call back the soul of the person he loved.'
20807: '@r...He strongly envisioned his soul leaving his body, and searching for her as she wandered through Hell.'
20808: '@r......Beato turned that strong force into magical power, supplementing her own magic.@k It was magic that, in the past, she could have performed easily, without anyone''s help.'
20809: '@r...But now, if she didn''t rely on someone''s help, she wouldn''t be able to finish the chant, much less succeed.'
20810: 'BEATRICE@r@v27/30701896.".........I have forgotten after several hundred years...@k@|@y@v27/30701897. .........Was magic,@v27/30701898. ......was resurrection...@v27/30701899.always this difficult of a magic......?"'
20811: '@rAn even more strained expression than George''s had risen to Beato''s face.'
20812: '@r...She was still forgetting this, but the magic to revive a life is fundamentally the ultimate hidden art.'
20813: '@rIt was her previous magical power, giving her the ability to use that magic over and over with a snap of her fingers, that was abnormal.'
20814: '@rTherefore, the heavy burden to her body and mind was, by rights, absolutely to be expected...'
20815: 'BEATRICE@r@v27/30701900."......However, .........the power this one has...@v27/30701901.is quite considerable, even though he doesn''t know magic.@k@v27/30701902. ......I see, so he truly is Kinzo''s grandchild..."'
20816: '@rThe strong power pouring from George was even large enough to pass as magical power.'
20817: '@r...At first, Beato thought it was due to the blood of the mage Kinzo.'
20818: '@r......However, that was probably wrong.@k@r...She had a feeling that Battler had taught her that.'
20819: '@rGeorge''s power to feel sorrow for the death of his loved one......arose from the way he had tried his hardest throughout his life,@k from the warm time spent together with Shannon, and from the size of their shared dream, promising each other their futures.'
20820: '@rDo humans really live this seriously during their one single life?'
20821: '@r......Of course they do.@k To her, a life didn''t mean anything more than the difference between the top and bottom of an Othello piece.'
20822: '@rIf the black represented death, then she thought all you had to do was flip it over again and make it white.'
20823: '@rHowever, it was just like that broken vase.'
20824: '@r......To humans in a world without magic, where they can never return it to its original form,@k ......it is very, very natural for them to bet all their body and soul on that single life.'
20825: 'BEATRICE@r@v27/30701903.".........So there are times when an Endless Witch, with full command over even life and death,@k@v27/30701904. ......is inferior to a finite Human, for whom even death''s mountain is impossible to cross......?"'
20826: '@rNow, the witch acknowledged it.'
20827: '@rHe was able to hold a magical power that could not reside in witches who didn''t understand the value of a life.'
20828: '@r......What is this thing called the Endless Magic for again?'
20829: '@r...Even though I call myself the Endless Witch,@k have I been forgetting what the Endless Magic means...for a whole thousand years.........?'
20830: '@rShe looked at George''s expression again.@k .........His surging earnestness was like a lightning bolt.'
20831: '@r...Right now, even if George''s body was burned, or smashed by a waterfall,@k he would probably continue to pray for his beloved without minding it, without noticing it.'
20832: '@rFor the first time, ...she showed respect for that power.'
20833: '@rSo in that instant, all magical resistance was lost, and the enormous power of George''s feelings turned into magical power in its perfect form......'
20834: '@rThe vase was very, very beautiful, rich with history and value.'
20835: '@rEven as young as I was, it still forced me to take a deep breath when I witnessed its beauty.@k ......But that just made me want to touch it.'
20836: '@rBut the vase easily fell and smashed into smithereens.'
20837: '@r...Like a popped bubble,@k it felt as though the time when it had possessed a form was just an illusion.'
20838: '@rIt was that fragile, ......that easily lost, that life.'
20839: '@rI realized that, because of my own foolish curiosity, I had done something that couldn''t be taken back.'
20840: '@rNo matter how much I regretted it, no matter how much I apologized.@k@rThe broken vase would not return to its original form...@k@rA lost life will not return to normal no matter what happens.'
20841: '@rI was frightened by the fact that my own frivolous action, even though it had been frivolous,@k ...had stolen a life that could never be revived again.'
20842: '@rAnd, out of pity for the lost life, I cried.@k@rOut of fear of myself, who had made it become lost, I cried even more.'
20843: '@rI was sure that Grandfather would also cry at the loss of his precious vase.'
20844: '@rI was sure that all of the people who thought fondly of Grandfather would cry too, when they saw him like that.'
20845: '@rBy just the loss of a single life, the whole world would be filled with so much sadness.'
20846: '@r......I cried even more at how terrible that would be.'
20847: '@rBEATRICE appeared, and spoke.'
20848: '@r@v30/33200533."Then, Milady.@k@v30/33200534. Let us revive this vase with magic.@k@v30/33200535. If that will make everyone happy, then the vase and the magic and the spirits...@k@v30/33200536.should be happy to lend you their power, and return it to its original form."'
20849: '@r@v30/33200537."Come, Milady.@k@v30/33200538. Close your eyes, and say the chant with me..."'
20850: 'BEATRICE@r@v27/30701905."Come, try closing your eyes.@k@v27/30701906. And try to remember.@k@v27/30701907. What form did you have?@k@v27/30701908. It was surely a very, very beautiful form.@k@v27/30701909. Please, show me that form one more time..."'
20851: '@rThose words of power powerfully knocked on the door to Hades.'
20852: '@rHer previous magic had powerfully knocked on the door to Hades in the same way.'
20853: '@r......However, back then, it was horribly violent, ...and earned the displeasure of the peacefully sleeping dead...'
20854: '@rHowever, this time was different.@k ...It was very powerful, ...but it was very kind and loving.'
20855: '@rThe dead near the door opened their eyes,@k ......and called out to the other dead that there was a voice calling for someone to come back.'
20856: '@r...The sadness of that voice calling from the outside touched the hearts of the dead,@k and trying to respond as quickly as possible, they searched for Shannon''s lost soul...'
20857: '@rAnd then,@w500. .........they found it.@k@rThey found the casket in which Shannon was peacefully sleeping.'
20858: '@rIt truly was Shannon''s soul, sleeping in the land of the dead.@k@r......Inside a casket that was covered with rose petals frozen with frost, she was sleeping in peace...'
20859: '@rThe dead silently lifted that casket up.'
20860: '@r...While it looked like a funeral march at a glance, it had the complete opposite meaning.'
20861: '@rIt was solemn, but filled with joy.'
20862: '@r...It reminded the long-forgotten dead...@kthat they continue to be loved even after their deaths,@k ......and gave them all a warm sense of peace......'
20863: '@rThen, ...as though guided by a warm light from the heavens, ...Shannon''s body floated up out of the casket...'
20864: '@rThe dead watched her go.@k ......They squinted at that warm light,@k giving their respect to this unknown member of the living, who had continued to hold onto his love for a person even after her death...'
20865: '@rShannon''s body was sucked into the light in the heavens, and began to disappear...'
20866: '@rIn the jet-black darkness of the land of the dead, the faint flickering of gold butterflies could be seen.'
20867: '@r...It reminded them of the gentle stars in the night sky, which they had long forgotten...'
20868: 'George@r@v07/30300179."........................hh!"'
20869: '@rGeorge remembered being told that he must not say anything, and he hurriedly covered his mouth.'
20870: '@rHowever, it felt like his heart was trying to jump out of his throat.@k@r......Because he had seen Shannon''s eyelids shake slightly.'
20871: '@rAnd then, ...those eyelids slowly opened.@k Shannon''s eyes were there, but they were still covered in the frost of the land of the dead.'
20872: '@rHowever, ......the warmth of the human world...no.@k ......The warmth of her loved one, who had called her soul back, slowly dissolved that frost,@k .........and her eyes gradually regained their sparkle.'
20873: '@rThen, .........her eyes moved, ...and recognized George.'
20874: 'Shannon@r@v15/30500069."......George......san..............."'
20875: '@rAs her lips shook weakly,@w333. ......Shannon definitely said that.'
20876: '@rThe words were very faint.@k@rSo much so that they normally wouldn''t even have reached his ears.'
20877: '@r......However, George clearly heard them.'
20878: '@r.........He heard his loved one, his fiancee, the one he loved most who should have been dead,@k call his name once again...'
20879: 'George@r@v07/30300180."Shannon,@v07/30300181. .........Shannon.........@v07/30300182.can you...@v07/30300183....recognize me.........?"'
20880: 'Shannon@r@v15/30500070."...George-sa...n......@k@v15/30500071. .........Is this...a dream.........?"'
20881: 'George@r@v07/30300184."No.@k@v07/30300185. This isn''t a dream.@k@v07/30300186. ......See, look, ......even if I pinch, you don''t wake up."'
20882: '@rAs George said that, he softly pinched Shannon''s cheek.'
20883: '@r......It was how George had always responded in the past, when Shannon had been surprised by something and had asked if she was dreaming.'
20884: '@rWhen Shannon felt the warm touch of George''s finger on her cheek...@k@r......And when George realized that the warmth of a living person had already returned to the cheek of his beloved...'
20885: '@r......They both cried.'
20886: '@r...With what words should a pair of lovers separated by death celebrate their reunion?@k ......The words of the human world are not enough to celebrate that.'
20887: '@rIn short, they had no need of the words of this world...'
20888: '@rShannon sat up, and the two of them simply wordlessly hugged each other.'
20889: '@rShannon still didn''t have much strength in her, and putting her arms around George''s back took all she had,@k ......so George hugged her tightly to make up for that.'
20890: '@rTo stop her from ever again going to a place beyond his reach,@k he hugged her so tightly, and yet so gently......'
20891: '@rShannon''s fingers curled around George''s back,@k ......and on her ring finger indeed shone the engagement ring George had given her.'
20892: '@rThat strong sparkle was absolutely not the sparkle of diamond alone.@k@r......There was, without doubt, a magical power there that only the two lovers could possibly feel.'
20893: '@rIt was because that strong light existed...that they had been able to find her casket in the land of the dead.'
20894: '@rBeato understood.'
20895: '@r......That ring, ......no.'
20896: '@r............The couple''s feelings, in the form of that ring, had created this miracle.'
20897: '@rIn that moment, George had definitely used magic.@k Beato had done nothing more than help him along.@k That magic had a magical power that could only reside in those who knew of the importance of life and trying their hardest.'
20898: '@rIt was the power of a miracle that an Endless Witch could not know, ......that only the power of the finite could give rise to.'
20899: '@rBy now, she had no choice but to accept it.@k ......She had to accept that true magic, true magical power...'
20900: '@r...existed in the place farthest away from she who called herself a Great Witch.'
20901: 'Shannon@r@v15/30500072.".........BEATRICE...sama......"'
20902: 'George@r@v07/30300187."......She brought you back to life...@k@|@y@v07/30300188. Thank you, BEATRICE...!"'
20903: 'BEATRICE@r@v27/30701910."No.@k@v27/30701911. I could not do anything.@k@|@y@v27/30701912. ......What revived Shannon...was your magical power.@k@v27/30701913. Your magic.@k@v27/30701914. ............I have indeed witnessed here the Ushiromiya blood, capable of achieving miracles."'
20904: 'Shannon@r@v15/30500073.".........George-san was the one who......brought......?"'
20905: 'BEATRICE@r@v27/30701915."...Mm.@k@v27/30701916. .........He had a phenomenal magical power, so much so that I could not reach up to his feet.@k@|@y@v27/30701917. ......So I still have not left the level of apprentice, then.@k@v27/30701918. ...Now I finally know my place."'
20906: '@rBeato staggered backwards.@k@r...Her physical strength was clearly exhausted.'
20907: '@rShe had humbly said that George''s power alone had revived Shannon, but Beato had also used all of her magical and physical strength.'
20908: '@r...And she reflected upon how difficult it was to revive a single one of these lives,@k which she had toyed with however she wanted in the past.'
20909: '@rThe couple kept each other in their tight embrace, and showed no signs of letting go.@k ...Feelings that couldn''t be communicated with a billion words were thus communicated between them...'
20910: 'George@r@v07/30300189."Thank you, BEATRICE.@k@v07/30300190. ...We are in your debt..."'
20911: 'Shannon@r@v15/30500074."...Thank you very much, BEATRICE-sama.@k@v15/30500075. ......I will never forget that it was you who let me meet with George again."'
20912: 'BEATRICE@r@v27/30701919."......Enough, enough.@k@v27/30701920. Being thanked by a pair of lovers is far too embarrassing for one who has been feared as an extreme savage.@k@|@y@v27/30701921. ......Don''t worry...about me.@k@v27/30701922. ...Take all the time you want.........celebrating your reunion together........."'
20913: '@rBeato, who was leaning her back against the wall, slid down the wall, and sat.@k How many centuries had it been since she had last grown this tired from using magic?'
20914: '@r......Probably, not since the time I first succeeded in magic.'
20915: '@r.........Didn''t Master praise me for that back then?'
20916: '@rOh, but, I myself killed that master who praises me, didn''t I...'
20917: '@r......Don''t be naive, BEATRICE.'
20918: '@r...In the end, that''s what it means to kill something, right...?'
20919: 'VIRGILIA@r@v30/33200539."......Finally,@k@v30/33200540. ...it seems you''ve remembered how to use magic."'
20920: 'BEATRICE@r@v27/30701923."...............My whole head...feels parched and suffocated, ......and I can''t even think, let alone remember...@k@|@y@v27/30701924. ...Wait, ...didn''t I kill you?@k@v27/30701925. You shouldn''t be appearing..."'
20921: 'VIRGILIA@r@v30/33200541."You have let me live until now.@k@v30/33200542. That is why I can appear like this.@k@v30/33200543. ......However, I did not come here to pat you on the head."'
20922: 'BEATRICE@r@v27/30701926."......Did you come here just to sneer at how pathetic I am?@k@|@y@v27/30701927. ......And after all this time, after retiring as a witch and everything, ...if I sit here and have my head patted, I''ll be the laughingstock of the other witches......"'
20923: 'VIRGILIA@r@v30/33200544."That''s right.@k@v30/33200545. ......Not only are you a full adult, but you boast about having retired from active service,@k@v30/33200546. so I am sure that it would be far too embarrassing to tell anyone that you only just now learned how to use magic."'
20924: 'BEATRICE@r@v27/30701928."............Yeah.@k@v27/30701929. ......Keep it a secret, Masteer..."'
20925: '@rWith a sense of pleasant despondency, Beato gazed at the couple hugging each other.'
20926: 'BEATRICE@r@v27/30701930."Love, huh.@k@|@y@v27/30701931. ...............I''m no match..."'
20927: 'Chiester45@r@v35/33400031."45, data received.@k@v35/33400032. Firing preparations complete.@k@v35/33400033. Ammo selected, now loading."'
20928: 'Chiester410@r@v36/33500044."410, firing.@k@v36/33500045. Nihi!"'
20929: '@rThe golden serpentine arrow fired by the Chiesters...'
20930: '@rweaved its way through the bushes in the rose garden,'
20931: '@rweaved its way through the hedges,'
20932: '@rand climbed the stone steps towards the mansion''s entrance,'
20933: '@raiming for the keyhole.'
20934: '@rIt weaved through the corridors,'
20935: '@rand flew into the keyhole in the door to the parlor...!'
20936: 'BEATRICE@r@v27/30701932."......Aaaaaaaaaaaaaaaaaaaaaaahhhh?!?!"'
20937: '@rIt happened in an instant.@k ...It would have been difficult for Beato, who was completely worn out, to have noticed it beforehand.'
20938: '@rRight before Beato''s eyes, the gold snake that flew in through the keyhole...@kspun circles around the two lovers,@w500. and pierced through their two hearts in a blink of an eye.'
20939: '@r......And with meticulous precision, that gold snake ran through that hole in Shannon''s chest once more...'
20940: '@rThe two had been pierced through the heart by the gold snake,@k ...no, by the gold sewing thread used by the new brutal witch''s furniture,@k .........and it had only taken an instant, so unfitting for the amount of effort it had taken to revive Shannon...!'
20941: '@rIn front of Beato''s shocked eyes, the two collapsed onto the floor...'
20942: 'BEATRICE@r@v27/30701933.".........G-@v27/30701934.......George......@v27/30701935..........Shannon..............."'
20943: 'George@r@v07/30300191."......Thank you,@v07/30300192. ...BEATRICE......@k@v07/30300193. ...For letting us meet,@v07/30300194. ...even just for a short while,@v07/30300195. ......thank you........."'
20944: '@rGeorge spent his last breath thanking Beato, and died side by side with the one he loved.'
20945: '@rThe gold snake, which still sewed the two in place, spun like a large cyclone, revolving around the inside of the parlor.'
20946: '@r.........It was searching for further kills in that room.'
20947: '@rThen, the tip of the snake met Beato''s gaze...@k@rIn that instant, Beato prepared herself for death.'
20948: '@rJust then, VIRGILIA stood in front of her, the fingers of both her hands drawing a mark.'
20949: '@rIn that instant, gold-colored gold leaf buried the inside of the parlor.@k@rIt was like a blizzard of gold...'
20950: 'VIRGILIA@r@v30/33200547."Beato, escape while you can!!@k @v30/33200548.No one can escape from the Chiesters'' golden bow!!!"'
20951: 'Chiester410@r@v36/33500046."410, target lost!!@k @v36/33500047.Nihyah, magical chaff!!"'
20952: 'Chiester45@r@v35/33400034."45, understood...!@k @|@y@v35/33400035.Modifying enemy search: personal image homing algorithm.@k@v35/33400036. Target reacquired, data link to 410."'
20953: 'Chiester410@r@v36/33500048."410, data received.@k@v36/33500049. Too slowww nyeh, Predecessor-samaa!!@k @|@y@v36/33500050.Here it comes here it comes here it comes,@v36/33500051. ...IMPACT!!"'
20954: '@rThe Chiester Sisters'' golden bow would not let its kill escape.@k@rIt would not let them block it.'
20955: '@r...No magical barrier could even dream of blocking it without being multilayered.'
20956: '@rThe weak point during the instant of confusion caused by VIRGILIA''s deception magic was Beato''s only chance to escape.'
20957: '@rAnd the only opportunity to make the sisters confuse VIRGILIA for Beato.'
20958: '@rAs VIRGILIA spread her arms wide, blocking the way to her beloved disciple, the gold snake pierced straight through the location of her heart...'
20959: '@rThe snake, which had snuck in through the keyhole, shot through George and Shannon, and then shot through VIRGILIA in an instant,@k completely failed to notice as Beato escaped...'
20960: '@rAs soon as VIRGILIA saw that Beato had gotten away, she expired.'
20961: '@r......The strength left her body, and like gold dust drifting with the wind, her form was erased...'
20962: '@rBeato completely erased all traces of her magical power,@k became gold butterflies, and passed through the wall, escaping to the wind and rain outside......'
20963: 'BEATRICE@r@v27/30701936."..................Damn it,@v27/30701937. .........damn it, damn it...@k@v27/30701938. ......You bitch,@v27/30701939. ......you biiiiiiiiiiiiiiiitch...!!"'
20964: '@rBeato felt sick from the bottom of her heart.'
20965: '@rWhy?@k Because she had been attacked by the new witch?'
20966: '@rProbably...not.@k Of course, she also felt sick over the loss of her master.'
20967: '@rBut even more than that, Beato was enraged at the barbarism which had boorishly stolen the union between the two reunited lovers.'
20968: '@r......Beato had poured out almost all of her magical power to reunite them.'
20969: '@r...That miracle had been achieved only as a result of all that,@w416. ......yet it had taken such a short time to steal it away...!'
20970: '@rBeato trembled at the barbarous cruelty which had ended it so fast.'
20971: '@r......And it was also the true form of the acts she herself had committed up until that point...'
20972: '@rSo just as strongly as Beato hated the new witch, she looked at her previous self with disgust.'
20973: '@rBut now she had to escape...@k@r......If she was targeted next, she would probably lose her life.'
20974: '@rAnd it wouldn''t even be funny if the chess player, descended like a god,@k ended up being attacked and killed by the pieces.'
20975: 'Chiester45@r@v35/33400037."45, impact confirmed, target scattered.@k@v35/33400038. ......W-without a doubt, we crushed the Predecessor...!"'
20976: 'Chiester410@r@v36/33500052."Our pile of kill medals is gonna get bigger yeeeet again nyeh.@k@v36/33500053. Nihi!"'
20977: 'EVA@r@v34/33300708."What was that about loving couples?@k @v34/33300709.You get to enjoy them thrice—once tearing the two apart, once reuniting them, and once tearing them apart again...right?@k @|@y@v34/33300710.*cackle*hihihihihihhihi!"'
20978: 'EVA@r@v34/33300711."And I feel great about getting to say goodbye to that fussy-as-fuck old hag at the same time.@k@v34/33300712. ......Ronove, you don''t have any complaints, right?"'
20979: 'Ronove@r@v31/33100568."......Why, of course not,@k@v31/33100569. BEATRICE-sama."'
20980: 'EVA@r@v34/33300713."She interfered with the ritual of the witch''s epitaph, you see?@k @v34/33300714.She revived a sacrifice from the first twilight without permission, and interfered with my ritual.@k@v34/33300715. No one has aaany right at all to complain."'
20981: 'EVA@r@v34/33300716."Kuhhihihihhyahyahyahya...!@k @v34/33300717.Sucks that she doesn''t leave a corpse behind though.@k@v34/33300718. ......I was thinking of torturing that old hag to death over and over again endlessly.@k@v34/33300719. Kuhhihihyahyahya...!!"'
20982: 'Ronove@r@v31/33100570."........................"'
20983: 'Eva@r@v05/31000888."G-George did...?!@k @v05/31000889.He didn''t show up, when did he come down?!"'
20984: 'Battler@r@v10/30101400."......Wh-when...?@k@v10/30101401. What time was that, again...?"'
20985: 'Jessica@r@v04/30200121."I think...it was probably about four or five.@k@v04/30200122. ...It was at least an hour ago..."'
20986: 'Battler@r@v10/30101402."We got sleepy, and probably dozed off after that...@k@|@y@v10/30101403. But I think Jessica probably has it right.@k@v10/30101404. About one or two hours ago."'
20987: 'Nanjo@r@v19/31900033."I, I also remember it being around that time.@k@v19/31900034. Because I was asked whether I wanted more coffee..."'
20988: '@rSomething hard to believe had happened...'
20989: '@rApparently, when Auntie Eva had left for a second to visit the lavatory,@k Uncle Krauss and Aunt Natsuhi had disappeared.'
20990: '@rThere''s no way they went hiding somewhere.@k Of course, the doors and windows had all been rigorously checked, and all were locked from the inside.@k Not one of them was broken.'
20991: '@rAnd that wasn''t just the first floor—the second floor was the same.@k Also, all of the doors and windows were designed in such a way that they couldn''t be locked from the outside.'
20992: '@r...In other words, there was no way that Uncle Krauss and Aunt Natsuhi had gone outside.@k@r......And yet, they couldn''t be found.'
20993: '@rFurthermore, they weren''t the only ones who had disappeared......astonishingly, George-aniki had too.'
20994: '@rGeorge-aniki had left saying that he was going to get more coffee,@k@|@y and had gone downstairs more than an hour earlier.'
20995: '@rI''d been under the impression that he was having a good conversation with Auntie Eva and the rest,@k ......but Auntie Eva, who had been in the lobby the whole time, said that no one had come down.'
20996: '@rSince all of the doors and windows are locked from the inside,@k ...it''s hard to imagine that they went outside.'
20997: '@r......Nevertheless, three humans had evaporated from this barricaded guesthouse, which had become a perfect locked room......'
20998: '@rIt''s hard to imagine any reason why they''d hide themselves away for a surprise prank in a situation like this.'
20999: '@r......It''s probably appropriate to think that they''ve become caught up in this crime...'
21000: '@rWhen Auntie Eva learned that her only son was missing,@k she went half insane, running from room to room and yelling his name loudly.'
21001: '@r...And Jessica, who had suddenly lost both of her parents, followed suit.'
21002: '@rCries of "George, George" and "Mom, Dad" were even now continuing to echo through the guesthouse...'
21003: '@rI think George said something about wanting to see Shannon''s face.'
21004: '@r......It would be reasonable to imagine that he had snuck out of the guesthouse and gone to the mansion.'
21005: '@r...However, I don''t know about Uncle Krauss and Aunt Natsuhi.@k@r...Maybe they guessed that''s what happened, and went to the mansion to search for him...?'
21006: '@rWithout even telling Auntie Eva...?'
21007: '@rAt this rate, it''s only a matter of time before we start talking about leaving the guesthouse to search for them.'
21008: '@r.........At this point, I''d be in favor of that.'
21009: '@rWe said that shutting ourselves up inside the guesthouse would be safe,@k and shut ourselves in this morning as a big, happy family of twelve people.'
21010: '@rAnd yet, now there are only four people here.@k ......In other words, being here does not imply safety...'
21011: '@rHowever, ...there''s something even more important that we mustn''t forget.@k@rThat''s the fact that all of the doors and windows were locked from the inside.'
21012: '@r......This is a locked room.@k@rHow had they vanished from this place?'
21013: '@rWe''d searched around thoroughly.@k@rHowever, we were unable to find any signs of anyone hiding.'
21014: '@r...The three of them had almost certainly been taken outside the guesthouse.'
21015: 'Nanjo@r@v19/31900035.".........I wonder how they did it...@k@v19/31900036. You don''t think......there might be something like a hidden door?"'
21016: 'Battler@r@v10/30101405."A hidden door...?"'
21017: 'Nanjo@r@v19/31900037."...The doors and the windows are impossible to lock from the outside by construction.@k@v19/31900038. Even using a fishing line of some kind, it would probably be impossible with the way they are constructed.@k@|@y@v19/31900039. In that case, it''s probably reasonable to think that they left through somewhere other than a door or a window..."'
21018: 'Battler@r@v10/30101406.".........You''re right.@k@v10/30101407. That does make logical sense.@k@v10/30101408. ......No one can be sure that no hidden doors exist.@k@|@y@v10/30101409. ...However, before leaping to that conclusion, I suspect a much simpler possibility."'
21019: 'Nanjo@r@v19/31900040."And...what would that be......?"'
21020: '@rFor some time, Battler had been opening windows, opening the shutters, and checking outside,@k and repeating this for each window.'
21021: 'Battler@r@v10/30101410.".........Hmm.@k@v10/30101411. ...This window sure is quiet.@k@|@y@v10/30101412. ...I see, unlike the other windows, the building''s construction means that the wind doesn''t blow into this one."'
21022: 'Nanjo@r@v19/31900041."It appears that way...@k@v19/31900042. It feels strange that no wind or rain comes in, even though there is so much of it outside."'
21023: 'Battler@r@v10/30101413."Doctor Nanjo.@k@v10/30101414. ...When I opened the window just now, did you hear a sound?"'
21024: 'Nanjo@r@v19/31900043."Huh?@k @v19/31900044.......No, I did not notice it...@k@v19/31900045. I believe it is well oiled."'
21025: 'Battler@r@v10/30101415."In other words,@k@v10/30101416. it would be possible to slink out through this hall window, which no one was watching.@k@v10/30101417. Furthermore, the wind doesn''t blow in through this window,@k@v10/30101418. so the air pressure wouldn''t cause the curtains or a door to make a sound.@k@v10/30101419. ......It''d be quiet."'
21026: '@rBattler leaned out and looked at the ground below.@k@r...He was searching for some sign that George had jumped down.'
21027: '@r......But at a glance, he didn''t see any mark like that on the grass in the middle of the pouring rain.'
21028: 'Battler@r@v10/30101420."......There might also be a window like this on the first floor.@k@v10/30101421. It is possible to go outside without anyone noticing."'
21029: 'Nanjo@r@v19/31900046."However, not only the doors, but the windows too were all locked, and the shutters were even down as well, correct...?@k @v19/31900047.It is possible to go out, but it would be impossible to lock up..."'
21030: 'Battler@r@v10/30101422."But they can be locked, see?@k @v10/30101423.Just like this, click."'
21031: '@rBattler closed the window and locked it, as though this was perfectly obvious.'
21032: 'Nanjo@r@v19/31900048."............B-......Battler-san, you aren''t saying..............."'
21033: 'Battler@r@v10/30101424."If someone inside locked it in the end, this locked room is as easy as pie."'
21034: 'Nanjo@r@v19/31900049."B-but that means,@k@v19/31900050. .........that means,@k@v19/31900051. ......ooooooohhhh......"'
21035: '@rNanjo turned pale and shook his head several times.@k ...Because the thing that Battler said was presenting a certain truth to him that was frightening even to imagine...'
21036: 'Battler@r@v10/30101425."......That''s if they used the trick I thought of, of course?@k @|@y@v10/30101426.However, with this trick, only a very limited number of people can be suspected."'
21037: '@rHe didn''t want to say it in front of Nanjo, ...but after eliminating Jessica, who had been with him the whole time,@k ...the only ones who could have done it were Nanjo...and Eva.'
21038: 'Nanjo@r@v19/31900052."I, ...I would not do anything of the sort...!@k @v19/31900053.Y-yes, I can swear it...!!"'
21039: 'Battler@r@v10/30101427."......In this case, it would become a battle between Auntie Eva and you for an alibi.@k@v10/30101428. ...We''d just have to suspect both of you,@k@v10/30101429. and confine the two of you separately."'
21040: 'Battler@r@v10/30101430.".........To say it the other way around, this might be an effective trick if there were more survivors,@k@v10/30101431. but since our numbers have shrunk so much, it isn''t particularly effective at all."'
21041: '@r...No, in fact, there''s a chance they could dig their own grave with it.'
21042: '@r......It should have been more expedient to make it look like the culprit was outside,@k and to intentionally leave a door unlocked, or break a window...'
21043: 'Battler@r@v10/30101432."............If this disappearing act had taken place midday today,@k@v10/30101433. I''d have probably announced this theory with full confidence.@k@v10/30101434. ...But at this stage, I''m not confident at all.@k@v10/30101435. ............What''s going on here?@k@v10/30101436. ...What the hell does it mean?@k@v10/30101437. .........This "locked room"......"'
21044: 'Nanjo@r@v19/31900054."Y-......you don''t think, umm........."'
21045: 'Battler@r@v10/30101438."Hmm?@k @v10/30101439.What is it, Doctor Nanjo?@k@|@y@v10/30101440. ...Even if it''s just a thought, please say it."'
21046: '@rBecause Doctor Nanjo looked like he was trying to swallow his words despite having thought of something, I urged him on.'
21047: '@rAfter he refused several times, saying that it was just a foolish idea, he finally said it out loud.'
21048: 'Nanjo@r@v19/31900055."......Well, umm,@k@v19/31900056. ............you don''t think this actually might be...@v19/31900057....the work of the witch...?"'
21049: 'Battler@r@v10/30101441."R-...ridiculous.@k@|@y@v10/30101442. There''s no way witches exist."'
21050: 'Nanjo@r@v19/31900058."......The witch is trying to make her case to us.@k@v19/31900059. ...She must be showing us that she can do things that humans cannot,@k@v19/31900060. ...trying to make us accept her as a witch."'
21051: 'Nanjo@r@v19/31900061."...To me, this disappearance from the locked room of this entire guesthouse......feels like that kind of message from the witch......@k@v19/31900062. ............I must not think of it.@k@v19/31900063. Surely, it cannot mean anything.@k@v19/31900064. ...Oooh, ......I, ...I am frightened......"'
21052: '@rAs Doctor Nanjo shook with fear, it looked like he was he was trying to erase the fearsome thoughts that he kept imagining, one after the other.'
21053: '@r......When we went downstairs, Auntie Eva and Jessica were enraged,@k and were each making a lot of noise about leaving this place and searching for their respective families.'
21054: '@rIt was a desire that naturally hits those who can no longer see their family.'
21055: '@rAuntie Eva told Doctor Nanjo and me to stay here, but I shook my head and started walking.'
21056: 'Battler@r@v10/30101443.".........I''ve had enough of being shut up in here.@k@v10/30101444. ...I''ve started wanting to breathe some outside air."'
21057: 'Jessica@r@v04/30200123."Yeah, and if we''re going, let''s go right now...!!@k @v04/30200124.I''m sick as hell of staying shut up in this place...!!@k @v04/30200125.Let''s go and find Mom, Dad, and George nii-san as fast as we can...!!"'
21058: '@rThe blood had all risen to Jessica''s head.@k@r...I hope it doesn''t set off her asthma.'
21059: 'Eva@r@v05/31000890."Anyone who wants to stay behind can do that themselves.@k@v05/31000891. But we are going to search outside...!"'
21060: 'Battler@r@v10/30101445."What about you, Doctor Nanjo...?@k @v10/30101446.Gonna watch the place by yourself...?"'
21061: 'Nanjo@r@v19/31900065."N-no...@k@v19/31900066. Please allow me to join you..."'
