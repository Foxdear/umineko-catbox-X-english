15219: 'Battler@r@v10/30100024."...Six years ago, you say?@k@v10/30100025. I mean, six years, that''s like the whole of elementary school, isn''t it?@k@v10/30100026. It''s pretty unfair to ask me to remember, don''t you think?"'
15220: 'George@r@v07/30300009."I agree.@k@v07/30300010. Especially since we were so young; we''ve grown a lot in these six years.@k@v07/30300011. Actually, if we hadn''t been introduced, maybe we wouldn''t have been able to remember you."'
15221: 'Jessica@r@v04/30200004."You think?@k@v04/30200005. I knew it was Battler right away.@k @v04/30200006.After he opened his mouth, I was even more sure."'
15222: 'Maria@r@v13/30400004."Uu.@k@v13/30400005. I met him for the first time.@k@v13/30400006. Don''t know about six years ago."'
15223: 'Shannon@r@v15/30500001."That''s natural.@k@v15/30500002. You were only three, after all."'
15224: 'Battler@r@v10/30100027."When you say it like that, I''m the same.@k@v10/30100028. I only knew Maria when she was three years old, and since she''s grown so big, yeah, no wonder I didn''t recognize her."'
15225: '@rAfter lunch, we had all gone out to the beach to walk around, talk and take it easy enjoying ourselves.'
15226: '@rOur parents appeared somehow on edge, and seemed to have things to catch up on, so we had decided to leave our seats.'
15227: '@r...Just as you''d expect, since it had been six years, the conversation focused on me.'
15228: 'George@r@v07/30300012."Still, you''ve really gotten taller.@k@v07/30300013. I won''t call myself short, but anyway, your height surprised me."'
15229: 'Shannon@r@v15/30500003."That''s right. I remember well what Battler-sama was like six years ago, but I was surprised even so."'
15230: 'Jessica@r@v04/30200007."Totally.@k@v04/30200008. I could never have imagined this from how Battler looked six years back."'
15231: 'Battler@r@v10/30100029."I''m surprised at how everyone remembers so much about six years ago.@k@v10/30100030. My memory''s all hazy."'
15232: 'Jessica@r@v04/30200009."Not surprised.@k@v04/30200010. I mean, you seemed to take a while even remembering us.@k@|@y@v04/30200011. That hurts a bit, ya know?"'
15233: 'Battler@r@v10/30100031."Come on, this was six years ago, right?@k @v10/30100032.It''s ridiculous to ask me to remember...!"'
15234: 'Shannon@r@v15/30500004."...So, you can''t remember things that happened six years ago very well?@k @|@y@v15/30500005.I can remember as clearly as if it was yesterday..."'
15235: 'George@r@v07/30300014."That''s because your memory is good, Shannon.@k@|@y@v07/30300015. I bet you remember well what kind of things Battler-kun did and said six years ago, don''t you?"'
15236: 'Jessica@r@v04/30200012."Come to think of it, that''s right.@k@v04/30200013. Shannon''s memory is surprisingly good when it comes to certain things."'
15237: 'Maria@r@v13/30400007."Uu.@k@v13/30400008. I''m bad at remembering.@k@v13/30400009. Remember fun stuff well but horrible at boring stuff.@k@v13/30400010. Uu."'
15238: '@rWe all laughed, saying that everyone was like that.'
15239: 'Jessica@r@v04/30200014."Shannon.@k@v04/30200015. By the way, what was Battler like six years ago?@k @|@y@v04/30200016.Remember any interesting episodes?"'
15240: 'Shannon@r@v15/30500006."Let''s see.@k@|@y@v15/30500007. ......I''m sure that he said something like this when he left.@k@|@y@v15/30500008. "I''ll be back... <See you again>.@k@|@y@v15/30500009. I''ll come for you riding a white horse.""'
15241: 'Battler@r@v10/30100033."Gyaaaaaaaaaaaaaaaaaaaahhh,@|@y@v10/30100034. doooooooon''t, so embarrassiiiiiiiiiiing!!"@|@y'
15242: 'Jessica@r@v04/30200017."Gyaaah-hah-hah-hah-hah-ha!!"'
15243: 'Jessica@r@v04/30200018."I bet he did, I bet he did!@k @v04/30200019.That''s exactly what he was like, six years ago he was always full of those stupid lines!"'
15244: 'Jessica@r@v04/30200020."Waaahahahahaha!!"'
15245: 'George@r@v07/30300016."Hahahaha.@k@v07/30300017. It really does sound like something Battler-kun would have said back then."'
15246: 'Maria@r@v13/30400011."Uu.@k@v13/30400012. Embarrassing? Embarrassing?"'
15247: 'Battler@r@v10/30100035."......Yeah.@k@v10/30100036. Horribly embarrassing..."'
15248: 'Battler@r@v10/30100037."Maria, I''m sure that when you are in middle school, you''ll want to say embarrassing things like that...@k@v10/30100038. When that happens, write it on the back of some leaflet first, and read it three times before you decide to say it out loud.@k@v10/30100039. If you don''t, you''ll definitely regret it..."'
15249: 'Battler@r@v10/30100040."Still, everyone has to pass through that painful period...@k@v10/30100041. That''s right, that''s how you know your place, learn shame, and become an adult.@k@v10/30100042. Yes, this is a memory I want to disappear, the bittersweet kind of thing that everyone does in adolescence as they transition to becoming adults...@k@v10/30100043. Aaaaarrggh..."'
15250: '@rYou see, I tend to let my mouth run wild without thinking too much, so I don''t remember all the details of everything I say.'
15251: '@rBut when the contents are recited back to me afterwards, it''s always something extremely embarrassing.'
15252: '@rIn recent years, I have finally come to understand this weakness, and have been working hard to refrain from such careless outbursts, but......'
15253: '@r...It seems I was just born with the habit of speaking without thinking, and there isn''t a whole lot I can do about it.'
15254: 'Jessica@r@v04/30200021."Shanno~n, do you remember any other embarrassing things?"'
15255: 'Shannon@r@v15/30500010."Yes, well... I remember various other things, but...@k@|@y@v15/30500011.......since it looks like the person in question wants to forget them, I think I will refrain from saying any more..."'
15256: 'Battler@r@v10/30100044."To be blunt, there''s nothing else I remembe~r.@k@v10/30100045. Please don''t remind meeee."'
15257: 'Maria@r@v13/30400013."...Uu.@k@v13/30400014. Shannon''s bullying Battler...?@k @|@y@v13/30400015.Uu.@k@v13/30400016. Bad.@k@v13/30400017. Bullying is bad."'
15258: 'George@r@v07/30300018."Hahahahaha. She isn''t really bullying him.@k@v07/30300019. Let''s leave it at that, okay?"'
15259: 'George@r@v07/30300020."But Shannon, you''ll have tell me all about it sometime Battler-kun isn''t around.@k@|@y@v07/30300021. It sounds pretty interesting."'
15260: 'Shannon@r@v15/30500012."Yes, certainly."'
15261: 'Battler@r@v10/30100046."N-noooo, you can''t, Shannon-chaaaaaaaaaan...!!"@|@y'
15262: '@rFor a while, George-aniki teased me by pretending to ask Shannon-chan for more of my embarrassing misspeaks.'
15263: '@rGeorge-aniki was messing around teamed up with Shannon-chan,@k ......but he seemed, how to describe it, very candid and frank.'
15264: '@rHe was always frank with his cousins, but he usually took on a reserved, gentlemanly attitude when he came in contact with the servants.'
15265: '@r...When I thought about it, I got the feeling that he was acting a little overly familiar, which seemed slightly weird.'
15266: '@rMaria started scribbling in the sand with a stick,@k and George-aniki and Shannon-chan joined in, which left me and Jessica off to the side, so I asked her secretively.'
15267: 'Battler@r@v10/30100047."......Hey, Jessica.@k@v10/30100048. Is George-aniki, ......umm, going out with Shannon-chan?"'
15268: 'Jessica@r@v04/30200022."Ooooh?@k @v04/30200023.What the, how did you notice?!@k @|@y@v04/30200024.Battler, you''ve got more of an eye for people than I thought."'
15269: 'Battler@r@v10/30100049."Huh, ...whaaaaaaah?!@k @|@y@v10/30100050.I was just kidding -  They''re actually going out?!"'
15270: 'Jessica@r@v04/30200025."Shhh!@k @v04/30200026.Your voice is too loud!@k @|@y@v04/30200027....They are actually keeping it secret for now, apparently, alright?@k @v04/30200028.It''d be better if nobody heard about it, especially Auntie Eva."'
15271: 'Battler@r@v10/30100051."I, I see...@k@v10/30100052. Love with a servant..."'
15272: 'Battler@r@v10/30100053."...Y-yeah, but, since when?@k @v10/30100054.Wowww, a lot can happen in six years......@k@v10/30100055. But still, Aniki really is talented, and Shannon-chan is kind and spirited...@v10/30100056. ......They might be a pretty good match."'
15273: '@rActually, six years ago, I remember taking notice of her just a little bit.'
15274: '@rSo that''s how it is... She really fits well with George-aniki... Nothing I can do about that.@k ...Goodbye, my fleeting first love of six years ago...'
15275: '@r.........Which means that...my collection of embarrassing lines that Shannon-chan just held back on...@k...probably has something to do with that...@k Aaaaaaaaaaarrghh, I can''t take it...'
15276: 'Battler@r@v10/30100057."How long have they been going out?"'
15277: 'Jessica@r@v04/30200029."That depends on what you call going out, but I''d say it''s definitely been at least a year.@k@|@y@v04/30200030. If you count the time before either of them confessed, it''d be several years, I guess."'
15278: '@rBefore I''d realized it, the two of them had separated themselves from the group, and were walking down the beach, talking about something.'
15279: '@r......They looked calm,@k and rather than a light relationship between two lovers, it looked like a more serious relationship, as though they were already engaged.'
15280: 'Battler@r@v10/30100058."......Six years...@k@v10/30100059. That''s a long-ass time."'
15281: 'Battler@r@v10/30100060."What did these six years mean to me?@k @v10/30100061.I''ve just gotten taller.@k@v10/30100062. It was just a waste of time, six years I spent obstinately fighting with my dad."'
15282: 'Jessica@r@v04/30200031."What about you, Battler?@k@v04/30200032. Have you gotten a girlfriennnd?"'
15283: 'Battler@r@v10/30100063."Hmm, I wonder.@k@v10/30100064. There''s a lot of girls that I play with.@k@v10/30100065. But I don''t have that "special one" yet.@k@v10/30100066. ......I''m probably just a kid.@k@v10/30100067. I think it''s more fun to be noisy with a large group of people than being alone with one person."'
15284: 'Jessica@r@v04/30200033."Aah, that''s so you, Battler.@k@v04/30200034. But take your relationships with your female friends seriously."'
15285: 'Jessica@r@v04/30200035."Girls can be scary with their communities and their wrong impressions, okay?@k @v04/30200036.There could be some secret feud going on over you, and someone might be crying or being hurt without you noticing it, you know?"'
15286: 'Battler@r@v10/30100068."That''s so weird.@k@v10/30100069. I think I got the same bit of advice from one of the girls in my class just last week.@k@v10/30100070. ......What''s with that?@k@v10/30100071. Why can''t we all have fun together?@k@v10/30100072. Do they all really want to find a special person that badly?"'
15287: 'Jessica@r@v04/30200037."...It''s probably because you''ve never had a partner like that, Battler.@k@v04/30200038. Well, you''ll probably run into a girl like that at some point.@k@v04/30200039. Just gotta wait it out!"'
15288: 'Battler@r@v10/30100073."What?@k@v10/30100074. It sounds almost like you''ve already found a partner like that.@k@v10/30100075. What about you?@k@v10/30100076. Have you gotten a boyfriend?"'
15289: 'Jessica@r@v04/30200040."Huh?!@k @v04/30200041.M-me?!@k @v04/30200042.No, err, wahahahahaha......"'
15290: 'Battler@r@v10/30100077."Come on, that reaction''s so easy to understand...@k@v10/30100078. From the looks of it, there''s some boy who you''re thinking about, but you haven''t been able to confess that to him yet, something like that."'
15291: 'Jessica@r@v04/30200043."N-no, umm, that''s not, umm, uh!@k @v04/30200044.C-cram it, jackass, who cares about me...!"'
15292: 'Battler@r@v10/30100079."You''re the one who brought up this subject, why do you have to go and get mad at me?@k@v10/30100080. Women are creatures who always ask questions, and yet, they almost never answer them.@k@v10/30100081. What cruel creatures, seriously."'
15293: 'Jessica@r@v04/30200045."......W-well, okay, umm.@k@v04/30200046. ...I did try...@v04/30200047....to confess once.@k@v04/30200048. Well, umm, I struck out pretty badly."'
15294: 'Battler@r@v10/30100082."Did they say "Sorry"?"'
15295: 'Jessica@r@v04/30200049."No, umm, ......@k@v04/30200050....well, umm, it was really one-sided and they were just, like, taken aback, I guess...@k@v04/30200051. It was like they didn''t even view me that way."'
15296: 'Battler@r@v10/30100083."I can understand that.@k@v10/30100084. You talk just like a man.@k@v10/30100085. If you don''t act a little more elegant, you won''t be able to entice a man''s heart, you know?"'
15297: 'Jessica@r@v04/30200052."I-i-is it really...@v04/30200053. ......Is the way I speak...@v04/30200054....really that bad?"'
15298: 'Battler@r@v10/30100086."...Hmm?@k @v10/30100087.Well, uhh, how you talk isn''t everything, but if someone like you, who usually talks badly,@k@v10/30100088. suddenly started making an effort to talk nicely, umm, that takes courage, and that might really get some guys'' hearts thumping, maybe."'
15299: 'Jessica@r@v04/30200055."R-really...?@k @v04/30200056.I see......@v04/30200057. ......Yeah..."'
15300: '@rJessica had suddenly started speaking meekly, and was faintly blushing.'
15301: '@r...I see, even though her confession didn''t go well, it looks like she still hasn''t given up.'
15302: '@rBut yeah...I totally get that.@k After seeing how close George-aniki and Shannon-chan have gotten, it''s no wonder she''d start wanting a boyfriend.'
15303: '@rSix years.@k ...Those six years of puberty are pretty important, and they go by so fast.'
15304: '@rWith the typhoon approaching, the clouds had grown steadily grayer, and yet, even so, I had this really refreshing feeling.'
15305: '@r...Maybe I''ll start thinking more seriously about the opposite sex, more than just the size of their boobs...'
15306: 'Battler@r@v10/30100089."By the way,@k@v10/30100090. I know George-aniki is going out with a servant, Shannon-chan.@k@v10/30100091. ......Not you as well, right?"'
15307: 'Jessica@r@v04/30200058."Huh, ...eeeeeeh?!?!@|@y@k @v04/30200059.Wh-wh-wh-wh-why do you think that...?!"'
15308: 'Battler@r@v10/30100092."Come to think of it, that young kid Kanon-kun, who greeted us in the rose garden.@k@|@y@v10/30100093. You covered for him quite a bit just considering he was bad at talking, didn''t you?"'
15309: 'Jessica@r@v04/30200060."N-no, that''s not...@k@v04/30200061. Wahahahaha, you''re too suspicious...!!"'
15310: 'Battler@r@v10/30100094."Then tell me just this one thing.@k@v10/30100095. Right now,@k@v10/30100096. is the boy you''re after somewhere within one kilometer?"'
15311: 'Jessica@r@v04/30200062."W-well, that''s, umm, ...I, I, I dunno..."'
15312: '@rKanon-kun is the only boy on this island now who could possibly become her boyfriend.@k So judging by her reaction, I''m probably right on.'
15313: '@rI don''t think of the Ushiromiya family as a noble family, but...two people in love with servants...@k I''d never have dreamed that two pairs of Romeo and Juliet would be right next to me...'
15314: '@rAuntie Eva will probably become an obstacle to George-aniki and Shannon-chan''s love.'
15315: '@rIf Auntie Eva learns that the partner of her only son, the apple of her eye, is Shannon-chan,@k she''ll probably scream at her with cries of wretched servant, homewrecker, and so forth.'
15316: '@rAnd a relationship between Jessica and Kanon-kun would probably be just as full of difficulties.@k@rAunt Natsuhi also seemed the type to be strict about that kind of thing.'
15317: '@r......After all, Jessica''s husband would probably become the head of the Ushiromiya family in the future.@k If that person had once been a servant working for the family, ......well, no doubt things would be complicated.'
15318: 'Battler@r@v10/30100097."Well, everyone finds their own way in love.@k@v10/30100098. Who cares, as long as you find someone you enjoy being with?"'
15319: 'Battler@r@v10/30100099."Being with someone doesn''t require any permission as long as the two people accept each other.@k@v10/30100100. If you worry about your parents or your family, then you lose.@k@v10/30100101. Don''t forget that.@k@v10/30100102. You can''t go out with someone with half-hearted feelings."'
15320: 'Jessica@r@v04/30200063."...Heh...@k@v04/30200064. I can''t believe you''re saying something so philosophical-sounding when you''ve never ever been in love."'
15321: 'Battler@r@v10/30100103."Don''t treat love like a matter of profit and loss.@k@v10/30100104. It''s about <heart>.@k@v10/30100105. That''s all I want to say.@k@v10/30100106. Well then,@v10/30100107.@|@y <see you again, have a nice day>."'
15322: 'Jessica@r@v04/30200065."......Pf,@v04/30200066. ...wahhahhahahahahahahahahaha!!@|@y@k @v04/30200067.George nii-san, Shanno~n, listen, listennn!@k @v04/30200068.This guy, he''s said another one of those lines!!"'
15323: 'Battler@r@v10/30100108."I didn''t say anything, I didn''t say anything!!@k @v10/30100109.Waaah, don''t make fun of me, don''t make fun of me!!"'
15324: 'Maria@r@v13/30400018_b."I heard, I heard!@k @v13/30400019_b.<See you aga~in>, <see you aga~in>!!"'
15325: '@rFor a while, we forgot about the wind getting stronger, and played around on the beach.'
15326: '@r......This meeting with my cousins, who had grown so much over these last six years and were thoroughly enjoying their youth, felt truly refreshing.'
15327: '@r......It was a little late now, but I realized that I should have buried the hatchet a lot sooner, and returned to the Ushiromiya family...'
15328: 'Battler@r@v10/30100110."It sure is nice to spend time together as cousins every once in a while..."'
15329: 'Maria@r@v13/30400020."Uu!@k @v13/30400021.I like it with all the cousins together, it''s funnn!"'
15330: 'Battler@r@v10/30100111."That''s right.@k@v10/30100112. We''re already old enough.@k@v10/30100113. It''s not like we couldn''t meet each other when our parents aren''t around.@k@v10/30100114. ...It might not be a bad idea for just us cousins to meet up and play every once in a while."'
15331: 'George@r@v07/30300022."That''s a good plan.@k@v07/30300023. Maybe we should set up something like that someday."'
15332: 'Jessica@r@v04/30200069."I agree.@k@v04/30200070. I''d like for us cousins at least to always be friendly with each other."'
15333: 'Battler@r@v10/30100115."Hey, hey, if you put the emphasis there, doesn''t that make it sound like our normal families don''t get along well?"'
15334: 'George@r@v07/30300024."Hahahahahaha."'
15335: '@rGeorge-aniki and Jessica laughed, but it felt just a little strained.@k ...Did I say too much?'
15336: '@rJudging by how our parents had made quiet expressions and tired faces every once in a while during the boat ride and at the airport, maybe that was something I shouldn''t have said.'
15337: 'Battler@r@v10/30100116."...That''s right.@k@v10/30100117. Just like Jessica said.@k@v10/30100118. Let''s always be friendly with each other."'
15338: 'Maria@r@v13/30400022."Uu!@k @v13/30400023.Me too!@k @v13/30400024.Everyone friendly!!"'
15339: 'George@r@v07/30300025."That''s right.@k@v07/30300026. Yeah.@k@v07/30300027. We''ll always be together.@k@v07/30300028. We''ll always be friendly."'
15340: 'Jessica@r@v04/30200071."Heheh.@k@v04/30200072. Man, we''ve been saying some pretty embarrassing stuff.@k@v04/30200073. I feel kinda awkward."'
15341: 'Shannon@r@v15/30500013."But I think that is very important.@k@v15/30500014. It''s very hard for people to always be friendly, let alone always be together, unless they wish for it."'
15342: 'George@r@v07/30300029."That''s right.@k@v07/30300030. You really can''t take everyone being friendly for granted."'
15343: 'Maria@r@v13/30400025."Uu.@k@v13/30400026. A witch I know said it.@k@v13/30400027. Happiness won''t be granted unless everyone believes in it."'
15344: 'George@r@v07/30300031."That''s true.@k@v07/30300032. Maybe some magic exists in the power of belief.@k@v07/30300033. If we all believe in that, I''m sure it will bring us happiness."'
15345: 'Jessica@r@v04/30200074."Alright.@k@v04/30200075. Now the next embarrassing thing.@k@v04/30200076. Let''s all swear to believe together, alright?@k @v04/30200077.That we''ll all always be friendly, that we''ll always be happy."'
15346: '@rScrew becoming like our parents.'
15347: '@rSearching for each other''s weaknesses, going after Grandfather''s fortune, screw all that forever...'
15348: 'Battler@r@v10/30100119."Alright!@k @v10/30100120.We''ll always be friendly and happy.@k@v10/30100121. And let''s all believe that."'
15349: '@rNo matter how long it had been, or how much fun we were having, it didn''t stop the dark clouds from approaching Rokkenjima.'
15350: '@r......I wonder if the typhoon will pass and show us the refreshing sky before we leave this island.'
15351: '@rWho gives a crap about what our parents are plotting?@k@rWho gives a crap about the inheritance and the honor of our old family?'
15352: '@rWe''re so young, and renewing our old friendship.@k@rAnd every one of us believes together that we can all be happy.'
15353: '@rSo...@w500.I want this day to end,@w250. without anything weird occurring,@w333. in peace and happiness,@w416. calmly...'
15354: '@rNo, ...not "I want it to end".@k@r......Please, let it end......!'
15355: 'BEATRICE@r@v27/30700092.@["In your dreeeeeeeeeeeams!@]@|@y@k@r@|@y@v27/30700093.Kyah-hahah-hah-hah-hahahahahahahahahahaha!!"'
15356: 'Battler@r@v10/30100122."Damn iiiiiiiit!!@k @v10/30100123.Don''t show up, don''t appear!!@k @v10/30100124.Damndamndaaamn!!"'
15357: 'BEATRICE@r@v27/30700094."Sorry to keep you waiting.@k@v27/30700095. The new game has finally been prepared."'
15358: 'BEATRICE@r@v27/30700096."Come, let us begin this tale of tragedy!@k @v27/30700097.Come to me, rain, winds, typhoon!@k @v27/30700098.Cut this island off from the real world!!@k @v27/30700099.Throw Rokkenjima into another world, into the netherworld, into a world of fantasy!"'
15359: '@rAnd so, the tale repeated for the third time.'
15360: '@rHowever, before the Endless Witch,@k what point was there in counting one, two, three?'
15361: '@rThere was probably no point at all.'
15362: '@rAfter all, this tale of fantasy would be repeated endlessly, until the match was settled, and either Battler or the witch surrendered.'
15363: '@rAnd the sky grew dark and cloudy, the rain and wind were summoned together and became a typhoon...'
15364: '@rAnd Maria could be seen in the rose garden, paying no mind to the rain that had started falling,@k going around in circles, searching for that single rose which she had surely marked......'
15365: 'Maria@r@v13/30400028.".........Not here...@k@v13/30400029. Not here......@k@v13/30400030. The rose we marked,@v13/30400031. ......my rose isn''t here...@k@v13/30400032. ......Uu.@k@v13/30400033. ............Uu!!"'
15366: '@rMaria definitely remembered it.'
15367: '@rThat rose had been in the flower bed right here.@k And yet, it wasn''t.'
15368: '@rShe didn''t know what to do with her irritation at not being able to find something which should have been there,@k and, moaning bitterly, she couldn''t help but keep going back and forth in circles around the same spot.'
15369: '@rShe was acting almost as though she would be able to see it if she looked at a different angle,@k but try as she might, there was no way she would find something that wasn''t there...'
15370: '@rThe wind grew increasingly stronger, and the rain turned into cold, large drops.@k@rThere was no way Maria wasn''t bothered by this.'
15371: '@rHowever, if she couldn''t find her rose here, it would surely disappear forever.'
15372: '@r...Maria believed that.@k That feeling spurred her on to keep searching for a rose that she had no chance of finding...'
15373: '@rJust then, the cold drops of rain that were tormenting Maria were suddenly blocked.'
15374: 'Maria@r@v13/30400034."..................Uu?"'
15375: '@rMaria raised her head.@k ...When she did, she saw that an umbrella was opened there, protecting her from the rain...'
15376: '@rAnd the one holding out that umbrella was...@k@|@y......the witch she admired, BEATRICE.'
15377: 'Maria@r@v13/30400035."BEATRICE...!!"'
15378: 'BEATRICE@r@v27/30700100."What are you doing so frantically in the middle of all this rain?@k@v27/30700101. You could catch a cold like this.@k@v27/30700102. Even witches have to care for their own health."'
15379: 'Maria@r@v13/30400036."My...@v13/30400037. ...My rose...@v13/30400038. I can''t find it...@k@v13/30400039. ......Uu.@k@v13/30400040. No matter how many times I search,@v13/30400041. ......even though it was definitely here,@v13/30400042. ...can''t find it..."'
15380: '@rMaria told BEATRICE about how there had been a slightly unhealthy, pitiful rose,@k and that she was sure they had marked it.'
15381: 'BEATRICE@r@v27/30700103."Hohoh.@k@v27/30700104. And you can''t find it.@k@|@y@v27/30700105. .........If you are a witch apprentice, you should use magic to search for the rose.@k@v27/30700106. I believe that as long as you search with merely your eyes, it won''t be nearly enough."'
15382: 'Maria@r@v13/30400043."......Uu.@k@v13/30400044. ......Can''t find it.@k@v13/30400045. ...I did my best, and tried to search with magic, but can''t find it..."'
15383: 'BEATRICE@r@v27/30700107."While this is certainly ideal for practicing your magic, it might be a little too much for you with all of this wind and rain.@k@|@y@v27/30700108. ......Allow me to lend you some special power.@k@v27/30700109. Concern for one''s disciples is also among the duties of a master."'
15384: 'Maria@r@v13/30400046."Tha-...thank youuu.@k@v13/30400047. BEATRICE!!"'
15385: '@rMaria''s face, which had been full of sadness until just now, split open into a grin.'
15386: '@rMaria knew.@k She knew that there was nothing BEATRICE''s magic couldn''t do.'
15387: '@rSo she was sure that BEATRICE would easily be able to find the rose that she couldn''t find herself...'
15388: '@rBEATRICE closed her eyes lightly, acting as though she was listening for something in all this wind and rain.@k Then she heard it, opened her eyes, and spoke.'
15389: 'BEATRICE@r@v27/30700110."............Hmm.@k@v27/30700111. All things in this world are transitory.@k@v27/30700112. It is unfortunate, Maria.@k@v27/30700113. ...It seems that your rose couldn''t withstand all of this wind and rain."'
15390: 'Maria@r@v13/30400048."Uu......@k@v13/30400049. Then, my rose is.........?"'
15391: 'BEATRICE@r@v27/30700114."It was uprooted by the wind, and is no longer of this world."'
15392: 'Maria@r@v13/30400050."..................Uu......"'
15393: '@rWhat BEATRICE had said was certainly plausible.@k ...There was nothing odd about the flower being broken off at the stem in this strong wind.'
15394: '@r...However, Maria couldn''t accept this, and bitterly gave a low-pitched moan...'
15395: 'Maria@r@v13/30400051."...............No."'
15396: 'BEATRICE@r@v27/30700115."Hoh?"'
15397: 'Maria@r@v13/30400052."......No no no!@k @v13/30400053.It''s my rose!!@k @v13/30400054.My rose has to come back!@k @v13/30400055.I''ll bring it back to life with my magic."'
15398: 'Maria@r@v13/30400056."BEATRICE, teach me how to revive a rose with magic...!!"'
15399: 'BEATRICE@r@v27/30700116."Ha!@k @v27/30700117.It''s much too early for an apprentice like you to learn the hidden art of Endless Magic.@k@v27/30700118. Know your place."'
15400: 'Maria@r@v13/30400057."..................Uuuu."'
15401: '@rMaria wiped the tears from her eyes, full of regret.'
15402: '@rSeeing that expression, which so invited pity, BEATRICE shrugged her shoulders and chuckled.'
15403: 'BEATRICE@r@v27/30700119."Very well.@k@v27/30700120. I will lend you power for the hidden art that can revive a rose."'
15404: 'Maria@r@v13/30400058."Really?!"'
15405: 'BEATRICE@r@v27/30700121."Yes.@k@v27/30700122. ......Well then, concentrate the power of your heart.@k@v27/30700123. Close your eyes, forget the rain, forget the wind, search for the soul of the wandering rose with the eyes of your heart."'
15406: 'Maria@r@v13/30400059."......Uu."'
15407: '@rMaria closed her eyes.@k@rThen, she repeated BEATRICE''s poem-like words...'
15408: 'BEATRICE@r@v27/30700124."Come, try to remember.@k@v27/30700125. Rose, what form did you have?"'
15409: 'Maria@r@v13/30400060."...Come, try to remember.@k@v13/30400061. Rose, what form did you have...?"'
15410: 'BEATRICE@r@v27/30700126."Don''t look.@k@v27/30700127. Don''t listen.@k@v27/30700128. And believe.@k@v27/30700129. ......Release the power of your soul from the cage of flesh that imprisons it.@k@v27/30700130. ............That''s it.@k@v27/30700131. ......Good..."'
15411: '@rAround Maria, who was concentrating her power, her eyes tightly shut, small golden butterflies began to dance.@k ......Was this the manifestation of the magical power Maria held?'
15412: 'BEATRICE@r@v27/30700132."Lost soul of the rose.@k@v27/30700133. Gather into one, and remember your form.@k@v27/30700134. ......Come, gather, remember..."'
15413: '@rThe glitter of the gold butterflies began to strengthen, and their numbers increased; then, BEATRICE raised a finger up to the skies, and they began to gather at the tip of that finger...'
15414: '@rThis was the miracle of the golden magic...'
15415: '@rAnd the gold butterflies began to condense into a single dazzling grain of gold.@k ......It was a single seed, glittering gold.'
15416: '@rIt sat on the tip of BEATRICE''s finger, budded into a golden sprout, and opened into a golden leaf.@k It then slowly fell from that fingertip, sank into the mud of the flower bed, and began to grow steadily...'
15417: '@r...Maria, who admired magic and witches, must have really wanted to see this fantastical sight.'
15418: '@rHowever, as an apprentice, Maria was still not qualified to see it.'
15419: '@r...No, she was probably afraid that, if she opened her eyes to look, the power of her heart''s concentration would be interrupted, and the magic would be lost.'
15420: '@rTherefore, it was BEATRICE, the one permitted to lay eyes on that golden miracle,@k who was the one and only witch, and the master of many miracles...'
15421: '@rThen, the fully grown rose bloomed, creating one golden flower.'
15422: '@rAnd when BEATRICE poked it with her finger in just the right way,@k the gold-colored sparkles scattered, just as if a golden soap bubble had popped, and what remained was a single beautiful rose.'
15423: 'BEATRICE@r@v27/30700135."...Mmhm.@k@v27/30700136. It looks like you''ve remembered a splendid rose."'
15424: 'BEATRICE@r@v27/30700137."......However, if we just leave it mixed in with these other roses, you won''t be able to tell it apart.@k@v27/30700138. Shall I perform one last service?"'
15425: '@rBEATRICE, for the sake of her cute apprentice witch who was moaning even more now in concentration,@k decided to cast one more little spell.'
15426: '@rShe snapped her fingers, and a single gold butterfly appeared, fluttered around, and landed on the flower that had just been revived.'
15427: '@rThen it suddenly burst open and disappeared, becoming golden lace and marking the rose...'
15428: 'BEATRICE@r@v27/30700139."That is sufficient.@k@v27/30700140. ......Maria.@k@v27/30700141. You may open your eyes now."'
15429: 'Maria@r@v13/30400062.".........Uu?@k @v13/30400063.Where''s the rose?@k @v13/30400064.Not here.@k@v13/30400065. Not here."'
15430: 'BEATRICE@r@v27/30700142."Not over there, over here.@k@v27/30700143. ...Look.@k@v27/30700144. I have marked it with golden lace."'
15431: 'Maria@r@v13/30400066."Wow... You did...!!@k @v13/30400067.Awesome awesome awesome awesome!!@k @v13/30400068.Thank you Beato, thank you Beato!!@k @v13/30400069.I want to become a witch quickly, a Great Witch like Beato!!"'
15432: 'BEATRICE@r@v27/30700145."And you can.@k@v27/30700146. Long ago, I too wished for that innocently, just as you do, and I have attained that level."'
15433: '@rMaria was ecstatic over the revived rose, clapping her hands and jumping around in joy.'
15434: '@r...Watching that, BEATRICE also smiled, looking fairly pleased.'
15435: '@rNow, if I try, I can break or repair any soul, not just that of a rose, and kill and revive as I please.'
15436: '@rSo, the barrier created by the storm has closed Rokkenjima off from the real world.'
15437: '@rNow is the time for the Golden Witch, the Endless Witch, BEATRICE to descend.'
15438: '@rBEATRICE pulled from her pocket an envelope with the family crest, the One-winged Eagle, and gave it to Maria.'
15439: '@rMaria frolicked around at being selected to be the witch''s messenger.'
15440: 'BEATRICE@r@v27/30700147."So, Kinzo.@k@v27/30700148. I''ve come to join in on your fun once again...@k@v27/30700149. My preparations are already complete.@k@v27/30700150. What about you?@k @v27/30700151.I assume you have prepared enough coins to bet in tonight''s game...?"'
15441: 'Kinzo@r@v01/31500060."Naturally, I am fully prepared, BEATRICE...!!@k @v01/31500061.I have prepared pieces in abundance.@k@v01/31500062. I am ready both physically and mentally!"'
15442: 'Kinzo@r@v01/31500063."So, let me pay the ante.@k@v01/31500064. All that you have given should be returned to you in the end.@k@|@y@v01/31500065. Now, take it!!"'
15443: '@rKinzo flung the window of his study wide open, took off the reasonably large golden ring which had been on his finger,@k and threw it into the darkness of the raging wind and rain...'
15444: '@rThat ring was struck by lightning, and after twinkling gold for an instant, disappeared.'
15445: '@rKinzo watched it go, grinning broadly and fearlessly.'
15446: 'Kinzo@r@v01/31500066."I don''t see myself losing.@k@v01/31500067. You are mine.@k@v01/31500068. Forever!!"'
15447: '@rThe ring that Kinzo had thrown became a single gold butterfly, and fluttered around in the wind and rain.'
15448: '@rIt headed for the rose garden, almost as though it was being guided there.'
15449: '@rIt then found the figure of the Golden Witch, and fluttered down......'
15450: '@rWhen it arrived right in front of BEATRICE,@k it burst in a flash of gold, and returned to its original form of a ring, flipping up into the air.'
15451: '@rIt seemed as if it would simply fall back down into a puddle of water, but suddenly it stopped in midair.@k ...Almost as if some transparent person had caught it.'
15452: '@rSomehow, this seemed unexpected even to BEATRICE.'
15453: '@rHowever, she soon realized what - who - it was, and grinned broadly at it.'
15454: '@rAs she did, the figure of the person who had caught the ring began to fuzzily appear...'
15455: '@rIt was the figure of a young man wearing a butler''s uniform embroidered with the One-winged Eagle crest...'
15456: '@rThere was no man like this among the servants who served the Ushiromiya family.@k@rEven so, BEATRICE laughed as though it was someone she remembered fondly.'
15457: 'BEATRICE@r@v27/30700152."Ronove, is it.@k@v27/30700153. ......It''s been quite some time.@k@v27/30700154. It seems that you have remembered me.@k@v27/30700155. You always were a man who was serious about loyalty."'
15458: 'Ronove@r@v31/33100001."It has been a very long time since you last corresponded...@k@v31/33100002. There has not been a single day that I, Ronove, have forgotten that I serve you, Milady."'
15459: 'Ronove@r@v31/33100003."Indeed, I was more fearful that you had forgotten about me, Milady.@k@v31/33100004. I have, after all, known you to be quite forgetful."'
15460: 'BEATRICE@r@v27/30700156."*cackle*cackle*...!@k @v27/30700157.I see, yes, it seems I do forget easily.@k@v27/30700158. I couldn''t even remember your wry speech until I heard it again."'
15461: 'Ronove@r@v31/33100005."For you, Milady."'
15462: '@rWith an exaggerated yet elegant gesture, he bowed respectfully,@k and held out to BEATRICE the Head''s Ring that he had just caught.'
15463: 'Ronove@r@v31/33100006."It is the Ushiromiya family Head''s Ring, returned to you from Ushiromiya Kinzo.@k@v31/33100007. It is now, once again, in the possession of its master."'
15464: 'BEATRICE@r@v27/30700159."Indeed.@k@v27/30700160. The proclamation by Kinzo that the game has started.@k@v27/30700161. I acknowledge receipt."'
15465: 'Ronove@r@v31/33100008."So, how would you like to play tonight?@k@v31/33100009. Shall I prepare the roulette immediately?@k @v31/33100010.Or shall I prepare some black tea first?"'
15466: 'BEATRICE@r@v27/30700162."Both sound attractive, but for now, I suspect I need you to greet someone.@k@v27/30700163. I am quite sure that man has his mouth hanging open and can''t shut it.@k@|@y@v27/30700164. Right, Battler?"'
15467: 'Ronove@r@v31/33100011."Greetings.@k@v31/33100012. Allow me to introduce myself.@k@|@y@v31/33100013. I am called Ronove, and I serve at the side of Milady BEATRICE.@k@v31/33100014. It is truly a pleasure to meet you."'
15468: 'BEATRICE@r@v27/30700165."See?@k @v27/30700166.His mouth''s hanging open and he can''t shut it, right?@k @v27/30700167.*cackle*cackle*!"'
15469: 'Battler@r@v10/30100125."Isn''t that obvious, another incomprehensible guy''s just appeared!!@|@y@k @v10/30100126.I grumbled that goat-headed people would start doing the Bon dance, and then goat-heads started showing up in swarms,@k@v10/30100127. and since then, not only have those seven sexy-assed babes appeared, but now even a butler has goddamn shown up!!@k @v10/30100128.It doesn''t make sense, cut it out!!"'
15470: 'BEATRICE@r@v27/30700168."By the way, Battler.@k@v27/30700169. Did you notice?@k @v27/30700170.Have you realized that your meeting him...is a true "Devil''s Proof"?"'
15471: 'Battler@r@v10/30100129."A, a Devil''s Proof...?!@k @v10/30100130.What do you mean...?"'
15472: 'BEATRICE@r@v27/30700171_b."He may not look like it, but this guy is a genuine demon, with his name amongst the 72.@k@v27/30700172. In other words, I''ve brought a demon right in front of you, which truly proves that they exist."'
15473: 'BEATRICE@r@v27/30700173."*cackle*cackle*cackle*cackle*!!@k @v27/30700174.Ronove holds a noble rank in Hell, the 27th highest-ranked Great Demon.@k@v27/30700175. He''s a pretty useful man.@k@v27/30700176. I summoned him at high cost and made him serve me."'
15474: 'Ronove@r@v31/33100015."It is an honor to be introduced to you.@k@|@y@v31/33100016. While my name is amongst those of the nobles of Hell,@k@v31/33100017. I now serve as the head furniture of BEATRICE-sama, vulgar Human and Great Witch from whom even demons would flee in fear."'
15475: 'BEATRICE@r@v27/30700177."*cackle*cackle*cackle*cackle*. He''s a very useful man, but he is impudent with his words.@k@v27/30700178. It''s slightly frustrating that he sometimes forgets to respect his master."'
15476: 'Ronove@r@v31/33100018."There is nothing in my contract regarding the way in which I must speak.@k@v31/33100019. Would you like to change that contract?"'
15477: 'BEATRICE@r@v27/30700179."It doesn''t bore me, so it''s fine.@k@v27/30700180. *cackle*cackle*!"'
15478: '@rBEATRICE turned her back to him, cackling.'
15479: '@rAfter bowing once to her back, Ronove turned back to Battler and stuck out his right hand, showing off an innocent smile.@k Normally, this would mean that he was asking for a handshake.'
15480: 'Battler@r@v10/30100131."......Wh-...what is this supposed to be?"'
15481: 'Ronove@r@v31/33100020."I am also one who has been subjected to Milady''s whims.@k@v31/33100021. In that sense, I am sure that we could become good friends.@k@v31/33100022. This is a handshake of friendship."'
15482: 'Ronove@r@v31/33100023."......Of course, it does not mean that you will be entered into a demon''s contract, so rest assured."'
15483: 'Battler@r@v10/30100132."Sorry, but I''m right in the middle of a big fight with your master.@k@v10/30100133. I only shake hands with an enemy after one of those situations like you find in teen dramas, when we''ve beaten each other up in a rainy schoolyard and are all worn out.@k@v10/30100134. Remember that."'
15484: 'Ronove@r@v31/33100024."I see.@k@v31/33100025. Then, to shake hands with you, Battler-sama, I must create a fitting atmosphere in a suitable location,@k@v31/33100026. and we must exchange body language and sweet words that ring true to the heart.@k@v31/33100027. I will find a suitable opportunity to prepare such a location."'
15485: 'Ronove@r@v31/33100028."I too looove those kinds of situations, you know?@k@|@y @v31/33100029.Pu ku ku ku...!"'
15486: '@rLaughing tauntingly, Ronove whispered that to Battler, with his face so close that their noses were almost touching.'
15487: '@rBattler, his face turning red after getting so close to another of the same sex, pushed him away.'
15488: 'Battler@r@v10/30100135."Y-you''re a creepy bastard...@k@v10/30100136. I see, just right for Beato''s butler..."'
15489: 'Ronove@r@v31/33100030."It is an honor to receive such words of praise.@k@v31/33100031. I am very confident in my tea brewing abilities, so please look forward to tea time.@k@v31/33100032. Baking cookies is one of my hobbies, so I encourage you to have high expectations for the teacakes and such."'
15490: 'BEATRICE@r@v27/30700181."Just what I would expect from a pair of the same gender.@k@v27/30700182. You''ve started to get along well very quickly.@k@|@y@v27/30700183. I''m jealous."'
15491: 'Ronove@r@v31/33100033."My, my.@k@v31/33100034. I apologize most humbly for making you jealous, Milady.@k@v31/33100035. I will not stealthily snatch your guest away from you."'
15492: 'Ronove@r@v31/33100036."Well then, I will leave for now to greet the rest of the furniture and inform them that I have retaken my post as head furniture.@k@v31/33100037. Please forgive my short absence."'
15493: 'BEATRICE@r@v27/30700184."Mmhm.@k@v27/30700185. Only the common goats and the Seven Sisters used for the ritual have manifested themselves.@k@v27/30700186. You will be able to finish up greeting them with ease."'
15494: 'Ronove@r@v31/33100038."Oh?@k@v31/33100039. Those lively Seven Sisters are here?@k@v31/33100040. I wonder whether those naughty girls have grown a little more graceful?"'
15495: 'Battler@r@v10/30100137."......Ihihi.@k@|@y@v10/30100138. If that''s graceful, I''d have to doubt the definition of graceful."'
15496: 'Ronove@r@v31/33100041."Is that so?@k@v31/33100042. It seems that you have already enjoyed some playtime with the Seven Sisters."'
15497: 'Ronove@r@v31/33100043."Judging by your expression, it seems that they are just as naughty as they were before.@k@v31/33100044. Even though I am always telling them to act more fitting as a group of those who serve BEATRICE-sama.@k@v31/33100045. What troublesome kids..."'
15498: 'Battler@r@v10/30100139."If that''s your problem, don''t worry.@k@v10/30100140. They actually act perfectly fitting for their master..."'
15499: 'BEATRICE@r@v27/30700187."*cackle*cackle*cackle*!@k @v27/30700188.You have started to grow some guts!"'
15500: 'BEATRICE@r@v27/30700189."However, to have a conversation is to acknowledge the person you are talking to.@k@v27/30700190. Now that you have started to respond to my idle chatting, that is proof that you are gradually starting to accept my existence."'
15501: 'Battler@r@v10/30100141."Heh.@k@v10/30100142. That''s because, even if the sun starts rising from the west, I will definitely, definitely-definitely, never accept that you''re a witch.@k@v10/30100143. Maybe if you start crying and kissing my shoes, I might be willing to have a more constructive discussion."'
15502: '@rEven if Battler was bluffing, he still spoke forcefully, a fearless expression on his face.'
15503: '@rThe witch and her butler snickered together, realizing that their guest had regained more than enough of his willpower to take on a new game,@k and that the preparations were complete...'
15504: '@rAfter Ronove exchanged a few words with BEATRICE, he bowed silently to Battler, scattered into gold butterflies, and disappeared.'
15505: 'BEATRICE@r@v27/30700191."*cackle*cackle*.@k@v27/30700192. It is truly pleasing when everything gets so lively."'
15506: 'BEATRICE@r@v27/30700193."......How boring were those days when I was trapped alone on this island, unable to regain my power and without anyone to talk to."'
15507: 'Battler@r@v10/30100144."......I get how that creepy-ass guy is really fitting as your butler."'
15508: 'Battler@r@v10/30100145."...But tell me.@k@v10/30100146. Why has that butler only appeared now?@k @v10/30100147.You said something about how only the goats and the seven stake chicks had manifested themselves.@k@v10/30100148. What did that mean...?"'
15509: 'BEATRICE@r@v27/30700194."Hmm, yes.@k@v27/30700195. You still fight it, but I am a fully fledged witch.@k@v27/30700196. I am in contact with a good many nonhuman entities in the netherworld."'
15510: 'Battler@r@v10/30100149."I''m sure.@k@v10/30100150. None of your contacts are halfway near decent.@k@v10/30100151. First some goat monsters, then those sexy-assed babes, and this time a demon butler''s showed up.@k@v10/30100152. ......I don''t want to say it, but there better not be more and more of these weird guys to come..."'
15511: 'BEATRICE@r@v27/30700197."Hahahaha!@k @v27/30700198_b.How much furniture do you think I have serving at my great golden mansion, how many demons do you think visit me there?@k @v27/30700199.They will keep coming.@k@v27/30700200. They will appear in any number."'
15512: 'BEATRICE@r@v27/30700201."When the door to the Golden Land is opened, I will call back all of my furniture, and build my new castle here on Rokkenjima.@k@v27/30700202. Then I plan to invite all of my old friends, and we will drink and dance together for three days and three nights."'
15513: 'BEATRICE@r@v27/30700203."......I do also plan to invite Kinzo''s family, of course?@k @v27/30700204.You too, if you wish.@k@|@y@v27/30700205. *cackle*cackle*...!"'
15514: 'Battler@r@v10/30100153."......So let me get this straight.@k@v10/30100154. Since you''d lost your power, for a long time, you couldn''t summon them."'
15515: 'Battler@r@v10/30100155."...And your magic power has been recovering gradually, so you''ve become able to summon more and more monsters.@k@v10/30100156. Is that what you''re trying to say?"'
15516: 'BEATRICE@r@v27/30700206."It is as you say.@k@v27/30700207. You have managed to avoid taking that final step off the cliff,@k@v27/30700208. but your heart is already wavering, and you are unable to deny that I am a witch.@k@v27/30700209. That wavering in your heart has slightly restored my power as a witch."'
15517: 'Battler@r@v10/30100157."So are you saying that creepy butler appeared...@v10/30100158....because I started to surrender?"'
15518: 'BEATRICE@r@v27/30700210."That''s right.@k@v27/30700211. Bit by bit, you are surrendering to me...!@k @v27/30700212.You submitted to me so much in the last game that you received all of that humiliation, did you not?"'
15519: 'BEATRICE@r@v27/30700213."Your back was truly pleasant for throwing my feet up on, I''ll have you know.@k @v27/30700214.*cackle*cackle*cackle*cackle*!!"'
15520: 'Battler@r@v10/30100159."...D-@v10/30100160.......dammit.......@k@v10/30100161. ...I thought that, as long as I didn''t accept you, I''d be able to keep on going.@k@v10/30100162. ...But it seems apparently I was mistaken."'
15521: 'BEATRICE@r@v27/30700215."That''s right.@k@v27/30700216. The closer you get to submitting, the more the game will swing in my favor.@k@v27/30700217. Isn''t chess the same?"'
15522: 'BEATRICE@r@v27/30700218."In the process of cornering each other''s kings, we have traded several pieces.@k@v27/30700219. It is true that I have yet to corner your king."'
15523: 'BEATRICE@r@v27/30700220."......However, you have your hands full just enabling your king to escape, and have lost several important pieces to me, and conceded a large advantage.@k@v27/30700221. It is only natural that further advances will lean in my favor."'
15524: 'Battler@r@v10/30100163."..................Damn........."@|@y'
15525: 'BEATRICE@r@v27/30700222."As we continue, you will probably still succeed in frantically avoiding my checkmates, if nothing else.@k@v27/30700223. ...However, as you do, I will steal your important pieces from you one by one.@k@v27/30700224. In the end, you will have lost everything but your king, and you will receive a true checkmate, from which you will be denied any form of escape."'
15526: 'BEATRICE@r@v27/30700225."......You were talking big last time, weren''t you?@k @v27/30700226.Something about how, since you would never accept me, this would be eternal torture that would torment me.@k@v27/30700227. Only witches who have reached the endless level can talk about eternity.@k@v27/30700228. You have never possessed that qualification.@k@|@y@v27/30700229. *cackle*cackle*cackle*, hah-hah-hah-hah-hah-hah-hah-ha!!"'
15527: 'Maria@r@v13/30400070."Kinzo-sama has already publicly displayed the location of the hidden gold within the epitaph under my portrait.@k@v13/30400071. The rules apply equally to all who can read the epitaph.@k@v13/30400072. If you discover the gold, I shall return everything to you."'
15528: 'Maria@r@v13/30400073."Tonight, I ask that you enjoy your battle of wits with Kinzo-sama to the fullest.@k@v13/30400074. I sincerely pray that this night will be both intellectual and elegant.@k@v13/30400075. - BEATRICE the Golden."'
15529: '@rWhen Maria finished reading the letter that BEATRICE had handed her, everyone was at a loss for words for a while.'
15530: '@rAnd then, they all broke the silence at once...'
15531: 'Natsuhi@r@v03/30900001."R-Ridiculous.@k@v03/30900002. What a worthless, vicious prank!"'
15532: 'Krauss@r@v02/30800059."I agree wholeheartedly.@k@v02/30800060. There is no way that Father would give up the Head''s Ring.@k@v02/30800061. BEATRICE?@k @v02/30800062.Ha!@k @v02/30800063.What a transparent prank, hoping that bringing up that name will have us running around like headless chickens."'
15533: 'Rudolf@r@v08/31200033."Come on come on, who''s the one behind this dessert packing a little too much punch?@k @v08/31200034.I''ll applaud and admire you if you come clean now.@k@v08/31200035. Rosa?"'
15534: 'Rosa@r@v12/31400003."O-of course not...!@k @v12/31400004.I wouldn''t pull a prank assuming Father''s name!"'
15535: 'Rudolf@r@v08/31200036."Then Aneki?!@k @v08/31200037.Aniki?!"'
15536: 'Eva@r@v05/31000131."Me?!@k @v05/31000132.Don''t be absurd!@k @v05/31000133.It was you, wasn''t it?!@k @v05/31000134.Only you could plan something this vulgar!!"'
15537: 'Krauss@r@v02/30800064."Are you trying to mock me?!!@k @v02/30800065.I''m the one who wants to question you!@|@y@k @v02/30800066.Who is behind this ill-natured prank?!"'
15538: '@rKrauss beat the table and stared at everyone.'
15539: '@r...Since that included the children too, he scared them greatly...'
15540: 'Kyrie@r@v09/31300004."...A letter from a mysterious person who claims to have been given full rights to Father''s assets.@k@v09/31300005. And if you think about how this family conference is all about discussing that,@k@v09/31300006. ......I think it''s too hasty to call this just a prank."'
15541: 'Hideyoshi@r@v06/31100084."I wouldn''t be so sure.@k@v06/31100085. It really might be one of Father''s vulgar pranks...@k@v06/31100086. He might''ve planned this to shock us a bit, since we''ve been discussin'' the distribution of his inheritance without him..."'
15542: 'Rudolf@r@v08/31200038."If Dad was the one who planned this,@k@v08/31200039. ......then we can''t take what Maria-chan just read aloud as a joke, right...?"'
15543: 'Eva@r@v05/31000135."......That''s right.@k@v05/31000136. If you interpret the contents literally, ...then this is a test from Father.@k@v05/31000137. The epitaph of the witch has been displayed in the hall for quite some time now, so that any one of us could solve it.@k@v05/31000138. There was plenty of notice.@k@v05/31000139. So he''s saying that the first person to solve it will be handed the headship along with all of his wealth, right...?"'
15544: '@r@v34/33300065.......See? Our magic worked......'
15545: 'Natsuhi@r@v03/30900003."Ridiculous, there is nothing of the sort!!@|@y@k @v03/30900004.It is an unshakable fact that my husband will become the successor to the Ushiromiya family headship!!"'
15546: 'Eva@r@v05/31000140."This letter is the very thing that shakes it!@k @v05/31000141. This letter is a message from the person who was given full rights to all of Father''s wealth!"'
15547: 'Eva@r@v05/31000142."Nii-san''s right to become the head has returned to a blank slate.@k@v05/31000143. The person who solves the riddle,@v05/31000144. ......the person who finds BEATRICE''s gold will become the next head of the Ushiromiya family!!"'
15548: 'Krauss@r@v02/30800067."Ludicrous...!@k @|@y@v02/30800068.Are you going to trust the meaningless words in that letter?@k @v02/30800069.That the seal was the real thing?@k @v02/30800070.How can we possibly trust that!!"'
15549: 'Eva@r@v05/31000145."Then let''s try going to ask Father directly!@k @v05/31000146.We aren''t at the level where you can get away with saying that his mood''s bad or that he''s not feeling well, you know?!"'
15550: 'Eva@r@v05/31000147."The sealed wax clearly shows that this letter was from Father''s representative!@k @v05/31000148.If you doubt that, then show some proof, Nii-san.@k@v05/31000149. Prove that this letter is not an expression of Father''s wishes!!"'
15551: 'Krauss@r@v02/30800071."V-very well.@k@v02/30800072. It is just as you say.@k@v02/30800073. It no longer matters whether Dad''s in a good mood or not...@k@|@y@v02/30800074. Let us go up and ask him directly."'
15552: 'Rudolf@r@v08/31200040."Let''s do it.@k@v08/31200041. We''ll ask Dad directly.@k@v08/31200042. Dad is to blame too here, why did he have to choose such a roundabout way?@k @v08/31200043.Well, that is a little like him!"'
15553: 'Rosa@r@v12/31400005."I, I wonder if it''s alright to talk like that, taking it for granted that it is Father''s letter..."'
15554: 'Eva@r@v05/31000150."Stupid Rosa!!@|@y@k @v05/31000151.Isn''t it obviously Father''s letter?!@k @v05/31000152.That letter was Father''s!!@k @v05/31000153.Isn''t it obvious that he''s giving the four of us an even chance to become the successor?!!"'
15555: 'Eva@r@v05/31000154."Idiot, die, you useless woman!!"'
15556: '@r@v34/33300065_1.Rosa really is dumb.@k@r@v34/33300065_2.Why doesn''t she just give up and die forever...?'
15557: 'Rosa@r@v12/31400006."I, I''m sorry...!@k @v12/31400007.Th-tha-that''s right...@v12/31400008. I''m sorry..."'
15558: '@rIn the beginning, the adults had all doubted the authenticity of the letter,@k but after just now realizing that this was a once-in-a-lifetime chance for the three siblings other than Krauss in the struggle for the inheritance, Eva had changed her position, and had claimed that the letter was authentic.'
15559: '@rRudolf and Rosa also realized that, and agreed.'
15560: 'Natsuhi@r@v03/30900005."Good gracious!!@k @v03/30900006_b.How could adults like you take such a worthless prank this seriously...!@k @v03/30900007.Even though I am not Father, I understand well his exasperation!!"'
15561: 'Hideyoshi@r@v06/31100087."Whoa whoa whoa whoa!@k @v06/31100088.Natsuhi-san, won''t everythin'' be fine if we just ask Father...?!@k @v06/31100089.Everything''ll be fine if Father simply mentions that he doesn''t know about the letter!"'
15562: 'Eva@r@v05/31000155."Nii-san.@k@v05/31000156. Take responsibility, and just get him to say that he doesn''t know about the letter.@k@v05/31000157. This isn''t a time to get scared just because he''s in a bad mood, you know?!"'
15563: '@r@v34/33300065_3.He''s still scared of Father at his age, what an idiot.@k@r@v34/33300065_4.Why doesn''t he just give up and die forever...?'
15564: 'Krauss@r@v02/30800075."R-right!@k @v02/30800076.Let''s get this situation painted in black and white.@k@v02/30800077. He''s probably eating in his study right now.@k@v02/30800078. I think it''s time we had him rest his chopsticks for a moment...!"'
15565: 'Rudolf@r@v08/31200044."It''s decided.@k@v08/31200045. Let''s go!@k @|@y@v08/31200046.Kyrie, wait here for a while.@k@v08/31200047. We''ll go to check whether it''s true or not and come back quickly."'
15566: 'Kyrie@r@v09/31300007."......Thank you.@k@v09/31300008. I will wait patiently for Gohda-san to bring the dessert."'
15567: '@rThe four siblings, Natsuhi, and Hideyoshi all stood from their seats forcefully and flew out into the hallway with a clatter.'
15568: '@rAfterwards, the only ones left were the children, stunned completely speechless; Nanjo, who looked uncomfortable;@k and Kyrie, shrugging her shoulders.'
15569: '@rMaria, who had been at the center of all this turmoil, looked a little scared at the adults'' sudden change.'
15570: '@r...However, judging from her appearance,@k she didn''t look like she realized the full significance of what she had just read out.'
15571: 'Jessica@r@v04/30200078."...What in the world......was that all about...?@k@v04/30200079. I don''t friggin'' get it..."'
15572: 'Battler@r@v10/30100164."......Shitheads, every last one of them.@k@v10/30100165. Do they really want the inheritance that much...?!"'
15573: 'George@r@v07/30300034."............Everyone,@k@v07/30300035. this is our parents'' problem.@k@v07/30300036. It has nothing to do with us.@k@v07/30300037. So you mustn''t worry about it."'
15574: 'Battler@r@v10/30100166."Yeah, if only it was that easy...@k@v10/30100167. ...They were so blatantly..."'
15575: 'Jessica@r@v04/30200080."I thought they were better than this...!@k @v04/30200081.Showing off their greed...!"'
15576: 'Maria@r@v13/30400076."Uu!@k @v13/30400077.Everyone has to believe together we''ll be happy!@k @v13/30400078.Uu-uu!"'
15577: 'George@r@v07/30300038."...That''s right.@k@v07/30300039. We all did promise.@k@v07/30300040. Come on, Battler-kun, Jessica-chan, you too..."'
15578: 'Battler@r@v10/30100168."............Haah."'
15579: 'Jessica@r@v04/30200082."......I feel like crap..."'
15580: '@rWe couldn''t accept it at all, but we laid down our arms for the time being.'
15581: '@r...We had known vaguely how filthy the family conference was going to be this time.@k ...However, after that six-year blank, I couldn''t help being shocked...'
15582: '@rSeeing that the children were completely dejected, Doctor Nanjo cleared his throat uncomfortably.'
15583: 'Nanjo@r@v19/31900001."...It''s an adult discussion.@k@v19/31900002. It has nothing to do with all of you young people.@k@v19/31900003. Let us forget about it."'
15584: 'Jessica@r@v04/30200083."I would if I could, okay...!"'
15585: 'Kyrie@r@v09/31300009."I know that it''s hard on you.@k@v09/31300010. But please, forget it for now, for their sakes."'
15586: 'Kyrie@r@v09/31300011."...All of your parents are fighting frantically to make your futures just a little brighter.@k@v09/31300012. Please, don''t look at your injured parents with those cold eyes when they come back."'
15587: 'Battler@r@v10/30100169.".....................@k@v10/30100170. Even on your request, Kyrie-san,@v10/30100171. ......that''s a hard one."'
15588: 'Jessica@r@v04/30200084."If we could be that cut and dried about it,@v04/30200085. ......we wouldn''t be kids in the first place....."'
15589: 'Maria@r@v13/30400079."Uu!@k @v13/30400080.Everyone happyyy!!@k @v13/30400081.Can''t get daaaark!!@k @v13/30400082.Belieeeeve!@k @v13/30400083.Unless we all believe we can be happy, the happiness will get away!@k @v13/30400084.We all have to believe!@k @v13/30400085.Uu-uu-uu!!"'
15590: 'Kyrie@r@v09/31300013."......That sounds good.@k@v09/31300014. I''ll believe too.@k@v09/31300015. We can be happy."'
15591: 'Maria@r@v13/30400086."Uu!@k @v13/30400087.Auntie Kyrie, thank you!!"'
15592: 'Maria@r@v13/30400088."Battler and Jessica onee-chan, you believe too!@k @v13/30400089.BEATRICE is always saying that magic won''t have any power if you don''t believe.@k@v13/30400090. Uu!"'
15593: '@rKyrie-san rose from her seat quietly, went over to Maria, and crouched down so that their eyes met.'
15594: 'Maria@r@v13/30400091."......Uu.@k@v13/30400092. You believed, Auntie Kyrie.@k@v13/30400093. Now, Battler and Jessica onee-chan have to believe."'
15595: 'Kyrie@r@v09/31300016."They''re both strong people.@k@v09/31300017. They''ll feel better soon and do that for you."'
15596: 'Maria@r@v13/30400094."Yeah."'
15597: 'Kyrie@r@v09/31300018."More importantly,@v09/31300019. ............I want you to tell me."'
15598: '@rWhen Kyrie-san said that, Jessica, George-aniki, Doctor Nanjo and I all listened closely.'
15599: '@r...It looked like our parents'' minds had been filled by thoughts of Grandfather and the inheritance problem,@k but we wanted to ask Maria about something simpler.'
15600: 'Maria@r@v13/30400095."Uu?@k @v13/30400096.What?"'
15601: 'Kyrie@r@v09/31300020."Who gave you that letter, Maria-chan...?"'
15602: 'Maria@r@v13/30400097."BEATRICE!!"'
15603: 'Kyrie@r@v09/31300021."The witch drawn in that portrait...?"'
15604: 'Maria@r@v13/30400098."Uu!@k @v13/30400099.She gave me this letter and an umbrella!@k @v13/30400100.And she used magic to fix my rose that was broken!@k @v13/30400101.BEATRICE is an awesome witch who can do anything!!"'
15605: 'Kyrie@r@v09/31300022."............Could you tell us about it in a bit more detail...?"'