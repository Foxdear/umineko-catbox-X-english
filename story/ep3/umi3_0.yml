14741: '@rThe vase was very, very beautiful, rich with history and value.'
14742: '@rEven as young as I was, it still forced me to take a deep breath when I witnessed its beauty.'
14743: '@rOf course, it was one of Grandfather''s favorite collection pieces.'
14744: '@rSo that I didn''t accidentally destroy its fragile beauty,@k I was always strictly ordered never to touch it.'
14745: '@r......But that just made me want to touch it.'
14746: '@rYou could almost see right through it, and yet it was so elegant; it appeared so weightless, and yet it had an indescribable presence.'
14747: '@r...I wanted to see what it felt like to touch a vase like that.'
14748: '@rHowever, ...just as Grandfather had said, it was something that must not be touched.'
14749: '@rThis much beauty arises precisely because it must never be touched.'
14750: '@rIt was a beauty that could only dwell in something so fragile it would break at a touch.'
14751: '@rWhich is exactly why, if it were to be touched by my impudent finger, it would oh so easily - '
14752: '@rJust like an enjoyable morning dream fading into nothing as you wake...@k......it vanished, fell, and broke into smithereens.'
14753: '@rI realized that, because of my own foolish curiosity, I had done something that couldn''t be taken back.'
14754: '@rNo matter how much I regretted it, no matter how much I apologized.@k@rThe broken vase would not return to its original form...'
14755: '@rI would probably be scolded by Grandfather.@k@rProbably very harshly.'
14756: '@rFrightened, I ended up breaking into tears and sobbing...'
14757: '@rAs I did, I noticed something............beautiful.@w500. Lightly dancing golden butterflies...@w500.were coming towards me.'
14758: '@rThe beautiful butterflies began to gather, one at a time, glittering fantastically with glowing golden powder.'
14759: '@rOh, it''s BEATRICE.@k@rThat reliable Golden Witch, BEATRICE had arrived.'
14760: '@rThe butterflies gathered one after another, grouped together, and there, became her form...'
14761: '@rShe was always on my side.@k@rWhenever I was in trouble, she would always appear and help me.'
14762: '@r@v30/33200001."Good day to you, princess."'
14763: '@r@v27/30700001."BEATRICE!@k @v27/30700002.......uuuughu, hic, hic...!"'
14764: '@r@v30/33200002."Oh, my...@k@v30/33200003. Why are you crying so on a day so perfect for a tea party, my princess...?"'
14765: '@r@v27/30700003."...I broke Grandfather''s precious vase...@k@v27/30700004. Uugh... Grandfather will get mad at me.@k@v27/30700005. ...I don''t know what I should do...@k@v27/30700006. hic..."'
14766: '@r@v30/33200004."That is indeed worrying.@k@v30/33200005. I believe the Master greatly treasured this particular vase.@k@|@y@v30/33200006. ......Hohohoho, it''s terrifying even for me to think about what kind of punishment you''ll receive."'
14767: '@rGrandfather was a very frightening person.'
14768: '@rAnd once he told you something, if you failed to follow it, he would become mad with a rage that would make even the fallen angels in hell quiver.'
14769: '@rI was intimately familiar with that, which is why I couldn''t do anything but shake like this and cry...'
14770: '@r@v30/33200007."I hold no magic to scoop up your fallen tears, princess,@k@v30/33200008. but if you want magic that will make it possible for you to avoid being scolded by the Master, I might be able to do something."'
14771: '@r@v27/30700007."R-really...?"'
14772: '@r@v30/33200009."If you will believe in my power, princess.@k@v30/33200010. The basis of magic power is the power of belief.@k@v30/33200011. ......Miracles will only appear before those who strongly believe."'
14773: '@r@v27/30700008."I, ...I believe...@k@v27/30700009. I believe in your magic, BEATRICE.@k@v27/30700010. So please fix this vase.@k@v27/30700011. Please...!"'
14774: '@r@v30/33200012."If that is what you want, princess.@k@v30/33200013. ......Very well, then leave it to me."'
14775: '@rWhen she extended her index finger, a golden butterfly softly landed there, and changed its form into her favorite magic wand.'
14776: '@rEven that was enough to give me a small glimpse at BEATRICE''s wonderful and great magic power.'
14777: '@rShe pointed her wand at the broken vase, and, just like a child''s lullaby, she began speaking the magic words...'
14778: '@r@v30/33200014."Come, try closing your eyes.@k@v30/33200015. And try to remember.@k@v30/33200016. What form did you have?@k@v30/33200017. It was surely a very, very beautiful form.@k@v30/33200018. Please, show me that form one more time..."'
14779: '@rWere they words, or was it a song?'
14780: '@rNo, it was surely magic.'
14781: '@rAfter all, can''t you see? ...The pieces of the vase are gathering together in no time at all,@k ...and softly returning to the place where they had been displayed, ......returning to their original beautiful form.'
14782: '@r@v27/30700012."......Incredible..."'
14783: '@r@v30/33200019."See?@k@v30/33200020. Now it''s back to normal.@k@v30/33200021. This way, you will be able to avoid being yelled at by the Master."'
14784: '@r@v27/30700013."BEATRICE, you sure are incredible.@k@v27/30700014. It was no trouble for you to repair a broken vase."'
14785: '@r@v30/33200022."That''s not true.@k@v30/33200023. Returning something broken to its original form is a very, very difficult thing.@k@v30/33200024. With my magic, I could do no more than make it remember what it was, for the time being."'
14786: '@r@v27/30700015."......?@k @v27/30700016.But, the vase really turned back to the way it was, right...?"'
14787: '@r@v30/33200025."That''s right.@k@v30/33200026. But that doesn''t mean that I caused the vase to avoid its fate of being broken.@k@v30/33200027. I did nothing but make the broken vase remember how it was before it broke for the time being.@k@v30/33200028. Magic power that can repair a broken fate to its original form is at a very high level that even I have yet to reach."'
14788: '@rAt that time, the high-pitched scream of a servant could be heard from inside the mansion.'
14789: '@rWhen I went to see what had happened,@k ......I noticed that several of the servants had gathered, and were cleaning up the remains of the broken vase.'
14790: '@rFrom what they said, it seemed that a black cat had sneaked in from somewhere, climbed up on the vase, and toppled it over.'
14791: '@rI understood the meaning of what BEATRICE had said.'
14792: '@r...At the time that I broke the vase, "the vase had been broken".'
14793: '@rBEATRICE had shown me that the vase had been restored, but that had been a temporary thing.@k It didn''t mean the fate that "the vase had been broken" had changed.'
14794: '@rAs a result, ......the vase had remembered its true fate, and "broke".@k@rBut I hadn''t broken it; instead, it had been a cat which had snuck in...'
14795: '@rThat''s right.@k BEATRICE hadn''t said "Let''s mend the vase".'
14796: '@rShe had said she would make it so that I didn''t have to be punished.'
14797: '@rThe fate of the vase breaking hadn''t changed, but the fact that I had broken it certainly had...'
14798: '@rBEATRICE had skillfully saved me from danger with that magic...'
14799: '@r@v30/33200029."It is very easy to break something.@k@v30/33200030. Just like how you, princess, did not require magic in order to break the vase."'
14800: '@r@v27/30700017."...Fixing something is very hard...?"'
14801: '@r@v30/33200031."Yes.@k@v30/33200032. So much so that you were at a loss at what to do and started crying."'
14802: '@r@v27/30700018."......So it''s easier to use magic to do horrible things?@k @v27/30700019.To break,@v27/30700020. ......to kill is very easy,@k@v27/30700021. ......but fixing and reviving things is very hard, as you say..."'
14803: '@r@v30/33200033."......That''s right.@k@v30/33200034. With magic, it is much easier to do things like breaking and killing.@k@v30/33200035. Therefore, weak witches who lose to temptation become intoxicated with that power which they can easily obtain, and neglect their real magic training."'
14804: '@r@v30/33200036."......Real magic is the power to repair, to revive.@k@v30/33200037. To call back happiness which has disappeared, to call back love which has gotten cold.@k@v30/33200038. And it can call back a forgotten smile to a princess''s face."'
14805: '@r@v27/30700022."Then, ......BEATRICE, does that mean that since you could fix the vase, you are an incredible witch?"'
14806: '@r@v30/33200039."My days of training are far from over.@k@v30/33200040. After all, I couldn''t make the vase forget its fate for even an hour.@k@v30/33200041. If it had been my master, who taught me magic,@k@v30/33200042. I''m sure that she would have been able to restore the vase to its original form forever."'
14807: '@r@v27/30700023."If it broke and broke, she could fix it over and over again...?"'
14808: '@r@v30/33200043."Yes.@k@v30/33200044. When one reaches that level, they are possessed of endless magical power.@k@v30/33200045. That is the endless level that all witches should strive to reach.@k@v30/33200046. As a sign of the highest respect to those witches, we call them..."'
14809: '@r@v27/30700024."An Endless Witch..."'
14810: '@r@v30/33200047."That''s right.@k@v30/33200048. ......To witches holding the power to mend something endlessly, the concept of breaking doesn''t even exist.@k@v30/33200049. They are released from all of the sadness caused by losing things and are promised eternal bliss."'
14811: '@rCertainly, the human world is full of sadness caused by separation and loss.'
14812: '@rTo escape that sadness, people pray to God, and ask for the power to withstand the sadness, believing it to be a test...'
14813: '@rIn other words, a human''s life is a journey, searching for a way to withstand sadness.'
14814: '@rIn that case, a witch who could revive all things would be freed from all sadness in the world.@k ......In other words, it is eternal bliss...'
14815: '@r@v27/30700025."I wonder......if I could become a witch like you, and gain eternal happiness."'
14816: '@r@v30/33200050."You, princess...?@k @|@y@v30/33200051.Hoh-hoh-ho... That would be a long, long, difficult path, you know?"'
14817: '@r@v27/30700026."I want to be a witch.@k@v27/30700027. ......I want to be happy.@k@v27/30700028. I want to be your disciple."'
14818: '@r@v30/33200052."...............@k@v30/33200053. Do you have even the slightest doubt in that feeling?"'
14819: '@r@v27/30700029."No.@k@v27/30700030. I want to become a witch too."'
14820: '@r@v30/33200054."......All right.@k@v30/33200055. Then, until you get tired of it, princess, I will allow you to be my disciple.@k@v30/33200056. ...Will you call me Master?"'
14821: '@r@v27/30700031."Yes, Master."'
14822: '@r@v30/33200057."That''s a good answer.@k@v30/33200058. Then from now on, learn the depths of magic along with me.@k@v30/33200059. I am also in training.@k@v30/33200060. Let us both learn magic the right way, and do our best to reach that blissful level."'
14823: '@r@v27/30700032."Yes, Master...!"'
14824: 'BEATRICE@r@v27/30700033."........................@k@v27/30700034. ...Ah, a dream.@k@v27/30700035. ......That face brings me back..."'
14825: '@rEndless Witch, was it?'
14826: '@rA name that I had yearned for in the past as the highest achievement...now just another one of my titles.'
14827: '@rNo, you can even call it a name.'
14828: 'BEATRICE@r@v27/30700036."...Every once in a while, it''s nice to feel some satisfaction from that name.@k@v27/30700037. Isn''t it something that I gained as the result of many days of training?"'
14829: 'BEATRICE@r@v27/30700038."...It''s a little bit of a waste if I don''t feel some gratitude for it every once in a while.@k@v27/30700039. ......*cackle*cackle*cackle*."'
14830: '@rI shook my head lightly.'
14831: '@rIf it is called the highest level, that means that there is nothing higher.@k@rAn eternal dead end, the beginning of eternal boredom.'
14832: 'BEATRICE@r@v27/30700040."Master said it once.@k@v27/30700041. That when one is released from all sadness, it is the same as eternal bliss.@k@|@y@v27/30700042. ......Which is why I think...@k@v27/30700043.Master couldn''t reach that level."'
14833: '@rEternal bliss means eternal boredom.@k@r...That''s the beginning of eternal torture.'
14834: '@rBut perhaps all things depend on your point of view.'
14835: '@rEternal boredom is the same as a sketchbook that doesn''t run out of pages.@k It means you can draw whatever you want, can put in as much effort to enjoy it as you want.'
14836: '@rBoredom is the worst poison that kills all witches.'
14837: '@r......To the Great Witches who hold the title "Lady", this is frighteningly true.@k@rIt is the eternal poison that tortures them because of the eternal bliss that they have reached...'
14838: 'BEATRICE@r@v27/30700044."Now that I have earned the name of Endless Witch, I truly wish to speak with my master again.@k@v27/30700045. ......Was the result of our training really "happiness"?@k@v27/30700046. And I want to talk with her about what true "happiness" is."'
14839: '@r -  Training has no end.@k When you think you have reached the eternal level, that is the time to regret your immaturity.'
14840: '@r......As if in answer to my own words, a memory of her saying something like that entered my mind.'
14841: 'BEATRICE@r@v27/30700047."*cackle*cackle*, hahhahahahahahahahaha...@k@|@y@v27/30700048. I see, ......I am immature, am I?!@k @v27/30700049.How nice, how nice.@k@v27/30700050. *cackle*cackle*cackle*cackle*...!"'
14842: '@rSome painfully shrill laughter could be heard.'
14843: '@rIt was from my furniture.@k ...Did they break their toy again?'
14844: 'Beelzebub@r@v43/32800001."BEATRICE-samaaa.@k@v43/32800002. This guy''s stopped moving agaaain."'
14845: 'Mammon@r@v42/32700001."Even though I haven''t played enough at all.@k@v42/32700002. What a pathetic man."'
14846: 'Leviathan@r@v39/32400001."I hadn''t even played at alllll!@k @v39/32400002.Let me play, let me playyyy!"'
14847: 'Satan@r@v40/32500001."Be silent, you filth!@k @|@y@v40/32500002.No matter how well BEATRICE-sama fixes him, he just breaks right away, because you all devour him like starving dogs."'
14848: 'Belphegor@r@v41/32600001."You broke him the most, Satan-nee.@k@v41/32600002. ''Cause you don''t know restraint."'
14849: 'Lucifer@r@v38/32300001."My apologies, BEATRICE-sama.@k@v38/32300002. Please forgive my cretinous younger sisters."'
14850: 'Asmodeus@r@v44/32900001."Fix him quicklyyy!@k @v44/32900002.I''m next, I''m neeext!"'
14851: 'BEATRICE@r@v27/30700051."Can you not be silent, shut up!!"'
14852: '@r@o30.@v38/32300003|39/32400003|40/32500003|41/32600003|42/32700003|43/32800003|44/32900003."""""""Eeek!!"""""""@|@y'
14853: '@rJust from that single yell, the noisy Sisters of the Seven Stakes disappeared and hid.'
14854: '@rThey just mess around, having as much fun as they want breaking him.@k@rThey only come to me to clean up afterwards.@k@r...Good grief, my furniture doesn''t let me get bored.'
14855: '@rWhat remained after the pieces of furniture hid themselves...was just the sloppy mess that was all that remained of the broken toy.'
14856: '@rIt had no form anymore.'
14857: 'BEATRICE@r@v27/30700052."...Even I find it hard to recall his original form when he looks like this.@k@v27/30700053. It''s better to make him remember for himself.@k@v27/30700054. ......Oh, well."'
14858: '@rI waved my golden pipe.'
14859: '@rAnd I told.@k I chanted.@k I made it remember.'
14860: 'BEATRICE@r@v27/30700055."......Come, try to remember.@k@v27/30700056. What form did you have?@k@v27/30700057. ...After all, right now, you look like nothing but a huge lump of scrap meat to me."'
14861: 'BEATRICE@r@v27/30700058."I''ve no idea which parts are the arms and which parts are the legs.@k@v27/30700059. If you don''t remember for me, I won''t even be able to recall your face.@k@v27/30700060. *cackle*cackle*cackle*!"'
14862: '@rBy the power of the magic, the pitiful pieces of meat began to remember what their form had been.'
14863: '@rWhat was connected to what.@k Where was joined up with where.'
14864: '@rThat''s right, just like that.'
14865: '@r...No, no, you should be a finger on the left hand.'
14866: '@rAnd you, the right hand.'
14867: '@rThat''s it, good, good, *cackle*.'
14868: 'BEATRICE@r@v27/30700061."...Good morning.@k@v27/30700062. Feeling awake, Ushiromiya Battler?@k@v27/30700063. How truly ironic that being awake is even more like a nightmare."'
14869: 'Battler@r@v10/30100001.".........*cough*, ...*cough*...@k@v10/30100002. .........eck, ...owowow......"'
14870: 'BEATRICE@r@v27/30700064."If you would just accept that I am a witch, you''ll quickly awaken from this nightmare, and I''ll send you to heaven.@k@v27/30700065. I am the king of Mount Purgatory.@k@v27/30700066. There''s no way out of this hell without my approval."'
14871: 'Battler@r@v10/30100003."Heh, ...heheheheh.@k@v10/30100004. You call this hell? That''s no good.@k@v10/30100005. Yeah, that''s no goddamn good at all."'
14872: 'BEATRICE@r@v27/30700067."The pain of death, which humans only have to taste once,@k@v27/30700068. has been given to you more times than I could count with all of my fingers, and yet, ...how can you keep talking like that?@k@v27/30700069. *cackle*!@k @v27/30700070.That is why I never tire.@k@v27/30700071. I never tire of you."'
14873: 'Battler@r@v10/30100006."Yeah, I''m not tiring either.@k@v10/30100007. I mean, I get to pick and choose from those busty babes with dazzling asses in my harem.@k@v10/30100008. Thanks to that, I''m not getting tired at all."'
14874: 'BEATRICE@r@v27/30700072."*cackle*cackle*, *cackle*cackle*cackle*!@k @v27/30700073.I am glad to hear it.@k@v27/30700074. Otherwise I too would be bored.@k@|@y@v27/30700075. So, my furniture.@k@v27/30700076. I''ve fixed him, so you can play as much as you want."'
14875: 'Mammon@r@v42/32700004."Thank you very much!@k @v42/32700005.Kyaha, dibs!"'
14876: 'Leviathan@r@v39/32400004."Didn''t I say you''re done, you''re done, I''m next!@k @|@y@v39/32400005.Back off, waaah!"'
14877: 'Asmodeus@r@v44/32900004."Huhuhuhuhu.@k@v44/32900005. Wonderful, isn''t it, Battler-kuuun?@k @v44/32900006.You''re so popular, aren''t you?"'
14878: 'Battler@r@v10/30100009."It''s hard being a popular guy.@k@v10/30100010. Get in line, you beasts."'
14879: 'Belphegor@r@v41/32600004."If you stopped acting all tough and started being honest with yourself, this would be much easier on you."'
14880: 'Beelzebub@r@v43/32800004."It''s alright like this.@k@v43/32800005. His screams feel so much better this way."'
14881: 'Satan@r@v40/32500004."Alright, let''s not break him easily this time.@k@v40/32500005. Well?! Do you hear me?!"'
14882: 'Lucifer@r@v38/32300004."You aren''t in control!"'
14883: 'Lucifer@r@v38/32300005."So, Battler-kun.@k@v38/32300006. Let''s continue where we left off, alright?@k @v38/32300007.After locking Jessica-chan''s room with the master key, how did they return the key to the pocket of the corpse which was inside the room?"'
14884: 'Battler@r@v10/30100011."......For example...@k@v10/30100012. ...That''s it, they used a fishing line or something, and just the key went back into the room through the crack of the door..."'
14885: 'Asmodeus@r@v44/32900007."Kyahhahahahahahaha!!@k @v44/32900008.Wronnng!"'
14886: 'Belphegor@r@v41/32600005."So naive.@k@v41/32600006. @|@y@c900.@[Of all of the doors that exist on Rokkenjima, none has a crack through which a key can slip.@]@c."'
14887: 'Leviathan@r@v39/32400006."He got it wrong? He got it wrong?!@k @v39/32400007.Right, this time me, my turn!@k @v39/32400008.Wherrre should I strike!"'
14888: 'Mammon@r@v42/32700006."Me, back of the hand!"'
14889: 'Battler@r@v10/30100012_1."Gh...!!"'
14890: 'Beelzebub@r@v43/32800006."That''s meeeean!@k @v43/32800007.Then, the back of the other hand!"'
14891: 'Battler@r@v10/30100012_2."Gwoaaahhh...!!"'
14892: 'Lucifer@r@v38/32300008."I''ll take the tip of the nose!"'
14893: 'Battler@r@v10/30100012_3."Ga...gagah......!!"'
14894: 'Leviathan@r@v39/32400009."Why, why, let me do it too, let me strike too!@k @v39/32400010.Waaah!!"'
14895: 'Satan@r@v40/32500006."You''re just slow, Levia-nee, "you snooze you lose" has always been how we''ve done things!@k @v40/32500007.Then, I''ll take the top of his foot!"'
14896: 'Battler@r@v10/30100012_4."Ugwaahh......!!"'
14897: 'Leviathan@r@v39/32400011."Waaah!!@k @v39/32400012.Me too, me toooo!@k @v39/32400013.Fine, I don''t care, I''ll take his shoulder!"'
14898: 'Battler@r@v10/30100012_5."Ga...hahh......!!"'
14899: 'Battler@r@v10/30100013."Keh...@k@v10/30100014. You''re sisters, right? Be nice to each other. ...@k@v10/30100015....Gwaaa, ......oh, .........hh..."'
14900: 'Belphegor@r@v41/32600007."......How can you withstand that?@k@v41/32600008. Why haven''t you realized that your false courage actually makes us more excited?"'
14901: 'Battler@r@v10/30100016."Too bad.@k@v10/30100017. False courage and being stubborn are my specialty.@k@v10/30100018. No matter how you all try to speak in riddles, I definitely won''t accept witches and magic...!"'
14902: 'Satan@r@v40/32500008."Even though you can''t explain anything with human tricks?@k @v40/32500009.Are you a moron?!@k @|@y@v40/32500010.Know your place!"'
14903: 'Lucifer@r@v38/32300009."It''s alright, we don''t have to force him to accept it.@k@v38/32300010. Any moment now he''ll break down crying with the desire to accept it.@k@|@y@v38/32300011. Even now, he really wants to kneel down on the ground pitifully and beg our forgiveness!"'
14904: 'Battler@r@v10/30100019."Ugaah, guahgehgehgyahh...!!"'
14905: 'Asmodeus@r@v44/32900009."Aahhhh, he''s broken already!@k @v44/32900010.BEATRICE-samaaa!"'
14906: 'BEATRICE@r@v27/30700077."......Dear me.@k@v27/30700078. Since they know that I can revive him over and over, my pieces of furniture don''t even hesitate to break him.@k@v27/30700079. How troublesome."'
14907: '@rEndless rebirths give me free reign over endless deaths, too.@k Before the Endless Witch BEATRICE, all death and life has no meaning.'
14908: '@rEven death can''t serve as the key to escape from my cage.'
14909: 'BEATRICE@r@v27/30700080."So, Battler.@k@v27/30700081. Remember your original form once more.@k@v27/30700082. I''ll toy with you over and over again!"'
14910: 'BEATRICE@r@v27/30700083."I see, I see, it truly is pleasant to have a toy to play with for all eternity.@k@v27/30700084. ......I see, could this be the endless bliss witches gain at the endless level?"'
14911: 'BEATRICE@r@v27/30700085."I see, I see.@k@v27/30700086. This certainly is a pleasant bliss.@k@v27/30700087. *cackle*cackle*cackle*cackle*!@k @v27/30700088.Wahhahahahahahahahahahaha!!@k @v27/30700089.I''ll revive you over and over, kill you over and over!"'
14912: 'BEATRICE@r@v27/30700090."Now then, what kind of murder spree shall I unleash on the next game board?@k @v27/30700091.Come, bring the new game board. Why don''t we begin the next game, Ushiromiya Battler!!"'