16963: 'Kinzo@r@v01/31500096."...........................Now then.@k@v01/31500097. How will the game be resolved this time?@k@v01/31500098. ...You may submit, and you may resist.@k@v01/31500099. ......Either way, it will truly be an entertaining banquet worth betting my short remaining life on."'
16964: '@rIn his dimly lit study, which was occasionally brightened by lightning,@k Kinzo kept mumbling to himself, laughing to himself.'
16965: '@rOn the antique clock with an intricate design that was sitting on his desk,@k the two overlapping hands had begun to tilt to the right, and separate from one another.'
16966: '@rThe passage of time that had counted to 24 had returned to 0, and begun to start counting again...'
16967: 'Kinzo@r@v01/31500100."......The passage of time is a brutal thing.@k@v01/31500101. It drags itself all the way to 24 over the course of a day, and then returns back to 0.@k@v01/31500102. ......It surely managed to count to 23:59.@k@v01/31500103. However, was it ever able to reach 24:00?@k @v01/31500104.......If you believe that it returns to 0:00 again without reaching it, how futile it seems."'
16968: '@rNo, is that not the same as a person''s life?@k You live, aiming for a perfect 24, and in the instant you reach it, you return to 0.'
16969: '@rPeople may praise the departed, saying that they did reach 24, but that is absolutely not 24.'
16970: '@r.........It is nothing more than 0.'
16971: 'Kinzo@r@v01/31500105."I am different.@k@v01/31500106. ......I will reach 24 alive.@k@v01/31500107. Because that itself is the Golden Land.@k@v01/31500108. ...That is BEATRICE''s dwelling."'
16972: '@rKinzo had been fumbling around with some tarot cards for some time.'
16973: '@rIt looked as though he was trying to divine his own luck, his own propensity for victory, and doing it over every time he didn''t like the result.'
16974: '@rThe most forbidden action in tarot reading is to try predicting the same thing twice.'
16975: '@rIt is a desecration to the result of the fortune telling,@k and also desecrates the existence higher than humans which delivers signs through the tarot cards.'
16976: '@rHowever, Kinzo knew.'
16977: '@rThe reason the tarot cards shouldn''t be used twice was that, since it was nothing more than a random number generator,@k it was natural that if you read them twice, a different result would appear.'
16978: '@r......Therefore, reading twice was only forbidden to preserve the mystique of the tarot cards'' results.'
16979: '@r...However, that didn''t mean that Kinzo didn''t take tarot reading seriously.'
16980: '@rKinzo''s interpretation of tarot reading was done in a completely different way.'
16981: '@rThat was to repeat the reading, over and over, until he reached the result most favorable to him,@k without the slightest amount of compromise.'
16982: '@rIt would depend on how he defined the result most favorable to him,@k but if he demanded the best result in a strict sense,@k it would be the same as a simple roulette of luck, where he sought an arithmetic miracle.'
16983: '@r......However, to Kinzo, who made miracles of numbers the basis of his magical power, this could become very much like a magic ritual.'
16984: '@rIn other words,@k until the result he desired appeared perfectly, he would repeat the tarot readings over and over, turning his labor, conviction, and the feelings of his heart into a prayer,@k so that when it reached heaven, the result would be sublimated - this was Kinzo''s personal magical interpretation.'
16985: '@rTherefore, even though the tarot cards Kinzo used were exactly the same as generally used tarot cards,@k the way they were used was completely different...'
16986: 'Kinzo@r@v01/31500109.".................................@k@v01/31500110. ...Tonight, ......it refuses to go my way."'
16987: '@rKinzo stopped his hands for a second.'
16988: '@r...It seemed the result he expected wasn''t showing up.'
16989: '@rOn the contrary, many bad cards that shouldn''t often appear were appearing repeatedly,@k and continuing to interfere with the miracle Kinzo wished for.'
16990: 'Kinzo@r@v01/31500111."..................Hmph.@k@v01/31500112. ...Is that how it is?"'
16991: '@rIt seemed that Kinzo had taken some kind of sign from this abnormal course of events.'
16992: '@rBut judging by the unlucky cards scattered over the desk, it was difficult to imagine that the sign had been a good one...'
16993: '@rFor a while, Kinzo closed his eyes tightly, pondering something.'
16994: '@rThen as the thunder roared, he made up his mind about something, took the telephone receiver, and dialed.'
16995: 'Kinzo@r@v01/31500113."............It is I.@k@v01/31500114. Is Genji there? It is urgent."'
16996: 'Shannon@r@v15/30500015."..................haah."'
16997: '@rIn front of the main entrance, Shannon was cooling her flushed face in the frigid air.'
16998: '@r...She had thought...@w500....that George''s proposal would surely come sometime.'
16999: '@rIt wasn''t as if her heart had been unprepared.@k@rAnd she had nodded as an answer.'
17000: '@rHad she been reckless because of her youth?@k@rShould she have thought about her future more seriously?'
17001: '@rShe found herself worrying that he might have thought of her as a cheap girl because of her immediate reply.'
17002: '@r...Perhaps at least holding off until tomorrow morning would have given the impression of thinking more seriously?'
17003: '@rNow that she had already received the ring from George,@k Shannon kept fidgeting in embarrassment, thinking she should have done this, should have done that.'
17004: '@rAs she did, she heard the sound of footsteps coming towards her, splashing through puddles.'
17005: '@rShannon immediately chased away the emotions welling up inside her.'
17006: 'Shannon@r@v15/30500016."......Genji-sama?@k @v15/30500017.Kanon-kun too...!@k @v15/30500018.I, I''m sorry, for not coming back right away, umm..."'
17007: '@rShe grew stiff, thinking that she would surely be scolded for spending too much time in her secret lover''s meeting with George.'
17008: 'Genji@r@v14/31600008."Shannon.@k@v14/31600009. The Master has told us to come to the study urgently.@k@v14/31600010. Let us hurry."'
17009: 'Shannon@r@v15/30500019."......Huh?@k @v15/30500020.Y-yes, certainly...!@k @v15/30500021.What in the world...?"'
17010: 'Kanon@r@v16/30600001."He said he had an ominous premonition.@k@v16/30600002. ......How selfish, when he was the one who chose to start this ritual."'
17011: 'Genji@r@v14/31600011."We will enter from the back, so that Gohda doesn''t notice us.@k@|@y@v14/31600012. Hide your footsteps."'
17012: 'Kanon@r@v16/30600003."Yes.@k@v16/30600004. .........Nee-san, take care.@k@v16/30600005. You''re so noisy."'
17013: '@rKanon was especially good at hiding his presence.'
17014: '@r...Like he was a cat.@k He was able to suddenly be there without anyone noticing, and leave in the same way.'
17015: '@rSo, even if he were to step in a puddle,@k the sound he would make would be far smaller than that of the rain hitting the puddles...'
17016: '@rGenji also had that ability.@k ...Well, in the first place, that was how the servants were supposed to be, even going by the name of furniture.'
17017: '@rJust like how desks and closets go unnoticed by members of the family,@k the servants also treated being able to show up unobtrusively when they needed to as their greatest virtue.'
17018: '@rIn that sense, Shannon''s footsteps still strongly asserted themselves.'
17019: '@r...She was also trying to hide her footsteps,@k but compared to Kanon and Genji, well, you could say she was a little more lively...'
17020: '@rEventually they reached the back door, and the three of them entered the mansion.'
17021: '@rImmediately, .........they thought they felt something.'
17022: '@rIt wasn''t quite a sense of smell, ...rather, they felt it from the depths of their noses,@k ......and this hard-to-describe sensation, which you might call a sixth sense, allowed them to perceive that something was different than usual.'
17023: 'Kanon@r@v16/30600006."............Genji-sama."'
17024: 'Genji@r@v14/31600013."...Yes. We must hurry."'
17025: '@rThat perception caused them to feel that something tense was closing in on them.'
17026: '@rRealizing that, the three of them dashed up the stairs, aiming for Kinzo''s study, still hiding their footsteps.'
17027: '@rWhen they dashed up the stairs, ...that smell of sweet poison particular to Kinzo''s study reached their noses.'
17028: 'Genji@r@v14/31600014.".....................hm."'
17029: 'Shannon@r@v15/30500022."What is it, Genji-sama...?"'
17030: 'Kanon@r@v16/30600007."......The barrier is...dead."'
17031: 'Shannon@r@v15/30500023."Huh?@k @v15/30500024................Ah."'
17032: '@rAfter hearing Kanon, she looked at the door to the study.@k@rA scorpion pattern was engraved on the doorknob.'
17033: '@rA powerful magic-repellent.@k The final barrier, which protected Kinzo himself.@k@r@|@yIt had been broken.'
17034: '@rOf course, there was no change to the doorknob that the eye could see.@k@rHowever, they who could understand things that people couldn''t perceive, were able to recognize the dramatic change...'
17035: 'Genji@r@v14/31600015."......My lord.@k@v14/31600016. My lord...!@k @|@y@v14/31600017.It is Genji.@k@v14/31600018. Please open this door."'
17036: '@rGenji called in this way after knocking several times, but there was no answer from the study.'
17037: 'Genji@r@v14/31600019."Shannon, protect our backs.@k@v14/31600020. Kanon, search inside the room."'
17038: '@r@o75.@v16/30600008|15/30500025.""Yes...!""'
17039: '@rKanon put his ear against the door, searching for a presence inside the study.'
17040: '@rTo protect the backs of the other two, who were watching the door, Shannon faced the other way, with her back to them, prepared for the unexpected.'
17041: 'Kanon@r@v16/30600009."............The Master is here, I believe.@k@v16/30600010. ...However, it''s too quiet."'
17042: 'Genji@r@v14/31600021."Then he is safe?"'
17043: 'Kanon@r@v16/30600011."No.@k@v16/30600012. It is too quiet."'
17044: 'Shannon@r@v15/30500026."...It............couldn''t be..."'
17045: 'Genji@r@v14/31600022."My lord.@k@v14/31600023. Excuse us about the door."'
17046: '@rGenji pulled a gold key out of his pocket.@k@rIt was the only key to the study that existed, other than the one Kinzo held.'
17047: '@rHe stuck it in the keyhole, and turned it heavily.@k@r......At a glance, that would have indicated that it really was a strong lock.'
17048: '@rHowever, the fact that the barrier had been destroyed...@kmeant that this door had long been wide open for anyone with magical power...'
17049: '@rThe lock made a heavy sound, indicating that the door had been opened to humans as well.'
17050: 'Genji@r@v14/31600024."......Excuse me."'
17051: '@rAs Genji respectfully bowed his head,@k and Kanon''s sense of tension grew tighter,@k and Shannon acted nervous, they entered the study...'
17052: '@rThey immediately discovered Kinzo''s figure.'
17053: '@r......He was sitting in a reception sofa so that his back faced them.'
17054: '@rGenji noticed the person sitting across from him, and again bowed deeply.'
17055: '@rKanon also noticed that person,@k@|@y ......and he didn''t bow his head.'
17056: '@rHe went in front of Shannon and spread both arms, blocking the way to her.'
17057: '@rSo without even seeing that person''s face, Shannon already had a good idea who it was...'
17058: 'Genji@r@v14/31600025."...So you have come.@k@|@y@v14/31600026. BEATRICE-sama."'
17059: 'BEATRICE@r@v27/30700764."Genji, is it?@k@v27/30700765. You came very quickly.@k@|@y@v27/30700766. Yes, it is better when furniture answers its master''s call quickly.@k@v27/30700767. Very different from this person."'
17060: 'Genji@r@v14/31600027."........................@k@v14/31600028. ......So Ronove-sama has come as well."'
17061: '@rGenji directed his greeting towards the thin darkness behind and to the right of BEATRICE, where nothing appeared to be.'
17062: '@rEven Kanon and Shannon couldn''t have imagined that someone would be there.'
17063: '@r......However, the darkness answered immediately, and praised Genji''s eyesight...'
17064: 'Ronove@r@v31/33100260."As usual, you don''t disappoint.@k@v31/33100261. It has been quite some time.@k@v31/33100262. .........Dear me, you have gotten old, haven''t you?@k@v31/33100263. Have you really reached that age?"'
17065: 'Genji@r@v14/31600029."I have lived a full life.@k@v14/31600030. ...It appears that your life has grown to be even more full, Ronove-sama."'
17066: 'Ronove@r@v31/33100264."Yes.@k@v31/33100265. Thank you.@k@|@y@v31/33100266. .........And Shannon, it has been a long time since I last saw you, as well.@k@v31/33100267. You have grown quite beautiful.@k@v31/33100268. And, it seems that you have grown quite strong.@k@v31/33100269. It is good to see."'
17067: 'Shannon@r@v15/30500027."............Thank you very much."'
17068: 'Kanon@r@v16/30600013."......Nee-san, who in the world..."'
17069: 'Ronove@r@v31/33100270."This will be the first time I have met you, Kanon-kun.@k@v31/33100271. ......I have been entrusted with the position of BEATRICE-sama''s head furniture. My name is Ronove.@k@v31/33100272. ......I am an old friend of Genji-san''s.@k@v31/33100273. I am also furniture, just like you.@k@v31/33100274. Although the master I serve is different."'
17070: '@rThe color of tension didn''t disappear from Kanon''s expression in the slightest.'
17071: '@r......Serving under a different master, furniture could become kind, brutal, or anything else as desired.'
17072: '@r...If he called himself furniture serving the hated BEATRICE,@k then surely he was a despicable being as well...'
17073: 'BEATRICE@r@v27/30700768."*cackle*cackle*!@k @v27/30700769.It seems that I''m completely despised.@k@v27/30700770. It''s as though you hate everything to do with me."'
17074: '@rBEATRICE openly sneered at Kanon''s hate-filled face...'
17075: '@rThen, Kanon finally observed.'
17076: '@rBEATRICE and Kinzo were enjoying a chess game, sitting in facing reception sofas.'
17077: '@rBut Kinzo hadn''t even quivered.@k He was holding his head with both hands, his eyes closed tight, ...as he contemplated his next move.'
17078: '@r......No, was he in anguish...?'
17079: 'Shannon@r@v15/30500028.".........My lord........."'
17080: 'BEATRICE@r@v27/30700771."I have told Kinzo two things.@k@v27/30700772. There was good news and bad news.@k@|@y@v27/30700773. ......The good news was that he would have the fortune of being reunited with me before the ritual even ends.@k@v27/30700774. The bad news was that Kinzo had been selected for the very first sacrifice of the ceremony."'
17081: 'BEATRICE@r@v27/30700775."*cackle*cackle*!@k @v27/30700776.There''s absolutely nothing I can do about it.@k@v27/30700777. Because it truly was decided by the fickle roulette."'
17082: 'Kanon@r@v16/30600014."...L-liar.@k@v16/30600015_b. You just take pleasure in killing people......"'
17083: 'Shannon@r@v15/30500029."Stop it, Kanon-kun......"'
17084: 'BEATRICE@r@v27/30700778."......So, Kinzo.@k@v27/30700779. Isn''t it about time you decided to accept your loss?@k @v27/30700780.......*cackle*, by this, our long lasting contest is resolved, right?"'
17085: 'Kinzo@r@v01/31500115."................................."'
17086: '@rAt a glance, you couldn''t tell the current situation on that chaotic chessboard.'
17087: '@r...However, judging from Kinzo''s anguish and BEATRICE''s malicious relaxedness,@k it looked as though it was already decided...'
17088: 'Kinzo@r@v01/31500116."............It is unavoidable...@k@v01/31500117. ...Is this also entertainment?"'
17089: 'BEATRICE@r@v27/30700781."It is to me too.@k@v27/30700782. ......Concluding my contest with you may bring a flood of emotions, but it has already surpassed love and hate.@k@|@y@v27/30700783. ...It was fun.@k@v27/30700784. Several decades that were not boring...!"'
17090: '@rBEATRICE advanced her queen, and made her final move.'
17091: '@r......It was thus...@w500.decided.'
17092: 'BEATRICE@r@v27/30700785."Checkmate.@k@v27/30700786. .........This is a final tribute from me to you.@k@v27/30700787. Without reserve,@v27/30700788. ...sleep."'
17093: 'Kinzo@r@v01/31500118."Heheheh,@v01/31500119. ......fuhahaha,@v01/31500120. haah@w166.hah@w166.hah@w166.hah@w166.hah@w166.hah@w166.hah!!"'
17094: '@rKinzo suddenly stood up and laughed, like an opera singer facing a full crowd and spreading his arms,@k ...as though he had succeeded in a century-long plan.'
17095: '@rThat laugh...@w416....spat crimson.'
17096: '@rCrimson flames poured out from inside him,@k spitting even out of his mouth, ears, and nose, and all at once, his body was wrapped in hellfire...'
17097: '@rBut Kinzo kept laughing.'
17098: '@rThe more he laughed, the more the hellfire spewed from his entire body, and began to char him...'
17099: '@rThose flames became a brilliant light,@k which dazzlingly shone on the various magic tools throughout the room, and made their distorted shadows dance across the walls.'
17100: '@r...Those shadows looked like the dead in hell, in ecstasy over Kinzo as he burned...'
17101: '@rAnd,@w250. for one who had made a contract with a witch,@w416. and who had reached the end of that contract,@w333. ...it was an extremely fitting end...'
17102: '@rAfter laughing and howling in the roaring flames for some time,@k Kinzo flopped to the ground, as though he was a puppet whose strings had been cut.@|@y'
17103: '@rThose incredible blazing flames disappeared as though they had burned up everything there was to burn,@k and afterwards, all that was left was a festering and burnt body that would make you want to avert your eyes...'
17104: 'Kanon@r@v16/30600016.".....................Horrible..."'
17105: 'BEATRICE@r@v27/30700789."Hmph.@k@v27/30700790. You should talk.@k@v27/30700791. Even though you think that was a fitting way for him to die..."'
17106: 'Kanon@r@v16/30600017."......Why have you shown yourself...?@k @v16/30600018.Do you have some business with us...?"'
17107: 'Shannon@r@v15/30500030."Stop it, Kanon-kun.@k@v15/30500031. ......You must not provoke BEATRICE-sama."'
17108: 'Ronove@r@v31/33100275."It appears that you have completely terrified them.@k@v31/33100276. Pu ku ku ku."'
17109: 'BEATRICE@r@v27/30700792."It seems I just can''t get along with Kanon.@k@v27/30700793. A pity, I must say I quite like him myself...?"'
17110: '@rBEATRICE smiled broadly, or perhaps wickedly.'
17111: '@rKanon violently averted his gaze, obviously disturbed.'
17112: '@r...His reaction was so different from what he had obviously intended that it made the witch and her butler laugh.'
17113: 'Genji@r@v14/31600031."Kanon.@k@v14/31600032. ......You stand in the presence of BEATRICE-sama.@k@v14/31600033. Carefully consider your manner of speech."'
17114: 'BEATRICE@r@v27/30700794."Oh, there is no problem, Genji.@k@v27/30700795. Let him say as he likes.@k@v27/30700796. I am gracious."'
17115: 'Kanon@r@v16/30600019."......How are you gracious...!"'
17116: 'BEATRICE@r@v27/30700797."I am always gracious to those who are about to die.@k@v27/30700798. *cackle*cackle*...!"'
17117: '@rKanon was brought to sudden realization by that creepy laughter...@kBEATRICE''s reason for being here was not just to take Kinzo''s life.'
17118: '@rThe first twilight required six sacrifices.@k@rKinzo alone wasn''t nearly enough.@k@r...And they had just nonchalantly come to this place...'
17119: 'BEATRICE@r@v27/30700799."*cackle*cackle*cackle*!@k @v27/30700800.Don''t worry, Kanon.@k@v27/30700801. ......You won''t be selected as sacrifices just because you came here.@k@|@y@v27/30700802. ......It was because you were selected as sacrifices that you were called here...!"'
17120: 'Kanon@r@v16/30600020.".........What.........!"'
17121: '@rThey instinctively figured it out immediately...'
17122: '@rSix sacrifices were required for the first twilight.@k@rAfter Kinzo, how many more would you need to add up to six?'
17123: '@r......In this mansion, the number 5 instantly made them think of the number of servants here...'
17124: 'Genji@r@v14/31600034."............Is that...what you desire?"'
17125: 'BEATRICE@r@v27/30700803."Mmhm.@k@v27/30700804. ...Thank me, furniture.@k@|@y@v27/30700805. Your days of suffering have tonight finally come to an end.@k@v27/30700806. You should thank me, as I have come to tell you this."'
17126: 'Genji@r@v14/31600035.".........Certainly.@k@v14/31600036. If that is your desire."'
17127: 'Kanon@r@v16/30600021."...G-@v16/30600022.......Genji-sama..."'
17128: '@rGenji had agreed to the witch''s heartless announcement in his usual manner, without raising an eyebrow.'
17129: 'Genji@r@v14/31600037."After the Master''s death, BEATRICE-sama is our master.@k@v14/31600038. Answering her demand is our final duty.@k@|@y@v14/31600039. ......Shannon.@k@v14/31600040. Kanon.@k@v14/31600041. You have done well serving until today.@k@v14/31600042. That hard work is now over."'
17130: 'Ronove@r@v31/33100277."......As I expected of you, Genji.@k@v31/33100278. As fellow furniture, I think honorably of you."'
17131: 'Genji@r@v14/31600043."Shannon.@k@v14/31600044. ......Do you have any objections?"'
17132: 'Shannon@r@v15/30500032."......No."'
17133: 'Genji@r@v14/31600045.".........I heard that George-sama gave you a ring.@k@v14/31600046. Even so, you have no regrets?"'
17134: 'Shannon@r@v15/30500033."No.@k@v15/30500034. ......That blessing was more than furniture deserves.@k@v15/30500035. ...Just receiving the ring has already fulfilled my feelings."'
17135: '@rShannon had not yet reached as high of a philosophical state of mind as Genji.'
17136: '@rThere probably really were regrets left in her heart.@k ...She probably wanted to spend a little more warm time with the person of her thoughts, George.'
17137: '@r......But she released herself from that.@k She took a single deep breath, and from that point on, the expression she wore was blank.'
17138: 'Genji@r@v14/31600047."...............Very good."'
17139: 'Ronove@r@v31/33100279."I am a little surprised that you have been able to calm yourself this much, Shannon.@k@v31/33100280. It seems that you have also come to terms with things as furniture."'
17140: 'BEATRICE@r@v27/30700807."Won''t you at least shed some bitter tears for not being able to spend a night with the man you love?@k@v27/30700808. What a boring woman."'
17141: 'Shannon@r@v15/30500036."............@k@v15/30500037. .........This feeling cannot be understood by the likes of you, BEATRICE-sama.@k@v15/30500038. ......If you desire our lives, please accept them.@k@v15/30500039. We will solemnly carry out that duty."'
17142: 'Genji@r@v14/31600048."......Good.@k@v14/31600049. Well said..."'
17143: 'Ronove@r@v31/33100281."Pu ku ku ku.@k@v31/33100282. Just the type of person BEATRICE-sama is bad with."'
17144: 'BEATRICE@r@v27/30700809."Recently, this one has become quite detached.@k@v27/30700810. ...It seems that I tortured her too much last time.@k@v27/30700811. Speaking of which, didn''t I do the same to Battler?"'
17145: 'BEATRICE@r@v27/30700812."...Hmmm.@k@v27/30700813. Am I still soft?@k @v27/30700814.Or is my style of cornering them lacking?@k @v27/30700815.In any case, she''s just no fun."'
17146: 'BEATRICE@r@v27/30700816.".........However, it seems that you will still entertain me, right?@k @v27/30700817.Kanooon?"'
17147: 'Shannon@r@v15/30500040."............Kanon-kun..."'
17148: 'Kanon@r@v16/30600023.".................."'
17149: '@rCompared to the two who had attained a philosophical state of mind, ...there was a painful anguish on Kanon''s face.'
17150: '@rKanon was still far too young to accept his demise without regrets,@k after being told of it by a suddenly appearing witch...'
17151: 'BEATRICE@r@v27/30700818."......Kanon.@k@v27/30700819. I detest boredom more than anything.@k@v27/30700820. And it isn''t interesting that those other two have obediently accepted their deaths.@k@v27/30700821. ......So I don''t want you to betray my expectations."'
17152: 'Kanon@r@v16/30600024."............Are you trying to make me your plaything...?"'
17153: '@rKanon realized that he was being provoked.'
17154: '@r...However, no matter how much anger spurred him on, his opponent was a witch.@k He was furniture.@k He had no chance of victory from the beginning.'
17155: '@rBut the witch was expecting that he would struggle in vain and writhe around,@k and was looking forward to it...'
17156: '@r......Just thinking about that was frustrating enough to get his blood boiling.'
17157: '@rWas disappointing the witch by refusing to resist, like the other two,@k the only way he could strike back at her...?'
17158: 'BEATRICE@r@v27/30700822."Eldest of the Seven Sisters of Purgatory, Lucifer.@k@v27/30700823. Arise."'
17159: 'Lucifer@r@v38/32300041."......Lucifer of Pride, right here."'
