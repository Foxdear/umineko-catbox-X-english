18209: 'Battler@r@v10/30100949."......Alright, it''s starting to get interesting, isn''t it?@k @v10/30100950.Six people died in locked rooms, and no one else was inside.@k@v10/30100951. And there was no meddling from the outside, and also no traps.@k@v10/30100952. If I was still how I used to be, I would probably think this had to be the work of magic."'
18210: 'Battler@r@v10/30100953."......And if you had acted out some strange magic right about now, I''d probably even have surrendered.@k@v10/30100954. .........It''s that favorite strategy of yours."'
18211: 'Battler@r@v10/30100955."...You completely intercept all of my moves, and in the moment that I''ve tried everything and fallen to my knees,@k@v10/30100956. when my heart''s defensive power is at its weakest, you show off some strange magic and take the game all at once!!"'
18212: 'VIRGILIA@r@v30/33200340.".........She has always had a short temper.@k@v30/33200341. She still has that bad habit of rushing things when victory is in sight."'
