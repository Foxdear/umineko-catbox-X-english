18219: 'Battler@r@v10/30100962."Yeah, that''s no good, no good, no goddamn good at all!@k @v10/30100963.That''s right, it''s not about how to kill from the outside.@k@v10/30100964. It''s about how they died inside the room and created a locked room!"'
18220: 'Battler@r@v10/30100965."......That''s it, this is the answer!!@k @v10/30100966.If you assume that one of the six victims was the culprit,@k@v10/30100967. this locked room can be explained extremely easily!"'
