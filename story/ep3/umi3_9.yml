18206: 'Battler@r@v10/30100944."...But that was actually wrong.@k@v10/30100945. You''re also frantically resisting my comeback, fighting to show that you exist...!@k @v10/30100946.Now,@v10/30100947. ...I finally really feel that''s true."'
18207: '@rThis isn''t torture inflicted on me about whether I''ll submit or not.'
