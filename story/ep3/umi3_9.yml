18215: 'BEATRICE@r@v27/30701272."It is your turn, Battler!@k @v27/30701273.The "trap piece" that you advanced, I have cut down with red!@k @v27/30701274.What will you send out next?@k @v27/30701275.Show me what you''ve got!!"'
18216: 'Battler@r@v10/30100957."Right!!@|@y@k @v10/30100958.Now that even traps have been defeated, at a glance, this looks like a perfect locked-room murder.@k@|@y@v10/30100959. ......And that''s why this is where I''ll flip over the chessboard!!"'
