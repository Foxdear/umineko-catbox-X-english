18236: 'Battler@r@v10/30100981."Hmmmm?@k @v10/30100982.What''s wrong, six people were killed, right?!@k @v10/30100983.I''m just checking the simplest premise we had at the very beginning, aren''t I?@k@|@y @v10/30100984.Can''t you repeat it?!"'
