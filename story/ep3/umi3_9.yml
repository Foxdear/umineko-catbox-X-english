18154: 'BEATRICE@r@v27/30701218."That''s true, but...@k@v27/30701219....muu!"'
18155: '@rBEATRICE puffed out her cheeks, as though saying "I don''t know why, but I don''t like it!"'
18156: 'VIRGILIA@r@v30/33200329."Because the police have not yet arrived at the scene, the human side''s ability to prove things is limited.@k@v30/33200330. For a strict confirmation of death, I recommend a repetition request."'
18157: 'Battler@r@v10/30100897."Alright, that''s where I''ll strike, repetition requested!!"'
18158: 'Battler@r@v10/30100898."''The six victims are all dead''!!"'
18159: 'Ronove@r@v31/33100373."......Milady, you have a repetition request waiting, you know?"'
18160: 'Battler@r@v10/30100899."Hey, enough lazing around!!@k @v10/30100900.Do you decline the repetition?!@k @v10/30100901.This is where our battle starts!!"'
18161: 'BEATRICE@r@v27/30701220."Wha?!@k @v27/30701221.Owowowowoow!!@|@y@k @|@y@v27/30701222.*cackle*cackle*, sorry, sorry, that''s fine, I''ll respond."'
18162: 'BEATRICE@r@v27/30701223."@|@y@c900.@[Kinzo, Genji, Shannon, Kanon, Gohda, and Kumasawa—these six are all dead!@]@c."'
18163: 'Battler@r@v10/30100902."Why are you so out of it?@k@|@y@v10/30100903. ...Alright.@k@v10/30100904. So I''ve drawn one out of you.@k@v10/30100905. That classic where they''re pretending to be dead is the first to be denied."'
18164: 'BEATRICE@r@v27/30701224."*cackle*!@k @v27/30701225.I won''t go easy on you anymore, come at me how you like.@k@v27/30701226. I''ll slice them slantwise one after another!"'
