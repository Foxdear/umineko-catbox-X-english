18223: 'Ronove@r@v31/33100393."......Certainly.@k@v31/33100394. If the culprit locked themselves in the final locked room,@k@v31/33100395. and threw away their own life, this locked-room chain would be established."'
18224: 'VIRGILIA@r@v30/33200342."The culprit''s suicide.@k@v30/33200343. ...Normally, it is an unthinkable move,@v30/33200344. but the argument that it doesn''t exist because it is unthinkable,@v30/33200345. doesn''t exist.@k@v30/33200346. ......And he has no responsibility to demonstrate a motive.@k@v30/33200347. A truly powerful move, which can only be used in a chess match against a witch...!"'
18225: 'Ronove@r@v31/33100396."......Well, you cannot say for certain that there is no motive.@k@v31/33100397. ...For example, Kinzo had been pronounced as having only a short time left to live.@k@v31/33100398. The motive of using his own death as a message, not being afraid to lose his short remaining life,@k@v31/33100399. ...may not be impossible to attach."'
18226: 'Ronove@r@v31/33100400.".........Milady.@k@v31/33100401. It is our turn."'
18227: 'BEATRICE@r@v27/30701282."H-...hmm!@k @v27/30701283.To imagine that you would even trample on the dignity of the dead to create a culprit...!@k @v27/30701284.What a heartless, cold-blooded man...!"'
18228: 'Battler@r@v10/30100971."Setting up the dead as the culprit.@k@v10/30100972. ...This move is worse than inhuman, and it''s one you used to attack Kanon-kun in the last game.@k@|@y@v10/30100973. ......I''m taking a shot back at you with this move,@k@v10/30100974. as a tribute to Kanon-kun for that time, even though the games are different."'
18229: 'Battler@r@v10/30100975."Just now, I have freed that Kanon-kun from his regrets!!"'
18230: 'BEATRICE@r@v27/30701285."Ku......kuuuuuuu......!!"@|@y'
