18147: 'VIRGILIA@r@v30/33200326."Nanjo checked that all of them were dead.@k@v30/33200327. However, due to the "Devil''s Proof", it is impossible to deny the possibility of a wrong diagnosis.@k@v30/33200328. ......In other words, she cannot make the likelihood that Nanjo overlooked the fact that they were alive equal to zero."'
18148: 'Battler@r@v10/30100895."Here it is, that "Devil''s Proof".@k@v10/30100896. But there exists a sword which can carve that up...!"'
18149: 'BEATRICE@r@v27/30701212."Wh-what are those people doing?@k@v27/30701213. ......Looks like they''re having a good time leaving me out of the discussion.@k@v27/30701214. I am their opponent, right...?@k @v27/30701215.They could pay attention to me at least a little..."'
18150: 'Ronove@r@v31/33100369."By nature, communication with the opponent is not necessary in order to compete in chess."'
18151: 'Ronove@r@v31/33100370."......You spoke in riddles when you communicated outside your moves, Milady.@k@v31/33100371. ...Perhaps it has come to this because he does not want to be led astray."'
18152: 'BEATRICE@r@v27/30701216."...............muu.@k@v27/30701217. ......For some reason, I can''t accept it."'
