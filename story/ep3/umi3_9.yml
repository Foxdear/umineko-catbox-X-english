17994: '@r......The adults'' motivations aside...@k@rAt least for us kids,@k these were supposed to be a fun couple of days where we cousins deepened our friendship.'
17995: '@rHowever, when we woke up, there was an unbelievably cruel reality waiting for us...'
17996: 'Jessica@r@v04/30200097."............hic, ......hic......!"'
17997: 'George@r@v07/30300051."................................."'
17998: '@rGeorge-aniki and Jessica were crying over Shannon-chan and Kanon-kun''s deaths.'
17999: '@r......Right now, everyone who was alive was gathered in the lobby on the first floor of the guesthouse.@k And there were 12 of us.'
18000: '@r...Unbelievable, right?@k@rThere were 18 up until yesterday.@k@r...And in one night, a third of that number had lost their lives...'
18001: '@rMy agitation had finally settled down, and, along with my lack of sleep from being woken up so early in the morning,@k I was beginning to feel like this was just a little unreal.'
18002: '@r......I want to think this is some kind of bad dream...@k My cheap escapism kept telling me that was true, over and over.'
18003: '@rMaria had gone back to sleep in the sofa Auntie Rosa was sitting in.'
18004: '@r...Rather than her having nerves of steel, she probably genuinely hadn''t had enough sleep.'
18005: '@rThe adults were grasping members of Grandfather''s collection...@kof short-barrel rifles.'
18006: '@r...Apparently a remnant from the period when he was obsessed by westerns, there were four identical guns altogether.'
18007: '@rThose had been split up between the four siblings: Uncle Krauss, Auntie Eva, my dad, and Auntie Rosa.'
18008: '@rPaper boxes filled with bullets lay on the table, and the siblings were silently loading their guns.'
18009: 'Rudolf@r@v08/31200219.".........It''s a little scary.@k@v08/31200220. Even as I stand here touching this,@k@v08/31200221. I get the feeling Dad''s about to yell "Don''t touch that!" and hit me."'
18010: 'Krauss@r@v02/30800190."Then aren''t you lucky.@k@v02/30800191. ...No matter how much you touch it, you won''t be hit again."'
18011: 'Rosa@r@v12/31400198_1."............I can''t believe it.@k@v12/31400198_2. ...That Father...@v12/31400198_3..........would meet this kind of end..."'
18012: 'Nanjo@r@v19/31900013."I did think that when it came to Kinzo-san, he would probably not die normally in his bed,@k@v19/31900014. ......but even so, ......it is too horrible..."'
18013: 'Eva@r@v05/31000316."Hey.@k@v05/31000317. I wonder if that really is Father...?@k @v05/31000318.I''m suspecting that it might be a different person''s corpse as a substitute to trick us..."'
18014: 'Natsuhi@r@v03/30900076."......No, without a doubt, that is Father.@k@v03/30900077. You saw his toes, right?@k @v03/30900078.In general society, there aren''t many humans with six toes on both feet."'
18015: 'Kyrie@r@v09/31300159."But, ............we can''t say that there are none.@k@v09/31300160. I''ve heard that polydactyly isn''t a rare disease.@k@v09/31300161. He was a man who liked big tricks, right?@k @v09/31300162.......He might have prepared a body from somewhere that had the same number of toes on both feet."'
18016: 'Natsuhi@r@v03/30900079."Preposterous.@k@v03/30900080. What would possess him to do something like that...?!"'
18017: 'Hideyoshi@r@v06/31100203."......I''d agree if it was a normal person.@k@v06/31100204. ...But this is Father we''re talkin'' about.@k@v06/31100205. You can''t say for sure that what Kyrie-san says is nonsense."'
18018: 'Rudolf@r@v08/31200222."............They say it''s difficult to confirm the identity of a burnt corpse.@k@|@y@v08/31200223. However, there should be various ways to examine him from his teeth and his bone structure.@k@v08/31200224. If the police investigated, they''d be bound to know whose body it was in an instant."'
18019: 'Krauss@r@v02/30800192."The problem is that before the police, we need a telephone engineer."'
18020: 'Rosa@r@v12/31400199."......The boat probably won''t come in this typhoon.@k@v12/31400200. ...So, will it come tomorrow?"'
18021: 'Natsuhi@r@v03/30900081."I expect that the boat will come again at nine o''clock tomorrow.@k@v03/30900082. Then, I believe we will be able to contact the police."'
18022: 'Eva@r@v05/31000319."......Both us,@k@v05/31000320. and the culprit...@k@v05/31000321.have been imprisoned on this island, then, until the typhoon passes."'
18023: '@r.........Just from our parents'' conversation, you could probably figure out the general gist, but let''s explain the situation anyway.'
18024: '@rFirst, early that morning.'
18025: '@rIn various places throughout the mansion, a total of six corpses, of Grandfather and all the servants, had been found one after another.'
18026: '@rFirst, Grandfather had been fed to the flames in the boiler room, and was completely burnt.'
18027: '@rThe servants were found dead, each locked in one of the various rooms throughout the mansion onto which magic circles had been drawn.'
18028: '@rThe cause of death for the servants was uncertain,@k but according to Doctor Nanjo''s diagnosis, there was a high likelihood that they had been stabbed by something like a spear,@k ......or possibly shot by a gun.'
18029: '@rThat was why the adults had started arming themselves with the rifles.'
18030: '@rAnd what made the situation even more chaotic was that the telephone lines were out of order.@k It was unknown whether lightning had caused them to break down or whether the culprit had destroyed them.'
18031: '@rIn any case, contact with the outside was broken off, and we couldn''t contact the police.'
18032: '@rSo until tomorrow morning, when the typhoon would pass and the boat would come,@k we would have to protect ourselves.'
18033: '@rAfter all, Rokkenjima was now isolated by the typhoon.@k And just like how we were stuck on the island, so was the culprit.'
18034: '@rIt seemed that the adults had stayed up the whole night, spending the whole time holding the family conference in the mansion''s dining hall.@k And even so, this crime had occurred in the mansion.'
18035: '@r......So right when the adults had been getting worked into a frenzy over money,@k the murderer had been killing under the same roof...'
18036: '@rAunt Natsuhi said that they were strict on locking the doors and windows at night.@k@rAnd yet, some suspicious person had entered the mansion.'
18037: '@r...The adults had decided that the inside of the mansion was too large to be safe,@k so they had pulled out the guns and moved to the guesthouse, where we had been.'
18038: '@r.........Which brings us to the present.'
18039: '@rGeorge-aniki and us others begged to see Shannon-chan''s body,@k but the adults refused point blank, saying that we must not until the police arrive.'
18040: '@rThat wasn''t just because they had sealed all the rooms to preserve the scene.'
18041: '@r...After all, the culprit who had killed six people had wandered about that mansion.'
18042: '@rTo the Ushiromiya family right now, the mansion which should have been their home...@kwas like a danger zone that an unknown murderer had entered...'
18043: '@rIt makes sense, I mean, the mansion is vast.@k There are plenty of blind spots and dark places, and it''s just too vast to guarantee absolute safety with this number of people.'
18044: '@rIn contrast, the guesthouse is a much smaller building than the mansion.'
18045: '@rTwo stories tall.@k Number of rooms...about ten?@k@r......Apparently, it had originally been constructed to serve as a boarding house for when the island was to be turned into a resort.'
18046: '@rSo it''s easy to grasp the entire structure, and easy to guarantee safety.@k@rThat makes it a good place to hole up in.'
18047: '@r......And.@k There''s an extremely high likelihood that this mass murder of six people is a "game".'
18048: '@rBecause the culprit had proclaimed that in a letter.'
18049: '@rI heard that a Western-style envelope with the family crest, just like the one Maria claimed to have received from BEATRICE yesterday,@k had been found in the boiler room where Grandfather''s corpse had been discovered.'
18050: '@rThis was what the letter said:'
18051: '@r@z70.So that there will be no misunderstandings.@k@rThe game I seek is whether or not you can solve the riddle of the epitaph,@k not whether or not you can catch me.@k@r@rIf you do not solve the riddle of the epitaph, the pitiful sacrifices will further increase in number.@k@rIt would be more wise to spend your time solving the epitaph than searching for me.@k@r@rIf no one can solve the riddle of the epitaph, no one will survive.'
18052: '@r@z70.If a person appears with skill enough to solve the riddle of the epitaph, I will give them all the gold of the Golden Land,@k the Ushiromiya family headship, and all of my power.@k@r@rI was the one who succeeded the Ushiromiya family headship from Kinzo-sama.@k@rAnd I look forward to seeing who will receive the headship from me.@k@r@r——BEATRICE the Golden.'
18053: '@r...This riddle of the epitaph was...that thing.'
18054: '@rThat strange epitaph written in the same place as the portrait of the witch, displayed in the hall of the mansion.'
18055: '@rGrandfather was the one who ordered that it be written,@k and the person who solved it would, supposedly, be given the family headship or the hidden gold or something like that.'
18056: '@rEver since it was first displayed there several years ago, all the relatives, despite making fun of it in the open,@k had been secretly been challenging that riddle in private.'
18057: '@rHowever, up until today, no one had solved it.@k We had once again been told to solve that unintelligible riddle, and this time, we had been threatened that if we didn''t solve it, we would all be killed.'
18058: '@r......If this wasn''t a "game", what would you call it...'
18059: '@rThe bold opinion that we should search the premises for the culprit did come up once.'
18060: '@rHowever, there was a good chance they were armed, and there wasn''t necessarily only one of them.'
18061: '@rAnd, ...while they might have been able to kill more than six people, they had stopped at six.'
18062: '@rIn the end, the opinion that we should avoid carelessly antagonizing the culprit,@k and hole up in a safe place while we waited for the police to arrive, won out...'
18063: '@rAfter the adults had carefully checked that the doors and windows in the guesthouse were locked, they set up camp in the lobby.'
18064: '@rAnd as they fingered their guns to distract themselves from the tension,@k their expressions showed that they were already fatigued from this long day, which had still barely begun...'
18065: '@rThere was nothing that I could do.'
18066: '@rNow, all I could do was be taught how to use a gun,@k to prepare for the off-chance that...something would happen which led to an excess of guns......'
18067: '@r......That''s the way.@k Just obediently stay there, me and the rest of you.'
18068: 'Battler@r@v10/30100827."...............Six people in the beginning again.@k@v10/30100828. And this time it''s Grandfather and all of the servants put together."'
18069: 'VIRGILIA@r@v30/33200268."Most likely,@k@v30/33200269. that child has carefully studied your moves from the last game.@k@v30/33200270. And she placed the highest priority upon taking the pieces which she guessed you were most likely to first suspect."'
18070: 'Battler@r@v10/30100829."......That makes sense.@k@v10/30100830. ...Both last time, and the time before that,@k@v10/30100831. the servants who know everything about the mansion and who walk around with master keys were always highest on the list of suspicious people."'
18071: 'Battler@r@v10/30100832."......A good example in the last game is Jessica''s locked room.@k@v10/30100833. If I had only accepted that a servant was the culprit, that wouldn''t even have been a locked room."'
18072: 'VIRGILIA@r@v30/33200271."Therefore,@k@v30/33200272. ......that child went straight for them.@k@v30/33200273. She probably immediately went to block the way of escape that you would ultimately retreat into."'
18073: 'Battler@r@v10/30100834."Beato already proclaimed in red that there are no more than 18 people on this island.@k@v10/30100835. ...So basically,@v10/30100836. .........she''s saying "give it up".@k@v10/30100837. ......Now I have to suspect one of the 18."'
18074: 'VIRGILIA@r@v30/33200274."......That child will probably come at you by stealing the pieces for the 18, and descending as a 19th person who shouldn''t exist,@k@v30/33200275. thereby making you accept that she is a witch."'
18075: 'VIRGILIA@r@v30/33200276."......That is because now that her intimidation strategy of trying to force you to submit by showing you magic has failed,@k@v30/33200277. she can only make a frontal attack."'
18076: 'Battler@r@v10/30100838."......Perfect.@k@v10/30100839. Bluffing won''t work anymore."'
18077: 'VIRGILIA@r@v30/33200278."Be careful.@k@v30/33200279. Deception is a witch''s strongest point.@k@v30/33200280. ...No matter what that child says or shows you,@k@v30/33200281. it definitely won''t threaten the truth that you believe in.@k@v30/33200282. Don''t forget that."'
18078: 'Battler@r@v10/30100840.".........Sure.@k@v10/30100841. I''ll be damned if the same moves are going to work on me over and over.@k@|@y@v10/30100842. .........Get out here, BEATRICE.@k@v10/30100843. Let''s get started!!!"'
18079: 'BEATRICE@r@v27/30701160."I am already seated at the match table.@k@v27/30701161. My turn, too, is already complete."'
18080: 'Ronove@r@v31/33100356."......Imagine that Madam would turn out to be our enemy.@k@v31/33100357. How unfortunate, Milady.@k@v31/33100358. ...Our moves will be read thoroughly."'
18081: 'BEATRICE@r@v27/30701162."That is no problem.@k@v27/30701163. Master''s moves are all outdated classics.@k@v27/30701164_b. There is nothing to fear."'
18082: 'VIRGILIA@r@v30/33200283."...What moves can you make beyond the classics I taught you?@k@v30/33200284. I am looking forward to seeing, BEATRICE."'
18083: 'BEATRICE@r@v27/30701165."......*cackle*cackle*cackle*cackle*.@k@v27/30701166. Is that alright, Battleerr?@k @v27/30701167.If a person who denies witches such as yourself accepts a witch as a strategist..."'
18084: 'Battler@r@v10/30100844."That stupid provocation is useless.@k@v10/30100845. This person is my advisor, no, my second.@k@|@y@v10/30100846. That doesn''t change one bit that this is a fistfight between you and me."'
18085: 'BEATRICE@r@v27/30701168."I understand.@k@v27/30701169. ......You''re so wobbly that you probably need training wheels on your bicycle.@k@v27/30701170. Do as you like.@k@|@y@v27/30701171. Come, begin!!@k @v27/30701172.It is your turn!"'
18086: 'Battler@r@v10/30100847."Let''s begin with the reconstruction of the crime scene.@k@v10/30100848. ......VIRGILIA, if you please!"'
18087: 'VIRGILIA@r@v30/33200285."The first body discovered was Shannon''s.@k@v30/33200286. She was found in the parlor on the first floor of the mansion.@k@v30/33200287. The door and windows were locked, and a locked room was established."'
18088: 'Battler@r@v10/30100849."......Clarification request for Beato.@k@v10/30100850. Reconfirm the definition of a locked room."'
18089: 'BEATRICE@r@v27/30701173."Mmhm.@k@v27/30701174. The term "locked room" refers to a room where the inside and the outside of the room are completely isolated from all travel between them.@k@v27/30701175. Of course, no form of intrusion or escape, nor even any interference is possible.@k@v27/30701176. That is comprehensive, including a denial of hidden doors, as well as all margin for interference from the outside."'
18090: 'BEATRICE@r@v27/30701177."......Henceforth, this definition will be referred to as:@v27/30701178.@|@y "BEATRICE''s locked-room definition"!"'
18091: 'Battler@r@v10/30100851."Confirming specifics.@k@v10/30100852. ......Define "margin for interference from the outside"."'
18092: 'BEATRICE@r@v27/30701179."It refers to all types of direct interference from the outside, such as using a fishing line or a long, thin rod.@k@v27/30701180. In other words, you are to conclude that there is not even any gap in the doors or windows by which to use such tricks."'
18093: 'Battler@r@v10/30100853."I wonder about that?@k @v10/30100854.Even if there wasn''t a gap, you should be able to interfere with radio waves, like with a remote control, right?"'
18094: 'BEATRICE@r@v27/30701181."Very well.@k@v27/30701182. I add to this definition that it is impossible for radio waves and related methods of remote control to interfere."'
18095: 'Battler@r@v10/30100855."There''s also an extension telephone in the parlor.@k@v10/30100856. A device linked with that wouldn''t count as remote control, right?!"'
18096: 'BEATRICE@r@v27/30701183."The phones are already out of order, damn you.@k@|@y@v27/30701184. ...Ugh, this is a pain.@k@v27/30701185. I''ll include that too.@k@v27/30701186. All direct and indirect methods of interfering from the outside of the room to the inside of the locked room are impossible."'
18097: 'Battler@r@v10/30100857."What about a voice or a knock?@k @v10/30100858.Those should be able to interfere from the outside without entering the room, right?"'
18098: 'BEATRICE@r@v27/30701187.".........Even though it is a locked room, it probably isn''t impossible for someone to knock or call out.@k@v27/30701188. Whether the room allows for human communication with the outside or not, it does not go against the definition of a locked room."'
18099: 'Battler@r@v10/30100859."In other words, you can''t define it so that even methods of communication are interrupted?"'
18100: 'Ronove@r@v31/33100359."That is the case."'
18101: 'Battler@r@v10/30100860."Understood.@k@v10/30100861. .........So, Shannon-chan''s parlor satisfies "BEATRICE''s locked-room definition"?"'
18102: 'BEATRICE@r@v27/30701189."That is correct."'
18103: 'Battler@r@v10/30100862.".........Locked-room definition understood.@k@v10/30100863. Continue, VIRGILIA."'
18104: 'VIRGILIA@r@v30/33200288."Yes."'
18105: 'VIRGILIA@r@v30/33200289.".........Shannon''s body was in possession of one master key.@k@v30/33200290. The relatives who discovered her collected this."'
18106: 'Battler@r@v10/30100864."Repetition request for Beato.@k@v10/30100865. How many master keys this time?"'
18107: 'BEATRICE@r@v27/30701190."...Hmph. The same as last time.@k@v27/30701191.@|@y@c900. @[There are five, one for each servant.@]@c."'
18108: 'Battler@r@v10/30100866."Which means this still isn''t a locked room.@k@v10/30100867. There are still four master keys left.@k@v10/30100868. It just means that after Shannon-chan was murdered, one of the other four keys locked it."'
18109: 'Ronove@r@v31/33100360."That is correct.@k@v31/33100361. .........And, it wasn''t only a master key that was found."'
18110: 'VIRGILIA@r@v30/33200291."Yes."'
18111: 'VIRGILIA@r@v30/33200292."......Alongside the body, there was a Western envelope with the family crest.@k@v30/33200293. Instead of a letter, the key to the second-floor guest room was inside it."'
18112: 'Battler@r@v10/30100869."......The key to the second-floor guest room...@k@v10/30100870. Am I fine to define that as the only key other than the master keys that can open the door to the second-floor guest room?"'
18113: 'BEATRICE@r@v27/30701192."Indeed. There is no problem.@k@v27/30701193. And, unlike the master keys, there is only one."'
18114: 'Ronove@r@v31/33100362."In other words, in order to unlock a specific room, in addition to the five master keys,@k@v31/33100363. there is only one other key."'
18115: 'Battler@r@v10/30100871."......In other words, this is a message telling them to go to the second-floor guest room next?@k @v10/30100872.So the adults moved to the second-floor guest room?"'
18116: 'VIRGILIA@r@v30/33200294."Yes."'
18117: 'VIRGILIA@r@v30/33200295."The door to the second-floor guest room was also locked, and a magic circle was drawn on it.@k@v30/33200296. ......The relatives unlocked it with the key they had found near Shannon''s body."'
18118: 'VIRGILIA@r@v30/33200297."Inside the room, Kumasawa''s body was discovered.@k@v30/33200298. The room was a locked room.@k@v30/33200299. That definition is based upon "BEATRICE''s locked-room definition"."'
18119: 'VIRGILIA@r@v30/33200300.".........Kumasawa was in possession of one master key.@k@v30/33200301. The relatives collected this."'
18120: 'VIRGILIA@r@v30/33200302."And like Shannon, there was a Western envelope discovered alongside her.@k@v30/33200303. Inside was the key to the third-floor servants'' quarters.@k@v30/33200304. The relatives moved to the third-floor servants'' quarters."'
18121: 'Battler@r@v10/30100873."And there was a magic circle on the door to the third-floor servants'' quarters, and that door was locked?"'
18122: 'VIRGILIA@r@v30/33200305."Yes."'
18123: 'VIRGILIA@r@v30/33200306."Inside the room, Gohda''s body was discovered.@k@v30/33200307. The room was a locked room.@k@v30/33200308. Based on "BEATRICE''s locked-room definition"."'
18124: 'VIRGILIA@r@v30/33200309."Gohda was in possession of one master key.@k@v30/33200310. The relatives collected this."'
18125: 'VIRGILIA@r@v30/33200311."And just as before, a Western envelope with a family seal was discovered.@k@v30/33200312. Inside was the key to the second-floor VIP room.@k@v30/33200313. The relatives moved to the second-floor VIP room."'
18126: 'Battler@r@v10/30100874.".........What is all of this...?@k @v10/30100875.What the hell are you planning...?"'
18127: 'BEATRICE@r@v27/30701194."*cackle*cackle*.@k@v27/30701195. It isn''t something worth glaring at me over, is it?@k @v27/30701196.It is a locked room, but there are still several master keys that can open it, correct?@k@v27/30701197. And I have even been dutiful enough to present you with the keys particular to each room in addition to the master keys."'
18128: 'Battler@r@v10/30100876."......I don''t like how this is going.@k@|@y@v10/30100877. ......But I''m starting to see how things will turn out.@k@v10/30100878. So it continues like this for all six people?"'
18129: 'VIRGILIA@r@v30/33200314."Yes, that is correct.@k@v30/33200315. Inside the second-floor VIP room, Genji''s body was discovered."'
18130: 'VIRGILIA@r@v30/33200316."One master key was collected.@k@v30/33200317. The key to the underground boiler room was discovered."'
18131: 'VIRGILIA@r@v30/33200318."They moved to the underground boiler room.@k@v30/33200319. Inside the underground boiler room, Kinzo''s body was discovered."'
18132: 'VIRGILIA@r@v30/33200320."The key to the chapel was discovered."'
18133: 'VIRGILIA@r@v30/33200321."They moved to the chapel."'
18134: 'VIRGILIA@r@v30/33200322."Inside the chapel, Kanon''s body was discovered.@k@v30/33200323. One master key was collected.@k@v30/33200324. The key to the first-floor parlor was discovered.@k@v30/33200325. ......With this, our reconstruction of how all six bodies were discovered is complete."'
18135: 'Ronove@r@v31/33100364."A supplement.@k@v31/33100365. Along with the key to the chapel, a letter was enclosed in the Western envelope found near Kinzo''s body.@k@v31/33100366. The contents of the letter were as you saw.@k@v31/33100367. It further urged the relatives to solve the epitaph''s riddle."'
18136: 'Battler@r@v10/30100879.".........In that case...@k@v10/30100880. ...What''s going on?@k@v10/30100881. If the last place, where Kanon-kun was, had the key to the very first room, the parlor, where Shannon-chan was...@k@v10/30100882. That makes six locked rooms, all tied together, right?"'
18137: 'BEATRICE@r@v27/30701198."That is correct!@k @v27/30701199.The six locked rooms are all tied together.@k@v27/30701200. The keys to unlock each are all shut up inside the next room."'
18138: 'BEATRICE@r@v27/30701201."In other words, the six locked rooms form one massive locked room,@k@v27/30701202. and all of the master keys as well as the individual room keys are shut up inside it...!"'
18139: 'BEATRICE@r@v27/30701203."@|@y@c900.@[Furthermore, all of the doors and windows in the six rooms are normal.@]@c.@k@v27/30701204.@|@y@c900. @[No device exists which can lock them without a key, such as an auto-lock.@]@c.@k@v27/30701205. *cackle*cackle*, what do you think, it''s beautiful, isn''t iiiiiiiiiiiit??? Uhhyahhyahhyaaahh!"@|@y'
18140: 'Ronove@r@v31/33100368."As I said, Milady, that is not dignified."'
18141: '@rWhen Ronove rebuked her, Beato stuck her tongue at him shamelessly.'
18142: 'BEATRICE@r@v27/30701206."Uhihihi, sorry, sorry.@k@v27/30701207. I just get in such a good mood playing with Battler."'
18143: 'BEATRICE@r@v27/30701208."*cackle*, so, Battlerr?@k @v27/30701209.What is your move going to be?@k @v27/30701210.If you can''t think of anything in particular, I can show you how I made the goats carry the bodies,@k@v27/30701211. and sealed all of the rooms with magic, if you waaaaant?"'
18144: 'Battler@r@v10/30100883."Do what you want.@k@v10/30100884. I''ll listen respectfully to this "magic theory" that you assert.@k@v10/30100885. However, I can assert my "human theory", which is completely different from your claim,@k@v10/30100886. without any interference from your claim whatsoever."'
18145: 'Battler@r@v10/30100887."So, in other words!@k @v10/30100888.There''s no need for me to listen to your bullshit!!@k @v10/30100889.Go wave your magic staff or whatever as much as you like and act out how you lock the door with your seven-colored magic.@k@v10/30100890. And before long, I''m sure there''ll be people along to stand beside you, advertising their snake oil and all-purpose kitchen knives!"'
