18262: '@rBeato normally behaves elegantly, but she actually has a really short temper and gets mad easily.'
18263: '@r......Her normal intelligence falls silent when she starts getting agitated.'
18264: 'VIRGILIA@r@v30/33200355."Ronove is composed.@k@v30/33200356. ...He probably gave that child some time to cool her head.@k@v30/33200357. ......That child was stubbornly trying to remove your check,@k@v30/33200358. and was going to easily let several large pieces go.@k@v30/33200359. ...After all, the first twilight is only a skirmish.@k@v30/33200360. ......That child mistook her timing."'
18265: 'Battler@r@v10/30101012."......So, what does it mean?@k@v10/30101013. Did I create a checkmate, or didn''t I?"'
18266: 'VIRGILIA@r@v30/33200361."That child was going to proclaim it in red.@k@v30/33200362. It probably wouldn''t have become checkmate yet.@k@v30/33200363. ......But, I imagine,@k@v30/33200364. that child will proclaim her resignation once she has cooled her head."'
18267: 'Battler@r@v10/30101014."...Surely not.@k@v10/30101015. Even though she hates losing...?"'
18268: 'VIRGILIA@r@v30/33200365."Yes.@k@v30/33200366. In a losing battle, it is essential to withdraw your troops as soon as possible to try to minimize your losses.@k@v30/33200367. ......The difficult part is measuring whether it is a losing battle or not.@k@v30/33200368. ...It seems that that child''s butler calmly made that decision."'
18269: 'Battler@r@v10/30101016."......Oh well.@k@v10/30101017. In other words, she got away with only a second to spare.@k@v10/30101018. ......Looks like...@k@v10/30101019.I won''t be getting checkmate and delivering the final blow so easily."'
18270: 'VIRGILIA@r@v30/33200369."However, you should measure this as your victory.@k@v30/33200370. They seem to have just barely prevented a large loss,@k@v30/33200371. but without a doubt, you dealt considerable damage.@k@v30/33200372. ......I am sure you were able to understand well the depths of that wound by watching the way she panicked."'
18271: 'Battler@r@v10/30101020."Seriously.@k@v10/30101021. Ihihihi, it feels like she''d start crying if I bullied her any more than this."'
18272: '@rAs we talked, Ronove returned with Beato, who wore a meek expression.'
18273: '@r...She didn''t have the same bold smile as usual, but it looked like the blood wasn''t rushing to her head anymore.'
18274: 'Battler@r@v10/30101022.".........Hey.@k@v10/30101023. It''s your turn.@k@v10/30101024. Did you decide your next move?"'
18275: 'BEATRICE@r@v27/30701313."I resign.@k@v27/30701314. ......For now, I will let you have your victory."'
18276: '@rBeato told me that frankly.@k@rIt seemed as though she had taken a far-sighted view, as though saying "if you want to laugh, then laugh".'
18277: '@r......It was a bit of a buzzkill, and I lost my desire to attack her further.'
18278: 'Battler@r@v10/30101025."Well, now that you''ve resigned, in the end,@k@v10/30101026. all that means is that we''re even, since my theory and yours can''t deny each other.@k@v10/30101027. I''ll treat it more like a tie than a loss."'
18279: 'BEATRICE@r@v27/30701315."......I don''t need your disgusting compassion.@k@v27/30701316. I say that this time, it is my loss.@k@v27/30701317. ...When you find a dog drenched with rain, are you inclined to whack it with a stick or something?"'
18280: 'Battler@r@v10/30101028."Nope.@k@v10/30101029. Unlike you."'
18281: 'BEATRICE@r@v27/30701318.".............................."'
18282: '@rEven though she ridiculed me horribly when I showed signs of defeat, she was so pathetic when it was her turn.'
18283: '@rI thought of her as a pretty unfair person, but I decided to act with dignity as a winner and accepted it.'
18284: '@r......Beato had resigned.@k@rThat was the only result of the first twilight.'
18285: '@rBEATRICE couldn''t counter my move of "one of the six was the culprit,@k and that person died in an accident".'
18286: '@r...No, she probably could have countered it, but because of some strategic decision, she had given up.'
18287: '@rI felt less like I had won, and more like she had escaped me one step from victory...'
18288: '@rIn chess against witches, it is possible to battle onward solely using pieces called X which don''t need explanation.'
18289: '@rThanks to the "Devil''s Proof", I can create as many strange fictions as I want, and use them to fight in the argument.'
18290: '@r...But that''s only within the context of chess with a witch.@k@r......In our human world, such an abstract story can''t explain anything.'
18291: '@rThe first twilight today was a chain of six locked rooms.@k@r...It certainly may be possible for a human.'
18292: '@rBeato hadn''t been able to completely deny everything.'
18293: '@rHowever, I don''t have a clue who committed the crime,@k why, and how they actually did it...'
18294: '@rI shouldn''t say this having won,@k ......but I get the feeling that I would have felt less muddled...@kif I had just been told right out by BEATRICE that it was completely impossible for a human.'
18295: '@rAlthough I hide behind these abstract pieces called X,@k@r............I couldn''t deny that some kind of unthinkable,@k creepy intention had definitely pervaded this mansion...'