19710: 'Krauss@r@v02/30800260."......Certainly, the body cannot last with nothing more than a small breakfast, but..."'
19711: 'Rudolf@r@v08/31200318."Of course, we understand.@k@|@y@v08/31200319. But the thing is, as time passes, it''ll get darker and darker.@k@v08/31200320. Now is probably the lightest.@k@v08/31200321. Now is the most convenient time."'
19712: 'Natsuhi@r@v03/30900125."Only about an hour has passed since Rosa-san was attacked.@k@v03/30900126. This is simply too reckless...!"'
19713: '@rIt was only natural that Natsuhi was yelling about recklessness.@k@r...Because Rudolf had said that he was going to the mansion to get food.'
19714: '@rCertainly, they were being tormented by hunger as well as their fatigue.'
19715: '@rIn the beginning, they were just fine, because they could fight their moderate hunger with their drowsiness;@k but now it just made their minds hazy, and even though it was still only midday, their bodies felt like they were reaching their limits.'
19716: '@rThe thought of going to the kitchen in the mansion and bringing back some food certainly was attractive.'
19717: 'Natsuhi@r@v03/30900127."I am opposed to this.@k@v03/30900128. It may be a little tough, but we definitely shouldn''t leave this place."'
19718: 'Krauss@r@v02/30800261."......It is alright for us.@k@v02/30800262. But it would pain my heart to keep the children hungry...@k@v02/30800263. I must bear my responsibility as a parent."'
19719: 'Natsuhi@r@v03/30900129."D-dear...!@k @v03/30900130.Now that Father has passed away, you are the Ushiromiya family head.@k@v03/30900131. It is not permissible for you to take on such a danger...!"'
19720: 'Kyrie@r@v09/31300296.".........Yes.@k@v09/31300297. It''s like Natsuhi-san says.@k@v09/31300298. Krauss-san, you should remain here as the leader."'
19721: 'Krauss@r@v02/30800264."......Then, who will go to the mansion?"'
19722: 'Rudolf@r@v08/31200322."I think Kyrie and I, and Hideyoshi nii-san as well, should go.@k@|@y@v08/31200323. Hideyoshi nii-san and I are holding guns.@k@v08/31200324. They shouldn''t be able to lay a hand on us that easily."'
19723: 'Natsuhi@r@v03/30900132."Rosa-san was also holding a gun, but she was attacked.@k@v03/30900133. ...Isn''t it dangerous?"'
19724: 'Rudolf@r@v08/31200325."...When I went out to check on Rosa and Maria-chan, I was alone, although I had a gun with me.@k@v08/31200326. But I wasn''t attacked.@k@v08/31200327. ......Maybe they''ll be cautious if their opponent is a man."'
19725: 'Kyrie@r@v09/31300299."Two men.@k@v09/31300300. And even two guns.@k@v09/31300301. Those two will act as guards, and I''ll push the cart with the things.@k@v09/31300302. I believe the situation clearly differs from Rosa-san''s."'
19726: 'Hideyoshi@r@v06/31100342."If you''re countin'' me as a man, I''d be pleased to help.@k@|@y@v06/31100343. I don''t look it, but I trained this body pullin'' stalls.@k@v06/31100344. Leave the heavy liftin'' to me!"'
19727: 'Kyrie@r@v09/31300303."You men just need to devote yourselves to guarding.@k@v09/31300304. There''s a folding cart in the servant room, so using that, I should be able to handle carrying the food alone."'
19728: 'Kyrie@r@v09/31300305."......Of course, we will be careful.@k@v09/31300306. And if we can succeed in this venture just once,@k@v09/31300307. we''ll never again need to take the risk of leaving this place."'
19729: 'Natsuhi@r@v03/30900134."............Is there any way I can get you to reconsider?@k@v03/30900135. It may be painful for everyone to deal with an empty stomach, ...but even so, we do not know what could happen outside now..."'
19730: 'Hideyoshi@r@v06/31100345."We''ll take care.@k@v06/31100346. ......And Eva''s feelin'' pretty darn bad right now.@k@v06/31100347. I can''t let her stay hungry.@k@v06/31100348. If her stomach''s empty, she can''t even take her medicine.@k@v06/31100349. I''ve gotta go out for Eva''s sake as well."'
19731: 'Krauss@r@v02/30800265."How is Eva?"'
19732: 'Hideyoshi@r@v06/31100350."She''s finally gotten to sleep.@k@v06/31100351. ...She''s burnin'' up, too.@k@v06/31100352. We should leave her be for a while..."'
19733: 'Krauss@r@v02/30800266."......I guess you can''t just stand still when it comes to your wife''s health...@k@|@y@v02/30800267. .........Understood.@k@v02/30800268. I''ll give you permission to go outside."'
19734: 'Rudolf@r@v08/31200328."Then, we''ll take a little trip there and back.@k@v08/31200329. A speed contest.@k@|@y@v08/31200330. Canned food is OK, right?@k @v08/31200331.You at least have a can opener here, right?"'
19735: 'Natsuhi@r@v03/30900136."Y-yes.@k@v03/30900137. We have a can opener and a bottle opener..."'
19736: 'Kyrie@r@v09/31300308."There''s running water in the guesthouse, so we won''t need anything to drink.@k@v09/31300309. There''s ten people to cover for, so you''ll have to take what you get."'
19737: 'Hideyoshi@r@v06/31100353."Alright!@k@v06/31100354. Let''s dash out there and bring it all back pronto.@k@v06/31100355. There''s no time to open umbrellas...!"'
19738: 'Rudolf@r@v08/31200332."So, Aniki.@k@v08/31200333. Watch the place for me."'
19739: 'Krauss@r@v02/30800269."......Be careful.@k@v02/30800270. ...Under normal circumstances, I would want to go too.@k@|@y@v02/30800271. ...Being a man, I despise this title of eldest brother that prevents me from lending a hand in an emergency like this."'
19740: 'Rudolf@r@v08/31200334."This is about the only time we get to show off.@k@v08/31200335. Sit back and take it easy every once in a while, Aniki.@k@|@y@v08/31200336. Alright, Natsuhi-san.@k@v08/31200337. Wait here and get some towels ready or something.@k@v08/31200338. We aren''t using umbrellas, so we''ll be coming back like drowned rats."'
19741: 'Natsuhi@r@v03/30900138."U-understood.@k@v03/30900139. ...Take care."'
19742: '@rRudolf, Kyrie, and Hideyoshi,@k each leaving their own brave words behind, left the lobby...'
19743: '@rCompared to the time Rosa and Maria had gone outside, the winds had picked up once again.'
19744: '@rRudolf''s group of three people jogged through the rose garden without umbrellas, holding their guns and a folded cart.'
19745: '@rIf everything had been still and quiet, without the wind and the rain, they would probably have kept their ears open and moved with caution.'
19746: '@rBut in this rain, even if some suspicious person was hiding nearby, it would be difficult to notice them.'
19747: '@rBecause of that, it had been Rudolf''s plan to instead dash through the dangerous area.'
19748: '@r......If there was a chance that their opponent was equipped with a gun,@k then walking slowly with their guard up would only make them a target.'
19749: '@rIt was probably correct to decide on swift action.'
19750: 'Hideyoshi@r@v06/31100356.".........The rose garden.@k@v06/31100357. It feels like we''re just askin'' to be attacked...!"'
19751: 'Rudolf@r@v08/31200339."Please, let nobody come out of there..."'
19752: '@rEven as Rudolf and Hideyoshi continued to run, they looked around restlessly, vigilant of their surroundings.'
19753: '@rRosa and Maria''s deaths had not been caused by a projectile.@k@r......However, it was easy to suspect that the servants had been killed in such a manner.'
19754: '@rWill they come flying out of the dark?@k@rOr will they take careful aim and snipe from the shadows?'
19755: '@r......Either way, they couldn''t relax their tension for even an instant.'
19756: '@rBut even so, when they reached the overhang in front of the entrance to the mansion and escaped the reach of the raindrops,@k they felt themselves breathing a sigh of relief.'
19757: 'Hideyoshi@r@v06/31100358."No problems for the first part.@k@v06/31100359. ......It''s not like how it was for Rosa-san.@k@v06/31100360. Maybe they can''t get their hands on us easily."'
19758: 'Rudolf@r@v08/31200340."I''d like to believe that.@k@v08/31200341. Kyrie, unlock the door while we keep a lookout."'
19759: 'Kyrie@r@v09/31300310."Sure.@k@v09/31300311. Returning home to the mansion with a pair of bodyguards makes me feel just like an executive."'
19760: 'Hideyoshi@r@v06/31100361."Wahahahaha.@k@v06/31100362. If we had a welcoming party of servants on a red carpet, it''d be perfect."'
19761: 'Rudolf@r@v08/31200342."A welcoming party, huh.@k@|@y@v08/31200343. ...Careful what you wish for.@k@v08/31200344. Stay alert."'
19762: '@rAs the two cautiously surveyed their surroundings,@|@y Kyrie unlocked the front door with the master key she had been given.'
19763: 'Kyrie@r@v09/31300312."It''s open."'
19764: 'Rudolf@r@v08/31200345."Hideyoshi nii-san.@k@v08/31200346. Could you take the front?@k@v08/31200347. I''ll keep an eye on the rear."'
19765: 'Hideyoshi@r@v06/31100363."Roger.@k@v06/31100364. Kyrie-san, try not to move from my shadow.@k@|@y@v06/31100365. ......Alright, let''s break in!"'
19766: 'Rudolf@r@v08/31200348."Rear guard, understood. Covering...!"'
19767: 'Kyrie@r@v09/31300313."......Men.@k@v09/31300314. You''re enjoying this situation a little bit, aren''t you?"'
19768: 'Rudolf@r@v08/31200349."Give it up, that''s how men are.@k@|@y@v08/31200350. ......But man, there''s still that rank stench."'
19769: '@r...The air in the mansion felt stagnant with a heavy silence.'
19770: '@rAnd worse, it was still thick with the stench from Kinzo''s burnt corpse in the boiler room,@k and they were struck with a strong desire to leave the mansion - although they were never planning to stay.'
19771: 'Hideyoshi@r@v06/31100366."No problems in the front.@k@v06/31100367. Just a short dash to the kitchen."'
19772: 'Rudolf@r@v08/31200351."Let''s finish this quickly and head home.@k@v08/31200352. This suit''ll get fumigated with Dad''s stench."'
19773: '@rThe three of them dashed towards the kitchen...'
19774: '@rAnd after they disappeared from the entrance hall, ......the new witch showed herself there.'
19775: 'EVA@r@v34/33300424."They were lured out just as planned.@k@v34/33300425. ......They got caught right in my trap."'
19776: '@rThe witch grinned.'
19777: '@r......Thinking about it now, no matter how unbearable their hunger had grown,@k barely a few hours had passed since Rosa and Maria had been attacked and had lost their lives.'
19778: '@rIn that case, why had they needed to recklessly leave the guesthouse...?'
19779: '@rUntil that question could be dealt with, the only answer was that they had been called out by the witch''s magic...'
19780: 'EVA@r@v34/33300426."What reckless people.@k@v34/33300427. ......They will never leave this mansion alive.@k@|@y@v34/33300428. Lock yourself, locks! Close yourself, mansion!"'
19781: '@rThe instant she proclaimed that...'
19782: '@r...the mansion was sealed off in a separate world.'
19783: '@r......Unless she were to dispel the barrier, no longer could anyone exit this mansion, or enter it.'
19784: 'Ronove@r@v31/33100500."......Spectacular.@k@v31/33100501. To think that even though barely half a day has passed since you succeeded the Endless Witch, you can use magic this well.@k@|@y@v31/33100502. ......That talent surprises me.@k@v31/33100503. It is almost as though you were born a witch."'
19785: 'EVA@r@v34/33300429."Well, I have been a witch since the time I was born.@k@|@y@v34/33300430. ......Who taught you how to blink?@k @v34/33300431.That''s what using magic is like for me."'
19786: 'Ronove@r@v31/33100504.".....................@k@v31/33100505. ...A fearsome person."'
19787: '@rThe witch''s face twisted with brutality.@k@r......She was beside herself with excitement at being able to toy with lives again.'
19788: 'EVA@r@v34/33300432."Well then.@k@|@y@v34/33300433. ......Gehehehehhihhihihihihihihyahya!@k @v34/33300434.First is Rudolf and Kyrie, but what cruel way should I kill them...?!"'
19789: 'Ronove@r@v31/33100506."......If you would excuse me,@k@v31/33100507. but the Predecessor has left instructions that you are to restrain yourself from committing murders of unnecessary cruelty.@k@v31/33100508. And, there is a protocol to follow for the sacrifices from the fourth twilight onwards.@k@v31/33100509. For that, you must borrow the power of the Seven Sisters of Purgatory."'
19790: 'EVA@r@v34/33300435."......Oh, really?@k @v34/33300436.Now that you mention it, that''s right.@k@v34/33300437. I''m only allowed to play as I like until the second twilight I just finished.@k@v34/33300438. ..................Boring.@k@v34/33300439. Just when I thought I could play to my heart''s content like I did with Rosa.@k@|@y@v34/33300440. ......But, that refers to the way they''re killed in the end, right?"'
19791: 'Ronove@r@v31/33100510."By which you mean..."'
19792: 'EVA@r@v34/33300441."So I can just kill them however I want over and over again, revive them,@k@v34/33300442. and follow the epitaph the last time I kill them, right?"'
19793: 'EVA@r@v34/33300443."......So, in the end, no matter how I play, it isn''t a problem.@k@v34/33300444. ......Who''d act well-behaved with an interesting power like this...?!@k @|@y@v34/33300445.Kuhhihihihihihihi!"'
19794: '@rHer wild logic was, for an Endless Witch, an extremely valid argument.@k@rThe sacrifices for the fourth twilight and onward had prescribed protocols for the method of killing, represented by things like "gouge the head".'
19795: '@rHowever, that referred to the way they died in the end.'
19796: '@rIn other words, ......in the process leading up to that, she was free to tease and kill them however she wanted.'
19797: '@rShe just had to keep on reviving them, and follow the rules only when she killed them the final time.'
19798: '@rEven while Ronove glimpsed some talent as a witch in her innocent cruelty,@k he was beginning to notice a naturally brutal side of her.'
19799: 'Ronove@r@v31/33100511."......They do say that apprentices are the most brutal of witches, and now I see that may be true."'
19800: 'Ronove@r@v31/33100512.".........Do as you wish, ...is what I would like to say,@k@v31/33100513. but I must insist that it would be wiser to exercise some restraint in this instance.@k@v31/33100514. They are holding guns.@k@v31/33100515. Weapons with a high anti-magic power, such as guns, are the natural enemies of witches and demons."'
19801: '@rThe witch stared blankly at this demon butler, who was unexpectedly afraid of guns.'
19802: 'EVA@r@v34/33300446.".........No one told me this.@k@v34/33300447. Shouldn''t a witch be able to take a bullet like it''s nothing?"'
19803: 'Ronove@r@v31/33100516."No.@k@v31/33100517. It would be a fatal wound, exactly the same as it would for a normal Human.@k@v31/33100518. ...To prevent that weak point from being noticed,@k@v31/33100519. most witches rigorously strengthen their guard with a defense of protective barriers and furniture."'
19804: 'EVA@r@v34/33300448."Do I have any of those protective barrier things?"'
19805: 'Ronove@r@v31/33100520."......Constructing a barrier to make even gun bullets ineffective requires much in preparation and rituals.@k@v31/33100521. I am afraid to say that you currently have none of those, BEATRICE-sama.@k@v31/33100522. Furthermore, you are currently ill-prepared to summon furniture strong enough to block a bullet."'
19806: 'EVA@r@v34/33300449."So even though I''ve become a Great Witch with this much magical power, I really do have to be afraid of lead bullets.@k@|@y@v34/33300450. .........Annoying, but I''ll just have to accept it.@k@v34/33300451. So, in that case, should I call some furniture to act as my arms and legs?"'
19807: 'Ronove@r@v31/33100523."Yes.@k@v31/33100524. Leaving everything to your servants while not exposing yourself to danger is also part of a witch''s elegant temperance.@k@v31/33100525. BEATRICE-sama, leave this to the furniture and hide in a safe place."'
19808: 'EVA@r@v34/33300452."...............Fine."'
19809: 'EVA@r@v34/33300453."...Seven Sisters of Purgatory.@k@v34/33300454. I don''t care who, any two of you...!"'
19810: '@rLeviathan and Belphegor responded to that call.'
19811: 'Leviathan@r@v39/32400048."Leviathan of Envy, right here."'
19812: 'Belphegor@r@v41/32600026."Belphegor of Sloth, right here."'
19813: 'EVA@r@v34/33300455."Show me your power.@k@v34/33300456. Your targets are Rudolf and Kyrie.@k@v34/33300457. Not Hideyoshi.@k@v34/33300458. ......Now, show me just how cruel you can be, furniture."'
19814: 'Belphegor@r@v41/32600027."......My apologies,@k@v41/32600028. but we have received an order from the Predecessor to restrain ourselves from unnecessarily cruel actions."'
19815: 'Leviathan@r@v39/32400049."Buuut, I think the Predecessor''s order does give us some leeway to tease them.@k@v39/32400050. Will that be acceptable?"'
19816: 'EVA@r@v34/33300459."Hmph.@k@v34/33300460. Fine, I''ll compromise."'
19817: 'EVA@r@v34/33300461."......You mustn''t kill them easily.@k@v34/33300462. Thoroughly corner them and let them taste the fear of death before killing them.@k@v34/33300463. ......Will that be alright, Ronove?"'
19818: 'Ronove@r@v31/33100526."Yes. If you simply remain conscious of the extent, I do not believe there will be a problem."'
19819: 'EVA@r@v34/33300464."...............Then, go!"'
19820: '@r@v99/alcmix0002.""Yes, leave it to us...!""'
19821: 'Ronove@r@v31/33100527."Your opponents are armed with guns.@k@v31/33100528. ...For those as skilled as yourselves, dodging them should be easy,@v31/33100529. ...but if you are hit, it will be fatal.@k@v31/33100530. Go with an appropriate level of caution."'
19822: 'Belphegor@r@v41/32600030."Do not worry.@k@v41/32600031. We won''t expose such a level of incompetence."'
19823: '@rThe two Sisters of Purgatory vanished.@k@rAfter bowing, Ronove also disappeared.'
19824: 'EVA@r@v34/33300465.".........There''s even rules on how to kill them.@k@v34/33300466. .........Why do I have to be constrained by my predecessor?@k @v34/33300467.............It''s so rigid and boring."'
19825: '@rAs the witch looked up at the portrait of the Predecessor BEATRICE hanging in the hall, she cursed...'
19826: '@rThe three had already arrived at the kitchen, and were gathering food supplies.'
19827: '@rThinking of the possibility that poison had been mixed in, they gave up on the alluring fruits and vegetables,@k and gathered a whole cardboard box full of only the safe canned foods.'
19828: '@rIt was very heavy, but by piling it on the cart, they could carry it well enough.'
19829: '@rWith all of that, there would be plenty for ten people to hold out until tomorrow''s breakfast.@k That would be enough while they waited for the boat.'
19830: '@rThe two men were supposed to be devoted to guard duty, but the weight of the load was tough on Kyrie even with the cart.'
19831: '@rHideyoshi, who professed himself strong, switched to being the cart-pusher, and Rudolf and his wife took up the task of guard duty.'
19832: 'Hideyoshi@r@v06/31100368."With all this, even George and the kids will be full.@k@|@y@v06/31100369. We''re not safe until we''re home, let''s go...!"'
19833: '@rWhen Hideyoshi vigorously proclaimed their departure, Kyrie frowned, looking as though she was gazing into the distance.'
19834: '@r......There was a wall in that direction.@k ...No, if her gaze could go through that, the hall was beyond it...'
19835: 'Rudolf@r@v08/31200353.".........What is it, Kyrie?"'
19836: 'Kyrie@r@v09/31300315."...I sense something.@k@v09/31300316. .........I have a bad feeling about this."'
19837: '@rKyrie stopped, narrowing her eyes even further.'
19838: 'Rudolf@r@v08/31200354.".........Women''s intuition?"'
19839: '@rIn times like this, Kyrie''s intuition surpassed reason.@k@r...Rudolf trusted that intuition.'
19840: 'Kyrie@r@v09/31300317."Yes.@k@v09/31300318. Someone''s probably waiting to ambush us.@k@v09/31300319. ......I didn''t sense them until a short while ago.@k@v09/31300320. ...But just now, I felt it.@k@|@y@v09/31300321. ......Just now, someone...@v09/31300322.set up an ambush for us."'
19841: 'Rudolf@r@v08/31200355."......Then, there''s no reason we need to return the way we came.@k@|@y@v08/31200356. There''s a back door over there, right?@k@v08/31200357. Let''s leave that way."'
19842: '@rRudolf made to unlock the back door.'
19843: '@rWhen things were carried into the kitchen, they never passed through the part of the mansion that the family came and went from.'
19844: '@rSo outside the back door, there was probably a slope for transporting things.@k Surely, they would be able to leave through there with the cart.'
19845: 'Rudolf@r@v08/31200358."......What is this?@k@v08/31200359. ...It''s stuck.@k@v08/31200360. ...Damn, what''s going on?"'
19846: 'Kyrie@r@v09/31300323."Can''t you open it?"'
19847: 'Rudolf@r@v08/31200361."Nope.@k@v08/31200362. Is it broken?@k@v08/31200363. It isn''t giving an inch..."'
19848: '@rRudolf tried various things, using force, then coaxing it,@k but the lock was as hard as stone, and didn''t even budge.'
19849: 'Hideyoshi@r@v06/31100370."...Don''t stress over it, let''s leave through the front entrance.@k@v06/31100371. Right now, it''ll be even worse if we stand around wastin'' time."'
19850: 'Kyrie@r@v09/31300324.".............................."'
19851: 'Rudolf@r@v08/31200364."......Are you saying this is a trap?"'
19852: 'Kyrie@r@v09/31300325."...I don''t know.@k@v09/31300326. Be careful."'
19853: '@rWith strained expressions, the three of them returned to the hall again, and headed for the entrance...'
19854: 'Rudolf@r@v08/31200365."Wh-......who''s there?!!"'
19855: '@rThe instant they exited into the hall, Rudolf noticed a suspicious shadow right in front of them and yelled...'
19856: '@rIn that instant, a storm of gold leaf started blowing, and gold butterflies dyed the area a golden color.'
19857: 'Belphegor@r@v41/32600032."............I can''t believe it.@k@v41/32600033. A lowly Human predicted our ambush?"'
19858: 'Leviathan@r@v39/32400052."I-it isn''t my fault.@k@v39/32400053. I was hiding my presence...!"'
19859: 'Kyrie@r@v09/31300327."Don''t hesitate!! FIRE!!!"'
19860: '@rThe two guns spouted fire.'
19861: '@rThe lead bullets blasted right through the pair''s magic defense as easily as though it were a wet paper wall,@k ......but the two who should have been there had disappeared.'
19862: '@rCertainly, guns were very frightening objects for them.'
19863: '@r...But there was no need to fear as long as they weren''t hit.@k@rThey at least had enough speed to dodge those.'
19864: 'Leviathan@r@v39/32400054."Wait a sec!@k @v39/32400055.You won''t even let us say our names?!@k @|@y@v39/32400056.This is why I hate Humans!"'
19865: '@rLeviathan protested, popping her head out from behind a pillar in the shadow of the staircase, a full ten meters from where she had supposedly been.'
19866: 'Belphegor@r@v41/32600034."By order of BEATRICE-sama, we shall now slay you!@k @v41/32600035.We are ordered to take some time teasing you.@k@v41/32600036. You are free to resist, but know that it is useless...!"'
19867: '@rThat voice came from overhead.@k@rBelphegor could be seen on top of the hall chandelier.@k@rElegantly looking down upon them, she proclaimed their execution with a cruel smile.'
19868: 'Hideyoshi@r@v06/31100372."......Wh-@v06/31100373.......who the heck are these girls...?!"'
19869: 'Kyrie@r@v09/31300328."Forget the cart!!@k @v09/31300329.We have two opponents, so if we split up, they can''t chase all of us!"'
19870: '@rAll three of them were well acquainted with the inside of the mansion.'
19871: '@rThey had already made plans to run off in separate directions in the case of a crisis, returning to the guesthouse by breaking windows or leaving through a back door.'
19872: '@rFighting was forbidden.@k ......As long as they could get away.'
19873: 'Rudolf@r@v08/31200366."Hah-hah-ha, of the thirty-six stratagems, fleeing is best...!!"'
19874: '@rThe three of them escaped into the depths of the mansion at full tilt.@k@rThe two furniture calmly watched them go.'
19875: 'Leviathan@r@v39/32400057."......I''ll kill the woman.@k@v39/32400058. You take the man!"'
19876: 'Belphegor@r@v41/32600037."Understood."'
19877: '@rThe two pieces of furniture in the shadow of the pillar and on the chandelier burst apart their humanlike forms,@k and, leaving behind only the sound of hopping beetles colliding with the walls, they pursued their respective targets.'
19878: '@rTheir speed was overwhelming, and they easily blocked the others'' path of retreat.'
19879: 'EVA@r@v34/33300468."............I''ll inspect their skill as furniture.@k@v34/33300469. It''d be nice if they entertained me."'
19880: 'Ronove@r@v31/33100531."BEATRICE-sama, I might suggest it wise not to show yourself carelessly..."'
19881: 'EVA@r@v34/33300470."A king doesn''t carelessly wander about the center.@k@v34/33300471. That''s part of a king''s - @v34/33300472.a witch''s dignity!"'
19882: '@rIn front of Rudolf, who had boldly tried to escape to the second floor, Belphegor was already standing in the way.'
19883: 'Belphegor@r@v41/32600038."It''s useless to try and resist or escape.@k@v41/32600039. ......You don''t need to think about anything.@k@|@y@v41/32600040. Just close your eyes.@k@v41/32600041. I''ll bring everything to a gentle finish."'
19884: 'Rudolf@r@v08/31200367."You''d make a good wife.@k@v08/31200368. Your husband would be pleased to hear that kind of thing when he comes home tired."'
19885: 'Belphegor@r@v41/32600042."To think that you''re still relaxed enough to speak such vulgarity at a time like this...!"'
19886: 'Belphegor@r@v41/32600043."BEATRICE-sama, thank you for such good prey!@k @v41/32600044.Die!!!"'
19887: '@rRudolf fired first.'
19888: '@rBut even before that bullet could hit her, Belphegor had already moved behind Rudolf''s back.'
19889: '@rThere she stood, her arm raised above her, a purple trail extending from it...'
19890: '@rHowever, even before that arm could decapitate Rudolf, unbelievably, Rudolf had swung his gun behind him.'
19891: '@rThe barrel pointed behind his back, from the same motion with which he had reloaded the sawed-off gun one-handedly.'
19892: '@rIt was pointing right at Belphegor''s chest...'
19893: '@rTakk, clunk-rrrr...!@k It was the sound of the ejected empty cartridge finally hitting the wall after the reload.'
19894: '@rIn other words, it meant that the next shot was already fully loaded.'
19895: '@rWithout turning around, his gun pointing right at Belphegor''s chest, Rudolf grinned.'
19896: 'Belphegor@r@v41/32600045.".........Not bad.........@k@v41/32600046. ...For a middle-aged man...!!"'
19897: 'Rudolf@r@v08/31200369."Don''t look down on the generation that loves westerns, got it?@k @v08/31200370.Brats don''t know jack squat about the refinement of a lever-action."'
19898: '@rJust like Rudolf, Kyrie was also confronting a demon stake, in the first floor corridor.'
19899: 'Leviathan@r@v39/32400059."What an idiot you are.@k@v39/32400060. You should have just escaped with your husband.@k@v39/32400061. You do know that that was your final farewell just now, right...?@k @|@y@v39/32400062.*giggle*giggle*giggle*!"'
19900: 'Kyrie@r@v09/31300330."Don''t worry.@k@v09/31300331. This kind of thing is my husband''s specialty.@k@v09/31300332. I''m sure he''ll come for me on a white horse soon."'
19901: 'Kyrie@r@v09/31300333."Because he''s never failed to come and save me when I''m in trouble.@k@v09/31300334. ......Not even when Asumu-san was around, you see?@k @v09/31300335.Heheh."'
19902: 'Leviathan@r@v39/32400063."Heheheheheheheh!@k @v39/32400064.What a happy couple.@k@v39/32400066. I envy you.@k@v39/32400065. .........I am Leviathan of Envy...!@k @v39/32400067.Envy is itself my power.@k@v39/32400068. My anger, my origin!"'
19903: 'Kyrie@r@v09/31300336."I agree.@k@v09/31300337. Envy is the source of a woman''s power.@k@v09/31300338. ...And if you call something like that power, I won''t lose to a girl like you."'
19904: 'Leviathan@r@v39/32400069."Hahhahahahahahahahaha!@k @v39/32400070.Imagine saying that to the one who governs envy!@k @v39/32400071.You actually think I''d let you two be reunited...?!!"'
19905: 'Leviathan@r@v39/32400072."Ahhahahahaha, I''ll give you a tragic farewell!!"'
19906: '@rThe arm Leviathan swung trailed purple.@k@rIt was a magic blade that cut by the power of malice.'
19907: '@rKyrie guarded herself against that with her gun.'
19908: '@r......Even though the magic blade should have been able to cut through metal like butter, the gun, with its extremely high magic resistance,@k was able to block the blade as easily as if it were a rolled up newspaper.'
19909: '@rRapidly, two times, three times.@k It blocked all of them.'
19910: '@rAnd, without missing the opening created when that purple trail took a long swing upward,@k Kyrie kicked Leviathan in the stomach with her heel.'
19911: '@rAlmost like she was a lightly dancing feather, Leviathan was knocked away.'
19912: '@r...Before the demon stake''s feet touched ground again...'
19913: '@rKyrie had already perfectly captured Leviathan, who was in midair, down the barrel of her gun.'
19914: '@rFrom midair, the two women who had spoken to each other of envy as power met each other''s gaze.'
19915: 'Leviathan@r@v39/32400073."......C-can you pull it?@k @v39/32400074.That trigger...!!"'
19916: 'Kyrie@r@v09/31300339."You know, I can be pretty brutal when my husband isn''t around."'
19917: 'Rudolf@r@v08/31200371."Whoawhoaoaoaoao!!"'
19918: '@rRudolf tumbled down the staircase.@k He had been gradually chased down by Belphegor, and had been pushed back into the original hall.'
19919: 'EVA@r@v34/33300473.".........The Predecessor''s furniture is pretty good.@k@v34/33300474. She''s lacking in flair, though!"'
19920: 'Belphegor@r@v41/32600047."BEATRICE-sama...!@k @v41/32600048.It isn''t over yet, it''s dangerous to show yourself...!"'
19921: 'Rudolf@r@v08/31200372."........................Could you...@v08/31200373....possibly be...Aneki?"'
19922: 'EVA@r@v34/33300475."That used to be my name.@k@v34/33300476. But not now, Rudolf."'
19923: 'Rudolf@r@v08/31200374."You don''t have to tell me.@k@v08/31200375. You''re going to say you''re the Golden Witch, BEATRICE, right?"'
19924: 'EVA@r@v34/33300477."Ehheheheheh, ahhahahahaha!@k @v34/33300478.How did you know?"'
19925: 'Rudolf@r@v08/31200376."......Since the time Rosa was killed, I had a general idea."'
19926: 'Rudolf@r@v08/31200377.".........Rosa, forgive me.@k@v08/31200378. Forgive me for sending the sister you hated down to your hell...!!"'
19927: 'Belphegor@r@v41/32600049."BEATRICE-sama, look out!!!"'
19928: '@rRudolf pointed the unforgiving barrel of his gun at the witch who claimed to have once been his sister.@k@rBut Belphegor could not permit that, and savagely attacked.'
19929: '@rShe sprung at him, vanished, and got behind him.'
19930: '@rIf he dodged that attack, she got behind him again.'
19931: '@rShe vanished over and over, each time teleporting into Rudolf''s blind spot.'
19932: '@rIt was almost like she was a fairy.@k As she blinked in and out of vision, Belphegor incessantly drove towards Rudolf.'
19933: 'EVA@r@v34/33300479."This might be kinda fun in its own way.@k@v34/33300480. Rudolf, let me leisurely watch and see how long your brave efforts last you.@k@|@y@v34/33300481. *cackle*cackle*cackle*cackle*cackle*cackle*cackle*cackle*!"'
19934: '@rThen, a dull tearing sound and Rudolf''s cry of anguish intermingled.'
19935: '@rRudolf had finally reacted too slowly in his dance with the purple trail which pressed upon him,@k and he had let it lightly cut him on his side.'
19936: '@rA single wound delayed a single one of his actions.'
19937: '@rThat caused a new wound, which delayed him from acting again.'
19938: '@rBelphegor''s dance began to swallow Rudolf whole...'
19939: '@rWatching Rudolf''s body gradually get carved up, his former sister let out a shrill laugh.'
19940: '@rLeviathan could no longer hide her irritation that Kyrie was absolutely refusing to allow her to deliver a fatal wound.'
19941: 'Leviathan@r@v39/32400075.".........I really am dense.@k@v39/32400076. ...Among the Seven Sisters, I was always the slowest to grow.@k@v39/32400077. I was always slow, always weak, always stupid."'
19942: 'Leviathan@r@v39/32400078."......That inferiority complex became envy,@k@v39/32400079. and when I converted that into power, I gained a strength greater than that of any of the other sisters."'
19943: 'Kyrie@r@v09/31300340."It''s important to have a moderate inferiority complex when you''re a girl.@k@v09/31300341. It teaches women about cosmetics and hard work."'
19944: 'Leviathan@r@v39/32400080."I don''t like using the limits of my power against mere Humans.@k@v39/32400081. ......But I will turn my envy of your ability to completely trust your husband into power."'
19945: 'Leviathan@r@v39/32400082."......I don''t like it.@k@v39/32400083. Why are you so relaxed when you''re fighting for your life?"'
19946: 'Kyrie@r@v09/31300342."......*giggle*.@k@v09/31300343. I wonder?"'
19947: 'Leviathan@r@v39/32400084."............I get it.@k@v39/32400085. You fully believe that your husband will definitely come to rescue you and will save you.@k@|@y@v39/32400086. .........Isn''t it incredible, that trust of yours.@k@v39/32400087. It''s worthy of my envy."'
19948: '@rWhat kind of trust do we sisters have in each other?'
19949: '@rWe sisters are always looking down on each other, trying to thoroughly lambast each other and turn things from bad to worse...!'
19950: 'Leviathan@r@v39/32400088."I''ve always been bullied by my sisters.@k@v39/32400089. I''ve always wanted just one of them to become my ally."'
19951: 'Leviathan@r@v39/32400090."......So since you have that single ally,@k@v39/32400091. who you can place complete trust in, I feel the strongest envy towards you..."'
19952: 'Leviathan@r@v39/32400092."............Aaah, that composed expression of total belief in your husband...!@k @v39/32400093.I can feel my envy giving me power...!!@k @v39/32400094..........I might even exceed it.@k@|@y@v39/32400095. The speed of sound!!!"'
19953: '@rLeviathan turned herself into a stake, and the speed of her flight as she attacked was proportional to the strength of her envy.'
19954: 'Leviathan@r@v39/32400096."On that day when my sisters looked down on me,@k@v39/32400097. I was jealous from the bottom of my heart of the other six, who had grown quickly!@k @v39/32400098.I was jealous for seven days and seven nights!!@k @v39/32400099.Behold the power and speed I ultimately gained...!!@k @v39/32400100.Die, Ushiromiya Kyrieeeeeeeeeeee!!!"'
19955: '@rThe demon stake exposed her true form, leaping about at a terrible speed.@k The noise from her colliding with and bouncing off the walls sounded like a machine gun.'
19956: '@rBy now, Kyrie probably couldn''t tell whether it was a single stake or a swarm of beetles flying and bouncing around.'
19957: '@rLeviathan was certain of a greater than 100% chance of victory, from the bottom of her heart...!'
19958: '@rThen, Kyrie spoke with an unbelievably calm voice.'
19959: 'Kyrie@r@v09/31300344.".........I was the one who had been going out with Rudolf-san from the very beginning.@k@v09/31300345. ......Asumu-san shamelessly cut in between us,@k@v09/31300346. ...and calculatingly got herself pregnant."'
19960: 'Kyrie@r@v09/31300347."......I don''t blame Rudolf-san.@k@v09/31300348. That woman manipulated him using her body as a weapon,@k@v09/31300349. and cornered him into a situation where he was forced to become engaged to her."'
19961: 'Kyrie@r@v09/31300350.Asumu-san was carrying Battler-kun.@k@r@v09/31300351.And at the same time, I was also carrying a boy.@k@r@v09/31300352....As fate would have it, our delivery dates were on the same day.'
19962: 'Kyrie@r@v09/31300353."And Asumu-san gave birth to Battler-kun.@k@v09/31300354. ...But I was not so lucky.@k@v09/31300355. .........There''s something I''ve thought about.@k@v09/31300356. What if Asumu-san had been the unlucky one, and I had been the one to give birth?"'
19963: 'Kyrie@r@v09/31300357."......Would Rudolf-san have broken off his engagement and married me?@k @v09/31300358.......But I couldn''t birth a child.@k@v09/31300359. So until Asumu-san died,@k@v09/31300360. and until I got pregnant with Ange, I cursed Asumu-san, and was jealous of her."'
19964: 'Kyrie@r@v09/31300361.Asumu-san should just die.'
19965: 'Kyrie@r@v09/31300362.And then I want him to remarry, with me... In my envy, I kept cursing her like that, over and over, until Asumu-san finally died.'
19966: 'Kyrie@r@v09/31300363.I became certain.'
19967: 'Kyrie@r@v09/31300364.I became certain that I possessed the power of magic, and that it had become a curse which had killed Asumu-san.'
19968: 'Kyrie@r@v09/31300365.But that did not quell the flames of my envy.'
19969: 'Kyrie@r@v09/31300366.Don''t tell anyone, alright?'
19970: 'Kyrie@r@v09/31300367.Every time I look at Battler-kun, I remember that woman.'
19971: 'Kyrie@r@v09/31300368.And every time I look at Battler-kun,@k@v09/31300369. ...I think that if only my child had been born, he would be the same age.'
19972: 'Kyrie@r@v09/31300370.I am still jealous of her, tormented by her.@k@r@v09/31300371.Now, and forever.@k@v09/31300372. For all eternity.'
19973: 'Kyrie@r@v09/31300373."You say that you were jealous of your sisters for seven days and seven nights...?"'
19974: 'Leviathan@r@v39/32400101."Th-......that''s right..."'
19975: 'Kyrie@r@v09/31300374.Don''t make me laugh, you little brat.'
19976: 'Kyrie@r@v09/31300375.".........How could you understand the madness of a woman...@k@v09/31300376.whose man was stolen from her, and who has burned with envy for eighteen years...!!"@|@y'
19977: 'Leviathan@r@v39/32400102."U-......uoawaaaaaAAaaaaAAAAHHH!!!!"@|@y'
19978: '@rIf Leviathan''s power had 24 hours * 7 days, or 168 hours'' worth of speed...'
19979: '@rThen the power that Kyrie had accumulated...@w250.was 24 hours in 1 day,@w416. 365 days in 1 year,@w500. and for 18 whole years......'
19980: '@rEven without counting leap years,@|@y it was 157,680 hours.'
19981: '@r...Compared to Leviathan''s power and speed,@|@y it was more than 938 times greater.'
19982: '@rSo then, even if Leviathan was soaring at the speed of sound, 1,225 km/h,@k ......to Kyrie''s eyes, it only looked like...@|@y1/938 of that.'
19983: '@rSo then, so then, 1225/938 is...@k@r@w250..........a speed of...@w500.@|@y1.30 km/h.'
19984: '@r...They say that a human''s walking speed is 4 km/h, so it was even less than half of that.@k Almost the same speed as a baby crawling on the floor.'
19985: '@rSo then, so then, so then...!'
19986: '@rIn the time slowed so much you could count all the bits of dust floating through the air,@k Kyrie looked at the demon stake with pity.'
19987: '@rShe pitied the slowness at which it came towards her.'
19988: '@rAnd she lazily raised the barrel of her gun.@k@rAlmost as though she was trying to swallow the demon stake up with the gun barrel.'
19989: 'Kyrie@r@v09/31300377."You''re completely lacking in both love and envy."'
19990: 'Kyrie@r@v09/31300378."......Come back when you''re older, darling."'
19991: 'EVA@r@v34/33300482."Rudolf, what happened to all that vigor from a couple seconds ago?@k @v34/33300483.Ikezukuri is best served while it''s still twitching.@k@v34/33300484. After it dies, it isn''t interesting in the slightest.@k@|@y@v34/33300485. That''s enough.@k@v34/33300486. Why not kill him now and forever?!"'
19992: 'Rudolf@r@v08/31200379.".........kh, ......damn it......"'
19993: 'Belphegor@r@v41/32600050."I''m surprised you managed to endure this long after being carved up."'
19994: 'Belphegor@r@v41/32600051."......That''s enough.@k@v41/32600052. You don''t need to think about anything more.@k@v41/32600053. I''ll steal your life away painlessly...!"'
19995: 'Rudolf@r@v08/31200380."Wait... Do me a favor.@k@v08/31200381. In the very end, I want to do one of those..."'
19996: 'Belphegor@r@v41/32600054."......What do you mean, one of those?"'
19997: 'Rudolf@r@v08/31200382."One of those things that westerns made famous.@k@v08/31200383. That thing where we put our backs together, walk three steps, and then bang."'
19998: 'Belphegor@r@v41/32600055."............Ah, a duel.@k@|@y@v41/32600056. Very well.@k@v41/32600057. If that will satisfy your regrets in this world, I''ll accept."'
19999: '@rRudolf raised his wound-covered body, and turned his back to her.'
20000: '@rBelphegor responded, and faced her back to his.'
20001: '@r...Belphegor had a sense of integrity that was uncommon in a witch''s furniture.'
20002: 'Belphegor@r@v41/32600058."Let me warn you.@k@v41/32600059. Even if you press the barrel of your gun between my eyebrows,@k@v41/32600060. I can teleport even faster than you could pull the trigger and have the bullet reach my skull."'
20003: 'Rudolf@r@v08/31200384."......Yeah, I''m already feeling that throughout my body.@k@v08/31200385. ...You are faster than a bullet."'
20004: 'Belphegor@r@v41/32600061."I have agreed to this out of respect for your courage in challenging me to a duel despite that knowledge.@k@v41/32600062. Thank me."'
20005: 'Rudolf@r@v08/31200386."......You are a person of integrity.@k@v08/31200387. And a good woman.@k@v08/31200388. You might just steal my heart away."'
20006: 'Belphegor@r@v41/32600063."Let''s get this started.@k@v41/32600064. Three steps is fine?"'
20007: 'Belphegor@r@v41/32600065.".........First, one step."'
20008: 'Rudolf@r@v08/31200389."......Two steps."'
20009: 'Belphegor@r@v41/32600066."......Three steps.@k@v41/32600067. Is that alright?"'
20010: 'Rudolf@r@v08/31200390."Yep.@k@v08/31200391. ......And, since you still haven''t noticed after walking three whole steps,@k@v08/31200392. ......looks like I win, girl."'
20011: 'Belphegor@r@v41/32600068."Whaaat......?"'
20012: 'Belphegor@r@v41/32600069."...........................Ah...h...!"'
20013: '@rRudolf turned around and fired off a bullet.'
20014: '@r......Of course, Belphegor could easily see through the speed and trajectory of a bullet like that.'
20015: '@rIt should have been no problem at all to dodge it.'
20016: '@rBut a spray of fresh blood flew about.'
20017: '@r......Belphegor had set up an adequate magical defensive barrier.'
20018: '@rBut before an incarnation of anti-magic power such as that bullet, it was completely meaningless.'
20019: 'EVA@r@v34/33300487.".........What are you doing?@k@v34/33300488. Why''d you get hit...?!"'
20020: '@rThe bullet had hit Belphegor right in the chest.@k ...The pain from the lead caused her to grimace, as did as the pain from the denial of magic...'
20021: 'Rudolf@r@v08/31200393."......Forgive me.@k@v08/31200394. I''m a coward of a man."'
20022: 'Belphegor@r@v41/32600070."..................ku-@v41/32600071................u..."@|@y'
20023: 'EVA@r@v34/33300489."Wh-...What a mood-killer.@k@v34/33300490. To think that someone who is furniture to a witch could be defeated by a Human...!"'
20024: 'EVA@r@v34/33300491."Know your shame.@k@v34/33300492. Worthless, pathetic...!@k @v34/33300493.Why don''t you just stay sprawled there and die forever?!"'
20025: 'Rudolf@r@v08/31200395.".........Quit it, Aneki.@k@v08/31200396. ...This girl could have dodged it.@k@v08/31200397. But she didn''t."'
20026: 'Rudolf@r@v08/31200398."......She realized that you were in the line of fire.@k@v08/31200399. So this girl of integrity took it without dodging, and guarded you.@k@v08/31200400. In the very end, she noticed that I was forking the rook and the king."'
20027: 'Belphegor@r@v41/32600072."Spe-.........spectacular............"'
20028: 'Rudolf@r@v08/31200401."Don''t think badly of me.@k@v08/31200402. ...I''d planned to accept my fate if you realized while you were taking those three steps."'
20029: 'Belphegor@r@v41/32600073."............Those three steps...@v41/32600074.were out of...@v41/32600075.consideration for me, then...@k@|@y@v41/32600076. .........I didn''t even try to think about it.@k@v41/32600077. ......I...@v41/32600078....was la...@v41/32600079.zy........."'
20030: 'Rudolf@r@v08/31200403."......You were a good woman.@k@v08/31200404. Go to heaven before me and do your makeup.@k@v08/31200405. I''ll definitely come and talk you up."'
20031: '@rAs Belphegor slowly fell over, ...she lost even the power that kept her in a human form,@k and she turned as fine as gold dust, and melted into thin air...'
20032: '@rAt that point, Kyrie dashed in.@k@rIt seemed that she had defeated her pursuer with her own hands.'
20033: '@rAs she pointed the barrel of her gun straight at the witch, she ran up to the wound-covered Rudolf.'
20034: 'Kyrie@r@v09/31300379."......Are you alright?@k @v09/31300380. Were you talking someone up just now?"'
20035: 'Rudolf@r@v08/31200406."Yep, a fine woman.@k@v08/31200407. ...No match for you, of course."'
20036: 'Rudolf@r@v08/31200408."............Sorry, Aneki.@k@v08/31200409. It''s checkmate."'
20037: '@rThe two of them pinned the witch down the barrels of their guns.'
20038: 'EVA@r@v34/33300494."............Worthless furniture.@k@v34/33300495. ...I can''t believe they were beaten by Human opponents.@k@v34/33300496. ...Worthless.@k@v34/33300497. Stupid.@k@v34/33300498. ...Boring...!"'
20039: 'Ronove@r@v31/33100532."BEATRICE-sama, we should retreat from this place.@k@v31/33100533. ......There is no furniture or barrier to guard against bullets here."'
20040: 'EVA@r@v34/33300499."Eheheheh,@v34/33300500. ......*cackle*cackle*cackle*cackle*cackle*!"'
20041: '@rThe witch began to let out a muffled laugh.'
20042: '@r...It surprised not only Rudolf and Kyrie, but Ronove as well.'
20043: '@r.........Because a situation like this, with two guns pointed at her,@k was not one that could just be laughed off, even by a witch.'
20044: '@rBut the witch laughed with pleasure.'
20045: 'EVA@r@v34/33300501.".........Well, it''s only natural that it''d be impossible for the Predecessor''s worn out furniture.@k@|@y@v34/33300502. ......I have to have new furniture, suitable for me.@k@v34/33300503. I used them out of obligation,@k@v34/33300504. ......but I''ve always hated hand-me-downs."'
20046: '@rAs she said that, she looked down at Belphegor''s remains, which had turned completely into a pile of gold dust, with disgust.'
20047: 'Rudolf@r@v08/31200410."I don''t know what you''re talking about.@k@v08/31200411. Now put your damn hands up."'
20048: '@r...Then, the witch obediently raised her hands.'
20049: '@rBut instead of raising her hands because a gun was being pointed at her,@k it looked more like she was a conductor facing an orchestra, waving her conductor''s baton.'
20050: 'EVA@r@v34/33300505."Come, arise, furniture suitable for me...!!@k @v34/33300506.Not that cheap furniture, much much stronger ones!@k @v34/33300507.Cruel ones!!@k @|@y@v34/33300508.Ahhahahahahahahahahahahyahhyahhya!!!"'
20051: 'Kyrie@r@v09/31300381."No funny stuff...!@k @v09/31300382.I''ll pull the trigger...!"'
20052: '@rIn response to the witch''s call, the hall was once again buried in the color of gold.'
20053: '@rIt was a wild dance of brilliantly radiant gold butterflies,@k ...and felt as though they had been swallowed up by an ocean of gold leaf.'
20054: '@rRonove was left shocked at that upsurge in magic power...@k@rThat was because it far surpassed even that of his former master.'
20055: '@rAs their eyes were dazzled amidst the golden brilliance, a gunshot could be heard.@k@rEither Rudolf or Kyrie had fired a round.'
20056: '@r......And after the golden glow had subsided, there was the witch, looking at least cool and composed.'
20057: '@rThe bullet?@k Kyrie had definitely fired it into her.'
20058: '@rBut it was not embedded anywhere in the witch''s body.'
20059: '@rThere it was.@k ...The bullet was fastened in midair right in front of the witch''s chest.'
20060: 'Ronove@r@v31/33100534."A, ......a bullet-proof barrier........."'
20061: '@rA barrier which took even her predecessor a significant amount of preparation...in an instant...@k@rRonove''s face was by now twisted in shock.@k@rAnd the surprise did not stop there......'
20062: '@rThe group of gold butterflies created two humanoid forms.'
20063: '@r......It was a furniture summoning.'
20064: '@rThe butterflies peeled off and flew away, and beneath them, furniture in the shape of girls showed themselves.'
20065: 'Ronove@r@v31/33100535."..................The Chiester Sisters troops...@k@v31/33100536. .........Even the Predecessor...@v31/33100537....wasn''t able to summon the Pendragon''s Memorial Troops on a moment''s notice, and so easily...!"'
20066: 'Chiester410@r@v36/33500001."Chiester410. Right here."'
20067: 'Chiester45@r@v35/33400001."Chiester45. Right here."'
20068: 'EVA@r@v34/33300509."...You two are suitable furniture for me, right?"'
20069: 'Chiester410@r@v36/33500002."From reading you a picture book, to going on a friendship date, to shooting down a meteorite,@k@v36/33500003. we''ll take care of anything. Nihihi."'
20070: 'Chiester45@r@v35/33400002."I-if we don''t take care of it, the Dragon King will get mad at us...!@k @v35/33400003.Please, your orders, Great Lady BEATRICE!"'
20071: 'Kyrie@r@v09/31300383.".........Rudolf-san.@k@v09/31300384. Let''s run.@k@v09/31300385. These guys are no good......!"'
20072: 'Rudolf@r@v08/31200412."S-.........sure!"'
20073: '@rThanks to the same feeling that had alerted her to the ambush by the Seven Sisters of Purgatory,@k Kyrie clearly heard warning sirens going off in her head, almost resembling screams.'
20074: '@rWithout hesitation, they ran.'
20075: '@rAs the witch elegantly watched them leave, she ordered her new furniture.'
20076: 'EVA@r@v34/33300510."...This is an order.@k@v34/33300511. Kill the two who ran away.@k@v34/33300512. Then bring the corpses back here.@k@|@y@v34/33300513. Then I''ll bring them back to life, and play with them over and over.@k@|@y@v34/33300514. ...*cackle*cackle*cackle*cackle*cackle*!!"'
20077: '@rThe witch''s expression twisted with an evil smile.'
20078: '@rEven though she feared that expression, Lucifer appeared and spoke.'
20079: 'Lucifer@r@v38/32300143."M-...my apologies.@k@v38/32300144. ...The Predecessor said to avoid brutal actions of that - "'
20080: '@rWhen the witch stared at her with those terrifying eyes, Lucifer was struck dumb.'
20081: '@r...She was unsatisfied.@k She was bored, of not being able to let her own power and her own cruelty run wild.'
20082: '@r......Irritated by her predecessor''s furniture telling her to act with restraint, her discontent was at its peak.'
20083: 'Chiester410@r@v36/33500004."Oh, it''s Lucifer-chan the Proud.@k@v36/33500005. Long time no see nyeh, how ya doin''?@k @v36/33500006.Let''s play together again sometime.@k@v36/33500007. Nihhihihihihihi!"'
20084: 'Chiester45@r@v35/33400004."F-...410, you mustn''t chat, you''ll get in trouble...!@k @v35/33400005.Let us carry out the great Lady BEATRICE''s order at once...!"'
20085: 'Chiester410@r@v36/33500008."Nihi.@k@v36/33500009. Looks like we''re on the job right now nyeh."'
20086: 'Chiester410@r@v36/33500010."......410, understood.@k@v36/33500011. Preparing for sniping pursuit combat."'
20087: 'Chiester45@r@v35/33400006."Collecting terrain data, collecting firing data.@k@v35/33400007. Data link to 410."'
20088: 'Chiester410@r@v36/33500012."410, data received.@k@v36/33500013. Target acquired.@k@v36/33500014. Correcting for terrain.@k@v36/33500015. Forming firing curve, control points adjusted.@k@v36/33500016. Data link to 45."'
20089: 'Chiester45@r@v35/33400008."45, data received.@k@v35/33400009. Checking danger zone, ......ah, not there!"'
20090: 'Chiester410@r@v36/33500017."You''re in the way behind us, Lucifer-chan,@k@v36/33500018. you''ll get roasted in the backfire, you know? Nihi!"'
20091: 'Lucifer@r@v38/32300145.".........nh..."'
20092: '@rThe Chiester sisters, through their mutual measurements,@k were able to instantly calculate the terrain inside the mansion and the coordinates of their targets, as well as a firing curve to reach them.'
20093: '@r...Yes, their shots could be guided to draw a curved line.@k@rNo one would be able to escape it.'
20094: '@rThe precision homing ability of the Seven Sisters of Purgatory was nothing more than a cheap version of the ability these two held.'
20095: 'Chiester45@r@v35/33400010."45, firing preparations complete.@k@v35/33400011. Ammo selected, now loading."'
20096: '@rThe two of them faced each other,@k and, as though they were both pulling back a bowstring together,'
20097: '@r...there, a dazzling golden arrow was readied.'
20098: 'Chiester410@r@v36/33500019."410, nihi.@k@v36/33500020. Firing."'
20099: '@rAfter they proclaimed that they were firing, together, they released a single arrow.'
20100: '@rAs the curve taken by the gold-sparkling snake of light drew a trail,@k it headed in the direction Rudolf and Kyrie had run, in rapid pursuit.'
20101: '@rIt turned through the corridors, crawled over the floor, chasing them as it drew a beautiful curve.'
20102: '@rNo one could block the Chiester Sisters'' homing projectiles.@k No one could escape them.@k And their strength could pierce all physical and magical defenses.'
20103: '@r......It was an all-too-merciless guided weapon of certain death.'
20104: '@rHowever, among mythical-class soldiers, it was a weapon used by pretty much everyone.@k It was very commonplace for them, ...and very extraordinary for those of the everyday world.'
20105: 'Rudolf@r@v08/31200413."Wh-what the...?!"'
20106: '@rWhen he noticed something rapidly chasing them, and turned around...'
20107: '@rRudolf was shot straight through the location of his heart by the gold snake.@k It all happened in an instant.'
20108: 'Kyrie@r@v09/31300386."R-Rudolf-san......?!"'
20109: '@rAfter the gold snake ran Rudolf through,@k it swooped down to the floor, drawing a beautiful spiral, coiled itself around Kyrie''s legs, and crawled up to her chest.'
20110: '@rAnd just like Rudolf, it shot straight through the location of her heart.'
20111: '@r...And all of that, too, happened in an instant.@k@rIt impaled Rudolf, and it impaled Kyrie.'
20112: '@rSo they died at almost the same time, dropped to their knees at the same time, and fell over at the same time.@|@y'
20113: 'EVA@r@v34/33300515."......What is thiiis?@k @v34/33300516.So overwhelming, ahhahahahahahahahahahahaha!@k @v34/33300517.That was ridiculously easy, wasn''t it?@k@|@y@v34/33300518. Kuhhihihyahyahyahyahya!@k @v34/33300519.This is the kind of furniture I need.@k@v34/33300520. Way different from my predecessor''s second-hand furniture!"'
20114: 'EVA@r@v34/33300521."Come on, bring their corpses here.@k@v34/33300522. I''ll keep reviving them until I''m bored, and try killing them in the most brutal ways I can think of.@k@v34/33300523. Aaah, to think that being a witch could be so much fun,@k@v34/33300524. that taking a life could be so much fun, ahhahahahahahahahahahaha!"'
20115: '@r......The most shunned action to take for someone born a human is the murder of another human.'
20116: '@rIt''s only natural for a human not to understand how pleasurable it is to break this taboo.'
20117: '@r......But she was no longer a Human.@k@rShe was a witch.'
20118: '@r...And there were some pleasures that only witches could understand.'
20119: '@rBy now, she had tasted those pleasures, and was totally immersed in them.'
20120: '@r...After learning that the contents of the forbidden pot were honey, she could no longer live without it.'
20121: '@r......No, maybe the contents were honey because they were forbidden.'
20122: '@rIn any case, the act of killing Humans gruesomely,@k and doing it over and over, was by now giving her a drug-like pleasure.'
20123: '@rAs the witch rolled over laughing,@k the gold snake which had just been fired returned as though being hauled back in.'
20124: '@rThe two were stitched at the tip and being dragged along.'
20125: '@rThe witch''s order had been carried out.'
20126: '@r...Rudolf and Kyrie had been killed instantly, and their bodies had been carried back.'
20127: 'Chiester45@r@v35/33400012."Chiester45, 410, execution of orders completed.@k@v35/33400013. We await your next order, Great Lady BEATRICE.@k@v35/33400014. Please, your order...!"'
20128: 'Chiester410@r@v36/33500021."From babysitting, to playing you in online multiplayer,@k@v36/33500022. to shooting down a space shuttle, we''ll take care of everything.@k@v36/33500023. Nihihi!"'
20129: 'EVA@r@v34/33300525."............These two are apparently the sacrifices for the fourth twilight and the fifth twilight.@k@v34/33300526. So in the end, I need those worthless Seven Sisters,@v34/33300527. ...oh, I guess they''re the Five Sisters now.@k@v34/33300528. I need those girls to pierce and gouge the forehead and the chest."'
20130: 'EVA@r@v34/33300529."......But I can do that at the very end, and I''m free to play in any way until then, right?@k @|@y@v34/33300530.Eheheheheheheheheh!"'
20131: 'BEATRICE@r@v27/30701732."Wait wait wait waait.@k@v27/30701733. ...Have you already forgotten what I told you?!"'
20132: 'EVA@r@v34/33300531."Oh, it''s you, Predecessor-sama.@k@v34/33300532. Do you have any complaints?"'
20133: 'BEATRICE@r@v27/30701734."Of course I do...!@k @v27/30701735.You are doing as you please, are you not?!@k @v27/30701736.Why can''t you follow my directions?!"'
20134: 'EVA@r@v34/33300533."What''s wrong with doing as I please, Predecessor-sama?@k @v34/33300534.And I haven''t got the slightest desire to deviate from the rules of the ritual."'
20135: 'EVA@r@v34/33300535."I''ll make sure to clean these two corpses up later, and drive stakes into their forehead and chest."'
20136: 'BEATRICE@r@v27/30701737."I, I''m telling you, that is not the problem...!@k @v27/30701738.If you act so undignified and cruel, uh,@k@|@y@v27/30701739. ...umm, some people might take it badly..."'
20137: 'EVA@r@v34/33300536."..............................@k@v34/33300537. ......You mean, your opponent in that game, who I heard you were fighting with somewhere?@k @v34/33300538.Ronove told me."'
20138: 'BEATRICE@r@v27/30701740."......C-curse that blabbermouth.@k@|@y@v27/30701741. .........Well, to be perfectly honest, that''s how it is.@k@v27/30701742. I had a complaint that, um,@v27/30701743. ...it is a little too much, you see?"'
20139: 'EVA@r@v34/33300539."It''s not like there''s any need for them to tell you to pass it on instead of objecting directly to me.@k@v34/33300540. ...That person is a coward."'
20140: 'BEATRICE@r@v27/30701744.".........Well, that person is a resident of, uh, a different world from this one, you see.@k@v27/30701745. There''s no choice but to use me as an intermediary.@k@v27/30701746. Well, anyway, the point is - "'
20141: 'EVA@r@v34/33300541."........................@k@|@y@v34/33300542. ......Which means that this person can''t interact with me even if they wanted to.@k@v34/33300543. And I can''t interact with them even if I wanted to either.@k@v34/33300544. Am I correct to understand this as an unrelated person from a world that far away?"'
20142: 'BEATRICE@r@v27/30701747."M-mm.@k@v27/30701748. ......By analogy, perhaps you could say these worlds are like two very close parallel lines.@k@v27/30701749. The worlds are very nearby, but since they are parallel lines, they will never cross.@k@v27/30701750. For the time being, you may view that world in such a manner."'
20143: 'EVA@r@v34/33300545."They never cross.@k@v34/33300546. Which means...@v34/33300547..........that world has nothing to do with me.@k@|@y@v34/33300548. ...If you''re telling me on behalf of that person to show some restraint, please pass this message on to them."'
20144: 'BEATRICE@r@v27/30701751."A message?@k @v27/30701752.What should I say...?"'
20145: 'EVA@r@v34/33300549."It''s none of your business, so screw off, you old hag.@k@|@y@v34/33300550. Why don''t you just give up and die forever...?"'
20146: 'BEATRICE@r@v27/30701753."..................Wha - "'
20147: 'EVA@r@v34/33300551."...Oh, I''m sorry.@k@v34/33300552. Since it was a friend of yours, I just imagined that she''d be a woman.@k@|@y@v34/33300553. By "old hag", I''m definitely not talking about youuu, Predecessor-sama, so please forgive me.@k@|@y@v34/33300554. *cackle*cackle*cackle*cackle*...!"'
20148: '@rWhen she spoke, the witch was looking straight into Beato''s eyes.@k@r...Anyone in that place would be able to figure it out just by looking.'
20149: 'EVA@r@v34/33300555."............Predecessor-sama.@k@v34/33300556. There is something I find very strange.@k@v34/33300557. ...Why do you have to play a game with that person from another world,@k@v34/33300558. and have them accept that you are a witch?"'
20150: 'BEATRICE@r@v27/30701754."Well, about that,@k@v27/30701755. ...that is because making all humans accept the existence of witches is related to perfect control.@k@v27/30701756. There was a single holdout, you see, and he just won''t accept me as a witch."'
20151: 'EVA@r@v34/33300559.".........Why is it that you need that Human''s approval?@k @v34/33300560.Witches are witches, and they use magic; why do you need a Human''s acknowledgement for this?"'
20152: 'BEATRICE@r@v27/30701757."...Mh, .........well, like I said earlier, that which is called magic is - "'
20153: 'EVA@r@v34/33300561."I am a witch.@k@v34/33300562. I can use magic without anyone''s approval in particular, so what''s your point......?"'
20154: 'BEATRICE@r@v27/30701758."In this world, right?@k @v27/30701759.However, since he will not accept it, umm,@v27/30701760. ...hmmmm, how should I explain it..."'
20155: 'EVA@r@v34/33300563."......I don''t need an explanation.@k@v34/33300564. After all, isn''t this all about a different world that never crosses this one?@k@v34/33300565. In other words, it''s just as though that world doesn''t exist."'
20156: 'EVA@r@v34/33300566."...............Whether you''re fighting in a game in another world, or talking about your delusions, that doesn''t change aaanything.@k@v34/33300567. ......I''ll say it again.@k@v34/33300568. It has nothing to do with me.@k@v34/33300569. And I am already a witch."'
20157: 'EVA@r@v34/33300570."Predecessor-sama, somehow or another, it seems that you can''t become a witch as long as this person doesn''t accept you, but I''m different.@k@v34/33300571. Even though no one has accepted me, I am already an excellent witch.@k@v34/33300572. .........Since you are my predecessor, I will formally pay you respect,@k@v34/33300573. but that is out of good will, not out of duty."'
20158: 'EVA@r@v34/33300574."......I do not seek your advice anymore,@k@v34/33300575. and I understand clearly what I should do now and how I should play from now on."'
20159: 'EVA@r@v34/33300576.".........So I will carry out the ceremonial murder of the thirteen people as a final act of respect for you.@k@v34/33300577. However, as for the methods I use,@k@v34/33300578. and what I do after that, there is absolutely no reason I should be lectured by you on those.@k@v34/33300579. ..................Therefore, I''ll be counting on you in that regard."'
20160: '@rAt a glance, those words seemed obedient, but they contained within them a clear parting of ways.'
20161: '@r...They were saying, as clear as could be,@k "I have no more reason to rely on you, so don''t get in the way of my fun".'
20162: '@rBeato understood that,@w500. ...and was dejected, realizing that no matter how she explained it, she wouldn''t be able to make the witch understand.'
20163: 'BEATRICE@r@v27/30701761."...I, ............I see...@k@v27/30701762. Then it is no longer my problem...@k@v27/30701763. Go and learn first-hand how magic ceases to exist when you lose your feelings of respect for it."'
20164: 'EVA@r@v34/33300580."......That carefree rampage of yours up until now,@k@v34/33300581. I would dearly like to hear how it can be called respect."'
20165: '@rAfter hearing that, Beato could not respond.@k ......Because she remembered hearing exactly the same thing from her master.'
20166: 'EVA@r@v34/33300582."So.@k@v34/33300583. Chiester Sisters?@k @v34/33300584.My predecessor is just leaving, please see her off."'
20167: 'Chiester410@r@v36/33500024."Nihihihihi.@k@v36/33500025. Predecessor-sama, please retire from this place."'
20168: 'Chiester45@r@v35/33400015."I-if you don''t, we''ll be scolded...!"'
20169: '@rThroughout her body, Beato felt something invisible in the Chiester Sisters'' eyes which could only be described as an oppressive feeling.'
20170: '@r......Most likely, they were initiating firing calculations.@k@rIt was an action much like taking out a gun and cocking it.'
20171: '@rEven Beato could not escape from the Chiester Sisters'' attacks without any preparation.'
20172: '@r...In the past, she had placed her greatest trust in them, so she knew down to her very soul how terrifying they were.'
20173: 'Ronove@r@v31/33100538.".........Predecessor-sama, if you would retire.@k@v31/33100539. .........I would not recommend damaging BEATRICE-sama''s mood any further."'
20174: 'Lucifer@r@v38/32300146."......Predecessor-sama..."'
20175: 'BEATRICE@r@v27/30701764."A-.........alright.@k@v27/30701765. ...I shall now take my leave.@k@|@y@v27/30701766. ......I shall take my time appreciating the circumstances you will put yourself in!"'
20176: '@rThat was as close as you could get to a loser''s last retort.'
20177: '@r...So after Beato hid herself, the witch and her furniture fell over laughing...'
20178: 'BEATRICE@r@v27/30701767."............Well, I understand.@k@v27/30701768. Endless power is fun.@k@v27/30701769. ...The joy of freely toying with a life, the epitome of finite things, cannot be explained to those who have not tasted it.@k@v27/30701770. ......I can understand the feeling of being possessed with that pleasure."'
20179: 'VIRGILIA@r@v30/33200460."......It must have been quite fun.@k@v30/33200461. Judging from your antics in the past."'
20180: 'BEATRICE@r@v27/30701771."Are you saying it is like how you used to admonish me in the past, Master, and I did not listen...?"'
20181: 'VIRGILIA@r@v30/33200462.".........Why is it that you have started trying to scold that child for her actions?"'
20182: 'BEATRICE@r@v27/30701772."Mh, ......umm, well.@k@v27/30701773. ........................"'
20183: 'VIRGILIA@r@v30/33200463."...There is a single large difference between you and that child.@k@v30/33200464. That child may already be a witch.@k@v30/33200465. Of course, you are also a witch.@k@v30/33200466. In the world on top of the game board."'
20184: 'VIRGILIA@r@v30/33200467."......However, to be accepted as a witch outside the game board,@k@v30/33200468. you need to have your opponent in this game, Battler-kun, accept you.@k@v30/33200469. ......You must have understood that when you started the game."'
20185: 'BEATRICE@r@v27/30701774."......I thought that if I could show off a whirlwind of proof that I am a witch,@k@v27/30701775. blow away his feelings that made him deny me, and break him completely,@v27/30701776. .........he would accept me as a witch.@k@v27/30701777. ...It all went my way last time, so I thought I was just a breath away..."'
20186: 'VIRGILIA@r@v30/33200470."It''s actually the opposite.@k@v30/33200471. Battler-kun was shocked by your brutality.@k@v30/33200472. And the reason he stepped up as your opponent was not because he accepted you as an equal opponent.@k@v30/33200473. It was based on a strong animosity, as he tried to completely deny the existence of a brutal witch."'
20187: 'VIRGILIA@r@v30/33200473_1.".........In your foolishness, you probably felt that Battler-kun considering himself as your opponent...@k@v30/33200473_2.was a first step towards making him accept that you are a witch.@k@v30/33200473_3. However, it was actually the exact opposite."'
20188: 'VIRGILIA@r@v30/33200473_4."Battler-kun challenged you in this game because he definitely would not accept you as a witch.@k@v30/33200473_5. ......No matter how much the thoughtless north wind blew, the traveler only wore his cloak even tighter.@k@v30/33200473_6. You were committing a huge error from the very beginning."'
20189: 'VIRGILIA@r@v30/33200473_7."............This game is not torture to break Battler-kun.@k@v30/33200473_8. It is a test, in which you must work hard to make Battler-kun accept you."'
20190: 'BEATRICE@r@v27/30701786."...............@k@v27/30701787. ...I,@v27/30701788. ......I vaguely, you know,@v27/30701789. ...realized that..."'
20191: 'VIRGILIA@r@v30/33200474."Last time, it was a tough game for Battler-kun.@k@|@y@v30/33200475. But it seems that you''ve already noticed.@k@v30/33200476. ......This time, the game is tough for you."'
20192: 'BEATRICE@r@v27/30701790."Wh-...what should I do from now on?"'
20193: 'VIRGILIA@r@v30/33200477."Think about it yourself.@k@v30/33200478. ......Fortunately, you have already abandoned being a piece on the game board, and relegated things to the new witch.@k@v30/33200479. You should have time to deliberately ponder upon yourself."'
20194: 'BEATRICE@r@v27/30701791."............But Battler''s already a big ball of hostility.@k@v27/30701792. He won''t accept witches, and he won''t accept me.@k@v27/30701793. ......In that case, how do I make Battler accept me, then...?@k@v27/30701794. Are you saying that if the north wind doesn''t work, ...then I should shine on him as the sun from now on...?@k @v27/30701795.I should, after all this time......?"'
20195: 'VIRGILIA@r@v30/33200480."It is October now.@k@v30/33200481. The Halloween season.@k@v30/33200482. .........It is the month of rebirth, when the sun dies and is revived again.@k@v30/33200483. When the sun is weak right after reviving, it may pale in comparison to the cold winter winds."'
20196: 'VIRGILIA@r@v30/33200484."However, it slowly grows, and is eventually able to hail the coming of spring.@k@v30/33200485. ...At that time, the traveler may even fold up his cloak."'
20197: 'BEATRICE@r@v27/30701796.".........So you say...@v27/30701797....that I am mistaken........."'
20198: '@r...The beautiful hall of the Ushiromiya mansion was covered in a glow golden like gold leaf,@k ...and stained deep red with thick spurts of blood.'
20199: '@rThe number of deaths given to Rudolf and Kyrie had long surpassed anything you could count on both your fingers and your toes.'
20200: '@rThe witch was breathing so hard her shoulders shook, but it wasn''t because she was tired.@k@r...She just couldn''t hide the ragged breathing caused by her still uncontainable excitement.'
20201: 'EVA@r@v34/33300585."Ahhahahahahahahahahahhahahahaha!!@k @v34/33300586.How fun it is to do as I will with the life and death of people!@k @v34/33300587.Before the power of the Endless Witch, every one of the infinities I paint with my mind becomes reality!"'
20202: 'EVA@r@v34/33300588."No matter how sloppily I mash them,@k@v34/33300589. I can revive them, returning them to normal with just a snap of my fingers."'
20203: 'EVA@r@v34/33300590."Because in the end, I just have to return the corpses to normal and make a token show of following the epitaph.@k@|@y@v34/33300591. Ahhahahahahahahahahahahahahahahahaha!!"'
20204: 'EVA@r@v34/33300592."......Hey, you guys,@k@v34/33300593. have you ever sliced a stuffed animal''s stomach open?"'
20205: 'Chiester410@r@v36/33500026."Never, nihi.@k@v36/33500027. What about you, 45?"'
20206: 'Chiester45@r@v35/33400016."N-no...!@k @v35/33400017.I have never done it, my apologies...!"'
20207: 'EVA@r@v34/33300594."Of course not.@k@v34/33300595. Normally, you wouldn''t.@k@v34/33300596. ......Especially not if it was a stuffed animal you liked.@k@v34/33300597. But I''ve always thought about it."'
20208: 'EVA@r@v34/33300598."I wondered what was packed inside this fluffy stuffed animal that I loved so much,@k@v34/33300599. and always thought I''d like to peek inside one day."'
20209: '@rIf you cut it and looked inside, your curiosity might be quelled, but the stuffed animal would be broken.'
20210: '@r......So even though you want to see, you can''t.@k@rYou understand that feeling, right?'
20211: 'EVA@r@v34/33300600."......The power of the Endless Witch can grant exactly that wish.@k@v34/33300601. ...As I am now, I can slice the stuffed animal all I want."'
20212: 'EVA@r@v34/33300602."......And yet, with a bit of magic, I can revive it back to normal.@k@v34/33300603. ...In other words, it means that I have broken all limitations in this world.@k@v34/33300604. ......As I am now, I don''t have to hesitate, refrain, or anything of the sort."'
20213: 'EVA@r@v34/33300605."That joy, ......aah, there''s probably no one who can understand it.@k@v34/33300606. No one other than me, the Endless Witch!!"'
20214: '@rAs the witch let out a euphoric cry, she revived Rudolf and Kyrie again,@k and faster than they could realize it, she killed them right away.'
20215: '@r......As she made it known that something other than cotton was stuffed inside those two.'
20216: 'Hideyoshi@r@v06/31100374."...G-@v06/31100375.............give it a rest, Eva......!"'
20217: 'EVA@r@v34/33300607."Huh?@k @|@y@v34/33300608.......Ah, you.@k@v34/33300609. You''re here."'
20218: '@rIn that hall of tragedy, Hideyoshi showed himself, his gun readied.'
20219: '@rThe witch had sealed the mansion with a barrier, so Hideyoshi had nowhere to run.'
20220: '@r...He had probably picked up Rudolf''s or Kyrie''s gun, and come back.'
20221: '@rIt seemed that the gun, which should have been something to be feared, was no longer an object she took seriously now that she was overflowing with magic power.'
20222: '@rHer bold expression didn''t flinch in the slightest.'
20223: 'Hideyoshi@r@v06/31100376.".........Why''d you have to kill Rosa-san and Maria-chan,@v06/31100377. ......and Rudolf-kun and Kyrie-san......?!"'
20224: 'EVA@r@v34/33300610."Huh?@k @v34/33300611.I am the head of the Ushiromiya family, and the witch of Rokkenjima.@k@v34/33300612. I am free to start whatever I like on this island.@k@v34/33300613. ...Just isolating this one instant and asking about their life and death within it is meaningless to me."'
20225: '@rHideyoshi was struck speechless by that all-too-callous response from the witch.@k Could someone''s personality change so much just by finding Kinzo''s gold......?'
20226: 'Hideyoshi@r@v06/31100379."Just how high was that gold piled?@k@v06/31100380. I can''t even imagine it.@k@v06/31100381. It must have been enough to make you lose your sanity..."'
20227: 'Hideyoshi@r@v06/31100382."......Still, if there was that much gold,@k@v06/31100383. ......why didn''t you think of graciously splittin'' it up...?!!"'
20228: 'EVA@r@v34/33300614."You misunderstand.@k@v34/33300615. ............All of that belongs to the Golden Witch.@k@v34/33300616. No one is qualified to touch it except for me.@k@v34/33300617. *giggle*giggle*giggle*, ahhahahahahahahahahahahahahahahaha...!!"'
20229: 'Hideyoshi@r@v06/31100384."......What are you?@k@v06/31100385. Are you tryin'' to say you''re that thing Eva told me about long ago......the witch Eva from when she was young?"'
20230: 'EVA@r@v34/33300618."That''s right.@k@v34/33300619. I am me in my youth, who was always living in the heart of your wife, Ushiromiya Eva.@k@v34/33300620. ...And I''m a witch.@k@|@y@v34/33300621. .........Eva became an adult by forgetting me.@k@v34/33300622. So she can''t use magic."'
20231: 'Hideyoshi@r@v06/31100386."...Everyone fills their head sometimes with innocent yet cruel fantasies, as kids.@k@v06/31100387. Even me, when I was young, I''d sometimes go around steppin'' on ants and pullin'' the wings off dragonflies.@k@v06/31100388. .........But you learn the importance of life, and grow out of that cruel childhood age."'
20232: 'Hideyoshi@r@v06/31100389."......Right now, you really are a child, y''know!@k @v06/31100390....A personality that Eva should have outgrown!@k @v06/31100391.That''s not Eva.@k@v06/31100392. It''s a different human!!"'
20233: 'EVA@r@v34/33300623."That''s right.@k@v34/33300624. I am not Ushiromiya Eva.@k@v34/33300625. I''m the Golden Witch, BEATRICE."'
20234: 'EVA@r@v34/33300626."It''s so fun, not being bounded by any limitations, and the pleasure of being able to do as I will with life and death is truly wonderful...!@k @v34/33300627.I don''t have to apologize for breaking the goldfish bowl,@k@v34/33300628. and I can tear the stuffed animal as much as I want!@k @v34/33300629.I - "'
20235: '@rA dry sound.'
20236: '@r...It was the sound of Hideyoshi slapping the witch''s face.'
20237: '@rBy looking at the hall stained deep red with fresh blood, he should have been able to imagine how terrible the witch was.'
20238: '@rBut without fear, without even hesitating, Hideyoshi had walked determinedly up to her, and hit her on the cheek.'
20239: 'EVA@r@v34/33300630."....................."'
20240: 'Hideyoshi@r@v06/31100393."You dolt!!@|@y@k @v06/31100394.Don''t act like you''re cruel, not when you''re really a coward and a weaklin''!@|@y@k @v06/31100395.I''ll keep you on the straight and narrow, you wicked woman!!@k @v06/31100396.You dumbo!@|@y@k @v06/31100397.Nitwit!!"@|@y'
20241: 'EVA@r@v34/33300631."Ow,@|@y@v34/33300632. ......ouch,@|@y@v34/33300633. ...hey...!"'
20242: 'Hideyoshi@r@v06/31100398."You used to be a woman who understood how important, how fragile a life is!@k @v06/31100399.I''ll knock some sense back into you...!!@k @v06/31100400.What''s all this about witches, what a load of crock!!"@|@y'
20243: 'Hideyoshi@r@v06/31100401."You''re my wife, Ushiromiya Eva!@|@y@k @v06/31100402.A witch of the kitchen, thoughtfully whippin'' up snacks from leftovers in the fridge, that''s the only witch you are!!@k @v06/31100403.Open your eyes, you blunderin'' dolt...!!"@|@y'
20244: 'EVA@r@v34/33300634."Didn''t I just say...@v34/33300635.that I''m not Ushiromiya Eva......?!"'
20245: 'Hideyoshi@r@v06/31100404."That''s horsecrap!!@k @v06/31100405.You!@|@y@k @v06/31100406.You!!"@|@y'
20246: '@rAs tears dripped down his face, Hideyoshi kept hitting the witch''s head.'
20247: '@rHe wasn''t even pointing the gun at her anymore.'
20248: '@rSo.@k That sound of gunfire couldn''t have come from the gun Hideyoshi was holding.'
20249: '@r......The gun, which had fallen in the corner near Rudolf''s body, was floating in the air,@k ...and smoke lingered near the barrel.'
20250: '@rAnd the bullet?@k .........A red stain was slowly spreading across the chest of Hideyoshi''s vest.'
20251: '@rEven though his back was facing the barrel of the gun, ...the bullet was embedded in Hideyoshi''s chest.'
20252: 'Hideyoshi@r@v06/31100407.".........E...@v06/31100408.va............@k@v06/31100409. ............uu..."'
20253: 'EVA@r@v34/33300636."...I told you, I''m not Eva.@k@v34/33300637. What a stupid, annoying man."'
20254: 'EVA@r@v34/33300638."......You''re a pain, so I''ll switch the sacrifice for the sixth twilight to you.@k@v34/33300639. ...If you''d just stayed hidden under a bed quivering or something, I''d planned to let you go.@k@v34/33300640. ......You deliberately came back.@k@v34/33300641. You really are a stupid man."'
20255: '@rThunk...@k There was a dull sound as Hideyoshi fell to the floor.'
20256: '@rEven though he would be able to escape his pain by dying, he resisted that until the last second,@k and staring straight into the witch''s eyes, ...he passed away.'
20257: '@rBecause he had died without closing his eyes, for a short while, the witch didn''t realize that he was dead,@k and she remained pinned down by that gaze.'
20258: 'Chiester410@r@v36/33500028."Will we make this one a new toy and play?@k @v36/33500029.Nihi."'
20259: '@rAt those words, the witch finally realized that Hideyoshi was dead.'
20260: 'EVA@r@v34/33300642.".........nn, ...ahh.@k@v34/33300643. ...Right, what''ll we do..."'
20261: '@rThe Chiester Sisters waited for instructions.@k@rOn the inside, they imagined an order even more brutal than before from their master.'
20262: '@rBut the expression that rose to the witch''s face looked as though she had gotten over her excitement.@k@rShe looked down at Hideyoshi''s face, which still had tears dripping down it...'
20263: 'EVA@r@v34/33300644."......This guy totally ruined my mood.@k@v34/33300645. Yeeeah, I''m done.@k@v34/33300646. .........Ronove, you there?"'
20264: 'Ronove@r@v31/33100540."Yes, right here."'
20265: 'EVA@r@v34/33300647."Clean up, please.@k@v34/33300648. ...My predecessor will be annoying.@k@v34/33300649. Please make it clean enough so that the old hag will accept it. ......And I guess I will follow the rules of the ritual, out of responsibility to my predecessor.@k@v34/33300650. Please make these three corpses the fourth twilight through the sixth twilight."'
20266: 'EVA@r@v34/33300651."Lucifer, you''re up."'
20267: 'Lucifer@r@v38/32300147."Lucifer of Pride, right here."'
20268: 'EVA@r@v34/33300652."Dig into these three corpses and gouge them."'
20269: 'Lucifer@r@v38/32300148."I-...into the corpses?"'
20270: 'EVA@r@v34/33300653."That''s right.@k@v34/33300654. You have a problem with that?"'
20271: 'Lucifer@r@v38/32300149."N-...no..."'
20272: '@rThe Seven Sisters of Purgatory had a modest sense of pride.@k It was the pride of a hunter, the pride of gouging prey that they had brought down themselves.'
20273: '@r...However, being told to gouge a corpse that someone else had brought down ran contrary to that feeling.@k Of course, that was not the witch''s intention, but for the Seven Sisters, it was horribly humiliating.'
20274: '@r...However, they had already messed up, with two of the sisters defeated, so they had no right to question her.'
20275: '@rOnly Ronove appreciated that, and he rested his hand on her shoulder in understanding.'
20276: 'Ronove@r@v31/33100541."......It is BEATRICE-sama''s order.@k@v31/33100542. Lucifer, carry the three, and deal with them according to the protocol of the ritual.@k@v31/33100543. Then, when you are done, lend me a hand with the cleanup."'
20277: 'Lucifer@r@v38/32300150."Certainly......"'
20278: '@rThe witch looked down upon Hideyoshi''s corpse, as though implying that this somehow weird atmosphere was all Hideyoshi''s fault.'
20279: 'EVA@r@v34/33300655.".........Stupid man.@k@v34/33300656. You didn''t even have to die."'
20280: 'Eva@r@v05/31000767."Honey......!!!@|@y@k @v05/31000768.Aaaaaaaaaaaaaaaaaaaahhh!!@k @v05/31000769.Honey, where are you?!@k @v05/31000770.You''re there, right?@k @v05/31000771.Answer me!!"'
20281: '@rThe sound of a loud thunderbolt woke Eva from her nightmare.'
20282: '@rIf Hideyoshi had been gripping her hand at that time, her fearful heart would probably have been instantly healed.'
20283: '@rHowever, Hideyoshi, who had sworn that he wouldn''t leave even for a moment, was nowhere to be seen in the room.'
20284: 'Eva@r@v05/31000772."Honey,@v05/31000773. ...answer me...@v05/31000774. .........Honey...!!@k @v05/31000775.Uuuuuhhuuuuuughhhuu!!"'