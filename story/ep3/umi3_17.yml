21987: 'EVA@r@v34/33301125."The culprit that killed Nanjo was not an animal or anything of the sort.@k@v34/33301126. That has already been dealt with in red, you know?@k @v34/33301127.Remove everything other than humans from consideration entirely.@k@v34/33301128. And no stuff like robots, either."'
