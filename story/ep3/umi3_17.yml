21967: 'Battler@r@v10/30101708."D-.........damn it............!!!"'
21968: 'EVA@r@v34/33301120."I''ll state it clearly,@k@v34/33301121. right now.@k@v34/33301122. ......The one who appeared in front of Nanjo was me.@k@v34/33301123. A witch.@k@|@y@v34/33301124. ......The Golden Witch, who can''t be explained by the 18 humans!!"'
