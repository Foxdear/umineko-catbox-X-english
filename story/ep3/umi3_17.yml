21737: 'EVA@r@v34/33300879."......I refuse.@k@v34/33300880. ...So tell me then!@k @v34/33300881.Eva is just a woman.@k@v34/33300882. And the people who were killed were three adults holding two guns, right?"'
21738: 'EVA@r@v34/33300883."How did she kill them all by herself?@k @v34/33300884.How did she do it with those stakes as weapons?@k @v34/33300885.How is this stake-shooting device that everyone keeps talking about constructed?!"'
21739: 'EVA@r@v34/33300886."Explain that!!@k @v34/33300887.As long as you can''t explain it, even if Eva doesn''t have an alibi,@k@v34/33300888. it doesn''t mean that it was possible for Eva to commit murder!"'
21740: 'Battler@r@v10/30101543."Decline explanation!!@k @|@y@v10/30101544.It''s a "Devil''s Proof"!@k @v10/30101545.You can''t refute the existence of an unknown murder technique or an unknown weapon just because it''s impossible to explain!!"'
