21821: 'EVA@r@v34/33300955."Huh?!@k @v34/33300956.What kind of move can you possibly have, Predecessor-sama?!@k @v34/33300957.Care to tell me what kind of move can deny my magic, the magic of BEATRICE?@k @|@y@v34/33300958.You can''t, it''s impossible!!"'
21822: 'BEATRICE@r@v27/30702112."......If the proposition "I won''t go to the mansion to get food" cannot be explained by itself,@k@v27/30702113. ......I will explain it with the contrapositive.@|@y@k@v27/30702114. In short, you may also be able to explain it with "she did go to the mansion, therefore there was a goal other than food"."@|@y'
