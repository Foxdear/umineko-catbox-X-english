22020: 'EVA@r@v34/33301149."How can this checkmate, which is completely impossible for Humans to break,@k@v34/33301150. possibly be broken by the likes of you?!"'
22021: 'VIRGILIA@r@v30/33200615.".........B-BEATRICE, you couldn''t be..."'
22022: 'BEATRICE@r@v27/30702188."Mm.@k@v27/30702189. ...What about a move that a Human cannot make.@k@v27/30702190. ......I will counterattack you with a move I can use because I am a witch..."'
