22027: '@rThe master and the butler were both startled.'
22028: '@r......I also immediately understood what it meant.@k@rTo use the red that only witches could use.@k@r...To use the red to deny witches.'
22029: '@rIt was like using her own sword to slit her own throat.'
22030: 'EVA@r@v34/33301151."Wh-............whaaat...?!@k @v34/33301152.C-......come on, what are you saying?@k @v34/33301153.Deny witches with red...?@k @|@y@v34/33301154..........D-...don''t talk like an idiot.@k@v34/33301155. If you do that, ...you won''t get away unscathed either......!!"'
