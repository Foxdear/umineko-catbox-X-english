21784: 'BEATRICE@r@v27/30702106."S-......sorry..."'
21785: 'Battler@r@v10/30101579."......Aaaaaaahhh, damn it!!@k @|@y@v10/30101580.She was probably, umm, ......thinking of us kids and, umm, ...on the whole, thought that food really was necessary and..."'
21786: 'VIRGILIA@r@v30/33200578."You must make that claim objectively.@k@v30/33200579. ...You require tangible evidence of the specific reason for which Kyrie changed her mind and decided that food really was necessary.@k@v30/33200580. ......For example, if someone heard her say that, or if it was written down somewhere."'
21787: 'EVA@r@v34/33300923."Too bad, @v34/33300924.@|@y@c900.@[no reason for her changing her mind was ever told to anyone, nor was one ever written down!@]@c.@k @v34/33300925.Therefore, you can only speculate as to what was inside Kyrie''s mind!"'
21788: 'EVA@r@v34/33300926."So it is impossible to prove!!@k @v34/33300927.You don''t have a single counter to my move!@k @v34/33300928.It''s your turn to resign now, Battler-kuuun...!!"'
21789: 'VIRGILIA@r@v30/33200581."......It is possible to hypothesize endlessly as to the reason behind her change of heart.@k@v30/33200582. And, it is impossible to crush all of those endless possibilities."'
21790: 'Ronove@r@v31/33100630."A detestably spectacular move.@k@v31/33100631. .........If Battler-sama were to have a method of countering, ...it could probably only be that move."'
