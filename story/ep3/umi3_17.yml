21970: 'Ronove@r@v31/33100644_1."......Yes.@k@v31/33100644_2. "Red truth", valid."'
21971: 'VIRGILIA@r@v30/33200608_1."............What an......elaborate and precise cornering......"'
21972: 'Battler@r@v10/30101713."H-......how should I make a move against this...?@k@v10/30101714. VIRGILIA...!@k @v10/30101715.Isn''t there any move......?!"'
