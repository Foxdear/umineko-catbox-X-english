21792: 'Ronove@r@v31/33100632."......Well now.@k@v31/33100633. I wonder what kind of move it could be.@k@v31/33100634. I have the feeling that it was Milady''s specialty, but I cannot remember."'
21793: 'BEATRICE@r@v27/30702108."..................kh...@k@v27/30702109. Quit being stingy and tell me...!"'
21794: 'VIRGILIA@r@v30/33200583."BEATRICE.@k@v30/33200584. There is no answer that will be given to those who stop thinking themselves.@k@v30/33200585. ...Think.@k@v30/33200586. Think in your own way!"'
21795: 'EVA@r@v34/33300929."Why don''t you resign right now?@k @|@y@v34/33300930.And I''ll corner you even more with red.@k @v34/33300931.@|@y@c900.@[Until the last instant before she died, Kyrie maintained her pattern of behavior which states ''I won''t go to the mansion to get food''!@]@c."'
21796: 'EVA@r@v34/33300932."And yet, she took the initiative and headed for the mansion.@k@v34/33300933. She was pushing a cart, trying to carry food.@k@v34/33300934. Why that contradiction?@k @|@y@v34/33300935.......Because I controlled her with magic!!!@|@y@k @v34/33300936.This is the proof that my magic exists, and that I am a witch!!"'
21797: 'Battler@r@v10/30101581."...............Shut your damn mouth...!!"'
21798: 'Battler@r@v10/30101582."A-...are you saying that she never even changed her mind?!@k @v10/30101583.......The whole time until she died, Kyrie-san thought "we don''t need food", "I won''t go to the mansion"?@k @v10/30101584.Then why did she step forward herself and say that they should go to get food, and go to the mansion...?!!"'
21799: 'Battler@r@v10/30101585."Are you saying that Kyrie-san was being controlled with magic?!@k @v10/30101586.That''s stupid...!!@k @v10/30101587.How, ...how am I meant to break through this magic?!"'
21800: 'Battler@r@v10/30101588."...If only Kyrie-san were here, and just told us the reason behind her change of heart...@k@v10/30101589. No, I''ve already been told in red that she never even changed her mind...!@k @v10/30101590.What should I do...?!!@k @v10/30101591.There''s no move that the human side can counter with!!"'
21801: 'EVA@r@v34/33300937."The more I learn about this game, the more advantageous the rules seem for the witch, don''t they?@k @v34/33300938.Even if the witch loses in a lot of areas, if she can win in just one, with that alone she can flaunt her existence."'
21802: 'EVA@r@v34/33300939."......In other words, Battler-kun, you have no way of denying witches other than a complete victory!"'
21803: 'EVA@r@v34/33300940."You called me Eva all those times and seemed to be under the impression that you''d been cornering me,@k@v34/33300941. but it''s all been turned over by nothing more than the inside of your respected Kyrie-san''s head, don''t you think that''s truly funny?!"'
21804: 'EVA@r@v34/33300942."*cackle*cackle*cackle*cackle*, ahhahahahahahahahahaha!!@k @v34/33300943.Just do it, resign!!@k @v34/33300944.Why don''t you just accept it forever?@k @v34/33300945.Why don''t you just lose forever?!"'
21805: 'Battler@r@v10/30101592.".........Damn iiiiiiiiiiiiiit...@|@y@k@v10/30101593. It''s impossible for a human to show...@k@v10/30101594. I can''t do anything but guess what the dead were thinking when they acted.@k@v10/30101595. Furthermore, I can''t deny magic just by conjecture.@k@v10/30101596. ...To break through magic, I need objective evidence as to why Kyrie-san had a change of heart..."'
21806: 'Battler@r@v10/30101597."......But damn it,@k@v10/30101598. it''s been said in red that no evidence exists as to why she started wanting food...@k@v10/30101599. ......What should I do, damn it, damn it...!!!"'
21807: 'Ronove@r@v31/33100635.".........Battler-sama.@k@v31/33100636. May I take it that...you resign?"'
21808: 'Battler@r@v10/30101600."...........................kh.........@k@v10/30101601. "I won''t go to the mansion to get food".@k@v10/30101602. But how should I understand Kyrie-san''s thoughts, which actually do contradict......?!"'
21809: 'EVA@r@v34/33300946."You can''t understand!!@k @v34/33300947.It''s impossible to understand, and impossible to interpret!!@k @v34/33300948.That darkness is all of the witch!"'
21810: 'EVA@r@v34/33300949."Come on, it''s useless to think, so quit, alright?!@k @v34/33300950.There''s no way you can deny witches!@k @v34/33300951.I mean, look at me, I exist."'
