21829: 'VIRGILIA@r@v30/33200591."We cannot call Kyrie''s ghost here,@k@v30/33200592. but by learning what Kyrie left behind, we may be able to use that as a weapon."'
21830: 'EVA@r@v34/33300959."Ha, hahahahahahahahaha!!@k @v34/33300960.Fine, search as much as you want!!"'
21831: 'EVA@r@v34/33300961."There''s no way you''ll learn anything!@k @v34/33300962.I just said it in red a short while ago.@k @v34/33300963.@|@y@c900.@[Kyrie did not leave anything written down!@]@c.@k @v34/33300964.No matter what you find, how could you understand anything!!"'
21832: 'BEATRICE@r@v27/30702121.".........We may find nothing...@k@|@y@v27/30702122. ......But, ......Battler is grinding his teeth, fighting to think of a move to break through you.@k@v27/30702123. .........This is all that I can do......"'
21833: '@rBeato landed on her feet in the reconstructed hall,@k approached Kyrie''s fallen body, and wandered around observing.'
21834: 'BEATRICE@r@v27/30702124."I, I don''t quite understand the process of how the Human side fights...@k@v27/30702125. .........Evidence was required, was it...?@k@v27/30702126. ......Then what should I search for?"'
21835: 'EVA@r@v34/33300965."The purported Great Lady BEATRICE is getting down on her knees and crawling around!@k @v34/33300966.And she''s even disgracefully searching a corpse?@k @|@y@v34/33300967.*cackle*cackle*cackle*, how that look suits you...!!"'
21836: 'BEATRICE@r@v27/30702127."...Say what you wish...@k@v27/30702128. ......I cannot do any more than this...@k@v27/30702129. ......I do not care how I am mocked..."'
21837: 'BEATRICE@r@v27/30702130.".........However, I cannot abandon Battler, as he is fighting for my honor...@k@v27/30702131. ......Even if I must crawl on the ground and search through dead flesh,@k@v27/30702132. ......I must answer to that responsibility..."'
21838: '@rWhile being subjected to the witch''s sneers, Beato searched through Kyrie''s corpse.@k@r......She fished through the pockets, taking out what was inside and laying it on the floor...'
21839: '@rLaid on the floor,@k ......was a handkerchief,@k tissue,@k a key to her house,@k the stub of a plane ticket,@k a lighter,@k a cigarette butt,@k and a single hundred-yen coin...'
21840: '@rThere was no special, suspicious object...@k Although Beato was down on all fours and being sneered at, that was all she could find.'
21841: 'EVA@r@v34/33300968."Ahhahahahahahahahahahahaha!!@k @v34/33300969.What''s with that wretched looking trash?!@k @v34/33300970.Come on then, how are you gonna break through my magic with that stuff?!"'
21842: 'EVA@r@v34/33300971."Worthless, worthless, you look so duuuumb!!@k @v34/33300972.What''s with this state of affairs after you butted in sounding all heroic?!@k @v34/33300973.Aaah, how pathetic, how embarrassing!!@k @v34/33300974.Why don''t you just give up and die forever?!"'
