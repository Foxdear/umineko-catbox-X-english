21080: 'Jessica@r@v04/30200126."Dad.........Mom......!!@k @v04/30200127.Who would do something like this...?!!@k @v04/30200128.Waaaaaaaaaaaaaaaahhh...!!"'
21081: '@rJessica''s woeful voice echoed throughout the rose garden...'
21082: '@rPerhaps it was the intuition of a person who lived on this island.'
21083: '@r...After Jessica had looked in the rose garden where Auntie Rosa and Maria had fallen and seen nothing,@k she had gone to look in the arbor next.'
21084: '@rNormally, the arbor was probably a wonderful location to enjoy tea peacefully while appreciating the roses on a good sunny day.'
21085: '@r......Who knows, maybe even Uncle Krauss and Aunt Natsuhi...@khad their days where they relaxed and enjoyed tea together there.'
21086: '@r......In that arbor lay the bodies of Uncle Krauss and Aunt Natsuhi.'
21087: '@rAt least they weren''t drenched in the rain like Auntie Rosa and Maria had been,@k but there was no way I could say that out loud to Jessica at that moment...'
21088: 'Battler@r@v10/30101447."......What do you think, Doctor Nanjo?"'
21089: 'Nanjo@r@v19/31900067."Str-...strangulation, I believe.@k@|@y@v19/31900068. ...Take a look at this.@k@v19/31900069. On their necks, there are distinct markings that something thin was used to strangle them."'
21090: 'Battler@r@v10/30101448."Right.@k@v10/30101449. ......I doubt that these things were the primary cause of their deaths."'
21091: '@r...The two stake-like weapons decorated with an occult design that were lying on the ground...@khad been found driven into Uncle Krauss''s thigh area,@k and near Aunt Natsuhi''s calf.'
21092: '@rWhen we had found these sticking out of my parents'' forehead and chest,@k we had decided to leave them exactly as they were for the police and to preserve the crime scene,@k ......but Jessica no longer cared about such matters, and immediately pulled the stakes out of her parents'' forsaken bodies.'
21093: 'Eva@r@v05/31000894."......So we''ve found all five gouged corpses now, in the head, chest, stomach, knee, and leg."'
21094: 'Jessica@r@v04/30200129."Uuuuhhhghhhhuu, shit, shit shit!!@k @v04/30200130.I''ll frickin'' kill that murderer, kill him!!@k @v04/30200131.UwaaAAAAaaaaHHH...!!"'
21095: 'Eva@r@v05/31000895."......Everything as far as the eighth twilight is finished now.@k@v05/31000896. ...Is this going to continue onto the ninth twilight?@k @v05/31000897.......The witch revives, and none shall be left alive."'
21096: 'Jessica@r@v04/30200132."Bring it on, dammit...@k@v04/30200133. ......When it says the witch revives,@v04/30200134. ...that means the culprit''s gonna make his grand appearance, right?!"'
21097: 'Jessica@r@v04/30200135."Bullshit no one''s gonna be left alive...@k@v04/30200136. ......I''ll kill him myself...!@k @v04/30200137.I''ll make sure I kill whoever murdered Mom and Dad, with my own two hands...!!"'
21098: '@rJessica howled furiously, her emotions laid bare.@k ......To avoid being crushed by her grief, she could do nothing but resist it with anger.'
21099: 'Eva@r@v05/31000898.".........We still...haven''t found George.@k@v05/31000899. ...Jessica-chan, and the rest of you, you can stay here if you want.@k@v05/31000900. I''ll go to the mansion."'
21100: 'Nanjo@r@v19/31900070."E-Eva-san, we mustn''t split up...!!@k @v19/31900071.It is dangerous if we do not all stick together...!"'
21101: 'Eva@r@v05/31000901."There''s nothing we can do for Nii-san or his wife.@k@|@y@v05/31000902. But George may be still alive somewhere...!@k @v05/31000903.I have no time to waste here...!!"'
21102: '@rAs Auntie Eva screamed this, Jessica glared at her.'
21103: '@r...Auntie Eva had no more time to bother about the dead.@k@rShe was more concerned for the safety of her only son, who was yet to be seen.'
21104: 'Eva@r@v05/31000904."Jessica-chan, you should stay by your father and mother''s side.@k@v05/31000905. I''ll make a short trip to the mansion.@k@v05/31000906. Battler-kun and Doctor Nanjo, you two can stay here with her as well."'
21105: '@rAfter saying this and leaving no time for debate, Auntie Eva rushed out of the arbor.'
21106: '@rI called out for her to stop, but there was no way she would listen.'
21107: '@r...However, by now, being alone in this situation meant nothing short of death.'
21108: '@rIf we silently watched her leave, it would be the same as letting her die.@k@rAs long as Auntie Eva was unwilling to stop, we would have no choice but to follow her.'
21109: '@r......And, while it may be cruel to say so,@k Uncle Krauss and Aunt Natsuhi were already dead,@k so there was nothing more we could do for them...'
21110: '@rIn the end, we had no choice but to console Jessica and head for the mansion together.'
21111: '@r...Fortunately, Jessica stood up.'
21112: '@rPerhaps she had been able to draw a line under her grief for the moment.@k ......But, what had surfaced in its place was an expression like a demon.'
21113: 'Jessica@r@v04/30200138."...I''ll murder ''em with my own hands, ......I''ll avenge my parents, just you wait.........@k@|@y@v04/30200139. ......Let''s go, Battler.@k@v04/30200140. If we find whoever did this, don''t get in my way.@k@v04/30200141. I''m definitely gonna kill them...!!"'
21114: 'Battler@r@v10/30101450.".........I also have my parents to avenge.@k@v10/30101451. Sorry, but this is first come, first served."'
21115: 'Jessica@r@v04/30200142."...Yeah, ...that''s right...@k@|@y@v04/30200143. ......Let''s make mincemeat of that bastard!"'
21116: '@rAt my words, Jessica finally seemed to feel like someone had sympathized with her emotions.'
21117: '@rShe still had that dark expression, but I felt Jessica regaining some of her sanity.'
21118: '@rWe took off.@k@rChasing after Auntie Eva.'
21119: '@rThrough the rose garden,@k up the stone steps,@k running at full speed towards the mansion......whose large, intimidating shadow flashed in the lightning.'
21120: '@r......With this, the epitaph murders had finished the eighth twilight.@k@rAnd now, on the ninth twilight, the witch will revive.@k@r...None shall be left alive.'
21121: '@rI will most likely lose my life.'
21122: '@r......But at the very least, I wanted to burn the truth into my eyes.@k@rThat was the only thing motivating me to move at that moment.'
21123: '@rWe were able to reunite with Auntie Eva, who was having trouble with the lock to the front door.'
21124: '@rIt seemed that all the blood had risen to Auntie Eva''s head.@k@rThat was probably making her fingers clumsy.'
21125: '@rIt seemed she couldn''t even handle the simple task of inserting the key into the lock.'
21126: '@r...Then, there was a faint sound.'
21127: '@rThe sound of the door unlocking.@k Just as though it had waited for all of the survivors to unite before opening.'
21128: '@r......It seemed to me as though the malicious mansion...@kwas trying to swallow all of the remaining humans at once...'
21129: '@rThe stench that erupted outwards at the instant the door opened,@k ...could it really be explained as just a smell?'
21130: '@rIt wasn''t just the charred smell from Grandfather.'
21131: '@r......I think it may also have contained something like...@kregrets, held by so many dead, including our parents, and all of the servants.'
21132: '@r...What did it mean as it billowed out, overwhelming us?'
21133: '@r......Was it the cry of the dead, telling us not to enter?'
21134: '@rHowever, Auntie Eva didn''t even flinch at something like that.'
21135: '@r......And we who had to chase after her...@kwere forced to step into the mansion, despite receiving that message...'
21136: 'Eva@r@v05/31000907."George?!@k @v05/31000908.George!!@k @v05/31000909.If you can hear me, answer!@k @v05/31000910.Geoooooorge!!"'
21137: '@rAuntie Eva shouted at the top of her lungs.'
21138: '@r......Considering the situation, it''s probably far too optimistic to imagine that he''s alive.'
21139: '@rWhen we also started following Auntie Eva''s example and calling George-aniki''s name in loud voices...'
21140: '@r...Auntie Eva found something, and stopped walking.'
21141: '@rShe was standing in front of the door to the parlor.'
21142: 'Eva@r@v05/31000911.".........What is this.........?@k @|@y@v05/31000912.D-Doctor Nanjo, could you come here for a second......?"'
21143: 'Nanjo@r@v19/31900072."Wh-what is it......?"'
21144: '@rI had heard from the adults about the creepy magic circles that had been drawn on doors such as the one to the parlor.'
21145: '@r......Creepy was the only word to describe that thing,@k which had been scrawled there with a deep-red paint reminiscent of blood that slowly dripped down.'
21146: '@rHowever, that had supposedly been there since this morning.'
21147: '@r......Wondering why Auntie Eva, who had seen it already,@k would think it odd now, Jessica and I stared at the door...'
21148: 'Nanjo@r@v19/31900073."......Certainly, .........I have no memory of numbers such as these being written here."'
21149: 'Eva@r@v05/31000913."Right, they weren''t.@k@v05/31000914. ......The creepy magical text was written here, but not the numbers."'
21150: '@rFrom what the two of them said, only a magic circle had been there here this morning.'
21151: '@rHowever, right now, there were eight digits newly written in the upper part of the magic circle.'
21152: '@r07151129.'
21153: '@r...I didn''t know what it meant,@k but I didn''t even want to imagine the thought process of whoever wrote this.'
21154: '@rIt was drawn with what was probably the same paint as the magic circle,@k ...but it had clearly been written very recently.'
21155: '@rThe way it had dried and the condition of the color was completely different from the magic circle part.'
21156: 'Jessica@r@v04/30200144.".........pfeh.@k@v04/30200145. I''m sure it just has some magical meaning.@k@v04/30200146. It''s pointless to rack our brains over it."'
21157: '@rJessica intentionally spat those words out in an attempt to wipe out how creepy it was.'
21158: 'Nanjo@r@v19/31900074."It...could be a magic square.@k@v19/31900075. ......The idea that a ward against evil can reside in a certain form of number play.@k@|@y@v19/31900076. I am sure you have all heard of the one where adding all of the numbers in each row leads to the same sum..."'
21159: 'Eva@r@v05/31000915."Wasn''t that a group of numbers filled inside a square?@k @v05/31000916.This is just a single row.@k@v05/31000917. I don''t have a clue what it could mean."'
21160: 'Eva@r@v05/31000918."......What Jessica-chan said is probably correct.@k@v05/31000919. There isn''t any point in us thinking about it deeply..."'
21161: '@rEven though she said that, she probably suspected that it might actually mean something.'
21162: '@rUsing an old receipt or something from inside her pocket,@k Auntie Eva deftly wrote that number down with a short ballpoint pen.'
21163: '@rBecause an eight-digit number would probably be a little difficult to memorize, unless it had some kind of pattern.'
21164: '@r..................................'
21165: 'Battler@r@v10/30101452."......Couldn''t...@v10/30101453....this be a date,@v10/30101454. ......or something?"'
21166: 'Eva@r@v05/31000920."A date...?@k @v05/31000921.What are you talking about...?"'
21167: 'Battler@r@v10/30101455."Well, ...it''s probably a coincidence,@k@v10/30101456. but my birthday...@|@y@v10/30101457.is July 15th.@k@v10/30101458. ...Once I thought that 0715 might refer to July 15th,@k@v10/30101459. I figured that if 1129 stood for November 29th, maybe that''d fit perfectly..."'
21168: 'Jessica@r@v04/30200147."............Why would your birthday be written in a place like this?@k@v04/30200148. And what''s up with November 29th...?"'
21169: 'Battler@r@v10/30101460."That''s what I wanna know...@k@v10/30101461. Still, ...it''s probably just a coincidence.@k@v10/30101462. When I thought about it, it started to feel a little creepy."'
21170: 'Battler@r@v10/30101463."......Is November 29th someone''s birthday or something?@k @v10/30101464.It''s not anyone in my family, not Dad or Kyrie-san or Ange.@k@v10/30101465. And of course, not my mom either."'
21171: 'Nanjo@r@v19/31900077."I cannot think of anything...@k@v19/31900078. ...I don''t believe it is Kinzo-san''s or Genji-san''s birthday."'
21172: 'Eva@r@v05/31000922."It isn''t from my family either.@k@v05/31000923. And it isn''t Rosa''s or Maria-chan''s."'
21173: 'Jessica@r@v04/30200149."It''s not anyone in mine, either...@k@v04/30200150. And it isn''t Kanon-kun''s or Shannon''s."'
21174: 'Jessica@r@v04/30200151."......I always give the servants presents on their birthdays, so I know it for all of them,@k@v04/30200152. but I don''t know anyone who was born on November 29th..."'
21175: '@rOnce we started imagining that the eight digits, which we had thought were meaningless,@k were actually two dates written together, it really started to look that way.'
21176: '@r......However, its true meaning may be something completely different, or there may be no meaning at all.'
21177: '@rAnyway, since we don''t have any real clue, it''s probably pointless to stand around here analyzing it.'
21178: '@r......More important was the inside of the parlor.'
21179: '@rThis morning, behind each of the doors with a magic circle drawn on them, there had been the body of a victim.'
21180: '@r...And now that a number had been newly added to the door, what new thing had been added inside the parlor?'
21181: '@rWhen Auntie Eva tried to open it, she felt the resistance of the lock.@k@rShe immediately took out a master key, and put it in the keyhole.'
21182: '@rAs soon as she opened the door, ......Auntie Eva let out a high-pitched scream and ran inside.'
21183: '@rThat alone was enough to tell us what had happened inside the room...'
21184: '@rDoctor Nanjo and I looked at each other, and I shook my head slightly as we entered the parlor...'
21185: 'Eva@r@v05/31000924."George!!@|@y@k @v05/31000925.Geooooorge!!@|@y@k @v05/31000926.Speak to me...!!@k @v05/31000927.Geoooooooooorge!!@k @v05/31000928.Doctor Nanjo, quickly!!"'
21186: '@rGeorge-aniki had fallen alongside Shannon-chan''s body.'
21187: '@rHis chest was stained bright red.'
21188: '@rAnd from his still-opened eyes,@k ...all my condolences to Auntie Eva,@k@|@y ......but I couldn''t pick up any signs of life.'
21189: '@rAfter moving to take his pulse,@k@|@y ...Doctor Nanjo shook his head, wordlessly reporting that George-aniki was dead.'
21190: '@rBrushing him aside, Auntie Eva once again crouched beside George-aniki,@k and started crying at the top of her lungs...'
21191: '@rWith this, ...Aniki''s death, one thing had become certain.'
21192: '@rThe murders would not be ending at the eighth twilight.'
21193: '@rThe epitaph was going to be carried out in its complete form, including the ninth twilight, "and none will be left alive"...'
21194: '@rI''m really starting to lose the plot.'
21195: '@r...For some reason, Auntie Eva''s half-insane cries and appearance actually made me cool down...'
21196: '@r...Crestfallen and exhausted, I flopped onto the sofa,@k and plunked my feet on top of the table.'
21197: '@rMaybe all of these murders have paralyzed my heart.@k ......Instead of fright, the stronger emotion I''m feeling is one of complete confusion.'
21198: '@rDad and Kyrie-san have died, and starting with the servants, people have been killed off one by one.@k ...And at one hell of a pace, too.'
21199: '@rI don''t know what time the first murders started,@k ...but I''d say we''re probably being killed at a rate of about one person an hour.'
21200: '@rWe believe that the boat will come for us around nine tomorrow.@k ......There''s still a full twelve hours until then.'
21201: '@r...How many more sacrifices to the witch would there have to be for us to survive...?'
21202: '@rWith the four of us, if one goes each hour, ...we won''t last any longer than four hours.@k It''s not clear anymore if we''ll even last until midnight tonight...'
21203: '@r......Yesterday, after lunch, we came into this parlor.'
21204: '@rAt about the time that the discussion had turned to the black tea that Auntie Rosa said she bought,@k we kids had started talking about going to take a walk.'
21205: '@r......Maria was fooling around.'
21206: '@r...Didn''t Shannon-chan bring us some cookies?'
21207: '@rShe said that Kumasawa-san had baked them, or something.'
21208: '@r......I''d probably have laughed my ass off if there had actually been a cooked mackerel one mixed in with them.'
21209: '@r............That''s right, I''ll never hear Kumasawa baa-chan''s mackerel jokes again, will I...'
21210: '@r...Oh yeah, if I only remember stuff about Kumasawa baa-chan, that wouldn''t be fair to everyone else...'
21211: '@r.........Why did Dad and Kyrie-san...even go outside?'
21212: '@rIt''s not like we''d die from being without food for a day.'
21213: '@r...So why did gluttony get ahold of them and make them go to get food?'
21214: '@r......I''ll bet it was my fearless dad who started complaining about being hungry...'
21215: '@rKyrie-san, you were supposed to be the brakes for my reckless dad...@k Why didn''t you stop him?'
21216: '@r.........And what about your daughter Ange...?'
21217: '@r...She''s only six years old.@k@rYou weren''t thinking of entrusting her to me, were you...?'
21218: '@rAt this point, it''s doubtful that even I will be able to leave this island alive.........'
21219: 'Nanjo@r@v19/31900079."St-stop this...!!@k @v19/31900080.Why are you fighting at a time such as this...?!@|@y@k @v19/31900081.Jessica-san, stop...!!"@|@y'
21220: '@r......Some kind of commotion was interrupting my thoughts.'
21221: '@rI looked up to see what it was, and saw that Jessica and Auntie Eva had started fighting each other at some point.'
21222: '@r......No, maybe I should say that Jessica was grabbing at Auntie Eva.'
21223: 'Jessica@r@v04/30200153."......You killed my mom and dad!!@k @v04/30200154.There''s no other explanation!!"'
21224: 'Eva@r@v05/31000929."Don''t be stupid!!@k @v05/31000930.How would I know anything about what happened to your parents?!"'
21225: 'Jessica@r@v04/30200155."Who was downstairs in the guesthouse?!@k @v04/30200156.You were!!@k @v04/30200157.Mom and Dad were in the downstairs lobby, along with YOU!@k @v04/30200158.Who was left alive?!@k @v04/30200159.Only YOU!!@k @v04/30200160.Why?"'
21226: 'Jessica@r@v04/30200161."Because you''re the fucking murderer, that''s why goddammit!!@|@y@k @v04/30200162.You killed Mom and Dad, carried them outside, and then shamelessly locked the door,@k@v04/30200163. trying to make it seem like it was the frickin'' witch''s doing...!!"'
21227: 'Eva@r@v05/31000931."Then why did George go missing?!@|@y@k @v05/31000932.He didn''t come downstairs, you know?!@k @v05/31000933.So did he disappear from upstairs?!"'
21228: 'Eva@r@v05/31000934."Who was upstairs?!@k @v05/31000935.It was you people who were up there!!@|@y@k @v05/31000936.You knew, didn''t you?!@k @v05/31000937.You knew that George slipped out of the guesthouse!!@k @v05/31000938.You brazenly made a face as if you didn''t know anything!!@k @v05/31000939.If you had stopped George, he would, ......he would...!!!"'
21229: 'Nanjo@r@v19/31900082."I am telling you to stop...!@k @v19/31900083.Jessica-san was in the cousins'' room the whole time!@k @v19/31900084.And Eva-san was also in the downstairs lobby the whole time!@k @v19/31900085.And neither of you are responsible for anything!@k @v19/31900086.This is only the sadness of losing your family...!!"'
21230: 'Nanjo@r@v19/31900087."The culprit is no one, is nowhere...!!@k @v19/31900088.It is all.........just the witch''s fault, that is all!!@k @v19/31900089.So you two, please, stop hating one another...!!"'
21231: '@r......The witch''s fault, is it...@k@rI wonder if that''s a good way to mediate things for now.'
21232: '@rYes, ...I finally understand the meaning of all of the doors and windows having been locked from the inside when three whole people evaporated from the guesthouse...'
21233: '@rThis is what they were after.'
21234: '@r......Making us think the culprit was inside, ...and causing this ugly mutual hatred...@k....had to be the culprit''s......the witch''s goal.'
21235: '@r............But in that case, how had the culprit locked it from the outside...?'
21236: '@rIt''s certainly true that the master key had been stolen when Dad''s group was attacked.'
21237: '@r...But the doors and windows to the guesthouse...@khad been constructed so that you couldn''t lock them from the outside no matter how hard you tried.'
21238: '@rSo that master key shouldn''t mean anything for the guesthouse locked room...'
21239: '@r......Jessica and Auntie Eva were turning their sadness at losing their blood relatives into anger at the person in front of them.'
21240: '@rDoctor Nanjo was trying to step between them.'
21241: '@r......And I sat haphazardly in a sofa staring up at the ceiling,@k ......thinking about things that didn''t even matter anymore with a worn-out expression.'
21242: '@r............I just couldn''t believe that this was the same parlor that had been so warm and pleasant midday yesterday,@k ...for just a short time before the typhoon hit......'
21243: 'Jessica@r@v04/30200164."GYAAAAaAAaaAAAaaaAAA......@|@y@k@|@y@v04/30200165.uWAAAAuuughhaAAAAUUUUgghhhhh...!!"@|@y'
21244: '@rThe sudden sound of a gunshot shook me out of my half-asleep trance.'
21245: '@r...Smoke was rising out of the barrel of the gun Auntie Eva held.'
21246: '@rJessica was rolling around on the floor, covering both her eyes.'
21247: '@rAuntie Eva and Doctor Nanjo were looking down at her, shocked...'
21248: 'Nanjo@r@v19/31900090."A-are you alright, Jessica-san...?!@k @v19/31900091.Jessica-san...!!"'
21249: 'Jessica@r@v04/30200166."UuuAaaaAAAaaaaHHHaHHHhhh,@v04/30200167. oww, owwww, ow...@|@y@v04/30200168.uuuaaaaaaaaaaaaaaaaaggghhh...!"'
21250: 'Eva@r@v05/31000940."I-......it isn''t my fault...@k@v05/31000941. Th-......this happened because you came at me even after I told you to stop...!"'
21251: 'Battler@r@v10/30101466."H-...hey, hey, what the hell happened, what''s going on...?!"'
21252: '@rJessica had grabbed at Auntie Eva, and it had turned into a scuffle...'
21253: '@rThey had then...started fighting over the gun Auntie Eva had been holding?'
21254: '@rAnd some movement or other caused the trigger to be pulled...?'
21255: '@rI didn''t know the details, about whether the bullet had grazed her, or whether she had been burned by the discharge,@k but whatever the case, Jessica was covering both of her eyes, screaming in pain, and rolling around on the floor.'
21256: 'Nanjo@r@v19/31900092."......It''s alright, calm down...!@k @v19/31900093.It is not a serious wound, so get ahold of yourself...!"'
21257: 'Jessica@r@v04/30200169."My eyes hurt, it hurts...@v04/30200170. ...I can''t see,@v04/30200171. ...I can''t see......!!"'
21258: '@rDoctor Nanjo lent Jessica his shoulder, saying that he would tend to her in the servant room.'
21259: '@r......The servant room in this mansion apparently had a bed and a first aid kit, and was able to function as an infirmary.'
21260: 'Jessica@r@v04/30200172."Damn iiiiiit!!@k @v04/30200173.You killed Mom and Dad!!@k @v04/30200174.I''ll kill you... I''ll kill you......!!"'
21261: 'Eva@r@v05/31000942."I-......it wasn''t me... It wasn''t me......!!"'
21262: 'Nanjo@r@v19/31900094."Jessica-san, you are aggravating the wound, so please, stop struggling...!@k @v19/31900095.Come, let us go to the servant room..."'
21263: '@rJessica still continued to curse Auntie Eva as her parents'' murderer.@k@rIt seemed that Auntie Eva couldn''t conceal her shock at the fact that she had pulled the trigger, even if it had been an accident.'
21264: 'Eva@r@v05/31000943."...It wasn''t my fault... That kid jumped at me, that''s why this happened......@k@v05/31000944. ......I didn''t kill anyone..."'
21265: 'Eva@r@v05/31000945."......No, forget that... Who killed George?@k @v05/31000946.That''s right, who killed George?!!@k @v05/31000947.George, Geooooooooooorge!!@k @v05/31000948.It isn''t my fault, it isn''t my fault...!!"'
21266: 'Battler@r@v10/30101467."W-wait a sec, Auntie Eva...!!@k @v10/30101468.Don''t go off on your own!!"'
21267: '@rI didn''t know whether it was because Auntie Eva couldn''t stand her mistake,@k or whether it was because she had lost herself to anger at the person who had killed her only son,@k ...or whether it was both of those all mixed together.'
21268: '@r...In any case, she ran out into the corridor, yelling, fearful, and shouting.'
21269: '@rI was also worried about Jessica''s condition, but anyway, right then, I couldn''t leave Auntie Eva alone.'
21270: '@rWhy would she go off on her own in this mansion, of all places? Is she suicidal...?!'
21271: '@rDoctor Nanjo took Jessica towards the servant room.'
21272: '@r...I chased after Auntie Eva, dashing into the depths of the mansion......'
21273: '@rAfter sitting Jessica on the servant room bed,@k Nanjo told her several times not to rub her eyes, and examined the affected area.'
21274: '@rThe barrel had probably been near her eyes.@k@rThere was a possibility that the flames from the discharge had damaged her corneas.'
21275: '@r...There was no threat to her life, but it would probably be necessary to have a suitable doctor look at her as soon as humanly possible.'
21276: '@rNanjo applied emergency first aid, covering the affected area with gauze and wrapping it with a bandage.@k As a result, Jessica completely lost her field of vision...'
21277: 'Nanjo@r@v19/31900096."Now, pay attention...@k @v19/31900097.This wound may hurt or itch, but you must not scratch at it or rub it.@k@v19/31900098. When tomorrow comes, let us go to an ophthalmologist as soon as possible."'
21278: 'Jessica@r@v04/30200175."......That bitch, ...she really was trying to kill me...@k@v04/30200176. If the angle had been just a little bit off, I''d have been killed by now...@k@v04/30200177. I''ll definitely turn her in to the police......!"'
21279: 'Nanjo@r@v19/31900099."...Eva-san would not do such a thing.@k@v19/31900100. That was an accident."'
21280: 'Jessica@r@v04/30200178."Accident my ass...!@|@y@k @v04/30200179.She killed Mom and Dad.@k@v04/30200180. There''s no way any 19th person or witch exists on this island...!!@k @v04/30200181.She''s behind everything.@k@v04/30200182. She was the only one on the first floor of the guesthouse!"'
21281: 'Jessica@r@v04/30200183."George nii-san must have seen her kill Mom and Dad, and she killed him to keep him silent!!@k @v04/30200184.It''s the same with Grandfather and the servants.@k@v04/30200185. I''m sure she snuck out of the family conference last night and killed all of them...!!"'
21282: 'Nanjo@r@v19/31900101."......I-if that is the case, then we will know as soon as the police investigate."'
21283: 'Nanjo@r@v19/31900102."The police are incredible, you know—there is nothing that cannot be understood by a forensic investigator.@k@v19/31900103. ......There is no need for us to suspect or hate anyone.@k@v19/31900104. The police will resolve everything."'
21284: 'Nanjo@r@v19/31900105."So for now, Jessica-san, you should concentrate on resting your body and making things easy on your eyes.@k@v19/31900106. ...If you wrinkle your forehead too much, it will do no good for your eyes, of course, and nothing for your looks either."'
21285: '@rIndeed, when Jessica had grown agitated in her verbal abuse of Eva,@k she had naturally started glaring, and the pressure on her eyes hurt her.'
21286: '@rJessica herself soon realized that the more she talked, the more the wound would hurt,@k and regardless of whether she had overcome her suspicions of Eva, she regained her composure for the time being...'
21287: 'Jessica@r@v04/30200186."......She killed them...@k@v04/30200187. ......Mom and Dad.@k@v04/30200188. ......And Shannon,@v04/30200189. .........and Kanon-kun...@k@v04/30200190. ............Kanon-kun........."'
21288: '@rShe had heard that Kanon had been killed in the chapel.@k@r...Jessica still hadn''t seen his face after he had died.'
21289: '@rJessica was now less fearful about the fact that she might go blind,@k and more frightened that the police would carry Kanon''s corpse away while she still couldn''t see,@k and that she would have to say her final farewell without being able to see his face.'
21290: '@rHer anger at the culprit, and her sadness at the death of the person she had liked.@k@r...Those mixed emotions provoked her tear ducts.'
21291: '@rBut right now, tears were actually painful for her,@k so she wasn''t even permitted to leisurely remember the late Kanon''s face...'
21292: '@rJessica could do nothing but sit on the bed and let her head droop, withstanding the pain...'
21293: 'Nanjo@r@v19/31900107."..................@k@v19/31900108. ...Well, now it is Eva-san I must be concerned for.@k@v19/31900109. I hope she isn''t too shaken by this."'
21294: '@rLetting out a small sigh of relief that Jessica had calmed down for the time being,@k he stuck his head out into the hallway to look for any sign of the others coming back.'
21295: 'Nanjo@r@v19/31900110."..............."'
21296: '@rThey...met eyes.@k@rNanjo, unable to understand who this person was, was bewildered for an instant.'
21297: 'EVA@r@v34/33300720."I hear that people who have lost the power of sight have zero anti-magic power and zero magic resistance.@k@|@y@v34/33300721. In other words, you''re an isolated pawn right now.@k@v34/33300722. Understand what that meeeans?"'
21298: 'Nanjo@r@v19/31900111."......Wh-......what did you say......?"'
21299: '@rThere was no possible way that Nanjo could have understood who the person in front of him was.@k ...And there was certainly no possible way that he could ever have understood what she had just said.'
21300: 'Jessica@r@v04/30200191.".........Doctor Nanjo?@k @v04/30200192.What''s going on......?"'
21301: '@rUnable to see, Jessica couldn''t tell what was going on except by whatever voice she heard.@k@r...But since she had heard Nanjo say something with an uneasy tone,@k she tightened up, thinking that something bad might have happened.'
21302: 'Nanjo@r@v19/31900112."S-......stop, please......!@k @v19/31900113.Please don''t kill me...!!@k @v19/31900114.I have a sick grandchild...!@k @v19/31900115.I can''t die here...!@k @v19/31900116.For mercy''s sake, spare me...!!@k @v19/31900117.HIIIii!!!"'
21303: 'Jessica@r@v04/30200193."...Doctor Nanjo...?@k @v04/30200194.Doctor Nanjo?!"'
21304: '@rJessica couldn''t do anything except call out from the bed.@k@r...Judging by the tone of his voice, Nanjo was in the corridor, being confronted by someone.'
21305: '@rAnd he was scared.@k There was no doubt that at this very moment, his life was being threatened.'
21306: 'Nanjo@r@v19/31900118."No, don''t!!@k @v19/31900119.HiiiIIIIiIIIII!!!"'
21307: 'EVA@r@v34/33300723."On the ninth twilight, the witch revives, and none shall be left alive.@k@|@y@v34/33300724. Kuhhihihihihihihihihihihihihihi!!"'
21308: '@rThe witch pointed the end of her gold staff at Nanjo.'
21309: '@r...Even though he didn''t know what she was planning to do,@k Nanjo imagined that she must be trying to take his life.'
21310: 'Jessica@r@v04/30200195."Doctor Nanjo!!@|@y@k @v04/30200196.Doctor Nanjo!!@|@y@k @v04/30200197.Who''s out there?!@k @v04/30200198.Answer me!!"'
21311: 'Nanjo@r@v19/31900120."Please, nooooOoOOOo, ahiiieeeEAAHHHhhh!!"'
21312: '@rBang!@k A sharp sound echoed.'
21313: '@rAnd tapered to a point just as sharp, the elongated tip of the golden staff was stuck straight into Nanjo''s forehead...'
21314: '@rJessica, who only had her ears to help her try to grasp what was happening, had no clue what was going on.'
21315: '@r...But even so, she was able to realize that with that sound, Nanjo had died.'
21316: '@rAnd the person who had killed him was now in the corridor, right in front of the servant room.@k@r...Furthermore, since she couldn''t see, she wouldn''t even be able to run away, much less resist.'
21317: '@r...Upon discovering that she was in a life-or-death situation, caught like a rat in a trap, Jessica felt her blood run cold...'
21318: 'EVA@r@v34/33300725."......Oh, Jessica.@k@v34/33300726. Poor girl, you injured your eyes.@k@v34/33300727. ...In that case, you can''t even escape, can you?@k@v34/33300728. *giggle*giggle*giggle*.@k@v34/33300729. ...I''m gonna play a whole lot with Nanjo''s corpse now.@k@v34/33300730. ...When I get bored of that, I''ll kill you next and play a bunch more."'
21319: 'EVA@r@v34/33300731."......No, wait, it''s not every day that you get blinded, right?@k@v34/33300732. ......I won''t wait until I kill you.@k@v34/33300733. I''ll play with you a bunch before I kill you too.@k@v34/33300734. ...Kuhhihyahyahyahya...!!@|@y@k @v34/33300735.So wait there shaking for a while, okay?@k @v34/33300736.As you try to imagine all the ways I''m playing with Nanjo''s corpse!!"'
21320: 'Jessica@r@v04/30200199."H-...hiiiiiiiiiiiiii!!!"@|@y'
21321: '@rStruck with fear, Jessica let out a frail scream.'
21322: '@r......She really wanted to scream in a much louder voice, trying to get someone to help her.'
21323: '@rBut she couldn''t.'
21324: '@rWhen a person is faced with true fear, it clogs up their throat...'
21325: '@rRight now, Jessica could barely even breathe.'
21326: 'Jessica@r@v04/30200200."H-@v04/30200201.......help...@v04/30200202. ......Help.........!!@k @v04/30200203.HiIIiiIiiIIi!!"@|@y'
21327: '@rShe searched around with her hands, trying to find some way to escape.@k But even though she knew this room well, just being unable to see made it like a locked room of darkness.'
21328: '@rShe bumped into some shelves or something, and some tins of sweets and bottles and things fell down from them, hitting her on the head.@|@y'
21329: '@r...As she was now, even protecting her head to block them wasn''t working out.'
21330: '@r...She was becoming painfully aware of how very powerless humans become just by losing their sense of sight.@k@rOf course, she had no time to appreciate that.'
21331: '@rShe crawled around, as best as she could, trying to escape that place,@k but she kept bumping into things that she didn''t understand, getting hit by various falling objects,@k and it felt to her like the entire room was alive, bullying her and refusing to let her escape.'
21332: '@rThen, she heard footsteps from the presence in the hallway.@k@rAnd then a voice.'
21333: '@r......The person had probably peered into the room since Jessica was making so much noise.'
21334: 'EVA@r@v34/33300737."What a racket you''re making.@k@v34/33300738. Sit on the bed and wait quietly like a lady.@k@v34/33300739. ''Cause I''ll give you a wonderful blood-red death costume fitting for a lady of class.@k@v34/33300740. ......Something good enough to make the person who finds you faint, okay?@k @|@y@v34/33300741.Gehheheheheheheheheheh!!"'
21335: 'Jessica@r@v04/30200204."Hii...hiiIIiiIIIIiiiiiiIIIi!!"@|@y'
21336: '@rJust a short while ago, she had sworn that she would kill the culprit if she found them.'
21337: '@r...However, she was now all too powerless.'
21338: '@rShe couldn''t do anything except let out feeble screams and crawl around on the floor, bumping her head into the bed and the legs of desks.'
21339: 'Jessica@r@v04/30200205."Help... Help......!@k @v04/30200206.Someone, help......!!@k @v04/30200207.Dad, ......Mom...!@k @v04/30200208.Battleeeer......!@k @v04/30200209.Someone, coooooooome...!!@k @v04/30200210..........Help me, ......Kanon-kun.........!!"'
21340: '@rIn the corridor, as the witch thought of how to toy with Nanjo''s life...'
21341: '@r......a single gold butterfly secretly watched that scene from the corner of the hallway.'
21342: '@r...It was Beato, who had barely escaped with her life once before.'
21343: '@rThe gold butterfly softly returned to human form.@k ...Its form was faint and transparent like a lace curtain.'
21344: '@rEven just the power to hold a human form had become scarce for her.'
21345: '@rRight next to her, Ronove also appeared.'
21346: 'Ronove@r@v31/33100571."......Jessica will probably be unable to survive.@k@v31/33100572. ...Although, no one was to be left alive since the beginning."'
21347: 'BEATRICE@r@v27/30701940."..................She has grown feelings of love for Kanon.@k@v27/30701941. ......I have even toyed with that at times.@k@v27/30701942. ............However, I know that now to be something shameful for a witch."'
21348: 'Ronove@r@v31/33100573."......Love is the single element.@k@v31/33100574. Romantic love is even more pure, more sacred.@k@v31/33100575. ...Though, for some reason, you hate it very much, Milady."'
21349: 'BEATRICE@r@v27/30701943.".................................@k@|@y@v27/30701944. ......Master told me.@k@v27/30701945. ...Magic exists to bring people happiness.@k@v27/30701946. ...I''m sure that I knew that once."'
21350: 'BEATRICE@r@v27/30701947."......And from the moment I forgot that, I was no longer a witch.@k@v27/30701948. ......So I...lost the qualifications to be Battler''s opponent..."'
21351: 'Ronove@r@v31/33100576.".........Milady, I hesitate to ask, but...@k@v31/33100577....surely you do not intend to rescue Jessica?@k@v31/33100578. That would be dangerous."'
21352: 'BEATRICE@r@v27/30701949."I understand...@k@v27/30701950. Even if I save her, she will become a plaything of the witch''s banquet when the door to the Golden Land opens."'
21353: 'BEATRICE@r@v27/30701951."......But even so, ...that would be much more compassionate than the way that person would kill her.@k@v27/30701952. ...The witch''s banquet steals lives in a terrible way, but it does not do so more than once.@k@v27/30701953. It does not toy with life and death."'
21354: 'BEATRICE@r@v27/30701954."...However, she is different.@k@v27/30701955. She kills over and over.@k@v27/30701956. She kills for fun!@k @v27/30701957.There is not even a trace of compassion there.@k@v27/30701958. .........I want to at least save Jessica from that kind of cruel fate."'
21355: 'Ronove@r@v31/33100579."......Certainly, by carrying that out, you would probably be praised as a good witch."'
21356: 'Ronove@r@v31/33100580."......However, the new BEATRICE-sama already views you as hostile, Milady.@k@v31/33100581. ...If you were to be seen by her again, ......you are aware, you would have no way to escape this time?"'
21357: 'BEATRICE@r@v27/30701959.".......................................@k@v27/30701960. ......When I reunited George with Shannon,@k@v27/30701961. .........I finally understood what a witch is,@k@v27/30701962. and what magic is."'
21358: 'BEATRICE@r@v27/30701963.".........I am a witch.@k@v27/30701964. I must be a witch.@k@v27/30701965. And I must be acknowledged by Battler as his opponent, ......and I must make him accept me as a witch this time at last."'
21359: 'BEATRICE@r@v27/30701966."......The road to that goal may be long and difficult.@k@v27/30701967. ...However, if I do not take a step forward here and now, ......I cannot call myself a witch."'
21360: 'Ronove@r@v31/33100582."I understand your feelings, but how do you plan to rescue her?@k @v31/33100583.There are not many forms of magic that your body is capable of now, Milady.@k@v31/33100584. Did you not have to borrow George''s power even back when you revived Shannon?"'
21361: 'BEATRICE@r@v27/30701968."......Mm.@k@v27/30701969. ...And for that very reason, I may be able to save Jessica at least."'
21362: 'BEATRICE@r@v27/30701970."......Right now, she is begging for Kanon to save her.@k@v27/30701971. ......If I can borrow the power of that emotion, I may be able to knock on the doors of Hades once again with my magical power."'
21363: 'Ronove@r@v31/33100585."I am sure you would be able.@k@v31/33100586. However, you would use up all of your magical power.@k@v31/33100587. ......If you were to be spotted by the new BEATRICE-sama, you would truly be without a method of escape."'
21364: 'Ronove@r@v31/33100588."...I am no longer your butler, Milady.@k@v31/33100589. ......Understand that I cannot assist you if the situation worsens."'
21365: 'BEATRICE@r@v27/30701972."...I know.@k@v27/30701973. .........By now, I have toyed with and taken more lives than I can count.@k@v27/30701974. ...So I may not be able to compensate for that sin except by saving the same number of lives."'
21366: 'BEATRICE@r@v27/30701975."......I have nothing to lose in the first place.@k@v27/30701976. ...I am just a golden butterfly who has passed its name and magic power on, and who is no longer accepted as a witch."'
21367: 'Ronove@r@v31/33100590.".........What about Battler-sama?@k@v31/33100591. You are part-way through a game with him.@k@v31/33100592. He has said that he would wait until you returned, Milady."'
21368: 'Ronove@r@v31/33100593."...Is it alright for you to expire here?@k@v31/33100594. ...You have a duty to return to the seat across from Battler-sama, Milady."'
21369: 'BEATRICE@r@v27/30701977."For that very reason...!@k @v27/30701978.If there is a life that only I can save, I choose to save it."'
21370: 'BEATRICE@r@v27/30701979."And I will be accepted as a witch.@k@v27/30701980. ......I must be a witch...!@k @v27/30701981.If this is a test, it is a very childish one, unfitting for the evils I have committed until now."'
21371: 'BEATRICE@r@v27/30701982."......Go, hide yourself, Ronove.@k@v27/30701983. Watch what may be the final magic of a single butterfly who used to be called a Golden Witch...!"'
21372: 'Ronove@r@v31/33100595."......Certainly.@k@v31/33100596. ......Please show me magic...@k@v31/33100597....that will not disgrace the name of the Golden Witch.@k@|@y@v31/33100598. ......I pray that it will not be your last."'
21373: 'BEATRICE@r@v27/30701984."Go, my friend.@k@v27/30701985. ...If there is enough ink, pen the story of my foolish life, and hand it to some fool attempting to walk the same path.@k@|@y@v27/30701986. Farewell, Ronove...!"'
21374: 'Jessica@r@v04/30200211."Kanon-kun,@v04/30200212. ......where are you...@v04/30200213.where are you......@k@v04/30200214. ...Help me,@v04/30200215. ......help me...@v04/30200216. ...uuuu...u...uuuu..."'
21375: 'Kanon@r@v16/30600061..........Milady.@k@r@v16/30600062. I am always...waiting by your side.'
21376: 'Jessica@r@v04/30200217."K-......Kanon-kun......?@k @v04/30200218.Kanon-kun......?!"'
21377: '@rJessica thought that she had just heard Kanon''s voice.@k She looked around with unseeing eyes, but of course, there was no way for her to see anything.'
21378: '@r...On the contrary, that action caused her head to hit the desk again.'
21379: 'Jessica@r@v04/30200219."......Kanon-kun, .........Kanon-kun......@k@v04/30200220. ...Help me, .........help me........."'
21380: 'Kanon@r@v16/30600063.Yes, Milady.@k@v16/30600064. ...I will...help you.'
21381: 'Jessica@r@v04/30200221."K-......Kanon-kun...?!@k @v04/30200222.Y-you were alive...?!"'
21382: '@rThis time, she thought that she had heard his voice clearly.@k@rJessica jumped up in surprise, banging her head against the desk once again.@|@y'
21383: 'Kanon@r@v16/30600065.......Milady, please calm your heart and listen.@k@r@v16/30600066....Unfortunately, I am not alive.'
21384: 'Jessica@r@v04/30200223.".........Huh......?"'
21385: 'Kanon@r@v16/30600067.I have already...died.@k@r@v16/30600068.......However, ...that witch came to me to tell me of your peril.'
21386: 'Kanon@r@v16/30600069....Then, she gave me only a short period of time to help you, Milady.'
21387: 'Kanon@r@v16/30600070.Please, calm your heart even more.@k@r@v16/30600071.If you do, ......my form will become visible even to you, Milady...'
21388: '@rJessica obeyed those words.@k@rShe chased all idle thoughts from her head, and relaxed her breathing.'
21389: '@r......Her heart actually felt like it was going to explode after hearing the voice of the loved one she thought was dead.'
21390: '@rShe resisted that with all of her strength.'
21391: '@r......When she did, ......she could feel that Kanon-kun really was right in front of her.'
21392: '@r......Even though she was unable to see, ......somehow, she was still able to sense him clearly.'
21393: 'Kanon@r@v16/30600072."......Can you...see me?@k@v16/30600073. Milady..."'
21394: 'Jessica@r@v04/30200224."Yeah...@k@v04/30200225. I can see, ......I can definitely see you, Kanon-kun..."'
21395: 'Kanon@r@v16/30600074.".........I exist only as a spirit.@k@v16/30600075. So I cannot touch you, Milady.@k@v16/30600076. I cannot do anything except talk to you like this.@k@v16/30600077. ......I am a weak existence which can do nothing more than that, ...but I should be able to be of some aid to you, Milady."'
21396: 'Jessica@r@v04/30200226."......Just words, ......that''s all......?@k @v04/30200227.I can''t......touch you, Kanon-kun......?"'
21397: 'Kanon@r@v16/30600078."I am now even more fragile than smoke from a candle.@k@v16/30600079. ...So much so, that if one of the living such as you were to touch me, I would be wiped away instantly.@k@v16/30600080. ......So please, don''t try to touch me.@k@v16/30600081. ...Because I am also......holding back my desire......to touch you, Milady."'
21398: 'Jessica@r@v04/30200228."Ah, .........y-...yeah..."'
21399: 'Kanon@r@v16/30600082."More importantly, Milady.@k@v16/30600083. ......Please listen well.@k@v16/30600084. .........The new Golden Witch is the owner of a cruel heart.@k@v16/30600085. ...She will surely try to make you meet with a horrible end.@k@v16/30600086. ......You must escape from this room and hide."'
21400: 'Jessica@r@v04/30200229."H-...how...?@k@v04/30200230. I can''t...see anything......!"'
21401: 'Kanon@r@v16/30600087."Quiet...@k@v16/30600088. ......I will be your eyes, Milady.@k@v16/30600089. Please move in accordance with my instructions.@k@v16/30600090. ......First, please crawl three steps from there, and then stand up.@k@v16/30600091. You are currently under the desk, Milady.@k@v16/30600092. If you stand there, you''ll hit your head."'
21402: 'Jessica@r@v04/30200231."...Th-that was under the desk...?@k@v04/30200232. I got it... One, two, three...@k@v04/30200233. ...Standing up..."'
21403: 'Kanon@r@v16/30600093."Well done......@k@v16/30600094. Next, please turn towards nine o''clock.@k@v16/30600095. .........Yes, well done."'
21404: 'Jessica@r@v04/30200234."Ha, ......haha...@k@v04/30200235. This is pretty...embarrassing...@k@v04/30200236. ......Ah, ...ack, ...owowow..."'
21405: 'Kanon@r@v16/30600096."Are you alright? Does your wound hurt...?"'
21406: 'Jessica@r@v04/30200237."N-No, ...I''m fine...@k@v04/30200238. What next......?"'
21407: '@rJessica thought that if this was a dream, she didn''t want to wake up.@k@r...And, if she were allowed to, she would have wanted to take off the bandage covering her eyes and see him.'
21408: '@r...However, if she did that, surely Kanon would vanish like frail candle smoke, just like he himself had said...@k ......She was afraid of that.'
21409: '@rSo she satisfied herself with just being able to hear his words once more,@k repressing her desire to see him, to hold him.'
21410: '@rSo what hurt her eyes now were tears of gratitude.@k@r......Tears of gratitude for the god, ...or else witch, who had given her this miraculous moment.'
21411: 'Jessica@r@v04/30200239."...Is this okay...?@k @v04/30200240.If we keep talking like this, won''t we be noticed by her?@k @v04/30200241.Won''t our voices be heard...?"'
21412: 'Kanon@r@v16/30600097."......I have erected a stealth barrier.@k@v16/30600098. If you don''t make any loud noises or speak noisily, no one will notice.@k@v16/30600099. ......That is why no one can notice my presence."'
21413: 'Jessica@r@v04/30200242."...I, ...I don''t really get it, ...but anyway, we''ll be okay as long as we stay quiet, right...?@k@v04/30200243. ......Wh-what should I do next...?"'
21414: 'Kanon@r@v16/30600100."Please walk ten steps, slowly, in the direction you''re facing.@k@v16/30600101. You will touch the sofa.@k@v16/30600102. Please continue along that.@k@v16/30600103. ......Do it slowly.@k@v16/30600104. ......Stay calm.@k@v16/30600105. Believe my words."'
21415: 'Jessica@r@v04/30200244."Su-......sure.@k@v04/30200245. ............Heheh, ...it''s weird...@k@v04/30200246. ......Even though it was so scary not being able to see, .........when you''re with me, Kanon-kun, it isn''t scary at all..."'
21416: 'Kanon@r@v16/30600106.".........Yes, that is the sofa.@k@v16/30600107. Trace it to the left while advancing slowly...@k@v16/30600108. There is a table just to the left.@k@v16/30600109. Be careful not to bump into it with your shins..."'
21417: '@r......It was a very, very peculiar and magical team effort.'
21418: '@rEven though she would be killed in an instant if she was noticed by the terrible witch,@k ......there was no fear in Jessica''s heart right then.'
21419: '@rShe was being protected and guided by Kanon, who she had thought she would never be able to meet with again.'
21420: '@r...It was probably only a momentary miracle.@k@r......But even so, Jessica was deeply grateful for it.'
21421: '@rIf she hoped for too much, she was sure that he would disappear—so, in order not to break this transient miracle...'
21422: '@r...and in order to engrave this moment into her heart for all eternity...she slowly...slowly...continued to walk...obeying Kanon''s voice...'
21423: 'Kanon@r@v16/30600110."......Alright, if you walk ten more steps, you will exit the servant room.@k@v16/30600111. Then, please turn to face nine o''clock, and keep walking very slowly.@k@v16/30600112. Put your hand on the wall to your right, and keep on following that.@k@v16/30600113. ...I will take you to a safe room."'
21424: 'Jessica@r@v04/30200247."............If I go there,@v04/30200248. ...will you...@v04/30200249..........leave me again, Kanon-kun......?"'
21425: 'Kanon@r@v16/30600114."..........................."'
21426: '@rKanon didn''t answer.@k@r...But even his lack of an answer was enough to let her know that was the truth.'
21427: 'Jessica@r@v04/30200250."......Then, ......no.@k@v04/30200251. .........I don''t want to go..."'
21428: 'Kanon@r@v16/30600115."If you stay here, you will be killed by the witch."'
21429: 'Jessica@r@v04/30200252."That''s alright...@k@v04/30200253. If I''m killed, I can go to the world where you are, Kanon-kun..."'
21430: 'Kanon@r@v16/30600116."......Milady,@k@v16/30600117. please be reasonable.@k@v16/30600118. ......For the dead such as myself, the human world is too bright and painful...@k@v16/30600119. So I cannot stay for long."'
21431: 'Kanon@r@v16/30600120."So Milady, ......with the time I am allowed, ......please permit me to guide you to a safe place.@k@v16/30600121. ............And after that, .........I will stay with you until my time runs out."'
21432: 'Jessica@r@v04/30200254.".........Is that...the best you can do, Kanon-kun......?"'
21433: 'Kanon@r@v16/30600122."...Yes.@k@v16/30600123. .........And in exchange, I will stay by your side for every second I can, Milady.@k@v16/30600124. ......The whole time, I will be with you, ......and I will talk with you, Milady."'
21434: 'Jessica@r@v04/30200255."Talk...about what...?"'
21435: 'Kanon@r@v16/30600125."..................What would you like me to talk about...?"'
21436: 'Jessica@r@v04/30200256."...Anything...that you''re willing to..."'
21437: 'Kanon@r@v16/30600126."......Well then...@k@v16/30600127. ............I will tell you the story of a cowardly servant boy without courage.@k@v16/30600128. .........About a foolish and pitiful boy who felt love for a lady as radiant as the sun, ...and who, even though those same feelings were confessed to him,@k@v16/30600129. ......lost to his cowardice, and in the end, was not able to be true to himself while he still lived."'
21438: 'Jessica@r@v04/30200257."...............Yeah...@k@v04/30200258. Then, ...I want to tell one too.@k@v04/30200259. .........The story of a cowardly girl, ......who couldn''t muster her courage...@k@v04/30200260....to keep telling the boy she loved just how much she loved him."'
21439: 'Jessica@r@v04/30200261."......And, ......about how God gave her a miracle to be reunited with that boy,@k@v04/30200262. ............and how, when she was given one more chance to muster up her courage, .........she did."'
21440: 'Kanon@r@v16/30600130.".........I also......want to hear that.@k@v16/30600131. ......So, for that reason as well, let us go.@k@v16/30600132. ......To a safe place."'
21441: 'Jessica@r@v04/30200263."......Yeah...@k@v04/30200264. If I could be with you, Kanon-kun, I would walk however long, however far...@k@v04/30200265. I don''t need eyes anymore.@k@v04/30200266. If you told me to step forward, I would even take a step off a cliff."'
21442: 'Kanon@r@v16/30600133."Thank you.@k@v16/30600134. ...Well then, Milady.@k@v16/30600135. Let us go.@k@v16/30600136. The first ten steps."'
21443: 'Jessica@r@v04/30200267."No... Not like that.@k@v04/30200268. ...Not unless you call me............Jessica."'
21444: 'Kanon@r@v16/30600137."......Understood.@k@v16/30600138. .....................Well then, Jessica.@k@v16/30600139. ...Take the first ten steps."'
21445: 'Jessica@r@v04/30200269."Yeah.@k@v04/30200270. Kanon-kun......"'
21446: '@rQuietly, quietly, Jessica and Kanon snuck slowly out of the servant room.'
21447: '@rDirectly around the corner, the witch could be seen cruelly looking down upon Nanjo''s corpse,@k but the witch did not even notice their presence.'
21448: '@rHowever, Ronove, who was waiting at her side, met Kanon''s eyes.'
21449: '@r...Kanon thought "oh no", grimacing and blocking Jessica with his back.'
21450: 'Ronove@r@v31/33100599."........................"'
21451: '@rHowever, Ronove did not inform his master.'
21452: '@rAs though it had been his imagination that he ever spotted him in the first place, he pretended to know nothing.'
21453: '@r......No, maybe he did appear to chuckle.'
21454: '@rFrom a finger on one of Ronove''s hands, which were joined behind his back, a single small gold butterfly appeared,@k flying in front of Kanon as though guiding him.'
21455: '@rIt was undetectable by the master he served.'
21456: '@rKanon was surprised at the magic that butterfly held.'
21457: '@rBecause it was far more powerful than the stealth barrier Kanon had.'
21458: '@r...He may not have known, but that power had originally been Ronove''s.'
21459: '@r...An imitation of that had been given to Kanon by Kinzo, and that was what Kanon was using now.'
21460: '@rAs that butterfly of stealth magic scattered gold scales, it grew smaller bit by bit.@k ...It probably wouldn''t last long.'
21461: '@r......But without a doubt, even that would buy them enough time to get far away from the cruel witch.'
21462: 'Kanon@r@v16/30600140."Alright, Milady...@k@v16/30600141. Let''s follow that wall and keep walking.@k@v16/30600142. ...On and on.@k@v16/30600143. And on."'
21463: 'Jessica@r@v04/30200271."Yeah.@k@v04/30200272. ......If I can be with you, Kanon-kun, ......I''ll keep on walking, on and on, as far as you want to go..."'
21464: '@rLed and protected by the small gold butterfly,@k ...the two who were separated by the wall between life and death slowly walked away towards the end of the corridor...'
21465: '@r......There was no way that the evil witch would have any magic to notice their flight.'
21466: '@rUntil they had already disappeared down the other end of the corridor, the witch never noticed that Jessica had vanished...'
21467: '@rBy the time the gold butterfly that Ronove had cast out evaporated completely, ...Jessica had reached the parlor.'
21468: '@rEven though she would have been able to make it this far in no time if she had been able to see, as she was now, it had been a long, long adventure.'
21469: 'Kanon@r@v16/30600144."......Now, Milady.@k@v16/30600145. We''ve reached the parlor.@k@v16/30600146. I will now take you to the bundle of curtains by the window.@k@v16/30600147. ...If you hide in there, you''ll surely be safe."'
21470: 'Jessica@r@v04/30200273."Inside the curtains...@k@v04/30200274. Not bad.@k@v04/30200275. I used to hide in there a lot, long ago."'
21471: 'Kanon@r@v16/30600148.".........BEATRICE-sama..."'
21472: 'Jessica@r@v04/30200276."...Huh?"'
21473: '@rKanon called the witch''s name.@k Jessica looked around in surprise, but being unable to see, she obviously couldn''t find the witch...'
21474: '@rBeato had appeared once again with a faint form.@k@rKanon squared off against the evil witch, but Beato''s expression was soft, ...and actually pitying.'
21475: 'Kanon@r@v16/30600149."I don''t understand what kind of whim drove you to revive me... Your feelings elude me."'
21476: 'BEATRICE@r@v27/30701987."......It was a whim and nothing more.@k@v27/30701988. ......No, ......this is how witches should be.@k@v27/30701989. ...It took me one thousand years to realize that.@k@v27/30701990. ...That is all... A foolish tale."'
21477: 'Jessica@r@v04/30200277."Wh-......who?!@k @v04/30200278.Who''s there...?!"'
21478: 'Kanon@r@v16/30600150."...Milady, be quiet.@k@v16/30600151. ......She is the witch, ...BEATRICE...@k@v16/30600152. .........I am in her debt, ......because she let me be with you one more time."'
21479: 'Jessica@r@v04/30200279."............The witch.........BEATRICE......"'
21480: 'BEATRICE@r@v27/30701991."...I am unimportant.@k@v27/30701992. I suggest you instead make haste in hiding that girl in the shadows of the curtains.@k@|@y@v27/30701993. .........You probably do not have much time left.@k@v27/30701994. You should spend it in a final conversation with Jessica."'
21481: 'BEATRICE@r@v27/30701995."...A secret meeting inside a bundle of curtains... You two have quite the sense of style.@k@v27/30701996. *cackle*cackle*..."'
21482: 'Jessica@r@v04/30200280."Uh, umm, ............thank you, BEATRICE...!!@k @v04/30200281.Thank you for letting me be with Kanon-kun......!!"'
21483: '@rJessica didn''t know where Beato was, so she said that while facing in the wrong direction.'
21484: '@rPerhaps because she found that funny, Beato snickered.'
21485: 'BEATRICE@r@v27/30701997."I will now leave this room to the pair of lovers.@k@v27/30701998. Evil witches have no need for tales of love, you see.@k@v27/30701999. Allow me to retreat."'
21486: 'Kanon@r@v16/30600153."......BEATRICE-sama...@k@v16/30600154. ...Thank you very much."'
21487: 'BEATRICE@r@v27/30702000."Hmph...@k@v27/30702001. .........No need to thank me.@k@v27/30702002. You know well that something like this isn''t enough to compensate for all of the evil I have done."'
21488: 'Kanon@r@v16/30600155."I give my gratitude to good witches as a parting gift.@k@v16/30600156. ...I don''t care about what happened before now, or what will happen in the future.@k@v16/30600157. ......All I know is that, in this very moment,@k@v16/30600158. ...you are without a doubt...a good witch."'
21489: 'BEATRICE@r@v27/30702003."......You flatter me, furniture.@k@v27/30702004. The next time we meet, I may be an evil witch who will not betray your expectations.@k@|@y@v27/30702005. ......And with that, farewell."'
21490: '@rBeato left the parlor and closed the door.'
21491: '@rAnd mustering the last of her remaining magical power, she sealed the door.'
21492: '@rThe fact that those two had escaped into here would eventually be noticed.'
21493: '@r...And now that the ninth twilight had been reached, no matter how much they struggled, their inescapable fate had already been decided.'
21494: '@rHowever, until that final moment, they should be permitted the time to speak with each other of their love.'
21495: '@rThe witch poured out all of her magical power to protect their time together.'
21496: '@r......So that no one would be able to defile their time alone together until the final moment.'
21497: '@rJust then, ...Beato perceived something.'
21498: '@r......Her body had been detected by a magical searching technique.'
21499: '@r...The cruelhearted witch''s furniture had sniffed this place out.'
21500: 'BEATRICE@r@v27/30702006."............So, boorishness is the witch''s way of doing things...@k@v27/30702007. To think that she doesn''t even intend to allow the two young ones to speak to each other of their love...@k@v27/30702008. ......*cackle*cackle*cackle*cackle*...!!"'
21501: 'Chiester45@r@v35/33400039."45, data received.@k@v35/33400040. Comparing target, confirmed as the Predecessor Lady BEATRICE.@k@v35/33400041. Analyzing parlor defensive wall.@k@v35/33400042. Multilayered defensive wall, 72 layers, attack barrier and magic reactive armor.@k@v35/33400043. Sniping into the parlor is impossible.@k@v35/33400044. Data link to 410."'
21502: 'Chiester410@r@v36/33500054."410, data received. Nihi!@k @v36/33500055.Then we''ve just gotta ——— the Predecessor first nyeh.@k@v36/33500056. Great Lady BEATRICE, permission to fire, please!"'
21503: 'EVA@r@v34/33300742."Go ahead and shoot.@k@v34/33300743. ...Oh, and avoid her vital areas.@k@v34/33300744. There''s something I want to ask that old hag."'
21504: 'Chiester410@r@v36/33500057."410, firing.@k@v36/33500058. Nihi!"'
21505: '@rThe Chiester Sisters'' gold bow released a golden snake.'
21506: '@r......It crawled down the corridor starting from the front of the servant room, drawing a soft, serpentine curved trajectory as it made for the parlor,'
21507: '@r...and struck through Beato''s chest.'
21508: 'BEATRICE@r@v27/30702009."..................guhahh......!!!"@|@y'
21509: '@rGold butterflies gathered, and the cruel witch showed herself there along with her furniture.'
21510: 'Ronove@r@v31/33100600."......Predecessor-sama.@k@v31/33100601. You will not get away with obstructing us a second time."'
21511: 'BEATRICE@r@v27/30702010."......ugh......u......... I never thought I would...@k@v27/30702011. ......Still, the Chiester Sisters really have gotten rusty.@k@v27/30702012. To think that they failed to bring me down.@k@v27/30702013. ...And twice, at that...!"'
21512: '@rRonove spoke in a manner fitting for the witch''s butler.@k@rAs she pushed her pain aside, Beato grinned and spoke back.'
21513: 'Chiester45@r@v35/33400045."My, my apologies, Predecessor-sama...!@k @v35/33400046.We were ordered to avoid vital areas...!"'
21514: 'Chiester410@r@v36/33500059."As soon as there''s an order, we can pierce you at any time.@k@v36/33500060. Through your earring holes, your belly button hole, any hole you like.@k@v36/33500061. Nihi!"'
21515: '@rThe gold snake that had shot through Beato grew even longer, drawing a helix like a morning glory vine, and awaited its next order.'
21516: '@r...It was ready to pierce a vital spot as soon as the merciless witch told it to.'
21517: 'BEATRICE@r@v27/30702014.".........For what reason would someone like you, who is even more brutal than me,@k@v27/30702015. make them avoid my vital areas?@k@v27/30702016. New BEATRICE...!!"'
21518: 'EVA@r@v34/33300745."I wanted to ask you.@k@v34/33300746. ...I don''t know what trick you used to escape, but we were under the impression we had taken you out, you know?"'
21519: 'EVA@r@v34/33300747."Why is it that even though you could have escaped by hiding, you took the risk of appearing again?@k @v34/33300748.......It can''t be that you came back just to protect those two young people, surely?"'
21520: 'BEATRICE@r@v27/30702017."......Well, ...who knows?@k@v27/30702018. ......*cackle*cackle*...!"'
21521: 'EVA@r@v34/33300749."And just a second ago.@k@v34/33300750. Why''d you do something as soft as reviving the lovers and reuniting them?@k @v34/33300751....The more I hear about you, the more I learn that I don''t even reach up to your feet as an incarnation of evil."'
21522: 'EVA@r@v34/33300752."If you''re like that, why did you suddenly start acting so mildly?@k@v34/33300753. ......That''s what I wanted to ask."'
21523: 'BEATRICE@r@v27/30702019.".........*cackle*cackle*!@k @v27/30702020.Because I am brutal, I am fickle.@k@v27/30702021. How could there be any meaning in asking that?"'
21524: 'EVA@r@v34/33300754."Chiester Sisters. Sew her."'
21525: '@rWhen she ordered that, the gold snake that was curled in a helix and suspended in space...@kmoved as fast as a real snake going after its prey,@k and pierced Beato''s body multiple times from the front and the back, its golden tail drawing a × shape.'
21526: '@rAs the ruthless witch had ordered, it drew a cross-stitch through Beato''s chest.'
21527: '@rThe gold thread made a squeaking sound and tormented Beato...'
21528: '@rRather than a gold snake aiming for its prey,@k it waited for orders in midair as if it was a sewing needle ready to sew Beato.'
21529: 'EVA@r@v34/33300755."When it comes to you, there''s no way it was a whim.@k@v34/33300756. ......I''ve heard about you.@k@v34/33300757. And I''ve learned.@k@v34/33300758. You are such an incarnation of evil that I don''t even rise up to your feet.@k@v34/33300759. I thought I was truly a fitting successor to you."'
21530: 'EVA@r@v34/33300760."......But you''ve always been in the way.@k@v34/33300761. You always say warm, pleasant things that shock me.@k@v34/33300762. ......What changed you?@k @v34/33300763.You explored the depths of evil for one thousand years,@k@v34/33300764. so I let you live just to find out...what happened to overturn that millennium?"'
21531: 'BEATRICE@r@v27/30702022."......If you want to know, I suggest you too spend a thousand years finding out.@k@v27/30702023. *cackle*cackle*cackle*!"'
21532: 'EVA@r@v34/33300765."Sew her."'
21533: 'BEATRICE@r@v27/30702024."Gwaahhhh!!!@k @v27/30702025.Ackkah, ......gahah!!"'
21534: '@rBeato''s chest was once again sewn with a golden cross-stitch.'
21535: '@rIt tightened once again, squeezing fresh blood from Beato''s chest.'
21536: '@rThe intense pain it caused ran in conflict with its beauty to the eye.'
21537: 'EVA@r@v34/33300766.".........You might actually be another one of those types who disappear when they die and don''t leave a corpse.@k@v34/33300767. So I''ll kill you slowly."'
21538: 'EVA@r@v34/33300768."But if you answer my questions honestly, I''ll kill you gently.@k@v34/33300769. I''ll give you a splendid, gorgeous death perfect for my predecessor.@k@v34/33300770. I''ll sink you in a coffin filled with water and roses.@k@v34/33300771. Isn''t that wonderful?@k @v34/33300772....And you still won''t talk?@k @v34/33300773.About the reason for your change of heart."'
21539: 'BEATRICE@r@v27/30702026."*cackle*cackle*...!!@k @v27/30702027.Not answering what she is asked is also one of the pleasures of an evil witch."'
21540: 'EVA@r@v34/33300774."Sew her. Twice."'
21541: 'BEATRICE@r@v27/30702028."Gyoah, gwuhaahh.........!!"'
21542: 'EVA@r@v34/33300775."Of course, you don''t have to answer.@k@v34/33300776. After all, that way I get to torture you.@k@|@y@v34/33300777. Kuukuhihihihihihihihihihi!!"'
21543: 'EVA@r@v34/33300778."The Endless Magic, the Infinite Magic, truly is wonderful.@k@v34/33300779. ...When you think about it, this world is finite in every way.@k@v34/33300780. The infinite cannot exist in the human world.@k@v34/33300781. Because God is infinite, he deprived the human world of all infinities so that he could look down upon it."'
21544: 'EVA@r@v34/33300782."...So, in other words, the power of the infinite is the power of God!@k @v34/33300783.A wonderful power where the more you play with it, the more fun ways of playing you find!@k @v34/33300784.You used that power as you pleased for one thousand years and went on a rampage!@k @v34/33300785.Why are you having a change of heart only now?@k @v34/33300786.Don''t tell me you just miss it now that you handed it over to me?"'
21545: 'BEATRICE@r@v27/30702029."How could I miss it.@k@v27/30702030. The Endless Magic is not magic as you believe it to be.@k@v27/30702031. ...True magic is in a deep abyss that you most certainly cannot reach."'
21546: 'EVA@r@v34/33300787."And you realized what that is......?@k @v34/33300788.What...is it?"'
21547: 'BEATRICE@r@v27/30702032."*cackle*cackle*cackle*!@k @v27/30702033.Wander around for a thousand years without realizing that, you foolish witch."'
21548: 'EVA@r@v34/33300789."Sew her. Three times this time."'
21549: 'BEATRICE@r@v27/30702034."Gwoah, gyuooh, ...guhh...!!!"'
21550: '@rThey continued embroidering Beato''s chest with the gold thread.@k@rIt tightened even more, causing Beato more and more pain...'
21551: 'EVA@r@v34/33300790."......Well, whatever.@k@v34/33300791. I''m not the least bit interested anymore in what deep understanding some good-as-dead hag came to.@k@v34/33300792. I''m bored now, so I''ll kill you quickly.@k@v34/33300793. If I kill you, the barrier to the parlor will be undone."'
21552: 'EVA@r@v34/33300794."......Then I''ll torture Kanon and Jessica to death a whole bunch of times.@k@v34/33300795. ......Being able to have two lovers as my toys at the same time, ......sounds fun, right?@k @v34/33300796.Kuhhihihhihhihihihhihihihihi!!@k @|@y@v34/33300797.Kill her...!!!"'
21553: '@rWithout missing by a millimeter, the gold sewing thread shot through Beato''s heart...@k@rThat intense pain was worse than all of the pain before that put together.'
21554: '@rBeato finally remembered the actual feeling of dying, which she had forgotten over one thousand years...'
21555: '@rBut, .........she couldn''t die.@k She must not die.@k@rIf she died, the two in the parlor would be handed over to the brutal witch.'
21556: '@rSo she definitely couldn''t die.@k@rShe resolutely...refused to die...!'
21557: 'BEATRICE@r@v27/30702035.".........New BEATRICE...@k@v27/30702036. ...I have a request.@k@v27/30702037. .........The lover''s meeting between the two in the parlor is to be short.@k@v27/30702038. .........In the amount of time an hourglass can measure, Kanon will probably disappear to Hades.@k@v27/30702039. ...Would you please allow them that much time...?"'
21558: 'EVA@r@v34/33300798."No waay.@k@v34/33300799. Tearing apart two who love each other is fun, isn''t it?@k @v34/33300800.You''re the one who said it.@k@v34/33300801. So I want to try it!"'
21559: 'BEATRICE@r@v27/30702040."......*cackle*cackle*...@k@v27/30702041. In that case, I cannot allow you to enjoy that pleasure...@k@v27/30702042. *cackle*cackle*, it is fun, tearing lovers apart."'
21560: 'EVA@r@v34/33300802."Right?@k @v34/33300803.I''m sure it must be, right?@k @|@y@v34/33300804.So don''t get in my way!!@k @|@y@v34/33300805.Sew her more!@k @v34/33300806.Sew, sew, sew!!"'
21561: 'Chiester410@r@v36/33500062."Nihi!@k @v36/33500063.410, understood!!"'
21562: '@rThe merciless gold sewing needle sewed its golden thread through Beato''s heart over and over again.'
21563: '@r......However, no matter how much it tightened, that heart did not stop...'
21564: 'BEATRICE@r@v27/30702043."Khh......hhhhhhh...this isn''t nearly enough...@k@v27/30702044. You''ll have to do better than this to kill me...!!"'
21565: 'EVA@r@v34/33300807."What are you doing?@k@v34/33300808. Make this old hag stop talking.@k@v34/33300809. Kill her quickly!"'
21566: 'Chiester45@r@v35/33400047."W-...we are...!!@k @v35/33400048.Even though we''ve sewn her heart in place several times,@k@v35/33400049. ......her heart...w-won''t stop...!!"'
21567: 'EVA@r@v34/33300810."......Are you...immortal?"'
21568: 'BEATRICE@r@v27/30702045."Of course not.@k@v27/30702046. ......I''ve handed the endless over to you.@k@v27/30702047. There is a limit to how many more times my heart can beat."'
21569: 'BEATRICE@r@v27/30702048."...However, if by making it beat just one time extra, I can give the two in this room even slightly longer to themselves,@k@v27/30702049. ......I''ll continue that meager resistance for all eternity!!"'
21570: 'EVA@r@v34/33300811."Sew!!@|@y@k @v34/33300812.Keep sewing until her heart stops beating!!"'
21571: 'BEATRICE@r@v27/30702050."Guuh, guooooh, gwaaaAAAaaaaAAAAAaahhhh!!"'
21572: 'Chiester410@r@v36/33500064."...Wh-......why doesn''t she die?!@k @v36/33500065.This is impossible...!!"'
21573: 'Chiester45@r@v35/33400050."Her heart is, ......sewn in place...@k@v35/33400051. ......So why...doesn''t it stop?!"'
