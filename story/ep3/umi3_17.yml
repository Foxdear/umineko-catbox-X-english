21812: 'Battler@r@v10/30101603."Damn iiiiiiiiiiiiiiiiiiiiiiit...!!!@k @v10/30101604.You have no right to say that name...!@k @|@y@v10/30101605.......And yet, ......I can''t think of a move to deny that.........!!!"'
21813: '@rBattler could no longer counter this witch who was laughing derisively in triumph...'
21814: '@rHe didn''t want to give up, but he could do nothing.'
21815: '@rHe ground his teeth, making fists with both hands.@k@r......But even so, he couldn''t think of a brilliant counterattack...!'
21816: 'Ronove@r@v31/33100637."Battler-sama.@k@v31/33100638. ......You are closing in on the time limit—will you resign......?"'
