21989: 'EVA@r@v34/33301131."@c900.@[The one who killed Nanjo was definitely a human!@]@c."'
21990: 'EVA@r@v34/33301132."@c900.@[A human, with their feet on the ground, held up a weapon and killed with it!@]@c.@k @v34/33301133.@|@y@c900.@[Right before his eyes!@]@c.@k @v34/33301134.However, the human may have been able to use magic.@k@v34/33301135. ......Which means, it was a witch."'
21991: 'EVA@r@v34/33301136."......That is, in other words, me.@k@v34/33301137. The Golden Witch, BEATRICE!!"@|@y'
21992: '@r......Even as Battler...@w500.ground his teeth...@w583.......his knees hit the floor with a thunk.@|@y'
21993: '@rHis soul still refused to submit...'
21994: '@r......However, ...his knees had already...@w583....started to accept submission......'
21995: 'EVA@r@v34/33301138."Kuhhihhihihihihihihihihi!@k @v34/33301139.Oh, did you kneel...?"'
21996: 'EVA@r@v34/33301140."That''s right, you''re already starting to understand.@k@v34/33301141. ......The Golden Witch does exist.@k@v34/33301142. .........And that Golden Witch, BEATRICE, is me...!!"'
21997: 'EVA@r@v34/33301143."Come on, praise me.@k@v34/33301144. Now is the time to praise the resurrection of a true witch.@k@v34/33301145. Now is the time to praise the resurrection of the Golden Witch, BEATRICE!!@k @v34/33301146.On the ninth twilight, the witch revives, and none shall be left alive......!!!"'
21998: 'Battler@r@v10/30101717."Daaamn iiiiiiiitt.........@k@v10/30101718. ......I don''t......understand......!@k @|@y@v10/30101719.After...being so thoroughly immobilized by the red,@k@v10/30101720. ......I don''t......have a clue anymore......!"'
21999: 'BEATRICE@r@v27/30702164."B-......Battler......@k@v27/30702165. D-don''t lose heart......@k@v27/30702166. ...You and I...promised that we would fight each other again, did we not......?@k@v27/30702167. Will you surrender here...?!@k @v27/30702168.Will you disappear in a place like this before fighting with me again......?!"'
22000: 'Battler@r@v10/30101721."I don''t want to break that promise......@k@v10/30101722. ............But......I can''t think of any move to deny her...!!"'
22001: 'Battler@r@v10/30101723."In the first place, ...this isn''t even a proper problem!@k @v10/30101724.Nothing exists outside the suspects, and all of the suspects are innocent!@k @v10/30101725.I''ve been told that they''re innocent in red!@k @v10/30101726.And also that it was a real homicide, and that the culprit was human, and that they did appear in front of Doctor Nanjo''s eyes and kill him!@k @v10/30101727.I give up... There''s nothing I can do...!!!"'
22002: 'BEATRICE@r@v27/30702169."Please, Battler, don''t give up, don''t lose heart......!@k @v27/30702170.......If you stop thinking, it automatically becomes your loss.@k@v27/30702171. ...I''m begging you, don''t lose heart...@k@v27/30702172. ......I''m also cheering you on, ......so don''t lose......!"'
22003: 'Battler@r@v10/30101728."I can''t think of anything anymore...!!@k @v10/30101729.I end up thinking that she''s just a witch anyway, and must have done it with magic, so just thinking is pointless...!"'
22004: 'Battler@r@v10/30101730."It''s no good, my head hurts, my brain''s tired...@k@v10/30101731. I end up thinking that thinking''s pointless, so I should just stop...!!"'
22005: 'BEATRICE@r@v27/30702173."Battler, listen...@k@v27/30702174. .........In the game of chess, both sides do all they can to make the other lose, so a single game takes a long period of time.@k@v27/30702175. ......However, if one side throws away victory from the beginning, and voluntarily makes moves harmful to themselves, the game will end in the blink of an eye.@k@v27/30702176. ......That is called a fool''s mate."'
22006: '@rA fool''s mate is, simply put, a strange way of playing chess, with the mind to lose as soon as possible.'
22007: '@r...Opening the area in front of your own king and inviting the opponent''s queen in.'
22008: '@rChess, in which the average playing time for a single game may stretch for several hours, can be resolved in a scant four moves.'
22009: '@r......In other words, if both sides try to win in a fight, they are compelled to take a painfully long period of time,@k ...but if one side decides to lose, they can end the game all too easily, at any time...'
22010: 'BEATRICE@r@v27/30702177."......When the human side stops thinking, it hands the problem before its eyes over to the witch,@k@v27/30702178. and even an apple falling from a tree can be immediately resolved as the work of magic."'
22011: 'BEATRICE@r@v27/30702179.".........And it is the same way for the witch side.@k@v27/30702180. ...Witches use the red truth.@k@v27/30702181. ......If they use that to show that the true form of magic can be explained away using humans, they can immediately lose."'
22012: 'Battler@r@v10/30101732."............You don''t have to tell me that...@k@v10/30101733. ......You''re telling me not to stop thinking, right...?@k @v10/30101734.But,@v10/30101735. .........how am I meant to counterattack her perfect bright-red move...?@k@v10/30101736. For me,@v10/30101737. ......for humans,@v10/30101738. .........it''s no longer possible............"'
22013: 'BEATRICE@r@v27/30702182.".........Is it...@v27/30702183.......impossible...?@k @v27/30702184.......Is it...@v27/30702185....impossible for you, Battler......?@k @v27/30702186.......Please... Don''t lose heart........."'
22014: 'Battler@r@v10/30101739."..................Sorry.........@k@v10/30101740. ...It''s no longer...@v10/30101741.......possible for me........."'
22015: '@rBattler scratched at the floor, crying heavily.'
22016: '@r......Beato watched that with a distressed face...'
22017: '@rThen she stood up, and spoke to the witch.'
22018: 'BEATRICE@r@v27/30702187."............I will make a move as a counterattack to yours."'
