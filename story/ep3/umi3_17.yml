21824: 'BEATRICE@r@v27/30702116."......If it is impossible for Kyrie to have gone to the mansion with food as a goal,@k@v27/30702117. we can only explain it with another goal which caused Kyrie to go outside in any case.@k@v27/30702118. In other words, if we can establish that goal, we can defeat magic...!"'
21825: 'Battler@r@v10/30101608."I, I see...@k@v10/30101609. So she didn''t go to the mansion with food as a goal, but had a different goal,@k@v10/30101610. and said that she wanted to go and get food in order to disguise her real goal..."'
