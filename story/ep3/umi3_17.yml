21744: 'VIRGILIA@r@v30/33200561."Agreed.@k@v30/33200562. "Devil''s Proof", valid.@k@|@y@v30/33200563. ......Battler-kun can claim that a stake-shooting device exists without bearing the responsibility of explaining how it is constructed.@k@v30/33200564. The witch side cannot object to this move."'
21745: 'BEATRICE@r@v27/30702098."......N-not bad...@k@v27/30702099. How pushy..."'
21746: 'Battler@r@v10/30101548."Heh!@k @v10/30101549.Well, there''s this ill-natured witch who trained me well.@k@|@y@v10/30101550. This is check, got it?!@|@y@k @v10/30101551.Try saying in red that Auntie Eva didn''t take a step out of that room!!"'
21747: 'Battler@r@v10/30101552."That''s right, there''s no way you''ll be able to say it!@k @v10/30101553.If you can''t say it, it''s over, checkmate!!"'
21748: 'EVA@r@v34/33300891."......Th-......that''s so irrational.........!@k @v34/33300892.This is...messed up...!"'
21749: 'Ronove@r@v31/33100622."Those are the rules of this game.@k@|@y@v31/33100623. ...How about some black tea first?@k @v31/33100624.We also have some delicious cookies, you know."'
21750: 'EVA@r@v34/33300893."I don''t need all that!!@|@y@k @|@y@v34/33300894.Oh, that pisses me off...!@k @v34/33300895.So you fight like a coward just because you can''t win with magic...!!"'
21751: 'Battler@r@v10/30101554."Don''t get irritated.@k@v10/30101555. Drink some black tea or something.@k@v10/30101556. I''ll take mine straight.@k@|@y@v10/30101557. What about you, Beato?"'
21752: 'BEATRICE@r@v27/30702100."I, ...I am fine...@k@|@y@v27/30702101. .........More importantly, Battler, don''t let your guard down.@k@v27/30702102. Your opponent is merely unfamiliar with the rules.@k@v27/30702103. ...It will start in earnest once your opponent gets the feel for it..."'
21753: 'Battler@r@v10/30101558."But I''ll crush her.@|@y@k@|@y@v10/30101559. I''ll thoroughly crush her.@|@y@k@v10/30101560. That''s because she isn''t a witch."'
21754: 'Battler@r@v10/30101561."If I accept her as a witch, ......all of your stubbornness counts for nothing!@k @v10/30101562.I don''t care what kind of irrational argument or twisted logic I have to use,@k@v10/30101563. I''ll crush her with all of my heart and soul!!"@|@y'
21755: '@rBattler''s side then stuck with the "Eva culprit theory" to explain Krauss and Natsuhi,@k the seventh and eighth twilights, in the exact same way.'
21756: '@rAt that time, there had been no one on the first floor of the guesthouse except for Eva and the victims.@k ...As before, no one could establish an alibi for Eva.'
21757: '@rAt the time, Eva had claimed that they had disappeared while she was in the lavatory,@k but nothing supported that, and the witch side couldn''t repeat that in red either.'
21758: '@rWith the same argument as she had used to ask about the construction of the shooting machine,@k the witch side asked once more how Eva could have strangled both of them at the same time all by herself,'
21759: '@rbut of course, Battler splendidly counterattacked by refusing to explain because of the "Devil''s Proof".'
21760: '@rUnder the storm and stress of Battler''s spirit, the witch side was completely swallowed up,@k and was forced to resign three times during the short period of time she had to grasp the rules...'
21761: 'EVA@r@v34/33300896.".........Kuhhihihihihyahhyahhhya...@k@|@y@v34/33300897. Hah, I see!@k @v34/33300898.I''m finally starting to get the knack of it.@k@v34/33300899. I won''t let things go the way you want them to any more!"'
21762: 'EVA@r@v34/33300900."This time, let me take the initiative.@k@v34/33300901. Ronove, reconstruct the fourth through the sixth twilights!@k @v34/33300902.Pick out Ushiromiya Kyrie!@k @v34/33300903.......For now, let me return to the murders of Rudolf, Kyrie and Hideyoshi for the fourth through sixth twilights."'
21763: 'BEATRICE@r@v27/30702104."......Wh-...what is she thinking?@k@v27/30702105. Why would she return once more to a board state she has already resigned from?"'
21764: 'VIRGILIA@r@v30/33200565."I see...@k@v30/33200566. ...This is a rare attack, which you do not use.@k@v30/33200567. Be careful."'
21765: 'EVA@r@v34/33300904."At the time, the survivors were barricaded in the guesthouse.@k@v34/33300905. They didn''t have food, but out of concern for their safety, they were at least prepared to go without eating until the next day.@k@|@y@v34/33300906. ......However, in the end, three of them went out for food."'
21766: 'Battler@r@v10/30101564.".........That''s right.@k@v10/30101565. In the end, three people went outside to get food."'
21767: 'EVA@r@v34/33300907."I''ll add in some red as I speak, ''cause it''ll be a pain otherwise.@k @v34/33300908.@|@y@c900.@[Kyrie didn''t think that they needed food.@]@c.@k@v34/33300909. Since going without food for about a day wouldn''t kill them,@v34/33300910.@|@y@c900.@[ she claimed that they should not leave the guesthouse.@]@c."'
21768: 'EVA@r@v34/33300911."And yet, she herself...@v34/33300912.@|@y@c900.@[suggested that they leave the guesthouse to get food.@]@c.@k@v34/33300913. .........Isn''t this a contradiction?"'
21769: 'Ronove@r@v31/33100625."Yes, a spectacular contradiction.@k@v31/33100626. It contradicts Kyrie''s pattern of behavior."'
21770: 'EVA@r@v34/33300914."That contradiction...@v34/33300915.@|@ywas created by me, using magic!@k @v34/33300916.In other words, I controlled Kyrie using magic, and made her say that to lure the sacrifices outside!!"'
21771: 'Battler@r@v10/30101566."R-ridiculous!@k @v10/30101567.There''s no way that kind of magic exists!!"'
21772: 'EVA@r@v34/33300917."It''s a "Devil''s Proof", though!@k @v34/33300918.Just because you don''t know about that magic doesn''t disprove its existence!@k @v34/33300919.And I don''t bear the responsibility of acting out that magic for you.@k@v34/33300920. And yet, you still have no room to counter this argument!!"'
21773: 'EVA@r@v34/33300921.".........*giggle*giggle*!@k @v34/33300922.I wonder if it''s alright to fight this way."'
21774: 'Ronove@r@v31/33100627."Yes.@k@v31/33100628. It is truly a spectacular move.@k@|@y@v31/33100629. ......Battler-sama, your response, if you please."'
21775: 'Battler@r@v10/30101568."You sure have brought in a weird argument.@k@v10/30101569. ...Run that by me again?"'
21776: 'VIRGILIA@r@v30/33200568."She has made a play against Ushiromiya Kyrie''s pattern of behavior.@k@v30/33200569. ...As has already been explained,@k@v30/33200570. Kyrie''s pattern of behavior had her saying that they should not go outside and head to the mansion in order to get food."'
21777: 'VIRGILIA@r@v30/33200571."Yet, even so, she took the initiative,@k@v30/33200572. and took the contradictory action of suggesting going to get food.@k@v30/33200573. As long as you cannot explain this contradiction, this violent move claims that it was due to magic."'
21778: 'Battler@r@v10/30101570."...Well, Kyrie-san probably thought that too in the beginning."'
21779: 'Battler@r@v10/30101571."But she probably, uh, ...thought about various things midway,@k@v10/30101572. and had a change of heart, deciding that food really was necessary...@k@v10/30101573. It would be a problem if, due to hunger, we had no energy when we most needed it...and, well..."'
21780: 'VIRGILIA@r@v30/33200574."......She is claiming that this change of heart is due to magic.@k@v30/33200575. In short, ...while it might be extremely difficult, you must explain the reason for Kyrie''s change of heart."'
21781: 'Battler@r@v10/30101574."Wh-......what...?@k@v10/30101575. ...But that''s asking me what was inside Kyrie-san''s own head..."'
21782: 'Battler@r@v10/30101576."Can''t I also summon Kyrie-san''s ghost and question her or something?!@k @v10/30101577.Beato!@k @v10/30101578.Can''t you call Kyrie-san here or something?!"'
