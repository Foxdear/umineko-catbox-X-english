21961: 'Battler@r@v10/30101694."Then......all that''s left......is the Doctor Nanjo suicide theory, right?!@k @v10/30101695.And the trap theory!@k @v10/30101696.The culprit was already dead, but a trap that they had already prepared went off..."'
21962: 'EVA@r@v34/33301114."@c900.@[Nanjo''s death was a homicide.@]@c.@k@v34/33301115.@|@y@c900.@[...Of course, it was with a direct method of murder, not a trap.@]@c.@k @v34/33301116.@|@y@c900.@[They readied their weapon, and killed him with it directly from the front at point-blank range!@]@c.@k @v34/33301117.@|@y@c900.@[The culprit appeared openly before Nanjo''s eyes, and as they both looked at each other''s faces, the culprit killed him...!!@]@c."'
