22032: 'BEATRICE@r@v27/30702196.".........Then that is convenient.@k@v27/30702197. In this place now, witches did not exist from the beginning.@k@v27/30702198. I will strip this deception away myself."'
22033: 'EVA@r@v34/33301156."You and I both are real, obvious witches!!@k @v34/33301157.Being able to use red is itself proof that we are!"'
22034: 'EVA@r@v34/33301158."I don''t know what the definition of a witch is to you,@k@v34/33301159. but if you''re mistakenly thinking that you alone will be able to get away unscathed, then you''d better—"'
22035: 'BEATRICE@r@v27/30702199."I am making no such mistake.@k@v27/30702200. I would accept it."'
22036: 'EVA@r@v34/33301160."Wh.........at did you say......?"'
22037: 'BEATRICE@r@v27/30702201."I never managed to become a witch in the first place.@k@v27/30702202. ......I have done nothing more than finally begin walking on the road to becoming a true witch."'
22038: 'BEATRICE@r@v27/30702203."...If it is true that I am a witch as I stand,@k@v27/30702204. ...then I am nothing more than a false witch who got addicted to power, like you."'
22039: 'BEATRICE@r@v27/30702205."......Rather than existing in that shabby form,@k@v27/30702206. I would have no regrets...@k@v27/30702207.in erasing this form of mine along with you...!"'
22040: 'EVA@r@v34/33301161."A-...are you insane?!?!@k @v34/33301162.S-stop it...!@k @v34/33301163.I still want to be a witch! I don''t wanna be Human...!!"'
22041: 'Ronove@r@v31/33100650.".........Witch, please return to your seat.@k@v31/33100651. Please, receive the human side''s response from your seat."'
22042: 'EVA@r@v34/33301164."Wh-what are you doing?!@|@y@k @v34/33301165.L-let go of me!!@k @v34/33301166.Don''t let that woman use red!!@|@y@k @v34/33301167.Make her stop!!@k @v34/33301168.Let gooooooooooooooooooo!!"@|@y'
22043: '@rAs the witch stood from her seat and tried to spring upon Beato, Ronove pressed down on both of her shoulders, forcing her back into her seat.'
22044: '@rAnd, even after that, he didn''t remove his hands from those shoulders.'
22045: '@rDenying witches was the same thing as denying magic.'
22046: '@r......That included demons such as Ronove.'
22047: '@rHowever, instead of running away, Ronove chose to act as the facilitator for the game,@k ...and to carry out that duty for his master''s sake.'
22048: 'VIRGILIA@r@v30/33200617."......BEATRICE.@k@v30/33200618. .........You have...no regrets, I hope."'
22049: 'BEATRICE@r@v27/30702208."The same to you."'
22050: 'BEATRICE@r@v27/30702209."......Sorry.@k@v27/30702210. ......Even though you taught me a lot of fun magic and happy spells,@v27/30702211. .........I couldn''t use it well at all.@k@v27/30702212. ............So I''ll train from zero,@v27/30702213. ...and start over again.@k@v27/30702214. ...I am truly sorry.........that you had to get caught up in your stupid disciple''s misconduct."'
22051: 'VIRGILIA@r@v30/33200619."......I had a good disciple in the very end.@k@v30/33200620. ......Go, and do as you believe."'
22052: 'Battler@r@v10/30101744.".........I, I don''t have a clue what you guys are talking about..."'
22053: 'Battler@r@v10/30101745."...But I do understand one thing.@k@v10/30101746. And I can say this...@k@v10/30101747. ......Beato, I don''t know what you''re trying to do,@k@v10/30101748. ...but whatever it is you''re about to do, don''t do it...!"'
22054: 'BEATRICE@r@v27/30702215."You have no moves.@k@v27/30702216. But I have one."'
22055: 'BEATRICE@r@v27/30702217."......If we let this move escape us, she will be revived as a witch in the true sense, and this time, she will control this whole island.@k@v27/30702218. ...All nightmares will be hers to do with as she pleases,@k@v27/30702219. and this island will fall into the deepest hell of the evil witch''s constant fantasies, for all eternity."'
22056: 'BEATRICE@r@v27/30702220.".........Can you permit that?@k@v27/30702221. ...Is it alright for your dear relatives to be toyed with for all eternity in that witch''s nightmare?"'
22057: 'Battler@r@v10/30101749."S-still, ......you shouldn''t have to sacrifice yourself...@k@v10/30101750. Th-this is a game between me and her.@k@|@y@v10/30101751. There''s no need for you to sacrifice yourself to make a move!@k @v10/30101752.I, I''ll think of something!@k @v10/30101753.I''ll definitely think of a miracle move...!!"'
22058: 'Battler@r@v10/30101754."So don''t rush into it!!@k @|@y@v10/30101755.Ooooooooooooooohhhh, damn it to hellllllllllll,@k@v10/30101756. I''ll definitely think of one, ......so don''t rush into iiiiiiiiiiit!!"'
22059: 'BEATRICE@r@v27/30702222.".........This game is cruel.@k@v27/30702223. The time limit for your deliberation has already run out.@k@v27/30702224. .........I am now the only one who can do it."'
22060: 'BEATRICE@r@v27/30702225."...Worry not, Battler.@k@v27/30702226. .........I''ll defeat her.@k@|@y@v27/30702227. ......I''ll defeat that cruelhearted witch with my own hands..."'
22061: 'Battler@r@v10/30101757."W-wait, Beato!!@k @v10/30101758.Stop it, quit it!!@k @v10/30101759.There''s absolutely no need for you to sacrifice yourself!!"'
22062: 'BEATRICE@r@v27/30702228."Last I remember, you were fighting to deny me.@k@v27/30702229. ......What a strange person.@k@v27/30702230. Hahahahahahahaha."'
22063: 'VIRGILIA@r@v30/33200621."......Let that child do as she likes.@k@v30/33200622. And please, see her through."'
22064: 'Battler@r@v10/30101760."B-...but......"'
22065: 'BEATRICE@r@v27/30702231."Battler.@k@v27/30702232. ......There''s only one thing I ask.@k@|@y@v27/30702233. ......Would you...cover your ears?"'
22066: 'Battler@r@v10/30101761."My ears......?@k @v10/30101762.Why...?"'
22067: 'BEATRICE@r@v27/30702234.".........In a few moments, I will deny witches in red.@k@v27/30702235. I will slice up the game board that she has laid out with her red."'
22068: 'BEATRICE@r@v27/30702236."......By doing that,@v27/30702237. .........I will probably lose my form as a witch as well.@k@v27/30702238. ......If you also hear the red truth I will tell, you will understand my true form."'
22069: 'BEATRICE@r@v27/30702239.".........Even if you alone cover your ears, the truth will not change at all.@k@v27/30702240. ......However,@v27/30702241. ...even so, I want you alone to cover your ears.@k@v27/30702242. ..................I at least want to be a witch...in your eyes.@k@v27/30702243. ......Please."'
22070: 'Ronove@r@v31/33100652."......BEATRICE-sama.@k@v31/33100653. ...There is no problem on the witch side.@k@v31/33100654. Please, your move."'
22071: 'EVA@r@v34/33301169."Let gooooooooooooooooooo!!@|@y@k @v34/33301170.You won''t get away unharmed either, you know?!"'
