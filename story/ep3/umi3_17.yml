21847: 'BEATRICE@r@v27/30702135.".....................khhh........."'
21848: 'EVA@r@v34/33300975."Obviously! You don''t have any room to argue back!!@k @v34/33300976.I am a witch.@k@v34/33300977. You can''t break through my magic!!"'
21849: 'EVA@r@v34/33300978."You''re no longer anything but a former witch.@k@v34/33300979. Just a loser who isn''t even allowed to take the name BEATRICE anymore!!@k @v34/33300980.Go on, pile up as much trash and rubbish as you like, and try to break my magic with it!!"'
