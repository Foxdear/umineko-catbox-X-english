22074: 'BEATRICE@r@v27/30702244."...How unsightly for a Golden Witch.@k@v27/30702245. .........Now, are you ready?"'
22075: 'BEATRICE@r@v27/30702246."...I will remove your checkmate in Battler''s stead.@k@v27/30702247. What happened on the chessboard where fifteen died, and only three remained?@k@v27/30702248. ...I will now expose it in red.@k@v27/30702249. With that red truth, ......I will impale and kill both fake witches!"@|@y'
22076: '@rBeato turned around and smiled at Battler.'
22077: '@r......Most likely, no one would believe that the witch who had gone to the limits of cruelty...@kwould try to leave a smile as the last expression she showed Battler.'
22078: '@rAnd that smile signified her last wish, that she wanted him to cover his ears...'
22079: '@rDenying witches in red......was the same as knowing her shabby form.'
22080: '@rBattler put both of his hands against his ears...'
22081: '@r......To protect her final...@khonor as a witch, he put his hands against his ears, ...rejecting the truth.'
22082: '@rAnd he howled.@k So that not even a bit of what she was saying would slip into his ears.'
22083: '@rAfter that...was a world where Battler could not hear anything.@k@rBeato was saying something with red.'
22084: '@rEven the evil witch attempted to cover her ears at their bitter contents.'
22085: '@r......That was...the red truth.@k Words of power.@k@r......Words that denied her own existence.'
22086: '@rWords that only witches could use—the only words capable of denying witches.'
22087: '@rBeato talked.@k@rWith the red truth, she sliced apart the bright-red game board that the witch had released.'
22088: '@rShe explained difficult problems that could not be solved by humans, with moves that could only be solved by witches, and began cornering the witch.'
22089: '@rThe truth that Battler was not permitted to hear.'
22090: '@rIf Battler had broken his promise, and sneakily listened in...@k@r......in an instant, Battler would probably have been able to become the victor in his game with Beato.'
22091: '@r......He would probably have understood all the riddles on the island, all of the magic and tricks, locked rooms, spells, curses, legends,@k ...and the entire tale of anger and sadness.'
22092: '@rHowever, ......Battler would only learn what that was when he reached the truth by himself.'
22093: '@rYes.@k ...From the beginning, ......BEATRICE had wished that Battler would reach that truth by himself.'
22094: '@rIt was something that shouldn''t be reached by being told.@k@rIt was a truth that Battler would have to drag himself to with his own power.'
22095: '@rA brilliant light gathered with Beato and the evil witch at the center, and grew gradually stronger...'
22096: '@rIt was...the power of truth.'
22097: '@r.........A heat and brilliance like the sun...@kshone on all of the falsehoods that hid in the darkness, trying to deceive, ...and burnt them to nothing.'
22098: 'EVA@r@v34/33301175."GWOOOOOOOOOOAAAAAaaaAAaaAAAaaaahhhh!!@|@y@k @v34/33301176.How?!@k @v34/33301177.How can you die?!@k @v34/33301178.How can you throw away your life...when you have such incredible power?!@k @v34/33301179.You hold the power to control gold, magic, and everything else at will -@k@v34/33301180.how can you so readily throw that away?!"'
22099: 'BEATRICE@r@v27/30702250."......Learn that even with a mountain of gold,@k@v27/30702251. even with magic to split the sea,@k@v27/30702252. there are some things you can never obtain.@k@|@y@v27/30702253. .........Come, show yourself.@k@v27/30702254. Show your true form, ......Ushiromiya Eva!!!"'
