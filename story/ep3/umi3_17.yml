21974: 'Battler@r@v10/30101716."...And you, Ronove?!"'
21975: 'Ronove@r@v31/33100645."........................@k@v31/33100646. .........My apologies.@k@v31/33100647. ......However, in these last thousand years,@k@v31/33100648. ...I have never seen......such an elaborately beautiful game board layout."'
21976: 'VIRGILIA@r@v30/33200610."............Although it pains me to admit it,@v30/33200611. ............it is beautiful.........@k@v30/33200612. ......What a...@v30/33200613....beautiful red...@v30/33200614....checkmate..............."'
21977: '@rThe witch''s master and the demon butler were both stunned, ...and a somehow rapturous expression rose to their faces...'
21978: '@r.........Forget surrendering,@w500. ...they were simply impressed at this perfect checkmate,@w500. ...which could only be admired...'
21979: '@rWhen people accept defeat from the bottom of their heart...@k@rit gives rise to neither regret nor humiliation.@k@r......Nothing is born except feelings of respect...'
21980: '@rI.........no longer knew......what was what anymore.'
21981: '@rThere were absolutely no weak points in her red.'
21982: '@rShe had said in red that all 15 people had died.@k@rShe had said in red that no people existed other than the 18.'
21983: '@rIn other words, no more than three people—me, Jessica, and Auntie Eva—existed.'
21984: '@rAnd even though none of those three people were the culprit, Doctor Nanjo was killed.'
21985: '@rAnd without a doubt, Doctor Nanjo''s death was a homicide, murdered by "that person" openly from the front...!'
