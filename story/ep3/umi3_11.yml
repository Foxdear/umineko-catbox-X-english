18608: 'Eva@r@v05/31000464.".........This way?@k @v05/31000465.......That means go this way, right............?@k @v05/31000466.They are......inviting me to go this way, after all........."'
18609: '@r......!!!'
18610: '@rMy heart leapt.@k ...Because there, ............gaping wide, ......was the opened mouth of eerie darkness.'
18611: 'Eva@r@v05/31000467."Wh-.........what is this...@k@v05/31000468. What is this......?!"'
18612: '@rWhen I strained my eyes, peering into the darkness, I saw something that looked like a light switch.@k ......In addition, there was a switch with open and close written on it.'
18613: '@rI resolutely pushed the switch for the lights,@w500. and rough lights almost like you''d find in a coal mine or something flickered on sporadically,@k making a staircase that stretched underground come hazily into vision...'
18614: '@rIt was creepy how it now looked even more gloomy with the lights turned on.'
18615: '@rOther than the light switch, there was also a switch with open and close written on it.'
18616: '@r...I could probably open and close it with this, but if I was unlucky enough to find that the open part was broken,@k I might be closed up in this creepy underground area for all eternity...'
18617: '@rSo for the time being, I didn''t touch the open/close switch,@k ......and as I readied my gun again, I slowly went down the stairs.'
18618: '@rBecause the ceiling was very high, it didn''t feel cramped.@k@rOn the contrary, it felt as though a cool breeze was blowing upwards, and I even sensed a spiritual presence from the eeriness of it...'
18619: '@rWith my gun at the ready, and carefully staring forwards, ......I continued descending the stairs......'
18620: '@rThe walls, the stairs, the lights, ...all of them were very old-fashioned.@k@r...It may be beyond doubt that this had been made at the same time that the mansion had been constructed on this island.'
18621: '@rThere were cracks in the ceiling, and water clung to the walls, constantly dripping down.'
18622: '@rThat water fell into a gutter that had been set up alongside the stairs, then quickly and silently flowed into the underground darkness.@k It was as though it was telling me to go faster...'
18623: '@rThe staircase turned back on itself a number of times.@k It was hard to tell how far underground I''d gone, but I thought it to be much deeper than one floor.'
18624: '@rAnd eventually, ............a rough, metal door showed itself.'
18625: '@rAnd there, characters had been written in a dark red paint.@k@r...They had probably been written a long time ago.'
18626: '@r@c900.@[“On the tenth twilight, the journey ends, and you shall reach the Home of the Gold.@]@c.'
18627: '@rMy heart, which was already about to explode, jumped about even more as soon as I read those deep-red characters...'
18628: '@rThere''s no mistake...@k This is the last stop.@k@r.........Father''s......Golden Land...!!'
18629: '@rI calmed my throbbing heart, somehow regained my composure, and readied the gun again.'
18630: '@r...But since, in the end, I couldn''t open the door with my gun held in both hands...@k......I lowered the gun, carefully erased my breath, and opened the door......'
18631: 'Eva@r@v05/31000469."..................I-......isn''t this......inside the......?!"'
18632: '@rMy first impression when I saw the room...@k...was to question whether it might have been connected to one of the rooms in the mansion.'
18633: '@rYes, this place had exactly the same atmosphere about it as the forbidden VIP room on the second floor.'
18634: '@rBut this was underground, so there were no windows.@k@rThere was only the solemn light of a grand chandelier.'
18635: '@rBut the quality of the interior, dimly lit by the faint light,@k was more than enough to take your breath away.'
18636: '@rA bed with a canopy, and a rocking chair that looked like it would be very comfortable to sit in.@k An extravagant sofa and carpet.'
18637: '@rThe room was like a dream every girl yearns for at least once...'
18638: '@rAnd yet, since it was an underground hidden room with no windows,@k it actually felt more like it could be the hidden house of a witch.'
18639: '@rI had never swallowed the legend of BEATRICE, witch of the forest.'
18640: '@rHowever, ......if you were shown this room,@k ......it certainly would become hard to doubt that she actually had existed,@k and had lived in here.'
18641: 'Eva@r@v05/31000470.".........Is someone...@v05/31000471...................there...?"'
18642: '@rAlthough I was dumbfounded by this room, I cautiously,@k ...no, timidly kept my gun raised, and searched the interior.'
18643: '@rAnd......in the center of the room, I found it.'
18644: 'Eva@r@v05/31000472."...............Eee - ..............."'
18645: '@rMy gasp came out strangely, as though a bunny was being choked.'
18646: '@r...I mean, ......after finding something like this,@k ...no one would have any words other than that stupid voice...'
18647: 'Eva@r@v05/31000473."It''s here......@k@v05/31000474. ......I-......it''s really here.........@k@v05/31000475. ......Father''s......gold......!!"'
18648: '@rOn the opposite side of the canopy bed, it was piled up in a massive heap...@k A mountain, a mountain of gold ingots!!'
18649: '@rOf course, they weren''t piled up carelessly in a way that would damage the dignity of this room.'
18650: '@rA beautiful scarlet satin weave was laid on the mountain of gold,@k creating a beautiful three-colored mix between the red, the gold, and the black of the deep darkness...'
18651: '@rIt was as though, when the witch slept on this bed,@k the gold would be a respectful chamberlain waiting on her.'
18652: '@rNobly, refinedly, gracefully, beautifully.@k@rIt was piled there with an imposing and yet ceremonious air...'
18653: '@rI tried to grab a single gold ingot and was surprised at its weight.@k@r......It was probably about ten kilograms.'
18654: '@r......Just this one ingot would easily be worth ten million without a doubt.'
18655: '@rThe Ushiromiya family crest, the One-winged Eagle, was lightly imprinted on it.'
18656: '@rIt was hard to tell whether it had worn away, or whether the impression had been made carelessly in the first place,@k but it was certainly the crest of the One-winged Eagle.'
18657: '@rJust how many ingots are piled up here?'
18658: '@rJust by roughly multiplying both sides, and multiplying that by the height, it must surely come to over several hundred.'
18659: '@rMy mind''s already blank... I can''t calculate it properly.@k@r......Even a conservative count would put it easily above a billion yen.'
18660: 'Eva@r@v05/31000476."Well, of course... Of course it would be...@k@v05/31000477. ...I mean, it''s ten tons of gold...@k @v05/31000478.At the current value, it''s more than 20 billion yen of gold...@k @v05/31000479.I, ...I found it, ......before anyone else, .........I found it!!@k @v05/31000480.Ahaha, wahahahahahahaha, ahah-hah-hah-hah-hahahahahahahahaha!!"@|@y'
18661: '@rIn front of the mountain of gold, I spread my arms and looked up at the ceiling.@k@rA laugh without a trace of dignity flowed out from my entire body.'
18662: '@rI had no intention at all of laughing in such a weird way,@k ...but I just, I just couldn''t hold back the happy feeling that flowed throughout my entire body.'
18663: '@r......That older brother of mine probably wouldn''t accept his loss just because I had found this gold.'
18664: '@r...But from now on, there would be no changing the fact that I had been the one to find the gold...!'
18665: '@rTo steal the headship of the family, I would still probably need some subtle tactics.'
18666: '@rBut after everything I''ve gone through until now, that''s a completely trivial problem.'
18667: '@rEven if I lose out on the inheritance of the Ushiromiya family and everything...@k@r...this 20 billion yen''s worth of gold is now mine and mine alone!!'
18668: 'Eva@r@v05/31000481."Hahahaha, a-hah-hah-hah-hah-ha!!@k @v05/31000482.There was a time when I thought of money as such a worthless thing.@k@v05/31000483. I thought, there are so many things in this world that you can''t buy with money."'
18669: 'Eva@r@v05/31000484."...But now I understand that that''s just a lie!@k @v05/31000485.It was just an excuse that have-nots make for themselves!!"'
18670: 'Eva@r@v05/31000486."With this mountain of gold before me, I''ve finally realized something so obvious...!!@k @v05/31000487.I can give birth to all the happiness in this world by melting this gold!@k @v05/31000488.With this money, my husband''s company is fine now.@k@v05/31000489. We will always be happy as a family.@k@v05/31000490. And I can even leave a vast amount of money to George...!!"'
18671: 'Eva@r@v05/31000491."The rest of the relatives will eventually be ruined and disappear.@k@v05/31000492. At that time, George will use this gold, and revive the Ushiromiya family''s lost honor,@k@v05/31000493. just like Father did...!!@k @v05/31000494.There will be no room for anyone to argue then.@k@v05/31000495. ......George is the true successor of the Ushiromiya family!!"'
18672: '@rIt happened!!!@k My wish was granted!!'
18673: '@rThat dream I have wished for ever since I was born into this world as Ushiromiya Eva, has been granted completely in this very moment...!!'
18674: '@rMy husband and I will be happy for all eternity.@k And I can also give my only son, George, eternal happiness!!'
18675: '@rThere''s no way I''ll waste it on foolish pleasures!!@k@rMy older brother has chewed up the Ushiromiya family, but George and I will revive it!'
18676: '@rAnd that means that we truly have succeeded the headship of the Ushiromiya family!!'
18677: 'Eva@r@v05/31000496."I succeeded...@k@v05/31000497. I did it, ...honey......George...@k@v05/31000498. ......I, ......your mother......finally succeeded...@k@v05/31000499. ......After this, we won''t be threatened by anyone...@k@v05/31000500. Uuuhhu, uuuuUUuuuUUugghhuhuu!!"'
18678: '@rThat''s right, after this, never again will we be smothered by sad nights.'
18679: '@r@v34/33300129.Congratulations, me.@k@r@v34/33300130.Congratulations, Ushiromiya Eva.'
18680: '@r@v34/33300131.......Right here, right now, the sad half of our life has had its heart''s desires granted.'
18681: 'Eva@r@v05/31000501."It''s all thanks to you...@k@v05/31000502. I was blessed with this chance because of your magic.@k@v05/31000503. Because of that chance, I was able to make it here...!"'
18682: '@r@v34/33300132....Thank you.@k@v34/33300133. But my magic couldn''t have been granted if we both didn''t believe in each other.'
18683: '@r@v34/33300134.So it isn''t just the power of my magic.@k@r@v34/33300135.This is our victory.'
18684: '@r@v34/33300136.So, congratulations,@k@v34/33300136_1. "us".'
18685: 'Eva@r@v05/31000504."Thank you, me...@k@v05/31000505. Thank you, Ushiromiya Eva...@k@v05/31000506. ......I''m so glad I didn''t give in before now.@k@v05/31000507. I''m so glad I didn''t drown in sorrow and forget to keep struggling..."'
18686: 'Eva@r@v05/31000508.".........No, this is my magic.@k@v05/31000509. Our magic!@k @v05/31000510.Your magic was the real thing.@k@v05/31000511. BEATRICE the witch of the forest is nothing more than an illusion.@k@v05/31000512. You are the real witch, who can use real magic.@k@v05/31000513. ......That''s right.@k@v05/31000514. Right now, you are the Golden Witch, BEATRICE!!"'
18687: '@rEva decided to leave that place for the time being.@k@rAnd when she climbed the stairs again, trying to leave this secret place...'
18688: '@r......She saw a creepy, swaying human shadow blocking her path, and her dreamlike state was blown away.'
18689: 'Eva@r@v05/31000515.".....................Who''s there?!"@|@y'
18690: '@rFor an instant, ...she believed that the true master of this room, the real BEATRICE, had appeared.'
18691: '@rIt seemed that the other person was also holding a gun.@k@rThe two of them were pointing guns at each other.'
18692: '@rAnd eventually, they each realized who the other was...'
18693: 'Eva@r@v05/31000516.".........Rosa.........?"'
18694: 'Rosa@r@v12/31400250."...Nee-san...@k@v12/31400251. .........What are you doing in a place like this...?"'
18695: 'Eva@r@v05/31000517."I could ask you the same.@k@v05/31000518. What business do you have in a place such as this?"'
18696: 'Rosa@r@v12/31400252."......I shouldn''t have given you that hint, Nee-san.@k@v12/31400253. If I hadn''t, I definitely would have been the first to reach this place.@k@v12/31400254. .........Too bad."'
18697: '@rIt seemed that Rosa knew where this staircase went,@k and what was waiting ahead of her.'
18698: 'Eva@r@v05/31000519."That''s rich.@k@v05/31000520. .........Coming from someone who arrived here after me."'
18699: 'Rosa@r@v12/31400255.".........I racked my brains too much over the sweetfish river.@k@v12/31400256. The sweetfish part didn''t really matter that much at all, did it?"'
18700: 'Eva@r@v05/31000521."That isn''t true.@k@v05/31000522. It was an excellent hint, if you ask me.@k@|@y@v05/31000523. Well, of course, maybe there was no need for it to be sweetfish.@k@v05/31000524 ...But when I heard that sweetfish are fish that go out into the sea, I was able to figure it out."'
18701: 'Rosa@r@v12/31400257."......What is inside?"'
18702: 'Eva@r@v05/31000525."Why not see with your own eyes?@k @v05/31000526.It definitely won''t betray your expectations."'
18703: 'Rosa@r@v12/31400258."........................@k@v12/31400259. ......Don''t be afraid, Nee-san.@k@v12/31400260. I never had any interest in who became the head.@k@v12/31400261. I don''t even care about the Ushiromiya family name.@k@v12/31400262. ......Honestly, Krauss nii-san always did throw his weight around, saying that he was going to be the head,@k@v12/31400263. so I actually feel good about you stealing the position from him."'
18704: 'Eva@r@v05/31000527."............Are you serious?"'
18705: 'Rosa@r@v12/31400264."Of course.@k@v12/31400265. I am the outsider of the Ushiromiya siblings.@k@v12/31400266. ......Even if Father had named me as the next head,@k@v12/31400267. there''s no way my brothers would accept that.@k@v12/31400268. I try not to have such naive dreams."'
18706: 'Eva@r@v05/31000528."........................"'
18707: 'Rosa@r@v12/31400269."Let me see too.@k@v12/31400270. The proof of your victory, Nee-san.@k@v12/31400271. ......As long as I receive the proper portion that we agreed upon as siblings,@k@v12/31400272. I plan to actively accept you as the true victor in this "game"."'
18708: 'Eva@r@v05/31000529."............If you shot me, then you would have this gold all to yourself, right?"'
18709: 'Rosa@r@v12/31400273."It''s the same for you.@k@v12/31400274. If you shot me, this gold would all be yours."'
18710: 'Eva@r@v05/31000530."......................................."'
18711: '@rFor a tense while, the sisters pointed their guns at each other.@k@rEventually, after they sized up the glint in the other''s eyes, they lowered their guns.'
18712: '@r...Eva removed her finger from the trigger, and held the gun upside-down.'
18713: '@rIt was a position that she couldn''t quickly shoot from.@k@rWhen she saw that, Rosa held hers the same way.'
18714: 'Eva@r@v05/31000531."......That''s right.@k@v05/31000532. That plan of shooting the other and having all the gold to ourselves is fascinating for both of us."'
18715: 'Eva@r@v05/31000533."...But if one of us suddenly disappeared on this island while it''s isolated by the typhoon, there would be a huge uproar.@k@v05/31000534. ......If we hid the corpse here, it probably wouldn''t be found easily, but that isn''t for certain."'
18716: 'Rosa@r@v12/31400275.".........No matter how many billion yen''s worth of gold is on the line,@k@v12/31400276. it isn''t worth the risk of committing murder.@k@v12/31400277. In the end, that would become a weakness for Krauss nii-san and the others to squeeze all the money out of us with."'
18717: 'Eva@r@v05/31000535."I agree.@k@v05/31000536. ......Considering that Nii-san or Rudolf could have been the one to show up here,@k@v05/31000537. ......it may have been a blessing in disguise that it was you.@k@v05/31000538. ...I trust you the most of all the siblings."'
18718: 'Rosa@r@v12/31400278."............Thank you.@k@v12/31400279. I also trust you the most of the siblings, Nee-san."'
18719: 'Eva@r@v05/31000539."...................................."'
18720: 'Rosa@r@v12/31400280."............I want to see the gold too."'
18721: 'Eva@r@v05/31000540."Do you?@k @v05/31000541.Now I also want to see it again.@k@v05/31000542. Even though I saw it with my own eyes, it still doesn''t feel real.@k@v05/31000543. ...Unless I see it together with you and check once more that it actually exists,@k@v05/31000544. it feels like the gold will turn to fog and disappear."'
18722: '@rEva started descending the staircase once more.@k@r......However, she didn''t carelessly expose her back to Rosa.'
18723: '@rLikewise, even though at a glance it looked like Rosa had lowered her guard, she definitely didn''t show any signs of carelessness.'
18724: '@r......And they reached that room of the witch once again.@k@rRosa also gasped, made speechless by the vast amount of gold...'
18725: '@r......Rosa and Eva walked absentmindedly through the rose garden.'
18726: '@rThey had left the guesthouse secretly, so they had to be careful when they returned as well.'
18727: '@rThey had to regain their sense of tension soon.'
18728: 'Rosa@r@v12/31400281."......Congratulations, Nee-san."'
18729: 'Eva@r@v05/31000545."Thank you."'
18730: 'Rosa@r@v12/31400282."You decided it, didn''t you?@k @v12/31400283.Fifty percent goes to the bearer of the title of successor to the head.@k@v12/31400284. ......It sure did work out well for you.@k@v12/31400285. That doesn''t refer to Krauss nii-san anymore.@k@v12/31400286. ...So your share is now fifty percent along with a quarter of the rest, for a total of 12.5 billion yen."'
18731: 'Rosa@r@v12/31400287."Isn''t that an incredible share?@k@v12/31400288. ...I''m satisfied with 2.5 billion.@k@v12/31400289. Rudolf nii-san won''t complain either.@k@v12/31400290. Krauss nii-san will probably be the only one to complain."'
18732: 'Eva@r@v05/31000546."......Yeah, you''re right.@k@v05/31000547. ...After all, Nii-san is the practical manager of Rokkenjima.@k@v05/31000548. And since the gold was on these premises,@k@v05/31000549. even though I was the first to discover it, things might get complicated if I don''t handle it skillfully."'
18733: 'Rosa@r@v12/31400291."It won''t get complicated.@k@v12/31400292. We covered this and every other eventuality in excruciating detail in last night''s discussion, didn''t we?"'
18734: 'Eva@r@v05/31000550."............I wonder if it will really go that smoothly.@k@v05/31000551. I''ve already completely gotten over my excitement.@k@v05/31000552. How we regulate everything from here on is the real problem."'
18735: 'Rosa@r@v12/31400293."...That is a problem for the new head of the Ushiromiya family.@k@v12/31400294. You should enjoy that problem, Nee-san.@k@v12/31400295. It has nothing to do with me."'
18736: 'Eva@r@v05/31000553."Hmm, sharp words..."'
18737: 'Rosa@r@v12/31400296."......I''ll support you as the second person to find it.@k@v12/31400297. So please at least give me the early payment we decided on.@k@v12/31400298. I''d like 150 million yen by March."'
18738: 'Eva@r@v05/31000554."Yes, that''s fine.@k@v05/31000555. ......If you support me, I can graciously pay you that much.@k@v05/31000556. I am not Nii-san."'
18739: 'Rosa@r@v12/31400299."Anyway, why don''t we go and shock Nii-san and the others?@k @v12/31400300.Even if we cover up the actual location, I want to see Krauss nii-san''s shocked face as soon as I can."'
18740: 'Eva@r@v05/31000557."...............@k@v05/31000558. ............Wait a second, Rosa.@k@v05/31000559. Wait a while before telling everyone about it."'
18741: 'Rosa@r@v12/31400301."..................Huh?@k @v12/31400302....Why?"'
18742: 'Eva@r@v05/31000560."...You idiot, isn''t it obvious?@k@v05/31000561. ...This is that haughty Krauss nii-san and that sly Rudolf we''re talking about.@k@v05/31000562. Even if we announce it eventually, it''s still too early now."'
18743: 'Eva@r@v05/31000563."Unless we carefully investigate how we should move things along first,@k@v05/31000564. it''s possible that all of the gold we''ve finally found will be snatched away by Nii-san."'
18744: '@rEva had thought she had just said something completely obvious.'
18745: '@r...So when she saw Rosa''s expression suddenly cloud over, she was a little surprised.'
18746: 'Eva@r@v05/31000565."......What are you unsatisfied about?@k @v05/31000566.You know well what kind of people those two are."'
18747: 'Rosa@r@v12/31400303."...............@k@v12/31400304. Nee-san, that''s against the rules."'
18748: 'Eva@r@v05/31000567."What do you mean?"'
18749: 'Rosa@r@v12/31400305."......Didn''t we make a rule that whoever found the gold would announce it immediately?@k @v12/31400306.If you hesitate, the foundation of the rules will be destroyed,@k@v12/31400307. and that could lead to something worse in the future.@k@v12/31400308. ...With Krauss nii-san as crafty as he is,@k@v12/31400309. that violation of the rules will complicate things later."'
18750: 'Eva@r@v05/31000568."Don''t be stupid.@k@v05/31000569. This is Nii-san''s island.@k@v05/31000570. And that gold just now wasn''t cash.@k@v05/31000571. We''re talking about the liquidation of a vast ten-ton mountain, you know?"'
18751: 'Eva@r@v05/31000572."It will take a significant amount of time to carry it off and turn it into cash.@k@v05/31000573. And that will only work in Nii-san''s favor, since he has practical control over this island.@k@v05/31000574. Don''t you even realize that?!"'
18752: 'Rosa@r@v12/31400310.".....................I don''t like searching each other for weaknesses like that.@k@v12/31400311. I just want to clearly lock in my 2.5 billion portion."'
18753: 'Rosa@r@v12/31400312."Of course, if you were to give me 2.5 billion in cash right now,@k@v12/31400313. whatever you did next would be up to you.@k@v12/31400314. But until I have my share in my own pocket, I will follow the siblings'' rules."'
18754: 'Eva@r@v05/31000575."You''re so naive...@k@v05/31000576. You don''t understand Nii-san''s craftiness at all!"'
18755: '@r......It wasn''t that Rosa didn''t understand the craftiness of her older siblings.'
18756: '@rIn that sense, Rosa more or less understood Eva''s caution.'
18757: '@rBut in her heart,@k she couldn''t clear away her even greater suspicion that Eva wanted to keep all of the gold to herself.'
18758: '@r......Because she knew that Eva was at least as crafty as her other siblings, if not more.'
18759: '@rIn other words, by quickly informing the siblings of the gold''s discovery,@k Rosa wanted to put a stop to any chance Eva had to keep the gold all to herself...'
18760: 'Eva@r@v05/31000577."..................@k@v05/31000578. ......Rosa.@k@v05/31000579. Sorry, but at least listen to me this once."'
18761: 'Rosa@r@v12/31400315.".........Are you saying that if I don''t listen to what you say, you won''t be able to prepare the 150 million?"'
18762: 'Eva@r@v05/31000580."........................@k@v05/31000581. ...That isn''t the way I wanted to say it.@k@v05/31000582. ...But if you really need that money, it''s more realistic to support me.@k@v05/31000583. ......If you talk to Nii-san and Rudolf, even that natural portion of yours might disappear.@k@v05/31000584. You don''t want that, do you?"'
18763: 'Rosa@r@v12/31400316."........................"'
18764: '@rFor a while, a severe expression that she had never shown to her sister before rose to Rosa''s face.'
18765: '@rThere wasn''t even a trace of her restraint as a younger sister.@k ......There was just the ruthlessness,@k no, the seriousness of a single human arguing about a vast sum of wealth.'
18766: '@rEva made light of it, chuckling.'
18767: 'Eva@r@v05/31000585."......Dear me.@k@v05/31000586. A frightful murder has just taken place, and the culprit still may be on this island...@k@v05/31000587.how careless we must be to stand around here talking like this."'
18768: 'Rosa@r@v12/31400317."I''m sure it''s just the servants'' farce.@k@v12/31400318. No murder ever occurred on this island."'
18769: 'Eva@r@v05/31000588."......Oh?@k@v05/31000589. So you really do think that?"'
18770: 'Rosa@r@v12/31400319."It can be clearly explained by the manner of the six deaths.@k@v12/31400320. The locked room involving those six definitely couldn''t be created by a crime from the outside."'
18771: 'Rosa@r@v12/31400321."......Doctor Nanjo said that they were all dead, but that was also a lie.@k@v12/31400322. This is all a complicated act that Father plotted.@k@v12/31400323. All of the servants are just pretending to be dead.@k@v12/31400324. ...A murder never occurred in the first place.@k@v12/31400325. There''s no way that there''s a murderer prowling around."'
18772: 'Eva@r@v05/31000590."...Huh...@k@v05/31000591. I''m surprised that you would notice that.@k@v05/31000592. You looked fairly frightened, so I hadn''t thought that you realized that much."'
18773: 'Rosa@r@v12/31400326."......I''m a person who can read between the lines in that kind of situation.@k@v12/31400327. Thanks to you, I''ve been well trained."'
18774: '@rThat''s right.@k Before we realized it, the servants had "died", and the members of the Ushiromiya family had become the only ones on this island.'
18775: '@rAnd after Nanjo had proclaimed the "deaths" of the servants,@k and the relatives had begun to discuss the riddle of the epitaph, he had disappeared off upstairs as though he was in the way...'
18776: 'Rosa@r@v12/31400328."Everything...@k@v12/31400329.was an act to get us to challenge that epitaph.@k@v12/31400330. ......And that''s exactly why...@k@v12/31400331.you need to proclaim that you are the victor, Nee-san."'
18777: 'Rosa@r@v12/31400332."There''s no way that burnt corpse is really Father.@k@v12/31400333. ......He prepared a corpse with the right number of toes from somewhere, and deliberately burned it in that horribly morbid way."'
18778: 'Rosa@r@v12/31400334."......I''m sure he''s hiding somewhere, watching to see how we''ll behave.@k@v12/31400335. ...I''m sure he already knows that you have reached the Golden Land, Nee-san."'
18779: 'Rosa@r@v12/31400336."......And that''s why you should proclaim soon that you are the winner.@k@v12/31400337. I''m sure Father will appear out of nowhere and proclaim that you are his successor while clapping his hands."'
18780: 'Eva@r@v05/31000594."........................"'
18781: 'Rosa@r@v12/31400338."...Well, still.@k@v12/31400339. ......I have to pester you for 150 million,@k@v12/31400340. so I can''t work against you in anything."'
18782: 'Eva@r@v05/31000595.".........So you''ll listen to what I say, and be quiet about this to Nii-san and the rest...?"'
18783: 'Rosa@r@v12/31400341."...................................."'
18784: 'Eva@r@v05/31000596."......Make your position clear.@k@v05/31000597. ...Rosa."'
18785: 'Rosa@r@v12/31400342."...............I want to tell them.@k@v12/31400343. We just made that rule last night.@k@v12/31400344. We shouldn''t just throw that away."'
18786: 'Eva@r@v05/31000598."Of course, I will announce it in front of the siblings.@k@v05/31000599. ...However, I want to make very sure of the situation first.@k@v05/31000600. Carrying out ten tons of gold, converting it into money,@k@v05/31000601. and distributing it fairly."'
18787: 'Eva@r@v05/31000602."......Until I can affirm my ability to carry those out without Nii-san getting in the way, I want some time to think.@k@v05/31000603. I only want to hold off my announcement until then.@k@v05/31000604. .........I''m definitely not keeping it secret because I want it all for myself."'
18788: 'Rosa@r@v12/31400345."..................@k@v12/31400346. ...You''ll definitely announce it to everyone sooner or later, right?"'
18789: 'Eva@r@v05/31000605."...Yes, of course.@k@v05/31000606. Even I want to rub it in Nii-san''s face as soon as I can."'
18790: 'Rosa@r@v12/31400347.".........About how much time will you need to "think"?"'
18791: 'Eva@r@v05/31000607."I won''t know that until I''ve thought about it."'
18792: 'Rosa@r@v12/31400348."............Would one night be enough?"'
18793: 'Eva@r@v05/31000608."I can''t promise you that it will take only one night...!"'
18794: 'Rosa@r@v12/31400349."Out of respect for you as the successor to the head, I will support you for one night.@k@v12/31400350. ......This year''s family conference will end tomorrow morning, when the typhoon passes and a boat comes to get us.@k@v12/31400351. ...That''s right, when the seagulls cry.@k@v12/31400352. ......I will remain silent until then."'
18795: 'Rosa@r@v12/31400353."If you think that you need more time to think after that, ...let''s talk about it again at that time, alright?@k @v12/31400354..........I will support your position...@v12/31400355.as much as possible."'
18796: 'Eva@r@v05/31000610."......You......really are cunning, aren''t you?@k@v05/31000611. ...I''m surprised.@k@v05/31000612. Were you always this strong-willed?"'
18797: 'Rosa@r@v12/31400356."......It''s true that women become stronger when they have a child.@k@v12/31400357. I realized that in myself when I had Maria."'
18798: 'Eva@r@v05/31000613."...............@k@v05/31000614. Alright.@k@v05/31000615. I thank you for your cooperation for the time being.@k@v05/31000616. ...We can talk about tomorrow when it comes."'
18799: 'Rosa@r@v12/31400358."Yes, that''s right.@k@v12/31400359. ......I believe that you will be a fair-minded successor to the head, who wouldn''t even think of taking all of the gold for herself."'
18800: 'Eva@r@v05/31000617."...Isn''t that obvious!@k @v05/31000618.......I will split the gold evenly among the siblings as we agreed."'
18801: '@r@v34/33300137.No way. I found this.@k@r@|@y@v34/33300138.Because I, because we solved the riddle of the epitaph!@k@r@|@y@v34/33300139.So this gold is all mine...!!'
18802: '@r@v34/33300140."I won''t give it up to anyone!@k @|@y@v34/33300141.I am the head of the Ushiromiya family!@k @|@y@v34/33300142.I am, I am!!"'
18803: '@rIn a loud voice, the witch inside Eva claimed exclusive possession of everything.@k@r...Of course, that didn''t come close to reaching Rosa''s ears, and it probably didn''t even reach Eva''s, either.'
18804: 'BEATRICE@r@v27/30701370."......Mm.@k@v27/30701371. I shall acknowledge that.@k@v27/30701372. You are the true head of the Ushiromiya family, chosen by the witch''s epitaph.@k@v27/30701373. Now, I shall acknowledge that upon my name."'
18805: '@r@v34/33300143."...Y-@v34/33300144. .........you are.........@k @v34/33300145.That outfit...@v34/33300146.you couldn''t be...@v34/33300147.......really...@v34/33300148.BEATRICE......?"'
18806: '@rMaybe BEATRICE was happy that Eva had called her by her own name.@k She cackled pleasantly.'
18807: '@rIn concert with that laugh, gold butterflies rose up as though a storm of gold dust had broken out in the room,@k and the room shone the color of gold...'
18808: 'BEATRICE@r@v27/30701374."Indeed.@k@v27/30701375. I am the Golden Witch, BEATRICE."'
18809: 'BEATRICE@r@v27/30701376."......*cackle*cackle*, there is nothing that should frighten you so.@k@v27/30701377. I am praising your exploits.@k@v27/30701378. ...Truly excellent.@k@v27/30701379. Imagine that you would spectacularly solve that riddle of the epitaph...@k@v27/30701380. It is worthy of my admiration...!"'
18810: '@r@v34/33300149."...You were the one who sent that letter?@k @v34/33300150.So I''ll succeed all of the gold and the Ushiromiya family inheritance, right...?@k @v34/33300151.You wrote that in your letter.@k@v34/33300152. And I overcame that challenge...!"'
18811: 'BEATRICE@r@v27/30701381."Mm.@k@v27/30701382. I shall acknowledge it.@k@v27/30701383. Now, all of this piled-up gold, and everything of the Ushiromiya family, is for you to do with as you please.@k@v27/30701384. For as of this moment, you are already the Ushiromiya family head."'
18812: '@r@v34/33300153."R-......really?@k @v34/33300154.It''s true, right?@k @v34/33300155.Right?!"'
18813: 'BEATRICE@r@v27/30701385."Do not become agitated.@k@v27/30701386. I am openly praising you.@k@v27/30701387. As proof, I shall grant you this."'
18814: '@rBEATRICE took a ring off of her own finger,@k and held it out to Eva.'
18815: '@rShe fearfully accepted it,@w583. ......and realized that it was a ring.'
18816: '@r@v34/33300156."......C-@v34/33300157.......could.........@v34/33300158.this be............"'
18817: 'BEATRICE@r@v27/30701388."Mmhm.@k@v27/30701389. It is the proof of the Ushiromiya family headship, returned to me from Kinzo: the Golden Ring."'
18818: 'BEATRICE@r@v27/30701390."From now on, it is yours.@k@v27/30701391. You may put it on your finger and display it high before your siblings.@k@v27/30701392. None should doubt that you have now succeeded the Ushiromiya family inheritance."'
18819: '@rEva stared closely at the ring.'
18820: '@r...It certainly wasn''t a fake.@k ...Without a doubt, it was the real thing.'
18821: '@rShe, who had dreamed of receiving this ring someday,@w583. and who had stared fixedly at it countless times, could say that for certain.'
18822: '@rThis ring...@w333.had now designated her as its new owner,@w500. ......and had been handed over to her......'
18823: '@rAnd...@w250.timidly...@w583.she put it on the middle finger of her left hand...'
18824: '@rIn that instant, ......she felt a deep emotion welling up inside her that she had never felt before.'
18825: '@rHer mind grew blank.@k Both eyes opened wide.@k@rThat ring...was on her own finger.@k@rNot in a dream, in reality............!'
18826: 'BEATRICE@r@v27/30701393."That ring is surely also pleased.@k@v27/30701394. Because it was able to come to you, who had dreamed of putting it on your finger for so long."'
18827: '@r@v34/33300159."......The ring...@k@v34/33300160. ......Father''s@v34/33300161.......ring...............!"'
18828: 'BEATRICE@r@v27/30701395."How many nights have you dreamed of putting that on your own finger as you have now done?@k@v27/30701396. ......The strength of those feelings became your magic and made that reality.@k@v27/30701397. Now, you are worthy of calling yourself a true witch."'
18829: '@r@v34/33300162."............Wh-...who are you?@k@v34/33300163. ...Are you really......BEATRICE......"'
18830: 'BEATRICE@r@v27/30701398."*cackle*cackle*.@k@|@y@v27/30701399. I am the Golden Witch BEATRICE!@k @v27/30701400.The Ushiromiya family alchemist!"'
18831: 'BEATRICE@r@v27/30701401."Following my contract with Kinzo, I now pass everything on to you.@k@v27/30701402. ...All of the gold I entrusted Kinzo with.@k@v27/30701403. And all of the wealth he built up through that.@k@v27/30701404. And the honor and inheritance of the Ushiromiya family.@k@v27/30701405. And I will pass on my power, and the title of the Endless Witch."'
18832: '@r@v34/33300164."......A witch''s...@v34/33300165....title......"'
18833: 'BEATRICE@r@v27/30701406."I will pass on all of my magical power, and the titles of the Golden Witch and the Endless Witch.@k@v27/30701407. ......Following my Predecessor, I will hand over my name, BEATRICE, along with those titles.@k@v27/30701408. ......You may now call yourself by that name!"'
18834: '@rEva gulped.@k The chandelier light, which had seemed dim, now felt too bright.'
18835: 'BEATRICE@r@v27/30701409."By my name, I shall now carry out the succession of the Golden Witch...!"'
18836: '@rThe instant that BEATRICE made that proclamation, a golden brilliance buried everything,@k ......and changed it into a majestic space that looked like a throne room.'
18837: '@rIn the throne room, there was a crowd of BEATRICE''s minions and brethren, as well as countless gold butterflies,@k celebrating this first succession ceremony in a thousand years.'
18838: '@rAnd there was BEATRICE, in the throne that only the Endless Witch was permitted to sit in, holding a golden staff,@k reigning with a dazzling dignity.'
18839: '@rWithout being ordered by anyone, Eva automatically kneeled, hanging her head...'
18840: '@rA goat attendant respectfully offered BEATRICE a golden staff modeled after the One-winged Eagle.'
18841: '@rAfter BEATRICE stood up and received that staff,@k she lay the tip of it on Eva''s shoulder and spoke.@k It was a proclamation one thousand years in coming.'
18842: 'BEATRICE@r@v27/30701410."Ushiromiya Eva.@k@v27/30701411. You have spectacularly solved the riddle of the witch''s epitaph, and reached this Golden Land.@k@v27/30701412. ......I praise that accomplishment,@k@v27/30701413. and hand over all of the Endless Magic as well as the titles of the Golden and Endless Witch."'
18843: 'BEATRICE@r@v27/30701414."From this point on,@|@y@v27/30701415. you may take my name, BEATRICE...!@k @v27/30701416.Come, raise your face.@k@v27/30701417. Then stand and accept this staff...!"'
18844: 'EVA@r@v34/33300166."I, ......I am most grateful..."'
18845: '@rEva stood up dizzily and took the magic staff from BEATRICE''s hand.@k Her hand was trembling slightly.'
18846: '@rAs soon as she grasped that staff...@k@r......she was wrapped up in the brilliant sparkle of gold.@k@rAs though gold butterflies were flowing out from inside of her.'
18847: '@rIn the instant she succeeded the Golden Witch, Eva felt something in the depths of her soul be reborn.'
18848: '@rTo describe it in a word, it was energy.@k@rEnergy with a gold color.'
18849: '@rIt felt as though she had been half asleep ever since she was born,@k ......and had now awoken for the first time in her life.'
18850: '@rFor the first time in her life, she felt her true eyes inside her eyes open.'
18851: 'BEATRICE@r@v27/30701418.".........Mm.@k@v27/30701419. A fitting and beautiful outfit for the Golden Witch."'
18852: 'BEATRICE@r@v27/30701420."Come, show yourself to all of these people.@k@v27/30701421. Show them that you are now the new witch...!"'
18853: '@rEva, ......no, the new BEATRICE turned around timidly.'
18854: '@rWhen she did, the witch''s minions, which filled the vast throne room,@k honored her with a wild applause that sounded like the roaring of the sea......'
18855: 'BEATRICE@r@v27/30701422."Come, everyone.@k@v27/30701423. Replace all of the portraits of BEATRICE with the new BEATRICE!@k @v27/30701424.Offer up words of celebration for the new BEATRICE...!!"'
18856: 'VIRGILIA@r@v30/33200423."New BEATRICE.@k@v30/33200424. Congratulations on the succession of the Golden Witch.@k@v30/33200425. ...I hope that you will become able to stand on your own as a noble Golden Witch, and as the Endless Witch."'
18857: 'EVA@r@v34/33300167."Y-.........yes, ...I will do my best..."'
18858: 'VIRGILIA@r@v30/33200426."I expect a composure fitting for the Endless Witch from you, unlike your naughty predecessor.@k@v30/33200427. Hoh-hohohohoho."'
18859: 'BEATRICE@r@v27/30701425."Masteer, we''re in the middle of a serious ceremony, so please, enough of thaaat..."'
18860: 'Ronove@r@v31/33100418."Congratulations on the succession of the Golden Witch.@k@v31/33100419. New BEATRICE-sama."'
18861: 'Ronove@r@v31/33100420."......I am called Ronove.@k@v31/33100421. I am one of the 72 demons permitted to serve the Golden Witch.@k@v31/33100422. From now on, I will always be at your service.@k@v31/33100423. If you are ever inconvenienced in the slightest, please let me know at once."'
18862: 'EVA@r@v34/33300168."......Th-......thank you......"'
18863: 'BEATRICE@r@v27/30701426."Ronove is rude but reliable.@k@v27/30701427. If you speak to this man of anything that confuses you in your new days as a witch, he should be able to help you."'
18864: 'Ronove@r@v31/33100424.".........And, predecessor BEATRICE-sama,@k@v31/33100425. it is a shame that I was not permitted to serve you further, even though we have finally been reunited like this."'
18865: 'Ronove@r@v31/33100426."......These last thousand years have been very entertaining for me.@k@v31/33100427. I deeply thank you."'
18866: 'BEATRICE@r@v27/30701428."Mm.@k@v27/30701429. ......One thousand years with you wasn''t boring.@k@v27/30701430. ...Please, take care of the new witch."'
18867: 'Ronove@r@v31/33100428."Yes.@k@v31/33100429. If that is the final order of the predecessor BEATRICE,@v31/33100430. ...I, Ronove,@v31/33100431. shall certainly carry on your wish."'
18868: 'LAMBDADELTA@r@v29/32200001."Thank me, ''kay?@k @v29/32200002.I signed as your reference for the succession of the witch, you know?@k @v29/32200003.So basically, if I hadn''t signed, you wouldn''t have been able to become the witch.@k@v29/32200004. So thank me a little, alright?!"'
18869: 'BEATRICE@r@v27/30701431."This is the Witch of Certainty, Lady LAMBDADELTA.@k@v27/30701432. The recommendation of a witch from the Senate was required for your succession as an Endless Witch.@k@v27/30701433. Lady LAMBDADELTA recommended you, and became your guardian."'
18870: 'EVA@r@v34/33300169."Th-......thanks......"'
18871: 'LAMBDADELTA@r@v29/32200005."......Heyyy, Beatoo!@k @v29/32200006.This kid isn''t grateful enough!@k @v29/32200007.I wanna stop recommending her!"'
18872: 'BERNKASTEL@r@v28/32100001."Being a reference is not a thing to take lightly.@k@v28/32100002. If you''ve signed, then you must take responsibility."'
18873: 'BEATRICE@r@v27/30701434."Lady LAMBDADELTA is also the Witch of Certainty.@k@v27/30701435. ......The Witch of Certainty prefers to make fate firm, to create a fate of Certainty.@k@v27/30701436. She took a great liking to your efforts up to today, and held them in the highest regard."'
18874: 'LAMBDADELTA@r@v29/32200008."Well, an unfortunate childhood, unrewarded effort...I can sympathize juuust a bit with those, that''s all.@k@v29/32200009. It''s not like I felt sorry for you or anything, don''t get so full of yourself!@k @v29/32200010.Tsuun!"'
18875: 'BERNKASTEL@r@v28/32100003."......From my point of view, your succession, well, it''s more of a coincidence than a miracle.@k@v28/32100004. You wouldn''t have been worthy of my recommendation."'
18876: 'BEATRICE@r@v27/30701437."*cackle*.@k@v27/30701438. This is Lady BERNKASTEL.@k@v27/30701439. She is a very hard-to-please person.@k@v27/30701440. Still, you could say that just having her participate and celebrate is very fortunate."'
18877: 'BERNKASTEL@r@v28/32100005.".........I only came because this is a rare event, unseen in a thousand years.@k@v28/32100006. And I heard that there would be some delicious alcohol."'
18878: 'Lucifer@r@v38/32300134."New BEATRICE-sama.@k@v38/32300135. Please, allow us to greet you as well."'
18879: 'EVA@r@v34/33300170."Huh, ...ah, ...I''m pleased to meet you..."'
18880: '@rThe Seven Sisters of Purgatory formed a line side by side.@k@rThe eldest sister, Lucifer, took a step forward and kneeled.'
18881: 'BEATRICE@r@v27/30701441."These are furniture who serve me.@k@v27/30701442. As a gift in celebration of your inheritance, I will send them to you."'
18882: 'BEATRICE@r@v27/30701443."......After you succeed the Golden Witch, you will need to perform the ritual for your own resurrection.@k@v27/30701444. The Seven Sisters of Purgatory perform an essential role in that ritual.@k@v27/30701445. ......They''re a bunch of miscreants, but they serve their purpose.@k@v27/30701446. Have them do whatever you wish."'
18883: 'Lucifer@r@v38/32300136."We will always be by your side, BEATRICE-sama.@k@v38/32300137. Please order us to do anything you wish.@k@v38/32300138. We will certainly show that we can accomplish our task...!"'
18884: '@rEven after that, various nobles and minions visited and offered words of congratulation for the new witch.'
18885: '@rAs she responded to them confusedly,@k she felt as though she was getting light-headed due to lack of oxygen.'
18886: '@r......She couldn''t tell if this was something real or unreal.'
18887: '@rBut there was just one thing she could understand.@k The feeling of achievement at being permitted to call herself the Golden Witch.'
18888: '@r...That alone was a truth she could definitely understand...'
18889: 'Battler@r@v10/30101030."............What......is all this?@k@v10/30101031. Of course, I''m not going to swallow this story, ...but what on Earth does it mean?!"'
18890: 'Battler@r@v10/30101032."Auntie Eva is the new BEATRICE?@k @v10/30101033.Are you saying she''s become a witch?@k @v10/30101034.......What the hell...!!"'
18891: 'BEATRICE@r@v27/30701447."I am also surprised.@k@v27/30701448. Imagine that someone would be able to solve that riddle.@k@|@y@v27/30701449. ......However, that is the rule.@k@v27/30701450. I must follow it, and pass on the position of Golden Witch and my name."'
18892: 'Ronove@r@v31/33100432."It is hardly something to be surprised about.@k@v31/33100433. Milady wrote that rule in a letter and announced it at the beginning.@k@|@y@v31/33100434. ......Eva-sama was the first to be successful.@k@v31/33100435. That is all there is to say."'
18893: 'Battler@r@v10/30101035."......VIRGILIA, are you there?!"'
18894: 'VIRGILIA@r@v30/33200428."Yes, here I am..."'
18895: 'Battler@r@v10/30101036."What does this farce mean?!@k @v10/30101037.Even if this depiction of strange witches showing up one after another is some of her bullshit...!@k @v10/30101038.......Isn''t this like Auntie Eva has become a witch?!"'
18896: 'VIRGILIA@r@v30/33200429."Calm yourself.@k@v30/33200430. She has simply received the title of "Golden Witch", and might call herself that in the future.@k@v30/33200431. ......This succession ceremony is, without doubt, nothing more than that performed according to that child''s "interpretation".@k@v30/33200432. Don''t fall for the same move again."'
18897: 'Battler@r@v10/30101039."Th-...that''s right...@k@v10/30101040. That whole grand ceremony was all phony.@k@v10/30101041. But it''s at least a fact that Auntie Eva solved the riddle of the epitaph.@k@v10/30101042. ......And at the same time, that means that she inherited the Ushiromiya family headship."'
18898: 'Battler@r@v10/30101043."......And by obtaining ten tons of gold,@k@v10/30101044. ......it means that Auntie Eva might as well call herself the "Golden Witch"...is that it...?@k @v10/30101045.Damn, making things as complicated as ever...!!"'
18899: 'BEATRICE@r@v27/30701451."...Dear me.@k@v27/30701452. Is a boorish Human unable to comprehend the grandeur of this ceremony?@k@v27/30701453. ......Oh, well.@k@v27/30701454. Being unable to read between the lines is what makes you Human.@k@v27/30701455. I pity you, but I do not blame you."'
18900: 'Battler@r@v10/30101046."Damn it...@k@v10/30101047. Don''t look at me like you feel sorry for me...@k@v10/30101048. .........Still, for the time being, there''s something I need to check."'
18901: 'Battler@r@v10/30101049."And that''s regarding this younger version of Auntie Eva,@k@v10/30101050. ...in other words, the definition of this new BEATRICE.@k@v10/30101051. ......What the heck is she?!"'
18902: 'BEATRICE@r@v27/30701456."Even if I tell of it, you will just persist in your disbelief in magic and witches, will you not?@k @v27/30701457.So there is nothing in particular for me to explain.@k@v27/30701458. You may believe that things are as you think they are."'
18903: 'Battler@r@v10/30101052."......The way I think things are...?!@k @v10/30101053.Then, then how should I interpret this...?!"'
18904: 'Ronove@r@v31/33100436."For now, grasping it as a visualization of a different being inside Ushiromiya Eva may not be a hindrance, I believe."'
18905: 'VIRGILIA@r@v30/33200433."...Of course, you cannot blindly accept it, but it is probably appropriate for you to think that way now."'
18906: 'Battler@r@v10/30101054."............In, in other words, I should think of Auntie Eva and her as the same person?@k @v10/30101055.......Damn, ...this is starting to feel bad..."'
18907: 'BEATRICE@r@v27/30701459."With that being the case, from now on, my name is not BEATRICE.@k@v27/30701460. Because I have passed it on to Ushiromiya Eva."'
18908: 'BEATRICE@r@v27/30701461."......Which means that I am nameless!@k @v27/30701462.Battleerr, isn''t there some name that is fitting for me?@k@v27/30701463. I shall take your recommendation!@k @v27/30701464.Isn''t there a name that''s refined, full of elegance, and make it a little cute if you can...!"'
18909: 'Battler@r@v10/30101056."...Just "Beato" is good enough for you.@k@v10/30101057. There''s probably enough of a difference between Beato and BEATRICE."'
18910: 'BEATRICE@r@v27/30701465."Mh...muu.@k@v27/30701466. Stay as Beato, is it...@k@v27/30701467. It doesn''t feel odd, but it''s boring for some reason.@k@v27/30701468. Muu."'
18911: 'Ronove@r@v31/33100437."Pu ku ku ku ku...@k@v31/33100438. They say the temperature of black tea and a woman''s heart are difficult in any time period."'
18912: 'VIRGILIA@r@v30/33200434.".........Battler-kun.@k@v30/33200435. In any case, handle what is to come with composure.@k@v30/33200436. Compared to when this child was BEATRICE,@k@v30/33200437. now that we can tell her apart from Ushiromiya Eva, the situation is advantageous to us."'
18913: 'Battler@r@v10/30101058."......And it''s exactly because of that,@v10/30101059. ...that I like it even less.@k@v10/30101060. ......What is she thinking of?@k @v10/30101061.That Beato........."'
18914: '@rOver there, Auntie Eva,@k who had the figure of her younger days and who now possessed the name BEATRICE, had a long line forming of witches wishing to bless her.'
18915: '@rIt was like a witch''s coronation.'
18916: '@rCountless gold butterflies flapped their wings, directing this fantastical, gold-sparkling space.@k They were all praising her.'
18917: '@rAs I stared from the distance,@k I looked at the BEATRICE given new life, who had a slightly embarrassed smile on her face.'
18918: '@r......Her expression, which had been hesitant at first,@k seemed to be full of a happiness that she had finally become aware of.'
18919: '@rIn that expression, there wasn''t a trace of the madness that had led her to that insane laugh before the gold.@k There was only the innocence of relishing her joy.'
18920: '@rSince I deny witches, I couldn''t accept her as she showed that joyful expression at her witch succession ceremony...'
18921: '@r......However, as I watched that innocent smile,@k ...it made me feel like I wanted to celebrate her, just for now.'
18922: '@rThe moment when a strong effort is successful and rewarded is always beautiful.'
18923: '@rAuntie Eva, who had always yearned to succeed the head, and had worked hard since she was young without being rewarded,@k ......had spectacularly taken hold of the chance given to her by the riddle of the epitaph, ...and had finally gained that position.'
18924: '@rHow divine is the smile of a person whose childhood dreams have been granted?'
18925: '@rI definitely won''t accept witches.@k@rBut, ......Battler put his hands together, making a small sound.'
18926: '@rClap. Clap.'
18927: '@r......It didn''t reach her ears, ...but it did celebrate her.'
18928: 'Battler@r@v10/30101062.".........Congratulations, Auntie Eva."'
18929: '@rYou solved the riddle of the epitaph masterfully, and before anyone else.@k@rIt''s your victory without any complaints.'
18930: '@r............I won''t accept all that about the Golden Witch and so on, but I will accept you as the new head of the Ushiromiya family, and I will celebrate you honestly.'
18931: 'BEATRICE@r@v27/30701469."...............Hmph."'
18932: '@rAs though lured by Battler''s applause, Beato also clapped.'
18933: '@r...It was a slightly odd scene.@k Because Battler and Beato, who opposed each other, were standing next to one another, applauding for the same person.'
18934: 'Battler@r@v10/30101063."I''m not clapping for a witch.@k@v10/30101064. ...I''m clapping for all of Auntie Eva''s efforts up until now."'
18935: 'BEATRICE@r@v27/30701470."I am too.@k@v27/30701471. I am offering Eva my sincere congratulations in applause for the tremendous accomplishment of solving that epitaph."'
18936: 'Battler@r@v10/30101065.".........Hmm.@k@v10/30101066. ...I don''t like the fact that I''m clapping with you.@k@|@y@v10/30101067. ...But, well, I won''t worry about it for now.@k@v10/30101068. ...I guess it doesn''t hurt to clap with you every once in a while."'
18937: 'BEATRICE@r@v27/30701472."Mmhm.@k@v27/30701473. It isn''t bad once in a while.@k@|@y@v27/30701474. ......Still, it is fun to applaud.@k@v27/30701475. Even though it was Eva who achieved it and not me, for some reason, I''m starting to feel happy too."'
18938: 'Battler@r@v10/30101069."That''s because celebrating someone means the same thing as empathizing with their joy, and sharing in it."'
18939: 'BEATRICE@r@v27/30701476."I see.@k@v27/30701477. Then, I must even be sharing this irrational happy feeling with you.@k@v27/30701478. ......Since we are a pair of enemies trying to make each other submit, it is an odd experience."'
18940: 'Battler@r@v10/30101070."Well, ......just for now, let''s have a truce and clap, alright?"'
18941: '@rBeato laughed impishly, playing around and applauding even louder,@k as though eagerly trying not to lose to Battler as she clapped.'
18942: '@rBattler went along with her, and clapped even louder.'
18943: '@rAnd when he did, as though he had ended some kind of ceremony, everyone present put their hands together in loud applause, and highly praised the newly born BEATRICE.'
18944: '@rIt was just as though Battler''s and Beato''s applause had been the final thing needed for her succession......'