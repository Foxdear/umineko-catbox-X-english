17508: 'BEATRICE@r@v27/30700976."Enough.@k@|@y@v27/30700977. Do you know who this person is?@k@v27/30700978. ......BEATRICE was originally this person''s name.@k@v27/30700979. I merely inherited that name from her.@k@v27/30700980. ......This person is my master.@k@v27/30700981. The Predecessor Lady BEATRICE."'
