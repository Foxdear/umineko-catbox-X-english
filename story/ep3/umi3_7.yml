17565: 'BEATRICE@r@v27/30701024."As I would expect from you, Master!@|@y@k @v27/30701025.If you do something, you always do it big!!@k @|@y@v27/30701026.Kuhhuhuhuhuhyahyahya!!"'
17566: '@r@v30/33200098."My turn isn''t over.@k@v30/33200099. Come, arise, Sons of Ivaldi.@k@v30/33200100. Bestow upon me a worthy spear!"'
17567: '@rAs the massive crimson tower that had fallen made a mighty gold-colored explosion,@k from inside those flames, a spear showed itself, of such massive proportions that you had to look up to see all of it, much like a tower.'
17568: '@r...It was too large for even a giant''s hand.'
17569: '@rIt was a divinely beautiful spear of the gods, so massive that it gave the illusion that the tower which had fallen had turned into a spear of the same size.@k A spear of certain victory that no one could escape.'
17570: '@r@v30/33200101."It looks like your twin towers are useless.@k@|@y@v30/33200102. How foolish that you blocked off your means of escape on both sides.@k@v30/33200103. You can''t defend against even a single spear!"'
17571: '@rWhen she snapped her fingers in command,@k the massive tower-like spear shot at BEATRICE like a lightning bolt.'
17572: '@rAs the Golden Witch danced in the gap between the towers like a butterfly,@k it sliced straight through the air like a flash of lightning,@k aiming right for the very middle of the absolute center of her heart, with the most ultimate and extreme precision.'
17573: 'BEATRICE@r@v27/30701027."Hah!!@k @v27/30701028.So, you use Gungnir in a place like this!!@k @v27/30701029.You really are incredible, Masteeeerrrrr!!"'
17574: 'BEATRICE@r@v27/30701030."Explode, useless towers!@k @v27/30701031.Arise, Giant Soldier Battle Line.@k@v27/30701032. Fully block that divine spear with your shields and chests!!"'
17575: '@rThe Shoulder War Towers exploded in gold.@k@rThey became several billion gold butterflies.'
17576: '@rThose butterflies took the shape of seven massive armored soldiers.'
17577: '@rEach stretched a full 50 merute into the sky,@k and they lined up in front of BEATRICE, protecting their master and holding massive shields which towered like windmills.'
17578: '@rTheir massive size was evocative of a mountain range.@k The witch hiding behind them was like a small moon hiding behind the mountains.'
17579: '@rOnce in the past, when the massive shields these giants held had been readied by the whole giants'' regiment,@k they had protected King Wilhelm''s castle not only from arrows, but from the wind and the rain,@k and when they had faced upwards and held their shields to the heavens, not a single raindrop had gotten through.'
17580: '@r@v30/33200104."Foolish.@k@v30/33200105. How pitiful is the witch who has forgotten her respect for the divine.@k@v30/33200106. Did you think that giants could defend against a spear of the gods?!"'
17581: 'Ronove@r@v31/33100317."......Indeed.@k@v31/33100318. No matter how much human metal you are armed with, you cannot block a spear of the gods.@k@v31/33100319. A wonderful epaulette mate by Madam."'
