17499: 'Kumasawa@r@v18/31800012."...............I am waiting for that child.@k@v18/31800013. Would you mind calling for her?"'
17500: 'Lucifer@r@v38/32300126."D-do you think we''d be apprenticed to you like that?!"'
17501: 'BEATRICE@r@v27/30700975."There''s no need."'
17502: 'Lucifer@r@v38/32300127."BEATRICE-sama...!"'
17503: 'Ronove@r@v31/33100311."............It was sufficient for even myself to manifest.@k@v31/33100312. ...I was sure that you would awaken."'
17504: 'Kumasawa@r@v18/31800014."Ronove.@k@v18/31800015. It has been a long time.@k@v18/31800016. ......Yes, it truly has been a long time."'
