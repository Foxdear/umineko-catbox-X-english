17416: '@rGohda was doing the nighttime rounds.'
17417: '@rThere had never been anything on Rokkenjima outside the Ushiromiya family.@k@rSo checking that the doors and windows were all closed had no real purpose.'
17418: '@rHowever, ever since Natsuhi had scolded them saying that this was careless, the nighttime rounds had become part of the servants'' daily routine.'
17419: '@r......The reason that Natsuhi had ordered this was the occasional disturbances of the witch.'
17420: '@rEveryone who visited this island knew about the legend of BEATRICE, the witch of the forest.@k This had become established as this island''s characteristic ghost story.'
17421: '@rBecause of that, it was only natural that some people would occasionally say that, when they thought they were alone in the mansion,@k ...they had heard strange sounds, or seen the shadow of a person.'
17422: '@rHowever, when that had created a little too big of a disturbance and reached Natsuhi''s ears,@k she had made a fuss, thinking that some suspicious person might have been coming in and out.'
17423: '@rApparently, it was said that she had roused all of the servants and had them check throughout the mansion.'
17424: '@rBecause all of this uproar over the witch had happened before Gohda had come,@k he had only heard about it from the more senior servants.'
17425: '@rGhost stories like that could be found in any workplace.@k Even at the hotel Gohda had once worked at, and at the restaurant,@k there was never a shortage of those types of story.'
17426: '@rSo when he heard that story on this island,@k he smiled bitterly, thinking "ah, so they have that kind of thing here after all".'
17427: '@rHe smiled bitterly, but he thought when in Rome, do as the Romans do, and had not slighted that.'
17428: '@rGohda went along with it on the outside, but in his heart he thought it was a childish trick.@k ......At first.'
17429: 'Gohda@r@v17/31700013."............This certainly is eerie.@k@v17/31700014. I see, I understand why the servants got in an uproar over this in the past."'
17430: '@rHe could understand that if someone, doing the rounds on an eerie night like this,@k saw a lace curtain waving in the breeze from a window which hadn''t been closed,@k they might be tempted to believe they had seen a ghost.'
17431: 'Gohda@r@v17/31700015."So there''s a curse if you make fun of the witch of the portrait, huh.@k@v17/31700016. ......Seems like there were servants who got hurt really bad and quit, too.@k@v17/31700017. ...I''d hate to be injured.@k@v17/31700018. I''m already this old.@k@v17/31700019. Doubt I''ll ever be blessed with a workplace this hospitable again...@k@v17/31700020. Aaah.@k@v17/31700021. Great witch of the portrait.@k@v17/31700022. I''m really gonna work hard here, so please go easy on me."'
17432: '@rGohda prayed to the portrait, his hands together, as though he was at a Shinto shrine...'
17433: '@rAt that time, ...he thought he heard a sound.'
17434: '@rThe kitchen?@k Was that the sound of something metal falling on the floor?'
17435: '@rSurely a mouse or a cockroach hadn''t come out, and knocked over some of the dishes...@k No, no, how could that be.@k It was routinely and thoroughly cleaned!'
17436: '@rGohda thought that in any case he had better check what that noise had been, and entered the kitchen.'
17437: '@rHe turned on the kitchen light.@k@r......When he did, he heard a strange sound.'
17438: '@rClankclankclankclankclankclank.'
17439: '@r......To a cook like Gohda, that sound seemed like the lid on the pressure cooker or something was shaking.'
17440: '@rOf course, it couldn''t be in use when no one was in the kitchen.@k@rIf someone had been using the gas, what a dangerous thing to do, to just walk away from it.'
17441: '@r...Just in case, Gohda decided to inspect the area around the gas range...'
17442: 'Gohda@r@v17/31700023."...............What is this...?"'
17443: '@rWhen he did, in the corner by the gas range,@w500. ...the pressure cooker really had been placed there, just as he had thought.'
17444: '@rBut the flame wasn''t on.@k@r...And yet, the lid was clanking...'
17445: '@rWas something fermenting and leaking gas?@k@r...How could that be?@k ......Then was there a mouse or something inside?@k@r...How could there be, ridiculous...'
17446: '@rIn front of people, Gohda acted as though he had a bold personality fitting for his build,@k ......but he actually had an unexpectedly timid side to him.'
17447: '@rHe was terrified to find out what might be inside, and he couldn''t check it carelessly...'
17448: '@rIn his cowardice, ...he grabbed a nearby wooden pestle,@k and with a clunk!,@k @w500.he tapped it a little strongly against the side of the pressure cooker.'
17449: '@rWhen he did, the clanking sound suddenly stopped.'
17450: '@r...He should have been relieved now that it had stopped,@k ...but the fact that it had stopped when he had hit it was even more eerie, and made him even more suspicious about what was inside...'
17451: 'Gohda@r@v17/31700024."............nn, ...*gulp*.@k@v17/31700025. .........Strange phenomena do not exist in this world, no sirree.@k@v17/31700026. Yes, there''s no such thing as witches, or magic, things like that can''t possibly exist.@k@v17/31700027. All phenomena can be explained with science.@k@v17/31700028. ......As though monsters and witches could exist...!"'
17452: '@rHe repeated that many times, trying to build up his own confidence.@k ...It was quite comical how he looked completely different from what he was saying.'
17453: 'Gohda@r@v17/31700029."Who would believe in a witch, who would believe in magic or curses...@k@v17/31700030. ......Come on,@w500. ......show me what you really are...!@k @|@y@v17/31700031.Take that!"'
17454: '@r......He removed the lid of the pressure cooker.'
17455: '@rAnd lying exposed there...@w666.was the sparkling clean silver bottom of the pot.'
17456: '@r......There was absolutely nothing frightening like he had imagined.'
17457: 'Gohda@r@v17/31700032."...............Whew.@k@v17/31700033. ...Hahahaha, well, of course.@k@|@y@v17/31700034. ...There''s no way there could have been anything inside."'
17458: '@rBy now, Gohda realized that he had been a coward.'
17459: '@r......So while he still had some doubts about what had caused the lid to make that sound,@k ...he explained it away abstractly as some quirk of positioning or something, and decided not to worry about it too much.'
17460: '@rThen he took the lid he had grabbed, ......and softly set it back down where it had been.'
17461: '@r......It''s alright, there won''t be a sound.@k ......Obviously.@k@rAs if witches or magic could exist...!'
17462: '@rClank.@k Clankclankclankclank.'
17463: 'Gohda@r@v17/31700035."...............Huh...?"'
17464: '@rClankclankclankclankclankclankclankclank.'
17465: '@rCLANKCLANKCLANKCLANKCLANKCLANKCLANK@rCLANKCLANKCLANKCLANKCLANKCLANKCLANK!'
17466: 'Gohda@r@v17/31700036."Hii, ......HIIIiiiIIIIii!!"@|@y'
17467: '@rAll of the pots and utensils in the kitchen started clanking at once.'
17468: '@rAnd it grew stronger still, until finally, it became so strong that the lid to one of the pots fell off...!'
17469: '@rAnd, ......from inside that pot, .........a slender white arm slowly streeeetched out.'
17470: '@rThe lid fell off another pot, and another hand slowly streeeetched out,@k and anotherrrr,@k and anotherrrr...'
17471: 'Gohda@r@v17/31700037."Hiiiiiiiii!!!@k @v17/31700038.Witches aren''t, witches can''t be reeeeeal!!@k @v17/31700039.I''ll never believe iiiiiiiiiit!!"'
17472: '@rWhen the number of arms grew to seven, a loud, shrill laughter split the air.'
17473: 'Beelzebub@r@v43/32800019."What a letdown!@k @v43/32800020.It''s a reeeeal letdown that a person who can make such delicious food is such a lightweight!!"'
17474: 'Mammon@r@v42/32700021."If you don''t need him, I''ll take him, he''s all mine!!"'
