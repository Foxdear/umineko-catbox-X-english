17476: 'Gohda@r@v17/31700040."Huh?!@k @v17/31700041.Wha, whaa?!?!@k @v17/31700042.HYAAAAAAAAAAAAAAAAAAAAAAAHHH!!"@|@y'
17477: '@r@v99/awase0019.""""Kyahahahahahahaha!!!""""'
17478: '@rCome on, let''s search, there''s only one more.@k@rThat old hag!@k Where is she?@k@rNot the mansion, maybe the guesthouse?'
