17510: '@rGold butterflies appeared in ones and twos from the garden of roses and began to gather around Kumasawa...'
17511: '@rAnd after becoming a golden radiance and enveloping her, they burst and disappeared—and Kumasawa''s form was no longer there.'
17512: '@r...Instead, there was another Golden Witch, .........the one who had, in the past, explained to BEATRICE the path of an Endless Witch,@k the only person BEATRICE had called Master in her entire life.'
17513: '@rHer hair was long, beautiful, and vividly youthful,@k and her figure in that elegant dress was unrecognizable as an old lady...'
17514: '@rNo, this looked like a completely different person than Kumasawa.'
17515: 'BEATRICE@r@v27/30700982.".........Well, well, Master.@k@v27/30700983. I never even dreamed the day would come that we would meet each other again."'
17516: '@r@v30/33200061."Yes, me too.@k@v30/33200062. ...Certainly, I never even dreamed that my sleep would be disturbed."'
17517: 'BEATRICE@r@v27/30700984."Such a troublesome time for you to awaken.@k@v27/30700985. ......If you remained sleeping as usual, the first twilight could be finished without much trouble."'
17518: 'BEATRICE@r@v27/30700986."...Or should I welcome you?@k@v27/30700987. ............I was just a little bored."'
17519: '@r@v30/33200063."......Just as usual, it seems you are toying with sinless people in a vulgar game.@k@v30/33200064. ......I believe I have taught you many times that the power of the Endless Witch must not be used to cause people trouble."'
17520: 'BEATRICE@r@v27/30700988."Don''t say that, Master.@k@v27/30700989. Isn''t boredom our natural enemy?@k@v27/30700990. This is just a little spice to escape from that."'
17521: 'BEATRICE@r@v27/30700991.".........Tch.@k@v27/30700992. The more the corrosion advances, the stronger my power becomes, and the easier it becomes to call my minions.@k@v27/30700993. ...But who would have thought it would release the seal on you, Master, at the same time..."'
17522: '@r@v30/33200065."It was because I predicted that,@k@v30/33200066. that I slept very close to you like this.@k@v30/33200067. ......As I prayed in my sleep that I would not be woken again.@k@|@y@v30/33200068. ...Being reunited with you like this is a very sad thing for me."'
17523: 'BEATRICE@r@v27/30700994."..................You''re as cunning as always, Master...@k@v27/30700995. *cackle*..."'
17524: '@r@v30/33200069."Ronove.@k@v30/33200070. Have the furniture children step back.@k@v30/33200071. Furniture merely serves its master.@k@v30/33200072. The master is responsible for all of her crimes."'
17525: 'Ronove@r@v31/33100313.".........Certainly.@k@v31/33100314. Madam BEATRICE."'
17526: '@r@v30/33200073."I have already surrendered that name to this child.@k@v30/33200074. ......Come now, step back.@k@v30/33200075. Furniture girls.@k@v30/33200076. ......For those who do not listen the first time, I say it a second.@k@v30/33200077. However, I do not speak it a third..."'
17527: 'Ronove@r@v31/33100315."......Step back, Seven Sisters of Purgatory.@k@v31/33100316. If you get involved, you will be turned to dust..."'
17528: 'Lucifer@r@v38/32300130."B-......back, everyone..."'
17529: '@rRonove and the Seven Sisters of Purgatory retreated.'
17530: '@rAfter that, there was the BEATRICE whose bold expression didn''t falter,@k and the master BEATRICE, who had given up that name, and wore a composed smile...'
17531: 'BEATRICE@r@v27/30700996."Well then.@k@v27/30700997. ......Master.@k@v27/30700998. What tea shall I prepare for our long awaited reunion?"'
17532: '@r@v30/33200078."Let''s see.@k@v30/33200079. This reunion was longer in coming than the visit of a comet.@k@v30/33200080. I will accept your hospitality.@k@|@y@v30/33200081. .........If there appear to be any issues, then my name and the title of Endless Witch,@k@v30/33200082. ......I will have them returned, understand?"'
17533: 'BEATRICE@r@v27/30700999."*cackle*cackle*!@k @v27/30701000.So there''s even a license renewal policy for the title of Endless Witch?"'
17534: 'BEATRICE@r@v27/30701001."......As you say, Master.@k@v27/30701002. See how splendid your disciple has become,@k@v27/30701003. and see how far she has surpassed what you were long ago...!"'
17535: '@rIt looked like sparks exploded in the air between the two BEATRICEs.'
17536: '@rJust by glaring at each other, they purged all spirits from that space.'
17537: '@r...As they watched, the Seven Sisters shivered.@k ...Because if they had retreated just three steps less than they had, they would already have been turned to dust by now.'
17538: '@r@v30/33200083."So, come.@k@v30/33200084. BEATRICE.@k@|@y@v30/33200085. ...Surrendering my name to you is the only regret I have in my life.@k@v30/33200086. I will now correct that error with my own hands!"'
17539: 'BEATRICE@r@v27/30701004."*cackle*cackle*cackle*...@k@v27/30701005. ...Tut tut tut.@k@v27/30701006. ......That''s wrong, Masterrr.@k@v27/30701007. My only error...@k@v27/30701008.was becoming your disciple to learn this trifling level of power, got thaaaat?"'
17540: 'BEATRICE@r@v27/30701009."You call this magic?@k@v27/30701010. You call this being an Endless Witch?@k@v27/30701011. ......The power to notice, that''s all it waaas!@k@v27/30701012. And you made suuuch a big deal of it.@k@v27/30701013. Your time is long past, Masteeeeeeeeeeeeer!!"'
17541: 'Battler@r@v10/30100601.".........I,@v10/30100602. ......I, I don''t have a clue what''s going on anymore......!@k @v10/30100603.What in the world is happening right in front of my eyes...!"'
17542: '@r@v30/33200087."......Poor thing.@k@v30/33200088. It seems my disciple is causing you trouble.@k@v30/33200089. I apologize."'
17543: 'Battler@r@v10/30100604."Y-...you... Who are you?@k@v10/30100605. Why did Kumasawa baa-chan turn into an attractive lady like this?!@k @v10/30100606.I mean, who are you?!@k @v10/30100607.I don''t get it?!@k @v10/30100608.What kind of special effects are these?!@k @v10/30100609.My head feels like it''s gonna explode!!"'
17544: '@r@v30/33200090."I am the witch master of that child.@k@v30/33200091. My old name was BEATRICE.@k@v30/33200092. When she succeeded me, I gave her that name, so I do not have a name."'
17545: 'Battler@r@v10/30100610."You already said it, but your disciple''s being a real pain to me!@k @v10/30100611.Please, take responsibility and do something!@k @v10/30100612.No, wait!!"'
17546: 'Battler@r@v10/30100613."I don''t believe in stuff like this!!@k @|@y@v10/30100614.As if witches and magic are real!!@k @v10/30100615.I won''t accept this messed-up battle!@k @v10/30100616.Damn it all to hell, what am I supposed to believe?!!"'
17547: '@r@v30/33200093."Hoh-hoh-ho...@k@v30/33200094. Just like you, hospitality with a very quick temper."'
17548: 'BEATRICE@r@v27/30701014."...*cackle*cackle*.@k@v27/30701015. I''d expect nothing less from you, Master.@k@v27/30701016. It looks like this level of magic is so insignificant to you, you can''t even be bothered to open your eyes...!"'
17549: 'BEATRICE@r@v27/30701017."Looks like it''ll be impossible unless I''m prepared to wreck the whole island, riiiiiight?@k @|@y@v27/30701018.Come, arise, Shoulder War Towers!!"'
17550: '@rIn response to BEATRICE''s summons, a terrific earth tremor split the rose garden.'
17551: '@rAnd on either side of her shoulders, two massive War Towers sprouted and stabbed into the heavens.@k They stretched 100 merute tall, and each one had over 360 ports.'
17552: '@rThey were War Towers of the gods'' army corps, which had not allowed the heroes of antiquity to invade their precincts, even as they banded together.'
17553: '@rAs BEATRICE elegantly floated in the gap between the massive two-headed towers, she looked down on her master, sneering with an absolute superiority.'
17554: '@rWith the two massive towers lined up behind her shoulders, the witch looked very small,@k like a butterfly dancing between large trees.'
17555: 'BEATRICE@r@v27/30701019."Hihhyahhyahhyaaaaaa!!@k @v27/30701020.Don''t think you can dodge it by turning into butterflies, alright?@k @v27/30701021.The density of the twin towers'' barrage wouldn''t just make you a pinned bug collection, it''d make you a madly stabbed pincushion, get it...?"'
17556: '@rThe towers'' more than 720 ports opened, and godly soldiers readied their multi-shot ballistas.'
17557: '@r@v30/33200095."Does that conclude your turn?"'
17558: 'BEATRICE@r@v27/30701022."Heh, those are your last words?!!@k @|@y@v27/30701023.OPEN FIIIIIIIIIIIIRE!!!"'
17559: '@rBallista shots numbering easily over a thousand were all fired at once, drawing a beautiful geometric curtain of death.'
17560: '@rThe boorish sound performed by those bowstrings was probably even deeper than the sound of Death swinging his scythe.'
17561: '@r@v30/33200096."Come, arise, Fallen Tower.@k@v30/33200097. Split the single language, and make known the sin."'
17562: '@rThe sky was stained an incandescent red, and from between the clouds, a blazing, massive tower fell upside down.'
