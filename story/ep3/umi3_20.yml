22592: '@rShe spoke again, with the same voice I had heard inside my dreams.'
22593: 'BERNKASTEL@r@v28/92100217.".........Your assistance is needed."'
22594: 'Ange@r@v11/92000034."...My...@v11/92000035..........assistance......?@k @v11/92000036.Who needs it......?"'
22595: 'BERNKASTEL@r@v28/92100218.".........Your family needs it.@k@v28/92100219. ...Your family is eternally imprisoned in the two-day span that began on this day twelve years ago."'
22596: 'Ange@r@v11/92000037."I-...if I save them,@v11/92000038. ......does that mean my family will come back?!"'
22597: '@rWhen I asked the question I most wanted to ask, the girl cruelly stopped talking and hung her head.'
22598: 'BERNKASTEL@r@v28/92100220."......I cannot promise that.@k@v28/92100221. The enemy is the Golden Witch BEATRICE.@k@v28/92100222. ...A mighty opponent.@k@v28/92100223. I cannot compete with her.@k@v28/92100224. ......But another Golden Witch might be able to manage something."'
22599: 'Ange@r@v11/92000039."............I, I don''t know...what you''re talking about."'
22600: 'BERNKASTEL@r@v28/92100225."......The only one who can oppose the BEATRICE of 1986...@v28/92100226.is the final BEATRICE, of 1998.@k@v28/92100227. .........In other words, you.@k@v28/92100228. Ange.@k@v28/92100229. .........ANGE BEATRICE."'
22601: 'Ange@r@v11/92000040."That witch from twelve years ago...@v11/92000041....took away my family.........?"'
22602: 'BERNKASTEL@r@v28/92100230."Yes.@k@v28/92100231. She is responsible for what happened to your family.@k@v28/92100232. ............The source that always leads to your future of isolation."'
22603: 'Ange@r@v11/92000042."........................@k@v11/92000043. ......My...@v11/92000044....family''s...@v11/92000045.......killer."'
22604: 'BERNKASTEL@r@v28/92100233."......In exchange, I will search for the fragment with the ideal world that you wish for, the world where your family comes home.@k@v28/92100234. .........But I can''t promise you that your desire will be granted.@k@v28/92100235. ...The game board of the 1986 BEATRICE is quite perfect."'
22605: 'BERNKASTEL@r@v28/92100236."......I had planned on bringing you that ideal fragment as a present today, but I still can''t find it.@k@v28/92100237. ............It''s a very firm fate.@k@v28/92100238. I haven''t seen the likes of it since I fought with LAMBDADELTA."'
22606: 'Ange@r@v11/92000046.".............................................@k@v11/92000047. I,@v11/92000048. ......I don''t know...@v11/92000049....what you''re talking about."'
22607: 'BERNKASTEL@r@v28/92100239.".........I''m giving you a chance for revenge.@k@v28/92100240. ...In exchange, I promise to find and bring you the happiest resolution that it is possible for you to receive."'
22608: 'Ange@r@v11/92000050."..............................Revenge......"'
22609: 'BERNKASTEL@r@v28/92100241."......It may be a fruitless effort.@k@v28/92100242. Even if you succeed in your revenge, there''s no definite proof that your family will return.@k@v28/92100243. Even with a miraculous probability, you may only be able to bring one person back."'
22610: '@r...Ange now understood the meaning of that dream.'
22611: '@r......That dream where it seemed that, with just a little bit more, her hand might at least be able to reach Battler nii-san.'
22612: 'Ange@r@v11/92000051."A miraculous probability......is still higher than zero, right...?@k @v11/92000052.Is it about one percent...?"'
22613: 'BERNKASTEL@r@v28/92100244."......All probability values are powerless before the result.@k@v28/92100245. So I cannot tell you that number."'
22614: 'Ange@r@v11/92000053."But unlike if I don''t do anything, there definitely is a small possibility."'
22615: 'BERNKASTEL@r@v28/92100246."Yes.@k@v28/92100247. As long as you do not throw your hope away.@k@v28/92100248. ...But prepare yourself.@k@v28/92100249. It is extremely close to zero."'
22616: 'Ange@r@v11/92000054."..................@|@y@v11/92000055. Alright.@k@|@y@v11/92000056. I''m in."'
22617: 'BERNKASTEL@r@v28/92100250."......Are you sure?@k @v28/92100251.You''ll probably never be able to come back here again."'
22618: 'Ange@r@v11/92000057."This is not the world where I belong.@k@v11/92000058. ......And...as for the world where I do belong...I''ll find it myself.@k@v11/92000059. Tell me your name."'
22619: 'BERNKASTEL@r@v28/92100252."The Witch of Miracles, BERNKASTEL.@k@v28/92100253. And by that name,@k@|@y@v28/92100254. I acknowledge you as the Golden Witch, ANGE BEATRICE.@k@v28/92100255. ......As of now, you are a true witch."'
22620: '@rThe instant she proclaimed that I was a witch...@k...I felt dizzy, as though something inside me had changed drastically.'
22621: '@rJust then, I heard a slam.@k@r...It was the sound of the door connecting the staircase to the roof being opened.'
