22587: '@rWhat I need for that...is just the small amount of courage...to take a single step forward.'
22588: '@r............Just then,@k ...I definitely heard a voice.@k@rI knew that voice.'
22589: '@rThe voice that had always......called to me in my dreams...'
22590: '@rBefore my eyes, ......in other words, in mid-air above that jet-black nighttime scenery...'
