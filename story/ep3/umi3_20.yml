22633: 'Ange@r@v11/92000062."Oh, it''s no good, it''s no goddamn good at all.@k@v11/92000063. Time to go. <See you again>."'
22634: 'Ange@r@v11/92000064."Please send a limo to get me.@k@v11/92000065. ''Cause everyone else will be with me too.@k@v11/92000066. See you."'