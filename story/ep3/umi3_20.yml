22402: '@rA monotonous electronic sound kept on repeating.'
22403: '@rThe theme of that room was a so-called "hygienic" emotionless white.@k@r...It was a room of a certain university hospital.'
22404: '@rAn ordinary person wouldn''t be able to afford the cost of even a single night in this room,@k a room which neither her doctors, nor she herself, had any doubts would be the last she ever stayed in...'
22405: '@rWas the person on the bed...@w666.............Eva?'
22406: '@rShe looked haggard and aged, to the point that you would not believe it was her, unless you were told.'
22407: '@rA well-built man in a suit, waiting in the corner near the door, was having a conversation with the outside in a low voice, over the intercom.'
22408: '@r...He was a guard protecting Eva''s person.'
22409: '@rAfter telling the person on the other end of the intercom to wait, he approached Eva''s bed.'
22410: '@r...Eva had been awake for a while.'
22411: '@r......However, she stared at a single point in empty space, as though her mind was not in the same place.'
22412: '@r@v99/GurMA9001."......@bAnge.@<縁寿@>-san has arrived in the lobby below.@k@v99/GurMA9002. Should we let her pass?"'
22413: 'Eva@r@v05/91000003."................................."'
22414: '@rFor a long time, Eva didn''t answer.'
22415: '@rHowever, bit by bit, her eyes began to regain their focus, and she gave a small nod, indicating that she didn''t mind if they called Ange.'
22416: '@r...Eva herself had been the one to call her.@k And she was right on time.'
22417: '@rEva now refused to meet anyone without an appointment made in advance.'
22418: '@rThe reason the room was dark, even though it was still light outside, was because the curtains were closed.'
22419: '@r...There was always one guard waiting in the room, and three more waiting in the corridor and the lobby.'
22420: '@rThey were all there to protect Eva''s person...'
22421: '@rEventually, there was the sound of a knock.'
22422: '@rAlso, there was a message from the intercom that the guest''s body check had been completed with no problems.'
22423: '@rThe door was unlocked, then opened,@|@y@w500. .........and a woman of about high-school age was standing there.'
22424: '@r@v99/GurMA9003."Chairman.@k@v99/GurMA9004. Ange-san has arrived."'
22425: '@rEva reacted and turned her face towards the guest.'
22426: '@rHowever, instead of reacting to the guard''s call, maybe it would be better to say that she reacted to the smell of Ange''s makeup.'
22427: '@r......Having been shut up in this room for so long, Eva was sensitive to small changes in smell.'
22428: 'Eva@r@v05/91000004."........................@k@v05/91000005. So you came.@k@|@y@v05/91000006. ......Ange."'
22429: 'Ange@r@v11/92000001."......Yes, I did.@k@v11/92000002. You did call me."'
22430: '@rOn Eva''s face, you couldn''t find the expression of one warmly welcoming their niece.@k@r...And on Ange''s face, you couldn''t see the expression of one pleased to see their aunt.'
22431: '@rEva waved her arm, which had grown as thin as a withered branch, and motioned for the guard to leave.'
22432: '@rThe guard bowed silently and went out into the hall.'
22433: 'Ange@r@v11/92000003."......It''s not only stuffy, but dark too.@k@v11/92000004. Why don''t you have the curtains opened...?"'
22434: 'Eva@r@v05/91000007."...............And then the hitman you hired will shoot through the window, is that what you''re planning......?"'
22435: 'Ange@r@v11/92000005.".........If it came to that, I''d much rather be the one paid to do the hit.@k@v11/92000006. All I''d have to do is relax at home for a month and the job would take care of itself."'
22436: 'Eva@r@v05/91000008."...Heheheheh, hahhahhahhahha......"'
22437: '@rTheir discussion was quite morbid for an aunt and niece.'
22438: '@r...However, they didn''t look like they were joking.@k@r......At the very least, Eva did believe that someone was after her life.'
22439: '@rAll of the Ushiromiya family''s massive fortune had come into the possession of Ushiromiya Eva.'
22440: '@r...It was said that this fortune also included the ten tons of hidden gold that Ushiromiya Kinzo was rumored to have kept concealed.'
22441: '@rThey could do nothing while this vast wealth was in the hands of the cunning, sly, and extremely suspicious Eva,@k ......but it was rumored that if it passed on to Ange, who was no more than a young girl, certain people were plotting to snatch it away at once.'
22442: '@rBy now, Eva and Ange were Kinzo''s only descendants.@k@r......If Eva died, all of the wealth would go to Ange.'
22443: '@r...And if Ange were to be killed as well,@k ......that wealth would go to the family of Ange''s mother, Kyrie.'
22444: '@rIn this sense, not only Eva, but Ange as well,@k ...was in a position where it wouldn''t be odd at all for her life to be targeted by some unknown person.'
22445: '@r......And Eva had hated Ange for a long time.'
22446: '@rBecause, after losing her precious only son George,@k ......she had learned that the only one who had survived to inherit her own wealth...@kwas Ange, who had been absent from that family conference twelve years ago.'
22447: '@rEva shunned Ange, hated her, even detested her.'
22448: '@rShe isolated Ange in a special school, and separated her from the youth and happiness normal people have, trying to deprive her life of all opportunity.'
22449: '@r......However, Eva had succumbed to an incurable illness,@k and ironically, ...her remaining life was estimated to be the same as Kinzo''s had been at that family conference twelve years earlier...'
22450: '@rBoth Eva and Ange...hated each other.'
22451: '@rEven though they were each other''s last blood relatives, ...they hated each other so much that they hoped the other would die quickly...'
22452: 'Ange@r@v11/92000007.".........And?@k @v11/92000008.Why did you go to all the trouble of calling for me...?"'
22453: 'Eva@r@v05/91000009."......I don''t have much time left.@k@v05/91000010. ......These quack doctors still have no idea what I was poisoned with.@k@v05/91000011. .........But I know.@k@v05/91000012. I''m sure it''s that secret assassination drug, the one that foreign intelligence agency was using."'
22454: 'Eva@r@v05/91000013."...Ooh, I''m going to be killed, I''m going to be killed...!!@k @v05/91000014.Aren''t you lucky, very soon, I will die, and then you will be so relieved...!"'
22455: 'Ange@r@v11/92000009.".................................@k@v11/92000010. ...What a pitiable person."'
22456: '@rThis always happened.@k@r......She immediately deviated from the main topic, distorting it into a more unsettling discussion.'
22457: '@rEva, who was full of suspicion, believed that someone was always after her life.'
22458: '@rIndeed, after inheriting the vast wealth of the Ushiromiya family,@k she had used wild methods just like Kinzo had done in the past, and had repeatedly made money by any means necessary, creating many enemies along the way.'
22459: '@rWith a massive supply of capital, she had launched aggressive takeovers against businesses which were starting to have rapid growth,@k making them buy it back at a high price under the guise of reconciliation.'
22460: '@r......Ironically, it was the same type of action that her husband''s company had been hit with twelve years ago...'
22461: '@rShe had repeated this constantly for the past twelve years.@k@r......She had also earned a lot of hatred.'
22462: '@rIf her husband had heard of this from beyond the grave, he might have defended her, saying that this was because of the loneliness from losing her family.'
22463: '@r......However, no one who knew her now would come to her defense.'
22464: '@rFor some time, Eva waxed eloquent about exactly how her life was being targeted,@k listing off names of people who likely held hatred for her,@k and sneering at the fact that she still hadn''t been killed.'
22465: '@rEven when Ange heard her own name included in that list,@k her expression did not change significantly, and she waited indifferently for Eva to tire herself out...'
22466: 'Eva@r@v05/91000015.".........You know what?@v05/91000016. ............I really hate...@k@v05/91000017.you."'
22467: 'Ange@r@v11/92000011."I''m honored.@k@v11/92000012. Same here."'
22468: 'Eva@r@v05/91000018.".........I built this future for George''s sake.@k@v05/91000019. ......To think that it would be snatched away by you.@k@v05/91000020. ...To think that it would be stolen by Rudolf''s daughter...@k@v05/91000021. .........I can''t bear it.@k@v05/91000022. ......To think that not only will I not leave a child,@v05/91000023. ...but even my fortune will be stolen,@v05/91000024. .........that, to me, is just...@v05/91000025....unforgivable............!"'
22469: 'Ange@r@v11/92000013."......In that case, why don''t you give all of your fortune to charity?@k @v11/92000014.What happened to all those religious people you''ve requested so many times?"'
22470: 'Eva@r@v05/91000026."............*cackle*cackle*cackle*!@k @v05/91000027.They all say the same thing.@k@v05/91000028. ...My excessive wealth has become a burden to me.@k@v05/91000029. They always say something about how I need to give it up and cleanse myself.@k@v05/91000030. ......Ahhahahahahahahahaha!@k @v05/91000031.And then the idea came to me.@k@v05/91000032. To stop donating!"'
22471: '@rFor a time, Eva had invited in the founders of several strange new religious cults, perhaps looking for peace in her heart.'
22472: '@r...But in the end, they did not give her heart any relief,@k and only further increased her suspicion...'
22473: 'Ange@r@v11/92000015.".........If you''ve got money to burn, why don''t you start buying up thoroughbreds and make some corned beef?"'
22474: 'Eva@r@v05/91000033."I''ve thought of something even more interesting.@k@v05/91000034. ......*cackle*cackle*cackle*cackle*!@k @v05/91000035.I''ve racked my brains over it a lot.@k@v05/91000036. What could I do to make things horrible for you?"'
22475: 'Eva@r@v05/91000037."......I thought about just killing you.@k@v05/91000038. I also thought about erasing all of my wealth, leaving you penniless, and kicking you out of the Ushiromiya family or something."'
22476: 'Eva@r@v05/91000039."Wouldn''t that be wonderful?@k @v05/91000040.A lady brought up prim and proper, made to crawl around and prowl for moldy bread and muddy water.@k@v05/91000041. Aaah, that too would be truly glorious,@v05/91000042.@|@y *cackle*cackle*cackle*cackle*!!"'
22477: 'Ange@r@v11/92000016."............Having fun?"'
22478: 'Eva@r@v05/91000043."Oh, yes.@k@v05/91000044. It''s fun to scare you...@k@v05/91000045. ......But very soon, I will die.@k@v05/91000046. ...So I thought about how I can continue to cause you pain even after I die."'
22479: 'Eva@r@v05/91000047.".........And then, ......*cackle*cackle*!@k @v05/91000048.It was surprisingly simple.@k@v05/91000049. ......I called you because I wanted to tell you about it."'
22480: 'Ange@r@v11/92000017.".....................I have midterms coming up.@k@v11/92000018. Keep it brief."'
22481: 'Eva@r@v05/91000050."...I have decided.@k@|@y@v05/91000051. I will have you inherit all of my fortune."'
22482: 'Ange@r@v11/92000019.".................................@k@v11/92000020. ...Huh."'
22483: 'Eva@r@v05/91000052."Not only that,@v05/91000053. ......I decided that until the very day that I die,@v05/91000054. ...I''ll increase that fortune as much as I can, inflate it to massive proportions and have you inherit all of it.@k@v05/91000055. ...*cackle*cackle*, can you even imagine what that would be like...?"'
22484: 'Ange@r@v11/92000021."......No idea.@k@v11/92000022. Because I''m stupid."'
22485: 'Eva@r@v05/91000056."Ehhehhehheh, *cackle*cackle*cackle*cackle*!!@k @v05/91000057.No, you wouldn''t have any idea, would you...!@k @v05/91000058.Look forward to it, it really is fun, being rich...!@k @v05/91000059.Every day, from morning till night, monsters from across Japan will come to play."'
22486: 'Eva@r@v05/91000060."From now on, your entire private life will be followed by talk shows and weekly magazines.@k@v05/91000061. The media criticize me no matter what I do or don''t do!@k @v05/91000062.If I donate, they''ll attack me as a bourgeois, and if I begrudge them that money, I''ll be abused as a miser."'
22487: 'Eva@r@v05/91000063."Oh, every day really is wonderful, you see?@k @v05/91000064.I realized that I would love to invite you to that kind of life, when you are so young and have so much ahead of you.@k@v05/91000065. Isn''t that just to die for?"'
22488: 'Ange@r@v11/92000023.".........The public is right in its criticism of all that you''ve done."'
22489: 'Eva@r@v05/91000066."*cackle*cackle*cackle*!!@k @v05/91000067.Yes, yes, I''m sure that they are.@k@v05/91000068. ...Go ahead, insult me as much as you want.@k@v05/91000069. And then you will be burdened with that criticism."'
22490: 'Eva@r@v05/91000070."......Japanese culture says that good people live in honorable poverty, while the wealthy should die.@k@v05/91000071. No matter what you do or do not do, you will eventually be held up as a symbol of envy and hate from across Japan."'
22491: 'Eva@r@v05/91000072."...*cackle*cackle*cackle*!@k @v05/91000073.I wonder how twisted your life will become after living this way...?"'
22492: 'Eva@r@v05/91000074."You will have no allies!@k @v05/91000075.No one will listen to your worries.@k@v05/91000076. Insulting you will become a public sport.@k@v05/91000077. And no one can stop that!"'
22493: 'Eva@r@v05/91000078."Oh, Ange!@k @v05/91000079.Ehheheheheheh,@v05/91000080. oh, I''m really looking forward to it.@k@v05/91000081. ...I wonder how you will live your life, and how you''ll end it...!@k @v05/91000082.Relish your life of being unable to trust anyone in the world, love anyone, or talk with anyone...!!"'
22494: 'Eva@r@v05/91000083."I''ll be patiently waiting for you in hell, waiting for you to come falling down, bringing that story of hardship with you.@k@v05/91000084. Heheheheh,@v05/91000085. ahahhahahahahahahaha,@v05/91000086. waah-hah-hah-hah-hah-hah-hah-hah-hah,@v05/91000087. ghhkk,@|@y@v05/91000088. *cough*cough*,@|@y@v05/91000089. ghah!!"'
22495: '@rHer insane laughter turned into a painful cough.'
22496: '@rWithout changing her expression in the slightest, looking completely unconcerned,@w583. ......Ange stared at the only survivor of Rokkenjima.'
22497: '@rPerhaps because he found the violent coughing odd, the guard flew in as he gave a short knock on the door.'
22498: '@rAnge glanced at him, wordlessly showing that she hadn''t moved a step from where she had been.'
22499: '@r......Ange was prepared for some kind of trap to frame her in Eva''s death.@k However, that was fortunately a needless anxiety.'
22500: '@rAs the guard rubbed Eva''s back, he poured hot water from a thermos into a mug.'
22501: '@rAs he did, Eva kept coughing, looking like she was in pain.'
22502: '@rAnge thought that this was probably the final form of the witch of Rokkenjima, and the last she would be able to see.'
22503: '@rEventually, Eva was able to moisten her throat and regain her normal breathing.@k@r...However, the glittering madness inside her eyes hadn''t subsided in the slightest.'
22504: 'Eva@r@v05/91000090."*cackle*cackle*cackle*cackle*cackle*cackle*cackle*!!@k @v05/91000091.That cursed mass of gold and the inheritance of the Ushiromiya headship,@k@v05/91000092. ......as well as...@v05/91000093..........the name of the Golden Witch, BEATRICE...@v05/91000094.are now yours.@k@v05/91000095. ............Enjoy your insane, twisted life fitting for the name of the witch...!"'
22505: 'Ange@r@v11/92000024."I don''t care about those.@k@v11/92000025. Enough of that, just tell me this.@k@v11/92000026. ......What happened on Rokkenjima that day?@k@v11/92000027. .........I don''t believe that there was an accident.@k@v11/92000028. Tell me the truth about what happened that day, and why Mom and Dad and Nii-san died......!!"'
22506: 'Eva@r@v05/91000096."*cackle*cackle*...!@k @v05/91000097.Oh, that must be the best way to harass you, mustn''t it?@k @v05/91000098.......What happened on that day?@k @v05/91000099.What happened on this very day in 1986...?@k @v05/91000100.......You want to know what they said before they died, ......don''t youuuu...?"'
22507: 'Eva@r@v05/91000101."I woOOn''t tell yooOOOoouu,@v05/91000102.@|@y aaahhhyahhyahhyahhyah!!@k @v05/91000103.I''ll leave behind the cursed gold!@k @v05/91000104.But you know what? I''ll take the truth you desire with me to hell...!@k @v05/91000105.That''s the best way I can harass you!!"'
22508: 'Eva@r@v05/91000106."Upset?@k @v05/91000107.If you want to hear, try going to hell and asking your family there!@k @v05/91000108.In that case, you better die right now, right?!@k @|@y@v05/91000109.Ahhahahahahaha, why don''t you just give up and die now and foreverrr?!@k @|@y@v05/91000110.Waaahhah-hah-hah-hah-hah-hah-hah-hah-hah-hah-hah-hah-hah-hah-hah-hah-hah-hah!!"'
22509: '@rThat laugh continued until she started coughing again.'
22510: '@rAnd that cough did not subside until she started moaning and going into convulsions......'
22511: '@rOctober 4th, 1986.'
22512: '@rOn Rokkenjima, the Ushiromiya family''s customary and final family conference was held.'
22513: '@rAnd on the next day, October 5th...'
22514: '@ran "extremely unfortunate accident" occurred, and the Ushiromiya family was wiped out.'
22515: '@r"As good luck would have it", Ushiromiya Eva escaped from that,@k and succeeded almost all of the Ushiromiya family''s fortune.'
22516: '@rHowever, due to the many turbulent rumors surrounding the Ushiromiya family, the way Eva acted afterwards,@k and her unnatural actions at the time of the "unfortunate accident", there was public controversy over whether this might have been a plot to get all of the inheritance for herself.'
22517: '@rUnder pressure from the public, prosecutors attempted numerous investigations,@k and the media began tracing the outline of the murder plot under the name of the Rokkenjima Suspicion,@k but in the end, they were not able to find sufficient proof that this "unfortunate accident" was a crime.'
22518: '@rHowever, because the media continued to give the impression that the Rokkenjima Suspicion was a murder plot by Eva,@k public opinion began to believe that she was the true culprit.'
22519: '@r...Of course, all that easily condemnable overbearing financial activity which she had carried out using that vast wealth...@kleft a bad impression that only made matters worse.'
22520: '@rEvery time she did something and the rumors started spreading, the talk shows would bring back the Rokkenjima Suspicion,@k blaming the justice system by saying that she was the true culprit, and that the only reason that she hadn''t been arrested was because even the police had been bribed.'
22521: '@rAnd the impression that she was an evil criminal grew stronger and stronger...'
22522: '@rHer heart eventually degenerated,@w583. ...and ironically, it began to transfigure her into the kind of human that the public expected...'
22523: '@rBy now, Eva had no one she trusted, and no family.'
22524: '@r......Her beloved husband, Hideyoshi, was already no more, and the talk shows would occasionally mention his company,@k saying that it was run recklessly, while criticizing and disgracing its former accomplishments.'
22525: '@rEven her beloved son, George,@k was dramatized as the stereotypical "rich, lazy son" that the public expected,@k ...and no one even attempted to find out what a simple and honest character he had possessed.'
22526: '@r...As to how much all of this hurt Eva and ran her to ruin, ...no one was interested.'
22527: '@rThe public was only interested in the idea of an evil woman who had gone so far as to kill her whole family to become a multimillionaire,@k and in what kind of pitiful final years she would lead.'
22528: '@rSo she changed more and more,@k ...until eventually...@k@r...Eva''s personality was transfigured to the point that she was treated as a lunatic......'
22529: '@rIt was said that she sometimes remembered that this was exactly the same way her father Kinzo, who she had once admired, had been in his later years,@k and laughed at herself with scorn...'
22530: '@rAnd, on the day of that final family conference...'
22531: '@rBecause Ushiromiya Rudolf''s daughter, Ange, had been sick and had stayed with her mother''s family, she had not participated.'
22532: '@rAt the age of six, she lost her family and gained Eva as her guardian.'
22533: '@rSince Ange had become Eva''s only blood relative,@k Eva "took very good care of her".'
22534: '@rShe had imposing guards always surrounding Ange''s person, to prevent her from coming to harm.'
22535: '@r......Ange had even her right to play with friends, to come home from school together, and to enjoy the seasons together...stolen.'
22536: '@r"So that she can live a full and pleasant school life",@k Eva sent Ange to an elegant boarding school which took care of her every need, completely isolating her from the world.'
22537: '@rShe didn''t even know the popular songs that girls her age might hum.'
22538: '@rShe was never once given a chance to enjoy window shopping with her friends, or stuff her mouth with crepes,@k ...much less an encounter with a member of the opposite sex to make her heart throb.'
22539: '@rAnge did not have a single friend.@k If anyone carelessly acted friendly with Ange, they would be scolded by the guards, or else the teachers.'
22540: '@r......All of them were strictly ordered not to let the peasants approach the daughter of the esteemed Ushiromiya family.'
22541: '@rDuring that time, the talk shows were always talking about Ushiromiya Eva, and always spreading rumors about her many financial evil deeds.'
22542: '@r......Those who found out that she was her "daughter" naturally began to keep their distance.'
22543: '@r...Even now, she was called a witch at school, and any time something adverse happened,@k it was baselessly whispered as truth that the school was operating according to her wishes, and that she had something to do with it.'
22544: '@rThe environment makes the person.@k@rBy now, she had a heart as hardened as those around her feared.'
22545: '@r...She trusted no one, and didn''t even try.@k@rShe loved no one, and didn''t even try.'
22546: '@rAnd on top of all of this, when Eva caught an incurable illness,@k it was whispered that this too had been planned, and this time, Ange was set up as the mastermind...'
22547: '@rEveryone whispered that the daughter of a witch was a witch.@k@rEven the talk shows and the weekly magazines whispered that.'
22548: '@r...So Ange, too,@w500. because of that,@w416. no,@w416. as though it might as well be true, accepted it.'
22549: '@rTherefore, since she already believed that she was a witch,@k when she heard that the name of the Golden Witch was being turned over to her, she felt nothing if not completely unfazed.'
22550: '@rHowever, she was at least sure of one thing.'
22551: '@rThis title of witch that she had inherited would definitely never be inherited by anyone else.'
22552: '@rShe would be the last head of the Ushiromiya family, and the last, isolated, Golden Witch......'
22553: '@rAnge could be seen on the roof of a skyscraper.'
22554: '@rCompared to the winds of the world which had beaten down upon her until now, this strong, cold wind was warm and pleasant.'
22555: '@rBelow her lay a beautiful nighttime scene, and a dazzling river of red and white lights.'
22556: '@rIt was a clear sky tonight.@k ...So there really should have been countless stars stretching out over the sky.@k ...However, the light from the ground was so bright, you couldn''t see them at all.'
22557: '@r...Ange couldn''t help but think that what she really sought lay somewhere in that unseen starlight.'
22558: '@rThe world of reality below her looked so far away from here.'
22559: '@r...This place felt to her as the closest to the world she should really be in.'
22560: '@r............There was only one thing that Ange cursed:'
22561: '@rWhy had I not been able to go to that family conference, on that day twelve years ago?'
22562: '@rIf I had gone, I would probably have been able to be with my family forever.'
22563: '@r...Recently, ...I''ve been having a dream about my family, over and over again.'
22564: '@rMy self of twelve years ago calls out frantically, urging them not to go to the family conference.'
22565: '@rBut both Mom and Dad are too far away, and my hand won''t reach them.'
22566: '@rI reach for the hand of Battler nii-san, who always really loved me - for the hand that would always pat my head - '
22567: '@r.........but even though it looks like it''s so close to reaching, even that falls short.'
22568: '@rFor some reason, I started having that dream over and over again.'
22569: '@r......Whenever I have that dream,@k I repeat my useless effort inside the dream, trying to stretch out my hand even more forcefully.'
22570: '@rIf only Battler nii-san at least could have lived...'
22571: '@r.........then perhaps, at least the two of us could have supported each other through life in this cold and lonely reality.'
22572: '@rBut his hand never reaches me.'
22573: '@rSo even if I climb to the roof of a building as tall as this one,@w500. ......I am distantly separated from all of them.'
22574: '@r......A mysterious girl appears in my dreams and urges me.'
22575: '@rThat girl in my dreams urges me to arrive at the truth of what happened twelve years ago.'
22576: 'Ange@r@v11/92000029."........................@k@v11/92000030. ......If I could learn...@v11/92000031.what happened to Dad and everyone else on that day,@v11/92000032. ............would they come back?@k @v11/92000033.At least one of them...!"'
22577: '@rThere was no way...@w500....that anyone existed who could answer those words.'
22578: '@rI understand.@k .........In this world, I have no family, no friends, no one.'
22579: '@rSo,@w500. ............let''s go.@k ...Let''s go home.@k@r......To where my family is.'
22580: '@rFrom the beginning, ...Ange''s figure had been on the far side of the fence.'
22581: '@rThe scenery below her eyes was distant, beautiful, and so fantastical that it did not give rise to the slightest bit of fear.'
22582: '@rIf I face down, I''ll surely be taken to the world below.'
22583: '@r......So I faced up.'
