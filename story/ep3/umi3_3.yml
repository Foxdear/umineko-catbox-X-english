15606: '@rWithout even being allowed to wait for dessert, we were chased out of the room.'
15607: '@rI heard that, in the end, our parents were unable to get Grandfather to respond.'
15608: '@r...Well, I''m not sure I should be saying this, but I feel like Grandfather deserves a pat on the back.'
15609: '@rHe had to be feeling pretty satisfied with the shock his strange letter had given to his children, who had all been so infatuated with distributing the inheritance while he was still alive.'
15610: '@rI too felt like our despicable parents had gotten what they deserved in all of this confusion.'
15611: '@r......But I couldn''t really say that I was feeling great.@k@rI felt all sulky.'
15612: '@rGrandfather hadn''t entertained them for a moment, but he also apparently hadn''t denied anything about the letter.'
15613: '@rGrandfather''s name pops up several times in the witch''s letter.'
15614: '@rIf Grandfather knew that someone was stealing his name, then considering his character, he would probably be mad with rage.'
15615: '@rBut even though Grandfather now knew the contents of that letter, he had coolly ignored it.'
15616: '@rIn this case, did that count as a silent yes?'
15617: '@rAuntie Eva and Dad had been trying to interpret the letter in their favor, their greed clearly visible.'
15618: '@rIt wouldn''t have mattered so much if that was all, but the adults had then started focusing on Maria, who had received the letter.@k They kept pounding her with questions about who had given her that letter.'
15619: '@rMaria repeated over and over again that she had gotten it from BEATRICE, but there was no way a mysterious person like that could be mixed in with the others on this island.'
15620: '@r...After all, this is a small island where no one lives except the Ushiromiya family.'
15621: '@rMaria kept repeating that she had gotten it from BEATRICE, no matter how many times she was asked.'
15622: '@rIt seemed that the adults felt that she was trying to trick them, so they didn''t hold back, and questioned her until she broke out in tears...'
15623: '@rBy the time Maria was released, she had cried herself to the point of exhaustion.'
15624: '@rOur parents ordered us to go to the guesthouse and take Maria with us,@k then shut themselves up in the dining hall, and started getting louder and louder as they discussed the inheritance.'
15625: '@rIt seemed that, because of that strange letter, the possibility had arisen that Uncle Krauss''s ability to become the next head could be returned to a blank slate,@k and in exchange for accepting him, my dad and the rest were trying to swindle Uncle Krauss out of a lot of money...or something like that.'
15626: '@rJessica and I, both astonished, were happy to move over to the guesthouse.'
15627: '@rWe didn''t want to be under the same roof as those filthy adults, their heads so filled with thoughts about money.'
15628: '@rGeorge-aniki pleaded on behalf of our parents, saying that he wanted us to understand them.'
15629: '@r...I understood his reasoning.@k No matter how filthy this talk of money was, it wouldn''t go away if you just closed your eyes to it.'
15630: '@rBut even so, how could they so blatantly degenerate into such money-grubbing demons...'
15631: '@rMaria had cried herself dry, and was hiding in her bed.@k She hadn''t even twitched for a while, so she was probably sleeping...'
15632: 'George@r@v07/30300041.".........Who in the world gave that letter to Maria-chan?"'
15633: 'Jessica@r@v04/30200086."George nii-san.@k@v04/30200087. You mustn''t ask that anymore.@k@v04/30200088. If Maria says she got it from BEATRICE, can''t we just leave it at that...?"'
15634: 'Battler@r@v10/30100172."I mean, we don''t want to make her cry any more than this."'
15635: '@r......That said.@k Even we felt a confusion that we couldn''t clear away.'
15636: 'George@r@v07/30300042."There are only 18 people on this island now.@k@v07/30300043. The thought that, in the middle of all this rain, an unknown 19th person gave Maria-chan that letter, and is now hiding somewhere,@k@v07/30300044. honestly doesn''t seem realistic at all."'
15637: 'Jessica@r@v04/30200089."Probably...Shannon or someone put on the dress from that portrait, and skillfully planned this ahead of time with Maria."'
15638: 'Jessica@r@v04/30200090."...Although of course, as soon as Maria saw that dress, that might have been enough on its own to convince her that it was BEATRICE."'
15639: 'Battler@r@v10/30100173."Maybe it doesn''t really matter who handed her the letter.@k@v10/30100174. The important thing is who sent it."'
15640: 'Battler@r@v10/30100175."...The point is that Grandfather wanted to cause an uproar by assuming the name of the witch.@k@v10/30100176. Seriously, that old geezer''s good at riling people up."'
15641: '@rThe truth was probably that our occult-loving Grandfather was playing around,@k by choosing a dramatic way of handing the letter over to Maria, who shared the same hobby as he did.'
15642: '@r......Paying no heed, though, to the trouble it would cause Maria, or the rest of us.'
15643: 'Battler@r@v10/30100177."Seriously. Messing around with Maria''s pure heart...@k@v10/30100178. It doesn''t matter who handed the letter over.@k@|@y@v10/30100179. Maria says that she got it from BEATRICE, so let''s treat it that way."'
15644: 'George@r@v07/30300045."I agree.@k@v07/30300046. Let''s do that.@k@v07/30300047. To Maria-chan, BEATRICE is kinda like what Santa Claus is to most kids."'
15645: 'Battler@r@v10/30100180."Whether it be a non-existent 19th person or Santa Claus,@k@v10/30100181. as long as we accept that they exist, they will at least "exist" inside Maria.@k@v10/30100182. ...I see, it''s important to lie to a child to protect their dreams."'
15646: 'Battler@r@v10/30100183."............Hmm?@k @v10/30100184.What''s up, Jessica?@k@v10/30100185. Are you still angry?"'
15647: '@rJessica had her hand on her chin, as though there was something that she just couldn''t understand.'
15648: '@rWhen I called out to her, she came to her senses.'
15649: 'Jessica@r@v04/30200091."Aah, ......sorry.@k@v04/30200092. Well, ......actually,@k@v04/30200093. ......I was wondering if it was possible that Maria actually met BEATRICE."'
15650: 'Battler@r@v10/30100185_1."...What do you mean by that?@k@v10/30100185_2. Are you saying that there''s a 19th person on this island?"'
15651: 'George@r@v07/30300050."If we take what Maria-chan said to heart, then we do arrive at that answer."'
15652: 'Jessica@r@v04/30200094."No, that''s not what I mean.@k@|@y@v04/30200095. ......I''m talking about the story that someone we don''t know has been living on this island since long ago."'
15653: 'Battler@r@v10/30100186."Living, you say. Where?"'
15654: 'Jessica@r@v04/30200096."...In the forest."'
15655: '@rThe adults were gathered in the dining hall, spending a very long time continuing the discussion that had been started by BEATRICE''s letter...'
15656: '@rKrauss strongly claimed that the letter was a simple prank,@k but he couldn''t overturn the claim that Kinzo''s failure to deny the letter was answer enough.'
15657: '@rJudging by Kinzo''s character, if he knew that a letter had been written by someone else in his name, he would be mad with rage.'
15658: '@rSince all of the siblings knew that, Krauss had no choice but to withdraw his claim.'
15659: '@rWithout even having to summarize it, the contents of the letter were simple.'
15660: '@rThe person who solved the witch''s epitaph would receive the headship and assets.'
15661: '@rThis did a lot of damage to Krauss, who was thought to have been guaranteed the succession,@k and for everyone else, who had given up on that long ago, it was better news than they could ever have hoped for.'
15662: '@rHowever, there were some points that worried them.'
15663: '@r"The person who solved the epitaph" was not limited to a member of the Ushiromiya family.'
15664: '@rTaken literally, anyone, no matter how doubtful their origin, could succeed to the Ushiromiya family.'
15665: '@rAnd furthermore, this meant there was a chance that all of the Ushiromiya family''s assets could be stolen by some unknown person.'
15666: '@rIn that sense, it was definitely not a situation where anyone could lower their guard, even the siblings other than Krauss.'
15667: '@rHad this letter come from a saboteur sent by Kinzo who called themselves BEATRICE?@k ...Or was this the scheme of some unknown person trying to steal the Ushiromiya family''s wealth?@k They still didn''t know the truth.'
15668: '@r...But they could say one thing for certain.'
15669: '@rMaria had received this problematic letter...@w500.today,@w666. on this island.'
15670: '@rIn other words, someone who was planning something related to that letter was on this island today.'
15671: '@r......Was the person who set it up Kinzo, one of the four siblings,@k or maybe some unknown person?'
15672: '@rNo matter how much they suspected each other, they couldn''t reach a conclusion.'
15673: '@rAfter getting tired of bickering with each other,@k they finally reached the extremely obvious conclusion that doubting each other was just a waste of time...'
15674: 'Krauss@r@v02/30800079."......We''ve made no progress.@k@v02/30800080. We''ve just been wasting time."'
15675: 'Eva@r@v05/31000158."That''s right.@k@v05/31000159. Now that you realized it, we won''t have to waste so much."'
15676: 'Natsuhi@r@v03/30900008."It is not certain that Father is the one who sent the letter.@k@v03/30900009. My husband has merely had enough of you being unable to hold a conversation."'
15677: 'Eva@r@v05/31000160."Which one of us can''t hold a conversation?@k @v05/31000161.You keep yelling at me every time I say something.@k@v05/31000162. Do you truly think that such shameful behavior is fitting for a member of the Ushiromiya family?"'
15678: 'Hideyoshi@r@v06/31100090."Give it a rest, Eva.@k@v06/31100091. You too, Natsuhi-san.@k@v06/31100092. That topic''s finished for now."'
15679: 'Rosa@r@v12/31400009."Sh-shall we all cool our heads off for now?@k @v12/31400010.Let''s have some cool drinks brought over."'
15680: 'Kyrie@r@v09/31300023."That sounds good.@k@v09/31300024. It would probably be wiser if we cooled our heads.@k@v09/31300025. Baby, don''t you want to go for a smoke, too?"'
15681: 'Rudolf@r@v08/31200048."...Aneki looks like she''s in a bad mood.@k@v08/31200049. So I''ll pass on that smoke.@k@|@y@v08/31200050. But I agree about the cool drinks.@k@v08/31200051. Rosa, have someone bring some water.@k@v08/31200052. A whole pitcher."'
15682: 'Rosa@r@v12/31400011."Alright..."'
15683: '@rRosa headed over to the extension telephone in the corner of the room and called the servant room.@k She then passed on what Rudolf had told her to the person on the other end.'
15684: '@rThe vicious bickering up until now vanished like it had never happened.@k@rThat silence continued until Gohda finished setting the table and retreated from the room...'
15685: 'Gohda@r@v17/31700009.".........Is there anything else that you require?"'
15686: 'Natsuhi@r@v03/30900010."No.@k@v03/30900011. Please leave us."'
15687: 'Gohda@r@v17/31700010."Yes.@k@v17/31700011. ...Then if you will excuse me.@k@v17/31700012. If you need anything, call me at any time."'
15688: '@rAfter listening to the sound of Gohda''s footsteps disappear off into the distance, everyone took a deep breath at the same time to break the tension.'
15689: 'Kyrie@r@v09/31300026."...It sure is raining hard.@k@v09/31300027. I wonder if our witch, this 19th person, is taking shelter in the arbor in the rose garden about now?"'
15690: 'Rosa@r@v12/31400012."...I wonder.@k@|@y@v12/31400013. ......They might be able to avoid the rain, but it would be quite cold."'
15691: 'Hideyoshi@r@v06/31100093.".........A mysterious 19th visitor.@k@v06/31100094. Sounds pretty interestin'', just like a mystery novel.@k@|@y@v06/31100095. Normally, in that kind of story, it''s a safe bet that the person doesn''t exist, that one of us 18 would be fakin'' it."'
15692: 'Natsuhi@r@v03/30900012."...I suspect Genji and the others.@k@|@y@v03/30900013. We should have found any excuse we could to dismiss all of the servants of the One-winged Eagle."'
15693: 'Krauss@r@v02/30800081."Come now, don''t say that.@k@v02/30800082. We must be grateful for their long years of service.@k@|@y@v02/30800083. ...Of course, we can''t let our guard down."'
15694: 'Eva@r@v05/31000163."So, then, you also agree that whether or not Father was behind this,@k@v05/31000164. the person who handed Maria-chan the letter was a servant?"'
15695: 'Krauss@r@v02/30800084."Indeed.@k@v02/30800085. After all, we were all being "friendly" in our big happy circle the whole time until dinner, weren''t we?@k@v02/30800086. All of us siblings have alibis.@k@v02/30800087. Only a servant could have handed Maria that letter."'
15696: 'Rosa@r@v12/31400014."...But all of the servants...@k@v12/31400015.said that they were too busy with the bed-making to have any spare time during which they could have gone to Maria in the rose garden...@k@|@y@v12/31400016. ....................."'
15697: 'Rudolf@r@v08/31200053."Hey hey, what are you trying to say then?@k@v08/31200054. You aren''t saying that the witch of the forest BEATRICE-sama came over and actually handed Maria-chan that letter, are you?"'
15698: 'Eva@r@v05/31000165."Ahahaha.@k@v05/31000166. Rosa, you used to believe so much that it really frightened you, right?@k @|@y@v05/31000167.You don''t mean to say that you still believe at this age?@k @v05/31000168.The witch of the forest."'
15699: '@r......If she did exist, I''d love for her to appear.@k@rBut no matter how much I wished, she didn''t appear before me even once.@k She didn''t save me from my crisis...'
15700: 'Rosa@r@v12/31400017."O-of course not...@k@v12/31400018. I just thought that since all 18 of us said that we didn''t do it, there might really be a 19th person..."'
15701: 'Hideyoshi@r@v06/31100096."That can''t be. In the first place, we were the only ones who came on that boat.@k@v06/31100097. We didn''t see any mysterious stranger ridin'' with us.@k@|@y@v06/31100098. You don''t think that they might have swam across this rough sea, right?@k @v06/31100099.I can''t really imagine that.@k@v06/31100100. Wahahahahahaha."'
15702: 'Kyrie@r@v09/31300028."......Logically that''s true.@k@v09/31300029. It is difficult to imagine that there''s a single hidden and uninvited guest on this isolated island...@k@|@y@v09/31300030. ...However,@k@v09/31300031. .........it looks like some of us still can''t bring themselves to discard that possibility entirely, doesn''t it?"'
15703: '@rHideyoshi had laughed it off, saying that there couldn''t be a 19th person,@k but Kyrie had sensitively picked up on the delicate atmosphere among the four siblings.'
15704: '@rJust by common sense, there couldn''t possibly be any uninvited guests on this small, isolated island.'
15705: '@rHow on earth would they get here, and from where, and where would they be hiding themselves?@k@rAnd why wouldn''t they appear openly, even though they had sent a letter in their own name?@k ...None of these could be explained.'
15706: '@rBut considering that none of the four siblings had joined in on Hideyoshi''s laughing,@k they seemed unable to completely deny in their hearts the possibility of a 19th person...'
15707: 'Krauss@r@v02/30800088."Kyrie-san.@k@v02/30800089. I would like to make this clear: we don''t remotely believe in that fairytale about the legend of the witch."'
15708: 'Natsuhi@r@v03/30900014."......Another topic to insult Father, is it?@k@v03/30900015. Simply mentioning that is a betrayal against him."'
15709: 'Eva@r@v05/31000169."*giggle*giggle*.@k@v05/31000170. Well, yes.@k@|@y@v05/31000171. ......However, this is Father we''re talking about.@k@v05/31000172. It is possible that he......you know...?"'
15710: 'Rosa@r@v12/31400019."...............I, ...I don''t know anything......"'
15711: 'Hideyoshi@r@v06/31100101."What''s this, what''s this?@k@v06/31100102. Why''s everyone gotten so gloomy...?@k@v06/31100103. What are you talkin'' about?"'
15712: 'Hideyoshi@r@v06/31100104."...You''re sayin''...the legend of the witch isn''t a joke, ...but a fact?@k @v06/31100105.That''s ridiculous!"'
15713: 'Rudolf@r@v08/31200055."Hahahaha.@k@v08/31200056. Of course, nobody believes in some witch riding a broom and flying in the sky.@k@|@y@v08/31200057. ......But, the woman in that portrait,@k@v08/31200058. ...BEATRICE, may really have existed on this island."'
15714: 'Kyrie@r@v09/31300032.".........Hideyoshi-san,@k@v09/31300033. it looks like we aren''t talking about a witch, but something a little simpler.@k@|@y@v09/31300034. ...Let me see if I have this correct."'
15715: 'Kyrie@r@v09/31300035."You all suspect that Father had a mistress named BEATRICE living in secret somewhere on this island.@k@v09/31300036. ......Is it something like that?"'
15716: 'Natsuhi@r@v03/30900016."Father is a paragon of a man, a model of self-discipline and restraint!@k @v03/30900017.It is completely inconceivable that he would bring something so filthy onto this island...!"'
15717: '@rNatsuhi snapped at her immediately, but it looked like the four siblings, including her husband Krauss, didn''t think that way.'
15718: '@r...On the contrary, it appeared that they thought Kinzo was exactly the kind of person likely to attempt such a stunt.'
15719: '@rThe existence of a mistress who had Kinzo under her spell...@khad been whispered of since the very beginning, when he had built the mansion on this island......'
15720: 'Rudolf@r@v08/31200059."......I''m sorry, Natsuhi-san, I know how much you respect Dad, but that rumor''s been around for a long time.@k@v08/31200060. Dad prepared this island by himself, and built everything."'
15721: 'Rudolf@r@v08/31200061."...It''s been suspected from the beginning that this mansion might have some hidden tricks or secret rooms known only to Dad,@k@v08/31200062. and it''s also always been whispered that hidden somewhere on this island, there might be a secret mansion none of us know about."'
15722: 'Kyrie@r@v09/31300037."Yes, it has.@k@v09/31300038. This island might look small on a map, ...but it''s quite large for just the Ushiromiya family to live on."'
15723: 'Kyrie@r@v09/31300039."......So people have wondered whether he might have built a secret mansion somewhere in the uncivilized forest for his mistress to live in?@k @v09/31300040.That''s a rather large-scale story."'
15724: 'Rudolf@r@v08/31200063."In the beginning, we used to say that it might be somewhere inside this mansion.@k@v08/31200064. ......That there might be a hidden basement, with a fabulous hidden room, where the witch in that portrait was secretly hiding."'
15725: 'Rudolf@r@v08/31200065."...After seeing that intricate auto-lock on Dad''s study, it isn''t too hard to imagine, right?"'
15726: 'Krauss@r@v02/30800090."......Indeed, Father did spread the rumor that he hid a large amount of gold in some secret place, protected by some secret mechanism.@k@v02/30800091. It would not surprise me to find there existed some hidden room inside this very mansion that none of us knows about yet."'
15727: 'Eva@r@v05/31000173."When Mother was alive, she would often scour the entire mansion searching for it when Father was absent.@k@v05/31000174. ......Mother also suspected what Rudolf just said.@k@v05/31000175. She believed that there was a hidden door or stairway somewhere, and that his blonde-haired mistress was hidden behind it."'
15728: '@rIt''s hard to believe, but there are some actual examples in other countries of people cheating with someone over a period of several decades by making them live in a hidden attic room.'
15729: '@rAnd this was Kinzo, with a mansion this extravagant.@k@r......There was endless opportunity to suspect the existence of hidden rooms...'
15730: 'Kyrie@r@v09/31300041."The legend of the Rokkenjima witch,@k@v09/31300042. ...from what I''d heard, it was just a fairy tale made up to prevent children from entering the uncivilized forest by scaring them.@k@v09/31300043. ...But it''s starting to sound like there''s a little more to the story."'
15731: 'Rudolf@r@v08/31200066."Well, yeah.@k@v08/31200067. As you know, this is a lonely island without anything but the Ushiromiya mansion on it."'
15732: 'Rudolf@r@v08/31200068."When Rosa and I were little brats, on stormy nights, we were so scared by the sound of rustling trees we could hear from the forest.@k@v08/31200069. We had this crazy delusion that something weird might be looking out at us from between those trees.@k@v08/31200070. It''s only natural for any brat to think something like that."'
15733: 'Rudolf@r@v08/31200071."...But some people heard Rosa and me making those claims, and weren''t happy to dismiss it as a kid''s delusion.@k@v08/31200072. ...Isn''t that right, Aneki?"'
15734: 'Eva@r@v05/31000176.".........Yes.@k@v05/31000177. Nii-san and I thought that by coincidence you might have spotted Father''s mistress, who had been living in secrecy on this island, as she went out for a walk when no one was looking.@k@v05/31000178. Of course, Mother did too."'
15735: 'Krauss@r@v02/30800092."...Among the older servants too, you often heard that ghost story about how the witch of the portrait wanders around the mansion at midnight.@k@v02/30800093. Outwardly, I laughed that off as just a ghost story, but on the inside, I suspected very much that it referred to the existence of a hidden mistress."'
15736: 'Hideyoshi@r@v06/31100106."In that case, .........you''re sayin'' that the existence of a 19th person...@k@v06/31100107.might not be completely ridiculous?@k@v06/31100108. ...That they might actually be somewhere around here......?"'
15737: 'Kyrie@r@v09/31300044.".........Sounds like a case of that "Devil''s Proof" Rudolf-san is always talking about."'
15738: 'Kyrie@r@v09/31300045."...It might be possible to prove that there is a 19th person, but it''s impossible to prove that a 19th person doesn''t exist.@k@v09/31300046. ......Should we continue this discussion assuming that there is a person named BEATRICE hiding somewhere on this island......?"'
15739: 'Rudolf@r@v08/31200073."As the first step in crisis management, that''s the right way.@k@|@y@v08/31200074. ...It''s probably way more prudent to say she might exist, rather than thinking there''s no way she does."'
15740: 'Hideyoshi@r@v06/31100109."I, ...I see.@k@|@y@v06/31100110. Sorry, I was a bit careless...@k@v06/31100111. Rosa-san, sorry for laughin'' just now..."'
15741: 'Rosa@r@v12/31400020."Huh, ...ah, ......it''s alright, I don''t mind."'
15742: '@rHideyoshi apologized deeply for not being conscious enough of danger, despite calling himself the president of a company.'
15743: '@rSilence fell again.'
15744: '@rBy preparing for the existence of a 19th person,@k they were accepting that some unknown person was hidden on this island.'
15745: '@rAnd since this person might have something bad planned for them,@k it was only natural that it came with a certain degree of discomfort...'
15746: 'Krauss@r@v02/30800094."......In the past, Father would sometimes suddenly disappear without telling anyone where he went.@k@v02/30800095. After all, he is a person who appreciates silence.@k@v02/30800096. It was not out of the ordinary for him to shut himself up in some archive after purposefully not telling anyone where he was going."'
15747: 'Krauss@r@v02/30800097."......However, after the witch theory began to be refined into the theory about his mistress, it was eventually whispered that he was secretly going back and forth to see her."'
15748: 'Rudolf@r@v08/31200075."Mom was completely overridden with doubt in her final years.@k@v08/31200076. Sometimes, she''d suddenly start making a racket and asking the servants to look for Dad immediately, saying it was an emergency."'
15749: 'Eva@r@v05/31000179."......Yes, that did happen sometimes.@k@v05/31000180. Mother was always doing things like that in her later years, and that frightening atmosphere still hasn''t gone away.@k@|@y@v05/31000181. ...I can say it for certain now.@k@v05/31000182. She was a person to be pitied."'
15750: 'Hideyoshi@r@v06/31100112."So then, ...what were the results of those large-scale searches of the house?@k@v06/31100113. Did they find anythin''?"'
15751: 'Eva@r@v05/31000183."No.@k@v05/31000184. Not on a single occasion did they even find Father, let alone any hidden rooms.@k@v05/31000185. And every time, after a lot of time had passed, he would suddenly show up somewhere.@k@v05/31000186. Then he''d say that he''d been taking a nap in some archive or that the wind had called him down for a walk on the beach."'
15752: 'Eva@r@v05/31000187."...But it was always some place where the servants had already looked.@k@v05/31000188. ......We never knew where Father had gone."'
15753: 'Eva@r@v05/31000189."By that time, Father was already famous for his adoration of the occult,@k@v05/31000190. so some of the servants exaggerated, saying that he might have turned into butterflies and danced around the rose garden."'
15754: 'Kyrie@r@v09/31300047."So in short, Father frequently disappeared, and no one knew where he went."'
15755: 'Rudolf@r@v08/31200077."Yeah.@k@v08/31200078. Since we couldn''t find him no matter how much we looked inside the mansion, we grew increasingly of the opinion that Dad might have gone somewhere outside it.@k@v08/31200079. But there isn''t much to speak of in the area outside the mansion.@k@v08/31200080. ......Which leaves only the expansive forest."'
15756: 'Rudolf@r@v08/31200081."And if you tie that in with the legend of the witch from the forest, you get a theory like this:@k@|@y@v08/31200082. Dad had actually built a hidden mansion somewhere in the forest,@k@v08/31200083. inside of which a mistress by the name of BEATRICE lived, and he sometimes went to see her."'
15757: 'Krauss@r@v02/30800098."...I was also young at the time.@k@v02/30800099. At one point, I became intent on catching Father cheating, and I tried to follow him when he went outside."'
15758: 'Krauss@r@v02/30800100."...I failed, of course.@k@v02/30800101. Every time Dad went outside, he was oddly intent on staying out of sight, and was extremely cautious that he wasn''t being watched.@k@v02/30800102. He was like that to a very odd extent."'
15759: 'Krauss@r@v02/30800103."But that actually made me sure.@k@v02/30800104. He must have been going out for some reason that the members of his family couldn''t know about."'
15760: 'Hideyoshi@r@v06/31100114."And that would be going to meet his mistress.@k@|@y@v06/31100115. Probably tryin'' to avoid being seen."'
15761: '@rAfter seeing Hideyoshi nod and say "yes, yes" as though this was quite obvious, Eva got a little sullen.'
15762: 'Eva@r@v05/31000191."...Well, anyway.@k@v05/31000192. This island was like a sketchbook in which Father, with his Western obsession, could draw out all of his dreams.@k@v05/31000193. ......Everything about this island was exactly how Father wanted it.@k@v05/31000194. It wouldn''t be odd at all if there were some hidden mansion for his mistress to live in..."'
15763: '@rEva''s words spoke for what all of the siblings had come to think.'
15764: '@rFor a while, the room returned to silence again, and everyone listened to the sound of the wind and rain...'
15765: '@r......Was there a hidden mansion on this island, and had Kinzo''s mistress been living there in hiding for a long, long time......?'
15766: '@rEvery one of them had thought that they were being too suspicious, and had refrained from saying it for the longest time, but...@k......it had been a common opinion that everyone shared.'
15767: '@rKyrie, who had been listening the whole time with her eyes closed, spoke to no one in particular.'
15768: 'Kyrie@r@v09/31300048."...How long has this rumor about Father''s mistress been around?"'
15769: 'Rudolf@r@v08/31200084."As soon as we moved to this island, so about thirty years ago."'
15770: 'Rudolf@r@v08/31200085."Think about it, it would''ve been impossible for him to have a hidden mansion constructed once we came here.@k@v08/31200086. People and materials would have to be going in and out.@k@v08/31200087. We''d have found out in no time."'
15771: 'Rudolf@r@v08/31200088."So, if this was possible, it would have had to have happened before we moved here.@k@v08/31200089. ...It probably could have been built along with this mansion when we were still living in Odawara."'
15772: 'Eva@r@v05/31000195."It''s probably appropriate to assume that he had the plan laid out from the beginning to set up a double life with his family and his mistress.@k@v05/31000196. And his relationship with that mistress probably went back to the days when we lived in Odawara."'
15773: 'Krauss@r@v02/30800105."Probably.@k@v02/30800106. If, as Father says, she is the source of the vast amount of gold that he used to gain the funds which resurrected the Ushiromiya family,@k@v02/30800107. we could probably conclude that they had a close relationship since Odawara at least."'
15774: 'Krauss@r@v02/30800108."......A relationship trusting enough for her to lend him a vast quantity of gold.@k@v02/30800109. I can''t even imagine how old that relationship must have been."'
15775: 'Natsuhi@r@v03/30900018.".........Most likely, she gave Father some invaluable advice for achieving success in business.@k@v03/30900019. It''s natural to think that, out of a sense of gratitude for that, he described it as if this person had given him gold."'
15776: 'Natsuhi@r@v03/30900020."If you think about it that way, it''s obvious that they would have a close relationship after that.@k@v03/30900021. Rather than a debauched relationship with a mistress, it was probably a relationship of gratitude to the person who saved the Ushiromiya family from crisis."'
15777: 'Hideyoshi@r@v06/31100116."......That way of looking at it might have some sense to it too.@k@v06/31100117. But, even in that case, isn''t building a hidden mansion and havin'' her live in it going a little too far?@k@v06/31100118. Doesn''t that mean that there were some emotions in play beyond gratitude?"'
15778: 'Rudolf@r@v08/31200090."Well, this is all speculation.@k@v08/31200091. ......In the first place, no one has ever found that hidden mansion."'
15779: 'Rudolf@r@v08/31200092."...Aniki, you''re planning on expanding this island into a resort, right?@k @v08/31200093.You might stumble onto it by chance in the process, who knows?@k @v08/31200094.Maybe you''d even unexpectedly find some gold there, too."'
15780: 'Krauss@r@v02/30800110."...Hahahaha.@k@v02/30800111. Do you think Rokkenjima is Treasure Island or something?"'
15781: 'Eva@r@v05/31000197."Don''t play dumb.@k@v05/31000198. ...Although you say that you''re opening a resort, we know that it''s just a cover for a full-scale investigation of the entire island, okay?@k @|@y@v05/31000199.Although, it sounds as if, due to all that trouble and confusion we were talking about earlier, you haven''t been able to carry it out, of course?"'
15782: 'Krauss@r@v02/30800112."I don''t know what you''re talking about, but you misunderstand.@k@v02/30800113. It is perfectly natural that investigating this island would be the first step in turning it into a resort."'
15783: '@rKrauss tried to play dumb, but it was plainly obvious to his siblings, who knew him so well.'
15784: '@r...Krauss was definitely sure of the existence of a hidden mansion.'
15785: '@rAnd under the pretense of opening a resort, he had been investigating the island in detail, searching for a clue as to the location of the hidden gold.'
15786: '@rThey couldn''t tell whether that conviction was just him over-thinking things, or whether it was based on some physical proof.'
15787: '@r......However, if Krauss, with all his guile, was convinced,@k then the other siblings were similarly convinced that there must be a sufficient basis for it...'
15788: 'Hideyoshi@r@v06/31100119."......The story about a witch livin'' in a forest is straight out of a fairy tale,@k@v06/31100120. but a story about some blonde-haired girl livin'' secretly in a mansion no one knows about in the middle of a forest...isn''t much better."'
15789: 'Eva@r@v05/31000200."Certainly.@k@v05/31000201. Taken on its own, the setting sounds just like some kind of children''s story.@k@|@y@v05/31000202. You like those, don''t you, Rosa?"'
15790: 'Rosa@r@v12/31400021."......Huh, ......w-...well, yes..."'
15791: 'Krauss@r@v02/30800114."When the mansion was built on this island, Father was at the height of his prosperity.@k@v02/30800115. With his money, he could probably have obtained anything, made any of his delusions real.@k@v02/30800116. ...A mansion in the forest where a witch quietly waits...@k@|@y@v02/30800117. ......It sounds like the kind of setting Dad would like."'
15792: 'Rudolf@r@v08/31200095."......Doesn''t it?@k@v08/31200096. Like something from the occult or a fairy tale.@k@v08/31200097. ...It feels like Dad would be into that."'
15793: '@rOn this island, which the Ushiromiya family had lived on for thirty years now,@k a hidden mansion that no one knew about had been quietly built, and within, there lived a witch known only by her portrait...'
15794: '@rEven this hard-to-believe story...@kmight not be completely delusional considering all of Kinzo''s strange habits and his vast wealth...'
15795: 'Kyrie@r@v09/31300049."......It might not have been impossible for Father to build a hidden mansion to satisfy such a dream."'
15796: 'Kyrie@r@v09/31300050."......However, let''s be realistic.@k@v09/31300051. Would it be possible to house his beloved woman in that hidden mansion for decades without it becoming inconvenient...?"'
15797: 'Eva@r@v05/31000203."......Well,@k@v05/31000204. if there was love, it could have been possible, right?"'
15798: 'Kyrie@r@v09/31300052."Think about the facilities needed to let his beloved woman live healthily.@k@v09/31300053. ......And how Father would do it.@k@v09/31300054. For example, even if it was on a small scale, it would have to be an intricate and pleasant residence."'
15799: 'Kyrie@r@v09/31300055."And, in terms of upkeep, it would need:@k@v09/31300056. electricity,@v09/31300057. gas,@v09/31300058. running water.@k@v09/31300059. As well as possibly some people to help her.@k@v09/31300060. Even providing for her meals would be quite difficult."'
15800: 'Kyrie@r@v09/31300061."She would need clothes and makeup, daily necessities.@k@v09/31300062. ...The needs of a woman aren''t simple.@k@v09/31300063. ......Would it be possible to maintain all of that without any of the family or the servants noticing?"'
15801: 'Rudolf@r@v08/31200098."............When you say it that way, it sure sounds like a weak point in our theory.@k@v08/31200099. ...But that isn''t enough to get rid of my feeling that Dad might have been able to pull it off anyway.@k@v08/31200100. ...After all, it is Dad."'
15802: 'Eva@r@v05/31000205."That''s right.@k@v05/31000206. ...It is Father."'
15803: 'Natsuhi@r@v03/30900022."When Father had something he wanted to succeed in, he would succeed no matter what.@k@v03/30900023. ...Saying that it would be difficult for a normal person and is therefore impossible...doesn''t apply when it comes to Father."'
15804: 'Krauss@r@v02/30800118."Yes.@k@v02/30800119. You should never underestimate Father.@k@v02/30800120_b. ......Dad''s madness can''t be understood by normal people."'
15805: '@rI wouldn''t put it past the Ushiromiya Kinzo.'
15806: '@r...As long as those words could accompany his name, a considerable amount of credibility dwelled in any story, no matter how absurd.'
15807: '@rHowever, that didn''t shake the importance of what Kyrie had said.'
15808: '@rThis was different from stealthily raising a kitten in a cardboard box and keeping it a secret from your parents.'
15809: '@rTaking care of a person in secret over a period of thirty years would be an incalculably massive task...'
15810: 'Hideyoshi@r@v06/31100121."......The legend of Father''s gold started before he gained possession of Rokkenjima.@k@v06/31100122. That would mean he and his mistress go back over thirty years..."'
15811: 'Hideyoshi@r@v06/31100123."How old would that make her?@k@v06/31100124. In the worst case, she could be as old as us or older, right?"'
15812: 'Hideyoshi@r@v06/31100125."...By that age, the body starts to break down.@k@v06/31100126. I don''t care what the mansion''s like, I couldn''t call livin'' in a place where people''s eyes can''t reach, almost as though she were under house arrest, agreeable..."'
15813: 'Eva@r@v05/31000207."That''s right.@k@v05/31000208. ...If what Father told us about BEATRICE is true, then that relationship has lasted for over thirty years."'
15814: 'Eva@r@v05/31000209."......She might have been a charming young woman at the time, but it is probably appropriate to think that she''s now an old bag like us.@k@v05/31000210. I can easily imagine that, given the contents of that letter."'
15815: 'Krauss@r@v02/30800121."You should talk.@k@v02/30800122. *cackle*cackle*."'
15816: '@rKrauss laughed, as though blind to his own shortcomings.'
15817: '@rOf course, Eva was offended, but she didn''t strike back.'
15818: 'Rudolf@r@v08/31200101."Quit it, Aniki.@k@v08/31200102. ......So if everything we imagine is true, she should want to throw out her chest with pride and join in on Dad''s inheritance problem."'
15819: 'Rudolf@r@v08/31200103."I mean, ...there''s a good chance that this love was mutual, unlike with Mom.@k@v08/31200104. She might have been aware she was his mistress, and yet at the same time, felt a kind of pride as his real wife."'
15820: 'Natsuhi@r@v03/30900024.".........That is an insult to Mother."'
15821: 'Rudolf@r@v08/31200105."Yeah, sorry.@k@|@y@v08/31200106. ...But everyone knows it was a political marriage decided by his elder relatives.@k@v08/31200107. ...Because of that, we can be sure that it wouldn''t be odd for Dad to have a mistress."'
15822: '@rThe family sank after the Great Kanto Earthquake, and Kinzo was set up as the Ushiromiya family head against his will.'
15823: '@rHowever, in the beginning, he was influenced strongly by the elder relatives, who treated him like a puppet while they pulled the strings.'
15824: '@rHe wasn''t permitted to decide anything by himself, not even his marriage partner...'
15825: '@r......And by his meeting with the Golden Witch BEATRICE in those unhappy days,@k Kinzo''s Legend of the Gold was quickly embellished into something dramatic.'
15826: '@rIn other words,@w500. ...it could mean...@w583. that Kinzo met with a woman he really did love.'
15827: '@rIf she also knew his whole story,@k then even if they weren''t marriage partners, it wouldn''t have been odd for her to consider herself his true wife, inside her heart.'
15828: '@r...And now, the person registered as his true wife was already dead...'
15829: 'Hideyoshi@r@v06/31100127."...In which case, she might be fully intending to encroach on not just the rights to his assets, but the battle over the headship as well."'
15830: 'Krauss@r@v02/30800123.".........I see.@k@v02/30800124. I''m starting to see the purpose of this letter.@k@v02/30800125. The headship to the one who solves the epitaph''s riddle...@k@v02/30800126. So that''s what it means."'
15831: 'Eva@r@v05/31000211."Even if that mistress obtained a rank within the Ushiromiya family, since she is not a direct relative of Father, she would be inferior to even the children.@k@|@y@v05/31000212. ...In other words, she would be right below Rosa in rank.@k@v05/31000213. That''s not a good position to join the battle for the headship."'
15832: 'Rudolf@r@v08/31200108."So that''s it.@k@v08/31200109. ...If someone can solve the witch''s riddle, they will receive the headship regardless of rank.@k@v08/31200110. In other words, it is the most advantageous condition that BEATRICE could get, since she had no chance whatsoever."'
15833: '@rThe revival of the Ushiromiya family had been made possible by the gold BEATRICE had bestowed.@k ...In other words, the credit belonged to her.'
15834: '@rShe had built that wealth together with Kinzo, so it was natural that she would have thought of herself as the one who should inherit it...@k It would also be natural for her to despise the thought of giving a single cent to the children of the wife Kinzo had never loved.'
15835: 'Natsuhi@r@v03/30900025."H-how incredibly impertinent...!@k @v03/30900026.Even if this mistress actually existed, for her to fight over the rights to the head''s inheritance would be an outrageous action far above her place!@k @v03/30900027.What disregard for her own place...!"'
15836: '@rNatsuhi turned red, her fist quivering.'
15837: '@r...There were also complicated circumstances behind her entry into the Ushiromiya register.@k@rThose who knew that understood more or less why she was so angry for the sake of Kinzo''s dead wife.'
15838: 'Eva@r@v05/31000214."...Well, thanks to her outrageous action, we now all have an even chance, right?"'
15839: 'Eva@r@v05/31000215."And also, Father has given that outrageous action his silent approval.@k@v05/31000216. ......Will the person who succeeds the Ushiromiya family be his mistress BEATRICE, or one of us, who he may not love, but who do carry his blood?@k@v05/31000217. Maybe he wants to make us struggle over that to see who is worthy."'
15840: '@rAs Eva giggled roguishly, Krauss shrugged his shoulders and looked away.'
15841: 'Kyrie@r@v09/31300064."......However, since it was the other party that brought up this condition,@k@v09/31300065. I wonder if that means that the other party has a significant advantage."'
15842: 'Hideyoshi@r@v06/31100128."Tha-that''s a point, too.@k@v06/31100129. ...In the first place, if BEATRICE meant that letter literally, then she''s Father''s alchemist.@k@v06/31100130. In other words, she''s the manager of his gold.@k@v06/31100131. It wouldn''t be strange at all if she knew where it was hidden, would it?!"'
15843: 'Hideyoshi@r@v06/31100132."What a bad joke this is.@k@v06/31100133. It''s like she''s givin'' us a riddle that she knows the answer to!@k @v06/31100134.She''ll probably show up rudely, say "hey, here''s the answer, I''ll take the headship now",@k@v06/31100135. and snatch everythin'' away from us!"'
15844: 'Eva@r@v05/31000218."........................@k@v05/31000219. ...That''s right.@k@|@y@v05/31000220. The one who sets a riddle always knows the answer.@k@v05/31000221. There''s a good chance that this is all a trap to steal everything from us."'
15845: 'Krauss@r@v02/30800127."...If you think about it like that, don''t you start to doubt whether she really has the gold in the first place?@k @v02/30800128.Why would she tell us about it?@k@v02/30800129. All she''d have to do would be stay silent and embezzle it."'
15846: 'Rudolf@r@v08/31200111."You''re right.@k@v08/31200112. ...Doesn''t make much sense."'
15847: '@rIndeed, it was just as they said.'
15848: '@rIf the epitaph showed the way to where the gold was hidden, why would she challenge them to try to solve it?@k If they actually did solve it, wouldn''t the gold all be stolen...?'
15849: '@rCould it be that this person was trying to stir the siblings up so that they tried to solve the epitaph,@k and would then snatch it up before they did solve it...?@k That was a very reasonable guess.'
15850: 'Kyrie@r@v09/31300066."............No,@k@v09/31300067. if you flip over the chessboard, there might be a pretty good chance that they actually do have the gold."'
15851: 'Eva@r@v05/31000222."How can you be so certain?"'
15852: 'Rudolf@r@v08/31200113."...Wait, Aneki.@k@|@y@v08/31200114. ......Kyrie, please keep talking.@k@v08/31200115. Why do you think that?"'
15853: 'Kyrie@r@v09/31300068."After all, do they really think that just telling us the answer to the riddle in the witch''s epitaph,@k@v09/31300069. would seriously be enough for us to hand over the headship of the Ushiromiya family?@k @v09/31300070.That we''d be so impressed at the answer to the riddle that we''d just give up?"'
15854: 'Hideyoshi@r@v06/31100136."......Well,@v06/31100137. ......that''s true.@k@v06/31100138. If they think we''d just give up after bein'' told the answer to the riddle,@k@v06/31100139. that we''d just say "here you go" and hand it over, they''ve got another thing comin''."'
15855: 'Natsuhi@r@v03/30900028."Of course.@k@v03/30900029. The headship of the Ushiromiya family is not something that can be handed over so easily!"'
15856: 'Kyrie@r@v09/31300071."That''s it exactly.@k@v09/31300072. No matter how one-sided a game BEATRICE proposes, and even if she splendidly shows us the answer,@k@v09/31300073. there''s no way that we''ll obediently hand over the headship."'
15857: 'Kyrie@r@v09/31300074."......In other words, unless there is something that forcibly compels us to play this game under fair conditions,@k@v09/31300075. this game won''t function as a game."'
15858: 'Rudolf@r@v08/31200116."That''s right.@k@|@y@v08/31200117. ......Unless the losers are forcibly compelled to hand over the headship, the game doesn''t work."'
15859: 'Krauss@r@v02/30800130."And what would this compelling force be?@k @v02/30800131.Would they bind us in chains and threaten us into handing over the headship?"'
15860: 'Eva@r@v05/31000223.".........I see.@k@v05/31000224. I get it.@k@v05/31000225. ......They would just have to do something which would make us willingly give up the headship.@k@|@y@v05/31000226. I see.@k@v05/31000227. ...Then, yes, certainly, BEATRICE would have to be in possession of the ten tons of gold...!"'
15861: 'Hideyoshi@r@v06/31100140."R-right, I get it too!@k @|@y@v06/31100141.In other words, ...it''s a trade, right?!"'
15862: 'Natsuhi@r@v03/30900030."Huh?@k @v03/30900031.Wh-what do you mean...?@k@v03/30900032. A trade?@k @v03/30900033.Trade what?!"'
15863: 'Kyrie@r@v09/31300076."The Ushiromiya family headship for the hidden gold.@k@v09/31300077. ...BEATRICE surely plans to tell us the location of the ten tons of gold, and use that as a bribe to gain the Ushiromiya family headship."'
15864: 'Natsuhi@r@v03/30900034."R-ridiculous!!"@|@y'
15865: 'Natsuhi@r@v03/30900035."They want to trade the succession to the glorious Ushiromiya family for...m-money?!@k @v03/30900036.Blasphemy!!@k@v03/30900037. Blasphemy against the Ushiromiya family!!"'
15866: 'Kyrie@r@v09/31300078."......Listen without getting mad.@k@v09/31300079. ...About how much wealth does this glorious Ushiromiya family have right now?@k @v09/31300080.Are we really that affluent?"'
15867: 'Natsuhi@r@v03/30900038."Th-the definition of affluence is not dependent on property.@k@v03/30900039. It is about heart!@k @v03/30900040.Of what relevance is our financial situation to—"'
15868: '@rKrauss interrupted Natsuhi as she started to go on emotionally.'
15869: '@rIn this situation, the more she went on and on emotionally, the worse it would actually sound for them.'
15870: 'Krauss@r@v02/30800132.".........Myself aside, I have heard that the rest of you are in pretty unfavorable situations right now."'
15871: 'Eva@r@v05/31000228."Ohhh, really?@k @v05/31000229.I''ve heard that your financial situation is extremely unfavorable, actually?"'
15872: 'Eva@r@v05/31000230."Repeatedly exchanging collateral for new money to gamble with.@k@v05/31000231. Repeatedly dabbling in gamble after gamble, unable to accept your losses.@k@v05/31000232. ...If you want to talk about our state of affairs, not one of us here is as impoverished as you, Nii-san."'
15873: 'Eva@r@v05/31000233."How much have you lost, Nii-san?@k@v05/31000234. You have no talent!"@|@y'
15874: 'Natsuhi@r@v03/30900041."W-who are you saying has no talent?!!@k @v03/30900042.And impoverished, you say?!!"'
15875: '@rNatsuhi became indignant once again, but Krauss raised his hand again and interrupted her.'
15876: 'Krauss@r@v02/30800133."......It seems you are making a small mistake.@k@v02/30800134. Business is not something that can be judged based simply on progress.@k@v02/30800135. When someone conducts business with a view to the long-term as I do,@k@v02/30800136. it may sometimes appear at a glance that they have suffered some significant short-term losses."'
15877: 'Rudolf@r@v08/31200118."Aniki,@k@v08/31200119. we''ve been collecting evidence.@k@v08/31200120. Now is not the time to be putting up a front."'
15878: 'Rudolf@r@v08/31200121."......So this is what Kyrie is trying to say.@k@v08/31200122. ......Every last one of us is stuck for money.@k@v08/31200123. And BEATRICE has ten tons of gold."'
15879: 'Kyrie@r@v09/31300081."......As the only person who knows the location of the ten tons of gold, BEATRICE is planning on using it to force us to sell the position of family head.@k@v09/31300082. ...About how much is ten tons of gold worth?"'
15880: 'Kyrie@r@v09/31300083."As a rough estimate... 2 billion yen?@k @v09/31300084..........No, 20 billion yen.@k@v09/31300085. If she threw that much our way, we would be jumping with joy to accept her as the successor to the head."'
15881: '@rThe scene returned to silence.'
15882: '@rEven the rain and the wind sounded louder.@k ...That was probably also the sound of the windstorm that disturbed the insides of their minds...'
15883: 'Eva@r@v05/31000235."............Y-...you must be joking.@k@v05/31000236. ...The thought that just because she tossed me a little money...@k@v05/31000237.......I''d give up the family headship to some woman of doubtful origin......"'
15884: 'Hideyoshi@r@v06/31100142."Don''t talk stupid...!@k @v06/31100143.You weren''t even going to succeed Father as head in the first place...!@k @v06/31100144.We have nothin'' to lose and money to gain.@k@v06/31100145. Sure, we''ll have to calculate our profit and loss, but it''s somethin'' worth listenin'' to...!"'
15885: '@rThey knew that much of the Ushiromiya family assets had been eaten up by Krauss.'
15886: '@rThe dregs that remained of that inheritance...versus the "compensation for being accepted as the head" that BEATRICE would pay.'
15887: '@rIt was a shame, but honestly, the former was less enticing than the latter.'
15888: 'Rudolf@r@v08/31200124."...Well, it probably wouldn''t end up as four equal portions.@k@v08/31200125. Since Aniki would be giving up his position of successor, his portion would have to be larger.@k@v08/31200126. ...Makes me feel kinda jealous, you know?"'
15889: 'Krauss@r@v02/30800137."................................."'
15890: 'Natsuhi@r@v03/30900043."Dear...!@k @v03/30900044.The amount of money isn''t the problem, right?!@k @v03/30900045.Your cowardly younger siblings are trying to sell the glory of the Ushiromiya family for money!@k @v03/30900046.Why aren''t you displaying your dignity as the eldest son?!"'
15891: 'Krauss@r@v02/30800138.".........Natsuhi.@k@v02/30800139. Stay quiet for a while."'
15892: 'Natsuhi@r@v03/30900047."Dear?!?!"'
15893: 'Rudolf@r@v08/31200127."......This is a dizzying proposal.@k@v08/31200128. ......We were each planning on getting 250 million yen out of Aniki.@k@v08/31200129. If the witch would treat us with even ten percent of those ten tons...@v08/31200130.......ummm—"'
15894: 'Kyrie@r@v09/31300086."That''s 2 billion."'
15895: 'Rudolf@r@v08/31200131."...Yeah.@k@v08/31200132. That would mean she''s treating us with ten times our original goal.@k@v08/31200133. That alone would be more than enough for us.@k@v08/31200134. ......It''s not like I have any attachment to the Ushiromiya name.@k@v08/31200135. I''d be happy to sell it off..."'
15896: 'Kyrie@r@v09/31300087."Even if the full ten tons might be a bit much to expect,@k@v09/31300088. .........I see, it would still be an attractive prospect for us.@k@v09/31300089. ...We were trying to form an alliance among the siblings to kick this outsider called BEATRICE out."'
15897: 'Kyrie@r@v09/31300090."......But, if this is her plan,@v09/31300091. ......it will tear apart the unity between us.@k@v09/31300092. ...Yes, by this point we can state it clearly.@k@v09/31300093. ......The goal of BEATRICE''s letter was to disturb our alliance."'
15898: '@rIf the three younger siblings, who were never going to have any connection with the succession of the headship in the first place,@k were paid enough money to satisfy them, they would happily accept BEATRICE as the next head.'
15899: '@rSo every obstacle to her headship would be removed except for Krauss.'
15900: '@rIn that case, the negotiations would be one-on-one between her and Krauss.'
15901: '@rHe tried to look strong, but Krauss''s financial and political situation was extremely weak.@k@r...He did bluff in front of his siblings, but on the inside, he was probably thinking that it might be alright to enter negotiations depending on the sum of money involved.'
15902: '@rIn order to bury his losses, Krauss had taken advantage of the fact that Kinzo had shut himself up in his room, and had embezzled Kinzo''s personal assets.'
15903: '@rTherefore, when Kinzo died and the inheritance was distributed, Krauss would be held to account for that.'
15904: '@rBut if he gave up his seat as the head to BEATRICE,@k she would also receive the rights to the assets, and as a result, the distribution of the inheritance to the siblings would not occur.'
15905: '@r......In other words, Krauss'' embezzlement might not have to be made known to the other siblings...'
15906: '@rOf course, the siblings were frightened of Kinzo, but it was doubtful whether they still actually respected him as a father.'
15907: '@rBy this time, they each had their own families, their own wealth, and their own lives.'
15908: '@rIf they were paid enough money in exchange for Rokkenjima, the wrecked remains of Kinzo''s dreams,@k ......there was a significant possibility that they would relinquish the Ushiromiya family name......'
15909: '@rIn other words, BEATRICE''s victory was already guaranteed in this "game".'
15910: '@rNot as the winner of "BEATRICE''s game",@k@r...but as the winner of "Kinzo''s game".'
15911: '@r...Kinzo had put up the epitaph.@k@rAnd to this day, no one had been able to solve it.'
15912: '@rSo BEATRICE had "solved" it.'
15913: '@rIn other words, this is less of a game and more like BEATRICE''s declaration of victory...'
15914: '@rHowever, Kyrie still felt something was slightly out of place.'
15915: '@rIf this was a declaration of victory, BEATRICE would only have to display the gold openly, and state that she would buy the family headship.'
15916: '@rAnd yet, even at this late stage, she was explicitly telling the siblings to try to solve the epitaph.@k Why had she set up this "new game", where she agreed to hand over the all of the gold and the right to succeed the head to the person who solved the epitaph?'
15917: '@rKyrie tried flipping over the chessboard several times.@k@r...Searching for the best strategy that might have guided BEATRICE to this line of thinking.'
15918: '@r...In the end, ...she reached a single conclusion.'
15919: 'Kyrie@r@v09/31300094."...............Arrogance,@v09/31300095. ...perhaps?@k@v09/31300096. Or maybe,@v09/31300097. ......she''s playing......?"'
15920: 'Eva@r@v05/31000238."...What are you talking about?"'
15921: 'Kyrie@r@v09/31300098."The witch sent us a letter of challenge, telling us to try to solve the epitaph.@k@v09/31300099. She might be taking us lightly, thinking we could never solve it.@k@v09/31300100. ......However, there should be at least an extremely small chance that we will solve it."'
15922: 'Kyrie@r@v09/31300101."After all, we have here four of Father''s children by blood, right?@k @v09/31300102.Four people related by blood to the questioner, who, if they tried frantically to work together and avoid having those assets stolen from them,@k@v09/31300103. might come across the answer of the riddle by chance."'
15923: '@rThe reason the witch had a superior position on the negotiations compared to the siblings was that only she knew the location of the hidden gold.'
15924: '@rBut if that hiding place was exposed to someone other than her, the witch''s superior position would crumble.'
15925: 'Kyrie@r@v09/31300104."In short, BEATRICE gains nothing but risk by writing this witch''s letter of challenge."'
15926: 'Kyrie@r@v09/31300105."......Of course, it might have had the effect of splitting apart the siblings'' alliance,@k@v09/31300106. but if that was her only goal, why would she take this risk, however slight it might be......?@k @v09/31300107.I think that''s reckless."'
15927: 'Kyrie@r@v09/31300108."...But if you keep in mind a certain type of emotion, it becomes possible to understand that risk."'
15928: 'Eva@r@v05/31000239."..................@k@|@y@v05/31000240. ...And you''re saying that''s arrogance?"'
15929: 'Kyrie@r@v09/31300109."Yes, that''s right.@k@v09/31300110. ......When people have an overwhelming advantage, they tend to get arrogant.@k@v09/31300111. And when they do, they sometimes deliberately take on a small risk, to show off that advantage to the losers."'
15930: 'Kyrie@r@v09/31300112."......A moderate amount of risk adds a little spice to the joy of victory.@k@v09/31300113. Nothing is as boring as a victory without risk."'
15931: 'Eva@r@v05/31000241."...............I understand that.@k@v05/31000242. I also like that sort of thing.@k@v05/31000243. ...I understand well."'
15932: 'Kyrie@r@v09/31300114."I tried thinking of a few other plausible explanations for the true motive behind BEATRICE''s letter,@k@v09/31300115. ......but I think that this really might be the truth.@k@v09/31300116. ......The emotion hidden behind that letter...@v09/31300117.......was arrogance."'
15933: 'Eva@r@v05/31000244."............Arrogance."'
15934: 'Kyrie@r@v09/31300118."She''s trying to throw her weight around, looking down on us, as if there''s no way we could figure out such a difficult epitaph.@k@v09/31300119. ...It might even be possible, if surprising, that the epitaph wasn''t written by Father, but by her."'
15935: 'Eva@r@v05/31000245."......Fine by me.@k@v05/31000246. ......Solve the riddle of the epitaph, she says?"'
15936: '@r@v34/33300066.If only I solved it, I would be made the head, right...?'
15937: '@r@v34/33300067....I''ll solve it...@k@v34/33300067_1. I''ll accept the witch''s challenge.@k@r@v34/33300068.As if my other braindead siblings could solve it.'
15938: '@r@v34/33300069.I''ll solve it by myself, and then I''ll prove that I am the one who is fit to succeed the Ushiromiya family......'
15939: 'Eva@r@v05/31000247."I''ll take that challenge.@k@v05/31000248. ...I will...@v05/31000249.solve the riddle......"'