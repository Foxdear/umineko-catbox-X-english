19690: 'Ronove@r@v31/33100479."My sincere apologies.@k@v31/33100480. I was forced to resign.@k@v31/33100481. ......Battler-sama''s claim of "Rosa strangled Maria to death, then died in an accident",@k@v31/33100482. I struck down in red with "both deaths were homicides",@k@v31/33100483. ...but I could not repel his chain of moves placing Eva as the principal offender."'
