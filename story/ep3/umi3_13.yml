19697: 'BEATRICE@r@v27/30701720."That''s none of your business.@k@v27/30701721. I wonder how that one plans on destroying this barricade from here on out.@k@v27/30701722. I shall keep a close eye on her."'
19698: 'BEATRICE@r@v27/30701723."...............Oh, and...@k@v27/30701724....how was B-...Battler''s mood?"'
19699: 'Ronove@r@v31/33100492."It appeared as though he had calmed himself down.@k@v31/33100493. He did say that, after all, he couldn''t get fired up without you as his opponent."'
