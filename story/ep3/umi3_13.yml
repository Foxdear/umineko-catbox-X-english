19692: 'Ronove@r@v31/33100484."...He put forth the possibility that Hideyoshi was an accomplice, and that the two worked together to create an alibi."'
19693: 'BEATRICE@r@v27/30701714."He even suspects Hideyoshi...?!@k @v27/30701715.Couldn''t you have struck back by saying in red that they were in the guest room at the time of the murder?"'
19694: 'Ronove@r@v31/33100485."......I also thought of that, but, in any event, several important pieces might have been taken several moves later.@k@v31/33100486. ...And, because there is a possibility that this move was part of the preparations made by the new BEATRICE,@k@v31/33100487. I acted out of respect to her.@k@v31/33100488. ...My apologies."'
19695: 'BEATRICE@r@v27/30701716."Preparations, you say.@k@v27/30701717. .........Her mind does seem to be sharp.@k@|@y@v27/30701718. ...Hmm, we can let her do as she likes.@k@v27/30701719. It will be quite a show to see how far she can go."'
