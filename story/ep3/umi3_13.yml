19678: 'BEATRICE@r@v27/30701699."I-is that so......@k@v27/30701700. You really are excellent...@k@v27/30701701. I am pleased that my disciple isn''t hard to deal with."'
19679: 'EVA@r@v34/33300421."My motto is to study things myself before asking other people.@k@v34/33300422. ......Then, if you would excuse me.@k@v34/33300423. I have to wait for my prey to get nonchalantly lured out."'
