19419: 'Eva@r@v05/31000699."..............................zzzzz..."'
19420: 'Hideyoshi@r@v06/31100306."..................Whew.@k@v06/31100307. ...Looks like she''s finally calmed down..."'
19421: '@rHideyoshi wiped his own forehead.@k ...For a time, Eva had seemed to be having a very painful nightmare, but it appeared that she had finally fallen asleep.'
19422: '@rAs promised, he still gripped Eva''s hand.@k ...He thought it would probably be alright to let go about now, but he faithfully continued to hold her hand.'
19423: '@rEvery once in a while, his hand would get tired, and he would switch between his right and his left,@k but even so, as promised, he never let go of her hand...'
19424: '@rAt that time, there was a heavy knock.@k Eva had finally managed to fall asleep, so Hideyoshi grimaced for just an instant.'
19425: 'Rudolf@r@v08/31200286."......Aneki, Hideyoshi-san, sorry.@k@v08/31200287. Is Rosa there...?"'
19426: '@rIt was Rudolf''s voice.@k ...What could it be?'
19427: '@rHideyoshi headed for the door, hiding his footsteps so that he wouldn''t wake Eva.'
19428: '@r......It was definitely Rudolf''s voice, but just in case, he opened the door without removing the chain.'
19429: 'Hideyoshi@r@v06/31100308."What is it?@k@v06/31100309. Somethin'' happen to Rosa?"'
19430: 'Rudolf@r@v08/31200288."We can''t find Rosa or Maria-chan.@k@v08/31200289. I thought they might be with you."'
19431: 'Hideyoshi@r@v06/31100310."...I heard her scoldin'' Maria-chan in the corridor.@k@v06/31100311. They got quiet after that, so I thought they went back to the lobby......didn''t they...?"'
19432: 'Rudolf@r@v08/31200290."............That idiot..."'
19433: '@rRudolf clicked his tongue.'
19434: '@rOther people could be seen in the corridor.@k It had been some time since Rosa went out into the corridor, and she had still not returned, so they had begun to worry.'
19435: '@rNear the front door, Natsuhi pointed at the removed chain.'
19436: 'Natsuhi@r@v03/30900113."......The chain isn''t set.@k@v03/30900114. They must have gone outside to see the rose after all."'
19437: 'Krauss@r@v02/30800246."Going out and leaving the door unlocked, that is simply too careless.@k@v02/30800247. What a troublesome person."'
19438: 'Kyrie@r@v09/31300272."...More importantly for now, I''m worried about Rosa-san and Maria-chan themselves."'
19439: 'Rudolf@r@v08/31200291."Right.@k@v08/31200292. ......Hey, brats.@k@v08/31200293. Where was this rose of Maria-chan''s?!"'
19440: 'Jessica@r@v04/30200100."I''m pretty sure...it was in the flower bed right in the middle of the rose garden..."'
19441: 'George@r@v07/30300056."If those two are there, we should be able to tell quickly if we go."'
19442: 'Battler@r@v10/30101118."......Dad, I think we should bring them back as soon as we can..."'
19443: 'Rudolf@r@v08/31200294."Of course.@k@v08/31200295. We''ll bring them both back and spank them on the butt.@k@v08/31200296. I''ll dash out there and come back.@k@v08/31200297. Lock the door as soon as I go out."'
19444: 'Battler@r@v10/30101119."...Dad, I''ll go with you."'
19445: 'Rudolf@r@v08/31200298."Don''t be an idiot.@k@v08/31200299. You''re a brat, and what brats do is they watch the house with Mommy."'
19446: 'Eva@r@v05/31000700."............What is it...?@k@v05/31000701. Did something happen......?"'
19447: 'Hideyoshi@r@v06/31100312."Sorry, did I wake you up...?@k@v06/31100313. ...Seems like Rosa-san took Maria-chan outside.@k@v06/31100314. ...How reckless of her."'
19448: 'Eva@r@v05/31000702."Rosa and Maria-chan went...@v05/31000703....outside...?@k @v05/31000704.Into the rose garden......?!"'
19449: 'Hideyoshi@r@v06/31100315."That''s right.@k@v06/31100316. ...Oh, I guess you must''ve heard.@k @v06/31100317.Maria-chan was causin'' a ruckus ''cause she wanted to see her rose."'
19450: 'Eva@r@v05/31000705."......Th-......they mustn''t,@v05/31000706. ......they mustn''t go to the rose garden...!@k @v05/31000707.Tell Rosa to stop...!"'
19451: 'Hideyoshi@r@v06/31100318."Th-there''s no tellin'' her to stop now, it looks like they left a while ago.@k@v06/31100319. ......Seriously, how reckless of them."'
19452: 'Eva@r@v05/31000708.".........That''s not it...@k@v05/31000709. ...Not the rose garden...@k@v05/31000710. ...There''s a witch there...@v05/31000711.......and she''s waiting for a sacrifice...!@k @v05/31000712.Rosa, you mustn''t go...@v05/31000713.......ooooooooooohhh..."'
19453: '@r...Eva curled herself up again, holding her head.@k@r......Her complexion looked very bad.'
19454: 'Hideyoshi@r@v06/31100320."What is it?@k@v06/31100321. Did the fever make you dream somethin'' bad?"'
19455: 'Eva@r@v05/31000714."............It was a dream,@v05/31000715. ......yes...@k@v05/31000716. ............In the rose garden, the witch, doing that to Rosa and Maria......@k@v05/31000717. .........That''s right.@k@v05/31000718. ...It''s a dream,@v05/31000719. ......yes..."'
19456: 'Hideyoshi@r@v06/31100322."Calm down.@k@v06/31100323. I''m also in this room.@k@v06/31100324. The chain is set, too.@k@v06/31100325. The shutter''s closed on the window, and there''s even a gun.@k@v06/31100326. This room is just like a fort.@k@v06/31100327. There''s not a thiiing to be afraid of."'
19457: '@rHideyoshi beat his chest, trying to calm her, but Eva''s insecure expression didn''t change.'
19458: '@r...Under the covers, Eva kept praying...@kthat the grotesque nightmare she had just had was only a dream...'
19459: 'VIRGILIA@r@v30/33200444."In the center of the rose garden, Rudolf confirmed the bodies of Rosa and Maria.@k@v30/33200445. After that, he returned to the guesthouse, called for help, and carried both of them into the guesthouse."'
19460: 'VIRGILIA@r@v30/33200446."If we can trust Nanjo''s examination, the cause of Rosa''s death was a stab to the medulla oblongata with the pointed gate of the fence.@k@v30/33200447. It is thought that Maria''s death was due to strangling with bare hands.@k@v30/33200448. However, due to the "Devil''s Proof", we cannot discount a misdiagnosis."'
19461: 'BEATRICE@r@v27/30701625."......I will say it in red.@k@v27/30701626.@|@y@c900.@[Rosa and Maria died.@]@c.@k@v27/30701627.@|@y@c900.@[The causes of death were as Nanjo diagnosed.@]@c.@k@|@y@v27/30701628. ......She wasn''t eaten by a spider, nor was she crushed by a mountain of cake.@k@v27/30701629. Don''t worry."'
19462: 'Battler@r@v10/30101120."............So you argue that even though you toyed with their death so much, it''s all okay because the corpse is clean...@k@v10/30101121. I definitely won''t forgive you.@k@|@y@v10/30101122. ...All of that brutal treatment you gave Auntie Rosa,@k@v10/30101123. I''ll never forget it, and I''ll never forgive you for it..."'
19463: 'BEATRICE@r@v27/30701630."...L-like I said, that wasn''t me......@k@v27/30701631. ...I think I gave them a much more peaceful death than the way she treated them..."'
19464: 'Battler@r@v10/30101124."Shut the hell up.@k@v10/30101125. I don''t want to listen to you.@k@|@y@v10/30101126. .........I''ve been told that there are no more than 18 people on this island, and now that eight people are already dead,@k@v10/30101127. the suspects are narrowed down to ten.@k@v10/30101128. One of them probably killed those two."'
19465: 'Battler@r@v10/30101129."...Or it could also be an accidental death.@k @v10/30101130_b.Like Maria was having a tantrum,@k@v10/30101131. and when Auntie Rosa tried to stop her crying, she misjudged how much power she was using and accidentally killed her.@k@v10/30101132. Then, in her consternation, she slipped and fell, landed on the fence, and unluckily, died."'
19466: 'Battler@r@v10/30101133."......How''s that?@k@v10/30101134. That way there''s no need for a witch or magic."'
19467: 'BEATRICE@r@v27/30701632."......Well, that''s not true.@k@v27/30701633. Actually, Rosa and Maria - "'
19468: 'Battler@r@v10/30101135."Shut up.@k@v10/30101136. Didn''t I say that I didn''t want to listen to you?@k@v10/30101137. You''re an eyesore, so get lost.@k@v10/30101138. You monster."'
19469: '@rBattler said that without rage, ...but with a horribly cold voice.'
19470: '@r...Beato had also felt something out of place since the beginning.@k@rIn a fight, both of them could go at each other without restraint.'
19471: '@rHowever, he wouldn''t even step into the ring.@k@rShe could feel that coldness.'
19472: '@rBeato wasn''t pleased about that.@k@r...She thought about flaring up, but she held back.'
19473: '@rMaybe even though she was innocent and childish,@k she had enough sense to realize that she shouldn''t fight.'
19474: 'BEATRICE@r@v27/30701634."........................@k@v27/30701635. ..................Is that so?@k@v27/30701636. Then I will hide myself.@k@v27/30701637. ...Ronove, continue for me."'
19475: 'Ronove@r@v31/33100464."Certainly.@k@v31/33100465. ...Will that be satisfactory, Battler-sama?"'
19476: 'VIRGILIA@r@v30/33200449.".........There are no problems with that proposal.@k@v30/33200450. If Battler-kun says that he doesn''t want to see Beato''s face, I believe that will be an acceptable alternative."'
19477: 'Battler@r@v10/30101139."Do what you like.@k@v10/30101140. ...I couldn''t care less what you do as long as I don''t have to look at that monster''s face."'
19478: 'BEATRICE@r@v27/30701638."......Hey, wait a second.@k@v27/30701639. ...You keep saying "monster monster", but isn''t that a mean way to speak of me?"'
19479: 'BEATRICE@r@v27/30701640."......Why do you instinctively hate me so much, Battler?@k@v27/30701641. None of that was me, it was all the work of my disciple..."'
19480: 'Battler@r@v10/30101141.".........It''s not like I''m only mad about what happened just now.@k@v10/30101142. It''s from the very beginning."'
19481: 'BEATRICE@r@v27/30701642."Come on, Battleer.@k@v27/30701643. Don''t misunderstand, alright...?@k @v27/30701644.Aren''t we just a pair of players confronting each other through a game?@k@v27/30701645. ...We look for moves to make things painful for each other, but - "'
19482: 'Battler@r@v10/30101143."Don''t get the wrong idea.@k@v10/30101144. I don''t hate you because you''re my rival in this strange game about whether I accept you as a witch or not.@k@v10/30101145. ......I just cannot in any way forgive how senselessly cruel you are."'
19483: 'BEATRICE@r@v27/30701646."That''s because a serial murder is part of the game...@k@v27/30701647. It''s probably impossible to avoid a little cruelty..."'
19484: 'Battler@r@v10/30101146."I''m not just talking about what just happened.@k@v10/30101147. The last time, and the time before that too.@k@v10/30101148. ......Tearing everyone''s stomach and stuffing it with sweets, plowing their face.@k@v10/30101149. What was the point of all that?"'
19485: 'BEATRICE@r@v27/30701648."..................That''s...@v27/30701649.well - "'
19486: 'Battler@r@v10/30101150."All this stuff about locked-room murders and tricks and alibis,@k@v10/30101151. I''m willing to give you a pass on all that.@k@v10/30101152. You want to claim that these are murders done by magic,@k@v10/30101153. so I''ll grudgingly accept that those complicated crimes have to occur."'
19487: 'Battler@r@v10/30101154."......But what exactly are all those grotesque murders supposed to mean?"'
19488: 'BEATRICE@r@v27/30701650."............Well, umm,@v27/30701651. ...............nothing much..."'
19489: 'Battler@r@v10/30101155."That''s right.@k@v10/30101156. They don''t mean anything.@k@v10/30101157. You''re just fooling around by mangling the corpses for fun.@k@v10/30101158. That has nothing to do with whether you''re a witch, or whether it could or couldn''t be done with magic."'
19490: 'Battler@r@v10/30101159."You''re just exploring the depths of cruelty for fun.@k@v10/30101160. I don''t hate you because you''re a witch, or anything like that.@k@v10/30101161. There''s just some things I cannot forgive as a human."'
19491: 'BEATRICE@r@v27/30701652.".........Wh-@v27/30701653.......what do you mean, as a human...?"'
19492: 'Battler@r@v10/30101162."For example,@k@v10/30101163. ......the six people of the first twilight for this game.@k@v10/30101164. ...Well, other than Grandfather being burned black,@k@v10/30101165. the other five corpses were killed in a normal way, without any unnecessary shaming of the dead."'
19493: 'Battler@r@v10/30101166."...It wasn''t clear whether the weapon was a spear or a gun, but anyways, as far as killing goes, that was permissibly better.@k@v10/30101167_b. It was much better than the insanity and cruelty of the first twilight last time, or the time before that."'
19494: 'Battler@r@v10/30101168."And this time, there were six locked rooms tied together to make a locked-room chain.@k@v10/30101169. ......That was sort of interesting.@k@|@y@v10/30101170. When we were going back and forth with each other on that, to be perfectly honest, I thought it was just a little fun."'
19495: 'Battler@r@v10/30101171."...You were frantic to make me accept your existence, and I was frantic trying to deny it.@k@v10/30101172. ......We were both frantically doing all we could."'
19496: 'Battler@r@v10/30101173."This may sound weird, but I even felt a faint sense of sportsmanship between the two of us.@k@|@y@v10/30101174. ...We exist in conflict,@k@v10/30101175. but I faintly thought that we might not be completely unable to understand each other''s existence."'
19497: 'Battler@r@v10/30101176.".........But just now, that feeling was blown away without a trace."'
19498: 'BEATRICE@r@v27/30701654."Th-that''s where you''re misunderstanding...!@k @v27/30701655.That wasn''t me - "'
19499: 'Battler@r@v10/30101177."That''s not it.@k@v10/30101178. That''s not what I''m talking about!@k @|@y@v10/30101179.......You watched Auntie Rosa being killed horribly over and over,@k@v10/30101180. and you sneered at it like it was an interesting show."'
19500: 'Battler@r@v10/30101181..........When I saw that, I was deeply disappointed.'
19501: 'Battler@r@v10/30101182.When I realized that your decision to kill them in a slightly better way this time had been nothing more than a little whim,@k@v10/30101183. ...and that nothing had changed in your cruel character, I was deeply disappointed.'
19502: 'Battler@r@v10/30101184.And that''s not all, you were even genuinely enjoying a brutal death.@k@r@v10/30101185.You weren''t just acting as cruel as you could to bully me.'
19503: 'Battler@r@v10/30101186....You truly, genuinely enjoy cruelty.@k@r@v10/30101187.Your character lets you enjoy it.'
19504: 'Battler@r@v10/30101188.You saw Auntie Rosa being brutally killed over and over, and said, isn''t this fun?'
19505: 'Battler@r@v10/30101189.That wasn''t sarcasm, you enjoyed it from the bottom of your heart,@k@v10/30101190. wanted to share that feeling with me, and said, isn''t this fun?'
19506: 'Battler@r@v10/30101191.......In that instant, I despaired, and I realized the truth.'
19507: 'Battler@r@v10/30101192."The problem isn''t whether you''re a witch or not.@k@v10/30101193. ......That cruelty of yours is unforgivable to me.@k@v10/30101194. And I can''t understand it!@k @v10/30101195.I can''t forgive it, either!@k @v10/30101196.Still, I''ll continue this game of whether to accept or deny witches.@k@v10/30101197. I won''t step down and accept my own defeat."'
19508: 'Battler@r@v10/30101198."However, your pointless cruelty is absolutely not needed for that game.@k@v10/30101199. So I''ve decided that I won''t accept you as my opponent.@k@v10/30101200. Ronove is a hundred times better.@k@v10/30101201. He doesn''t have the same cruel hobby you do.@k@v10/30101202. Even if he does, he doesn''t have the awful taste to show it off in front of me."'
19509: 'Battler@r@v10/30101203."......That''s right, you have awful taste.@k@v10/30101204. You''re heartless and cruel, so you can''t understand.@k@v10/30101205. That''s unpleasant in an opponent.@k@v10/30101206. So I don''t want to see your face again."'
19510: '@rAfter Battler had finished his rant, Beato was shocked into silence for a long time.'
19511: '@rMaybe she couldn''t understand what she was being told,@k or maybe this was a sign that she was doing all she could in an effort to understand.'
19512: '@rFor a while, she kept switching between angry expressions, frustrated expressions, bold expressions,@k ......as though she didn''t even know herself what attitude she should take.'
19513: '@rIn the end, she made her face into a candid expression, as though she had come to her senses,@k and shrugged her shoulders as though she was tired.'
19514: 'BEATRICE@r@v27/30701656."........................@k@v27/30701657. .........In that case, do as you like.@k@v27/30701658. From now on, I will continue this game through Ronove.@k@v27/30701659. ......You have no complaints as long as I don''t show myself, right?"'
19515: 'Battler@r@v10/30101207."......For the time being.@k@v10/30101208. But I definitely won''t forgive your countless cruel actions up until now.@k@v10/30101209. So I definitely won''t accept you.@k@v10/30101210. For that reason as well, I won''t back down from this fight you''ve picked.@k@v10/30101211. And I definitely won''t lose.@k@v10/30101212. ...That''s all there is to it."'
19516: 'VIRGILIA@r@v30/33200451."...............Beato.@k@v30/33200452. No matter how many more excuses you give, his impression of you will not waver.@k@|@y@v30/33200453. ...I have something to talk about later.@k@v30/33200454. Until then, stay back."'
19517: 'BEATRICE@r@v27/30701660.".....................M-...mm...@k@v27/30701661. ...Alright.@k@|@y@v27/30701662. ...Then I''ll hide myself until I''m called..."'
19518: '@rLooking lonely, Beato turned her back to them, and hid herself.'
19519: '@r...Battler watched, a slightly displeased expression on his face.'
19520: '@rHe thought his argument had been valid, but for some reason, his mood didn''t clear up.'
19521: 'Battler@r@v10/30101213."......She''s...@v10/30101214.an idiot."'
19522: 'VIRGILIA@r@v30/33200455.".........That''s true.@k@v30/33200456. An idiot, and honest."'
19523: 'Battler@r@v10/30101215."That idiot watched with me as Auntie Rosa was horribly killed,@k@v10/30101216. and turned around with a huge smile on her face."'
19524: 'Battler@r@v10/30101217."......She really believed that she could laugh with me at that cruel show.@k@v10/30101218. ...She really believed that I could sympathize with that emotion..."'
19525: 'Battler@r@v10/30101219."Looking at that innocent smile, I felt just horrible.@k@v10/30101220. ......It would have been much better if she''d said it with her normal bullying face...@k@v10/30101221. ...Damn it..."'
19526: 'Ronove@r@v31/33100466."Milady has never had the experience of having a friend.@k@v31/33100467. ......In addition, she has probably never had something spoken to her that strongly."'
19527: 'Ronove@r@v31/33100468."Both Madam and I are her attendants.@k@v31/33100469. No matter what we say, it will not reach her ears.@k@v31/33100470. For Milady, this is also - "'
19528: 'Battler@r@v10/30101222."To hell with that.@k@v10/30101223. I don''t remember ever becoming her friend."'
19529: 'Ronove@r@v31/33100471."......That is true.@k@v31/33100472. My apologies."'
19530: 'VIRGILIA@r@v30/33200457.".....................@k@|@y@v30/33200458. ......There is one thing I would like to thank you for.@k@v30/33200459. ...Thank you for not backing down from that child''s game."'
19531: '@rShe spoke words of gratitude, but for some reason, Battler made a displeased face.'
19532: '@rThen, as though finding revulsion in his own bad mood, he chuckled.'
19533: 'Battler@r@v10/30101224."Now that I''ve even got witches and demons thanking me, I''m screwed.@k@|@y@v10/30101225. ......Let''s resume the game.@k@v10/30101226. Of course, I don''t intend to go easy on you."'
19534: 'Ronove@r@v31/33100473."I wouldn''t have it any other way.@k@v31/33100474. Unlike Milady, I do not get agitated."'
19535: 'Battler@r@v10/30101227."......I''ve already made my move.@k@v10/30101228. If we suppose that Auntie Rosa is the culprit and died in an accident, I can deny the witch.@k@v10/30101229. ......I don''t want to suspect Auntie Rosa, but for now I''ll deliberately assume that it was her, just to beat the hell out of Beato."'
19536: 'Ronove@r@v31/33100475."I will deny it with red.@k @v31/33100476.@|@y@c900.@[Rosa''s and Maria''s deaths were homicides.@]@c."'
19537: 'Battler@r@v10/30101230."Alright.@k@v10/30101231. ...Why don''t we start from there.@k@|@y@v10/30101232. ...............Damn, I''m just not getting fired up."'
19538: '@rSince Rosa and Maria had been killed, it had become clear that the murderer was still hiding somewhere,@k trying to add even more murders to this chain.'
19539: '@rAs he shed tears, Rudolf scolded Rosa''s body over and over for being reckless,@k but Rosa would never respond to that again.'
19540: '@rThey decided to place the two bodies in one of the guest rooms, and to seal it until the police arrived...'
19541: '@rThe second murder, ...no, the murder of the second twilight, had delivered a heavy blow to everyone.'
19542: '@rBecause it had blown away the optimism that some of them had held - @kthe thought that "actually, a crime didn''t occur, and it was all a game or a farce by Kinzo and the servants".'
19543: '@rTrying to distract themselves from the sadness of losing the people they loved,@k George and Jessica had spent the whole time since morning talking about every possibility.'
19544: '@r......And, they had distracted their hearts...@k@r...by supposing that these murders might actually have all been an act,@k and that Shannon and Kanon were only pretending to be dead.'
19545: '@rWhen the murders occurred again, it destroyed that thought,@k ......and they were once again confronted with the fact that their loved ones had most definitely been killed...'
19546: '@rThe tears that they''d thought had died away began to drip down once more, and Battler couldn''t think of anything to say to them...'
19547: '@rAfter that, to be extra cautious, all of the adults checked that all of the rooms were safe, and that everything was locked.'
19548: '@rThey made certain that the shutters on all of the windows were down and locked, and they checked that no one suspicious was hiding anywhere.'
19549: '@rOn top of that, they checked their weapons once again,@k and made sure that each other''s hearts were prepared, so that they wouldn''t hesitate to fire off a preemptive shot if they saw the shadow of a mysterious person.'
19550: '@rFurthermore, the gun Rosa had been holding had been left near the place she had been found.'
19551: '@rSomeone had gone out of their way to leave it there, so everyone suspected that it was some kind of trap,@k but when Hideyoshi made ingenious use of a fire iron to fire off a test shot, it discharged without a problem.'
19552: '@rWhen all five shots that had been loaded discharged without any problems as a result,@k it was reloaded with bullets and handed over to the only adult male who wasn''t armed, Hideyoshi.'
19553: '@rHowever, the fact that it had been able to fire off five shots gave rise to a certain paranoia.'
19554: '@rThis short barrel rifle could load a maximum of five shots.@k@rIn other words, Rosa hadn''t fired even once.'
19555: '@rAnd yet, the two had probably been killed by someone with their bare hands.'
19556: '@rThis meant there was a possibility that the crime had been committed by someone whose face they knew...'
19557: 'Kyrie@r@v09/31300273."......When the first murder occurred,@k@v09/31300274. I privately thought of the possibility that it was all an act."'
19558: 'Kyrie@r@v09/31300275."...My apologies to Doctor Nanjo, but if he had actually been in on it,@v09/31300276. and only convinced us that the servants were dead,@k@v09/31300277. I thought this could have been some massive, elaborate act by Father."'
19559: 'Kyrie@r@v09/31300278."......After all, unless we assume they were acting, that locked-room situation of theirs couldn''t have been created in the first place."'
19560: 'George@r@v07/30300057."...We also...@v07/30300058....suspected that.@k@v07/30300059. ...No,@v07/30300060. ...I still want to believe that''s the case."'
19561: 'Nanjo@r@v19/31900018."...............My apologies, ......but that is not so.@k@v19/31900019. ...I am quite old.@k@v19/31900020. There may be a chance that I made a misdiagnosis.@k@|@y@v19/31900021. ......However, I would never mistake whether they were alive or dead..."'
19562: 'Jessica@r@v04/30200101."I get it!@|@y@k @v04/30200102.Don''t frickin'' say it out loud, Doctor Nanjo...!"'
19563: 'Nanjo@r@v19/31900022."......My apologies..."'
19564: '@rThey couldn''t know about it,@k but Beato had already proclaimed the deaths of the six,@k ...no, this time the deaths of all victims so far, in red.'
19565: '@rThat faint dream that it was all a farce, and that the victims were actually alive,@k ......was, sadly, impossible...'
19566: 'Rudolf@r@v08/31200300."......In that case, it''s more natural to think there''s someone hiding on this island who knows the mansion inside out,@k@v08/31200301. carrying out a crime they''ve been planning for ages.@k@v08/31200302. In other words, from the time that the typhoon came to this island and sealed it off from the outside world, there were more than 18 people on this island."'
19567: '@rAnd, of course, they had no way of knowing this either:'
19568: '@rThat claim of Rudolf''s had also been denied in red.@k@rThere are no more than 18 humans on this island...'
19569: 'Kyrie@r@v09/31300279."Maybe it makes some sense if we think of it this way.@k@v09/31300280. ......Essentially, there''s the possibility that the person who''s hiding is someone who wasn''t originally supposed to be on the island right now,@k@v09/31300281. yet is someone whose face was known by Rosa-san, and with whom she would let her guard down."'
19570: 'Natsuhi@r@v03/30900115."......S-@v03/30900116.so, for example,@v03/30900117. could it be...a servant whose shift doesn''t lie on these two days...?"'
19571: 'Krauss@r@v02/30800248."Hmm......@k@v02/30800249. ...It''s hard to argue with that one.@k@v02/30800250. After they finish their duties, it is not as though we verify that they leave the island by punching a ticket or something.@k@v02/30800251. If we suppose that a servant on a shift from a few days ago only pretended to leave the island, and actually stayed here,@k@v02/30800252. that would be hard to deny..."'
19572: 'Hideyoshi@r@v06/31100328."......Rosa-san isn''t stupid, if you ask me.@k@v06/31100329. If a servant who''s not supposed to be here popped up in front of you, that''d normally set alarm bells ringing..."'
19573: 'Eva@r@v05/31000720."...............I have a problem with assuming this was a crime by an acquaintance.@k@v05/31000721. ...Perhaps whoever it was suddenly attacked Rosa from the darkness, and were about to steal her gun.@k@v05/31000722. Then Rosa fell, hit her head against the fence, and stopped moving.@k@v05/31000723. The guesthouse was nearby, so they wanted to avoid the sound of a gunshot, and they killed Maria-chan with their bare hands..."'
19574: 'Rudolf@r@v08/31200303."......That''s also a possibility.@k@v08/31200304. ...Still, even if that is the case..."'
19575: 'Rudolf@r@v08/31200305."Would they intentionally leave Rosa''s gun at the scene of the crime?@k@v08/31200306. I don''t know what the culprit is armed with, but our guns should be a point of worry for them.@k@v08/31200307. ...Wasn''t that a perfect chance for them to thin out our supply?@k @v08/31200308.Why''d they deliberately leave it at the scene of the crime?"'
19576: 'Kyrie@r@v09/31300282."At first, I thought that the gun was a trap.@k@v09/31300283. ......That''s what chessboard thinking says it would be.@k@v09/31300284. By purposefully leaving it, they wanted to make one of us touch it.@k@v09/31300285. And they must have wanted to make us pull the trigger.@k@v09/31300286. ...I was sure that it would have some dangerous device to make it explode and cause massive injuries."'
19577: 'Hideyoshi@r@v06/31100330."But, it''s actually alright.@k@|@y@v06/31100331. ......I''d say, the culprit was probably in a hurry.@k@v06/31100332. I''ll bet that right now, they''re regretting they missed their chance to steal a gun...!"'
19578: 'Battler@r@v10/30101233.".........I don''t like it.@k@v10/30101234. It pisses me off, ''cause it''s like a message from the witch, saying she isn''t even scared of guns."'
19579: 'Natsuhi@r@v03/30900118."...However, in any event, this is a fearsome opponent.@k@v03/30900119. It should have been obvious to any observer that Rosa-san was holding a gun.@k@|@y@v03/30900120. To think that they attacked her despite that.@k@v03/30900121. ......We should not neglect the fact that they are unafraid of guns."'
19580: 'Krauss@r@v02/30800253."Mm...@k@v02/30800254. It is as Natsuhi says.@k@v02/30800255. ......We should probably be even more cautious than we have been."'
19581: 'Kyrie@r@v09/31300287."This is just for peace of mind, but...@k@v09/31300288..........at the time we think Rosa-san went outside,@k@v09/31300289. where was everyone...?"'
19582: 'Krauss@r@v02/30800256."Natsuhi and I were here, along with Rudolf and Kyrie-san.@k@v02/30800257. I can guarantee their alibis."'
19583: 'Hideyoshi@r@v06/31100333."Eva and I were together.@k@v06/31100334. I can guarantee that."'
19584: 'Battler@r@v10/30101235."Me, George-aniki, and Jessica were together too.@k@v10/30101236. ......When Auntie Rosa yelled at us to go back upstairs,@k@v10/30101237. we turned right around and went back to the cousins'' room with our tails between our legs."'
19585: 'Jessica@r@v04/30200103."......Back then,@v04/30200104. ...if we hadn''t let Maria go..."'
19586: 'George@r@v07/30300061."Saying that isn''t going to change anything..."'
19587: 'Eva@r@v05/31000724."............Doctor Nanjo?"'
19588: 'Nanjo@r@v19/31900023."I, I was reading a book in one of the upstairs rooms.@k@|@y@v19/31900024. ......I was by myself, so no one can verify my alibi,@k@v19/31900025. but I believe everyone saw me return upstairs with the children."'
19589: 'Rudolf@r@v08/31200309."...You could say any number of things like this,@k@v08/31200310. but what if you jumped out the window, attacked Rosa,@k@v08/31200311. then climbed back up using the rain gutter or something...?"'
19590: 'Nanjo@r@v19/31900026."D-d-don''t be absurd...@k@v19/31900027. How could I perform a feat like jumping down from the second story with this old body...or climbing up, for that matter..."'
19591: 'Natsuhi@r@v03/30900122."......Let us stop this...@k@v03/30900123. Suspecting each other...@k@|@y@v03/30900124. It''s more important that we trust each other, and, for the children''s sakes as well, defend this place until the very end."'
19592: 'Rudolf@r@v08/31200312."Yeah...@k@v08/31200313. ...It''s like Natsuhi-san says.@k@v08/31200314. .........For now, let''s stop doubting each other."'
19593: 'Kyrie@r@v09/31300290."You''re right.@k@v09/31300291. ...We may be useless as far as searching for the culprit is concerned.@k@|@y@v09/31300292. ......We can only stay alive until tomorrow, inform the police, and follow their instructions.@k@v09/31300293. Because the police will definitely expose who the culprit is."'
19594: 'Hideyoshi@r@v06/31100335.".........What is it, Eva?@k@v06/31100336. ...Is your body still feelin'' bad...?"'
19595: 'George@r@v07/30300062."M-Mother, what''s wrong?@k@v07/30300063. Are you alright...?"'
19596: 'Eva@r@v05/31000725."...Sorry.@k@v05/31000726. ...It looks like my fever is still strong.@k@v05/31000727. I''ll be fine, so leave me alone..."'
19597: '@rWhen they looked, they saw Eva staring at the floor, her breathing harsh again.@k@r...She had been able to act firm for a time, due to the urgency of their situation,@k but it seemed her body wasn''t at its best after all...'
19598: 'EVA@r@v34/33300331."Yes.@k@v34/33300332. I killed those two.@k@v34/33300333. Now, the only ones who know about the gold are us.@k@v34/33300334. I won''t give up even a scrap to the other siblings."'
19599: 'Eva@r@v05/31000728."............What have you done......!@k @v05/31000729.There''s so much of that gold!@k @v05/31000730.Giving Rosa and the others their share wouldn''t have been a problem at all...!"'
19600: 'EVA@r@v34/33300335."It would.@k@v34/33300336. ...That gold is to be passed on only to the head of the Ushiromiya family.@k@v34/33300337. And that makes that gold, all of it, in its entirety, the very honor of the head."'
19601: 'EVA@r@v34/33300338."......Putting even the smallest dent in it...@k@v34/33300339.is definitely not something I will permit as the new Golden Witch, BEATRICE.@k@|@y@v34/33300340. ......*giggle*giggle*giggle*giggle*giggle*!"'
19602: 'Eva@r@v05/31000731."...Do you plan to continue these murders according to the witch''s epitaph...?@k @v05/31000732.Do you actually plan to kill five more people...?"'
19603: 'EVA@r@v34/33300341."Yes.@k@v34/33300342. If I don''t finish that annoying ritual, it seems that my power as a witch won''t become complete.@k@|@y@v34/33300343. ......Hey, "me"..."'
19604: 'EVA@r@v34/33300344."...The power of the witch is really awesome.@k@v34/33300345. It really can make all of our fantasies become reality.@k@v34/33300346. The power to make dreams more than just dreams...!"'
19605: 'EVA@r@v34/33300347."Now that I''ve learned of this power, I can no longer stop being a witch.@k@v34/33300348. If I can complete the ritual and make my power whole, I''m sure I''ll be able to teach you that feeling too.@k@|@y@v34/33300349. *giggle*giggle*giggle*, *cackle*cackle*cackle*cackle*cackle*!"'
19606: 'Eva@r@v05/31000733."Stop acting like an idiot...!@k @v05/31000734.Haven''t you played witch enough?@k @v05/31000735.We found the gold.@k@v05/31000736. And we''ve even been promised the position of successor to the head.@k@v05/31000737. We''ll probably need to tightrope walk just a bit, but at this point, that''s a dream that will definitely come true.@k@v05/31000738. ......Beyond that, what more could you wish for...?!"'
19607: 'EVA@r@v34/33300350."I wanted to become a witch."'
19608: 'Eva@r@v05/31000739."I don''t know anything about that dream...!"'
19609: 'EVA@r@v34/33300351."That''s it.@k@v34/33300352. Because I kept holding on to that dream, I''ve lived at this age forever.@k@v34/33300353. ......You threw that dream away by becoming an adult."'
19610: 'EVA@r@v34/33300354."......You thought, no matter how long you waited, the rabbit holding a clock wouldn''t visit you,@k@v34/33300355. and you wouldn''t be able to meet Humpty Dumpty.@k@v34/33300356. And of course, you definitely wouldn''t be invited to the land of cards.@k@v34/33300357. You gave up like that, and so you became an adult."'
19611: 'EVA@r@v34/33300358."And that''s why you don''t want to become a witch or anything like that anymore.@k@v34/33300359. ...You''ve even forgotten that it was the dream of your true self."'
19612: 'Eva@r@v05/31000740."......Look, just stop it!@k @v05/31000741.I''ve already gotten my hands on two dreams!@k @v05/31000742.The gold and the position of head.@k@v05/31000743. That''s more than enough!@k @v05/31000744.So please, your dream has nothing to do with me!@k @v05/31000745.Be obedient...!!"'
19613: 'EVA@r@v34/33300360.".........No waaaay.@k@v34/33300361. Magic''s too much fun.@k@|@y@v34/33300362. .........Besides, those two dreams of yours both came true because of my magic.@k@v34/33300363. It''s not fair if my dream doesn''t come true too."'
19614: 'Eva@r@v05/31000746."I am grateful for your magic, and I accept you as a real witch.@k@v05/31000747. ......So please, be obedient now and return to the inside of my heart!@k @v05/31000748.And never appear again!!"'
19615: 'EVA@r@v34/33300364."No waaay.@k@v34/33300365. ......We''re both misunderstanding each other, aren''t we?@k@v34/33300366. That''s right, I am not you anymore.@k@v34/33300367. You are Ushiromiya Eva.@k@v34/33300368. I am the Golden Witch BEATRICE."'
19616: 'EVA@r@v34/33300369."So I have no responsibility to go back inside your heart.@k@v34/33300370. ......I would say I feel like a butterfly who has broken out of her cocoon, namely you."'
19617: 'Eva@r@v05/31000749."............haah,@v05/31000750. ......haah......@k@v05/31000751. ...Urg,@v05/31000752. ......the fever...@v05/31000753.is making my mind cloudy......"'
19618: 'EVA@r@v34/33300371."My inexperience with my magic power is making me support it with your vitality.@k@v34/33300372. Until I finish the ritual and become a full witch, you might have to bear the burden.@k@v34/33300373. I''ll take that in exchange for making two of your dreams come true."'
19619: 'EVA@r@v34/33300374."......It''s alright, don''t worry, okay?@k @v34/33300375.For the remaining five sacrifices, I''ll avoid your family."'
19620: 'EVA@r@v34/33300376."Let''s see, Rudolf, Kyrie, Krauss, Natsuhi.@|@y@k@v34/33300377. ...And what about that old geezer Nanjo?@k @v34/33300378.Perfect, I''ll kill those five people.@k@v34/33300379. *giggle*giggle*, could you call this a murder announcement revealed only to yoouu?@k@v34/33300380. *giggle*giggle*giggle*giggle*!!"'
19621: '@rEva finally crouched down.@k@rHideyoshi rushed up to her, and lent her his shoulder...'
19622: 'Hideyoshi@r@v06/31100337."......Are you alright?@k@v06/31100338. ...Let''s take it easy and rest!"'
19623: 'Krauss@r@v02/30800258."Are you alright...?@k@v02/30800259. Doctor Nanjo, take a look at Eva...!"'
19624: '@rWhen Nanjo and George tried to approach, Eva made a gesture to stop them.'
19625: 'Eva@r@v05/31000754."...Thank you.@k@v05/31000755. I''m fine, Doctor Nanjo.@k@v05/31000756. I''m taking medicine.@k@v05/31000757. ......I apologize for saying this in such an extreme situation,@k@v05/31000758. ...but let me rest a little longer..."'
19626: 'George@r@v07/30300064."Mom...I''ll lend a hand too..."'
19627: 'Eva@r@v05/31000759."Thank you,@k@v05/31000760. but I''ll be fine as long as your father watches over me.@k@v05/31000761. ......Go back to the cousins'' room upstairs, and don''t come out no matter what.@k@v05/31000762. ...Understood...?@k@v05/31000763. No matter what happens, you must not leave the guesthouse......"'
19628: 'Eva@r@v05/31000764."...Outside,@v05/31000765. ......that...witch is......@v05/31000766.uuuuhrg..."'
19629: 'Hideyoshi@r@v06/31100339."Don''t talk anymore...!@k @|@y@v06/31100340.Sorry, everyone, but I''ll be watchin'' over Eva in the room.@k@v06/31100341. Call if somethin'' happens."'
19630: '@rHideyoshi and Eva retreated from the lobby.'
19631: '@r...Of course, Eva wasn''t the only one who wasn''t feeling well.@k They hadn''t gotten a wink of sleep since the previous night, and had been pressed by tension since the morning.'
19632: '@r...They were mustering their energy to protect their families,@k but if they relaxed even a little, surely every of one them would be down and out...'
19633: 'BEATRICE@r@v27/30701663."......Everything has gone as planned so far, but from here on out, it will become difficult, you see?"'
19634: 'EVA@r@v34/33300381."Difficult, you say...?"'
19635: 'BEATRICE@r@v27/30701664."Mm.@k@v27/30701665. In most cases, as the ritual progresses and the victims increase, they begin to tighten their guard,@k@v27/30701666. and often, they hole up in one place and stop moving.@k@v27/30701667. That is extremely inconvenient for us."'
19636: 'EVA@r@v34/33300382."...Are you saying that we witches are inferior to a bunch of Humans in a group...?"'
19637: 'BEATRICE@r@v27/30701668."Witches are never inferior to Humans...@k@v27/30701669. However, perhaps you could say that times change, and that Humans have gotten their hands on a poison..."'
19638: 'BEATRICE@r@v27/30701670."......This wasn''t a problem long ago, during the period when witches were believed in,@k@v27/30701671. but just like that annoyance Battler, people in the current era generally deny magic."'
19639: 'BEATRICE@r@v27/30701672."In other words, their existence itself is anti-magical.@k@v27/30701673. As a result, at some point, they grew to possess a toxin inside their bodies that denies magic."'
19640: 'EVA@r@v34/33300383."In other words, you''re saying that the more Humans there are,@k@v34/33300384. the stronger that anti-magic toxin gets, and the greater the disadvantage is for us witches?"'
19641: 'BEATRICE@r@v27/30701674."......The total value of all their hearts'' power to deny magic, in other words their Magic Resistance, becomes the denominator to our Magic.@k@v27/30701675. Understand?@k @v27/30701676.Is that a bit too difficult for you...?"'
19642: 'EVA@r@v34/33300385."You''re joking.@k@v34/33300386. I understand it truly easily.@k@v34/33300387. ...In other words, you''re saying that the more people there are that don''t believe in magic,@k@v34/33300388. and the stronger their will is, the greater the dramatic division in the effect of the magic is.@k@v34/33300389. ......I see, if that''s the kind of formula it is, I''ll have to rethink my method of attack."'
19643: '@rFundamentally, magic possesses a vast power.'
19644: '@rIt can even make a rain of fire fall from the heavens, divide a sea, and reviving a lost life isn''t impossible either.'
19645: '@rHowever, that power is extremely weak against the toxin that rejects it.'
19646: '@rAnd that toxin has been piling up in Humans since the time they forgot their respect for all things sacred,@k ...until finally, this earth was covered with enough toxin that the miracles of magic could not be displayed.'
19647: '@rThus, witches from across the world were chased from their dwellings.'
19648: '@r...They were forced to choose whether to throw away their magic and live as Humans, or live in hiding in remote areas where the toxin of Humans didn''t reach.'
19649: '@rIn that sense, Rokkenjima, with its population of only ten to twenty humans, was extremely favorable for witches.'
19650: '@rAnd even more favorable was the existence of the ghost story about the witch who lived in the Rokkenjima forest.'
19651: '@r...Essentially, the fear that a witch might exist permeates the island to a certain extent,@k weakening the anti-magic toxin from the Humans.'
19652: '@rA small population, and a margin of possibility to accept a magical being.@k@rIn other words, minds that were only weakly anti-magical.'
19653: '@r...Only in the valley where those two converged...could a witch live in modern times...'
19654: 'EVA@r@v34/33300390."I see...@k@v34/33300391. ......So by this formula, we can say that there are several rules a witch must follow to use her power efficiently."'
19655: 'EVA@r@v34/33300392."The first one is creating a scene.@k@v34/33300393. Create a murder scene that you couldn''t imagine was done by Humans, decorate it with occult ornaments,@k@v34/33300394. make it look very much like a witch exists, and by permeating the people with fear, make them believe that witches exist,@k@v34/33300395. and as a result, the anti-magic power and the denominator for the power of the magic will be decreased."'
19656: 'EVA@r@v34/33300396."......I see, so this is why the creepy magic circles of the first twilight were created?"'
19657: 'BEATRICE@r@v27/30701677."Th-that''s right, exactly...!@k @v27/30701678.The gaudy scenes for the first twilight each game are all for that reason.@k@|@y@v27/30701679. It''s definitely not as though I like cruel things or am doing it for fun..."'
19658: 'EVA@r@v34/33300397."...In that case, Predecessor-sama,@k@v34/33300398. this time was a failure.@k@v34/33300399. You killed them in a very plain way.@k@v34/33300400. It doesn''t look like anything more than a simple mystery."'
19659: 'EVA@r@v34/33300401.".........You should have damaged the bodies more grotesquely, like you did last time and the time before that, as I heard from Ronove,@k@v34/33300402. making it look like a fantasy and instilling fear in those people."'
19660: 'BEATRICE@r@v27/30701680.".........W-...well, about that.@k@v27/30701681. ...I thought it wouldn''t be artful to do that every time, you understand...?@k @v27/30701682.Don''t think too deeply on it, it''s just a whim...!"'
19661: '@rActually, it really had been her whim.@k@rAfter being told all that by Battler, she couldn''t say it out loud anymore,@k but she had decided her method of killing based only on a whim.'
19662: '@rNo, would it be better to say that she had halfheartedly let Ronove decide?@k@rBecause she had left the locked room of this game''s first twilight to him.'
19663: '@rBut if Beato had gotten a cruel idea, then she surely would have explored the limits of atrocity even worse than the last game...'
19664: 'EVA@r@v34/33300403."...........................@k@v34/33300404. For the methods of Rosa and Maria''s deaths too, you told me to show restraint,@k@v34/33300405. but that wasn''t a course of action beneficial to us witches either, was it?"'
19665: 'EVA@r@v34/33300406."In actuality, at the present moment, none of them believe one bit that a witch actually exists.@k@v34/33300407. They''re sure that it isn''t a fantasy, but completely in the mystery genre.@k@v34/33300408. This turn of events is a failure for us witches.@k@v34/33300409. ......And it''s all because, for some reason, you keep doing things in a kinda lukewarm way, Predecessor-sama."'
19666: 'BEATRICE@r@v27/30701683."Aah... L-like they say, you should seek out work while you''re young...!@k @|@y@v27/30701684.This is a test from me to you as your predecessor.@k@v27/30701685. Challenge it with respect.@k@v27/30701686. Wahahaha...!"'
19667: '@rBeato tried to laugh heartily,@k but it was obviously a fake laugh trying to cover something up,@k and the new witch shrugged, sighing.'
19668: 'EVA@r@v34/33300410."........................@k@v34/33300411. ...At this stage, it''s probably too late to reduce the anti-magic power by creating a scene.@k@v34/33300412. ...In that case, there''s another move.@k@v34/33300413. Having the Humans split up should work."'
19669: 'BEATRICE@r@v27/30701687."Mmhm, that is probably the most effective way.@k@v27/30701688. The smaller the number of Humans, the more the denominator shrinks.@k@v27/30701689. As a result, the magic power becomes immediately effective.@k@v27/30701690. ...In other words, the crucial point from here on will be how to destroy this barricade situation and have them split up into small groups."'
19670: 'BEATRICE@r@v27/30701691."However, they are already very cautious.@k@v27/30701692. The barricade won''t be destroyed easily, you know...?@k @v27/30701693.Both the barricade in Kinzo''s study two games ago and the barricade in the parlor last time were very stubborn.@k@v27/30701694. Furthermore, most of the cunning adults have been left this time."'
19671: 'BEATRICE@r@v27/30701695."The situation is more difficult than all the ones before it, you see?@k @v27/30701696.......If you wish, I could give you some special advice..."'
19672: '@rIf the first murder case occurs in a closed circle, the survivors hole up without fail,@k gathering together to observe each other and ensure their safety.'
19673: '@r......Worrying about how to break that situation apart is probably the domain of murderers and mystery authors,@k so how ludicrous it is that witches, who are meant to exist at the other end of the spectrum, share in that exact same worry.'
19674: '@rFor a while, the new witch poked her cheek with her index finger, making gestures as though deep in thought, and eventually spoke.'
19675: 'EVA@r@v34/33300414."...........................@k@v34/33300415. ......No, I''m fine.@k@v34/33300416. After all, it is a test.@k@v34/33300417. ......I won''t borrow your moves."'
19676: 'BEATRICE@r@v27/30701697."Mh, ...really...?@k @v27/30701698....The thing is, though, it will be pretty hard to defeat this barricade, you know...?"'
