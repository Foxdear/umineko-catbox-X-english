16249: 'Battler@r@v10/30100357."You declined, yes......?@k @|@y@v10/30100358.Which means that, from now on,@k@v10/30100359. I can create as many fictional character Xs outside of the 18 as I want...?"'
16250: 'BEATRICE@r@v27/30700376."Do as you wish.@k@v27/30700377. ...I have declined your repetition.@k@v27/30700378. Isn''t that enough for now?@k @v27/30700379.......The reason I declined was...@v27/30700380.......@k@v27/30700381. ...No, I will not reveal that for now.@k@v27/30700382. You will know soon in any case."'
