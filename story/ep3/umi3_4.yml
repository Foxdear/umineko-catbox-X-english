15940: 'Battler@r@v10/30100187."...I see...@k@v10/30100188. So, not a witch, but a mistress by the name of BEATRICE did exist on the island..."'
15941: 'Battler@r@v10/30100189."......So there can be more than 18 people!@k @v10/30100190.Which means I can defeat that line of reasoning which says that, if it was impossible for all 18 people, it must be a crime involving magic.@k@v10/30100191. ......That''s some big information."'
15942: 'Ronove@r@v31/33100046."Excuse me.@k@v31/33100047. Battler-sama, would you care for some black tea and cookies?"'
15943: '@rBeato''s butler, who called himself Ronove, appeared out of nowhere in particular.'
15944: '@rPlaced upon the silver tray that he held was a plate filled with delicious-looking, steaming black tea and cookies.'
15945: '@r...I really don''t like this guy''s smile.@k@rFor some reason, it doesn''t look like a smile used to warmly greet a guest.@k@rIt feels like he''s making fun of me for some reason.'
15946: '@r...I don''t know whether he really takes me for an idiot,@k or whether it''s just a joke or something, but it''s really irritating me.'
15947: 'Battler@r@v10/30100192."......I don''t want any.@k@v10/30100193. I''m busy right now.@k@v10/30100194. Leave me alone."'
15948: 'Ronove@r@v31/33100048."Oh, my.@k@v31/33100049. That is a shame, when the cookies have turned out oh so very delicious.@k@v31/33100050. Cooked so wonderfully it is a shame to waste them on a simple Human, truly wonderful cookies."'
15949: 'Battler@r@v10/30100195."I''ll eat some when I feel like it.@k@v10/30100196. Set it down somewhere over there and get out of here."'
15950: 'Ronove@r@v31/33100051."Will that be acceptable?@k@v31/33100052. Then I shall do so.@k@v31/33100053. You may eat them when they get cold and stale, and then regret as much as you like that you did not eat them when they were freshly baked."'
15951: 'Battler@r@v10/30100197.".........You really are annoying.@k@v10/30100198. ...Well, you''re a lot better than that Beato, who keeps doing that creepy cackle right next to my ear."'
15952: 'Ronove@r@v31/33100054."Oh, yes, yes, that is quite true.@k@v31/33100055. There are times when Milady''s laughter becomes quite undignified.@k@v31/33100056. Every time I hear it, I think of my noble rank,@k@v31/33100057. and struggle to comprehend why I must have such a person as my master.@k@|@y@v31/33100058. Pu ku ku ku..."'
15953: 'Battler@r@v10/30100199."......Man, you''re weird.@k@v10/30100200. If you don''t like it, then couldn''t you just not work for her?"'
15954: 'Ronove@r@v31/33100059."To continue serving despite that is furniture''s joy.@k@v31/33100060. One could not serve as furniture without such an attitude."'
15955: 'Ronove@r@v31/33100061."......Let us set that aside.@k@v31/33100062. How has the game been proceeding?@k @v31/33100063.Just now, I believe I heard you say that you had found some good information, and were quite pleased by it.@k@v31/33100064. Well now, I wonder what your shallow wit has thought up."'
15956: '@rAs Ronove made fun of me and giggled,@k he followed my earlier words to the letter and placed the black tea and cookies somewhere arbitrary nearby.'
15957: 'Ronove@r@v31/33100065."......I imagine it is because you have gained increased confidence in the existence of a 19th person?@k @v31/33100066.Would you be gracious enough to allow me to hear your opinion?"'
15958: 'Battler@r@v10/30100201."..................@k@v10/30100202. ......Yeah, sure.@k@v10/30100203. I''m just going to say it again in front of Beato anyway.@k@v10/30100204. No reason to hide it."'
15959: 'Battler@r@v10/30100205."......Alright.@k@v10/30100206. It looks like there''s a hidden mansion somewhere on this island, and that Grandfather had his mistress living there.@k@v10/30100207. In that case, the question that''s been torturing me, about whether there are 18 or 19 people, can be easily resolved."'
15960: 'Ronove@r@v31/33100067."Although you deny witches,@k@v31/33100068. you hold a double standard by refusing to seek a culprit among the 18, and have driven yourself into a dead-end."'
15961: 'Battler@r@v10/30100208."...The easiest way to deny the witch would be to doubt one of the 18.@k@v10/30100209. ......It''s not so easy for every one of the 18 to have an alibi.@k@v10/30100210. You always find at least one person with a fragile alibi.@k@v10/30100211. ......I could probably continue to deny the witch forever if I just used that person as a sacrifice."'
15962: 'Battler@r@v10/30100212."However, I will steadfastly refuse to do that!!@k @v10/30100213.Yeah, that''s no good, that''s no goddamn good at all!@k @v10/30100214.Every one of those 18 people is either a parent, a relative or a cousin to me!@k @v10/30100215.And those reliable servants, who are sometimes serious and sometimes funny.@k@v10/30100216. I won''t let myself use any one of them as a sacrifice!!"'
15963: 'Battler@r@v10/30100217."In the past, my resolve wavered.@k@v10/30100218. That''s how Beato hit me where my heart was weak."'
15964: 'Ronove@r@v31/33100069."......Accepting and understanding your own weaknesses.@k@v31/33100070. That is not something which can often be accomplished.@k@v31/33100071. Battler-sama, you are using this theory about a 19th person as a spear.@k@v31/33100072. ...Or should I say, a shield?"'
15965: 'Ronove@r@v31/33100073."In any event, unlike how unprepared you were in the games up until now,@k@v31/33100074. let us call the fact that you now have a compass bearing on how to fight...a dramatic leap forward.@k@v31/33100075. With this, you need not doubt any of the 18 you love and respect,@k@v31/33100076. and can easily suspect a 19th person, and pursue your theory that the culprit is a human."'
15966: 'Battler@r@v10/30100219."That''s it exactly.@k@v10/30100220. Like in the first game, when Kanon-kun was killed in the boiler room,@k@v10/30100221. ...and a bunch of other places,@k@v10/30100222. there are countless tricks I can use without hesitation if a 19th person existed."'
15967: '@rIn the very first game, Kanon-kun had been killed in the boiler room.'
15968: '@rOne might think that he was attacked by Kumasawa-san, who had gone down into the boiler room with him,@k or maybe that someone who had appeared to be dead earlier was actually faking,@k and had ambushed Kanon-kun in the boiler room.@k Either way, it was a move that forced me to suspect one of the 18.'
15969: '@rHowever, by simply proposing that a 19th person exists,@k there''s no longer any need to suspect one of the 18 for that murder in the boiler room.'
15970: 'Battler@r@v10/30100223."In short!@k @v10/30100224."Impossible for any of the 18 = The culprit is a witch"...@k@v10/30100225. is an equation that I can now deny."'
15971: '@rUsing this argument, we can take, for example, the question which has been raised once again in this game,@k "who gave Maria the letter?",@k and come up with an easy explanation.'
15972: '@rEven if all 18 people have alibis,@k I can easily explain everything by saying that a 19th person visited her and gave her the letter.'
15973: 'Ronove@r@v31/33100077.".........Hmm, hmm.@k@v31/33100078. I think that is quite a good move.@k@v31/33100079. How would I strike back?"'
15974: 'Ronove@r@v31/33100080."......Battler-sama, despite your understanding, there are still plenty of weak points.@k@v31/33100081. Perhaps the "18 people attack" will be an effective move.@k@v31/33100082. As an attempt to judge how strong your defense is, it may be interesting to attack from that angle again."'
15975: 'Battler@r@v10/30100226."Then how would you do it,@k@v10/30100227. demon butler...?!"'
15976: 'Ronove@r@v31/33100083."......I believe it would be appropriate to attack this 19th piece that you have played.@k@|@y@v31/33100084. Battler-sama, have you ever met this 19th person?@k @v31/33100085.May I ask you for some proof that this 19th person exists?"'
15977: 'Battler@r@v10/30100228."How naive.@k@v10/30100229. Of course, I knew you''d probably try that move...!"'
15978: 'Ronove@r@v31/33100086."My, my.@k@v31/33100087. Please respond to it."'
15979: 'Battler@r@v10/30100230."Witches and demons and the like...@k@v10/30100231. There''s no move more appropriate for you than this one.@k@v10/30100232. ......And that is—"'
15980: 'Battler@r@v10/30100233."The "Devil''s Proof"!"@|@y'
15981: '@rWhen we humans are accused of something, we always counterattack by saying to show some evidence.@k Because that''s a human move.'
15982: '@rBut I''m fighting with a witch.@k@rI''m taking part in a battle with someone who isn''t human!'
15983: '@rAnd some moves exist which can only be used in a game against a witch.@k@rThere are cheap moves!'
15984: '@rAnd that''s what this "Devil''s Proof" is.@k@rTherefore, evidence is unnecessary!'
15985: '@rLet''s take the assumption that there is a hidden mansion on Rokkenjima separate from the Ushiromiya family mansion,@k and that a woman named BEATRICE is living there.'
15986: '@rIn order to prove this, one must find this mansion and actually bring BEATRICE out of it.'
15987: '@rThat''s called "material proof" in the human world.'
15988: '@rHowever, if we follow the rules of the "Devil''s Proof", you can''t disprove that she exists, even if there''s no evidence that she does.'
15989: '@rBecause it''s impossible to prove that something doesn''t exist.'
15990: '@r......That''s right, this "Devil''s Proof", which tormented me so much before, I''ve finally managed to use to my own advantage.'
15991: '@rThose guys were always trying to force me to accept the existence of the witch by using the "Devil''s Proof".'
15992: '@rThat was because, in response to Beato''s professions that witches do exist,@k I physically could not offer any proof that "witches don''t exist".'
15993: '@rThat is why I have been subjected to this nonsense that witches exist, and why I have been unable to counterattack.'
15994: '@rAnd that''s why I''ll flip over the chessboard right now!'
15995: '@rIf I can''t disprove that witches exist, then that means,@k@|@y if I suggest that a 19th human exists, you can''t disprove that either.'
15996: '@rIn other words, the enigmatic mistress in question is craftily hiding herself, so it''s perfectly natural that you can never find her no matter how hard you look.'
15997: '@rSo you can''t say that "The 19th person can''t be found = The 19th person doesn''t exist".'
15998: '@rTherefore, it is impossible to disprove a 19th person.@k@rBeato used the "Devil''s Proof" to make denying her existence impossible,@k but this time it''s become my weapon.'
15999: '@rIf we can get away with this argument, then never mind a 19th person,@k this island could be full of people we don''t know about,@k and even if there are ten or a hundred of them hiding, she still can''t disprove that they exist.'
16000: '@rIn the last game and the one before that, among the murder scenes that showed up, there were several that were extremely intricate and must have taken a lot of effort to set up.'
16001: '@rIt''s very difficult to imagine that a single culprit could have set all of those up.'
16002: '@rHowever, if not just a 19th person, but ten or a hundred people were hidden somewhere, that wouldn''t be any problem at all.'
16003: '@rIf they all split up the work, they could handle any job in a short period of time.'
16004: '@rOf course, doubts will naturally arise at whether a large group of people like that could sneak around the mansion without being noticed,@k but those are all settled by the "Devil''s Proof".'
16005: '@rBecause not seeing or not noticing a hundred people inside the mansion does not disprove that they were there.'
16006: '@rEven though I''m saying it myself, it''s such a stupid argument that it makes me wanna throw up!@k However, it''s because it''s such a dirty-as-hell move that makes it the perfect one to use against a witch.'
16007: '@rWell, we''re only imagining here,@k ...but the thought of about a hundred suspicious men wearing goat masks hiding in the shadows......@k That goes beyond "funny", makes me think of cockroaches.'
16008: '@rIf you see one, it means there''s a hundred hiding in the shadows.'
16009: 'Battler@r@v10/30100234."......Well, I do think this is a ridiculous argument that''s horribly twisted.@k@v10/30100235. If my opponent was human, I''m sure they''d yell at me like I was out of my mind."'
16010: 'Battler@r@v10/30100236."......But my opponent is a witch.@k@v10/30100237. And after all, that is the kind of competition we''re having, isn''t it?@k @v10/30100238.I''ll use any kind of reckless argument to explain it using humans, and deny the witch!!"'
16011: 'Battler@r@v10/30100239."......Anyway, with this move, I''ll never again have to doubt any of the 18 who are close to me.@k@v10/30100240. I will never again repeat the defeat I suffered last time...!!"'
16012: 'Ronove@r@v31/33100088."......I see.@k@v31/33100089. You have learned from your defeat last time.@k@v31/33100090. That is good.@k@v31/33100091. It is no surprise that by the third game you have become quite devious."'
16013: 'Ronove@r@v31/33100092.".........You first strengthen your own defense.@k@v31/33100093. That is truly a solid first step.@k@v31/33100094. Quite a spectacular move, I think."'
16014: 'Battler@r@v10/30100241."Well, even if we do assume that there is a 19th person,@k@v10/30100242. there are still a few tricks left that I can''t get past no matter how many humans I add, like the number of master keys.@k@v10/30100243. ...Still, it isn''t bad as a first step, for the time being."'
16015: 'Ronove@r@v31/33100095."This is your trump card, the important piece known as the 19th person.@k@v31/33100096. ......You countered my move of asking for evidence by using the "Devil''s Proof".@k@v31/33100097. ......A good skirmish."'
16016: 'Ronove@r@v31/33100098."Although I have no excuse for making moves by myself when Milady is absent,@k@v31/33100099. .........I find that I too have become slightly interested.@k@v31/33100100. ...I wonder if you would permit me to make yet another move on Milady''s behalf?"'
16017: 'Battler@r@v10/30100244."......Go for it.@k@v10/30100245. I don''t care if you''re a witch or a demon, I''ll take you all on!"'
16018: 'Ronove@r@v31/33100101."The move that you made, the "Devil''s Proof".@k@v31/33100102. It is a specialty of us demons, but there are also various other moves available to us.@k@v31/33100103. ......Do you know of a move called "Hempel''s Raven"?"'
16019: 'Battler@r@v10/30100246."Hempel''s Raven...??@k @v10/30100247.What are you talking about?"'
16020: 'BEATRICE@r@v27/30700230."...*cackle*cackle*.@k@v27/30700231. Ah-hahahahahahahahah-hahahahah-hah-ha...!"'
16021: '@rJust then, ...aah, that laugh, which gets on my nerves every time I hear it, started echoing around.'
16022: '@rThe room was filled with dazzling golden butterflies, and in the center of that whirlwind, the Golden Witch appeared.'
16023: 'Ronove@r@v31/33100104."Why, if it isn''t Milady.@k@v31/33100105. Good morning."'
16024: 'BEATRICE@r@v27/30700232."I thought you might be doing something interesting while I was away."'
16025: 'BEATRICE@r@v27/30700233."......''Hempel''s Raven'', was it?@k@v27/30700234. What an amusing and nostalgic move.@k@v27/30700235. To think the day would come when it would be introduced to Battler.@k@v27/30700236. It''s a classic move to use against the "Devil''s Proof"."'
16026: 'BEATRICE@r@v27/30700237."......Ronove, I will make this move.@k@v27/30700238. Do not get in the way of my fun."'
16027: 'Battler@r@v10/30100248."So you''ve finally shown up, you guffawing witch.@k@v10/30100249. I see you still have that undignified laugh.@k@|@y@v10/30100250. ......This guy was talking behind your back just now, telling me about how your laughing lacks class.@k@v10/30100251. Right?"'
16028: 'BEATRICE@r@v27/30700239."I am offended.@k@v27/30700240. Is that true?"'
16029: 'Ronove@r@v31/33100106."By no means.@k@v31/33100107. I have only words of the highest heartfelt respect for Milady;@k@v31/33100108. why would I speak such gossip?"'
16030: 'Battler@r@v10/30100252."...I can''t believe you can say that so brazenly.@k@v10/30100253. Doesn''t look like we''ll be getting along well together..."'
16031: 'BEATRICE@r@v27/30700241."*cackle*cackle*cackle*.@k@v27/30700242. Well, that is fine.@k@v27/30700243. Let us return to the conversation.@k@v27/30700244. "Hempel''s Raven" is used to show proof using the contrapositive."'
16032: 'BEATRICE@r@v27/30700245."......Essentially, it is a move like this:@k@v27/30700246. What must you do to prove that ravens are black?"'
16033: 'Battler@r@v10/30100254."Huh?@k @v10/30100255.What are you talking about??@k @v10/30100256.Prove that ravens are black...@k@|@y@v10/30100257. ...Wouldn''t you just have to catch the ravens and check to see if they''re black?"'
16034: 'BEATRICE@r@v27/30700247."That is right.@k@v27/30700248. You must simply prove that "if it is a raven, it is black".@k@|@y@v27/30700249. And do you see that, if you prove that "if a bird is not black, it is not a raven", you would reach the same argument?"'
16035: 'BEATRICE@r@v27/30700250."If you go throughout the world and examine all birds that are not ravens, and prove that none of them are black,@k@v27/30700251. then as a result, you can claim that "therefore, birds that are black are ravens".@k@v27/30700252. This is called an argument by the contrapositive.@k@v27/30700253. ...Is that difficult for you?"'
16036: 'Battler@r@v10/30100258."Yeah, no kidding.@k@v10/30100259. ...I have no idea what you''re saying."'
16037: 'Ronove@r@v31/33100109."Battler-sama.@k@v31/33100110. What about this example?@k@v31/33100111. Let us say that you have two boxes, and one of them is the winner, with a cookie inside.@k@v31/33100112. Of course, the other one is the loser, and is empty."'
16038: '@rFor example, let us say that we have two boxes here,@k one being the winner with a cookie inside, and the other being the loser, which is empty.'
16039: '@rNow, it holds that "if there is a cookie inside, it is the winner",@k and at the same time, it also holds that "if it is not the winner, there is no cookie inside".'
16040: '@rWhen such a relationship exists, we call the latter the contrapositive...'
16041: '@rWhen "if A then B" is true, then at the same time, "if not B then not A" is also true.'
16042: 'Battler@r@v10/30100260."...Well, that''s obvious.@k@v10/30100261. If the one you picked was the loser, then you would automatically know that the other one was the winner."'
16043: 'Battler@r@v10/30100262."...In other words, if you choose the box at random, whether it''s the winner or the loser,@k@v10/30100263. you''ll be able to figure out which box has the cookie in it after your first move."'
16044: 'BEATRICE@r@v27/30700254."That is correct.@k@v27/30700255. If the cookie is in the box you open, then the "Devil''s Proof" is satisfied.@k@v27/30700256. You can prove directly that "this box is the winner = this box has a cookie in it"."'
16045: 'BEATRICE@r@v27/30700257."However, if the box that you open is empty, then the reverse, "Hempel''s Raven", is satisfied.@k@v27/30700258. Because then, it holds that "this box does not have a cookie in it = this box is not the winner"."'
16046: 'BEATRICE@r@v27/30700259."And that means, as long as we accept the premise that there are no more than two boxes,@k@v27/30700260. the contrapositive shows that the other box is automatically the winner."'
16047: 'Battler@r@v10/30100264."......Well, I think I''m starting to see your reasoning.@k@v10/30100265. Only poison can stop poison, and only twisted logic can stop twisted logic."'
16048: 'Battler@r@v10/30100266."...Then what?@k @v10/30100267.How does that overturn my claim that "no doubt there is a 19th human hidden on this island,@k@v10/30100268. so even if all of the 18 people have alibis,@k@v10/30100269. that does not amount to an acceptance of witches"......?"'
16049: 'BEATRICE@r@v27/30700261."Very well.@k@v27/30700262. I will tell you my move.@k@v27/30700263. First of all, you are stating that "if the culprit is not among the 18, then the culprit is a 19th person"."'
16050: 'BEATRICE@r@v27/30700264."*cackle*cackle*!@k @v27/30700265....So if you use the contrapositive, it ends up like this.@k@|@y@v27/30700266. In short, "if the culprit is not a 19th person, then the culprit is one of the 18"!"'
16051: 'Battler@r@v10/30100270."Whaah?!@k @v10/30100271.What the, what does that mean?!"'
16052: 'BEATRICE@r@v27/30700267."All I have done is turn your move on its head.@k@v27/30700268. It shouldn''t be that difficult to understand.@k@|@y@v27/30700269. Ronove, explain.@k@v27/30700270. It seems your cookie-in-a-box analogy from before will be easy for Battler to understand."'
16053: 'Ronove@r@v31/33100113."Then forgive my presumption.@k@v31/33100114. Allow me to explain using my earlier example once more."'
16054: '@rAllow me to repeat once more my earlier story,@k about two treasure chests, one of which has a cookie in it.'
16055: '@rIn this situation, one of the boxes represents "the 18 people", and the other box represents "the 19th person".'
16056: '@rSo the cookie would represent the "culprit".'
16057: '@rBattler-sama, you open the 18 box.@k@rBecause the cookie is not there,@k you have proven from the opposite direction that "therefore, the cookie is in the 19 box".'
16058: '@rIn that case, if we reverse things further, we can also say the following.'
16059: '@rNamely, if it was first shown that the 19 box was empty,@k it would prove in just the same way that "the cookie is in the 18 box".'
16060: '@rBattler-sama, this move you played in order to avoid having to doubt any of the 18,@k has in fact been used against you to launch the "18 person attack"...!"'
16061: 'Battler@r@v10/30100272."......Huh,@v10/30100273. ......what did you say........."'
16062: 'BEATRICE@r@v27/30700271."*cackle*cackle*cackle*cackle*!@k @v27/30700272.If I go first and prove that the inside of the 19 box is empty,@k@v27/30700273. automatically,@k@v27/30700274. you will be forced to accept that the cookie is in the 18 box.@k@v27/30700275. All you have done is say this the other way around, you see?"'
16063: 'Battler@r@v10/30100274."So, ......that move that I was so confident in, ...was actually a double-edged sword?"'
16064: 'BEATRICE@r@v27/30700276."That''s right.@k@v27/30700277. Your move to explain everything with a 19th person carries the risk that, if it is thwarted,@k@v27/30700278. you will be forced to accept that you can only explain things by using the 18."'
16065: '@rI see...@k "Hempel''s Raven".@k@r......So this is a countering technique?!'
16066: '@r...Wait, if I really think about it, this countering technique is far more disadvantageous for me than for her.'
16067: '@rThe problem is in thinking about it like a cookie.@k@rIf I imagine that just one of the treasure chests is a "losing" chest with a bomb in it, I can begin to understand it quite well.'
16068: '@rAnd if I think of it not as two treasure chests,@k but as 18, one for each person, plus one more for the 19th person,@k for a total of 19 boxes, it gets even easier to understand.'
16069: '@rFirst of all, one of the premises established by the human culprit theory was that the bomb would definitely be in one of those boxes.'
16070: '@rBecause I hadn''t wanted to place that bomb in any of the 18''s boxes, I had used the "Devil''s Proof",@k and created the 19th box so that I could throw the bomb in there.@k ......That much was alright.'
16071: '@rBut Beato had struck back like this:'
16072: '@rIf, then, the 19th box was empty inside,@k that would automatically mean that the bomb was set in one of the other 18 boxes.'
16073: '@rIf I could examine the contents of each of the 18''s boxes,@k and show that the bomb was not in any one of those boxes,@k I would be able to safely show that the 18 people were innocent.'
16074: '@rIf that was possible, I would be feeling confident!'
16075: '@rHowever, in reality, that''s as close as you can get to impossible.'
16076: '@rThe police wouldn''t come here in this typhoon.@k@rThere would be no scientific investigations, no autopsies, no nothing.@k@rIn short, I can''t show anything decisively!'
16077: '@rIt''s impossible for me to find any proof other than simply gulping down whatever alibis each of the 18 give.'
16078: '@rIn that case, I have to confirm their innocence both personally and perfectly.'
16079: '@rLike staying with someone the whole time, never letting them out of my sight for a second.'
16080: '@rIf I do that, I can probably be sure of that person''s innocence,@k and that the bomb is not in that box.'
16081: '@r...However, in reality, something like that is impossible!@k@rIn other words, I have to expend an incredible effort just to check the contents of one box.'
16082: '@rAnd there are 18 of them!@k In other words, unless I bind all 18 of them in chains and watch over them,@k it''s impossible to prove that all of them have empty boxes.'
16083: '@rHowever, Beato only has to open one box, the 19th box,@k and show that it is empty, to prove that the bomb is in one of the other 18 boxes.@k (Furthermore, there''s no need for her to show which of the 18 boxes has the bomb!)'
16084: '@rI have 18 times more work to do to explain my pet theory than Beato does for hers......'
16085: 'BEATRICE@r@v27/30700279."Just as you know from the "Devil''s Proof",@k@v27/30700280. there are many cases in this world where refuting something would take a vast amount of effort that is impossible in practice."'
16086: 'BEATRICE@r@v27/30700281."However, "Hempel''s Raven" turns that problem around, and makes it possible to prove things easily!"'
16087: 'Ronove@r@v31/33100115."By using "Hempel''s Raven", various reckless arguments become possible to prove."'
16088: 'Ronove@r@v31/33100116."......For example, let us say that I make the proposition "All humans except me are foolish".@k@v31/33100117. Normally, in order to prove this, I would have to examine all of humanity except myself and show that they are all foolish."'
16089: 'Ronove@r@v31/33100118."...However, in reality, it would be impossible to investigate billions of people.@k@v31/33100119. It is exactly the same kind of effort you would need to open all 18 boxes."'
16090: 'BEATRICE@r@v27/30700282."*cackle*cackle*!@k @v27/30700283.However, by using "Hempel''s Raven", the contrapositive of that proposition would change it as follows."'
16091: 'BEATRICE@r@v27/30700284."Essentially, take this "All humans except me are foolish", and to use your style of phrase,@k@v27/30700285. flip over the chessboard, and you merely need prove that "not foolish = me".@k@v27/30700286. ......And what do you think that means?"'
16092: 'BEATRICE@r@v27/30700287."*cackle*cackle*!@|@y@k @v27/30700288.As soon as I know the fact that "I am wise",@k@v27/30700289. I finish proving in an instant that every one of the billions of people in the human race is foolish.@k@v27/30700290. In less than a second, I can finish proving that the entire human race is more foolish than me!!"'
16093: 'BEATRICE@r@v27/30700291."It''s the strongest and fastest QED in the world.@k@v27/30700292. This...@v27/30700293.@|@yis "Hempel''s Raven"!"'
16094: 'Battler@r@v10/30100275."Wha-.........what a ridiculous argument.........!!!"'
16095: 'Ronove@r@v31/33100120."It is a very, very convenient move.@k@v31/33100121. Not only demons, but gods also use it.@k@v31/33100122. When you propose "blessed = God''s servant",@k@v31/33100123. the contrapositive is "if a human is not a servant of God, then he must not be blessed"."'
16096: 'Ronove@r@v31/33100124."So in order for servants of God to prove that they are granted fortune by their divine protection,@k@v31/33100125. they only have to prove that those who don''t receive that divine protection suffer misfortune."'
16097: 'Ronove@r@v31/33100126.".........Therefore,@k@v31/33100127. by bringing misfortune down upon those people who don''t believe in their own god, they prove their own blessedness."'
16098: 'BEATRICE@r@v27/30700294."It takes an enormous cost to give humans happiness.@k@v27/30700295. ...However, the necessary cost to bring humans misfortune is much cheaper."'
16099: 'BEATRICE@r@v27/30700296."*cackle*cackle*cackle*cackle*cackle*.@k@v27/30700297. So by using "Hempel''s Raven", gods can actually give believers the joy of divine protection at the lowest cost."'
16100: 'Battler@r@v10/30100276."Y-......you demon.@k@v10/30100277. It''s a demon''s argument...@k@v10/30100278. ...That''s messed up...!!!"'
16101: 'BEATRICE@r@v27/30700298."It seems that we''ve gone off-topic.@k@v27/30700299. Let us return to it."'
16102: 'BEATRICE@r@v27/30700300."I have finished describing the move for my counterattack.@k@v27/30700301. ......The counterattack to your claim that "a 19th person is the culprit; therefore, the 18 are innocent and the witch doesn''t exist" is:@k@v27/30700302. "In that case, if I can prove that the culprit is not some 19th person,@k@v27/30700303. do we agree that the culprit must either be one of the 18, or a witch?".@k@v27/30700304. I await your answer."'
16103: '@rFor a while, I just stood there, shocked, completely forgetting to close my mouth...'
16104: '@rJust when I''d thought that I''d got my own back on them by using their favorite move against them,@k the counterattack to that had been this reckless argument that I could not even have begun to imagine...!'
16105: '@rWas it really...impossible...?!'
16106: '@rTo continue denying the witch on an island with no more than 18 people,@k and yet still believe in the innocence of those 18 people...@k .........Was that just a delusion?!@k Was I just trying to escape reality?!'
16107: '@rNot yet...@k ......Don''t give up this struggle yet.'
16108: '@rWho cares about "Whoever''s Raven"?@k@rThey''re just trying to speak in riddles by bringing up some weird bits of trivia...'
16109: '@rI had used the "Devil''s Proof".@k@rDon''t feel doubt in something once you''ve used it.@k@rBelieve in the spear you''ve lunged forward with.'
16110: '@rApply even more force......and gouge it in......!'
16111: 'BEATRICE@r@v27/30700305."......The game is still in the opening.@k@v27/30700306. Do you already intend to spend this long thinking?"'
16112: 'Battler@r@v10/30100279."........................@k@|@y@v10/30100280. Ah,@w333.@v10/30100281. ......wait a sec,@v10/30100282. I want to be sure."'
16113: 'Battler@r@v10/30100283."While yes, I did use the phrasing of a "19th person" to make it easy to understand,@k@v10/30100284. if I can use the "Devil''s Proof" to raise the number of people above 18,@k@v10/30100285. then what I mean is an unspecified large number of extra people—you don''t know if it''s ten or a hundred."'
16114: 'Battler@r@v10/30100286."Always one more than you assume.@k@v10/30100287. ...Understand?"'
16115: '@rShe had returned my twisted logic with something even more twisted.@k@rSo the only thing that could counter that would be even crazier twisted logic...!'
16116: 'BEATRICE@r@v27/30700307."Hmm, I see.@k@v27/30700308. .........Even if I somehow prove an alibi for the 19th person,@k@v27/30700309. as soon as I do, you will think up a 20th person, and claim that they are the culprit.@k@v27/30700310. By repeating this infinitely, you would make it so I kept searching for their alibis for all eternity."'
16117: 'BEATRICE@r@v27/30700311."......I see, I see, *cackle*cackle*!@k @v27/30700312.Just like a demon king summoning a plague of locusts.@k@v27/30700313. I wouldn''t expect anything less from Kinzo''s grandchild.@k@v27/30700314. It looks like you have been gifted with a talent in summoning."'
16118: 'Battler@r@v10/30100288."......In short!@k @v10/30100289.It is impossible to continually prove an alibi for the "X" existing outside of the first 18!@k @v10/30100290.......How do you like that, Beato...?!@k @v10/30100291.Now that I know we''re having a battle with twisted logic, I won''t lose!"'
16119: 'BEATRICE@r@v27/30700315."*cackle*cackle*cackle*cackle*cackle*cackle*cackle*!!@k @v27/30700316.How foolish...@k@v27/30700317. Who do you think I am?@k @v27/30700318.I am the Endless Witch, the Infinite Witch!@k @v27/30700319.For you to challenge me at infinity is absurd.@k@|@y@v27/30700320. Having control over infinity means also that I am able to kill infinity."'
16120: 'BEATRICE@r@v27/30700321."......When your 19th person folds, you will call a 20th,@k@v27/30700322. and when your 20th person folds, you will call a 21st,@k@v27/30700323. and when your 21st person folds and your 22nd person folds,@k@v27/30700324. you will call a 23rd, a 34th, a 64358223579673204th,@k@v27/30700325. you think you can trifle with me for all eternity?!"'
16121: 'BEATRICE@r@v27/30700326."I laugh at "infinite regress",@k@|@y@v27/30700327. the infinite doesn''t affect me!!"@|@y'
16122: 'Battler@r@v10/30100292."Hoh, well then, how will you kill my "infinity"? Just try and show me!!"'
16123: 'BEATRICE@r@v27/30700328."@|@y@c900.@[I have the power to speak the truth in red!!!@]@c."'
16124: 'Battler@r@v10/30100293.".....................!!@k @v10/30100294..........Here it comes............"'
16125: 'BEATRICE@r@v27/30700329."When I speak in red, it contains absolutely no illusions.@k@v27/30700330. If I say once in red that there are no more than 100 people on this island,@k@v27/30700331. you will no longer be permitted to create a 101st person."'
16126: 'BEATRICE@r@v27/30700264."*cackle*cackle*!@k @v27/30700333.Come now, Battlerrr.@k@v27/30700334. What truth shall I tell in red this time?@k @v27/30700335.Where shall I strike for the kill and force you into hopelessness?@k @v27/30700336.*cackle*cackle*cackle*!@k @v27/30700337.Come, show me your usual frightened face......"'
16127: 'Battler@r@v10/30100295.".............................."'
16128: 'BEATRICE@r@v27/30700338."..................What?"'
16129: 'Battler@r@v10/30100296."......Ihihihihi."'
16130: 'BEATRICE@r@v27/30700339."...Why...are you laughing...?"'
16131: '@rI wonder what kind of creepy look I had on my face as I laughed right then.@k@rThat red sure is scary.@k ...Every time it jumps out, I''m driven into the depths of hopelessness.'
16132: '@rBut......I had already realized it.@k@r...There was no need to be unnecessarily afraid of the red.'
16133: 'Battler@r@v10/30100297.".........You''ve brought out your secret weapon again.@k@|@y@v10/30100298. So...?@k @v10/30100299.What and how will the great BEATRICE-sama speak in red this time?"'
16134: 'BEATRICE@r@v27/30700340."......Hoh.@k@v27/30700341. What do you mean by this?@k@v27/30700342. Suddenly looking so relaxed..."'
16135: 'Battler@r@v10/30100300."Sorry, but I''ve been waiting for you to take out that blood-red treasured sword.@k@v10/30100301. ......Let''s see, what will you proclaim in red this time?"'
16136: 'Battler@r@v10/30100302."You aren''t going to say "the culprit was one of the 18", are you?@k @v10/30100303.Let me warn you, that would be self-destruction, remember?@k @v10/30100304.That would be the same as throwing away your own witch theory yourself.@k@v10/30100305. A complete resignation."'
16137: '@rThat''s right.@k The red isn''t always necessarily to Beato''s advantage.@k On the contrary, if she used it the wrong way, it''s dangerous enough that she could bring about her own death.'
16138: '@rIf she used it carelessly and said something which ended up denying herself, that would be exactly the same thing as self-destructing.'
16139: 'Battler@r@v10/30100306."Of course,@k@v10/30100307. it would also be sad and difficult for me to accept if you told me in red that one of the 18 was the culprit.@k@v10/30100308. ......No matter who the culprit actually was, it would surely bring me some tough emotions..."'
16140: 'Battler@r@v10/30100309."But before that, it would mean your defeat!@|@y@k @v10/30100310.Saying in red that the culprit is a human is equivalent to your proclamation of resignation!!@k @v10/30100311.If you want to strike me a blow so badly you''re prepared to die at the same time, I think that''s a pretty interesting move.@k@v10/30100312. However, this battle will end in my victory!!"'
16141: '@rBEATRICE''s red was truly her secret weapon, her treasured blade.@k The things she spoke in red would become solidified as the truth, and no amount of evidence or counterarguments could change them.'
16142: '@rThey had cut me down to size many times now, rending in two any supports my heart had to lean on.'
16143: '@rHowever, if she used it carelessly, then I could also find a little information about the truth.'
16144: '@r...In the last game, especially during the chapel''s locked room trick, I had taken advantage of that,@k and had once closed her in almost completely.'
16145: '@rBut she was also pretty sly.@k She had learned from experience, and since then, had started using discretion in the timing of the red...'
16146: '@rThis feeling of tension was almost literally like a battle with real swords.'
16147: '@r...This was a battle of high intelligence.@k@r......No, not of intelligence.@k@rIt really was twisted logic.'
16148: '@rThis was the world''s craziest and worst battle of twisted logic...!!'
16149: 'Battler@r@v10/30100313."So, now it''s your move.@k@v10/30100314. ......That''s right.@k@v10/30100315. To use your "Hempel''s Raven",@k@v10/30100316. first, you''ll have to confirm in red how many humans there are other than the 18."'
16150: 'Battler@r@v10/30100317."And after that, if you proclaim in red that none of the people in that group are the culprit,@k@v10/30100318. ......that''s right, that might be a fatal wound to me."'
16151: 'BEATRICE@r@v27/30700343.".........I''m surprised that you no longer have even an atom of fear for that red which you feared so much...@k@|@y@v27/30700344. You''re quite sturdy."'
16152: 'Battler@r@v10/30100319."Unsheathe it.@k@v10/30100320. Your treasured blade.@k@v10/30100321. ......A single perfect swing, and you might be able to break me this time, who knows...?"'
16153: 'BEATRICE@r@v27/30700345."......*cackle*cackle*cackle*.@k@v27/30700346. ...Interesting.@k@v27/30700347. I wouldn''t have it any other way..."'
16154: '@rAgitate her.@k Provoke her.@k@rDrive her into a corner to make her speak in red...'
16155: '@rOf course her red has always cut right through my only threads of hope.@k But......don''t be afraid of that.'
16156: '@rOn this island overcome with falsehoods and illusions, the only thing I can trust...@kis the information that she speaks in red.'
16157: '@rIt is my only way across the chasm of Hell.@k Just a single tightrope.'
16158: '@rHer merciless blood-red blade is the only way I can survive.'
16159: '@r...This isn''t just walking on a tightrope, it''s literally like walking on the edge of a blade...'
16160: '@rOf course I''m afraid.@k In terms of her contrapositive, my victory condition—the denial of the witch—meant that the culprit was a human.'
16161: '@rBut I didn''t want to search for the culprit amid the 18.'
16162: '@r...Therefore, I held on to a weak point, since I had to deny the witch and the 18 at the same time.@k Since I had been unable to understand that last time, that was where she had hit me, leaving me tattered and defeated.'
16163: '@r......But that''s alright.@k@rLet her hit me.@k Let her attack.@k No problem...'
16164: '@rSomeone said it once in an old sword-fighting movie.@k@rThat "a good fortress has one, and only one, intentionally weak point".'
16165: '@rThe enemy would gather there.@k They would be lured there.@k@rAnd that would be where the actual battle took place.'
16166: '@r...As long as I understand my weak points,@k and as long as she wants to attack those weak points,@k ......it''s as if I''ve induced her to attack there...'
16167: '@rCarefully judge the distance from your enemy, ...and retreat step by step.@k Make them draw their sword first.'
16168: '@rThe more she recklessly flourishes that red, the more chances I''ll have to strike back.'
16169: '@rDon''t be afraid of the red.@k@rKeep the pressure on, so that she is forced to refute with the red......!'
16170: '@rNo matter how oppressively she speaks in red,@k ......yes, that red itself is the same as fresh blood spurting from her wounds.'
16171: 'Battler@r@v10/30100322."Come on.@k@v10/30100323. ...What''s wrong?@k@v10/30100324. ......First of all, why don''t you tell me in red how many people are on this island total?@k@v10/30100325. If you don''t, your raven can''t cut me up......!"'
16172: 'BEATRICE@r@v27/30700348.".....................Hmph.@k@v27/30700349. ...How surprising that you can be this desperate and yet this difficult.@k@v27/30700350. ...One cannot make light of someone putting their life on the line, no matter what the era."'
16173: 'BEATRICE@r@v27/30700351."......It''s no surprise you''re Kinzo''s grandchild.@k@v27/30700352. The more cornered you are,@v27/30700353. ............the bolder you become!"'
16174: 'Battler@r@v10/30100326."...Ihihihi..."'
16175: '@rRonove cleared his throat.'
16176: 'Ronove@r@v31/33100128."You appear to be at a standstill.@k@v31/33100129. That black tea I worked so hard to make is getting cold,@v31/33100130. Milady."'
16177: 'BEATRICE@r@v27/30700354.".........kh."'
16178: '@rRonove, who was supposed to be her ally, roguishly rushed her next move.'
16179: '@rBeato smiled back, probably intending to demonstrate that she was still relaxed, ......but she couldn''t hide the sweat building up on her forehead.'
16180: '@rBy now she had completely lost that relaxedness which had allowed her to turn her nose up at her worthless opponent.'
16181: '@rOf course, she probably wasn''t really cornered by something like this.@k ...She was just...being cautious.'
16182: '@rUntil now, I had been inexperienced.@k@rI didn''t have a good grasp on how to fight, and I was underpowered as an opponent.'
16183: '@rHowever, now that we had reached the third game, she realized that I was starting to become skilled,@k and she had grown more cautious, thinking every move over carefully......'
16184: '@rSure, that''s just fine, BEATRICE.@k@rAnd sorry to have kept you waiting.@k@rAre you happy now...?'
16185: 'Battler@r@v10/30100327."......Now things are starting to get interesting, right......?@k @v10/30100328.Hihihihi!"'
16186: 'BEATRICE@r@v27/30700355."*cackle*cackle*cackle*!@k @v27/30700356....Battleeeeerrrrr......"'
16187: 'Battler@r@v10/30100329."This isn''t going anywhere...@k@v10/30100330. Then, should I just dive right in and go with the usual?"'
16188: 'BEATRICE@r@v27/30700357."......Hoh.@k@v27/30700358. The usual, you say.@k@v27/30700359. ...Then by all means.@k@v27/30700360. If I don''t hear that, I guess I just won''t get the sense that we''ve started..."'
16189: '@rThe first move was mine......'
16190: 'Battler@r@v10/30100331."Here I come, Beato."'
16191: 'Battler@r@v10/30100332."Repetition requested.@k@v10/30100333. ......''There are only 18 people on this island''."'
16192: 'BEATRICE@r@v27/30700361."....................."'
16193: 'Battler@r@v10/30100334."...If I hear you say this in red, I will have no choice but to doubt one of the 18.@k@v10/30100335. ......Since it could no longer be the work of a 19th person, all doors will be closed to me."'
16194: 'Battler@r@v10/30100336.".........But I believe that the culprit is definitely not one of the 18!@k @v10/30100337.There''s no way that any of those 18 could commit such brutal murders...!!"'
16195: 'BEATRICE@r@v27/30700362."....................."'
16196: 'Battler@r@v10/30100338."I''ll say it again.@k@|@y@v10/30100339. Repetition requested!@k @v10/30100340."There are only 18 people on this island"."'
16197: 'BEATRICE@r@v27/30700363."..............................@k@|@y@v27/30700364. .........I decline.@k@v27/30700365. I won''t say why."'
16198: '@rWhew...!@k I had avoided what would have been the worst red for me.'
16199: '@rIf she had repeated that,@k I would have been faced with those two worst choices of accepting the witch or suspecting one of the 18,@k like last time all over again...'
16200: '@rBut Beato had not proclaimed my ultimate and greatest weakness in red.'
16201: '@rShe had declined to repeat it—even though there was no reason why she shouldn''t have struck—even though it was a weakness she should have been drooling at.'
16202: '@rShe hadn''t sliced me up with red by using that move, which should have been as good as forking a rook and the king...!'
16203: '@r......This was a big sign of my advantage.'
16204: '@rThat''s right.@k The culprit isn''t one of the 18 people.@k@rI won''t doubt anyone...!'
16205: '@rAnd since the culprit isn''t a witch either,@k .........it means that a 19th person exists on this island.'
16206: '@rAnd that''s you.'
16207: '@rA person who, as Grandfather''s mistress of thirty years,@k has been living secretly in a hidden mansion in the forest for a long, long time.'
16208: '@rThe human BEATRICE.........!!'
16209: 'Battler@r@v10/30100341."That''s right.@k@v10/30100342. You aren''t a witch or anything like it.@k@v10/30100343. ......You''re just a human...who''s been living on this island in hiding for several decades...!"'
16210: 'BEATRICE@r@v27/30700366.".........*cackle*cackle*.@k@v27/30700367. *cackle*cackle*cackle*...@k@v27/30700368. ...Did you just call me, the Endless Witch who has lived for over one thousand years, a mere human?@k@v27/30700369. ......*cackle*cackle*cackle*cackle*cackle*cackle*!"'
16211: '@rFor a while, BEATRICE continued to laugh unpleasantly, gloating or maybe spiteful.'
16212: 'Battler@r@v10/30100344."...Are you ready? I''ll keep going.@k@v10/30100345. ...Again, repetition requested."'
16213: 'Battler@r@v10/30100346."''There are at least 19 people on this island''!"'
16214: 'BEATRICE@r@v27/30700370.".............................."'
16215: '@rBEATRICE fell silent once again.'
16216: '@rThe feeling that confirming the number of humans on this island...@kmight possibly stand to give her some large disadvantage,@k was probably making her extremely cautious.'
16217: '@rThe red had already become a foothold for my counterattack.@k With that in mind, the red had become a risk for the witch.'
16218: '@rBut if she couldn''t repeat this, her "Hempel''s Raven" wouldn''t work.'
16219: '@rIn order to break my "Devil''s Proof",@k first, the existence of and number of people outside the 18...@kneeded to be confirmed in red.'
16220: '@rThat''s right.@k She couldn''t break the existence of a 19th person unless she used red.'
16221: '@rI had closed Beato in, giving her no choice but to speak in red...!'
16222: '@rThere really was...@w500..........a way to fight,@w416. ......in this witch''s game!'
16223: 'Battler@r@v10/30100347."It''s alright to decline.@k@v10/30100348. ...If you can''t say it in red, then that will mean the total number of people on this island will be 18+X."'
16224: 'Battler@r@v10/30100349."......That X is a pretty huge piece to allow me to have on the first move, isn''t it?@k @v10/30100350.After all, from then on, all of the tricks with the basis "it was impossible for any of the 18"...@k@v10/30100351.will become explainable with a human X outside of the 18 people.@k@v10/30100352. ......This is a huge piece that can break open any locked room hinging on everyone having an alibi...!"'
16225: '@rIt was just like...@ka bishop in chess, which can cut a thin line through enemy forces as long as there''s a slight gap.'
16226: '@rIt only exerts an effect over squares of the same color, but it has a great ability to control the board.'
16227: 'BEATRICE@r@v27/30700371."..............................@k@v27/30700372. ..................kh."'
16228: '@rIt looked like Beato also well understood her current plight.'
16229: '@rShe couldn''t just let such an important piece go, especially this close to the beginning of the game...@kIf she pulled out her red treasured sword, it wouldn''t be that difficult to save that piece.'
16230: '@r......But Beato was completely aware that I was expecting it.@k She was afraid that a careless red truth might end up strangling her own neck...!'
16231: '@rBecause, ...in the first place, a witch was something which should be denied in red.'
16232: '@rBelieve.@k Don''t doubt!@k Witches don''t exist!@k@rSomething like that can''t exist in this world.'
16233: '@rThey can only exist in the cracks in reality.'
16234: '@r...They are a fragile existence, curled up in these cracks, frantically trying to protect themselves from the brutal winds of truth,@k and they can only barely exist like a mirage by surviving on falsehoods and fantasy.'
16235: '@rIn other words, the red, which only witches can use, is the very reality by which they risk denying themselves.'
16236: '@r......The more they brandish their red words...@kthe more they begin to lose, bit by bit, that crack in reality inside which they can endure.'
16237: '@rThat is why they don''t want, through the red,@k ......to carelessly lose that crack in reality which is based on fuzzy information, or in other words, fantasy.'
16238: '@rBecause they understand that they would be gradually cornering themselves.'
16239: '@rOf course, she would never admit it.'
16240: '@rBecause, if she did,@k it would be the same as admitting that she is something that can''t exist in this world, like an imaginary number.'
16241: '@rDon''t be afraid.@k Stay strong...!@k@rShe knows this deep down, and better than anyone.'
16242: '@rThat her red treasured sword can''t easily be used without considerable resolve...!'
