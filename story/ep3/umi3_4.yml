16254: 'Battler@r@v10/30100365."......And there are times when having a repetition declined makes things harder for me.@k@v10/30100366. ...Those times, I can''t tell whether you can''t repeat because my guess was right,@k@v10/30100367. or whether you''re just misleading me and letting me think whatever I want."'
