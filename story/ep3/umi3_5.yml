16459: '@rThose words probably meant...@k...that he didn''t view this kid as her child, but as her reincarnation.@k Maybe that''s what it meant.'
16460: '@rIf you interpret it that way, even a story that weird might make a little sense...'
16461: '@r...No no no.@k This might be some bullshit Beato cooked up to confuse me.'
