16325: 'Kinzo@r@v01/31500069."......BEATRICE.@k@v01/31500070. I have been calling to you for a while.@k@v01/31500071. Did you not hear me...?"'
16326: 'BEATRICE@r@v27/30700412."......Hmm.@k@v27/30700413. Were you?@k @v27/30700414.My apologies.@k@v27/30700415. I was lost in my thoughts.@k@v27/30700416. Forgive me."'
16327: 'Kinzo@r@v01/31500072."The weather is pleasant.@k@v01/31500073. ...I see, I can understand how the weather has stolen your heart.@k@v01/31500074. Will you drink your black tea here...?"'
16328: 'BEATRICE@r@v27/30700417."...............Who...am I?"'
16329: 'Kinzo@r@v01/31500075.".................................@k@|@y@v01/31500076. ......I will bring some black tea now.@k@v01/31500077. Wait here for a while."'
16330: 'BEATRICE@r@v27/30700418."Forget about the black tea.@k@v27/30700419. Talk with me."'
16331: 'Kinzo@r@v01/31500078."......Very well."'
16332: '@rKinzo had used the excuse of going to bring some black tea to try and interrupt the conversation for the time being.@k ...But his attempt had been very transparent.'
16333: '@rI sat in the garden chair, and beckoned Kinzo to do the same.@k@rKinzo sat down heavily, exaggerating his age.'
16334: '@rFor a while, we sat, appreciating the silence...'
16335: 'BEATRICE@r@v27/30700420."......Who am I?@k@v27/30700421. To this day, no one has answered me this question.@k@v27/30700422. ......For some reason, everyone averts their gaze and evades me."'
16336: 'Kinzo@r@v01/31500079."........................"'
16337: 'BEATRICE@r@v27/30700423."......I have known you for a long time.@k@v27/30700424. I think of you as my best friend, even as a father.@k@v27/30700425. ......That is why I want so much for you to tell me.@k@v27/30700426. You must know.@k@v27/30700427. ...Who I am."'
16338: 'Kinzo@r@v01/31500080."..................@k@v01/31500081. ............Why do you worry about something like that?@k@v01/31500082. You are BEATRICE.@k@v01/31500083. The master of this mansion, is that not so?@k@v01/31500084. ......What more could you want to know?"'
16339: 'BEATRICE@r@v27/30700428."............I do not know."'
16340: 'Kinzo@r@v01/31500085."What''s this?@k@v01/31500086. ......Don''t you even understand yourself what it is you want to know?@k@v01/31500087. That is baffling.@k@v01/31500088. In my younger days, I sometimes found myself wanting to play in the maze of thought that has no exit.@k@v01/31500089. Maybe that is what your worries are..."'
16341: '@rKinzo laughed as though it was a trivial matter.@k ...However, I couldn''t help but feel that this behavior was nothing but another attempt to force me to stop my further questioning.'
16342: 'BEATRICE@r@v27/30700429."...........................@k@|@y@v27/30700430. ...Hmph.@k@v27/30700431. ......So not even you will tell me that...after all."'
16343: 'Kinzo@r@v01/31500090."There is nothing to tell.@k@v01/31500091. You are BEATRICE.@k@v01/31500092. Isn''t that more than enough?"'
16344: 'BEATRICE@r@v27/30700432."......No, that''s not it.@k@v27/30700433. ............What I wish to know is not my name.@k@v27/30700434. It is...@v27/30700435.who...@v27/30700436.I am."'
16345: 'BEATRICE@r@v27/30700437."......Who am I, what am I?@k@v27/30700438. ...How long have I been here, ...and how long will I continue my days here?"'
16346: 'Kinzo@r@v01/31500093."........................@k@v01/31500094. ...I really should bring some black tea.@k@v01/31500095. Do you not think it a waste of all this fine weather?"'
16347: 'BEATRICE@r@v27/30700439."................................."'
16348: 'Battler@r@v10/30100382.".........What is this all about...?@k @v10/30100383.Somehow, it looks like the story of your past, right?"'
16349: 'BEATRICE@r@v27/30700440."It appears so.@k@v27/30700441. ...To think that we would go this far back..."'
16350: 'Battler@r@v10/30100384."Wondering who you were...@k@v10/30100385. ...It looks like you had some pretty high-minded worries."'
16351: 'BEATRICE@r@v27/30700442."......That is to be expected.@k@v27/30700443. At the time, I was unable to understand who I was,@k@v27/30700444. or why I was alive."'
16352: 'Battler@r@v10/30100386."Well, in puberty,@k@v10/30100387. everyone is captured by those philosophical worries, wondering what meaning there is to their life, at least once.@k@v10/30100388. Doesn''t this just mean that you had this kind of charming period once in your life?"'
16353: 'BEATRICE@r@v27/30700445.".....................@k@v27/30700446. ...I had been in that mansion since the time I was born.@k@v27/30700447. And I lived only inside the mansion.@k@v27/30700448. Of course, I was able to go out into the garden, but the area around the mansion was surrounded by a very tall fence, which I was unable to leave through,@k@v27/30700449. and I would be told severely that I mustn''t leave."'
16354: 'BEATRICE@r@v27/30700450."......I could walk freely throughout the mansion and the garden,@k@v27/30700451. but my desire to take just one step outside those of my own accord was never granted."'
16355: 'Battler@r@v10/30100389."...............What do you mean by that?@k@v10/30100390. ...Are you trying to say that, for as long as you can remember, you were always a bird in a cage?"'
16356: 'BEATRICE@r@v27/30700452."......I thought that was just how things were.@k@v27/30700453. After all, I had been living like that as far back as I could remember.@k@v27/30700454. I didn''t even think to question it."'
16357: 'Battler@r@v10/30100391."What in the world............are you?"'
16358: 'BEATRICE@r@v27/30700455."That''s it.@k@v27/30700456. That is what I also hoped to know."'
16359: 'Battler@r@v10/30100392."............Heh.@k@v10/30100393. I''m sure you''ll say something like "I wasn''t a human, I was a witch", right?"'
16360: 'BEATRICE@r@v27/30700457."No, that''s not correct.@k@v27/30700458. Not yet correct.@k@v27/30700459. ......Or, should I say, it was once correct.@k@|@y@v27/30700460. ......I was constructed by Kinzo, a human built by a human.@k@v27/30700461. ...No, maybe I should call it a cage made of flesh."'
16361: 'Battler@r@v10/30100394."What''s that supposed to mean...?@k@v10/30100395. ...This is starting to sound weird."'
16362: 'BEATRICE@r@v27/30700462."......You probably won''t believe it anyway.@k@v27/30700463. Listen first.@k@v27/30700464. .........I was a great witch who had lived for one thousand years.@k@v27/30700465. But at some time, I was summoned by Kinzo,@k@v27/30700466. ...and by his hidden arts, I was bound as his prisoner for eternity."'
16363: 'Battler@r@v10/30100396."............Never heard that before.@k@v10/30100397. From what we hear in the Ushiromiya family, you were summoned by Grandfather,@k@v10/30100398. made something like a devil''s contract with him, and gave him the gold."'
16364: 'BEATRICE@r@v27/30700467."Yes.@k@v27/30700468. That is correct.@k@v27/30700469. ...Then I was supposed to hide myself until the contract was over.@k@|@y@v27/30700470. But, .........well, it''s tough being a popular woman.@k@v27/30700471. .........By some turn of events, Kinzo fell in love with me."'
16365: 'Battler@r@v10/30100399."...Grandfather''s nearsightedness must have gotten pretty bad.@k@v10/30100400. With astigmatism too, ihihi.@k@v10/30100401. To fall in love with you, of all things."'
16366: 'BEATRICE@r@v27/30700472.".........Hmph.@k@v27/30700473. Well, to me it was supremely annoying."'
16367: 'BEATRICE@r@v27/30700474."...However, the power of Humans is a frightening thing.@k@v27/30700475. He exhibited fearsome power and rooted me to this place.@k@v27/30700476. ...He said I wouldn''t be freed until I nodded my head in agreement.@k@v27/30700477. ...Such an overbearing man."'
16368: 'Battler@r@v10/30100402."Isn''t that awesome.@k@v10/30100403. Everyone knows Grandfather''s obsessed with the occult, but...@k@v10/30100404....who knew he had the power to root down the Great Witch BEATRICE-sama."'
16369: 'Battler@r@v10/30100405."......Heh, ridiculous.@k@v10/30100406. You think I''d believe such a weird story?"'
16370: 'BEATRICE@r@v27/30700478."...As I thought, you don''t believe."'
16371: 'Battler@r@v10/30100407."All I believe is the fact that you lived in this hidden mansion in the middle of the forest.@k@v10/30100408. You are the 19th person on Rokkenjima, right?!"'
16372: 'BEATRICE@r@v27/30700479."......Indeed.@k@v27/30700480. Just as you imagine, this is deep in the forest of Rokkenjima.@k@v27/30700481. A hidden mansion not to be found from the outside world.@k@v27/30700482. Its name is @bKuwadorian.@<九羽鳥庵@> (Nine Birds'' Retreat)."'
16373: 'Battler@r@v10/30100409."......Come to think of it, I heard that the guesthouse''s real name was Toraian.@k@v10/30100410. ...I see, the naming sense is similar.@k@v10/30100411. ......So, you were Grandfather''s lover, who lived here in secret.@k@v10/30100412. Isn''t that right?!"'
16374: 'BEATRICE@r@v27/30700483."Lover isn''t the right way to say it.@k@v27/30700484. ......You should probably call it Kinzo''s unrequited love.@k@v27/30700485. I spoke of it just recently, correct?@k @v27/30700486.He fell in love with me of his own accord.@k@v27/30700487. He then courted me, but I rejected him."'
16375: 'BEATRICE@r@v27/30700488."......Then, I was shut up in this hidden mansion.@k@v27/30700489. .........No, I shouldn''t say that I was shut up in the mansion.@k@v27/30700490. ......It would be more correct to say that I was shut up in this body."'
16376: 'Battler@r@v10/30100413."............I have no idea what you just said at the end there."'
16377: 'BEATRICE@r@v27/30700491."You will just make fun of it and not listen, right?@k @v27/30700492.After all, you say that you don''t believe in witches or magic.@k@v27/30700493. If you have no ears to hear what I tell you,@k@v27/30700494. saying it would be the pinnacle of foolishness."'
16378: 'Battler@r@v10/30100414."...........................@k@|@y@v10/30100415. ......I''ll decide whether I believe or not.@k@v10/30100416. ...After all, if I don''t hear it, the story won''t move on.@k@v10/30100417. Tell me.@k@v10/30100418. ...The story of your past."'
16379: 'BEATRICE@r@v27/30700495."Alright.@k@v27/30700496. .........I refused Kinzo when he courted me, but he was not a man to lose heart just because of that.@k@v27/30700497. He wanted to get my consent no matter what.@k@v27/30700498. He shut me up in this mansion, and spent an eternity trying to win my heart."'
16380: 'Battler@r@v10/30100419."...He really is overbearing.@k@v10/30100420. No one likes a man who can''t take a hint, right?"'
16381: 'BEATRICE@r@v27/30700499.".........*cackle*cackle*.@k@v27/30700500. Regardless of whether I responded to his courting or not,@k@v27/30700501. to make a man so desperate for me was...well, as a woman, it wasn''t unpleasant."'
16382: 'BEATRICE@r@v27/30700502."......However, I never nodded my head.@k@v27/30700503. I tried what I could to escape his restrictions,@k@v27/30700504. but that barrier was firm, and I couldn''t break it."'
16383: 'Battler@r@v10/30100421."......And then?"'
16384: 'BEATRICE@r@v27/30700505."After trying to resist in various ways,@k@v27/30700506. I eventually reached the conclusion that, to escape from Kinzo''s barrier, I would have to throw away my body of flesh.@k@v27/30700507. ......The physical body is a vessel which carries many restrictions in terms of magic."'
16385: 'Battler@r@v10/30100422."Throw away your body of flesh......?@k @v10/30100423.What''s that?@k@v10/30100424. Something like an out-of-body experience?"'
16386: 'BEATRICE@r@v27/30700508."Well, if you want to think of it that way.@k@v27/30700509. However, I am not a spirit.@k@v27/30700510. Even though I am a witch, in the beginning, I was born with a human''s body of flesh.@k@v27/30700511. So for me, throwing away that physical body,@k@v27/30700512. while it didn''t mean the same thing as death, did require a corresponding level of resolve."'
16387: 'Battler@r@v10/30100425."So in other words,@k@v10/30100426. ......you made up your mind that you couldn''t be released except by suicide, is that what you mean?"'
16388: 'BEATRICE@r@v27/30700513."It wasn''t suicide.@k@v27/30700514. It was nothing more than throwing away my body of flesh.@k@v27/30700515. ......Of course, becoming nothing more than soul is a precarious situation.@k@v27/30700516. When the soul leaves its body of flesh, it is constantly exposed to the strong winds of the sun.@k@v27/30700517. It was not easy even for me to maintain myself and avoid being scattered by them."'
16389: 'BEATRICE@r@v27/30700518."It was a final measure that I wanted to avoid if I could.@k@v27/30700519. However, there was no other way to break through Kinzo''s barrier."'
16390: 'BEATRICE@r@v27/30700520."......*cackle*, after all, I am a free spirit.@k@v27/30700521. I couldn''t stand being kept in a cage until Kinzo''s life was over."'
16391: '@rI couldn''t understand this story Beato kept going on about, about throwing away her body of flesh,@k as anything more than suicide.'
16392: '@rGrandfather persistently courted her, and to escape from that,@w500. ......she chose her own death...?'
16393: 'Battler@r@v10/30100427."...............So you''re saying you committed suicide?@k @v10/30100428.What are you saying?@k@v10/30100429. Isn''t that you, sitting carefree there in the garden chair?"'
16394: 'BEATRICE@r@v27/30700522."......That''s right.@k@v27/30700523. That is the new cage I was given by Kinzo."'
16395: 'Battler@r@v10/30100430."............Cage?@k @v10/30100431.You mean this mansion?"'
16396: 'BEATRICE@r@v27/30700524."No.@k@v27/30700525. I mean my body, relaxing in the garden chair over there.@k@v27/30700526. .........After I became a soul and tried to escape,@k@v27/30700527. even then, Kinzo had no intention of allowing me to escape."'
16397: 'BEATRICE@r@v27/30700528."...Yes, indeed, he is a frightening person.@k@v27/30700529. Normally, seeing the woman of your one-sided desires take her own life should be enough to bring anyone to their senses, even if their love was a hundred years old.@k@v27/30700530. ......I suppose it makes him somewhat of a mage after all.@k@v27/30700531. ......*cackle*."'
16398: 'Battler@r@v10/30100432."Don''t try to speak in riddles with that incomprehensible witch-girl talk.@k@v10/30100433. ...In short, what are you trying to say?"'
16399: 'BEATRICE@r@v27/30700532."That Kinzo didn''t let me escape even after I became a soul.@k@v27/30700533. ......Human emotions are terrifying.@k@v27/30700534. That he would be able to exhibit this much power..."'
16400: 'BEATRICE@r@v27/30700535."Tying down a spirit of the dead...@k@v27/30700536.is not a level readily attained, even for a mage seeking that as his specialty.@k@v27/30700537. Because I knew that, Kinzo''s fearful magical power shocked me then for the first time."'
16401: 'BEATRICE@r@v27/30700538."............Then Kinzo seized my soul and brought me back.@k@v27/30700539. However, a cage to hold a seized soul cannot be made, not from iron nor from lead.@k@v27/30700540. ......There is but one exception."'
16402: 'Battler@r@v10/30100434."............What?@k@v10/30100435. You aren''t going to say it was a magical cage or something, are you?"'
16403: 'BEATRICE@r@v27/30700541."Wrong.@k@v27/30700542. That body of flesh over there, just like yours or mine.@k@|@y@v27/30700543. ...Only a cage made of flesh and blood can tie a spirit down to this world.@k@v27/30700544. ......Kinzo shut my soul up once more into a cage of flesh built to be exactly like me."'
16404: 'Battler@r@v10/30100436.".....................@k@v10/30100437. ...So in summary, is it something like this?@k@v10/30100438. Grandfather persistently courted you, you started to hate it, and you committed suicide,@k@v10/30100439. but you weren''t clever enough to finish the job?@k @v10/30100440....Damn, you really took a roundabout way to say something like that."'
16405: 'BEATRICE@r@v27/30700545."No, that''s wrong.@k@v27/30700546. My soul was shut up in the seed of a homunculus,@k@v27/30700547. and I was born out of a test tube."'
16406: 'Battler@r@v10/30100441."Huh?!@k @v10/30100442.Ridiculous...!@k @v10/30100443.That''s goddamn impossible and you know it!"'
16407: 'BEATRICE@r@v27/30700548."Kinzo accomplished even the miracle of creating life.@k@v27/30700549. And only to shut my soul up in that cage.@k@|@y@v27/30700550. ......That he would show such magical power simply because of his own love...@k@v27/30700551. A thoroughly terrifying person."'
16408: 'Battler@r@v10/30100444."Aah, okay, it''s really gotten to the point of ridiculousness now!@k @v10/30100445.Say whatever you want.@k@v10/30100446. I won''t believe a word of it.@k@v10/30100447. Just do what you like, for hell''s sake."'
16409: 'BEATRICE@r@v27/30700552."...............mh.@k@v27/30700553. ...What is this unpleasant attitude?"'
16410: 'Battler@r@v10/30100448."Heh,@k@v10/30100449. in the beginning, I showed a little interest, thinking there might be some huge hint hidden,@k@v10/30100450. but the more I hear, the weirder this story starts to get.@k@v10/30100451. This is supposed to be a game about denying witches,@k@v10/30100452. but I get the feeling that I''m suddenly being made to just swallow a witch story."'
16411: 'Battler@r@v10/30100453."Sorry, but I don''t feel like listening to this any more.@k@v10/30100454. Just keep rambling on to yourself as much as you want.@k@v10/30100455. I''ll just be here digging out some earwax or something."'
16412: 'BEATRICE@r@v27/30700554.".....................@k@|@y@v27/30700555. ......Hmph."'
16413: '@rWhen I started showing a cold attitude, Beato acted unusually discouraged.'
16414: '@rOf course, her expression was still brazen...@kbut I had the feeling that I was able to catch a glimpse of loneliness because I hadn''t found the story of her past interesting,@k in that really easy to understand expression of hers.'
16415: '@r......For some reason, that slight reaction made her seem pitiful,@k so even though I kept my couldn''t-care-less attitude, I decided to humor her slightly.'
16416: '@rDamn it, even though she''s an irritating witch, I''m still weak against her because her chromosomes are XX...'
16417: 'Battler@r@v10/30100456."......Well, I have absolutely no desire to believe you, but,@k@v10/30100457. ............keep going.@k@v10/30100458. I''ll listen to your story in place of cookies."'
16418: 'BEATRICE@r@v27/30700556."So you treat the story of my past like cookies.@k@|@y@v27/30700557. ......You think that if you abuse me like that, I will just casually tell you...?"'
16419: '@rAfter I made fun of her, Beato reacted a little sensitively.'
16420: '@rIt looked like, even though making fun of people was her specialty, she was horrible at being made fun of by other people.'
16421: '@rJust then, my cup of black tea suddenly made a sound, surprising me.'
16422: 'Ronove@r@v31/33100145."......Milady''s soul was seized and breathed into a cage of new life.@k@v31/33100146. In other words, Milady received life as a human once more."'
16423: '@rBefore I had realized it, the demon butler had appeared and taken my cup, and was adding more black tea to it.'
16424: 'BEATRICE@r@v27/30700558."Ronove.@k@v27/30700559. That is enough of that story.@k@v27/30700560. He says that it is too ridiculous to listen to.@k@v27/30700561. I now also feel ridiculous and have no intention of speaking."'
16425: 'Ronove@r@v31/33100147."Some new cookies are currently being baked.@k@|@y@v31/33100148. I thought that, until then, the story of Milady''s past would be a perfect substitute.@k@|@y@v31/33100149. Pu ku ku...!"'
16426: 'BEATRICE@r@v27/30700562."I, ...I already said that I''ve had enough of talking about me!@k @|@y@v27/30700563.You are both unpleasant people.@k@v27/30700564. I''m leaving!@k @v27/30700565.Ronove, leave as soon as you are done serving.@k@v27/30700566. No idle talking with Battler."'
16427: 'Ronove@r@v31/33100150."Certainly.@k@v31/33100151. I will make an effort."'
16428: '@rBeato''s confusing female short temper took hold of her, and she turned her body into gold butterflies, scattered, and disappeared.'
16429: '@rAfter that, only Ronove and the scent of the black tea were left...'
16430: 'Battler@r@v10/30100459."......I feel kind of bad for making her angry."'
16431: 'Ronove@r@v31/33100152."It appears that you are aware of it, so there is nothing more to be said."'
16432: 'Battler@r@v10/30100460."Wait a second.@k@v10/30100461. Weren''t you the one that pushed her over the edge?"'
16433: 'Ronove@r@v31/33100153."Pu ku ku ku.@k@v31/33100154. My, whatever could you mean?@k@v31/33100155. Would you care for some sugar and milk?"'
16434: 'Battler@r@v10/30100462."...Just milk will be fine.@k@v10/30100463. ............And I also want some cookies."'
16435: 'Ronove@r@v31/33100156.".........You are aware that baking the cookies will take some more time?"'
16436: 'Battler@r@v10/30100464."There''s a substitute, you said?"'
16437: 'Ronove@r@v31/33100157."......Certainly.@k@v31/33100158. If you would listen quietly, I will continue the story."'
16438: 'Battler@r@v10/30100465."She said something about a homunculus.@k@v10/30100466. ...I know a bit about that.@k@v10/30100467. It''s that thing, right?@k @v10/30100468.A manufactured human created with alchemy or something?"'
16439: 'Ronove@r@v31/33100159."Yes.@k@v31/33100160. Milady''s soul was shut up in a homunculus, and she was revived into this world, receiving life again as a baby.@k@v31/33100161. ......However, because she was a baby,@k@v31/33100162. even if Kinzo tried to profess his love to her, it would be useless."'
16440: 'Battler@r@v10/30100469."........................@k@v10/30100470. .........You aren''t saying...@k@v10/30100471.......Grandfather shut that baby up in this hidden mansion,@k@v10/30100472. until it grew to reach the same age?!"'
16441: 'Ronove@r@v31/33100163."Yes.@k@v31/33100164. That is what I am saying.@k@v31/33100165. However, while her soul was the same, a human spirit receives a strong influence from its vessel.@k@v31/33100166. Milady lost all of her memories of the past, and grew up as a very normal human girl."'
16442: 'Battler@r@v10/30100473."And you''re saying......that''s the Beato sitting in the garden chair?"'
16443: 'Ronove@r@v31/33100167."Yes.@k@v31/33100168. That is correct.@k@v31/33100169. She grew to be completely identical.@k@v31/33100170. However, she did not possess her power as a witch.@k@v31/33100171. ......I must stress that Milady was a human."'
16444: 'BEATRICE@r@v27/30700567."................................."'
16445: '@rBeato, who was sitting in the garden chair, looking up at the sky, asked that same question again.'
16446: '@rShe asked who she was.'
16447: '@r...The meaning of those words was finally starting to click.@k She couldn''t understand why she was living here, all locked up.'
16448: '@rGrandfather had seized BEATRICE''s soul, shut it up in a body of flesh,@k and then shut that up in a hidden mansion.'
16449: '@rHowever, since she had lived here since the time she was born, she couldn''t even understand who she was,@k or why she lived shut up in there...'
16450: '@r......W-...wait, wait.@k@rWho would take such a stupid story seriously?'
16451: '@rWhy don''t I change my interpretation?@k@r...Essentially, couldn''t it be something like this?'
16452: '@rGrandfather met BEATRICE.@k@rHe then fell in love with her and courted her, but she didn''t nod her head in agreement.@k@rAnd so he got angry, and shut her up inside this hidden mansion.'
16453: '@rBEATRICE tried to escape, but no matter what she did, she couldn''t succeed,@k ......so she finally chose her own death.'
16454: '@r......And then, .........hmm.'
16455: '@r...Maybe there was a girl that looked just like BEATRICE, ...no, a baby.'
16456: '@rAnd Grandfather raised this child with care.'
