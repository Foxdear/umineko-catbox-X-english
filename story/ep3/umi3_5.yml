16466: '@rRonove used the red to say that Kuwadorian actually existed.'
16467: '@r...Did that mean the same thing as the red Beato used?'
16468: 'Ronove@r@v31/33100174."Even if I am not much of one, I am a demon all the same.@k@v31/33100175. ...Please keep this a secret from Milady, yes?"'
16469: 'Battler@r@v10/30100476."...Y-......yeah!"'
16470: '@rBeato, who knew I would try to trip her up, had grown extremely cautious when using red.'
16471: '@rTo think that Ronove could also use that red...'
16472: '@rOf course, it''s the red of a crafty man.@k I don''t know how far I can accept it,@k but anyway, I might be able to get some hint out of it......'
16473: 'Battler@r@v10/30100477."So that Beato relaxing in the garden of Kuwadorian, ...and that conversation she had with Grandfather, were the truth?"'
16474: 'Ronove@r@v31/33100176."Yes.@k@v31/33100177. It is the truth.@k@v31/33100178. In the past,@v31/33100179.@|@y@c900.@[ the pair actually had a conversation like that in this place.@]@c."'
16475: 'Battler@r@v10/30100478."Th-thanks a lot.@k@v10/30100479. I''ll ask for some more red.@k@v10/30100480. She said that she was born from a homunculus,@k@v10/30100481. but does that kind of unscientific, magical thing actually exist?!"'
16476: 'Ronove@r@v31/33100180."I am unable to answer that question.@k@v31/33100181. The reason is that it would cause a stalemate."'
16477: 'Battler@r@v10/30100482."......A stalemate??@k @v10/30100483.What do you mean?"'
16478: 'Ronove@r@v31/33100182."It''s a chess term referring to a state in which, similar to a "perpetual check",@k@v31/33100183. any further progress in a game becomes impossible.@k@v31/33100184. This is the opposite of an endless repetition of moves,@k@v31/33100185. and refers to a situation in which all moves disappear, resulting in a kind of deadlock."'
16479: 'Ronove@r@v31/33100186."In chess this would lead to a draw, just as if there were a perpetual check.@k@v31/33100187. ...However, there is no draw in the game between you and Milady.@k@v31/33100188. Therefore, I am unable to answer in red any question that would bring about a stalemate."'
16480: 'Battler@r@v10/30100484.".........You''re speaking in riddles by saying something I don''t really understand,@k@v10/30100485. but when it comes down to it, you''re just trying to trick me because you can''t say in red that something magical like a homunculus exists, right?"'
16481: 'Ronove@r@v31/33100189."If I were to say in red that "witches exist", what would you do, Battler-sama?"'
16482: 'Battler@r@v10/30100486."...............mh.@k@v10/30100487. ......That''s what we''re having this big fight over whether or not to believe, right?@k@|@y@v10/30100488. If you told me that outright, there''d be nothing more to discuss.@k@v10/30100489. It''d be game over."'
16483: 'Ronove@r@v31/33100190."If I said "witches exist" in red, you would have no room for argument.@k@v31/33100191. However, since the reason would never have been made clear to you, Battler-sama, you probably wouldn''t accept it.@k@v31/33100192. However, after being told that in red, you would have no room for argument and would not have been shown any proof."'
16484: 'Ronove@r@v31/33100193."In this situation, Battler-sama,@k@v31/33100194. even though you wouldn''t be able to admit defeat, you would have no way to make a counterargument, and it would become a deadlock.@k@v31/33100195. Even though checkmate would not have been reached, no more moves would exist."'
16485: 'Ronove@r@v31/33100196."Since you would not be able to make your next move, it would never become Milady''s turn,@k@v31/33100197. and the game would stop there for all eternity.@k@v31/33100198. As a result, Milady would be unable to force you to submit.@k@v31/33100199. ......That would be a deadlock situation."'
16486: 'Ronove@r@v31/33100200."In order to avoid that,@k@v31/33100201. I am unable to answer questions of this form in red."'
16487: 'Battler@r@v10/30100490."......So, to cut to the chase, you mean that questions that leave no room for discussion are prohibited?@k @|@y@v10/30100491.Well, that makes sense, I guess.@k@v10/30100492. If I was told "witches exist" in red, I''d have to give up from the start."'
16488: 'Ronove@r@v31/33100202."I am pleased that you understand.@k@v31/33100203. I believe we might be able to work together if you ask a question of a different form."'
16489: 'Battler@r@v10/30100493."......Can you respond to the repetition request she dodged?@k @v10/30100494.About the number of people on this island."'
16490: 'Ronove@r@v31/33100204."If Milady held back on the request, then of course I cannot respond.@k@v31/33100205. As Milady''s furniture, I am unable to act too forward."'
16491: '@rRonove made an exaggerated gesture, trying to act like a loyal retainer.@k This guy''s so shameless.'
16492: 'Battler@r@v10/30100495."Tch.@k@v10/30100496. Just when I thought you might be useful."'
16493: 'Battler@r@v10/30100497."......I''ll give up on that and search for a different question.@k@v10/30100498. ...That''s right.@k@v10/30100499. I was forgetting to check something important.@k@v10/30100500. .........This is a story about Beato''s memories, right?@k @v10/30100501.When did it happen?@k@v10/30100502. It couldn''t be happening right now, right?"'
16494: 'Ronove@r@v31/33100206."Correct.@k @v31/33100207.@|@y@c900.@[This is the world of 1967.@]@c.@k@v31/33100208. It is the world of 19 years ago."'
16495: 'Battler@r@v10/30100503."............Hmmmmm..."'
16496: '@rLet''s go through the story one more time.@k@rI wonder if it couldn''t be something like this.'
16497: '@rGrandfather had a person with whom he fell in unrequited love, called BEATRICE.@k@rAnd he confined her in this hidden mansion and continually courted her.@k@rBut she was stubborn and didn''t say yes.'
16498: '@rEventually, she grew pessimistic about being unable to escape from here...@kand probably, committed suicide.'
16499: '@r......And then,@w500. ......her soul was put in a homunculus and......'
16500: '@rNo, no, if I accept that, it''s the same as accepting the witch.'
16501: '@rI can interpret that part like this.@k@rShe probably......left a daughter behind when she died.'
16502: '@rThat talk about the soul being put in a new body...probably meant...@kthat Grandfather raised that child believing it to be the reincarnation of BEATRICE...'
16503: '@r...In that case, Beato must have existed on this island for at least the last 19 years as the 19th person, and then...@k...umm......'
16504: 'Battler@r@v10/30100504."......I''m starting to get confused.@k@v10/30100505. ...In any event, none of this leaves the realm of guesswork.@k@v10/30100506. The only thing that I can definitely say in red,@k@v10/30100507. is that in 1967, in a hidden mansion on Rokkenjima, BEATRICE existed as a human.@k@v10/30100508. That''s all."'
16505: 'Ronove@r@v31/33100209."That is correct.@k @v31/33100210.@|@y@c900.@[In 1967, in a hidden mansion on Rokkenjima, BEATRICE-sama existed as a human.@]@c."'
16506: 'Battler@r@v10/30100509."Oh, thank you.@k@v10/30100510. That really helps."'
16507: 'Ronove@r@v31/33100211."Congratulations.@k@v31/33100212. With this, you have made clear the existence of the piece known as the 19th person.@k@v31/33100213. The 19th human outside of the 18 who you can blame, just as you longed for."'
16508: 'Ronove@r@v31/33100214."......A sacrificial sheep that you can shift the blame of any crime onto.@k@v31/33100215. And you must be so glad that it is Milady.@k@|@y@v31/33100216. Pu ku ku ku."'
16509: '@rRonove laughed indiscreetly.'
16510: '@rSomehow, I didn''t like his phrasing, so I didn''t feel like laughing along with him.'
16511: 'Battler@r@v10/30100511."......That''s right.@k@v10/30100512. Auntie Rosa said it.@k@v10/30100513. ......''BEATRICE is dead''?@k @v10/30100514."I killed her"?@k @v10/30100515.What does that mean...?"'
16512: 'Ronove@r@v31/33100217."As for that, it may be faster to see the actual circumstances rather than listen to me tell you.@k@v31/33100218. Let us advance the clock a little more."'
16513: '@rRonove pulled a stylish pocket watch from his pocket, and made to wind the crown.'
16514: '@rAs soon as he did, I saw gold butterflies gather behind Ronove''s back and take the form of a person.'
16515: '@r...Was it Beato?!@k I quickly realized that it was someone else.'
16516: '@rIt was her.@k That oldest sister of the Seven Stakes, who loved tormenting me more than anything else.'
16517: '@r......If I don''t think myself lucky to see that sexy ass, I won''t be able to play along with their torture game...'
16518: 'Lucifer@r@v38/32300012."Ronove-sama.@k@v38/32300013. So, you were still here.@k@v38/32300014. This is an urgent call from BEATRICE-sama."'
16519: 'Ronove@r@v31/33100219."My, my,@k@v31/33100220. what kind of urgent business could it be?@k@v31/33100221. ......It appears as though I have spent slightly too long chatting with you, Battler-sama.@k@|@y@v31/33100222. Well then, Battler-sama, if you will excuse me.@k@v31/33100223. Please continue to enjoy your game with Milady."'
16520: 'Battler@r@v10/30100516."Yeah, yeah.@k@v10/30100517. I''ll enjoy it as best as I can.@k@v10/30100518. ...''Cause the conversations are more lively with you than with Beato.@k@v10/30100519. And you use the red more graciously.@k@v10/30100520. Come talk again any time."'
16521: 'Ronove@r@v31/33100224."............Battler-sama.@k@v31/33100225. Despite how I look, I am Milady''s furniture.@k@v31/33100226. ...I cannot do something that Milady does not wish.@k@v31/33100227. What I said in red was something that normally should have come from Milady''s mouth.@k@v31/33100228. ...I did nothing more than announce the red truth in Milady''s place as she sulked."'
16522: 'Battler@r@v10/30100521."So she really was sulking then?@k @v10/30100522.Ihihihi!"'
16523: 'Ronove@r@v31/33100229."Pu ku kuku."'
16524: '@rSeeing me and Ronove incomprehensibly hitting it off, that Seven Stakes chick cocked her head slightly.'
16525: 'Lucifer@r@v38/32300015."Ronove-sama.@k@v38/32300016. We are keeping BEATRICE-sama waiting.@k@v38/32300017. Let us hurry."'
16526: 'Ronove@r@v31/33100230."Yes, I will come immediately.@k@v31/33100231. Well then, Battler-sama, I shall see you later.@k@v31/33100232. ......It appears that we have finally started getting along.@k@v31/33100233. As I thought, I have the feeling that we can become good friends."'
16527: 'Battler@r@v10/30100523."If by that you mean partners at gossiping behind Beato''s back."'
16528: 'Lucifer@r@v38/32300018."Ronove-sama!"@|@y'
16529: 'Ronove@r@v31/33100234."Yes, yes.@k@v31/33100235. Then, if you will excuse me."'
16530: '@rMaybe it was because she really didn''t like seeing him act friendly with me, or maybe it was because she had really been told to hurry.'
16531: '@rThe Seven Stakes babe bellowed sharply at Ronove, and he laughed foolishly and disappeared, as if running away...'
16532: 'Lucifer@r@v38/32300019."......Hmph.@k@v38/32300020. How could I, the eldest sister of the Seven Stakes of Purgatory, be called on for this level of work!@k @v38/32300021....BEATRICE-sama could easily have told one of the younger sisters, who look like they have so much free time, for something like this. Sheesh...!"'
16533: 'Battler@r@v10/30100524."Why so grumpy, girl?@k@v10/30100525. If you''re hungry, eat a cookie or something.@k@|@y@v10/30100526. Why don''t I give you the last one?@k @v10/30100527.Ihihi!"'
16534: 'Lucifer@r@v38/32300022."......Hummmmm?@k @v38/32300023.How thoughtful.@k@v38/32300024. Then, shall I take one?"'
16535: '@rI lightly pushed the snack plate with the last remaining cookie on it over to her.'
16536: 'Lucifer@r@v38/32300025."Thank you."'
16537: '@rAs though coming as a replacement for the period at the end of the sentence, a sharp sound pierced the table...'
16538: '@rThe nails on three of her fingers had sharply extended, and were stuck...@w500.a hair''s breadth into the gaps between my fingers on the hand I had used to push the plate.'
16539: '@r......It had happened in an instant, ...so for a while, I didn''t even realize that her fingernails had grown.'
16540: '@rThe tips of those sharp nails were like blades with a red manicure.'
16541: '@r......The spaces between the bases of my fingers prickled.'
16542: '@r......Those razor-like blades were sticking sharply into the back of my hand, and into the spaces between my fingers...'
16543: '@rBy those three blades, my carelessly outstretched right hand was not even permitted to shake, and all I could do now was allow a single line of cold sweat to drip down.'
16544: 'Battler@r@v10/30100528."............Wowee.@k@v10/30100529. ...Isn''t it about time you cut your nails, babe?"'
16545: 'Lucifer@r@v38/32300026."Lucifer.@k@v38/32300027. ......That is my noble name.@k@v38/32300028. Honored furniture serving BEATRICE-sama, and the eldest sister of the Seven Stakes of Purgatory."'
16546: 'Lucifer@r@v38/32300029.".........I''m not like my disgraceful and cretinous younger sisters.@k@v38/32300030. If you don''t show the proper respect, you will regret it."'
16547: 'Battler@r@v10/30100530."...How would I regret it?@k@v10/30100531. I don''t have a clue."'
16548: 'Lucifer@r@v38/32300031.".........Heheheheheh.@k@v38/32300032. Stupid kid.@k@v38/32300033. ...Do you really want me to play with you that much?@k @v38/32300034.You really can''t get me out of your mind?"'
16549: 'Lucifer@r@v38/32300035."I''ll thrust my stake deep, deep into you and make you really enjoy being gouged, got it......?@k @v38/32300036.Hehehehehehhehehhehehehhh......!"'
16550: 'Battler@r@v10/30100532.".........You bitch.@k@v10/30100533. One day I''ll push you down and say that back to you."'
16551: 'Lucifer@r@v38/32300037."Oh, really?@k @v38/32300038.I''ll be looking forward to that, then?@k @v38/32300039.Ehhehehehheheheh......@k@v38/32300040. ...Ahhahahahahahahahahahahahahahahahaha...!!!"'
16552: '@rRosa eventually regained her calm.'
16553: '@rThe men wanted to hurry her into talking faster, but Kyrie intervened.'
16554: '@r...If something like she had just mentioned really had happened, ......it was an abominable past that she wouldn''t want to remember.'
16555: '@rAfter taking several deep breaths with her hand over her chest, it seemed that she had more or less gathered the resolve to talk...'
16556: 'Rosa@r@v12/31400054."......How old was I then, I wonder...@k@v12/31400055. ...Probably...middle school, or... ...I don''t remember well.@k@v12/31400056. Anyway, I think I was about that old..."'
16557: 'Rudolf@r@v08/31200149."Which means... Maybe about twenty years ago?"'
16558: 'Rosa@r@v12/31400057."Back then, my grades weren''t very good, and Mother was always angry at me.@k@v12/31400058. ......I was trying to do my best in my own way,@k@v12/31400059. but I couldn''t respond to Mother''s expectations at all..."'
16559: 'Krauss@r@v02/30800146."......Mother was always very strict with Rosa.@k@v02/30800147. I sympathized with her at the time."'
16560: 'Eva@r@v05/31000263."Hmm.@k@v05/31000264. You say that even though you were always talking behind her back."'
16561: 'Hideyoshi@r@v06/31100159."Would you give it a rest, Eva.@k@|@y@v06/31100160. So?@k @v06/31100161.Where did you meet BEATRICE, Rosa-san?!"'
16562: 'Kyrie@r@v09/31300128."Hideyoshi-san, you mustn''t rush her now.@k@|@y@v09/31300129. ......It''s alright, Rosa-san.@k@v09/31300130. Tell us at your leisure."'
16563: 'Rosa@r@v12/31400060.".........Thank you.@k@|@y@v12/31400061. ...It was a day when I had been scolded particularly harshly by Mother."'
16564: '@rEven though my tutor had promised to keep it a secret,@k ...apparently, they told Mother all about how I had complained.'
16565: '@rMother scolded me horribly, saying that I was a disgrace to the Ushiromiya family.'
16566: '@r......Of course, I was doing the best I could.'
16567: '@rBut I had none of Krauss nii-san''s dignity,@k I couldn''t get excellent grades like Eva nee-san,@k and I had no leadership like Rudolf nii-san.'
16568: '@r...I never stood out, didn''t particularly excel at anything,@k and I almost wanted to ask myself why I had even been born into the Ushiromiya family.'
16569: '@rI didn''t know why I had been born.@k@r...On that day, I had the experience of my mind going blank for the first time......'
16570: '@rFor the first time since I was born,@k ...I realized that in addition to facing or surrendering to my problems,@k I had the third choice of running away.'
16571: '@rEven though I say run away, there was no way I could have left Rokkenjima and gone somewhere else.'
16572: '@rBut, anyway, I wanted to run away from the mansion and the way I was at the time.'
16573: '@r......In a way, it was like running away from home, or maybe a half-hearted suicide...'
16574: 'Rosa@r@v12/31400062."......I wanted to disappear.@k@v12/31400063. Or maybe it was that child-like form of resistance where I tried to make my parents worry by disappearing..."'
16575: 'Rosa@r@v12/31400064.".........I thought childishly that if I went into the center of the forest, I could escape from the Ushiromiya house,@k@v12/31400065. or maybe I could get back at them by getting lost and making them worry."'
16576: 'Kyrie@r@v09/31300131."So then, ......you went into the forest that you''d been told not to go into?"'
16577: 'Rosa@r@v12/31400066."......Yes.@k@v12/31400067. After reaching the beach, I followed alongside the ocean.@k@v12/31400068. ......I didn''t have any particular reason,@k@v12/31400069. ......but I felt that, if I went around to the opposite side of the island, there might be a place there that no one knew about,@k@v12/31400070. which might become a hidden house just for me."'
16578: 'Rudolf@r@v08/31200150."Starting by the beach, it''d be impossible to go all the way around.@k@v08/31200151. It becomes a cliff partway, right?@k @v08/31200152.There''s no way you could pass that way."'
16579: 'Rosa@r@v12/31400071."...Of course.@k@v12/31400072. So, I kept going wherever I could, and kept going deeper and deeper in.@k@v12/31400073. ......It was a horrible forest without any paths, but that was comforting to me then.@k@v12/31400074. ...If I could make it through such a dangerous forest, then it would be that much greater of an escape from the Ushiromiya family,@k@v12/31400075. ...which made me feel good."'
16580: 'Eva@r@v05/31000265.".........How shameful.@k@v05/31000266. If you were scolded because of your grades, all you had to do was work harder."'
16581: 'Krauss@r@v02/30800148."You mustn''t say that.@k@|@y@v02/30800149. Doesn''t Rosa have her talent as a designer instead?"'
16582: '@rLiterally this could be taken as him covering for Rosa,@k but everyone knew that Rosa''s company was not making any profits.'
16583: 'Rudolf@r@v08/31200153."Quit it.@k@v08/31200154. Now isn''t the time for sarcasm.@k@|@y@v08/31200155. ......And then you arrived there by coincidence...?@k @v08/31200156....BEATRICE''s...@v08/31200157.hidden mansion."'
16584: '@rRosa nodded weakly......'
16585: 'Hideyoshi@r@v06/31100162."About how far did you walk.@k@v06/31100163. Could you show it to us on a map...?@k @v06/31100164.Natsuhi-san, is there a map of this island?"'
16586: 'Natsuhi@r@v03/30900056."No, not right here and now..."'
16587: 'Rosa@r@v12/31400076."That would be impossible.@k@v12/31400077. I was just walking randomly.@k@v12/31400078. Even if you showed me a map, I wouldn''t know.@k@|@y@v12/31400079. ......And twenty years have passed since then.@k@v12/31400080. I probably couldn''t reach it again even if I went into the forest..."'
16588: 'Hideyoshi@r@v06/31100165.".........Hmmmmmm..."'
16589: '@rSeveral people let out dejected sighs.'
16590: '@rIt was vividly clear that in their haste,@k they had thought that some hint related to the witch''s epitaph, or maybe even the gold itself, might be resting there in that hidden mansion.'
16591: 'Rudolf@r@v08/31200158."The only part of Rokkenjima that got made ready for development is the area around the mansion.@k@v08/31200159. ...The rest is completely uncultivated, and it would probably take considerable effort to survey the entire island."'
16592: 'Kyrie@r@v09/31300132."But just knowing that it actually exists is helpful.@k@|@y@v09/31300133. It would take some money, but if we enlisted an aerial photography company to investigate,@k@v09/31300134. or asked the contractors who constructed this mansion about what happened at the time,@k@v09/31300135. we could probably find some way to search for it."'
16593: 'Eva@r@v05/31000267."Yes.@k@v05/31000268. ...There should be more ways to do it now that there isn''t a question about whether it exists or not."'
16594: 'Krauss@r@v02/30800150."......Mmhm.@k@v02/30800151. It is probably worth investigating right away."'
16595: 'Eva@r@v05/31000269."We will do that investigation together as siblings.@k@v05/31000270. We won''t let you do it alone, Nii-san."'
16596: '@rIt wasn''t certain that the gold was hidden in that secret mansion,@k but it seemed that the fireworks between Krauss and Eva had already begun.'
16597: 'Rudolf@r@v08/31200160."Give it a rest for now, you two.@k@v08/31200161. ...Rosa, please continue."'
16598: 'Rosa@r@v12/31400081."..................Yes."'
16599: '@rBlindly, randomly, I kept running, on and on.'
16600: '@rSuddenly, it felt like I had come across something like an animal trail.'
16601: '@rI had no idea how far I''d walked, and I was very tired,@k so by then, I was just naturally taking the easiest path to walk on.'
16602: '@rAs I did, .........suddenly, right before my eyes, a very, very tall fence appeared.'
16603: '@rIt was a fence wonderfully adorned in a gothic style.'
16604: '@rFor an instant, I spun around, thinking that I might have returned to the original mansion.'
16605: '@rOf course, there were fences around the mansion to stop us from entering the forest.@k But this fence was decorated differently, ......and most of all, it was very tall.'
16606: '@rIt probably reached a full two stories up.'
16607: '@rIt was covered with ivy, and created a mysterious, solemn atmosphere...'
16608: '@rAt the time, ......I believed the legend of the witch of the forest, BEATRICE.'
16609: '@rI had been told that she was frightening,@k but some of the servants told me that she would sometimes help you if you respected her.'
16610: '@r......Since I had started to lose confidence in how my life was going,@k I believed that the only way I could be saved was by receiving her help.'
16611: '@rSo that''s what made me think it.@k ......I believed that this was the fence of the mansion of BEATRICE, the witch of the forest.'
16612: '@rI thought that if I could meet with BEATRICE, she would definitely save me.'
16613: '@rSo I thought I would try to go in.'
16614: '@rBut that fence was very, very tall, and it didn''t look like I could go over it.'
16615: '@rSo I decided to walk around it.@k@rI thought that if I did, I would eventually reach a gate.'
16616: '@rBut it wasn''t that easy.@k The fence had a length to match its height, and no matter how far I went, I didn''t reach a corner.'
16617: '@rIt might have been enclosing a very massive area,@k ...or maybe it just felt that way because my child''s legs made it difficult to walk in the forest.'
16618: '@rAnyway, because I couldn''t find a gate for a while,@k I started to feel sad, as though the witch had rejected me...'
16619: '@rAs I did, I eventually came upon a large tree, whose twisted root had bent the fence.'
16620: '@rI might get my clothes dirty, but if I crawled, it looked like I would be able to sneak in...'
16621: 'Eva@r@v05/31000271.".........And that was the hidden mansion?"'
16622: 'Rosa@r@v12/31400082."I don''t know whether it was the hidden mansion we''ve been talking about...@k@v12/31400083. Still, at the very least, it wasn''t a place that we know of."'
16623: '@rIt wasn''t as though I came out into a garden as soon as I passed the fence.@k@rI had to continue through a lot more uncultivated forest after that.'
16624: '@rAnd then......the forest suddenly opened up.@k And what appeared there was an unbelievably...@w500..........fantastical scene.'
16625: '@rTo think that Rokkenjima, where I had believed no one other than us lived,@w666. ...had been hiding such a wonderful mansion...'
16626: '@rA beautiful flower garden spanned the front of the mansion.@k@rIt was a flower garden of a completely different design from the rose garden we know so well, and was very lovely.'
16627: '@rOf course, the mansion was also wonderful.'
16628: '@r...It was one or two sizes smaller than ours,@k but it was a very elegant, and yet lovely mansion.'
16629: '@rThen, ...............I saw her.@k@rI saw her sitting in a garden chair, positioned to give a view of the flower garden, wearing an elegant dress.'
16630: '@rIt was that black dress embroidered in gold that we would later know from that portrait.'
16631: '@r......I hadn''t seen an elegant dress like that except in fairy tales and on the stage of musicals.'
16632: '@r...That a person would be wearing it as their normal clothes... That in itself seemed quite fantastical.'
16633: '@rThat magical scene was enough to make me lose my sense of reality.'
16634: '@rIf someone had told me then that it was a dream,@k I might have nodded obediently, and waited to wake up in my bed...'
16635: '@rSince, in my shock, I had forgotten to hide myself, she eventually noticed me.'
16636: '@rAt first, her expression was quite listless,@k but when she noticed me, her eyes opened very wide.'
16637: '@r...It was only natural - a guest that she didn''t know had suddenly appeared.'
16638: '@rI automatically bowed my head, feeling that I should greet her and apologize for entering without permission...'
16639: 'BEATRICE@r@v27/30700568."............Who are you?@k@v27/30700569. A new gardener?"'
16640: '@rThose were the first words she said to me.@k@r...That calmed me down a little bit.@k@rBecause I realized that she could be talked with.'
16641: '@rBecause I hadn''t been turned into a frog just by meeting her eyes, like the terrifying witch in that fairy tale.'
16642: 'Rosa@r@v12/31400084."......I,@v12/31400085. ......I''m sorry.@k@v12/31400086. ...I shouldn''t have entered the garden without permission..."'
16643: 'BEATRICE@r@v27/30700570."........................@k@v27/30700571. ......Who are you?@k@v27/30700572. Name yourself."'
16644: 'Rosa@r@v12/31400087."I, ...I am Ushiromiya Rosa."'
16645: 'BEATRICE@r@v27/30700573."......Ushiromiya.@k@|@y@v27/30700574. .....................Hoh.@k@v27/30700575. ...So you are one of Kinzo''s family."'
16646: 'Rosa@r@v12/31400088."Huh?@k @v12/31400089.Ah, ...yes!@k @v12/31400090.I''m Kinzo''s daughter.@k@v12/31400091. G-good afternoon...!"'
16647: '@rI was just a little surprised.@k@r...After all, Father was a great man feared by everyone.'
16648: '@rAnd she had referred to him without using honorifics.@k@rSo she quickly became frightening.'
16649: '@r...After all,@k if she could refer to my fearsome father that way, she must be a witch with incredible power.'
16650: '@rAfter staring at me curiously, she beckoned me to come over to her.'
16651: '@rAnd I obeyed, although filled with belated trepidation.@k@r......After all, I thought I really might be turned into a frog.'
16652: '@r...And the closer and closer I got, the stronger that fear became.'
16653: '@rAfter all, ...I said it several times already, but,@k ............that woman and her dress and the flower garden and the mansion,@k ......that entire harmony was so fantastical and beautiful that it seemed separate from reality.'
16654: '@rIt surely wouldn''t have surprised me even if she was actually a witch...'
16655: '@rAnd I was truly lucky.@k@rShe didn''t turn me into a frog.'
16656: '@rAs I awkwardly stood there stock still, she motioned to an open chair, and urged me to sit down.'
16657: 'BEATRICE@r@v27/30700576."Sit.@k@v27/30700577. Welcoming and speaking to those who visit this garden for the first time is my only pleasure.@k@v27/30700578. .........That said, I have nothing else to find pleasure in."'
16658: '@rAs she said that, she showed an unhappy smile for just an instant.'
16659: '@rBecause I was full of a strange mix of tension and excitement, I rudely asked her a question suddenly.'
16660: 'Rosa@r@v12/31400092."...Umm,@v12/31400093. ............are you the witch of the forest,@v12/31400094. ...BEATRICE......?"'
16661: 'BEATRICE@r@v27/30700579."Indeed.@k@v27/30700580. I am BEATRICE."'
16662: 'Rudolf@r@v08/31200162."As I thought.@k@v08/31200163. BEATRICE actually existed..."'
16663: 'Krauss@r@v02/30800152."...Did she look just like the portrait?"'
16664: 'Rosa@r@v12/31400095."......Yes.@k@v12/31400096. Exactly like the portrait."'
16665: 'Hideyoshi@r@v06/31100166."So she wasn''t just...@v06/31100167....a witch from Father''s imagination..."'
16666: 'Eva@r@v05/31000272."And then, what did you talk with her about?"'
16667: 'Rosa@r@v12/31400097."...As she prepared some tea, she asked me various things about myself.@k@v12/31400098. ......First, she was surprised that I had come through the forest.@k@v12/31400099. It seems she believed that many dangerous wolves lived outside the fence."'
16668: 'Rosa@r@v12/31400100."...So when I told her I had reached this place by going through the forest, she was very surprised.@k@v12/31400101. She asked how I had managed to escape from the wolves - did I give them biscuits and they let me go?@k@v12/31400102. Or did I cover myself in a magic cloak, or...@k@v12/31400103. Those kinds of things, I think."'
16669: 'Hideyoshi@r@v06/31100168."Wahahaha.@k@v06/31100169. ...That sure sounds like a witch.@k@v06/31100170. What an interestin'' person."'
16670: 'Eva@r@v05/31000273."Quiet, honey.@k@v05/31000274. ............It was a long time ago,@k@v05/31000275. but didn''t Father threaten us, saying that wolves lived in the forest, so we shouldn''t get close to there?"'
16671: 'Krauss@r@v02/30800153."Yes, there was a time like that.@k@v02/30800154. Ridiculous.@k@v02/30800155. Even though Japanese wolves went extinct long ago.@k@v02/30800156. What a childish trick."'
16672: 'Rudolf@r@v08/31200164."I don''t remember, though...?@k @v08/31200165.Did Dad really tell us something like that...?@k @v08/31200166.It was the witch of the forest, right?@k @v08/31200167.I don''t think I''ve ever heard about wolves."'
16673: 'Eva@r@v05/31000276."You were still in elementary school.@k@v05/31000277. Don''t you remember?"'
16674: 'Eva@r@v05/31000278."You actually went and replied that you''d want to try petting the wolves.@k@v05/31000279. So Father immediately gave up the wolf story and changed it to the story about the witch.@k@v05/31000280. Such obvious lies, ahahahahaha."'
16675: 'Krauss@r@v02/30800157."Hahahaha.@k@v02/30800158. At the time, the witch story had a much more immediate effect on you, Rudolf, than the wolves.@k@v02/30800159. I remember it well.@k@v02/30800160. Don''t you remember those nights when you clung to my back?"'
16676: 'Kyrie@r@v09/31300136."...*giggle*.@k@v09/31300137. I see, even Rudolf-san used to have that cute period."'
16677: 'Rudolf@r@v08/31200168."Oh, put a lid on it.@k@v08/31200169. I was just a kid."'
16678: 'Kyrie@r@v09/31300138."......Well, anyway.@k@v09/31300139. If Father was the one who shut BEATRICE up in there, it makes sense that he would use the same wolf story.@k@v09/31300140. To him, the vast forest of Rokkenjima was a wall that shouldn''t be crossed,@k@v09/31300141. dividing his two incompatible worlds: the Ushiromiya family and his mistress''s mansion."'
16679: 'Krauss@r@v02/30800161."If you think about the height of that fence, it does seem that Father had turned the whole area, garden and all, into a giant jail cell.@k@v02/30800162. ......Just like a national border dividing his two separate worlds."'
16680: 'Natsuhi@r@v03/30900057."...Forget the wolves, were there any kinds of stray dogs there at the time?@k @v03/30900058.It could have been a fence to protect against those."'
16681: 'Eva@r@v05/31000281."There are no wolves or stray dogs on Rokkenjima.@k@v05/31000282. Just as Nii-san and Kyrie-san are saying,@k@v05/31000283. that fence was probably a border between us and BEATRICE."'
16682: 'Hideyoshi@r@v06/31100171."However, if she innocently believed the story about the wolves, that''s pretty...naive.@k@v06/31100172. That''s nothin'' like the way I''d imagine a witch."'
16683: 'Rosa@r@v12/31400104."......That''s right.@k@v12/31400105. I also sensed that.@k@v12/31400106. ...She was very pompous, just like my image of a witch,@k@v12/31400107. ...but she was somehow very childish, and...@k@v12/31400108....how should I say it, too honest?@k@v12/31400109. ......She gave me the impression that she didn''t know anything about the world."'
16684: 'Rosa@r@v12/31400110."If I had to describe it, ...it was almost as though she had come from a fairy-tale land.@k@v12/31400111. ......She was a truly mysterious person."'
16685: 'Rudolf@r@v08/31200170."......What happened after that?@k@v08/31200171. ...Did you end up talking about Dad at all?"'
16686: 'Rosa@r@v12/31400112."Yes.@k@v12/31400113. Once every few days, sometimes on an arranged day and sometimes suddenly,@k@v12/31400114. Father would appear casually, and they would drink tea together, or take a walk together or something, she said.@k@v12/31400115. And that, by coincidence, she was by herself on the day I visited."'
16687: 'Krauss@r@v02/30800163."I see.@k@v02/30800164. Truly a mistress, then.@k@v02/30800165. ...My, my.@k@v02/30800166. I don''t know how much younger she was, but... not bad, Father."'
16688: 'Natsuhi@r@v03/30900059."......I remain firmly convinced that it was not an indecent relationship."'
16689: 'Eva@r@v05/31000284."Gosh, you are an idiot. There''s no way a lover''s meeting between a man and a woman wouldn''t have some sensuality.@k@|@y@v05/31000285. What happened next?@k@v05/31000286. What did you talk about after that?"'
16690: 'Rosa@r@v12/31400116.".........Because I had introduced myself, I then asked her about herself."'
16691: 'Rosa@r@v12/31400117."...When I did, the atmosphere quickly grew depressing.@k@v12/31400118. ......How should I say it, she seemed very listless and lonely.@k@v12/31400119. ...It was the same expression as the one I had first seen on her face."'
16692: 'Rudolf@r@v08/31200172."Well, that''s because she was his hidden mistress.@k@v08/31200173. If she just walked around wherever she liked, she might have been discovered by Mother.@k@v08/31200174. ......I''m sure the situation was almost like house arrest."'
16693: 'Rudolf@r@v08/31200175."Even though she had beautiful clothes, a beautiful mansion, and a garden, she must have felt very constrained.@k@v08/31200176. No surprise she felt it hard.@k@v08/31200177. .........And then?"'
16694: 'Rosa@r@v12/31400120."There was definitely something on her mind.@k@v12/31400121. ......I remember getting the impression that it wasn''t something that I could resolve just by talking to her,@k@v12/31400122. and feeling very sad about it as well."'
16695: 'Rosa@r@v12/31400123.".........She seemed to have forgotten that I was even there.@k@v12/31400124. ...She was gazing vaguely off into the distance, and was silent for a long, long time."'
16696: 'Rosa@r@v12/31400125."...I thought that I must have said something wrong,@k@v12/31400126. ......but it didn''t seem to be the type of atmosphere where I could offer words of apology...@k@v12/31400127. ......So, I too remained silent for a long, long time, until she remembered that I was there..."'
16697: '@rWhen she did, ......she muttered unexpectedly.'
16698: 'BEATRICE@r@v27/30700581.".........Are there really no wolves beyond the fence?"'
16699: 'Rosa@r@v12/31400128."...Hmm?@k @v12/31400129.Y-yes.@k@v12/31400130. I''ve never seen wolves even in a zoo."'
16700: 'BEATRICE@r@v27/30700582."What is this "zoo"?"'
16701: 'Rosa@r@v12/31400131."Ah, ...it''s a place where they keep all kinds of animals.@k@v12/31400132. They''re full of rare animals like elephants and giraffes and pandas."'
16702: 'BEATRICE@r@v27/30700583."..............................@k@v27/30700584. ...Are there no wolves in a zoo?@k@v27/30700585. Then, umm, ...that might not be scary."'
16703: 'Rosa@r@v12/31400133."Even if there were wolves, all of the animals are put in cages, so it''s safe.@k@v12/31400134. So you can feel safe as you look at and learn about them."'
16704: '@rThe witch of the forest, of all people, was for some reason scared of and didn''t like wolves.'
16705: '@rI remember it looked pretty comical.'
16706: 'BEATRICE@r@v27/30700586."..................@k@v27/30700587. ...How does that differ from myself?"'
16707: 'Rosa@r@v12/31400135."............Huh?"'
16708: '@rShe didn''t even know about zoos.'
16709: '@rI explained how fun zoos could be,@k but it was very difficult to get a person like her, who had never been to one, to understand...'
16710: '@rQuite the opposite, as I explained it to her, her expression grew increasingly dismal.'
16711: '@r...She couldn''t see the difference.'
16712: '@rIt seemed that, although this mansion surrounded by a high fence appeared at a glance to afford her a completely provided-for life of comfort,@k she couldn''t see how she was different from the animals shut up in cages...'
16713: 'BEATRICE@r@v27/30700588."Who am I?@k@v27/30700589. ......Everyone calls me BEATRICE.@k@v27/30700590. ...And that does certainly seem to be the name of a great witch, as you say."'
16714: 'BEATRICE@r@v27/30700591."......But that is not me.@k@v27/30700592. I cannot use any magic.@k@v27/30700593. ......I simply have the soul of that witch sealed inside my body."'
16715: 'Rosa@r@v12/31400136."..................?"'
16716: '@rThere was definitely something mysterious about her.@k It wasn''t just that she was somehow at odds with the world,@k but it seemed that she truly believed that a thing called magic actually exists.'
16717: '@rI think she talked about various weird things, but I don''t remember the details.'
16718: '@rAll I thought was:@w500. ......this might be a pitiful person.'
16719: '@rShe was unable to leave this mansion of her own will, a prisoner without even realizing it.'
16720: '@r......And she didn''t know anything about the outside world, didn''t even understand who she was.'
16721: '@r......She probably vaguely understood herself that she was pitiful.'
16722: '@rBut since she didn''t know anything, it seemed that she couldn''t realize that this was unhappiness.'
16723: '@rNee-san, long ago, when I told you that I felt sorry for a bird in a cage, I remember you said this to me.'
16724: '@r"A bird that only knows the inside of a cage doesn''t long for the outside".'
16725: '@rBut she wasn''t a bird.@k@rShe was, ultimately, a human.'
16726: '@rEven if she had never been outside the cage, she understood that it wasn''t the whole world.'
16727: '@rSo,@w500. .........I invited her.'
16728: 'Rosa@r@v12/31400137."Do you want to try...@v12/31400138....going outside the fence?"'
16729: 'BEATRICE@r@v27/30700594.".........Th-there really aren''t any wolves?"'
16730: 'Rosa@r@v12/31400139."There aren''t.@k@v12/31400140. You''ll definitely be safe."'
16731: 'BEATRICE@r@v27/30700595."..............................@k@v27/30700596. ......I want to leave.@k@v27/30700597. But the gate is always closed."'
16732: 'Rosa@r@v12/31400141."There''s the place I came in through.@k@v12/31400142. There''s a crack you can slip through."'
16733: 'BEATRICE@r@v27/30700598."......If we go through there, is there a world outside?"'
16734: 'Rosa@r@v12/31400143."Yes."'
16735: 'BEATRICE@r@v27/30700599."........................There really aren''t any wolves?"'
16736: 'Rosa@r@v12/31400144."*giggle*.@k@v12/31400145. No, none at all."'
16737: 'BEATRICE@r@v27/30700600.".............................."'
16738: '@rI had only planned to invite her for a short walk,@k ...but she kept looking over her shoulder at the mansion, as though she were seriously deliberating over something.'
16739: '@rThen I learned what she was preparing herself for.'
16740: 'BEATRICE@r@v27/30700601."...............I...have had enough of this place.@k@v27/30700602. ......I want to go...outside.@k@v27/30700603. And I want to know...who I am, what''s happening in this world,@k@v27/30700604. ...and the purpose for which I was born."'
16741: '@rI didn''t know what her life had been like until then.'
16742: '@rIt was probably something that she couldn''t express easily.'
16743: '@rIf it was harsh, she just had to say that she wanted to escape.@k@rIf it was sweet, she just had to say that she would stay.'
16744: '@rTo liken it to something,@k perhaps it was similar to how a hot fireplace on a winter day makes the air get thicker and thicker, giving you a headache...?'
16745: '@rEven though you know that you shouldn''t keep things the way they are, you still need the courage to open the window and be tormented by the cold wind...'
16746: '@rShe was starting to realize that she couldn''t stay there forever.'
16747: '@rShe was starting to realize that she had to go outside sometime.'
16748: '@rBut, since she didn''t know about the outside world,@k to take that first step outside must have required an unimaginable amount of courage...'
16749: '@rAnd she had taken that into consideration, and resolved herself.'
16750: '@rShe had put that resolution to go outside into words, for what was surely the first time in her entire life.'
16751: '@r...I hesitated slightly.@k@rIt had been decided that she would live here by Father.@k@rIt was as if she were Father''s beloved bird in a cage.'
16752: '@rIf I just let her escape,@k ......wouldn''t I be harshly scolded by Father...?'
16753: 'BEATRICE@r@v27/30700605."I want to see."'
16754: 'Rosa@r@v12/31400146.".........Hm?@k @v12/31400147.See what?"'
16755: 'BEATRICE@r@v27/30700606."I want to see...a zoo."'
16756: 'Rosa@r@v12/31400148.".....................ah."'
16757: '@rI was just a little surprised when she finally showed me a very soft smile.'
16758: '@rThat might have been...@kan inner peace, coming from her newfound readiness to venture out from her cage.'
16759: '@rA soft smile which I wouldn''t have imagined could have come out of that dark face...'
16760: 'BEATRICE@r@v27/30700607."......When I speak with you, I keep hearing about things I don''t know.@k@v27/30700608. ...I don''t know about this thing called school, nor about zoos.@k@v27/30700609. I don''t know about movie theaters.@k@v27/30700610. I don''t know about amusement parks."'
16761: 'BEATRICE@r@v27/30700611.".........And I think, from the bottom of my heart, that I want to know about them.@k@v27/30700612. ...Will you take me there?"'
16762: 'Rosa@r@v12/31400149."Huh? ......Y-yes."'
16763: '@r...I was nervous about how I would do it and keep it a secret from Father,@k ...but her face looked so happy, so I went along with her and nodded.'
16764: '@rBut it seemed that the meaning behind my vague expression was not communicated to her.'
16765: '@rIt seemed that she believed that I would really take her to all of those places if we left.'
16766: '@rShe was pure and genuine.@k ......She had probably never been tricked by anyone.@k No, ......maybe it should be said that she hadn''t been taught how to doubt.'
16767: '@rHer face was somewhat radiant, and yet pathetic.@k@r...I wanted to somehow grant her modest wish.'
16768: 'BEATRICE@r@v27/30700613."I...have had enough of BEATRICE.@k@v27/30700614. I want to know who I am.@k@v27/30700615. I want to start out as a new human, not BEATRICE."'
16769: 'BEATRICE@r@v27/30700616."So, I want you to take me from here.@k@v27/30700617. .........I don''t need tea anymore.@k@v27/30700618. I don''t need this dress.@k@v27/30700619. I won''t meet with Kinzo again.@k@v27/30700620. ......Please, take me from here.@k@v27/30700621. Rosa."'
16770: '@rHowever, that responsibility was one that a child such as me couldn''t possibly bear fully.'
16771: '@rBut her serious gaze and her brilliant smile,@k ...almost as though an evil spirit had lifted from her,@k ......made me feel a little courage start to rise up inside myself.'
16772: '@rThis was definitely something that would get me in a lot of trouble.@k@r......But it was definitely the right thing to do.'
16773: '@rI don''t know how it will turn out, but......@w833. ......I''ll take her out.'
16774: '@rOf course, I won''t be able to ask help from Father, and not Mother either.'
16775: '@r.........Should I talk to Onii-sama or Onee-sama?@k@rNo, what about that reliable Genji-san, or...@kthat''s right, what about Kumasawa-san, to whom I can always talk when I''m in trouble.'
16776: '@rI''m sure they''ll be able to do something.'
16777: '@rAnyway, for now, I''ll take her out of here.@k@rBecause this is no longer a place where she wishes to be.'
16778: '@r......And so, I took her to the crack in the fence and led her outside.'
16779: '@rShe was all nervous, checking to make sure there were no wolves around,@k but after that fear disappeared,@k she seemed somehow to be having fun even just walking around this dense forest.'
16780: '@rEvery time she found something, she would ask me about it.@k@rAnd they were all really minor things.'
16781: '@r......What''s that flower?@k @|@yWhat''s that leaf?@k @|@yAnd that sound?@k And that smell?'
16782: '@rIt was really like...the inside of that fence had been her entire world.'
16783: '@rSo, to her, who had stepped out of the world, this was.........'
16784: '@r......You know, it''s strange.'
16785: '@rIn the beginning, when I first saw her, I thought that she was the absolute incarnation of a witch relaxing by a witch''s mansion.'
16786: '@rBut now it was different.@k Or actually, the complete opposite.'
16787: '@r......She had gone out of a world she had believed to be finite, and was full of joy at realizing for the first time that the world was endless.'
16788: '@rSo everything she saw was new.@k@r......It was almost as though she was the one who had been thrown into a fairy tale.'
16789: '@rIf she was Alice, then I felt almost like a rabbit holding a watch......'
16790: '@rTo her, it was probably a really fun walk, filled to the brim with excitement.@k ...But as for me, the truth was, I was completely bewildered.'
16791: '@r......After all, I had walked randomly to get there.@k@rSo there was no way I could have known the way back to the mansion.'
16792: '@rThere were no lights in the forest, and I hadn''t brought a flashlight.@k@rI realized that it would be terrible if it got dark while we were still like this, and grew impatient.'
16793: '@rShe was too innocent,@k and apparently, she couldn''t understand at all how frightening it would be to face the night inside the forest.'
16794: '@rBut I was the one who had brought her outside.@k@r...Somehow, I had to take responsibility, and resolve this situation.'
16795: '@rSo I thought.@k ......That for now we should just go out to the sea.@k@rIf we then followed the coast around, eventually we should definitely be able to make it back to the mansion.'
16796: '@rHowever, that was much more of a problem than I had imagined.@k@r...After all, I didn''t have a map or a compass.'
16797: '@rThere was no way I could walk in a straight line through an uncultivated forest, and I had immediately lost my sense of direction.'
16798: '@rI already had no clue which trail I had come by, and was completely lost...'
16799: '@rAt this rate, night would definitely fall before I even knew where I was walking.'
16800: '@rBut I didn''t have the luxury to complain.'
16801: '@rBecause that woman following behind me was so innocent and having so much fun.@k ...Therefore, for the sake of her smile if nothing else,@k I absolutely had to guide her out of this forest.'
16802: '@rGritting my teeth so that I didn''t show her a troubled face,@k I pushed my way onward through the pathless woods.'
16803: '@rAnd, although we had various troubles, we were lucky enough to make it to the sea...'
16804: '@rAt that time, I still didn''t even have a clue where I was on the island,@k but for the time being, I was just a little reassured, realizing that if I just went around this way, I would surely be able to return to the mansion.'
16805: '@rOf course, although I said that we reached the sea, we were on the top of a rocky cliff.@k The beach was far below us.'
16806: '@rI was tired from walking around the forest for so long,@k so I thought that even though it was a rocky beach, an open area would probably be much easier to walk in.'
16807: '@rSo I planned to somehow go down the rocky cliff.@k@r...It did look pretty dangerous, and I wondered if there was some other way.'
16808: '@rHowever, BEATRICE agreed with my plan without any doubts.'
16809: '@r......Even though she was probably older than me,@k ...she obeyed me truly obediently, almost as though she were some kind of chick who believed I was a mother bird.'
16810: '@rI searched to see if there wasn''t some place where I could go down the cliff.@k ...Then I found a place where the cliff had crumbled into a slope.'
16811: '@r.......It looked a little dangerous,@k but if I went down on both hands and both legs, like I was crawling, I thought it would probably be okay.'
16812: 'Rosa@r@v12/31400150."......Let''s go down here.@k@v12/31400151. It''ll be dangerous if you aren''t careful,@k@v12/31400152. but for now, if we go down to the beach and walk along it, I think we can avoid getting lost any more."'
16813: 'BEATRICE@r@v27/30700622."Mmhm.@k@v27/30700623. If you will do that, then let''s go.@k@v27/30700624. I find this getting lost to be fun also.@k@v27/30700625. I''m very happy."'
16814: '@r.........She really had no sense of danger.@k@rThere was probably no mistake that she had lived a life without discomfort.'
16815: '@rEven though she knew it would get dark when night fell,@k she couldn''t imagine how dangerous the inside of a forest could be without a light.'
16816: '@rFurthermore, it seemed that she couldn''t grasp at all how dangerous it might be if she fell from the cliff.'
16817: '@rI warned her once more to be careful.'
16818: '@rI cautiously examined the place where we could go down.@k@r...It looked......pretty high up.@k@rI think it might have been about ten meters down.'
16819: '@rIf you looked at it from the bottom up, it would probably have looked shorter than the roof of the mansion.@k But looking from the top, it felt almost like staring down from the Tokyo Tower''s observation room.'
16820: '@rBut BEATRICE still appeared to be completely without fear.@k ...It felt as though she had never even been taught that high places were dangerous.'
16821: '@r......No, maybe she truly believed that she was a witch,@k and that she could fly, so there wasn''t anything dangerous.'
16822: 'Rosa@r@v12/31400153."Please be careful.@k@v12/31400154. ...It''s pretty...high."'
16823: 'BEATRICE@r@v27/30700626."Mmhm.@k@v27/30700627. I will be careful.@k@v27/30700628. I see there''s a beach if we go down there.@k@v27/30700629. Is there an aquarium there?"'
16824: 'Rosa@r@v12/31400155."No, there are no aquariums on this island.@k@v12/31400156. But I think there are lots of fish in the sea."'
16825: 'BEATRICE@r@v27/30700630."I see.@k@v27/30700631. So there are fish.@k@v27/30700632. Are there, ...umm, whales and dolphins and penguins, like you talked about?"'
16826: 'Rosa@r@v12/31400157."No, you would have to go to an aquarium for those.@k@v12/31400158. ......And there aren''t any aquariums unless you leave this island."'
16827: 'BEATRICE@r@v27/30700633."Is that so?@k@v27/30700634. ......But I look forward to it.@k@v27/30700635. What kind of fish are whales?"'
16828: 'Rosa@r@v12/31400159."Umm, ...they''re really big fish and...huh, aren''t they mammals?@k @v12/31400160.And they spit out seawater."'
16829: 'BEATRICE@r@v27/30700636."Hoh.@k@v27/30700637. Then the dolphins?"'
16830: 'Rosa@r@v12/31400161."Umm, they''re really smart fish and...huh...aren''t they also mammals?@k @v12/31400162.They''re really smart and they can be taught tricks and stuff."'
16831: 'BEATRICE@r@v27/30700638."Hohhoh.@k@v27/30700639. Then what about penguins?"'
16832: 'Rosa@r@v12/31400163."Umm, ...huh, weren''t they birds...?"'
16833: 'BEATRICE@r@v27/30700640."What''s this?@k@v27/30700641. Didn''t you say that there were fish in aquariums?"'
16834: 'Rosa@r@v12/31400164."Ummm, ummm...@k@v12/31400165. Well, um, there isn''t only fish, they''re full of all kinds of things that live in the ocean."'
16835: 'BEATRICE@r@v27/30700642."Hohhoh.@k@v27/30700643. I am really looking forward to that!@k@|@y@v27/30700644. .........nn - "'
16836: 'BEATRICE@r@v27/30700644_1.Wa, hyaa.'
16837: '@rShe made...some might have described it as a funny,@w500. ...rushed and short voice,@w666. ...no, probably it was a scream, I think.'
16838: '@rShe suddenly made a sound like that.'
16839: '@r......Her body separated from the cliff, and gently fell down.'
16840: '@rI immediately thought to say to her.@k@r"How many times did I warn you to be careful!"'
16841: '@r......It was the thought of a child.@k It was how a child immediately gets mad when something happens, trying to show that they are not at fault.'
16842: '@rOf course, I said it too.@k@rAre you alright?@k How many times did I warn you......'
16843: 'Rudolf@r@v08/31200178."...............So,@k@v08/31200179. ...after she fell from the cliff,@v08/31200180. ...what happened?"'
16844: 'Rosa@r@v12/31400166."..........................."'
16845: 'Krauss@r@v02/30800167."......What happened to her?@k@v02/30800168. ...Rosa."'
16846: '@rRosa fell silent.@k ...Her gaze fell to her feet, ...as though she were seeing through the floor to some disgusting memory...'
16847: 'Eva@r@v05/31000287."She...died, right......?"'
16848: '@rEva''s brutal words were the ones that Rosa had most wanted to avoid.'
16849: '@rAnd when she was hit with them, ......she screamed in resignation.'
16850: 'Rosa@r@v12/31400167."Yes, she died!!@k @v12/31400168.It was a rocky beach, many sharp and dangerous rocks lay exposed!!@k @v12/31400169.Her eyes were still open, the blood kept pouring out... Suddenly a red carpet was spreading out...!"'
16851: 'Rosa@r@v12/31400170."I spoke to her, shook her!!@k @v12/31400171.But she refused to respond, not even a blink, ......no, she wouldn''t even close her eyelids!!"'
16852: 'Rosa@r@v12/31400172."It was my fault!@k @v12/31400173.She was wearing a dress, remember?!@k @v12/31400174.Even though I knew that her outfit was difficult to move in, I said that we should go down the cliff!!@k @v12/31400175.She was incredibly innocent, so she obeyed what I said without any doubts...!!"'
16853: 'BEATRICE@r@v27/30700645."......How long do you plan on remaining dead?@k@v27/30700646. Open your eyes already.@k@v27/30700647. Honestly, just turning into a lump of meat without me."'
16854: 'Battler@r@v10/30100534."I was just flirting with your friend the sexy-assed chick.@k@|@y@v10/30100535. ......More importantly, what is all this?"'
16855: 'BEATRICE@r@v27/30700648."Mmm.@k@v27/30700649. It is as you see.@k@|@y@v27/30700650. ......I missed my footing, fell down,@v27/30700651. and died."'
16856: 'Battler@r@v10/30100535_1."What did you say...@k@v10/30100535_2. .........Even though you appeared as the 19th person,@v10/30100535_3. ......you say you died......?"'
16857: 'Battler@r@v10/30100535_4."Don''t mess with me, that can''t be...!@k @v10/30100535_5.Auntie Rosa was a kid, and she was panicking.@k@v10/30100535_6. It''s not like there was a doctor.@k@v10/30100535_7. She probably made a mistake, thinking you were dead, and you probably, umm, ......were in a state of apparent death, or something, but actually alive.@k@v10/30100535_8. Right?!"'
16858: '@rIt can''t be.@k She''s obviously alive.@k@rOtherwise, she wouldn''t be here in front of me, right...?!'
16859: '@r...The kid-aged Auntie Rosa was shaking BEATRICE''s body, crying.'
16860: '@rI too stared into that face,@w500. ...............but her eyes were still open, and it really was a corpse.'
16861: '@r...I wanted to brush it off with something vague like a state of apparent death,@k ......but from any angle, there was nothing "apparent" about it; ...she really didn''t look anything but dead...'
16862: '@rBEATRICE had fallen upside-down from a cliff of that height,@k ......and her head had smashed against the pointed tip of those sharp rocks.'
16863: '@r............You would die, wouldn''t you,@w333. ......from that height,@w500. ......on those rocks......'
16864: '@rBut I can''t accept that...'
16865: '@rNo matter how dead she looks, ......she has to be alive...!@k And she became this damn irritating witch!@k That way, all of the inconsistencies fit.'
16866: '@rShe''d been confined by Grandfather in a hidden mansion the whole time.'
16867: '@rAnd then to avenge herself, she planned out her revenge,@k ......and would go on to commit a number of atrocious murders!'
16868: '@rAuntie Rosa probably just mistakenly thought that she was dead.@k But she was really alive, and as soon as Auntie Rosa left, she miraculously started breathing again.'
16869: '@r......And then she somehow lived until today, and would open the curtain on the scene of her revenge.'
16870: '@rOtherwise, the facts don''t fit together!!'
16871: 'Battler@r@v10/30100536."......I won''t let you trick me so easily.@k@v10/30100537. Can you repeat it in red?!@k @v10/30100538.That she died for certain!!@k @v10/30100539.She has to be alive, right?!@k @v10/30100540.It''s obvious!!"'
16872: 'BEATRICE@r@v27/30700660."How does that look like being alive to you?@k @v27/30700661.@|@y@c900.@[She''s definitely dead!@]@c."'
16873: 'Battler@r@v10/30100541.".................................mgghhhh..."'
16874: '@rMy theory that the 19th person was Grandfather''s mistress, who was a human BEATRICE, broke down.'
16875: '@r...I thought I had managed to segue from a defensive position into a counterattack, but......'
16876: 'Battler@r@v10/30100542."......Then, ......who are you?@k@v10/30100543. You just died, this very minute!@k @v10/30100544.You aren''t going to say that you revived yourself with magic, are you?!"'
16877: 'BEATRICE@r@v27/30700662."*cackle*cackle*.@k@v27/30700663. I think that I''ve already explained it, though."'
16878: 'BEATRICE@r@v27/30700664."......The me that is lying over there definitely has my soul,@k@v27/30700665. but that body was nothing more than a cage of flesh tying me to the physical world.@k@v27/30700666. And that cage of flesh was thus broken.@k@v27/30700667. ......Do you understand what that means?"'
16879: 'Battler@r@v10/30100545."...............I don''t have a clue anymore.@k@v10/30100546. ......Keep having fun with your witch-girl talk.@k@|@y@v10/30100547. I''ll listen instead of eating a cookie!@k @v10/30100548.What the... It''s empty.@k@v10/30100549. Hey, could I get some more black tea?"'
16880: 'BEATRICE@r@v27/30700668."*cackle*cackle*!@k @v27/30700669.Ronove.@k@v27/30700670. Our guest wants some black tea."'
16881: '@rWhen Beato clapped her hands, Ronove appeared.'
16882: '@r......Butlers sure are convenient.'
16883: 'Ronove@r@v31/33100236."A refill, is it?@k@v31/33100237. Certainly.@k@v31/33100238. How much shall I pour you?"'
16884: 'Battler@r@v10/30100550."Well, I''ve got more than enough to go with it.@k@v10/30100551. Half will be fine."'
16885: 'Ronove@r@v31/33100239."Filling it to the brim regardless is the English custom."'
16886: '@rEven though just enough to wet my throat would have been fine, he filled it to the top with tea.'
16887: '@rI turned my back to Beato, sipping it in silence...'
16888: 'Rosa@r@v12/31400176."Wait... Open your eyes...!!@k @v12/31400177.BEATRICE...!!"'
16889: '@rRosa shook me,@k ............no, shook the corpse that had once been me.'
16890: '@rI watched over her from a short distance away.'
16891: '@rAh, ...so I fell from there and died.........'
16892: '@rI believed that was true for a while.@k ...After that, I saw Rosa spend a long time beside my corpse, then watched her as she ran away.'
16893: '@r......Eventually, I realized that I was a different individual from that corpse...'
16894: 'BEATRICE@r@v27/30700671.".....................That''s right.@k@v27/30700672. I am......me.@k@v27/30700673. ...So, I have finally been able to escape from Kinzo''s restrictions..."'
16895: '@rEventually, I felt the memory returning...@k@rThe fact that I was an Endless Witch who had lived for one thousand years.'
16896: '@rAnd then I remembered that I had been summoned by Kinzo, and for a long time, had been imprisoned by him...'
16897: '@rWhile I had been imprisoned in a cage of flesh, I had completely lost my memory as a witch.'
16898: '@rHowever, thanks to Rosa, if you could say that...@kThanks to my accidental but fortunate death, I had now finally brought myself together......'
16899: 'BEATRICE@r@v27/30700674."......Rosa.@k@v27/30700675. You are probably regretting that you brought about my death.@k@v27/30700676. But as for me, I could even thank you.@k@v27/30700677. *cackle*cackle*...!"'
16900: '@rRosa was already nowhere to be seen.@k Had she gone to call a doctor, or had she escaped from a scene which had become frightening?'
16901: '@r...That no longer matters.@k@rThat soulless shell is no longer worth anything.'
16902: '@rAll that aside, ......how frail I am now.@k@rEven this glorious midday sun is agony to me now.'
16903: '@rI destroyed my human form.@k@rThen I changed it to several gold butterflies.'
16904: '@r......Yes, with my magic power as frail as it is now, this form is easier.'
16905: '@rAnd to escape even a little from the light of the sun, I rode the wind and lightly passed over the cliff.'
16906: '@rIt will probably be somewhat cooler in the forest.'
16907: '@rAnyway, I''ll take some time to recuperate, and regain my original power.'
16908: '@r......As I think of how I will pay Kinzo back for all he has done.'
16909: '@rDancing alone through the air, I looked down at the shore one more time.'
16910: '@rOn the rocky shore lay the figure I had once possessed, ......and that I would eventually regain.'
16911: '@rTo regain the form of that physical body I have thrown away,@w500. ...it will probably take more than one hundred, two hundred days.'
16912: '@r...It might require one thousand days, or maybe even more.'
16913: '@rHowever, I am the Endless Witch.@k@rThe Golden Witch who has lived for one thousand years.@k@rWaiting any countable number of days is no problem at all.'
16914: '@r*cackle*cackle*. Oh, Kinzo.@k@rYou may regret that you are not here now.@k@rNo longer will you be able to capture me.@k@r...*cackle*cackle*!'
16915: 'Battler@r@v10/30100552.".........And then, you changed into gold butterflies, hid in the forest, and waited for your magic power to be restored? Is that what you''re saying?"'
16916: 'BEATRICE@r@v27/30700678."That is correct.@k@v27/30700679. I take this form to sneer at you, but normally, it is easier magically for me to keep my form as gold butterflies."'
16917: 'Battler@r@v10/30100553."Don''t stress yourself and stay in an easy form.@k@v10/30100554. I wouldn''t mind not hearing your irritating laugh."'
16918: 'BEATRICE@r@v27/30700680."*cackle*cackle*.@k@v27/30700681. When I turned into butterflies and slipped into the forest, it was already no longer possible for Kinzo to find me.@k@|@y@v27/30700682. ......However, Kinzo was not about to stand there doing nothing.@k@v27/30700683. Still, he would be unable to immediately prepare a way to catch me."'
16919: 'BEATRICE@r@v27/30700684."Therefore, he first moved immediately to prevent me from leaving this island,@k@v27/30700685. and to keep me from regaining my power."'
16920: 'BEATRICE@r@v27/30700686.".........My, my. All I can say is that Kinzo''s tenacity does defy the imagination.@k@v27/30700687. ...It is pretty tough to be loved by someone like that.@k@v27/30700688. *cackle*cackle*!"'
16921: 'Battler@r@v10/30100555."A way to keep you from leaving after you became butterflies?@k @v10/30100556.What, did he put a bug net around the entire forest?"'
16922: 'BEATRICE@r@v27/30700689."Indeed.@k@v27/30700690. He did the magical equivalent.@k@v27/30700691. .........Did you know?@k @v27/30700692.On the sea in front of the harbor floats a reef, on which sits a small shrine of Eastern magic."'
16923: 'Battler@r@v10/30100557."......Ah, that.@k@v10/30100558. It was gone this year, though.@k@v10/30100559. It was a small shrine built long ago by a mountaineering ascetic, right?"'
16924: 'Ronove@r@v31/33100240."This island was originally an island of distortions.@k@v31/33100241. Magical beings and other beings of similar ilk were attracted to it.@k@v31/33100242. ......Milady herself is one of them, I imagine.@k@|@y@v31/33100243. How about some more tea?"'
16925: 'BEATRICE@r@v27/30700693."*cackle*cackle*, please.@k@|@y@v27/30700694. ......They did harm to humans, and probably left several eerie legends behind them."'
16926: 'BEATRICE@r@v27/30700695."That small shrine was built in ancient times by an Eastern mage who heard of them.@k@v27/30700696. A long time passed, and that power was lost.@k@v27/30700697. By repairing it, Kinzo restored this island''s barrier, and once again tied me to this island."'
16927: 'Battler@r@v10/30100560."......Can Eastern magic work on a Western witch like you?"'
16928: 'BEATRICE@r@v27/30700698."Normally the affinity is poor.@k@v27/30700699. However, for the purpose of sealing me there, in a way, it might have been suitable."'
16929: 'BEATRICE@r@v27/30700700."If it was Western magic, I would have some knowledge.@k@v27/30700701. For any barrier, there would have been some measures I could have taken.@k@v27/30700702. But Eastern magic is outside my area of expertise.@k@v27/30700703. It was as if I had been given chopsticks instead of a spoon for some soup I was trying to eat."'
16930: 'Ronove@r@v31/33100244."In a space strongly controlled by Eastern magic, Western magic loses much of its power.@k@v31/33100245. It would likely have taken her a thousand days to regain her power even under normal circumstances,@k@v31/33100246. and now it would take her much, much longer."'
16931: 'Battler@r@v10/30100561."......So you''re trying to say that it took you twenty years to regain your power, and now you are revived, like this?"'
16932: 'BEATRICE@r@v27/30700704."Those were horribly long years...@k@v27/30700705. I spent many days in the form of gold butterflies, found Kinzo''s mansion, and watched over him every day.@k@v27/30700706. I lived through those days with no means to enjoy myself except to ponder how I would get back at him."'
16933: 'BEATRICE@r@v27/30700707."......What was fortunate for me was that during those twenty years,@k@v27/30700708. Kinzo tried to use every magic to find and capture me, and failed in them all."'
16934: 'BEATRICE@r@v27/30700709."A human cannot bring about miracles very many times.@k@v27/30700710. Even simply holding me captive for that long had been a miracle far above his place.@k@v27/30700711. It would be unthinkable for me to be captured like that multiple times."'
16935: 'Battler@r@v10/30100562.".........Grandfather said something in the previous game.@k@v10/30100563. It was something like, magic dwells in probabilistic miracles."'
16936: 'BEATRICE@r@v27/30700712."Mmhm.@k@v27/30700713. While Kinzo searched for a hidden art to capture me again, he ended up at that.@k@|@y@v27/30700714. ...............Then, he finally worked out the ritual involving the offering of thirteeen sacrifices to revive me again."'
16937: 'Battler@r@v10/30100564."Thirteen......sacrifices..."'
16938: 'Ronove@r@v31/33100247."That is the witch''s epitaph.@k@v31/33100248. It is a poem of sacrifices.@k@v31/33100249. ......Six people on the first twilight.@k@v31/33100250. Two people on the second twilight.@k@v31/33100251. And then five more people on the fourth through eighth twilights.@k@v31/33100252. A forbidden ritual, involving the offering of a total of thirteen people as sacrifices...@k@v31/33100253. Those sacrifices are chosen randomly, and the one holding the ritual, Kinzo himself, is not an exception."'
16939: 'Battler@r@v10/30100565."You''re out of your mind...@k@v10/30100566. Are you saying that all of the gruesome murders that occurred on this island were all part of a weird ritual?!!"'
16940: '@rI was vaguely thinking that this might be a possibility...'
16941: '@rBut I can''t just hear that this is the truth from a witch and a demon and say "Oh, really?" and accept it!'
16942: 'BEATRICE@r@v27/30700715."There are eighteen people on Rokkenjima.@k@v27/30700716. Thirteen are sacrificed; only five are left alive.@k@v27/30700717. Then I revive."'
16943: 'BEATRICE@r@v27/30700718."......In other words, the odds that Kinzo will be able to meet me again are probably around one third.@k@v27/30700719. He bet his own life on those odds,@k@v27/30700720. wishing for a reunion with me for the last bit of his remaining life."'
16944: 'Battler@r@v10/30100567.".........You''re saying he gathered our family for the sake of that fucked-up ritual?!@k @v10/30100568.Oh, yeah, real fucking funny!!@k @v10/30100569.Don''t say stuff like that, damn it!!"'
16945: 'BEATRICE@r@v27/30700721."It was according to the contract from the beginning.@k@v27/30700722. When Kinzo''s life ended,@k@v27/30700723. all of the gold I had lent him, and all of the assets that Kinzo had created, were to be received by me."'
16946: 'BEATRICE@r@v27/30700724."......Kinzo put me through a nightmareish ordeal,@k@v27/30700725. but thinking back on it now, it was an extraordinary period, even amid the past thousand years.@k@v27/30700726. After all, the natural enemy of a witch is boredom.@k@v27/30700727. To Kinzo, who offered me a chance to run away from that for several decades,@k@v27/30700728. yes, considering that among other things, I might have a slight debt to him."'
16947: 'BEATRICE@r@v27/30700729."I decided to go along with Kinzo''s game.@k@v27/30700730. And so, first off, Kinzo returns to me the Ushiromiya family Head''s Ring.@k@v27/30700731. It is the house revived by my gold, you see."'
16948: 'BEATRICE@r@v27/30700732.".........Then I choose thirteen people arbitrarily as sacrifices.@k@v27/30700733. And as that unfolds, you people are thrown into total confusion,@k@v27/30700734. and show me various aspects of the fabric of human relationships as you stand against me, which gives me great pleasure.@k@v27/30700735. I really do like this game of Kinzo''s!@k @v27/30700736.*cackle*cackle*."'
16949: 'Battler@r@v10/30100570."Aaaaaaaaaahh!!@|@y@k @v10/30100571.I definitely won''t believe in that kind of magic story!@k @v10/30100572.......Then who are you?!@k @v10/30100573.You fell off a cliff and died, dammit!@k @v10/30100574.Your soul slipped out, became butterflies, and went to the forest?@k @v10/30100575.That''s all a load of bullshit!!"'
16950: 'Battler@r@v10/30100576."But you are here!@k @v10/30100577.Who are you?!!@k @v10/30100578.Aren''t you the 19th person?!"'
16951: 'BEATRICE@r@v27/30700737."That is true, I most surely am the 19th person.@k@|@y@v27/30700738. *cackle*cackle*cackle*!@k @v27/30700739.But it''s no good, I''m afraid...?@k @v27/30700740.It''s no goddamn good at all!!"'
