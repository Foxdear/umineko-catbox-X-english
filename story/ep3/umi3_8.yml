17717: '@rThere was no way to notice the coming of morning without opening a window and looking at the cloudy sky, which had become a tiny bit lighter.'
17718: '@rIt wasn''t a refreshing morning.@k All that could be heard was the sound of the rain, which had kept falling since last night, and the howl of the wind...'
17719: 'Kyrie@r@v09/31300142."......It''s hard to imagine that it''s morning.@k@v09/31300143. This horrible weather reflects our hearts."'
17720: 'Rudolf@r@v08/31200181."Then I''d say it''s pretty gentle, considering.@k@v08/31200182. We should count ourselves lucky it''s rain that''s falling and not spears."'
17721: 'Hideyoshi@r@v06/31100173."Wahaha.@k@v06/31100174. Whether it''s rain or spears, bring it on, I say."'
17722: 'Hideyoshi@r@v06/31100175.".........Is it already six o''clock?@k@v06/31100176. Fuaaaaaa...@k@v06/31100177. Isn''t this enough?@k@v06/31100178_b. Can''t do much else until the mystery 19th person, BEATRICE, takes action."'
17723: 'Krauss@r@v02/30800169."That is correct.@k@v02/30800170. ......However, I believe we have thought of almost every trick they could use against us."'
17724: 'Eva@r@v05/31000288."Yes.@k@v05/31000289. As long as a traitor doesn''t appear among us siblings, we should be able to deal with most situations."'
17725: 'Rosa@r@v12/31400178."......Haven''t we talked about this enough?@k @v12/31400179.We ended up staying up all night.@k@v12/31400180. ...I''m tired."'
17726: 'Natsuhi@r@v03/30900060."You''re right.@k@v03/30900061. How about taking a little rest after eating breakfast?"'
17727: 'Krauss@r@v02/30800171."...A good plan.@k@v02/30800172. Staying up all night is trying at my age."'
17728: '@rAs they all stretched, they enjoyed this unrefreshing morning as best they could.'
17729: 'Rudolf@r@v08/31200183."Let''s go wash our faces or something.@k@v08/31200184. I probably look horrible."'
17730: 'Kyrie@r@v09/31300144."..................?@k @v09/31300145.What is that horrible stench?"'
17731: '@rAs soon as they exited into the corridor, Kyrie made an openly disgusted expression.'
17732: 'Natsuhi@r@v03/30900062."...What''s the matter?"'
17733: 'Kyrie@r@v09/31300146."Hey, don''t you smell something awful...?"'
17734: 'Hideyoshi@r@v06/31100179.".........Hm.@k@v06/31100180. ...What is this stench?@k@v06/31100181. It''s unbearable..."'
17735: '@rBecause of that fuss, everyone stuck their heads out into the corridor.@k@r...It was a faint stench, but after the complaints, they clearly noticed it.'
17736: '@rEach of them went into the corridor, relying on their own sense of smell to tell them where this strange odor was coming from...'
17737: 'Natsuhi@r@v03/30900063."What in the world could it be?@k@v03/30900064. Let us have Genji deal with it.@k@v03/30900065. I believe he should already have arrived in the servant room to begin the morning preparations."'
17738: 'Krauss@r@v02/30800173."Mmhm, please.@k@v02/30800174. It is difficult to imagine that Gohda, of all people,@k@v02/30800175. could be making a breakfast that would cause this kind of stench..."'
17739: '@rRudolf''s group searched for the source of the smell, and determined that it was coming from underground,@k from the boiler room.'
17740: '@rBut the door was locked, and they couldn''t check inside.'
17741: '@rMeanwhile, Natsuhi''s group were on their way to search for someone in the servant room, when they noticed something strange about the parlor.'
17742: 'Natsuhi@r@v03/30900066."......What is this...?!"'
17743: 'Rosa@r@v12/31400181."Wh-what a horrible prank...@k@v12/31400182. Who would do something like..."'
17744: '@rDrawn on the door to the parlor, in a paint that reminded one of blood, there was a strange...@kmagic-circle-like thing.'
17745: 'Eva@r@v05/31000290."No one has come to the kitchen yet.@k@|@y@v05/31000291. ......Wh-what is...that?"'
17746: '@rEva''s group, who had thought the smell had been coming from the kitchen,@k had returned, having observed that no one was there and that preparations for breakfast had not yet begun.'
17747: '@r......And they noticed the unusual state of the parlor.'
17748: 'Rudolf@r@v08/31200185."It''s no good, the boiler room is locked.@k@v08/31200186. Wouldn''t it be bad if something''s broken down in the boiler room?@k @v08/31200187.Was there a servant anywhere around?"'
17749: 'Kyrie@r@v09/31300147.".........!@k @v09/31300148.Is that vulgar graffiti here too?@k @v09/31300149.There was also one on the door to the boiler room."'
17750: 'Hideyoshi@r@v06/31100182."What''s that?!@k @v06/31100183.This creepy graffiti isn''t just here, it''s in other places as well?!@k @|@y@v06/31100184.Haha, you don''t think that this is the witch of the forest BEATRICE''s declaration of war, right?"'
17751: '@rHideyoshi tried to make fun of it, but staring at this creepy magic circle while listening to the wind and rain really made it seem like it was a message from a witch.'
17752: '@r...The dripping bright-red paint made one think of blood, and it made things even more eerie.'
17753: '@rHideyoshi tried to open the door, but it was locked.'
17754: '@r...As a general rule, the parlor was never locked.@k@rSomeone had gone out of their way to lock it.'
17755: 'Rosa@r@v12/31400183."......What does this mean...?@k @v12/31400184.Did someone secretly leave this graffiti while we were talking in the dining hall?@k @v12/31400185.On the doors to the parlor and the boiler room?"'
17756: 'Eva@r@v05/31000292."...I''m sure the servants are behind this.@k@v05/31000293. We were together the whole time.@k@v05/31000294. We all have alibis.@k@v05/31000295. ......They probably did this prank on some strange orders from Father."'
17757: 'Rudolf@r@v08/31200188.".........Considering the incident yesterday with Maria-chan''s letter,@k@v08/31200189. it''s more than possible to suspect that the servants are acting on Dad''s orders and planning something.@k@|@y@v08/31200190. ......Where the hell is everyone, anyway?@k @v08/31200191.They can''t be playing hide and seek.@k@v08/31200192. Let''s look for them."'
17758: 'Rosa@r@v12/31400186."B-...before that, I''m worried about the children.@k@v12/31400187. They''re alright, aren''t they?@k @v12/31400188.I''ll go and check, and while I''m there, I''ll see if there aren''t any servants there."'
17759: 'Rudolf@r@v08/31200193."Then let''s split up.@k@v08/31200194. While you go to the guesthouse to see how the brats are doing, we''ll check around inside the mansion.@k@|@y@v08/31200195. .........I don''t want to think about it,@k@v08/31200196. but maybe these creepy magic circles aren''t just where we''ve found them."'
17760: 'Krauss@r@v02/30800176."......We might have become involved in a bizarre game of Father''s.@k@v02/30800177. ...I will go to him and ask about the situation.@k@|@y@v02/30800178. ......Though I doubt he''ll be good-natured enough to listen to me."'
17761: '@rThe adults split up.'
17762: '@rAs a result, they confirmed that the four children were safe in the so-called cousins'' room, on the second floor of the guesthouse.'
17763: '@rIt appeared that they had stayed up late last night playing.@k@rAll of them were snoring loudly, so Rosa decided not to wake them.'
17764: '@rFurthermore, Nanjo, who had returned early the previous night to rest, was also alright.@k@rIt seemed he believed in the phrase "early to bed, early to rise", and had awoken refreshed.'
17765: '@rDuring that time, Kyrie and Hideyoshi searched for the servants.@k@rBut they didn''t find them.'
17766: '@r...The servant room in the guesthouse was also empty.'
17767: 'Rosa@r@v12/31400189."......The children are alright.@k@v12/31400190. All of them stayed up too late last night."'
17768: 'Hideyoshi@r@v06/31100185."The servant room is empty.@k@v06/31100186. ...I looked at the shift chart, and the mornin'' shift was supposed to begin at six.@k@v06/31100187. They should have started workin'' by now..."'
17769: 'Kyrie@r@v09/31300150."The nap room was also empty.@k@v09/31300151. There were signs that the futons had been used, but they weren''t warm."'
17770: 'Hideyoshi@r@v06/31100188."Y''know what, I think Krauss nii-san and the others might''ve hit on it, don''t you?@k@v06/31100189. ......This is probably a game planned on Father''s orders.@k@v06/31100190. I''d bet my bottom dollar, he left those creepy scribbles and hid himself somewhere,@k@v06/31100191. tryin'' to make us do somethin''."'
17771: 'Kyrie@r@v09/31300152."......Are you saying that he''s trying to see who is fit to inherit his wealth and the family headship?@k @v09/31300153....Isn''t that a bit..."'
17772: 'Rosa@r@v12/31400191."No...@k@v12/31400192. ...It might not be strange if Father was behind something like that."'
17773: 'Hideyoshi@r@v06/31100192."After all, Father loves big tricks.@k@v06/31100193. ......He might have had this plan brewing ever since that epitaph was hung in the hall."'
17774: 'Kyrie@r@v09/31300154."...In that case, I wonder whether he will make an announcement of the game or an explanation of it.@k@v09/31300155. ......It also seems possible that another envelope with the crest might appear, like the one handed to Maria-chan."'
17775: 'Rosa@r@v12/31400193."............You''re right.@k@v12/31400194. Maybe Nii-san and the rest have found that in the mansion."'
17776: 'Hideyoshi@r@v06/31100194."Doctor Nanjo.@k@v06/31100195. Have you heard anythin''?"'
17777: 'Nanjo@r@v19/31900004."......M-my apologies, I do not have any idea what is going on.@k@|@y@v19/31900005. And yet, ......yes, I see,@k@v19/31900006. I could easily imagine that Kinzo-san is planning something big."'
17778: 'Hideyoshi@r@v06/31100196."...Why don''t we go back to the mansion for now?@k@v06/31100197. Maybe they found somethin'' over there."'
17779: 'Nanjo@r@v19/31900007."If I will not be in the way, I will come too."'
17780: 'Rosa@r@v12/31400195."I, I''ll stay here.@k@v12/31400196. ...The children are sleeping upstairs.@k@v12/31400197. We don''t know what''s happening.@k@v12/31400198. We can''t leave them alone."'
17781: 'Kyrie@r@v09/31300156."......Yes, you''re right.@k@v09/31300157. I''ll stay with Rosa-san and watch over the place.@k@v09/31300158. Would you tell that to my husband?"'
17782: '@rRosa and Kyrie remained in the guesthouse.@k@rHideyoshi went with Nanjo, and returned again to the mansion.'
17783: '@rMeanwhile, in the mansion...'
17784: '@rUnbelievably, ...or maybe we should say that bad feelings have a tendency to be right...'
17785: '@rRudolf''s prediction was right on.'
17786: '@r...Because the same magic circle graffiti that had been drawn on the doors to the boiler room and the parlor had been found in multiple other places throughout the mansion.'
17787: 'Rudolf@r@v08/31200197."Aniki...!@k @v08/31200198.How''s Dad?"'
17788: 'Krauss@r@v02/30800179."No, no good.@k@v02/30800180. There was no response at all.@k@v02/30800181. I did try putting my ear against the door, but I couldn''t sense anyone."'
17789: 'Natsuhi@r@v03/30900067."...I cannot find the servants anywhere.@k@v03/30900068. ...Where in the world did they disappear off to..."'
17790: 'Eva@r@v05/31000296."This isn''t funny.@k@v05/31000297. Father and the servants are hiding, and there are strange magic circles all over the mansion.@k@v05/31000298. ......What in the world is happening...?!"'
17791: '@rThere weren''t only magic circles on the door to the boiler room and the door to the parlor.@k@rThere were also two on the second floor,@k and one on the third floor, for a total of five.'
17792: '@rThey were all the same magic circle, and all of the doors were locked, so they couldn''t check inside.'
17793: 'Rudolf@r@v08/31200199."...Anyway, let''s do something about the boiler room first.@k@v08/31200200. It would be bad if some kind of breakdown caused a fire or an explosion.@k@v08/31200201. ...So we need the key."'
17794: 'Natsuhi@r@v03/30900069."I believe there was a key box in the servant room."'
17795: '@rThey fished through the key box in the servant room.'
17796: '@rBecause each servant individually carried their own master key around, those weren''t kept here.'
17797: '@rHowever, all of the individual room keys should have been here.'
17798: 'Krauss@r@v02/30800182."............It''s so packed with keys."'
17799: 'Eva@r@v05/31000299."...It isn''t here.@k@v05/31000300. I''ve looked and looked, but I can''t find the key to the boiler room."'
17800: 'Rudolf@r@v08/31200202."Look, Aneki.@k@v08/31200203. ......Only the keys to the rooms with those magic circles drawn on them...@|@y@v08/31200204.are just neatly missing."'
17801: 'Natsuhi@r@v03/30900070."......It''s true.@k@v03/30900071. ...How troublesome......"'
17802: 'Eva@r@v05/31000301."It''s as though someone doesn''t want us to go in the rooms with the magic circles.@k@|@y@v05/31000302. ......No, they went to all the trouble of making them obvious using the magic circles, so perhaps they do want us to enter...?"'
17803: 'Rudolf@r@v08/31200205."I think it''s the latter.@k@v08/31200206. ...Breaking down the door is probably impossible, I mean, this isn''t a movie.@k@v08/31200207. Smashing a window might work."'
17804: '@rKrauss had a little trouble deciding whether this was a situation that called for smashing a window.'
17805: '@rAt that time, Hideyoshi and Nanjo returned.@k@rThere was nothing strange in the guesthouse, and the children were safe.@k@rThey told the others that Rosa and Kyrie had stayed to watch over the place.'
17806: 'Nanjo@r@v19/31900008."Good morning.@k@v19/31900009. ...I hear that something strange has happened."'
17807: 'Krauss@r@v02/30800183."Good morning, Doctor Nanjo.@k@v02/30800184. ...I apologize for waking you so early in the morning."'
17808: 'Hideyoshi@r@v06/31100198."What is it?@k@v06/31100199. Didn''t you find a letter or somethin''?@k @v06/31100200.I was sure you would have found somethin'' like that by now..."'
17809: 'Eva@r@v05/31000303."......You''re right.@k@v05/31000304. I also believe that this is a massive joke or game of Father''s...@k@|@y@v05/31000305. But if that was the case, there should be some letter telling us about that.@k@v05/31000306. Like the letter that was given to Maria-chan."'
17810: 'Rudolf@r@v08/31200208."What if the announcement of the game actually was Maria-chan''s letter?@k @v08/31200209.The details of the game - ''try to solve the riddle of the epitaph'' - have already been shown."'
17811: 'Krauss@r@v02/30800185."Then, what could the five magic circles we found in the mansion mean?@k@v02/30800186. ...And the missing servants."'
17812: 'Eva@r@v05/31000307."......Natsuhi nee-san.@k@v05/31000308. How many servants were there total today...?"'
17813: 'Natsuhi@r@v03/30900072."Huh?@k @|@y@v03/30900073..........Genji, Gohda,@v03/30900074. ......five of them, why?"'
17814: 'Rudolf@r@v08/31200210."......Five servants.@k@v08/31200211. And five magic circles.@k@v08/31200212. ......It may be a coincidence, but it worries me."'
17815: 'Eva@r@v05/31000309."...Nii-san.@k@v05/31000310. Let''s break a window.@k@v05/31000311. We should check and see what''s inside."'
17816: 'Krauss@r@v02/30800187."............We have no choice.@k@v02/30800188. Do it neatly."'
17817: '@rKrauss made his decision, and gave permission to smash a window.'
17818: '@rAnd they decided that the first room they would break into would be the parlor on the first floor, where the windows would be easiest to reach.'
17819: '@rThey had hoped to peek in through the window,@k but the curtains were drawn, so they couldn''t see inside.'
17820: '@rRudolf wandered around the garden, trying to find something that would be good for smashing the glass.'
17821: '@rEventually, he found a rock bigger than a fist, and came back.'
17822: 'Eva@r@v05/31000312."You don''t have to smash the whole thing.@k@v05/31000313. Just open it enough so that you can reach the lock."'
17823: 'Rudolf@r@v08/31200213."Don''t get your hopes up, alright?"'
17824: '@rRudolf raised the rock, and hit the glass with it several times.'
17825: '@rBefore long, he succeeded in skillfully opening a hole big enough that he could unlock it from the outside.'
17826: '@r...Covering his hand with a handkerchief, he stuck his hand through that hole, and cautiously unlocked it.'
17827: 'Rudolf@r@v08/31200214."We should probably cover it with duct tape later.@k@v08/31200215. The rain''ll get blown in."'
17828: '@rWhen he threw the window open, the wind and rain made the curtains dance around violently.@k He swiped the curtain to the side.'
17829: '@r...They could see the parlor they knew well.'
17830: '@rThey were a little relieved.@k ......Because they had thought that maybe, the room would be filled with more bizarre magic circles,@k or possibly the traces of some creepy ritual.'
17831: '@rIn any event, they didn''t want to hang around out in the rain,@k so the six of them - Krauss, Natsuhi, Eva, Hideyoshi, Rudolf, and Nanjo - entered the parlor as a group.'
17832: 'Nanjo@r@v19/31900010."......It seems...that nothing in particular is out of the ordinary..."'
17833: 'Krauss@r@v02/30800189.".........mmh - "'
17834: 'Natsuhi@r@v03/30900075."Wh-what has happened, Shannon...?!"'
17835: 'Eva@r@v05/31000314."Wait, wait, are you alright?!@k @v05/31000315.What happened to you?!"'
17836: 'Hideyoshi@r@v06/31100201."Blood, blood!!@k @v06/31100202.D-D-Doctor Nanjo, take a look at this!!"'
17837: 'Rudolf@r@v08/31200216."Hey, Shannon-chan!@k @v08/31200217.Are you okay?!@k @v08/31200218.Answer me!"'
17838: 'Nanjo@r@v19/31900011."Y-you mustn''t shake her...@k@v19/31900012. I will examine her condition now..."'
17839: '@rShe had been in the shadow of a sofa, so they hadn''t noticed her until they entered the room.'
17840: '@rShannon was lying on the floor, her chest stained bright-red with blood......'
17841: 'BEATRICE@r@v27/30701111."He~~y,@k@v27/30701112. Battleeer, where are yoooou?@k @|@y@v27/30701113.Look, look, Shannon''s corpse has turned up, see~~~?@k @v27/30701114.I won''t bully you anymore, so come out."'
17842: 'BEATRICE@r@v27/30701115."......Hmmmm?@k @v27/30701116.Oh, there you are.@k@v27/30701117. What are you doing, holding your head in a place like that?"'
17843: 'Battler@r@v10/30100657.".............................."'
17844: '@rBattler had his head pressed to the table, and was clutching it with his hands...@k His pitiful figure made it plainly clear that he didn''t want to see anything, didn''t want to hear anything...'
17845: '@rHad he heard BEATRICE''s sneering voice?'
17846: '@r...Could he not hear, or was he pretending that he couldn''t hear?@k In any event, it was clear that he had closed up his heart like a shell...'
17847: 'Ronove@r@v31/33100343."Pu ku ku ku...@k@v31/33100344. ......I wonder if you have tormented him too much, Milady.@k@v31/33100345. After showing him that much and demanding a counterargument,@k@v31/33100346. I can understand why he wants to mope around."'
17848: 'BEATRICE@r@v27/30701118."Hey, Battleerr.@k@v27/30701119. If you can''t argue back, resign, would you?@k @|@y@v27/30701120.It''s your turn.@k@v27/30701121. If you don''t make some move or pass,@k@v27/30701122. or else give up, we won''t get anywhere."'
17849: 'Battler@r@v10/30100658."..............................et."'
17850: 'BEATRICE@r@v27/30701123."......Huh?@k @v27/30701124.What''s that?@k @v27/30701125.I can''t hear you?"'
17851: 'Battler@r@v10/30100659."I said BE QUIET!!@|@y@k @v10/30100660.Aaaah, shut up shut uuuuuuuuuup!!@k @v10/30100661.Witches? Magic?!@k @v10/30100662.Can''t you just do what you want, I don''t believe, I don''t believe any of it,@k@v10/30100663. damn it damn it damn it damn it damn it!!"'
17852: 'Battler@r@v10/30100664."Don''t talk to me, don''t show me anything, go away, go away, go the hell away!!@k @v10/30100665.Get your goddamned annoying face AWAY FROM MEEEEEEEEEEEEEEEEEE!!!"@|@y'
17853: 'BEATRICE@r@v27/30701126."........................!!!"'
17854: '@rBEATRICE instinctively winced at Battler''s sudden rage.'
17855: 'BEATRICE@r@v27/30701127."......E-even if you say that, um...@k @v27/30701128.If you don''t finish your turn, then my turn won''t come.@k@v27/30701129. I feel like saying, don''t make me too bored - "'
17856: 'Battler@r@v10/30100666."You think I give a crap, be quiet, SHUT UP!!@|@y@k @v10/30100667.I don''t give a damn about your game,@k@v10/30100668. I can''t take this bullshiiiiit!!@k @v10/30100669.If your turn won''t come until mine is finished, then you can just wait for all stinking eternity, can''t you!!"'
17857: 'Battler@r@v10/30100670."Aaaah, I don''t care I don''t care I don''t get it!!@k @v10/30100671.I won''t accept witches or magic, I won''t accept something that fucked up!!@k @v10/30100672.Uuooooooooooohhh, I said DON''T TALK TO MEEEEEEEEEEEEEEEEEEEE!!!"@|@y'
17858: '@r......I don''t know what''s what anymore.@k@rAfter being shown something that screwed up, how could I continue to resist...'
17859: '@rI wandered aimlessly through the rose garden.'
17860: '@r......It was raining and windy, but that didn''t mean my body got wet.@k ...There was just a feeling of isolation as I wandered amidst the wind and rain without an umbrella.'
17861: 'Battler@r@v10/30100673."..................Maybe I...@k@v10/30100674.lost to her game a long time ago."'
17862: '@r...Actually, I wonder whether we hadn''t reached a clear resolution in the previous game.'
17863: '@rAfter all, I had submitted to her for a time.@k@rSo the world had been tinted with witches and magic.'
17864: '@r......Right now, Rokkenjima is a different world, where witches stride around openly and fire off strange magic.'
17865: '@r...It isn''t a matter of accepting it or denying it.'
17866: '@rMaybe I had mistakenly assumed that I was playing a game on an even footing with Beato.'
17867: '@rI had already been defeated in the last game, ...and this may just be the signing ceremony of my surrender.'
17868: '@rJust now, a mighty battle had unfolded in this rose garden.@k@rI had seen it with my own eyes.'
17869: '@rI kicked the ground.@k ......Obviously, the ground was hard.@k@rAnd a puddle splashed.'
17870: '@rSeveral towers had split this ground, sprouting like high-rise buildings.'
17871: '@r......The more I kicked this ground,@w500. .........the more it felt like that really couldn''t be possible.'
17872: '@rBut, because of that, I couldn''t explain it with anything other than magic anymore......'
17873: 'Battler@r@v10/30100675."......I get the locked rooms with the key shut up inside,@k@v10/30100676. they''re probably just an extension of what you always see in detective novels.@k@|@y@v10/30100677. ......But, ......that stuff, though...@k@v10/30100678. All that big flashy stuff......@k@v10/30100679. Damn iiiiit........."'
17874: '@r@v30/33200147."...............It seems that my disciple has caused you much trouble."'
17875: 'Battler@r@v10/30100680."...Huh?@k @v10/30100681..........It''s you..."'
17876: '@rI was suddenly spoken to, so I turned around,@k ...and in the rose garden arbor,@w500. ......was the Predecessor BEATRICE, who BEATRICE had supposedly defeated a short while ago.'
17877: 'Battler@r@v10/30100682.".........I was sure you''d died.@k@v10/30100683. So, you were alive."'
17878: '@r@v30/33200148."No, I died.@k@v30/33200149. ...Now, I am nothing more than a captured chess piece loitering outside the chessboard."'
17879: 'Battler@r@v10/30100684."You''re Beato''s master, right?@k@v10/30100685. So, in other words, you''re a witch too."'
17880: '@r@v30/33200150."......Yes, that is correct."'
17881: 'Battler@r@v10/30100686."Tch.@k@v10/30100687. So, in other words,@k@v10/30100688. ......that means witches really do exist?@k @v10/30100689.And I''m not the one who can defeat her.@k@v10/30100690. That''d be you, since you can use awesome magic, wouldn''t it?@k@v10/30100691. ...I''m just useless now.@k@v10/30100692. There''s nothing I can do anymore..."'
17882: '@r@v30/33200151."............Oh, my.@k@v30/33200152. Have you submitted completely?"'
17883: 'Battler@r@v10/30100693."What do you mean, submit?!@k @v10/30100694.How the crap should I explain that?!@k @v10/30100695.Towers sprouting and falling!!@k @v10/30100696.Huge giants holding shields and throwing spears!"'
17884: 'Battler@r@v10/30100697."Aaah, just remembering it makes me feel like I''m going insane, reasoning isn''t worth a damn anymore, is it?!!@|@y@k @v10/30100698.We''ve left the level of tricks and explanations with human culprits!!@k @v10/30100699.Aaaaaaaaaaahh, shit shit shit shit!!"'
17885: '@r@v30/33200153."Calm yourself.@k@v30/33200154. ......I am nothing more than a piece on that child''s game board.@k@v30/33200155. After being removed from that board, I am no longer a being who can do anything."'
17886: '@r@v30/33200156."But you are that child''s opponent.@k@v30/33200157. As long as you do not give up by yourself, you will always have the power to strike back at that child."'
17887: 'Battler@r@v10/30100700."Shut up!@k @v10/30100701.Weren''t you also reciting strange spells and summoning towers and spears?!!"'
17888: 'Battler@r@v10/30100702."What do you mean, strike back?!@k @v10/30100703.Are you saying you''ll teach me magic too, telling me to fight her in one of those massive magic battles?!!"'
17889: '@r@v30/33200158."......If you wish,@k@v30/33200159. I could teach you a bit about magic."'
17890: 'Battler@r@v10/30100704."Oh, just what I wanted!@k @v10/30100705.Please, give me some awesome magic to smash her chest in one blow...!!@k @v10/30100706.Hah, don''t screw with me!"'
17891: '@r@v30/33200160."I hear that in Japanese magic, there is a ceremony to pray for rain.@k@v30/33200161. Do you know of it?"'
17892: 'Battler@r@v10/30100707."Rain ceremony?@k @v10/30100708.That thing where you throw stuff into the fire and offer a dance?@k @v10/30100709.......That''s not magic.@k@v10/30100710. The fire causes a thermal, and as a result, rain clouds gather.@k@v10/30100711. I''m pretty sure that''s an accepted scientific phenomenon."'
17893: '@r@v30/33200162."Oh?@k@v30/33200163. ...I had believed that it was a form of eastern magic,@k@v30/33200164. but it isn''t magic?@k@v30/33200165. I had believed that people offered sacred fire to the heavens, as well as a dance of respect,@k@v30/33200166. so that your entreaty for rain would reach the hearts of the gods."'
17894: 'Battler@r@v10/30100712."Maybe people did that long ago.@k@v10/30100713. But most occult things like that have a scientific explanation."'
17895: '@r@v30/33200167."Why do things burn?@k @v30/33200168.Isn''t that because phlogiston is contained in the material?"'
17896: 'Battler@r@v10/30100714."......No, things burn because of an oxidation reaction.@k@v10/30100715. Lavoisier abolished the phlogiston theory."'
17897: '@r@v30/33200169."Why does heat transfer through objects?@k @v30/33200170.Isn''t that because caloric is contained in the material?"'
17898: 'Battler@r@v10/30100716."......I''m pretty sure that was abolished by Joule.@k@v10/30100717. Heat is energy, not a substance."'
17899: '@r@v30/33200171."You have studied well.@k@v30/33200172. Your knowledge is correct."'
17900: 'Battler@r@v10/30100718."...It''s just some random facts."'
17901: '@r@v30/33200173."Phlogiston, caloric, and eventually ether and God''s love.@k@v30/33200174. ......All are powerless before a scientific explanation.@k@|@y@v30/33200175. In the past, I was told that an apple falls from a tree...@k@v30/33200176.thanks to God''s love, so that humans would be given food."'
17902: 'Battler@r@v10/30100719."Even gravity was explained by God''s love?@k @v10/30100720....Well, that''s probably a leftover from a period when religion rather than science was used to explain everything."'
17903: '@r@v30/33200177."That is correct.@k@v30/33200178. In the past, humans called the limits of their knowledge...@v30/33200179....no, ignorance itself, "magic".@k@v30/33200180. ...Just like the rain ceremony we were just talking about."'
17904: '@r@v30/33200181."Did the people of ancient times...@k@v30/33200182.understand the science of fire giving rise to heat to cause a thermal which calls forth clouds?@k @v30/33200183.Even without understanding, they at least knew of the result."'
17905: 'Battler@r@v10/30100721."......That probably happened a lot.@k@v10/30100722. The wisdom of ancestors.@k@v10/30100723. Even without understanding the reason, through long experience, they knew that they would obtain that result.@k@v10/30100724. ...Phenomena whose principles they didn''t understand were probably the same as magic to them."'
17906: '@rJust like this person had just said, ancient people who didn''t understand the principles had probably believed that,@k through the rain ceremony, their wish had reached the heavens and made the rain fall.'
17907: '@rTo them, that was certainly magic.@k@rAs long as they didn''t understand thermals...'
17908: '@r@v30/33200184."If you press a light switch, the light turns on.@k@v30/33200185. ......Children do not know the scientific principles behind why the lightbulb lights up;@k@v30/33200186. they press the switch knowing only the result.@k@v30/33200187. If they can obtain a result without knowing the principles, isn''t that "magic" to them?"'
17909: 'Battler@r@v10/30100725."...............That''s pretty interesting.@k@v10/30100726. ...Well, logically, that''s true.@k@v10/30100727. ...For example, I don''t have a clue why the Braun tubes in a TV show a picture."'
17910: 'Battler@r@v10/30100728."However, I think it''s completely normal for things to be displayed on the TV.@k@v10/30100729. Even if I don''t understand the principles behind Braun tubes, I at least know that "if I push the switch I can watch TV"."'
17911: 'Battler@r@v10/30100730."...It''s exactly the same as having a rain ceremony without understanding thermals.@k@v10/30100731. ......In other words, if I don''t know the principles, even TV is the same as "magic",@k@v10/30100732. no, could you say it is magic?"'
17912: '@r@v30/33200188."Do you know how Braun tubes are constructed?@k @v30/33200189.Have you ever taken one apart and looked inside?"'
17913: 'Battler@r@v10/30100733."......Nope.@k@v10/30100734. I think I read about it in a book or something once, but it was complicated and I didn''t have a clue.@k@v10/30100735. I think that when electrons hit a fluorescent material, it creates luminescence or something like that..."'
17914: '@r@v30/33200190_b."That book was a fake.@k@v30/33200191. Actually, there are small people called gremlins shut up inside the Braun tubes,@k@v30/33200192. and they do their job with magic."'
17915: 'Battler@r@v10/30100736."Huh?!@k @v10/30100737.That''s stupid, there''s no way...!"'
17916: '@r@v30/33200193."How can you deny it if you have never looked inside a Braun tube?"'
17917: 'Battler@r@v10/30100738."......I''ve never looked inside, but I can state with confidence that small people like that definitely don''t exist!"'
17918: '@r@v30/33200194."Since there is no Braun tube here, that is impossible to prove."'
17919: 'Battler@r@v10/30100739."Y-yeah, it is impossible to prove right this very moment,@k@v10/30100740. ...but later I can take apart a TV somewhere and show you, and instantly win the argument!"'
17920: '@r@v30/33200195."So, in other words,@k@v30/33200196. my "magic theory", that gremlins are shut up inside the Braun tubes and display the picture with magic,@k@v30/33200197. is impossible to disprove until we can verify the contents of a Braun tube, correct?"'
17921: 'Battler@r@v10/30100741.".........Hmm,@v10/30100742. .........what the hell, one of those?@k @v10/30100743.Are you trying to say it''s a "Devil''s Proof"?@k @v10/30100744.That''s your favorite trick, you witches."'
17922: '@r@v30/33200198."The "Devil''s Proof" is sophistry exploiting the impossibility of proving a negative fact.@k@v30/33200199. However, it is different from what I am talking about with Braun tubes.@k@v30/33200200. That could be resolved just by taking apart a single television."'
17923: 'Battler@r@v10/30100745."......You''re right.@k@v10/30100746. It really isn''t a "Devil''s Proof"."'
17924: '@r@v30/33200201."The scientific theory you propose, and the magical theory I propose.@k@v30/33200202. ...One of those is the truth.@k@v30/33200203. And which one it is can be ascertained as soon as you look inside the Braun tube.@k@v30/33200204. However, until the instant that happens, we cannot deny each other''s theories."'
17925: '@r@v30/33200205."So, despite the fact that there is only one truth,@k@v30/33200206. until the moment you look into the Braun tube, two conflicting truths can exist at the same time.@k@v30/33200207. ......A bizarre space where two truths, of which only one is permitted to exist, may exist simultaneously."'
17926: '@rIs the cat in the box alive or dead?@k@rIf you open the box, you will know the answer.@k You will know the truth.'
17927: '@rHowever, until you open the box, you can claim that the cat is alive, and you can also claim it is dead.'
17928: '@rEach of the two parties makes a claim that according to them is the "correct" truth,@k and even though the two sides are conflicting, neither can win the argument as long as the box remains unopened.'
17929: '@rIn other words, two truths can exist at the same time.'
17930: '@rEven though there can only be one cat in the box,@k it is packed with a living cat and a dead cat, in a strange parallel world.'
17931: '@rThat is what Rokkenjima is now.'
17932: '@r......This island is now a different world where a science theory and a magic theory exist at the same time.'
17933: '@r...To a resident of the world of science such as yourself,@k at a glance, it may feel as though this island has been sucked into a world of magic.'
17934: '@rWhile that may be correct, it is not accurate.'
17935: '@rStrictly speaking, it has moved from the world of science, to the midway point between that world and the world of magic.'
17936: '@rSo at a glance, it appears to you as though the world is tilted towards the magic side.'
17937: '@r......But actually, this island is now in a perfectly impartial position with relation to the two opposing worlds.'
17938: 'Battler@r@v10/30100747."......I don''t really get it...@k@v10/30100748. Midway between reality and magic?@k @v10/30100749.A perfectly impartial world?@k @|@y@v10/30100750.How''s that?@k@v10/30100751. Hasn''t everything been going really bad for me the whole time...?!"'
17939: '@r@v30/33200208."Then perhaps you could think of it this way.@k@v30/33200209. This is a trial.@k@v30/33200210. Think of it as a court where you and BEATRICE are laying out opposing claims.@k@v30/33200211. We could describe it as a Braun tube trial."'
17940: '@r@v30/33200212."That child claims that there are tiny people inside the Braun tubes.@k@v30/33200213. And she explains about the lives of the tiny people, what they look like,@k@v30/33200214. what type of magical power they have, on and on.@k@v30/33200215. ......And you?"'
17941: 'Battler@r@v10/30100752."......Well, I study in a library, and argue back by explaining how Braun tubes are constructed, I guess."'
17942: '@r@v30/33200216."At that moment, both your claim and that child''s claim exist in the court at the same time.@k@v30/33200217. ......If you lend an ear to that child''s claim,@k@v30/33200218. you may hear it as though it were the truth. See it as though it were the truth.@k@|@y@v30/33200219. That is precisely what you were shown."'
17943: 'Battler@r@v10/30100753."..........................."'
17944: '@r@v30/33200220."At this moment, on Rokkenjima, witches and magic certainly might exist as truth.@k@v30/33200221. ...However, that world is an uncertain wavefunction, existing only until the moment that the cat''s box is opened.@k@v30/33200222. All states can be justified simultaneously.@k@v30/33200223. However, there is one truth."'
17945: '@r@v30/33200224."That is collapsed by observation,@k@v30/33200225. and countless truths are weeded out to become one truth.@k@v30/33200226. It is like when, in court,@k@v30/33200227. the judge makes his judgment.@k@v30/33200228. The two truths from the prosecutor''s and the defense''s claims...@k@v30/33200229.collapse by the judgment, and become one."'
17946: 'Battler@r@v10/30100754.".........So to say it in your words,@k@v10/30100755. ......this island right now is the world right before looking into the Braun tube, right...?@k @v10/30100756.Therefore, neither the science theory nor the magic theory can be denied.@k@v10/30100757. ...And since they cannot be denied - "'
17947: '@r@v30/33200230."Both can exist as truth.@k@v30/33200231. That is why both witches and magic can exist.@k@v30/33200232. ...However, at the same time, your opinion which denies them can also exist simultaneously as truth."'
17948: '@r@v30/33200233.".........It is a world where two conflicting things can exist at the same time.@k@v30/33200234. And, it is a world where the conflicting truths cannot disprove each other.@k@v30/33200235. .........Is it starting to make sense to you...?"'
17949: 'Battler@r@v10/30100758."..................In other words...@k@v10/30100759....no matter how much awesome magic Beato shows me...@k@v10/30100760....that is only a claim from the "magic theory", and it doesn''t disprove mine."'
17950: 'Battler@r@v10/30100761."So, it''s like, "no matter what kind of magic Beato shows me,@k@v10/30100762. in this world, that cannot become proof that magic exists"."'
17951: '@r@v30/33200236."That''s right.@k@v30/33200237. That child will probably even try to explain an apple falling from a tree with magic.@k@v30/33200238. That child might shake her staff and pluck the apple with magic,@k@v30/33200239. and claim that she dropped it to the earth."'
17952: '@r@v30/33200240."However, that would be nothing more than another one of her claims.@k@v30/33200241. None of her claims can block your opportunity to make a claim.@k@v30/33200242. ......In that sense, this world is quite "impartial" to both sides."'
17953: 'Battler@r@v10/30100763.".........I...get it...@k@v10/30100764. ......Still.@k@v10/30100765. By that argument, even if I show a sound argument with my "science theory",@k@v10/30100766. all it will do is collide head-on with her "magic theory", and I can''t win against her either.@k@v10/30100767. Furthermore, there won''t be any final judgment unless we peek into the Braun tube."'
17954: 'Battler@r@v10/30100768.".........Where is the Braun tube in this world?@k@v10/30100769. ...It means there''s no reason for us to argue.@k@v10/30100770. ......Wouldn''t it be alright if we just got along and peeked into the Braun tube?"'
17955: 'Battler@r@v10/30100771."If there really is a tiny person in there, I suffer total defeat.@k@v10/30100772. Otherwise, I win.@k@v10/30100773. ......Why do we have to hold this debate without looking into the Braun tube?"'
17956: '@r@v30/33200243."That itself is the "game" which that child has challenged you to.@k@v30/33200244. Perhaps, instead of a court, I should use chess as an example.@k@v30/33200245. Victory and loss is not determined by a judge.@k@v30/33200246. You who are fighting will decide it yourselves."'
17957: 'Battler@r@v10/30100774."......Can you win an argument with an opponent in a screwed-up world where multiple truths can exist at the same time?"'
17958: '@r@v30/33200247."But do you not realize, in point of fact, you were beaten in an argument, and are sitting here right now submitting...?"'
17959: 'Battler@r@v10/30100775."...............Heh.@k@v10/30100776. ...Heheheh."'
17960: '@r@v30/33200248."That is all the advice I can give you now.@k@v30/33200249. If you wish, I can occasionally give you advice."'
17961: 'Battler@r@v10/30100777."......Sure.@k@v10/30100778. Thanks, that really helps.@k@v10/30100779. ......I''ll avenge you."'
17962: '@r@v30/33200250."Hoh-hoh-ho, thank you.@k@v30/33200251. I am looking forward to it."'
17963: 'Battler@r@v10/30100780."What''s your name?"'
17964: '@r@v30/33200252."...BEATRICE used to be my name, but now that I have surrendered it, I do not have a name."'
17965: '@r@v30/33200253.".........So, I shall take a temporary name.@k@v30/33200254. ......VIRGILIUS.@k@v30/33200255. ...No,@v30/33200256.@|@y what about VIRGILIA?"'
17966: 'Battler@r@v10/30100781."VIRGILIA.@k@v10/30100782. Valkyria?@k @v10/30100783.Wasn''t that the name of a legendary goddess?"'
17967: 'VIRGILIA@r@v30/33200257."No.@k@v30/33200258. It means the one who is a guide to BEATRICE.@k@v30/33200259. ......I will guide you to that child who waits at the summit of Mount Purgatory.@k@v30/33200260. It should be a fitting name for that kind of guide."'
17968: 'Battler@r@v10/30100784."To think that I''d accept help from a witch when I''m trying to deny witches.@k@v10/30100785. ......I see.@k@|@y@v10/30100786. If this is a contradictory world where different claims can exist at the same time, that also works.@k@v10/30100787. ...Ihihi, it''s almost funny."'
17969: 'VIRGILIA@r@v30/33200261."I am borrowing that child''s words, but you truly are like a phoenix.@k@v30/33200262. ......Your will to fight has already been revived."'
17970: 'VIRGILIA@r@v30/33200263."...Come, if your heart is prepared, return to that child,@k@v30/33200264. ......return to the chessboard that child is sitting at.@k@v30/33200265. ......I look forward to seeing how far you can fight my disciple."'
17971: 'Battler@r@v10/30100788."Yeah, you just watch.@k@v10/30100789. ............I won''t listen to her babbling anymore.@k@v10/30100790. I''ll coolly fight to the end.@k@v10/30100791. I definitely won''t get provoked by her anymore."'
17972: 'VIRGILIA@r@v30/33200266."Then let us return.@k@v30/33200267. To the seat of the battle."'
17973: 'BEATRICE@r@v27/30701130."...Oh, ......oooh, Battler...!@k @v27/30701131.Where did you hide yourself?@k@v27/30701132. *cackle*!@k @v27/30701133.I thought the sore loser wouldn''t show himself again, you see?"'
17974: 'Battler@r@v10/30100792."......Sorry to keep you waiting.@k@v10/30100793. I''ve cooled my head a little."'
17975: 'BEATRICE@r@v27/30701134."Aaand?@k @v27/30701135.Did you think of a response to that pleasant, thrilling, refreshing, highly acclaimed, wonderful fantasy battle between Master and meeeeeeee?@k @v27/30701136.Isn''t that impossible to explain without fantasy?@k @|@y@v27/30701137.Hihhyahhahahahahahahahahahahahaah?!"'
17976: 'Ronove@r@v31/33100347."...Milady.@k@v31/33100348. You have only just promised to be kind and act refined, remember?"'
17977: 'BEATRICE@r@v27/30701138."Ahhyahahahahaha, oops, my mistake.@k@v27/30701139. I just get in such a good mood when I see Battler''s face, you see?@k @v27/30701140.C''mon c''mon c''mon, c''mon then Battler, that battle just now, how will you respond to it?@k @v27/30701141.Hmmmmmm?"'
17978: 'Battler@r@v10/30100794.".................................@k@|@y@v10/30100795. ...Battle?@k @v10/30100796.Did something happen?"'
17979: 'BEATRICE@r@v27/30701142."......Whaat?"'
17980: 'Battler@r@v10/30100797."Where in this rose garden.@k@v10/30100798. Where are all those spears and towers that you grew?@k@v10/30100799. Where have they all fallen to?@k@|@y@v10/30100800. ............They''re not here, are they?@k@v10/30100801. ......In other words, this is what we see inside the Braun tube."'
17981: 'BEATRICE@r@v27/30701143."......Inside the Braun tube, you say??@k @v27/30701144.*cackle*, what in the world are you talking about now...?"'
17982: 'Battler@r@v10/30100802."In this very moment,@k@v10/30100803. there is nothing at all in the rose garden.@k@v10/30100804. ...Sure, towers may have been sprouting with magic a short while ago.@k@v10/30100805. But that''s only until we learn what''s inside the Braun tube.@k@v10/30100806. ......It is your interpretation that it was a magical battle, and that''s nothing more than a claim.@k@v10/30100807. And the fact that there''s nothing at all here right now is the proof of that."'
17983: 'Battler@r@v10/30100808."This is how I argue back about that witch''s battle just now:@k@v10/30100809. Right now, there isn''t anything here, and that proves that nothing happened...!"@|@y'
17984: 'BEATRICE@r@v27/30701145."..................@k@|@y@v27/30701146. ......Hahaha, hah-hah-hah-hah-ha!@k @v27/30701147.You know, obviously I can''t make a huge mess right on the first twilight, and I do like that rose garden, you see?@k @v27/30701148.To prevent any damage, I fought inside a barrier.@k@v27/30701149. So it''s only natural that it wouldn''t have any influence on reality."'
17985: 'Battler@r@v10/30100810."......That is your "claim"?@k @v10/30100811.Well, I guess that works."'
17986: 'Battler@r@v10/30100812."However!@k @v10/30100813.My claim that, at this point in time, there is nothing in the rose garden,@k@v10/30100814. and therefore there was no magic, has not been obstructed in any way!!"'
17987: 'BEATRICE@r@v27/30701150."W-wait, wait, can you deny my magic with that mess?!@k @v27/30701151.It is impossible to prove that magic "does not exist"!@k @v27/30701152.It''s a "Devil''s Proof"!!"'
17988: 'Battler@r@v10/30100815."The truth is this garden at this very moment!@k @v10/30100816.The instant you look inside, the tiny people inside the Braun tube will vanish.@k@v10/30100817. And there are no traces of magic here at all!@k @v10/30100818.So that battle between you witches did not take place!!"'
17989: 'BEATRICE@r@v27/30701153."Wh-@v27/30701154.......what the,@v27/30701155. th-that counter......?!@k @v27/30701156.That power,@v27/30701157. ...c-could it be...?!"'
17990: 'Ronove@r@v31/33100349."...Have you forgotten, Milady?@k@v31/33100350. It is the Multiplanar World Collapsation Technique.@k@v31/33100351. The power of a Finite Witch, which is the pair to the power of an Endless Witch.@k@v31/33100352. Only an Endless Witch would be able to understand it, and it causes the strongest effect for an Endless Witch."'
17991: 'BEATRICE@r@v27/30701158."Sch-''Schroedinger''s cat box''?!@|@y@k @|@y@v27/30701159..........Th-......that old hag of a witch...what an uncalled-for hint!!"'
17992: 'Battler@r@v10/30100819."We''ve lost time.@k@v10/30100820. With the five servants and Grandfather, there are six corpses!@k@|@y @v10/30100821.Let me check the scene.@k@v10/30100822. I''ve been trudging along wasting time.@k@v10/30100823. From now on, I''ll speed things up, okay?"'
17993: 'Battler@r@v10/30100824."Take a seat, BEATRICE!!@k @v10/30100825.It''s finally the first twilight, isn''t it? Let''s start the real thing.@k@|@y@v10/30100826. Show me what you''ve got!!!"'