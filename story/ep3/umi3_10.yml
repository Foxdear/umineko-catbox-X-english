18435: 'Natsuhi@r@v03/30900101."There should at least be enough set aside for breakfast.@k@v03/30900102. I will prepare it."'
18436: 'Rudolf@r@v08/31200270."I''m also starving.@k@v08/31200271. I''ll bet those brats above us are starving too.@k@v08/31200272. ...But I doubt there''s enough for 18 people here, and for three meals."'
