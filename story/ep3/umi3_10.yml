18464: 'Rosa@r@v12/31400247.".........ah, umm, ...it''s not like it means anything.@k@v12/31400248. This is Father we''re talking about.@k@v12/31400249. It could just be a coincidental change in how he said the word."'
18465: 'Eva@r@v05/31000388.".........................................."'
