18296: '@rThe true enemy of holding a fort probably isn''t the fear of unseen enemies.@k It''s whether you can keep it going over a long period of time.'
18297: '@rMaria had gotten bored and had started making a ruckus because she wanted to watch TV.@k Since there was no TV in the lobby, she decided to return to the cousins'' room upstairs.'
18298: '@rThe adults probably didn''t want to leave Maria all on her own, among other reasons.@k They told all the children to go to the cousins'' room upstairs.'
18299: '@rGeorge, his heart wounded by the loss of his fiancee, had no willpower to resist that, and led the cousins upstairs.'
18300: '@rAt first, Nanjo had been reading a book in the lobby,@k but when he noticed that the relatives looked like they wanted to talk about something shady,@k he said "It seems I am in the way..." and returned to his room upstairs.'
18301: 'Rudolf@r@v08/31200225.".........I''m starving.@k@v08/31200226. And if I keep just sitting around, my drowsiness will be even worse."'
18302: 'Rosa@r@v12/31400200_1."It''s only natural.@k@v12/31400200_2. Because we didn''t sleep last night."'
18303: 'Krauss@r@v02/30800193."...We will probably end up barricaded here for a full 24 hours.@k@v02/30800194. It may be wiser to take naps in turn instead of over-stressing ourselves."'
18304: 'Natsuhi@r@v03/30900083."I agree.@k@v03/30900084. My husband and I will be here, so anyone who finds this difficult should rest without overdoing it."'
18305: 'Eva@r@v05/31000322."They might be expecting that, you know?@k @v05/31000323.They may not be able to defeat this many people, but if that number was reduced by a certain amount, they may plan to use that to their advantage."'
18306: 'Kyrie@r@v09/31300163."There are seven of us here.@k@v09/31300164. Two of us could rest for three hours at a time.@k@v09/31300165. ......It''s a long time until tomorrow morning.@k@v09/31300166. We still have some energy now, but tonight''s going to be tough."'
18307: 'Hideyoshi@r@v06/31100206."Sure will be.@k@v06/31100207. Anyone sleepy?@k @v06/31100208.Don''t overdo it, rest."'
18308: '@rHideyoshi looked around at everyone to see who wanted to sleep first, but no one volunteered.'
18309: '@r...Everyone was just as tired, but no one was bold enough to be able to sleep now.@k ......Their fear of the unknown culprit was just as strong as their sleepiness.'
18310: 'Hideyoshi@r@v06/31100209."......Nobody?@k@v06/31100210. Well, don''t overdo it, everyone."'
18311: 'Eva@r@v05/31000324."If we get tired, we can think about it then.@k@v05/31000325. ......I certainly am tired, but I''m not in the mood now."'
18312: '@rEva spoke sharply, and then read once more over the second letter from BEATRICE, which had been found in the boiler room.'
18313: '@rBEATRICE had sent them two letters, and had repeatedly told them to solve the riddle of the epitaph.'
18314: '@rAnd she had even provoked them by saying she would give up the inheritance, both assets and headship, if it could be solved...'
18315: '@rEva took out a notebook and opened it to a page with the epitaph copied onto it.'
18316: 'Kyrie@r@v09/31300167."............Is that the epitaph?"'
18317: 'Eva@r@v05/31000326."Yes.@k@v05/31000327. ......Although it''s annoying to do as the culprit says,@k@v05/31000328. after all, we do have time to waste.@k@v05/31000329. I think it''s the perfect way to stave off boredom."'
18318: 'Krauss@r@v02/30800195."...Not a bad way to kill time.@k@v02/30800196. Why don''t we challenge it together as siblings?"'
18319: 'Kyrie@r@v09/31300168."......Can I borrow that?@k @v09/31300169.I''ll rewrite it just a little larger.@k@|@y@v09/31300170. Natsuhi-san, do you have a slightly larger piece of paper?"'
18320: 'Natsuhi@r@v03/30900085."There should be paper in the servant room.@k@v03/30900086. I will bring some."'
18321: '@rNatsuhi immediately brought a B4 blank sheet of paper from the servant room.'
18322: '@rKyrie borrowed Eva''s notebook, wrote out the epitaph on the paper, and laid it out on the table.'
18323: '@rStraight away, everyone peered down at it.@k@r...A fence of people naturally formed.'
18324: 'Hideyoshi@r@v06/31100211."I''ve heard about it, but...@k@v06/31100212....really, this is a tough riddle.@k@v06/31100213. I don''t have a clue what it''s talking about."'
18325: 'Rosa@r@v12/31400201."At one point, I also did my best to challenge it, but I was just as clueless."'
18326: 'Rudolf@r@v08/31200227."If we did know, we wouldn''t have come all the way out here with a plan to make money.@k@v08/31200228. After all, it''s ten tons of gold."'
18327: 'Kyrie@r@v09/31300171."............This is the first time I''ve read it seriously, but...@k@v09/31300172....roughly speaking, couldn''t it be split into three parts?"'
18328: 'Krauss@r@v02/30800197."...I''ve been thinking this since last night, but you really do seem to be a good thinker, Kyrie-san.@k@v02/30800198. It''s possible that you could easily solve this riddle that we couldn''t."'
18329: 'Rudolf@r@v08/31200229."Yeah.@k@v08/31200230. Kyrie''s sharp.@k@v08/31200231. ......She might be able to tackle it in an interesting way if we don''t give her any strange preconceptions."'
18330: 'Eva@r@v05/31000330.".........Yes.@k@v05/31000331. Kyrie-san.@k@v05/31000332. Will you let us hear your honest thoughts having read the epitaph?"'
18331: 'Kyrie@r@v09/31300173."I think it probably won''t be very useful to all of you.@k@v09/31300174. You all give me too much credit."'
18332: 'Rudolf@r@v08/31200232."No way, anything that comes to mind would be helpful.@k@v08/31200233. Let us hear what you have to say.@k@|@y@v08/31200234. ......Because your hints always help me when I''m worried."'
18333: 'Kyrie@r@v09/31300175."Oh, so they were helpful?@k@v09/31300176. It''s nice to finally hear about this now."'
18334: 'Rudolf@r@v08/31200235."Come ooon, don''t I always thank you?"'
18335: 'Rosa@r@v12/31400202."You two do get along well.@k@v12/31400203. I''m jealous."'
18336: 'Eva@r@v05/31000333."And the rest of us would also love to accept your hints.@k@v05/31000334. It''s alright, we''re just killing time anyway, so why not relax?"'
18337: '@rKyrie was bewildered by all this praise she was suddenly receiving.'
18338: '@r...But they had plenty of time.@k She realized that this was just a way to waste time, and she decided to accept that role...'
18339: 'Kyrie@r@v09/31300177."......I''m sure I''ll say something off the mark, but...@k@v09/31300178.well, I''ll put forward my ideas."'
18340: 'Krauss@r@v02/30800199."Mmhm.@k@v02/30800200. ......What did you mean in the beginning, about how, roughly speaking, it could be divided into three parts?"'
18341: 'Kyrie@r@v09/31300179."Well...I just mean what I said.@k@r@v09/31300180. I think that overall, the epitaph can be divided into three parts."'
18342: 'Kyrie@r@v09/31300181."First, there are the five lines up to and including "There the key to the gold sleeps".@k@r@v09/31300182. Up until this point is the first part, which points to the location of the key."'
18343: 'Kyrie@r@v09/31300183."And then there''s the part formed by the eleven lines up until the tenth twilight, which refer to the location of the Golden Land itself."'
18344: 'Kyrie@r@v09/31300184."And the remaining six lines make up the part after the Golden Land has been reached."'
18345: 'Natsuhi@r@v03/30900087."I see.@k@v03/30900088. The key, the Golden Land,@k@v03/30900089. and the Golden Land''s treasure; it can be divided into these three parts."'
18346: 'Krauss@r@v02/30800201."Even we have been able to grasp that much.@k@v02/30800202. The three sections that refer to the key, the door, and the treasure."'
18347: 'Eva@r@v05/31000335."...Nii-san, don''t butt in any more than you have to!@k @v05/31000336.Let Kyrie-san speak her ideas freely."'
18348: 'Rudolf@r@v08/31200236."Kyrie.@k@v08/31200237. Please continue.@k@v08/31200238. ......We recognize the same thing regarding what you said.@k@v08/31200239. So then?"'
18349: 'Kyrie@r@v09/31300185."......I wonder what that thing in the beginning, the "beloved home of old", means.@k@v09/31300186_b. Thinking about it normally, would it refer to Grandfather''s home?"'
18350: 'Kyrie@r@v09/31300187."Since he explicitly mentioned that it''s beloved, I can imagine that it''s a home he thought about very deeply.@k@v09/31300188. ......Didn''t Father come from Odawara?"'
18351: 'Eva@r@v05/31000337.".........Odawara is definitely where he was born,@k@v05/31000338. but I don''t think this home Father loved was Odawara.@k@v05/31000339. I believe all of us siblings are thinking of the same place."'
18352: 'Rosa@r@v12/31400204."...Yes.@k@v12/31400205. This probably isn''t Odawara.@k@v12/31400206. From what I''ve heard, he had a very fun time as a youth."'
18353: 'Rudolf@r@v08/31200240."Hahhaha.@k@v08/31200241. ...Dad''s greatest misfortune in his life was probably being made the Ushiromiya family head."'
18354: 'Krauss@r@v02/30800203."......Probably.@k@v02/30800204. Father really hadn''t wanted to become the Ushiromiya family head."'
18355: 'Kyrie@r@v09/31300189."So where is it?@k @v09/31300190.And is there a river where sweetfish swim?"'
18356: 'Eva@r@v05/31000340."......Maybe there was at the time.@k@v05/31000341. I''m sure that there has been a lot of development there by now, so the sweetfish might have disappeared.@k@v05/31000342. It would be extremely difficult to investigate whether there were sweetfish there during the time Grandfather was a boy."'
18357: 'Krauss@r@v02/30800205."There''s not just one river, either.@k@v02/30800206. I believe we all investigated thoroughly in a geographical sense.@k@|@y@v02/30800207. ......You even went to the actual place to investigate directly, didn''t you, Eva?"'
18358: 'Eva@r@v05/31000343."That was only as a vacation.@k@v05/31000344. ......But the townscape had changed completely from Father''s time.@k@v05/31000345. After all, there was a war in between.@k @v05/31000346.It was impossible to even figure out where Father actually lived.@k@v05/31000347. ...Probably, even if Father dragged himself to the actual location,@k@v05/31000348. by now, even he wouldn''t be able to determine where it was that he lived."'
18359: 'Rudolf@r@v08/31200242."They''ve had a remarkable revival over there, after all..."'
18360: 'Kyrie@r@v09/31300191."............Doesn''t any place name come clearly to mind after hearing "sweetfish river"?"'
18361: 'Rudolf@r@v08/31200243."Not really.@k@v08/31200244. I mean, they''re sweetfish, right?@k @v08/31200245.People say they live in rivers with clean water, so there are countless rivers we could guess at.@k@v08/31200246. Any stream that Dad innocently went sweetfish-fishing in was probably buried by the development later.@k@v08/31200247. It would be different if we had a map from before the war, or a person who knew a lot about how the area was before the war, but..."'
18362: 'Kyrie@r@v09/31300192."......It probably isn''t something like that."'
18363: 'Krauss@r@v02/30800208."What do you mean...?"'
18364: 'Kyrie@r@v09/31300193.".........Behold the sweetfish river, running through my beloved home of old.@k@v09/31300194. You who seek the Golden Land, follow its path downstream in search of the key.@k@v09/31300195. ...After these two lines, there is a single blank line."'
18365: 'Kyrie@r@v09/31300196."...Something is being presented with just these two lines.@k@v09/31300197. I would suppose the next three lines continue based upon that something."'
18366: 'Hideyoshi@r@v06/31100214."I wonder what it is that''s being presented, then...?"'
18367: 'Kyrie@r@v09/31300198."......I don''t know.@k@v09/31300199. In any case, after just these two lines, it''s not something vague like you don''t know which river it is...@k@v09/31300200.you''re able to narrow it down and say specifically what "river"."'
18368: 'Kyrie@r@v09/31300201."......It may be that this isn''t a "river" with water flowing down it.@k@v09/31300202. ...The "sweetfish river" might be some kind of metaphor.@k@v09/31300203. ......What kind of image does the word sweetfish have?"'
18369: 'Hideyoshi@r@v06/31100215.".........Sweetfish are like salmon.@k@v06/31100216. They''re freshwater fish, but they go out into the ocean right after they''re born.@k@v06/31100217. And when they get big, they return to the river to live there,@k@v06/31100218. and then they spawn there and end their lives there."'
18370: 'Hideyoshi@r@v06/31100219."Well, they leave their home at one point, but the part about them getting big and returning there to lay eggs,@k@v06/31100220. that might have a family prosperity type of image."'
18371: 'Rudolf@r@v08/31200248."Huh.@k@v08/31200249. They''re freshwater fish, but they can live in the ocean?@k@v08/31200250. I didn''t know that.@k@v08/31200251. I thought they were river fish, so they couldn''t go out into the sea."'
18372: 'Natsuhi@r@v03/30900090."And they are also called @bkougyo.@<香魚@> (aroma fish) because they have a pleasant smell.@k@v03/30900091. I have never eaten one, but I have heard that they are very delicious when grilled with salt."'
18373: 'Hideyoshi@r@v06/31100221."Whoa, Natsuhi-san!@k @v06/31100222.You''ve never eaten salt-grilled sweetfish?!@k @v06/31100223.They''re delicious!@k @v06/31100224.I''ll treat you sometime!"'
18374: 'Krauss@r@v02/30800209."It is a food for commoners.@k@v02/30800210. It isn''t appropriate for your mouth."'
18375: 'Rosa@r@v12/31400207."......This is just my wild idea,@k@v12/31400208. ...but the image I get from a sweetfish river has made me suspect a family tree before.@k@v12/31400209. The sweetfish go out into the ocean for a time, but they return to the river where they were born to spawn, right?@k @v12/31400210..........It makes me think about myself."'
18376: 'Eva@r@v05/31000349."......You''re right.@k@v05/31000350. I can confess now...@k@v05/31000351.that I have sometimes suspected that it refers to you and Maria-chan."'
18377: 'Krauss@r@v02/30800211."I see.@k@v02/30800212. ......As you travel down it, you will see a village.@k@v02/30800213. The only "village" (@bsato.@<里@>) you''ll find by going down the family tree is the one in Maria''s name (真里亞)."'
18378: 'Rosa@r@v12/31400211."Right?!@k @v12/31400212.......But as you all know, Father has a dislike of Maria,@k@v12/31400213. and he has almost never spoken with her."'
18379: 'Rosa@r@v12/31400214."Besides which, Father once told me to give Maria a completely different name.@k@v12/31400215. I just made it Maria on my own.@k@v12/31400216. Father was very mad about that."'
18380: 'Rosa@r@v12/31400217."......If you think about the history there,@k@v12/31400218. I just really couldn''t imagine that he''d reference Maria''s name in his precious epitaph about who would inherit his wealth and the family headship."'
18381: 'Kyrie@r@v09/31300204."Have you ever let Maria-chan read the epitaph?"'
18382: 'Rosa@r@v12/31400219."Um, yes. Of course I have.@k@v12/31400220. But she didn''t seem to have a clue.@k@v12/31400221. ......She didn''t have a clue, and she kept going on about that same occult stuff, about how it was a resurrection ceremony for the witch."'
18383: 'Krauss@r@v02/30800214."............A connection between Father and Maria.@k@v02/30800215. ...Certainly, they do share that occult hobby, but they never interacted.@k@v02/30800216. ...I can''t imagine it refers to Maria either."'
18384: 'Kyrie@r@v09/31300205."......What interests me is the fact that he explicitly added the word "beloved" at the beginning.@k@v09/31300206. ......Like you all said just now,@k@v09/31300207. if Father was reluctant about becoming the Ushiromiya family head,@k@v09/31300208. would he describe it that way?@k@v09/31300209. ...I don''t think it is Odawara, which points back to the Ushiromiya main family."'
18385: 'Kyrie@r@v09/31300210."......I believe that this word "beloved" here at the beginning...@k@v09/31300211.definitely refers to a place full of very important memories to Father."'
18386: 'Rudolf@r@v08/31200252."...............Hmmmmmm.@k@v08/31200253. ...Well, that''s fine.@k@v08/31200254. It''d be hard to pinpoint since we don''t have a clue about a map from that time,@k@v08/31200255. but anyway, there were probably several rivers with sweetfish swimming in them near Dad''s home during his youth."'
18387: 'Eva@r@v05/31000352."That''s if it''s a river with water flowing down it, right?@k @|@y@v05/31000353.And then?@k @v05/31000354.Go on, Kyrie-san."'
18388: 'Kyrie@r@v09/31300212."......I don''t really understand the three lines starting with "As you travel down it, you will see a village".@k@v09/31300213. ...These are probably coupled with the two lines about the sweetfish river."'
18389: 'Kyrie@r@v09/31300214."It''s probably something that we would automatically understand if we knew what the sweetfish river really was.@k@v09/31300215. ...As long as we don''t understand that, it''s probably useless to try and solve those three lines any further."'
18390: 'Rudolf@r@v08/31200256."So we''re screwed unless we know what the "sweetfish river" really is...@k@v08/31200257. And there''s no guarantee it even means a literal river."'
18391: 'Rudolf@r@v08/31200258."...Seriously.@k@v08/31200259. The heck does it mean by sweetfish?@k @v08/31200260.Were they a favorite dish of Dad''s?@k @v08/31200261.Or is there some special meaning?@k @v08/31200262.Is it pointless to read too deeply into it?"'
18392: 'Eva@r@v05/31000355."...If you don''t have both a micro and a macro perspective, your field of vision grows narrow.@k@v05/31000356. ......Think not too deeply, about a river with fish swimming in it, or some kind of flow,@v05/31000357. ...something you can go down or go up,@k@v05/31000358. keep those kinds of abstract images in mind, and we may be able to come up with more out-of-the-box ideas."'
18393: 'Rosa@r@v12/31400222."And via the three lines that follow, the answer for the "sweetfish river" ends up at the "key to the Golden Land"..."'
18394: 'Kyrie@r@v09/31300216."If you think about it this way, I wonder if it was a mistake to split it into three parts.@k@v09/31300217. There''s actually four parts.@k@v09/31300218. ......''Go down the sweetfish river'',@k@v09/31300219. "find the key to the Golden Land",@k@v09/31300220. "journey to the Golden Land",@k@v09/31300221. and "the treasure of the Golden Land"."'
18395: 'Krauss@r@v02/30800217."Hmmm... ......Truly interesting.@k@v02/30800218. While we have this opportunity,@k@v02/30800219. would you mind continuing and telling us your opinion about the most central portion of the epitaph,@k@v02/30800220. up until the tenth twilight where we arrive at the Golden Land?"'
18396: 'Rosa@r@v12/31400223."......That''s the most symbolic, ...and also the most disturbing part."'
18397: 'Eva@r@v05/31000359."Since it keeps mentioning the word sacrifice,@k@v05/31000360. I can''t help but think it has something to do with Father''s occult rituals...@k@v05/31000361. .........How do you see it, Kyrie-san?"'
18398: '@rKyrie recrossed her arms several times,@k peering into the paper with the epitaph copied onto it as though she was looking through it...'
18399: 'Kyrie@r@v09/31300222."...........................@k@v09/31300223. .........This is...very difficult.@k@v09/31300224. ...By starting with "You who laid hand upon the key",@k@v09/31300225. it probably means that you won''t be able to continue without understanding the key.@k@v09/31300226. ...I''ll have to give up, but I''ll take a shot at it anyway."'
18400: 'Eva@r@v05/31000362."......Just like how the "sweetfish river" isn''t necessarily a river with water flowing down it,@k@v05/31000363. it is also doubtful whether this "key" is actually something shaped like a key."'
18401: 'Kyrie@r@v09/31300227."Right.@k@v09/31300228. There''s also the possibility that it''s a code or a keyword.@k@v09/31300229. ......After all, this key isn''t something to be stuck into a keyhole.@k@v09/31300230. It''s something that selects the six people to be sacrifices for the first twilight."'
18402: 'Kyrie@r@v09/31300231."In that sense, we can state that this key isn''t something to open the door to the Golden Land."'
18403: 'Natsuhi@r@v03/30900092."......But what a disturbing key.@k@|@y@v03/30900093. A key that can select six people to be sacrifices..."'
18404: 'Hideyoshi@r@v06/31100225."How would a key select anything?@k@v06/31100226. ...Does it spin around like a roulette...?"'
18405: 'Kyrie@r@v09/31300232."This key points towards a certain specific group of six people.@k@v09/31300233. ......No, we should say it points to a certain specific group of six things.@k@v09/31300234. ......If this doesn''t mean a literal command to offer sacrifices.@k@v09/31300235. ...For example, it could be an anagram."'
18406: 'Krauss@r@v02/30800221."An anagram?@k @v02/30800222.Do you mean a word game...?"'
18407: 'Kyrie@r@v09/31300236."Yes.@k@v09/31300237. Ever since Rosa started talking about the family tree and how "village" was a part of Maria-chan''s name,@k@v09/31300238. this has constantly been going through my mind."'
18408: 'Kyrie@r@v09/31300239."......It seems as though Rudolf-san, for example, has run with the words "beloved home of old",@k@v09/31300240. and is assuming that it has to something to do with geography or coordinates, but that might not be true.@k@v09/31300241. This could be some kind of puzzle, ...or maybe playing with letters."'
18409: 'Natsuhi@r@v03/30900094."......I''m sorry.@k@v03/30900095. What do you mean by playing with letters?"'
18410: 'Rudolf@r@v08/31200263."Oh yeah, it''s like "sucker merry barrellers".@k@v08/31200264. What do you get when you take out the e''s and r''s?@k @v08/31200265.Like that.@k@v08/31200266. Well, you were raised well, Natsuhi-san, so you probably haven''t heard that one."'
18411: 'Natsuhi@r@v03/30900097."Take out the e''s and r''s? Huh?@k @v03/30900098.???"'
18412: 'Krauss@r@v02/30800223."Don''t.@k@v02/30800224. It is an undignified game, inappropriate for you."'
18413: '@rOnly Natsuhi didn''t get it and had a blank look on her face.'
18414: '@rIt seemed that she had only guessed the answer had to be something undignified,@k after hearing Rudolf and Eva''s snickers.'
18415: 'Rosa@r@v12/31400224."Ah, ...Natsuhi nee-san, it''s something like this.@k@v12/31400225. There was something like it in Maria''s book of puzzles, okay?@k @v12/31400226.There''s this thing called the Tanuki Notebook."'
18416: 'Rosa@r@v12/31400227."There''s a notebook written in some kind of code, with a lot of "ta"s mixed in,@k@v12/31400228. and if you @bnuki.@<"remove"@> all of the "ta"s, then the true sentences pop up.@k@v12/31400229. It''s a game like that."'
18417: 'Natsuhi@r@v03/30900099."Ah......oh, I see.@k@|@y@v03/30900100. .........??"'
18418: '@rNatsuhi finally realized the answer to the undignified riddle Rudolf had posed, and her face grew red as she hung her head in embarrassment.'
18419: 'Eva@r@v05/31000364."...............So maybe that "remove" part is actually represented by "kill"...?"'
18420: 'Kyrie@r@v09/31300242."Yes.@k@v09/31300243. I was just thinking that too.@k@v09/31300244. It''s possible that the key to the Golden Land is a word with six characters."'
18421: 'Hideyoshi@r@v06/31100227."In other words, ...the "ta" from the Tanuki Notebook...is actually six characters here...?@k @v06/31100228.Hmmm, ...this is gettin'' complicated..."'
18422: 'Krauss@r@v02/30800225."Playing with letters, is it...@k@v02/30800226. ......Hmmm.@k@v02/30800227. In Japan, it really feels like a child''s game, but it seems that it is a stylish form of humor among intellectuals in the English-speaking world.@k@v02/30800228. ...It is easy to imagine that Father showed interest in it."'
18423: 'Kyrie@r@v09/31300245."......But right here, I quickly lose my ability to understand it.@k@v09/31300246. Up until this point, while it was filled with mystery, it was extremely sequential."'
18424: 'Kyrie@r@v09/31300247."''Sweetfish river'', "go down it", "then find the key" is all extremely sequential.@k@v09/31300248. And we can guess that we gain a six-character key as a result,@k@v09/31300249. ......but in that case, we now don''t know what we kill the six characters from."'
18425: 'Rudolf@r@v08/31200267."That''s a point.@k@v08/31200268. What do we subtract the six characters from?@k @v08/31200269.It doesn''t tell us."'
18426: 'Kyrie@r@v09/31300250."...On the second twilight, it says "those who remain".@k@v09/31300251. ......Which means that, at the very least, that "something" has a finite number of characters.@k@v09/31300252. You could read it like it''s telling you to continue with the remaining characters after the six characters are removed."'
18427: 'Kyrie@r@v09/31300253.".........And yet, we don''t know what this "something" is, even though it should have been shown to us at the beginning.@k@v09/31300254. ...Were we wrong even to assume that this is playing with letters...?"'
18428: 'Hideyoshi@r@v06/31100229.".....................hmmmmm..."'
18429: '@rEveryone crossed their arms and fell into silence.'
18430: '@rIt felt like they were about to reach a novel understanding that they hadn''t been able to before...but they stumbled just one step before it.'
18431: '@rAt that time, Hideyoshi''s stomach rumbled heartily.'
18432: '@rThe silence up until then was broken by laughter.'
18433: 'Hideyoshi@r@v06/31100230."Sorry, sorry.@k@v06/31100231. By spinnin'' the gears in my head for a change, my stomach''s gone completely empty.@k@v06/31100232. Looks like skippin'' breakfast really takes its toll on me...wahahahahaha."'
