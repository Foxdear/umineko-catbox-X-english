20285: '@r...Thirty minutes had already passed since Rudolf''s group had left the guesthouse.'
20286: '@rBy any measure, their return was too late.@k@r...And Krauss and Natsuhi, who were waiting by the entrance, were by now about as restless as they could stand.'
20287: '@rThe chain was set on the door.@k That was a precaution in the event that Rudolf''s group was attacked, and the master key was stolen from them.'
20288: '@rFor that reason, they needed to wait by the entrance like this for the others to return...'
20289: 'Natsuhi@r@v03/30900140."......They really are taking too long.@k@v03/30900141. You don''t think something happened to them...?"'
20290: 'Krauss@r@v02/30800272."...............Hmm..."'
20291: '@rKrauss glanced between the clock and the door, struggling to feign composure.'
20292: 'Natsuhi@r@v03/30900142."If...by some chance they were not to return......"'
20293: 'Krauss@r@v02/30800273."...A terrible thought, but it looks as though we should ready ourselves for that possibility.@k@v02/30800274. ......It really was reckless, after all."'
20294: 'Natsuhi@r@v03/30900143."Th-that is what I said...!@k @v03/30900144.Why did they go outside when they knew it was this dangerous...!@k @v03/30900145.How foolish!@k @v03/30900146.Why go outside, even though Rosa-san had just been attacked...?!!"'
20295: 'Krauss@r@v02/30800275.".........Nothing will come from saying that now.@k@v02/30800276. ...In any event, there are now three adults in the guesthouse.@k@v02/30800277. Me, you,@v02/30800278. ......and Eva, who''s asleep with a high fever."'
20296: '@rAt that time, there was the forceful sound from the hallway of a door being opened, and Eva''s shrieking voice.'
20297: '@r...That voice kept calling Hideyoshi''s name.@k ......It seemed as though the high fever had given her a bad dream or something, and now she was calling her husband''s name.'
20298: 'Natsuhi@r@v03/30900147."Eva-san...@v03/30900148.what is it, are you alright...?"'
20299: 'Eva@r@v05/31000776."Wh-...where is my husband?!@k @v05/31000777.My husband isn''t here!!@k @v05/31000778.He promised that he''d stay with me the whole time!@k @v05/31000779.He promised that he''d hold my hand the whole time!!"'
20300: '@r...Krauss was taken aback by this attitude of hers, which she had never shown in front of him before, but Natsuhi understood her feelings.'
20301: 'Natsuhi@r@v03/30900149."......C-calm down...@k@v03/30900150. Hideyoshi-san is with Rudolf-san and Kyrie-san, and they''re outside right now."'
20302: 'Eva@r@v05/31000780."Outside?!?!@k @v05/31000781.Whwh-why,@|@y@v05/31000782. he promised that he''d stay with me the whole time,@k@v05/31000783. why did he go outside?!@|@y@k @v05/31000784.You mustn''t go outside, the witch is outside, you mustn''t go, you''ll be killed!!@k @v05/31000785.Waaaaaaaaagggggggghhh...!!"@|@y'
20303: 'Krauss@r@v02/30800279."...Eva, calm yourself.@k@v02/30800280. ......Hideyoshi-san is back in the mansion with Rudolf and Kyrie-san."'
20304: 'Eva@r@v05/31000786."Why did he have to go to the mansion?!!@k @v05/31000787.Why did you let him outside when it''s safe in here?!!@k @v05/31000788.Why did he go back to the mansion?!!"'
20305: 'Krauss@r@v02/30800281."..................@k@v02/30800282. ......They went to get enough food to last until tomorrow.@k@v02/30800283. ...Hideyoshi-san was worried about your health, and he told us so..."'
20306: 'Eva@r@v05/31000789."When will they come back?!@k @v05/31000790.When will he come back?!@k @v05/31000791.He can''t go outside, not to the rose garden, not to the mansion!!@k @v05/31000792.The witch is there, the Golden Witch is walking around!@k @v05/31000793.If she finds him he''ll be killed, he''ll definitely be killed!!@k @v05/31000794.When will my husband come back?!"'
20307: 'Natsuhi@r@v03/30900151.".........They left here thirty minutes ago.@k@v03/30900152. We are waiting for their return."'
20308: 'Eva@r@v05/31000795."Th-thirty minutes?!@k @v05/31000796.That makes no sense, why would it take him so much time to go to the mansion, get food, and come back?!@k @v05/31000797.And why are you two just standing around here?!"'
20309: 'Eva@r@v05/31000798."We have to go get him!!@k @v05/31000799.Quick, we have to go to where he is!!@k @v05/31000800.Hiiiiiiiiiiiiiiiiiiiiiiiiiiii!!"'
20310: '@rEva had probably had quite a nightmare.@k ...And after waking up and discovering that it still wasn''t over, she could no longer hide her confusion.'
20311: '@rNatsuhi tried calming her down, but it only made Eva''s emotions explode all the more.'
20312: '@r......Maybe they heard that disturbance.@k The lobby door opened slightly, and Battler and the kids, who should have been upstairs, poked their faces out.'
20313: '@rKrauss, Natsuhi, Eva.@k And Battler, George, Jessica, Nanjo.@k@r...Everyone in the guesthouse was gathered by the entrance, and understood the current situation.'
20314: 'George@r@v07/30300065."I agree with Mother.@k@v07/30300066. We should go to check on Father and the others."'
20315: 'Battler@r@v10/30101238."Yeah, you''re right.@k@v10/30101239. There''s also the chance that their load is too heavy and they''re having trouble carrying it.@k@v10/30101240. They should welcome some extra hands."'
20316: 'Nanjo@r@v19/31900028."......R-Rosa-san was attacked not long ago.@k@v19/31900029. ...There''s a possibility that this is a second disaster.@k@v19/31900030. We should act with caution here and - "'
20317: 'Eva@r@v05/31000801."Don''t be ridiculous!!@k @v05/31000802.Act with caution and what?!@k @v05/31000803.Are you saying we should stand by and let my husband die when he might be praying for help?!@k @v05/31000804.I''m going to look, the cowards can stay here!!"'
20318: '@rLooking agitated, Eva raised her gun.@k@rJudging by her expression, it would be useless for anyone to try to stop her.'
20319: '@r...George, who realized that first, raised his head.'
20320: 'George@r@v07/30300067."I''ll go too.@k@v07/30300068. You will too, right, Battler-kun?@k @v07/30300069.The more people, the better...!"'
20321: 'Battler@r@v10/30101241."S-sure!!@k @v10/30101242.Auntie Eva, we''re coming even if you tell us not to."'
20322: 'Jessica@r@v04/30200105."...I, I''m coming too...!@k @v04/30200106.I''ll be damned if I''m gonna be the only one hiding where it''s safe...!"'
20323: 'Natsuhi@r@v03/30900153."Jessica, you must not go outside!!@k @v03/30900154.You are to stay here with me.@k@v03/30900155. Do you understand?!"'
20324: '@rShe was essentially implying that those three had already been killed anyway, so it was pointless to go outside.'
20325: '@rNatsuhi also realized that she had made a deep gouge in Eva''s heart, but she said those words strongly as Jessica''s mother.'
20326: 'Eva@r@v05/31000805."..................You''re right.@k@v05/31000806. That would probably be best.@k@v05/31000807. Nii-san, you and your family keep watch over the guesthouse."'
20327: 'Eva@r@v05/31000808."This is my family''s and Battler-kun''s family''s problem.@k@v05/31000809. And I wonder if Doctor Nanjo would come too.@k@v05/31000810. Just in case of the worst."'
20328: 'VIRGILIA@r@v30/33200486.".........In the hall of the mansion, Battler, Eva, George, and Nanjo...@|@y@v30/33200487.found the bodies of Rudolf, Kyrie, and Hideyoshi."'
20329: 'Battler@r@v10/30101243.".........The fourth twilight through the sixth twilight?@k @v10/30101244.Then, the corpses were pierced through the forehead, chest, and stomach with those demon stakes?"'
20330: 'VIRGILIA@r@v30/33200488."Yes.@k@v30/33200489. ......Into Rudolf''s forehead,@k@v30/33200490. into Hideyoshi''s chest,@k@v30/33200491. and into Kyrie''s stomach: one demon stake buried into each."'
20331: 'VIRGILIA@r@v30/33200492."The clothing on all three was disordered, and because of this, it is thought that they had been fighting or running away.@k@v30/33200493. Since the three bodies were not found right next to each other, it is hypothesized that after coming into contact with the culprit, they attempted some form of resistance."'
20332: 'Battler@r@v10/30101245.".........With stakes, in the forehead, chest, and stomach.@k@v10/30101246. ......Horrible, just like usual..."'
20333: 'Ronove@r@v31/33100544."................................."'
20334: '@rEven though Ronove knew it would be superfluous, he thought that maybe he should tell Battler.'
20335: '@r...In actuality, the witch had killed them in a much more horrible way.'
20336: '@r......Beato had advised the witch to restrain herself, which was why the corpses had been left so undamaged.'
20337: '@rThe new and brutal witch, thinking that all she needed to do was get the "gouged with a stake" part right,@k ......might even have just stuck a stake into a lump of meat that wasn''t even shaped like a Human.'
20338: '@rRosa''s and Maria''s corpses would probably have been especially striking.@k ...If they had been killed as the Golden Witch had wished, just how gruesome would the exposed corpses have been?'
20339: '@rBeato had changed that into a kind of killing that Battler would have called "still better".'
20340: '@rWanting to have Beato''s small bit of thoughtfulness appreciated, he thought of telling Battler about that.'
20341: '@r...But, for Battler, that might do more harm than good.@k To humans, the gap between being alive and being dead is very large.'
20342: '@rTo ask for Beato''s feelings to be accommodated on the grounds that she had changed it to a better way of dying...@kmight have made it possible for a demon to pardon her, ......but there was no way it would work the same way for a Human.'
20343: '@rUnderstanding this, Ronove remained silent even though he knew of Beato''s modest effort...'
20344: 'Battler@r@v10/30101247."Just like usual, let''s start by checking whether the corpses are dead.@k@v10/30101248. ......Ronove, please, declare it in red."'
20345: 'Ronove@r@v31/33100545."...................................."'
20346: 'Battler@r@v10/30101249."Hey, can''t you hear me?@k @v10/30101250....Please, declare it in red.@k@v10/30101251. This is a repetition request.@k@v10/30101252. "Rudolf, Kyrie, and Hideyoshi are dead"."'
20347: 'Ronove@r@v31/33100546."...............My apologies.@k@v31/33100547. Allow me to decline from repeating that."'
20348: 'Battler@r@v10/30101253."What...?@k @v10/30101254.That''s so sudden... What are you planning...?"'
20349: '@rBy now, proclaiming the death of the victims in red was almost a given in this battle.'
20350: '@rRefusing to do that was almost like losing by default.'
20351: '@r...So when Ronove declined as his first move, Battler was dumbfounded.'
20352: 'Ronove@r@v31/33100548."My apologies.@k@v31/33100549. I hereby humbly relinquish my right to be Milady''s agent.@k@v31/33100550. ...Accordingly, I cannot repeat that in red.@k@v31/33100551. ......The only one qualified to repeat that...is Milady."'
20353: 'Battler@r@v10/30101255."........................"'
20354: 'VIRGILIA@r@v30/33200494."...It is a valid point.@k@v30/33200495. Ronove is but an agent for Beato''s side.@k@v30/33200496. ......If Ronove steps down from the position of agent, and Battler-kun will not accept Beato as an opponent,@k@v30/33200497. ...a new agent must be created."'
20355: 'Ronove@r@v31/33100552."......There is no new agent.@k@v31/33100553. ......Please, Battler-sama.@k@v31/33100554. Please accept Milady as your game partner once more."'
20356: 'Battler@r@v10/30101256."............Sorry,@k@v10/30101257. but that''s not happening.@k@v10/30101258. ......I definitely won''t accept that unpleasant, ruthless bitch as my opponent.@k@v10/30101259. ...Refusing to accept that is the reason I won''t abandon this game."'
20357: 'Ronove@r@v31/33100555."Regarding your point about Milady being unpleasant, I apologize in her stead.@k@v31/33100556. I shall obtain Milady''s pledge that she will not take unpleasant actions again."'
20358: 'Battler@r@v10/30101260."..............................@k@v10/30101261. ......Yeah, right."'
20359: 'VIRGILIA@r@v30/33200498."...Battler-kun.@k@v30/33200499. ...I also apologize as that child''s master.@k@v30/33200500. I will give her a thorough talking-to, so would you please forgive her just this once?"'
20360: 'Battler@r@v10/30101262."......Hey, hey, quit that.@k@v10/30101263. You''re making it sound like I''m the bad guy."'
20361: 'Battler@r@v10/30101264."...And no matter how much you guys apologize, it won''t reach my ears.@k@v10/30101265. ......If Beato can say that from her own mouth,@k@v10/30101266. ............well, it''s not like I''m not gonna listen to her."'
20362: 'VIRGILIA@r@v30/33200501."............Alright.@k@v30/33200502. If that is the only condition under which you will accept that child again, let us have her apologize."'
20363: 'VIRGILIA@r@v30/33200503.".........Ronove.@k@v30/33200504. Call for that child.@k@v30/33200505. Is that alright, Battler-kun...?"'
20364: 'Battler@r@v10/30101267."...............Tch.@k@v10/30101268. ...Do whatever you want.@k@v10/30101269. But don''t expect me to forgive her.@k@v10/30101270. ......Go on, call for that irritating witch."'
20365: 'Ronove@r@v31/33100557."...You have my thanks, Battler-sama.@k@v31/33100558. .........I will call her now.@k@|@y@v31/33100559. ......Milady, Battler-sama is calling for you."'
20366: '@rAfter a few heartbeats, gold butterflies gathered together in midair and created Beato''s form.'
20367: '@r...It was much more docile than the way she had appeared before now.'
20368: 'BEATRICE@r@v27/30701798."............Did you call, Ronove?"'
20369: 'VIRGILIA@r@v30/33200506."...I believe you heard.@k@v30/33200507. ......Is there anything you have to say, from your own mouth...?"'
20370: 'Battler@r@v10/30101271."...................................."'
20371: 'BEATRICE@r@v27/30701799.".............................."'
20372: '@rIt looked as though Beato shrunk slightly under Battler''s cold gaze.'
20373: '@rSeveral times, Beato made an effort to get the words out of her mouth, but that didn''t work so well,@k ......and she was just as awkward as someone trying to light a match during a freezing winter with frozen hands...'
20374: '@rEven as she did that, the game board was proceeding...'
20375: '@rIn the hall, they had just found the bodies of the new victims, and had broken down crying...'
20376: 'Battler@r@v10/30101272."......Dad,@v10/30101273. ......Kyrie-san...@v10/30101274. ...UooOOOOOOooooOOOooohhhh...@v10/30101275. UOOOOoooooOOOOoooohhhhh..."'
20377: 'Eva@r@v05/31000811."Oh honey, ...honeyyyy... uuuuuuuuuhuuuuuuughhhuuuhuuhuu...!!"'
20378: 'George@r@v07/30300070."...Mother,@v07/30300071. ......stay strong......@k@v07/30300072. ......You''re not the only one who''s...@v07/30300073....crushed and...@v07/30300074....sad......!"'
20379: 'Nanjo@r@v19/31900031."........................They probably died instantly.@k@v19/31900032. ...Even if we had arrived immediately after they fell, I am sure that it would have been too late..."'
20380: 'Eva@r@v05/31000812."No, it wouldn''t!!@k @v05/31000813.He would definitely have been alive!!@k @v05/31000814.His chest was stabbed with this thing...!@k @v05/31000815.My husband must have died in extreme pain...!!"'
20381: 'Eva@r@v05/31000816."If we had come faster, ...he would have been saved, I just know it!@k @v05/31000817.I just know it!!@k @|@y@v05/31000818.UuuuuwaaAAAaaaaAAAAaaaaaahhh..."'
20382: 'George@r@v07/30300075."...Battler-kun... I know it''s horrible, but......you have to stay strong......"'
20383: 'Battler@r@v10/30101276."...............I''m fine, ...I really am, Aniki...@k@v10/30101277. ...Let me cry just a bit longer...@k@v10/30101278. ......Compared to you people, this is nothing...@k@v10/30101279. I should be the least sad...!@k @v10/30101280.So if you let me cry just a little longer, ......I''ll be fine..."'
20384: 'George@r@v07/30300076."That isn''t true...@k@v07/30300077. ......I can understand how much it must be hurting your heart to have lost both parents...@k@v07/30300078. ...I still have my mother.@k@v07/30300079. ...I''ve got it much better than you, Battler-kun..."'
20385: 'Battler@r@v10/30101281."No, you haven''t!!@k @v10/30101282.You have it the worst, George-aniki...@k@v10/30101283. ......I understand, Aniki..."'
20386: 'Battler@r@v10/30101284."...Out of all of us, ...you''re the most devastated, and the most in pain!!@k @v10/30101285.I know that...@k@v10/30101286.so I can''t keep on snivelling like this...!!@k @v10/30101287.Uuuuuuuughhuuugh!!"'
20387: 'George@r@v07/30300080."......Why......do you say that......?"'
20388: 'Battler@r@v10/30101288."To me, Dad and Kyrie-san......were people I''d eventually part with when I became an independent adult.@k@v10/30101289. Since they''re parents, it''s fated that they''d die before their children.@k@v10/30101290. ...It''s just that it happened a little early...!"'
20389: 'Battler@r@v10/30101291.".........But it''s not like that for you, Aniki.@k@v10/30101292. You didn''t just lose a parent you''d part with eventually.@k@v10/30101293. .........You also lost someone you should have lived your whole life with,@k@v10/30101294. ............you lost Shannon-chan as well...!!"'
20390: 'George@r@v07/30300081."......................................."'
20391: 'Battler@r@v10/30101295."It''s not like human lives have different weights.@k@v10/30101296. Whether it''s a baby or an old person, they''re all just as precious...!"'
20392: 'Battler@r@v10/30101297."......But still, the longer the life they had in front of them,@k@v10/30101298. ...the longer the future you''d have built together, ............the sadder their death is......!!"'
20393: 'Battler@r@v10/30101299."Aniki, you were engaged to Shannon-chan, weren''t you?@k @v10/30101300.You promised that you''d build a life and a home together in the future, didn''t you?!@k @v10/30101301..........Compared to how huge that future was, ...compared to how huge that happiness was,@k@v10/30101302. ......my pain doesn''t even come close...!!"'
20394: 'Battler@r@v10/30101303.".........No one would blame you for crying so, so much more...!!@k @v10/30101304.And yet, ...just because you''re like a big brother to us cousins,@k@v10/30101305. .........you force yourself to act like everything''s all OK......!!"'
20395: 'George@r@v07/30300082."..................Stop it, ...Battler-kun."'
20396: '@rGeorge was trying to make a calm smile.'
20397: '@r......But.........he couldn''t, any longer, stop a single hot tear from leaving a streak down his face.'
20398: 'George@r@v07/30300083."......How could I possibly...@v07/30300084.......not be sad...?@k@v07/30300085. .........I think of Shannon, and all the futures we imagined together.@k@v07/30300086. We talked of so many dreams, the hundred years of our human lives would never have been enough to make them all come true."'
20399: 'George@r@v07/30300087."......Of those dreams,@v07/30300088. not even the very first one,@v07/30300089. ............having her move into my family register... We couldn''t even have that...@k@v07/30300090.......so how could I possibly...@v07/30300091..........not be sad.........?"'
20400: 'Battler@r@v10/30101306."Compared to that, I, ......I...!!@k @v10/30101307.Like I said, I have no right to cry any more!@k @v10/30101308.When even you''re holding back, Aniki, what right do I have to shed any more tears?!"'
20401: 'George@r@v07/30300092."......We''re the same.@k@v07/30300093. ...Both of us feel the exact same sadness from losing the ones we love.@k@v07/30300094. .........So there''s nothing saying you don''t have the right to cry compared to me."'
20402: 'George@r@v07/30300095.".........And...@k@v07/30300096....there''s nothing saying...I have to hold back my tears...any longer either."'
20403: 'Battler@r@v10/30101309."...Aniki, ......Anikii...!!!@k @v10/30101310.UOOOooooHhhhhOOoOhhhgghhh!!"'
20404: 'George@r@v07/30300097."Shannon and I always talked about our future together...and now she''s dead.@k@v07/30300098. And my dad, he''s dead too.@k@v07/30300099. .........It hurts, ......it really hurts...@k@v07/30300100. ......uuuuuhuuhuuhuuuuuuughhhuuughh!!"'
20405: '@rAs Battler and George tightly hugged each other, they cried a waterfall of tears over each other''s shoulders for those people important to them...'
20406: 'Battler@r@v10/30101311."............Do you understand why I said that George-aniki is the most in pain...?"'
20407: 'BEATRICE@r@v27/30701800."I, ......I was listening, so I understand.@k@v27/30701801. ......The sadness is proportional to the length of time that would have been spent together in their lives after that..."'
20408: 'Battler@r@v10/30101312."......Of course, you can''t calculate it just like that though.@k@v10/30101313. .........We Humans aren''t like you witches.@k@v10/30101314. ......We have a finite time we''re alive to the moment we die, and we live it with our utmost strength."'
20409: 'Battler@r@v10/30101315.".........I can''t forgive anyone who makes light of that.@k@v10/30101316. ......Never mind someone who sneers at it and toys with it.@k@v10/30101317. ...A person like you, whose very concept of death is all screwed up, probably can''t understand that."'
20410: 'BEATRICE@r@v27/30701802."......................................."'
20411: 'Battler@r@v10/30101318."......It isn''t just the length of time we''d live afterwards.@k@v10/30101319. ......Sneering at the lives of people living with all their strength...@k@v10/30101320. That''s...what I can''t forgive the most."'
20412: 'Battler@r@v10/30101321."George-aniki has gone through his life hell-bent on doing his best.@k@v10/30101322. ...He must have shown up today with heroic determination in order that he could marry Shannon-chan.@k@v10/30101323. ......It''s completely different from me, a guy who was just feeling happy to be able to meet his cousins again for the first time in ages."'
20413: 'BEATRICE@r@v27/30701803."...B-.........But still - "'
20414: 'VIRGILIA@r@v30/33200508."Beato.@k@v30/33200509. For now, stay silent and listen."'
20415: 'BEATRICE@r@v27/30701804."............M-...mm."'
20416: 'Battler@r@v10/30101324.".........In a way, I do understand where you''re coming from.@k@v10/30101325. ...You say that you need to continue murdering according to that weird epitaph for your own resurrection."'
20417: 'Battler@r@v10/30101326."......So if I keep the circumstances of your position in mind,@k@v10/30101327. ......I can just barely understand your murders.@k@v10/30101328. ......Because for you, that is a necessary action.@k@v10/30101329. ......In that case, all further unnecessary actions are your own meaningless cruel hobby."'
20418: 'Battler@r@v10/30101330."......In other words, if killing six people for the first twilight is a "necessary action" for you,@k@v10/30101331. ...all that show of crushing their faces and splitting their stomachs and stuffing them full of sweets is your own, completely unnecessary,@k@v10/30101332. preference for cruelty.@k@v10/30101333. .........I absolutely cannot forgive this aspect of you."'
20419: 'BEATRICE@r@v27/30701805."........................m...mm......"'
20420: 'Battler@r@v10/30101334."When Auntie Rosa was repeatedly killed in horrible ways,@k@v10/30101335. ......you said, "she''ll be brought back to life in the end, so it doesn''t matter how she kills her",@k@v10/30101336. ...or something like that, I hear.@k@v10/30101337. VIRGILIA told me."'
20421: 'BEATRICE@r@v27/30701806.".........That was...@v27/30701807....well...@v27/30701808.umm........."'
20422: 'Battler@r@v10/30101338."That idea that you can kill them as many times as you want, as long as you bring them back to life in the end,@k@v10/30101339. is a completely unnecessary action of toying with a life, isn''t it?"'
20423: 'Battler@r@v10/30101340.".........If you''re going to kill them, get it over with!@k @v10/30101341.Don''t toy with them!!@k @v10/30101342.If you aren''t going to kill them, then don''t tease them!!@k @v10/30101343.You''re taking advantage of the fact that you can do as you will with people''s lives, and you''ve forgotten the sanctity of life.@k@v10/30101344. So I can''t accept you...!"'
20424: 'Battler@r@v10/30101345."I definitely can''t accept as my opponent a person who doesn''t know the weight of a life, and the sadness when that life is lost!"'
20425: 'VIRGILIA@r@v30/33200510."...............That is why the Endless Magic is known as a black art.@k@v30/33200511. ...An Endless Witch has no concept of the finite.@k@v30/33200512. ......They have no concept of the finite, of the end that is implied by breaking and killing."'
20426: 'VIRGILIA@r@v30/33200513."...For that reason, Endless Witches sometimes treat the gap between life and death as if it was a Chinese jump rope,@k@v30/33200514. and start jumping back and forth over it."'
20427: 'VIRGILIA@r@v30/33200515.".........That is a very, very frightening thing.@k@v30/33200516. That is why, as an Endless Witch, and out of my own desire,@v30/33200517. I never reached your level."'
20428: '@rVIRGILIA had told Beato that countless times before.'
20429: '@rBut Beato had been too young to obediently listen to those words.@k She had been too wild.@k ...She had been possessed by that...detestable pleasure.'
20430: 'BEATRICE@r@v27/30701809."......I had always been told not to break vases.@k@v27/30701810. ......But that''s what made me want to break them someday."'
20431: 'BEATRICE@r@v27/30701811.".........Then, when I gained the Endless Magic,@k@v27/30701812. ...and I learned that I could fix it back to normal no matter how much I broke it,@k@v27/30701813. ......I was surprised at how fun it was to break a vase..."'
20432: 'VIRGILIA@r@v30/33200518."That is called the forbidden honey.@k@v30/33200519. People are not captivated by what''s inside.@k@v30/33200520. They are captivated by the lock that seals it.@k@v30/33200521. .........It truly is deplorable."'
20433: 'Battler@r@v10/30101346.".........I want to ask you, VIRGILIA.@k@v10/30101347. Why does this thing called the Endless Magic exist?@k@v10/30101348. ...For what purpose does it exist in this world?"'
20434: 'VIRGILIA@r@v30/33200522."It is not limited to the Endless Magic.@k@v30/33200523. ...All magic exists to bring happiness to the human world."'
20435: 'VIRGILIA@r@v30/33200524."......After everything that has happened, it may be difficult for you to believe, Battler-kun, ......but we witches train in order to bring blessings to the human world,@k@v30/33200525. to become a bridge between humans and those who are not human."'
20436: 'Battler@r@v10/30101349_b."......How the hell does reviving the dead and torturing them to death over and over again help the human world?"'
20437: 'VIRGILIA@r@v30/33200526."When a vase that is an important memento is broken,@k@v30/33200527. if by fixing it everyone will regain their smiles, I would repair it with magic as many times as necessary.@k@v30/33200528. However, I would not be fixing it in order to break it again.@k@v30/33200529. ......I would be reviving it to give humans happiness."'
20438: 'Battler@r@v10/30101350."In that case,@k@v10/30101351. ............Beato.@k@v10/30101352. You fail as an Endless Witch."'
20439: 'BEATRICE@r@v27/30701814."..............................h......mmm..."'
20440: 'Battler@r@v10/30101353."......There''s something that''s just come to me.@k@v10/30101354. .........Why do I keep going on with this strange game against you?"'
20441: 'Battler@r@v10/30101355."......Maybe this isn''t a game to make me submit.@k@v10/30101356. ......Couldn''t it be a test for you to be accepted as an Endless Witch, in its true meaning?"'
20442: 'BEATRICE@r@v27/30701815."...I, .........I don''t know about that.@k@v27/30701816. ...The reason I proposed this game to you was, umm, ......simply as a way to kill time...@k@v27/30701817. There was no one''s ulterior motive."'
20443: 'Battler@r@v10/30101357."Just now, I heard the definition of a witch from VIRGILIA.@k@v10/30101358. By that definition, you, Beato,@k@v10/30101359. are not even a witch.@k@v10/30101360. You''d be an apprentice who''s in the middle of her training, and who misunderstands her own power."'
20444: 'Battler@r@v10/30101361."......This was supposedly a fight between a witch and a human.@k@v10/30101362. In that case, someone like you, who isn''t a witch, is not qualified to be my opponent.@k@v10/30101363. .........Understand?"'
20445: 'BEATRICE@r@v27/30701818."......I am still...@v27/30701819..........only an apprentice,@v27/30701820. ......you say......@k@|@y@v27/30701821. Then, when will I be accepted as your opponent once again?@k@v27/30701822. ......When can we resume this game?"'
20446: 'Battler@r@v10/30101364."..................Who knows.@k@v10/30101365. ...At the very least, it isn''t now.@k@|@y@v10/30101366. ......When you fully understand what I''ve said, and become a real witch,@k@v10/30101367. ...I will probably accept you as my opponent in this game once more."'
20447: 'BEATRICE@r@v27/30701823."I, I can''t understand if you say it so abstractly like that...@k@v27/30701824. Clearly tell me what I should do to earn your forgiveness..."'
20448: 'Battler@r@v10/30101368."No, I''ve said enough.@k@v10/30101369. You think about the rest.@k@v10/30101370. .........I''ve said everything I want to say.@k@v10/30101371. ...If you can''t understand it, try talking with VIRGILIA and Ronove.@k@v10/30101372. ...A brat like you should start off by listening to what the adults say."'
20449: 'Battler@r@v10/30101373.".........VIRGILIA.@k@v10/30101374. I will suspend the game for now.@k@v10/30101375. Now that Ronove has stepped down as representative,@k@v10/30101376. all we can do is wait for Beato to gain the qualifications of a proper opponent."'
20450: 'VIRGILIA@r@v30/33200530."......Understood.@k@v30/33200531. ......Until Beato has been accepted as having gained those qualifications, the game will proceed without an opponent.@k@v30/33200532. Is that alright with you too, Beato?"'
20451: 'BEATRICE@r@v27/30701825."...I, ......I have no objections.@k@|@y@v27/30701826. .........I want time, and a place where I can think at a leisurely pace.@k@v27/30701827. ...May I take my leave now?"'
20452: 'Battler@r@v10/30101377.".........Yeah, sure."'
20453: 'BEATRICE@r@v27/30701828."...Well then, see you...later."'
20454: 'Battler@r@v10/30101378."Wait.@k@v10/30101379. ......Don''t make that dejected face."'
20455: 'BEATRICE@r@v27/30701829."........................Sorry about that.@k@v27/30701830. Letting everything inside my heart show up on my face is part of my personality.@k@v27/30701831. I cannot deceive."'
20456: 'Battler@r@v10/30101380."In that case, there''s hope for you yet.@k@v10/30101381. .........Let me promise you one thing.@k@v10/30101382. In this game with you, I might win, and I might lose.@k@v10/30101383. ......It''s also possible that it''ll be a victory by default for me if you don''t come back."'
20457: '@rAt that point, Battler stopped talking for a second.@k@r...Then he spoke forcefully.'
20458: 'Battler@r@v10/30101384.".........However, I definitely won''t be the one to step down.@k@v10/30101385. I definitely won''t give you a victory by default.@k@v10/30101386. ......I will keep on waiting here, for you to sit there again as my worthy opponent."'
20459: 'Ronove@r@v31/33100560."......Battler-sama..."'
20460: 'BEATRICE@r@v27/30701832."...............Thank you,@k@v27/30701833. Battler.@k@|@y@v27/30701834. ...I will definitely come back and be accepted by you."'
20461: '@rBeato showed him a very slightly hopeful smile, and disappeared.'
20462: '@r...Looking at that expression, Battler strongly believed that her face could tell no lies...'
20463: '@rThe seven survivors returned to the guesthouse once again.@k@rBy now, it was clear that those who went outside would not be able to return alive.'
20464: '@rRudolf''s group had gone out holding two guns and one master key.@k But those had been lost.'
20465: '@rIt was more than clear by now that they had been stolen by the culprit.'
20466: '@rSince the windows were closed with the shutters, they wouldn''t open even if the culprit had the master key.'
20467: '@rThey sealed the front door and all other doors to the outside with chains,@k and further blocked them with sofas and tables.'
20468: '@rEven if the culprit decided to break in through violent means, it wouldn''t be easy for them.'
20469: 'Krauss@r@v02/30800284."......At this point, the typhoon may actually be fortunate.@k@v02/30800285. If it were clear outside, it might have been possible for them to set fire to the guesthouse."'
20470: 'Eva@r@v05/31000819."If there wasn''t a typhoon in the first place, the boat would have arrived before noon.@k@v05/31000820. I''m not sure you can call that a cloud''s silver lining."'
20471: 'Natsuhi@r@v03/30900156."......Eva-san, how are you feeling physically?@k @v03/30900157.Please, try to take it easy."'
20472: 'Eva@r@v05/31000821."Thank you.@k@v05/31000822. ...I still have a temperature, but now isn''t the time to be saying things like that.@k@v05/31000823. ......Now is not the time to be stuck in bed, for the children''s sake as well."'
20473: '@rAfter crying so much in front of Hideyoshi''s body,@k Eva had now gained a strong self-awareness that she was a mother, and her expression conveyed a strong will.'
20474: '@r...Actually, her fever still hadn''t gone down.'
20475: '@rAnd she was aware of that.@k Whenever she wasn''t galvanizing herself, she felt the fever starting to make her mind hazy again.'
20476: '@rBy this point, the first floor was a final line of defense made by Krauss, Natsuhi, and Eva.@k@rThe children and the guest, Nanjo, had been strongly warned not to carelessly come downstairs.'
20477: '@rIf the culprit used a ladder or something, it probably wouldn''t be impossible for them to attack from upstairs.'
20478: '@rBut it wouldn''t be easy for them to break those sturdy shutters from such an unstable position.@k It was comparatively safer upstairs compared to downstairs.'
20479: '@rBattler and George had hoped to remain downstairs as well, to fight in the worst case scenario, but Eva had rejected that.'
20480: '@rIn her mind, George was now her only family.@k@rIt seemed that she didn''t even want to expose him to the danger of coming downstairs to the first floor.'
20481: '@rKrauss and Natsuhi could also understand that feeling.'
20482: '@r......A great deal of time had now passed since they once again barricaded themselves in.'
20483: '@rIn the cousins'' room upstairs, Battler, George, and Jessica were sitting dazed,@k their ears not even registering the TV that had been left on.'
20484: '@rFor a while, Nanjo had been with them, and had tried to send them words to cheer them up,@k but when he realized that he might actually be having the opposite effect, he disappeared into his own upstairs room.'
20485: '@rGeorge kept looking dazedly at the photographs inserted in his notebook.'
20486: '@r......They were from that time he had taken a vacation to Okinawa with Shannon.'
20487: '@rShannon''s happy smile was contained in those photographs.'
20488: '@r......George could remember the temperature and the humidity, the warmth and strength of the wind,@k and even what he had been talking about with her at the time those photos had been taken, as clearly as though it had been yesterday.'
20489: '@rSo to George, they weren''t simply photos,@k but a door to bring back warm memories...'
20490: '@rIn this room, even though the sound of the typhoon and the TV should have entered George''s hearing,@k ......it was the scenery of Okinawa he had seen with her, and her laughing voice, that reached his eyes and his ears...'
20491: '@rAfter meeting Shannon, George had made the decision to be reborn.'
20492: '@rHe had sworn to separate himself from the timid person he had once been:@k easily caught up in the atmosphere, unable to refuse a request, and easily used by those around him.'
20493: '@r......He had resolved himself to become a strong man who would make her life even more joyous.'
20494: '@rSo.@k ...If he hadn''t met Shannon,@k ......the man called Ushiromiya George would probably have lived a very different life.'
20495: '@rAnd the George of that different life surely wouldn''t have been as excellent a man as he now was.'
20496: '@rThe way he was now, he was for the sake of Shannon.@k ......But if that same Shannon was now gone,@w500. ...he found himself wondering why he exists.'
20497: '@rIsn''t it completely meaningless?'
20498: '@r...A deep, deep sadness, as though he himself had become empty.'
20499: '@rThat feeling had tormented him the whole time.@k ......However, until Battler had told him, he hadn''t been aware of the feeling himself.'
20500: '@r......He finally remembered...that he should have cried much, much more.'
20501: '@rSo he had cried.@k Just like Battler, he had cried himself dry.'
20502: '@r......By now, his eyes were bright red and swollen, and he could not cry any more.@k So George did his best to change his way of thinking.'
20503: '@rHe decided to think that he was not meaningless, ...that he should be grateful to Shannon for giving him such a character.'
20504: '@rDead lives are not revived.@k He would have to get over being separated from his beloved.'
20505: '@rIf he were to come after Shannon by killing himself, she would surely be deeply dejected.'
20506: '@r......It would be the same the other way around, too.@k If he died, and Shannon chased after him, throwing away her own life, he wouldn''t be able to forgive himself.'
20507: '@r......So he chose to surpass his emotions of sadness and anger,@k .........and decided to thank her.'
20508: '@rMeeting Shannon had made his days rich and full,@k ...and had taught him the meaning of working hard for other people''s sakes.'
20509: '@rAs a result, she had shaped him into the person he had wanted to be.@k@r...He thought he should thank her for that.'
20510: '@rBy doing that, he tried to quell his sadness.@k@rBut each time he did, he remembered Shannon''s smile...'
20511: '@r.........He knew it, logically.'
20512: '@rHe understood that grieving any more than this would only make her grieve in heaven,@k ......yet he couldn''t stop his sadness...'
20513: 'Battler@r@v10/30101387."Why...@v10/30101388.......does people dying...@v10/30101389....make us this sad..."'
20514: '@rBattler muttered.@k@r...It was as though he was speaking on behalf of all humans.'
20515: '@rHe probably hadn''t been asking anyone, but Jessica answered.'
20516: 'Jessica@r@v04/30200107."......Partings are always sad, no matter what they''re like."'
20517: 'Jessica@r@v04/30200108."...But, when, for example, the person is old, or there''s some time it''s going to happen,@k@v04/30200109. ...when it''s expected in advance, and you know it''s a farewell that must come sooner or later,@k@v04/30200110. ...you can spend a long time softening the blow of that sadness.@k@v04/30200111. ......Sudden misfortune is probably sad...because you aren''t allowed even that..."'
20518: 'Battler@r@v10/30101390."...............I see, yeah.@k@v10/30101391. ...Sure, if they get sick or something, and end up bedridden in a hospital for several years, you might be able to ready yourself for it bit by bit,@k@v10/30101392. ...but when it happens suddenly some day, you don''t have that much time."'
20519: 'Jessica@r@v04/30200112."...The sadness which you should normally spend several years softening closes in on you all at once.@k@v04/30200113. .........No wonder it''s tough.@k@v04/30200114. ......Sometimes, it might even cause a sadness great enough to leave a scar for life..."'
20520: 'Battler@r@v10/30101393."......Enough to leave a scar for life, ...you say."'
20521: 'Jessica@r@v04/30200115."......It''s like Grandfather''s occult hobby.@k@v04/30200116. That was what they whispered about it.@k@v04/30200117. ......That maybe BEATRICE was his lover, who died a long time ago, and he was so sad that he couldn''t pull himself together."'
20522: 'Jessica@r@v04/30200118."......And that''s why he started sacrificing the rest of his life to research of the occult, in order to revive the dead.@k@v04/30200119. ......That''s what they said."'
20523: 'Battler@r@v10/30101394."In that case, Grandfather succeeded in that miracle in his last moments.@k@v10/30101395. ......The culprit would be the revived BEATRICE, with Grandfather being reunited with her at the moment he was killed.@k@v10/30101396. ......Pretty ironic that he revived her, only then to be killed by her."'
20524: 'George@r@v07/30300101."............Even so, Grandfather was probably able to meet her.@k@v07/30300102. ...He gambled half of his life, and even though it was only for a short time,@k@v07/30300103. he was probably reunited with the woman he wished to see once again."'
20525: 'Battler@r@v10/30101397."...Except he got totally roasted.@k@v10/30101398. Probably wanted a bit more than that out of half a life''s research."'
20526: 'George@r@v07/30300104."I wouldn''t say that.@k@v07/30300105. .........Even if it was only for an instant,@k@v07/30300106. ......Grandfather must have been happy to be reunited with the woman he loved."'
20527: 'George@r@v07/30300107.".........Even if his sin of defying life''s providence was punished by God,@k@v07/30300108. and his body was burnt and sent down to hell,@k@v07/30300109. ...and even if the reunion he got in return only lasted a very short time..."'
20528: 'Jessica@r@v04/30200120."George nii-san......"'
20529: 'George@r@v07/30300110."......I wouldn''t care if I met with the wrath of God and had my body burned.@k@v07/30300111. .........Even if it was just for a short amount of time,@v07/30300112. ......if I could revive Shannon again,@k@v07/30300113. ..................I would sacrifice the rest of my life to the same research as Grandfather."'
20530: 'George@r@v07/30300114."......Five minutes would be enough,@v07/30300115. ......I just want to talk with Shannon again...@k@v07/30300116. ......Even one minute would be fine......@k@v07/30300117. ......In exchange, ...I wouldn''t mind......sacrificing the rest of my life......!"'
20531: 'Battler@r@v10/30101399.".........Aniki......"'
20532: '@rWhen Battler and Jessica realized that their pointless discussion was hurting George, they had no choice but to shut their mouths...'
20533: '@r......George directed his thoughts at Kinzo''s life:'
20534: '@rI saw him sacrifice half of his life to research that no one could understand.'
20535: '@r......And, on the last day of his life, he revived the person he loved most,@k ......and probably succeeded in his reunion in his final moments.'
20536: '@rI don''t know how much time they were able to spend together.@k ...I don''t know whether they were given an hour, ...or just five minutes.'
20537: '@rHowever, ......in that moment, all of that time he had sacrificed for his research must have been rewarded.@k ...Even though he spent decades to gain it, that small amount of time must have been enough to reward him.'
20538: '@rUntil today, I never believed in the occult or magic or anything.@k@rSomewhere in my heart,@w250. ...I even made fun of Grandfather''s research as nothing more than an indulgence.'
20539: '@rHowever,@w333. ......I won''t make fun of it anymore.@k@r...No, to the contrary, I strongly believe that it does exist.'
20540: '@r...If that power of belief can become miracles,@k I''ll probably throw away all of my studies up until today,@k and spend the rest of my life from today onwards studying magic.'
20541: '@r.........Give me the power of magic.'
20542: '@r...And...a miracle which lets me meet Shannon again...'
20543: 'George@r@v07/30300118."....................................@k@v07/30300119. ......Haha, ...ha.@k@v07/30300120. ...Sorry, you two.@k@v07/30300121. I must be going mad.@k@v07/30300122. ......If you could revive the dead with magic,@v07/30300123. ......people would probably be studying it everywhere around the world."'
20544: 'George@r@v07/30300124."...But things like that don''t exist in reality.@k@v07/30300125. No one studies it.@k@v07/30300126. .........That''s because...they know...that the dead can''t be brought back with magic."'
20545: 'George@r@v07/30300127."............Sorry for saying such weird things.@k@v07/30300128. It''s my fault that the atmosphere here has gotten so strange.@k@v07/30300129. ...Sorry for making you worry about me, even though this is hard on everybody."'
20546: '@r...Even though I did it to divert myself from my sadness, maybe I did say something strange.'
20547: '@rIf I keep talking about something so weird, I''m sure it won''t heal their sadness...'
20548: '@rBut, even so, ...that doesn''t mean that I can withstand this silence.'
20549: 'George@r@v07/30300130."......I''ll go downstairs, and get another cup of coffee.@k@|@y@v07/30300131. ......My mother is very particular about how to make a cup of coffee.@k@v07/30300132. Does anyone want a refill?"'
20550: '@rBattler-kun and Jessica-chan lightly shook their heads.@k@rWithout being any more persistent than that, I took my mug and left the room.'
20551: '@rI did visit Doctor Nanjo''s room to ask whether he wanted any more coffee as well,@k but he too said that he didn''t want any more.'
20552: '@r......It seemed as though my mother''s orthodox method of making coffee wasn''t universally appreciated.'
20553: '@rOne time, I had Shannon drink some that I brewed by that method,@k ......but she told me that while it was delicious, it was a little strong,@k if I remember her words...'
20554: 'George@r@v07/30300132_1."............Shannon........."'
20555: '@rIt''s no good...@k ......Even though I left the room to change my mood,@k ...that image of Shannon''s face that''s filling my head hasn''t faded in the slightest...'
20556: '@rThe fun days I shared with her were becoming more and more vivid,@k ............and I felt saddened that I was not even allowed to see her dead face.'
20557: '@rAccording to our parents, it seems as though she was killed with something like a gun or spear.'
20558: '@r...I''m sure they were just trying to console me, ......but they had said that her face in death had been very beautiful and peaceful.'
20559: '@rI wonder if she''s...wearing the engagement ring I gave her last night?'
20560: '@r......If she accepted my engagement, she should have it on the ring finger of her left hand...'
20561: '@rLast night, our heads were both full of each other, and we weren''t composed at all.'
20562: '@rShannon had accepted the engagement semi-boldly,@k but she might have regretted that as a rash action once she cooled her head.@k She might have taken the ring off.'
20563: '@r......I wonder if she has the ring on now.'
20564: '@r......I at least want to be sure of that much.@k@rI want to know...her final feelings......'
20565: '@rHowever, ......even if I do check that, ...it''s not as if she''ll be revived.'
20566: '@r...............I wonder what will happen to her body.@k@rAfter the autopsy, ......it will probably be immediately cremated.'
20567: '@rThen, I''ll never be able to see her face, ...even her dead face, for all eternity...'
20568: 'George@r@v07/30300133."..................@k@v07/30300134. .........Haha, ...because of the shock of losing Shannon,@v07/30300135. ......am I going a little crazy...?"'
20569: '@rI don''t want......Shannon''s body to be burned.@k@rIf she''s burned, she''ll turn to ash, ......and never again will it be possible for her to revive.'
20570: '@rThey say that cremation is disliked in Western tradition.@k@r......Because on the day of resurrection, there would be no body to revive.'
20571: '@rBecause of that, it seems that great criminals in Western history were often cremated after execution as a punishment,@k and their ashes were sometimes scattered in rivers and such...'
20572: '@rIn other words, to Western people, death is nothing more than a sleep until the resurrection.@k It is essential that the corpse is left after death.'
20573: 'George@r@v07/30300136."In other words,@v07/30300137. ......that''s because Western people...@v07/30300138....knew of the existence of...@v07/30300139....a miracle to revive the dead.@k@v07/30300140. .........But that miracle didn''t exist in Japan, so we burn them."'
20574: '@rNow I understand.@k ...I understand why Grandfather idolized the Western occult.'
20575: '@rFrom the beginning, it had all been only for that reason.@k ...Just to revive the person dear to him, ...Grandfather spent the rest of his remaining life researching the Western occult.'
20576: '@r.........The situation surrounding us right now was abnormal.'
20577: '@rGrandfather had revived his beloved BEATRICE.'
20578: '@r...And that BEATRICE had carried out a terrible serial murder,@k with chains of locked rooms that were impossible without the use of magic.'
20579: '@r......The Golden Witch, BEATRICE.@k@rThe incarnation of the miracle of the Western occult.@k@r.........And also, the culprit who killed Shannon......'
20580: '@rI should hate that being, ............and yet, for some reason, I want to cling to the hope she represents.'
20581: '@rI wonder if she could use that miraculous magic that Grandfather spent his life espousing...to revive Shannon...'
20582: '@rAccording to the Ushiromiya family legend, Grandfather met with her long ago, and was given a vast quantity of gold.'
20583: '@r...Then if I also met her,@k ......instead of gold, would she give me Shannon''s life?'
20584: '@rIn return, she could impose any kind of devil''s contract.@k@rFor that, I would sacrifice all of my remaining life...'
20585: '@rGeorge probably couldn''t have believed or noticed that, ...right behind him,@k ......the witch herself stood, listening to his voiceless wish.'
20586: '@rBEATRICE had been listening to everything George and the others had to say since their discussion just now in the cousins'' room.'
20587: '@r......Battler had told her that she didn''t know the weight of a human''s life,@k ......and wanting to understand that in her own way, she had stealthily visited, and listened to their discussion.'
20588: 'BEATRICE@r@v27/30701835."........................@k@v27/30701836. ......You say that is your wish...?@k @v27/30701837.If I could grant that, would I be accepted as a witch...?"'
20589: '@rBeato looked at the palms of both of her hands.'
20590: '@r...She had handed over most of her previously surging magic power when the new witch had succeeded the name of Endless Witch.'
20591: '@rOf course, even now her magic power still made her worthy of being called a witch,@k ...but it did not even compare to her previous strength.'
20592: 'BEATRICE@r@v27/30701838."......Hmph.@k@v27/30701839. Even without the Endless Magic, I am a Great Witch whose name has thundered through a thousand years.@k@v27/30701840. Reviving the dead is no trouble at all."'
20593: '@rInside her head, she thought about several magical methods for reviving the dead.'
20594: '@r......Even magic that she could do easily in the past would be difficult with her current magic power.'
20595: '@rShe thought of something, then clicked her tongue, and repeated this several times.'
20596: '@rIn the end, ......she finally thought of a single spell.'
20597: '@rBut that was a spell that she couldn''t use by herself.@k@rIt was a spell that witches with weak power used, that relied on the aid of others.'
20598: '@r...In the past, Beato had looked down upon that type of magic.'
20599: '@rTherefore, she frantically tried to think if there wasn''t any other possible spell,@k .........but in the end, she couldn''t think of one, and slumped over in self-derision.'
20600: '@rAnd then, ......careful not to surprise him, she softly called out.@k Softly, to George''s heart...'
20601: 'BEATRICE@r@v27/30701841.".........Ushiromiya George.@k@v27/30701842. ...Can you hear my voice...?"'
20602: 'George@r@v07/30300141."......I can hear.@k@v07/30300142. ......Who are you...?@k @v07/30300143.Are you really the witch, BEATRICE...?@k @v07/30300144....Or else, are you an illusion created by my sadness...?"'
20603: 'George@r@v07/30300145.".........If it''s the former, I want you to hear my wish.@k@v07/30300146. ...And if it''s the latter, just leave me alone..."'
20604: '@rConversations in the world of the mind are a lot like those in a dream.'
20605: '@rWhen you dream, haven''t you ever had the experience...@kof casually accepting something that would have been absurd in the real world?'
20606: '@r......The conversation in this world was like that.'
20607: '@rSo even though a witch appeared and started talking to George, he was not surprised...'
20608: 'BEATRICE@r@v27/30701843."Mm.@k@v27/30701844. ......I am...the Golden Witch, BEATRICE.@k@v27/30701845. .........Normally, you and I would not be able to talk together like this.@k@v27/30701846. ...However, you are strongly conscious of me, and wish to have a discussion,@k@v27/30701847. ...so both of our channels are able to match like this."'
20609: 'George@r@v07/30300147."...............The person who killed Shannon...@v07/30300148.I don''t care if it was you, or someone else taking on your name.@k@v07/30300149. ......As long as you exist as a real witch."'
20610: 'George@r@v07/30300150."............I would pay any compensation.@k@v07/30300151. ...If you desire my life, you can take it right now.@k@v07/30300152. ......Please, I want you to bring Shannon back to life...@k@v07/30300153. .........If that''s impossible, then at least, I would like just to be allowed to talk to her for a short while......@k@v07/30300154. ......Please........."'
20611: 'BEATRICE@r@v27/30701848.".........I require no compensation.@k@v27/30701849. I shall grant that wish."'
20612: 'George@r@v07/30300155."...Really......?@k @v07/30300156.You''ll really bring Shannon........."'
20613: 'BEATRICE@r@v27/30701850."Mm.@k@v27/30701851. ......However, my current magic power is not sufficient to use resurrection magic.@k@v27/30701852. ...Therefore, I must rely on your help."'
20614: 'George@r@v07/30300157.".........If there''s something I can do, I''ll do anything.@k@v07/30300158. ...Even if that means taking my heart out right here and now, I will not hesitate..."'
20615: 'BEATRICE@r@v27/30701853."...I''m telling you that I don''t require something like that.@k@v27/30701854. ............I may cast the spell.@k@v27/30701855. Then, a gap would open in the door to Hades."'
20616: 'BEATRICE@r@v27/30701856."...But as I am now, I do not have the power to bring Shannon''s soul up through that gap.@k@v27/30701857. .........However, if it were you, who has strong feelings for Shannon,@k@v27/30701858. you should be able to change those feelings into magic, and bring her soul out without fail."'
20617: 'BEATRICE@r@v27/30701859."......What do you say?@k@v27/30701860. Will you help me...?"'
20618: 'George@r@v07/30300159."...Of course I will.@k@v07/30300160. .........If Shannon''s life will be revived,@v07/30300161. ......I am not afraid to lose everything......!"'
20619: '@rGeorge''s fists shook in silence.'
20620: '@r...Then he slowly regained consciousness.'
20621: '@rHe had been absentmindedly standing near the window in the hall the whole time, his mug still in his hand...'
20622: '@rAnd......@w333.............the witch from his dream......was still there.'
20623: 'George@r@v07/30300162."Wh-......what the... .........I-it isn''t......a dream........."'
20624: 'BEATRICE@r@v27/30701861."......Be quiet.@k@v27/30701862. I am very fragile now.@k@v27/30701863. If any more Humans appear now, I will not be able to preserve this form.@k@v27/30701864. ...I shall grant your wish, so stay silent for now.@k@v27/30701865. ...Is that alright?"'
20625: '@rGeorge covered his mouth with both hands, forcefully nodding several times.'
20626: '@rAs he did, he almost dropped the mug he was holding.'
20627: '@rGeorge frantically juggled it around and caught it.'
20628: '@r...He was afraid that if it fell to the floor and made a loud sound,@k the witch''s form might disappear like a bubble popping.'
20629: '@rHe softly set the mug on the floor, ...and stared once again at the witch in front of him.'
20630: '@r.........Her form didn''t disappear.@k It wasn''t a dream......'
20631: 'BEATRICE@r@v27/30701866."Come, let us go to the parlor where Shannon sleeps.@k@v27/30701867. With the power of your feelings, we will bring back her soul."'
20632: 'George@r@v07/30300163."Y-you say go, but...how...?@k@v07/30300164. My mother and the others are downstairs.@k@v07/30300165. There''s no way they''d let me go outside.@k@v07/30300166. ......And, didn''t you just say that you wouldn''t be able to preserve your form if another Human appeared?"'
20633: 'BEATRICE@r@v27/30701868."......Come to think of it, that is true.@k@v27/30701869. So, Krauss and the rest are downstairs.@k@v27/30701870. ...In that case, we definitely cannot go down.@k@|@y@v27/30701871. ......Well then, we just need to go to the mansion without going downstairs, right?@k@v27/30701872. It''s simple."'
20634: '@rBeato laughed, as though she had thought of a pleasant prank.'
20635: '@r......And with her golden pipe, she lightly tapped a window with its shutter closed.'
20636: '@rWhen she did, three gold butterflies appeared from the pipe and opened the lock on the window as though melting it.'
20637: '@rThen the window opened without a sound.'
20638: '@rThe shutter beyond it was exactly the same.@k@rThe clasp unset itself, also without making a sound, and it quietly opened.'
20639: '@rThe window opened, exposing the wind and rain outside the mansion.@k ...Perhaps because of the direction or something related to the construction of the building, the wind did not blow inside.'
20640: '@rBecause of that, for a while,@k George felt as though this entrance opening to the outside was a dream or illusion, and he couldn''t accept it as real.'
20641: 'BEATRICE@r@v27/30701873."Come, let us go.@k@v27/30701874. Come with me."'
20642: '@rBeato gently floated upwards.@k It was a natural action, like that of a diver enjoying an underwater stroll.'
20643: '@r......It made it easy to believe that if you acted like she did,@k you too might be able to float in the sky just as though you were swimming in the water.'
20644: '@r...No, George did believe that.'
20645: '@r......So without thinking, just as she had done, he also...@w250....gently...@w250....as though swimming in the water...he moved his feet......'
20646: 'George@r@v07/30300167."......ah, ............aaaaaaahh........."'
20647: 'BEATRICE@r@v27/30701875."Hoh.@k@v27/30701876. ...Not bad.@k@v27/30701877. So you learned how to dance through the sky faster than I could explain it."'
20648: '@rGeorge was shocked to find himself floating in midair like he was swimming.'
20649: '@r...Of course, Beato was also shocked that George, who should have been unacquainted with magic, had learned how to do that just by instinct.'
20650: 'George@r@v07/30300168.".........To be able to...@v07/30300169....fly in the air,@v07/30300170. ......swim in the air......"'
20651: 'BEATRICE@r@v27/30701878."...You must not think of the logic.@k@v27/30701879. Accept it as a natural thing.@k@v27/30701880. ......You must not think back upon the Human doctrines, such as those from Newton and Einstein."'
20652: 'BEATRICE@r@v27/30701881."Especially when flying high in the sky.@k@v27/30701882. ...Inexperienced witches sometimes fall."'
20653: 'George@r@v07/30300171."...I, ...I accept it as true...@k@v07/30300172. I accept it as true......"'
20654: '@rGeorge repeated those words over and over.@k@r......He must not deny magic, no matter what.'
20655: '@rTo deny that would be the same as to throw away what might be...@khis first and last chance to revive Shannon.'
20656: '@rHowever, compared to Beato, who was elegantly drifting like smoke, George''s movements were clearly similar to someone underwater.'
20657: '@r...Therefore, if he didn''t make a movement like kicking his feet in water every once in a while, he would be slowly dragged down by the force of gravity.'
20658: 'BEATRICE@r@v27/30701883."I shall praise this as being a better performance than the first time I danced in the sky.@k@|@y@v27/30701884. ......Here we go.@k@v27/30701885. Come with me."'
20659: '@rBeato beckoned to George, and gently flew into the stormy sky.'
20660: '@r......It was just like a scene from a fairy tale.'
20661: '@rThe scene unfolding before George''s eyes felt entirely like an extension of his dream.'
20662: 'George@r@v07/30300173."......Being able to fly is......incredible, ......but so is the wind and the rain..."'
20663: 'BEATRICE@r@v27/30701886."What''s this? Are the wind and rain tormenting you...?@k @v27/30701887.......I could teach you magic to block against that,@k@v27/30701888. but it may be too early for you, and it may be a misuse of time right now."'
20664: 'George@r@v07/30300174."........................Yes.@k@v07/30300175. ...The magic I need...isn''t that."'
20665: '@rWithout losing to the wind and rain, George wore a strong-willed gaze.'
20666: 'BEATRICE@r@v27/30701889."The mansion is coming into sight.@k@v27/30701890. ...Hold out just a little longer.@k@v27/30701891. If you fall now, you''ll hit the bushes in the rose garden."'
20667: '@rThe undulating rose garden was spread beneath the witch and George''s gazes.'
20668: '@rThis fantasy-like scene no longer surprised George.'
20669: '@rOnly the gradually approaching mansion was reflected in his eyes.'
20670: 'George@r@v07/30300176."Shannon, .........wait for me...@k@v07/30300177. ......I will definitely...revive you......!"'
20671: '@rMeanwhile...@k......the cruel new witch could be seen staring at the guesthouse from a different location.'
20672: 'EVA@r@v34/33300657."...............Now, all that''s left is the seventh and eighth twilights.@k@v34/33300658. Just two more, and my obligation to that predecessor hag is finished.@k@v34/33300659. .........I''ll kill Krauss and Natsuhi.@k@v34/33300660. Together like a happy couple."'
20673: 'Chiester410@r@v36/33500030."Nihi.@k@v36/33500031. How are the targets nyeh?"'
20674: 'Chiester45@r@v35/33400018."......In the lobby on the first floor of the guesthouse, both targets and Ushiromiya Eva acquired.@k@v35/33400019. Measuring anti-magic power.@k@v35/33400020. Data link to 410."'
20675: 'Chiester410@r@v36/33500032."410, data received.@k@v36/33500033. Anti-magic power is extremely low.@k@v36/33500034. If Eva just goes outside, they''re tuna and abalone on a chopping board.@k@v36/33500035. Nihihihihi...!"'
20676: 'Chiester45@r@v35/33400021."What would you ask of us, Great Lady BEATRICE?@k@v35/33400022. If you give the order, we will snipe right away...!@k @v35/33400023.Please, your orders...!"'
20677: 'EVA@r@v34/33300661."...You guys reaally are convenient furniture.@k@|@y@v34/33300662. Very different from old, second-hand furniture, which only has enough talent to gouge corpses.@k@v34/33300663. Right?"'
20678: 'Lucifer@r@v38/32300151."..............................kh..."'
20679: 'EVA@r@v34/33300664."Chiester Sisters, please show me your skill again.@k@v34/33300665. ...Prepare to attack!@k @v34/33300666.*giggle*giggle*giggle*giggle*giggle*!@k @v34/33300667.Carry the corpses out again, alright?@k@v34/33300668. ''Cause I''ll play with them a lot.@k@|@y@v34/33300669. No complaints, OK, Ronove?"'
20680: 'Ronove@r@v31/33100561."......Yes.@k@v31/33100562. Certainly."'
20681: 'EVA@r@v34/33300670."Nn......"'
20682: '@rAt that time, the witch noticed something.@k ......As though some presence had disappeared...@k ...Was it her imagination......?'
20683: 'EVA@r@v34/33300671.".........Did you feel some kind of presence just now?@k @v34/33300672.Did any of you feel it?"'
20684: 'Chiester45@r@v35/33400024."M-...my apologies, I didn''t notice anything... Please forgive me......!!"'
20685: 'Chiester410@r@v36/33500036."We were in the middle of observing the guesthouse, so our peripheral surveillance was turned off. Nihi.@k@|@y@v36/33500037. ...What about you, Lucifer-chaaan?@k @v36/33500038.Did you feel a presence?"'
20686: 'Lucifer@r@v38/32300152.".........nh - "'
20687: '@rFor just an instant, Lucifer sent a glance at Ronove, questioning whether she should answer honestly or not.'
20688: '@rRonove gave a small nod in response.'
20689: 'Ronove@r@v31/33100563."No.@k@v31/33100564. ...My apologies, BEATRICE-sama.@k@v31/33100565. Nothing from us.@k@|@y@v31/33100566. .........Forgive us for this stupidity, as we are only second-hand furniture."'
20690: 'EVA@r@v34/33300673."..........................."'
20691: 'Ronove@r@v31/33100567."..........................."'
20692: 'EVA@r@v34/33300674."...........................@k@v34/33300675. ......I see.@k@v34/33300676. If a Great Demon like you says that, then it must have been my imagination."'
20693: '@rThe witch stared persistently in the direction the presence had disappeared to.'
20694: '@r......That was the direction of the rose garden.@k And beyond that, she could see the mansion''s dark silhouette created by lightning.'
20695: '@r......It took her quite some time before she pushed her unsatisfied feelings aside,@k and once again turned to face the guesthouse.'