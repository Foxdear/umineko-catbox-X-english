5620: '@rThe uncomfortable atmosphere continued even after those two left.'
5621: '@rIt was thick with the idea that thinking about who the killer was would be the same as deciding who to doubt.@k ...It had begun to feel like discussion of the incidents was itself taboo.'
5622: '@rSo no one was mentioning it, at least out loud.'
5623: '@r......However, those thoughts were what filled our minds.@k@rAll that we couldn''t say aloud made our heads feel like they were going to explode...'
5624: '@rSo, at least on the outside, the parlor had once again regained its calm mood.'
5625: '@rThough everything was left unsettled.'
5626: 'George@r@v07/10300651."......It feels like the rain''s gotten a little lighter."'
5627: 'Maria@r@v13/10400663."Uu...?@k @v13/10400664.Still pouring down.@k@v13/10400665. Uu..."'
5628: 'Battler@r@v10/10101123."Even if it did stop, there''s no boat on this island.@k@v10/10101124. ...But it''d be nice if the boat came quickly tomorrow.@k@v10/10101125. I''ve had enough of this Western mansion vacation, ihihi."'
5629: 'Jessica@r@v04/10200619."Mom, when will the boat come tomorrow?"'
5630: 'Natsuhi@r@v03/10900391."Originally, the boat to take them back would have arrived at three o''clock today.@k@v03/10900392_b. They probably would have telephoned to say that they would come after the typhoon passed, but unfortunately, the telephones aren''t working..."'
5631: 'Natsuhi@r@v03/10900393."......But they aren''t children over there.@k@v03/10900394. They were told this was for the purpose of dropping off and collecting our guests,@k@v03/10900395. so they will most likely arrive first thing tomorrow morning—@v03/10900396_b.probably around nine o''clock, I believe."'
5632: '@rIt was completely black outside.@k@rWhen I looked at the clock, I realized that it was just past seven.@k@rI was starting to get hungry...'
5633: '@rIn the kitchen, Kumasawa was cooking enthusiastically.@k@rShe had laid out a variety of dishes, and while they didn''t match the level of Gohda''s artful cooking, they were still quite gorgeous.'
5634: '@rIt was an act of kindness from Kumasawa, trying to use food to enliven everyone''s low spirits.'
5635: '@rKumasawa wasn''t nearly as talented as a professional cook like Gohda, but she was far from unskilled.'
5636: '@r...On the contrary, since she had been brought up in a fishing village, the simple food she created was sometimes very highly valued.'
5637: '@rKanon arranged the food Kumasawa had finished creating on plates, under her direction.'
5638: '@rKanon also helped in the kitchen sometimes, but since he was rarely placed in that role, he was slightly awkward, even though he tried his best...'
5639: '@rSelf-conscious about the fact that he couldn''t skillfully arrange the food, Kanon''s expression darkened slightly.'
5640: '@rBut Kumasawa smiled to say everything was fine.'
5641: 'Kumasawa@r@v18/11800113."Hoh-hoh-ho, it''s arranged beautifully.@k@v18/11800114. Kanon-kun, aren''t you skilled."'
5642: 'Kanon@r@v16/10600206."...............If it had been Shannon nee-san,@v16/10600207. ...it would be even more beautiful..."'
5643: '@rKanon stopped arranging the food for a bit, and hung his head...'
5644: '@rShannon was the one who always assisted Kumasawa in her cooking.@k@r...Tonight, Kanon was doing it instead.'
5645: '@r......And as he remembered Shannon''s face, and her brutal end, he grimaced...'
5646: 'Genji@r@v14/11600191."............Forget it for now..."'
5647: '@rGenji spoke kindly to Kanon as he advanced a pawn.'
5648: '@r...Nanjo had escaped from the parlor once the mood had become sour, and Genji had become his opponent in a game of chess upon Nanjo''s request.'
5649: 'Kanon@r@v16/10600208.".........Yes.@k@v16/10600209. ......I will forget it for now."'
5650: 'Genji@r@v14/11600192."...Good.@k@v14/11600193. That is probably for the best."'
5651: '@rGenji purposefully faced away from Kanon as he spoke.'
5652: '@r...He did so because he understood that it might make things tougher on Kanon if he noticed that someone was looking at his eyes.'
5653: '@rNanjo also understood that, and held back any thoughtless words.'
5654: 'Nanjo@r@v19/11900167."......I wonder where Kinzo-san has gone...@k@v19/11900168. ......I hope that he is safe, but..."'
5655: 'Genji@r@v14/11600194.".........I do not know.@k@v14/11600195. ...Only, I think everything is as the Master hoped—as he has arranged.@k@v14/11600196. ......To distrust that would exceed my role as furniture working for the Master."'
5656: 'Nanjo@r@v19/11900169."...Aren''t you scared, Genji-san...?@k @v19/11900170.I am frightened something bad will occur again tonight..."'
5657: 'Genji@r@v14/11600197."............I have nothing to be afraid of.@k@v14/11600198. ...I simply work for the Ushiromiya family."'
5658: '@rNanjo sighed through his nose, and made a carefully considered move.'
5659: '@r...Nanjo was very slightly dubious.@k ......Could Genji possibly think that he would be left out of this?'
5660: '@rHe couldn''t begin to imagine what was happening inside this mansion.'
5661: '@r...But he definitely couldn''t deny the possibility that it was something of Kinzo''s design.'
5662: '@r...If you liken this island to chess, Kinzo had opened the game, and as a result, six pieces had fallen.'
5663: '@r......Could it be that Genji was calm because he believed that he alone was outside the chessboard, and safe?'
5664: '@rNanjo thought about it.@k ......Wasn''t everyone just a piece on this chessboard, lined up equally, without any exceptions?'
5665: '@r......Wasn''t even Genji, who had gained more of Kinzo''s trust than anyone,@k ...no, wasn''t Nanjo himself, although proud of his position as Kinzo''s only close friend,@k ...just another one of the pieces laid out on the chessboard?'
5666: 'Nanjo@r@v19/11900171.".........Genji-san.@k@v19/11900172. ...I am really frightened about tonight.@k@v19/11900173. ......I''m hoping with all my heart that we will be still be safe when tomorrow morning comes..."'
5667: '@rThe guest room that Eva and Hideyoshi had moved into was used to house guests before the guesthouse had been constructed.'
5668: '@rSo until a few years ago, they had stayed in this room every family conference and were very familiar with it.'
5669: '@rThis room, just like a room at a hotel, had a bedroom and a bathroom,@k so even though they were still shut in, it was far more comfortable than the parlor.'
5670: 'Hideyoshi@r@v06/11100387."Guess it''s true you can relax more when you''re alone with your immediate family.@k@v06/11100388. ......They should all just do this, shut themselves in guest rooms and lock the doors."'
5671: 'Eva@r@v05/11000669."But Natsuhi nee-san''s throwing her weight around, saying no one can leave the parlor.@k@v05/11000670. How can any of them talk back?"'
5672: 'Eva@r@v05/11000671."She always felt she was being left out in the cold, so now that Nii-san''s dead, she''s in high spirits, thinking her time has finally come.@k@v05/11000672. ...Seriously, how shameless can she be."'
5673: 'Hideyoshi@r@v06/11100389."...Come now, don''t say that.@k@v06/11100390. Natsuhi-san''s workin'' pretty hard.@k@v06/11100391. No need to jump on her like that.@k@|@y@v06/11100392. .........And about that receipt earlier, you went too far there."'
5674: 'Eva@r@v05/11000673."......Aww, come on.@k@v05/11000674. If I hadn''t said it there, there wouldn''t be another good time to say it..."'
5675: '@rEva, sulking cutely, sat down beside Hideyoshi, who was lying on the bed watching TV.'
5676: 'Eva@r@v05/11000675."Still, ............it''s been a very long time since we''ve been alone like this."'
5677: 'Hideyoshi@r@v06/11100393."Sure has.@k@v06/11100394. When I think about it, both you and I have gotten older.@k@v06/11100395. Since George was born, everything''s gone by in the blink of an eye."'
5678: 'Eva@r@v05/11000676."...It really has gone by in the blink of an eye.@k@v05/11000677. ......I wonder if we were too hasty in having a child."'
5679: '@rEva''s eyes looked like they were staring off into the distance.@k@r......Yes, she had thought it a once-in-a-lifetime chance.'
5680: '@r...Her older brother Krauss had been unable to have a child for quite some time.@k@rSix years passed after his marriage to Natsuhi without any signs of pregnancy, which didn''t please Kinzo at all.'
5681: '@rAs for Eva herself, she would be removed from the Ushiromiya register anyway once she got married, so whether a successor to the head was born or not, it was all the same to her.@k ...So she had thought.'
5682: '@rBut then, one day,@k ......she had a heavenly revelation.@k@r......Or maybe it was the whisperings of the devil that she had heard in her greed.'
5683: '@rPerhaps she could remain in the Ushiromiya register if she gave birth to a successor first?'
5684: '@r...If things went well, perhaps she could even inherit the Ushiromiya family herself...?'
5685: '@rWhen she proposed this to Hideyoshi, he approved of it instantly.@k@r......This had not been because Hideyoshi also had greedy thoughts.'
5686: '@r...For Hideyoshi, who had no close relatives,@k it was a chance for him to feel once more that long-forgotten thing called family.'
5687: '@rSo he agreed, without hesitation, not to fuss over which family name they were to keep upon getting married, and assented to having his name entered into the Ushiromiya family register.'
5688: '@rIt wasn''t easy to persuade Kinzo, but as his daughter, Eva knew Kinzo''s personality well.'
5689: '@r......So, she chose the time when Kinzo was most dissatisfied with Natsuhi,@k and expertly managed to make him accept Hideyoshi as a son-in-law.'
5690: '@r......Looking at Hideyoshi, who had achieved success after starting from nothing, Kinzo might have seen a little bit of himself.'
5691: '@rHe quickly grew to like Hideyoshi, and permitted him to transfer into the Ushiromiya register...'
5692: '@rGeorge would eventually become the successor to the Ushiromiya family.@k@rThey had raised him strictly with that purpose in mind.'
5693: '@rGeorge had been worth their while, and had grown into a fabulous young man who wouldn''t disappoint no matter where he went.'
5694: '@r...That was why she couldn''t stand that he was in love with a servant like Shannon.'
5695: '@r......So when she had learned that Shannon had died and the engagement had been invalidated,@k ......while part of her had been shocked at the gruesome crime,@k another part of her had been relieved that her precious George wouldn''t be stolen by some servant girl...'
5696: 'Eva@r@v05/11000678."..................@k@v05/11000679. .........I...@v05/11000680.......always did hate Krauss nii-san.@k@v05/11000681. He was so full of himself, always swaggering around.@k@v05/11000682. So proud that he would one day become the head."'
5697: 'Eva@r@v05/11000683."......So I wanted to get back at him.@k@v05/11000684. ...Those were just my emotions as a child, of course...?@k @v05/11000685.But in the end, those emotions......took over my entire life.@k@v05/11000686. And if only that had been all!@k @v05/11000687.......Because of those emotions, I got you and George involved, and I used you."'
5698: 'Hideyoshi@r@v06/11100396."............Eva, don''t blame yourself so much."'
5699: '@rHideyoshi sat up and put his arm around Eva.@k@r......She could feel a warm understanding from him.'
5700: 'Hideyoshi@r@v06/11100397."...Well, I reached the halfway point in my life long ago.@k@v06/11100398. ...But you know, I have never once regretted how I''ve lived my life.@k@v06/11100399. Not once."'
5701: 'Hideyoshi@r@v06/11100400.".........I think that since I''ve been with you, Eva, I''ve been able to relish an enjoyable life that other men never will.@k@v06/11100401. ......After I lost my relatives in the war, you taught me once more what the warmth of family is.@k@v06/11100402. So I''m grateful for the Ushiromiya family, and think of it as my only family."'
5702: 'Hideyoshi@r@v06/11100403.".........In this life I''ve led with you, not a single thing has been wasted.@k@v06/11100404. It''s really been a fun life up to today."'
5703: 'Eva@r@v05/11000688."......Thank you,@v05/11000689. ......honey."'
5704: '@rEva hung her head, burying her face in Hideyoshi''s chest...@k@r......Probably, no one in the parlor could even imagine that this side of Eva existed.'
5705: 'Hideyoshi@r@v06/11100405."I''m the one who should be thankin'' you.@k@v06/11100406. To this day, there hasn''t been a single day that I''ve regretted being with you!"'
5706: 'Eva@r@v05/11000690."...............Me too.@k@v05/11000691. I''m so glad...to have you by my side."'
5707: 'Hideyoshi@r@v06/11100407."George is already a fine adult.@k@v06/11100408. He''s a man who can do his job well on his own, even if I''m not there lookin'' out for him.@k@v06/11100409. ......How about it?@k@v06/11100410. Around New Year''s, do you wanna go spend some time in the Maldives?@k@v06/11100411. Just us two, no one else."'
5708: 'Eva@r@v05/11000692."......No wayyy.@k@v05/11000693. Aren''t you always saying that you''re so busy responding to New Year''s cards that you don''t even sleep...?"'
5709: 'Hideyoshi@r@v06/11100412."None of that this New Year''s!@k @v06/11100413.I won''t read New Year''s cards.@k@v06/11100414. I''ll just stay quiet and check to see if I''ve won the New Year''s lottery.@k@v06/11100415. It''d sure be nice if we won a color TV this year!"'
5710: 'Eva@r@v05/11000694."No wayyyy...@k@v05/11000695. I don''t wanna check the lottery in the Maldiiives..."'
5711: 'Hideyoshi@r@v06/11100416."Then none of that either!@k @v06/11100417.......Just the two of us, takin'' our time, carryin'' on from when we were newlyweds, just before George was born."'
5712: 'Eva@r@v05/11000696.".........Yeah.@k@v05/11000697. ...That does sound nice..."'
5713: 'Hideyoshi@r@v06/11100418."I hear the Maldives are wonderful.@k@v06/11100419. An island with nothin'' on it, surrounded by beaut''ful coral reefs and cottages lined up over the water..."'
5714: 'Eva@r@v05/11000698."......Carrying on from when we were newlyweds... When will that be...?"'
5715: 'Hideyoshi@r@v06/11100420."Soon as I''ve finished some business.@k@v06/11100421. I won''t know until I ask the travel agency, but probably before New Year''s Eve—"'
5716: 'Eva@r@v05/11000699."No way.@k@v05/11000700. .........Right now,@v05/11000701. ...I want to start right now."'
5717: '@rPeevishly, or maybe coquettishly, Eva pled for his lips...'
5718: '@rThe only sounds that filled the room were the distant voice of the announcer on the news, which Hideyoshi had left on, and the obnoxious pounding of the rain against the window...'
5719: '@rThere was a knock on the door, and Genji-san entered.'
5720: 'Genji@r@v14/11600199.".........Madam.@k@v14/11600200. Dinner has been prepared.@k@v14/11600201. Will you eat in here again...?"'
5721: 'Natsuhi@r@v03/10900397."...Yes.@k@v03/10900398. Bring it here.@k@v03/10900399. Is Doctor Nanjo still in the kitchen?"'
5722: 'Genji@r@v14/11600202."............Yes.@k@v14/11600203. He has said that he wishes to carefully deliberate over his next move.@k@v14/11600204. ...Do not worry, he is with the other servants."'
5723: 'Jessica@r@v04/10200620."Genji-san''s good enough at chess to be Grandfather''s opponent.@k@v04/10200621. I hear he''s even better than Doctor Nanjo, you know?"'
5724: 'George@r@v07/10300652."...Is that right.@k@v07/10300653. I played against him long ago, but he must have let me win."'
5725: 'Battler@r@v10/10101126."Maria, sounds like it''ll be time to eat soon.@k@v10/10101127. But look at you, you''ve been watching TV all day long and you still haven''t gotten bored!"'
5726: 'Maria@r@v13/10400666."Uu.@k@v13/10400667. I''m always watching TV so I''m fine.@k@v13/10400668. Uu."'
5727: 'George@r@v07/10300654."Heh, Maria-chan sure is a TV kid."'
5728: 'Jessica@r@v04/10200622."Food''s coming, so we have to clean up the table."'
5729: '@rIt was still cluttered with the aftermath of the drawing contest we had all been having, using several pages torn out of Maria''s notebook.'
5730: '@rJessica began cleaning that up quickly.@k@r......Still, everyone here sure can draw.@k Really shocking.'
5731: 'Natsuhi@r@v03/10900400."......Genji.@k@v03/10900401. Ask Eva-san and Hideyoshi-san whether they would at least like to have dinner with us.@k@v03/10900402. ......Although they will probably turn us down."'
5732: 'Genji@r@v14/11600205."...Certainly."'
5733: 'Natsuhi@r@v03/10900403."First Father, now Eva-san...@k@v03/10900404. We seem incapable of managing a full showing at the Ushiromiya dinner table."'
5734: '@rNatsuhi felt her headache start throbbing again, and lightly held her temples...'
5735: '@rThe distance from the kitchen to the parlor wasn''t that large, so Genji had gone there and back by himself, but the guest room was a little farther away.'
5736: '@rNatsuhi had warned him not to be alone without good reason,@k and just now, Nanjo had also admonished him, saying that it would be better if he held a little more concern for his safety.'
5737: '@r...Genji took Kanon with him, and the two of them went to visit Eva and Hideyoshi in their guest room.'
5738: '@rGenji knocked on the door.'
5739: 'Genji@r@v14/11600206."......Eva-sama, Hideyoshi-sama.@k@v14/11600207. Dinner has been prepared."'
5740: '@rHe waited a short while for them to come out, but there was no response.'
5741: 'Kanon@r@v16/10600210."............Genji-sama, ......look at this."'
5742: '@rKanon pointed under the door.'
5743: '@r......A Western-style envelope had been inserted under it.'
5744: '@rNormally, when something was inserted this way, it would be interpreted as a message from someone outside to someone in the room.'
5745: '@r...So, since this might be a private note meant for Eva and Hideyoshi, it was not something that Kanon and Genji were supposed to take interest in.'
5746: '@r...But this Western-style envelope...@k...was Kinzo''s envelope, the same as the one Maria had taken out last night and surprised everyone with.'
5747: 'Genji@r@v14/11600208.".....................@k@v14/11600209. ...There''s no mistake.@k@v14/11600210. It''s the Master''s envelope."'
5748: 'Kanon@r@v16/10600211."......Or...@v16/10600212.........."'
5749: '@rAlthough it had been Kinzo''s envelope, ......the author of the letter Maria had read aloud last night had not been Kinzo......'
5750: '@rGenji continued knocking a little harder and called out in a loud voice.'
5751: 'Genji@r@v14/11600211."Eva-sama.@k@v14/11600212. Eva-sama...!@k @v14/11600213.It is Genji.@k@v14/11600214. Are you there?!@k @v14/11600215.Please answer, Eva-sama...!!"'
5752: '@rBut there was no response from inside.'
5753: '@rSometimes, when the servants went to call some guests for a meal, the guests would be sleeping so deeply that they wouldn''t wake up.'
5754: '@r...In times like that, the servants would stick a letter in the door to show that they had called by, and then leave the guest be.'
5755: '@r......However, despite that, Genji beat even harder on the door and called out Eva''s name.'
5756: '@rBut there was no answer.'
5757: '@rKanon stuck his ear up to the door, and holding his breath, listened for any sounds coming from inside...'
5758: 'Kanon@r@v16/10600213."............I hear something that sounds like the television.@k@v16/10600214. ...But I don''t sense anyone.@k@v16/10600215. ...The room might be empty..."'
5759: '@rGenji took out a handkerchief, and, careful not to touch it with his bare hands,@k gently pulled out the envelope which had been stuck under the door...'
5760: '@rIt had been sealed with deep red sealing wax.@k@r...Without a doubt, the mark on that sealing wax had come from the Ushiromiya Family Head''s Ring...'
5761: 'Genji@r@v14/11600216."Eva-sama!@k @v14/11600217.Eva-sama!!@k @|@y@v14/11600218.Please answer!!@k @|@y@v14/11600219.Are you still in your room?!"'
5762: '@rEven so, there was still no answer...'
5763: '@rThere was a chance that the two were aimlessly walking around the mansion.'
5764: '@r...This was the home Eva had grown up in.@k@rThere was plenty of reason to think that she had gone out on a casual stroll...'
5765: '@rGenji groped around in his pocket, and pulled out a bundle of keys including the one that would open the guest room.'
5766: 'Kanon@r@v16/10600216."......Genji-sama...?!"'
5767: '@rKanon also understood what this meant.'
5768: '@r......They would sometimes unlock a guest''s door so they could go in and do things like make the beds, but only after they had made sure the guest was out.'
5769: '@rTo unlock the door for a separate reason, and especially to do so when there was a chance the guests were still in there and without their permission, was an action unbecoming of a servant.'
5770: '@r...However, Genji had decided.@k .........If the only problem had been that his knock hadn''t received a reply, he wouldn''t have gone this far.'
5771: '@rBut the envelope under the door was doubtlessly Kinzo''s.@k@r......Or rather, one of the Western-style envelopes of the Ushiromiya family head.'
5772: '@r...And after last night, the sender of this envelope could be someone other than Kinzo.'
5773: '@r......If this letter had been sent by someone other than Kinzo.........'
5774: 'Genji@r@v14/11600220."Eva-sama...!@k @v14/11600221.My apologies.@k@v14/11600222. Allow me to enter your room..."'
5775: '@rAfter giving that final notice, Genji stuck one of the keys from the bundle into the keyhole.'
5776: '@rThere was the sound of the door unlocking.@k ......And then, he slowly turned the knob, and slowly started opening the door.'
5777: '@rLight seeped through the crack of the door.@k@r......Were they in the room?@k Or had they......forgotten to turn out the lights...?'
5778: '@rClank.'
5779: '@r...It was the sound of the door chain being pulled tight.@k@rThe chain had been secured.'
5780: '@rThe chain couldn''t be secured from the outside.@k@rThat meant that they were in the room now.'
5781: '@rThe sound of voices on the TV seeped out of the room.@k@r...The lights, the chain, and the TV.@k@rAll of these things made it clear that they were in the room,@k .........but there was no sign of them.'
5782: '@rGenji called to Eva once again through the crack of the door.@k@rBut there was no answer.'
5783: 'Kanon@r@v16/10600217.".....................Genji-sama...@k@v16/10600218. ............What should we do...?"'
5784: '@rAs part of their job, the servants were able to unlock almost any lock in the mansion.'
5785: '@rBut they had no way to open a door with a chain.'
5786: '@r......The only way to get by the chain was to cut it.@k@r...That was certainly not permitted as part of a servant''s usual work.'
5787: '@r......A creepy chill was already rushing up their backs...'
5788: '@rKanon held his breath again and tried to sense someone through the door, but even so, he was not able to sense anyone.'
5789: 'Genji@r@v14/11600223."...............I''ll go call Madam.@k@v14/11600224. ...Kanon, cut the chain."'
5790: 'Kanon@r@v16/10600219."Y-......yes...!"'
5791: '@rAs Kanon rushed away hurriedly to get a cutting tool, he was called back by Genji.'
5792: 'Genji@r@v14/11600225."Wait, Kanon...!@k @v14/11600226..........Go back to the kitchen and take Kumasawa with you.@k@v14/11600227. Whatever you do, do not act alone."'
5793: 'Kanon@r@v16/10600220."......Yes...@k@v16/10600221. Certainly..."'
5794: '@rIt looked like Kanon was wondering why he had to do something so troublesome in the middle of this urgent situation.'
5795: '@r......But Genji had said it out of wariness.'
5796: '@r...He didn''t care what happened to himself.@k@r......But in the worst case scenario, he didn''t want anything to happen to Kanon.'
5797: '@rIn the kitchen was Kumasawa, who was piling food on the serving cart,@k and Nanjo, who seemed to have thought of a move that would turn the tables on Genji, and had been awaiting his return, wanting to show him.'
5798: '@r...But he immediately realized that something was wrong with Genji''s demeanor.'
5799: 'Nanjo@r@v19/11900174."......Oh, ......what has happened, Genji-san..."'
5800: 'Genji@r@v14/11600228.".........Doctor Nanjo, my apologies, but please allow me to suspend this match for a time.@k@|@y@v14/11600229. .........Kanon, take care of the chain.@k@v14/11600230. Kumasawa, stop setting up dinner for now and accompany Kanon.@k@v14/11600231. I will go over to Madam.@k@v14/11600232. If you would come with me, Doctor Nanjo."'
5801: 'Nanjo@r@v19/11900175."Ha-...has something happened......?"'
5802: '@rGenji took Nanjo, who still didn''t know what was going on, and quickly left the kitchen.'
5803: 'Kanon@r@v16/10600222."...Kumasawa-san.@k@v16/10600223. My apologies, but please come with me."'
5804: 'Kumasawa@r@v18/11800115."Wh-...what happened, Kanon-san......?"'
5805: '@rUnable to take in the situation, Kumasawa said almost exactly the same thing as Nanjo, and chased after Kanon, who had flown out into the hallway...'
5806: '@rAccompanied by Kumasawa, Kanon went to the storehouse,@k and from amongst the tools packed in toolboxes and hanging on the walls, he looked for a tool that could be used to cut the chain.'
5807: 'Kumasawa@r@v18/11800116."What are you looking for...?@k@v18/11800117. ...I will help......"'
5808: 'Kanon@r@v16/10600224."......We''re cutting a door chain.@k@v16/10600225. ...Where was that large bolt cutter..."'
5809: 'Kumasawa@r@v18/11800118."A door chain...?@k @v18/11800119.Wh-why would you do something like that...?"'
5810: 'Kanon@r@v16/10600226."............The chain is locked to Eva-sama and Hideyoshi-sama''s room.@k@v16/10600227. ...Even though they should be inside, when we called to them, they didn''t answer."'
5811: '@rIt took Kumasawa some time to figure out how cutting the chain and Eva and Hideyoshi not answering were connected, but she did realize that this was an urgent situation.'
5812: 'Kanon@r@v16/10600228."This will probably..."'
5813: '@rKanon took down a very large bolt cutter that had been hanging on the wall.@k@rIt was called a cutter, but maybe it would be easier to understand if described as having the shape of a large pair of pliers.'
5814: '@r......He recalled being warned that it was a dangerous tool that could easily cut through one of your fingers...'
5815: '@rKanon took that and rushed up the stairs.@k@r.........He knew it instinctively.'
5816: '@r...He should fight for every minute, every second to open it quickly.@k@r............Or maybe,@w500. ......already............'
5817: 'Kumasawa@r@v18/11800120."Please wait, Kanon-san......!@k @v18/11800121.Haah, ...haah...!"'
5818: 'Kanon@r@v16/10600229."......Hurry!"'
5819: '@rKumasawa eventually caught up with him, gasping for breath with both hands on her knees.'
5820: '@rWhen Kanon changed his grip on the bolt cutter and looked up at the door, he let out an "ah", struck speechless...'
5821: 'Kumasawa@r@v18/11800122.".........Wh-@v18/11800123.......what is this.........@k@v18/11800124. .........hiiiiiiiii......"'
5822: '@rKumasawa screamed weakly, her face pallid...'
5823: '@rThat was no surprise...@k Because, right there, .........on the door, ......just like the magic circle that had been drawn on the shutter of the rose garden storehouse,@k there was another eerie shape drawn with paint that looked like blood.'
5824: '@rHowever, it was dubious whether this one could be called a "magic circle".'
5825: '@r...Because, unlike what most people would think of as a magic circle, it wasn''t a circle with shapes drawn inside it,@k but a slightly more geometrical shape.'
5826: '@r......However, the strange non-alphabetical characters written in the gaps of the figure were without doubt the same as the magic circle on the shutter...'
5827: '@rBut the thing that had Kanon struck speechless was not how eerie the magic circle was.'
5828: '@r......Only moments ago, this hadn''t been here...!!'
5829: '@rHe had returned to the kitchen for a short while.@k He had then gone to the storehouse to grab a tool, and headed right back.'
5830: '@rPut those together and it couldn''t have been more than five minutes.'
5831: '@r...How could someone add something this creepy during that period of time...?!'
5832: '@rAnd as though it had just been drawn,@k almost like the door itself was bleeding, several unsettling vertical red lines slowly dripped down, getting longer and longer......'
5833: 'Kumasawa@r@v18/11800125."......hiiiiiiiiiii... ......hiiiiiiiiiiiiiiii...!"'
5834: '@rKumasawa''s knees gave way, and she sank down on the spot.@k@r...If Kumasawa hadn''t done this first, then Kanon surely would have wanted to.'
5835: 'Kanon@r@v16/10600230."......B-BEATRICE...sama..............."'
5836: 'Kumasawa@r@v18/11800126."Hiiiiiiiiiii...!@k @v18/11800127.It''s the work of BEATRICE-sama, how horrid, how horrid...!!"'
5837: 'Kanon@r@v16/10600231."...........................hh."'
5838: '@rKanon gulped, then readied the bolt cutter and approached the door.'
5839: '@r...He didn''t want to get close to this disturbing magic circle, and he really didn''t want to touch the steadily dripping substance that looked like blood.'
5840: '@r......But if he didn''t get close, he couldn''t cut the chain.'
5841: '@rFighting this cold feeling, he gulped again, and after gathering his courage, went even closer, putting the bolt cutter up against the chain.'
5842: '@r......He then pressed with all of his strength, and cut through the chain far more easily than he had imagined.'
5843: '@rThe cut chain fell into two separate parts, which continued to clang as they swayed back and forth...'
5844: 'Kumasawa@r@v18/11800128.".........Kanon-san,@v18/11800129. .........by your feet, an envelope......@k@v18/11800130. ...And isn''t that...the Master''s......"'
5845: '@rIt looked like Kumasawa had also noticed the Western-style envelope at the bottom of the door.@k@rAnd that the sealing wax had been sealed with the Head''s Ring.'
5846: '@rKanon was lost for a just a second over whether he should open the letter first or check inside the room,@k but he decided on prioritizing his original purpose.'
5847: '@r...Kanon pulled a handkerchief out of his pocket.@k@rThis was so he wouldn''t leave fingerprints on the door.'
5848: '@r......If his worst fears had been realized, .........the police would want to investigate this room too...!!'
5849: '@rHe slowly pushed the door open...@k He was able to hear the sound of the television that had been seeping out slightly more clearly now.'
5850: 'Kanon@r@v16/10600232."........................Eva-sama......?"'
5851: '@rEva was face up on the bed.@k@r......On the bed with her shoes still on...?'
5852: '@rKumasawa, who had fearfully entered after Kanon and who was hiding behind his back, screamed a short "hii!!" again when she saw Eva like that.'
5853: '@rEva''s shoes had been the first part of her that Kanon had seen, so the incongruity of wearing shoes in bed was the first thing that entered his mind,@k ...but after he shifted his line of sight towards Eva''s head,@k ...Kanon couldn''t help but let out a short scream like Kumasawa...'
5854: '@rRight in the middle...of Eva''s forehead, ......something was...@k@r......set there?@k Growing there...?'
5855: '@rNo.@k@|@y ...Right in the center of her forehead,@w250. ...an old-fashioned "knife",@|@y or some weapon like it, was stuck right in!!!'
5856: '@rFrom the base where it was stuck in, blood dripped down, staining the sheets on the other side bright red...'
5857: '@rKumasawa''s knees gave way once more, and she sank down on the floor.@k@r...Her mouth kept flapping open and closed, but she couldn''t even scream.'
5858: '@r......Eva, with some kind of weapon sticking out of her forehead, was dead.@|@y'
5859: '@rBoth eyes were open wide, and the image of the person who killed her must have been burned into them,@k ...but the mouth with which to speak that truth had already been eternally sealed.'
5860: '@rEven though that forehead was the last place they wanted to look, they couldn''t tear their eyes from it...'
5861: '@rRight there, the weapon was stuck into Eva''s forehead, standing almost perfectly upright.'
5862: '@rAnd on the handle was a design so complicated you could never expect to see it on an ordinary weapon.'
5863: '@r......That thing...could be summed up with the word "occult".@k@r...It was a vulgar object, with a design that might have been of some demon.'
5864: 'Kanon@r@v16/10600233."......What about Hideyoshi-sama...?@k @v16/10600234....Hideyoshi-sama...!"'
5865: '@rEva was on top of her bed, but the other bed was empty.'
5866: '@r...Where was Hideyoshi?!'
5867: '@rAfter taking a backwards glance at Kumasawa, still on her knees and stupefied, he checked the bathroom just in case.'
5868: '@rAt the moment he opened the door, he was greeted by steam and the sound of the shower.'
5869: '@rThe bathroom was of the same familiar style as most hotel bathrooms, containing both a bath and a toilet.'
5870: '@rWhen taking a shower, a waterproof curtain was used to keep water from flying out.'
5871: '@rThat waterproof curtain was half open,@k ......and lying tumbled down in the bathtub was Hideyoshi, completely naked, both eyes still open—@kand those eyes were pointing right at Kanon.'
5872: '@rJust like Eva, a weapon with a demonic design was stuck into his forehead.'
5873: '@rSince his head had been under the hot water of the shower the whole time, his face wasn''t half covered and filthy with blood like Eva''s had been,@k ...but the sight of him dead while still taking a shower was tragic enough......@|@y'
5874: '@rJust then, Natsuhi''s voice rang through the hall.@k@rShe was probably coming with Genji.'
5875: 'Natsuhi@r@v03/10900405."......A-again with this graffiti......@k@|@y@v03/10900406. ...What about this letter...?@k @v03/10900407.What does it say inside?"'
5876: 'Genji@r@v14/11600233."...I have not yet read it."'
5877: 'Nanjo@r@v19/11900176.".........We shouldn''t touch it carelessly...@k@v19/11900177. The culprit''s fingerprints might be left on it...@k@v19/11900178. We should hand it over to the police..."'
5878: 'Natsuhi@r@v03/10900408."......They went out of their way to leave it here.@k@v03/10900409. I''m sure they wouldn''t have left fingerprints."'
5879: '@rStating this with finality, Natsuhi picked up the envelope.'
5880: '@r...And before checking its contents, she entered the room herself, ......where she found Eva, dead.'
5881: 'Natsuhi@r@v03/10900410."E-......Eva-san......!!!!"'
5882: 'Kanon@r@v16/10600235."......Madam... Hideyoshi-sama is here, too............"'
5883: 'Nanjo@r@v19/11900179."Th-......this is......@v19/11900180.truly atrocious......"'
5884: 'Natsuhi@r@v03/10900411."...Kanon, turn off the shower...@k@v03/10900412. Don''t let this be any more pitiful than it needs to...!"'
5885: 'Kanon@r@v16/10600236."Y-...yes."'
5886: '@rKanon gripped his handkerchief and twisted the valve, turning off the shower.'
5887: '@rIn the bathtub, a small bottle of body soap had fallen with its cap off.'
5888: '@r......It really looked like he had been attacked right in the middle of taking a shower.@k@r......A spray of blood still clung slightly to the white bathtub, and the combination of red and white made a horrible contrast.'
5889: 'Genji@r@v14/11600234."............Doctor Nanjo..."'
5890: 'Nanjo@r@v19/11900181."...I, ......I understand......@k@v19/11900182. ......No signs of postmortem lividity...@k@v19/11900183. Rigor mortis hasn''t begun either.@k@v19/11900184. I''d say barely an hour has passed since they were killed, if that..."'
5891: 'Nanjo@r@v19/11900185."But even so, ......how a weapon with such a short handle could do that to the skull......@k@v19/11900186. I cannot imagine..."'
5892: '@rNanjo checked their pulse and their pupils, making certain of their deaths once more.'
5893: '@r...As Kanon watched this businesslike treatment, he thought.@k@r......Couldn''t you tell at a glance that they''re dead without doing all that?'
5894: '@rNanjo thought about removing the weapon,@k but after deciding that where possible it would be better to hand the scene over to the police without disturbing it, he left it alone.'
5895: '@rHowever, a close examination of the base revealed that it had no blade.@k@r...Or rather, it wasn''t shaped like a flat blade, but was conical.'
5896: '@r...He noticed that, rather than a knife, it was more like a short-handled spear, something with a shape better suited for thrusting than slicing.'
5897: '@rRather than a short spear, some people might call it a thick icepick.'
5898: '@rAt any rate, the original hideous purpose for which this weapon with its unsettling design was made,@k and exactly how that purpose was carried out, were both displayed here in such a glaring fashion that there was absolutely no need to use further words to describe it...'
5899: '@rNatsuhi, hoping to escape the repulsive steam filling the bathroom as soon as she could,@k covered her mouth with a handkerchief and dashed from the room...'
5900: '@rJust viewing their gruesome bodies for an instant had been enough to burn the image into her eyes.@k If she looked any longer, that image would surely remain in her vision for all eternity...'
5901: '@rThe rising urge to vomit was exactly the same feeling she''d had that morning at the gardening storehouse...'
5902: '@rFor a while, Natsuhi couldn''t help but stand with her back facing the guest room, fighting that sickness in her stomach...'
5903: 'Natsuhi@r@v03/10900413."......A-.........anyway, we can''t let the kids,@k@v03/10900414. ...we can''t let George-kun see this room.@k@v03/10900415. Quickly, close this room up...!"'
5904: 'Kumasawa@r@v18/11800131.".........Gra-...gracious, no, it shouldn''t be shown to them...@k@v18/11800132. If George-san saw his parents in this brutal state......"'
5905: '@rBut the recklessly approaching footsteps were obviously George''s even before he came flying into the room.'
5906: '@rGeorge and the other children had been waiting in the parlor.'
5907: '@rBut when they had seen Genji call Natsuhi out, and had noticed her turn pale and fly out of the room, they had felt that he might have been the bearer of bad news.'
5908: '@rAnd when they saw a large group of people gathered around the guest room, they were sure of it...'
5909: 'George@r@v07/10300655."Father!!!@k @v07/10300656.Mother!!!"'
5910: 'Jessica@r@v04/10200623.".........Aaahh,@v04/10200624. wha-......what is this,@v04/10200625. another......magic circle?!"'
5911: 'Maria@r@v13/10400669."...................................."'
5912: 'Battler@r@v10/10101128."Auntie Eva and Uncle Hideyoshi are safe, right?!@k @v10/10101129.Hey, Kanon-kun!@k @v10/10101130.What''s this all about?!"'
5913: 'Kanon@r@v16/10600237."...Battler-sama...@k@v16/10600238. ................................."'
5914: '@rKanon didn''t have to say anything; George''s scream after he ran into the room told them everything they needed to know.'
5915: 'George@r@v07/10300657."......UwaaaaaaaaaaaaaAAAAAAAAAAAaaaaa!!@k @v07/10300658.Who,@v07/10300659. ......who did this!!@k @v07/10300660.I''ll kill you, I''ll kill you!!!"'
5916: 'Natsuhi@r@v03/10900416."...George-kun,@v03/10900417. .........hang in there, dear......"'
5917: '@rNatsuhi touched George''s shoulder with her hand, but he violently shook her off.'
5918: '@r...George collapsed to the floor beside Eva, and buried his face in the bed in front of his mother''s face, wailing.'
5919: '@rThen he pounded on the bed with his fist, over and over again...'
5920: 'Jessica@r@v04/10200626.".........Geor-@v04/10200627....George nii-san,@v04/10200628. ......ha-hang in there......@k@|@y@v04/10200629. .........huh,@v04/10200630. ...Battler?"'
5921: 'Kanon@r@v16/10600239."............Battler-sama..."'
5922: '@rBattler.........had his back against the wall of the hallway,@k ......and was, without restraint, covering his eyes with his right hand and weeping......'
5923: 'Battler@r@v10/10101131."Horrible......@k@v10/10101132. ............That''s horrible......@k@v10/10101133. ......He proposed to the girl he loved and lost her the next day.@k@v10/10101134. .........And on the same day, even his mom and dad were killed...@k@v10/10101135. ............Isn''t that...just way too harsh......"'
5924: '@r...Of course, he felt sorry for everyone who had died.@k@rBut Battler......felt far more sorry for those who had been left alone by the deaths of others.'
5925: '@rEveryone here now had lost someone close to them.@k@rGeorge wasn''t the only one he felt sorry for.'
5926: '@r......However, ...George''s pain was far greater than everyone else''s.'
5927: 'Jessica@r@v04/10200631."..................Battler........."'
5928: 'Battler@r@v10/10101136."Sure, ...all people die sooner or later...@k@v10/10101137. If you''re human, the day''s going to eventually come when you''ve got to fight the sorrow of losing someone close to you.@k@v10/10101138. ...But still, shouldn''t that day be far in the future for Aniki,@k@v10/10101139. ......and shouldn''t those deaths visit him one at a time...?!!"'
5929: 'Battler@r@v10/10101140."......Horrible...@k@v10/10101141. That''s too horrible......@k@v10/10101142. ......Bastard......@|@y@v10/10101143. Bastard.........!@|@y@k @v10/10101144.Don''t you have......the slightest bit of human compassion...?!!@k @v10/10101145.Uuuuuuuuuuughhhh!!!"'
5930: 'Maria@r@v13/10400670.".........Uu...@k@v13/10400671. Battler, ...don''t cry, don''t cry..."'
5931: '@rMaria tried to comfort Battler in a mechanical-sounding voice...@k@rBattler violently wiped his tears.'
5932: 'Battler@r@v10/10101146."Aah...@k@v10/10101147. Damn it, ...I won''t cry anymore...@k@v10/10101148. Tears of regret, tears of sadness, I won''t shed them again..."'
5933: 'Battler@r@v10/10101149.".........Yeah, it''s no goddamn good at all.@k@v10/10101150. The witch is backing us into a corner.@k@v10/10101151. We''re always on the defensive...!@k @v10/10101152.And that''s no good, it''s no goddamn good!@k @v10/10101153.I''ll flip over the chessboard...!!@k @v10/10101154.That bastard probably thinks of us like sheep, just cowering in fear until tomorrow with no way of running."'
5934: 'Battler@r@v10/10101155."...But guess what, I''ll flip it over!!@k @v10/10101156.That bastard can''t escape this island until tomorrow either...!@k @v10/10101157.We won''t be the ones hiding away pissing ourselves, that fucker will!"'
5935: 'Battler@r@v10/10101158."I''ll expose you, you''ll see.@k@v10/10101159. By tomorrow—@k@v10/10101160.no, forget tomorrow, tonight.@k@v10/10101161. Before this night''s over I''ll be gripping you by the collar...!!"'