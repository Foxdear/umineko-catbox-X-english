716: '@rThe boat gave a big shudder.'
717: '@rSeems we''ve docked at the harbor.@k@rThe boat driver came out and jumped to the pier with the mooring rope.'
718: '@rA large man in a tuxedo was waiting there for us with a warm, smiling face.'
719: '@r......I didn''t know him, but judging by his clothes, I guessed that he was a servant of the Ushiromiya head house.'
720: 'Gohda@r@v17/11700001."Welcome home, Milady.@k@v17/11700002. You were quite late, and I began to worry."'
721: 'Jessica@r@v04/10200073."Ah, thanks for caring!@k @v04/10200074_1.The boat had Battler scared shitless.@k@v04/10200075. So we had to slow down for him.@k@v04/10200076. Seriously, what a pain in the ass!"'
722: 'Battler@r@v10/10100189."S-shut up... I''ll remember this when the shoe''s on the other foot someday... ugghh."'
723: '@rAt this rate, the word''ll spread around the entire family, and I''ll become the big conversation piece during dinner.'
724: '@rEven without this, everyone''d be talking about me because of that six-year gap...but now I''ve provided them with an even juicier topic...!'
725: '@rDammit, why does the Ushiromiya main family have to live on this isolated island!'
726: '@rIn the meantime, the boat had finished its mooring.@k@rA small plank was lowered so that we could get down.'
727: '@rOne by one, our parents came out of the boat.'
728: 'Gohda@r@v17/11700003."You must all be quite tired from your long trip.@k@v17/11700004. Madam, please, allow me to assist you."'
729: 'Eva@r@v05/11000068."Thanks.@k@v05/11000069. It''s been a while, Gohda-san, how are you?"'
730: 'Gohda@r@v17/11700005."Thank you for your concern.@k@v17/11700006. It is always my pleasure to serve."'
731: 'Kyrie@r@v09/11300040."Battler-kun, isn''t this your first time meeting Gohda-san?@k @v09/11300041.If I''m not mistaken, you weren''t working here six years ago, right?"'
732: 'Gohda@r@v17/11700007."Indeed.@k@v17/11700008. So please, allow me to greet him for the first time.@k@v17/11700009. It is an honor to meet you at last, Battler-sama."'
733: 'Battler@r@v10/10100190."......I''m pretty secure about my height, but you''re huge.@k@v10/10100191. ...This is definitely our first meeting.@k@v10/10100192. If I''d ever met a big guy like you, I''d never forget it...!"'
734: 'Battler@r@v10/10100193."It''s a pleasure.@k@v10/10100194. I''m Battler."'
735: 'Gohda@r@v17/11700010."Your return has been keenly anticipated, sir.@k@v17/11700011. I have been working for the Ushiromiya head house since the year before last; my name is Gohda (郷田), your servant."@|@y'
736: 'Gohda@r@v17/11700012."It is a pleasure to make your acquaintance.@k@v17/11700013. If there is ever anything you need, please feel free to rely on me."'
737: 'George@r@v07/10300094."Gohda-san, it''s been some time."'
738: 'Gohda@r@v17/11700014."It has been too long, George-sama.@k@v17/11700015. Please, allow me to assist you."'
739: 'Hideyoshi@r@v06/11100048."As usual, you''re a reception pro...@k@v06/11100049. If you ever need a job, just give me a holler, okay?@k@v06/11100050. I''d hire you just like that!"'
740: 'Gohda@r@v17/11700016."You do me too much honor.@k@v17/11700017. Please allow me to assist you, Hideyoshi-sama."'
741: '@rGohda-san then lent a hand to everyone as they disembarked, greeting them as they passed.'
742: '@rHis speech and mannerisms had the refined polish of a professional.'
743: '@rHe was very graceful, in contrast with his initially rough-looking appearance.'
744: '@rHis large size made him seem a bit scary at first, but he was much more polite than my first impression of him had led me to believe.'
745: '@rHe claimed to have served on the island for two years, but he had doubtless worked at a similar job somewhere before.'
746: '@rAfter everybody disembarked, the mooring rope was untied, and the boat started to steer away from the harbor.'
747: '@rIt was probably returning to its home port of Niijima.'
748: '@rThe captain waved his hand in farewell.@k@rMaria conscientiously waved back.'
749: 'Battler@r@v10/10100195."............Hmmm, I just realized why something''s been feeling out of place to me.@k@v10/10100196. I can''t hear the cries of the seagulls."'
750: 'Jessica@r@v04/10200077."Seagulls?@k @v04/10200078.The birds?"'
751: '@rI remember that whenever we came to this island, the seagulls always welcomed us with their lively "nyaa nyaa" cries.'
752: '@rAnd because of that, whenever I hear the cries of the seagulls in any other place, I get the feeling that I''ve come to a family conference.'
753: '@rExcept for the small part of the island where those of the Ushiromiya head house live, Rokkenjima had been left uncultivated, apparently transforming into a paradise for wild birds.'
754: '@rSeemingly, some cliff face or other had become home to a huge seagull colony, and so this island was always full of them.'
755: '@rSince those seagulls didn''t come to greet us, I felt a bit lonely.'
756: 'Rosa@r@v12/11400037."What''s wrong, Battler-kun?"'
757: 'Battler@r@v10/10100197."Oh, Auntie Rosa.@k@|@y@v10/10100198. ...Nah, it''s nothing really—I was just saying I can''t hear the seagulls, so it kinda feels a bit lonely."'
758: 'Rosa@r@v12/11400038."Oh, you''re right.@k@v12/11400039. They''re always so lively, but I can''t see hide nor hair of one today."'
759: 'Maria@r@v13/10400103."......Uu?@k @v13/10400104.Why no seagulls?"'
760: 'Rosa@r@v12/11400040."Hmmm, maybe it''s because the seagulls are having a gathering somewhere too?@k @v12/11400041.Maria, did you want to see the seagulls?"'
761: 'Maria@r@v13/10400105."Uu, wanted to."'
762: 'Battler@r@v10/10100199."What happened for them all to disappear?@k @v10/10100200.Maybe Jessica made aaall of ''em into shish kebabs and ate ''em!"'
763: 'Maria@r@v13/10400106."......Uu?!"'
764: 'Jessica@r@v04/10200079."The hell, don''t say disturbing stuff like that!@k @|@y@v04/10200080.You''ll get Maria all confused!!"'
765: 'Maria@r@v13/10400107."Uu-uu-uu!@k @v13/10400108.Jessica onee-chan made them into shish kebabs, made them into shish kebabs!@k @v13/10400109.Uu!!"'
766: 'Jessica@r@v04/10200081."I did not, I did not!@k @v04/10200082.Why the hell would I do something like that?!"'
767: 'Battler@r@v10/10100201."That''s right, that''s ri~ght, Jessica made ''em into shish kebabs!@k @v10/10100202.Skin ''n meatballs, liver ''n onio~on!"'
768: 'Maria@r@v13/10400110."Swimming meat dolls!@v13/10400111. Living oniooon!!@k @v13/10400112.Uu-uu-uu!@k @v13/10400113.Ahaha, ahaha!@k @v13/10400114.*giggle*giggle*!"'
769: '@rAs I made fun of Jessica, Maria tagged along looking like she was having fun.'
770: '@rOoh, she really knows how to join in with things!@k@rAlright then, starting today I''ll make you my number one follower!'
771: '@rAs I smiled at her, she beamed back overjoyed, I guess happy for this little bit of solidarity.'
772: 'George@r@v07/10300095."That''s not it, Maria-chan.@k@v07/10300096. I''ve heard that wild birds are attuned to changes in the weather and atmospheric pressure.@k@v07/10300097. And it looks like the weather will get worse around tonight.@k@v07/10300098. It''s possible they hurried back to their nests."'
773: 'Maria@r@v13/10400115."............Uu.@k@v13/10400116. Not kebabs?@k @v13/10400117.Jessica onee-chan didn''t make them into kebabs?"'
774: 'Jessica@r@v04/10200083."I did not, I did not!!@k @v04/10200084.I told you, I wouldn''t do stuff like that!@k @v04/10200085.Alright, Battler, you admit right now that you lied!"'
775: 'George@r@v07/10300099."Battler-kun.@k@v07/10300100. Maria-chan is a naive girl, so she takes even jokes seriously.@k@v07/10300101. You should choose your jokes more carefully."'
776: '@r...George-aniki gently scolded me.'
777: '@r...Even though I outstripped Aniki in height, he still commanded respect as my elder.@k No choice but to obediently apologize.'
778: 'Battler@r@v10/10100203."H-hey,@v10/10100204. my bad, my bad...@k@v10/10100205. Maria, that just now was a joke.@k@v10/10100206. It''s just today the seagulls are all quiet in their nests."'
779: 'Maria@r@v13/10400118."......Battler lie?@k @v13/10400119.George onii-chan true?"'
780: '@rI was having fun, but you were actually just tricking me...?@k@rHer pure eyes seemed to accuse me.@k@r......Maybe I went a little overboard with her after all.'
781: 'Battler@r@v10/10100207."Yeeaah, that''s right, that''s right.@k@v10/10100208. What George-aniki said is true.@k@v10/10100209. The weather is bad so they probably went home for today.@k@v10/10100210. It doesn''t mean they''re gone, does it?@k @v10/10100211.Right, Auntie?!"'
782: 'Rosa@r@v12/11400042."That''s right.@k@v12/11400043. Tomorrow, when the weather gets better, I''m sure they''ll come back and let you hear their "myaa myaa" cries."'
783: 'Maria@r@v13/10400120."Uu.@k@v13/10400121. I''ll wait for the weather to get better so they come back.@k@v13/10400122. Wait for tomorrow.@k@v13/10400123. Wait for the weather to get better.@k@v13/10400124. Uu-uu!"'
784: '@rMaria''s mood lightened, and she started looking forward to tomorrow, when the seagulls would come back and fill the skies.'
785: '@rStill, George-aniki really is amazing at taking care of kids.'
786: '@r...I think I remember Aniki taking good care of me as well when I was a brat six years ago.'
787: '@r......Aniki might have quite some talent for this kind of thing.'
788: 'Rosa@r@v12/11400044."George-kun, you''re so amazing at taking care of kids.@k@v12/11400045. I think you could work in child-care!"'
789: 'Jessica@r@v04/10200086."Yeah, it''s like you were born to do that.@k@v04/10200087. To me, that seems more "you" than doing business in some company president office."'
790: 'George@r@v07/10300102."Oh, no.@k@v07/10300103. Child-care is a very respectable job of its own.@k@v07/10300104. It''s not something you can do merely by liking children."'
791: 'Rosa@r@v12/11400046."You''re truly modest, George-kun.@k@v12/11400047. But Battler-kun, you''re quite good with children too, you know!@k @v12/11400048.Earlier, even if it was just for a time, Maria seemed to be having a lot of fun.@k@v12/11400049. Keep on playing with her like you did just now.@k@v12/11400050. Just choose the jokes carefully though, alright?@k @v12/11400051.*giggle*."'
792: '@rAuntie Rosa winked at me, giggling a little.'
793: '@rA real mother, I thought to myself, who''s happy that Maria looks like she''s having fun.'
794: 'Rudolf@r@v08/11200062."Come on, Rosa.@k@v08/11200063. And you brats too, what the hell''re you doing, get a move on!"'
795: 'Rosa@r@v12/11400052."Alright, alright, we''re coming."'
796: '@rThe old bastard was beckoning us to hurry up.@k@rWe''d better get moving.'
797: '@rIt''s not like it''d be too late to have the same discussion after we got our luggage in our rooms.'
798: 'Gohda@r@v17/11700018."Well then, everyone, I shall lead you towards the guesthouse where you will be staying.@k@v17/11700019. Please, this way."'
799: '@rGohda-san called to everyone and started leading us.@k@rKumasawa-san brought up the rear.'
800: '@rA serpentine, twisting path led through a dim forest.@k@rIt ran a bit uphill.'
801: '@rI''d guess the path was made twisting so that the slope wouldn''t be felt too much,@k but personally, I''d have been happier if they''d been man enough to make some stairs in a straight line.'
802: '@r......No doubt they made the path twisting on purpose, to put on airs of distance and importance...'
803: '@rBefore long, we saw garden-style stone steps.'
804: '@r...Ahhh, now, I remember how it goes from here.@k@rGo up these, and...'
805: '@rAt the top of the stone steps, a beautiful guesthouse came into view.'
806: '@rIts facade was lovely, of course, but even more than that,@w666. ......we couldn''t help but have our hearts stolen away by the splendor of that beautiful rose garden that spread before it.'
807: 'Hideyoshi@r@v06/11100051."Haah~!@k @v06/11100052.It''s as beautiful as ever this year...@k@v06/11100053. A real delight for the eyes..."'
808: '@rAs they reached the top of the stone steps, the people welcomed in by the rose garden voiced their appreciation one after another.'
809: 'Eva@r@v05/11000070."Aren''t the flowers less lively this year?@k @v05/11000071.It must be because the summer wasn''t warm enough."'
810: 'Gohda@r@v17/11700020."I also believe that is so.@k@v17/11700021. When one compares with last year''s blooming, it is a pity that this year''s is somewhat inferior."'
811: '@rEven so, it was a delightful rose garden.@k@rI remember that huge amounts of roses used to greet me every year, even over six years ago.'
812: '@r...This rose garden was the first thing that greeted the people who came to Rokkenjima.@k Even our parents, who came every year, couldn''t help but let their wonder slip out.'
813: '@rAnd moreover, it even looked like a "powered-up" version of the garden from six years ago that was in my memories.'
814: 'Kyrie@r@v09/11300042."This place is always so amazing.@k@v09/11300043. It would be so wonderful to have a rose garden like this in my own home."'
815: 'Rudolf@r@v08/11200064."Give it up—who do you think would take care of it?@k@v08/11200065. Roses are a real pain, with bugs and diseases to worry about."'
816: 'Rosa@r@v12/11400053."Yes, they are.@k@v12/11400054. In fact, I hear that Kyrie nee-san attends to her "rose" every day, and makes sure that it doesn''t get nibbled at without her knowing it."'
817: 'Rudolf@r@v08/11200066."Huh?@k @v08/11200067.I haven''t heard anything like that, what''s this?"'
818: 'Kyrie@r@v09/11300044."Yes, I do.@k@v09/11300045. Though, with him, it''s the rose that goes off after the insects, so it''s really more like some nasty carnivorous plant."'
819: 'Rudolf@r@v08/11200068."...Oh, so that''s what you mean.@k@v08/11200069. C''mon, Rosa, can''t you give that a rest just for today?@k@v08/11200070. I''ve put that sort of thing completely behind me."'
820: 'Rosa@r@v12/11400055."I wonder.@k@v12/11400056. After all, you are a womanizer on an almost genetic level...!"'
821: 'Kyrie@r@v09/11300046."No need to worry, Rosa-san.@k@v09/11300047. If a rose gives me too much trouble, I just chop it off at the root."'
822: 'Kumasawa@r@v18/11800033."Hoh-hoh-hoh-ho...such frightening talk this is."'
823: 'Hideyoshi@r@v06/11100054."Guys who''re popular with the ladies are always forced to live with danger at their side.@k@v06/11100055. I sure hope I turn out a bit prettier in my next life!"'
824: 'Rudolf@r@v08/11200071."Hideyoshi nii-san, as I keep telling you, it isn''t like that at all.@k@v08/11200072. ...And Kyrie...stop it, you''re freaking me out.@k@v08/11200073. You''re making my rose wither."'
825: 'George@r@v07/10300105."Hey, Maria-chan, look over here.@k@v07/10300106. These roses are especially magnificent."'
826: 'Maria@r@v13/10400125."...Roses are magnificent.@k@v13/10400126. ...Uu!"'
827: 'Battler@r@v10/10100212."Hmmm~~, smells pretty sweet.@k@v10/10100213. Look, this matches my elegance pe~rfectly."'
828: 'Jessica@r@v04/10200088."Hey, cut it out!@k @v04/10200089.Maria''s gonna imitate you and get hurt by the thorns!"'
829: '@rShe yelled at me as I leaned in with an exaggerated gesture to smell the rose''s scent.'
830: '@r...I thought she was overreacting, but when I turned around, I saw Maria imitating my every movement, and thereby putting a broad smile on George-aniki''s face.'
831: 'George@r@v07/10300107."Hey now, Maria-chan, be careful.@k@v07/10300108. Rose thorns can hurt."'
832: 'Maria@r@v13/10400127."......Uu?@k @v13/10400128.............George onii-chan.@k@v13/10400129. This one rose is strange.@k@v13/10400130. Uu."'
833: 'Jessica@r@v04/10200090."Strange?@k @v04/10200091.What''s wrong?"'
834: '@rMaria pointed to a single rose.@k@rI immediately understood why she found it odd.'
835: '@rIn the midst of all these magnificent roses, just one single rose was withering.'
836: '@rThere wasn''t any particular reason.@k@rSome roses flourish, and others wither.'
837: '@rThat''s all there was to it, but Maria seemed very concerned about there being only one unhealthy rose in a group of healthy ones.'
838: '@r...She must be feeling somehow like it''s been left out.'
839: 'George@r@v07/10300109."So, you feel sad for this rose because it''s the only one that isn''t healthy...?"'
840: 'Maria@r@v13/10400131."......Uu.@k@v13/10400132. The others are all healthy, but this one''s sad."'
841: 'Jessica@r@v04/10200092."Well, they all bloom and wither on their own.@k@v04/10200093. I''ll bet the only reason that one withered now is because it bloomed earlier than any of the other roses."'
842: 'Battler@r@v10/10100214."Yeah, that''s right.@k@v10/10100215. It probably just bloomed all over the place, fulfilled its duty and went to rest.@k@v10/10100216. You shouldn''t get so worked up about it."'
843: 'Maria@r@v13/10400133.".........Uu."'
844: '@rIt seemed that Maria''s pure, sensitive nature was making her feel some emotional pain for the rose that withered alone.'
845: '@rEven though she understood the logic of it, it still felt lonely to her.'
846: 'George@r@v07/10300110."Okay, Maria-chan,@k@v07/10300111. why don''t you look after this rose until we leave, then?"'
847: 'Maria@r@v13/10400134."Uu?"'
848: '@rGeorge-aniki straightened up and felt around in his pocket.@k@rHe then took out the wrapping from the candy he had eaten on the plane.'
849: '@rHe twisted it into a thin string, and gently tied it to the rose as a sort of marker.'
850: 'Jessica@r@v04/10200094."Heeey, that''s pretty cute!"'
851: 'George@r@v07/10300112."Let''s mark it with this.@k@v07/10300113. Later on, you can come and give it some water.@k@v07/10300114. I''m sure Mr. Rose will be happy."'
852: 'Maria@r@v13/10400135."......Uu!@k @v13/10400136.Come to give it water!"'
853: 'George@r@v07/10300115."I think you should give Mr. Rose here a name.@k@v07/10300116. I''m sure that''ll make it happy, and you''ll get to know it a little better."'
854: 'Maria@r@v13/10400137."Name...?@k @|@y@v13/10400138.Name...@k@v13/10400139. ......Uu...uu..."'
855: '@rThough she still wore her usual sullen face, Maria crossed her arms and began to consider this intently.'
856: '@rAt the very least, she appeared to have been completely pulled out of her slump.@k Nice going, Aniki.'
857: 'Jessica@r@v04/10200095."George nii-san has always been really understanding.@k@v04/10200096. Can''t help but respect him."'
858: 'Battler@r@v10/10100217."Yeah.@k@v10/10100218. I guess that''s just his gift.@k@v10/10100219. We''ve gotta learn some lessons from him!"'
859: 'Hideyoshi@r@v06/11100056."Was this garden as fancy as this when you were a kid?"'
860: 'Eva@r@v05/11000072."It was only after I left the house that it became this grand.@k@v05/11000073. Though I was more fond of the previous rustic garden.@k@v05/11000074. Nii-san fiddled with it too much, with his slightly questionable taste.@k@v05/11000075. It was much better the way it was before."'
861: 'Hideyoshi@r@v06/11100057."Eva, you''ve gotta think positive!@k @v06/11100058.No matter how it might''ve looked, its beauty now is something to be admired.@k@v06/11100059. You''ll be able to relax a lot better if you look at it that way."'
862: 'Eva@r@v05/11000076."I didn''t mean it like that...@k@v05/11000077. I was just saying that I would have liked you to have seen the old, more wonderful garden as well."'
863: 'Gohda@r@v17/11700022."Now then, everyone, if you please.@k@v17/11700023. I shall be guiding you to the rooms now."'
864: '@rGohda-san called to everyone to ask if we were ready,@k but our hearts had been completely stolen away by the rose garden after a year of absence, and we didn''t lend him an ear.'
865: '@rSince we weren''t a travel group, it wasn''t like we had a strict schedule to follow.'
866: '@rBesides, for our parents, this was their fond old birth home they had returned to, so they felt no obligation to be pressured by anyone.'
867: '@rUnderstanding the situation, Gohda-san continued to wait, with a wide smile, for our parents to lose interest in the roses and tell him to guide us to the rooms...'
868: 'Hideyoshi@r@v06/11100060."My...!@k @v06/11100061.Heeey!@k @v06/11100062.If it isn''t Kanon-kun!@k @v06/11100063.It''s been so long, how are you doin''?!"'
869: '@rUncle Hideyoshi suddenly shouted.'
870: '@rIn the direction he was waving,@w583. .........there was a slender boy.'
871: '@rMeeting him right after a huge man like Gohda probably emphasized his small stature.'
872: '@rThe boy was in the middle of transporting piled-up gardening tools and the like in a wheelbarrow.'
873: '@rWhen he realized he was being called to stop, he set down the wheelbarrow, took his hat off and bowed his head.'
874: 'Kanon@r@v16/10600001."..................@k@v16/10600002. .........Good afternoon."'
875: '@r...I figured he was probably younger than me.@k@rI realized by the general atmosphere surrounding him that he was a servant too.'
876: '@rThough he did greet Uncle Hideyoshi back, he himself seemed like he might be unsociable.'
877: '@rIt was a greeting that lacked feeling.'
878: '@rWhen Gohda-san noticed that our interest had shifted towards him, he went to the boy''s side and introduced him to us.'
879: 'Gohda@r@v17/11700024."Battler-sama, I shall introduce you.@k@v17/11700025. He is one of the servants who serve the Ushiromiya head house.@k@v17/11700026. ...Kanon-san, greet our guest."'
880: 'Kanon@r@v16/10600003."..................I''m pleased to meet you.@k@v16/10600004. I am the servant............@|@y@v16/10600005.Kanon (嘉音)."'
881: '@rYep, my first impression wasn''t wrong—he gave the feeling that he was unsociable, or maybe a bit of a poor speaker.'
882: '@rIn contrast with Gohda-san, who was extraordinarily polished as a servant,@k it was impossible not to feel the immaturity you''d expect of someone his age.'
883: '@rWhen Gohda-san urged him in a whisper to give a bit more of an introduction, the boy named Kanon only cast his eyes downwards.'
884: 'Gohda@r@v17/11700027."Kanon-san.@k@v17/11700028. Could you perhaps give them a little more as a greeting...?"'
885: 'Kanon@r@v16/10600006."............I can''t.@k@v16/10600007. ............Because we...@v16/10600008....are furniture."'
886: '@rIt seemed that he wasn''t refusing to greet us out of spite,@k but rather, he gave the impression that he didn''t know what else to add to his greeting, and so could do nothing other than stay silent.'
887: 'Jessica@r@v04/10200096_1."Ah, uh, Kanon-kun''s a man of few words.@k@v04/10200097. He might not be that sociable, but deep down he''s really a good person!@k@v04/10200098. Don''t get him wrong...!"'
888: 'Jessica@r@v04/10200099."You''ve been working here for three years, was it?@k @v04/10200100.So yeah, you''ve been here a year longer than Gohda-san, right, Kanon-kun?"'
889: '@rEven though it''s not like he made a super bad impression, Jessica hurriedly backed him up.'
890: '@r...I see, apparently him being unsociable works against him all the time.'
891: 'Battler@r@v10/10100220."Cool, nice to meet you.@k@v10/10100221. I''m Battler!@k @v10/10100222.I''m 18, how old are you?"'
892: 'Kanon@r@v16/10600009."..........................."'
893: '@rA silence, as if evaluating whether it was a question that must be answered or not.@k@r...But here again, Jessica plowed ahead.'
894: 'Jessica@r@v04/10200101."Um, uhh...!@k @v04/10200102.If I remember correctly, he''s two years younger than us so...16, right?"'
895: 'Kanon@r@v16/10600010."............Yes, ...that is correct."'
896: '@rIt looked like if given a choice, he would have preferred not to tell us his age.'
897: '@rHim not wanting to tell his age was probably because he thought he would be looked down upon for it.'
898: '@r...I remember that when I was around his age, I hated being asked how old I was by adults.'
899: '@r...I see, 16, huh?@k@rThat''s gotta be a delicate time.@k@r...In that case, I asked something I shouldn''t have.'
900: 'Battler@r@v10/10100223."Heh heh~, I''m glad you''re about our age!@k @v10/10100224.Just be cool and call me Battler!@k @v10/10100225.And I''ll call you Kanon!"'
901: 'Kanon@r@v16/10600011.".........Thank you very much.@k@v16/10600012. But just the sentiment is sufficient, ...Battler-sama."'
902: '@rJessica looked flustered for some reason.@k@rShe seemed to think that my impression of Kanon was worsening because of his rejection.'
903: '@rWell, I doubt a girl like Jessica understands his fretful male heart.'
904: '@rAs his elder—even by just two years—who would lead him into adolescence, I took it upon myself to understand that.'
905: 'Gohda@r@v17/11700029."Kanon-san, could you perhaps be a little more courteous?@k @v17/11700030.A smiling face is also the duty of a servant."'
906: 'Kanon@r@v16/10600013."...............I apologize.@k@v16/10600014. ...I shall make an effort."'
907: 'Kumasawa@r@v18/11800034."Hoh-hoh-ho...@k@v18/11800035. Gohda-san, Kanon-kun is trying his best, isn''t he?"'
908: '@rIt seemed as though he was often warned about his discourtesy.@k@rAnd apparently he hadn''t improved a bit.'
909: '@rGohda-san kept his business-smile, but let a small sigh of resignation escape.'
910: 'Kanon@r@v16/10600015."......Well then, I still have work to do.@k@v16/10600016. .........If you''ll excuse me."'
911: '@rIt looked like Kanon himself was uncomfortable with remaining silent here any longer.'
912: '@rAfter another perfunctory bow, he turned on his heels and started pushing the wheelbarrow again.'
913: '@rJust then, suddenly, the wheelbarrow wobbled and fell, scattering the load.'
914: '@rI guess the wheelbarrow with its single wheel caught on a pebble and lost its balance.'
915: 'Gohda@r@v17/11700031."What have you done...now now, quickly clean it up...!"'
916: '@rGohda-san urged him along in a low voice, as if to remind him that it is a servant''s shame to present a clumsy appearance in front of guests.'
917: '@rShowing that he understood quite well without being told, Kanon-kun wordlessly reloaded the wheelbarrow with the fallen objects.'
918: '@rHe seemed to be fine with the light-looking gardening tools, shovels and such, but he looked like he was having trouble getting his arms around and lifting up some sacks of fertilizer.'
919: 'Jessica@r@v04/10200103."Are you alright? You''re so careless.@k@v04/10200104. Here."'
920: 'Gohda@r@v17/11700032."Milady, you will dirty your garments.@k@v17/11700033. Please, leave it to him."'
921: '@rWith an elegant gesture, Gohda-san took the shovel that Jessica had picked up.'
922: '@rAt his back was the figure of Kanon-kun having trouble with the sacks of fertilizer.'
923: 'Maria@r@v13/10400140."......Uu.@k@v13/10400141. You''ll dirty your garments?"'
924: 'Battler@r@v10/10100226."Don''t worry, the ones I''m wearing aren''t that elegant."'
925: 'Battler@r@v10/10100227."Besides, I hate guys who make the waitress pick up the fork they dropped at a restaurant."'
926: '@rI lifted up the other bags that had fallen.@k@rOf course, they weren''t light, but for me it was a piece of cake.'
927: '@rKanon-kun turned his surprised eyes towards me.@k@rIt was the face of one who would never have expected to receive help from a guest.'
928: 'Kanon@r@v16/10600017."............B-Battler-sama...@k@v16/10600018. That''s not necessary... I''ll take care of everything, so..."'
929: 'Battler@r@v10/10100228."Don''t you worry!@k @v10/10100229.I may not look it, but I''ve got it where it counts!@k @v10/10100230.Heheh!"'
930: '@rKanon-kun looked like he hadn''t yet gone through his growth spurt, and was stuck with a sorta weak body.'
931: '@rI guess this kind of weight is a bit much for him.'
932: 'George@r@v07/10300117."It''s quite heavy, isn''t it.@k@v07/10300118. It''s natural that it would be difficult for you.@k@v07/10300119. Kanon-kun, don''t worry about it."'
933: 'Battler@r@v10/10100231."OK, my time to shine.@k@v10/10100232. This makes up for the boat part from before, right?"'
934: 'Jessica@r@v04/10200105."Ha!@k @v04/10200106.As if your antics earlier could be written off just like that!@k @v04/10200107.Ah-hah-hah-ha!@k @v04/10200108.I''ll tell you all about it later, Kanon-kun—Battler is a laugh and a half!"'
935: 'Maria@r@v13/10400142."Gonna faaall gonna faaall!!@k @v13/10400143.Uu-uu-uu!!!"'
936: '@rBanter made the job seem quick, and before I knew it, all the stuff had been piled back into the wheelbarrow.'
937: 'Kanon@r@v16/10600019."............For letting you see such unsightliness, I beg your forgiveness."'
938: 'Gohda@r@v17/11700034."Very well, enough now.@k@v17/11700035. Please, go."'
939: '@rLetting such a disgraceful thing be seen by the guests who were supposed to be made welcome...must have been hideously embarrassing as a servant.'
940: '@rPressed by Gohda to hurry up and exit, Kanon-kun left.'
941: 'Eva@r@v05/11000078."You''re too harsh on him, Gohda-san.@k@v05/11000079. Wouldn''t it have been better if you''d helped him, instead of being a bully?"'
942: 'Gohda@r@v17/11700036."...You are quite correct.@k@v17/11700037. I deeply, deeply implore your forgiveness."'
943: '@rWithout even a twitch in his smile, Gohda-san apologized elegantly.'
944: 'Hideyoshi@r@v06/11100064."Kanon-kun has a ton a things he''s good at too.@k@v06/11100065. It''s just that bein'' young works against him all the time.@k@v06/11100066. It''s a cryin'' shame."'
945: 'Rudolf@r@v08/11200074."It''s a prickly age.@k@v08/11200075. You be nice to him.@k@v08/11200076. Keeping a tight lip is just what you want in a servant.@k@v08/11200077. Right, Kumasawa-san?"'
946: 'Kumasawa@r@v18/11800036."Hoh-hoh-hoh-ho, Rudolf-sama, you truly are harsh!@k @v18/11800037.There is no servant as silent as I, of course!"'
947: '@rEveryone smiled wryly at that shameless lie.@k@rEven she herself didn''t believe that, not in her wildest dreams.@k@rShe said that to loosen us all up.'
948: '@rYeah, that''s the kind of character Kumasawa baa-chan used to be.'
949: '@rThe mood that had stiffened a little was cleared up in a twinkling, thanks to Kumasawa-san''s cheerful smile.'
950: 'Kyrie@r@v09/11300048."I''d like to put down the luggage soon.@k@|@y@v09/11300049. Gohda-san, how are we to split up for our rooms?"'
951: 'Gohda@r@v17/11700038."It shall be the same as last year.@k@v17/11700039. I shall guide you.@k@v17/11700040. Please, this way."'
952: '@rWe headed towards the trim and elegant guesthouse.@k@rThis was going to be our temporary quarters for a night.'
953: 'Kanon@r@v16/10600020.".........................................."'
954: '@rKanon watched over a hedge as the guests all entered the guesthouse.'
955: '@rThen, he let his eyes fall on those heavy sacks of fertilizer, piled up in the wheelbarrow.'
956: '@rIn his mind, he kept going over his previous mistake.@k@rBattler, big and strong, had picked up the sacks in front of him, the sacks he couldn''t lift himself, as if they were feathers.'
957: '@rIt was extremely difficult for an outside observer to guess what emotions that favor had stirred up in Kanon.'
958: '@rBut as far as you could tell by watching him hang his head from behind, there was something that he just couldn''t let go.'
959: '@r...Muttered words escaped his lips.@k@rBut those words he murmured were so soft that they didn''t reach even his own ears.'
960: 'Kanon@r@v16/10600021."...............Even I...@v16/10600022........................."'
961: '@rKanon hung his head, slightly biting his lower lip...'
962: 'Battler@r@v10/10100233."I remember the rose garden, but...@k@v10/10100234.I don''t remember this guesthouse at all.@k@v10/10100235. Was it built, like, recently?"'
963: '@r"@bToraian.@<渡来庵@>" (Visitor''s Retreat) was written on a gatepost-like thing, but since everyone called it the guesthouse, I followed their lead.'
964: '@rThe brand-new Western-style guesthouse that stood overlooking the rose garden had a magnificent design carefully done in harmony with the garden.'
965: 'George@r@v07/10300120."Correct!@k@v07/10300121. It was built just the year before last.@k@v07/10300122. Since then, we''ve been having them let us sleep over here."'
966: 'Jessica@r@v04/10200109."Hehe, yeah, ''cause people seem to like this place more than that junky old mansion we''ve had forever.@k@v04/10200110. I wish my room was over here!"'
967: 'Maria@r@v13/10400144."Uu!@k @v13/10400145.I want one too!@k @v13/10400146.Want one too!"'
968: '@r...I guess you could call my house upper-class as well, but I was reminded again how completely ordinary it was compared to the head house.'
969: '@rIt showed a shocking display of wealth that they would build this kind of awesome guesthouse for guests who come over like once a year.'
970: 'Gohda@r@v17/11700041."Eva-sama, Hideyoshi-sama.@k@v17/11700042. Please, do make use of this room.@k@v17/11700043. Rudolf-sama, Kyrie-sama, please make use of this room here."'
971: 'Eva@r@v05/11000080."Ah yes, I do appreciate how pretty and elegant this place is.@k@v05/11000081. Western style truly is wonderful."'
972: 'Hideyoshi@r@v06/11100067."I can handle the Western style for a few days, but any longer than that and you need the good old Japanese style!@k @v06/11100068.Japanese people just relax best on tatami mats."'
973: 'George@r@v07/10300123."...Haha, they''ve been fighting over making our new house Japanese-style or Western-style.@k@v07/10300124. Mother still holds a grudge about Father having started the construction as Japanese-style, and they bicker all the time about it."'
974: 'Jessica@r@v04/10200111."Your parents get along so well, George nii-san... I''m jealous as hell.@k @v04/10200112.Mine are so frosty.@k@v04/10200113. And yet they''re right with each other when it comes to my grades."'
975: '@rAll the rooms seemed to be two-person.@k@rI was grateful, because now I wasn''t gonna be forced to share the same room with the old bastard for some bullshit reason like "being family".'
976: '@rBesides, I figure those two wouldn''t be able to enjoy themselves with someone like me around, ihihi.'
977: 'Kyrie@r@v09/11300050."What''s that creepy smile all about?@k@v09/11300051. You''re thinking about something dirty, aren''t you."'
978: 'Battler@r@v10/10100236."Ihihihi~!@k @v10/10100237.Something diiirrrty? Of coouurse no~t!@k @v10/10100238.Please...enjoy your staaay~!"'
979: 'Battler@r@v10/10100239."Ow, owowowow!@k @v10/10100240.That hurts, you old bastard!"'
980: '@rOnce again, Dad pulled my ears from behind.'
981: 'Rudolf@r@v08/11200078."Cut the crap.@k@v08/11200079. I''m getting a stomachache, and I''m not in the mood for this.@k@v08/11200080. You''re the guest of honor this time around.@k@v08/11200081. You play as nice as possible with Dad and Aniki and the rest."'
982: 'Rudolf@r@v08/11200082."......At the very least, pay attention to what you say in front of Dad, got it?@k @v08/11200083.''Cause wisecracks go over like a lead balloon with him.@k@v08/11200084. ......Jessica-chan, what''s the mood of our family head been like lately?"'
983: 'Jessica@r@v04/10200114."...Hmm......@v04/10200115.same as last year, I guess.@k@v04/10200116. ......Considering they keep saying he''s got three months left, he''s as lively,@v04/10200117. grumpy,@v04/10200118. and irritable as ever."'
984: 'Rosa@r@v12/11400057."Meaning, he''s in his usual bad mood again this year.@k@v12/11400058. ......And the only one who''s able to take care of him is Genji-san?"'
985: 'Kumasawa@r@v18/11800038."It seems that the Master will only open his heart to Genji-san.@k@v18/11800039. Lately, us small people cannot even get an audience..."'
986: 'Jessica@r@v04/10200119."He''s shut himself up in his study again, probably doing nothing but that weird black magic of his.@k@v04/10200120. What he does for a hobby is his own damn business, but when he starts stinking up the place, it really gets on my nerves.@k@v04/10200121. ...He can just stay in that study and never come out again for all I care.@k@v04/10200122. Heheheh!"'
987: 'George@r@v07/10300125."You shouldn''t talk like that about the elderly.@k@v07/10300126. We''re all indebted to him, since he rebuilt the Ushiromiya family, and a little gratitude wouldn''t hurt."'
988: 'Jessica@r@v04/10200123."Hm...well...@k@v04/10200124. ......Sorry."'
989: '@rAfter being rebuked by George-aniki, Jessica had no choice but to take back her thoughtless remark.'
990: '@rThe Ushiromiya family was wealthy beyond belief, but that, of course, meant that all its members were eccentric people, completely at odds with the rest of society.'
991: '@rThe Head of the family, standing at its peak—in other words, our Grandfather—seemed to be a particularly eccentric and terrifying person, even for our family.'
992: '@rDad had said he was getting a stomachache earlier, but I guess that was what all the adults who came here today were actually feeling.'
993: '@rNo doubt they were jealous of us, the grandchildren, just playing and laughing without a care.'
994: '@rFrom the stories Dad told me, the head of the family was a violent man who rained blows on his sons with his own fists and even beat his daughters mercilessly with a wooden sword.'
995: '@rIf he was such a staunch traditionalist with his kids, why wasn''t he the same with their names?'
996: '@rBecause of that, even us grandkids have to suffer.'
997: '@r......Well, I have absolutely no trouble believing the terrifying image they paint of him.'
998: '@rI don''t have many memories of meeting him over the years, but I remember his face was full of menacing thunder-clouds, always making the people around him shrink away with a sharp look.'
999: '@rI remember that the room''s atmosphere got so tense whenever he was around, you couldn''t even breathe.'
1000: '@rWhat my dad said right now about me being the guest of honor now carries a little more oomph for me.'
1001: 'Battler@r@v10/10100241.".........Six years ago I was in grade school, but I''m a high-schooler now, there''s no getting away from it.@k@v10/10100242. If I don''t show him respect, things''ll probably get serious.@k@v10/10100243. ...Ooo, scary."'
1002: 'George@r@v07/10300127."He does look frightening, but he''s not completely terrifying.@k@v07/10300128. He''s definitely never unfair.@k@v07/10300129. He''s just not a pretty talker, that''s all."'
1003: 'Jessica@r@v04/10200125."But George nii-san, you''ve been the family darling since like forever because of your awesome grades, right?@k@v04/10200126. Grandfather treats us completely different!"'
1004: 'Jessica@r@v04/10200127."Like me, I''ve gotten slapped with a wooden sword.@k@v04/10200128. On my ass, my ass!@k @v04/10200129.On my maidenly naked ass!"'
1005: 'George@r@v07/10300130."Well, you''re the heiress of the head house, Jessica-chan.@k@v07/10300131. Grandfather is giving you special attention.@k@v07/10300132. You have to realize that his strictness shows how much he''s expecting of you."'
1006: 'Jessica@r@v04/10200130."Oh, come on.@k@v04/10200131. ...Seriously, I could just turn the succession over to you, George nii-san.@k@v04/10200132. It''s a bit of a heavy burden for me to carry."'
1007: '@rI think I already said it before, but Jessica is the daughter who will inherit the head house.@k@rThe pressure on her shoulders must be different from us cousins of the branch families.'
1008: 'Maria@r@v13/10400147.".........Uu?@k @v13/10400148.Jessica onee-chan, heavy?@k @v13/10400149.If I hold it, will it get lighter?"'
1009: 'Jessica@r@v04/10200133."Hm?@k @v04/10200134.Ahahahaha, thanks.@k@v04/10200135. It''s alright, it''s not gonna get pushed on you, Maria-chan."'
1010: 'Jessica@r@v04/10200136."......I''m gonna bear that cross until my grave.@k@v04/10200137. ...Don''t worry."'
1011: '@rWhile grateful for Maria''s innocent consideration, it seemed that Jessica could not easily rid herself of the anxiety for the future that remained visible on her face.'
1012: '@r...I guess I''m no different.@k Any high-schooler with exams looming ahead is bound to have an anxiety for the future that they can''t hide.'
1013: 'Rosa@r@v12/11400059."Maria, come here.@k@v12/11400060. You''ll be in this room with Mom."'
1014: 'George@r@v07/10300133."Battler-kun, apparently you are with me in this room here."'
1015: 'Battler@r@v10/10100244."Oh?@k @v10/10100245.This i~s a surprise!@k @v10/10100246.It''s bigger than our parents'' room, wo~w!"'
1016: 'Jessica@r@v04/10200138."I figured us cousins are probably all going to gather in one place anyway.@k@v04/10200139. So I went and told them to make it a biggish room."'
1017: 'Maria@r@v13/10400150."Uu!@k @v13/10400151.I like here best too!@k @v13/10400152.Here is better than being together with Mama!@k @v13/10400153.Uu-uu!"'
1018: 'Battler@r@v10/10100247."Okay, you like it here better too, Maria!@k @|@y@v10/10100248.Alright, this room is George''s and mine, but we''ll give you special permission to come in!@k @v10/10100249.Keep it a secret from your mom, alright?"'
1019: 'Maria@r@v13/10400154."Uu!@k @v13/10400155.Secret!"'
1020: '@rHer mother, Auntie Rosa, was right behind her, but Maria still answered, striking the air with her fists clenched tight.'
1021: '@rAfter our parents put the luggage in the rooms, they gathered again in the corridor.'
1022: 'Rudolf@r@v08/11200085."So, brats, what''re you gonna do?@k@v08/11200086. Are you cousins just gonna stay here and chat?"'
1023: '@rIt seemed they were heading to the mansion to announce their arrival.'
1024: '@r...Normally, we would have had to follow them and greet everyone together,@k but if that had been the case, Dad would just have said "You guys come too!" and been done with it.'
1025: '@rHe''s telling us that it''s alright if we don''t come... So what''ll we do?'
1026: 'Hideyoshi@r@v06/11100069."It''s gonna be time for lunch soon anyway.@k@v06/11100070. Better let the kids unwind here.@k@v06/11100071. Besides, if worst comes to worst, this might be the last chance they get to play outdoors."'
1027: 'Maria@r@v13/10400156."Uu!@k @v13/10400157.I''ll go too!"'
1028: 'Rosa@r@v12/11400061."Maria, you house-sit for Mama, okay?@k@v12/11400062. You behave yourself and wait here."'
1029: 'Maria@r@v13/10400158."......Uu."'
1030: '@rNow that Maria had been told to house-sit, we couldn''t just leave her behind.'
1031: '@rGeorge-aniki realized that immediately, and gave a clear reply for all of us.'
1032: 'George@r@v07/10300134."Well, we''ll accept your offer and house-sit.@k@v07/10300135. We have lots of stories to tell each other, after a year."'
1033: 'Kyrie@r@v09/11300052."That would be best.@k@v09/11300053. And Battler-kun has six years'' worth to tell, after all!"'
1034: 'Battler@r@v10/10100250."Yeah, yeah.@k@v10/10100251. I''ll take care of the house like a good little boy."'
1035: 'Jessica@r@v04/10200140."Kumasawa-san, I''m gonna stay here too!@k @v04/10200141.We''ll leave the rest to the adults and us kids''ll break rank, heheheh!"'
1036: 'Kumasawa@r@v18/11800040."That would be for the best, hoh-hoh-ho.@k@v18/11800041. I''ll report it to Madam..."'
1037: 'Gohda@r@v17/11700044."Then, everyone, I will be guiding you to the mansion.@k@v17/11700045. Please, this way."'
1038: 'Eva@r@v05/11000082."...The other kids aside, George is an adult now. Wouldn''t it be better if he came with us?"'
1039: 'Hideyoshi@r@v06/11100072."If we make him come, poor George''ll be the only one left out.@k@v06/11100073. Interactin'' with his cousins is also important.@k@v06/11100074. Well then, see ya, guys!"'
1040: '@rThe adults left one after the other.'
1041: '@rLike the time he had guided us from the harbor, Gohda-san went ahead, with Kumasawa-san at the rear.'
1042: '@rAs we gathered in the cousins'' room assigned to us, George-aniki asked us to excuse him for a second.@k He rushed over to Kumasawa-san, who was following behind the disappearing adults, and seemed to be asking her something.'
1043: '@rHe soon finished his business and came back.'
1044: 'Battler@r@v10/10100252."What''s up, Aniki?"'
1045: 'George@r@v07/10300136."Ah, nothing.@k@v07/10300137. I just wanted to ask something."'
1046: 'Maria@r@v13/10400159."Uu!@k @v13/10400160.Ask me too!@k @v13/10400161.Ask me tooo!"'
1047: 'Jessica@r@v04/10200142."......Hm~?@k @v04/10200143.Hmhuhuhuhu.@k@v04/10200144. What could it be that George nii-san asks Kumasawa-san and doesn''t ask me, I wonder~?@k @v04/10200145.Ah, I don''t have a clue~!"'
1048: 'George@r@v07/10300138."No, you misunderstand...!@k @v07/10300139.I''m not sure what you''re misunderstanding but...!"'
1049: '@rAniki was getting pretty tongue-tied.'
1050: '@rIt''s like he has something to hide, and Jessica has the dirt on him.'
1051: '@r...Whatever it is, something only Jessica knows and I don''t is no fun at all!'
1052: 'Battler@r@v10/10100253."Hey, Maria, it''s not fair that we''re the only ones out of the loop, is it no~w?!@k @v10/10100254.We wanna hear what they''re talking about, don''t we~?!"'
1053: 'Maria@r@v13/10400162."Uu!@k @v13/10400163.Battler and me want to know too!@k @v13/10400164.Battler and me want to know too!"'
1054: '@r@o70.@v10/10100255|13/10400165.""Uu-uu-uu-uu!!!""'
1055: '@rI fooled around while "uu-uu"ing together with Maria.'
1056: 'George@r@v07/10300140."No, I''m telling you...it''s no big deal, ahahaha..."'
1057: 'Battler@r@v10/10100256."Li~ar!@k @v10/10100257.You suck at lying, now confess!@k @v10/10100258.Maria, you tickle his right side, I''ll tickle his left!"'
1058: 'Maria@r@v13/10400166."Uu!@k @v13/10400167.Me on the right side, Battler on the left!@k @v13/10400168.Uu!"'
1059: 'George@r@v07/10300141."Wait a second!!@|@y@k @v07/10300142.Wait you two...!!@k@|@y @v07/10300143.Ahahaha, stop,@|@y@v07/10300144. ahahahahahaha!!"@|@y'
1060: '@rGeorge-aniki rolled around on the bed in an effort to get away, and Maria and I played around chasing him.'
1061: '@rThere''s something in the back of my mind telling me I''m a high-schooler now and not a damn kitten, but in spite of that, I missed this kind of fun.'
1062: '@rA warm kind of fun.'
1063: 'Jessica@r@v04/10200146."Haahahahaha, what George nii-san was asking Kumasawa-san, see...@k @v04/10200147.Hmm~?@k @v04/10200148.Well, you know how it is.@k@v04/10200149. It''s been a year since he last came to the head house.@k@v04/10200150. Apparently he''s really dying to say hi to any servants that might have joined or quit in the meantime, see?"'
1064: 'Maria@r@v13/10400169."......Uu?@k @v13/10400170.Say hi, I''ll say hi too!"'
1065: 'Battler@r@v10/10100259."What the hell, that''s not anything to feel guilty about, Aniki.@k@|@y@v10/10100260. ......Hmm~~m?@k @v10/10100261.That''s not it, is it??@k @|@y@v10/10100262.Maria, don''t be fooled, Aniki''s still hiding somethi~ng!@k @v10/10100263.Resume interrogation!!@k @v10/10100264.Uworyaaa!!"'
1066: 'George@r@v07/10300145."S-stop it, seriously!@k @v07/10300146.Aahahahahaha!@k @v07/10300147.Maria-chan, you too, stop already!!"'
1067: 'Maria@r@v13/10400171."Aahahahahaha, aahahahahaha!@|@y@k @v13/10400172.*giggle*giggle*!!"@|@y'
1068: 'Jessica@r@v04/10200151."They''re probably busy with cleaning or lunch arrangements.@k@v04/10200152. It''s alright, we''ll go and greet them properly afterwards.@k@v04/10200153. Basically, you wanted Shannon out there to greet you, not that Gohda getting in the way, right?!@k @v04/10200154.Heeheheh!"'
1069: 'Battler@r@v10/10100265."Shannon?@k @v10/10100266.......Shannon.@k@v10/10100267. ......Aaaaaaaaahh...@k@|@y@v10/10100268. I remember, that girl!@k @v10/10100269.She''s still a servant now?@k @v10/10100270.How is she?!"'
1070: 'Hideyoshi@r@v06/11100075."By the way, Natsuhi nee-san.@k@v06/11100076. How''s your headache been lately?@k@v06/11100077. It seemed to be pretty serious for a time."'
1071: 'Natsuhi@r@v03/10900001."...I have been much better lately.@k@v03/10900002. Thank you for your concern."'
1072: 'Rosa@r@v12/11400063."Oh, right, here.@k@v12/11400064. A present for you, Natsuhi nee-san."'
1073: 'Natsuhi@r@v03/10900003."......Thank you once again.@k@v03/10900004. I''m always receiving gifts from you.@k@v03/10900005. ...Is this black tea?"'
1074: 'Rosa@r@v12/11400065."It''s herb tea with peppermint and lemon balm.@k@v12/11400066. It''s a blend from a famous store and is supposed to be good for headaches.@k@v12/11400067. I thought it might help you too."'
1075: '@rRosa was always a conscientious woman.'
1076: '@r...Probably because she was the youngest of four, and by quite some distance,@k she managed to grow up without harboring the venomosity of her siblings.'
1077: '@rHer consideration made Natsuhi soften her expression for just a moment,@k but it wasn''t enough to undo the many years of anxiety that had curdled her expression into one of bland indifference...'
1078: 'Eva@r@v05/11000083."Oh yes, you always were saying you get those headaches.@k@v05/11000084. Pull yourself together.@k @v05/11000085.Jessica-chan will have her exams this year, won''t she?@k @v05/11000086.Isn''t that a turning point in her life?@k@v05/11000087. How can she count on her mother like that?@k @v05/11000088.Besides, Natsuhi nee-san, you''re three years younger than me.@k@v05/11000089. Can''t you pull yourself together?"'
1079: 'Natsuhi@r@v03/10900006."............@k@v03/10900007. .........I apologize.@k@v03/10900008. I was born with this discomfort."'
1080: '@rEva sometimes fails to choose her words carefully, but even though she hid it with a smile, her comments aimed at Natsuhi contained shards of obvious malice.'
1081: '@rOf course, that didn''t escape Natsuhi.'
1082: '@rShe frantically contained her urge to grimace, and pretended to ignore Eva.'
1083: 'Kyrie@r@v09/11300054."Our Battler-kun will have his exams this year too, right?@k @v09/11300055.Rudolf-san, shouldn''t you be a little concerned too?@k @v09/11300056.For the sake of your own son, get serious to the point of getting headaches like Natsuhi nee-san."'
1084: 'Rudolf@r@v08/11200087."If I say anything, he automatically goes against it.@k @v08/11200088.So what should I say—maybe the opposite, that it''s okay for him to mess around?@k @v08/11200089.That''s probably the only thing he''d obediently listen to."'
1085: 'Rudolf@r@v08/11200090."In your family, Hideyoshi nii-san, didn''t George do really well on his exams?@k@v08/11200091. Please, teach me the secret to controlling children."'
1086: 'Hideyoshi@r@v06/11100078."Hmm, well...@k@v06/11100079. It''s probably because I convinced him why he should study!@k @v06/11100080.Study isn''t worth anything on its own."'
1087: 'Hideyoshi@r@v06/11100081."That''s right, the real point of studyin'' is to train yourself in the art of researchin'' what you don''t know!@k @v06/11100082.If you can''t do that, you can''t be useful to society!@k @v06/11100083.I''m not talkin'' about math or writin''.@k@v06/11100084. You need to learn how to learn!"'
1088: 'Natsuhi@r@v03/10900009."...That''s splendid.@k@v03/10900010. It would be nice if our Jessica could understand that, though.@k@v03/10900011. I don''t mean this too seriously, but as it is, as an heiress of the Ushiromiya family, she''s—"'
1089: 'Eva@r@v05/11000090."Do you really have to force her into becoming the successor?@k@v05/11000091. Women have to find their own happiness.@k@v05/11000092. Parents shouldn''t be deciding that for their children, right?"'
1090: 'Hideyoshi@r@v06/11100085."Hold your horses, Eva.@k@v06/11100086. Each family has its way to raise their children.@k@v06/11100087. You shouldn''t be pushy."'
1091: 'Eva@r@v05/11000093."I''m sorry.@k@v05/11000094. Natsuhi nee-san, don''t take it the wrong way."'
1092: 'Natsuhi@r@v03/10900012."..........................."'
1093: '@rThough the light shining in through the window was quite warm despite the cloudy weather, there was a dark mood about the room,@k ...which probably caused headaches for other people besides Natsuhi.'
1094: '@rAs if to brush away that mood, Kyrie brightly made a suggestion to all present.'
1095: 'Kyrie@r@v09/11300057."Still, this black tea has a really lovely aroma.@k@v09/11300058. Let''s drink it at once.@k@v09/11300059. I believe that in Japan, you can''t buy something like Leopold''s black tea anywhere but Ginza, right?"'
1096: 'Rosa@r@v12/11400068."Kyrie nee-san, how knowledgeable of you.@k@v12/11400069. It really was worth buying."'
1097: '@rKyrie and Rosa stood up from their seats and made as if to prepare the black tea.@k@rNatsuhi forestalled them.'
1098: 'Natsuhi@r@v03/10900013."......Thank you both.@k@v03/10900014. Let us save that for later.@k@v03/10900015. One of our people will soon be coming to bring some tea, so please relax."'
1099: 'Rudolf@r@v08/11200092."Leave it for later, you two.@k@v08/11200093. Let them treat us to a "welcome drink" at least."'
1100: '@rRudolf gave a subtle signal with his eyes for them to sit down again.@k@r...Kyrie and Rosa understood instantly and obediently returned to their seats.'
1101: '@rThe guests had already been greeted, so it was time for some tea to be prepared for them.'
1102: '@r...That tea was late, and having the guests talk about making some themselves was an embarrassment for the host.'
1103: '@rNatsuhi bit her lower lip, frustrated with the ineptitude of the servants who were taking too long to bring the tea.'
1104: '@r...Seeing her face, Eva, without hesitation, started to giggle.'
1105: '@r......Of course, Shannon had no way of knowing what was taking place in the parlor.'
1106: '@rAs she came in pushing a dish cart piled with tea cups,@k Natsuhi gave her a pained look for no apparent reason, and Shannon couldn''t help but flinch without knowing what she had done wrong.'
1107: 'Shannon@r@v15/10500001."......E-excuse me.@k@v15/10500002. I shall prepare some tea for you."'
1108: 'Hideyoshi@r@v06/11100088."Oh, Shannon-chan, it''s been a while!@k @v06/11100089.You keep getting prettier every time I see you!"'
1109: 'Shannon@r@v15/10500003.".........Oh,@v15/10500004. ...um,@v15/10500005. .........thanks—"'
1110: 'Natsuhi@r@v03/10900016."Leave the chatting for after you''ve set the table.@k@v03/10900017. The tea will get cold."'
1111: 'Shannon@r@v15/10500006."......I, ...I apologize, Madam."'
1112: '@rShe apologized like a small frightened animal, and, bumping against the serving cart, made a jarring racket as she dropped several tea spoons.'
1113: '@rHer clumsiness made Natsuhi''s expression even harsher, which made Shannon in turn quail even more.'
1114: 'Eva@r@v05/11000095."It''s alright, Natsuhi nee-san.@k@v05/11000096. What does a single greeting matter?@k@v05/11000097. We''ve already been made to wait for so long, the tea must be quite cold anyway.@k@v05/11000098. Heheheh."'
1115: 'Shannon@r@v15/10500007."It, ...it''s alright...@k@v15/10500008. It''s not cold yet, so—"'
1116: 'Natsuhi@r@v03/10900018.".........Shannon, finish setting the table, quickly."'
1117: 'Shannon@r@v15/10500009."I, I''m sorry, Madam......"'
1118: '@rIt was obvious that Natsuhi was getting irritated.'
1119: '@r...The ineptitude that delayed the tea, the clumsiness of the servant—everything pointed to the incompetence of Natsuhi''s everyday guidance, making her lose face.'
1120: '@rAs the person in charge of matters of the Ushiromiya head house, allowing that clumsiness to be exposed today of all days was surely nothing less than total humiliation.'
1121: 'Rudolf@r@v08/11200094."Lay off, Natsuhi nee-san.@k@v08/11200095. Don''t you think it''s a little harsh to bully Shannon-chan when she''s trying her best?"'
1122: 'Natsuhi@r@v03/10900019."I''m not bullying anyone...!"'
1123: 'Kyrie@r@v09/11300060."What a nice smell.@k@|@y@v09/11300061. May I ask you the brand of this tea?"'
1124: 'Shannon@r@v15/10500010."............Umm...@v15/10500011.......I''m, ...I''m terribly sorry...@k@v15/10500012. I''ll find out for you later..."'
1125: '@rKyrie had tried to be nice to her, wanting to cut through the tense mood.'
1126: '@r...However, instead, Shannon had shown a disgraceful display, darkening Natsuhi''s face and the room''s mood.'
1127: '@rBy this point, Eva''s giggles were loud enough to be heard by everyone in the room.'
1128: 'Eva@r@v05/11000099."Whaat''s thiis?@k @v05/11000100.Shannon-chan, don''t you even know what you''re pouring us?@k @v05/11000101.Come now, you mustn''t serve something so suspicious to guests.@k@v05/11000102. We''ll need a silver spoon at the very least before we can drink this."'
1129: 'Shannon@r@v15/10500013.".........I, ...I''m sorry......@k@v15/10500014. I''ll go get one immediately—"'
1130: 'Eva@r@v05/11000103."Shannon-chan?@k@v05/11000104. Do you know what silver spoons are used for?@k @v05/11000105.Or why they have to be silver?@k @v05/11000106.Do you know why?"'
1131: 'Shannon@r@v15/10500015."...............no...@v15/10500016..........umm......"'
1132: '@rEva''s eyes played over Shannon, who was setting the table, as a catty smile floated onto her face.'
1133: '@r...Taken on its own, the expression on Eva''s face may have been charming, in an impish sort of way.'
1134: '@rHowever, the words being spun from her lips held within them the keenness of a razor.'
1135: '@rShannon tried with all her might to avoid Eva''s gaze, which continued to focus on her.'
1136: '@rGrasping that Shannon was hard-pressed for an answer, Rosa promptly gave some timely help.'
1137: 'Rosa@r@v12/11400069_1."They say that silver dims if it is touched by poison.@k@v12/11400069_2. ...*giggle*, you''ve learned something, right, Shannon-chan?"'
1138: '@rThe tea was being treated as undrinkable unless it could first be tested for poison.'
1139: '@rIn Natsuhi''s eyes, this was an insult to both the tea...and herself for serving it.'
1140: '@rRudolf, laughing flippantly, patted Eva''s shoulder.'
1141: 'Rudolf@r@v08/11200096."Haha, you don''t need any silver cutlery.@k@v08/11200097. With just one lick of your poisonous tongue, even a silver plate would go pitch black."'
1142: 'Hideyoshi@r@v06/11100090."Wahahahaha!@k @v06/11100091.I get to hear that poison-tongue every day, so I must be poison-proof by now!@k @v06/11100092.Eva, I don''t mind you doing it to me, but you''ve gotta tone it down a smidgen for the poor souls without resistance!@k @v06/11100093.Wahahahaha!"'
1143: 'Eva@r@v05/11000109."My, how cruel.@k@v05/11000110. I only gave Shannon-chan a bit of information about tea, didn''t I?@k@v05/11000111. *giggle*."'
1144: '@rEveryone followed the lead set by Hideyoshi''s horselaugh and smiled, though sourly.'
1145: '@rThere remained a single exception to this in Natsuhi, but even so, for the time being, the conversation inside the parlor could now be mistaken for a lively and friendly chat.'
1146: '@rAs Shannon finally finished setting the tea table and made to leave, Kyrie apologized to her in a low voice for not being able to help.'
1147: '@r...Shannon gave a light bow and made a hasty retreat......'
1148: '@rShannon cast her eyes downwards, pushing the cart down the corridor...'
1149: '@rThe pitiful air around her made it obvious that she had borne the brunt of some bullying.'
1150: 'Kanon@r@v16/10600023."......Don''t be sad.@k@v16/10600024. You didn''t do anything wrong, Nee-san."'
1151: 'Shannon@r@v15/10500017."...............You were watching."'
1152: 'Kanon@r@v16/10600025."That is my duty."'
1153: 'Shannon@r@v15/10500018."........................"'
1154: 'Kanon@r@v16/10600026."Madam and Eva-sama can go to hell.@k@v16/10600027. ......But the even worse coward is that guy."'
1155: '@rKanon glared hatefully in the opposite direction of the parlor.'
1156: '@rThe preparations for the tea had been delayed by a little bit of trouble in the kitchen.'
1157: '@rThat trouble had not been Shannon''s fault.@k@rThe truth is that it had been Gohda''s mistake.'
1158: '@rIn the first place, there was no way that a showoff like Gohda would ever hand over a flamboyant job like carting the tea to the guests.'
1159: '@rHe had needed to make the tea all over again, which had made him late.'
1160: '@rSo, realizing that he wouldn''t be earning any brownie points, he had pushed the task of setting the table on Shannon, who happened to be passing by.'
1161: '@r......One could truthfully call it being shrewd, and one could unquestionably call it cowardice.'
1162: 'Shannon@r@v15/10500019."......It''s alright, Kanon-kun, thank you.@k@v15/10500020. ...I really don''t mind..."'
1163: 'Kanon@r@v16/10600028."................................."'
1164: '@rKanon''s silence vividly showed that Shannon''s words weren''t coming from her heart.'
1165: 'Shannon@r@v15/10500021."............Thank you.@k@v15/10500022. Even if you''re the only one who understands, I still feel a bit better, I think."'
1166: 'Kanon@r@v16/10600029."......You bottle things up too much, Nee-san.@k@v16/10600030. ......You should be less hard on yourself for once."'
1167: 'Shannon@r@v15/10500023."Yeah.@k@v15/10500024. ......Thanks."'
1168: '@rSuddenly, they both felt someone''s presence and whirled around.'
1169: '@rAn elderly man stood there.@k@rIt was Genji, the head servant.'
1170: 'Genji@r@v14/11600003."..................What are you doing here?@k@v14/11600004. ...Shannon, hurry back to the kitchen."'
1171: 'Shannon@r@v15/10500025."Y-yes.@k@v15/10500026. ......If you''ll excuse me......"'
1172: 'Kanon@r@v16/10600031."................................."'
1173: '@rShannon humbly obeyed and promptly made to push the cart and leave.'
1174: '@rHowever, Kanon appealed to Genji in silence, bearing something in his eyes that he could not express in words.'
1175: 'Genji@r@v14/11600005."...............What is it?@k@v14/11600006. Did something happen...?"'
1176: 'Kanon@r@v16/10600032."...Sha-@v16/10600032_1.......Shannon didn''t do anything wrong,@v16/10600032_2. but those—"'
1177: 'Shannon@r@v15/10500027."Stop it, Kanon-kun..."'
1178: 'Shannon@r@v15/10500028."......If you''ll excuse me.@k@v15/10500029. I''ll return to work immediately.@k@v15/10500030. Kanon-kun, you too, go back to your post.@k@v15/10500031. ......Please."'
1179: 'Kanon@r@v16/10600033."............If you say so, Nee-san."'
1180: 'Genji@r@v14/11600007."..................@k@v14/11600008. ...If there is nothing, then go."'
1181: 'Kanon@r@v16/10600034."......Yes.@k@v16/10600035. ......If you''ll excuse me."'
1182: '@rFrom the shadows in the hallway, an old woman wearing an apron watched over them. It was Kumasawa...'
1183: 'Kumasawa@r@v18/11800041_1.......How heartrending, Shannon-san, Kanon-san...@k@r@v18/11800041_2.There''s no reason for those two to be picked on.@k@r@v18/11800041_3. ...But, it cannot be denied that they are disliked by Gohda-san...'
1184: 'Kumasawa@r@v18/11800041_4.Before Gohda-san was taken in by the Ushiromiya head house, I heard he worked for a fabulous hotel somewhere.'
1185: 'Kumasawa@r@v18/11800041_5.I do think the manner of work he learned there was quite something.'
1186: 'Kumasawa@r@v18/11800041_6.It''s just that...Gohda-san is the newest servant here.@k@r@v18/11800041_7....He must have a lot of pride accumulated from his previous posts.'
1187: 'Kumasawa@r@v18/11800041_8.Because Shannon-san and Kanon-kun are his seniors here at the mansion, and yet are inexperienced and have gone through much less in life than he has, he picks on them at every chance he gets...'
1188: 'Kumasawa@r@v18/11800041_9.And also, ...although it''s terrible, they are hated by Madam Natsuhi too...'
1189: 'Kumasawa@r@v18/11800041_a.Of course, in terms of experience, Madam has been in the family much longer.'
1190: 'Kumasawa@r@v18/11800041_b.However.........I must feel some sympathy for Madam as well in this case.'
1191: 'Kumasawa@r@v18/11800041_c....The Master is a truly cruel person...'
1192: 'Kumasawa@r@v18/11800041_d.Why could he not have realized that his trifling whim would pass such an inferiority complex onto Madam...'
1193: 'Kumasawa@r@v18/11800041_e.......Naturally, deep inside, even Madam fully acknowledges that there''s no reason to treat those two so harshly...'
1194: 'Kumasawa@r@v18/11800041_f....However, the heart has reasons that reason knows not...'
1195: 'Kumasawa@r@v18/11800041_g.Ahh, how heartrending...'
1196: 'Kumasawa@r@v18/11800041_h.I cannot do anything but watch over them from the shadows......'