427: 'Battler@r@v10/10100078.".........Should''ve taken the boat...@v10/10100079.......the boat......"'
428: 'Maria@r@v13/10400028."Gonna faaalll!@k @v13/10400029.Gonna faaalll!@k @v13/10400030.Uu-uu-uu-uu!!"'
429: 'Rosa@r@v12/11400024."Maria, that''s enough!"'
430: 'Rosa@r@v12/11400025."......But what a surprise.@k@v12/11400026. I thought there was nothing that could scare Battler-kun."'
431: 'Rudolf@r@v08/11200048."This guy can''t handle vehicles for some reason.@k@v08/11200049. Always yells about falling and sinking and stuff.@k@v08/11200050. You''re a disgrace of a man, you are."'
432: 'Battler@r@v10/10100080."......Urgh, shut up.@k@v10/10100081. That thing was seriously shaking way too much...@k@v10/10100082. I just got a little stressed, since it was my first time on a small plane like that..."'
433: 'Eva@r@v05/11000051."You call that "a little stressed"?@k @v05/11000052.Heheheh, sounds like it''d be fun to take an overseas vacation with you, Battler-kun.@k@v05/11000053. Would you like to go to Egypt with your aunt?@k @v05/11000054.You''d get to ride a plane for a full 14 hours!"'
434: 'Kyrie@r@v09/11300031."Ahhahaha!@k @v09/11300032.There''s a good plan.@k@v09/11300033. Battler-kun, you should go let Eva nee-san toughen you up some.@k@|@y@v09/11300034. But boy were you hilarious!@k @v09/11300035.Ahhahahaha!"'
435: 'Hideyoshi@r@v06/11100032."Wahhahaha, now, now. Everyone''s got their own strong and weak points.@k@v06/11100033. It''s bad to laugh at ''em.@k@|@y@v06/11100034. Wahhahaha...!"'
436: 'George@r@v07/10300036."D-Dad, you''re laughing too.@k@v07/10300037. Hey, Maria-chan, you shouldn''t laugh anymore."'
437: 'Maria@r@v13/10400031."Shouldn''t laugh anymore?@k @|@y@v13/10400032.Uu!"'
438: '@rGyah, dammit!@k Is being scared of planes really such a big deal?@k@rEveryone obviously thinks I''m a big oaf now...@k Tch!'
439: '@rWe split up and took separate taxis from the airport to the harbor.@k@rFrom there on, we would be taking a boat to the island.'
440: '@rThe islands are right next to each other, so it''s not that far.@k@rIt would be a leisurely thirty minutes by boat.'
441: '@rAs we arrived at the pier where the boat to the island was anchored, we saw a silhouette waving its hand.'
442: 'Jessica@r@v04/10200001."George nii-saaan!@k @v04/10200002.It''s been so frickin'' long!!"'
443: 'George@r@v07/10300038."Ah, Jessica-chan, it''s been a year since I saw you!@k @v07/10300039.You''ve gotten taller again, haven''t you?"'
444: 'Jessica@r@v04/10200003."Kyahaha, don''t gimme that, it''s embarrassing hearing that every year!"'
445: 'Battler@r@v10/10100083."......H-hey, Aniki, you''ve gotta be kidding me.@k@v10/10100084. That''s really Jessica?!"'
446: 'Jessica@r@v04/10200004."Wait a sec, George nii-san...@k@v04/10200005. This massive beast...@v04/10200006.is Battler?!"'
447: '@rWe both stared each other down.'
448: '@r...She definitely didn''t look this grown-up in my memories, but I do remember her crazy way of talking.'
449: 'Battler@r@v10/10100085."Yo, Jessica!@k @v10/10100086.What''s this now!@k @v10/10100087.You''re kidding me, you look like a woman now!@k @|@y@v10/10100088. What''re these, boobs? Even you managed to get a chest!@k @|@y@v10/10100089.Ihihi, let me rub ''em, let me~!"'
450: 'Jessica@r@v04/10200007."Hey, screw you, I''m a blushing flower of 18!@k @v04/10200008.Just like hair grows out, so''ll other stuff!@k @v04/10200009_b.You think I got boobs just so you can go and rub ''em, loser?!@k @v04/10200010.And what about you, got anything to back up that ridiculous size?!@k @v04/10200011.Did you remember to grow any actual muscle?!"'
451: 'Battler@r@v10/10100090."You''d better believe it, I''ll show you how much training I''ve piled up since back then!!"'
452: 'Jessica@r@v04/10200012."Oh, cram it!!@k @v04/10200013.I''ll beat you at your own game!"'
453: '@rThis headstrong girl''s name is Ushiromiya 朱志香.'
454: '@r......She was born under the same unlucky star as me, sharing the same kind of weird name.@k You see, 朱志香 is pronounced "Jessica".'
455: '@rShe''s Dad''s older brother''s daughter.'
456: '@rThat older brother happens to be the eldest son of the Ushiromiya family, so I guess that also technically makes Jessica a direct heir to the Ushiromiya family.'
457: '@rSince Jessica and I are the same age and had that type of boy-girl rivalry between us,@k we''ve always been used to fighting and joking around together whenever the relatives gathered.'
458: '@rJessica grew more quickly, so she always had me beat in terms of size and physical strength.'
459: '@rSo, when we scuffled as a contest of strength like this, it usually went Jessica''s way.'
460: '@rSo even though I clearly understand that I''m bigger now, I still feel like I can''t win against Jessica with my strength.'
461: 'Battler@r@v10/10100090_1."Hnng! Ghhh......!!"'
462: 'Jessica@r@v04/10200014."............Woh...ah...!@k @v04/10200015.What the...what''re you...getting all serious for...?!@k @v04/10200016.Owowow..."'
463: 'Battler@r@v10/10100091."Hey hey hey, this is nothin''!@k @v10/10100092.Jessica, you''ve gotten weak."'
464: 'Jessica@r@v04/10200017."Sh-shut up.@k@v04/10200018. I''m a woman over here, believe it or not.@k@v04/10200019. No way I was always gonna be stronger than a man!"'
465: 'Battler@r@v10/10100093."We~ll, that''s certainly true!@k @v10/10100094.The meat I put on my arms all went to your chest, after a~ll.@k@v10/10100095. It looks like it''d be a pretty even test of strength between my arms and your boobs, don''t you thi~nk?!"'
466: 'Jessica@r@v04/10200020_b."I told you, my boobs aren''t for you to feel up!!@k @v04/10200021.Besides, how ''bout you - your height says you''re an adult, but what about your other places, huh?!"'
467: 'Battler@r@v10/10100096."Stop it, idiot, nooo, I''ll be ruuuuined for marriage, don''t touch me in strange placeees!!"'
468: 'Jessica@r@v04/10200022."D-don''t say stuff people are gonna misinterpret!!"'
469: '@rHonestly, I was so surprised at how feminine Jessica had become that I had to seriously horse around to hide it.'
470: '@r......Well yeah, considering what a bossy brat she was six years ago, anyone would be surprised.'
471: '@rAnd I guess she''s just as surprised.@k@rShe definitely wasn''t expecting she''d lose to me in a test of strength.'
472: '@rAfter losing that easily, she must be shocked at how much I''ve grown in the past six years.'
473: '@r.........Six years.@k Once again, I''m being shown just what a huge gap of time that was.'
474: 'Jessica@r@v04/10200023."Crap...total defeat.@k@v04/10200024. It''s like I''m no match for you anymore."'
475: 'George@r@v07/10300040."That''s not true.@k@v07/10300041. Even Battler-kun must have his weaknesses.@k@v07/10300042. Right, Maria-chan?"'
476: 'Maria@r@v13/10400033."Uu!@k @v13/10400034.Gonna faaall gonna faaall!!"'
477: 'Battler@r@v10/10100097."Ghhk - Don''t - Maria~, let''s keep that a secret, okay?"'
478: 'Jessica@r@v04/10200025."Faaall?@k @v04/10200026.What the hell''s that?"'
479: 'Battler@r@v10/10100098."Heheh!@k @v10/10100099. Sorry, but you won''t be seeing that weakness of mine now!@k @v10/10100100.After all, the nightmare plane trip is already over and done with!@k @v10/10100101.Only thing left is the nice, quiet splashing of the boat trip.@k@v10/10100102. I never thought I''d become so fond of that piece-a-junk boat.@k@v10/10100103. Ihihihi!"'
480: 'Jessica@r@v04/10200027."Huh???@k @v04/10200028.George nii-san, is there something wrong with his head?"'
481: 'George@r@v07/10300043."You''ll understand soon.@k@v07/10300044. Very soon."'
482: '@rAt the time, I didn''t understand what Aniki meant by that big smile...'
483: 'Kumasawa@r@v18/11800001."What have we here......oooh!@k @v18/11800002.Battler-san, how big you''ve grown...!"'
484: '@rWho''s it this time?@k It''s an old lady with an apron.@k@r.........Oh, oh yeah, that takes me back...I remember now!'
485: 'George@r@v07/10300045."Remember her, Battler-kun?@k @v07/10300046.You remember - she''s Kumasawa-san, one of the servants."'
486: 'Battler@r@v10/10100104."I could never forget Kumasawa baa-chan!@k @v10/10100105.I mean, you haven''t aged a bit in these past six years.@k@v10/10100106. Wait, you haven''t gotten younger, have you~?"'
487: 'Kumasawa@r@v18/11800003."Hoh-hoh-ho!@k @v18/11800004.Lately, my skin has been getting all smooth and silky!@k @v18/11800005.And look, hasn''t my chest gotten even bigger as well?@k @v18/11800006....Want to give it a rub?"'
488: 'Battler@r@v10/10100107."V-very funny!@k @v10/10100108.My breast rubbing is strictly limited to bouncy girls!"'
489: 'Kumasawa@r@v18/11800007."Even I had some bouncy ones in my youth, you know~?@k @v18/11800008.Now, now, please feel free to have a go!"'
490: 'Battler@r@v10/10100109."Gyah, gimme a break!@k @v10/10100110.It''s chicks I''m looking for, dammit!@k @v10/10100111.Not grannies!"'
491: '@rThe jokes I''d cracked about Jessica were being used against me.@k Come to think of it, she always was the type to tease people!'
492: 'Rudolf@r@v08/11200051."Kumasawa-san, stop that now.@k@v08/11200052. People with one foot in the coffin shouldn''t jump around."'
493: 'Kumasawa@r@v18/11800009."To sport with the young is the best rejuvenation medicine.@k@v18/11800010. Hoh-hoh-ho!"'
494: 'Eva@r@v05/11000055."It''s rare for you to come pick us up, Kumasawa-san.@k@v05/11000056. What curious turn of events is this?@k @v05/11000057.Normally whenever you''re entrusted with something to do, your lumbago always kicks in.@k@v05/11000058. *snicker*."'
495: 'Kumasawa@r@v18/11800011."Hoh-hoh-ho, Eva-sama, you are harsh as usual.@k@v18/11800012. I found myself with some urgent purchases to make, and while I was at it, I thought I would come welcome you all.@k@v18/11800013. Although, it does give a bad impression if the one waiting to greet you is a decrepit old woman.@k@v18/11800014. Hoh-hoh-ho...!"'
496: '@rAuntie Eva spoke sarcastically, but Kumasawa baa-chan''s years of experience were nothing to sneeze at.@k She was more than capable of smoothly and coolly letting that comment slide.'
497: '@rWell, I''d rather not say it, but old Kumasawa baa-chan may be past her prime as a servant.'
498: '@rShe might act as though she''s in good health, but between her headaches and the lumbago, her body is wearing out.@k To tell the truth, the very fact that she''s still working is impressive.'
499: '@r...How old is she this year again?@k@rShe must be pushing eighty by now.@k@rIt''s incredible that she''s still able to act so brightly.'
500: 'Rosa@r@v12/11400027."You just seem to get more and more lively.@k@v12/11400028. Oh, that''s right, here you are.@k@v12/11400029. It''s the tea I was talking about before.@k@v12/11400030. Look, I bought some.@k@v12/11400031. Please do try it later on."'
501: '@rAuntie Rosa showed her the souvenir bag she''d taken out of her suitcase.'
502: '@rTo think that she had remembered the promise that she had apparently made last year and faithfully bought it.@k ...This sort of thoughtfulness was just like Auntie Rosa.'
503: '@rShe wasn''t the kind of person who would forget or break a promise.'
504: '@rAs for Kumasawa baa-chan, she seemed deeply touched by the fact that not only had Auntie Rosa remembered that year-old promise, she had brought that gift for a simple servant like her.'
505: '@rThis woman is Kumasawa Chiyo-san (熊沢 チヨ).'
506: '@rShe''s a senior servant who''s been working for the Ushiromiya head house for many years.@k@rAs you could expect from someone her age, she isn''t that good at manual labor, but from kitchen work to cleaning and laundry, she''s a kind of super servant who can handle just about anything.'
507: '@rIt seems like her only flaw is a tendency to slack off.'
508: '@rI hear she tries to get away from heavy or troublesome work by playing up her chronic diseases.'
509: '@r......In Kumasawa baa-chan''s case, maybe we should call that a sort of lazy craftiness.'
510: '@r...Though it probably doesn''t impress those paying her salary.'
511: '@rAh well, even if she''s pretty flaky when it comes to work, I could never dislike her.'
512: '@rI guess that''s probably because of her cheerfulness and her constant smile.'
513: 'Hideyoshi@r@v06/11100035."Hey, glad to see you''re still in fine spirits!@k @v06/11100036.How''s your back doin'' then?"'
514: 'Kumasawa@r@v18/11800015."Even with the medicine, it''s not getting one whit better.@k@v18/11800016. According to the doctor, nothing can be done for this one.@k@v18/11800017. It''s what''s called an incurable disease, hoh-hoh-ho!"'
515: 'Rudolf@r@v08/11200053."Blows me away how you''ve just kept getting prettier, Jessica-chan.@k@v08/11200054. Be glad you ended up like Natsuhi nee-san."'
516: 'Jessica@r@v04/10200029."R-really...?@k @v04/10200030.Personally, I don''t think I look like her at all...@k@v04/10200031. I mean, I don''t even want to be like my parents.@k@v04/10200032. ''Cause I got zero respect for ''em."'
517: 'Kyrie@r@v09/11300036."Now, you shouldn''t say such things.@k@|@y@v09/11300037. *giggle*, it''s amazing how many people don''t want to be like their parents in our family."'
518: 'Battler@r@v10/10100112."Ah, that''s me!"'
519: 'Rudolf@r@v08/11200055."Hell no, don''t you dare start taking after me.@k@v08/11200056. Your nose looking like mine already pisses me off."'
520: 'Kyrie@r@v09/11300038."What are you talking about?@k@v09/11300039. It''s ridiculous how completely alike you are - and like your father."'
521: 'Rudolf@r@v08/11200057."Come on, you can''t be serious...@k@v08/11200058. Just how am I like Dad?"'
522: 'Eva@r@v05/11000059."You''re his copy in arrogance and self-importance.@k@v05/11000060. Father''s blood is especially strong in you and Nii-san.@k@v05/11000061. Wouldn''t you say, Rosa?"'
523: 'Rosa@r@v12/11400032."Oh, absolutely.@k@v12/11400033. Krauss nii-san and Rudolf nii-san are almost unbelievably like Dad."'
524: 'Rudolf@r@v08/11200059."Alright, alright already, why am I the only one under fire from the girls?@k@v08/11200060. Hideyoshi nii-san, please help me out."'
525: 'Hideyoshi@r@v06/11100037."My my, Rudolf-kun, you''re always so popular with the ladies.@k@v06/11100038. I''m jealous!@k @v06/11100039.Wahahahaha!"'
526: 'Kumasawa@r@v18/11800018."Hoh-hoh-ho!@k @v18/11800019.As usual, you''re popular enough to make me jealous.@k@v18/11800020. Well then, everyone, shall we head over to the boat?@k@v18/11800021. Come now, Maria-san, let''s get on the boat together, alright?"'
527: 'Maria@r@v13/10400035."Get on the boat together.@k@v13/10400036. Uu!@k @v13/10400037.Everyone gets on together.@k@v13/10400038. Uu!"'
528: 'Battler@r@v10/10100113."Hell yeah, this time around I''m not gonna be scared.@k@v10/10100114. I''m used to being shaken by the waves.@k@v10/10100115. With that piece-a-junk fishing boat, I''m less afraid of the shaking than the engine breaking down and the boat drifting off."'
529: 'George@r@v07/10300047."Oh yes, Battler-kun, I forgot to tell you.@k@v07/10300048. ...That fishing boat was completely decrepit, so it was taken out of use a few years back.@k@v07/10300049. Now we get taken to the island in another boat."'
530: 'Jessica@r@v04/10200033."Ohhh, right.@k@v04/10200034. It''s Battler''s first time in the new boat!@k @v04/10200035.It''s super comfy!@k @v04/10200036.And frickin'' fast!@k @v04/10200037.It can go at crazy high speeds!"'
531: 'Battler@r@v10/10100116."Ohhh...@k@v10/10100117. That means less trip time, right?@k@v10/10100118. That sounds great!@k @v10/10100119.I mean, a boat might be better than an airplane, but if you''re telling me we can spend even a little less time exposed to the danger of sinking, that''s really just awesomely great~."'
532: 'Maria@r@v13/10400039."...Uu.@k@v13/10400040. Is Battler gonna faaall gonna faaall again?"'
533: 'Battler@r@v10/10100120."That''s only on airplanes.@k@v10/10100121. Everything''s fine now!"'
534: 'Jessica@r@v04/10200038."You know, it''s apparently a modded high-speed boat, the captain''s pride and joy!@k @v04/10200039.Seems he''s tinkered with it quite a lot -@k@v04/10200040.he was going on about how he attached four high efficiency propellers to it, and now it can break 40 knots, or something like that.@k@v04/10200041. He bragged to me so much I ended up memorizing it."'
535: 'George@r@v07/10300050."Me too; I remember since we''re told about it every year.@k@v07/10300051. The captain said that since he lost a speed contest with a foreign fishing boat a long time ago, he became obsessed with modding.@k@v07/10300052. He told us how his opponent back then could go at over 30 knots, even though it was only in a fishing boat."'
536: 'Jessica@r@v04/10200042."To fulfill his thirst for a revenge match, he created an awesome whole new super high-speed modded boat.@k@v04/10200043. I''m sure you''ll just love it, Battler."'
537: '@r...S-super high-speed modded boat...?'
538: '@r......My first thought was that this would be much better than some beat-up boat that might sink at any time......@w500.but for some reason, I''m getting this feeling of foreboding...@k ......Nah.'
539: 'Rudolf@r@v08/11200061."Hey, Battler, maybe you should just swim to the island."'
540: 'George@r@v07/10300053."Battler-kun, you shouldn''t lean over the railing too much.@k@v07/10300054. You might fall."'
541: 'Maria@r@v13/10400041."Uu-uu!!@k @v13/10400042.Gonna faaall gonna faaall!!"'
542: 'Battler@r@v10/10100122."Daaaaammiiiiit...so this is why you were all grinning before!"'
543: '@rThe super high-speed boat, said to have been modded to hell and back by its captain as a personal hobby, was definitely nothing like the battered old fishing boat from six years ago.'
544: 'Battler@r@v10/10100123."Whooooooooa, it''s shaking it''s shaking it''s shaking!!@k @v10/10100124.I''m gonna fall gonna fall gonna fall!!"'
545: 'Maria@r@v13/10400043."Uu-uu-uu!!@k @v13/10400044.Gonna fall gonna fall gonna fall!!"'
546: 'Battler@r@v10/10100125."If I fall I''ll be in the sea, I''ll drown goddammit - where''s the parachute - no, wait - where''s the buoy?!@k @v10/10100126.Gimme a life jackeeeet!!"'
547: 'Jessica@r@v04/10200044."Waah-hah-hah-hah-ha!@k @v04/10200045.What the hell, Battler, what''s that supposed to be...waah-hah-hah-hah-ha!"'
548: 'George@r@v07/10300055."Jessica-chan, Maria-chan, it''s not nice to tease.@k@v07/10300056. Battler-kun, if you''re scared, then just don''t come out on the deck.@k@v07/10300057. I think that if you stay inside the boat, you''ll be a bit less afraid."'
549: 'Battler@r@v10/10100127."Heheh, that''s a no-thank-you, Aniki!@k @v10/10100128.Shipwreck victims are always the ones inside the boat.@k@v10/10100129. The survivors are usually those on the deck during the accident.@k@v10/10100130. So I''m staying right here!!"'
550: 'Battler@r@v10/10100131."But, it''s shakiiiiing!!@k @v10/10100132.I''m falliiing!!@k @v10/10100133.Whooooaaaaaahhh!!"'
551: 'Maria@r@v13/10400045."Shaking falliing!!@k @v13/10400046.Uu-uu-uu!!"'
552: 'Rosa@r@v12/11400034."Maria, I told you to behave yourself!@k @v12/11400035.......But Battler-kun, it looks like you really can''t handle it...@k@v12/11400036. I''ll go tell the captain to slow down for you."'
553: 'Battler@r@v10/10100134."Whooooa, Auntie Rosa, thank yooooouuuuu!@k @v10/10100135.Even on the sea, exercise safe driving, reduce speeds, point and caaaall!!"'
554: 'Eva@r@v05/11000062."*cackle*!@k @v05/11000063.Don''t do that, Rosa.@k@v05/11000064. Ordeals are necessary for the young.@k@v05/11000065. Right, Battler-kun?@k @v05/11000066.You can conquer this much, no problem at all, right?@k @v05/11000067.Otherwise, you won''t be able to go to Egypt with your aunt!"'
555: 'Battler@r@v10/10100136."Whooooa, Auntie Eva, you''re meeeeeeeeaaaan!@k @v10/10100137.Ooh noooo, I''m gonna faaaaaall!!@k @v10/10100138.Life jackeeeet, parachuuuute!!@k @v10/10100139.Whoooooooaaaaaaahh......!!!"'
556: 'Battler@r@v10/10100140."N-no, okay, turn it over and think that way!!@k @v10/10100141.What''s the enemy aiming for?!@k @v10/10100142.He wants to make me afraid like this?!@k @v10/10100143.If that''s what he''s aiming for, too bad, like hell I''ll be scaaaaaaaared!!@k @v10/10100144.But stooopp iiit, I''m gonna faaaaaaall!!!"'
557: '@r...So, after I made a huge fool of myself for a while,@k Auntie Rosa had a talk with the boat captain, and he slowed down to a more manageable speed for me...'
558: 'Battler@r@v10/10100145."............Hahh...@k@v10/10100146. This speed is a bit better...@k@v10/10100147. .........Earlier, I didn''t even feel alive......"'
559: '@rThe new speed, which I was capable of tolerating, was apparently extremely slow.'
560: '@r...But that just now was completely insane...'
561: '@rThe whole boat was shaking!@k@rSliding and leaping on the ocean''s surface!@k@rIt felt like I was riding on the back of a flying fish...'
562: '@rJessica was still guffawing at me as I leaned against the railing, tired and disheartened.'
563: 'Jessica@r@v04/10200046."I lost in that strength contest earlier, but I''m glad to know I''ve got the edge where it really counts.@k@v04/10200047. But seriously, pfffahahahahah!"'
564: 'Battler@r@v10/10100148."Dammit...go ahead and laugh.@k@v10/10100149. One of these days, I''m gonna find your weakness and I''ll get back at you...and then your boobs will be mine to squish......"'
565: 'Jessica@r@v04/10200048."Ahahaha, well, we''ll see about that if you ever do find it, okay?!@k @v04/10200049.Waah-hah-hah-ha!"'
566: 'Maria@r@v13/10400047."Uu.@k@v13/10400048. Battler, all worn out."'
567: 'Battler@r@v10/10100150."Yeah, Battler, all worn out...@k@v10/10100151. I want to die on land, not in the ocean or the sky..."'
568: '@rMaria was patting my back, so I patted her head in return.'
569: '@r...Her expression was blank, as usual, but I realized that she wanted to console me.'
570: 'George@r@v07/10300058."Battler-kun, the captain is throwing in drinks to make up for this.@k@v07/10300059. Have a drink and take a break, why don''t you?@k@v07/10300060. To calm yourself down."'
571: '@rGeorge-aniki and Kumasawa baa-chan brought us each an ice-cold drink with drops of moisture on the can.'
572: '@rJudging from Kumasawa-san''s big grin, our parents inside the boat were probably all rolling around laughing at my moment of pure terror.'
573: '@rDammit, I''m so embarrassed that I can''t bear to face any of them...'
574: '@rIf I didn''t change the subject somehow, I had the feeling I''d be the butt of everyone''s jokes for the whole trip, so I tried to think of something harmless to talk about.'
575: 'Battler@r@v10/10100152."...Hey, Jessica.@k@v10/10100153. How are Uncle Krauss and Aunt Natsuhi doing?"'
576: 'Jessica@r@v04/10200050."My old man and my mom?@k @v04/10200051.Unfortunately, they''re fine.@k@v04/10200052. Though every other word out of their mouths is "study, study", which pisses me off.@k@v04/10200053. I''m so jealous, ''cause it doesn''t look like Uncle Hideyoshi or Uncle Rudolf say those kinds of things."'
577: 'George@r@v07/10300061."Hahaha, oh no.@k@v07/10300062. When I was slacking off during exams, I was always getting told "exams, exams".@k@v07/10300063. I thought it was annoying, but now I''m grateful."'
578: 'Battler@r@v10/10100154."Hah, I knew it, George-aniki is magnanimous as ever...@k@v10/10100155. As for me, I have to look after myself.@k@v10/10100156. No one says a thing to me!@k @|@y@v10/10100157.Well, it''s not like I''d listen if they did, hihihi!"'
579: 'Kumasawa@r@v18/11800022."Battler-san, have you still not returned to your birth home?"'
580: 'Battler@r@v10/10100158."...Well, I kinda go back now and then.@k@v10/10100159. I still have lots of clothes and stuff left at the previous house."'
581: 'Maria@r@v13/10400049."......Uu?@k @v13/10400050.Battler has two homes?"'
582: 'Battler@r@v10/10100160."Uh,@v10/10100161. .........hmmm.@k@v10/10100162. ......Something like that."'
583: 'Maria@r@v13/10400051."Why?@k @v13/10400052.Why do you have two homes?@k @v13/10400053.Uu?@k @v13/10400054.Uu?"'
584: '@rOnly Maria, who couldn''t really grasp the situation, voiced her naive question.'
585: '@rHowever, the others just shot nervous glances at me, choosing not to respond even though they knew the answer.'
586: 'Jessica@r@v04/10200054."Maria!@k @v04/10200055.Look, you can see the harbor now...!@k @v04/10200056.Look, over there!@k @v04/10200057.Can you see it?!"'
587: 'Maria@r@v13/10400055."Uu!@k @v13/10400056.Saw the harbor, saw the harbor!"'
588: '@rApparently, Jessica was trying to be nice by changing the subject.'
589: '@r......Ah, well.@k I''d rather not talk about it if I can help it, but it''s uncomfortable to have it treated like some kind of weird taboo.'
590: '@r......I don''t mind that much myself anymore.'
591: '@rI am an Ushiromiya,@k but the truth is that, for the past six years, I''ve been living with my grandparents on my late mother''s side, and I''ve even been using her family name.'
592: '@rWhen those grandparents passed away one after the other, I''d basically had no choice except to go back and live with the old bastard.'
593: '@rDon''t get me wrong. I didn''t just run away from home or anything like that.@k@rThe only one at fault here is my dad.'
594: '@r......I don''t really blame Kyrie-san.@k@rBeing able to hold that old bastard''s reins and ride him out is no mean feat.'
595: '@r...But as for the betrayal that the old bastard inflicted on my mom...@k ......Well, unfortunately, I still haven''t fully gotten over that.'
596: 'George@r@v07/10300064."*ahem*.@k@v07/10300065. We''ll be getting there soon."'
597: '@rGeorge-aniki cleared his throat, trying to change the topic.'
598: 'Kumasawa@r@v18/11800023."......Please forgive my indiscretion.@k@v18/11800024. It seems this old woman has said too much already.@k@v18/11800025. If I have hurt your feelings - "'
599: 'Battler@r@v10/10100163."Heheh!@k @v10/10100164.I don''t mind it and no one''s feelings are hurt.@k@v10/10100165. Don''t worry, Kumasawa baa-chan."'
600: '@rKumasawa-san seemed to regret speaking out of turn,@k but I was more concerned about being worried over for something like that, so I stood up and passed it off lightly.'
601: '@rAfter that, I had a sip of my drink and headed over to Maria and Jessica, who were gazing at the silhouette of the island.'
602: 'Maria@r@v13/10400057."Uu!@k @v13/10400058.Battler, saw the island, saw the island!@k @v13/10400059.There there there!@k @v13/10400060.Uu-uu-uu!"'
603: 'Battler@r@v10/10100166."Where is it...oh, I see it now.@k@v10/10100167. Even after six years, the island hasn''t changed a bit."'
604: '@rThe small island''s silhouette in front of us had gotten pretty close.'
605: '@rThis island''s name is @bRokkenjima.@<六軒島@> (Six House Island).@k@rIt''s a small island about ten kilometers around, located in the Izu Archipelago.'
606: '@rSince they call this archipelago "the Izu Seven", lots of people think there are seven islands, but that''s not true.'
607: '@rThere are actually more than seven.@k@rRokkenjima is one of the minor islands that don''t get counted.'
608: '@rEven considering that, there are probably very few people who know about this island.'
609: '@rAfter all, only the people of the Ushiromiya family come to this island.'
610: '@rIn other words, it has no ties whatsoever to outsiders or tourists.@k@rSo, you''ll never find this island''s name in a travel brochure.'
611: '@rThis is because all of Rokkenjima is an estate possessed by the Ushiromiya head house.'
612: '@rOnly the Ushiromiya family lives there, and only people connected to the Ushiromiya family come and go there.'
613: '@rThere''s nothing there except a harbor and a mansion.@k@rThe vast majority of the island is still just uncultivated forest.'
614: '@rSuch a waste, when it could be made into a nice golf course.@k@rHowever, when you realize that the entire coastline is a private beach, it starts to sound pretty magnificent.'
615: '@rYou might have realized it by now, but to put it simply,@w583. ......well, the Ushiromiya family is just rolling in dough.'
616: '@rThe fortune possessed by the head house is apparently vast,@k and Dad and the others who make up the branch families have built up plenty of wealth for themselves, finding success in their respective businesses.'
617: '@rI''ve been living a commoner''s life at my grandparents'' home these six years, so I''d completely forgotten,@k ...but the old bastard''s house really is elegant, and everything about it is tuned to match the snobbish tastes of the annoyingly rich.'
618: '@rCome to think of it, I guess that means George-aniki, Jessica, Maria, and I are all wealthy, high-class gentlemen and ladies.'
619: '@rNeedless to say, none of us feel that way at all.'
620: '@rI don''t see myself as being rich, and George-aniki, who takes self-discipline very seriously, doesn''t let himself get too comfortable.'
621: '@rJessica is always complaining that she''d rather move to the city than be rich,@k and Maria is still a kid who isn''t even interested in money at all.'
622: '@r...I guess that attitude itself is snobbish.@k@rFrom the perspective of people in poverty who can''t pay the bills, we''re very lucky to even have the luxury of thinking this way.'
623: '@rThis isn''t the place to explain any further, so I won''t.'
624: '@rAnyway, it''s the same as not being able to choose the parents you''re born from.@k@rI didn''t ask to be born into a rich family.@k@rAnd I don''t think it''s something I should be hated for.'
625: '@rIt can be pretty trying when people are prejudiced against you just because you''re rich and refuse to judge you by your merits...'
626: '@rAs I pondered these sentimental thoughts, Maria leaned over the railing and started shouting.'
627: 'Maria@r@v13/10400061."............Uu.@k@v13/10400062. ......Gone."'
628: 'Battler@r@v10/10100168."What''s wrong, Maria?@k@v10/10100169. Did you drop something?"'
629: 'Maria@r@v13/10400063."Uu-uu!@k @v13/10400064.Gone, gone!@k @v13/10400065.Uu-uu-uu-uu!!"'
630: '@rMaria kept yelling "gone, gone".'
631: '@rFrom her words alone, you would think she had perhaps dropped something, but she was actually pointing out over the ocean as she shouted.'
632: 'George@r@v07/10300066."What''s wrong?@k @v07/10300067.What''s gone?@k @v07/10300068.I''ll look for it too, if you want.@k@v07/10300069. What is it?@|@y@v07/10300070. ...............?"'
633: '@rIf she''d dropped something, she would probably have looked down at the floor, but Maria was pointing out over the ocean.'
634: '@rOne would assume that she had seen something out over the ocean, but she kept saying that something was gone.@k .........Strange.'
635: '@rHowever, since my last memories of this place came from six years ago, I was able to spot it before Aniki, who comes here every year.'
636: 'Battler@r@v10/10100170."............Huh...?@k@v10/10100171. ......If I remember correctly, wasn''t there a torii or something on top of a small crag around here?@k@v10/10100172. ...That''s right, it was definitely there.@k@v10/10100173. I remember it well, since it''s like a landmark, the first thing to greet you as you get closer to the island."'
637: 'Jessica@r@v04/10200058."Wow, you''re amazing, Battler.@k@v04/10200059. Even though it''s been six years, you remembered."'
638: 'George@r@v07/10300071."It was here, wasn''t it...!@k @v07/10300072.I remember too.@k@v07/10300073.There used to be a shrine and a torii-like thing standing all alone on that crag.@k@v07/10300074. ......And now that you mention it, they are gone, aren''t they.@k@v07/10300075. They definitely were there last year, I think."'
639: 'Maria@r@v13/10400066."Gone.@k@v13/10400067. Gone.@k@v13/10400068. Uu-uu-uu!"'
640: 'Battler@r@v10/10100174."Maybe they were washed away by the waves or something?@k @v10/10100175.It was a small crag, it probably got brittle because of its exposure."'
641: 'Jessica@r@v04/10200060."I think so too.@k@v04/10200061. It actually disappeared during the summer.@k@v04/10200062. Apparently - "'
642: 'Kumasawa@r@v18/11800026."A huge lightning bolt fell one evening and smashed the shrine, or some such...@k@v18/11800027.......The fishermen whisper that it must undoubtedly be an ominous sign, to have a thunderbolt fall upon our tutelary god.@k@v18/11800028. ...Lightning begone, lightning begone..."'
643: '@rKumasawa-san smiled impishly as if teasing us, rubbing her hands together.'
644: '@rHowever, Maria was apparently taking it seriously,@k and she stared fixedly over the ocean to where the crag enshrining the local guardian deity was supposed to be.'
645: 'Maria@r@v13/10400069."............An ominous...sign.@k@v13/10400070. ............Uu."'
646: 'Jessica@r@v04/10200063."Enough, Kumasawa-san.@k@v04/10200064. Maria isn''t old enough to understand this kind of joke."'
647: 'George@r@v07/10300076."It''s alright, Maria-chan.@k@v07/10300077. It''s just a coincidence.@k@v07/10300078. Nothing scary''s gonna happen."'
648: '@rGeorge-aniki put a hand on Maria''s shoulder to calm her down, but Maria''s sharp-eyed expression didn''t budge.'
649: 'Maria@r@v13/10400071."............Ominous.@k@v13/10400072. ............Ominous."'
650: '@rMaria muttered that word over and over.@k@rApparently, repeating a single word over and over is a habit that Maria''s had for a long time.'
651: '@rHowever, since the word she was saying was quite literally ominous, it was a bit creepy.'
652: 'Battler@r@v10/10100176."Hey now, Maria.@k@v10/10100177. Some disaster really will come if you say that word over and over, you know?"'
653: '@rI tapped Maria''s other shoulder.'
654: '@rAnd then, Maria whipped her head around, stared into my face, and spoke unblinkingly.'
655: 'Maria@r@v13/10400073."Uu.@k@v13/10400074. .........Disaster...coming."'
656: 'Battler@r@v10/10100178."Huh?@k @v10/10100179.And just where is it coming from?"'
657: '@rI answered light-heartedly, trying to break the tension in the air.'
658: '@r...And in reply, Maria held up a finger, raised her arm high, ...and pointed up to the heavens.'
659: '@rWhen I looked up, I saw that the sky was still just as cloudy, but it had grown a great deal more leaden than it had been that morning.'
660: '@rThat''s right - they were saying that a typhoon was approaching.'
661: '@r...We had planned to spend one night on the island, but if this storm doesn''t pass quickly, I won''t be able to make it to school on Monday.@k@rWell, I guess it makes for a pretty good excuse to be absent.'
662: 'Maria@r@v13/10400075.".....................Uu..."'
663: '@r...She apparently sensed something ominous in this cloudy sky.@k@rShe''s been muttering for a while now.'
664: '@rGirls at Maria''s age tend to be very impressionable.@k@rShe''s just about the age when many girls start to get excited about sixth senses and whether they have any psychic potential and stuff.'
665: '@r...In a way, being sensitive about things like this isn''t really out of the ordinary for a kid like her.'
666: 'George@r@v07/10300079."It''s alright, Maria-chan.@k@v07/10300080. The weather might get worse around tonight, but tomorrow it''ll clear up and become a pretty blue sky."'
667: 'Maria@r@v13/10400076."Uu.@k@v13/10400077. Pretty blue sky.........@k@v13/10400078. .........Uu..."'
668: 'George@r@v07/10300081."That''s right, by tomorrow it''ll be a pretty blue sky.@k@v07/10300082. There''s no rain that doesn''t end, and no clouds that never clear."'
669: 'Maria@r@v13/10400079."Uu...@k@v13/10400080. .........Rain that doesn''t end.@k@v13/10400081. ...Clouds that never clear.@k@v13/10400082. ..................Uu........."'
670: 'Battler@r@v10/10100180."Sure, the typhoon''s coming, but it''ll be gone before you know it!@k @v10/10100181.It''s alright, Maria."'
671: 'Maria@r@v13/10400083."...............Uu.@k@v13/10400084. ...Uu!!@k @v13/10400085.Uu-uu-uu!!@k @v13/10400086.Uu-uu-uu!!"'
672: '@rMaria started yelling "uu-uu".@k@r...It looked as though she was having a tantrum because no one could understand what she was trying to say.'
673: '@rWhat in the world is Maria trying so desperately to warn us about?'
674: '@rUnable to understand her, we could do nothing but feel a vague sense of foreboding...'
675: '@r......I''ve heard that everyone can feel the supernatural, but that it weakens as you age.'
676: '@rThat might mean that Maria, the youngest one of us all, still possessed some kind of sense that the rest of us had lost.'
677: '@r...I wonder if that sense is sending her a warning.'
678: '@rAt that moment, Kumasawa-san quietly opened her mouth.'
679: 'Kumasawa@r@v18/11800029.".........Rumor has it...@v18/11800030.that long ago, Rokkenjima was - "'
680: 'Jessica@r@v04/10200065."Kumasawa-san.@k@v04/10200066. Let''s not talk about that now."'
681: '@rJust as Kumasawa-san was about to tell some kind of story, Jessica sharply interrupted her.'
682: '@rFor Jessica, this was an extremely firm reaction.'
683: '@rI wanted to push her further, just out of simple curiosity,@k but judging by how Jessica was acting, it wasn''t difficult to imagine that it would simply inflame Maria''s unease further.'
684: '@r...If I did try to press her for the story, the odds were pretty good that it wouldn''t be anything bright and cheery.'
685: 'Kumasawa@r@v18/11800031."......Hoh-hoh-ho, I do apologize about that...@k@v18/11800032. ...The wind here is hard to bear for the elderly, so if you would excuse me for now..."'
686: '@rGossipers have no reason to hang around after they''ve been told to stop chatting.'
687: '@rWhen Kumasawa-san finally realized that she''d overstepped her bounds, she went back inside the boat.'
688: '@rAfter she left, Uncle Hideyoshi came along to replace her.'
689: '@rSince he''d shown up partway through, he completely failed to notice the complicated atmosphere that hung about the scene,@k so he refreshingly and unwittingly swept that atmosphere aside.'
690: '@rSo, in the end, it was his unwittingness that brightened the mood.'
691: 'Hideyoshi@r@v06/11100040."Looks like we''re almost there!@k @v06/11100041.Alright, just a little more!@k @v06/11100042.Took forever at the speed we went today, didn''t it?@k@|@y@v06/11100043. You all know whose fault that is!@k @|@y@v06/11100044.Wahhahahahaha!"'
692: 'Battler@r@v10/10100182."Aww, Uncle Hideyoshi, gimme a break already~...hahaha~!"'
693: 'Jessica@r@v04/10200067."Ahaha, keep on twisting the knife.@k@v04/10200068. Seriously, ''cause of Battler, it''s takin'' fore~ver!"'
694: 'Maria@r@v13/10400087.".........Uu."'
695: '@rMaria had probably come to the conclusion that no one was going to listen to her.'
696: '@rShe hung her head, wearing a fretful face.'
697: '@rAs she did, George-aniki crouched down to meet her eyes and spoke to her kindly.'
698: 'George@r@v07/10300083."Maria-chan.@k@v07/10300084. There''s nothing to be afraid of.@k@v07/10300085. Because we''re all together.@k@v07/10300086. There''s nothing to be afraid of if we''re together.@k@v07/10300087. Go ahead and say it."'
699: 'Maria@r@v13/10400088."............Uu.@k@v13/10400089. ...There''s nothing to be afraid of...if we''re together..."'
700: 'George@r@v07/10300088."Yes.@k@v07/10300089. There''s nothing to be afraid of if we''re together."'
701: 'Maria@r@v13/10400090."............Uu."'
702: 'Battler@r@v10/10100183."Yeah, George-aniki knows what he''s talking about.@k @v10/10100184.If we''re all together, there''ll absolutely never be anything at all to be scared of.@k@v10/10100185. Right, Jessica?"'
703: 'Jessica@r@v04/10200069."Yeah, no doubt about that.@k@v04/10200070. George nii-san always tells the truth, Maria."'
704: 'Maria@r@v13/10400091."......Uu.@k@v13/10400092. George onii-chan always true."'
705: 'George@r@v07/10300090."Yes.@k@v07/10300091. I don''t lie.@k@v07/10300092. So trust me.@k@v07/10300093. There''s nothing to be afraid of if we''re all together."'
706: 'Maria@r@v13/10400093."Uu.@k@v13/10400094. ......George onii-chan doesn''t lie.@k@v13/10400095. I trust you.@k@v13/10400096. There''s nothing to be afraid of if we''re all together.@k@|@y@v13/10400097. .........Uu, not afraid!"'
707: '@rMaria jumped into George-aniki''s arms and hugged him tightly.'
708: '@rAfter Aniki patted her head, she jumped away again.'
709: '@rHer facial expression had returned so completely to normal that she looked like a totally different person from moments before.@k@rShe was once again the ordinary Maria.'
710: 'Maria@r@v13/10400098."Uu.@k@v13/10400099. There''s nothing to be afraid of anymore, because we''re all together.@k@v13/10400100. ...Uu-uu."'
711: 'Battler@r@v10/10100186."Yeah, that''s it.@k@v10/10100187. ...You look all better now.@k@v10/10100188. You''re strong, Maria, good girl!"'
712: 'Maria@r@v13/10400101."......Uu!@k @v13/10400102.I''m a good girl!"'
713: 'Hideyoshi@r@v06/11100045."Hey now, what''s goin'' on here?@k@v06/11100046. Maria-chan didn''t get seasick, did she?@k @v06/11100047.Hm?"'
714: 'Jessica@r@v04/10200071."Hahaha, well, something like that.@k@v04/10200072. We''ll be arriving soon."'
715: '@rThe harbor was already drawing near.'