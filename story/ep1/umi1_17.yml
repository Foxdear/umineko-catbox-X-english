# Tea Party
# This is equivalent to Umipro's umi1_18.txt, um1_17.txt is a blank file
7236: 'Battler@r@v10/90100001."Hey, everyone, good job finishing@r"Umineko: When They @c900.C@c.ry"!@k@r@v10/90100002. Man, I still didn''t have a clue what was going on when the story ended!"'
7237: 'Jessica@r@v04/90200001."So just what happened?@k @v04/90200002.Was that basically the "bad ending", where time runs out before the culprit can be exposed?"'
7238: 'Maria@r@v13/90400001."Uu.@k@v13/90400002. Definitely a bad ending.@k@v13/90400003. Uu."'
7239: 'George@r@v07/90300001."I think so too.@k@v07/90300002. BEATRICE''s letter, which Maria-chan read on the first day, did tell us in advance to solve the riddle of the epitaph.@k@v07/90300003. We were all so busy trying to protect ourselves and look for the culprit that we didn''t even take a shot at it."'
7240: 'Shannon@r@v15/90500001.".........Yes, that''s true.@k@v15/90500002. If we had actually tried to solve the riddle, I''m sure things would have ended differently."'
7241: 'Battler@r@v10/90100003."I wonder about that.@k@v10/90100004. Shannon-chan, you did a good job too!"'
7242: 'Battler@r@v10/90100005."You don''t have to be our waitress and serve tea.@k@v10/90100006. After all, this is a wrap party.@k@v10/90100007. As a group of people who met a horrible fate, let''s all get along and lick each other''s wou~~nds!@k @v10/90100008.Licklickli~ck!!"'
7243: 'Jessica@r@v04/90200003."Speaking of a horrible fate, Shannon beats the rest of us hands down, doesn''t she?@k @v04/90200004.She was such a beautiful character, so I thought she''d definitely survive until the very end,@k@|@y@v04/90200005. but she was killed right in the beginning, and on top of that...what was it?@k @v04/90200006.Half of her face was smashed, right?@k @v04/90200007.That''s the worst!"'
7244: 'Shannon@r@v15/90500003."............That was my role, so, umm......there was no way around it..."'
7245: 'Kanon@r@v16/90600001."...Nee-san, it''s nothing for you to worry about.@k@v16/90600002. Judging by the final epilogue, even Milady and the others met with a considerably tragic end."'
7246: 'George@r@v07/90300004."Ahahaha... It seems that way.@k@v07/90300005. I think I remember seeing this horrible picture, kind of like my entire body had been eaten apart and dismembered."'
7247: 'Battler@r@v10/90100009."Speaking of which, don''t you think Kanon-kun''s last moments were the coolest?@k @v10/90100010.Even though he had the tables turned on him, it was a showdown with the culprit, right?@k @|@y@v10/90100011.It''s a whole bunch better than our confusing last moments!"'
7248: 'Kanon@r@v16/90600003.".........Though, in the end, I was no match for her."'
7249: 'Shannon@r@v15/90500004."Still, ...I think that Kanon-kun''s death was a big hint.@k@v15/90500005. I mean, because of that, it became clear that a 19th person existed."'
7250: 'George@r@v07/90300006."Yes.@k@v07/90300007. At that time, everyone''s location was obvious.@k@v07/90300008. So it was impossible for anyone other than some unknown 19th person to kill Kanon-kun."'
7251: 'Maria@r@v13/90400004."Uu!@k @v13/90400005.I did say it was BEATRICE from the beginning, over and oooover.@k@v13/90400006. Uu!"'
7252: 'Jessica@r@v04/90200008."......I don''t wanna believe it, but that does prove the culprit was a witch calling herself BEATRICE."'
7253: 'Shannon@r@v15/90500006."That''s right...@k@v15/90500007. There were many strange things that happened which a human couldn''t do..."'
7254: 'Maria@r@v13/90400007."Uu. Only a witch could do things like Auntie Eva''s locked-room murder.@k@v13/90400008. A human couldn''t do that!@k @v13/90400009.Uu!"'
7255: 'Kanon@r@v16/90600004."............Not only is it clear that a 19th person exists, but it is also obvious that this person holds a power that humans can''t even imagine."'
7256: 'Jessica@r@v04/90200009."In that case, I don''t think there''s anything wrong with calling this person BEATRICE."'
7257: 'George@r@v07/90300009."...We probably met at the very end.@k@v07/90300010. ...Met with the Golden Witch."'
7258: 'Maria@r@v13/90400010."That''s why I kept telling you BEATRICE exists.@k@v13/90400011. It all went bad because no one ever believed.@k@|@y@v13/90400012. Uu!@k @v13/90400013.Even one of my witch friends says miracles won''t happen if you don''t believe!@k @v13/90400014.Uu!"'
7259: 'Shannon@r@v15/90500008."That''s right.@k@v15/90500009. BEATRICE-sama is generous to those who respect her."'
7260: 'Kanon@r@v16/90600005."......I feel as if, despite the fact that horrible incidents kept occurring one after the other, Maria-sama wasn''t in danger from BEATRICE-sama until the end."'
7261: 'Jessica@r@v04/90200010."Maria did believe in BEATRICE from the very beginning.@k@|@y@v04/90200011. ...But then, so did Kanon-kun and the others, so how do you explain why they were all killed?"'
7262: 'Kanon@r@v16/90600006."......BEATRICE-sama probably had her reasons."'
7263: 'Shannon@r@v15/90500010."If the epitaph poem represented BEATRICE-sama''s resurrection ritual, then she needed many sacrifices.@k@v15/90500011. ......He must simply have been designated to be one of those."'
7264: 'George@r@v07/90300011."...Shannon-chan, you met a horrible end...@k@v07/90300012. At the very least, I wish your death could have been more peaceful and pretty."'
7265: 'Shannon@r@v15/90500012.".........Umm, well, ...it''s not like it hurt...@k@|@y@v15/90500013. Besides,@k@v15/90500014. as you can see, right now, I''m perfectly fine, so don''t worry."'
7266: '@rShannon proved this by stroking her cheek which had been crushed during the story, and everyone laughed out loud, smiling.'
7267: 'George@r@v07/90300013."Well, it feels a bit weird saying this, ...but I was sure this story would be in the standard mystery genre.@k@v07/90300014. I''m a little surprised to find out that it''s fantasy.@k@|@y@v07/90300015. After all, a story revolving around an inheritance, set on a Western-style mansion shut away on an isolated island, ...I thought that was the classic formula for mysteries."'
7268: 'Maria@r@v13/90400015."......Uu.@k@v13/90400016. It''s not fantasyyyy!@k @v13/90400017.BEATRICE "exiiists"!@k @v13/90400018.Uu."'
7269: 'Kanon@r@v16/90600007.".........Yes, we know.@k@v16/90600008. BEATRICE-sama does "exist"."'
7270: 'Shannon@r@v15/90500015."That''s right.@k@v15/90500016. ......BEATRICE-sama does "exist"."'
7271: 'Jessica@r@v04/90200012."...I hate to admit it, but I''ve got no choice.@k@v04/90200013. Because it''s obvious that a 19th person, a witch, was involved...!"'
7272: 'George@r@v07/90300016."She pulled off many things that would be impossible for humans.@k@v07/90300017. During the story, we thought of all kinds of things, trying to deny that."'
7273: 'George@r@v07/90300018."...But now I can say it clearly.@k@v07/90300019. Each one of them, all of them, were crimes impossible for a human.@k@v07/90300020. ......Those crimes would be impossible to carry out unless it was the witch BEATRICE using all of the power magic could provide."'
7274: 'Jessica@r@v04/90200014."The culprit was a witch.@k@v04/90200015. That point is perfectly clear.@k@v04/90200016. Long live BEATRICE-sama.@k@v04/90200017. Hahahahahaha."'
7275: 'Maria@r@v13/90400019."Uu.@k@v13/90400020. Everyone believed.@k@v13/90400021. I''m happy.@k@v13/90400022. Uu!"'
7276: 'Shannon@r@v15/90500017."......Gods and witches might seem terrifying to people who are frightened of them,@k@v15/90500018. but I think they must have affection for those who believe in and respect them."'
7277: 'Kanon@r@v16/90600009."............I think it''s just as you say."'
7278: 'Jessica@r@v04/90200018."So, now we''re all done with playing with murder cases.@k@v04/90200019. Now''s the time to pull ourselves together and try hard to solve the riddle of the epitaph, just like BEATRICE said, right?"'
7279: 'Maria@r@v13/90400023."Uu!@k @v13/90400024.Agreed!@k @v13/90400025.BEATRICE will definitely be happy."'
7280: 'George@r@v07/90300021."Hahahahaha...@k@v07/90300022. We all ignored that letter during the story, after all."'
7281: 'Shannon@r@v15/90500019."......Even though it was thrust right in front of us, we almost completely ignored it.@k@v15/90500020. I kind of feel sorry for BEATRICE-sama."'
7282: 'Maria@r@v13/90400026."I have a memo with the epitaph on it!@k @v13/90400027.Let''s all solve the puzzle, let''s all solve the puzzle...!"'
7283: 'George@r@v07/90300023."This story probably went wrong ever since that time."'
7284: 'Shannon@r@v15/90500020_1.".........That may be so.@k@v15/90500020_2. Maybe we should have tried solving the epitaph''s riddle from the beginning, like BEATRICE-sama said."'
7285: 'Jessica@r@v04/90200020."Well, it''s a little late now.@k@v04/90200021. Even so, let''s try solving it now and see if the witch forgives us.@k@v04/90200022. Let''s go, let''s try to solve the riddle of the epitaph.@k@v04/90200023. ......Here we are, "Behold the sweetfish river, running through my beloved home of old"..."'
7286: '@rAs Maria put her notebook on the table, and opened to the page where the epitaph was written,@k everyone peered closely at it, and had fun and lively discussion as they started guessing this and that about the riddle.'
7287: '@rSurrounded by the smell of the black tea and the freshly baked vanilla cookies, they spent the time comfortably and happily......'
7288: 'Battler@r@v10/90100012."..................Wait a second, you guys."'
7289: '@rBattler said, in a tone that ruined the mood.'
7290: '@rHis expression looked a little unhappy.@k@rWhat could he not like about all of this fun?'
7291: 'Battler@r@v10/90100013."...I''ve been listening to you guys, and - why did you all stop thinking?@k @v10/90100014.Why are you so sure that the witch was behind all of this?@k@v10/90100015. ...Don''t you realize that stuff like that doesn''t exist?"'
7292: '@rWith just those words, ...the happy atmosphere of the tea party disappeared in no time at all.'
7293: '@rGeorge and Jessica.@k And Shannon and Kanon.@k And Maria.'
7294: '@r......All of them stared blankly, wondering why Battler was saying such weird things.'
7295: '@rEven the foolish and arrogant Battler noticed he had said the wrong thing.'
7296: 'George@r@v07/90300024."...W-.........well, come on.@k@v07/90300025. Isn''t it clear that these crimes were impossible for a human?"'
7297: 'Jessica@r@v04/90200024."Y-yeah, yeah!@k@v04/90200025. ...None of the cases would have been possible for a human."'
7298: 'Shannon@r@v15/90500021."That''s right...@k@v15/90500022. After all, wasn''t it full of things that you couldn''t explain using humans...?"'
7299: 'Kanon@r@v16/90600012."...I don''t understand what you''re saying, Battler-sama."'
7300: 'Battler@r@v10/90100016."I, I''m the one who doesn''t have a clue what you guys are talking about!@k@|@y@v10/90100017. Isn''t it obvious that humans committed these crimes?@k@v10/90100018. There''s obviously no such thing as witches, right...?"'
7301: 'Shannon@r@v15/90500023."Th-...then...@k@v15/90500024. ...What about when I was killed in the storehouse, and something horrible was done to half of my face?@k@v15/90500025. ......If the culprit was human, how could they have accomplished it...?"'
7302: 'Battler@r@v10/90100019."...Well...@v10/90100020. ......I mean...@k@v10/90100021. It''s hard to imagine how they could''ve done something that awful."'
7303: 'Battler@r@v10/90100022."But that was the rose garden storehouse, right?@k @v10/90100023.I''m sure there were plenty of weird tools in there.@k@v10/90100024. Don''t ask me, but...they could''ve used some electrical tool like a grinder or an electric saw, couldn''t they?"'
7304: 'Shannon@r@v15/90500026."...............Th-@v15/90500027..........that''s......@v15/90500028....umm..."'
7305: 'Jessica@r@v04/90200026."Okay, Battler...@k@v04/90200027. Then how do you explain Grandfather''s disappearance from the locked room of his study...?@k@v04/90200028. Grandfather disappeared all of a sudden even though the door was sealed, remember...?"'
7306: 'Battler@r@v10/90100025."We talked about that during the story, too.@k@v10/90100026. It''s not impossible that Grandfather used some trick to fool the receipt.@k@v10/90100027. It''s also possible that he went out the window, or fell out the window, and Aunt Natsuhi locked it from the inside.@k@v10/90100028. I could think of a bunch of tricks you could use without relying on magic...you see?"'
7307: 'Jessica@r@v04/90200029."............Th-@v04/90200030.......that makes sense, but........."'
7308: 'George@r@v07/90300026."In that case, Battler-kun,@k@v07/90300027_b. how do you explain the way my parents were killed in the guest room?@k @v07/90300028.The door was sealed by the lock and the chain.@k@v07/90300029. Naturally, the windows were sealed too.@k@v07/90300030. How would you suggest a human could have killed my parents?"'
7309: 'Battler@r@v10/90100029."...Well,@v10/90100030. ......you''re right, we did have to leave that trick alone during the story.@k@v10/90100031. Anyways, there''s a good chance that the culprit had the key at least.@k@v10/90100032. And it was possible to look in through the crack of the door that the chain allowed."'
7310: 'Battler@r@v10/90100033."......This is extremely far-fetched, but it is possible that some device was used through that crack.@k@v10/90100034. ...Or maybe they brought something out through the crack...?"'
7311: 'Battler@r@v10/90100035."......Hmmmm, well, even though chains are incredibly simple, they''re a big factor in constructing a locked room...@k@v10/90100036. .........But authors have done almost every possible locked-room trick there is to do by now.@k@v10/90100037. If you bought just a few locked-room mysteries from some bookstore or other, you could probably find some trick that would fit perfectly."'
7312: 'Battler@r@v10/90100038."......Anyways, I can''t think of one now...but I can state for certain that a human could manage it somehow if they tried hard enough."'
7313: 'George@r@v07/90300031."Isn''t that argument horribly irrational...?@k @v07/90300032.It''s just ridiculous to claim that it''s possible for a human to do something, even though you can''t explain how..."'
7314: 'Battler@r@v10/90100039."......Why is that ridiculous?@k@v10/90100040. Why did all of you stop thinking?@k@v10/90100041. Even if it looks impossible, it has to be doable.@k@v10/90100042. Doesn''t it always work like that?"'
7315: 'Jessica@r@v04/90200031."Battler, you''re the one being ridiculous.@k@v04/90200032. ......If you think a human could''ve done it, try explaining how.@k@v04/90200033. You can''t, can you?"'
7316: 'Battler@r@v10/90100043."And just because I can''t explain it, that immediately makes the culprit a witch?@k@v10/90100044. With that argument, all of the unsolved crimes in the world could be resolved by saying a witch is the culprit!"'
7317: 'Maria@r@v13/90400028."......Battler, you''re sidestepping the issue, and you aren''t explaining anything.@k@v13/90400029. ...We are saying "A human can''t do it.@k@v13/90400030. Therefore the culprit is something that isn''t human.@k@v13/90400031. And that something is a witch."@k@v13/90400032. And yet you keep arbitrarily deciding that witches are impossible even though you can''t explain anything."'
7318: 'Maria@r@v13/90400033."......Kihihihihihihihihihihihi, it''s almost like humanity was during the dark ages.@k@v13/90400034. Like those fools who claimed that the Earth couldn''t possibly be spinning,@k@v13/90400035. that the heavens had to be spinning around the Earth, even though they couldn''t say how."'
7319: 'Battler@r@v10/90100045."...............Th-...that kind of argument kinda pisses me off.@k@v10/90100046. So this is basically what you''re trying to say.@k@v10/90100047. ...If I can''t explain how a human could do it,@k@v10/90100048. ...then I must accept that the culprit is the witch, BEATRICE?"'
7320: 'Kanon@r@v16/90600013."............It''s not like we''re forcing you.@k@v16/90600014. We were just wondering on what basis you can say such nonsense."'
7321: 'Battler@r@v10/90100049."N-...nonsense...@v10/90100050.......@k@v10/90100051. ......H-...hey, is what I''ve been saying really that weird?!"'
7322: 'Battler@r@v10/90100052."Am I the one who''s crazy?!@k @v10/90100053.You guys are really starting to freak me out!"'
7323: 'Kanon@r@v16/90600015."......Battler-sama.@k@v16/90600016. When I died in the boiler room, I was killed by a 19th person who shouldn''t exist."'
7324: 'Kanon@r@v16/90600017."...Can you explain how a human could have done that?@k @v16/90600018.At that time, the locations of the 18 were well known.@k@v16/90600019. Even so, I was killed."'
7325: 'Battler@r@v10/90100054."We talked about that in the story as well...!@k @v10/90100055.Kumasawa baa-chan, for example.@k@v10/90100056. She said that she followed right after you''d headed down into the boiler room, but for all we know, that might''ve been a lie."'
7326: 'Battler@r@v10/90100057."She might''ve entered the boiler room with you and caught you by surprise!@k @v10/90100058.Or maybe, when you stepped into the boiler room, you activated some kind of trap, one that might have been set up to hit you with one of those icepicks."'
7327: 'Battler@r@v10/90100059."After all, the stink of Grandfather''s body was coming from the incinerator.@k@v10/90100060. Someone was bound to come, so all the culprit had to do was set up a trap, and it would be more than possible for them to stay away from that place and create an alibi for the time of your death...!"'
7328: 'Shannon@r@v15/90500029."......You talk about a trap in the boiler room...but what kind of trap?"'
7329: 'George@r@v07/90300033."That''s right.@k@v07/90300034. After that happened, we all immediately ran over to the boiler room.@k@v07/90300035. But we didn''t find any kind of weird device like that!"'
7330: 'Kanon@r@v16/90600020."......That is correct.@k@v16/90600021. Battler-sama, what kind of trap do you claim I was killed with...?"'
7331: 'Battler@r@v10/90100061."Well,@v10/90100062. .........I don''t know that.@k@v10/90100063. ...But anyway, they must have pulled off some kind of trap, or maybe someone is lying, or...@k@|@y@v10/90100064.or what about this?!"'
7332: 'Battler@r@v10/90100065."Kanon-kun, what if the whole thing was just you playacting?!@k @v10/90100066.Th-that''s it, you were playacting!!@k @v10/90100067.Auntie Eva and Uncle Hideyoshi were also playacting.@k@v10/90100068. They made the locked room themselves, and were only pretending to be dead!"'
7333: 'Jessica@r@v04/90200034.".........Battler...@k@v04/90200035. .........Has your...@v04/90200036.head been...@v04/90200037.feeling alright......?"'
7334: 'Shannon@r@v15/90500030."......Umm, .........should I bring some cold drinks...?"'
7335: 'Battler@r@v10/90100069."D-don''t look at me with those pitying eyes, I''m not saying something that crazy...@k@v10/90100070. I''m just pointing out possibilities that could have been used as tricks, alright?"'
7336: 'Battler@r@v10/90100071."Look, isn''t one of the cliches in mystery stories that the victims aren''t really dead?!"'
7337: 'George@r@v07/90300036."Cliches...?"'
7338: 'Battler@r@v10/90100072."O-okay, so.@k@v10/90100073. When Kanon-kun was killed, we really did know for sure where the rest of us were.@k@v10/90100074. And let''s assume that Kumasawa baa-chan wasn''t lying."'
7339: 'Battler@r@v10/90100075."But that only holds true for the survivors.@k@v10/90100076. ......If the culprit pretended to be dead, placed themselves together with the real victims to hide themselves, and then acted on their own later, then everything would be explained!"'
7340: 'Jessica@r@v04/90200038."............I guess...@k@v04/90200039. Are you trying to say that Auntie Eva or one of the rest of them was the culprit...?@k @v04/90200040.But Doctor Nanjo confirmed everyone''s death as a doctor, remember?"'
7341: 'Kanon@r@v16/90600022."......That''s right.@k@v16/90600023. Doctor Nanjo checked all of the victims.@k@v16/90600024. ...Battler-sama, for your theory to work, wouldn''t Doctor Nanjo have to be one of the culprits too?"'
7342: 'Battler@r@v10/90100077."Uh, yeah, that''s right!!@k @v10/90100078.Once you consider that Doctor Nanjo might have been one of the culprits and faked the proclamation of death, the whole story changes...!@k @|@y@v10/90100079.See, that''s also a cliche in mystery novels, isn''t it?!!"'
7343: 'Maria@r@v13/90400036."......But Doctor Nanjo was also killed..."'
7344: 'Battler@r@v10/90100080."Umm, .........about that...@k@v10/90100081. ...That''s right, Doctor Nanjo faked his death!"'
7345: 'Battler@r@v10/90100082."I mean, there wasn''t anyone except Doctor Nanjo who could examine corpses properly, and everyone was really confused then anyway.@k@v10/90100083. We didn''t have any spare time to check and see if he still had a pulse!@k @v10/90100084.With this theory, any one of the dead people could have been walking around!"'
7346: 'Shannon@r@v15/90500031.".........I think that it would have been hard for the six of us who died in the beginning to do that...@k@|@y@v15/90500032. ......After all, the shutter was closed, ...and there was a padlock that couldn''t have been opened from the inside..."'
7347: 'Jessica@r@v04/90200041."Yeah.@k@v04/90200042. Mom was holding onto that key.@k@v04/90200043. So was Mom one of the culprits too?"'
7348: 'Battler@r@v10/90100085."...Aaaaaaah, wait a sec, ...@v10/90100086.maybe it was impossible for the first six, but in the case of Aniki''s parents, the door was only locked on the outside.@k@v10/90100087. So they could have opened it from the inside...@k@|@y@v10/90100088. ...That''s right, after we left the room, maybe they jumped out the window and got to the boiler room first!"'
7349: 'Battler@r@v10/90100089."Is, ......is that too much...?!@k @v10/90100090.Or maybe Doctor Nanjo made a mistake when examining the corpses?!"'
7350: 'Battler@r@v10/90100091."Look, he said it himself, right?@k @v10/90100092.He said that there''s a very high probability of making a mistake when examining corpses!@k @v10/90100093.They disguised it well, or prepared a substitute corpse or something, and faked their own death!!@k @v10/90100094.Let''s leave the method or trick they used for later...and...you see, it''s not that hard to deny a 19th person existed!"'
7351: 'Battler@r@v10/90100095."Much less a witch!@k @v10/90100096.At least that much is completely impossible!!"'
7352: 'Maria@r@v13/90400037."............I don''t know why you''ve been trying so stubbornly to say that one of us is the culprit.@k@|@y@v13/90400038. Kihihihihihihihihihi, in other words, you want to suspect one of your relatives...?"'
7353: 'Battler@r@v10/90100097."That''s not it...@k@v10/90100098. It''s just, uh, I can''t easily accept that a 19th person existed...and even if one did, I think we should construct our argument from the point of view that the culprit was a human - @k@v10/90100099.witches are something you only start talking about in desperation, at the very end, after everything else has been disproved, that''s what I''m trying to say."'
7354: 'Battler@r@v10/90100100."I mean, come on, there''s no way witches exist, right?!@k @v10/90100101.Why have you all just been casually accepting that the culprit was a witch?"'
7355: 'Battler@r@v10/90100102."I think it''s great how your family love makes you hate the thought that someone close to you is a murderer.@k@v10/90100103. But is it alright to just brush things over like that?!@k @v10/90100104.Don''t you want to find the detestable culprit who killed so many people?!"'
7356: 'Battler@r@v10/90100105."Aniki, you want to avenge your parents, don''t you?!@k @v10/90100106.Jessica, you want to avenge Kanon-kun, and Kanon-kun, you want to avenge Shannon-chan, right?!@k @v10/90100107.Shannon-chan, you should at least want to know who it was that killed you."'
7357: 'Battler@r@v10/90100108."Why have you all totally surrendered and decided that the culprit was a witch?!@k @v10/90100109.What''s wrong with all of you?!"'
7358: '@rThe foolish and short-tempered Battler tried to force his ignorance on the others by yelling at them.'
7359: '@r...However, everyone just looked at him pityingly, silently watching over him.'
7360: '@rThen, the wise Maria laughed, and pointed out Battler''s mistake for him.'
7361: 'Maria@r@v13/90400039."...............Kihihihihihihihihi.@k@v13/90400040. ...We''re just astounded.@k@v13/90400041. ......All you''ve been doing is repeating this nonsense, thinking you''ve figured something out, Battler."'
7362: 'Maria@r@v13/90400042."......So what?@k @v13/90400043.And?@k @v13/90400044.How would a human do it?@k @v13/90400045.Concretely?@k @v13/90400046.Whenever we ask you those questions, all you say is "I just can''t think of anything now" or "with some kind of device" or something, using abstract words to run away and evade the topic."'
7363: 'Maria@r@v13/90400047."......In fact, I want to ask you, Battler.@k@v13/90400048. Why don''t you believe in BEATRICE?@k @v13/90400049.She "exists", so why don''t you believe?"'
7364: 'Battler@r@v10/90100110."Because she doesn''t "exist"!@k @v10/90100111.Witches don''t "exist"!!@k @v10/90100112.There''s no way!!"'
7365: '@r......He was almost like a stubborn child refusing for no reason.'
7366: '@rThe pitying gazes quietly blanketed Battler, but they didn''t reach his stubborn heart.'
7367: 'Jessica@r@v04/90200044."............You''re acting just totally like a kid who can''t have his way..."'
7368: 'Shannon@r@v15/90500033."......Battler-sama.@k@v15/90500034. I understand your feelings, but..."'
7369: 'Kanon@r@v16/90600025.".........BEATRICE-sama does "exist"."'
7370: 'George@r@v07/90300037."Battler-kun... Why don''t you believe?@k @v07/90300038.Look at how much circumstantial evidence there is."'
7371: 'Battler@r@v10/90100113."I don''t accept the argument that if I can''t explain it it''s all the witch.@k@v10/90100114. If you don''t know how a light bulb shines, if you don''t know the principle, does that mean it''s all magic?"'
7372: 'Battler@r@v10/90100115."It doesn''t, does it!@|@y@k @v10/90100116.There''s nothing that can''t be explained without magic!!@k @v10/90100117.All of this about witches and magic is just abdication of thought!@|@y@k @v10/90100118.You just surrendered and gave up because you don''t understand what happened!@k @v10/90100119.I''m right, aren''t I!"'
7373: 'Maria@r@v13/90400050.".....................Ki-hihihihihihihihihihihi.@k@v13/90400051. ...Well, I''m not surprised,@v13/90400052. ......but it looks like you''re the only one who''s not going to believe no matter what."'
7374: 'Maria@r@v13/90400053."......If even a single person doesn''t believe, the "miracle" won''t occur.@k@v13/90400054. ......So, if you don''t rethink your ignorant theories, the miracle, ......the magic won''t be completed."'
7375: 'Battler@r@v10/90100120."Heheh...@k@v10/90100121. Nowww I see.@k@v10/90100122. ......I finally figured it out.@k@v10/90100123. ...So in other words, you guys want to get me to say that the witch exists, don''t you?@k @v10/90100124.If everyone accepts this lie, it will become "the truth".@k@v10/90100125. ......That''s what this is all about, isn''t it?!"'
7376: 'Battler@r@v10/90100126."......Well, too bad.@k@v10/90100127. This is the one place I''m going to have to say too bad, that''s no goddamn good at all. I refuse.@k@v10/90100128. ......You guys are all pressing me, and that is exactly why it''s no goddamn good."'
7377: 'Maria@r@v13/90400055.".....................Why?"'
7378: 'Battler@r@v10/90100129."Sorry, but why don''t you let me flip over the chessboard one last time...?@k @v10/90100130.If you want to force me to accept that there''s a witch, there''s a really easy way."'
7379: 'Battler@r@v10/90100131."......And it''s not the roundabout way of saying "humans can''t do it so it must be a witch"!@k @v10/90100132.All you have to do is actually show it to me, the way a witch did it with magic."'
7380: 'Battler@r@v10/90100133."Furthermore, what Maria said earlier is what will really dig her grave.@k@v10/90100134. ......You said that if even one person doesn''t believe, a "miracle" won''t occur."'
7381: 'Battler@r@v10/90100135."But real miracles happen whether people believe in them or not!@k @v10/90100136.Even if I alone don''t believe!!@k @v10/90100137.So any miracles or magic or witches that exist only because I believe in them are downright lies!!"'
7382: 'Maria@r@v13/90400056."................................."'
7383: '@rThe uneasy mood following Battler''s ignorant rant...@kwas thoughtfully blown away by a very refreshing and light laugh.'
7384: '@rWhose laugh...?@k Battler was surprised by that voice which he had never heard before.'
7385: '@rWhen he looked at George and Jessica, at Shannon and Kanon and Maria, he noticed that they had suddenly gone respectfully silent.'
7386: 'Maria@r@v13/90400057."..................BEATRICE."'
7387: 'BEATRICE@r@v27/90700001.".........Wonderful.@k@v27/90700002. ...I haven''t been able to meet such a charming human for quite some time."'
7388: 'Battler@r@v10/90100138."Wh-@v10/90100139...................who...@v10/90100140.......are you..."'
7389: 'BEATRICE@r@v27/90700003."......So you don''t even know the host of the tea party to which you were invited.@k@|@y@v27/90700004. ......Simply wonderful.@k@v27/90700005. *cackle*cackle*...!"'
7390: 'Kanon@r@v16/90600026."...You are graced by the presence of the Golden Witch who has lived for a thousand years, BEATRICE-sama."'
7391: 'Shannon@r@v15/90500035."I am most honored to see you, BEATRICE-sama..."'
7392: 'George@r@v07/90300039."......Please forgive Battler-kun''s ranting."'
7393: 'Jessica@r@v04/90200045."Th-this guy''s just stubborn, and, umm, he still doesn''t understand the situation he''s in......!"'
7394: 'BEATRICE@r@v27/90700006."*cackle*cackle*cackle*...@k@v27/90700007. It is fine.@k@v27/90700008. ......After a thousand years, most witches get tired of living.@k@v27/90700009. Once in a while, it is nice to meet a man with backbone such as yourself."'
7395: 'Maria@r@v13/90400058."...............It is quite an honor to be present when BEATRICE shows herself, Battler."'
7396: 'Battler@r@v10/90100141."......Heh,@v10/90100142. .........heh-heh-heh-heh...!!@k @v10/90100143.Now this...@v10/90100144. ......This is some shit.@k@v10/90100145. ...Are you really that desperate to make me believe that a witch,@v10/90100146. ...that a 19th person is the culprit...?"'
7397: 'Battler@r@v10/90100147."This is starting to get interesting...!@k @v10/90100148.And it''s no goddamn good...!!@k @v10/90100149.You must be an illusion of the witch BEATRICE who''s asserted by Maria and the others."'
7398: 'Battler@r@v10/90100150.".........And only when everyone believes in your existence will you finally be allowed to exist.@k@v10/90100151. ...You''re that kind of a fictional being, right?@k @v10/90100152.That''s why you want to make me believe too.@k@v10/90100153. You can''t exist, because I alone don''t believe in you.@k@v10/90100154. .........Isn''t that right?!"'
7399: 'BEATRICE@r@v27/90700010.".........Your power of understanding isn''t bad for a common mortal who knows nothing of magic.@k@v27/90700011. .........I see, it seems that you were born with a strong magic-resisting power."'
7400: 'BEATRICE@r@v27/90700012."......The natural enemy of us witches.@k@v27/90700013. ...No matter how much we tip you upside down and shake you,@k@v27/90700014. you will never believe in us.@k@v27/90700015. Therefore, magic will fall short against you.@k@v27/90700016. ...That attitude of yours makes a great deal of sense.@k@v27/90700017. *cackle*cackle*...!"'
7401: 'Battler@r@v10/90100155."I''ve got no clue what you''re saying, ihihi!@k @v10/90100156.It''s very kind of you to go to all of the trouble of showing yourself to us,@k@v10/90100157. but I don''t believe you exist in the slightest."'
7402: 'Battler@r@v10/90100158."It''s true that many strange things happened during those two days.@k@v10/90100159. Like Maria said earlier, even though I think that all of the tricks could be explained, I still can''t lay out the practical details of each one.@k@v10/90100160. But that doesn''t mean I''ll surrender."'
7403: 'Battler@r@v10/90100161."I''m different from the rest of them, see?@k @v10/90100162.I''ll never argue that it was the work of a witch just because I can''t explain it."'
7404: 'BEATRICE@r@v27/90700018.".........My interest in you grows deeper.@k@v27/90700019. It will be worth my time to break you..."'
7405: 'BEATRICE@r@v27/90700020."......You''re just the kind of man I''d love to force into praising my name......@k @v27/90700021.You''re just the kind of man I''d love to force into kissing my toes.@k@v27/90700022. ...*cackle*cackle*cackle*!"'
7406: 'Battler@r@v10/90100163."Talk all the nonsense you want...!@k @v10/90100164.I deny you exist.@k@v10/90100165. All of the events can be explained with "human tricks"...!!@k @v10/90100166.There''s no room for even a speck of magic or witches!!"'
7407: 'BEATRICE@r@v27/90700023."Wonderful!@k @v27/90700024.......This is the perfect form of diversion from a thousand years of boredom."'
7408: 'BEATRICE@r@v27/90700025."Then let me ask you.@k@v27/90700026. A short while ago, you said that using the crack in the door would be sufficient to kill Eva and Hideyoshi, right...?@k @v27/90700027.Explain how you would do that using your human tricks."'
7409: 'Battler@r@v10/90100167."......Heh.@k@v10/90100168. Suddenly jumping right into the toughest part, are you?@k@|@y@v10/90100169. ...Does that mean that this is the trick you''re proudest of?@k @v10/90100170.Miss Real Culprit?"'
7410: '@rBEATRICE shook her golden pipe,@k and seven colors of gentle smoke trailed out of the end.'
7411: '@r...The smoke quickly obscured the surroundings,@k ......and they were suddenly in the hallway of the mansion.'
7412: '@rIn front of their eyes, a slightly opened door, secured by a chain...'
7413: '@rYes, it was the entrance to the room where Eva and Hideyoshi had been killed.'
7414: 'Battler@r@v10/90100171."......N-nice trick..."'
7415: 'BEATRICE@r@v27/90700028."Now then.@k@v27/90700029. Show me what you would do through this small crack, "Battler"."'
7416: 'Battler@r@v10/90100172."Erk............@k@v10/90100173. ......Th-they probably had some device to shoot those "icepicks".@k@v10/90100174. If they used that......"'
7417: 'BEATRICE@r@v27/90700030."How would you aim at Eva over on the bed when you can''t see that far through this crack?@k @v27/90700031.......And how would you reach Hideyoshi, in the bathroom with the door shut...?"'
7418: 'Battler@r@v10/90100175.".................................Dammit.........@k@v10/90100176. ...There is a crack...@k@v10/90100177. There should be some way......"'
7419: 'BEATRICE@r@v27/90700032."*cackle*cackle*.@k@v27/90700033. If you can''t think of one, allow me."'
7420: 'Battler@r@v10/90100178."......Oh?@k@v10/90100179. Go on, how would a great witch do it, then...@k@v10/90100180. C''mon, let''s see your little trick..."'
7421: 'Maria@r@v13/90400059."............Battler, you''re being rude to BEATRICE..."'
7422: 'BEATRICE@r@v27/90700034."It is fine, quite fine.@k@v27/90700035. What a charming man.@k@v27/90700036. ...It will make it all the more enjoyable to break him."'
7423: 'Battler@r@v10/90100181."......Heh!@k @v10/90100182.You really want to make me kiss your toes that much...?!@k @v10/90100183.Only if I surrender!@k @v10/90100184.But watch... I''ll definitely expose this trick, and then I''ll make you kiss my ass instead!"'
7424: 'BEATRICE@r@v27/90700037."...............*cackle*.@k@v27/90700038. What a charming man.@k@v27/90700039. I shall remember that promise.@k@v27/90700040. ...Weak witches kiss the behinds of demons to gain power.@k@v27/90700041. Because there is no greater oath of total submission.@k@v27/90700042. It is words like those that give me the desire to subjugate you.@k@v27/90700043. .........*cackle*cackle*...!"'
7425: '@rPaying no mind to Battler''s crude ranting, BEATRICE once again waved her golden pipe.'
7426: '@r......Yes, for that golden pipe was her precious magic wand.'
7427: 'BEATRICE@r@v27/90700044."Come, arise, children.@k@v27/90700045. I am the guide of Purgatory.@k@v27/90700046. Wield the seven stakes, which forgave the deadly sins."'
7428: '@rGuided by those magic words, which sounded like a psalm, seven stakes gathered.@k@r...They were the stakes of the seven demons symbolizing the deadly sins of sinful people.'
7429: 'BEATRICE@r@v27/90700047."Beelzebub and Asmodeus.@k@v27/90700048. Come, forgive their sins.@k@v27/90700049. Release the spirits of the sinners...!"'
7430: 'Battler@r@v10/90100185."Wha...?!"'
7431: '@rThe stakes of Beelzebub and Asmodeus responded to BEATRICE''s call.'
7432: '@rThe two demonic stakes burst into motion like billiard balls struck by a cue, and were sucked in through the crack of the door.'
7433: '@rThen came the sound of them deflecting repeatedly off the walls of the room, making a sound like a woodpecker.'
7434: '@rAnd finally, a pleasant sound could be heard.'
7435: '@r......It was a small, satisfying sound, like the one heard when someone is chopping firewood and the falling ax neatly and easily slices through the wood.'
7436: '@rIt was the sound of the two stakes burying themselves deep into Eva and Hideyoshi''s foreheads.'
7437: 'BEATRICE@r@v27/90700050."............Right through the middle.@k@v27/90700051. Want to see...?"'
7438: '@rThey had definitely heard two sounds like someone''s forehead being split open.'
7439: '@rBattler wasn''t permitted to see it, since he was on the other side of the door,@k but those two had died again, and this second time, they lay not an inch apart from where they had lain the last time, with the exact same blood spray as before.'
7440: 'Battler@r@v10/90100186."Y-............you must be crazy...@k@v10/90100187. Th-......this is insane......!@k @v10/90100188.Y-you can''t kill people with this insanity!!!"'
7441: 'BEATRICE@r@v27/90700052."I most certainly can.@k@v27/90700053. ......I can kill them just like this...!@k @v27/90700054.*cackle*cackle*cackle*!"'
7442: '@rSuddenly, they were no longer in the hall, but seated at the tea party they had started from.'
7443: '@r......Everyone but Battler was sitting meekly, ......but Kanon was moaning, fresh blood dangling from his mouth.@k@rSuch bad manners for a tea party.'
7444: '@rSatan''s stake was buried deep into Kanon''s chest.'
7445: 'Kanon@r@v16/90600027."..................u...@v16/90600028................gah...@v16/90600029......."@|@y'
7446: 'Battler@r@v10/90100189."Ka-......Kanon-kun......@k@v10/90100190.Kanon-kun!!@k @|@y@v10/90100191.Daa......damn iiiiiiiiiit!!"'
7447: '@rBattler was the only one getting agitated.'
7448: '@rGeorge, Jessica, Shannon - everyone else was meekly hanging their heads like students being told off by their teacher.'
7449: 'BEATRICE@r@v27/90700055."...Kanon, you were captivated by a trifling anger and tried to disturb my banquet.@k@v27/90700056. ......Your deadly sin is being easily captivated by anger.@k@v27/90700057. Cleanse yourself, regret, and do it over."'
7450: 'Kanon@r@v16/90600030."......AT@v16/90600031.......RICE......@v16/90600032.......sa...ma..............."'
7451: 'Shannon@r@v15/90500036."B-...BEATRICE-sama...@k@v15/90500037. Please, forgive him...@k@v15/90500038. I think Kanon-kun has repented enough......!"'
7452: 'BEATRICE@r@v27/90700058."Wonderful.@k@v27/90700059. I am generous to those who respect me.@k@v27/90700060. ......*cackle*cackle*...!"'
7453: 'Battler@r@v10/90100192."Cut the crap!!!@|@y@k @v10/90100193.Don''t think for a second that this piss-poor show of theatrics will convince me of your sorry existence!@k @v10/90100194.Like hell you''re a thousand-year-old witch!@k @v10/90100195.Your tricks aren''t a thousand years old, at best they''re the accumulation of a hundred years of cliches that the mystery world created!"'
7454: 'Battler@r@v10/90100196."They''re not magic!!@k @v10/90100197.No way are they magic!!@|@y@k @v10/90100198.All of these crimes can be explained with "human tricks"!!"'
7455: 'BEATRICE@r@v27/90700061."*cackle*cackle*!@k @v27/90700062.You would explain my thousand years with a hundred years by humans...?@k@v27/90700063. Good, good, that''s why I like you...!"'
7456: 'Maria@r@v13/90400060."...............Foolish Battler...@k@v13/90400061. Kihhihihihihihihihihihihihihihihihi...!"'
7457: 'George@r@v07/90300040."......Stop yourself, Battler-kun...@k@v07/90300041. BEATRICE-sama is someone you can''t...@v07/90300042.go...against......"'
7458: 'Shannon@r@v15/90500039."............nn...@v15/90500040.......u...@v15/90500041.............u..."'
7459: '@rShannon started moaning, holding her cheek.@k@r...Maybe she had a toothache.'
7460: '@rBut it didn''t look anything like a toothache.@k@r......A slight redness spread across the cheek Shannon was holding.'
7461: '@rIt looked like that redness was causing Shannon unbearable pain...'
7462: '@rShe started to press her nails into her cheek, and drops of sweat appeared all over her body...'
7463: 'George@r@v07/90300043."...Shannon...@v07/90300044.Shannon...!!@k @v07/90300045.Hang in there...hang in there!"'
7464: 'Battler@r@v10/90100199."What''s going on?!@k @v10/90100200.Damn it, what the hell is that red stuff...?!"'
7465: '@rIt expanded rapidly, covering half of Shannon''s face...'
7466: '@r...Then, the stupid dunce Battler finally realized...'
7467: 'George@r@v07/90300046."Ple-please, Battler-kun...!@k @v07/90300047.Please believe in BEATRICE-sama...!@k @v07/90300048.I beg you...!!@k @v07/90300049.Aaaaaaah, because you won''t believe,@v07/90300050. because you won''t believe, aaaaaaaaaah...@v07/90300051.the magic is,@v07/90300052. ......the magic is wearing off!!!!!!!!"'
7468: '@rFor the first time in his life, ......Battler heard that sound, like a pomegranate splitting.'
7469: '@rThe red spray even landed on Battler''s face...'
7470: '@rHow sad - Shannon''s face had been split in half, ...and her last horrible moments in that storehouse had been repeated once again.'
7471: 'George@r@v07/90300053."U...uwaaaaaaaaaaaaaaaaaaaaaaaaa, Shannon, Shannon!!@k @v07/90300054.Uwaaaaaaaaaaaaaaaaaaa!!!"'
7472: 'Battler@r@v10/90100201."G...ghhhkkk, damn you, damn youuuuuuu!@k @|@y@v10/90100202.Stop it, stop it, stop it!!@k @v10/90100203.Don''t humiliate the dead, don''t humiliate the deeeeeaaaaad!!"'
7473: 'George@r@v07/90300055."Uuuu......gah.........eeeggh!!"'
7474: '@rThis time, red patterns began to spread across George''s entire body...'
7475: '@rIt was like the beautiful cloud drawn by milk when it is poured into black tea.@k They slowly spread out and extended across his entire body.'
7476: '@r......As they grew more saturated in color, they seemed to give George increasingly greater pain.'
7477: '@rLooking at those bizarre patterns, ......Battler was petrified as he frantically thought with his pitifully clumsy imagination...@k about the nature of the strange deaths that George and the others had experienced...'
7478: '@rBefore long, ......that redness reached the nearby Jessica as well......'
7479: 'Jessica@r@v04/90200046."Gah,@v04/90200047. .........ee...@v04/90200048.......ack...@v04/90200049..........hh!!"'
7480: 'Battler@r@v10/90100204."St-stop stop stop!!!@k @v10/90100205.What did Aniki do,@k@v10/90100206. what did Jessica do,@k@v10/90100207. just STOOOOOOP!!!"'
7481: 'Jessica@r@v04/90200050."Ba-@v04/90200051.......Battler......@v04/90200052. ......Don-@v04/90200053....don''t let the witch...@v04/90200054.break your spirit......!@k @v04/90200055.......Deny her,@v04/90200056. erase her...@k@v04/90200057. As, ......as long as at least one person denies her,@v04/90200058. she''s an illusion that can''t exist......!@k @v04/90200059.Uuuuughhh, gghhh!!"'
7482: 'Battler@r@v10/90100208."A-are you OK, Jessica?!!@k @v10/90100209.Whah, A-Aniki?!?!"'
7483: '@rGeorge was no longer shaped like a person.@k ...He looked like the pile of leftover meat after the good, delicious meat has been scraped off to be cooked.'
7484: '@r...The only traces left of his time as a human were the shape of his lower jaw and rib cage.'
7485: '@rAnd it was clear that Jessica, who was covered with a steadily strengthening redness, was approaching the same fate.'
7486: 'Maria@r@v13/90400062."............Uu.@k@v13/90400063. ...Battler.@k@v13/90400064. ......Quick, believe in BEATRICE...@k@|@y@v13/90400065. .........If you don''t,@v13/90400066. .........everyone''s magic...@v13/90400067.......will wear off..."'
7487: 'Battler@r@v10/90100210."Ma-Maria, it''s all over your body, too......!!!"'
