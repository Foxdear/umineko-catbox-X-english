3270: '@rThe strange letter that the witch had entrusted Maria with had wiped all memories of dinner from our minds.'
3271: '@rMaria had been repeatedly barraged with questions by Auntie Rosa and the other parents,@k and was now in the worst of tempers because no one would believe her.'
3272: '@rEven when we kids tried to talk to her, she would just ignore us.'
3273: '@rOur parents were all stirred up over the gold, firing back and forth about the distribution of the assets, and completely forgetting that we children were even there.'
3274: '@r...Even though I''d already figured that they had been talking about this in the shadows,@k I never thought they''d be this blunt about it, and at least to us kids it was a considerable shock.'
3275: '@r...From what we could overhear, all of our parents wanted as much money as possible, as soon as possible.'
3276: '@rBack and forth about Grandfather''s inheritance.@k@rBack and forth about the distribution of the gold if it was found.@k@rAbout advance payments and cash.'
3277: '@r......It was so despicable, I couldn''t bear to watch, even though one of them was my dad.'
3278: '@r...It looked like Jessica felt the same way.'
3279: '@rWe left our seats, although no one had asked us to leave, and went to hang out somewhere apart from the parents...'
3280: 'Jessica@r@v04/10200375.".........I see.@k@v04/10200376. Now I really understand why Grandfather didn''t want to show his face during meals."'
3281: 'Jessica@r@v04/10200377."I am so disillusioned with our parents now!@k @v04/10200378.The money, the inheritance!@k @v04/10200379.How could they act like that right out in the open!"'
3282: 'Battler@r@v10/10100598."Well I''m already completely disillusioned with that old bastard.@k@v10/10100599. There''s no way I could think any worse of him.@k@v10/10100600. Ihihi!"'
3283: 'Jessica@r@v04/10200380."A-and you think I''m not?!@k @v04/10200381.But even so......that freakin'' shocked me.@k@v04/10200382. Shocked me to the bottom of my heart..."'
3284: '@rJessica looked down at the floor, irritated.'
3285: '@r...She was always talking about how bad her parents were, but maybe she hadn''t really felt that way deep inside.'
3286: '@rI could realize that from the depths of Jessica''s shock.'
3287: 'George@r@v07/10300356."......You are both minors and still being brought up by your parents, so you might not understand,@k@v07/10300357. ......but getting money is neither a simple nor a pretty thing.@k@v07/10300358. You are still minors, so I won''t try to force you to understand right now.@k@v07/10300359. ......But still, I''d like you to realize that your parents are just doing their best in their own way."'
3288: 'Battler@r@v10/10100601.".........Oh great,@k@v10/10100602. George-aniki''s gotten all mature."'
3289: 'Jessica@r@v04/10200383."I know that you''re working hard as a full-fledged member of society.@k@v04/10200384. ......But does that mean that when the conversation turns to money and assets and stuff, you''re capable of turning into a shameless, greedy vulture, like our dads...?"'
3290: 'George@r@v07/10300360.".....................If it would just be about me, then no, I wouldn''t want to do that.@k@|@y@v07/10300361. However, when your family and your employees, your subordinates and their families are all counting on you, ...there are some times when you must fight."'
3291: 'Jessica@r@v04/10200385.".........I hate that kind of fight.@k@v04/10200386. That back and forth about Grandfather''s inheritance, it just makes me wanna puke."'
3292: '@rJessica pretended to spit violently.@k@r...That harsh reaction made the depths of her pain very clear.'
3293: 'Battler@r@v10/10100603."...Let''s stop talking about this.@k @v10/10100604.All of this about Grandfather''s hidden gold, about property and inheritance, is our parents'' problem, not ours."'
3294: 'George@r@v07/10300362."I agree.@k@v07/10300363. ......At the very least, I think that being considerate and staying out of the parents'' way when they''re talking is the duty of their children."'
3295: 'Jessica@r@v04/10200387."......Hmph.@k@v04/10200388. ...Where''s the fun in that..."'
3296: '@rEveryone knows the phrase "Adults are filthy",@k ...but we had now seen that for ourselves, and that really did give us a shock.'
3297: '@rGeorge-aniki was now pretty much an adult, and I had already been disillusioned with my dad in the first place, so the shock wasn''t that big for us,@k ......but it looked like it was different for Jessica.'
3298: '@rIt looked like the shock that Jessica had received was even bigger than I had thought.'
3299: '@r.........This girl, she was always talking badly about her parents, but it looked like she hadn''t changed at all on the inside since long ago.'
3300: '@r...Even now, she was still a pure-hearted and delicate person who couldn''t doubt others.'
3301: '@rI''m sure she respected her parents as much as anyone else does.'
3302: '@r......And then her parents started joining in with all the other parents, right in front of us children,@k going "money money inheritance inheritance, my money!", so it was no surprise that the shock of hearing that was so big...'
3303: 'George@r@v07/10300364."...Jessica-chan.@k@v07/10300365. Please don''t start hating your mother and father.@k@v07/10300366. ......I won''t ask you to understand them, but at least don''t hate them."'
3304: 'Jessica@r@v04/10200389."I get it, just leave me alone a bit...!!"'
3305: '@rSix years ago, I would have further taunted the dejected Jessica,@k ......but even I have grown up over the past six years.'
3306: '@rI realized that it would be better to leave Jessica as she was right now...'
3307: '@rJessica suddenly looked away sulkily and left the parlor.'
3308: '@r...She probably wanted to be left alone for now.@k@rI could do nothing but wordlessly watch her back as she left...'
3309: 'George@r@v07/10300367."......Come to think of it, I wonder where Maria-chan went."'
3310: 'Battler@r@v10/10100605."She''s probably still huddled up on the floor in front of the portrait."'
3311: '@rMaria, who truly looked up to witches, had expected that coming in direct contact with BEATRICE, and receiving the letter as proof,@k would be an event that would surprise everyone and make them happy.'
3312: '@rHowever, the adults had doubted its authenticity, had not taken Maria''s story at face value, and had thoroughly bombarded her with questions.'
3313: '@r...Even I didn''t find it hard to imagine how much that must have hurt Maria.'
3314: '@rWe couldn''t speak to either Maria or Jessica.'
3315: '@r...In the end, George-aniki and I just abandoned ourselves to the sound of the falling rain in the dark night...'
3316: 'George@r@v07/10300368."I wonder what''s happening with that typhoon.@k@v07/10300369. ......Maybe there''s some news."'
3317: '@rGeorge-aniki walked over to the corner of the parlor where the television was.'
3318: '@rHe hadn''t called me over, and I really couldn''t have cared less where the typhoon was on the sea now.@k So I didn''t go over to the television, but instead loitered around the window.'
3319: 'Kyrie@r@v09/11300095."......The wind hasn''t picked up that much here, but I wonder if it''s horrible over the sea.@k@v09/11300096. I did hear from the weather report that there was a severe storm warning."'
3320: 'Battler@r@v10/10100606."Ah, Kyrie-san.@k@v10/10100607. ...How''s it going with you adults, lots to talk about?"'
3321: '@rIt looked like she caught the sarcasm.@k@rKyrie-san shrugged.'
3322: 'Kyrie@r@v09/11300097."...That stomachache of a discussion could continue all night.@k@v09/11300098. It''s very tiring."'
3323: 'Battler@r@v10/10100608."Well, all I can say is, I hope you enjoy playing vultures to Grandfather''s property to your heart''s content.@k@|@y@v10/10100609. ...It''s disgusting."'
3324: 'Kyrie@r@v09/11300099."I''ll agree with you on that.@k@v09/11300100. If I could just slip away like you, I would do it.@k@v09/11300101. ...Unfortunately, I can''t.@k@v09/11300102. Even if I''m not allowed to speak.@k @v09/11300103.It''s not easy being a partner, you know?"'
3325: '@rKyrie-san sighed, smiling bitterly.'
3326: '@rWell, yeah.@k@rThey probably won''t let Kyrie-san, who married into the family, speak.'
3327: '@rStill, as Dad''s partner, she has no choice but to stay by his side and support him.'
3328: '@r......Being in the line of fire, she must be having to bear far greater mental pressure than me.'
3329: '@rI wasn''t going to apologize, but, realizing that I had spoken too harshly, I cut the sarcasm for the time being...'
3330: 'Battler@r@v10/10100610."So how does it look?@k@v10/10100611. Are they still stuck on the topic of the mysterious witch, BEATRICE?"'
3331: 'Kyrie@r@v09/11300104."......More or less.@k@v09/11300105. They''d been piling up secret agreements for some time, hoping for some kind of agreement between the four of them on the distribution of Grandfather''s inheritance after his death."'
3332: 'Kyrie@r@v09/11300106."...And now some unknown fifth person has appeared to make things even more complicated, so there''s no way that''ll make for a peaceful conversation.@k@v09/11300107. One moment they''re snarling at each other, the next they''ll set up a common front.@k@v09/11300108. ......Natsuhi nee-san''s not the only one getting headaches."'
3333: '@rOn the one hand, they all wanted a larger portion than the other siblings, so they were all rivals,@k but on the other hand, they didn''t want one yen to be snatched up by anyone other than the siblings, so they were also all allies.'
3334: '@rI couldn''t get her to tell me the details, but they were apparently arguing on and on about their ceasefire agreement and rules to prevent anyone from getting ahead,@k the situations under which their portions would be protected, and what legal measures would be taken in a worst case scenario.'
3335: '@r......By this point, my emotions had shot straight past disgust, and now I perceived them as a force to be reckoned with...'
3336: 'Battler@r@v10/10100612."So, basically,@k@v10/10100613. BEATRICE is like a saboteur sent by Grandfather.@k@v10/10100614. ...He probably wanted to scare the hell out of his children for just talking about the distribution of the inheritance without him.@k@v10/10100615. Ihihi!"'
3337: 'Kyrie@r@v09/11300109."Who is this BEATRICE, I wonder?@k@v09/11300110. If she is who she says she is, then she''s a mystery that no one knew about until today, and she also knows about the existence of Grandfather''s hidden gold.@k@v09/11300111. Furthermore, she was even entrusted with the Head''s Ring.@k@v09/11300112. ...She must truly have been trusted by him."'
3338: 'Battler@r@v10/10100616."Well, obviously I don''t think she''s a witch riding around on a broom.@k@v10/10100617. ......But she''s surely a person mysterious enough to merit being called a witch."'
3339: 'Kyrie@r@v09/11300113."I just hope Maria-chan will go into more detail about that.@k@v09/11300114. ......Even though she''s just a little girl, everyone has been just chewing her up over this.@k@v09/11300115. They really scared her, and now we can''t even ask her things she might have answered.@k@v09/11300116. I wonder if those people have ever even read "The North Wind and the Sun"."'
3340: 'Battler@r@v10/10100618."What is for certain is that Maria received a letter from a person who took the name BEATRICE.@k@v10/10100619. ......Entrusting Maria with a letter and hiding away even now, when she could have just appeared and talked to us directly...she sure is shy for a mystery person.@k@v10/10100620. Hahahahaha..."'
3341: 'Kyrie@r@v09/11300117."......Hey, Battler-kun.@k@v09/11300118. Do you think that someone called BEATRICE actually exists?"'
3342: 'Battler@r@v10/10100621."Who knows?@k@v10/10100622. It''s probably just a false name, right?@k@v10/10100623. Like she''s Grandfather''s representative, so she was permitted to take the name of the witch from his delusions?"'
3343: 'Kyrie@r@v09/11300119."No, that''s not what I meant.@k@v09/11300120. Right now, there are a total of 18 people here on Rokkenjima.@k@v09/11300121. ......Do you think that there is a 19th person?"'
3344: '@rAre there really a whole 18 people on this island?@k@rWondering about that, I began counting on my fingers, and it really did come out to 18 people.'
3345: 'Battler@r@v10/10100624."Do I think that a 19th person exists, you say.@k@v10/10100625. ......What exactly do you mean?"'
3346: 'Kyrie@r@v09/11300122."Just what I said.@k@v09/11300123. ......It looks like the person who lent Maria that umbrella was not one of us 18.@k@v09/11300124. Therefore, isn''t it reasonable to think that a 19th person exists, and that this was the person who lent Maria the umbrella?"'
3347: 'Battler@r@v10/10100626."............Well, ......yes, I suppose."'
3348: 'Kyrie@r@v09/11300125."Then, where exactly is this person now?@k @v09/11300126.At the very least, she must have been on this island when it started raining.@k@v09/11300127. And since that time, the weather has become progressively worse, so taking a boat out would be pretty much impossible.@k@v09/11300128. In that case, that person must still be on the island hiding from the rain somewhere.@k@v09/11300129. ......And without being spotted by any of us."'
3349: 'Battler@r@v10/10100627.".........Certainly, all of us have been randomly prowling around all over the mansion and the guesthouse, but no one has bumped into a 19th person."'
3350: 'Battler@r@v10/10100628."...Even so, this island is huge.@k@v10/10100629. There might be other places to hide from the rain outside the mansion and the guesthouse."'
3351: '@rAt about this time, I began to realize what direction Kyrie-san''s doubts were taking us in.'
3352: '@rKyrie-san was denying that a 19th person existed.@k@r......BEATRICE was one of us 18.'
3353: '@r...In other words, she thought that someone we knew well was using her name.'
3354: 'Kyrie@r@v09/11300130."If BEATRICE really was as she described herself, this person would definitely be the most honored of guests.@k@v09/11300131. The most honored of confidants, trusted by Grandfather.@k@v09/11300132. ...There''s no way that Grandfather wouldn''t give that kind of person a warm reception.@k@v09/11300133. She would surely have been ushered into the mansion.@k@v09/11300134. However, we haven''t seen anyone."'
3355: 'Battler@r@v10/10100630."Wait a second, isn''t this line of reasoning a little too hasty?@k @v10/10100631.Yes, no one spotted them, but that doesn''t mean that you can deny the possibility that a 19th person exists, right?"'
3356: 'Battler@r@v10/10100632."Maybe, for some reason, they landed on the island stealthily and have been hiding ever since.@k@v10/10100633. ......It''s what they call the Devil''s Proof.@k@v10/10100634. It''s easy to prove that something exists.@k@v10/10100635. If this BEATRICE appears in front of us all and says hi, then everything is resolved.@k@v10/10100636. But it''s impossible to prove that there is no 19th person."'
3357: 'Kyrie@r@v09/11300135."......Yes.@k@v09/11300136. Battler-kun, your way of reasoning isn''t bad.@k@v09/11300137. In the current situation, there''s not enough information to either accept that a 19th person exists or deny it.@k@|@y@v09/11300138. ......But if you flip over the chessboard and think of it that way, we can be nearly sure that the existence of a 19th person is impossible."'
3358: '@r"Flip over the chessboard" was one of Kyrie-san''s favorite phrases.@k@r...I had also been influenced by those words, and used them myself from time to time.'
3359: '@rWhen you get stuck trying to find a move in chess or shogi, by flipping the board over and looking at everything from your opponent''s standpoint, you can often see a strategy that would give you the upper hand.'
3360: '@rDerived from this, it means to think by putting yourself in your opponent''s shoes.'
3361: 'Kyrie@r@v09/11300139."......Okay.@k @v09/11300140.Let''s say that that a 19th person called BEATRICE actually exists.@k@v09/11300141. That person must have managed, without being seen by anyone, to stealthily arrive on this island and remain hidden since then.@k@v09/11300142. They had some reason for this, yes?@k @v09/11300143.In that case, why did they then deliberately appear before Maria and hand her the letter?"'
3362: '@rIt really was a contradiction.'
3363: '@rIf they had some reason for hiding themselves,@k then they should have stayed hidden the whole time, but they had appeared openly in front of Maria.'
3364: 'Battler@r@v10/10100637."Well......@v10/10100638....wait, Maria even said it.@k@v10/10100639. Didn''t she say that she had been made a messenger?@k@v10/10100640. Since Maria was the youngest and looked the most innocent..."'
3365: 'Kyrie@r@v09/11300144."Why would they need a messenger?@k @v09/11300145.If they just wanted a letter delivered to the family conference, they could have mailed it.@k@v09/11300146. If they mailed it to each of the four siblings, they would be unable to ignore it.@k@v09/11300147. There was no need for them to carry it themselves and secretly hand it over."'
3366: 'Battler@r@v10/10100641.".....................That really...@v10/10100642.......does sound pretty weird."'
3367: 'Kyrie@r@v09/11300148."In the first place, if BEATRICE existed, and she wanted to make her presence known to everyone, then she could have just openly presented herself to all of us.@k@v09/11300149. Despite that, she chose the vague method of appearing through a little girl called Maria-chan, and only gave us an indistinct impression of who she was.@k@v09/11300150. Contradiction.@k@v09/11300151. Let''s go a little deeper, shall we?"'
3368: 'Kyrie@r@v09/11300152."............She appeared in front of Maria, trying to give us the impression that a 19th person existed, and yet,@k@v09/11300153. she still hasn''t appeared before us and is hiding somewhere at this very moment.@k@v09/11300154. The contradiction between these.@k@v09/11300155. ......Keep it in mind, and flip over the chessboard."'
3369: 'Kyrie@r@v09/11300156."In other words, the question is: why would a person want to give the impression that BEATRICE exists as a 19th person?"'
3370: 'Battler@r@v10/10100643."......If this person wanted to hide, then they wouldn''t have made their presence known.@k@v10/10100644. And if they wanted to show themselves, they wouldn''t have used the roundabout approach of entrusting someone with a letter.@k@v10/10100645. ......Which means...?"'
3371: 'Kyrie@r@v09/11300157."It''s simple.@k@v09/11300158. BEATRICE is one of the 18.@k@v09/11300159. That is why they are creating the illusion that there is someone outside of the 18.@k@v09/11300160. ...A powerful suggestion of a 19th person."'
3372: 'Kyrie@r@v09/11300161."The only person who could profit from this would not be some 19th person in hiding.@k@v09/11300162. It would be one of the original 18 people.@k@v09/11300163. ......Of course, this reasoning is full of holes.@k@v09/11300164. If you turn over even a few of its premises, it will simply fall apart.@k@v09/11300165. But I think it is almost certainly correct."'
3373: '@r...This was quickly starting to sound pretty creepy.'
3374: '@rWho had lent Maria the umbrella and handed her the letter?@k@rAll of the 18 had been ruled out.@k@rAnd yet, BEATRICE was hidden amongst those 18.'
3375: '@rWhat was that person planning, hiding their true form and pretending to be BEATRICE...?'
3376: 'Kyrie@r@v09/11300166."I also suspected that it might have been Maria-chan playacting, but the contents of the message were extremely complicated, so it''s hard to think that Maria-chan prepared it herself.@k@v09/11300167. ......However, I can''t deny the possibility that Maria-chan is working together with someone."'
3377: 'Battler@r@v10/10100646."W-wait a sec...Maria''s a nine year old kid!@k @v10/10100647.What on Earth could you suspect her of planning, and with who?!@k @v10/10100648.And what about her serious, too honest, and obedient character?!"'
3378: 'Kyrie@r@v09/11300168."Yes, I also understand what kind of a person Maria-chan is.@k@v09/11300169. ......But I think that''s exactly why it''s possible.@k@v09/11300170. That girl''s a dreamer who looks up to and blindly accepts the existence of witches.@k@v09/11300171. So if a person appeared in front of her and said they were the witch BEATRICE, Maria-chan would be so happy that she would just swallow it up, I think."'
3379: 'Battler@r@v10/10100649.".........So you''re saying that if someone disguised themselves by wearing that fancy dress from the portrait, tricking Maria wouldn''t be that hard?"'
3380: 'Kyrie@r@v09/11300172."Of course, with that reasoning, all of us women would become the primary suspects.@k@v09/11300173. ......Anyway, who did Maria-chan encounter...@k@v09/11300174. Asking her the details of that would be our best and closest key to solving this riddle."'
3381: 'Kyrie@r@v09/11300175."...But that key has been obstinately closed up inside her heart.@k@v09/11300176. Everyone denied the existence of the witch without listening to her, and barraged her with too many questions about who BEATRICE actually was.@k@v09/11300177. ......Maria-chan probably won''t open her heart to the adults now."'
3382: '@rIn the dim hall, in front of the portrait of BEATRICE, ......Maria was sobbing.'
3383: 'Maria@r@v13/10400505."......Uu...@k@v13/10400506. Uu.@k@v13/10400507. ...No one believes I met you!@k @v13/10400508.......Uu......@v13/10400509.uu......@k@v13/10400510. I showed them the letter you gave me, but they still don''t believe...!@k @v13/10400511..........Uu......u...@v13/10400512.u...@v13/10400513....hic...@v13/10400514.hic!"'
3384: 'Kyrie@r@v09/11300178."Anyway, Maria-chan''s holding the key.@k@v09/11300179. The key to whether BEATRICE is one of the 18 people or a 19th person."'
3385: 'Battler@r@v10/10100650."...Maria is stubborn, you know?@k @v10/10100651.That girl, when she gets angry, it''s pretty hard to make her feel better."'
3386: 'Kyrie@r@v09/11300180."Battler-kun, I think there''s a higher probability of a kid like you cheering her up than an adult like me.@k@v09/11300181. ...After she feels better, try asking her."'
3387: 'Kyrie@r@v09/11300182."......I know you don''t care about all this back and forth on the distribution of the inheritance,@k@v09/11300183. but don''t you think this classic Western mansion mystery situation is exciting?@k @v09/11300184.Who in the world is this person who gave Maria-chan the letter?@k@v09/11300185. ......It makes my intellectual curiosity tingle."'
3388: 'Battler@r@v10/10100652."Even while being made to sit through those boring money talks, you can call this exciting? You really are tough...@k@v10/10100653. Adults are something else."'
3389: '@rI shrugged, exasperated.@k@r...But I had realized.'
3390: '@rShe had noticed the dejection I was feeling because I had overheard our parents'' turbulent discussion,@k and was probably trying to turn my mood around.'
3391: '@r...She had at least managed to make me feel good enough to hurl abuse.'
3392: '@r......She wasn''t my real mother, so I never felt like calling her Mom.'
3393: '@r...But it did make me think "she''s a real adult".'
3394: 'Rudolf@r@v08/11200269."Hey, brats, so this is where you were?@k@v08/11200270. Kyrie, you really took your time fixing your makeup, didn''t you?@k@v08/11200271. From now on, I''ll start wearing it too."'
3395: 'Kyrie@r@v09/11300186."I''m sorry.@k@v09/11300187. A woman''s makeup takes a long time.@k@v09/11300188. ............So?@k @v09/11300189.How has the discussion been without me?"'
3396: 'Battler@r@v10/10100654."Hehehe, I''m sure everything was all peaceful and harmonious."'
3397: '@rKyrie-san poked the weak spot under my arm with her elbow.'
3398: 'Rudolf@r@v08/11200272."...We decided to take a break to cool our heads a little.@k@v08/11200273. It looks like it''ll last all night.@k@v08/11200274. I could cry."'
3399: '@rHis way of talking hadn''t changed, but he couldn''t completely hide his fatigue.'
3400: '@r...I couldn''t say I was sympathetic, but he looked pitiful compared to his normal, energetic self.'
3401: 'Rudolf@r@v08/11200275."Still, that rain''s just awful.@k@v08/11200276. I really don''t want to go back to the guesthouse.@k@v08/11200277. It looks like Natsuhi nee-san made preparations for us to spend the night here in the mansion.@k@v08/11200278. What''ll we do?"'
3402: 'Kyrie@r@v09/11300190."......We don''t need to think about that until you''re done, right?@k @v09/11300191.If you run out of enough energy to head back to our room, then we can let them take care of us."'
3403: 'Rudolf@r@v08/11200279."You''re right.@k@v08/11200280. We can think about it later.@k@v08/11200281. ......What about you, Battler?"'
3404: 'Battler@r@v10/10100655."If I stayed, I''d just get in the way.@k@v10/10100656. I''ll be nice and go back over there."'
3405: 'Rudolf@r@v08/11200282.".........OK.@k@v08/11200283. Will you go back soon?"'
3406: 'Battler@r@v10/10100657."I dunno.@k@v10/10100658. It''d be lonely to head back by myself.@k@v10/10100659. I''ll head back with the rest of the kids as a group."'
3407: 'Rudolf@r@v08/11200284."Yeah.@k@v08/11200285. That''d be good.@k@v08/11200286. ...............So, Battler.@k@v08/11200287. You won''t just be going to sleep that easily, right?"'
3408: 'Battler@r@v10/10100660."Yeah, I''ll probably be up talking with the cousins.@k@v10/10100661. It feels like we might be up all night.@k @v10/10100662.Is there a problem with that?"'
3409: 'Rudolf@r@v08/11200288."......OK.@k@v08/11200289. If, when the adults'' discussion is over, you are still awake, I want to have a little talk as a family."'
3410: 'Battler@r@v10/10100663."...A what?@k @v10/10100664.That doesn''t sound like you."'
3411: '@rApparently, Kyrie-san was thinking the same thing.@k@r"What are you talking about?",@k she asked him in a small voice.'
3412: '@r...It looked like Kyrie-san didn''t have a clue what Dad was talking about either.'
3413: 'Rudolf@r@v08/11200290."......I want to talk to you about it as well.@k@v08/11200291. ......I''ll tell you later, so don''t ask now.@k@v08/11200292. Please."'
3414: 'Kyrie@r@v09/11300192.".....................?"'
3415: '@rI don''t think there''s anyone who ignores their family as much as this old bastard.'
3416: '@r...And this was the guy that was asking us to have a talk as a family.@k@r......Both Kyrie-san and I couldn''t help but get wide-eyed.'
3417: 'Rudolf@r@v08/11200293."Don''t make that scared looking face.@k@v08/11200294. I''m the one that should be scared.@k@v08/11200295. ............I mean, ......"'
3418: '@rAt that point, he swallowed his words for an instant.'
3419: '@r...I don''t remember Dad being the kind of person to artificially drum up suspense.'
3420: 'Battler@r@v10/10100665."...You''re freaking me out, Dad.@k@v10/10100666. You''ve got your family all here right now.@k@v10/10100667. Quit beating around the bush and spit it out."'
3421: 'Rudolf@r@v08/11200296."...I''m probably...@k@v08/11200297...gonna get...@v08/11200298.murdered tonight."'
3422: '@rThere was a huge crash of thunder.@k@rIt must have been really close.'
3423: '@rDad''s expression, brightly illuminated by the lightning, was burned into my eyes.'
3424: '@r......Dad''s face, which always looked so sure of itself and which always wore a taunting expression,@k ......was, for some reason that I couldn''t explain, strangely frail.'
3425: '@r............It was so worn out that he looked like a different person.'
3426: 'Battler@r@v10/10100668."Wh-what...?!@k @v10/10100669....What are you talking about, that doesn''t sound like you!"'
3427: 'Kyrie@r@v09/11300193."*giggle*.@k@v09/11300194. I agree.@k@v09/11300195. What happened? You look so timid all of a sudden.@k@v09/11300196. It''s not like you."'
3428: 'Rudolf@r@v08/11200299.".........I''m going to go fix my makeup.@k@v08/11200300. Don''t follow me."'
3429: '@rDad turned away, weakly.'
3430: '@r...After that, only Kyrie-san and I were left, still wide-eyed.'
3431: 'Battler@r@v10/10100670."What the hell was that.........?@k@v10/10100671. He''s gonna get murdered tonight?"'
3432: 'Battler@r@v10/10100672."You don''t think that mysterious letter scared him?@k @v10/10100673.Hasn''t he been watching too many serial murder movies?"'
3433: 'Kyrie@r@v09/11300197."..................Hmmm."'
3434: '@rKyrie-san didn''t answer my lighthearted words, and continued to stare at my dad''s disappearing back...'
3435: 'Kyrie@r@v09/11300198."......Battler-kun, when you told Rudolf-san to talk about it, he left without telling us anything.@k@v09/11300199. Even though he said that he had something to say to everyone, he didn''t answer you.@k@v09/11300200. Why?@k @|@y@v09/11300201.......Flip over the chessboard.@k@v09/11300202. ............And when you do?"'
3436: 'Battler@r@v10/10100674."There''s the contradiction that he said he wanted to talk but then couldn''t.@k@v10/10100675. ...What, can you see anything by looking from Dad''s perspective?"'
3437: 'Kyrie@r@v09/11300203."......*giggle*.@k@v09/11300204. Yes, I can see something.@k@v09/11300205. He wants to talk about something.@k@v09/11300206. However, he doesn''t have the courage to bring it up.@k@v09/11300207. So he actually means "In that case, chase after me, talk to me, and question it out of me".@k@v09/11300208. He also means the opposite when he says "Don''t follow me".@k@v09/11300209. He actually means "Follow me and force me to answer."@k@v09/11300210. ......Honestly, what a spoiled little child."'
3438: 'Battler@r@v10/10100676."Whaaaa?!@k @v10/10100677.Are you sure that theory''s OK?!@k @v10/10100678.Th-that''s ridiculous."'
3439: 'Kyrie@r@v09/11300211."Heheheh, can great detectives deduce the emotions and feelings between men and women?@k @v09/11300212.They can''t, right?@k @v09/11300213.Figuring out the feelings of the opposite sex is an even more advanced art than exposing the tricks in difficult crime cases.@k@v09/11300214. If you ask me, romance novels have much deeper mysteries than masterpiece mystery novels."'
3440: 'Battler@r@v10/10100679."I, ...I see.@k@v10/10100680. Is that how it is......"'
3441: 'Kyrie@r@v09/11300215."I''ll be with that spoiled little child.@k@v09/11300216. ......He normally loves to act tough, but tonight he''s completely tired out from that heated discussion.@k@v09/11300217. He probably wants someone to lean on at the moment.@k@v09/11300218. And responding to that need is the duty of his partner."'
3442: 'Battler@r@v10/10100681."Hahh.@k@v10/10100682. Sounds passionate.@k@v10/10100683. Then I''ll leave the old bastard in your hands."'
3443: 'Kyrie@r@v09/11300219."Yes, leave it to me."'
3444: '@rAs Kyrie-san departed, I called out to her.'
3445: 'Kyrie@r@v09/11300220."......Huh?@k @v09/11300221.What?"'
3446: 'Battler@r@v10/10100684."Um, I wanted to say thanks.@k@v10/10100685. Thanks to you, my gloomy mood has cleared up a lot."'
3447: 'Kyrie@r@v09/11300222."That''s good.@k@v09/11300223. Communication is important."'
3448: '@rAfter answering with a wink, Kyrie-san followed after Dad...'
3449: '@rNatsuhi could be found in the dimly lit hallway.@k@rNow and then, the thunder would crash, but this had no effect on Natsuhi''s expression.'
3450: '@r......Her expression was completely worn out.'
3451: '@rThe discussion that had just taken place between the relatives in the dining hall was repeating itself inside Natsuhi''s mind...'
3452: '@rBEATRICE had proclaimed that in addition to the gold, the headship and all of the assets of the Ushiromiya family would be given to the person who could solve the riddle.'
3453: '@r...In other words, she planned to undermine the absolute guarantee that Krauss, as the oldest brother, had to succeed the family head.'
3454: '@rOriginally, the other siblings had absolutely no chance to succeed the head.'
3455: '@rTo them, this "proposal" by BEATRICE was extremely desirable.'
3456: '@rIt was obvious that they would accept BEATRICE''s proposal.'
3457: '@r...Even without playing clumsy detective games, she knew that this so called 19th person, BEATRICE, couldn''t exist.'
3458: '@rThis was a message employing a fictional character called BEATRICE as a messenger; it may as well have been written in Kinzo''s own handwriting.'
3459: '@rThe proof was that Kinzo remained stubbornly neutral as to that letter''s authenticity.'
3460: '@r......He was completely ignoring these reckless claims that he shouldn''t be able to ignore: that he had given up the Head''s Ring.'
3461: '@r............In short, Kinzo had wordlessly admitted that the letter held his own message.'
3462: '@rMost likely, one of the servants had given Maria the letter.'
3463: '@rKinzo had probably worked out an elaborate plan where the dress from the portrait would be prepared,@k ......and someone, probably Shannon, would be made to wear it and deliver the letter and the umbrella.'
3464: '@rBy doing that, he could make it seem like the witch from the portrait actually existed.'
3465: '@r...No, if anything, that is why you could be certain that Kinzo was behind all of this.'
3466: '@rIn that case, ......it was just as if Kinzo had butted in on the siblings'' private discussion.'
3467: '@rAnd, by announcing that he would give everything to the person who could solve the riddle, Kinzo had weakened Krauss''s overwhelming advantage.'
3468: '@r.........Now it was certain.@k@rKinzo had listened in on the siblings'' discussion in the parlor earlier that day.'
3469: '@rSo he had known how Krauss had staved off the attack by the other three,@k and to make the scales of the battle go back into balance, he had sent out this strange letter which benefited the other three.'
3470: '@rEva and Rudolf had dragged Rosa in, who had a weak position among the siblings because of her age,@k and they were trying once again to overwhelm Krauss three-on-one, and push through their crazy reasoning.'
3471: '@r......And so, they had resumed what had once been a nearly decided conflict, and were repeatedly pressing Krauss to pay them a large amount of money...'
3472: '@rTalk about the advance payment, which had been denied once already, was being brought up again under the terms that all of the siblings would guarantee Krauss the succession to the family head.'
3473: '@rOf course, even without the story about the hidden gold, the Ushiromiya family''s store of wealth was vast.'
3474: '@rJust that store was worth more than enough by itself.@k@rEven if the hidden gold was buried forever along with Kinzo''s death, there would be more than enough to satisfy.'
3475: '@rTherefore, even if they had no interest in the gold itself,@k there would be the lifelong fear that, on the off-chance that someone found the gold, that person would be granted the position of family head.'
3476: '@rAnd this kind of Achilles'' heel would definitely be taken advantage of by someone sooner or later.'
3477: '@rThe only person with this fatal weakness was the successor to the head, Krauss.@k@r......The other siblings had found,@k ...no, they had been told, by Kinzo, about something that only Krauss could lose, and they had thoroughly taken advantage of that.'
3478: '@r...Natsuhi, as Krauss''s only ally in his painful position, and as his wife, had believed she was fighting alongside him.'
3479: '@rShe kept trying to point out to him that the existence of the gold itself was a farce and that there was no need for him to compromise.'
3480: '@rKrauss had always told Natsuhi.@k He had told all of the siblings.@k@rHe had always, always said that the hidden gold was nothing more than a fiction created by Kinzo.'
3481: '@rTherefore, Natsuhi had believed that as his wife, and on that foundation had supported her husband.'
3482: '@rYet her words would not reach him.'
3483: '@r...Even though she was fighting so hard and lending all of her strength, he continued to fight by himself, and was trying to compromise with the other three siblings...'
3484: '@rWondering why she could not be of use to him, Natsuhi felt sorrow, shame, and then anger.'
3485: '@rIt had happened when everyone decided to take a short break to cool their heads.'
3486: '@rNatsuhi had flared up against Krauss.'
3487: '@rEnraged, she had asked why she could not be useful to him.'
3488: '@r......He had told her that he wanted to talk about something, and had invited her into one of his private rooms, which she was normally not allowed to enter.'
3489: '@rThat room had been sealed with a heavy-looking padlock, and just looking at it had given her an uncomfortable feeling...'
3490: 'Natsuhi@r@v03/10900108."There''s no reason for you to worry about what those three or even this suspicious person who calls themselves BEATRICE says!!@k @v03/10900109.After all, the gold is just a ruse created by Father.@k@v03/10900110. There''s no way something like that could be found!!@k @v03/10900111.It is set in stone that you will be the successor to the family.@k@v03/10900112. What are you afraid of?!"'
3491: '@rKrauss removed the padlock on the door.@k@rHe then motioned for Natsuhi to enter.'
3492: 'Krauss@r@v02/10800319."Enter."'
3493: 'Natsuhi@r@v03/10900113."Wha-......what is this?"'
3494: 'Krauss@r@v02/10800320."There''s something I want to show you.@k@v02/10800321. ......I have never shown it to you before."'
3495: '@rNatsuhi timidly opened the door with a dubious expression on her face...'
3496: '@rIt was pitch black.'
3497: '@rShe searched for a switch to turn on the lights, but since this was her first time in the room, she didn''t know where it was.'
3498: '@rKrauss entered behind her, pushing her in, and closed the door before making any attempt to turn on the lights; the two were swallowed up by the darkness.'
3499: '@rOnly the sound of Krauss locking the door rang out through the dark.'
3500: 'Natsuhi@r@v03/10900114."Wh-what are you doing...?@k@v03/10900115. The, the lights..."'
3501: 'Krauss@r@v02/10800322."I am turning it on now.@k@v02/10800323. Wait."'
3502: '@rTrue to his word, Krauss pushed a switch on the wall, and a flickering light turned on and lit up the room.'
3503: 'Natsuhi@r@v03/10900116."...........................Wh-@v03/10900117.what is......?"'
3504: '@rNatsuhi had her breath taken away.'
3505: '@rThe room had no windows, and at a glance, it appeared to be empty.'
3506: '@rIn the middle of the room, a small, round table had been set,@k and the lights brightened only that table, as if it were the leading part in a play.'
3507: '@rLaid out on top of the table was a red tablecloth of elaborate design, covered with dust,@k ......and on top of that, "something" about the size of a grown man''s arm had been set down.'
3508: '@r......That something took Natsuhi''s breath away.'
3509: 'Krauss@r@v02/10800324."It''s a gold ingot of incredible purity.@k@v02/10800325. Without this, no one would have believed in the Legend of the Gold."'
3510: '@rIt was an ingot of solid gold.'
3511: '@rEven in the faint light, it sparkled with a noble and dignified gold glint...'
3512: 'Krauss@r@v02/10800326."This is not a proper ingot.@k@v02/10800327. I don''t even know whether it was cast inside or outside the country."'
3513: '@rIt takes a high level of skill to make the purest of solid gold ingots.@k@rAnd in order to verify that purity, it is standard to have the original foundry and the name of the bank that guaranteed it imprinted on the gold.'
3514: '@r...However, this ingot did not have that kind of seal.@k@r.........This mysterious gold bar had come from an unknown foundry.'
3515: 'Krauss@r@v02/10800328."Look here.@k@v02/10800329. ............There''s nothing to be afraid of.@k@v02/10800330. It''s just a bar of gold."'
3516: '@rNatsuhi, following Krauss''s words, timidly approached the ingot......'
3517: 'Krauss@r@v02/10800331."Right there."'
3518: '@rKrauss pointed at the surface of the ingot.@k@r...Natsuhi concentrated on that section...'
3519: 'Natsuhi@r@v03/10900118.".....................!!"'
3520: '@rRight there was the thin imprint of the One-winged Eagle crest!@k Natsuhi''s breath was taken away once again.'
3521: 'Krauss@r@v02/10800332."That''s right.@k@v02/10800333_b. This is the legendary ingot that Dad said he received from the witch, that the president of Marusoo witnessed and was allowed to select at random to take back with him,@k@v02/10800334. that gained the trust of the fixers in the business world.@k@v02/10800335. I had to use all possible means to find it.@k@v02/10800336. ......Before the other siblings could."'
3522: 'Natsuhi@r@v03/10900119.".........How could............@k@v03/10900120. ......Then,@v03/10900121. .........the legend of Father''s gold is........."'
3523: 'Krauss@r@v02/10800337."It actually exists.@k@v02/10800338. ......The gold that Ushiromiya Kinzo received from BEATRICE actually exists."'
3524: 'Natsuhi@r@v03/10900122."How could...............!@k @v03/10900123.H-......how could it really exist............"'
3525: '@rNatsuhi was shocked......'
3526: '@rKrauss had always said that Kinzo''s gold was just a fabrication.@k@rSo she had believed it as his wife.'
3527: '@rHowever, the reality was different.@k@rHe had held definite proof, and had been more certain than any of the other siblings that the Legend of the Gold was true.'
3528: '@rBecause of this, Krauss was deeply frightened at the possibility that someone other than himself would find the gold that he had failed to find, costing him everything.'
3529: '@r......But to Natsuhi, this truth was more than enough to split open her heart.'
3530: '@rShe had thought that, as Krauss''s wife, she should be his closest confidant, which was why she had been selflessly supporting him.'
3531: '@r...And yet, he had hidden this fact from her until today.@k .........Why?'
3532: 'Natsuhi@r@v03/10900124."......Ha-@v03/10900125..........have I been...@v03/10900126..........so undeserving of your trust............?"'
3533: 'Krauss@r@v02/10800339.".........I didn''t mean it like that.@k@v02/10800340. It was only that there was no need to mention it."'
3534: 'Natsuhi@r@v03/10900127."Is,@v03/10900128. ......is that all a,@v03/10900129. ............a wife...@k @v03/10900130.means to you............?!"'
3535: 'Krauss@r@v02/10800341."Calm down...@k@v02/10800342. Becoming passionate easily is one of your bad habits."'
3536: 'Natsuhi@r@v03/10900131."You''re the one who''s making me like that, aren''t you!!!@k @v03/10900132.I have been supporting you as a wife ever since I married into this family...!@k @v03/10900133.For your sake, I threw away the family I was born into,@v03/10900134. I''ve been offering up my heart and my body to serve you...!!"'
3537: 'Natsuhi@r@v03/10900135."And in return,@v03/10900136. .........I get this.........?!!@k @v03/10900137.How could......@v03/10900138. ............How could you............!!"'
3538: '@rKrauss grimaced, looking annoyed...@k@rHis expression effectively communicated how much he disliked this part of Natsuhi...'
3539: 'Natsuhi@r@v03/10900139."......I.........@k@v03/10900140. I don''t think I can be of any use to you anymore............"'
3540: 'Krauss@r@v02/10800343."Mm, and that is fine.@k@v02/10800344. .........I can resolve problems between the siblings by myself.@k@v02/10800345. I don''t need your help."'
3541: 'Natsuhi@r@v03/10900141."That''s wrong!!@k @v03/10900142.This is the Ushiromiya family''s problem!@k @v03/10900143.It''s true that I am not permitted to have the family crest imprinted on my body!@k @v03/10900144.But I am still your wife!!"'
3542: 'Natsuhi@r@v03/10900145."Even so, ......are you saying I''m not qualified to help you...?!@k @v03/10900146.Are you.........?!!!"'
3543: 'Krauss@r@v02/10800346.".....................I deliberately chose not to involve you, out of consideration for you.@k@v02/10800347. Let''s not talk any further; it will likely only worsen your headaches.@k@v02/10800348. Take a rest for today.@k@v02/10800349. The siblings will deal with the siblings'' problems.@k@v02/10800350. It has nothing to do with you.@k@v02/10800351. That is all."'
3544: '@rA dull headache tormented Natsuhi...@k@rNo matter what medicine she took, no matter what scents she burned, it wouldn''t heal.'
3545: '@r......On the other hand, by standing here alone in a dimly lit corridor, her head filled with the sound of the rain, she felt like the pain had softened a little...'
3546: '@r.........I may have been Natsuhi,@w500. ...but I was not Ushiromiya Natsuhi.'
3547: '@rDenigrated as being a sorry excuse for a wife, ...verbally abused for not even being able to take care of that,@w583. .........even so, I tried to properly perform the duties of a wife,@w500. ......but have been rejected even by my husband.'
3548: '@rI did my best raising my daughter as though it was the last job left to me.@k@r...However, my anger and sadness, having no place to go, caused me to subconsciously strain that relationship too...'
3549: '@rBecause I have been excessively strict in Jessica''s education, I am thoroughly disliked by her.'
3550: '@rJessica despises me for not being interested in anything but grades.'
3551: '@r......There is no longer...@w500.......anything I can do for the Ushiromiya family.........'
3552: '@rNo,@w333. ......that''s no good.'
3553: '@rEven so, I must help my husband dislodge the schemes of the other greedy siblings.'
3554: '@rThe head won''t be around much longer.@k Eventually, Krauss will succeed the head.@k@rAnd the next successor will be Jessica.'
3555: '@r.........Strictly speaking, the man who enters the family by marrying Jessica will become the next head, but it all comes to the same thing.'
3556: '@r......I have to make Jessica an excellent successor who everyone will accept as worthy to take over the Ushiromiya family.'
3557: '@rIn the years to come, that greedy Ushiromiya Eva will surely be continually plotting to find some fault with the main family,@k so that if all goes as she plans, Jessica will be dragged down from the succession, with George in her place.'
3558: '@r......It is regrettable, but George is a man, and even more, has matured as a person.'
3559: '@r...If you compare him to Jessica, who is right in the middle of her rebellious period and whose grades are below average, you can see at a glance who is more fit to succeed the head.'
3560: '@rSo in order to secure Jessica''s position, I need to turn her into an excellent person.'
3561: '@rAfter doing that, .........I want to find her an excellent husband worthy of the excellent person she will have become.'
3562: '@r.........A wonderful man who will truly accept Jessica, and stay with her through all of life''s joys and sorrows.'
3563: '@rWas that...............Natsuhi trying to entrust her daughter with fulfilling some desire of her own?'
3564: '@rNatsuhi thought back to the days when she''d had no choice but to marry into the Ushiromiya family, because of that unavoidable fate...'
3565: '@rShe had tried to block that from her memory.'
3566: '@r.........She had consciously forgotten that, and had actively attended to the life she had been given as Ushiromiya Natsuhi...'
3567: '@rAnd this was the new life she had built.'
3568: '@r.........But, ...it felt like,@w500. ......just now, all of that had been casually rejected.'
3569: 'Natsuhi@r@v03/10900147."..............................@k@v03/10900148. How should I think as I live my life?@v03/10900149. ...............I don''t know."'
3570: '@rNatsuhi helplessly rested her head against the glass of the window...'
3571: '@rThe glass, cooled by the raindrops beating against it, was somehow refreshing, and even though it had no emotions, ...right then it seemed to be the only thing that could understand Natsuhi...'
3572: '@rEven if someone showed up there and saw her like this, Natsuhi had no intention of caring in the least.'
3573: '@r.........But she found herself caring.@k .........Because it was her beloved daughter.'
3574: 'Jessica@r@v04/10200390.".........Oh,@v04/10200391. ......it''s you, Mom.@k@v04/10200392. What the heck are you doing here?@k@v04/10200393. Thought you were a ghost..."'
3575: '@rJust like always, her words were rough and not at all like a girl''s.'
3576: '@r...Instinctively, words of rebuke rose to Natsuhi''s throat.@k@r.........However, they did so only weakly, and so she was able to prevent them from escaping her lips.'
3577: 'Natsuhi@r@v03/10900150."........................Jessica.@k@v03/10900151. I''m sorry, your mother has an awful headache.@k@v03/10900152. Please leave me be."'
3578: 'Jessica@r@v04/10200394."..................Oh......"'
3579: '@rJessica was more than slightly disconcerted by this first ever sight of feebleness from her mother.'
3580: '@rUntil just now, she had been filled with contempt for all of the parents, including her mother.'
3581: '@r...But now, not the slightest bit of that feeling remained.'
3582: '@r......All of it had been wiped out by her mother''s completely exhausted face.'
3583: '@rIn its place, the words that George had told her floated back up in her mind.@k@rThe parents are doing their best in their own way.'
3584: '@r...They are supporting their family, so they can''t afford to keep everything pleasant, and have a heavy responsibility to fight.'
3585: '@r......Couldn''t her mother have been standing around in this dimly lit hallway because no one had tried to understand that...?'
3586: '@rJessica didn''t like her mother.@k@r......So she had no instinct to give her mother words of kindness just because she looked a little frail...'
3587: '@rTherefore, in order to give those words regardless, she had to clench both her fists, and wrench the words out from the depths of her heart.'
3588: 'Jessica@r@v04/10200395."It, .........it looks like you really have your hands full with that discussion..."'
3589: 'Natsuhi@r@v03/10900153.".....................It has nothing to do with you.@k@v03/10900154. Please go somewhere else."'
3590: 'Jessica@r@v04/10200396.".........Is your headache bad?@k @v04/10200397.Should, should I go get some medicine...?"'
3591: 'Natsuhi@r@v03/10900155."...............You don''t have to trouble yourself.@k@v03/10900156. ...Please, leave me by myself."'
3592: '@rNatsuhi was not being cold to her.@k@r...She just wanted to get her daughter far away from her, so that she could avoid subjecting her to her short temper.'
3593: '@r......But there was no chance that her intentions would reach Jessica.'
3594: 'Jessica@r@v04/10200398.".....................o......okay."'
3595: '@rJessica hung her head, looking sad.'
3596: '@r...Looking at that expression, Natsuhi realized that Jessica was trying to muster up the strength to be kind to her mother.'
3597: '@rShe gave her head a small shake to drive away her own unkind feelings...'
3598: 'Jessica@r@v04/10200399."Then I''ll......leave.@k@v04/10200400. ......I''ll be with the other cousins so I don''t get in the way of the adults.@k@v04/10200401.@|@y ............See you..."'
3599: 'Natsuhi@r@v03/10900157.".........Wait."'
3600: '@rShe called Jessica, about to make her desolate exit, to a stop.'
3601: 'Jessica@r@v04/10200402."......What...?"'
3602: 'Natsuhi@r@v03/10900158."............Thank you for being considerate.@k@v03/10900159. .........It isn''t good of me to go to sleep and leave you alone."'
3603: 'Jessica@r@v04/10200403."D-don''t talk like that, you''ll bring bad luck..."'
3604: 'Natsuhi@r@v03/10900160."...I apologize for worrying you.@k@v03/10900161. I''m alright now.@k@v03/10900162. .........I will go."'
3605: '@rStaying here any longer with such a feeble expression would actually make her daughter feel more uncomfortable.'
3606: '@r...Thinking this, Natsuhi left Jessica with words of gratitude and made to depart.'
3607: '@r......This time, it was Jessica who called out to her mother''s back.@k@rNatsuhi stopped, turned around, and asked what she wanted.'
3608: '@rBut Jessica herself didn''t know why she had stopped her mother,@k ...and for a while, she muttered to herself with a slightly forced smile as she hesitated over what to say.'
3609: '@rShe was poking around in her pocket when her hand touched something, and she took it out.'
3610: 'Jessica@r@v04/10200404."Um, hey, Mom!@k @v04/10200405.I, uh, was given a charm today.@k@v04/10200406. What was it, a charm against magic?"'
3611: 'Jessica@r@v04/10200407."Umm, err...... I''m pretty sure that...you were supposed to hang it from your doorknob, was it?@k @v04/10200408.Ahahaha... I forget...@k@v04/10200409. There''s no reason for me to have it, so......@k@v04/10200410.I''m giving it to you."'
3612: '@rIt was the scorpion charm that Maria had given her by the beach that day.'
3613: '@rAlthough she had heard of its various effects from Maria, right now, Jessica''s mind was blank, and it was all she could do to say even that much.'
3614: '@rThinking that her mother probably wouldn''t accept the charm anyway, Jessica had immediately drawn back the hand offering it to her.'
3615: '@r......So when Natsuhi came back and took hold of that hand, she was extremely surprised...'
3616: 'Natsuhi@r@v03/10900163."......................What is this?@k @v03/10900164.Some kind of giveaway...?"'
3617: 'Jessica@r@v04/10200411."W-well, it''s, I think it''s something like that...@k@v04/10200412. I guess you can''t expect any benefits from a charm that looks like a toy......"'
3618: '@rBut her mother took the scorpion charm from her grip.'
3619: 'Natsuhi@r@v03/10900165."Thank you.@k@v03/10900166. I''ll take good care of it.@k@v03/10900167. ............Sometime soon, in exchange, I''ll give you a charm that was important to me when I was a child."'
3620: 'Jessica@r@v04/10200413."...It, it''s not like that''s why I gave it to you.@k@|@y@v04/10200414. ......But, well,@v04/10200415. ......if you really say so..."'
3621: 'Natsuhi@r@v03/10900168."Then I will rest for now.@k@v03/10900169. My headache is awful.@k@v03/10900170. .........Try not to stay up too late."'
3622: 'Jessica@r@v04/10200416."Sure..."'
3623: '@rNatsuhi put the charm in her pocket and turned away.@k@r......She then disappeared into the dark hall...'
3624: 'George@r@v07/10300370."...It looks like the weather will be like this all day tomorrow after all."'
3625: 'Battler@r@v10/10100686."Damn... It''s hard to believe it was dry out earlier."'
3626: '@rGeorge-aniki and I were killing time in front of the parlor television.'
3627: '@rAt that point, Jessica returned.@k@rHer face was still blank, but it looked like she had calmed down a little since she had left.'
3628: 'Jessica@r@v04/10200417."......Is Maria still in front of the portrait?"'
3629: 'Battler@r@v10/10100687."Nope.@k@v10/10100688. She just came back, and she''s sleeping over there on the sofa.@k@v10/10100689. It is getting pretty late for her."'
3630: '@rLooking at the clock, it was a little past 10 p.m.@k@r...Even if we were going to stay up all night, it was about time to head back to our room.'
3631: 'Jessica@r@v04/10200418."My mom did prepare a room for us in the mansion, but...@k@v04/10200419....what d''you wanna do?"'
3632: 'George@r@v07/10300371."I think I''d rather head back to the guesthouse.@k@v07/10300372. ......Judging by our parents'' appearance, I think it would be better if we weren''t in the mansion."'
3633: 'Battler@r@v10/10100690."Second that.@k@v10/10100691. Feels like they''re telling us kids to mind our own business and stay out of their way.@k@v10/10100692. Let''s do that, like good little boys and girls."'
3634: '@rAfter we discussed that, Auntie Rosa came into the parlor.'
3635: '@rShe was looking all over restlessly, probably trying to find Maria.'
3636: 'Battler@r@v10/10100693."Auntie Rosa, if you''re looking for Maria, she''s over there on the sofa."'
3637: 'Rosa@r@v12/11400235."Thank you.@k@v12/11400236. My, she''s out cold.@k@v12/11400237. ......We must move her to a bed."'
3638: 'George@r@v07/10300373."If you would like me to, I can carry her to a bed."'
3639: 'Rosa@r@v12/11400238."Thank you, that would be wonderful.@k@v12/11400239. .........Will all of you return to the guesthouse?@k @v12/11400240.Or will you stay in the room Natsuhi nee-san had prepared?"'
3640: 'Jessica@r@v04/10200420."We were just talking about that.@k@v04/10200421. We just decided to head over to the guesthouse."'
3641: 'Rosa@r@v12/11400241."Really.@k@v12/11400242. Then I wonder if you wouldn''t mind taking Maria with you.@k@v12/11400243. ...I think it will be much more comforting for her if she''s with all of her cousins."'
3642: '@rIt seemed that, in the shadow behind those words, there was some regret that the adults, herself included, had deeply hurt Maria''s feelings...'
3643: 'Battler@r@v10/10100694."Leave it to us, Auntie.@k@v10/10100695. After all, we do have an expert at comforting Maria with us!"'
3644: 'George@r@v07/10300374."A-are you talking about me?@k @|@y@v07/10300375.I couldn''t do it by myself.@k@v07/10300376. We''ll need everyone together."'
3645: 'Jessica@r@v04/10200422."That''s right.@k@v04/10200423. Battler, weren''t you the one who hit it off with Maria when you were messing around earlier?"'
3646: '@rAs we said this, Auntie Rosa smiled, looking truly happy.'
3647: 'Rosa@r@v12/11400244."Thank you, everyone.@k@v12/11400245. ......It looks like our meeting will last until very late.@k@v12/11400246. So, I''m sorry for the burden, but I''ll have to leave Maria in your hands."'
3648: 'Battler@r@v10/10100696."Hey, Maria, are you awake...?@k @v10/10100697.We''re going back to the guesthouse~."'
3649: '@rMaria muttered something indistinct as if answering, but then rolled over and fell back asleep.'
3650: '@r......It looked like she was sleeping deeply.'
3651: 'Jessica@r@v04/10200424."She''s really out cold.@k@v04/10200425. It''d be bad to wake her."'
3652: 'George@r@v07/10300377."Right, I''ll carry her."'
3653: '@rMaria''s body was much lighter than it looked.@k@rGeorge-aniki picked her up and pulled her over his back.'
3654: '@rIt was raining hard outside, and Aniki couldn''t hold an umbrella and carry Maria at the same time.'
3655: '@rIt looked like Auntie Rosa would come with us as far as the guesthouse to help out.'
3656: '@rHowever, when she heard Uncle Krauss''s voice call out to her, she had no choice but to return.'
3657: 'Rosa@r@v12/11400247."......Oh dear.@k@v12/11400248. I have to go back."'
3658: 'Shannon@r@v15/10500153.".........Is everyone returning to the guesthouse?"'
3659: '@rAfter we left the hall on the way to the entrance, the door to the servant room opened and Shannon-chan stepped out.'
3660: 'Shannon@r@v15/10500154."It has become very dark, so allow me to guide you."'
3661: 'Rosa@r@v12/11400249."Perfect timing, Shannon-chan.@k@v12/11400250. George-kun is going to carry Maria there.@k@v12/11400251. Could you hold an umbrella for him?"'
3662: 'Shannon@r@v15/10500155."Yes, certainly."'
3663: '@rShannon-chan brought umbrellas for each of us and a flashlight to guide the way.'
3664: '@rAs we opened the front door, the downpour was quite terrific.'
3665: '@rIt looked like we wouldn''t have any spare time to take a pleasant walk and enjoy the nighttime rose garden...'
3666: 'Battler@r@v10/10100698."Aniki, is she too heavy?@k @v10/10100699.Want me to carry her?"'
3667: 'George@r@v07/10300378."It''s alright.@k@v07/10300379. I can at least carry Maria-chan."'
3668: 'Rosa@r@v12/11400252."......I''m truly grateful.@k@v12/11400253. Please take care of Maria."'
3669: 'Jessica@r@v04/10200426."Right, we understand.@k@v04/10200427. In that case, goodnight, Auntie."'
3670: 'Shannon@r@v15/10500156."Then I will see them over there and return here."'
3671: 'Rosa@r@v12/11400254."Yes, please..."'
3672: '@rAuntie Rosa saw us off.'
3673: 'Rosa@r@v12/11400255.".........Maria.@k@v12/11400256. ......I''m sorry for everything..."'
3674: '@rRosa''s mumbling voice didn''t reach the person in question, nor anyone else, but disappeared beneath the sound of the rain...'
3675: '@rAfter cutting through the rainy rose garden, we arrived at the guesthouse.'
3676: 'Battler@r@v10/10100700."Ahh, if only I''d applied for the position of Maria-carrier!@k @v10/10100701_b.Then I''d have gotten to rub Shannon-chan''s huge chest all over with my arm as she held the umbrella over me!"'
3677: 'George@r@v07/10300380."Th-th-th-that''s not on purpose, it''s a misunderstanding...!"'
3678: 'Shannon@r@v15/10500157."I, I thought that if I didn''t, George-sama would get all wet........."'
3679: 'Jessica@r@v04/10200428."C''mon, quit babbling and go in!"'
3680: '@rAfter being nudged by Jessica, Shannon folded up her umbrella and went into the guesthouse.'
3681: 'Shannon@r@v15/10500158."Has anyone gotten their clothes wet?@k @v15/10500159.I can bring some towels if you would like..."'
3682: 'Battler@r@v10/10100702."You don''t need to worry about us that much.@k @v10/10100703.Thanks, Shannon-chan."'
3683: 'George@r@v07/10300381."Oh, yes.@k@v07/10300382. We were saying earlier that we would play some cards, do you want to stay with us for a while?"'
3684: 'Jessica@r@v04/10200429."Huh?@k @v04/10200430.Who had the night shift on today''s schedule?"'
3685: 'Shannon@r@v15/10500160."I believe there is a special schedule for the duration of the family conference.@k@v15/10500161. I think there were a few changes, so I will go and check......"'
3686: 'Battler@r@v10/10100704."Wait, if you have to go all the way back to the mansion to find out, you don''t have to force yourself—"'
3687: 'Shannon@r@v15/10500162."Ah, it''s alright.@k@v15/10500163. I can find out from the servant room in the guesthouse.@k@v15/10500164. ......Please excuse me for a short while."'
3688: '@rShannon-chan gave a quick bow and went into the guesthouse servant room.'
3689: '@rThe rest of us headed for the cousins'' room and put Maria in the bed for the time being.'
3690: '@rMaria was sleeping very deeply, and there was absolutely no sign of her eyes opening...'
3691: '@rWe got some drinks out of the room''s refrigerator, and spent some time playing cards while drinking...'
3692: 'Shannon@r@v15/10500165."......Oh?@k @v15/10500166.Kanon-kun?@k @v15/10500167.Even Genji-sama is here.@k@v15/10500168. ...What is happening with tonight''s shift...?"'
3693: 'Kanon@r@v16/10600081."............Krauss-sama has given an order.@k@v16/10600082. There have been modifications made to most of the schedule."'
3694: 'Genji@r@v14/11600074."......Indeed.@k@v14/11600075. Gohda has been changed to the night shift at the mansion.@k@v14/11600076. You and Kanon have the night shift in the guesthouse.@k@v14/11600077. Kumasawa-san and I have been ordered to spend the night in the guesthouse...@k@v14/11600078. We just now had a phone call stating that you are to remain here as well."'
3695: 'Shannon@r@v15/10500169."Huh...?@k @v15/10500170.Th-that''s quite a large modification...@k@v15/10500171. The shifts at the guesthouse and the mansion have been completely reversed, haven''t they...?"'
3696: '@rOriginally, Shannon and Kanon had been given the night shift in the mansion, while the night shift in the guesthouse, where all of the relatives were staying, had been assigned to Gohda, who had an abundance of experience in entertaining.'
3697: '@rKumasawa had been scheduled to stay in the guesthouse, while Genji had been scheduled to stay in the mansion.'
3698: '@rHowever, it seemed that Krauss had suddenly ordered that the schedule be modified.'
3699: '@r......The shifts at the guesthouse and the mansion had all been reversed, and Genji was spending the night in the guesthouse.'
3700: 'Kanon@r@v16/10600083."............It''s probably because of BEATRICE-sama''s letter."'
3701: 'Shannon@r@v15/10500172."Probably? ......Why?"'
3702: 'Kanon@r@v16/10600084.".........When such a mysterious letter appeared, it was only natural that Krauss-sama would suspect one of us.@k@v16/10600085. .........We serve directly under the Master, so Krauss-sama probably wanted to keep us as far away from the family conference as possible."'
3703: '@rGenji, Shannon, and Kanon were all permitted to wear the Ushiromiya family crest, the "One-winged Eagle", as the servants who served directly under Kinzo.'
3704: '@rOf course, since they were working for the Ushiromiya family, they had to obey anyone''s orders, but their only boss was Kinzo.'
3705: '@rSince only Kinzo held the right to employ them, even Krauss could not have them dismissed of his own accord.'
3706: '@rBecause of this, they were often viewed by Krauss and the others as Kinzo''s underlings, and shunned.'
3707: '@rAnd in reality, Kinzo would seldom let anyone other than them enter his study.'
3708: '@rYou could probably call this sudden shift change a clear expression of that sense of distrust.'
3709: '@rConsidering the time Kinzo had left to live, this would definitely be the last family conference before the problem of the inheritance would come up.'
3710: '@rOn top of that, the mysterious letter that claimed to be from BEATRICE had dropped in out of the blue.'
3711: '@rKrauss definitely wanted to keep Kinzo''s loyal subjects away from the table of such a delicate and important discussion...'
3712: 'Genji@r@v14/11600079."......If you would excuse me, I will go rest.@k@v14/11600080. ...If anything happens, call me immediately."'
3713: 'Genji@r@v14/11600081."Our company tonight is...special."'
3714: '@r@o75.@v15/10500173|16/10600086.""Yes, certainly, Genji-sama.""'
3715: '@rGenji nodded back, went behind a screen, took off his jacket, and slowly began to relax after a day''s worth of tension...'
3716: 'Kanon@r@v16/10600087.".........The ones who just returned now, were they the children...?"'
3717: 'Shannon@r@v15/10500174."Yes.@k@v15/10500175. The other relatives are having a conference in the mansion.@k@v15/10500176. It looked like it would drag on until much later..."'
3718: 'Kanon@r@v16/10600088."......That would be comfortable.@k@v16/10600089. It''s already this late, and there''s this weather.@k@v16/10600090. Probably, the rest of the relatives will spend the night in their rooms in the mansion."'
3719: 'Shannon@r@v15/10500177."Yes, probably...@k@v15/10500178. I''m only saying this because Genji-sama isn''t around, but...@v15/10500179....I''m a little happy I was sent to the guesthouse......I think..."'
3720: 'Kanon@r@v16/10600091."Oh...?@k @v16/10600092.Why''s that?@k @v16/10600093.Because you were able to distance yourself from the bullying of Madam and Eva-sama?@k @v16/10600094....Or do you have another reason?"'
3721: 'Shannon@r@v15/10500180."I, ......I don''t have any...@v15/10500181....o-other reasons...!"'
3722: 'Kanon@r@v16/10600095.".........I see.@k@v16/10600096. Then, let''s do our best together with our midnight shift.@k@v16/10600097. I''m counting on you, Nee-san."'
3723: 'Shannon@r@v15/10500182."Ah, ......umm.........@k@v15/10500183. Just now, I was asked to go to the children''s room and play with them..."'
3724: '@rShannon hung her head apologetically, ...and made uncertain glances toward Kanon''s eyes.'
3725: '@rKanon didn''t try to meet her gaze, and spoke curtly as he sighed.'
3726: '@rIt looked like he didn''t plan on indulging his "sister".'
3727: 'Kanon@r@v16/10600098."............You can''t.@k@v16/10600099. You were assigned the night shift.@k@v16/10600100. ...And besides that, it is not necessary for furniture like us to respond to an invitation to play.@k@v16/10600101. ...You understand, right?"'
3728: 'Shannon@r@v15/10500184."Y-...yes, I do understand.@k@v15/10500185. ..................nn."'
3729: '@rShannon dropped her shoulders slightly.'
3730: '@r...She had already expected that Kanon, who considered rules to be very important, would probably say something like that, but even so, she was a little discouraged.'
3731: '@rAs Kanon turned the pages of a logbook, he spoke without facing Shannon.'
3732: 'Kanon@r@v16/10600102."............In that case, you must be keeping the children waiting.@k@v16/10600103. You will have to apologize and tell them that you have the night shift and won''t be able to stay with them.@k@v16/10600104. ......Off you go, then."'
3733: 'Shannon@r@v15/10500186."Huh.........ah, yes!@k @v15/10500187.I''ll just go apologize..."'
3734: '@rShannon hurriedly stood from her seat before her brother''s mood could change, gave a quick bow, and flew out of the servant room...'
3735: '@rAs he watched her disappear, Kanon took a single deep breath...'
3736: '@rGenji''s voice came from beyond the screen.'
3737: 'Genji@r@v14/11600082."......Kanon.@k@v14/11600083. ......I will be here, so you should go too."'
3738: 'Kanon@r@v16/10600105."Genji-sama...@k@v16/10600106. ......Shannon was the only one called.@k@v16/10600107. It''s not like I was invited..."'
3739: 'Genji@r@v14/11600084."That is only because you were not there at the time.@k@v14/11600085. If you had been, you would have been invited as well.@k@v14/11600086. ......It is good to play as a child from time to time."'
3740: 'Kanon@r@v16/10600108.".......................................@k@v16/10600109. ......No, that''s not something that I need to do.@k@v16/10600110. ......A human child may have a need to play.@k@v16/10600111. ......But we......are furniture."'
3741: 'Genji@r@v14/11600087.".....................Is that so."'
3742: 'Kanon@r@v16/10600112.".........Nee-san is also...@v16/10600113.furniture.@k@v16/10600114. .........Even if she pretends to be a person,@v16/10600115. ...it will only hurt her later.@k@v16/10600116. ...I understand that, so I try not to get too close to people."'
3743: '@rGenji did not say anything after that.'
3744: '@r......A few moments passed, and then he stood up, used a pot of hot water to make some hot chocolate from powder, and served it to Kanon as well.'
3745: 'Battler@r@v10/10100705."Holy crap, seriously?!?!@k @v10/10100706.I did not know that...!!"'
3746: 'Jessica@r@v04/10200431."Keep it down, dumbass!@k @v04/10200432.You''ll wake Maria up!"'
3747: '@rBattler was so surprised that he yelled obnoxiously and scattered his cards everywhere.'
3748: '@rHis voice caused Maria to turn over once, but she soon fell back into a deep sleep...'
3749: '@rJessica gave him a jab, and he lowered his voice.'
3750: 'Battler@r@v10/10100707."No, but, yeah...now that you''ve said that...they really did have that kind of atmosphere, didn''t they...@k@v10/10100708. ......Haa, now I see, that George-aniki..."'
3751: '@rGeorge could not be seen anywhere in the room.@k@rA short while ago, when Shannon had come into the room, George had suddenly said that he had forgotten something in the mansion and needed to go back and get it.'
3752: '@rShannon had said she would guide him, just like she had on the way to the guesthouse, and the two of them had departed together.'
3753: 'Jessica@r@v04/10200433."......They''ve been showing signs of it for a long time, you know?@k @v04/10200434.Asking what the other person liked, asking what their hobbies were.@k@v04/10200435. I always knew it was too much to just be a passing interest!"'
3754: 'Battler@r@v10/10100709."Come to think of it, I get the feeling that George-aniki has always been overly nice to Shannon-chan......@k@v10/10100710. Nowww I get it..."'
3755: 'George@r@v07/10300383."According to the weather report, it looks like it will be at its worst tonight.@k@v07/10300384. It also seems that it won''t stop all tomorrow, but it should get a little better."'
3756: 'Shannon@r@v15/10500188."...Really?@k@v15/10500189. Then, the boat may not arrive until the day after tomorrow......@k@v15/10500190. ...I''m concerned that it might interfere with your work on Monday..."'
3757: 'George@r@v07/10300385."Hahaha, I already knew that the typhoon would be coming beforehand.@k@v07/10300386. Just in case, I made sure that I didn''t have any plans for Monday, so it''s alright.@k@v07/10300387. ...I may not look like it, but I really am the type who can plan ahead in his schedule."'
3758: '@rGeorge puffed out his chest, acting proud.'
3759: '@rCompared to the normally composed appearance that George always had as the oldest cousin, he now looked amusingly like a little kid.'
3760: '@rShannon chuckled at this gap.'
3761: 'Shannon@r@v15/10500191."It''s no surprise that someone who will soon make his company prosperous is so well prepared."'
3762: 'George@r@v07/10300388."...Well, making a company prosperous really is a tough job.@k@v07/10300389. Money isn''t the only thing that''s important.@k@v07/10300390. I learned that well by studying from my father.@k@v07/10300391. Making a company prosperous is like having a castle and leading your subordinates."'
3763: 'George@r@v07/10300392."My father, true to his name of Hideyoshi, really loves reading about the great leaders of the Sengoku period.@k@v07/10300393. Most of his philosophical speeches on business management start with one of them.@k@v07/10300394. ...Did you know?@k @v07/10300395.Takeda Shingen, who was feared as the leader of the strongest cavalry corps in the Sengoku period, started out with his troops in complete disarray, and didn''t have the kind of strong leadership necessary to utilize them well."'
3764: 'Shannon@r@v15/10500192."Is that true?@k @v15/10500193.That''s a little unexpected."'
3765: 'George@r@v07/10300396."In order to unite his troops, Shingen utilized several strategies.@k@v07/10300397. For example, when a soldier succeeded well in battle, he would immediately honor them with a medal.@k@v07/10300398. Normally, that kind of thing was put off until after the war and they were all awarded at once."'
3766: 'George@r@v07/10300399."By doing that regularly on the field of battle,@k@v07/10300400. he immediately showed his appreciation for his troops'' military exploits, which motivated them in an extremely significant fashion.@k@v07/10300401. Furthermore, whenever one of his troops was brought down by an illness, he would be the first to rush up to them and care for them, things like that."'
3767: 'George@r@v07/10300402."...Takeda Shingen wasn''t just the man who led the strongest calvary corps in the Sengoku period.@k@v07/10300403. He was the person who cared the most for his troops throughout the Sengoku period."'
3768: 'Shannon@r@v15/10500194."......That must be why all of his troops followed him."'
3769: '@rThe truth was, Shannon had already heard this story several years ago.@k@r...But when George started to tie his father in with one of these stories, he would always be beaming, looking like he was having a great time.'
3770: '@rSo Shannon did not interrupt, but merely smiled, to encourage him to continue.'
3771: 'George@r@v07/10300404."Of course, in a capitalist world, money is power, and it is also the height of your castle wall.@k@v07/10300405. But you can''t build up a castle or succeed in war by yourself.@k@v07/10300406. That kind of thing can only be created with the support of many subordinates, by borrowing their strength."'
3772: 'George@r@v07/10300407."......After understanding this, when I look at my father''s back, I realize how immature I am,@k@v07/10300408. I see how much my father has cultivated his character by working hard, and understand well how he was able to build up all that he has until today."'
3773: 'Shannon@r@v15/10500195."George-sama, you truly look up to your father...@k@v15/10500196. I''m jealous."'
3774: 'George@r@v07/10300409."A-ah, sorry...that''s not exactly the way I meant to say it."'
3775: 'Shannon@r@v15/10500197."I, I am sorry... I also didn''t mean it that way......"'
3776: '@rThe two of them awkwardly looked at their feet.'
3777: '@rShannon had no parents.@k@rShe had been brought up in a welfare institute owned by Kinzo called the Gospel House.'
3778: '@rUnder the guidance of the honorary director, Kinzo, the Gospel House offered excellent students a chance to live a life of service.'
3779: '@rIf they were accepted, they would be able to leave the institute and work as servants for the Ushiromiya family.'
3780: '@r...This was considered to be the highest honor for a student.'
3781: '@rServants from the Gospel (@bfukuin.@<福音@>) House all took names with the character "@bon.@<音@>" in them while they served.'
3782: '@rSo "Shannon" (紗音) wasn''t her real name.@k@rThe same goes for "Kanon" (嘉音).'
3783: '@rAll of the students of the Gospel House were orphans.@k@rOr, failing that, people who had been disowned by their parents through some special circumstances.'
3784: '@r......Because of this, the students had been taught to think of each other as their only family.'
3785: '@rThat''s why it seemed so natural to Kanon to call Shannon his sister.'
3786: '@rAnd while only Shannon and Kanon were working today in the mansion,@k there were other servants who worked in the shift rotation, named Manon (眞音) and Lenon (恋音), who also inherited the "音" character in their names.'
3787: '@r...However, there were not many servants who stayed with the Ushiromiya family for long.'
3788: '@rIt was standard for them to quit after three years.'
3789: '@rSo you could probably say that Shannon, who had been working for over ten years, was a very rare exception to the rule.'
3790: '@rWorking as a servant for the Ushiromiya family was a heavy burden to bear, but the pay wasn''t bad at all.'
3791: '@rWorking for a full three years would earn more than what was needed to enter mainstream society.'
3792: '@rThat was why, even though the students realized what a harsh task working for the Ushiromiya family was, they still hoped to be accepted.'
3793: '@rBut in Shannon''s case, maybe the fact that she had managed to continue for more than ten years should not be viewed as her having more willpower than any of the other servants.'
3794: '@rMaybe it was a lack of courage to say that she wanted to quit, that forced her to continue working for those ten years.'
3795: '@rTo Kinzo, who could not even trust his own blood relatives, those "excellent" servants sent from the Gospel House were the only ones he could trust.'
3796: '@rBecause of that, Kinzo would sometimes allow them to wear the family crest as servants under his direct control, and have them work close to him...'
3797: 'George@r@v07/10300410."......Err, ......um, you''ve already been working here about ten years, was it?@k @v07/10300411.You must have saved up a lot of money by now, right?"'
3798: 'Shannon@r@v15/10500198."I don''t know, really...@k@v15/10500199. It''s not like there''s anything in particular I''d like to buy...@k@v15/10500200. And just because you have a few million yen doesn''t mean you have enough to live the rest of your life with..."'
3799: 'George@r@v07/10300412."So you haven''t been working here trying to reach a target sum?"'
3800: 'Shannon@r@v15/10500201.".........N-...no, I haven''t.@k@v15/10500202. ......I have nowhere to go outside of this mansion.@k@v15/10500203. ......I have been getting along well with Milady and the other young servants, too...@k@v15/10500204. ......I am sometimes scolded by Madam, but, ......caring for the rose garden and cleaning the mansion is fun..."'
3801: 'George@r@v07/10300413."But that isn''t your life,@v07/10300414. ......Sayo (紗代)-chan."'
3802: 'Shannon@r@v15/10500205.".........Umm..."'
3803: '@rShannon cast her eyes downwards when she heard her real name...@k@rShe understood what George was trying to say and closed her mouth.'
3804: 'George@r@v07/10300415."Even after becoming an adult and a full-fledged member of society, I''ve been studying and I''ve learned something.@k@v07/10300416. ......A human''s life is not as monotonous or as short as we thought when we were kids."'
3805: '@rThat horrifying thought that everyone has in their student years.'
3806: '@r......Will the rest of my life be like a monotonous, boring, sleep-inducing after-school class,@k where I endlessly, lazily while away the time, until finally, it ends, without anything interesting ever happening...'
3807: '@rHowever, these thoughts only arise while a person is still an underage student.'
3808: '@rCompared to a human''s life, the time they spend as a student is nothing more than a blink of the eye—just the period before they break out of their shells, and cast off their immaturity.'
3809: '@rThe inside of the shell might be a hot, suffocating and boring world,@k but the world beyond that shell is vast and filled with limitless possibilities.'
3810: 'George@r@v07/10300417."So far, your life has been spent only within a shell called Shannon.@k@v07/10300418. Aren''t you making the mistake of thinking that your life will always continue like this?"'
3811: 'Shannon@r@v15/10500206."That is...... ...@k@v15/10500207. ....................."'
3812: '@rShannon couldn''t deny those words.'
3813: '@r...She hadn''t been able to find any concrete issues with her way of life,@k and since she''d never had any desire or goal to change herself in any particular way, she had continued her life idly.'
3814: '@r...And if she were asked whether her life was already fulfilled,@k ...she wouldn''t necessarily have been able to nod......'
3815: '@rThat may have been a truth she was deliberately averting her eyes from.'
3816: '@r...As long as George did not realize that truth, she would have continued pretending not to notice, as her real life slipped away, neglected, bit by bit...'
3817: 'Shannon@r@v15/10500208."......George-sama.@k@v15/10500209. ............Is it wrong for me to...@v15/10500210.......continue...living this way?"'
3818: 'George@r@v07/10300419."It''s wrong.@k@|@y@v07/10300420. Ah, and by the way, didn''t you break one of the rules just now?"'
3819: '@rGeorge immediately gave a strict answer, and then broke out into a mischievous smile.'
3820: '@rShannon already knew what she was being chided for, ...and it seemed that it embarrassed her, as she hung her head.'
3821: 'George@r@v07/10300421."Didn''t you promise not to use "sama" when the two of us are alone...?"'
3822: 'Shannon@r@v15/10500211.".........I, ......I can''t obey that as a promise.@k@v15/10500212. .........But, if it was an order, I would have to obey it...@k@v15/10500213. Because I''m............furniture."'
3823: 'George@r@v07/10300422."Then it''s an order."'
3824: 'Shannon@r@v15/10500214."Err,@v15/10500215. ...............yes.@k@v15/10500216. ......Certainly,@v15/10500217. ...George-san."'
3825: '@rAs Shannon hung her head, her face red, she said George''s name again, this time using "san"...'
3826: 'George@r@v07/10300423."Yes, that''s better, Sayo-chan."'
3827: '@rA smile rose to George''s face praising Shannon''s, no, Sayo''s small act of bravery.'
3828: '@rThe way they talked with each other gave off the sense that their relationship had already been ongoing for some time...'
3829: '@rFor a long while, as if the weather raging around them didn''t even enter their consciousness,@k the two of them talked about the many memories they''d built during their relationship that no one else knew about.'
3830: '@rEvery once in a while, a flash of lightning would attempt to dampen the mood, but it could not sully these moments, which seemed to flush even the roses outside a deeper shade of red...'
3831: 'George@r@v07/10300424."...............Oh, ...oh yes.@k@v07/10300425. ...I have...something I wanted to show you."'
3832: 'Shannon@r@v15/10500218."......Wh-......what could it be?"'
3833: '@rGeorge, who had been speaking eloquently, suddenly started to stutter.@k@rFrom his manner, Shannon too understood something.'
3834: '@rGeorge timidly searched through his pocket for it.@k@rIt got caught deep in his pocket somehow, and came out somewhat slowly and awkwardly, in the same manner as his speech.'
3835: '@rIt was a very small box.@k A small box covered in a deep blue velvet.'
3836: '@r...Its characteristic shape was enough to make anyone realize what was resting inside.'
3837: '@rShannon had been preparing her heart a little, sure of what it must be.'
3838: '@rBut even so, when she actually saw it, she couldn''t avoid blushing once more...'
3839: '@rGeorge opened the small box, took it out...and held it out for Shannon to take.'
3840: 'George@r@v07/10300426."I want you to accept this."'
3841: 'Shannon@r@v15/10500219."I, .........I can''t accept something so valuable...!"'
3842: 'George@r@v07/10300427."......You can''t accept it...?"'
3843: 'Shannon@r@v15/10500220."Tha-...that''s not...@v15/10500221. I meant...@v15/10500222. .........Something like that...@v15/10500223....is too...@v15/10500224.......goo-good...for me........."'
3844: 'George@r@v07/10300428."Sayo.@k@v07/10300429. This is not a request.@k@|@y@v07/10300430. ......It''s an order, okay?@k @v07/10300431.Accept this ring.@k@v07/10300432. ...Okay?"'
3845: 'Shannon@r@v15/10500225."Ha......u...@k@v15/10500226. I, ......I can''t...@v15/10500227.......disobey an order..."'
3846: 'George@r@v07/10300433."Yes, that''s right.@k@v07/10300434. ...Good girl."'
3847: '@rShannon, not wanting to show her bright red face, timidly accepted the ring from George''s hand while still staring at the ground...'
3848: '@rThat ring wasn''t a simple accessory.'
3849: '@r......It was a noble object, which since ancient times was meant to be offered to a special woman, with a special meaning.'
3850: '@r...So, while George could order her to take it, he could not order anything beyond that.'
3851: '@rAnything beyond that would depend, not on an order, but on Shannon''s, no, Sayo''s own will.'
3852: 'George@r@v07/10300435."So, from here on it''s no longer an order.@k@v07/10300436. .........Sayo.@k@v07/10300437. I want you to answer me tomorrow, without using words.@k@|@y@v07/10300438. ...............Do you understand?"'
3853: 'Shannon@r@v15/10500228."...Err, ............h-...how........."'
3854: 'George@r@v07/10300439."I won''t order you any more, so this isn''t an order.@k@|@y@v07/10300440. ......But a ring is something you put on your finger.@k@v07/10300441. ......If you like it, you can just put it on any finger that you choose."'
3855: '@rShannon had only pretended not to know.@k@rShe had already understood what he wanted her to do.@k@r...But she was standing at a huge crossroads of her life...'
3856: 'George@r@v07/10300442."......Look how late it''s gotten.@k@v07/10300443. Let''s call it a night."'
3857: '@rGeorge faced away from Shannon, seeming slightly uncomfortable.'
3858: 'George@r@v07/10300444."It might be possible for me to order you to put it onto a finger of your left hand.@k@v07/10300445. You, too, might be timid and dependent enough to actually obey that kind of an order.@k@v07/10300446. ......But I want you to do this very last part of your own will, ...Sayo.@k@v07/10300447. ...You understand, right?"'
3859: 'Shannon@r@v15/10500229."............Y-@v15/10500230..........yes."'
3860: 'George@r@v07/10300448."So, ...that''s my order.@k@v07/10300449. .........I want you to think about it well tonight and show me your answer tomorrow."'
3861: 'Shannon@r@v15/10500231."....................."'
3862: '@rShannon nodded back.'
3863: '@r......Today was the culmination of their long relationship.@k@r...This moment had not come as any surprise to Shannon...'
3864: 'George@r@v07/10300450.".........We should be getting back to the guesthouse soon.@k@v07/10300451. If we take any longer, we''ll make everyone worry about us."'
3865: 'Shannon@r@v15/10500232."......Ah,@v15/10500233. ......err...@v15/10500234. ...I''m sorry, I...!@k @v15/10500235.Um, I just remembered something I had to do in the mansion, so,@v15/10500236. ...um,@v15/10500237. ......I have to go back to the mansion..."'
3866: 'George@r@v07/10300452."Something this late?@k @v07/10300453..........Really?"'
3867: '@rGeorge stared into Shannon''s face as he laughed mischievously.@k@rHe had seen through that obvious lie of Shannon''s.'
3868: '@r......But, imagining how she felt, it wasn''t as if he couldn''t understand her embarrassment and why she might ask to be alone.'
3869: '@rAnd so George, having understood Shannon''s lie and all that was behind it, allowed her to leave.'