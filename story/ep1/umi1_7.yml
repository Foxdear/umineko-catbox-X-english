2810: '@rA news ticker popped up on top of the TV program we were watching.@k@rThe disaster report told how municipalities all over were continually sending out rain, flood, and wave warnings.'
2811: '@rOf course, the harshly beating raindrops on the window were much more convincing.'
2812: 'Battler@r@v10/10100551."......This rain''s incredible.@k@v10/10100552. Still, when it''s raining this hard, it feels like it''s going to stop soon."'
2813: 'Jessica@r@v04/10200315."You wish!@k@v04/10200316. They said the typhoon''s moving slow, so it could be like this all day tomorrow.@k @v04/10200317.And even a little weather''d be enough to stop the boats."'
2814: 'George@r@v07/10300316."It looks like we won''t be able to head out on Sunday after all.@k@v07/10300317. ...I''m glad I was cautious and didn''t make any appointments for Monday with the outside world."'
2815: 'Battler@r@v10/10100553."I guess this means...ihihi...it looks like we''ll be skipping school Monday~.@k@v10/10100554. Living on an island''s starting to look pretty good!@k @v10/10100555.......Come to think of it, Jessica, you have to take a boat to school every day, right?@k @v10/10100556.What do you do when the boats are closed down?@k @v10/10100557.Do you stay home when it rains and show up late when the wind''s blowing, like King Kamehameha?"'
2816: 'Jessica@r@v04/10200318."If the boats don''t come, I stay home.@k@v04/10200319. Still, it''s not as good as it sounds.@k@v04/10200320. Most of the time, I get ordered to do private study, and they''re super anal about checking it, so it''s not like I can take it easy."'
2817: 'Battler@r@v10/10100558."During the rainy season, when the weather stays bad for a long time,@k@v10/10100559. you must be forced to miss a bunch of days in a row?"'
2818: 'Jessica@r@v04/10200321."Yep, that happens.@k @v04/10200322.But then, every single day, I''ll get a call from my homeroom teacher, sourly instructing me on what to study and what to turn in."'
2819: 'George@r@v07/10300318."She can''t slack off as easily as you''re thinking, Battler-kun.@k@v07/10300319. She has to follow the rules for people that travel to school by boat and get a good amount of studying done."'
2820: 'Jessica@r@v04/10200323."It''d actually be easier to just go to school.@k @v04/10200324.In my own room, I get distracted and can''t concentrate.@k@v04/10200325. Plus, being made to do nothing but workbooks for several days straight is really mentally stressful."'
2821: 'Jessica@r@v04/10200326."......When I''m ready for college, I really just wanna go some place with dorms and say goodbye and good riddance to this pain-in-the-ass island."'
2822: 'Battler@r@v10/10100560."Huh...@k@v10/10100561. So, by the way, what do you do when the weather''s good in the morning, but then gets so bad on your way home that the boats are closed?@k @v10/10100562.Do you spend the night at school?"'
2823: 'Jessica@r@v04/10200327."That actually happens a lot.@k@v04/10200328. So they have some lodgings there for people who can''t get back to the island.@k@v04/10200329. I stay over there.@k@v04/10200330. Sometimes, when it gets really bad, I can''t get back home for a few days at a time."'
2824: 'George@r@v07/10300320."If you look at it from the perspective of those people who have to go to school every day on a train packed to over 200% capacity,@k@v07/10300321. it''s easy to irresponsibly think that going to school on a boat seems pretty interesting and fun.@k@v07/10300322. But it''s actually hard work in a lot of ways."'
2825: 'Jessica@r@v04/10200331."Inconsiderate tourists say that kind of thing all the time.@k@v04/10200332. I''ve had enough of island life.@k@v04/10200333. I want to finish high school quick and leave this island behind."'
2826: 'Battler@r@v10/10100563."There must''ve been a full boarding school you could''ve gone to.@k@v10/10100564. Why''d you go and choose the school on Niijima?"'
2827: 'Jessica@r@v04/10200334."That''s what I wanted from the very beginning!!@k @v04/10200335.It''s Mom, she''s always going on about how I need to learn manners and discipline as the successor to the head."'
2828: 'Jessica@r@v04/10200336."...In the end, I got stuck with a high school close to home.@k@|@y@v04/10200337. Man, I hate this island.@k@v04/10200338. I just want to go live in a city.@k@v04/10200339. A city where it doesn''t matter if rain or even spears fall from the sky, ''cause as long as you stick some casual clothes and sandals on,@k@v04/10200340. you can still get to a shop in less than five minutes..."'
2829: 'George@r@v07/10300323."Hahahaha.@k@v07/10300324. Hold out just a bit more.@k@v07/10300325. It''s only a little longer until you graduate high school, right?"'
2830: 'Jessica@r@v04/10200341."I can''t wait a little longer.@k@v04/10200342. Aaaaaah..."'
2831: '@rJessica stretched out and reclined on the sofa.'
2832: '@rMaybe because now was a bad time slot, there weren''t any interesting programs on,@k and we had nothing to do but languidly kill time until we were called for dinner.'
2833: '@rIn the end, Maria had not returned to the cousins'' room.'
2834: '@rShe had probably been brought back to the mansion by Auntie Rosa.'
2835: '@rIt had to be pretty boring for Maria, all by herself while the adults are having a confusing conversation.'
2836: '@r......We thought we might head over to the mansion to see her, but after all, there was this lousy weather,@k and there wasn''t much time until dinner, so we stayed where we were.'
2837: '@rAt that time, we heard the sound of a humble knock.@k@rJessica answered.'
2838: 'Jessica@r@v04/10200343."Hello~!"'
2839: 'Kanon@r@v16/10600056.".........The preparations for dinner are complete.@k@v16/10600057. Please come to the mansion."'
2840: '@rIt was Kanon-kun''s voice.@k He went to all the trouble of coming from the mansion in this rain just to call us over?'
2841: '@rCouldn''t he have just called us on the telephone?@k@r......Oh well, maybe sometimes part of a servant''s duty is to go against common sense.'
2842: 'George@r@v07/10300326."Just when I was getting hungry.@k@v07/10300327. Let''s go."'
2843: '@rGeorge-aniki turned off the television and stood up.'
2844: 'Battler@r@v10/10100565."My stomach''s been growling for a~ges!@k @v10/10100566.Main family dinners were always fancy as hell, every time!@k @v10/10100567.And didn''t Gohda-san say it was calf steak or something?@k @v10/10100568.Oohh, I can''t wai~t!!"'
2845: 'Jessica@r@v04/10200344."They get even more fabulous on the day of the family conference.@k@v04/10200345. Even I''m looking forward to it!@k @v04/10200346.Let''s go, let''s go."'
2846: '@rAs we left the room, Kanon-kun bowed silently and respectfully.'
2847: 'Jessica@r@v04/10200347."Alright, let''s go.@k@v04/10200348. Is the rain nasty out there?"'
2848: 'Kanon@r@v16/10600058."......Yes.@k@v16/10600059. Please take care not to get your garments wet."'
2849: '@rAfter seeing the three of us out, Kanon-kun peered into the empty room.'
2850: 'Kanon@r@v16/10600060.".........Is Maria-sama not with you...?"'
2851: 'Jessica@r@v04/10200349."Nope?@k @v04/10200350.Isn''t she with Auntie Rosa?"'
2852: '@rRosa, lying on a sofa in the empty parlor, had fallen asleep at some point.'
2853: '@r...She was bearing a burden on her shoulders that the children could never even imagine.'
2854: '@rTherefore, when she let herself relax, that exhaustion quickly led her into the world of sleep.'
2855: '@rRealizing this, Genji brought a blanket over to her.@k@rWhen he tried to spread it over her, her eyes snapped open as though she had received an electric shock.'
2856: 'Rosa@r@v12/11400157."..................ah...!@v12/11400158..........@k@|@y@v12/11400159. ......Oh, it''s you, Genji-san......thank you."'
2857: '@rWhen she realized that the thing that had touched her was just a blanket, and that Genji had been considerately giving it to her, she let out a sigh of relief.'
2858: 'Genji@r@v14/11600051."......Did I wake you?@k@v14/11600052. My sincere apologies."'
2859: 'Rosa@r@v12/11400160."No, it''s okay.@k@v12/11400161. I hadn''t planned on sleeping in the first place.@k@v12/11400162. ...What time is it now?"'
2860: '@rAsked for the time, Genji checked a pocket watch that he took out of his chest pocket.'
2861: 'Genji@r@v14/11600053.".........It is slightly after six o''clock."'
2862: '@rRosa gave her head a little shake as she realized that, even though it had felt like she had slept for a long time, not much time had actually passed.'
2863: '@r...Even though she didn''t feel rested at all, the drowsiness that wrapped around her felt very deep.'
2864: 'Rosa@r@v12/11400163."Thank you, I''ll be fine without the blanket...@k@v12/11400164. I mustn''t sleep at such a strange time.@k@v12/11400165. My sense of time has been completely thrown off.@k@v12/11400166. ..................The rain...@v12/11400167.has finally come down, I see."'
2865: '@rRosa finally realized that the peaceful sound that had put her to sleep was actually the rain that had started falling.'
2866: 'Rosa@r@v12/11400168."The wind is blowing hard, too.@k@v12/11400169. ...Perhaps the typhoon is finally upon us?"'
2867: 'Genji@r@v14/11600054."......That is what they are saying on television.@k@v14/11600055. The typhoon is moving slowly, and they expect it to be like this all throughout tomorrow."'
2868: 'Rosa@r@v12/11400170."I see...@k@v12/11400171. .........That wonderful rose garden, that must have been my last chance to see it."'
2869: '@rFrom the window, what she could see of the rose garden was completely blurred by the wind and the rain.'
2870: 'Rosa@r@v12/11400172."...Maria...@k@v12/11400173. ......That''s right, where''s Maria?!"'
2871: 'Genji@r@v14/11600056."............I have not seen her.@k@v14/11600057. I would think she has returned to the guesthouse."'
2872: '@rRosa knew her daughter''s nature well.@k@rAnd a chill ran up her back.'
2873: '@rMaria was stupidly straightforward, to the point that "stupidly" could be repeated seven times,@k ......and if she was ordered to find something that didn''t exist, she would look forever and ever.'
2874: '@r......Even if rain was pouring down...!!'
2875: 'Rosa@r@v12/11400174."......No.@k@v12/11400175. The cousins left earlier, so Maria was alone...!@k @v12/11400176.Unless someone told her to stop, she would stay there even if spears fell down from the skies!@k @v12/11400177.Without even opening an umbrella!!@k @v12/11400178..........Aaaah, what have I done, losing control of my emotions!!"'
2876: '@rAs her mother, she had known about Maria''s foolish straightforwardness better than anyone, yet she had once again lost control of her emotions, and done such a horrible thing...!!'
2877: 'Rosa@r@v12/11400179."Mariaaaaaaa!!"@|@y'
2878: '@rRosa pushed Genji away and ran down the hallway.'
2879: '@rThe outside really looked like a typhoon, and was pouring down magnificently.'
2880: '@rMaybe because of some figure of the terrain, the winds were not as strong as a typhoon, so an umbrella wouldn''t be torn out of one''s hands.'
2881: '@rEven so, it was enough to call it a storm.@k@rThere was no time to admire the roses being soaked by the rain.'
2882: 'Battler@r@v10/10100569."Anyway, I''m getting pretty worried about Maria.@k@v10/10100570. .........You don''t think she''s still rebelliously searching for that rose alone, do you?"'
2883: 'George@r@v07/10300328."...I wonder.@k@v07/10300329. Surely not with this much rain...@v07/10300330....is what I''d like to think, but Maria-chan is sometimes really stubborn and foolishly simple."'
2884: '@rWe hadn''t worried much, thinking that Auntie Rosa had taken her back to the mansion.'
2885: '@r...However, it was concerning that Kanon-kun had thought that Maria was here when he came from the mansion to call us.'
2886: 'Kanon@r@v16/10600061.".........I did not see her in the mansion, so I had assumed that she was here.@k@v16/10600062. Since Rosa-sama was taking a nap..."'
2887: 'Jessica@r@v04/10200351."You didn''t see her on your way over here?"'
2888: 'Kanon@r@v16/10600063.".........My apologies.@k@v16/10600064. I opened my umbrella and ran as fast as I could, so I did not pay much attention."'
2889: '@rIf he had cut through the rose garden on the shortest line between the mansion and the guesthouse, then he would have missed the place where Maria had been looking for her rose by a little.'
2890: '@rAnd it was raining this hard, too.@k@rThere was a good chance that Kanon-kun had failed to notice her.'
2891: 'Battler@r@v10/10100571."Enough debating around here, it''d be faster to just check it out directly.@k@|@y@v10/10100572. ......Aniki, you up for a little race?"'
2892: 'George@r@v07/10300331."So you think that you can beat me now that you''ve had six years to grow?@k @v07/10300332.Alright, let''s find out.@k@|@y@v07/10300333. ............Let''s go!!"'
2893: '@rGeorge-aniki and I flew out into the rain.@k@rJessica and Kanon-kun followed us.'
2894: 'Rosa@r@v12/11400180."Mariaaaa!!@k @v12/11400181.If you''re there, answer me!!@k @v12/11400182.Mariaaaaa!!"'
2895: 'George@r@v07/10300334."It''s Auntie Rosa.@k@v07/10300335. Auntie!!"'
2896: '@rWhen George-aniki called back, Auntie Rosa flew at him in what almost amounted to a tackle.'
2897: 'Rosa@r@v12/11400183."Where''s Maria?!@k @v12/11400184.Isn''t she with you?!"'
2898: 'George@r@v07/10300336."No, we haven''t seen Maria-chan since then."'
2899: 'Rosa@r@v12/11400185."............Mariaaaaa!!!"@|@y'
2900: '@r............Six years ago, Maria had been three years old.@k@rShe had been a cute and pure kid who would just accept whatever anyone said.'
2901: '@r...But six years had passed since then!@k@rShe was nine now, and experiencing the good and bad parts of life should have taught her something.'
2902: '@r......And yet, she''s still just as innocent and pure as she used to be...?!'
2903: 'Battler@r@v10/10100573."Mariaaaaaaaaaaaa!!!"'
2904: '@rAs I circled the rose bed, something white unexpectedly turned to face me.'
2905: '@r......It was a white umbrella.'
2906: '@rMaria, holding a white umbrella, was crouching, still searching for that rose...'
2907: 'Maria@r@v13/10400420."............Uu."'
2908: '@rHer face, which had turned bright red from her crying her eyes out, was dirtied with water and mud. It was a truly pitiful sight.'
2909: 'Battler@r@v10/10100574."You idiot,@v10/10100575. ......are you still looking?!"'
2910: 'Maria@r@v13/10400421."......Uu......@k@v13/10400422. Can''t find it...@k@v13/10400423. My rose...@v13/10400424. ...Can''t find it......@k@v13/10400425. ...Uu......"'
2911: '@rMaria had probably been here since the rain had started pouring down.@k@rIt looked like her shoulders were freezing.'
2912: '@rShe looked tired to the bone, but fortunately, since she was holding an umbrella, she was not completely soaked.'
2913: '@r...It was probably an umbrella from the handbag that Maria was always walking around with.'
2914: '@r.........Thank goodness.@k Seriously, thank goodness.'
2915: 'George@r@v07/10300337."Battler-kun!@k @v07/10300338.Thank goodness, you found her!"'
2916: 'Rosa@r@v12/11400186."Mariaaaaaaaaa!!@|@y@k @v12/11400187.I''m sorry, I''m so sorry...!!"'
2917: '@rAuntie Rosa threw her own umbrella away and hugged Maria.'
2918: 'Maria@r@v13/10400426."......Uu.........@k@v13/10400427. It''s not here.@k@v13/10400428. ...My rose isn''t here...@k@v13/10400429. ......Uu......"'
2919: 'Rosa@r@v12/11400188."Mama will look for it with you later...@k@v12/11400189. Okay?@k @v12/11400190.So just let it go for today.@k@v12/11400191. ......Okay?"'
2920: 'Maria@r@v13/10400430."............Uu...@k@v13/10400431. Let it go for today........."'
2921: '@rIt looked like Maria still wasn''t able to accept it, but she no longer had enough energy left to resist.'
2922: '@rJessica and Kanon-kun caught up with us.'
2923: 'Kanon@r@v16/10600065."......I''ll have a towel ready in the mansion immediately."'
2924: 'Jessica@r@v04/10200352."Maria......@k@v04/10200353. Were you here the whole time......?"'
2925: 'Rosa@r@v12/11400192."I''m sorry......@k@v12/11400193. I''m sorry for being such a bad mother........."'
2926: 'George@r@v07/10300339."......Auntie Rosa, why don''t we head back to the mansion for the time being.@k@v07/10300340. Maria-chan will catch a cold like this."'
2927: 'Rosa@r@v12/11400194.".........You''re right.@k@v12/11400195. Maria, let''s go.@k@v12/11400196. If we don''t get you cleaned up, Grandfather will get mad at you."'
2928: 'Maria@r@v13/10400432."Uu...@k@v13/10400433. I''m hungry."'
2929: 'Jessica@r@v04/10200354."It''s already time to eat.@k@v04/10200355. You did a good job searching.@k@v04/10200356. Once the weather gets better, we''ll all go search together."'
2930: '@rWe couldn''t stay in the rain forever.@k@rWe took Maria with us as we headed back to the mansion.'
2931: '@rMaria apparently wasn''t as weak as I had thought.'
2932: '@rWhen she remembered that dinner was calf steak, she started chanting "I''m hungry, hungry, uu-uu!", and returned to her usual healthy self.'
2933: '@r......Auntie Rosa didn''t chide Maria on her "uu-uu".'
2934: 'Jessica@r@v04/10200357."So that''s it.@k@v04/10200358. You had an umbrella.@k@v04/10200359. You sure are good at packing the right stuff."'
2935: 'Maria@r@v13/10400434."......Uu.@k@v13/10400435. I didn''t bring an umbrella.@k@v13/10400436. Uu."'
2936: 'Battler@r@v10/10100576."What? Then how did you get that white umbrella you''re holding?"'
2937: 'Maria@r@v13/10400437."Uu!@k @v13/10400438.Borrowed it!"'
2938: '@rIt seemed that some caring person had brought her an umbrella.@k@rA normal girl would look for shelter once it started raining, but there was no way Maria''s stubbornness would be broken by something like that.'
2939: '@r...So maybe that person gave up recommending that she find shelter, and at least brought an umbrella for her.'
2940: 'Rosa@r@v12/11400197."Really?@k@v12/11400198. I will have to thank them.@k@v12/11400199. Who was it?"'
2941: 'Maria@r@v13/10400439."Uu!@k @|@y@v13/10400440.BEATRICE~!"'
2942: '@rThe name that Maria mentioned very happily was that of the island''s witch.'
2943: '@rRosa took a deep breath and asked again, trying to avoid hurting Maria''s feelings now that she was happy.'
2944: 'Rosa@r@v12/11400200."Really? That''s nice.@k@v12/11400201. So, who was it...?@k @v12/11400202.The person who brought you that umbrella?"'
2945: 'Maria@r@v13/10400441."Uu.@k@v13/10400442. BEA - @v13/10400443.TRICE~!@k @v13/10400444.Uu-uu!"'
2946: '@rMaria, who quickly picked up that her mother didn''t believe her, made an angry face once again.'
2947: '@rSo Rosa stopped pursuing the subject.@k@rIt looked like it would be faster to ask the person who had lent Maria the umbrella during dinner rather than ask Maria herself...'
2948: 'Krauss@r@v02/10800270."Father.@k@v02/10800271. Please at least join us for dinner.@k@v02/10800272. It won''t be a family conference like this."'
2949: '@rAlong with a dull pounding on the door, the sound of Krauss''s entreaty could be heard.'
2950: '@rHowever, that voice seemed to harbor a sense of resignation, that its sound would not reach its intended ears.'
2951: 'Nanjo@r@v19/11900087.".........Kinzo-san.@k@v19/11900088. Won''t you at least go out for dinner?@k@v19/11900089. Haven''t all of your children gathered here to see your face?"'
2952: 'Kinzo@r@v01/11500290."Silence, Nanjo.@k@v01/11500291. ............So the bishop won''t work.@k@v01/11500292. ..................One move short......"'
2953: '@rApparently, Kinzo was completely focused on the final battle of his long-lasting chess match with Nanjo.'
2954: '@rHis brow wrinkled, he continued to glare at the game board through his spectacles; Krauss''s voice didn''t reach his ears.'
2955: 'Nanjo@r@v19/11900090."............Kinzo-san.@k@v19/11900091. I am also hungry.@k@v19/11900092. Won''t you go down and eat?"'
2956: 'Kinzo@r@v01/11500293."In that case, you can go by yourself.@k@v01/11500294. Let me consider this next move for a little longer.@k@v01/11500295. ...We are going to finish it tonight."'
2957: 'Kinzo@r@v01/11500296."............Otherwise, it looks like this match will never in eternity be settled."'
2958: '@rNanjo stood from his seat, hoping this would prompt Kinzo to do the same, but Kinzo''s eyes never left the chessboard.'
2959: '@rHe knew well that Kinzo always displayed a blind concentration when it came to chess,@k but he had never seen Kinzo as focused as he was now.'
2960: '@r...He was acting almost as though - just as he had said - if the game wasn''t finished tonight, there would never be another chance for them to continue their contest...'
2961: '@rFurther attempts to persistently call him would surely not reach his heart.'
2962: '@rNanjo gave up and headed to the door that Krauss was still banging on...'
2963: '@rThe door to the study opened.'
2964: '@rKrauss took a step back - surely Kinzo hadn''t actually come out?!'
2965: '@rBut it was Nanjo who stood at the door; Krauss breathed a sigh of relief...'
2966: 'Krauss@r@v02/10800273."......Doctor Nanjo.@k@v02/10800274. Is Father..."'
2967: 'Nanjo@r@v19/11900093."...............I am sorry I couldn''t be of service...@k@v19/11900094. ...Kinzo-san''s world is nothing but this room now."'
2968: '@rNanjo shook his head with a completely defeated expression.@k@rKrauss raised his fist once more and banged on the door, shouting.'
2969: 'Krauss@r@v02/10800275_ON."......Father, can you hear me?!@k @v02/10800276_ON.We are heading down now, but any time you feel like it, please join us.@k@v02/10800277_ON. All of your children are waiting for you...!"'
2970: '@rThe voice was very loud, and the door was being noisily pounded on.@k@rThere was no way that it wouldn''t reach Kinzo''s ears.'
2971: '@r............It was reaching him.@k@rHowever, he was ignoring it anyway.'
2972: '@rHowever, unlike the time he was being called down for lunch, he did not get into a rage.@k@r......Kinzo was now simply calm at heart, ...and it was almost as though he had attained peace by turning himself over to fate.'
2973: 'Kinzo@r@v01/11500297."......I am not interested in dinner, nor in my sons'' faces.@k@v01/11500298. ............I will only leave here when BEATRICE is resurrected or when I am chosen as a sacrifice for the key...@k@v01/11500299. The Demons'' Roulette has already started spinning.@k@v01/11500300. What meaning does dinner have at this point........."'
2974: '@rAs though the painfully loud banging on the door had completely failed to enter his hearing,@k@rKinzo, in a state of total peace, silently thought about his next chess move...'
2975: '@rJust as always, Kinzo was the only one missing from the dining hall.@k@rKrauss, wearing a bitter smile, returned with Nanjo.'
2976: 'Krauss@r@v02/10800278."Just as always, Father is not feeling well.@k@v02/10800279. He truly regrets missing this once-a-year opportunity to sit together with his gathered relatives."'
2977: '@rEva and Rudolf snickered.'
2978: '@rJudging by Kinzo''s character, he didn''t regret it at all,@k ...and none of his relatives regretted that he hadn''t appeared either.'
2979: 'Krauss@r@v02/10800280."Then why don''t we start dinner.@k@v02/10800281. Gohda, get it started."'
2980: 'Gohda@r@v17/11700065."Certainly.@k@v17/11700066. Well then, ladies and gentlemen, we shall begin."'
2981: '@rUpon finally being told to begin the family conference dinner, his highlight scene for the whole year, Gohda nodded, grinning broadly.'
2982: 'Rosa@r@v12/11400203."......Umm, I was wondering, who was it that lent Maria an umbrella?"'
2983: '@rWhen Rosa timidly cut through the silence of the dining hall, everyone there turned their attention to her at once.'
2984: 'Eva@r@v05/11000280."...Umbrella?@k @v05/11000281.What''s this about?"'
2985: 'Rosa@r@v12/11400204."Umm......@k@v12/11400205. It started raining while Maria was in the rose garden a short while back...@k@v12/11400206. It seems she borrowed a white umbrella from someone, and I wanted to thank them..."'
2986: 'Rudolf@r@v08/11200252."It wasn''t one of us.@k@v08/11200253. After you went out, Rosa, we changed rooms and continued our "friendly" chat the whole rest of the time."'
2987: 'Hideyoshi@r@v06/11100182."Haha, ...that''s right.@k@v06/11100183. Even after that, us siblings kept on with our friendly chat."'
2988: '@rThe word "friendly" fell awkwardly from Hideyoshi''s lips,@k so that even those that hadn''t been there realized that it hadn''t been a pleasant conversation.'
2989: 'Krauss@r@v02/10800282."At the very least, it certainly couldn''t have been me, Eva, Rudolf, or even Hideyoshi-san or Kyrie-san."'
2990: 'Kyrie@r@v09/11300078."We were together the whole time, even after Natsuhi nee-san and Rosa-san left.@k@v09/11300079. The whole time until the meal started."'
2991: 'Eva@r@v05/11000282."Nii-san went up to the study with Genji-san to call Father.@k@v05/11000283. At that time, the rest of us went straight to the dining hall.@k@v05/11000284. So it wasn''t one of us.@k@v05/11000285. ...For a consideration like lending an umbrella, wouldn''t it be one of the servants?"'
2992: 'Rosa@r@v12/11400207."So, Gohda-san?"'
2993: 'Gohda@r@v17/11700067."......I have been in the kitchen the whole time preparing.@k@v17/11700068. My sincere apologies..."'
2994: '@rGohda looked slightly disappointed about missing this chance to show off.'
2995: '@rAt that time, Shannon and Kumasawa appeared, pushing a serving cart loaded with hors d''oeuvres.'
2996: 'Rosa@r@v12/11400208."Then perhaps it was Kumasawa-san or Shannon-chan?"'
2997: 'Shannon@r@v15/10500135."...I''m sorry?@k @v15/10500136.Ha-have I made some mistake...?"'
2998: '@rShannon shrunk, mistakenly thinking that she was being accused of making some error, having come in partway.'
2999: 'George@r@v07/10300341."No, you haven''t.@k@v07/10300342. When Maria-chan was alone in the rose garden, it started to rain.@k@v07/10300343. Someone gave her an umbrella.@k@v07/10300344. Auntie Rosa said that she wanted to thank that person."'
3000: 'Maria@r@v13/10400445."......Uu.@k@v13/10400446. ......BEATRICE..."'
3001: '@rMaria, her mouth a thin line, said the witch''s name in a small voice.'
3002: '@rAuntie Rosa explained the situation one more time.@k@rAs she did, Kumasawa-san cackled.'
3003: 'Kumasawa@r@v18/11800066."Hoh-hoh-ho.@k@v18/11800067. It wasn''t us.@k@v18/11800068. Shannon-san and I were preparing the rooms together, so we did not go outside."'
3004: 'Shannon@r@v15/10500137."...Yes.@k@v15/10500138. ......I apologize for not being able to help......"'
3005: 'Krauss@r@v02/10800283."Preparing the rooms?@k @v02/10800284.What do you mean by that...?"'
3006: 'Natsuhi@r@v03/10900090."..................Because of this rain,@v03/10900091. I thought that it would be difficult for all of the guests to return to the guesthouse,@k@v03/10900092. so I ordered the servants to prepare the guest rooms inside the mansion."'
3007: 'Eva@r@v05/11000286."...Reeally? How thoughtful!@k @v05/11000287.That''s right, it would be rude to chase us outside in all this rain, wouldn''t it?"'
3008: 'Hideyoshi@r@v06/11100184."Could you give it a rest..."'
3009: 'Shannon@r@v15/10500139."Yes.@k@v15/10500140. We received the order from Madam, and I, Kumasawa-san, and Kanon-kun were preparing the rooms.@k@v15/10500141. ...Then it became time for dinner, and since we had received an order from Genji-sama to go to the guesthouse and call the children,@k@v15/10500142. Kanon-kun left on our behalf."'
3010: 'Kumasawa@r@v18/11800069."Yes.@k@v18/11800070. In that case, did Kanon-san find Maria on the way to the guesthouse and hand her the umbrella?"'
3011: 'Maria@r@v13/10400447."......Uu.@k@v13/10400448. That''s - not - it!!"'
3012: '@rThe person who had actually received the umbrella denied it.@k@rRosa was troubled.'
3013: '@rAll she wanted to do was give a word of thanks to the person who had lent the umbrella, but she couldn''t find them.'
3014: '@rAnd she had thought that asking like this with everyone gathered for dinner would work immediately...'
3015: 'Rosa@r@v12/11400209."...Then, Natsuhi nee-san?"'
3016: 'Natsuhi@r@v03/10900093."I''m sorry.@k@v03/10900094. After my "friendly" conversation with everyone, my headache was so bad that I have been resting in my room.@k@v03/10900095. Therefore, I did not go outside."'
3017: 'Rosa@r@v12/11400210.".........Then who?@k @v12/11400211.George-kun and the kids?@k @v12/11400212.......That can''t be right."'
3018: 'George@r@v07/10300345."No, it wasn''t us.@k@v07/10300346. We were watching television in the guesthouse the whole time."'
3019: 'Jessica@r@v04/10200360."Actually, we thought that Maria had just gone back to the mansion with you..."'
3020: 'Battler@r@v10/10100577."Then Kanon-kun came, and he asked whether Maria was with us. That was when we first realized that she wasn''t in the mansion.@k@v10/10100578. In the first place, if it were me, before lending her an umbrella, I''d have grabbed her hand and pulled her under a roof."'
3021: '@rRosa was completely baffled.@k@rOne by one, the relatives and the servants were claiming that it wasn''t them.@k@r...Even though it really wasn''t something anyone would need to hide.'
3022: '@rWith that, by process of elimination, the number of people it could have been wasn''t large.'
3023: 'Nanjo@r@v19/11900095."Of course, it wasn''t me.@k@v19/11900096. Right after it began raining, I visited Kinzo-san''s room, and have been playing chess with him until just now."'
3024: 'Kyrie@r@v09/11300080."......Which means that it also wasn''t Grandfather."'
3025: 'Battler@r@v10/10100579."Wait a sec...@k@v10/10100580. Isn''t this starting to get a bit weird?@k @v10/10100581.Who''s left?"'
3026: 'Rosa@r@v12/11400213."Then, ...who?@k@v12/11400214. ...Genji-san?@k @v12/11400215.Huh?"'
3027: 'Rosa@r@v12/11400216."Um, wait a second, don''t get me wrong.@k @v12/11400217.It''s not like I''m searching for some culprit or anything.@k@v12/11400218. All I want to do is, as a mother, thank that person who gave Maria an umbrella in the middle of the rain......!"'
3028: '@r...Giving an umbrella to a girl loitering in the rain was something to be praised, not hidden.'
3029: '@r...Despite that, no one raised their hand.'
3030: '@r......Why?'
3031: '@rEveryone started whispering about how strange this had gotten...'
3032: 'Rudolf@r@v08/11200254."......Calm down, Rosa.@k@v08/11200255. Why don''t we just ask the person who borrowed the umbrella?"'
3033: '@rAn idea that everyone would agree makes sense.@k@rThey were all scratching their heads at why she didn''t just ask Maria, who had been given the umbrella.'
3034: '@rHowever, Rosa bit her lower lip.@k@rAfter all, she already knew how Maria would answer if asked.'
3035: 'Hideyoshi@r@v06/11100185."Of course!@k @v06/11100186.Rudolf-kun here''s got it right.@k@v06/11100187. Maria-chan, tell your uncle!@k @v06/11100188.Who lent you the umbrella?"'
3036: 'Maria@r@v13/10400449."BEATRICE!"'
3037: '@rThe dining hall was wrapped in silence for an instant, but that soon broke and it was wrapped in laughter.'
3038: 'Krauss@r@v02/10800285."Hahahaha.@k@v02/10800286. I see, BEATRICE, the witch of the forest, felt pity and lent her an umbrella.@k@v02/10800287. What a nice story.@k@v02/10800288. Rosa, there you go."'
3039: 'Rosa@r@v12/11400219."......nn...@v12/11400220..........nnnn."'
3040: '@rRosa didn''t seem satisfied.@k@r...She just wanted to say thanks for the umbrella; why did everything have to be so clouded in smoke...'
3041: 'Maria@r@v13/10400450."Uu!@k @v13/10400451.Just like Uncle Krauss said.@k@v13/10400452. BEATRICE lent it to me!@k @v13/10400453.Uu-uu!"'
3042: 'Krauss@r@v02/10800289."Hahahahaha...@k@v02/10800290. Isn''t that wonderful.@k@v02/10800291. Oh, innocence, such an enviable thing.@k@v02/10800292. Don''t you all agree?@k@v02/10800293. Hahahaha..."'
3043: '@rKrauss was laughing with a face that was clearly mocking her,@k but Maria, apparently feeling that her claim was being believed, was overjoyed.'
3044: 'Jessica@r@v04/10200361."......What''s going on?@k @v04/10200362.Don''t tell me a witch really appeared and lent her an umbrella?"'
3045: '@rJessica asked me in a small voice that wouldn''t carry over to Maria, who was sitting across from me.'
3046: 'Battler@r@v10/10100582."Has Maria ever been the type to joke?"'
3047: '@rIf we had heard that kind of story pop out of that old bastard''s mouth, we''d have just taken it as another joke.'
3048: '@r......However, coming from Maria''s mouth, it became somewhat inexplicable, strangely unsettling...'
3049: 'Jessica@r@v04/10200363."No way.@k@v04/10200364. She''s always been frank and serious.@k@v04/10200365. Hasn''t she always just swallowed up jokes that were supposed to be obvious lies?@k @v04/10200366.I''ve never even heard of her cracking a joke."'
3050: '@rAuntie Rosa probably knew that better than anyone.@k@rIt appeared that because of this weird situation, she had no idea what was going on anymore.'
3051: 'Battler@r@v10/10100583."So, if Maria says that she borrowed an umbrella from BEATRICE, that definitely was BEATRICE?"'
3052: 'Jessica@r@v04/10200367.".........We''re talking about Maria here, so I can''t imagine it was some kind of metaphor or joke.@k@v04/10200368. ...It might be best to take what she says at face value."'
3053: 'Battler@r@v10/10100584."Then what''s going on?@k@v10/10100585. Are you saying that Genji-san or someone put on that fancy dress from the portrait and gave Maria the umbrella?"'
3054: 'Jessica@r@v04/10200369."...I have no idea...@k@v04/10200370. Actually, that''s what I want to know."'
3055: '@rJessica shrugged jokingly, but her expression wasn''t completely joking.'
3056: '@rOnce the hors d''oeuvres were set out and Gohda showed off his vast store of knowledge, the meal began.'
3057: '@rA couple casual chats broke out here and there, but they seemed somehow distant; it was a quiet dinner, granting no respite from the intrusive sound of rain that was creeping into the dining hall.'
3058: '@rKumasawa and Shannon, pushing the serving cart, ran into Genji and Kanon on their way to the kitchen.'
3059: 'Kumasawa@r@v18/11800071."...Genji-san, were you the one who lent Maria-sama an umbrella?"'
3060: 'Genji@r@v14/11600058.".........Umbrella?@k @v14/11600059.What are you talking about?"'
3061: 'Shannon@r@v15/10500143."Right.@k@v15/10500144. ......I heard that when it started raining, Maria-sama was alone in the rose garden.@k@v15/10500145. ...And it seems that she borrowed an umbrella from someone there,@k@v15/10500146. but we don''t know who it was."'
3062: 'Kanon@r@v16/10600066."......It wasn''t me.@k@v16/10600067. After all, I thought that Maria-sama was in the guesthouse.@k@v16/10600068. When Battler-sama first found her, she was already holding a white umbrella."'
3063: 'Genji@r@v14/11600060."My apologies, but it was not me either..."'
3064: 'Shannon@r@v15/10500147.".........Then, you don''t think it was...@v15/10500148....the Master,@v15/10500149. possibly?"'
3065: '@rEveryone in both the dining hall and the place where they were standing now had stated that it wasn''t them.'
3066: '@r...Which meant that only Kinzo was left, but...'
3067: 'Kumasawa@r@v18/11800072."Maybe he went walking down the corridor for some reason, when, by coincidence, he saw Maria-sama in the rose garden without even an umbrella..."'
3068: 'Genji@r@v14/11600061."...............The Master...@v14/11600062.does not particularly like Maria-sama."'
3069: 'Kanon@r@v16/10600069."I agree.@k@v16/10600070. ............I can''t imagine that, just for Maria-sama, he would trouble himself to go all the way down the stairs to carry an umbrella to her directly."'
3070: 'Kumasawa@r@v18/11800073."Oh, my......how troublesome.@k@v18/11800074. So that means that the one who lent Maria-sama an umbrella really was BEATRICE-sama?@k @v18/11800075.Hoh-hoh-hoh-ho..."'
3071: '@rKumasawa laughed, just like the relatives in the dining hall had laughed it off.@k@r......She couldn''t think of any other way to break through the smoke veiling the current situation.'
3072: '@rJust then, the crisp sound of hands clapping twice rang through the hallway.'
3073: '@rThey all turned around at once to see that it was Gohda, who was coming out of the dining hall.'
3074: 'Gohda@r@v17/11700069."Chop-chop, everyone.@k@v17/11700070. When serving a dinner, it is essential to make sure the dishes are served with the proper timing.@k@v17/11700071. Please immediately see to setting out the soup.@k@v17/11700072. Genji-san, the women are in the middle of an important job, so please don''t get in their way."'
3075: 'Kanon@r@v16/10600071."........................"'
3076: '@rKanon glared at Gohda for being rude to Genji, a person Kanon respected.'
3077: '@rGenji, realizing this, patted Kanon once on the shoulder as if to warn him.'
3078: '@rKanon reluctantly turned away, and returned his expression to normal.'
3079: 'Genji@r@v14/11600063."......Obey Gohda''s order.@k@v14/11600064. Let us now hurry to prepare the dinner table."'
3080: 'Gohda@r@v17/11700073."Come on, we have no time.@k@v17/11700074. Don''t just dawdle around!@k @v17/11700075.Hurry...!"'
3081: '@rGohda grabbed the serving cart from Shannon and drove it past her, heading towards the kitchen at pace.'
3082: 'Kumasawa@r@v18/11800076."...Then please allow us to return to the kitchen.@k@v18/11800077. ...After all, Gohda-san''s patience is very short, ...hoh-hoh-ho."'
3083: 'Shannon@r@v15/10500150."Ple-please excuse me as well..."'
3084: '@rKumasawa and Shannon left.@k@rOnly Genji and Kanon remained.@k@rThrough the window, the darkness of the rainy night could be seen, along with the occasional thunderbolt.'
3085: 'Kanon@r@v16/10600072."............Genji-sama.@k@v16/10600073. Has BEATRICE-sama really...@v16/10600074.......returned?"'
3086: 'Genji@r@v14/11600065."...........................I don''t know."'
3087: 'Kanon@r@v16/10600075."......Should we inform the Master?"'
3088: 'Genji@r@v14/11600066."There''s no need.@k@v14/11600067. .........If she has truly returned, she will eventually appear before the Master of her own accord.@k@v14/11600068. .........Furthermore, she is a fickle person.@k@v14/11600069. It would be pointless to report to the Master only to find that she does not appear..."'
3089: 'Kanon@r@v16/10600076."..................I wonder if this means that the Master''s ritual has already begun."'
3090: 'Genji@r@v14/11600070."...Probably.@k@v14/11600071. However, that has nothing to do with furniture like us.@k@v14/11600072. ......We must return the favor that we received from the Master...until our final moments."'
3091: 'Kanon@r@v16/10600077.".........Yes.@k@v16/10600078. ...As furniture, that is our...@v16/10600079.............duty."'
3092: '@rThe thunder crashed once more.'
3093: '@rExcept for that instant when the lightning lit up the sky, all that could be seen out of the window was the darkness of night.'
3094: '@rJust as humans rule when the sun is up, the time when the sun is down is ruled by those that are not human.'
3095: '@rThe darkness of night that now surrounded Rokkenjima was ruled not by the Ushiromiya family, but by another master.'
3096: '@rDid this master take pity on Maria when she was alone and pummeled by the rain in the rose garden, and lend her an umbrella...?'
3097: '@rKanon looked at the rose garden''s lights, dimly visible beyond the window.@k@rThe dim lights were not enough to illuminate the surrounding area.'
3098: '@rLooking at those lights felt like making eye contact with the witch, and Kanon forcibly averted his gaze.'
3099: '@r...If he didn''t, it felt like his eyes would be absorbed by that light......'
3100: '@rPerhaps the weather was also a factor.@k@rYou often hear stories about how things like atmospheric pressure can influence people''s moods and physical health.'
3101: '@rFor some time now, everyone had been making periodic attempts to clear the gloomy atmosphere,@k but any conversation was quickly cut off, and in the end the dining hall was simply buried by the sound of the rain.'
3102: '@rDessert was some kind of chocolate cake accompanied by pear sherbet.'
3103: '@rGohda-san enthusiastically explained the recipe as if delivering the coup de grace, but I quickly forgot the details.'
3104: '@rThe guest of honor, Grandfather, was absent; the weather was horrible; and the person who had lent Maria the umbrella was still a mystery.'
3105: '@rWhen dinner ended, no one felt even one bit refreshed.'
3106: '@r...It was too late now, but I realized painfully that taste wasn''t the only important part of a meal. The whole atmosphere was also critical.'
3107: '@rGohda-san, the supposed conductor of this performance called dinner, did his best to enliven the place,@k dropping little jokes left and right, but it seemed they didn''t quite get there.'
3108: '@rAfter taking orders for after-dinner coffee, tea, and orange juice, he left for the kitchen.'
3109: '@rAs soon as he disappeared, Uncle Krauss spoke.'
3110: 'Krauss@r@v02/10800294."......My, my.@k@v02/10800295. How truly irksome that this dinner, which Gohda worked so hard to create, has been so poorly received."'
3111: 'Eva@r@v05/11000288.".........Yes, seriously.@k@v05/11000289. It feels like nothing would taste good today. It''s just that kind of mood."'
3112: 'Krauss@r@v02/10800296."Hoh.@k@v02/10800297. I would love to hear why you feel that way.@k@v02/10800298. Sometime later, allow me, as your older brother, to help cheer you up."'
3113: '@rAuntie Eva grimaced slightly.@k@r...I had already heard that she was not on good terms with Uncle Krauss, but now I could clearly feel it.'
3114: '@rWhen I looked around, I noticed that my dad and Auntie Rosa were also grimacing.'
3115: '@rAnyhow, it looked like there was something besides the weather that was troubling all of them...'
3116: 'Battler@r@v10/10100586."......Auntie Eva and my dad,@v10/10100587. ...they both look like they''re in a bad mood."'
3117: 'Natsuhi@r@v03/10900096."Really?@k @v03/10900097.I don''t think so."'
3118: '@rI asked Aunt Natsuhi, who was sitting on my right, ...but it looked like she was also in a bad mood.'
3119: '@rShe snapped back as though she was absolutely not interested.'
3120: 'Hideyoshi@r@v06/11100189."Well, our adult conversation got a little complicated.@k@v06/11100190. It''s not somethin'' kids like you need to worry about, Battler-kun.@k @v06/11100191.Hahahahaha,@v06/11100192. right? Natsuhi-san? Kyrie-san?"'
3121: '@rUncle Hideyoshi laughed as he spoke, but without his usual brightness,@k so I could vaguely imagine just how complicated their adult conversation had actually become.'
3122: '@rOn top of that, even Aunt Natsuhi and Kyrie-san, the people he had directed his comment to, ignored him as though they hadn''t heard anything.'
3123: '@r...I didn''t know what kind of conversation they had been having while we kids were away,@k but it reminded me of how Dad had said he had stomach cramps when we had arrived at the mansion.'
3124: '@rThe family conference might have been a playful reunion to us kids, but it was definitely different for the adults...'
3125: '@rAfter Uncle Hideyoshi was ignored by the other adults, an awkward silence fell over the room; Kyrie-san spoke up.'
3126: 'Kyrie@r@v09/11300081."......We were talking about how the kids'' careers would turn out.@k@v09/11300082. What will you do in the future, Battler-kun?@k @v09/11300083.Just drift on to college?@k @v09/11300084.Wouldn''t that be a little disheartening as a starting line for the long race of life?"'
3127: 'Battler@r@v10/10100588."Hey! Wait a sec...@k@v10/10100589. Kyrie-san, if you start talking about something like that in the middle of a meal, it won''t digest well and we''ll all get constipated, ri~ght?"'
3128: 'Hideyoshi@r@v06/11100193."Wahahaha...!@k @v06/11100194.That''s right, that''s right! We were talking about Battler-kun and Jessica-chan''s careers!@k @v06/11100195.You can''t take the future too seriously!@k @v06/11100196.Wahahaha..."'
3129: '@rHideyoshi heartily agreed as if they really had been talking about that, but they probably hadn''t.'
3130: '@rKyrie-san had obviously been trying to avoid talking about something.@k@rHowever, if Kyrie-san had determined that this was the best course of action for now, then she was probably right.'
3131: '@rTaking this into account, I decided to cast aside my suspicions as to the cause behind Auntie Eva and Dad''s bad moods...'
3132: '@rAt long last, the serving cart returned, filled with coffee and tea.'
3133: '@rKumasawa-san and Shannon-chan served it to everyone.@k@rGohda-san then explained that, with this, tonight''s dinner was over.'
3134: '@rIf I had been able to eat in a more cheerful mood, it might have been the best dinner of my life.'
3135: '@rIt was a shame that this greatest of dinners couldn''t have been had under the greatest of conditions.'
3136: 'Maria@r@v13/10400454."Uu!@k @v13/10400455.George onii-chan, is dinner over now?@k @v13/10400456.Over?"'
3137: 'George@r@v07/10300347."Yes.@k@v07/10300348. We''re all done now."'
3138: 'Rosa@r@v12/11400221."That''s not ladylike.@k@v12/11400222. Stay in your seat, and calmly drink up."'
3139: 'Maria@r@v13/10400457."...Uu."'
3140: '@rMaria looked like she was really excited about the occasionally crashing thunder.@k@rMaybe she wanted to quickly finish eating and run over to the window.@k@rShe had been fidgeting for a while, waiting for the meal to end.'
3141: '@r......Some people are afraid of thunder, while others find it interesting, and Maria was apparently one of the latter.'
3142: '@rSo, when she heard from George-aniki that dinner was over, a huge smile broke across her face.'
3143: '@rShe then stood from her seat, took out her handbag - which she had set under her seat, never having left it even while she was eating - and began fishing around inside of it.'
3144: '@rNo one seemed particularly concerned with this behavior...'
3145: 'George@r@v07/10300349.".........What''s...@v07/10300350.that?@k@v07/10300351. Where did you get it?"'
3146: '@rGeorge was the first to notice it.@k@rAs he spoke, Battler also noticed.'
3147: '@rWhen they looked, they noticed that Maria was now holding a beautiful Western-style envelope.'
3148: '@rOn the front of the envelope, the Ushiromiya family crest - the One-winged Eagle - was done in gold leaf.'
3149: '@rFurthermore, it was sealed with dark red wax, imbuing a level of class upon it that made it clear that this was not something that Maria should be carrying around for fun.'
3150: 'Natsuhi@r@v03/10900098."......Maria-chan, what is that?"'
3151: '@rIt seemed that Natsuhi had also noticed the strangeness of the envelope that Maria was holding.@k@rBecause her voice sounded too serious to be admonishing a small child, the other relatives around her finally noticed.'
3152: 'Rudolf@r@v08/11200256."What''s up, Natsuhi nee-san?"'
3153: 'Eva@r@v05/11000290."............What is...@k@v05/11000291.that?"'
3154: 'Rosa@r@v12/11400223."Maria...@k@v12/11400224.where did you pick that up...?"'
3155: 'Nanjo@r@v19/11900097."That envelope has...@v19/11900098....Kinzo-san''s......"'
3156: '@rAs Nanjo muttered that, even us kids could understand why everyone seemed to be frozen solid.'
3157: '@rThe envelope that Maria held was one of the Ushiromiya family head''s custom-made envelopes for private use.'
3158: '@r......In other words, it could only mean one thing.@k@rThis envelope contained a message from Kinzo.'
3159: 'Krauss@r@v02/10800299."Hoh.........@k@v02/10800300. ...What is an envelope like that doing here...?"'
3160: 'Rudolf@r@v08/11200257."......It, ......it looks like something interesting has jumped out at us."'
3161: 'Hideyoshi@r@v06/11100197.".........J-just let me have a peek...!"'
3162: 'Maria@r@v13/10400458."Uu!!@k @v13/10400459.No, I''m reading it!@k @v13/10400460.I was told to read it to everyone!!"'
3163: '@rUncle Hideyoshi tried to snatch the envelope out from Maria''s hands, but she protected it as though hugging it, and didn''t let go.'
3164: 'Kyrie@r@v09/11300085."Hideyoshi nii-san, you shouldn''t take something from a child by brute force.@k@|@y@v09/11300086. .........Maria-chan, where did you get this envelope?"'
3165: 'Maria@r@v13/10400461."Uu!@k @v13/10400462.Got it from BEATRICE when she gave me the umbrella.@k@v13/10400463. She told me to read it to everyone after the meal was over!@k @v13/10400464.I''m the witch''s mes -@v13/10400465. mess - @v13/10400466. "messenger"!@k @v13/10400467.Uu!"'
3166: 'Battler@r@v10/10100590."Messenger...?@k @v10/10100591.Ihihihi, the witch of the island sure likes to mess around."'
3167: '@rBattler tried to joke about it, but no one went along with him.'
3168: 'Eva@r@v05/11000292."..................I, I wonder what''s written inside of it. Maria-chan...?"'
3169: 'Maria@r@v13/10400468."Uu.@k@v13/10400469. Reading!@k @v13/10400470.Uu!"'
3170: '@rMaria casually opened the envelope.'
3171: '@r...It was sealed only with wax, so she just had to remove the sealing wax to open it.'
3172: '@r...That sealing wax fell onto the desk.@k@rHideyoshi hastily picked it up and stared fixedly at it.'
3173: '@rHe then set it in the center of the table, where Natsuhi, Kyrie, and Nanjo glared at it.'
3174: '@rImprinted there in the sealing wax was the One-winged Eagle - which was the Ushiromiya family crest, and also Kinzo''s personal crest.'
3175: 'Natsuhi@r@v03/10900099."............This is the family head''s personal crest..."'
3176: 'Nanjo@r@v19/11900099.".........I know because I have received letters from Kinzo-san before.@k@v19/11900100. Without a doubt, this is Kinzo-san''s wax seal."'
3177: 'Kyrie@r@v09/11300087."But, in this mansion, couldn''t there be several identical seals?@k@v09/11300088. For example, if there was some kind of stamp for wax seals, couldn''t someone other than Kinzo-san have sealed it?"'
3178: 'Nanjo@r@v19/11900101."No, Kinzo-san would always use a ring on his finger, his "Proof of the Ushiromiya Family Headship", when he sealed the wax.@k@v19/11900102. This shape and complex design is definitely Kinzo-san''s seal..."'
3179: 'Krauss@r@v02/10800301."That is not necessarily so.@k@v02/10800302. Anyone in the family must have received a letter from Dad at least once.@k@v02/10800303. We can''t eliminate the possibility that someone, using that wax as a model, created a fake seal to pass themselves off as Father."'
3180: 'Rudolf@r@v08/11200258."I agree with Aniki.@k@v08/11200259. No matter how the seal resembles Dad''s, we can''t prove that it is the real thing.@k@v08/11200260. Therefore, it doesn''t prove that this envelope came from Dad."'
3181: 'Eva@r@v05/11000293."I feel the same way.@k@v05/11000294. I cannot approve of arbitrarily deciding that this is Father''s letter only by the seal in the wax.@k@v05/11000295. Doctor Nanjo, would you mind refraining from speaking such vague words...?!"'
3182: 'Nanjo@r@v19/11900103."............I apologize...@k@v19/11900104. I said too much..."'
3183: '@rOne after another, all of the siblings, from Krauss on downwards, rejected Nanjo''s statement, saying that the envelope that Maria was holding had not necessarily been sent by Kinzo.'
3184: '@rThey were afraid.'
3185: '@rKinzo''s intentions were written in there,@k and they feared from the bottoms of their hearts that it might be some decidedly unfavorable announcement regarding the inheritance.'
3186: 'Rosa@r@v12/11400225."...Maria...@k@v12/11400226. The person who gave you that envelope was the same person who lent you that umbrella, right...?"'
3187: 'Maria@r@v13/10400471."Uu!"'
3188: 'Rosa@r@v12/11400227."I don''t know what "uu" means!@k @v12/11400228.Is it true?!"'
3189: 'Maria@r@v13/10400472."Uu...@k@v13/10400473. ......Yes.@k@v13/10400474. Uu."'
3190: 'George@r@v07/10300352."So, in other words,@k@v07/10300353. ...the witch,@v07/10300354. BEATRICE, gave you that envelope along with the umbrella...?"'
3191: 'Maria@r@v13/10400475."Uu!"'
3192: '@rMaria nodded forcefully.'
3193: 'Natsuhi@r@v03/10900100."...I, I agree with my husband.@k@v03/10900101. It''s a dubious letter handed over by some suspicious person.@k@v03/10900102. It''s not even worth reading."'
3194: 'Battler@r@v10/10100592."Oh, go on, what''s the worst that could happen, right?"'
3195: '@rBattler said it to Jessica in a small voice, pretending to stir things up, but Natsuhi heard him clearly and glared at him with threatening eyes.'
3196: 'Jessica@r@v04/10200371."A-and then,@v04/10200372. err,@v04/10200373. ...BEATRICE told you to read it after the meal was over, right?"'
3197: 'Maria@r@v13/10400476."Uu!"'
3198: 'Kyrie@r@v09/11300089.".........Why not, everyone.@k@v09/11300090. This isn''t Grandfather''s envelope, it''s BEATRICE''s.@k@v09/11300091. Who cares who wrote it, why can''t we just hear what''s inside before passing judgment?"'
3199: 'Hideyoshi@r@v06/11100198."Th-...that''s right.@k@v06/11100199. Even if Father didn''t necessarily write it, I''m still concerned about its contents.@k@|@y@v06/11100200. ......Maria-chan, I''m sorry I tried to take it from you by force earlier!@k @v06/11100201.I apologize, so will you read it aloud in front of everyone?"'
3200: 'Rosa@r@v12/11400229."............Maria.@k@v12/11400230. Read it."'
3201: 'Maria@r@v13/10400477."Uu."'
3202: '@rAs all of the relatives stared fiercely at Maria, she spread the letter open with a rustle...'
3203: 'Rudolf@r@v08/11200261."......Do you think it really is Dad''s letter?"'
3204: 'Krauss@r@v02/10800304."Impossible.@k@v02/10800305_b. Whenever Father has announced something to us in the past, if he didn''t do it directly, he would always send Genji-san, right?@k@v02/10800306. ......I can''t believe that he would use such a joke-like approach."'
3205: 'Eva@r@v05/11000296."That''s right.@k@v05/11000297. Maria, a messenger?@k @v05/11000298.That''s seriously not his style...@k@v05/11000299. Rosa, this must be Maria-chan trying to surprise us with some kind of hidden talent, right...?"'
3206: 'Rosa@r@v12/11400231."I..................M-Maria''s not a kid capable of something so clever."'
3207: 'Maria@r@v13/10400478."Reading.@k@v13/10400479. Uu."'
3208: '@rThe words came out of Maria''s mouth, but for some reason it felt like her voice was different than usual.'
3209: '@rEveryone went suddenly silent...'
3210: 'Maria@r@v13/10400480."Welcome to Rokkenjima, ladies and gentlemen of the Ushiromiya family.@k@v13/10400481. I am BEATRICE, the alchemist for this family, under the employ of Kinzo-sama."'
3211: 'Hideyoshi@r@v06/11100202.".........How absurd...!"'
3212: 'Eva@r@v05/11000300."Quiet!"'
3213: 'Maria@r@v13/10400482."I have served him for many years in accordance with our contract, but today, Kinzo-sama has announced the termination of that contract.@k@v13/10400483. Therefore, I ask that you acknowledge my resignation from the position of family alchemist as of today."'
3214: 'Krauss@r@v02/10800307."......How foolish... What nonsense...!"'
3215: 'Natsuhi@r@v03/10900103."I, I can''t stand to listen to it...!"'
3216: 'Maria@r@v13/10400484."And now, there is one part of the contract that I must explain to you all.@k@v13/10400485. I, BEATRICE, lent Kinzo-sama a vast quantity of gold under certain terms.@k@v13/10400486. One of these terms specifies that all the gold is to be returned to me upon the termination of the contract.@k@v13/10400487. Furthermore, I am to receive everything of the Ushiromiya family as interest."'
3217: 'Hideyoshi@r@v06/11100203."R-ridiculous!!"'
3218: 'Jessica@r@v04/10200374."...I-it''s been ridiculous from the very beginning..."'
3219: 'Battler@r@v10/10100593."So it''s basically one of those things, right?@k @v10/10100594.Just like one of those contracts with the devil you always hear about?@k @v10/10100595.And, the contract has expired, so she''s come to collect the interest.@k@v10/10100596. Is she trying to grab some retirement money for her old age or something?@k @v10/10100597.What a cheeky witch."'
3220: 'George@r@v07/10300355."Battler-kun, now is not the time to joke around..."'
3221: '@rBattler made a face as if to ask, "If I can''t make fun of this, what can I make fun of?"'
3222: '@rAt the same time, some of the adults'' faces were pale, while others looked completely shocked.'
3223: 'Maria@r@v13/10400488."After hearing this, you may feel as though Kinzo-sama has been savagely ruthless.@k@v13/10400489. However, Kinzo-sama did append a special clause to the contract so that you would have a chance to preserve your wealth and honor.@k@v13/10400490. If and only if that special clause is fulfilled, I will lose my rights to the gold and the interest for all eternity."'
3224: 'Rudolf@r@v08/11200262."......A special clause...?"'
3225: 'Eva@r@v05/11000301."Wh-what is it...?!"'
3226: 'Maria@r@v13/10400491.@z70.Special Clause.@k@r@v13/10400492.BEATRICE has the right to collect the gold and accumulated interest upon the termination of the contract.@k@r@v13/10400493.However, if someone is able to discover the hidden gold of this contract,@k@v13/10400494. BEATRICE must abandon these rights for all time.'
3227: 'Maria@r@v13/10400495.@z70.......The collection of the interest will proceed shortly, but if any one of you fulfills the terms of this special clause,@k@v13/10400496. I shall return everything, including the portion that has already been collected.@k@r@v13/10400497.Furthermore, as the first step in this collection of Kinzo-sama''s debt, I have taken possession of the "Ushiromiya Family Head''s Ring", which signifies the passage of the Ushiromiya family headship from one individual to another.@k@r@v13/R10400498.I ask that you confirm this for yourselves by examining the imprint on the wax seal.'
3228: 'Krauss@r@v02/10800308.".........You want me to accept this as real...?!@k @v02/10800309.That Dad would relinquish his ring is unthinkable...!"'
3229: '@rKrauss was staring at the sealing wax as though he was trying to burn a hole through it.@k@rEva and Rudolf were doing the same over his shoulder!'
3230: 'Nanjo@r@v19/11900105."I, I did have the odd feeling that something was missing from Kinzo-san''s finger when we were playing chess........."'
3231: 'Natsuhi@r@v03/10900104."Doctor Nanjo!@k @v03/10900105.Don''t say something so careless just because of a vague memory!"'
3232: 'Kyrie@r@v09/11300092."We can''t prove its authenticity here.@k@v09/11300093_b. The questions of whether Father really has handed over his ring, and whether this letter tells the truth, we can determine simply by asking him directly."'
3233: 'Rosa@r@v12/11400232."Th-that''s right.@k@v12/11400233. It''s just as Kyrie-san says..."'
3234: 'Nanjo@r@v19/11900106.".........Well now, I wonder.@k@v19/11900107. Will Kinzo-san answer you...?@k@v19/11900108. After all, that person''s thoughts are sometimes impossible to predict using common sense..."'
3235: 'Krauss@r@v02/10800310."In any event, this does not leave the realm of nonsense...!@k @v02/10800311.In the first place, the fiction of the gold is itself a deception by Father.@k@v02/10800312. If you want to talk about nonexistent gold, leave me out of it!"'
3236: 'Eva@r@v05/11000302."But, you heard what the witch is saying, right?@k @v05/11000303.About how the headship and all of the assets would be handed over to the one who finds the gold?@k @v05/11000304.So, could this mean that BEATRICE-sama is Father''s legal advisor, or maybe in charge of his funds...?"'
3237: 'Natsuhi@r@v03/10900106."W-we can''t possibly trust the kind of strange person who would entrust such a suspicious paper to a child!"'
3238: 'Rudolf@r@v08/11200263."Aniki... Time for you to open up.@k@v08/11200264. Is it possible that someone you don''t know is actually handling Dad''s assets?!"'
3239: 'Krauss@r@v02/10800313."N-no, that''s impossible!@k @v02/10800314.As the agent to the head, I have total knowledge of all Father''s assets!@k @v02/10800315.There shouldn''t be anyone who can manipulate them without me knowing it!"'
3240: 'Rosa@r@v12/11400234."Then, there must be some assets that you do not have full knowledge of, mustn''t there, Krauss nii-san?"'
3241: 'Krauss@r@v02/10800316."Absurd, there''s no such thing!"'
3242: 'Eva@r@v05/11000305."..................Oh yes, there is.@k@v05/11000306. One asset of Father''s that you know nothing about."'
3243: 'Natsuhi@r@v03/10900107."There is no way that something like that exists!!"'
3244: 'Hideyoshi@r@v06/11100204."No, it does.@k@v06/11100205. ............That''d be Father''s, no, BEATRICE''s hidden gold!!"'
3245: 'Rudolf@r@v08/11200265."Let''s put things in order.@k@v08/11200266. In short, Dad has some trusted confidante that not even Aniki knows about.@k@v08/11200267. Furthermore, this person has always been in charge of watching and managing the gold.@k@v08/11200268. It''s possible that this person is a dilettante of a very rich family who provided his financing in the first place through a mock devil''s contract."'
3246: 'Kyrie@r@v09/11300094.".........Could it be that this confidante, this BEATRICE-san, is trying to test which of the sons and daughters is most fitting to be financed by her gold?"'
3247: '@rWhat Kyrie said was something that all of the siblings wanted clarified.'
3248: '@rUpon reflection, they realized that during the time Kinzo''s strange epitaph had been displayed in the hall beneath the portrait of the witch,@k they had always whispered that the one who solved the puzzle would receive everything, ......yet no one had ever clearly stated it.'
3249: '@rIt was just something that everyone had hoped might be true.@k@rThat had, right here, right now, been clearly expressed by BEATRICE''s letter!'
3250: '@rIt clearly specified that everything of the Ushiromiya family would be given to the one who found the gold.'
3251: 'Maria@r@v13/10400499."Kinzo-sama has already publicly displayed the location of the hidden gold within the epitaph under my portrait.@k@v13/10400500. The rules apply equally to all who can read the epitaph.@k@v13/10400501. If you discover the gold, I shall return everything to you."'
3252: 'Maria@r@v13/10400502."Tonight, I ask that you enjoy your battle of wits with Kinzo-sama to the fullest.@k@v13/10400503. I sincerely pray that this night will be both intellectual and elegant.@k@|@y@v13/10400504.@r- BEATRICE, the golden."'
3253: 'Krauss@r@v02/10800317."......Father, I know you can hear me!@k @v02/10800318.Please respond!"'
3254: '@rThe door to Kinzo''s study was being violently, violently beaten against over and over again like a percussion instrument.'
3255: '@rThe screams coming from the other side were Krauss''s, Rudolf''s, and sometimes Eva''s voices.'
3256: '@rIt was the siblings, who were trying to intrude upon Kinzo''s study to question him about the truth behind that mysterious letter.'
3257: '@rKinzo was eating.'
3258: '@rAn elegant tablecloth was set over the desk, and the fabulous dinner that had colored the table down in the dining hall was once again laid out.'
3259: '@rKinzo continued his meal in silence.@k@r...Shannon, taking away an empty plate, looked uncomfortably between the door being beaten on and Kinzo''s face.'
3260: 'Shannon@r@v15/10500151."...............Everyone is calling for you, but...@v15/10500152....what would you like me to do...?"'
3261: 'Kinzo@r@v01/11500301."...Leave it.@k@v01/11500302. God values silence, and so do I during dinner."'
3262: 'Genji@r@v14/11600073."............Should I silence them?"'
3263: 'Kinzo@r@v01/11500303."There''s no need.@k@v01/11500304. It does not even reach my ears."'
3264: '@rKinzo coolly tasted his food.'
3265: '@rGenji quietly lowered his head and took a single step back.@k@r...As he did, Kanon, who stood in reserve like a shadow behind and to the side of Genji, opened his mouth.'
3266: 'Kanon@r@v16/10600080.".........Maria-sama seems to have received a letter from BEATRICE-sama, so I assume they want to verify its authenticity."'
3267: 'Kinzo@r@v01/11500305."...Hahahaha...@k@v01/11500306. .........That daredevil, she has started already?"'
3268: 'Kinzo@r@v01/11500307."............Come, BEATRICE.@k@v01/11500308. There''s nothing lacking in the coins that have been wagered.@k@v01/11500309. Shall we enjoy this night to the fullest?@k@v01/11500310. ......I have no intention of losing.@k@v01/11500311. Your smile is mine for all eternity.@k@v01/11500312. If I could see it one more time, I wouldn''t regret losing my wealth, my honor, or even my life."'
3269: 'Kinzo@r@v01/11500313.".........Well then, the roulette has begun to spin.@k@v01/11500314. Which pocket will the ball fall into?@k@v01/11500315. Noir? Rouge?@k@v01/11500316. Or house takes all?@k@v01/11500317. Come, you may begin, BEATRICE.@k@v01/11500318. I''ll show you the power of miracles once more...!"'