2470: 'Battler@r@v10/10100433."So...on the tenth twilight, the journey shall end,@k@v10/10100434. and you shall reach the Golden Land.@k@v10/10100435. You really are diligent, Maria.@k@v10/10100436. You did a good job taking notes on all of this."'
2471: 'Maria@r@v13/10400275."Uu!@k @v13/10400276.I forget a lot so I write things down!@k @v13/10400277.Write things down like Mama said!"'
2472: '@rThere was a notebook inside the handbag Maria was always carrying around,@k and BEATRICE''s epitaph was copied onto it.'
2473: '@rThanks to that,@k we were all able to challenge the puzzle of the epitaph while here on this beach.'
2474: '@rFor Jessica and the others,@k this was a puzzle that they had already tried to solve several times,@k and had already gotten bored with.'
2475: '@rBut it was a first for me,@k and I was so excited that I couldn''t stop.'
2476: '@rIt really tickled my male sense of romance!'
2477: 'Battler@r@v10/10100437."Let''s start with the first line.@k@v10/10100438. Behold the sweetfish river, running through my beloved home of old.@k@v10/10100439. Where was Grandfather''s old home again?"'
2478: 'Jessica@r@v04/10200244."I heard that, before the war, the Ushiromiya family had a mansion near Odawara.@k@v04/10200245. So, that said, you''d want to know about a sweetfish river that flows through Odawara, right?"'
2479: 'Battler@r@v10/10100440."Yeah, because that river''s the starting point.@k@v10/10100441. And then it''s got, you who seek the Golden Land, follow its path downstream in search of the key.@k@v10/10100442. What rivers are in Odawara?@k @v10/10100443.It''s got to be one with sweetfish swimming in it."'
2480: 'George@r@v07/10300246."For sweetfish in Odawara, it''d be the Hayakawa.@k@v07/10300247. It''s famous for its mountain stream fishing."'
2481: 'Maria@r@v13/10400278."Uu.@k@v13/10400279. I haaate fish."'
2482: 'Battler@r@v10/10100444."Ihihi, Maria, you''ll understand when you get o~lder!@k @v10/10100445.You''ll be all, licklickli~ck, salty roasted sweetfish!@k @v10/10100446.Yummy~!@k @v10/10100447.Even though we just ate, I''m getting hungry again."'
2483: 'Shannon@r@v15/10500081."......Umm, shall I bring you some biscuits?"'
2484: 'Battler@r@v10/10100448."Huh?@k @v10/10100449.Oh, sorry—that''s not what I meant, don''t mind me!"'
2485: '@rShannon-chan, who didn''t have any afternoon chores for a while, was faithfully keeping us company.'
2486: '@rI would have thought that, as a servant, accompanying us would force her to take care of us and tire her out, but it seemed that it wasn''t so in her case.'
2487: '@r...To the contrary, it seemed she was having fun joining in on the conversation with people of a similar age.'
2488: '@rWhen I asked, she told me she was a live-in worker.@k@rSo normally, the only person close in age to her was Jessica.'
2489: '@rI get it, that must be pretty wearisome.'
2490: 'Battler@r@v10/10100450."Alright, so I get that the sweetfish-filled river near Odawara is the Hayakawa.@k@v10/10100451. In that case, we have to go down it!@k @v10/10100452.Don''t you find anything if you head down the Hayakawa?"'
2491: 'Shannon@r@v15/10500082."Ummm,@k@v15/10500083. ............if you follow it downstream, you''ll arrive in the ocean."'
2492: 'Battler@r@v10/10100453."Of course, you''d reach the mouth of the river!@k @v10/10100454.And then the third line of the epitaph was "As you travel down it, you will see a village."@k@v10/10100455. By the way, since long ago, the mouths of rivers have generally been key points for transportation, and large cities tend to be built there.@k@v10/10100456. That''d be the next checkpoint."'
2493: 'George@r@v07/10300248."Hmmmmmm.@k@v07/10300249. That''s a pretty good theory.@k@v07/10300250. Just like you imagined, in ancient times, there was a very prosperous old city there.@k@v07/10300251. That''s where Odawara Castle is."'
2494: 'Shannon@r@v15/10500084."Ah, I think I might have gone to Odawara Castle on a field trip once.@k@v15/10500085. It really was a wonderful castle."'
2495: 'Jessica@r@v04/10200246."Yeah, I went to Odawara Castle too.@k@v04/10200247. Even though I live in a Western-style house, it sure is true that Japanese people feel calmer with Japanese style!"'
2496: 'Maria@r@v13/10400280."Uu.@k@v13/10400281. I think castles are boorring.@k@v13/10400282. Theme parks are better.@k@v13/10400283. Uu!"'
2497: 'Battler@r@v10/10100457."I see, I see. Alright, alright!@k @v10/10100458.If we find the gold, the great Battler-sama will generously reserve a whole theme park for a day and let you play a~ll you want!"'
2498: 'Battler@r@v10/10100459.".........Still, Odawara Castle.@k@v10/10100460. The hidden gold of Odawara Castle...@k@v10/10100461. Oho?!@k @v10/10100462.Kind of has the right ring to it, don''t you think?!"'
2499: 'Jessica@r@v04/10200248."Hahahahaha!@k @v04/10200249.Well, we figured out that much when we tried this two years ago.@k@v04/10200250. The village down the river where the sweetfish swim in Odawara.@k@v04/10200251. We figured that it was probably somewhere near Odawara Castle."'
2500: 'Jessica@r@v04/10200252."The problem is the next line.@k@v04/10200253. Alright, let''s see where your strange reasoning can take you."'
2501: '@rJessica grinned broadly.@k@rIt was like she was saying that, if the puzzle could be solved so easily, she would have found it long ago.'
2502: '@r...Damn it,@k I''ll definitely find it and keep it all for myself!'
2503: 'Battler@r@v10/10100463."The fourth line.@k@v10/10100464. ...In that village, look for the shore the two speak of.@k@v10/10100465. .........I don''t know what it means by "the two", but anyway, the shore.@k@v10/10100466. .........What does it mean by the shore?!@k @v10/10100467.Hmmmm...@v10/10100468.is there any place near there with @bkishi.@<岸@> in its name?"'
2504: 'Shannon@r@v15/10500086."Ummm,@k@v15/10500087. ......I have heard that there is a place called @bSogakishi.@<曽我岸@> in Odawara."'
2505: 'Battler@r@v10/10100469."Huh?!@k @v10/10100470.Wow,@v10/10100471. you sure know a lot!"'
2506: 'Battler@r@v10/10100472."So~, what does that mean?@k@v10/10100473. Shannon-chan, are you also after the gold, and trying to solve the riddle~?@k @v10/10100474.That makes us rivals!"'
2507: 'Shannon@r@v15/10500088."It, it''s not like I''m interested in gold...@k@v15/10500089. It''s just that...George-sama told me about it before..."'
2508: 'Jessica@r@v04/10200254."That''s because we reached the same conclusion two years ago.@k@v04/10200255. We even went and laid out a map and looked it up!"'
2509: 'George@r@v07/10300252."It was about five kilometers to the north of Odawara Castle.@k@v07/10300253. There certainly was a place called Sogakishi there."'
2510: 'George@r@v07/10300254."......But after that, we get stuck.@k@v07/10300255. The fifth line doesn''t say where the key is hidden in that place.@k@v07/10300256. Maria-chan, could you read it for us?"'
2511: 'Maria@r@v13/10400284."...Uu.@k@v13/10400285. ......There the key to the...@v13/10400286.Golden Land...@v13/10400287.sleeps."'
2512: 'Maria@r@v13/10400288."Uu!@k @v13/10400289.I read it!"'
2513: 'Jessica@r@v04/10200256."Sogakishi is probably large, and there wasn''t ever any house built there by the Ushiromiya family.@k@v04/10200257. With no hint to where the key is hidden in that huge area, we pretty much have to throw in the towel."'
2514: 'Battler@r@v10/10100475."You''re right.@k@v10/10100476. ...And without the key, we can''t advance to the next line.@k@v10/10100477. George-aniki, what kind of place is Sogakishi?"'
2515: 'George@r@v07/10300257."I''m not sure...@k@v07/10300258. I''ve never been there, so I don''t really know, but according to the map, it''s in the mountains.@k@v07/10300259. I''m pretty sure it was at the base of Mount Asama."'
2516: 'Battler@r@v10/10100478."......Hmmmm.@k@v10/10100479. Something doesn''t sit right with me here.@k@v10/10100480. Aren''t puzzles for the hiding place of treasure meant to be a bit more exact than this?@k@v10/10100481. I get the feeling we''re barking up the wrong tree with Sogakishi."'
2517: 'Jessica@r@v04/10200258."I dunno about that, Sogakishi looks suspicious to me!@k @v04/10200259.There might be some house there that we just don''t know about, that Grandfather lived in when he was a kid.@k@v04/10200260. I mean, the first line did go on about his beloved home of old."'
2518: 'Jessica@r@v04/10200261."...Shannon, Grandfather has you pouring drinks and stuff for him a lot, right?@k@v04/10200262. Haven''t you ever been made to listen to stories from his past?"'
2519: 'Shannon@r@v15/10500090."......The Master almost never speaks of his past.@k@v15/10500091. ...However, I''ve heard him speak of the Great Kanto Earthquake that almost destroyed the Ushiromiya family as though it had nothing to do with him,@k@v15/10500092. so he may have been living far away from the Kanto area."'
2520: 'George@r@v07/10300260."The Ushiromiya main family may have been living in Odawara, but the branch families probably weren''t limited to that.@k@v07/10300261. Grandfather often called himself a branch of a branch family, and the least connected to the succession,@k@v07/10300262. after all."'
2521: 'Battler@r@v10/10100482."So, in other words!@k @v10/10100483.The beloved home of old might not even be Odawara at all..."'
2522: 'Jessica@r@v04/10200263."I''ve never even asked about Grandfather''s old home.@k@v04/10200264. And he probably wouldn''t give it away if I did."'
2523: 'George@r@v07/10300263."If the so-called beloved home of old isn''t referring to the Ushiromiya family''s roots, then the Odawara theory is wrong from the beginning.@k@v07/10300264. Of course, this doesn''t remove all possibility that it was Sogakishi.@k@v07/10300265. For example, he could have lived in Odawara when he was very young, but then moved far away later."'
2524: 'Maria@r@v13/10400290."Uu...@k@v13/10400291. I don''t get what you''re talking about.@k@v13/10400292. Uu."'
2525: '@rMaria had been completely left out of the conversation, and she now sat puffing out her cheeks in boredom.'
2526: 'Battler@r@v10/10100484."Well, basically,@k@v10/10100485. if we can''t decide where the start is for our golden game of Chutes and Ladders, we can''t even begin to play."'
2527: 'Battler@r@v10/10100486."...............But wait...?@k @v10/10100487.In the first five lines the thing we''re searching for is a key, right?@k @v10/10100488.You can enter a door even without a key, just by busting right through it.@k@v10/10100489. Can''t we just throw away the first five lines and start figuring out the rest?"'
2528: 'Jessica@r@v04/10200265."Ooh...@k@v04/10200266. I hadn''t thought of that."'
2529: 'Jessica@r@v04/10200267."Oh well, we''re just killing time anyway.@k@v04/10200268. Let''s hear the rest of your reasoning!"'
2530: 'Shannon@r@v15/10500093."......But in the next part it quickly becomes disturbing..."'
2531: '@rShannon-chan frowned slightly.'
2532: '@rAfter looking back at Maria''s notebook to recall what was written there,@k ...alright, I agree.'
2533: 'Battler@r@v10/10100490."On the first twilight, sacrifice the six chosen by the key...@k@v10/10100491. It sure does get horrible quickly."'
2534: 'Jessica@r@v04/10200269."On the second twilight, it says to tear apart the two who are close.@k@v04/10200270. Does that mean to make them break off their romance?@k@v04/10200271. Or literally tear them apart?@k@v04/10200272. I don''t know, but either way, it''s pretty disgusting."'
2535: 'George@r@v07/10300266."Even if we ignore the meaning of that second line, on the first twilight it''s six people,@k@v07/10300267. and on the fourth through eighth twilights it''s five people,@k@v07/10300268. so at least eleven people must become sacrifices."'
2536: 'Maria@r@v13/10400293."Uu.@k@v13/10400294. Sacrifices to revive BEATRICE!"'
2537: 'Battler@r@v10/10100492."...I see, sacrifices to bring back the witch...@k@v10/10100493. I guess you can take it that way.@k@v10/10100494. As a result, the witch revives on the ninth twilight......@k@v10/10100495. ...This last part is glorious."'
2538: 'Shannon@r@v15/10500094."............On the ninth twilight, the witch revives, and none shall be left alive.@k@v15/10500095. ......So everyone dies in the end anyway."'
2539: 'Jessica@r@v04/10200273."And then it''s got the goal finally being reached on the tenth twilight that follows.@k@v04/10200274. Not sure how anyone "shall reach the Golden Land" if everyone''s dead."'
2540: 'George@r@v07/10300269."...It seems to allow for different interpretations as to whether or not the traveler who holds the key would be included in the "none shall be left alive" part."'
2541: 'Battler@r@v10/10100496."But there''s something pretty interesting written at the end.@k @v10/10100497.The lines about how, after reaching the goal,@k@v10/10100498. four treasures will be given by the witch.@k@v10/10100499. One shall be all the gold.@k@v10/10100500. The problem is the next one.@k@v10/10100501. It says she''ll resurrect all the dead people''s souls, right?@k @v10/10100502.Doesn''t it seem like this refers to everyone that died in the earlier lines?"'
2542: 'Shannon@r@v15/10500096.".........If you put it like that, the next one, the part about even reviving the love they possessed,@k@v15/10500097. might be referring to the pair torn apart on the second twilight."'
2543: 'George@r@v07/10300270."That''s right.@k@v07/10300271. And the fourth one refers to the ninth twilight.@k@v07/10300272. The fourth treasure is putting the witch, revived on the ninth twilight, back to sleep again."'
2544: 'Jessica@r@v04/10200275."...If we interpret it favorably,@k@v04/10200276. it''s hectic with people dying and being broken up, but it''s all made well in the end.@k@v04/10200277. The awakened witch once again sleeps, and all that''s left is plenty of gold."'
2545: 'Battler@r@v10/10100503."The witch must have her hands full with all this killing, reviving, breaking up, and reuniting people."'
2546: 'Jessica@r@v04/10200278."Not to mention waking up and sleeping.@k@v04/10200279. Hahahahaha."'
2547: 'Battler@r@v10/10100504."Oh well, just when the tale of the hidden gold was getting interesting, as soon as the witch''s story is tied in, it quickly gets pretty shady."'
2548: 'Jessica@r@v04/10200280."No kidding, ahahahahahaha!"'
2549: '@rI laughed along with Jessica.@k@rAfter all, a witch was just ridiculous.'
2550: '@r...Of course, once we started laughing like that, Maria, who believed in witches, got angry.'
2551: 'Maria@r@v13/10400295."Uu!@k @v13/10400296.Witches are awesome!@k @v13/10400297.They can do anything with magic!@k @v13/10400298.Even kill.@k@v13/10400299. Even bring back to life.@k@v13/10400300. Even give love, even take it."'
2552: 'Maria@r@v13/10400301."Can fly in the sky, can become invisible, can even make gold and bread out of nothing!@k @v13/10400302.Uu!@k @v13/10400303.Uu!!@k @v13/10400304.Uu-uu-uu!!"'
2553: 'Jessica@r@v04/10200281."Erk, oh no...@k@v04/10200282. My bad...it''s just a joke!"'
2554: '@rJessica apologized, sticking out her tongue, but Maria didn''t accept it.'
2555: '@rShe grabbed her notebook back out of my hands, and, opening to the other pages, tried to prove that witches existed.'
2556: '@rThose pages had colored illustrations of witches drawn on them,@k and conveyed the fantastical image Maria had of witches well.'
2557: '@rThey were not depicted as the normal sinister crooked-nosed hags flying around on brooms,@k but as dreamlike people with mysterious powers, who could do anything and wore beautiful dresses—@kjust what you would expect from an imaginative young girl.'
2558: '@rDancing through the sky, crossing a rainbow,@k dancing around all night with magical teacups and teapots that would never get empty no matter how much you poured out of them.'
2559: '@rWith a flourish of their wands, the stars in the sky would become candy and pour down,@k and flowers that produced sweets would bud by the roadside.'
2560: '@r......To Maria, witches were the sole thing that could give form to the magical dreams that so captivated her.'
2561: '@rThe last thing enriching her reality, which revealed more and more of its bland nature to her with every inch she grew.'
2562: '@rThat was why Maria believed in witches.'
2563: '@rShe didn''t want that dream to be insulted.@k@rAnd for that very reason, nor did she want the epitaph, which affirmed the existence of witches, to be insulted.'
2564: '@rBecause the witch BEATRICE is Maria''s dream...'
2565: 'George@r@v07/10300273."To Maria-chan, this is not something that points to the hiding place of the gold,@k@v07/10300274. but magic to revive the witch."'
2566: '@rSo, it was the single bridge...@kbetween Maria and the witch.'
2567: '@rMaria was very angry and clung onto George-aniki.'
2568: '@rJessica and I scratched our heads and apologized.'
2569: '@r...It might not be possible to smooth things over again like the time she got mad in front of the portrait.'
2570: '@rMaria didn''t want to be easily consoled.@k@rAs Jessica and I hung our heads, wondering what we could do, Shannon-chan timidly opened her mouth in our place.'
2571: 'Shannon@r@v15/10500098."Umm,@v15/10500099. .........Maria-sama, did you know...?@k @v15/10500100.There is a ghost story about BEATRICE-sama that has been passed down amongst the servants."'
2572: 'Maria@r@v13/10400305."......Uu?"'
2573: 'Jessica@r@v04/10200283."Ah, ahh, yeah, that''s right!@k @v04/10200284.Shannon, tell us about it.@k@v04/10200285. I don''t really know, but it''s apparently pretty famous amongst the servants."'
2574: 'Battler@r@v10/10100505."What''s this?@k @v10/10100506.A ghost story?"'
2575: 'George@r@v07/10300275."Yes.@k@v07/10300276. It seems it''s a story from before we were born.@k@v07/10300277. I''ve also heard it from my mother."'
2576: 'Shannon@r@v15/10500101."......Yes.@k@v15/10500102. It has been passed down since the mansion was built on this island.@k@v15/10500103. ......The servants of that time whispered that the mansion had two masters, one of the day and one of the night."'
2577: '@rThe tale that Shannon told...@kwas just like a typical campfire ghost story.'
2578: '@rIf there was a forest with a witch living inside it,@k ...then, inevitably, the witch was going to pay the mansion a visit.'
2579: '@rAt some point, this ghost story naturally sprouted up between the servants.'
2580: 'Shannon@r@v15/10500104."Doors and windows they were sure they''d shut or locked would be open when they came around to double-check.@k@v15/10500105. Lights they''d definitely turned off would be on,@k@v15/10500106. and lights they''d definitely turned on would be off.@k@v15/10500107. Things would disappear from where they had been placed,@k@v15/10500108. and things would appear when no one had any memory of putting them there."'
2581: 'Shannon@r@v15/10500109."......When any of these things happened, the old servants would say that the witch had visited the mansion, invisible, and had played pranks."'
2582: 'Maria@r@v13/10400306."Uu!@k @v13/10400307.See, she exists!@k @v13/10400308.BEATRICE exists!!"'
2583: 'Jessica@r@v04/10200286."Yeah, she exists.@k@v04/10200287. I remember often being unable to find my bag before heading to school..."'
2584: '@rMaria puffed out her chest with an "uu-uu" as though this was the final proof that the witch existed.'
2585: '@rIf I said it out loud, Maria would probably be hurt again, so I didn''t, but...'
2586: '@r...I mean, you hear that kind of story everywhere.'
2587: '@rDepending on the place, it might be blamed on fairies or something.@k@rIt''s just that, on this island, they call it the witch.'
2588: '@rOf course, you would expect that walking around a vast, elegant mansion at night would be a little unsettling.'
2589: '@rIt''s an island devoid of people.@k Since the mansion is so drafty, walking around on the night of a thunderstorm would certainly be eerie.'
2590: 'Shannon@r@v15/10500110."In addition, some servants have also seen will-o''-the-wisps and glittering butterflies dancing around.@k@v15/10500111. ......Kanon-kun also said he saw something like that when he went patrolling one night."'
2591: 'Shannon@r@v15/10500112."And recently, the servants have been talking about strange footsteps inside the mansion near midnight.@k@v15/10500113. We have whispered together that BEATRICE-sama from the portrait sometimes makes herself invisible and walks through the mansion."'
2592: 'Shannon@r@v15/10500114."...It happened a long time ago,@k@v15/10500115. but I have also heard those kinds of footsteps while patrolling at night."'
2593: 'Battler@r@v10/10100507."......Whew.@k@v10/10100508. That''s scary..."'
2594: 'Shannon@r@v15/10500116."Ah, ...but,@k@v15/10500117. there''s nothing to be afraid of, you know?@k @v15/10500118.BEATRICE-sama is another ruler of this mansion separate from the Master.@k@v15/10500119. So, she won''t do anything bad, as long as you respect her and don''t act oddly afraid."'
2595: 'George@r@v07/10300278."However, she''s fearsome if you don''t respect her, right?"'
2596: 'Shannon@r@v15/10500120."...Yes.@k@v15/10500121. I heard that someone who quit just before I began working, after falling down the stairs and receiving a large injury to their back,@k@v15/10500122. had been speaking badly of BEATRICE-sama.@k@v15/10500123. Because of that, there was a rumor between the servants that BEATRICE-sama''s anger had been brought down upon this person..."'
2597: 'Maria@r@v13/10400309."Uu...@k@v13/10400310. Anger will definitely be brought down on Battler and Jessica...@k@v13/10400311. Uu..."'
2598: 'Battler@r@v10/10100509."I, I, I''m sorry!@k @v10/10100510.I don''t want her anger brought down upon me!@k @v10/10100511.I apologize, Maria.@k@v10/10100512. Of course, I also apologize to the witch.@k@v10/10100513. I''m sorry, BEATRICE-sama, please forgive an outsider''s nonsense."'
2599: 'Jessica@r@v04/10200288."I''ll apologize as well.@k@v04/10200289. I''m sorry, BEATRICE-sama.@k@v04/10200290. .........Will the witch be able to forgive us now?"'
2600: 'Maria@r@v13/10400312."...Uu.@k@v13/10400313. Don''t know.@k@v13/10400314. Witches are fickle, so they forgive when they forgive, and don''t when they don''t.@k@v13/10400315. Uu!"'
2601: 'George@r@v07/10300279."That''s no good...@k@|@y@v07/10300280. Maria-chan, isn''t there some kind of charm that could prevent Battler-kun and Jessica-chan from having BEATRICE-sama''s anger brought down upon them?@k@v07/10300281. Maybe something to ward off magic?"'
2602: '@rBy relying on Maria, who was proud of knowing the most about witches, George was trying to revive her self-esteem.'
2603: '@r......I was once again forced to admire his ability to comfort children.'
2604: '@rAfter crossing her arms and pondering seriously as to whether there was some charm capable of protecting Jessica and myself from the witch''s wrath,@k Maria began flipping through the pages of her handbook.'
2605: '@rI had thought it was just a simple scribbled diary,@k ......but it turned out that there were also many pages that looked like they had come from a book on black magic.'
2606: '@rShe was intently comparing several such pages, onto which had been copied what looked like magic circles.'
2607: '@r.........It looks like that black magic hobby wasn''t limited to Grandfather alone.'
2608: '@rPerhaps she had finished her research;@k@|@y she vigorously closed the notebook with a snap, threw it into her handbag, and began fishing through that bag''s contents.'
2609: '@rIt seemed that various jumbled up things were in there.'
2610: '@rFor a while, she continued to take out various pieces of junk—although they were probably important magical items to her—@kand repeatedly throw them back in, saying they were wrong.'
2611: '@rShe looked a little humorous, almost like Santa Claus deliberating over which present to give.'
2612: '@rFinally, it seemed that she had excavated what she was looking for.'
2613: '@rWith a face unimaginably brighter than the difficult expression she had worn until now, she stuck "them" out to Jessica and me.'
2614: 'Maria@r@v13/10400316."Uu!"'
2615: '@rAs I reached out to grab it, I noticed that it was a very cheap-looking charm.'
2616: '@rIt looked like a bracelet made from a plastic rosary,@k with a scorpion-motif medal attached.'
2617: '@rI mean, you often find cheap accessories that correspond to the constellations.'
2618: '@rIt felt like a gift that you might win in the crane game at an arcade.@k It really looked like something like that.'
2619: '@rThere were two.@k Probably one for me and one for Jessica.'
2620: '@r......However, considering the odd fact that there were two of them, they looked like cheap manufactured goods,@k and it was quite hard to think of them as magical items.'
2621: 'Jessica@r@v04/10200291."You''re giving these to me and Battler?"'
2622: 'Maria@r@v13/10400317."Uu!@k @v13/10400318.With these charms, even BEATRICE is no problem!@k @v13/10400319.Because the scorpion has the power to block magic!"'
2623: 'Battler@r@v10/10100514."Huh, really?@k @v10/10100515.Didn''t think scorpions could do that."'
2624: 'Maria@r@v13/10400320."Uu, Battler doesn''t believe!@k @v13/10400321.Uu-uu-uu!"'
2625: '@rI had inflamed Maria again because I said too much...'
2626: '@rMaria took out her notebook again, and turned and pointed to page after page,@k going on and on about how the scorpion had holy power, and had been drawn on magic-repelling magic circles since ancient times.'
2627: 'Shannon@r@v15/10500124."......Ah, I''ve heard about that from some of the other young servants.@k@v15/10500125. Something about how the scorpion is drawn as a magic-repelling symbol in sorcery..."'
2628: 'Jessica@r@v04/10200292."Huh, really...!"'
2629: 'Maria@r@v13/10400322."Uu!@k @v13/10400323.The scorpion protects against bad magic and disasters.@k@v13/10400324. And emerald brings peace to the heart.@k@v13/10400325. So it has double the effect!@k @v13/10400326.Uu!"'
2630: 'George@r@v07/10300282."It''s true.@k@v07/10300283. The scorpion is wrapping around an emerald, protecting it.@k@v07/10300284. I see, that seems very useful."'
2631: '@rI really wanted to make fun of this worthless-looking charm,@k but as I watched Maria explaining the charm with all of her heart, and realized that she had prepared them out of consideration for us,@k it felt as though, even if it were just a prize from an arcade, it would still be beneficial.'
2632: '@rMaterial quality isn''t what''s important about charms.@k It''s the strength of the feelings behind them.@k@rI''d like to think I have enough respect for myself not to make fun of those.'
2633: 'Battler@r@v10/10100516."Okay, thank you.@k@v10/10100517. I apologized to BEATRICE-sama, but, even in the worst case where I''m cursed, I''ll be safe now thanks to your charm.@k@v10/10100518. Right, Jessica?"'
2634: 'Jessica@r@v04/10200293."Yeah, that''s right!@k @v04/10200294.Thank you, Maria."'
2635: 'Maria@r@v13/10400327."Uu!@k @v13/10400328.Wear it on your arm when you want a peaceful heart.@k@v13/10400329. If you put it in your wallet, your money won''t go down!@k @v13/10400330.If you hang it from a doorknob, bad things can''t get in!@k @v13/10400331.A really useful charm!"'
2636: 'Shannon@r@v15/10500126."What an incredible effect.@k@v15/10500127. If it is a charm that Maria-sama can recommend with confidence, I am sure it will be reliable."'
2637: '@rAs Shannon-chan tapped her hands together lightly, Maria stuck out her chest.'
2638: '@rShe was completely cheered up again.'
2639: '@rIf it would keep her in this good of a mood, it would probably be worth it to let Maria lead the discussion for a while longer.'
2640: '@rWhen you think about it, she hadn''t shared in our excitement when we talked about the gold''s hidden location, so I think she had gotten a little bored.'
2641: '@rWhile eating the cookies Kumasawa-san had baked, Jessica and I asked Maria this and that about black magic.'
2642: '@rMaria happily chatted away in response to our questions.'
2643: '@rFor each one, George-aniki and Shannon-chan would act surprised and agree with everything she said.'
2644: '@rThe color of the clouds in the sky grew progressively heavier, but the cousins really enjoyed communicating freely after one year of separation...'
2645: 'George@r@v07/10300285."......Hm.@k@v07/10300286. Did I just feel a drop on my forehead?"'
2646: 'Battler@r@v10/10100519."Huh?@k @v10/10100520.You might have."'
2647: '@rAs George-aniki rubbed his forehead, he looked up at the sky.'
2648: '@rConsidering the color of the sky and the dampness of the air, raindrops could easily have started falling down at any moment.'
2649: '@rIt also seemed like the wind had gotten a little stronger.'
2650: 'Maria@r@v13/10400332."Uu?@k @v13/10400333.I didn''t feel a drop.@k@v13/10400334. I''m the only one.@k@v13/10400335. Uu!"'
2651: 'Battler@r@v10/10100521."Calm down, neither did I.@k@v10/10100522. Anyway, I''m sure that it''ll rain so much tonight that everyone will get the same amount of raindrops."'
2652: 'George@r@v07/10300287."That''s right.@k@v07/10300288. Maybe we should head back soon...?"'
2653: '@rShannon-chan looked down at her watch.@k@rIt may already be well into the evening.'
2654: 'Jessica@r@v04/10200295."Time to get back to work already?"'
2655: 'Shannon@r@v15/10500128."Yes.@k@v15/10500129. ...I enjoyed this time I spent together with you all.@k@v15/10500130. Thank you very much."'
2656: 'George@r@v07/10300289."Tell Kumasawa-san thanks for the cookies.@k@v07/10300290. Alright everyone, help out with the cleanup."'
2657: '@rShannon-chan declined our help, saying that this was a servant''s job,@k but picking up a dropped fork before the waitress has to is like my purpose in life.'
2658: '@rWe folded up the blanket, gathered up the trash, and helped clean everything up.'
2659: 'Maria@r@v13/10400336."Uu!@k @v13/10400337.The trash is getting awayyy!@k @v13/10400338.Uu-uu!!"'
2660: 'Battler@r@v10/10100523."Oh no it isn''t, I''ll grab it before you!"'
2661: 'Maria@r@v13/10400339."Uu!!@k @v13/10400340.I''m going to get it!@k @v13/10400341.Uu-uu-uu!"'
2662: 'Jessica@r@v04/10200296."Mariaa!@k @v04/10200297.Don''t get your shoes wet, you''ll get in trouble!"'
2663: '@rTo Maria, chasing after some trash that the strong winds had sent flying was just like an extension of our playtime.'
2664: '@rBy the time we finished cleaning up, the wind had started blowing very strongly.'
2665: '@rIt looked like a good chance to head back.'
2666: 'Shannon@r@v15/10500131."You all really helped me out.@k@v15/10500132. Thank you very much."'
2667: 'George@r@v07/10300291."...It really looks like you''re out of time.@k@v07/10300292. It''s alright if you head back first."'
2668: '@rGeorge-aniki perceived from her hurried appearance that very little of her free time was left.'
2669: 'Jessica@r@v04/10200298."Genji-san is very rigorous about time.@k@v04/10200299. If you aren''t at the right place at the right time, he can be very strict."'
2670: 'George@r@v07/10300293."We''ll see you later.@k@v07/10300294. Do your best with your work."'
2671: 'Shannon@r@v15/10500133."Ye-yes!@k @v15/10500134.......Then if you will excuse me."'
2672: '@rAfter making a respectful bow, Shannon-chan hurried off in the direction of the rose garden.'
2673: 'Battler@r@v10/10100524."Okay, let''s head back to the guesthouse.@k@v10/10100525. We can watch TV or something and relax a little."'
2674: 'Maria@r@v13/10400342."Uu!@k @v13/10400343.Watch TV!@k @v13/10400344.Watch TV, uu!"'
2675: 'Jessica@r@v04/10200300."Then it''s decided.@k@v04/10200301. Let''s all head back and watch TV together."'
2676: '@rEven Maria, who was still not tired of playing, agreed when she thought about watching TV.'
2677: '@rWe headed up the gentle stairs and returned to the rose garden.'
2678: '@rThe wind had become very strong, and roses shook throughout the garden like ripples on water.'
2679: '@rThis might be our last chance to see these beautiful roses.@k@rTonight''s typhoon is sure to ruin them...'
2680: 'Battler@r@v10/10100526."These roses might be done in by tonight''s winds."'
2681: 'Jessica@r@v04/10200302."Yeah.@k@v04/10200303. I''d say they were lucky, though.@k @v04/10200304.After all, they got to welcome all of you before the typhoon."'
2682: 'George@r@v07/10300295."A flower will always lose its petals at some point.@k@v07/10300296. However, because of that, we can admire them even more when they are in bloom."'
2683: 'Battler@r@v10/10100527."That''s right.@k@v10/10100528. ...Maria, burn this image into your eyes.@k@v10/10100529. At this moment, they are the best roses of the year."'
2684: 'Maria@r@v13/10400345."Uu.@k@v13/10400346. Burned into eyes."'
2685: '@rRight then, Maria suddenly clapped her hands.@k@rIt looked like she had remembered something.'
2686: 'Maria@r@v13/10400347."......My rose...@k@v13/10400348. The typhoon will send it flying.@k@v13/10400349. ......Uu!"'
2687: 'Battler@r@v10/10100530."Oh, you mean that unhealthy rose George-aniki marked with a ribbon?"'
2688: '@rIt seemed that Maria remembered where the rose was.'
2689: '@rShe ran at full speed.@k The rest of us followed her.'
2690: 'Maria@r@v13/10400350."............Uu?@k @v13/10400351.Uu."'
2691: 'Jessica@r@v04/10200305."Where was that again...?@k @v04/10200306.I''m sure it was somewhere around here."'
2692: '@rWe searched everywhere around that area, but, after all, it was only a single flower amongst all of these roses.'
2693: '@rEven though we knew it was somewhere close by, it wasn''t proving easy to find.'
2694: '@rThe winds that made up the front lines of the typhoon were making the roses throughout the garden undulate.@k It was almost like it was teasing us by making the location of Maria''s rose impossible to find...'
2695: 'George@r@v07/10300297."Maybe it wasn''t here...@k@v07/10300298. Let''s try spreading out a bit in our search."'
2696: 'Battler@r@v10/10100531."Sounds good.@k@v10/10100532. Let''s go for strength in numbers."'
2697: 'Battler@r@v10/10100533.".........Hm?@k @v10/10100534.What''s up, Maria?"'
2698: '@rAs we made to split up and search, Maria tugged on my jacket with an unhappy face.'
2699: '@r......It felt like her intention was to stop us from going to another place.'
2700: 'Battler@r@v10/10100535."What is it, what happened?"'
2701: 'Maria@r@v13/10400352."......Uu.@k@v13/10400353. My rose is here.@k@v13/10400354. It''s here...!"'
2702: 'Jessica@r@v04/10200307."But it''s actually not, is it...?@k @v04/10200308.Maybe it was on the other side of the flower bed.@k@v04/10200309. If we all look, we''ll find it fast, right?"'
2703: 'Maria@r@v13/10400355."Uu!!@k @v13/10400356.It''s here!@k @v13/10400357.My rose is here!!@k @v13/10400358.Look for it!@k @|@y@v13/10400359.Look—for—it!!@k @|@y@v13/10400360.Uuu!!"'
2704: '@rMaria stomped her feet in irritation.'
2705: '@r......She was pointing at the spot, saying it was definitely there, yet it actually wasn''t.'
2706: '@rAnd yet, if we went to go search elsewhere, she got mad.'
2707: '@r...We were at a loss for what to do.'
2708: '@rFor a while, we would have to stay with Maria,@k and pretend to search through this rose thicket.'
2709: 'Maria@r@v13/10400361."......Uu.@k@v13/10400362. Uu...!@k @v13/10400363.Not here.@k@v13/10400364. ......Not here!@k @v13/10400365.Not here!@k @v13/10400366.Uuu!!"@|@y'
2710: '@rMaybe she''s saying that it should be here but isn''t.@k@rMaria became increasingly ill-tempered...'
2711: 'Battler@r@v10/10100536."...Oh man,@k@v10/10100537. Maria is really losing her temper."'
2712: 'Jessica@r@v04/10200310."Maria sometimes starts to really care about really pointless things.@k@v04/10200311. If she gets what she wants, that''s alright, but..."'
2713: 'George@r@v07/10300299."You can''t find something that isn''t there...@k@v07/10300300. That''s not good..."'
2714: '@rJust as we were starting to despair for a way out of the situation,@k Maria shouted out loudly.'
2715: 'Maria@r@v13/10400367."Mamaa!!@k @v13/10400368.Uu-uu!!"'
2716: '@rIn the direction she was waving her hand, Auntie Rosa''s figure was visible.'
2717: '@rMaybe she wanted to look at the garden one more time before the typhoon came,@k or maybe she had some business at the guesthouse.'
2718: '@rAuntie Rosa was coming from the mansion.@k@rShe quickly noticed her daughter''s voice and came over.'
2719: 'Rosa@r@v12/11400111."Oh my, what happened, everyone?@k@v12/11400112. Are you looking for something?"'
2720: 'Maria@r@v13/10400369."Look for iiit!@k @v13/10400370.Mama, you look for my rose too!@k @v13/10400371.Uu-uu-uu!!"'
2721: 'Rosa@r@v12/11400113."Your rose?"'
2722: 'George@r@v07/10300301."We found an unhealthy rose around here and marked it."'
2723: 'Battler@r@v10/10100538."We tied a candy wrapper or something around it, tight.@k@v10/10100539. ...But Maria, if I remember correctly, it was growing right in front and really stood out, didn''t it?@k @v10/10100540.Unless it grew legs and ran off somewhere, it must''ve been somewhere else.@k@v10/10100541. Aren''t you just remembering it wrong?"'
2724: 'Maria@r@v13/10400372."Uu!!@k @v13/10400373.It is here!!@k @v13/10400374.It—is—here!!@|@y@k @v13/10400375.Battler doesn''t believe!@k @v13/10400376.Uu-uu!!"'
2725: 'Rosa@r@v12/11400114."For the umpteenth time, will you please stop that "uu-uu" nonsense?!@k @v12/11400115.Mama will look for it, so stay quiet!!"'
2726: '@rI was a little surprised to see Auntie Rosa, who I had only ever seen as gentle, get angry.'
2727: '@rAuntie Rosa began searching as well, so we went along with her for the time being,@k but we were already more than sure that it wasn''t around here.'
2728: '@r...And so, Auntie Rosa also realized, very quickly, that it wasn''t here.'
2729: 'Rosa@r@v12/11400116."The rose isn''t here.@k@v12/11400117. Did you mistake this place for somewhere else?@k @v12/11400118.There are so many roses around—"'
2730: 'Maria@r@v13/10400377."Uu!!@k @v13/10400378.Uuuu!!!@k @v13/10400379.That''s wrong!!@|@y@k @v13/10400380.It is here!!@k @v13/10400381.Mama doesn''t believe!@k @v13/10400382.Uu-uu-uu!!!"@|@y'
2731: 'Rosa@r@v12/11400119."I do believe you, that''s why I''m searching!@k @v12/11400120.But it isn''t here!"'
2732: 'Maria@r@v13/10400383."Uu-uu!!@k @v13/10400384.But it is here!!@k @v13/10400385.It is here but it isn''t!!@k @v13/10400386.Uu-uu-uu!!"'
2733: 'Rosa@r@v12/11400121."Then someone must have ripped it out!@k @v12/11400122.Just stop whining like that!!"'
2734: 'Maria@r@v13/10400387."Uu-uu-uu!!@k @v13/10400388.Who ripped out my rose, who?!!@|@y@k @v13/10400389.Give it back, give it back!!@|@y@k @v13/10400390.Uu-uu!!@k @v13/10400391.Uu-uu-uu-uu!!!"'
2735: 'Rosa@r@v12/11400123."How should I know!!@k @v12/11400124.Stop it, stop that whining!!"'
2736: '@rAuntie Rosa slapped Maria''s left cheek with her palm.@k@rFor that instant, Maria was shocked into silence.'
2737: '@rOf course, it was only for an instant.@k@rWhen Maria realized that her wish was being rejected before it could be fulfilled, she started yelling with an increasingly louder voice.'
2738: 'Maria@r@v13/10400392."Uu-uu!!@k @v13/10400393.Uu-uu-uu!!@k @v13/10400394.My rose!@k @v13/10400395.My rose!!@k @v13/10400396.Uu-uu-uu-uu-uu-uu-uu!!!"'
2739: 'Rosa@r@v12/11400125."Didn''t I tell you to stop that weird habit!!@k @v12/11400126.That''s why all of the kids in your class make fun of you!!@k @v12/11400127.Cut it out!!"'
2740: '@rOnce again, her palm slapped Maria''s cheek.'
2741: '@rThis time she didn''t go silent.@k@rShe choked as she started crying, and began to bawl in an increasingly louder voice...'
2742: '@rAuntie Rosa was clearly irritated, and lifted her hand once more to try and shut her daughter up...'
2743: 'Battler@r@v10/10100542_b."A-Auntie Rosa...@k@v10/10100543. Now, now...she''s just a little kid...there''s no reason to get so serious...ihihi."'
2744: '@rI attempted to intervene with a forced smile and my hands clasped together,@k ...but the deadly serious look I was thrown by Auntie Rosa taught me quickly that I shouldn''t butt in.'
2745: 'Rosa@r@v12/11400128."I''m sorry, would you all return to your room for a little while?@k @v12/11400129.Your auntie needs to have a little talk with Maria."'
2746: 'Maria@r@v13/10400397."Uu-uu-uu!!@k @v13/10400398.Nobody believes in my rose!!@k @v13/10400399.Even though it was here!!@k @v13/10400400.Uu-uu!!@k @v13/10400401.Look for it!!@k @v13/10400402.Look—for—it!!@k @v13/10400403.Here, it was here!!@k @v13/10400404.Uu-uu-uu-uu!!!"'
2747: 'Rosa@r@v12/11400130."But it''s not here!!@k @v12/11400131.Then you must be confusing it with somewhere else, mustn''t you?!"'
2748: 'Maria@r@v13/10400405."Uu-uu-uu-uu!!@k @v13/10400406.It is here!!@k @v13/10400407.It is definitely here!!@k @v13/10400408.Uu-uu-uu!!"'
2749: 'Rosa@r@v12/11400132."Then it has disappeared!!@k @v12/11400133.Give it up!!"'
2750: 'Maria@r@v13/10400409."Why?!@k @v13/10400410.Why did my rose disappear?@k @v13/10400411.Why, why?!@k @v13/10400412.Uu-uu-uu!!!"'
2751: 'Rosa@r@v12/11400134."I don''t know that!!@k @v12/11400135.So stop saying "uu-uu"!!"'
2752: '@rAuntie Rosa once again raised her hand and, overrun by emotions, slapped Maria''s cheek.@k@rIt was so strong, it knocked Maria over.'
2753: 'Battler@r@v10/10100544."H-hey...Auntie Rosa,@k@v10/10100545. even if she is your daughter, you shouldn''t be violent like that..."'
2754: '@rI stepped between them to protect Maria, who was still on the ground, crying "uu-uu".'
2755: '@r......I know that problems between parent and child are none of my business as an outsider.@k@rBut I wasn''t brought up to just silently observe something like this...'
2756: 'Rosa@r@v12/11400136."Don''t you think it''s weird, Battler-kun?@k @v12/11400137.Do you have any girls at your school that mutter "uu-uu"?"'
2757: 'Battler@r@v10/10100546."Well, I am in high school...@k@v10/10100547. But for an elementary schooler, I think saying "uu-uu" is pretty cute..."'
2758: 'Rosa@r@v12/11400138."Cute?@k @v12/11400139.Saying "uu-uu" is cute?@k @v12/11400140.Cute?!"'
2759: '@rIt seemed that my reckless words had brought Auntie Rosa''s wrath down upon me.@k@rShe grabbed my collar with a terrifying expression...'
2760: 'Rosa@r@v12/11400141."Don''t say such nonsense!!@k @v12/11400142.Do you know how old Maria is?@k @v12/11400143.She''s nine years old!@|@y@k @v12/11400144.She''s a fourth grader, you know?!@k @v12/11400145.She''s not a kindergartner!@k @v12/11400146.And even so, she still says "uu-uu" during class!!"'
2761: 'Rosa@r@v12/11400147."Do you understand?!@|@y@k @v12/11400148.This kid, do you know what they say about her when they bully her?!@k @v12/11400149.Thanks to this weird habit, she still hasn''t made even a single friend!@k @v12/11400150.Don''t turn your eyes from reality and recklessly call Maria cute!!@k @v12/11400151.Think much, much more seriously about this kid''s future!!!"@|@y'
2762: 'Maria@r@v13/10400413."Uu-uu-uu-uu-uu!!!@k @v13/10400414.Uu-uu-uu-uu-uu-uu!!!"'
2763: 'Rosa@r@v12/11400152."I told you, stop saying "uu-uu"!!!@|@y@k @v12/11400153.Didn''t I tell you to stop it!!"'
2764: '@rAuntie Rosa struck Maria''s quivering head from which an increasingly unsatisfied voice was rising.'
2765: '@rI tried to stop her, but she thrust me away...'
2766: '@rMy back collided with George-aniki.'
2767: 'George@r@v07/10300302."......A long time ago, Auntie Rosa also thought of it as nothing more than one of Maria-chan''s baby words...@k@v07/10300303.but she is now midway through elementary school, so the fact that it hasn''t been fixed has bothered her a lot recently..."'
2768: 'Battler@r@v10/10100548."It''s not like it matters what kind of words she uses..."'
2769: 'George@r@v07/10300304."You can''t become a proper member of society like that.@k@v07/10300305. ...So, even though it''s not a pleasant scene to watch,@k@v07/10300306. ......this is a problem between mother and child."'
2770: 'Jessica@r@v04/10200312.".........Well,@v04/10200313. my mom''s always giving me hell about how I speak, too."'
2771: '@rIf you look at it that way, maybe an outsider shouldn''t interfere with this, even though it''s painful to watch...'
2772: 'George@r@v07/10300307."Battler-kun, didn''t you ever have any bad habits as a kid that you couldn''t fix and got you in trouble?"'
2773: 'Battler@r@v10/10100549."......Well, one or two.@k@v10/10100550. On Parents'' Day, I got a huge telling-off in front of everyone, and it was so embarrassing, I couldn''t stand it."'
2774: 'George@r@v07/10300308."Well then, you can understand Maria-chan''s feelings right now.@k@v07/10300309. ......I''m sure she doesn''t want us to be here now.@k@v07/10300310. ......Do you understand as well, Jessica-chan?"'
2775: 'Jessica@r@v04/10200314."............I don''t think anyone likes to be seen when they''re being punished."'
2776: 'George@r@v07/10300311."Let''s go.@k@v07/10300312. Let''s return to the guesthouse.@k@v07/10300313. Then, after Maria-chan comes back,@k@v07/10300314. let''s welcome her as if nothing happened.@k@v07/10300315. ...That''s...probably for the best, isn''t it?"'
2777: '@rWe thought that George-aniki''s point was probably correct,@k ...and if we could use that correct-sounding reason to justify our retreat from this painful scene, that was probably enough for us.'
2778: '@rJessica and I nodded at George-aniki, and we all left.'
2779: '@rWe called towards Maria that we were going to head to the guesthouse,@k but since it didn''t seem to reach her ears, we felt guilty and shameless even saying it...'
2780: 'Rosa@r@v12/11400154."In that case, look by yourself as much as you want!@k @v12/11400155.Mama doesn''t care!!"'
2781: 'Maria@r@v13/10400415."Uu!!!@k @v13/10400416.Look for it!@k @v13/10400417.I''ll look for it by myself!!@k @v13/10400418.Look for it even if Mama doesn''t care!@k @v13/10400419.Uu-uu-uu-uu-uu!!"'
2782: 'Rosa@r@v12/11400156."Have it your way!!"'
2783: '@rAfter blasting her with those last few words, Rosa spun on her heels and quickly returned to the mansion.'
2784: '@rMaria probably viewed that as a cold, hurtful gesture.'
2785: '@rBut from Rosa''s perspective, that was not her intention.'
2786: '@r...It was because the hand which she had so emotionally struck Maria''s cheek with was still numb.'
2787: '@r...It was because, if she stayed there screaming, she might again be taken over by her emotions, and continue slapping her daughter''s cheek over and over.'
2788: '@rAfter Rosa left, only Maria was left in the rose garden, all alone.'
2789: '@rThe wind began to blow stronger and stronger, and every once in a while, a raindrop would fall on her forehead.'
2790: '@r...However, Maria couldn''t leave that place.@k@rNot until she found that poor, withering rose.'
2791: '@rIt had definitely been there.@k ......And yet,@w500. it wasn''t there.@k@rEven though she knew the place, and even though this was it,@w500. it wasn''t there.'
2792: '@rMaria, while bitterly staring at the place it was supposed to be, thought frantically.'
2793: '@rMaybe the angle I''m looking from is wrong.@k@rMaybe the height I''m looking from is wrong.'
2794: '@r......While gazing at a single point,@k Maria repeatedly changed her position and continued to stare.'
2795: '@rThe wind was getting increasingly stronger......'
2796: '@rBut Maria kept on looking for that rose in front of the flower bed...'
2797: '@r.........Kinzo noticed the sound of the raindrops beating on the window.@k@rIt had finally started to rain.@k@rIt had begun later than the weather report had predicted.'
2798: '@rKinzo, as if being summoned by the sound of the rain, approached the window.@k@rThe sound of the rain is a sound of silence.'
2799: '@rThat sound feels quieter than any silence,@k and makes humans remember that, in the end, they are alone from when they are born to when they die.'
2800: 'Kinzo@r@v01/11500261."......You''re late, BEATRICE."'
2801: '@rWere those words directed at the rainy sky...?@k@rNo one could be seen in the direction of Kinzo''s gaze.'
2802: 'Kinzo@r@v01/11500262."......So, shall we begin?@k@v01/11500263. Our banquet of miracles.@k@v01/11500264. ......In this very moment, this island has been cut off from the world.@k@v01/11500265. Now there are none who can interrupt my ritual."'
2803: 'Kinzo@r@v01/11500266."There are many fitting sacrifices for you.@k@v01/11500267. Four of my children.@k@v01/11500268. Three of their companions.@k@v01/11500269. Four of my grandchildren.@k@v01/11500270. Me and my guests and my servants!@k @v01/11500271.You may eat up as many as you please."'
2804: 'Kinzo@r@v01/11500272."The key of fate will select the sacrifices in accordance with the Demons'' Roulette.@k@v01/11500273. If that roulette chooses me, even I will become your sacrifice.@k@v01/11500274. ......However, because of that...@k@v01/11500275.because I will bet on that madness,@v01/11500276. ......I will definitely create a grand miracle."'
2805: 'Kinzo@r@v01/11500277."...Come, devour as much as you wish...!!@k @v01/11500278.I will overcome that roulette.@k@v01/11500279. Yes, I''ll put everything on the line.@k@v01/11500280. First, I will return the headship of the Ushiromiya family.@k@v01/11500281. Take it!!"'
2806: '@rAs Kinzo violently opened the window, he ripped the golden ring from his finger, and forcefully threw it away.'
2807: '@r......At that moment, thunder resounded, giving the illusion that the lightning had accepted the ring.'
2808: 'Kinzo@r@v01/11500282."And.........when you are resurrected,@k@v01/11500283. it will be me who stands there.@k@v01/11500284. I will live until the end and watch over you as you awaken."'
2809: 'Kinzo@r@v01/11500285.".........Now come, BEATRICE...@k@v01/11500286. Welcome to my banquet...!@k @v01/11500287.In exchange for all that I have created, show me a miracle one final time.@k@v01/11500288. ......Oooooohh,@v01/11500289. ...BEATRICEEEEE............"'