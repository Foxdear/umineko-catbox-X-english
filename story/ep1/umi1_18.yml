7502: 'BEATRICE@r@v27/90700088."...What sort of tea should I prepare next?@k @v27/90700089.You have free choice of any brand that ever was throughout the ages."'
7503: '@r@v28/92100001."......Dried plum tea.@k@v28/92100002. ......Those dried plums that go for 200 yen a pack."'
7504: 'BEATRICE@r@v27/90700090."*cackle*cackle*...!@k @v27/90700091....For a thousand years I have been fond of black tea, but I did not know of such a thing.@k@v27/90700092. ...I will never tire of living in this world."'
7505: '@r@v28/92100003."...............Beato.@k@v28/92100004. You don''t have to display such hostility.@k@v28/92100005. ...I am just a wandering witch.@k@v28/92100006. I didn''t come with the intention of violating the rules of your territory."'
7506: 'BEATRICE@r@v27/90700093."...*cackle*cackle*, there is not even a sliver of hostility.@k@|@y@v27/90700094. ...I am just terribly concerned about seeing that the legendary witch, Lady BERNKASTEL, is well attended to."'
7507: 'BERNKASTEL@r@v28/92100007.".........You misunderstand.@k@v28/92100008. I am powerless.@k@v28/92100009. Before a witch such as you, with the dreadful power to kill a person a hundred times over, I am completely powerless."'
7508: 'BEATRICE@r@v27/90700095."That a "powerless" witch like you possesses a power that none can approach is what is truly terrifying.@k@v27/90700096. After all, you fended off that Great Witch, Lady LAMBDADELTA, as a lone piece."'
7509: 'BERNKASTEL@r@v28/92100010."......I only won an endurance contest.@k@v28/92100011. She simply got tired."'
7510: 'BEATRICE@r@v27/90700097."That is not what Lady LAMBDADELTA said, though.@k @v27/90700098....*cackle*cackle*cackle*, too much humility can be unseemly, Lady BERNKASTEL."'
7511: 'BERNKASTEL@r@v28/92100012."......That girl has a dreadful power.@k@v28/92100013. ............The power to kill a person "without fail".@k@v28/92100014. However, there is no such thing as "without fail" in this world.@k@v28/92100015. Just as, no matter how many times you divide 1, you can never make it 0."'
7512: 'BERNKASTEL@r@v28/92100016."That girl has the power to bring that closer and closer to "virtually zero", and give rise to a "virtually absolute certainty".@k@v28/92100017. ......I hope I never have to fight such a terrifying witch again."'
7513: 'BEATRICE@r@v27/90700099."However, you have a power that manifests without fail "except for zero".@k@v27/90700100. ......Although you say there is no such thing as "without fail" in this world, you possess an infallible power yourself.@k@v27/90700101. ......How very terrifying, *cackle*cackle*cackle*...!"'
7514: 'BERNKASTEL@r@v28/92100018."......The power to kill a person "endlessly"...@k@v28/92100019. ...I think you''re the more terrifying one."'
7515: 'BEATRICE@r@v27/90700102."Such jests.@k@v27/90700103. ......From your point of view, mine is but a trifling power.@k@v27/90700104. The phrase "flattery will get you nowhere" was made for this situation."'
7516: 'BERNKASTEL@r@v28/92100020."......Call it payment for my stay here.@k@v28/92100021. ...I am a fleeing traveler who crosses the fragments, continually running from boredom.@k@v28/92100022. ......I simply came around because I''d heard that you''d started something interesting.@k@v28/92100023. Rest assured, I will leave of my own accord as soon as you start to bore me."'
7517: 'BEATRICE@r@v27/90700105."*cackle*cackle*...!@k @v27/90700106.I am deeply and humbly delighted to have the great Lady BERNKASTEL as an observer.@k @v27/90700107.*cackle*cackle*!@k @v27/90700108.And so, your impression?"'
7518: 'BERNKASTEL@r@v28/92100024."............LAMBDADELTA is terrifying because of her cruelty; however, she was a girl I could understand.@k@v28/92100025. ...You do seem to possess affection, but I can''t understand you at all.@k@v28/92100026. That''s why you''re much more terrifying than her."'
7519: 'BEATRICE@r@v27/90700109."*cackle*cackle*cackle*...!@k @v27/90700110.I am fickle by nature.@k@v27/90700111. Do forgive me.@k@|@y@v27/90700112. ...Besides, I believe you also enjoy trusting your fate to the roll of fickle dice—is that not so, Lady BERNKASTEL?"'
7520: 'BERNKASTEL@r@v28/92100027."......When I roll the dice, I have a roll I clearly want to get.@k@v28/92100028. Unlike you.@k@v28/92100029. You, on the other hand, anticipate all outcomes."'
7521: 'BERNKASTEL@r@v28/92100030."And, whatever the roll might be, you''re never disappointed.@k@v28/92100031. Whatever roll the dice show you, you are satisfied "without fail".@k@v28/92100032. .........In that sense, you far surpass me."'
7522: 'BERNKASTEL@r@v28/92100033.".........You''re one I really don''t want to fight with.@k@v28/92100034. Inside of you, there''s nothing but zero.@k@v28/92100035. That''s why I can''t win against you with my power.@k@v28/92100036. ...The worst matchup.@k@v28/92100037. ......Perhaps LAMBDADELTA, on the other hand, has a good matchup against you.@k@v28/92100038. Since she would likely be able to kill your "endlessness"."'
7523: 'BEATRICE@r@v27/90700113."*cackle*cackle*, *cackle*cackle*cackle*!@k @v27/90700114.......Truly, tea is best drunk in the company of a witch.@k@v27/90700115. It''s never boring.@k@v27/90700116. *cackle*cackle*!"'
7524: 'BERNKASTEL@r@v28/92100039."......Good to hear.@k@v28/92100040. Boredom is the sole poison that can kill me.@k@v28/92100041. ......So, don''t kill me, alright?@k @v28/92100042.Lady BEATRICE, Endless Witch."'
7525: 'BEATRICE@r@v27/90700117."If such is your wish, I shall show you an even better time."'
7526: 'BEATRICE@r@v27/90700118."......In that case, wouldn''t it be best if I brought the next chessboard in right away?@k @v27/90700119.It seems that the next tale would do more for you than a refill of tea."'
7527: 'BERNKASTEL@r@v28/92100043."................................."'
7528: 'BEATRICE@r@v27/90700120."Just wait for a moment.@k@v27/90700121. ......*cackle*cackle*!"'
7529: 'BERNKASTEL@r@v28/92100044.............Something troublesome seems to have taken a liking to you.'
7530: 'BERNKASTEL@r@v28/92100045.I''d really like to lend you my power, but as you just heard, that girl''s power and mine have a very bad matchup.@k@v28/92100046. Unfortunately for you.'
7531: 'BERNKASTEL@r@v28/92100047.But you really are pitiful, so I''ll help you out just a bit.'
7532: 'BERNKASTEL@r@v28/92100048.First of all, about that girl.'
7533: 'BERNKASTEL@r@v28/92100049.She does have an existence that goes by the name of BEATRICE, but that doesn''t necessarily mean that she is "a woman with an individual body".'
7534: 'BERNKASTEL@r@v28/92100050.Do you understand what I mean?@k @v28/92100051.In other words, she''s not some Human.@k@v28/92100052. Her existence is a personification of the rules of this world.'
7535: 'BERNKASTEL@r@v28/92100053.To beat her, you have to expose the rules of this world and unravel them.'
7536: 'BERNKASTEL@r@v28/92100054.This can be likened to learning the rules of chess by watching a few games.'
7537: 'BERNKASTEL@r@v28/92100055.First, take a good look over the chessboard.@k@r@v28/92100056.And notice the movements and roles of the pieces.@k@r@v28/92100057.Then, look for the conditions required to win at her game.'
7538: 'BERNKASTEL@r@v28/92100058.When you''ve managed to reveal all of these things, her heart will be exposed.@k@r@v28/92100059.After that, you can rip it apart or crush it as you please.'
7539: 'BERNKASTEL@r@v28/92100060.......I am being quite generous.@k@v28/92100061. Back when I was once human, it took me a hundred years to realize even this much.'
7540: 'BERNKASTEL@r@v28/92100062.This is my meager farewell gift to you, the pitiful one captured by Beato. It is like a single spoon.'
7541: 'BERNKASTEL@r@v28/92100063.A spoon can be used for more than just drinking soup.@k@r@v28/92100064.You can use it to dig through the prison you''re locked in, or as a weapon to gouge the witch''s eyes out.'
7542: 'BERNKASTEL@r@v28/92100065.......Of course, you can also use the spoon to continually sip the watery soup inside your eternal prison.'
7543: 'BERNKASTEL@r@v28/92100066.......Don''t get the wrong idea—I have no intention of becoming your ally.'
7544: 'BERNKASTEL@r@v28/92100067.I do feel empathy for you, but I won''t help you.@k@r@v28/92100068....It''s like how someone sitting in front of a television cannot reach the characters on screen no matter how much they yell at them.'
7545: 'BERNKASTEL@r@v28/92100069.@a1666.THAT''S HOW YOU CAN TELL I AM A WITCH,@rYOU SEE?'
7546: 'BERNKASTEL@r@v28/92100070.I intend to enjoy the endless tales that Beato is going to weave until I tire of them.@k@v28/92100071. But I''m sure that alone won''t hold my interest.'
7547: 'BERNKASTEL@r@v28/92100072.......That''s why I''ll lend you my power.@k@v28/92100073. It''s all so that I don''t get tired of this.'
7548: 'BERNKASTEL@r@v28/92100074.I am the cruelest witch in the world.@k@r@v28/92100075.No matter who the opponent may be, I''ll absolutely make them surrender.'
7549: 'BERNKASTEL@r@v28/92100076....Even if that''s BEATRICE, the Endless Witch...'
7550: 'BERNKASTEL@r@v28/92100077.You are my game piece.@k@v28/92100078. Give it your best shot.@k@r@v28/92100079.I''ll give you advice sometimes, out of her sight.'
7551: 'BERNKASTEL@r@v28/92100080.Don''t bore me, okay......?'
7552: 'BERNKASTEL@r@v28/92100081.*giggle*giggle*giggle*......'