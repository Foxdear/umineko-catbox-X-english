3870: '@rShannon entered the entrance hall to the mansion with a tottering gait.'
3871: '@rHer chest was filled almost to bursting point with a mixture of exaltation and uncertainty that she couldn''t easily describe.'
3872: '@rAfter stopping for a second in front of the servant room to take a deep breath and calm her heart, she opened the door.'
3873: '@rInside, Gohda, who had been ordered to take the midnight shift at the mansion tonight, was absorbed in an old worn-out crossword puzzle magazine.'
3874: '@rHe looked up for an instant to see whether one of the family had come, but when he realized that it was a fellow servant, he returned to his puzzle as if nothing had happened.'
3875: 'Shannon@r@v15/10500238."......Umm,@v15/10500239. ...I was told by Genji-sama to help you."'
3876: 'Gohda@r@v17/11700076."Ah, really... That will be useful.@k@v17/11700077. I was just about to go make the rounds to close up the mansion, but I was in two minds whether I should leave this place empty.@k@v17/11700078. After all, the meeting Krauss-sama and the others are conducting appears as though it will continue for quite some time.@k@v17/11700079. They might order some tea at any time."'
3877: 'Shannon@r@v15/10500240."That''s true...@k@v15/10500241. Then, what shall we do...? Should I remain here while—"'
3878: 'Gohda@r@v17/11700080."In that case, Shannon-san, sorry, but would you please make the rounds around the mansion?@k@v17/11700081. I will stay here, awaiting the family''s orders."'
3879: 'Shannon@r@v15/10500242."Ye-......yes..."'
3880: '@r...Shannon felt a twinge of annoyance.'
3881: '@rDespite the fact that she had come here to help out as a favor, she was being forced to do the job of the person actually on duty as though it were natural.'
3882: '@rFurthermore, after one-sidedly forcing that task on her, Gohda had once again gone back to his magazine and had become immersed in his crossword puzzle.'
3883: '@rFor the time being, as a sign of respect for her elder, Shannon bowed her head, and she left the room to make the rounds.'
3884: '@rGetting a little angry had enabled her to bring the airy sensation she had been feeling until now under control a bit.'
3885: '@rBesides, she couldn''t show this kind of face to Genji and Kanon.@k@rUntil her heart was able to calm down, she wanted a little time to herself, and maybe going around the mansion wasn''t such a bad way to do that...'
3886: '@rFrom the dining hall, she began to hear the tumultuous voices of the family''s discussion.'
3887: '@rSomeone would speak at great length, and would then be opposed by someone else.@k That rebuttal would continue in a very long, drawn-out fashion, until opposed by yet another person.'
3888: '@rThat kept on repeating.@k@rIt was as though their displeasure was seeping out through their voices.'
3889: '@rShe had been told to go to the guesthouse, so it would be bad if she was discovered by Krauss.'
3890: '@rThinking that, Shannon quick-footedly slipped by the entrance to the dining hall.'
3891: '@rThen, inside the mansion controlled by darkness, she began to check that the house was all closed up, following a prearranged route.'
3892: '@rShe walked down the hall, checking that each window was closed.'
3893: '@rOn Rokkenjima, there were no humans other than the family, so in actuality, closing up wasn''t that terribly meaningful of a task.'
3894: '@rUntil Natsuhi had scolded them that this attitude was careless, closing up had not been customary in the Ushiromiya family.'
3895: '@rThe metal fixtures on the completely chilled windows were freezing, and every time she went to check on them, one-by-one, it felt like the glow in her heart seemed to cool down.'
3896: 'Shannon@r@v15/10500243.".....................?"'
3897: '@rJust then, she thought she saw something flickering across the hall.'
3898: '@r......Flickering?@k@rSomething like that shouldn''t be visible beyond the darkness of the hall...'
3899: '@rAlthough she thought it was probably her eyes playing tricks on her, she killed her breathing for a brief moment,@k and, grasping a curtain, she fearfully gazed into the center of the hall......'
3900: '@rHowever, other than the occasional crack of thunder brightening the hallway, she was unable to glimpse any flicker again.'
3901: '@r......It must have been her imagination after all.@k@rMaybe because she couldn''t calm her heart, she saw something that didn''t even exist.'
3902: '@rShannon resumed checking the windows...@k@rHowever, in the back of her mind, a certain unnerving possibility had been resurrected.'
3903: '@r...It was that which had been passed down amongst the servants who served the Ushiromiya main family—that ghost story.'
3904: '@rIn which the mansion had different masters of the day and the night.@k ...In which the master of the night, BEATRICE, would sometimes fly around the mansion in the form of sparkling butterflies.'
3905: '@r......Come to think of it, hadn''t Kanon-kun said that he had once seen it for himself......?'
3906: '@rHe got sulky when I didn''t believe him and told him he was just seeing things...'
3907: '@r.........Could it possibly...really...............?@k@rThe roar of the thunder gave no answer...'