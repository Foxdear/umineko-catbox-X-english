5936: 'Natsuhi@r@v03/10900418."......At any rate, we''ll lock this room and leave everything as it is until the police come.@k@v03/10900419. ......All agreed?"'
5937: '@rNatsuhi proclaimed it as though she didn''t care whether they agreed or not.'
5938: '@r...If anyone had a right to object, it would have been George, ...but he looked as though he had shed enough tears.'
5939: '@rStill facing away from them, George nodded slightly and rose to his feet, and everyone else agreed in response.'
5940: '@rNatsuhi still hadn''t opened the head''s Western-style envelope she had picked up.@k@r...But since they would all be leaving the room now, she decided that she would unseal it in the parlor, where everyone could watch.'
5941: '@rAs soon as they walked out into the hallway to head back to the parlor,@k .........some of them immediately felt something out of place, ...or maybe sensed something strange.'
5942: 'Maria@r@v13/10400672."...............Uu.@k@v13/10400673. ......Stinky."'
5943: 'Jessica@r@v04/10200632."Ah, ...you notice it too, Maria?@k @|@y@v04/10200633....What is this stench... It smells awful..."'
5944: '@rAs they all sniffed the air,@k ...they did notice a horribly foul burnt smell, unlike anything any of them had ever smelled before, drifting through the hallway.'
5945: 'Kumasawa@r@v18/11800133."......I will go quickly to check the kitchen...@k@v18/11800134. I''m sure I turned the flame off......"'
5946: '@rAfter noticing a burnt smell, it was natural that Kumasawa, who had just been cooking in the kitchen, suspected that her own clumsiness had caused it.@k Kumasawa hastily dashed away.'
5947: 'Genji@r@v14/11600235."......Kanon, go with Kumasawa.@k@v14/11600236. Do not let her be alone."'
5948: 'Kanon@r@v16/10600240."Y-yes...!"'
5949: '@rAfter nodding at Genji''s order, Kanon went chasing after her.@k@r...The others, although they did not run, also followed in order to search for the source of the smell.'
5950: 'Maria@r@v13/10400674."...Uu.@k@v13/10400675. Stinky.@k@v13/10400676. ......Uuu."'
5951: 'Natsuhi@r@v03/10900420."It truly is......a stench that makes the nose wrinkle.@k@v03/10900421. ...However, I am not sure it would be safe to open a window for ventilation..."'
5952: '@rNatsuhi was reluctant to open the windows in a situation where self-defense was so important.'
5953: 'Genji@r@v14/11600237."......Let us run the fan.@k@v14/11600238. I do not believe there will be any need to open the windows."'
5954: 'Battler@r@v10/10101162."...George-aniki.@k@v10/10101163. ......Is it okay if I talk to you?"'
5955: 'George@r@v07/10300661."......If it''s about finding the killer, then I have no problems."'
5956: '@rIt seemed that George had already climbed out of the abyss of his sorrow.'
5957: '@r...All that filled his chest now was the quiet flame of hatred towards the killer who had stolen the lives of his beloved parents.'
5958: 'Battler@r@v10/10101164."...The chain for the room was set.@k@v10/10101165. ...From what I could tell by looking at it, I''m positive that it couldn''t be opened from the outside.@k@v10/10101166. ......In other words, that means it was a perfect locked room."'
5959: 'George@r@v07/10300662.".........Yes, it does.@k@v07/10300663. In the case of the rose garden storehouse, they might have sneaked the shutter''s key out of the servant room,@k@v07/10300664. or maybe they had a duplicate key... I can imagine many ways they could''ve done it."'
5960: 'George@r@v07/10300665.".........But this chain is different.@k@v07/10300666. Among generally used locking techniques, a chain is the simplest one to create a locked room with."'
5961: 'Jessica@r@v04/10200634."Only a chain will block everyone coming from the outside as long as it isn''t physically broken.@k@|@y@v04/10200635. So does this mean that the culprit couldn''t have gone in or out through the door...?"'
5962: 'Battler@r@v10/10101167."......That''s interesting.@k@v10/10101168. Just a few hours ago, I seem to remember everyone making a fuss over how to get out of a room without using the door."'
5963: '@rBack then, everyone had been making a fuss over how Grandfather had disappeared from his room.'
5964: '@rBecause of the receipt that Auntie Eva had stuck in the door on a whim, it was revealed that the door had remained sealed,@k and since Aunt Natsuhi had been the only person to enter or exit during that time, she had come under suspicion.'
5965: '@rAuntie Eva had proposed a theory about how Aunt Natsuhi might have thrown Grandfather out the window,@k and left by the door herself.'
5966: '@rBut this door is much simpler.'
5967: '@rIt was sealed from the inside by the door chain.@k@rThe window had also been closed from the inside, and the bodies had been in the room.'
5968: '@r......This time it really was, without exaggeration, a true locked room.'
5969: '@r...That''s right.@k If you include Grandfather''s disappearance, three incidents have occurred, and all three times, the door has been the point of interest.'
5970: '@rThe first was the shutter.'
5971: '@rThere was a key in the servant room, and if we assume someone knew about that, this can''t really be called a locked room.'
5972: '@rThe next was the door sealed by the receipt.'
5973: '@rHowever, since Aunt Natsuhi had entered the room,@k she could have let Grandfather out through the window, or thrown him out, and she would have been able to lock the window before leaving.'
5974: '@rOr, like my crazy theory, he could have hidden until the receipt was gone, and left the room later.@k ......Basically, this door can be defeated with a handful of desperate tricks.'
5975: '@rIn that sense, you really can''t call this one a locked room either.'
5976: '@rAnd now, we have the door sealed with the door chain.'
5977: '@r...Finally, we have to give up.@k@rThe window, the door...everything had been locked from the inside.@k It was a perfect locked room.'
5978: '@rThe first hadn''t been a locked room because everyone could be suspected.@k@r...The second hadn''t been a locked room because Aunt Natsuhi could be suspected.'
5979: '@r...But this time, no one can be suspected!@k@rThis room was a perfect locked room, sealed by a door chain that denied access equally to everyone...!'
5980: 'George@r@v07/10300667."......In that case, did the culprit carry out the crime without entering the room...?@k @v07/10300668.Some method from outside the room...?"'
5981: 'Jessica@r@v04/10200636."Good thought...@k@v04/10200637. It is a chain, so even though it can''t be opened wide enough for a person to fit through, you can open it a small crack.@k@v04/10200638. The culprit could knock on the door to make them peer out before attacking them, or...@k@v04/10200639. Wait, ...is that naive...?"'
5982: 'Battler@r@v10/10101169."Yeah, it is.@k@v10/10101170. .........If Auntie Eva''s body had been lying right next to the door, then it might have been possible."'
5983: 'Battler@r@v10/10101171."But she was on the bed in the center of the room!@k @v10/10101172.And Uncle Hideyoshi was even in the bathroom.@k@v10/10101173. Looking from the crack in the door, you couldn''t even see them, and you couldn''t reach them with your hands either.@k@v10/10101174. ......Damn it, this is no goddamn good at all, I don''t have a clue!!"'
5984: '@r......Something was tugging softly at my sleeve.@k ...It was Maria.'
5985: 'Maria@r@v13/10400677."............Uu.@k@v13/10400678. ...Satisfied?"'
5986: 'Battler@r@v10/10101175."What do you mean "satisfied"?"'
5987: 'Maria@r@v13/10400679.".........Kihihihihihihihihihihihihi.@k@v13/10400680. ...Battler, since you didn''t want to doubt any of your relatives...you made a wish, saying that you wanted the culprit to be BEATRICE, right?"'
5988: 'Maria@r@v13/10400681."Well, BEATRICE granted your wish.@k@v13/10400682. ...Just as you said, she did it "in a way that no human could, to make you believe in the witch"."'
5989: 'Maria@r@v13/10400683."............Yet you''re being stubborn.@k@v13/10400684. Kihihihihihihihihihihihihihihihi.@k@|@y@v13/10400685. Ouch."@|@y'
5990: '@rI tapped Maria, who was laughing unpleasantly, on the head with my fist.'
5991: 'Battler@r@v10/10101176."Sure, thanks for granting it.@k@v10/10101177. That was an expression of my gratitude, and a free lesson in not laughing at times like this.@k@v10/10101178. More importantly, tell me.@k@v10/10101179. There was more mysterious graffiti on the door to Auntie Eva and Uncle Hideyoshi''s room.@k@v10/10101180. Was that another magic circle?!"'
5992: 'Maria@r@v13/10400686."......Kihihihihihihihi.@k@v13/10400687. It has an especially memorable and characteristic design, so I''d hoped you''d at least know that one.@k@|@y@v13/10400688. Ouch."@|@y'
5993: 'Battler@r@v10/10101181."I don''t know, that''s why I''ve handed the stage over to you.@k@v10/10101182. Quit whining and explain."'
5994: 'Maria@r@v13/10400689.".........You sure are violent, Battler.@k@v13/10400690. I won''t tell you if you''re too mean, get it......?@k @|@y@v13/10400691.Ouch!@|@y@k @v13/10400692.@|@yUu...... I''ll say it, I''ll say it, you brutish man.@k@v13/10400693. .........That''s the first magic circle of the moon."'
5995: 'Battler@r@v10/10101183."What does it mean?@k@v10/10101184. What is this magic circle''s benefit?!@k @v10/10101185.What does the Hebrew writing mean?!"'
5996: 'Maria@r@v13/10400694."The words are from the Old Testament, Psalm 107, verse 16.@k@v13/10400695. ......''For he has broken the gates of brass and cut through bars of iron''.@k@v13/10400696. ......This magic circle has two effects.@k@v13/10400697. First, it can open any door regardless of the method used to lock it."'
5997: 'Battler@r@v10/10101186."That sure is convenient magic.@k@v10/10101187. ...So your witch is proclaiming this to be a door that can''t be opened without relying on the power of magic...?!@k @v10/10101188.And the other effect?!"'
5998: 'Maria@r@v13/10400698."It takes the unopening door as a representation of an unassailable situation, and opens it.@k@v13/10400699. ......By using it in a difficult situation, it gives you a solution you hadn''t even thought of until then.@k@v13/10400700. ......To put it simply, it grants the powers of observation and discernment, inspiration and intuition."'
5999: 'Maria@r@v13/10400701."............Kihihihihihihihihihi.@k@v13/10400702. BEATRICE is trying to provoke you lowly humans, since she thinks there''s no way you could ever understand how this door was opened.@k@v13/10400703. Kihhihihihihihihihihihihihihihi..."'
6000: 'Maria@r@v13/10400704."Ouch."'
6001: 'Battler@r@v10/10101189."Alright, good work, now shut up.@k@v10/10101190. ......Suits me fine. I accept that witch''s challenge!"'
6002: 'George@r@v07/10300669."......Maria-chan.@k@v07/10300670. ...Things like witches and demons don''t exist in this world.@k@v07/10300671. ...Someone killed Mother and Father!@k @v07/10300672.I don''t know whether that was someone I know or not.@k@v07/10300673. But either way, it was definitely a human...!!"'
6003: 'Jessica@r@v04/10200640.".........Yeah, but......how?@k@v04/10200641. How did they reach them through a crack in the door that couldn''t have been more than ten centimeters wide...!"'
6004: 'Natsuhi@r@v03/10900422."At any rate, I can hardly stand this stench.@k@v03/10900423. ......What in the world could it be...?!"'
6005: '@rKanon and Kumasawa, who had gone ahead, realized before they even reached the kitchen that the smell wasn''t coming from there.'
6006: '@rThat was because, on their way to the kitchen, they noticed that an even thicker wave of stench was rising up from the stairs leading to the basement.'
6007: 'Kanon@r@v16/10600241.".........The boiler room..."'
6008: 'Kumasawa@r@v18/11800135."......I wonder if there''s something wrong with the boiler again..."'
6009: '@rThose stairs led to the underground boiler room.'
6010: '@rThe mansion''s boiler was old, and had been playing up recently.@k@rBoth of them had witnessed problems with the boiler on several occasions, but they had never smelled it belching out a stench like this before.'
6011: '@rSlam.'
6012: 'Kumasawa@r@v18/11800136."Wh-what was that sound......?!"'
6013: '@rThe sound that they had heard from the basement had definitely been the sound of a door closing.@k@r......Although she did phrase it as a question, Kumasawa too had already realized that the sound couldn''t have been anything else.'
6014: '@rKumasawa was so surprised at that sound that her knees gave way yet again and she cowered...'
6015: '@r......Because, at that very moment, no one could have been in the boiler room.'
6016: '@rJust a few seconds ago, everyone had been crowded together in Eva and Hideyoshi''s room!@k@rSo who caused the sound of a door closing just now?!'
6017: 'Kanon@r@v16/10600242.".................................!"'
6018: 'Kumasawa@r@v18/11800137."Kanon-san...!!"'
6019: '@rInstantly gathering the situation, Kanon ran down towards the basement...!'
6020: '@rSince they had heard the sound of a door closing just now, and there was no trace of someone climbing the stairs, it meant that the person who had closed the door was now inside the boiler room.'
6021: '@rIf the boiler room had been a dead end, Kanon wouldn''t have rushed in so hastily.'
6022: '@r...But Kanon was a servant, so he knew.@k@rThere were two entrances, one that opened to the mansion and one that opened to the courtyard.'
6023: '@rIf he didn''t chase them now, they might slip away...!'
6024: '@rKumasawa reached the same conclusion long after Kanon did.@k@r...But she couldn''t let him go alone...!'
6025: '@rIf the thing in the boiler room was the killer,@k ...an opponent who had easily killed six adults in the first murder,@k then Kanon would be no match if he simply confronted them alone.'
6026: '@r...Of course, by this argument, Kumasawa joining him alone wouldn''t mean anything, but...'
6027: '@rAt any rate, after a delay, Kumasawa decided that she mustn''t let Kanon go alone, and she dashed down the stairs...!!'
6028: '@rAt that time, Kanon was already in the boiler room.'
6029: '@rThe boiler room''s characteristic damp heat tormented him.@k@r...It had always been an unpleasantly smelly and hot place.'
6030: '@rAnd on top of that, the room was full of that horrible stench...which made Kanon feel like he was going to be sick.'
6031: '@r......There was no doubt that this room was the origin.'
6032: '@rIn that case, Kanon should have been searching for where the smell was coming from.'
6033: '@rHowever, Kanon kept gazing straight forward as he grabbed a hatchet from a tool shelf just off to the side of the door.'
6034: '@r...He hadn''t stretched out his hand because he''d wanted a hatchet.@k ...He had wanted to grab a weapon, any weapon.@k ...Why?'
6035: 'Kanon@r@v16/10600243."..................................................."'
6036: '@rKanon gazed into the darkness where the naked light bulb couldn''t pierce.@k@r......Then, he answered.'
6037: 'Kanon@r@v16/10600244."..................In roulette, you bet on a number or the colors red or black, vying for a payoff.@k@v16/10600245. ......However, low risk bets like red or black only offer a similarly low payoff."'
6038: '@rThe words coming from Kanon''s mouth...were swallowed up by the darkness.'
6039: '@rThat darkness suddenly started to swirl, glittering...'
6040: '@rIt was......a very fantastical scene...'
6041: '@rGolden sparkling butterflies that hid in the shadows all over the boiler room...@kflapped their wings, twinkling beautifully, ...and disappeared into the darkness, gathering together...'
6042: '@rKanon continued speaking, directing his words at the darkness as it swallowed the butterflies up.@k@r......But as the butterflies gathered in the darkness, they.........perhaps...probably...no, they must have......laughed.'
6043: '@r...But Kanon continued to speak without faltering in the slightest.'
6044: 'Kanon@r@v16/10600246."...On the other hand, if you bet on something of a lower probability, you receive a payoff proportional to the risk.@k@v16/10600247. ............The Master called succeeding despite an astronomical risk a "miracle",@k@v16/10600248. and called the astronomical payoff gained as a result "magic"."'
6045: 'Kanon@r@v16/10600249."............I have no interest what kind of "magic" you and the Master were seeking when you spun that roulette......@k@v16/10600250. But you forgot something.@k@v16/10600251. ......You forgot that roulette has a pocket that is neither red nor black."'
6046: '@rRoulette has a special pocket called "0", which means that the house takes everything in certain variants of the game—@kmeaning that all of the coins bet on the table will be swept up, just as though everyone has forfeit...'
6047: 'Kanon@r@v16/10600252.".........I set my heart on one thing.@k@v16/10600253. ...That if...@k@v16/10600254.......Shannon were to be killed, and I was left alive,@k@v16/10600255. .........I would bring this roulette of yours to ruin even at the cost of my life...!"'
6048: 'Kanon@r@v16/10600256."............This isn''t one of the Master''s rules, ...and it certainly isn''t one of yours.@k@v16/10600257. .........I made this rule myself.@k@|@y@v16/10600258. .........I''m not furniture anymore.@k@v16/10600259. .........I''m the zero on your roulette...!"'
6049: '@r...Kanon''s face twisted with humiliation.@k@r.........It was clear that he had been dealt ridicule in response to his self-denial.'
6050: '@rKanon''s brow creased even further, ...and a furious expression that he had never shown anyone appeared on his face.'
6051: '@r......The hand grasping the hatchet was shaking.@k ...His sweat became drops which slid down...'
6052: '@rIt was clear that the emotion causing Kanon''s hand to shake was not anger alone.'
6053: '@r...However, Kanon suppressed that emotion...'
6054: 'Kanon@r@v16/10600260.".....................I won''t let your words lead me astray again.@k@v16/10600261. .........This is where the Demons'' Roulette ends."'
6055: 'Kanon@r@v16/10600262."...W-@v16/10600263.......wait another thousand years in hell for your next summoner,@v16/10600264. BEATRICEEEEEEEE!!!"'
6056: '@rWhen Kanon swung the hatchet upwards and tried to dive into the darkness, the darkness definitely sneered.'
6057: '@rIt sneered at that courage as vulgar, lazy, futile, and meaningless.'
6058: '@r......Kanon, his hatchet still held aloft,@k .........couldn''t take another step after that...'
6059: '@rWith a clang,@k the hatchet that Kanon had been grasping fell and rolled on the floor...'
6060: '@rAnd following that, with a pair of thuds,@k Kanon''s knees hit, ...left, then right...'
6061: '@rThat hand, which looked like it was trying to catch the sky now that the hatchet had been dropped, gradually lowered,@k ......and rested on his chest.@k Then, the other hand did the same.'
6062: '@r......Right there, ......was a handle with a demon-shaped design engraved upon it.@k@rThe same type of weapon that had been stabbed into Eva and Hideyoshi''s foreheads......was in Kanon''s chest......'
6063: 'Kanon@r@v16/10600265."...............u@v16/10600266......................ghh,@v16/10600267. ............"'
6064: '@rFresh blood dribbled from the corner of Kanon''s mouth as it twisted in anguish...@k@r...It was...makeup too powerful for Kanon''s white skin...'
6065: '@rAround this scene, the glittering gold butterflies danced mesmerizingly through the darkness...'
6066: '@rIt was a beautiful, beautiful dance—a funeral march of tribute, ridicule, and contempt for a single boy''s self-sacrifice.'
6067: '@r...Kanon had already been prepared for his own death,@k ......but he attempted one last measure of resistance, to reject death in at least the form it had been delivered to him.'
6068: '@r...With both hands, he grasped the handle of the weapon sticking into his chest,@k ............and gritting his teeth at the acute, unearthly pain...............@k ..............................he pulled it out.'
6069: '@rFor only a moment, a bright-red spray gushed out.'
6070: '@r......It made an unpleasant bloop sound.'
6071: '@rIt probably resembled the sound of Kanon''s soul as it was sucked into the swamp of the dead...'
6072: 'Kumasawa@r@v18/11800138."...............Kanon-san?!@k @v18/11800139.Hiiiiiiiii!!!@k @v18/11800140.So-someoooooooone!!@k @v18/11800141.Hiiiiiiiii!!"'
6073: '@rKumasawa screamed at the incomprehensible sight in front of her.'
6074: '@rKanon was lying in a pool of blood...@k@r...Kumasawa''s heart was a complete mess.'
6075: '@rAah, what a terrible fate!@k@rHe wouldn''t have been killed if I had been with him!'
6076: '@rAah, what incredible fortune!@k@rIf I had been with him, I might have been killed too!!'
6077: '@rAs she screamed, her expression was filled with complete confusion, and all of the muscles of her face were pulled up, almost as though she was smiling while crying...@k@rNo one could have made fun of an expression such as this...!!'
6078: 'Natsuhi@r@v03/10900424."What is it, Kumasawa?!!@k @v03/10900425.Answer me, Kumasawa!!!"'
6079: '@rThe first one to dash in was Natsuhi, with rifle at the ready.'
6080: '@rBattler and Genji dashed in after her.'
6081: '@rNormally, they probably would''ve started discussing the origin of that violent stench filling the boiler room.'
6082: '@r......But after they saw Kanon, who was lying on the ground as if he were drowning in an ocean of his own blood, the stench wasn''t important any more.'
6083: 'Natsuhi@r@v03/10900426."Kanon!@k @v03/10900427.Answer me!!@k @v03/10900428.......Genji, bring Doctor Nanjo here!!"'
6084: '@rNatsuhi realized that even though Kanon was on the verge of death, he was still conscious, so she sent Genji to get the doctor.'
6085: '@r...Natsuhi, holding the rifle aloft, faced the darkness in the center of the boiler room and shouted!'
6086: 'Natsuhi@r@v03/10900429."......Who is hiding over there?!!!@k @v03/10900430.Come out quietly!!@k @v03/10900431.If you don''t come out from there, I''ll shoot without mercy!!"'
6087: 'Battler@r@v10/10101191."A flashlight!@k @v10/10101192.Auntie, let''s light ''em up!!"'
6088: '@rBattler, thinking quickly, took a large flashlight from the tool shelf alongside the door and used its light to cut through the darkness Natsuhi was glaring into.'
6089: '@rBut the light only shone on mechanical-looking piping and a door.'
6090: '@rThe door had been left open a small crack, and it was obvious that someone had left through there in a hurry.'
6091: 'Battler@r@v10/10101193."......Aunt Natsuhi, where does that door go?!"'
6092: 'Natsuhi@r@v03/10900432."G-Genji...!@k @v03/10900433.Where does that door lead to?!"'
6093: 'Genji@r@v14/11600239."...The, the courtyard...!"'
6094: 'Battler@r@v10/10101194."L-like hell I''d let you get away, you damn bastaaaaaaaard!!!"'
6095: '@rBattler let out a war cry as he slammed into the door.'
6096: '@rCool air from outside suddenly rushed in.'
6097: '@r...There were some thin, rough stairs leading up.@k@r...Battler ran up them, shouting!'
6098: 'Natsuhi@r@v03/10900434."Wait, Battler-kun!!@k @v03/10900435.It''s dangerous to be alone!!"'
6099: '@rNatsuhi also rushed up the stairs, chasing after Battler.'
6100: '@rAt the top was the courtyard.@k@r...The courtyard of the mansion had been built strictly for lighting purposes, so it wasn''t a very elegant place.'
6101: '@rBecause it was surrounded on all sides, the air was calm and completely undisturbed, even though they could hear the sound of strong winds.'
6102: '@rThere was only the gentle, sorrowful rain...'
6103: '@rThrough the cold scattered raindrops, Battler dashed up the stairs and into the courtyard, where he looked in every direction.'
6104: '@r......Of course, the odds of him finding a suspicious silhouette just standing around nonchalantly were pretty much zero...'
6105: '@rBattler turned around, looking in all directions.@k He turned again and again.@k@rHe kept spinning until he almost lost his sense of direction.@k@rHe prayed that he would see the culprit somewhere in this scenery...!'
6106: '@rBut there was no chance.@k All he saw as he spun was more and more of the mansion''s heartless walls and windows...!'
6107: '@rFurthermore, there were two entrances into the mansion from the courtyard, and neither of them were locked.'
6108: '@rBecause the courtyard couldn''t be entered from outside the mansion, the doors had been built without locks.'
6109: '@r......He couldn''t tell which one they had left through!@k@rHe had to give up.'
6110: '@rBattler pounded the wall with his fist, swearing...'
6111: 'Natsuhi@r@v03/10900436."......Battler-kun!!@k @v03/10900437.You mustn''t run ahead by yourself!!@k @|@y@v03/10900438.........................@k@v03/10900439. ............Battler-kun......?"'
6112: '@rBattler put his head against the wall, ...and scratched at it with his fingernails as he cried...'
6113: 'Battler@r@v10/10101195.".........Shit, ......shit, shit...!!@k @v10/10101196.Auntie Eva and Uncle Hideyoshi!@k @v10/10101197.And now Kanon-kun too?!!!@k @v10/10101198.You killed six whole people!!@k @v10/10101199.And that wasn''t enough, so you killed three more!!"'
6114: 'Battler@r@v10/10101200."Fuck you, fuck youuuuuuu!!@k @v10/10101201.Auntie Eva and Uncle Hideyoshi were always fun and kind to us...!!@k @v10/10101202.I just met Kanon-kun yesterday, but I''m sure I''d have gotten along fine with him!@k @v10/10101203.Why did you kill them?!!"'
6115: 'Battler@r@v10/10101204."Why, why...?!!!@k @v10/10101205.When people die, they don''t come back to life again, you know?!@k @v10/10101206.They aren''t gonna quickly sprout up again like bamboo shoots!@k @v10/10101207..........Why would you kill them?!@k @v10/10101208.Why...@|@y@v10/10101209. Why...?!!!@|@y@k @v10/10101210.Aaaaaaaaaaaaaaaaahhhh...!!"@|@y'
6116: '@r...Battler was a boy who could understand the feelings of pain and regret in a person''s heart.@k@r...So he cried.@k With all his strength.'
6117: '@rNatsuhi, who had always thought of Battler as a strong person, was a little surprised to find that he had this delicate side,@k ...and at the same time, understood how easily hurt the heart of a young person could be, so she held him.'
6118: 'Natsuhi@r@v03/10900440."........................It''s alright.@k@v03/10900441. ...I will definitely protect you, George-kun, Maria-chan, and Jessica.@k@v03/10900442. .........As a mother, ...and as the representative of the Ushiromiya family...!"'
6119: 'Battler@r@v10/10101211."......uuuUUuuUuuUUUuughhhu!!@k @v10/10101212.AaaaaaAAAAAAAAhhh!!"'
6120: '@rBattler, after sobbing into Natsuhi''s chest for a while,@k wiped his tears with a bitter smile, and tried to convey that he had cried more than enough already, just as he had done the times before...'
6121: 'Natsuhi@r@v03/10900443."Anyway, let''s go back down for now.@k@v03/10900444. ......Protecting ourselves is a higher priority than finding the culprit.@k@v03/10900445. Tomorrow, the boat will arrive.@k@v03/10900446. After that happens, the police will come, and everything should be brought to light.@k@v03/10900447. .........There''s no way the killer can escape this island, no matter how much they struggle...!!"'
6122: 'Battler@r@v10/10101213."......Right.@k@v10/10101214. ...When the police come..."'
6123: '@rWhen the seagulls cry, ...the crime will be solved.'
6124: '@rBut, ...for some reason, Battler felt a slight sense of uneasiness...as if the seagulls would never cry again.'
6125: '@r......That couldn''t be true.@k@rWhen the typhoon passes, the lively seagulls should return to the harbor again......'
6126: '@rI returned to the boiler room along with Aunt Natsuhi and told the room weakly that we hadn''t found anything.'
6127: '@rThey told me that Doctor Nanjo and George-aniki had carried Kanon-kun to the servant room.'
6128: '@rThe servant room had a first-aid kit and a sink, and could apparently function as a nurse''s office.'
6129: '@rKumasawa-san and Jessica had accompanied them.'
6130: '@r...Stains from Kanon-kun''s blood remained on the floor.'
6131: '@rJudging by the large amount of blood lost and the ruthless shape of the weapon that had fallen unceremoniously to the ground,@w583. ......I figured that Doctor Nanjo''s treatment would probably end in vain...'
6132: '@rThat weapon was doubtlessly the same type that had been stuck in Auntie Eva and Uncle Hideyoshi''s foreheads.'
6133: '@r......But wait, isn''t the demonic design on the handle a little different...?'
6134: '@rThere seemed to be some small differences in that part.@k Still, as far as their overall shape was concerned, the weapons were all of the same type.'
6135: '@rThough it had seemed brutal, we''d left the weapons stuck into Auntie Eva and Uncle Hideyoshi to preserve the crime scene.'
6136: '@r...So this was the first time I was able to have a perfect view of the entire weapon.'
6137: '@rIndeed, the weapon was not bladed like a knife, but shaped like an icepick,@k ...or rather, a thin stake.'
6138: '@rAnd also, ...it had a spiral-shaped design, sort of like a drill?'
6139: '@r...To use a disturbing analogy, it looked like something that might be driven into the hearts of human sacrifices in some demonic ritual...'
6140: '@rIncluding the handle, it was about twenty-five centimeters long.@k Half of that was the stake-shaped part, which was stained with deep red blood.'
6141: '@r......The length of the blood-stained part made it clear just how deeply it must have penetrated into Kanon-kun''s chest...'
6142: '@rBut Aunt Natsuhi and the rest were not even looking at the weapon, instead standing in front of the incinerator, where the horrible stench was emanating from.'
6143: '@rThey had probably pulled that out of the furnace, where it must have been burning.'
6144: '@r...It was still smoldering and kept sending out dense waves of that awfully unpleasant smell...'
6145: '@rGenji-san and Maria were staring down at it.'
6146: '@rAunt Natsuhi probably couldn''t stand to look directly at it.@k ...She kept shaking her head, her back to it.'
6147: 'Battler@r@v10/10101215."........................ug...!"'
6148: '@r...I''d thought that after everything that''s happened, nothing could surprise me anymore, but...@w500....this was...@w416....gghh...!'
6149: '@rI stood there for a while, moaning, with a rising urge to vomit...'
6150: '@r.........The true nature of that unearthly stench...@k......was the charred smell from within the incinerator...@k@|@yof a burning corpse......'
6151: '@rThe clothes, the surface of the body, and the hair were all hideously burned.@k That grotesque corpse was in a state where not the face, nor the age, nor even the sex could be guessed at...'
6152: '@rBut when I thought about it calmly, I realized that a corpse appearing at this time could only be one person.'
6153: '@r.........Grandfather,@k who had disappeared that morning, and whose whereabouts had been unknown.'
6154: 'Genji@r@v14/11600240.".........I believe...it is most likely the Master."'
6155: 'Natsuhi@r@v03/10900448."...............I...agree.@k@v03/10900449. ............That he would pass away in such a state......@k@v03/10900450. .........How heartrending..."'
6156: 'Battler@r@v10/10101216."...But is there any proof that this corpse......really is Grandfather...?@k @v10/10101217.It''s burnt so black, you can''t even tell what sex it is..."'
6157: 'Natsuhi@r@v03/10900451."Battler-kun, ...look at the feet."'
6158: '@rAunt Natsuhi, with her handkerchief over her mouth and her eyes averted, pointed and told me to look at the burnt corpse''s feet.'
6159: '@r..................?'
6160: 'Genji@r@v14/11600241_1."......The toes, on both feet. Look closely."'
6161: 'Battler@r@v10/10101218."Huh?@k @|@y@v10/10101219...................ah,@v10/10101220. ......you''re right........."'
6162: '@rJust as Genji-san had said, there were six toes on each foot.'
6163: '@rEach of the toes had been arranged so normally that I hadn''t noticed...'
6164: 'Genji@r@v14/11600242_1."......The Master had these uniquely characteristic toes since birth.@k@v14/11600243. ...Consequently, the Master was entrusted with the revival of the Ushiromiya family."'
6165: 'Natsuhi@r@v03/10900452."I have heard that since long ago, cases of polydactyly were common in the Ushiromiya family.@k@v03/10900453. ...It''s probably hereditary."'
6166: '@rPolydactyly literally means "many fingers".'
6167: '@rBecause of a little mistake by God when the person is born, one of their toes or fingers splits into two, and the total number increases.'
6168: '@rBut a big deal isn''t usually made of polydactyly in the world at large.@k@rThat''s because it isn''t a disease, but something people are born with.'
6169: '@rSo the hospital is already aware of it when they are still babies, and at about the time they turn one year old, they are given surgery to make them normal.'
6170: '@rSo, even if a child has polydactyly, it is treated before they become self-aware, so they might not even remember it themselves.'
6171: '@rIncidentally, it seems that it can occur with a probability of about one in every two thousand babies,@k so even though it''s not usually seen, it isn''t that rare at all.'
6172: '@rSpeaking of which, I think Uncle Hideyoshi mentioned something to me long ago.@k ...Something about how even Toyotomi Hideyoshi, the man who unified Japan at the end of the Sengoku period, possessed six fingers on one hand...'
6173: '@rAccording to Aunt Natsuhi, among the many Ushiromiya family heads, the ones praised most for their wisdom had all possessed polydactyly.'
6174: '@r......Because of that, when Grandfather was born, his relatives were all excited at the thought that he might become another wise leader.@k And, when the leading relatives all died in the Great Kanto Earthquake, it was apparently argued that if anyone could restore the family from that,@k it would be Grandfather, because of the auspicious sign of his birth.'
6175: '@rIf Grandfather thought being the head was not a bad gig, this sixth toe must have been pretty lucky for him.'
6176: '@r......Come to think of it, I think I''ve heard about some country where it''s believed that people with polydactyly should be treated as gods and revered...'
6177: '@rThis is beside the point, but it''s fairly common in mystery novels for a corpse to be burned to hide whose body it is.'
6178: '@r......But it looks like in Grandfather''s case, just being toasted wasn''t enough to hide the proof of his identity...'
6179: '@rAnd......Grandfather''s body was not simply burnt.@|@y'
6180: '@r......Just like Auntie Eva and Uncle Hideyoshi, ...and Kanon-kun too, who had been stabbed in his chest,@k@|@y he had one of those "demon''s icepicks"...stuck into his forehead......!'
6181: 'Genji@r@v14/11600244."............The "Head''s Ring" is not on his finger."'
6182: 'Natsuhi@r@v03/10900454."...So everything is as the letter last night said.@k@|@y@v03/10900455. ..................Father...@v03/10900456....would probably be horribly disappointed......"'
6183: '@rAunt Natsuhi let her head droop and closed her eyes tightly...'
6184: '@r......This room had also become a vital crime scene for us to hand over to the police.'
6185: '@r......It was decided that we would leave Grandfather''s corpse here and lock the room, sealing it.'
6186: '@rIt wasn''t clear when Grandfather''s corpse started burning in the incinerator.'
6187: '@rSince, according to Genji-san, the flames hadn''t been that strong, the body must have started burning a long time ago,@k and that stench must have slowly crept out of the furnace and filled the room bit by bit, eventually pouring out and climbing up the staircase.'
6188: '@r......Putting aside whether he was rare or well-done,@k Grandfather had been brought out, killed, and burned...even though he had started out in the locked room created by his auto-lock.@k ...There''s probably no doubting this...'
6189: '@rHowever, according to Genji-san, the boiler room is usually locked.'
6190: '@r......The probability that someone outside our group was lurking around committing the crimes was now overwhelmingly high,@k and there was also a good chance that this person was walking around with something like a master key.'
6191: '@r...After all, the doors and windows throughout the mansion had been checked.'
6192: '@rBut despite that, the culprit was freely strutting around the mansion.'
6193: '@rAfter this latest crime, can we now be sure that a 19th person exists?@k@rThey haven''t shown themselves once, and yet they''re trying to tout their existence.'
6194: '@rAlong with Kyrie-san''s chessboard theory, I''ve been using this contradiction to deny the existence of a 19th person.'
6195: '@r...By flipping over the chessboard once more,@k the very fact that this crime makes it perfectly obvious that a 19th person exists...@kmeans that the existence of the 19th person is even less possible.@k As long as that 19th person doesn''t show themselves in front of us...!'
6196: '@r......If the culprit could get Grandfather out through the door sealed by the receipt,@k if they could kill Auntie Eva and Uncle Hideyoshi from the other side of a door sealed by a chain,@k ......then is it possible for them to even create a fictional 19th person through strange tricks and devices...?!?!'
6197: '@rIf we still want to believe that the culprit is among us,@w583. ......then the list of suspects is very short.'
6198: '@rThe four of us kids, Aunt Natsuhi.@k@rGenji-san,@k Kumasawa baa-chan,@k and Doctor Nanjo.@k@r...One of these people has to be the culprit!'
6199: '@rWait, we can''t be sure of that.@k ......Just a second ago, we started doubting whether the body here was actually Grandfather''s, right?'
6200: '@r...Maybe we should try thinking of the other bodies in the same way.'
6201: '@rFor example, the first six all had their faces horribly destroyed.'
6202: '@r......Some of the bodies had kept enough of their faces for us to confirm who they were, but my old bastard, for example...@khad lost his entire face, as though it had been peeled off...'
6203: '@rWe''d only figured out which body was which by their clothes and surroundings...'
6204: '@rHad the culprit prepared a fake corpse beforehand and disguised it to make it look like they''d died...then hid somewhere and continued their killing spree...?'
6205: '@r...It sounds ridiculous, but that doesn''t mean it''s an impossible trick.'
6206: '@r......It''s too early to give in to this 19th person,@w500. ......no, .........this witch......!'
6207: 'Natsuhi@r@v03/10900457."Maria-chan, you mustn''t stare so fixedly anymore.@k@v03/10900458. Come on, Battler-kun too.@k@v03/10900459. I am worried about Kanon''s condition, and I don''t want to stay in a place like this any longer than I have to.@k@v03/10900460. Let''s go back."'
6208: 'Maria@r@v13/10400705."......Uu."'
6209: '@rMaria hadn''t gone out with everyone else, but had remained in the boiler room.'
6210: '@rThe thing she was staring fixedly at was probably...@knot Grandfather''s body, but the "demon''s icepick" that was sticking out of his forehead.'
6211: '@r...No doubt an irresistible item for the obsessed.'
6212: '@rI rapped her on the head.'
6213: 'Battler@r@v10/10101221."Hey, Maria.@k@v10/10101222. ......What''s BEATRICE after?@k@v10/10101223. Is it all of our lives...?"'
6214: 'Maria@r@v13/10400706."......Kihihihihihihihi.@k@v13/10400707. BEATRICE will revive very soon.@k@v13/10400708. ...At that time, none shall be left alive.@k@v13/10400709. ...Kihihihihihihihi."'
6215: 'Battler@r@v10/10101224."How can you laugh at something like that?@k@v10/10101225. Do you think you''re the only one who''s safe?@k @v10/10101226.Why don''t you feel like you''re in danger?@k @v10/10101227.Why aren''t you scared?!"'
6216: 'Maria@r@v13/10400710."......BEATRICE promised me.@k@v13/10400711_a. ...She said that she''s going to take me to the Golden Land."'
6217: 'Maria@r@v13/10400711_1.".........It''s a wonderful place where you have no obligations, everyone''s always together, and everyone is always nice to everyone else."'
6218: 'Maria@r@v13/10400712_1.".........I''m looking forward to it, you know?@k @v13/10400713.That time will come, very soon now.@k@v13/10400714. ...Kihihihihihihihihihihihihihihihihihi..."'
6219: '@r...Just what kind of person is Maria...?'
6220: '@r.........I only know what Maria was like six years ago, when she was three.@k@rShe had been pure and obedient—a good kid.'
6221: '@rThis new Maria six years later and the Maria I knew, ...didn''t seem to fit together.'
6222: '@r......Just who is she, this "witch" who calls herself Maria...?'
6223: '@rTo her, with her obstinate belief in witches,@k ......this series of unsolvable crimes is proof that witches actually exist.'
6224: '@rEvery time something occurs that would be difficult for a human, it becomes a little harder for the rest of us to not believe in that witch called BEATRICE.'
6225: '@rIt must be an "intense pleasure" for Maria...to see her relatives, who once firmly denied the witch''s existence,@k start acknowledging her existence one by one...'
6226: '@r......Is that why she''s in high spirits...?'
6227: 'Battler@r@v10/10101228.".........Maria,@k@v10/10101229. let me ask this one more time.@k@v10/10101230. You''ll probably answer the same anyway, but I''ll ask just once more."'
6228: 'Maria@r@v13/10400715."Uu...?"'
6229: 'Battler@r@v10/10101231."...Yesterday, you were given a letter in the rose garden.@k@v10/10101232. ......Who gave it to you...?!"'
6230: 'Maria@r@v13/10400716."Uu.@k@v13/10400717. ...Like I said, BEATRICE.@k@v13/10400718. ...You still don''t believe.@k@v13/10400719. Uu."'
6231: '@rMaria only repeated what she had already said.'
6232: '@r......Maria had met with the 19th person, the witch.'
6233: '@rHad that really been a 19th person, or had that been one of the 18, who told her to say otherwise?'
6234: '@rAll that''s certain is that Maria has been with the rest of us constantly, has always had an alibi, and hasn''t done anything that would put her under suspicion.'
6235: '@r......She''s simply overjoyed at being made BEATRICE''s messenger, and certainly is not our 19th person.'
6236: '@r..................I think.'
6237: '@rThat''s right,@k I wonder what''s written in the letter we picked up in Auntie Eva and Uncle Hideyoshi''s room...@k Aunt Natsuhi should still have it with her...'