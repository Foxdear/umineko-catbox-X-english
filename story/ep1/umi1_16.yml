7235: '@r@z70.The witch shall praise the wise, and bestow four treasures.@k@r@rOne shall be all of the Golden Land''s gold.@k@rOne resurrects all the dead people''s souls.@k@rOne even revives all the love they possessed.@k@rAnd one for the witch to eternally rest.@k@r@rRest in peace, my beloved witch, BEATRICE.'