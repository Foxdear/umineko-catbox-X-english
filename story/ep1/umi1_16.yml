6840: '@rAfter we chased them out, ......nobody said another word.'
6841: '@r...We had exiled all of the suspicious ones.@k Even though we had known that there might be some innocents among them, we had exiled them all the same.'
6842: '@r......We had chased them out of this paradise,@k where people didn''t have to doubt each other.'
6843: '@rHowever, our motive for chasing them out had been suspicion of our fellow man - the worst kind of crime for a human.'
6844: '@r......If we had been able to accept the existence of a 19th person, of the witch,@k ......then we all might still be talking face to face, trusting in each other.'
6845: '@rIn that instant,@k we had agreed to chase out all of the suspicious people.'
6846: '@r......But had that been the right thing to do?'
6847: '@r......During this endless silence, we could do nothing but be quietly tormented by that sin......'
6848: '@rAunt Natsuhi was facing the door, seated all the way back in her sofa, not letting go of her rifle for even an instant.'
6849: '@r......She would probably spend the night staring at the door without a wink of sleep.'
6850: '@rGeorge-aniki was gazing through a gap in the closed curtains by the window,@k looking down at the courtyard and the mansion that surrounded it.'
6851: '@r......Whether he was checking to see if any suspicious shadows would become visible through the window,@k ...or whether he was engaged in some deep internal conversation, ...I couldn''t tell.'
6852: '@rJessica was sitting at an angle on the sofa next to Aunt Natsuhi''s...with a dead expression on her face.'
6853: '@r......And every once in a while, as though she''d just remembered something, she would take out the inhaler that she had used during her asthma attack and stick it in her mouth.'
6854: '@r...I just heard it from Aniki, but,@w666. ......apparently Jessica liked Kanon-kun.'
6855: '@rIt seems that it was such a vague thing that she hadn''t realized it herself.'
6856: '@r...You know.@k It''s the kind of thing that other people tend to spot before the person in question realizes it.'
6857: '@r...In that case,@w500. ......she might have first learned of her feelings when the person she liked died.'
6858: '@r.........It was truly pitiful and sad.'
6859: '@rCome to think of it, ...Kanon-kun had been the one to hand her that inhaler.@k ......Maybe she was remembering that.'
6860: '@rAs for me, ......I was fishing around Grandfather''s study, thinking I''d research the meaning of the magic circle on the second sheet of the letter.'
6861: '@rEven though we were shut up here in a defensive position, my rebellious nature made me want to keep up the offense, find some key to all of this.'
6862: '@r...We have plenty of time until tomorrow morning anyway.@k@rNo matter what I do with that time, no one can find fault with it.'
6863: '@rNo one else showed that much interest in this magic circle.'
6864: '@r...Its meaning was unknown, and once we understood it, we were sure to find some message that would cause us unnecessary anguish.'
6865: '@r......I also agreed about this.'
6866: '@r...However, I still couldn''t let it go, so I killed time pretending to research it...'
6867: 'George@r@v07/10300742.".........You sure are enthusiastic.@k@v07/10300743. ...Did you find anything that might serve as a hint...?"'
6868: 'Battler@r@v10/10101363."...Not a thing.@k@v10/10101364. The first task is even finding a book written in Japanese.@k@v10/10101365. ...Just how many languages could Grandfather read?@k@v10/10101366. He''s incredible."'
6869: 'George@r@v07/10300744."Aren''t you tired, Battler-kun?@k @v07/10300745.......You should take a rest while someone else is staying awake for you.@k@|@y@v07/10300746. Aunt Natsuhi may be saying she''ll stay vigilant all night, but there''s no way her body can handle that.@k@v07/10300747. We should take turns sleeping."'
6870: 'Battler@r@v10/10101367."Then you sleep first, Aniki.@k@v10/10101368. .........I''m gonna keep on with my little research until the drowsiness hits."'
6871: 'George@r@v07/10300748."......That magic circle?"'
6872: 'Battler@r@v10/10101369."...Pretty much.@k@v10/10101370. We''ve got plenty of time to kill.@k@v10/10101371. ......I thought it''d be interesting to find out what kind of message the great BEATRICE-sama put in it."'
6873: 'Jessica@r@v04/10200754."............I wouldn''t.@k@v04/10200755. Keep that up and you''ll get possessed by something weird."'
6874: 'Battler@r@v10/10101372."Relax.@k@v10/10101373. I''ve been certified by Maria.@k@v10/10101374. ...She said I''m utterly lacking any spiritual talent.@k@v10/10101375. Ihihi...!"'
6875: 'Jessica@r@v04/10200756.".........Were we too...@v04/10200757..........cruel...@v04/10200758.to Maria?"'
6876: 'Natsuhi@r@v03/10900590."............Jessica.@k@v03/10900591. ...You mustn''t think that now."'
6877: 'Jessica@r@v04/10200759."But Mom...@k@v04/10200760. If Maria wasn''t involved, and the killer''s someone totally different,@v04/10200761. ......they''re obviously gonna go for the easy targets.@k@v04/10200762. ......If she''s killed because of this,@v04/10200763. .........then we''ve just...let her die..."'
6878: '@rA gloomy silence settled once again.@k ...It looked like Jessica regretted that she''d let her emotions take hold of her and snapped at Maria.'
6879: '@r......She always was like that.@k@r...Always acted tough, went too far, and regretted it later.'
6880: 'Natsuhi@r@v03/10900592."......I understand how you feel, but Maria was in close contact with the culprit,@k@v03/10900593. and what''s worse, she seemed to be taking their side with her endless series of mystifying statements.@k@v03/10900594. .........I am relieved that we chased her out."'
6881: 'Battler@r@v10/10101376."...That''s pretty harsh, Aunt Natsuhi.@k@v10/10101377. ......Couldn''t it just have been the nonsense of a nine-year-old girl?"'
6882: '@rEven I thought I was being brazen saying that...@k@rI myself had thought Maria was creepy on several occasions today, and had doubted her true nature.'
6883: '@r......And when Maria had been chased out of this room, I couldn''t deny that I''d felt some relief...'
6884: 'Natsuhi@r@v03/10900595."..................If that is the case,@k@v03/10900596. then tomorrow, I will apologize for what I did.@k@v03/10900597. ...I will take full responsibility for chasing them out of this room.@k@v03/10900598. ......This isn''t something that the rest of you have to worry about."'
6885: '@rI could feel a tragic determination in Aunt Natsuhi''s words.@k@r......To protect her own daughter, she would resolutely chase out the suspicious ones.'
6886: '@r...And if, as a result, she had left to die those people who had the misfortune to be suspected, so be it.@k ...She was prepared to take full responsibility.'
6887: 'Battler@r@v10/10101378."...Why does Maria have to keep saying stuff like that?@k@v10/10101379. She''s bringing about her own ruin..."'
6888: 'George@r@v07/10300749."..................I think that the reason Maria-chan adores witches and magic so much...@k@v07/10300750.......might be because of Auntie Rosa."'
6889: 'Battler@r@v10/10101380."Because of Auntie Rosa?@k @v10/10101381.What does she have to do with this?"'
6890: 'George@r@v07/10300751."......I think you must have realized it too, Battler-kun.@k@v07/10300752. ...Maria-chan''s real father ran off somewhere a long time ago.@k@v07/10300753. ...Although Auntie''s trying to cover it up by saying he''s on a foreign business trip."'
6891: 'Natsuhi@r@v03/10900599."............Talking about Rosa-san''s family has become a kind of taboo in the Ushiromiya family."'
6892: 'George@r@v07/10300754."I think Auntie even thought about remarrying.@k@v07/10300755. ......But I also believe Maria-chan may have become her shackles and made that quite difficult.@k@|@y@v07/10300756. ............After all, she sometimes...@k@v07/10300757.got incredibly emotional and took it all out on Maria-chan."'
6893: 'Jessica@r@v04/10200764."............I agree with you there.@k@v04/10200765. ......It looked like Auntie Rosa was trying hard to like Maria."'
6894: 'Jessica@r@v04/10200766."......Which means...@v04/10200767....that she didn''t really like her.@k@v04/10200768. .........I''ll bet she had some strong thoughts about Maria, standing in the way of her getting remarried..."'
6895: 'George@r@v07/10300758."...I think that the emotional rejection from her mother must have left some deep scars on her young heart.@k@v07/10300759. ......So when she learned about this occult hobby from somewhere, she immersed herself in it so she could fill the holes in her heart."'
6896: 'George@r@v07/10300760."......Did you know?@k @v07/10300761.To Maria-chan, the image of a witch isn''t negative at all.@k@v07/10300762. ...Remember yesterday, at the beach, when she showed us her notebook...?"'
6897: 'Battler@r@v10/10101382."......Yeah.@k@v10/10101383. ...It was full of all those fun-looking scribbles."'
6898: '@rYesterday, when we had doubted the witch down by the beach...@k@r...Maria had gotten all riled up and started explaining about witches.'
6899: '@rAnd not one of the pages had shown a picture of an ugly witch.'
6900: '@rThey were all brightly colored, beautiful, cute witches who looked like they were having fun.'
6901: '@rThere was absolutely nothing sinister about them, like a boy might have imagined;@k ...they were beings adorned with beautiful dresses, who could grant anyone''s dreams with their mysterious magic and who made everyone happy.'
6902: '@r......The sorrow of not being loved by her mother.'
6903: '@r...Had Maria sought salvation from the witches as beings who could save her from that sorrow and make her happy?'
6904: '@rSomeday a witch would come, and using her wonderful magic, would bring Maria happiness.'
6905: '@r......Even though she believed that, as she grew older, she had to face reality as her fleeting dreams were sliced to ribbons one by one.'
6906: '@r.........If, in front of a girl like that,@k something claiming to be the witch of Rokkenjima appeared,@k and whispered that she would take Maria to the Golden Land, where Maria could be happy...'
6907: 'George@r@v07/10300763."...........................@k@v07/10300764. ......I...@v07/10300765.......think it''s time I confessed what''s in my heart.@k@v07/10300766. ......Maybe throwing out Maria-chan,@v07/10300767. ......no, ......Genji-san and the rest too,@v07/10300768. ......was probably...the wrong thing to do..."'
6908: 'Jessica@r@v04/10200769."...............I do feel...@v04/10200770.......guilty..."'
6909: '@rSince Jessica had been the one to face them and slam them with words of rejection,@k ...her conscience must be tormenting her a lot right now.'
6910: 'Natsuhi@r@v03/10900600."Then, how do you all explain that letter?@k@v03/10900601. No one could have set it there except the four people standing behind me.@k@v03/10900602. I was able to see that quite clearly with my own eyes."'
6911: 'Natsuhi@r@v03/10900603."...If those four are innocent, how was that letter placed there in a locked room with eight people in it?"'
6912: 'Battler@r@v10/10101384."............That''s just it...@k@v10/10101385. ......When you put it that way, those four really do seem suspicious.@k@v10/10101386. .........But."'
6913: 'Battler@r@v10/10101387."...That''s no goddamn good.@k@v10/10101388. Yeah, it''s no goddamn good at all..."'
6914: 'George@r@v07/10300769."No good? ...What is?"'
6915: 'Battler@r@v10/10101389."Right.@k@v10/10101390. .........It might not be worth anything anymore, but let me flip over the chessboard again.@k@v10/10101391. ...What I mean is, if one of those four really is the culprit, it makes no sense."'
6916: 'Jessica@r@v04/10200771."...........................That''s right...@k@v04/10200772. ......Wasn''t setting that letter openly on the table the same as confessing that one of them was the culprit?"'
6917: 'Jessica@r@v04/10200773."...You''re right, that makes no sense.@k@v04/10200774. ......If you were gonna do that, you''d put it, like, in the crack of the door, to make it look like someone had slipped it in from the outside!@k @v04/10200775.Yeah, they must''ve known they''d be suspected if they didn''t make it look like the culprit was outside the room!"'
6918: 'Battler@r@v10/10101392."Yeah, that''s it exactly.@k@v10/10101393. ...If the culprit was one of those four,@k@v10/10101394. setting that letter right in the middle of the table would be both risky and meaningless."'
6919: 'Battler@r@v10/10101395."............But, putting aside whatever trick they used to set it there,@k@v10/10101396. ......if we assume that the culprit is someone other than those four, ...in other words, someone who was outside the room,@k@v10/10101397. then they had a lot to gain from that letter..."'
6920: 'Natsuhi@r@v03/10900604."...............Stop that, Battler-kun.@k@v03/10900605. ...At this point, that issue is insignificant."'
6921: '@rAunt Natsuhi quickly guessed what I was getting at.'
6922: '@r......No, maybe she had thought of it long before I had, and had simply held her tongue...'
6923: 'Battler@r@v10/10101398."......If the culprit was outside the room, ...then once we shut ourselves up in a locked room where the culprit couldn''t touch us, it was all over for them.@k@v10/10101399. .........That''s right.@k@v10/10101400. It''s the same as the theory I proposed about how Grandfather disappeared from this room, isn''t it?"'
6924: 'Battler@r@v10/10101401."......That theory that Grandfather left the room of his own accord.@k@v10/10101402. ...If the culprit used some tactic to lure him out, and Grandfather left of his own accord, then..."'
6925: '@rCome to think of it, ...even Maria had said it, when we found the scorpion magic circle on the doorknob to the study.'
6926: '@r......BEATRICE couldn''t get through this door.'
6927: '@rBut she might be able to induce someone to leave of their own accord.'
6928: 'Jessica@r@v04/10200776."......In that case,@v04/10200777. ............that would mean we fell for the culprit''s trap completely...@k@v04/10200778.and sent out some new potential sacrifices..."'
6929: 'Natsuhi@r@v03/10900606."............Genji and the rest aren''t fools.@k@v03/10900607. If they desired to protect themselves, they would quickly think of the next safest place after this room.@k@v03/10900608. They are surely hiding themselves there."'
6930: '@rAunt Natsuhi hadn''t answered the question.'
6931: '@r......She herself realized that if the culprit wasn''t in that group, that letter could easily have been a trap.'
6932: '@rHowever, it wasn''t worth the risk of calling back the people she had once thrown out.'
6933: '@r...To Aunt Natsuhi, right now, her greatest and only duty was to protect the children.........'
6934: '@rAnd to that end, she was thinking, a few sacrifices may be an unfortunate necessity...'
6935: 'Battler@r@v10/10101403.".........Hey, Aunt Natsuhi.@k@v10/10101404. Let me ask something a little difficult, alright?@k @|@y@v10/10101405.......If, by coincidence, Jessica had also been standing behind you at that time,@k@v10/10101406. .........would you have chased Jessica from the room too?"'
6936: 'Natsuhi@r@v03/10900609."......................................."'
6937: 'Battler@r@v10/10101407."Sure, there may have been a degree of cruelty to it.@k@v10/10101408. ...But, as a mother, you thought you should protect your daughter no matter what.@k@v10/10101409. And it was out of that duty that you sent them out, fully aware you''d eventually be held responsible for it."'
6938: 'Battler@r@v10/10101410."............I''m not trying to criticize you for it or anything.@k@v10/10101411. I just, umm.@k@v10/10101412. .........I was just thinking about what a great mother Jessica has."'
6939: 'George@r@v07/10300770."......Yes.@k@v07/10300771. ...You''ve been dealing with these incidents since morning, and you''ve been pulling all of us along this whole time, without losing your composure."'
6940: 'George@r@v07/10300772."......If you had been as confused as the rest of us, every last one of us may have been in the culprit''s grasp by now.@k@v07/10300773. ...So I think that we all have to thank you."'
6941: 'Natsuhi@r@v03/10900610."........................Thank you."'
6942: 'Jessica@r@v04/10200779."...............@k@v04/10200780. ...So what you''re trying to say is...this, right?@k @|@y@v04/10200781..........You want her to act as Maria''s mother too......?"'
6943: 'Natsuhi@r@v03/10900611."................................."'
6944: 'Jessica@r@v04/10200782."......I...@v04/10200783..........always thought of Maria as a real little sister and adored her.@k@v04/10200784. .........And yet,@v04/10200785. ......a bunch of things happened, we got a bit confused...@k@v04/10200786. ......And I said a lot of mean things to her and hurt her..."'
6945: 'Jessica@r@v04/10200787."..................Mom,@v04/10200788. ...please.@k@v04/10200789. .........Let''s stay with Maria,@v04/10200790. .........no, with everyone...@k@v04/10200791. .........There was no...@v04/10200792.culprit among us......@k@v04/10200793. Why can''t the culprit behind all this...@v04/10200794.......just be the witch, BEATRICE...?@k@v04/10200795. So let''s just......stop doubting each other......"'
6946: '@rAunt Natsuhi closed her eyes for a short while.'
6947: '@r...Was she coping with her throbbing headache again, ...or was she thinking of something...'
6948: 'Natsuhi@r@v03/10900612.".................................@k@v03/10900613. Jessica,@k@v03/10900614. .........you are my precious daughter, ......the daughter I was finally blessed with a whole twelve years after I married my husband.@k@v03/10900615. I would become the worst kind of demon to protect you."'
6949: '@rThat was some pretty strong language at the end there...@k@rShe realized very well that these were only words, but even so, she was strongly resolved to protect her daughter even if she had to become a demon.'
6950: '@r............But that was because she was tormented by guilt.'
6951: '@r.........Today had been so long.@k@r...So many things had happened in one day, ...and we had been put under such pressure...'
6952: '@r......I wonder if we have the right to greet tomorrow the way we are now......'
6953: '@r...............Th-...There it is.'
6954: 'Battler@r@v10/10101413."......I found it.@k@v10/10101414. ...It''s this magic circle."'
6955: '@rWithin the books I had been constantly flipping through, I had finally found the same magic circle that had been drawn on the second sheet of the letter.'
6956: '@rGeorge-aniki peered at it as well.'
6957: '@rThis magic circle''s name was......the third magic circle of Mars.'
6958: '@rThe Hebrew written on it was from the Old Testament''s Book of Psalms, Psalm 77, verse 13.'
6959: '@r"What god is so great as our God?"'
6960: '@rThe meaning of the magic circle was...@k......"discord".@k@r...It agitates internal divisions and causes the enemy to bring about their own downfall.'
6961: 'Battler@r@v10/10101415."............Whoa, whoa...@k@v10/10101416. Seriously......?"'
6962: '@rCould there be a more fitting way to describe our current situation and mental state?'
6963: '@rWe couldn''t help but be stunned into silence.'
6964: 'Jessica@r@v04/10200796."......So......this letter was a trap...?!@k @v04/10200797.How''d they put it here?!@k @v04/10200798.There wasn''t anyone in this room except for us eight!"'
6965: 'Battler@r@v10/10101417."A-anyway, let''s ignore how they got it in here for now.@k@v10/10101418. ......The culprit was after just one thing!@k @v10/10101419.They wanted to spread the seeds of doubt inside this impregnable study and use us to throw the sacrificial sheep out...!!"'
6966: 'George@r@v07/10300774."In that case...what they''re after...is the people who went out of the room......!!"'
6967: 'Jessica@r@v04/10200799."M-Mom, ......what should we do?!!@k @v04/10200800.Those four are in danger...!"'
6968: 'Natsuhi@r@v03/10900616."...................................."'
6969: '@rIt wasn''t surprising that Aunt Natsuhi remained unpleasantly silent.@k@r...Even if this was all a trap by the culprit, even if the four who had been chased out of the room were in danger,@k it had nothing to do with the safety of the four people in here.'
6970: '@rAnd there was no way to prove the innocence of the four people we had kicked out.@k@r......If we''re willing to let them die, then we shouldn''t leave this room no matter what.@k ...That way is...safest!!'
6971: '@rJust then, all of a sudden, the piercing sound of a phone rang through the room.'
6972: '@rIt was the antique extension phone that was set on Grandfather''s study desk.'
6973: '@r......It had started ringing right as we began this conversation.@k@rIt was only natural that we would think it an SOS from the others we had kicked out.'
6974: '@rBut then Aunt Natsuhi spoke.'
6975: 'Natsuhi@r@v03/10900617."How, .........how can the telephone be - ?!@k @v03/10900618.It should be broken down and unusable...!!"'
6976: 'Battler@r@v10/10101420."That doesn''t matter...!@k @v10/10101421.If that''s Maria and the others calling for help...!"'
6977: 'Natsuhi@r@v03/10900619."If the problem with the phones was the culprit''s work in the first place......@k@v03/10900620.then this phone call is...@v03/10900621.......more than likely......"'
6978: '@rWith that one sentence, the ring of the phone, which had sounded like a scream for help...started to sound like a ghastly summons from some unknown person...!'
6979: '@rAunt Natsuhi hesitated over whether to pick up the receiver.'
6980: 'George@r@v07/10300775."Le-let''s take it, Auntie...!@k @v07/10300776.The phones might have been fixed for some reason...@k@v07/10300777. It could still be an urgent call from Maria-chan and the rest...!"'
6981: 'Jessica@r@v04/10200801."That''s right...!@k @v04/10200802.And on the slight chance that it is a call from the killer, bring it on!@k @v04/10200803.Let ''em friggin'' talk...!@k @v04/10200804.It''s just a phone call.@k@v04/10200805. No matter what they babble through the receiver, it''s not like it''s gonna hurt you...!!"'
6982: 'Battler@r@v10/10101422."......If you won''t pick it up,@v10/10101423. ......then I will......!"'
6983: 'Natsuhi@r@v03/10900622."I, ......I will take it.@k@v03/10900623. ......Hello?"'
6984: '@rI stretched out my hand to take the receiver, but Aunt Natsuhi picked it up first as if to say she had it under control.'
6985: '@r...We all held our breath, trying to figure out who the person on the other end of the phone was...'
6986: '@rBut for a while, Aunt Natsuhi just kept saying "hello".'
6987: '@r.........A silent phone call...?@k@rThere''s no way Maria and the others would do something so creepy.'
6988: '@r......Which means...@w500....this phone call...@w500. .........Might it possibly,@w416. ...really.........'
6989: '@rNatsuhi stopped repeating "hello" and strained her ears.'
6990: '@r.........Because she thought she heard something far away on the other end of the receiver.'
6991: '@r............What was it......?'
6992: 'Natsuhi@r@v03/10900624."......Huh?@k @v03/10900625......................Is someone...@|@y@v03/10900626................singing...?"'
6993: 'George@r@v07/10300778."What do you mean......singing?"'
6994: 'Natsuhi@r@v03/10900627.".........I don''t know.@k@v03/10900628. Faintly, from the other end of the phone, ......I can hear someone singing......@k@v03/10900629. I wonder what...it could be......"'
6995: 'Battler@r@v10/10101424."G-give it here for a sec...@k@|@y@v10/10101425. Hello?!@k @v10/10101426..................................?!"'
6996: '@rI half forced the receiver from the stunned Aunt Natsuhi''s hand and pressed it against my ear.'
6997: '@r...............At first, I didn''t hear anything.'
6998: '@r...But, ......because I had been told about it beforehand, I noticed.'
6999: '@r............Not in a quiet voice, but rather, far away from the receiver,@k ...............I could hear a girl singing a song.'
7000: '@r......The voice sort of sounded like Maria''s, ...but that just made the situation even more inexplicable.'
7001: '@rAt the very least, the one who had made the phone call hadn''t been Maria.@k@rAfter all, Maria was singing some song far away from the receiver.'
7002: '@r......In that case, the one who made the phone call should have been Genji-san, Kumasawa-san, or Doctor Nanjo.'
7003: '@r............And yet, they weren''t saying anything.@k ...Why...?@k For what reason...@k ............Who was the person who made this phone call......?!?!'
7004: 'Battler@r@v10/10101427."Hey!!@k @v10/10101428.Hello?!!@k @v10/10101429.Who is it? Answer me!!@k @v10/10101430.Is that Maria singing?!@k @v10/10101431.Answer me!!"'
7005: 'Jessica@r@v04/10200806."Wh-...what''s going on?!@k @v04/10200807.What is it?!"'
7006: 'Battler@r@v10/10101432."I don''t know...!@k @v10/10101433.All I can say is,@v10/10101434. ...this is probably a trap, ......and Maria''s in trouble..."'
7007: '@rAunt Natsuhi took the receiver again, but after calling into it several more times, she realized that she wasn''t getting anywhere and hung up.'
7008: '@rShe then dialed quickly.@k ......And clucked her tongue.'
7009: '@rOh, right, if the phones are back, we should be able to reach the police.@k@r......But judging by her reaction, the outside line still wouldn''t connect.'
7010: 'George@r@v07/10300779."......Le-let''s go!@k @v07/10300780.Even if we know it might be a trap, we have to go!"'
7011: 'Battler@r@v10/10101435."Yeah, absolutely!!@k @v10/10101436.Jessica, Aunt Natsuhi, stay here!"'
7012: '@rWhen Aniki and I tried to dash out, Aunt Natsuhi stopped us.'
7013: 'Natsuhi@r@v03/10900630."Wait just a minute.@k@v03/10900631. .........I cannot let you go alone.@k@v03/10900632. I will go too.@k@v03/10900633. Jessica, you wait here."'
7014: 'Jessica@r@v04/10200808."And you''d have me be the only one left out?!@k @v04/10200809.Not a chance, I''m coming too...!!"'
7015: 'Battler@r@v10/10101437."Yeah, it might be better that way.@k@v10/10101438. ...If the goal of that phone call was to split us up further, it wouldn''t be a good idea to leave someone to watch this room."'
7016: 'George@r@v07/10300781."There''s no time to argue.@k@v07/10300782. Let''s all go!"'
7017: '@rAunt Natsuhi raised the rifle high and took the lead.'
7018: '@rI needed a weapon myself as well.'
7019: '@rI found a three-pronged candelabra, which looked like it could be used for some strange ritual, and armed myself with it.'
7020: '@rWith the spikes it had to fit the candles on, although they were short, it was almost like a three-pronged spear.'
7021: '@rThen the four of us left the study.@k We left the study, which should have been the safest place inside the mansion.'
7022: '@rAnd so we had been lured out, despite the fact that we had barricaded ourselves in a safe locked room,@k ...and perhaps, we were even...@k...repeating exactly the same series of events that had led to Grandfather disappearing from there...'
7023: 'Jessica@r@v04/10200810."Mariaaa!!@k @v04/10200811.Where are youuu?!@k @v04/10200812.Answer meee!!"'
7024: '@rI listened closely, but didn''t hear anything...@k@rThe mansion was vast, and the sound of the rain even noisier than before, as if the passing typhoon was making its last stand.'
7025: 'George@r@v07/10300783."...Maria-chan said that she wanted to watch TV in the parlor, right?!@k @v07/10300784.Let''s try going downstairs!"'
7026: 'Natsuhi@r@v03/10900634."............Yes.@k@v03/10900635. Good idea.@k@v03/10900636. ......Everyone, be mindful of your surroundings!"'
7027: 'Battler@r@v10/10101439."Yeah!!"'
7028: '@rWith Aunt Natsuhi in the center, her rifle readied and her finger on the trigger,@k we moved in a group, our backs together, checking our surroundings in all directions......'
7029: '@rAs though the power of that magic circle designed to spread discord had brought it all into being,@k ...we had split up, and furthermore, had been dragged into dangerous territory.'
7030: '@r......In other words, even now in this very moment, we were doing just what the culprit wanted us to do.@k ...This was now a strange space where it wouldn''t be odd for anything to suddenly occur...'
7031: '@rAunt Natsuhi nervously pointed the barrel of the gun at every dark spot and shadow.'
7032: '@rIt felt like that motion was out of fear rather than caution...'
7033: '@rBut the rifle she held in her hand would surely also be our trump card that the killer was afraid of...'
7034: 'George@r@v07/10300785."......You know, I''ve been thinking.@k@v07/10300786. ...It wouldn''t be impossible to stick one of those "icepicks" into someone''s chest, like in Kanon-kun''s case.@k@v07/10300787. ......But splitting the skull and sticking them into the forehead, like it was with my parents, wouldn''t be that easy."'
7035: 'Battler@r@v10/10101440."You think the culprit had that kind of animal strength...?!"'
7036: 'George@r@v07/10300788."...They probably have some kind of weapon, a device that can shoot or pound in those "icepicks".@k@v07/10300789. That handle was too short to be driven in that deeply by human strength alone."'
7037: 'Natsuhi@r@v03/10900637."......Whatever the case, they have enough force to break through a skull.@k@v03/10900638. ...It seems that Kanon''s wound even reached his lungs.@k@|@y@v03/10900639. ......Even if you see our opponent, do not step out in front.@k@v03/10900640. You must not move away from my back."'
7038: '@rJust how sinister and frightening was this weapon that could shoot those creepy icepicks?'
7039: '@r......And could I do anything to combat it with just this candlestick in my hand?'
7040: '@rIn the first murder, the culprit had probably assaulted four of our parents at once as they discussed the inheritance problem in the dining hall.@k@r...And we also had four people.'
7041: '@r......Apparently, I wasn''t the only person thinking this.'
7042: '@r......George-aniki,@k Jessica,@k ...and, of course, Aunt Natsuhi...@k...were stretching their senses to the utmost limit, in the highest and worst state of tension, slowly advancing one step, then another...'
7043: '@r.........Aaah, what sinful people are we...'
7044: '@r...A world as terrifying as this, ......and we pushed Maria and the rest right into the middle of it, just because of the seeds of doubt spread by that single letter...'
7045: '@rWe finally reached the first floor.@k .........The parlor was just across the hall.'
7046: '@rWhen we listened carefully, .........we could hear it faintly.@k@r......Maria''s eerie singing voice.'
7047: '@rShe wasn''t singing naturally, as though she were in a good mood.'
7048: '@r.........She was singing mechanically, as if she was in music class in school and had been ordered to sing.'
7049: '@r...The song she was singing was just a common folk song, one that everyone has probably sung in school at one time or another.'
7050: '@r......But why that, in the middle of the night, alone, with all her heart, over and over, why...?!'
7051: '@rWhen we had just left the study, we had called out in loud voices, asking Maria where she was.'
7052: '@r...But this time, no one said even a single word.'
7053: '@r......We hid our breath and the sound of our footsteps, heightened all our senses, and examined everywhere around us to a neurotic degree......as we advanced each step...'
7054: '@rThe door to the parlor was closed.@k@rBut we could hear Maria''s singing voice through it...'
7055: '@rAunt Natsuhi put her hand on the handle of the doorknob...@k George-aniki stopped her.'
7056: 'George@r@v07/10300790."...I''ll open the door...@k@v07/10300791. Aunt Natsuhi, Battler-kun, ready your weapons."'
7057: 'Natsuhi@r@v03/10900641."............All right.@k@v03/10900642. ......Be careful."'
7058: 'Jessica@r@v04/10200813."They might attack as soon as we open it...@k@v04/10200814. George nii-san, watch yourself...!"'
7059: 'George@r@v07/10300792."...Sure...@k@v07/10300793. .........OK then, ......here we go...!@k @v07/10300794.............nn?!"'
7060: '@rHe tried to open it, but immediately felt the hard resistance of the lock.'
7061: '@rAunt Natsuhi took the bundle of keys from her pocket and gave them to George.'
7062: '@r......There were about ten keys, and none of us had a clue which was which.'
7063: '@rBecause of this, George had to fumble around loudly and test several of the keys.'
7064: '@r......Since we had hidden our footsteps, preparing to make a surprise attack on the room, this felt almost fatal...'
7065: '@rThe whole time, we could hear Maria''s voice from the parlor, singing the same song over and over.'
7066: '@r......It was like a broken, crazy cassette tape...'
7067: '@rIn the morning, we had been in that room the whole time.@k@r...All of the frightening things had occurred outside that room.@k@r...So, we had convinced ourselves that even if nowhere else could be trusted, that room alone was safe.'
7068: '@r.........That baseless impression was quickly falling apart......'
7069: 'George@r@v07/10300795."............Nn, .........it unlocked."'
7070: 'Natsuhi@r@v03/10900643."...Thank you.@k@v03/10900644. George-kun, Jessica, move behind me."'
7071: 'Battler@r@v10/10101441."......Auntie.@k@v10/10101442. Let''s all jump in at once and split up in different directions.@k@v10/10101443_b. If we just stand around after opening the door, those icepicks might fly right through the center...!"'
7072: 'Natsuhi@r@v03/10900645."I''m well aware.@k@v03/10900646. .........Ready...?"'
7073: 'Battler@r@v10/10101444."Ihihi...!@k @v10/10101445.Actually, I kinda wish I could call it quits...!"'
7074: '@rI readied myself.@k@r...If they''re going to throw icepicks at me, we''ll see how they like my candlestick!!'
7075: 'Natsuhi@r@v03/10900647."......Go!!!"'
7076: '@rAunt Natsuhi and I rammed into the door as we flew into the parlor,@k quickly splitting up left and right, and searching the parlor for someone who might be waiting for us.'
7077: '@rBut what our eyes landed upon...@k.........was an altogether...@w500..........outlandish scene...'
7078: '@rThe parlor.........was stained with blood.'
7079: '@rThis place, where we had spent almost the entire day,@k where we had pressed in together to protect ourselves from some unknown malice,@k had become stained with fresh blood, had become an ocean of blood...!!'
7080: '@rOn the floor lay Genji-san, Kumasawa-san, and Doctor Nanjo, their entire bodies stained bright red with blood...@|@y'
7081: '@r.........But the only way we could identify them was by their clothes.'
7082: '@r......That was because......aaah, that''s right, this was how this whole tragedy started...!!'
7083: '@rTheir faces were all mashed up like Dad and the others in the storehouse, ...and you couldn''t even tell where the eyes and noses were!!'
7084: '@rIt was like someone had vulgarly gobbled apart a tomato pot stew wrapped in a pie crust, ......all globby and sloppy, ...uuwaaaaaaAAAAAAaaaaaaAAAAaahhh!!'
7085: '@rAnd that wasn''t all.@k@rTheir bodies had other wounds.'
7086: '@r......They were those "demon''s icepicks"!@k@rThey were in......Genji-san''s stomach, Doctor Nanjo''s thigh - no, his knee?@k@rYeah, it would be his knee...! In the epitaph, the sixth twilight was the stomach,@k@rand on the seventh twilight, it said to gouge the knee!'
7087: '@rSo after seeing one of them stuck near Kumasawa baa-chan''s calf, I couldn''t help masochistically laughing "yeah, of course it would be"...!!'
7088: '@rOn the sixth twilight, gouge the stomach and kill.@k@rOn the seventh twilight, gouge the knee and kill.@k@rOn the eighth twilight, gouge the leg and kill.'
7089: '@rAaaaaah, ......now even the eighth twilight is over.@k And the next one, the ninth twilight, ......what was it again...?'
7090: '@rMaria......was there.'
7091: '@r.........She was facing the far wall, ...standing stock still, completely alone.'
7092: '@rFacing away from this horrible scene, standing in front of the wall, singing her song over and over...'
7093: '@rThere was nothing else in the room.'
7094: '@r......Just the corpses of the three who had been brutally killed, ...and the receiver, still off its hook, showing that it had been this room that the call had come from.'
7095: '@r.........Just that and Maria, her back to this scene, facing the wall as she kept on singing......'
7096: '@r......We couldn''t even scream at this......bizarre scene.'
7097: '@r...We could only stare shocked, our mouths hanging loosely open......'
7098: 'Jessica@r@v04/10200815."Ma-.........Maria............?"'
7099: '@rJessica called out to her.'
7100: '@r...But Maria showed no reaction.@k@r.........Alone, she kept singing, on and on......'
7101: '@rWe had come here trying to save Maria from some approaching danger.'
7102: '@r...So, now that we had found her, we should have been running up to her, hugging her, joyous that she was safe.@k ......And yet, not one of us could do that...!'
7103: '@rEveryone thought it. But they couldn''t say it.@k After all, because...because...that''s right, it''s crazy, and yet......but no, it couldn''t be.........!!'
7104: 'Battler@r@v10/10101446."Ma-......Maria!!@k @v10/10101447.Stop singing!!@k @v10/10101448.Are you listening?!!"'
7105: '@rAt some point, ...Aunt Natsuhi and I had pointed our weapons at Maria''s back.'
7106: '@r......I yelled at Maria in a violent voice.@k@r......But there was no reaction.@k@rShe just kept singing...!!'
7107: '@rWith the candlestick still readied, I ran up to her, and forcefully - no, violently slammed my hand down on her shoulder.@k Then I pulled on her shoulder, forcing her to turn around!'
7108: 'Maria@r@v13/10400860."......Uuoa.@k@v13/10400861. ............Uu."'
7109: '@rMaria''s small body was quickly pulled down and fell.'
7110: '@r...And, as though unhappy about how her singing had been interrupted, ......she looked into my face with her usual expression.'
7111: '@rEven in this gruesome situation,@w500. she was just like normal!!'
7112: 'Battler@r@v10/10101449."Maria, what the hell is this?!@k @v10/10101450.Who, ...who did this?!"'
7113: 'Maria@r@v13/10400862.".........Uu.@k@v13/10400863. BEATRICE."'
7114: 'Battler@r@v10/10101451."Enough of that fucking bullshit!!!"'
7115: '@rI threw the candlestick I had been holding against the wall.@k@rThe violence of that reckless sound should have gone straight into Maria''s heart.@k@r......But her expression didn''t change at all!'
7116: 'George@r@v07/10300796."Battler-kun, stop!@k @v07/10300797.Maria-chan, ......this time, you should have seen the face of the culprit who killed these three.@k@v07/10300798. Was the culprit......the same BEATRICE who gave you the letter?!"'
7117: 'Maria@r@v13/10400864."......Uu.@k@v13/10400865. BEATRICE."'
7118: 'Battler@r@v10/10101452."Well, now we know for sure.@k@v10/10101453. There is a 19th person, BEATRICE does exist!!"'
7119: 'Battler@r@v10/10101454."Then, Maria, I''m sure you''ll tell me this, at least?@k @v10/10101455.How did they kill these three people?@k@v10/10101456. What the hell did they do to them to kill them in such a brutal way?!"'
7120: 'Maria@r@v13/10400866."......Don''t know."'
7121: 'Battler@r@v10/10101457."How could you not know?!@k @v10/10101458.It happened in this room!!@k @v10/10101459.Are you trying to tell me you were so absorbed in singing that song that you didn''t even notice?!"'
7122: 'George@r@v07/10300799."Calm down, Battler-kun!!@k @v07/10300800.Ma-...Maria-chan.@k@v07/10300801. Let''s you and me have a chat.@k@v07/10300802. ...Okay?"'
7123: '@rGeorge-aniki, as he always did, crouched down next to Maria so that their eyes met, and talked to her very kindly...'
7124: 'George@r@v07/10300803."...Maria-chan, ......can you tell me why were you facing the wall and singing that song...?"'
7125: 'Maria@r@v13/10400867.".........Uu.@k@v13/10400868. ...BEATRICE said to face the wall and keep singing for a long time.@k@v13/10400869. Uu."'
7126: 'George@r@v07/10300804."So BEATRICE came here, then?!@k @v07/10300805.Genji-san and the rest were still alive at that point, right?!"'
7127: 'Maria@r@v13/10400870."......Uu.@k@v13/10400871. We all came into the parlor together and sat down.@k@v13/10400872. ......Genji-san made sure to lock the door."'
7128: 'Jessica@r@v04/10200816."It was locked when we got here......but then, how did BEATRICE get into the parlor?!!"'
7129: 'Maria@r@v13/10400873."Uu.@k@v13/10400874. But BEATRICE is a witch so locks don''t matter.@k@v13/10400875. She turned into butterflies and came in through the crack in the door."'
7130: 'Battler@r@v10/10101460."Huuhh?!@k @v10/10101461.Give it a rest with your goddamn jokes!!!@k @v10/10101462.Like hell that happened!@k @v10/10101463.What are you going on about?!"'
7131: 'Maria@r@v13/10400876."Kihhihihihihihihihihihihihihihihihihihi!!@k @v13/10400877.You can''t believe it?@k @v13/10400878.That''s why I didn''t want to say.@k@v13/10400879. Even if I tell you, you don''t believe."'
7132: 'Maria@r@v13/10400880."But BEATRICE is a witch.@k@v13/10400881. She can do anything with her strange magic.@k@v13/10400882. That''s why BEATRICE doesn''t care whether a door is locked or not.@k@v13/10400883. Kihihihihihihihihihihihihi...!"'
7133: 'George@r@v07/10300806."A-and then?! After BEATRICE appeared, what happened to everyone?!"'
7134: 'Maria@r@v13/10400884."......BEATRICE talked to us.@k@v13/10400885. She said Grandfather''s study was protected by a powerful force, and she couldn''t enter no matter what she did.@k@v13/10400886. So she told us she''d select the three sacrifices from the four people in the parlor.@k@v13/10400887. ......They all begged her not to."'
7135: 'Maria@r@v13/10400888."Kihihihihihihihihi, Kumasawa-san kept saying "please, please don''t".@k@v13/10400889. But BEATRICE chose.@k@v13/10400890. ......And when she did, she said I would be fine.@k@v13/10400891. .........Why do you think?"'
7136: 'Maria@r@v13/10400892."It''s because I had the scorpion charm with the fifth magic circle of Mars, upon which Battler prayed for my safety and which he put his feelings into.@k@v13/10400893. Because of that power, BEATRICE couldn''t do anything to me, and me alone."'
7137: 'Maria@r@v13/10400894."So she decided to use the other three for the sacrifices.@k@v13/10400895. And then she said this to me."'
7138: '@r@v27/10700008.@z70. -  Come, face the wall and sing a song for me.@k@r@v27/10700009.......You will sing lots and lots of songs, so no matter what happens, no matter what you hear, you won''t hear you won''t hear you won''t know.@k@r@v27/10700010.Come, let me hear many fun songs.'
7139: 'Maria@r@v13/10400896."So I was singing the whole time.@k@v13/10400897. Over and over.@k@v13/10400898. So I didn''t hear anything, didn''t know anything.@k@v13/10400899. ...And then all of you came.@k@v13/10400900. Uu."'
7140: 'Battler@r@v10/10101464."You expect me to believe that crap?!@k @v10/10101465.Don''t take me for a moron!!!"'
7141: 'Maria@r@v13/10400901."Kihhihihihihi!@k @v13/10400902.Then who will you suspect this time?@k @v13/10400903.Suspect me?@k @v13/10400904.Try killing me right here?@k @v13/10400905.Even if you do that, BEATRICE won''t stop "existing".@k@v13/10400906. Now, the eighth twilight is over, and BEATRICE will revive!!"'
7142: 'Battler@r@v10/10101466."No she fucking won''t, I''m done with your shit, I''ve had enough to last me a lifetime!!@k @v10/10101467.There''s no such thing as witches, that crap won''t work on me!!!"'
7143: 'Battler@r@v10/10101468."I won''t accept it, BEATRICE doesn''t "exist"!!@k @v10/10101469.I''ll never accept that she does!!@k @v10/10101470.So I won''t let her exist, I won''t let her revive!!@k @v10/10101471.The legend''s a legend and that''s all it''s ever gonna be.@k@v10/10101472. I won''t accept something like that!!!!!!!!"'
7144: 'Jessica@r@v04/10200817."Battler, stop...!!@k @v04/10200818.It''s not like Maria killed them or let them die!!@k @v04/10200819.B-BEATRICE came, and Maria had to obey, unable to resist...!!"'
7145: 'George@r@v07/10300807."............Huh?!@k @v07/10300808.A-......Aunt Natsuhi?@k @v07/10300809.Sh-she isn''t here...!"'
7146: 'Battler@r@v10/10101473."Huh? What?!"'
7147: 'Jessica@r@v04/10200820."M-Mom? Where did she go......?!"'
7148: 'Maria@r@v13/10400907."...............She went out by herself just now, reading a letter."'
7149: '@rLetter?!@k Th-that makes sense, the culprit''s done with the eighth twilight and it''s all gone swimmingly for them.'
7150: '@rThey might well have left a letter so they could brag even more.'
7151: '@rWe had been so wrapped up in questioning Maria that we forgot to look for one...!'
7152: '@rBut even as well armed as she was, why had she left the room all by herself in this dangerous mansion after reading it?!'
7153: '@rJessica tried to chase after her and tugged at the handle to the door, but it resisted strangely and wouldn''t open...!'
7154: 'Jessica@r@v04/10200821."Mom, Mom!!"'
7155: 'Jessica@r@v04/10200822."What''s going on?!!@k @v04/10200823.Open... Open...!!!"@|@y'
7156: '@rIt was only natural.@k ......Natsuhi had picked up the candlestick, which Battler had thrown at the wall and which had fallen to the floor.'
7157: '@r.........She had then skillfully wedged it between the doorknobs on the double doors like a bolt, holding them closed.'
7158: '@r...The intricate design of the candlestick meant it jammed well, and formed a truly sturdy seal on the door.'
7159: '@rThe tragic scream of a daughter for her mother...@k@rDid it reach Natsuhi''s ears, or not...?'
7160: '@rNatsuhi was...@w250.......alone in the entrance hall.'
7161: '@rIt was the place where the portrait of BEATRICE had been hung.'
7162: '@rNatsuhi threw down the final letter from BEATRICE that she had read in the parlor,@k readied her rifle again, and in a voice that rang clear, yelled in the massive space that was the entrance hall.'
7163: 'Natsuhi@r@v03/10900648."......I am Ushiromiya Natsuhi, representative of the Ushiromiya family!!!@k @v03/10900649.Show yourself,@v03/10900650. ...Golden Witch, BEATRICE!!!"'
7164: '@rThe entrance hall was dimly lit.@k Other than a faint light which shone on the center of the room, everything was blotted out by the jet-black darkness.'
7165: '@r......In that darkness,@w500. .........butterflies glittering in gold squirmed, twinkled,@w500. ......and sneered.'
7166: '@rNatsuhi gave one more huge gulp, and pointed the cold barrel of the gun at the gold butterflies......'
7167: 'Natsuhi@r@v03/10900651."............At last...@k@v03/10900652..........you have shown yourself.@k@v03/10900653. ...............I still can''t believe...@v03/10900654.......that something like you really existed...@k@v03/10900655. ......But that isn''t a problem."'
7168: 'Natsuhi@r@v03/10900656."......Both I, bearing the title of representative to the Ushiromiya family,@k@v03/10900657. and you, claiming to have succeeded the head of the Ushiromiya family, are here right now.@k@v03/10900658. ......At this point, whether you are a witch or not is a trivial problem!"'
7169: 'Natsuhi@r@v03/10900659."...............Come,@v03/10900660. ...let us settle this.@k@v03/10900661. ...Which of us will truly succeed the Ushiromiya family?@k@v03/10900662. ...Me, Ushiromiya Natsuhi,@k@v03/10900663. ............or you,@v03/10900664. ......BEATRICE!!@k @v03/10900665.Allow me to respectfully accept your request for a duel...!!"'
7170: '@rThe gold butterflies slowly formed a human shape, which walked into the dim light...'
7171: '@rNatsuhi readied the rifle,@w333. ......and glared.'
7172: '@rThe witch raised her golden staff overhead,@w500. ...and laughed.'
7173: '@rNatsuhi''s finger...@w666.slowly squeezed the trigger.........'
7174: 'Battler@r@v10/10101474."And...gooooooooooooooooo!!!"'
7175: '@rBattler made an all out dash at the door and rammed into it, crushing the candlestick which had been barring it, and making it possible for a big gap to be opened in the door.'
7176: '@rHe kept kicking the candlestick through that gap, and the door was finally released.'
7177: '@rAt that time, they heard it.@k@r...They clearly heard, just once, the crisp sound of gunfire...!'
7178: 'Jessica@r@v04/10200824."Mom!!@k @v04/10200825.Moooooooooooooooom!!!"'
7179: 'George@r@v07/10300810."Jessica-chan, you mustn''t run off by yourself...!!"'
7180: 'Battler@r@v10/10101475."That was the sound of a gun just now!!@k @v10/10101476.Aunt Natsuhi just shot!!"'
7181: '@rAt who?@k At the culprit!!!'
7182: '@rThe noise had come from the entrance hall.@k@rAnd the entrance hall......looked like a stage.'
7183: '@rLike the heroine of a tragedy, lying down and bathed in light,@k .........arrayed in the beauty of that silence,@k ......Aunt Natsuhi was face up, crumpled on the floor......'
7184: '@rHalf-crazed, Jessica ran up to Aunt Natsuhi.'
7185: '@r...On her forehead,@w500. ...it was almost as though a sparkling shard of pigeon''s blood ruby had been placed there.@|@y'
7186: '@r......And,@w500. ......from it, a single stream...@w416..........of blood makeup...@w500.passed by her eye,@w500. and began to traverse her face......'
7187: '@rThe faint smell of gunpowder smoke came from the barrel of the rifle Aunt Natsuhi still grasped.'
7188: '@r............Huh?@k Then,@w583. .........then,@w500. ............she...@w333....shot...@w500.herself......in the forehead...?!@k Why?!'
