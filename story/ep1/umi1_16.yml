7194: '@rJessica clung to her mother''s corpse, crying earnestly...'
7195: '@rMy body consumed by an anger I didn''t know what to do with, I stole the rifle from Aunt Natsuhi''s hand,@k and spun around, pointing the barrel of the gun into the darkness on all sides, as though I was pointing a light from a lighthouse, trying to find the culprit.'
7196: '@rGeorge-aniki, even in this situation, was trying to calmly figure something out, but that effort might have been doomed to futility.'
7197: '@r............And Maria alone was completely indifferent.@k@r......Is she treating this as some kind of predetermined fate?'
7198: '@rNo, that''s not it.@k This is all......a prelude to a wonderful world.'
7199: '@rThe door to the Golden Land will finally...@kopen.'
7200: 'Maria@r@v13/10400908."......On the ninth twilight, the witch revives, and none shall be left alive.@k@v13/10400909. ......And on the tenth twilight, the journey ends, and you shall reach the Home of the Gold."'
7201: 'Maria@r@v13/10400910."......It''s all over now, BEATRICE.@k@v13/10400911. Congratulations, congratulations.@k@v13/10400912. ...So lead me, lead me to the Golden Land you told me of...@k@v13/10400913. ...Right now......!!"'
7202: '@rThere, all of the dead will be resurrected, and even the love they once possessed will be revived.@k@r............So, in Maria''s eyes, it''s just as though all of today''s tragedies never even happened.'
7203: '@rAnd all those days she spent deprived of love never happened either.'
7204: 'Battler@r@v10/10101480."Will you cut that out?!@k @v10/10101481.What''s so fun, what''s to be congratulated?!!@k @v10/10101482.There were eighteen people on this island!@k @v10/10101483.Fourteen are dead!@k @v10/10101484.Only the four of us are left!!"'
7205: 'Battler@r@v10/10101485."I''m definitely not gonna die!@k @v10/10101486.Until the night is over - no, until the typhoon passes, and the seagulls gather again at the harbor, I''m definitely not gonna die!!@k @v10/10101487.I''m gonna survive, I''m gonna survive, definitely!!"'
7206: 'Maria@r@v13/10400914."............Kihihihihihi.@k@v13/10400915. Give it up, Battler.@k@v13/10400916. ...Guns are meaningless against BEATRICE.@k@v13/10400917. Besides, survival and everything else doesn''t matter now, because it''s over.@k@v13/10400918. The journey has already ended.@v13/10400919. ......See, look at the clock."'
7207: '@r...Huh?@k The clock?@k@rHearing those words, I looked at my wristwatch.'
7208: '@rBoth hands were almost touching near the top.@k@r......Very soon, it would be 12 a.m.@k ...In other words, 24:00.'
7209: '@rWhen you think about it, isn''t 24:00 a strange time?@k@r...It can be called 24:00, and it can also be called 0:00.'
7210: '@rIt''s the hour at the culmination of the previous day, ...and at the same time, it is hour zero as the next day begins.'
7211: 'Maria@r@v13/10400920."............BEATRICE!!"'
7212: '@rMaria suddenly called out happily, and ran towards the darkness.'
7213: '@rIt was almost as though......BEATRICE was somewhere in that darkness, and Maria was running up to her.'
7214: '@rAs I looked down the barrel of the rifle,@k as Jessica hugged her mother''s corpse,@k as George-aniki stood there shocked,@k ......we gazed into the darkness...'
7215: '@rOur eyes...fixed just in front of BEATRICE''s portrait.'
7216: '@rAnd there, Maria leapt into a hug...@k...with the portrait''s...@w583.subject.'
7217: '@rYou''ve got to be kidding me,@w250. ......this is...ridiculous, impossible...'
7218: '@r...This madness can''t possibly be,@w416. ...witches don''t "exist", I won''t accept it...!'
7219: '@rThings like you must not "exist",@w500. because this is a human world - you think I could accept something that''s not human?! Never, I will never!!'
