7221: '@rThen, I sighted the witch down the barrel...'
7222: '@rMaria turned around.@k@r......Still clinging to the Golden Witch, she turned around.'
7223: 'Maria@r@v13/10400921."......Didn''t I tell you it''s meaningless?@k@v13/10400922. ............Mere lead bullets are meaningless against BEATRICE."'
7224: 'Maria@r@v13/10400923."......Humans are so stupid, aren''t they?@k@v13/10400924. ......Kihihihihihihihihihihihihihihihihihihihihi."'
7225: 'Battler@r@v10/10101488."I won''t accept the existence of witches!!@k @v10/10101489.Who are you?!!@k @v10/10101490.Just try moving one step, just try moving one finger!!@k @v10/10101491.I''ll blast you away!!!"'
7226: 'Maria@r@v13/10400925."Kihihihihihihihihihihihihihihihihihihihihi,@v13/10400926. *giggle* *giggle* *giggle* *giggle* *giggle*"'
