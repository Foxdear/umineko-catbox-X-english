1349: 'Jessica@r@v04/10200178."......It''s the witch from Grandfather''s delusions.@k@v04/10200179. ...Ever since he had this picture hung up, he''s been losing the distinction between fantasy and reality."'
1350: 'Jessica@r@v04/10200180."......To us, it''s no more than the witch from his imagination, but to Grandfather, she''s a being who "exists" on this island.@k@v04/10200181. ......''Exists''.@k@v04/10200182. That''s why he says he had that picture painted—so that we''d understand."'
