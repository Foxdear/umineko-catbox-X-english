1329: '@r...I think I already said this, but Rokkenjima is a small island that''s only about ten kilometers around.'
1330: '@rHowever, considering that only the Ushiromiya family lives here, that''s quite large.'
1331: '@rSo, only a harbor and the site around the mansion were set up to be lived in;@k beyond that, the island remained as untouched as it was when it was still uninhabited.'
1332: '@rTo understand just how dangerous a vast and empty forest with no lamplight, phones or people passing through it at all actually is,@k you need to shift your urban assumptions a little.'
1333: '@rYou see, if by any chance you fell down a hole in the depths of the forest and sprained your ankle...@kcry or scream, no one would come save you.'
1334: '@rIf it then got dark, the forest, where there are no streetlights, would become enshrouded in complete darkness.'
1335: '@rAlso, since there obviously aren''t any guideposts here, it''s easy to get lost and lose your sense of direction in the dark forest.'
1336: '@rNowadays, most people see a forest as a peaceful place,@k but to the people of bygone eras, before the light of civilization drove out the night, forests were like oceans on land, geographically separating one culture from another.'
1337: '@rJust as fishermen who go out into the ocean occasionally have their lives put in danger despite their technical knowledge...'
1338: '@r...technical knowledge was also demanded of hunters who went out into the forest,@k and their lives were occasionally put in danger just the same.'
1339: '@r...If a child were to go play in that dangerous forest, something terrible might happen.'
1340: '@rSome parent must have had that thought.@k ...Maybe my Grandmother, or possibly, the man himself, my grandfather might have said it.'
1341: '@rOr maybe it was a story handed down on this island from long, long ago.'
1342: '@r.........There''s a terrible witch in the forest, so you must not go in.'
