1377: '@rThe seating order, as you faced the seat of honor, went from left to right in rows of two, with the ranking being lower the further you were from it.'
1378: '@rSo, on the left-hand side of the row closest to the seat of honor was the second-ranked seat, belonging to the eldest of the adult siblings—Uncle Krauss.'
1379: '@r.........It looked like he hadn''t arrived yet either, so that seat was empty.'
1380: '@rAnd then opposite him, on the right-hand side of the first row, sat the eldest daughter of the family, Auntie Eva, ranked at number three.'
1381: '@rThe left-hand side of the second row was for number four.@k@rThere sat the old bastard, Rudolf, as the third of the siblings.'
1382: '@rOpposite him sat number five, the youngest sibling, Auntie Rosa.'
1383: '@rGoing like this, you might think that the next ones to come would be their husbands and wives, but...@k@|@yguess again, because the left-hand seat in the following third row, meaning rank number six, was actually Jessica''s seat.'
1384: '@rOpposite her was George-aniki.'
1385: '@rThen, the seat next to Jessica was me,@k@|@y and opposite me was Maria.'
1386: '@rAnd next to me, on the left-hand side of the fifth row, all the way down at number ten, finally came Aunt Natsuhi.'
1387: '@r...Opposite her was Uncle Hideyoshi,@k@|@y and next to Aunt Natsuhi, in the sixth and final row on the left-hand side, was Kyrie-san.'
1388: '@rThe seat opposite to Kyrie-san had been laid out like the others, but was empty.'
1389: '@rAccording to this ranking system, that spot was the seat where Auntie Rosa''s husband should be sitting.'
1390: '@r......He hasn''t come, as far as I know, yet the table had been laid for his seat.'
1391: '@rThese kind of ranking orders usually permit the spouse a corresponding status, but the Ushiromiya family had an original kind of ranking.'
1392: '@r......Maybe it''s a leftover of male chauvinism.@k@rUnder the notion that a mother''s womb is only a temporary house for the child and she contributes no genes, the children of direct descent would have the highest ranking, followed by the grandkids.'
1393: '@rMeaning that the spouses, with no blood ties, would be considered the last in line.'
1394: '@r......It''s terrible, but according to that ranking order, Grandmother, if she was still alive,@k would be in a position even lower than mine.'
1395: '@rIn youth, obey your father; after marriage, your husband; after aging, your children.'
1396: '@rA leftover of the times when they used to say, "Women: no home in three worlds".'
1397: '@rLong ago, when I was still incapable of figuring all this out,@k I''d thought it was so great that we could all chat with the adult siblings sitting in their group and us cousins in ours.@k However, now that I can reexamine the seating order after growing up a bit, it stirs up some very complicated feelings in me...'
1398: '@rAunt Natsuhi, married to the eldest son of the family, responsible for managing the household, and number two for all practical intents and purposes, sat to my right,@k ...which meant that she was two steps lower than me in the ranking order.'
1399: '@r...It was difficult to guess what was going through her head.@k@rThat''s why I made a small apologetic gesture before sitting down.'
1400: 'Natsuhi@r@v03/10900020."How nice to see you, Battler-kun.@k@v03/10900021. You''ve grown quite tall, haven''t you?"'
1401: 'Battler@r@v10/10100334."Huh, ah, yeah!@k @v10/10100335.Normal life—you know, food, meals, eating—then suddenly I was this tall."'
1402: 'Natsuhi@r@v03/10900022."Boys do grow fast, don''t they?@k@v03/10900023. How tall are you?"'
1403: 'Battler@r@v10/10100336."I guess about 180 cm?@k @|@y@v10/10100337.No, wait, you missed your moment, you''re supposed to jump in with "Did you do anything besides eat?!""'
1404: 'Natsuhi@r@v03/10900024."Huh?@k @|@y@v03/10900025.......Ahh, *giggle*, I''m sorry."'
1405: '@rAfter a moment, she gave a small laugh, but it seemed she couldn''t quite figure out what she was supposed to be laughing at.'
1406: '@rThis woman is Aunt Natsuhi (夏妃).'
1407: '@rShe''s the wife of the eldest son of the family, meaning she is my dad''s older brother''s wife.'
1408: '@rIs it easier to get it if I call her Jessica''s mother?'
1409: '@r...It feels bad to say it like this, but—not that I hated her—but I didn''t particularly like her.'
1410: '@rShe never got into our kids'' circle, and my only impression of her was as someone who always talked about complicated stuff with my parents while having a crabby expression on her face.'
1411: '@r...The fact is, that having barely ever exchanged words, I hesitated a lot even just now about how to approach her.'
1412: '@r...Aaand it was pretty much a flop.'
1413: '@rThe silverware had been tidily set up on the table, but the meal itself hadn''t been brought in.'
1414: '@rAs a rule, the meal doesn''t start until the man at the head of the table has taken his seat.@k@rSo, as long as Grandfather—the highest ranked—didn''t come, lunch would be indefinitely on hold.@k Not even the appetizers would come.'
1415: '@rIn other words, this silence in the dining hall was the sound of our parents as they withstood their hunger and waited, on tenterhooks, for Grandfather to come.'
1416: '@rExcept—the Grandfather I remembered always showed up at the right time when we ate together like this.'
1417: '@r...He wouldn''t ever have been so late as to have everyone else waiting on him.'
1418: 'Battler@r@v10/10100338."Grandfather''s pretty late.@k@v10/10100339. ......As far as I can remember, he was always strict about staying on time."'
1419: 'Jessica@r@v04/10200186."Well, maybe six years ago, yeah.@k@v04/10200187. ...But not lately.@k@v04/10200188. Seriously, he''s off in his own little world now—he doesn''t even show up at family meals.@k@v04/10200189. ...I figured he''d at least stick around for today''s meal, though."'
1420: 'Jessica@r@v04/10200190."...That said, if he doesn''t turn up, I''ll be a hell of a lot more relaxed and happier to boot."'
1421: 'Natsuhi@r@v03/10900026."...Jessica!"'
1422: '@rAfter being scolded by her mother, Jessica faced the other way, sticking her tongue out.'
1423: '@r......No way around it.@k@rNothing to do but wait for the host to arrive.'
1424: '@rWhen I glanced at the clock, I saw that it was almost twenty minutes past twelve...'
1425: '@rThe aged master of the Ushiromiya head house, Ushiromiya @bKinzo.@<金蔵@>.@k@rHe was there in his study.'
1426: '@rThe clock showed noon, but he didn''t even attempt to get up.'
1427: '@rWith reading glasses on his face, he stacked up old-fashioned books with elaborately designed bindings one on top of another beside him, immersing himself in their reading.'
1428: '@rIt definitely didn''t look like it was for his leisure; on the contrary, he exuded impatience, crisis, as though every minute, every second were precious.'
1429: '@rThe sealed room was dense with dancing dust particles, and the air stagnated with a mix of smells of various elixirs, each giving off its own suspicious stench.'
1430: '@r...They were somehow sweet, and heavy.'
1431: '@rFor anyone with a good nose, the first thing they''d do after entering would be to open a window and ventilate the room.'
1432: '@rThe knocking against the study door had been going on for a while.'
1433: '@rA voice calling "Father" sometimes mingled with the knocks.'
1434: '@rAs Kinzo heaved a deep sigh, he snapped shut the old book he had in his hands, and slammed it on the table.'
1435: '@rThen, he yelled at Krauss who was continuing to knock on the door.'
1436: 'Kinzo@r@v01/11500074."Silence!!@|@y@k @v01/11500075.Will you not stop that noise, fool!!!@|@y@k @v01/11500076.Who taught you that doors shall be opened unto you if you knock?!@k @v01/11500077.They crucified that imbecile!!@k @v01/11500078.Do you wish the same upon yourself?!!"'
1437: 'Krauss@r@v02/10800001."......Father.@k@v02/10800002. Today is the day of the family conference—it comes just once a year.@k@v02/10800003. Everyone has gathered downstairs.@k@v02/10800004. Please come out."'
1438: '@rKrauss called out to his father through the door.@k@r...Kinzo always shut himself up in the study and hated letting even his family into the room.'
1439: '@rFor that reason, Krauss had no choice but to call out thus from the corridor...'
1440: 'Kinzo@r@v01/11500079."Molest me not!!@k @v01/11500080.Everyone? Who is "everyone"?! You refer to the fools trying to drag me out of here?!!"'
1441: 'Kinzo@r@v01/11500081."Then kill them all!@k @v01/11500082.Chop them up, make them into firewood, feed them to the witch''s hearth!!@k @v01/11500083.Put a pot in that hearth and boil wormwood!@k @v01/11500084.And if still there remain imbeciles foolish enough to dare try to lure me out of here, force them to drink that broth of the Apocalypse!@k @v01/11500085.Preserve the remainder in liquor!"'
1442: 'Kinzo@r@v01/11500086."Aah, Genji, where are you?!@k @v01/11500087.Call for Genji!!@k @v01/11500088.Have my demonic absinthe prepared!@k @v01/11500089.The whispering of the green fairy reaches me no longer!!@k @v01/11500090.Aah, where is Genji, call for GenjiiIii!!!"'
1443: '@r...Before the door, Krauss, Nanjo, and Genji kept waiting for the master of the house, who would not come out.'
1444: 'Krauss@r@v02/10800005."Hmph...@k@v02/10800006. ......Looks like he hates me to his core.@k@v02/10800007. My voice doesn''t reach him anymore."'
1445: '@rKrauss shrugged as though saying "It''s no use", and smiled bitterly.'
1446: '@r...He himself hadn''t believed for a moment that his father would answer his calls.@k@rHowever, as it was the duty of the eldest son, he had formally made the request.'
1447: 'Nanjo@r@v19/11900030."......Kinzo-san.@k@v19/11900031. Your sons, daughters, and grandchildren have come to see you, you know...@k@v19/11900032. How about you show your face, just a little...?"'
1448: 'Kinzo@r@v01/11500091."Shut up, be silent!!!@|@y@k @v01/11500092.You dare admonish me, Nanjo?!!@|@y@k@r@v01/11500093. I do not call for you, I said to call for Genji!!@k @v01/11500094.Now hurry, call for him this instant!@|@y@k @v01/11500095.Time is short—the apostles are already readying their trumpets—why do you not understand this, you foolish sheep!!"'
1449: '@rKinzo slammed the old, heavy book on the table over and over.@k@rThe racket obviously indicated his highest displeasure.'
1450: '@rKinzo put his spectacles down and flew up from his chair.'
1451: '@rHe spread his arms wide open, as if to sing to a packed opera house, as if appealing to someone, and yelled.'
1452: 'Kinzo@r@v01/11500096."Why?!@k @v01/11500097.Why is there always something in my way?!@k @v01/11500098.I would throw it all away, I would offer up everything, and there is only one thing I ask in repayment!!"'
1453: 'Kinzo@r@v01/11500099."Ohh, BEATRICE, if I could see your smile but one more time, I would plunder the smiles of the Earth and offer them all up to you!!@k @v01/11500100.Oooh, commanders of the locust legions, reap the smiles of the Earth, *coughcough*, *haaack* *kofkof*!!!@k @v01/11500101.Ahh, all is filthy, all is irksome!!"'
1454: 'Kinzo@r@v01/11500102."Why must I suffer this impediment on this most precious of days?!?!@k @v01/11500103.*haaack*kofkofkof*!!@k @v01/11500104.*cough*cough*!!!@k @v01/11500105.Call for GenjiiIii!!!@k @v01/11500106.*haaack*kofkof*!!"'
1455: 'Krauss@r@v02/10800008."......I have no idea what he''s yelling.@k@v02/10800009. I guess he''s finally gone nuts."'
1456: 'Nanjo@r@v19/11900033."Krauss-san...@k@v19/11900034. Isn''t that a bit harsh, to your birth father..."'
1457: 'Krauss@r@v02/10800010."My dad is already dead.@k@v02/10800011. ......All that''s here is a phantom of what he once was.@k@v02/10800012. At any rate, as long as he lacks the will to leave that room, there''s nothing we can do."'
1458: 'Nanjo@r@v19/11900035.".....................Kinzo-san."'
1459: '@rChoking coughs continued to pour from the study...'
1460: 'Krauss@r@v02/10800013."I''m going back downstairs.@k@v02/10800014. ......It would be a waste to let that lunch Gohda''s so proud of get any colder.@k@v02/10800015. It''s one of the few things the others have to look forward to here.@k@v02/10800016. ...Hmph."'
1461: '@rKrauss spun on his heels.'
1462: '@rHe looked at his wristwatch, mumbling and acting as though he had wasted time doing something he knew would be in vain.'
1463: 'Krauss@r@v02/10800017."Genji-san.@k@v02/10800018. ......Father is calling for you.@k@v02/10800019. Keep him company."'
1464: 'Genji@r@v14/11600022.".........Certainly."'
1465: 'Krauss@r@v02/10800020."Doctor Nanjo.@k@v02/10800021. Let''s go eat.@k@v02/10800022. ......If we stay here any longer, even our sense of taste will go insane from this sweet smell."'
1466: '@rWithout waiting for Nanjo, Krauss went downstairs.'
1467: '@rGenji urged Nanjo to go and eat.'
1468: '@r...Nanjo looked first to Krauss''s back as he disappeared down the stairs, then to the study door, and he let out a deep sigh.'
1469: 'Nanjo@r@v19/11900036."......Sorry, Genji-san.@k@v19/11900037. Please."'
1470: 'Genji@r@v14/11600023."Yes, ......please leave it to me."'
1471: 'Nanjo@r@v19/11900038."If possible, don''t give him alcohol.@k@v19/11900039. ......It''s too powerful a habit."'
1472: 'Kinzo@r@v01/11500107."Is Genji not here yet?!!!@k @v01/11500108.Who dares keep Genji from coming?!!@k @v01/11500109.Ahh, where is Genji, call for Genji!!!"'
1473: 'Genji@r@v14/11600024."Now,@v14/11600025. ......please leave it to me."'
1474: 'Nanjo@r@v19/11900040."...Mm.@k@v19/11900041. .........Sorry."'
1475: '@rNanjo gave a small duck of his head and descended the stairs...'
1476: '@rGenji saw him off, and knocked at the study door.'
1477: 'Genji@r@v14/11600026."..........My lord.@k@v14/11600027. It is Genji."'
1478: 'Kinzo@r@v01/11500110."Genji!!@k @v01/11500111.Why must you make me wait so long?!!@k @v01/11500112.There is no one there, I trust?!"'
1479: 'Genji@r@v14/11600028."Yes.@k@v14/11600029. I am alone."'
1480: '@rKinzo returned to his seat in the study and pressed an old-fashioned switch on the table.'
1481: '@r...After a small delay, the heavy sound of the door unlocking could be heard.'
1482: '@rKinzo believed that his family might try to break into his study.'
1483: '@rPerhaps someone once opened the window for some air and scattered some important documents or something,@k and that had made him extremely upset.'
1484: '@r...Now, Kinzo had placed a secure lock in his room,@k making it so that without his permission nobody could enter, and locking himself in the dungeon he himself created.'
1485: '@rGenji, who he trusted the most, was relatively free to enter the room, but even that was not absolute.'
1486: '@rIf Kinzo was in a bad mood, even he wouldn''t be able to enter.'
1487: '@r.........Anyone else would be limited to holding a conversation through the door, not even seeing his face.'
1488: '@rAnd most of the time, they wouldn''t even get a real conversation.'
1489: '@rHowever, that didn''t pose any particular problem for the family.'
1490: '@rThat was because they had no reason to go out of their way to interfere with the retirement of the cantankerous and aged head; the fact that he was completely immersed in his odd research and always locked up in his hideaway was something of a benefit.'
1491: '@r......They made the most of his refusal to leave the study, entrusting him to the hands of the servants, while they themselves kept their distance.'
1492: 'Kinzo@r@v01/11500113."Genji, my usual.@k@v01/11500114. I''m busy."'
1493: 'Genji@r@v14/11600030."......Yes."'
1494: '@rGenji headed to a corner of the study.@k@rThere, suspicious-looking bottles boasting venomous colors were on display.'
1495: '@r...They were actually liquor, but considering that they were placed in this shady-looking room, you could almost suspect that they might be ghastly poisons.'
1496: '@rThe inside of the study was filled with the mountainous library of outlandish books that Kinzo had amassed.'
1497: '@rThey were bizarre old books, some banned, and each and every one of them either forbidden, cursed, or sealed.'
1498: '@rOf course, if one were to actually call them old books, Kinzo would fly into a rage and say something like this:'
1499: '@r"Call them... @w500.grimoires!"'
1500: '@rThere were candles which had melted in a suspicious-looking fashion and taken on peculiar forms, and all manner of other strange objects, probably having something to do with black magic.'
1501: '@rThe constellations covering the celestial globe would have caused anyone who knew the night sky well to raise an eyebrow.'
1502: '@rThe illustrations inscribed in old books, haphazardly left open, ranged from the religious and mystical...@kto the demonic and grotesque, as well as bizarre diagrams of various magic circles.'
1503: '@rAnd above all, the sweet, poisonous smell that filled the room,@k which to those entering for the first time would surely be a profound assault on their sense of sight, smell, and all their other senses, making them lose their grip on reality...'
1504: '@rInside that study, Genji, with his well trained hand, prepared Kinzo''s usual drink.'
1505: '@rIf you didn''t know that the ghastly dark green liquid that filled the complexly designed bottle was liquor, you certainly wouldn''t want to put it in your mouth.'
1506: '@r......He poured a small quantity of the spirit into the glass,@k placed a cube of sugar in a strangely shaped spoon, and then poured water from a pitcher over it.'
1507: '@rStrangely, when the colorless water was poured into it, the dark green liquid turned a cloudy white.'
1508: '@r...It created the strange visual illusion that the water had caused a chemical reaction, which made it all the more difficult to perceive the concoction as liquor.'
1509: '@rTo this, he added an original flavoring that Kinzo liked, and fine-tuned the taste.'
1510: '@r...There was no recipe.@k Its success was measured only by Kinzo''s mood swing when he drank it, and he had learned how to make it only after many decades.'
1511: '@rGenji placed the glass on a tray, and made his way over to Kinzo.@k@rKinzo was now gazing out the window.'
1512: 'Genji@r@v14/11600031.".........As you asked, my lord."'
1513: 'Kinzo@r@v01/11500115."Thank you..."'
1514: '@rKinzo had regained his composure—so much so that he was now unrecognizable as the man who had been shouting, screaming and yelling just moments before.'
1515: '@rIn that man''s back dwelt a dignity and intelligence made plain simply by how he tilted his glass and gazed down at the scenery beyond the window.'
1516: '@rGenji, in order to allow Kinzo to set down his glass any time,@k motionlessly waited behind and to his left, as though he were a living sideboard.'
1517: '@rAs he did, Kinzo stuck out just the glass, his gaze still directed at the world outside the window.'
1518: '@rThere was just a mouthful remaining.'
1519: '@rIt was not a gesture intended to set it upon the tray, as Genji expected, but was a motion to hand the glass over to Genji.'
1520: 'Kinzo@r@v01/11500116."......Drink it.@k@v01/11500117. ...My friend."'
1521: 'Genji@r@v14/11600032.".....................That is more than I deserve."'
1522: 'Kinzo@r@v01/11500118."No need for ceremony between us.@k@v01/11500119. ......Drink it.@k@v01/11500120. Friend."'
1523: 'Genji@r@v14/11600033."...............Thank you."'
1524: '@rGenji respectfully received the glass and inclined it a little to taste its contents.'
1525: '@rThen, he downed it in one gulp.'
1526: 'Kinzo@r@v01/11500121."I attempted to imitate your concoction, but no matter how I try, I cannot replicate the taste.@k@v01/11500122. ......The way you make it is pure relish."'
1527: 'Genji@r@v14/11600034.".........Thank you very much.@k@v14/11600035. It is the fruit of your guidance, my lord."'
1528: 'Kinzo@r@v01/11500123."Hmph..."'
1529: '@rKinzo smiled at his loyal subject who refused to put aside rank even when asked to.'
1530: '@rHowever, he was not making fun of him; it was relaxed, like a smile at a close friend''s unriddable bad habit.'
1531: 'Kinzo@r@v01/11500124.".........We have grown old, you and I.@k@v01/11500125. I forgot my age a long time ago."'
1532: 'Genji@r@v14/11600036."That I was permitted to live the life I have until today has all been thanks to you, my lord."'
1533: '@rKinzo gave a thin smile, as if to say he didn''t need compliments.'
1534: 'Kinzo@r@v01/11500126.".........You have served me exceedingly well these years.@k@v01/11500127. ......My sons call me eccentric.@k@v01/11500128. The servants that were once many, all of them, retired in their growing fear of me.@k@v01/11500129. ......Only you, even now, serve me."'
1535: 'Genji@r@v14/11600037."...That is more than I deserve."'
1536: 'Kinzo@r@v01/11500130.".........I doubt I have much time left to live.@k@v01/11500131. ......My sons are vultures, lazily waiting for my inheritance to fall into their hands."'
1537: 'Genji@r@v14/11600038."........................"'
1538: 'Kinzo@r@v01/11500132."That fool Krauss squanders money like water, throws away two gold coins to obtain one.@k@v01/11500133. With that, he deludes himself into saying he earned money!!@k @v01/11500134.Eva is a slave to money, thinking of me as a hen or whatnot!!@k @v01/11500135.As if when I die, she''ll even use my carcass to make broth!!"'
1539: 'Kinzo@r@v01/11500136."That dunce Rudolf just wants to fool around with women!!@k @v01/11500137.Rosa bore the baby of a nobody!!@k @v01/11500138.Jessica is incompetent and illiterate!!@k @v01/11500139.George has none of what it takes to be a man!@k @v01/11500140.Battler is a fool who threw away the honor of the Ushiromiya family!!@k @v01/11500141.And Maria is obscene to the eye!!"'
1540: 'Kinzo@r@v01/11500142."Why, why is the Ushiromiya blood so incompetent?!!@k @v01/11500143.Is there anyone worthy to inherit the glory I built?!@k @v01/11500144.Ahh, of course, I know, this is BEATRICE''s curse, I know it!!@k @v01/11500145....Aah, Golden Witch, is this supposed to be your revenge against me?"'
1541: 'Kinzo@r@v01/11500146."Hate me if you wish!@k @v01/11500147.Run away if you wish!!@k @v01/11500148.I won''t let you go, I won''t let you go won''t let you go won''t let you go!!@k @v01/11500149.You are mine!!@k @v01/11500150.You cannot be anywhere but in my arms!@k @v01/11500151.You are my entire life!"'
1542: 'Kinzo@r@v01/11500152."You''ll continue to whisper for all eternity in my bird cage to me, only to me!!@k @v01/11500153.BEATRICE......@k@v01/11500154. Why...won''t you give me back your smile...@k@v01/11500155. OOOoooooh, OOOooOOOoooh...!!@k @v01/11500156.BEATRICEEEEEEEEEEE!!@k @v01/11500157.OOOoooOOOOoohh......"'
1543: '@rAfter howling, Kinzo choked once again.@k@rGenji set the tray and the glass down and patted his master''s back...'
1544: '@rGenji''s facial expression did not change.@k@r.........It was always like this.'
1545: 'Kinzo@r@v01/11500158."............*cough*...@k@v01/11500159. Hmhm.@k@v01/11500160. ............Thank you, my friend."'
1546: 'Genji@r@v14/11600039."........................"'
1547: '@rAfter his almost deranged outburst of the past few minutes settled down, Kinzo regained his composure once more.'
1548: '@r...The way his attitude changed was like seeing two different people, a wild Kinzo and a composed Kinzo, living together inside one body.'
1549: 'Kinzo@r@v01/11500161."And so,@k@v01/11500162. ......I have decided.@k@v01/11500163. .....................I cannot stand spending the insipid remainder of my life procrastinating like this.@k@v01/11500164. If I have any final coins left to gamble, then I choose to abandon them all to the whims of the Demons'' Roulette."'
1550: 'Kinzo@r@v01/11500165."......The power of magic is always determined by the risk staked upon it.@k@v01/11500166. Like visiting a shrine at the Hour of the Ox in ancient Japanese sorcery, to nail a curse doll to a tree.@k@v01/11500167. The magic power dwells in incurring the risk that it will be seen before seven days pass.@k@v01/11500168. The more dangerous the risk, the stronger the magic power will be."'
1551: 'Kinzo@r@v01/11500169."All the various miracles that appear in myth can be called crystals of astonishing magic power, obtained through miraculously low probabilities and astronomical risks!"'
1552: 'Kinzo@r@v01/11500170."That Moses parted the sea was no miracle of God''s—@k@v01/11500171.it was that utterly desperate risk, weighed upon the scales of oppression, of being cornered by soldiers on the Red Sea''s shores, which gave birth to miraculous magic power!@k @v01/11500172.Even if the same thing occurs again, on the same scope, the sea will no doubt not part."'
1553: 'Kinzo@r@v01/11500173."That is because Moses managed to spectacularly draw out the single miracle carved in the roulette of those in power, which has more pockets than @b10^56.@<asougi@> and @b10^60.@<nayuta@> multiplied together."'
1554: 'Kinzo@r@v01/11500174."The power to triumph over astronomical odds!!@k @v01/11500175.Yes, magical power is, in other words, having the luck to grasp miracles!!@k @v01/11500176.To obtain great magical power, one must bear a risk that is hopelessly great!!@k @v01/11500177.Those who possess no magic would call this not a bet, but pure desperation!"'
1555: 'Kinzo@r@v01/11500178."However, those who truly do possess magical power can grasp hold of that miracle and make the enigma come into being!!@k @v01/11500179.And if that power exists within me!@k @v01/11500180.I will seize that miracle, I will be able to make the wish I devoted my life towards come true!!"'
1556: '@rKinzo looked up to the sky outside the window.@k@rHe spread his arms as if appealing to someone up in the skies.'
1557: 'Kinzo@r@v01/11500181."And if...!!!@k @v01/11500182.If I were to have what it takes to obtain that miracle...!!@k @v01/11500183..........Oooh...@v01/11500184.BEATRICE...@v01/11500185.BEATRICE...@k@v01/11500186. Show me your lovely smile once more..."'
1558: 'Kinzo@r@v01/11500187."No matter how much time passes, your face does not vanish...@k@v01/11500188. I just want to see your smile...that is all...!@k @v01/11500189.I''ll return everything you granted me!@k @v01/11500190.I''ll return all the glory I''ve gained since that day!@k @v01/11500191.I don''t need fortune, prestige, gold!!@k @v01/11500192.I''ll return everything you granted me!!"'
1559: 'Kinzo@r@v01/11500193."I just want to see your smile!!@k @v01/11500194.I beg of you, BEATRICE!!@k @v01/11500195.OOOoooooOooh...oOoOOoh...ooh...!!"'
1560: '@r......His nonsensical yells segued into a scream, ...and then into a wail.'
1561: '@rKinzo crumpled onto the floor, and clawed at it with both hands.'
1562: '@rGenji had no choice but to wordlessly watch over his master''s lament...'
1563: 'Krauss@r@v02/10800023."Well, ladies and gentlemen.@k@v02/10800024. ......The head of the family is not in his best shape.@k@v02/10800025. He considers it a great shame that he will not be able to partake in lunch with you all, you having assembled especially for this long-awaited yearly meeting."'
1564: 'Krauss@r@v02/10800026."......Gohda, let the lunch begin."'
1565: 'Gohda@r@v17/11700046."Certainly. Well then, ladies and gentlemen, we shall begin today''s luncheon."'
1566: 'Eva@r@v05/11000112."......Doctor Nanjo, is Father''s condition that bad?@k @v05/11000113.Surely he could have at least showed his face?"'
1567: 'Nanjo@r@v19/11900042."Rather than his physical condition, it''s his mood...@k@v19/11900043. And for that, there is no medicine I can prescribe."'
1568: 'Rudolf@r@v08/11200100."Oh, come on, for God''s sake, "mood", again?@k@v08/11200101. We come to hear how he''s doing, making time in our schedules in this damn busy season of autumn.@k@v08/11200102. That''s just—"'
1569: 'Krauss@r@v02/10800027."Hmph...then you got what you wanted, Rudolf.@k@v02/10800028. You managed to hear how he''s doing.@k@v02/10800029. ......Or do you want to take my place, and try to persuade our ill-humored father to come join us?"'
1570: 'Rudolf@r@v08/11200103."............Are you kidding?"'
1571: '@rRudolf shrugged.'
1572: '@rApparently, even though Rudolf seemed to resent the way his father did whatever he pleased, he''d rather avoid seeing his face if he could help it.'
1573: 'Rosa@r@v12/11400070."Does it seem like his mood will improve before dinner?@k @v12/11400071.Krauss nii-san?"'
1574: 'Krauss@r@v02/10800030."I have no idea.@k@v02/10800031. You can try to ask Father directly.@k@v02/10800032. ...Although, I think his mood will improve faster if we don''t bother him."'
1575: 'Jessica@r@v04/10200191."The only one who can bring Grandfather''s temper under control is Genji-san.@k@v04/10200192. Pretty damn pathetic when you have to have a servant to deal with your own parent''s bad mood."'
1576: 'Krauss@r@v02/10800033."Jessica.@k@v02/10800034. Don''t speak out of turn."'
1577: '@rShe''d planned for her complaint to be heard only by her cousins, but it had reached even Krauss''s ears.'
1578: '@rScolded, Jessica scowled and turned away, sulking.'
1579: 'Battler@r@v10/10100340."......His condition can''t be that bad, can it, with that kinda temper?@k @v10/10100341.I mean, if they were saying he''s not feeling well that''d be one thing, but if it''s his mood that''s bad, at least it''s proof he''s got some fight in him."'
1580: 'George@r@v07/10300172."Well, Grandfather does have especially strong willpower.@k@v07/10300173. ...But, it doesn''t mean that his body will always follow that.@k@v07/10300174. Since last year, they keep saying that he has three months left."'
1581: 'George@r@v07/10300175."...If the initial diagnosis was correct, Grandfather has been prolonging his life by willpower alone.@k@v07/10300176. ......We have to be concerned for him."'
