2024: '@rWe crossed the hall again on our way to the entrance.'
2025: '@rAs we did, we once again saw that witch''s portrait.'
2026: '@rHowever, the word "saw" is probably not the best word to describe that experience.@k@r......It was more like our eyes were drawn to it.'
2027: '@rThat woman''s eyes, with their sage-like glamour, definitely had the power to make those who looked at her stand rooted to the spot.'
2028: 'Battler@r@v10/10100361."............So this is the witch, BEATRICE.@k@v10/10100362. ......Wonder if it''s true."'
2029: 'Maria@r@v13/10400227."Uu?@k @v13/10400228.Battler doesn''t believe...?"'
2030: '@rBack when he had asked what this picture was, the first person to tell him it was BEATRICE had been Maria.'
2031: '@rTherefore, when Battler showed signs of doubt, Maria must have felt that Battler didn''t have faith in her.'
2032: '@r...Of course, that''s not what Battler meant.'
2033: '@rMaria ran up to the portrait and began banging on a plate below it.'
2034: '@rMaybe the title of the portrait was written there.'
2035: '@rMaria, trying to prove that she wasn''t lying, obstinately continued to hit the plate.'
2036: 'Battler@r@v10/10100363."Ahh—sorry about that,@v10/10100364. it''s not like I doubt anything you said, Maria."'
2037: 'Maria@r@v13/10400229."Uu!@k @v13/10400230.Battler believes!@k @v13/10400231.Uu!"'
2038: '@rWhen he patted Maria''s head and apologized, she seemed to accept it, sticking out her chest and proudly "uu-uu"ing.'
2039: 'Battler@r@v10/10100365."...............Let''s see here.@k@v10/10100366. "My beloved witch, BEATRICE".@k@v10/10100367. .........Behold the sweetfish river...@v10/10100368....wait.........what''s with this weird, long epitaph?"'
2040: '@rThe plate did have the title of the portrait written on it, but it was much too big to contain only that.'
2041: '@rBeneath the title, what looked like a long epitaph was also written.'
2042: '@rAs I skimmed over it, I was taken aback by the array of unnerving words that jumped out at me.'
2043: 'Jessica@r@v04/10200202."Incredible, isn''t it?@k@v04/10200203. Grandfather had that written.@k@v04/10200204. ...Pretty deep, huh?"'
2044: 'Maria@r@v13/10400232."Uu!@k @v13/10400233.I know!@k @v13/10400234.It''s the place where the gold is hidden!"'
2045: 'Battler@r@v10/10100369."......Wait, is it that story about the Ushiromiya family''s hidden gold?@k @v10/10100370.There''s another thing that takes me back...@k@v10/10100371. ......Wait, Aniki, ...is that for real?"'
2046: 'George@r@v07/10300184."Grandfather had this written, but he refuses to say anything about this picture or the epitaph.@k@v07/10300185. .........Even so, amongst the family, it is often whispered that it points to the location of Grandfather''s hidden gold,@k@v07/10300186. and that he will relinquish the family headship and the gold to the person who solves the riddle."'
2047: 'Maria@r@v13/10400235."Uu!@k @v13/10400236.I heard that too, I heard that too!@k @v13/10400237.Lots and lots of gold!"'
2048: 'Jessica@r@v04/10200205."...Well, who knows, really.@k@v04/10200206. Ten tons of gold bars.@k@v04/10200207. Sounds a bit too fishy to me."'
2049: 'Battler@r@v10/10100372."Still, if you read this all the way through, it almost seems real."'
2050: '@r.........I think I already explained Grandfather''s upbringing,@k but let me also mention the Ushiromiya family''s "Legend of the Gold".'
2051: '@rGrandfather succeeded the Ushiromiya family after it had been almost totally destroyed in the Great Kanto Earthquake,@k and by successfully riding the stormy seas after the war, managed to accumulate great wealth.'
2052: '@r...That much of the story everyone knows.@k@rHowever, this is where the strange part of the story begins.'
2053: '@r...Part of it is closely tied to Grandfather''s black magic hobby, so its credibility is extremely low, but......'
2054: '@r......Well, wait until the end before you doubt or make fun of it.'
2055: '@rAfter the war, Grandfather successfully predicted what the future would hold, his big gamble paid off, and he accumulated a vast store of wealth,@k ......but there is a mysterious legend about how he gained the funds in the first place.'
2056: '@rGrandfather came from a branch family and had no connections in the business world or the financial world.@k Even though he later built connections with the occupying forces, in the beginning he was supposedly a nameless person who had not yet gained anyone''s trust.'
2057: '@rMoney can only be gathered based on trust.@k@rThere''s no way anyone would lend money to an untrustworthy person.'
2058: '@r......How did Grandfather, whose trustworthiness was zero, manage to obtain the large amount of funds in the first place?'
2059: '@r......It is said that, when asked that question, Grandfather answered like this:'
2060: '@rOne fateful day, I encountered the Golden Witch BEATRICE.'
2061: '@rHe then went on and on about how he continued to research alchemy and techniques for summoning demons in order to become a great mage.'
2062: '@r...And the entity summoned as the result of the demon-calling ritual was the Golden Witch BEATRICE.'
2063: '@rHe then said that he made a contract where, in exchange for his own soul, he would receive fortune and honor.'
2064: '@rThe witch then granted Grandfather ten tons of gold.'
2065: '@rGrandfather used this gold as collateral to prepare a vast quantity of funds,@k and then used that to multiply his wealth by several times and revive the Ushiromiya family...'
2066: '@rIt seems that this story is so old that our parents had already been told it when they were still children.'
2067: '@rSo, our parents, when they were little,@k explored this island in various ways, believing that the gold that Grandfather had received from the witch might be hidden somewhere.'
2068: '@rHowever, since there was the danger of them getting lost in the abandoned forest,@k Grandmother or someone began to spread the story that the witch lived in the forest and approaching it was too dangerous...'
2069: 'Battler@r@v10/10100373."......I remember that old story.@k@v10/10100374. When we were little, our parents told us about it and we went all over the island searching for treasure.@k@v10/10100375. .........Didn''t we get lost in the forest and start crying until some of the servants found us? Our parents were so mad at us.@k@v10/10100376. ...That takes me back."'
2070: 'Jessica@r@v04/10200208."We sure were idiots, weren''t we?@k@v04/10200209. I mean, come on, Grandfather used that to build up the funds that he finally bought this island with, right?@k @v04/10200210.That means he must have had the gold before coming here.@k@v04/10200211. There''s no way it''d be here on the island."'
2071: 'George@r@v07/10300187."......That''s not necessarily so.@k@v07/10300188. Maybe the gold was hidden on the island from the beginning and he bought the whole island just to make sure it was all his.@k@v07/10300189. There was a whole ten tons of it, right?@k@v07/10300190. It seems more realistic that he would try to secure the place where it was hidden rather than try to move it all."'
2072: 'Battler@r@v10/10100377."This epitaph was written two years ago.@k@v10/10100378. And since Grandfather had it written himself...@v10/10100379. ......I see, this does make the Legend of the Gold more believable."'
2073: 'Battler@r@v10/10100380."Ten tons of gold, bestowed upon Grandfather by a witch, that it''s said he used to revive the Ushiromiya family.@k@v10/10100381. ......It''s sleeping somewhere even now, and Grandfather may be planning to turn it over to whoever can solve his riddle."'
2074: 'Battler@r@v10/10100382.".........Hahh, I guess that sounds like Grandfather''s style or something......@k@v10/10100383. Ihihi!@k @v10/10100384.If it''s true, that''s one hell of an opportunity."'
2075: '@rThe epitaph carved into the plate was very mysterious, something like a poem or a song.'
2076: '@rIts sentences were incredibly disturbing, filled with the signs of Grandfather''s black magic hobby, and truly in bad taste,@k but it could definitely be viewed as a puzzle which, if solved, could lead to the place where the gold was hidden.'
2077: 'George@r@v07/10300191."I can''t even imagine if that''s what he intended or not.@k@v07/10300192. ......All I can say is, this shady epitaph was displayed here so that everyone in the family could see it."'
2078: 'George@r@v07/10300193."And that, even while hinting at the existence of the gold, he still refuses to touch upon the subject of its hiding place.@k@v07/10300194. .........That caused our parents'' imaginations to run wild, and call it a battle of wits from Grandfather..."'
2079: 'Jessica@r@v04/10200212."...Bet it''s my dad who''s taking this nonsense at face value, his greed exposed to the world.@k@v04/10200213. Even though he laughs at Grandfather''s black magic hobby, he''ll still believe this story about the hidden gold.@k@v04/10200214. He''s all talk."'
2080: 'George@r@v07/10300195."......Well, it''s certainly not a realistic story.@k@v07/10300196. At that time, when Grandfather was still nameless without any connections, there''s no way anyone would have just lent him a massive quantity of gold bars for free.@k@v07/10300197. ......Although, it''s not unthinkable to suggest that''s exactly why Grandfather called his sponsor a witch."'
2081: 'Battler@r@v10/10100385."Yeah, but, it''s ten tons, ten tons!@k@v10/10100386. If you traded that for money, how much would that come to?@k @v10/10100387.Anyway, it''d have to be a ridiculous amount, right?!"'
2082: 'George@r@v07/10300198.".........It would be a ridiculous amount.@k@v07/10300199. They say that the total amount of gold mined by humankind since the dawn of history is at most 100,000 tons.@k@v07/10300200. That one ten-thousandth of all of the gold humankind has obtained throughout history should belong to just one person is just insane."'
2083: 'George@r@v07/10300201."...And that it should all be in one place, and that there should be a "witch" who could just lend it to Grandfather as if it was nothing.@k@v07/10300202. ......That would be no ordinary person."'
2084: 'Jessica@r@v04/10200215."As for me, I think that that number "ten tons" sounds totally fake.@k @v04/10200216.In the first place, has anyone other than Grandfather ever even seen it?@k@v04/10200217. And even if some generous witch lent him some actual gold, couldn''t that "ten" be right but actually be mistaken from ten kilos?@k@v04/10200218. Even ten kilos would be a pretty incredible sum, right?"'
2085: 'Maria@r@v13/10400238."Uu.@k@v13/10400239. ...Ten kilos of gold is how much?"'
2086: '@rMaria, who couldn''t keep up and felt like she was being spoken to in riddles, finally found a place where she could ask us a question.'
2087: '@rA question which I also wanted to ask right then.'
2088: '@rWhether I hear ten kilos or ten tons, I know that it''s an incredible amount, but I couldn''t put a number on exactly how incredible.'
2089: '@rGeorge-aniki folded his arms and tried to remember the market price of gold.'
2090: 'George@r@v07/10300203.".........Well.@k@v07/10300204. Gold is affected by speculation, and its price can also change depending on its purity and the trustworthiness of the foundry.@k@v07/10300205. You would also need to pay a commission to turn it into money.@k@v07/10300206. Still, it is definitely a precious metal, and some people estimate that if gold mining continues at its current rate, within half a century, we will have mined all of it."'
2091: 'George@r@v07/10300207."............Just guessing haphazardly,@v07/10300208. ......for one kilo, I think maybe a price of 2 million yen."'
2092: 'Jessica@r@v04/10200219."Whoa...@k@v04/10200220. .........I know I just plucked that ten kilos figure out of thin air...@k@v04/10200221. ...But even that would be worth 20 million yen!"'
2093: 'Maria@r@v13/10400240."Uu?@k @v13/10400241.I weigh 28 kg."'
2094: 'George@r@v07/10300209.".........Which means that if we had Maria-chan''s weight in gold,@k@v07/10300210. we could estimate its worth at over 50 million yen."'
2095: 'Battler@r@v10/10100388."That''s just mind-boggling...@k@|@y@v10/10100389. How much would ten tons be then?@k@r@v10/10100390.It''s 20 million for ten kilos, times a thousand, so......umm.@k@v10/10100391. .........That''s it!@k @v10/10100392.20 billion yen?!@k @v10/10100393.What the hell!"'
2096: '@rHow much is 20 billion yen actually worth?@w666. ......We would have to measure it by putting it in terms we could understand.'
2097: '@rI mean, they say that wages over a lifetime are 200 million yen.'
2098: '@r...You grow up and work like crazy, sacrificing your life for your company, and as you approach old age are finally freed.@k@rAnd all that together, including the retirement money, comes out at 200 million yen.'
2099: '@r...In other words, that is the cash equivalent of a human''s life—@kno, you could even call it the price of a life.'
2100: '@r...We were talking about a sum so enormous that it would require a hundred of those lives.'
2101: '@r......Assuming you work for 40 years from age 20 to age 60,@w500. ......then it''s equal to 4000 years of work wages.'
2102: '@rIt''s a sum of money you could finally accumulate after working every day starting from the Jomon period.'
2103: 'Maria@r@v13/10400242."...Uu.@k@v13/10400243. Is 20 billion yen huge...?"'
2104: 'Battler@r@v10/10100394."Yeah, it''s huge.@k@v10/10100395. Maria, you could buy more of that shortcake you love than you could eat in a lifetime."'
2105: 'George@r@v07/10300211."......However, while I could imagine 20 billion yen in cash,@k@v07/10300212. I don''t think it''s very plausible for it to all be in one place as gold bars."'
2106: 'George@r@v07/10300213."Just as I said, gold is extremely heavy, and it is not very convenient as a method for storing all your accumulated fortune.@k@v07/10300214. If it was all in highly valued stocks and bonds, or really expensive precious gems, it wouldn''t be unthinkable."'
2107: 'George@r@v07/10300215."...You often hear of people who, in the chaotic period of the war, traded their wealth for precious gems so that they could carry it around with them.@k@v07/10300216. ......But you don''t usually hear stories of people exchanging their wealth for gold."'
2108: 'Jessica@r@v04/10200222."Of course it''s heavy, but internationally it''s the most trusted and stable—doesn''t that mean something?@k@v04/10200223. With bonds, for example, if the country is destroyed they''re just scraps of paper."'
2109: 'George@r@v07/10300217."You can also look at it that way.@k@v07/10300218. ...But even one ten-kilo ingot is pretty heavy to carry around.@k@v07/10300219. Have you ever heard this?@k@v07/10300220. Even if you can carry a 50-kilogram person on your back, you can''t carry a 50-kilogram bag over your shoulder.@k@v07/10300221. With that many gold bars, the amount of labor and risk for one person would be hard to calculate."'
2110: 'Battler@r@v10/10100396."So what you''re saying is, if we were talking 20 billion yen in banknotes lying around, that''d be one thing,@k@v10/10100397. but given that it''s supposedly 20 billion yen in gold piled up, it doesn''t really ring true."'
2111: 'George@r@v07/10300222."That''s right.@k@v07/10300223. ...Although the Legend of the Gold does have a pretty interesting ring to it, even just the part about the ten tons of gold is a little bit of a stretch..."'
2112: 'Jessica@r@v04/10200224."If you think about it logically like that, it sounds obviously fake.@k@|@y@v04/10200225. Haha, kind of brings you back down to reality."'
2113: 'George@r@v07/10300224."That said, it is Grandfather we''re talking about, after all.@k@v07/10300225. He may have announced his financing from some kind rich person in an exaggerated metaphorical way, as ten tons of gold received from a witch.@k@v07/10300226. Even the number "ten tons" feels pretty symbolic."'
2114: 'Battler@r@v10/10100398."You mean like his gratitude for the money he borrowed was worth ten tons of gold, or something?"'
2115: 'Jessica@r@v04/10200226."Hehehe, maybe some rich man''s leisured wife generously granted it to Grandfather.@k@v04/10200227. And maybe then he started calling this lady a witch?"'
2116: '@rHmm, Jessica''s example isn''t bad.'
2117: '@r...If someone was generous enough to lend a huge sum of money to Grandfather when his trustworthiness was still zero,@k she would certainly be someone worthy of being called a witch.'
2118: '@r......Furthermore, Grandfather later used that money to build a vast amount of wealth.'
2119: '@r...With such an incredible ability to judge people,@k again, she might well be fittingly called a witch.'
2120: '@rAlso, since she went to the trouble of lending all that money, she might also have enthusiastically guided how it was spent.'
2121: '@rCome to think of it, the idea to get involved with the occupying forces and profit from the Korean War demands might have come from the witch as well.'
2122: '@rWith all that considered, saying that he "received wealth and honor from a witch"...@kmight actually be a fair description.'
2123: 'Battler@r@v10/10100399."I see.@k@v10/10100400. ............So, in other words, this witch granted the funds necessary to revive the Ushiromiya family, and Grandfather owed her big time.@k@v10/10100401. ...If that''s the case, and Grandfather had that huge painting drawn and displayed out of feelings of gratitude...yeah, that might not be that strange a story."'
2124: 'Jessica@r@v04/10200228."Hey, what if this person looked like an old witch-like granny?@k @v04/10200229.And then Grandfather idealized her appearance and turned her into this beauty when he had the painting drawn.@k@v04/10200230. Hahahahaha, I''ll bet if we ever did meet this person, she wouldn''t be nearly this pretty!"'
2125: 'George@r@v07/10300227."Hahahaha, that''s possible.@k@v07/10300228. The name BEATRICE sounds pretty Western, and if you think about how everyone in our family has Western-style names,@k@v07/10300229. maybe even the name BEATRICE is the result of Grandfather trying to rearrange some Japanese person''s name to make it sound Western."'
2126: 'Battler@r@v10/10100402."I get it, I get it.@k@v10/10100403. That means that this pretty girl doesn''t exist outside the picture.@k@v10/10100404. Guess that means I won''t be able to rub those el~egant breasts, ihihi!@k @v10/10100405.In the first place, isn''t a witch a little weird?@k@v10/10100406. Like you could find something like that anywhere on earth."'
2127: '@rAs I laughed and made fun of the witch in an attempt to differentiate myself from the kid I was six years ago who was afraid of the witch of the forest, Maria tugged on my sleeve.'
2128: '@r...The strength with which she did so displayed a little annoyance.'
2129: 'Battler@r@v10/10100407."Hmm?@k @v10/10100408.What is it, Maria?"'
2130: 'Maria@r@v13/10400244."Uu!@k @v13/10400245.Uu!!@k @v13/10400246.BEATRICE exiiiists!"'
2131: '@rMaria stared up at me.@k@r...She had on her usual sour look, but I could tell she was angry because of the color of her eyes.'
2132: 'Maria@r@v13/10400247."Witches exist!@k @v13/10400248.Witches exist!@k @v13/10400249.Uu-uu-uu!!!"'
2133: 'Battler@r@v10/10100409."Well sure, they do exist...if you turn the TV on and watch anime or something."'
2134: 'Maria@r@v13/10400250."Exiiist!!@k @v13/10400251.Witches exiiist!!@k @v13/10400252.Uu-uu-uu!!!"'
2135: '@rI started to feel pressured, not knowing why Maria was jumping on me like this.'
2136: '@rThen, Jessica tapped me on the shoulder and told me in a small voice.'
2137: 'Jessica@r@v04/10200231."...Dumbass, don''t go smashing a kid''s dream.@k@v04/10200232. Maria really believes that things like witches and BEATRICE exist."'
2138: 'George@r@v07/10300230."Come to think of it, Maria-chan, in social studies at your school, when you were asked to write what you wanted to be when you grew up, you wrote "a witch", didn''t you?"'
2139: '@rMaria nodded seriously.@k@rTears started to run from the corners of her eyes.'
2140: '@r.........I see. To a girl who wants to become a witch in the future,@k this "BEATRICE" is proof that witches do exist in this world,@k and is also someone who she admires and strives to be like.'
2141: 'Maria@r@v13/10400253."Exiiist!@|@y@k @v13/10400254.Exiiist!@|@y@k @v13/10400255.Witches exiiist!!@|@y@k @v13/10400256.But Battler doesn''t believe!@k @v13/10400257.Uu-uu-uu!!!"'
2142: 'George@r@v07/10300231."It''s alright. They exist, witches.@k@v07/10300232. Onii-chan believes it."'
2143: '@rGeorge-aniki kneeled down and held Maria''s head.@k@r...Watching this, Jessica poked me in the side.'
2144: '@r...So that''s what it is.'
2145: '@rIt''s basically like, I just dropped the bomb that Santa Claus doesn''t exist,@k in front of a child who believes in him, on Christmas Eve.'
2146: '@r...I''m not the kind of guy who likes to shatter kids'' dreams.'
2147: 'Battler@r@v10/10100410.".........Uhh, I''m sorry.@k@v10/10100411. I wasn''t trying to make fun of your dreams. I apologize.@k@v10/10100412. Of course BEATRICE exists.@k@v10/10100413. Even now she''s living in the forest, and comes every night to the mansion to peek in and see what everyone''s doing."'
2148: 'Battler@r@v10/10100414."......That''s why you shouldn''t go into the forest.@k@v10/10100415. And at night, you mustn''t stay up staring into the dark forest.@k@v10/10100416. ......You might be seen by the witch of the forest, BEATRICE.@k@v10/10100417. ............After all, Grandmother said so."'
2149: 'Maria@r@v13/10400258."...Uu......@k@v13/10400259. Really?@k @v13/10400260....Battler really believes?"'
2150: 'Battler@r@v10/10100418."Yep, I believe.@k@v10/10100419. Sorry for doubting it.@k@v10/10100420. ...C''mon, let''s make up, okay?"'
2151: '@rI stuck out my hand and Maria grabbed it with her tiny hand, and we made up.'
2152: '@rMaria didn''t grumble any more than that, so George-aniki and Jessica were relieved.'
2153: 'Shannon@r@v15/10500069."......Oh.@k@v15/10500070. This is where all of you were?@k@v15/10500071. I was sure you had just left to go to the beach..."'
2154: '@rShannon-chan, carrying a basket, was surprised to find us all gathered in front of the portrait.'
2155: 'Jessica@r@v04/10200233."Ah, Shannon.@k@v04/10200234. Well, this is the first time Battler has seen BEATRICE''s portrait.@k@v04/10200235. He was just fascinated by it."'
2156: 'Shannon@r@v15/10500072."Yes, she does that, doesn''t she?@k@v15/10500073. ...BEATRICE-sama is truly beautiful.@k@v15/10500074. I am sure that she captivated the Master."'
2157: 'George@r@v07/10300233."Ahahahaha.@k@v07/10300234. In addition to the patron theory, there''s also a theory that she was Grandfather''s first love.@k@v07/10300235. ...Either way, although it''s been several decades since he met her, even now she holds a special place in his heart.@k@v07/10300236. ...Which must mean that he is still captivated by her even today."'
2158: 'Battler@r@v10/10100421."Sheesh.@k@v10/10100422. That must have made Grandmother pretty jealous, right?"'
2159: 'Jessica@r@v04/10200236."I don''t know everything, but yeah, that did happen, actually.@k@v04/10200237. Apparently Grandmother believed that he was cheating on her with some blonde-haired woman."'
2160: 'Maria@r@v13/10400261."......Uu?@k @v13/10400262.Good smell!@k @v13/10400263.Good smell coming from Shannon!"'
2161: '@rMaria, sniffing, approached the basket Shannon-chan was holding with interest.'
2162: '@rNow that you mention it, I do notice a fragrant scent with the essence of vanilla.'
2163: 'Shannon@r@v15/10500075."Ah, I apologize.@k@v15/10500076. I was told by Kumasawa-san to bring them to you all."'
2164: 'George@r@v07/10300237."What is it, I wonder?@k @|@y@v07/10300238.......Ooh, excellent!@k @v07/10300239.Cookies."'
2165: 'Maria@r@v13/10400264."Uu!@k @v13/10400265.Want to eat cookies!@k @v13/10400266.Want to eat cookies!@k @v13/10400267.Uu!"'
2166: 'Shannon@r@v15/10500077."Certainly, you may eat as many as you would like.@k@v15/10500078. ...But, umm..."'
2167: '@rUnsure whether it was really acceptable to serve cookies in a place like this in front of the portrait,@k Shannon-chan sent us a glance which seemed to ask what we wanted to do.'
2168: '@r...Well, thinking about it, yeah, that would be bad manners.'
2169: 'Jessica@r@v04/10200238."Maria, why don''t we eat someplace else?@k @v04/10200239.Let''s put the cookies in a bento and have a picnic."'
2170: 'Maria@r@v13/10400268."Uu!@k @v13/10400269.Have a picnic, have a picnic!!@k @v13/10400270.If we can eat cookies, let''s go!"'
2171: 'Battler@r@v10/10100423."Yeah, let''s go get some fresh air.@k@v10/10100424. We shouldn''t pick at food right in front of the witch."'
2172: 'Jessica@r@v04/10200240."Oh, right, didn''t we say that we wanted to go down to the beach in the first place?@k@v04/10200241. Let''s go, let''s go."'
2173: 'George@r@v07/10300240."Shannon-chan.@k@v07/10300241. Sorry, but could I ask you to get us a blanket to sit on and some flasks of tea."'
2174: 'Shannon@r@v15/10500079."Right...!@k @v15/10500080.Certainly."'
2175: '@rShannon-chan received her instructions and gracefully bowed before retracing her steps.'
2176: '@rWe headed for the beach on our own.'
2177: '@rEveryone headed for the entrance in a group.'
2178: '@r...Feeling as though that witch was staring down at our backs, I turned around once more.'
2179: 'Maria@r@v13/10400271."...Uu.@k@v13/10400272. ......Battler, you still don''t believe...?"'
2180: 'Battler@r@v10/10100425."Oh, no, I believe.@k@v10/10100426. ......That way is more fantastical!@k @v10/10100427.The Golden Witch BEATRICE gave Grandfather ten tons of gold!"'
2181: 'Battler@r@v10/10100428."And that gold might be sleeping around somewhere.@k@v10/10100429. Plus, they''re saying Grandfather wrote that strange epitaph as though challenging us to find it if we can.@k@v10/10100430. I think that kind of romantic story is way better."'
2182: 'Jessica@r@v04/10200242."20 billion yen''s worth of goollld!@k @v04/10200243.Hehe, even if we split it up between the four of us, that''s still a ridiculous amount of money!"'
2183: 'George@r@v07/10300242."5 billion yen for each of us...@k@v07/10300243. ...Incredible!@k @v07/10300244.With that kind of money, any business would prosper.@k@v07/10300245. No, wait, we could live our whole lives fabulously without ever working at all."'
2184: 'Maria@r@v13/10400273."Uu-uu!@k @v13/10400274.Not 5 billion yen, cookies, cookies!!"'
2185: 'Battler@r@v10/10100431."Wahahaha, Maria would take cookies over money.@k@v10/10100432. Still, 5 billion yen, that''s like a dream!"'
2186: 'Krauss@r@v02/10800121."Ridiculous.@k@v02/10800122. ......Is it truly possible that you all believe in Father''s Legend of the Gold?"'
2187: 'Rudolf@r@v08/11200183."............The story about a witch who gave him the gold and so forth, we obviously don''t believe.@k@v08/11200184. However, there''s no mistake about the gold."'
2188: 'Eva@r@v05/11000217."Multiple sources have confirmed the fact that Father was in possession of gold bars from an unknown source.@k@v05/11000218. We heard that, before the Marusoo company president died, Father showed him a large amount of gold somewhere.@k@v05/11000219. Father stated clearly to him that there were ten tons'' worth."'
2189: 'Krauss@r@v02/10800123."That''s just the nonsense of a senile old man.@k@v02/10800124. Along with Father, he was just fabricating a story.@k@v02/10800125. You can''t take it seriously."'
2190: 'Hideyoshi@r@v06/11100146."If that gold didn''t exist, he wouldn''t have been able to gather so much funding...!@k @v06/11100147.Before the president died, he was a person whose sincere personality gathered a lot of respect from many in the business world.@k@v06/11100148. He wouldn''t have become a partner to such a fraud...!"'
2191: 'Rudolf@r@v08/11200185."Aniki.@k@v08/11200186_b. The president of Marusoo definitely saw it.@k@v08/11200187. Ten tons of it, clearly with his own eyes.@k@v08/11200188. Even more, Dad let the president take one ingot at random and have it examined."'
2192: 'Rudolf@r@v08/11200189."......The results of the examination showed that the ten-kilogram ingot had a purity of @bfour nines.@<99.99%@>.@v08/11200190. He said that the Ushiromiya family crest, the One-winged Eagle, was carved into it."'
2193: 'Eva@r@v05/11000220."Almost instantly, the Ushiromiya Legend of the Gold spread amongst the fixers of the business world.@k@v05/11000221. Gold from an unknown foundry has a poor rate of conversion into money.@k@v05/11000222. Thinking that it was a chance for decisive profits, they accepted it as collateral, and as a result Father was able to receive a giant loan..."'
2194: 'Krauss@r@v02/10800126."This is the most ridiculous nonsense I''ve ever heard.@k@v02/10800127. ...How old are you people?@k@v02/10800128. Are you still taking that fairy tale you heard as a kid at face value?"'
2195: 'Krauss@r@v02/10800129."Where is the proof that this "ten tons of gold" even exists?@k@v02/10800130. Isn''t it just the lies of Father and those who were closest to him?"'
2196: 'Rudolf@r@v08/11200191."......Of course it''s just a story.@k@|@y@v08/11200192. But still, Aniki.@k@v08/11200193. The amount of money that Dad raised required a suitable quantity of collateral.@k@v08/11200194. Even if the gold was just a rumor, that he must have shown them a treasure of comparable worth is an unmistakable truth, don''t you think?"'
2197: 'Krauss@r@v02/10800131."It was just a fiction of gold created by our penniless father.@k@v02/10800132. He made it seem that non-existent gold actually existed and fooled his sponsors.@k@v02/10800133. It was probably the gamble of a lifetime."'
2198: 'Krauss@r@v02/10800134."......Fortunately, his use of those funds proved successful.@k@v02/10800135. If the Korean war demands hadn''t come and the Ushiromiya family had not been restored, Father would probably have been hounded after as the crook of the century."'
2199: 'Hideyoshi@r@v06/11100149."In that case, are you saying that the gold never existed, ...and that Father made it all up?"'
2200: 'Krauss@r@v02/10800136."Of course.@k@v02/10800137. Therefore, after he had become sufficiently successful, the fiction of the gold was nothing but an inconvenience.@k@v02/10800138. So Father made up that absurd story about the witch and black magic and made the whole thing seem less believable."'
2201: 'Krauss@r@v02/10800139."In other words, he revealed that the gold was a complete fiction.@k@v02/10800140. If he says that he received the gold from a witch, no one would believe that it exists at all, right?"'
2202: 'Krauss@r@v02/10800141."He may even have said it for all of your sakes.@k@v02/10800142. Nevertheless, some stupid offspring wanting to divide up this non-existent gold with the rest of the inheritance have appeared.@k@v02/10800143. ......Rosa, don''t tell me that even you believe this kind of a fabrication...?"'
2203: 'Rosa@r@v12/11400096.".....................I can''t prove whether or not Father really has the gold."'
2204: 'Rosa@r@v12/11400097."......However, as one of father''s four children, I just want to claim my rightful share."'
2205: 'Krauss@r@v02/10800144."Hoh...@k@v02/10800145. It seems even Rosa has learned to assert herself.@k@v02/10800146. Alright, maybe this is what you all want to say:@k@v02/10800147. that I am trying to keep all of the gold to myself..."'
2206: 'Eva@r@v05/11000223."Nii-san, the fact is that you''ve obtained a massive amount of funding.@k@v05/11000224. If we rule out the possibility that you have been embezzling Father''s personal funds,@k@v05/11000225. ......then there''s only one possibility left, right?"'
2207: 'Rudolf@r@v08/11200195."......Aniki, maybe you have already found the ten tons of gold bars.@k@v08/11200196. It sure looks that way to us."'
2208: 'Krauss@r@v02/10800148."Ridiculous.@k@v02/10800149. Something like that never existed in the first place."'
2209: 'Eva@r@v05/11000226."Then explain yourself.@k@v05/11000227. Embezzlement of Father''s assets; Father''s hidden gold.@k@v05/11000228. How could you have gathered so much funding if you didn''t use one of these?"'
2210: 'Krauss@r@v02/10800150."I also have many friends in the political world and the financial world.@k@v02/10800151. I have done nothing more than gain their assistance.@k@v02/10800152. ......And as for that, I have no responsibility to explain it to you.@k@v02/10800153. You understand, don''t you?@k @v02/10800154.There are some topics that can''t be talked about."'
2211: 'Rudolf@r@v08/11200197."......If that''s the story you insist on, then fine.@k@v08/11200198. But Aniki. Dad doesn''t have long.@k@v08/11200199. Nobody can ensure that he will live to see this day next year."'
2212: 'Rudolf@r@v08/11200200."When Dad dies, the inheritance will be passed on immediately.@k@v08/11200201. We will all set up impartial lawyers and accountants to inspect the state of Dad''s finances."'
2213: 'Eva@r@v05/11000229."If, at that time, the fact that our brother has unjustly interfered with Father''s money comes to light...@k@v05/11000230. ......You understand, right?"'
2214: 'Krauss@r@v02/10800155."I don''t have a clue what you''re talking about.@k@v02/10800156. You''re starting to make me feel as indignant as my wife was."'
2215: 'Hideyoshi@r@v06/11100150."...Father''s gold is definitely one of Father''s assets!@k @v06/11100151.I understand it''s money you can''t reveal openly.@k@v06/11100152. Even so, the four siblings should have an equal right to it."'
2216: 'Rudolf@r@v08/11200202."In short, we will also have your financial situation investigated to determine whether or not you are hoarding the gold."'
2217: 'Eva@r@v05/11000231."You have a good opportunity right now.@k@v05/11000232. Prove the existence of this backup from friends and acquaintances that you mentioned.@k@v05/11000233. That way you will be spotless.@k@v05/11000234. And we can sportingly apologize for foolishly doubting you.@k@v05/11000235. Right, Rosa?"'
2218: 'Rosa@r@v12/11400098."......That''s right.@k@v12/11400099. Krauss nii-san, you are the one who''s avoiding the topic.@k@v12/11400100. If you were guiltless, you could just prove that you were in the right, yet you aren''t even trying to respond."'
2219: 'Rudolf@r@v08/11200203."However, Aniki, we still have to consider your position here.@k@v08/11200204. As Dad''s representative, you''re probably bearing a larger share of the burden than we are.@k@v08/11200205. It wouldn''t be fair for the rest of us, who have been living terribly relaxed lives until now, to complain without taking that into account."'
2220: 'Krauss@r@v02/10800157."............Hoh.@k@v02/10800158. I am spoken ill of one moment and flattered the next; it is quite tiring.@k@v02/10800159. Please get to the point."'
2221: 'Hideyoshi@r@v06/11100153."In short, ......randomly investigating nit-picky aspects of Father''s wealth seems a pretty darn boorish way to do it.@k@v06/11100154. As you said, Krauss nii-san, you''ve probably got movements of money that are difficult to explain.@k@v06/11100155. We understand that, and that''s why we''ve come to consult with you.@k@v06/11100156. ...A mutually beneficial consultation."'
2222: 'Krauss@r@v02/10800160."Consultation?@k @v02/10800161.Hoh."'
2223: 'Rudolf@r@v08/11200206."......When the inheritance is distributed, you will be rewarded for your years of hard work taking care of Dad by an agreement that is generous in your favor."'
2224: 'Eva@r@v05/11000236."Don''t misunderstand us.@k @v05/11000237.It''s not like we''re saying that we will abandon our rights.@k @v05/11000238.It''s just that when we claim what we deserve,@k@v05/11000239. it wouldn''t be bad if there was a generous understanding of your position—that''s what we mean."'
2225: 'Hideyoshi@r@v06/11100157."In other words, if you''ll accept our conditions,@k@v06/11100158. at the time of the division of the inheritance, we won''t mind leavin'' the investigation of Father''s financial status to you, Krauss nii-san."'
2226: '@rAll of the siblings from Eva downward suspected that Krauss was trying to steal their father''s wealth.'
2227: '@rIn that situation, letting Krauss report on the state of their father''s wealth by himself was extremely contradictory and a huge concession.'
2228: '@rIf, as they claimed, Krauss was actually embezzling money, Krauss would be able to hide that fact.'
2229: '@rBesides that, it would also be possible for him to control the distribution of the inheritance in a manner favorable to himself.'
2230: '@rKrauss, also realizing that this sounded too good to be true, couldn''t help but feel doubt.'
2231: '@rHe had to worry about what they would ask in return for such a compromise...'
2232: 'Krauss@r@v02/10800162."......Hoh.@k@v02/10800163. After mistrusting me completely, you now say that you''re willing to restore your confidence in me as the eldest sibling?@k@v02/10800164. And what are you asking for?"'
2233: 'Rudolf@r@v08/11200207."Just what we deserve as siblings.@k@v08/11200208. ......You aren''t the kind of person who would steal Dad''s property.@k@v08/11200209. However, there is no patron financing you.@k@v08/11200210. ...Considering all that, there is a certain explanation that would satisfy the rest of us."'
2234: 'Eva@r@v05/11000240."......Nii-san, you found the ten tons of gold,@k@v05/11000241. and used that as collateral to gather some funding.@k@v05/11000242. ...Yes, just like Father did in the past, right?"'
2235: 'Hideyoshi@r@v06/11100159."If that''s the case, there won''t be any funny bits in Father''s finances.@k@v06/11100160. You''ve always been a good son, lookin'' after Father.@k@v06/11100161. Why would we mistrust a person like that?"'
2236: 'Krauss@r@v02/10800165.".........You''re being so roundabout I can barely understand you.@k@v02/10800166. Say it more clearly and specifically."'
2237: 'Rudolf@r@v08/11200211."Our first condition:@k@v08/11200212. Aniki, you must admit that you have found Dad''s gold."'
2238: 'Krauss@r@v02/10800167."...Are you asking me to admit that I possess gold that does not exist?"'
2239: 'Eva@r@v05/11000243."Our second condition:@k@v05/11000244. recognize our rights to a share of the gold, and pay it to us."'
2240: 'Krauss@r@v02/10800168."How foolish.@k@v02/10800169. With the nonexistent 20 billion yen of gold, that would be 5 billion yen per person. Are you telling me to pay a total of 15 billion yen?@k@v02/10800170. ......Preposterous!"'
2241: 'Hideyoshi@r@v06/11100162."Keep listening until the end!@k @v06/11100163.We know that much money can''t just appear out of nowhere.@k@v06/11100164. We''re not askin'' you to make an impossible deal!@k @v06/11100165.Of course, regardin'' the portions of the gold, we plan to reward you sufficiently for your hard work until now in our calculations."'
2242: 'Eva@r@v05/11000245."Our third condition:@k@v05/11000246. the portion of the gold to the one bearing the title of successor to the Ushiromiya main family will be 50%. The remainder will be split fairly between all the siblings.@k@v05/11000247. Of course, this also includes you, Krauss nii-san."'
2243: 'Rudolf@r@v08/11200213."Of the 20 billion, 12.5 billion will go to Aniki,@k@v08/11200214. 2.5 billion will go to Eva nee-san,@k@v08/11200215. 2.5 billion will go to me,@k@v08/11200216. and 2.5 will go to Rosa."'
2244: 'Krauss@r@v02/10800171."............A distribution that makes me so grateful I could cry.@k@v02/10800172. So you''re saying, for the sake of the gold that doesn''t exist, I must pay you 7.5 billion."'
2245: 'Eva@r@v05/11000248."What''s wrong?@k@v05/11000249. Nii-san, your share is five times the size of ours.@k@v05/11000250. That''s such a good condition, I''d be jumping for joy.@k @v05/11000251.Heheheheh..."'
2246: 'Rudolf@r@v08/11200217."Our fourth condition:@k@v08/11200218. the dividends will be paid out along with the distribution of the inheritance at the time of Dad''s death.@k@v08/11200219. However, as a deposit, 10% of our portions will be paid to us promptly.@k@v08/11200220. The payment must be made before March of next year."'
2247: 'Hideyoshi@r@v06/11100166."......What do you think, Krauss nii-san? This is an ideal chance for you to restore the trust you need to run Father''s assets, isn''t it?!@k @v06/11100167.Of course, it might be impossible to get a whole 7.5 billion before Father dies.@k@v06/11100168. However, you can''t say that you couldn''t manage a deposit of 750 mil, right?"'
2248: 'Rudolf@r@v08/11200221."Paying 700 million in half a year might be slightly bothersome,@k@v08/11200222. but someone like you, who has many friends in the political and business spheres, should be able to manage it."'
2249: 'Eva@r@v05/11000252."Normally, I''d hope to receive the 7.5 billion right now, all at once.@k@v05/11000253. But out of concern for your position, if you''ll just show your sincerity by delivering 10 percent for the time being,@k@v05/11000254. it''s alright to let the remaining 90 percent carry over until the distribution of the inheritance.@k@v05/11000255. ...Right?@k @v05/11000256.Surely even you can offer a mere ten percent to show your sincerity?"'
2250: 'Krauss@r@v02/10800173."............So the right to investigate the status of Father''s assets is being sold to me for 750 million.@k@v02/10800174. .........Heh, heheheh.@k@v02/10800175. Isn''t that great?@k@v02/10800176. You all sure have grown.@k@v02/10800177. I never thought you all would become capable of offering a deal to me."'
2251: 'Eva@r@v05/11000257."Nii-san, if you accept these, the rest of us siblings will leave the investigation of Father''s assets to you.@k@v05/11000258. However, the results of that investigation will be subject to appeal."'
2252: 'Eva@r@v05/11000259."...It''s only natural, right?@k @v05/11000260.We''d be sad if you adjusted our portions downwards by 7.5 billion."'
2253: 'Rudolf@r@v08/11200223."As a general rule, we wouldn''t complain.@k@v08/11200224. As long as you do it neatly, it''s fine.@k@v08/11200225. ...As long as you don''t do anything significantly obvious, we don''t plan to aggravate anything.@k@v08/11200226. We want the inheritance quickly as much as you do.@k@v08/11200227. We don''t want it to get all drawn out and led astray."'
2254: 'Krauss@r@v02/10800178."......In the case of an appeal, who would do the second investigation?"'
2255: 'Rosa@r@v12/11400101."...............That can be you as well.@k@v12/11400102. This will probably be the first and last opportunity for us siblings to discuss this.@k@v12/11400103. ...I trust you not to let it come to that."'
2256: 'Eva@r@v05/11000261."Heheh, *cackle*cackle*!@k @v05/11000262.Rosa, you really can talk sometimes."'
2257: '@rThat Krauss was not trusted whatsoever as the oldest sibling was by now so obvious that it requires no explanation.'
2258: '@rThe formerly tyrannical oldest brother would always abuse his privileges and infringe upon the other siblings'' shares.'
2259: '@r...In response to that, the other three, now adults, were for the first time striking back at him by working together...'
2260: 'Hideyoshi@r@v06/11100169."I''m sorry, but there are further conditions.@k@v06/11100170. Our fifth condition:@k@v06/11100171. this decision must take precedence over Father''s will.@k@v06/11100172. .........Later on, we don''t want some will to appear and make this decision completely useless."'
2261: 'Krauss@r@v02/10800179.".........I see that you''re very cautious.@k@v02/10800180. ...Then let me ask, if the gold really were found, what would you do?"'
2262: 'Rudolf@r@v08/11200228."As long as you''ve settled this matter with the corresponding payment,@k@v08/11200229. then whether the gold@v08/11200230. "really"@v08/11200231. appears or not makes no difference to us.@k@v08/11200232. ...You can think of our share as an advance payment."'
2263: 'Eva@r@v05/11000263."*giggle*, gives you something to live for!@k@v05/11000264. You plan to turn this island into a resort, right?@k @v05/11000265.During construction, you might stumble upon the gold by chance."'
2264: '@rEva let out a high-pitched laugh.@k@rKrauss watched without even flinching.'
2265: 'Krauss@r@v02/10800181."......Let me add a seventh condition before I accept.@k@v02/10800182. In the situation that any sibling other than myself finds the gold, they will immediately turn it over to me."'
2266: 'Eva@r@v05/11000266."Yes, yes, of course, we''ll guarantee you that.@k @v05/11000267.*giggle*!"'
2267: '@rInsignificant details.@k The others, who were forcing Krauss to pay money for some nonexistent gold,@k would of course not ensure Krauss''s portion if they actually found the gold.'
2268: '@rFrom the beginning, this deal had been nothing more than a threat directed at Krauss.'
2269: '@rWhile the truth might be different, the probability that Krauss was embezzling his father''s assets was extremely high.'
2270: '@rWhen at last Kinzo faced death and it came time for the inheritance to be distributed, surely some unpleasant facts would come to light.'
2271: '@rThat situation would likely be a fatal wound to Krauss.'
2272: '@rThey had latched onto that weak point, and were threatening their brother under the veil of compromise, trying to wring out a huge sum of money.'
2273: '@r......However, they had let one thing slip their minds.@k@rThe three of them had forgotten that their oldest sibling, who they couldn''t defeat unless they banded together, was a very nimble thinker when it came to being crafty.'
2274: '@rKrauss relaxedly let out a gloating laugh as he spoke to Eva, who could not hide her smile, so certain she was of her victory.'
2275: 'Krauss@r@v02/10800183."Hahaha.@k@v02/10800184. This all sounds marvellous to me.@k@v02/10800185. ......I had been feeling a deep pain in my heart at my estrangement from the rest of you.@k@v02/10800186. If by accepting these conditions, I could make our sibling relationship friendly once again, I would be quite pleased."'
2276: 'Krauss@r@v02/10800187."I will gladly take you up on your offer.@k@v02/10800188. ......Be happy, Rosa.@k@v02/10800189. We have a deal."'
2277: 'Rosa@r@v12/11400104."........................"'
2278: '@rRosa''s expression dimmed.@k ......When her brother started talking like this, the conversation would never change for the better.'
2279: '@r...Eva was also sensitive enough to realize this.@k@rTherefore, even though Krauss had obediently accepted the deal, she was unable to wipe away her feeling of insecurity.'
2280: 'Eva@r@v05/11000268."...My, how obedient.@k@v05/11000269. That''s not like you, Nii-san."'
2281: 'Krauss@r@v02/10800190."That''s harsh.@k@v02/10800191. You think I have an ulterior motive?@k @v02/10800192.Of course I don''t.@k@v02/10800193. I''m just like all of you."'
2282: '@r— I''m just like all of you.@k@rIt felt as though only that part was emphasized.'
2283: '@rThe color of Rudolf''s face darkened.'
2284: '@r"I have a plan, just like all of you".@k@r...That''s what it sounded like to him.'
2285: '@rThat gave him a sense of urgency.@k Trying to bring this near-finished discussion to a conclusion, he rushed to wrap it up.'
2286: 'Rudolf@r@v08/11200233."......Then we are good.@k@v08/11200234. ...So, Aniki.@k@v08/11200235. Would you mind signing here?@k@v08/11200236. This is a written contract containing the discussion we have been having.@k@v08/11200237. There''s one for each person.@k@v08/11200238. Everyone will sign for the same contents."'
2287: '@rRudolf took four written contracts out of his breast pocket that had the details of their deal written on them.'
2288: 'Hideyoshi@r@v06/11100173."Of course, we''ll also add the seventh condition that you proposed, straight away.@k@v06/11100174. Don''t worry."'
2289: 'Rudolf@r@v08/11200239."Aniki, will you use a pen?"'
2290: '@rRudolf took a fountain pen out of his breast pocket and offered it to Krauss.'
2291: '@rKrauss made as if to accept it, but then, with a small laugh, drew back his hand without taking it and spoke.'
2292: 'Krauss@r@v02/10800194."............Actually,@v02/10800195. in order to make sure this agreement is definitely effective, I would like to propose a single amendment."'
2293: '@rWhen Krauss said that one sentence...@k@r...all of the siblings felt at the same time as though something annoying was creeping up their backs.'
2294: 'Eva@r@v05/11000270."......Th-that won''t do.@k@v05/11000271. We''ve already decided, haven''t we?@k @v05/11000272.Be quiet and sign it."'
2295: 'Krauss@r@v02/10800196."Eva, why are you so impatient?@k @v02/10800197.Of course I will sign.@k@v02/10800198. I''ll promise you all your share of the gold, 7.5 billion yen.@k@v02/10800199. I also promise that, when Father''s inheritance is distributed, I will cleanly and neatly liquidate it."'
2296: 'Krauss@r@v02/10800200.".........However, there is just one point on which I must ask you to compromise."'
2297: 'Rudolf@r@v08/11200240."............What are you talking about.@k@v08/11200241. What point don''t you like...?"'
2298: 'Krauss@r@v02/10800201."The part about promptly paying ten percent of each portion, 750 million yen.@k@v02/10800202. As you pointed out, my financial situation is not prosperous.@k@v02/10800203. While I am guaranteed to definitely collect on various future investments,@k@v02/10800204. at this time I have no choice but to admit that I am very poor."'
2299: 'Krauss@r@v02/10800205."In short, I have absolutely no money that I can move around right now.@k@v02/10800206. ......I am incompetent, and my business skills and senses are dull.@k@v02/10800207. An "unfortunate" such as me, to use your words, has no power to move 750 million in just half a year."'
2300: 'Eva@r@v05/11000273."Th-that can''t be true.@k@v05/11000274. Are you trying to deceive us with offhand remarks?"'
2301: 'Krauss@r@v02/10800208."At the time of the division of the inheritance, I will liquidate everything at once.@k@v02/10800209. Remove the condition that I must pay you ten percent in advance.@k@v02/10800210. ...That is all you have to do to get me to sign."'
2302: 'Hideyoshi@r@v06/11100175."......Krauss nii-san, that ten percent is nothin'' more than a number to measure your sincerity, isn''t it?@k @v06/11100176.Strictly speakin'', we shouldn''t even be making you a deal in the first place.@k@v06/11100177. We''re doin'' you a big favor by offerin'' to let things slide for just ten percent in good faith money."'
2303: 'Hideyoshi@r@v06/11100178."We explained all that to you, so don''t you think rejectin'' that part damages our trusting relationship a little...?"'
2304: '@rHideyoshi had a humble expression on his face and had his hands clasped together,@k but his eyes were not calm at all.'
2305: '@r......Krauss had already seen through the shadow in the depths of those eyes.'
2306: 'Krauss@r@v02/10800211.".........Hmph.@k@v02/10800212. Why are you all so hurried?@k @v02/10800213....Or are you possibly afraid of something?@k @v02/10800214..........Rosa, won''t you tell at least me?@k@v02/10800215. ...Secretly, without telling the rest of the siblings."'
2307: 'Rosa@r@v12/11400105."...............It, it''s not like I......"'
2308: 'Rudolf@r@v08/11200242."Quit it, Aniki.@k@v08/11200243. All we''re asking is whether you''re going to sign or not.@k@v08/11200244. Just forget about making any strange deals or anything suspicious."'
2309: 'Krauss@r@v02/10800216."......Hoh?@k @v02/10800217.So I have no margin for negotiation.@k@v02/10800218. ...Do you claim that my position is so weak that we are not in an even relationship...?"'
2310: '@rShivers began to crawl up Rudolf''s back...'
2311: '@rEver since he was a child, he had never been able to overcome the height of the wall that separated him from his older brother,@k and now again he began to feel himself getting sucked in by it, and the long shadow it cast...'
2312: 'Krauss@r@v02/10800219."Shouldn''t deals be made on an even footing?@k @v02/10800220.To me, this deal is something to restore the long lost trust of my younger brother and sisters, and deepen the love between us siblings.@k@v02/10800221. It has been a cancer in my heart, that I wished to resolve quickly."'
2313: 'Krauss@r@v02/10800222."I am very happy that I am able to resolve it today.@k@v02/10800223. .........But you too would be very happy to see this deal quickly concluded, wouldn''t you...?"'
2314: '@rKrauss stared at each of the siblings.@k@r...They avoided his gaze with animal-like instinct.'
2315: '@rOnly Hideyoshi was slow avoiding it.@k@r...So he was caught in Krauss''s gaze.'
2316: 'Krauss@r@v02/10800224."Hideyoshi nii-san.@k@v02/10800225. I hear that your company has been going extremely well recently, hasn''t it?@k@v02/10800226. You didn''t hit any problems getting it listed as a stock, and both its performance and stock prices are constantly growing.@k@v02/10800227. I am truly jealous."'
2317: 'Eva@r@v05/11000275."......M-my husband''s situation surely has nothing to do with this."'
2318: 'Krauss@r@v02/10800228."However, it is unfortunate that you have neglected your stockholders.@k@v02/10800229. It''s also horrible that you were unable to solidify your base when you became stock-listed.@k@v02/10800230. ......Before you realized it, some bad-natured fellows had bought up a considerable amount of your company''s stock, hadn''t they?"'
2319: 'Hideyoshi@r@v06/11100179.".........H-@v06/11100180.......how could you know something like that..."'
2320: 'Krauss@r@v02/10800231."The same way as you.@k@v02/10800232. If you can collect evidence proving that no one would offer a loan to me, then I can collect evidence on you.@k@v02/10800233. Hahaha, is it really that strange of a thing?"'
2321: '@rKrauss grinned broadly.@k@r...In contrast, Hideyoshi''s face was turning obviously pale......'
2322: '@rHideyoshi''s company was a fast-food-chain operating company that he had started from nothing.'
2323: '@rThrough Hideyoshi''s management efforts, performance of the business repeatedly rose and magnified, and ultimately it succeeded in becoming a stock-listed company.'
2324: '@rThe greatest advantage of being in the stock-holding system is that, by selling stock certificates, a large amount of financing can be gained.'
2325: '@rThat amount is far greater than the actual profits from the business.@k@rThis made it an extremely effective way to gather the massive funds needed to grow his company even further.'
2326: '@rHowever, in exchange for financing the company, the stockholders have certain rights.'
2327: '@rNamely, the right to observe and guide the company that they have financed, in order to raise its profits above their investment.'
2328: '@r......That right is guaranteed to all stockholders, and they sometimes even use it to reorganize ineffectual management.'
2329: '@rIt is the "right" to prevent the money they have spent financing the company from going to waste, by watching the management of the company.'
2330: '@rHowever, if they use this right forcibly, they can eject the former management and take over the company.'
2331: '@r...Because the general body of all stockholders has the power to dismiss the management and nominate new management.'
2332: '@rThat right is exercised on a majority decision by the stockholders.@k@rAnd people who hold more stock get to cast more votes.'
2333: '@rIn other words, if some person or group holds a majority of the stock, they can freely chase out the old management and make the president anyone they would like.'
2334: '@rIf they want, it is even possible for them to make themselves president.'
2335: '@rMany companies, in order to prevent their stock from being bought up by malicious people and their position from being threatened,@k take some kind of defensive measures, such as having their own employees or people close to them buy a lot of stock certificates, in order to prevent a hostile group from securing the majority.'
2336: '@rHowever, since Hideyoshi''s company had only recently become stock-listed, they hadn''t had the time to strengthen those defensive measures.'
2337: '@rNo, maybe Hideyoshi himself was so engrossed in the management of his company that he hadn''t realized the dangers of being stock-listed.'
2338: '@rIt''s hard to say whether he should be viewed as a kind-hearted and skilled manager immersed in management, or a foolish manager who had his feet swept out from under him...'
2339: '@r...But in any case, there were people out there who would not let him get away with that naivety unscathed.'
2340: '@rThey rapidly bought up Hideyoshi''s company''s stock and instantly gained a significant amount of power.'
2341: '@rThey then sent anonymous documents to the stockholders and began to capture the majority.'
2342: '@rThe documents read: "The current management continues to make pointless investments and is ignoring the needs of the stockholders.@k Let us force the current management to retire, cut the current wasted investments, and let this company be born again as one that gives more back to the stockholders."'
2343: '@rIt is very difficult to make the actual state of a company''s management known.'
2344: '@r...They maliciously twisted the figures Hideyoshi had produced from a tiny amount of sleep and a constant concern for his company, and made him lose the trust of his stockholders.'
2345: '@rTheir efforts had almost collected a majority of the stock in the company.'
2346: '@r...At that point, even Hideyoshi noticed and started to buy back the stock, but the stockholders, who realized that the company was undergoing an acquisition maneuver,@k demanded a ridiculous price for the shares that Hideyoshi was trying to buy back.'
2347: '@rThey continually tortured Hideyoshi, who had no leeway in the negotiation of the price.'
2348: '@rOne of the certainties of capitalism is that value will rise when both parties vie for the same thing.'
2349: '@rAnd one of the certainties of democracy is that the majority controls everything.'
2350: '@rSo in the end, whoever manages to buy up the most stock wins.'
2351: '@r...So whoever has the most money wins.'
2352: '@rIf Hideyoshi could obtain a large sum of money at this critical time, he would be able to avoid losing all of that which he had built up...'
2353: '@r@a1666.THEREFORE,@w666. MORE THAN ANYTHING ELSE,@r@w666.HE WANTED A LOT OF MONEY RIGHT NOW...!'
2354: '@rHe couldn''t wait for the division of Kinzo''s inheritance, which may not happen for some time.'
2355: 'Krauss@r@v02/10800234."And you, Rudolf, you''ve been in a lot of trouble lately, haven''t you?@k@v02/10800235. They say it''s scary overseas, but it seems that''s really true.@k@v02/10800236. American trials are settled quite emotionally.@k@v02/10800237. They won''t give a generous judgment to a foreigner.@k@v02/10800238. ......Weren''t you advised by your lawyer that making a settlement with the other party would be more economical in the end?"'
2356: 'Kyrie@r@v09/11300075."............What is he talking about...?"'
2357: 'Rudolf@r@v08/11200245."......Ah, it''s just troubles at work.@k@v08/11200246. It''s no big deal.@k@v08/11200247. It''ll be settled with money..."'
2358: '@rKyrie quickly recognized what Rudolf''s complicated expression meant.'
2359: '@r......Her husband had gotten wrapped up in some kind of trouble without her knowledge, and had been suffering alone.'
2360: 'Krauss@r@v02/10800239."That''s right.@k@v02/10800240. In this world, anything can be settled with money.@k@v02/10800241. After all, it can even buy back the broken bonds between siblings!@k @v02/10800242.America is very fussy about the violation of rights.@k@v02/10800243. But with money, anything can be settled.@k@v02/10800244. Long live capitalism."'
2361: 'Krauss@r@v02/10800245."...Although, rumors abound that the settlement money may reach several million dollars...?"'
2362: '@rRudolf had been building a large amount of wealth with a certain type of niche market.'
2363: '@r...However, a niche is a niche.@k It''s definitely not a sunny job.'
2364: '@rAn American corporate giant was trying to accuse Rudolf''s company of violating their rights.'
2365: '@rFor various reasons, it was thought that winning the trial was extremely unlikely, and Rudolf was being pressed to surrender outright.'
2366: '@r...But even so, there was a way to resolve it with money.@k@rIf he could only pay that money, though it might be painful, he could still pick himself back up.'
2367: '@r...But if he didn''t pay, he''d lose everything.'
2368: '@r@a1666.THEREFORE,@w666. MORE THAN ANYTHING ELSE,@r@w666.HE WANTED A LOT OF MONEY RIGHT NOW...!'
2369: 'Krauss@r@v02/10800246.".........Rosa, you''re a good and noble little sister.@k@v02/10800247. You wouldn''t even touch a dangerous money game.@k@v02/10800248. ...However, your softhearted nature was your ruin, wasn''t it...?@k @v02/10800249.I wouldn''t think one should agree to become a co-signer so lightly."'
2370: 'Rosa@r@v12/11400106."Nn...@v12/11400107....umm...@|@y@v12/11400108....th-that has nothing to do with you, Krauss nii-san!!"'
2371: '@rRosa uncharacteristically lay bare her emotions and yelled.@k@r...Because she had thought she had kept it a secret.@k@rAs Krauss watched, he let slip a muffled laugh...'
2372: '@r......There was nothing to fear.@k Every one of them,'
2373: '@r@a1666. MORE THAN ANYTHING ELSE,@r@w500.WANTED A LOT OF MONEY RIGHT NOW...!'
2374: '@rIn other words, the situation had been reversed.'
2375: '@rBecause only Krauss, who they were threatening, had no urgent need for a large sum of money.'
2376: '@rCompared to that, the three who were threatening him wanted money quickly, no matter what the cost.'
2377: '@rSo the longer Krauss postponed this deal, the greater the advantage to him.'
2378: '@rKrauss was very sly.@k@rHe had known of their Achilles'' heel from the beginning.@k@rEven so, he had not been certain.'
2379: '@rTherefore, he had hidden that until the very end, and, upon closely and completely examining their attitude, he had struck back.'
2380: 'Krauss@r@v02/10800250."If I could, I would love to raise some money for my darling brother and sisters in their time of need.@k@v02/10800251. ...But unfortunately, I have nothing on hand."'
2381: 'Krauss@r@v02/10800252."......If you have any sponsors in mind that can raise a whole 750 million, I suggest you try there first."'
2382: '@rKrauss''s elated words were horribly blunt.@k@rThe other siblings could do nothing more than listen, grinding their teeth.'
2383: '@r.........If they could think of a sponsor that convenient, they wouldn''t have kept up this charade.'
2384: '@rThey had entered this huge battle specifically because they had exhausted all other options.'
2385: 'Krauss@r@v02/10800253."......If you''re still set on relying on your older brother,@k@v02/10800254. I could use my influence to find you sponsors.@k@v02/10800255. .........Oh wait, you already said that I have no influence.@k@v02/10800256. Well then, I can''t do anything, can I?@k@v02/10800257. ......Hehheheheheheheh!"'
2386: '@rKrauss''s low, gloating laugh began to fill the parlor.'
2387: '@rThe younger siblings who had, until now, been driving the oldest brother into a corner, could do nothing more than grimace and grind their teeth...'
2388: 'Hideyoshi@r@v06/11100181."............E-Eva......"'
2389: 'Eva@r@v05/11000276."......Don''t make me laugh...@k@v05/11000277. As if I would put myself in your debt...!@k@v05/11000278. Don''t make me laugh...@v05/11000279.don''t make me laugh......!"'
2390: 'Rosa@r@v12/11400109."..................If...@v12/11400110....if we relied on you, how would you help us..."'
2391: 'Krauss@r@v02/10800258."I told you, didn''t I?@k@v02/10800259. All I can do is find other sponsors for you.@k@v02/10800260. Of course, I will do my utmost to negotiate so that you can borrow the interest as well.@k@v02/10800261. Hehheheheh, gahahahahahahahaha!!"'
2392: 'Rudolf@r@v08/11200248."......Damn you......@v08/11200249.taking advantage of us............"'
2393: 'Kyrie@r@v09/11300076.".........Baby.@k@v09/11300077. Please calm down."'
2394: 'Rudolf@r@v08/11200250."I am calm. I''m extremely cool......@k@v08/11200251. ...............You bastard...!"'
2395: '@rKyrie grabbed her husband''s hand.'
2396: '@rBut that action made him feel even more pitiful, so Rudolf shook it off.'
2397: '@r...Krauss laughed as though seeing that made him extremely happy.'
2398: 'Krauss@r@v02/10800262."If only we truly could find Father''s hidden gold, at a time like this.@k@v02/10800263. Then I could split it up into 2.5 billion yen portions for you right away.@k@v02/10800264. How sad, how sad, how very sad!@k @v02/10800265.How extremely totally truly hopelessly sad!"'
2399: 'Krauss@r@v02/10800266."............Tonight, let us drink together as brothers and sisters, and discuss the whereabouts of Father''s hidden gold,@k@v02/10800267. ......solve the riddle of BEATRICE''s epitaph together, why don''t we?"'
2400: 'Krauss@r@v02/10800268."With four friendly siblings all together, there is surely no puzzle that can''t be solved.@k@v02/10800269. ...Hahhahahahahaha, hahahahahahahaha, hahahahahahahaha!!"'
2401: 'Kinzo@r@v01/11500196."..................Hmph.@k@v01/11500197. How interesting.@k@v01/11500198. And what are the conditions that they attached?"'
2402: 'Kanon@r@v16/10600036."......Certainly.@k@v16/10600037. Whether or not Krauss-sama actually discovered the gold, he would pay Eva-sama, Rudolf-sama and Rosa-sama a total of 7.5 billion yen for their shares.@k@v16/10600038. However, ten percent of that would be paid before March."'
2403: 'Kinzo@r@v01/11500199."Fu, hah-hah-hah-hah-hah-ha...@k@v01/11500200. Krauss, you dunce.@k@v01/11500201. That he would have his feet swept out from under him by his younger siblings...@k@v01/11500202. Truly amusing."'
2404: 'Kinzo@r@v01/11500203."......But it seems they couldn''t seal the deal?"'
2405: 'Kanon@r@v16/10600039.".........Yes.@k@v16/10600040. Krauss-sama exposed that Eva-sama and the younger siblings all had an urgent need to get money."'
2406: 'Kinzo@r@v01/11500204."Hmph.@k@v01/11500205. So if he''s given something that simple, he can see through it, then.@k@v01/11500206. He can''t even manage incompetence.@k@v01/11500207. .........What are they doing now?"'
2407: 'Kanon@r@v16/10600041."......That conversation has been put on hold for the time being.@k@v16/10600042. Now, BEATRICE-sama''s epitaph is being discussed."'
2408: 'Kinzo@r@v01/11500208."So, they are trying to solve the riddle and find out where my gold is hidden?"'
2409: 'Kanon@r@v16/10600043."...............Yes."'
2410: '@rKinzo set down his glasses and snorted.'
2411: 'Kinzo@r@v01/11500209.".........Will the miracle be fulfilled first,@k@v01/11500210. or will those fools expose the gold first?@k@v01/11500211. ...What a sight to behold."'
2412: 'Kinzo@r@v01/11500212."......If those fools solve my puzzle, at that time I will be completely defeated.@k@v01/11500213. They can suck my corpse down to the last fragment of bone.@k@v01/11500214. The magnitude of the fools'' greed imbues my great magic with its miraculous potential."'
2413: 'Kinzo@r@v01/11500215."......But if!!@k @v01/11500216.If the fulfillment of the miracle comes first...@v01/11500217. If it comes first!@k @v01/11500218.BEATRICE will be resurrected again!!@k @v01/11500219.That smile which I have been chasing half my life will be restored...!"'
2414: 'Kinzo@r@v01/11500220."Oooooohhh, BEATRICE!!@k @v01/11500221.The sacred night when the miracle is wagered will come, and the devils'' game will begin...!@k @v01/11500222.I will definitely win, and will definitely remain alive!!"'
2415: 'Kinzo@r@v01/11500223."You can have the lives of the others!@k @v01/11500224.I don''t need wealth or honor or assets or gold or anything!@k @v01/11500225.I only want to see your smile one more time!!@k @v01/11500226.*coughcoughcough*!!"@|@y'
2416: '@rKinzo choked, apparently in great pain.'
2417: '@rKanon got closer and tried to pat his master''s back, but Kinzo signaled that he didn''t need to.'
2418: 'Kinzo@r@v01/11500227."............Do you know why I went to the trouble of exposing the hidden location of the gold so that everyone could see it?"'
2419: 'Kanon@r@v16/10600044."......No."'
2420: 'Kinzo@r@v01/11500228."It is because magical power is determined by risk.@k@v01/11500229. The greater the number of people who try to discover BEATRICE''s gold,@k@v01/11500230. the greater the danger of that happening, then assuming that the bet is successful despite those long odds, the magical power will bring about an even grander miracle."'
2421: 'Kinzo@r@v01/11500231.".........In other words, magic is a game.@k@v01/11500232. It is not true that the most superior person will become the winner.@k@v01/11500233. The winner becomes superior because he is granted magic.@k@v01/11500234. Do you understand?@k @v01/11500235.Just as the miracle of life is granted precisely because of a victory against divine odds of several hundred million to one.@k@v01/11500236. ..................Is this a little difficult for you to understand?"'
2422: 'Kanon@r@v16/10600045.".........My apologies."'
2423: 'Kinzo@r@v01/11500237."That''s fine.@k@v01/11500238. ......It all comes down to this.@k@v01/11500239. To the one that solves the mystery of BEATRICE''s epitaph, I will give all of that which I have built up.@k@v01/11500240. Wealth, honor, gold, and succession to the Ushiromiya family headship—everything that I have established!"'
2424: 'Kinzo@r@v01/11500241."The right to tackle the riddle is not limited to my children.@k@v01/11500242. Even if it were you who succeeded in solving it, that would make you qualified to gain everything."'
2425: 'Kanon@r@v16/10600046.".........Yes.@k@v16/10600047. However,@v16/10600048. ......I couldn''t possibly understand such a difficult riddle."'
2426: 'Kinzo@r@v01/11500243."Of course.@k@v01/11500244. I made it difficult.@k@v01/11500245. ...But you must also challenge it.@k@v01/11500246. That will become the seed with which the miracle of my magic will be summoned.@k@v01/11500247. If everyone challenges it, and everyone fails, that will be that."'
2427: 'Kinzo@r@v01/11500248."However, if the miracles are gathered and the magical power is born, it will happen then!@k @v01/11500249.BEATRICE will revive.@k@v01/11500250. Therefore you too must challenge it.@k@v01/11500251. All must challenge it.@k@v01/11500252. And in doing so, they must give strength to my magic!!@k @v01/11500253.Do you understand?!"'
2428: 'Kanon@r@v16/10600049."............Yes.@k@v16/10600050. ...I will try."'
2429: '@rFor a long while, Kinzo repeatedly muttered to himself, agitated and grabbing onto his head.'
2430: '@rKanon stayed where he was, alert and unmoving, until he was given the next order from his master.'
2431: '@r...Kinzo finally realized this.'
2432: 'Kinzo@r@v01/11500254."That is all, leave me now.@k@v01/11500255. ......There is a bag of sweets on the liquor cabinet.@k@v01/11500256. You can take some with you as a reward."'
2433: 'Kanon@r@v16/10600051."......I''m fine.@k@v16/10600052. After all,@v16/10600053. .........I am furniture."'
2434: 'Kinzo@r@v01/11500257."............Hmm.@k@v01/11500258. ......So furniture doesn''t eat sweets?@k@v01/11500259. ...Indeed.@k@v01/11500260. In that case, leave me."'
2435: 'Kanon@r@v16/10600054."As you ask.@k@v16/10600055. ......Please excuse me."'
2436: '@rKanon bowed and left the study.@k@rAs the door was closed, a heavy locking noise resounded.'
2437: '@rBut that was not the sound of Kanon locking the door.@k@rIt was the door locking automatically.'
2438: '@rNo one could enter without Kinzo''s permission, and once they left, they could not enter again.'
2439: '@r......It was a mechanism that Kinzo, unable to trust his blood relatives, had created to lock himself up in his own study and isolate himself from the outside world.'
2440: '@r......The only ones he could trust now were not the sons who shared his blood, but those servants who called themselves furniture...'
2441: 'Genji@r@v14/11600040_B."..................Doctor Nanjo, is something the matter?"'
2442: 'Nanjo@r@v19/11900065."...Ah, Genji-san.@k@v19/11900066. Oh, it''s just that I had no place in there anymore."'
2443: '@rWith a bitter laugh, Nanjo turned to face the door to the parlor.'
2444: '@r...It seemed that because of that motion, Genji understood what Nanjo wanted to say.'
2445: '@rFor the most part, Genji also understood the family''s situation.'
2446: '@r...It must have made him want to frown, knowing that right now in the parlor, the master he served was being discussed so disrespectfully.'
2447: '@rBut it would have been very difficult to gather that from his indifferent expression.'
2448: 'Nanjo@r@v19/11900067.".........Still,@v19/11900068. ...it isn''t clear to me.@k@v19/11900069. ...Why did Kinzo-san have something so provocative written, I wonder."'
2449: '@rNanjo looked at the portrait of BEATRICE.@k@r......No, he actually directed his gaze beneath the portrait, at the plate with the epitaph.'
2450: 'Genji@r@v14/11600041."...............I fail to understand the Master''s thoughts.@k@v14/11600042. I sense that they run very deep."'
2451: 'Nanjo@r@v19/11900070."......For as long as I can remember, whenever Kinzo-san played chess, he would always make moves based on some far-sighted reading of the board.@k@v19/11900071. Yes, sometimes even moves that were incomprehensible.@k@v19/11900072. ......For an average person like me, it is impossible to see through to whatever it is he''s planning..."'
2452: 'Genji@r@v14/11600043."I personally suspect this may be some kind of will from the Master.@k@v14/11600044. .........He most likely intends to entrust his assets and the family headship to whoever manages to comprehend it."'
2453: 'Nanjo@r@v19/11900073."......Hoping that the danger of some outsider like myself solving it...@k@v19/11900074.would force the four siblings to work together to solve the riddle.@k@v19/11900075. It could be something like that, then.@k@v19/11900076. Kinzo-san may rudely disparage his children, but he might also be hoping that the siblings repair their relationship."'
2454: 'Genji@r@v14/11600045."........................"'
2455: '@rIf, as Nanjo said, this epitaph had been written to repair the relationship between the siblings, how heartwarming that would be.'
2456: '@r...However, Nanjo and Genji both knew this was the one thing that could never be the case.'
2457: '@rHere were the two who held the longest relationship with Kinzo, more trusted than his blood relatives,@k and even they could not guess at Kinzo''s true motive...'
2458: 'Genji@r@v14/11600046."......The Master is always saying that the right to challenge the riddle is granted to everyone, whether they are a member of the family or not.@k@v14/11600047. ......How about you, Doctor Nanjo?"'
2459: 'Nanjo@r@v19/11900077."No, no......It''s a little too hard to understand for this senile old man."'
2460: 'Nanjo@r@v19/11900078."......Actually, I wrote this epitaph down in my notebook at one point in time.@k@v19/11900079. Night after night, I would try to solve it before going to sleep, but...@k@v19/11900080....hahaha, it truly is hard.@k@v19/11900081. I believe it shall continue providing me enjoyment for the rest of my days.@k@v19/11900082. What about you, Genji-san?"'
2461: 'Genji@r@v14/11600048.".........I am nothing more than furniture that serves the Master.@k@v14/11600049. Gold and assets are useless to me."'
2462: 'Nanjo@r@v19/11900083."My, my, you are a humble person.@k@v19/11900084. ...That''s probably why Kinzo-san trusts you so much."'
2463: 'Genji@r@v14/11600050."If so, I am honored..."'
2464: '@rAs Nanjo lightly laughed in response, he once again looked at the epitaph.'
2465: 'Nanjo@r@v19/11900085."......Behold the sweetfish river, running through my beloved home of old.@k@v19/11900086. You who seek the Golden Land, follow its path downstream in search of the key..."'
2466: '@rThat which is written on the epitaph of the portrait of my beloved witch BEATRICE is as follows:'
2467: '@r@z70.@s0.@v01/KIN_10010.Behold the sweetfish river, running through my beloved home of old.@k@r@v01/KIN_10020.You who seek the Golden Land, follow its path downstream in search of the key.@k@r@r@v01/KIN_10030.As you travel down it, you will see a village.@k@r@v01/KIN_10040.In that village, look for the shore the two speak of.@k@r@v01/KIN_10050.There the key to the Golden Land sleeps.@k@r@r@v01/KIN_10060.You who laid hand upon the key must journey as follows to the Golden Land.'
2468: '@r@z70.@s0.@v01/KIN_10070.On the first twilight, sacrifice the six chosen by the key.@k@r@v01/KIN_10080.On the second twilight, those who remain shall tear apart the two who are close.@k@r@v01/KIN_10090.On the third twilight, those who remain shall praise my noble name.@k@r@v01/KIN_10100.On the fourth twilight, gouge the head and kill.@k@r@v01/KIN_10110.On the fifth twilight, gouge the chest and kill.@k@r@v01/KIN_10120.On the sixth twilight, gouge the stomach and kill.@k@r@v01/KIN_10130.On the seventh twilight, gouge the knee and kill.@k@r@v01/KIN_10140.On the eighth twilight, gouge the leg and kill.@k@r@v01/KIN_10150.On the ninth twilight, the witch revives, and none shall be left alive.@k@r@v01/KIN_10160.On the tenth twilight, the journey ends, and you shall reach the Home of the Gold.'
2469: '@r@z70.@s0.@v01/KIN_10170.The witch shall praise the wise, and bestow four treasures.@k@r@r@v01/KIN_10180.One shall be all of the Golden Land''s gold.@k@r@v01/KIN_10190.One resurrects all the dead people''s souls.@k@r@v01/KIN_10200.One even revives all the love they possessed.@k@r@v01/KIN_10210.And one for the witch to eternally rest.@k@r@r@v01/KIN_10220.Rest in peace, my beloved witch, BEATRICE.'