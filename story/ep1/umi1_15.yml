6238: '@r......In the end, Kanon-kun did not regain consciousness.@|@y'
6239: '@rEven though Doctor Nanjo and the rest did all they could to heal him...@k@r...There was very little that could be done on an island like this without medicine or proper facilities...'
6240: '@rHowever, Kanon-kun was the only human ever to confront the culprit.@k@rIf only he could give us some kind of clue...'
6241: '@rBut by the time he was carried here, it was already...@w500.......too late.'
6242: 'Nanjo@r@v19/11900187.".........My sincere apologies.@k@v19/11900188. Without proper facilities, there was nothing I could do about such a serious wound..."'
6243: 'Natsuhi@r@v03/10900461."...No, that''s perfectly understandable.@k@v03/10900462. Thank you so much for giving it your very best."'
6244: '@rDoctor Nanjo''s shirt had been sprayed by a violent spurt of blood, so it was easy to imagine the devotion with which he had tried to save Kanon-kun''s life, up until the very last second.'
6245: '@rJessica was crouched in the corridor, crying in anguish.@k@r......She had probably been taking care of Kanon-kun until the moment of his death.'
6246: '@rGeorge-aniki tried to approach her with words of comfort, but when Jessica pushed him away,@k he stopped trying to interfere and left her alone.'
6247: 'Kumasawa@r@v18/11800142."............If only I hadn''t let Kanon-san go alone...... ......ooohhhh..."'
6248: 'Genji@r@v14/11600245."......Don''t let that bother you.@k@v14/11600246. ...Even if you had been with him, you may have been attacked as well.@k@v14/11600247. ......He foolishly jumped forward and paid for his mistake."'
6249: 'Jessica@r@v04/10200642."How can you say it like that?!@k @v04/10200643.Kanon-kun spotted the killer and bravely stood up to them!!@k @v04/10200644.If only Kumasawa-san had gone with him, the killer might have hesitated and chosen to run away!!"'
6250: '@rEmotion-filled words that I never thought I''d hear from the normally tactful Jessica tumbled out of her mouth.'
6251: '@r...Kumasawa, looking truly sorry, could do nothing but hang her head...'
6252: 'Battler@r@v10/10101233."Jessica..."'
6253: 'George@r@v07/10300674.".........Now isn''t the time for words.@k@v07/10300675. ...Even I feel as if -  ......and probably you''re the same?@k @|@y@v07/10300676.As if I don''t have the first clue what''s going on anymore - as if my heart is going to split open......"'
6254: '@rThere were tears in George-aniki''s eyes again.@k@r...Seeing Jessica break down crying probably brought back the pain of losing his parents.'
6255: '@r............I had already cried myself dry.@k@r...So I didn''t want to cry anymore.'
6256: '@r...However, I felt myself the pain in their hearts.'
6257: 'Maria@r@v13/10400720_1."............It''s alright, Jessica onee-chan.@k@v13/10400721. .........You''ll be able to meet Kanon again soon."'
6258: 'Jessica@r@v04/10200645."...Stop it!@k @v04/10200646.You aren''t helping...!"'
6259: 'Maria@r@v13/10400722."BEATRICE will revive the dead, and even the love they possessed.@k@v13/10400723. ......So, you''ll definitely be able to meet him soon.@k@v13/10400724. Then everyone will be able to live in peace."'
6260: 'Jessica@r@v04/10200647."This BEATRICE, who you say gave you that letter yesterday, is she the one who killed Kanon-kun?!@k @v04/10200648.Where is she?!@k @v04/10200649.Where is she hiding?!"'
6261: 'Jessica@r@v04/10200650."I''ll find her and tear her limb from limb!!!@k @v04/10200651.Say it! You know, don''t you?! You know who the killer really is!!@|@y@k @v04/10200652.What do you know and what are you hiding?!!@k @v04/10200653.Tell me, damn it!!!!!!!!"@|@y'
6262: 'Genji@r@v14/11600248."Mi-......Milady, please stop...!"'
6263: 'Maria@r@v13/10400725."Uu!@k @v13/10400726.Uu!@k @v13/10400727.BEATRICE exiiists!@k @v13/10400728."Exiiists"!!@k @v13/10400729.Uu-uu-uu!!"'
6264: 'Jessica@r@v04/10200654."Dammit, let go of me, Genji-san!!@k @v04/10200655.Maria knows who the killer is!!@k @v04/10200656.And she''s been hiding it on purpose!@k @v04/10200657_b.She must be telling them what we''re doing, guiding them as they kill us!!"'
6265: 'Natsuhi@r@v03/10900463."Jessica, be silent!!"'
6266: '@rJessica rushed at Maria and grabbed hold of her...'
6267: '@rGenji tried to stop her, but Jessica could not be calmed.@k ...The next thing I heard was the sound of Aunt Natsuhi slapping Jessica''s face.'
6268: '@rAfter that, only Jessica''s sorrowful sobbing voice resounded throughout the hall...'
6269: 'George@r@v07/10300677."......Maria-chan.@k@v07/10300678. ...I know that there''s no way you''re one of the culprits.@k@v07/10300679. ...You have been with us since the beginning, and there was no time for you to communicate with any killer."'
6270: 'George@r@v07/10300680."............So, I want you to tell me something.@k@v07/10300681. ......This "BEATRICE" who handed you the letter yesterday, ...who was she?"'
6271: '@r......Although those words seemed kind, ...they clearly showed that George still had some doubts about Maria.'
6272: '@r......He hadn''t tackled Maria.@k@rHowever, he felt exactly the same way Jessica did.'
6273: 'Battler@r@v10/10101234."......Aniki.@k@v10/10101235. I asked her the same thing only just now.@k@v10/10101236. ...The answer won''t be any different."'
6274: 'George@r@v07/10300682."I want to hear it from Maria-chan''s mouth.@k@v07/10300683. ......Who is BEATRICE?"'
6275: 'Maria@r@v13/10400730."........................@k@v13/10400731. Even if I tell you, you won''t......believe me anyway."'
6276: 'George@r@v07/10300684."What do you mean by that?!@k @v07/10300685....Is it possible that the killer is someone we know well,@k@v07/10300686. ...and that, for some reason, you''re covering for them by remaining silent?!@k @v07/10300687.Who gave you that letter?!"'
6277: 'Maria@r@v13/10400732."............I got it from BEATRICE.@k@v13/10400733. I''ll say it no matter how many times you ask.@k@v13/10400734. I got the letter from BEATRICE.@k@|@y@v13/10400735. ......Kihihihihihihihihi.@k@v13/10400736. George onii-chan, do you refuse to believe in BEATRICE because she''s not an opponent you can hit?"'
6278: 'Maria@r@v13/10400737."You want to turn your feelings of helplessness into violence and beat someone up.@k@v13/10400738. So you won''t be satisfied unless your opponent is a Human you can hit."'
6279: 'Maria@r@v13/10400739.".........So even if I tell you the truth, you won''t be able to accept it.@k@v13/10400740. So it''s pointless for me to tell you.@k@v13/10400741. You won''t believe."'
6280: 'Maria@r@v13/10400742."............But I will keep on saying it.@k@v13/10400743. I''ll say it because it''s true.@k@v13/10400744. ......BEATRICE "exists"!@k @v13/10400745.Kihihihihihihihihihihihihihihi...!@k @v13/10400746.The door to the Golden Land will soon be opened.@k@v13/10400747. And that''s where I''m going.@k@v13/10400748. BEATRICE promised!"'
6281: 'Maria@r@v13/10400749."In that world, Mama is nice, and Papa is with us and is also nice.@k@v13/10400750. I want to go there right away.@k@v13/10400751. ......Everyone is afraid of BEATRICE.@k@v13/10400752. And that is only natural.@k@v13/10400753. ......But calm yourselves.@k@v13/10400754. ...BEATRICE told me herself."'
6282: 'Maria@r@v13/10400755."By the time the typhoon has passed, she will have ended everything.@k@|@y@v13/10400756. Kihihihi@w333.@|@y...ouch."@|@y'
6283: 'Battler@r@v10/10101237."......Maria, I actually don''t dislike you being talkative, but let''s leave it at that for now.@k@v10/10101238. ...I''ll bet this is all a pretty happy situation for you, since you''re always going on about how witches exist, but keep that to yourself for the time being.@k@v10/10101239. Leave everyone else out of it."'
6284: 'Maria@r@v13/10400757."Uu."'
6285: 'Jessica@r@v04/10200658."Th-this brat, I''ve long thought she was creepy,@v04/10200659. ......but she''s actually screwed up, somehow she''s screwed up!!"'
6286: 'Jessica@r@v04/10200660."Don''t you think so, Battler?! Genji-san?!@k @v04/10200661.Kumasawa-san?!@k @v04/10200662.What about you, Mom?!!@k @v04/10200663.Maria knows who the killer is and she''s hiding it!@k @v04/10200664.Sure, maybe she hasn''t directly done anything!"'
6287: 'Jessica@r@v04/10200665."But she''s definitely the killer''s accomplice!!@k @v04/10200666.That''s right, she''s a spy!@k @v04/10200667.We can''t let her stay with us any longer!!!"'
6288: 'Maria@r@v13/10400758."...........................Kihihihi."'
6289: 'Natsuhi@r@v03/10900464.".........Maria-chan.@k@v03/10900465. ...You must learn that there are some times where indiscreet discussion must be avoided.@k@v03/10900466. If you continue to add any more oil to the fire, even I will get very angry."'
6290: 'Maria@r@v13/10400759.".................."'
6291: '@rAunt Natsuhi glared at Maria with frightening eyes.'
6292: '@r...Maria was used to Auntie Rosa''s loud style of scolding, but she apparently hadn''t developed a resistance to this kind of silent telling-off.@k ...She shrugged and kept her mouth shut.'
6293: '@rA desolate feeling filled the room...@k@rIt felt as though things would just get more complicated if anyone spoke.'
6294: '@r......How many people had already died?'
6295: '@rSix in Dad''s group.@k Also, both Auntie Eva and Uncle Hideyoshi; Kanon-kun; Grandfather.'
6296: '@r.........There were a whole eighteen people on this island.@k@r...Ten of those had been killed.'
6297: '@rMore than half of us had been killed.@k ......And at this stage, there was absolutely no guarantee that the remaining eight were going to be alright...'
6298: 'Natsuhi@r@v03/10900467."......Anyway, now is not the time for discord.@k@v03/10900468. ......Now that we are certain that the killer can enter and leave the mansion at will and strike out of nowhere,@k@v03/10900469. we must give our undivided attention to surviving until tomorrow."'
6299: 'Battler@r@v10/10101240."...I agree strongly with Aunt Natsuhi.@k@v10/10101241. ......We can take our time racking our brains over the culprit later tonight.@k@v10/10101242. For now, we should consider where to barricade ourselves in."'
6300: '@rAs I said this, I pointed out the clock to everyone.'
6301: '@rIt was already eight at night.@k ...We had been receiving shocks over and over again since the early morning, and both our bodies and our minds were completely tired out.'
6302: '@r......There was still a long, long time until tomorrow.@k We needed to find some place to barricade ourselves in, somewhere we could rest our bodies and feel even the slightest bit safe...'
6303: 'Nanjo@r@v19/11900189.".........I agree...@k@v19/11900190. Everyone is already pushing their mental and physical limits, myself included.@k@v19/11900191. I believe it would be wise to consider our plans immediately..."'
6304: 'Battler@r@v10/10101243."Settled, then.@k@v10/10101244. .........There''s a high probability that the enemy has the equivalent of a master key."'
6305: 'George@r@v07/10300688."...Were Shannon, Kanon-kun and Gohda-san holding master keys?"'
6306: 'Genji@r@v14/11600249.".........Yes.@k@v14/11600250. As long as they were on duty, they would have had them."'
6307: 'Battler@r@v10/10101245."...We didn''t want to disturb the scene, so we didn''t investigate this, but we can''t eliminate the possibility that a key had been stolen from one of them."'
6308: 'Natsuhi@r@v03/10900470.".........Even before that, we know there''s a chance that the culprit visited the servant room at some point in time so that they could unlock the shutter to the rose garden shed.@k@v03/10900471. I think it very likely that they had already obtained a master key while there."'
6309: '@rThere were many servants serving the Ushiromiya family.@k@rBecause of that, there were several master keys.'
6310: '@rFurthermore, every time the shifts changed, the keys were passed between servants.@k She had to admit that the arrangement had been somewhat sloppy.'
6311: 'Battler@r@v10/10101246."Assuming they did borrow a bundle of keys from the pocket of one of the murdered servants,@k@v10/10101247. is there any safe place that even those keys couldn''t open...?"'
6312: 'Kumasawa@r@v18/11800143.".........Because of the nature of our jobs, we have been entrusted with keys to all of the rooms...@k@v18/11800144. All of them in the mansion and in the guesthouse..."'
6313: 'Jessica@r@v04/10200668."So in other words, ......no matter where we hole up and lock ourselves in, it''d just be pointless.@k@v04/10200669. ...Fine by me, who needs goddamn locks?! If you''re gonna come, come on, dammit!@k @v04/10200670.I''ll kill you first!!"'
6314: 'George@r@v07/10300689.".........The enemy won''t approach us from the front.@k@v07/10300690. I don''t know about the first six, but if we look at what happened to my parents and Kanon-kun,@k@v07/10300691. ...and even Grandfather, the enemy has only gone after isolated people.@k@v07/10300692. They don''t have the power to assault all of us openly in a secure room."'
6315: 'Battler@r@v10/10101248."That''s right.@k@v10/10101249. It''s just like Aniki says.@k@|@y@v10/10101250. ......Maybe Auntie''s rifle can serve to stave off the enemy."'
6316: 'Natsuhi@r@v03/10900472."............I hope that is so, but..."'
6317: 'Maria@r@v13/10400760.".............................."'
6318: 'Battler@r@v10/10101251."Maria, I know you want to say something, but keep it to yourself and stay quiet for a while."'
6319: 'Maria@r@v13/10400761."...Uu."'
6320: '@rMaria probably wanted to say that witches weren''t afraid of things like guns, or something like that.'
6321: '@rBut if she were to say it out loud, the atmosphere around here would start to get pretty edgy.@k@rI had noticed and decided to put a stop to it...'
6322: 'Genji@r@v14/11600251."...............If I may.@k@v14/11600252. There is one place that cannot be entered even with the servants'' keys."'
6323: 'Natsuhi@r@v03/10900473."Where is that?"'
6324: 'Genji@r@v14/11600253."......Very well.@k@|@y@v14/11600254. It is the Master''s study."'
6325: 'Jessica@r@v04/10200671."I, ...I''m against this!!@k @v04/10200672.I don''t even wanna think about going in Grandfather''s creepy room!"'
6326: 'George@r@v07/10300693."How many keys can gain access to that room?"'
6327: 'Genji@r@v14/11600255."......There are two.@k@v14/11600256. I always have one of them.@k@v14/11600257. The other was held by the Master himself, but just now, from the body in the boiler room..."'
6328: '@rGenji-san took a handkerchief out of his pocket and opened it, showing us the burnt and filthy key to the study.'
6329: '@rThen, he showed it alongside his own key, which he had once lent to Aunt Natsuhi.'
6330: 'Genji@r@v14/11600258."...Normally, I should have left the Master''s key for the police,@k@v14/11600259. ......but he had ordered me to always protect the safety of the study, so I borrowed it for the time being."'
6331: 'Nanjo@r@v19/11900192.".........I see...@k@v19/11900193. Which means that Kinzo''s study is the only safe location right now..."'
6332: 'Natsuhi@r@v03/10900474."...It would appear that way.@k@v03/10900475. ......I don''t even want to think about being shut up all night in that room of peculiar smells,@k@v03/10900476. but it appears we must accept that his room is safer than anywhere else right now."'
6333: 'Battler@r@v10/10101252."...............Grandfather locked himself up in that "safe room", but the culprit still brought him out and killed him.@k@v10/10101253. ...We can''t say for certain that it''s truly safe."'
6334: 'George@r@v07/10300694."If we go with your theory, that Grandfather skillfully outlasted the receipt and then left the room of his own free will,@k@v07/10300695. ...it still might have some worth as a place to barricade ourselves in..."'
6335: 'Battler@r@v10/10101254."......You''re too optimistic, Aniki."'
6336: '@rHowever, ......at the same time, I thought he brought up a pretty interesting point.'
6337: '@rAfter all, this gives us a chance to question the enemy, the witch herself, about how the sealed door had been opened.'
6338: '@rIf we assume that the culprit used some technique to abduct Grandfather from his study...'
6339: '@r...they would have to show us the same trick again if they wanted to assault us in the study.'
6340: '@r......It''s an opportunity to force the culprit to demonstrate that trick right before our eyes.'
6341: '@rIf they''re a real witch, we would be forcing them to say Open Sesame and open the door by magic right in front of us.@k ......But such a thing is probably impossible.'
6342: '@rIf you flip over the chessboard, you realize that the culprit is obviously just trying to act like they''re a witch.'
6343: '@r......If they really were a witch, all they''d have to do is appear in front of us and show off a spell colorful enough to silence all our doubts.'
6344: '@r...Since they''ve avoided doing that, everything must be the work of a fake witch who wants us to think otherwise.'
6345: '@r......Therefore, a culprit who used a technique other than magic to defeat the locked room couldn''t open the door before our eyes.'
6346: 'Battler@r@v10/10101255."......Is Grandfather''s room big enough to stuff eight people in?"'
6347: 'Genji@r@v14/11600260.".........Yes.@k@v14/11600261. There is a bed, a sofa, and blankets, so while it is not luxurious, it will be more than enough to spend the night.@k@v14/11600262. There is also a sink, a bathroom, a refrigerator and a liquor cabinet."'
6348: 'Battler@r@v10/10101256."Whoa.@k@v10/10101257. That''s incredible.@k@v10/10101258. ...But isn''t that weird?@k@v10/10101259. You''re saying he built another house inside his house?@k @v10/10101260.That''s pretty cramped for the last house of someone like our grandfather, who bought a whole island and realized all of his dreams."'
6349: 'Natsuhi@r@v03/10900477."........................@k@v03/10900478. Yes, it is.@k@v03/10900479. ......After some point in time, Father wouldn''t trust any other place even inside the mansion."'
6350: 'Jessica@r@v04/10200673.".........We always sneered about how he shut himself up in there, and this time, we''re the ones who are gonna shut ourselves up.@k@v04/10200674. ...Ha!"'
6351: '@rJessica spat the words out.'
6352: 'George@r@v07/10300696."Jessica-chan, ...it feels like you would rather go search for the culprit than stay shut up somewhere."'
6353: 'Jessica@r@v04/10200675."...Of course, I don''t think we''ll be able to find them if we just start searching now.@k@v04/10200676. ...In the end, we can''t do anything but wait."'
6354: 'Jessica@r@v04/10200677."Then it doesn''t matter where we wait, does it?!@k @v04/10200678.I won''t run away or hide.@k@v04/10200679. Why don''t we just take it easy in the parlor, watching TV or something and waiting for the great BEATRICE-sama to appear?!"'
6355: 'Natsuhi@r@v03/10900480."......It will be perfectly satisfactory for her not to appear.@k@v03/10900481. There is no need for us to expose the culprit."'
6356: 'Nanjo@r@v19/11900194."Well said......@k@v19/11900195. We shouldn''t take too many risks before the police get here."'
6357: 'Natsuhi@r@v03/10900482."Thank you, Doctor Nanjo.@k@v03/10900483. .........I think we should move to Father''s study.@k@v03/10900484. ...Certainly, considering the possibility that Father was taken out of there, there''s no guarantee of absolute safety."'
6358: 'Natsuhi@r@v03/10900485."......However, just as Battler-kun reasoned,@k@v03/10900486. I also can''t deny the possibility that Father left the study of his own accord and was attacked outside."'
6359: '@r...That crazy theory had just been what I came up with to stop the argument.'
6360: '@rHowever, just as Auntie Eva had said, even though that trick would work,@k I can''t begin to explain what motive could have made Grandfather do something so awkward to sneak out of his own study.'
6361: '@rPlus, that trick of hiding under the bed and waiting for the receipt to be removed before escaping,@k couldn''t have been used unless Grandfather had "known that the receipt was wedged in the door".'
6362: '@rAuntie Eva hadn''t pointed out that last part,@k ......but it''s clear how absurd the theory was.'
6363: '@rThen does that mean, that as Auntie Eva claimed, the door was sealed and it was a locked room?'
6364: '@rIs it a doubtless fact that Aunt Natsuhi was the culprit, and that the room was a locked room...?'
6365: '@r............If Auntie were here now, she would probably make that claim openly and do me the favor of blowing my strange theory away.'
6366: '@r...But anyway.'
6367: '@rI had to admit that a room with both a bed and a toilet, that all eight people could be shut up in,@k ...and with only two keys, both of which were gathered here, had to be the safest place in the mansion right now...'
6368: '@rAt the very least, I figured this would be better than shutting ourselves up in the parlor again, and saying "nothing went wrong while we were in there before".'
6369: '@rNo, wait, ......were we safe only because we were shut up in the parlor?@k@rWhat if leaving that room and moving to an unexplored location is actually more dangerous...?'
6370: '@r...Aah, no good, no good, no goddamn good at all...@k@r.........My flimsy head is about to break out in a fever.'
6371: '@r...As I keep flipping over the chessboard, the real and the inverse keep switching with each other over and over, and I lose my ability to believe anything...'
6372: '@rWhen it seems like the culprit is one of the 18, I want to believe in BEATRICE,@k and once I start believing in BEATRICE, I start wanting to find the culprit amid the 18.'
6373: '@r...That keeps spinning around forever, and in the end, my thoughts haven''t taken one step from where they started...'
6374: '@r......How far back in the past was it that Kyrie-san taught me this chessboard way of thinking...?'
6375: '@rThat concept of examining the situation by flipping it over and thinking from the enemy''s side...@k I get the feeling that I was so interested in this way of thinking at the time, that I let it guide the way I thought about everything.'
6376: '@r......By the way, Kyrie-san was Dad''s coworker back then.@k@r...I hadn''t dreamed that the day would come when she would be added to our family...'
6377: '@r...Didn''t Kyrie-san...@w500....tell me something?'
6378: '@rI get the feeling she once said that, while this chessboard thinking was one way to look at things, it wasn''t all-powerful by any means,@k and in fact was actually bad to rely on too much...'
6379: 'Kyrie@r@v09/11300224."Chessboard thinking...@k@v09/11300225.is my interpretation of something called game theory, which I read about in a book.@k@v09/11300226. It''s a very interesting subject, so you should try tackling it when you get into college, Battler-kun."'
6380: 'Battler@r@v10/10101261."I really wanna try it!@k @v10/10101262.If I could study that and perfect my chessboard thinking, it''d be like I could read into any opponent''s moves - that''d be really fun!"'
6381: 'Kyrie@r@v09/11300227."But you can''t believe in it blindly.@k@v09/11300228. Game theory is a very deep and complicated subject.@k@v09/11300229. Chessboard thinking is just my interpretation that skims the surface of game theory.@k@v09/11300230. ......In order to thoroughly read your opponent''s moves like you are imagining, you need to do a lot of study."'
6382: 'Kyrie@r@v09/11300231."Additionally, while chessboard theory is convenient and practical, it isn''t perfect.@k@v09/11300232. It has many weak points despite its convenience."'
6383: 'Battler@r@v10/10101263."......Weak points?"'
6384: 'Kyrie@r@v09/11300233."Yes.@k@v09/11300234. ...Chessboard thinking is founded upon game theory.@k@v09/11300235. And game theory is essentially math when you boil it down.@k@v09/11300236. Do you know what the weak point of math is?@k @v09/11300237..........It''s noise."'
6385: '@rIn math, when you write 1+1=2,@k that equation will always be 1+1=2 no matter how many billions of years pass - nothing more, nothing less.'
6386: '@rThat''s because there''s absolutely no noise mixed in.'
6387: '@rBut, for example,@k ......unlike math, the Japanese language has noise mixed in.'
6388: '@rKanji are a good example.@k Old kanji and new kanji are slightly different,@k which represents an introduction of noise created by change over the ages.'
6389: '@rIsn''t history the same?@k ...There are dozens of policies that seem foolish in the modern era, but were meaningful at some point in the past.'
6390: '@rBecause the rules of chess are fixed, when a pair of experts are discussing one particular position,@k it''s possible that they could reach the same conclusion whether they''re from a hundred years in the past or a hundred years in the future.'
6391: '@r...However, if the rules of chess had gone through massive changes over time,@k it''s possible that the discussion about that same position would have changed as well.'
6392: 'Kyrie@r@v09/11300238."Precisely.@k@v09/11300239. Events in the world of humans are naturally full of noise.@k@v09/11300240. Aren''t human emotions that way?@k @v09/11300241.Even if the exact same thing occurs more than once, there''s no guarantee that humans will always act in a predictable fashion."'
6393: 'Kyrie@r@v09/11300242."......The very fact that we''re trying to read an opponent''s actions by applying a mathematical theory to them...@k@v09/11300243.means we must realize that there are already some limits and weak points to our theory.@k@v09/11300244. ......To put it quick and easy, chessboard thinking is extremely weak against noise and fickleness, and even mistakes or incorrect knowledge."'
6394: '@r...That''s right.@k Kyrie-san definitely said that...'
6395: '@rIn the first place, chess is a game where both sides play by the same rules and fight with the same objective, namely victory.@k This is why it is possible for both sides to predict the other''s moves.'
6396: '@r.........It''s possible to read an opponent because you can always suppose that they will advance with the best moves they can find.'
6397: '@r......But what if...@kthe opponent is fickle or a little tired, and makes a move that can hardly be called "the best"?'
6398: '@rOr maybe, ...what if the game actually has special rules,@k only the enemy knows them, and they can make use of something unknown to you?'
6399: '@rIn fact, what if the opponent actually has some goal other than victory?'
6400: '@rThink from your enemy''s perspective.@k@rThat is the basis of chessboard thinking.'
6401: '@r...Which means that...@k...if you misunderstand your enemy, any and all answers that you draw from that process will be complete rubbish, and of no use at all...'
6402: '@rMany times, I''d thought that by using chessboard thinking, I had gotten a glimpse into the person behind these crimes.'
6403: '@rHowever, I don''t know anything about the culprit.@k@r......Am I just playing in a labyrinth of thought?'
6404: '@r.........If Kyrie-san were here at a time like this......@kshe''d probably be able to notice something with her much, much sharper thinking ability......'
6405: '@r......Jessica never warmed to the idea of moving into Grandfather''s study.'
6406: '@rBut in the end, Aunt Natsuhi persisted and we decided to move there.'
6407: '@rEveryone was already trapped by paranoia.'
6408: '@r...Kumasawa-san had prepared dinner once already, but after the incident involving George-aniki''s parents, the kitchen and the parlor had become temporarily devoid of people.'
6409: '@rSomeone said that it might have been poisoned at that time.@k@r...Because of that, we were unable to even touch the food that Kumasawa-san had taken the trouble to make for us.'
6410: '@r.........The manner in which the first six had been killed was still unknown, but there was a possibility that it was poison.'
6411: '@r...And indeed, by this method, even a single person would be able to carry out the murder of six fully grown adults.'
6412: '@r...Furthermore, this idea made it seem like there was only a single culprit, who was also afraid of Aunt Natsuhi''s rifle, and this was very good for our emotional stability.'
6413: '@rBut the fatigue and hunger were even harsher than we had imagined.'
6414: '@r......So, on Kumasawa-san''s suggestion, we all went along together to the kitchen,@k and gathered some canned food, which would be hard to poison, to take in with us.'
6415: '@rAll of Kumasawa-san''s efforts to reward us with at least a nice dinner on this savage day regrettably came to nothing...'
6416: '@rThe food piled up on the serving cart looked just a little sad.'
6417: '@rWe all started climbing the stairs.@k Aunt Natsuhi led the group, warily staring into the darkness with both eyes and the barrel of the gun.'
6418: '@rWhen we arrived on the third floor, just as Aunt Natsuhi had warned us beforehand,@k there was a mixture of a chemical smell and a sickly sweet aroma, a stench hanging in the air that felt like it was eating into our heads.'
6419: 'Battler@r@v10/10101264."......Yeah, this kind of stench probably would give you a headache if you were shut in with it for a whole night.@k@v10/10101265. ...I know it''s a little late, but I find myself siding with Jessica against going into Grandfather''s study."'
6420: '@rThis exceptionally magnificent door felt like the source of the stench.'
6421: '@r......So this was the door to the forbidden study, which had turned away all who visited it...'
6422: '@rWhile Genji-san was unlocking the door, Maria was staring at the door and the doorknob with great interest.'
6423: 'Maria@r@v13/10400762.".........Uu.@k@v13/10400763. ...What a door."'
6424: 'Battler@r@v10/10101266."It looks old and strict and like it''d stop any jokes cold - sure is a fitting door for Grandfather''s study."'
6425: 'Maria@r@v13/10400764."......It contains a really strong power to ward off any spiritual menace.@k@v13/10400765. .........BEATRICE probably couldn''t open this door."'
6426: 'Battler@r@v10/10101267."Oh...?@k @v10/10101268.What does that mean?"'
6427: '@rMaria pointed at the doorknob.'
6428: '@r.........A scorpion crest - @kno, a design like a magic circle arranged around a scorpion, was inscribed there.'
6429: '@r...This design... ...That''s right.@k@rIsn''t this just like those keyholder charms that Maria gave Jessica and me yesterday...?'
6430: 'Maria@r@v13/10400766.".........The fifth magic circle of Mars is a strong magic repellent.@k@v13/10400767. Additionally, this magic circle was very diligently constructed, and is full of power.@k@v13/10400768. ............To beings of magic like BEATRICE, this magic circle is quite troublesome."'
6431: 'Battler@r@v10/10101269."Isn''t that comforting.@k@v10/10101270. Are you saying that we can even escape the grip of BEATRICE''s evil hand in this room?@k @v10/10101271.Our little witch here sure is reliable."'
6432: 'George@r@v07/10300697."......Then how did BEATRICE take Grandfather out...?"'
6433: 'Maria@r@v13/10400769."............Just as Battler reasoned.@k@v13/10400770. ...BEATRICE can''t go inside.@k@v13/10400771. But she has magic, and she also has familiars.@k@v13/10400772. Using those, she might have been able to force Grandfather to leave the study."'
6434: 'Battler@r@v10/10101272."Aah, I read that in a manga.@k@v10/10101273. There was a scene where the vampires were frightened of crosses, so they couldn''t get close,@k@v10/10101274. but their familiars were fine, so they made their familiars attack."'
6435: 'Maria@r@v13/10400773."That scorpion keyholder-like charm I gave to you yesterday also had the fifth magic circle of Mars on it.@k@v13/10400774. The power dwelling within it was paltry, but it would have been enough to protect you until you left the island."'
6436: 'Maria@r@v13/10400775.".........Although it sounds like you lost it, right?@k @v13/10400776.Kihihihihihihihihihihihi..."'
6437: 'Natsuhi@r@v03/10900487."......Scorpion keyholder charm?"'
6438: 'Jessica@r@v04/10200680."Ah, ......aaah, umm...@k@v04/10200681. The charm I gave you yesterday was something I got from Maria.@k@v04/10200682. I heard that it would repel magic if you put it on your doorknob, ...and at the time I thought maybe it would be better if you had it..."'
6439: 'Natsuhi@r@v03/10900488."......Is that so?@k@v03/10900489. ...I thought it was an odd thing for you to be carrying around."'
6440: 'Maria@r@v13/10400777."............Aunt Natsuhi put that...@k @v13/10400778.on her doorknob?"'
6441: 'Natsuhi@r@v03/10900490."Yes.@k@v03/10900491. ...Last night, after hearing about it from Jessica, I hung it from the doorknob on the inside of my door."'
6442: 'Maria@r@v13/10400779."Then, Aunt Natsuhi, you''re really fortunate.@k@v13/10400780. .........If you did that, BEATRICE probably couldn''t even lay one finger on you yesterday."'
6443: 'Maria@r@v13/10400781."...I think BEATRICE must have been really annoyed.@k@v13/10400782. ......Kihihihihihihihihihihihi..."'
6444: '@r...BEATRICE, annoyed...?@k@rCouldn''t lay one finger...?'
6445: '@rNatsuhi thought back on that eerie graffiti she had seen that morning, like someone had been tearing at the outside of her door with blood-soaked hands, ......and gasped in surprise.'
6446: '@rCould it be,@w500. .........that this witch who called herself BEATRICE,@w500. ......had tried to enter through the door to her very own room...?'
6447: '@rBut the magic-repelling charm had been hanging from the inside.@k@r...So she couldn''t break through the door.@k So she was annoyed.@k@r...So, she scratched at it...?'
6448: 'Jessica@r@v04/10200683."Quit it, don''t talk about that...@k@v04/10200684. Witches don''t exist.@k@v04/10200685. The killer does.@k@v04/10200686. And that''s a human just like us."'
6449: 'Jessica@r@v04/10200687."......And if you need proof, why don''t we dice her up and see if her blood''s red?@k@|@y@v04/10200688. ......Damn it, .........damn it......@k@v04/10200689. ......How could you...do that to Kanon-kun........."'
6450: '@rClick.@k Genji unlocked the door.'
6451: '@rThe eight entered Kinzo''s study...'
6452: '@rGrandfather''s study, .........I''d heard rumors about beforehand, so it didn''t surprise me all that much.'
6453: '@rHe had done nothing more than fortify it thoroughly with his occult hobbies.'
6454: '@r...If Grandfather''s hobby had been chasing after pop idols, these walls might have been buried beneath idol posters.'
6455: '@rEven if I didn''t understand it, I did realize that this room was an amalgamation of all the things he enjoyed.'
6456: '@rEven so, I couldn''t help but remain dumbfounded by the smell of his creepy medicine and the sweet stench that seemed to melt my head...'
6457: '@rWhen the door closed, it automatically made a clunk.@k@r...I see, this is the auto-lock that''s activated whenever the door is closed...'
6458: '@rAnd there were only two keys which could open this door from the outside, both of which were in this room.@k ......In other words, this room had become a "locked room".'
6459: '@r.........The shutter, the receipt, the chain.@k@r......And now, the auto-lock.'
6460: '@r...This fourth door had been locked in the most magnificent fashion yet, constructing a locked room in a perfect form that none could argue with.'
6461: '@rJust to make absolutely sure that the room was secure, we checked all over for ways in or out.'
6462: '@rThe windows were tightly locked.@k That should have been enough, but just in case, we tried knocking all over the walls.'
6463: '@r......After all, there had been whispers that there might be a hidden door in this room.@k@r...But we couldn''t find anything suspicious.'
6464: '@rGrandfather''s study was very large.@k@rEven though we called it a study, it wasn''t really a single room.'
6465: '@rIt could be divided up into four basic sections: a study section, a bedroom section, a toilet/bathroom section and a section for cooking that had a sink.'
6466: '@rI see, this study does have enough in it to live in.@k@r...Now I could understand how Grandfather could live his whole life in this room without ever leaving.'
6467: '@rIt seemed that Grandfather wasn''t in the habit of watching TV; there was no television in this room, nor even a radio.'
6468: '@r......Until tomorrow morning, there would be nothing for us to do but pass the time listening to the sound of the rain.'
6469: '@rDoctor Nanjo gazed at the chessboard that sat on the table in front of the sofa, and muttered...'
6470: '@rIt was apparently the partly finished chess match he''d been playing with Grandfather until yesterday.'
6471: '@r......The black had the white pretty well cornered, and it looked like checkmate would be reached within a few moves - the end of the endgame.'
6472: '@rEven though checkmate had almost been reached,@k ......the endgame had been rushed,@w500. ......and in the end, was never completed.'
6473: 'Nanjo@r@v19/11900196."......Kinzo-san.@k@v19/11900197. ...It seems...@v19/11900198.......we weren''t able to see this match through after all..."'
6474: 'Genji@r@v14/11600263.".........Doctor Nanjo..."'
6475: 'Nanjo@r@v19/11900199."...I was Kinzo-san''s friend for a long time, ......but I never knew about more than half of him.@k@v19/11900200. ...I believe that two Kinzos existed, a wise one...and one trapped by some madness..."'
6476: 'Nanjo@r@v19/11900201."............I never understood anything about him..."'
6477: 'Kumasawa@r@v18/11800145."...Especially when it came to BEATRICE-sama, it would seem like his personality changed..."'
6478: '@rIn the direction of Kumasawa-san''s upward gaze, a portrait of BEATRICE could be seen.'
6479: '@rIt wasn''t massive like the one hanging in the entrance hall, but small, made for this room.'
6480: '@rGrandfather probably spent every day in this room, and so much of his time...@ktalking to the witch in that portrait.'
6481: '@r......Who was BEATRICE to Grandfather in the first place?'
6482: '@r...By now, you couldn''t just explain her away by saying she was a story made by the parents to frighten children away from wandering into the forest...'
6483: '@rWhile eating the canned food we had brought from the kitchen, we talked together about who BEATRICE was.'
6484: '@r......Whether the culprit was BEATRICE herself or someone pretending to be her,@k whether they were a witch or a human - the lady in this portrait was strongly related to the basis and background of these crimes.'
6485: '@r.........You couldn''t talk about them without talking about her.'
6486: 'Jessica@r@v04/10200690."......Oh yeah.@k@v04/10200691. ...Mom, you picked up a letter from the culprit in Auntie Eva''s room, right?"'
6487: 'Natsuhi@r@v03/10900492."Yes...@k@v03/10900493. We still haven''t opened it, have we...@k@v03/10900494. ......Let''s open it and see."'
6488: '@r...Aunt Natsuhi took out that Western-style envelope.'
6489: '@rGenji-san pulled a letter opener out of a drawer in the study desk and handed it to her.'
6490: '@rWhile watching her open it, George-aniki grimaced slightly.'
6491: '@r......After all, it was a letter left at the site where his parents had been murdered.@k@r...There was a good chance that its contents would say something unbearable to Aniki...'
6492: '@rIt seemed that Aunt Natsuhi also realized that.@k@r...So she glanced over the contents first without reading it aloud.'
6493: '@rWe were a little frightened that she might grimace after reading something shocking, but she just frowned unhappily.'
6494: 'Nanjo@r@v19/11900202."......What does...it say...?"'
6495: 'Natsuhi@r@v03/10900495."...There is one unpleasant sentence.@k@v03/10900496. ......It must be trying to provoke us."'
6496: '@rAunt Natsuhi, after deciding that the contents could be shown to the children, set it openly on the table.@k Everyone stared at it at the same time.'
6497: 'Jessica@r@v04/10200692."''Praise my name''.@|@y@k@|@y@v04/10200693. .........The hell?@k@v04/10200694. ......So frickin'' smug..."'
6498: 'George@r@v07/10300698.".........It''s probably BEATRICE declaring herself the victor.@k@v07/10300699. ............Damn it..."'
6499: 'Maria@r@v13/10400783.".............................."'
6500: 'Battler@r@v10/10101275."I expect you were hoping for another weird magic circle to show up."'
6501: 'Maria@r@v13/10400784."......It wasn''t a magic circle.@k@v13/10400785. ......But it was just as I expected.@k@v13/10400786. ...Kihihi."'
6502: 'Nanjo@r@v19/11900203."What could it mean......?@k@v19/11900204. I wonder if she wants to tout her own existence..."'
6503: 'Natsuhi@r@v03/10900497."That seems reasonable.@k@v03/10900498. ......With this letter, we now know that the author of last night''s letter is the culprit.@k@v03/10900499. ......I think the identical envelope is more significant than what is written here."'
6504: 'Genji@r@v14/11600264."...............Without a doubt, this is the type of envelope and sealing wax that the Master used."'
6505: 'Kumasawa@r@v18/11800146."...Ooooohh...@k@v18/11800147. I don''t know what''s going on anymore......@k@v18/11800148. This is the first time I''ve seen anything like this since I started working for the Ushiromiya family..."'
6506: 'Battler@r@v10/10101276."If we''re to believe the letter last night, ......then BEATRICE claims to be Grandfather''s oldest confidante.@k@v10/10101277. ......Grandfather often said the same thing in the past, right?"'
6507: '@rI directed the question to Genji-san and Kumasawa-san, who nodded together.'
6508: 'Battler@r@v10/10101278."...So, the two of you knew more about this than anyone except Grandfather.@k@v10/10101279. .........Could you tell us?"'
6509: 'Natsuhi@r@v03/10900500.".........For a long time, I made a point of ignoring this topic.@k@|@y@v03/10900501. But now that it has come to this, I can no longer do so.@k@v03/10900502. ...Genji, tell us everything you know."'
6510: 'Genji@r@v14/11600265."......................................."'
6511: '@rGenji-san didn''t answer.@k ...Did he remain silent despite his knowledge, or did he know nothing at all?'
6512: '@r...Still, I had a good guess.@k ...The ghost story of the witch BEATRICE had long been deified among the servants.'
6513: '@r......He had probably been very close to Grandfather, too, and his occult hobbies.'
6514: '@rSo there was a good chance that he''d been indoctrinated with even weirder things, and had increasingly come to deify the witch.'
6515: '@rAs Grandfather''s most trusted servant, who had sworn loyalty to him,@k he might be the most influenced by the witch illusion that Grandfather had created...'
6516: '@rSo there was only one reason for Genji-san to remain silent.'
6517: '@r......He could say it, but it would definitely cause a backlash, so it was better if he kept his mouth shut, and it wasn''t like we would believe him anyway.@k Something along those lines.'
6518: '@r...Only a short while ago, Maria had been more than willing to speak bluntly and unrestrainedly, and that had earned her a scuffle with Jessica.'
6519: '@rIt was natural for Genji-san to keep his silence...'
6520: 'Natsuhi@r@v03/10900503."......Was she Father''s...@v03/10900504....mistress,@v03/10900505. perhaps?"'
6521: '@rHis mistress.@k ......That could be possible.'
6522: '@rFor ordinary poor people, polygamy isn''t only viewed negatively from a moral perspective.@k It is also an unmaintainable financial situation.'
6523: '@r......But that isn''t the case for the very rich.'
6524: '@rIt''s possible for them to have another lover in addition to their real wife.@k@r...We can''t deny the possibility that Grandfather had another woman in his life besides Grandmother.'
6525: 'Jessica@r@v04/10200695."Maybe...@k@v04/10200696. When Grandmother was alive, it seems she strongly suspected it.@k@v04/10200697. That he was cheating on her.@k@|@y@v04/10200698_b. ......I''d always thought she was just referring to the witch in Grandfather''s head, but..."'
6526: 'Battler@r@v10/10101280."...This is getting really interesting.@k@v10/10101281. ......You told me, didn''t you, Genji-san?@k @v10/10101282.You said BEATRICE has been working for Grandfather since before the mansion was finished."'
6527: 'Natsuhi@r@v03/10900506."I have heard that the construction of the mansion was completed in 1952."'
6528: 'George@r@v07/10300700."That would mean that this person called BEATRICE had been in a relationship with Grandfather for over thirty years..."'
6529: 'Battler@r@v10/10101283."Could that mistress of thirty years ago...or maybe a relative or hidden child of that person...hold some kind of grudge and be planning revenge?@k@|@y@v10/10101284. ...Ihihi, I see, this is starting to sound just like your standard Western mansion mystery."'
6530: 'Natsuhi@r@v03/10900507."............It''s a filthy topic, but the easiest line of reasoning to accept.@k@v03/10900508. ...Well, Genji?"'
6531: 'Genji@r@v14/11600266."..............................@k@v14/11600267. ...............The Master surely had feelings of deep love for her.@k@v14/11600268. There can be no mistake that he cared for her more than his late wife."'
6532: 'Jessica@r@v04/10200699."......Who is this person called BEATRICE?!@k @v04/10200700.And what is she doing now?!"'
6533: 'Genji@r@v14/11600269."..................@k@v14/11600270. ......I have heard that she passed away before the mansion was completed."'
6534: 'Battler@r@v10/10101285."She''s already dead...?"'
6535: 'Genji@r@v14/11600271."......Yes.@k@v14/11600272. ......The Master mourned for her most grievously,@k@v14/11600273. .........and he devoted himself to the art of black magic as a means to revive BEATRICE-sama."'
6536: 'Genji@r@v14/11600274."......The Master loved BEATRICE-sama from the bottom of his heart.@k@v14/11600275. ...It was that madness which drove him to do all that you see here."'
6537: '@rAs Genji-san said this, he spread his arms, ......as though asking us to look at this room, filled with the signs of Grandfather''s madness.'
6538: '@r...We were all at a loss for words.'
6539: '@rBefore this, his black magic hobby was nothing other than creepy, and we had found it impossible to understand what drove him to devote himself to it.'
6540: '@r...Nobody had tried to understand Kinzo, dismissing him as an "eccentric" who had restored the Ushiromiya family amidst his madness...'
6541: '@rAll that had been on Grandfather''s mind was the loss of the woman he loved,@k ......and the sorrow of being unable to give up on her.'
6542: '@r......Just a few moments ago, this room had seemed creepy,@k ...but in that instant, everything about it started making sense.'
6543: '@rThe creepy books,@w416. the magic circles,@w500. the medicine,@w500. ...all of it.'
6544: '@r......All just because he wanted to revive once more the visage of a single woman, who had left this world thirty long years ago...'
6545: 'Kumasawa@r@v18/11800149."............The Master only told me about BEATRICE-sama''s story once, when he was very drunk.@k@v18/11800150. .........Although I have forgotten the details.@k@|@y@v18/11800151. ......It was...@v18/11800152.a deep, deep love, enough to make a woman like me jealous."'
6546: 'Nanjo@r@v19/11900205."......When Kinzo-san succeeded the headship of the Ushiromiya family,@k@v19/11900206. ...his marriage to his late wife was decided by the few surviving elders of the family."'
6547: 'George@r@v07/10300701."...So, he married a woman who would benefit the Ushiromiya family,@v07/10300702. ......because he was forced to?"'
6548: 'Nanjo@r@v19/11900207."......That is correct.@k@v19/11900208. ......Kinzo-san was installed as the head who would revive the family, and had to bear all of that heavy responsibility.@k@|@y@v19/11900209. .........I...do not pretend to know the details of when or where Kinzo-san first met BEATRICE."'
6549: 'Battler@r@v10/10101286."............It''d be rude to say any more than that."'
6550: '@rThat was when Grandfather truly fell in love for the first time...'
6551: '@rHow deep that affection must have been.@k@r...It was easy to tell just by looking around us.'
6552: '@r......This room was covered with piles upon piles of things having to do with black magic.@k@rAnd Grandfather had spent day after long day shut in here, immersed in his research and isolated from the outside world, never taking a single day off.'
6553: '@r......You couldn''t help but realize how deep Grandfather''s love for BEATRICE was...'
6554: 'Jessica@r@v04/10200701.".....................@k@v04/10200702. ......I......had it all wrong, Genji-san."'
6555: 'Genji@r@v14/11600276."...............What might that be?"'
6556: 'Jessica@r@v04/10200703."I, ......I''ve always thought that...maybe you servants believed blindly in the witch because you were influenced by Grandfather''s creepy black magic hobby.@k@v04/10200704. ......But that''s not how it was..."'
6557: '@rPerhaps they had been acting as though at least BEATRICE''s soul had been restored,@k ......and existed inside this mansion,@w500. ......in order to soothe Grandfather''s heart...'
6558: '@rWith closed eyes, and an expression as though he was remembering something from the distant past,@w416. ......Genji maintained his silence.'
6559: '@r............He probably felt that to confess that would be to betray his one and only master in the most serious way, even though that person was already dead.'
6560: '@r......BEATRICE has revived as a witch, and she is in the mansion even now.'
6561: '@r......That was his mantra,@w583. what he had believed,@w500. ...what he had made others believe.@k@r.........And Genji would take that with him to the grave.'
6562: '@rThis might have been the last service he could offer his master.'
6563: '@rThe legend of the witch, the mysterious tale of Rokkenjima that was still whispered of amongst the servants.'
6564: '@r......Its true nature was...@w666....a sad lie.@k ...No, an act of kindness, towards Grandfather, who had lost the person he loved above all else.'
6565: 'Natsuhi@r@v03/10900509."..................@k@v03/10900510. ......I remember denying the witch''s existence in front of Father on multiple occasions.@k@v03/10900511. .........Now I finally understand how much that must have wounded him..."'
6566: 'George@r@v07/10300703."......Right now, I can understand very well.@k@|@y@v07/10300704. .........If I thought that I could revive Shannon using black magic,@k@v07/10300705. ......I''d immediately become the next owner of this room and start researching..."'
6567: 'Battler@r@v10/10101287."..............................Aniki."'
6568: '@rAnother strand of tears dripped from George''s eyes.@k@r......Maybe it was infectious; tears rose to Jessica''s eyes too, and she sniffled...'
6569: 'Maria@r@v13/10400787."............BEATRICE told me.@k@v13/10400788. .........Very soon, she''ll be able to revive.@k@v13/10400789. We''ll be able to meet up."'
6570: '@rVery soon, the door to the Golden Land will be opened.'
6571: '@rIn that promised land that glitters gold, she''ll resurrect all the dead people''s souls, and revive the love they possessed as well.'
6572: '@r......And I will sleep, in a world of peacefulness, for evermore.'
6573: 'Battler@r@v10/10101288."......Did she say that?@k@v10/10101289. The BEATRICE who gave you the letter?"'
6574: 'Maria@r@v13/10400790."...............You don''t believe, do you?@k @|@y@v13/10400791.......Kihihihi."'
6575: 'Battler@r@v10/10101290."......If only Grandfather were here.@k@v10/10101291. I''m sure he''d be happy.@k@v10/10101292. I''m sure he''d be jumping for joy now that BEATRICE is about to be revived..."'
6576: 'Battler@r@v10/10101293."...In that case, I''ll believe.@k@v10/10101294. ...If spending half of his life on research is what brought life back to Grandfather, and if believing that the soul of the woman he loved had been resurrected is what enabled him to live to a ripe old age, ...I''ll believe too."'
6577: 'Maria@r@v13/10400792.".........Battler........................"'
6578: 'George@r@v07/10300706."...When love for a single woman is persistent over a long time,@v07/10300707. ......it is shared by those around you and becomes the truth."'
6579: 'George@r@v07/10300708.".........Maybe you could say they''re just being considerate.@k@v07/10300709. .........But right here, now, ...I''d like to call that magic."'
6580: 'Maria@r@v13/10400793."............It isn''t consideration.@k@v13/10400794. .........It really is...magic.@k@v13/10400795. ...She''s a witch.@k@|@y@v13/10400796. ......Kihihihihihi.@k@v13/10400797. It looks like nobody can see BEATRICE after all..."'
6581: '@rSome time passed.@k As we listened to the sound of the rain,@k ......we considered what kind of love and madness must have possessed the owner of this room as he spent half of his life here...'
6582: 'Natsuhi@r@v03/10900512_b.".........If you ask me as a woman, then while I''d like to understand Father''s feelings of true love,@k@v03/10900513. ......it does leave Mother in an awkward position."'
6583: 'Jessica@r@v04/10200705."Haha, I agree.@k@v04/10200706. Cheating is cheating.@k@v04/10200707. No way to make it pretty..."'
6584: 'Battler@r@v10/10101295."......That''s also true.@k@v10/10101296. Poor Grandmother."'
6585: 'George@r@v07/10300710."So, ......is there any story about a child between BEATRICE and Grandfather...?"'
6586: '@rThe keyword "BEATRICE" has been hidden in every corner of this case.'
6587: '@rSo it''s natural to suspect any relative of BEATRICE.'
6588: 'Genji@r@v14/11600277."No.@k@v14/11600278. .........I have not heard of anything like that."'
6589: 'George@r@v07/10300711."......If there had been one, I''m sure he would have given them all of his affection, in memory of his beloved.@k@|@y@v07/10300712. ...Since that didn''t happen, and he immersed himself in black magic, maybe we should assume that there was no such child."'
6590: 'Jessica@r@v04/10200708."..................Come to think of it, this reminds me of a rumor I heard.@k@|@y@v04/10200709. ...You know it, right?@k @v04/10200710_b.You know that story about how Grandfather heavily supported a welfare institute called the Gospel House?"'
6591: 'Natsuhi@r@v03/10900514."...Enough of that.@k@v03/10900515. That is nothing more than slander which would desecrate Father."'
6592: 'Battler@r@v10/10101297."Tell us, Aunt Natsuhi.@k@v10/10101298. ...Don''t you agree that we shouldn''t hide things from each other?"'
6593: 'Natsuhi@r@v03/10900516."...............It''s a worthless story.@k@v03/10900517. Father heavily supported that institute, and opened up servant employment positions for them within this house as part of their social studies.@k@v03/10900518. ...Some foolish people started spreading rumors that Father had foul motivations - that is all."'
6594: 'Jessica@r@v04/10200711."At one point, there was a rumor that he was collecting sacrifices for his black magic...@k@v04/10200712. And since he was actually doing weird experiments and rituals in this room all the time, I half believed it myself..."'
6595: 'Battler@r@v10/10101299."......And who are these servants who came from the Gospel House?"'
6596: 'Genji@r@v14/11600279."............There are several, but during the family conference, only Shannon and Kanon were scheduled to be here."'
6597: '@rTo resurrect BEATRICE, he had summoned servants from a welfare institute......as sacrifices...?'
6598: 'Jessica@r@v04/10200713."After all, everyone that Grandfather selected as a servant was young, always about the same age as Shannon or Kanon-kun.@k@v04/10200714. ...I was sure that Grandfather had some weird inclinations."'
6599: 'Natsuhi@r@v03/10900519."Jessica!@k @v03/10900520.Control your words."'
6600: '@rWhen Aunt Natsuhi scolded her, the atmosphere instantly went sour and everyone fell quiet.'
6601: '@r...However, something was tugging at the back of my mind.'
6602: '@rSacrifices...@k Sacrifices...@k .........Sacrifices brought over from the Gospel House...'
6603: '@r......What is it?@k Freaky words like "sacrifices" don''t pop up often.'
6604: '@r...Yet I''ve seen or heard that word somewhere recently.@k@r.........Some part of my memory is tugging at me.'
6605: '@r......Come on, BEATRICE.@k@rWhat do you know...?'
6606: '@rI had arrived in front of the portrait of BEATRICE.'
6607: '@rIt wasn''t as vast as the one in the entrance hall,@k but that portrait, which he must have had drawn by some famous painter, was still just as intimidating in this smaller size.'
6608: '@r...Below it, just like in the entrance hall, was the epitaph said to point out the place where the gold was hidden......'
6609: 'Battler@r@v10/10101300."..................ah...@v10/10101301................!@k @v10/10101302.Sacrifices...@v10/10101303......."'
6610: 'Jessica@r@v04/10200715."Wh-what the hell, Battler?@k@v04/10200716. You''re creeping me out..."'
6611: 'Battler@r@v10/10101304.".........Sacrifice...@v10/10101305.the six.@k@v10/10101306. ............ah...@v10/10101307.......AAAAAAAAaaaaaaaahh!!!"'
6612: '@rBoth of my eyes opened as wide as plates...@k@r......Right there, everything had been predicted since the very beginning......!'
6613: '@rEveryone crowded around.@k@rAnd the same expression of terror filled every face...!'
6614: '@rYes.@k It was written in the epitaph.'
6615: '@r@a1666."On the first twilight, sacrifice the six chosen by the key."'
6616: 'Battler@r@v10/10101308."Ah, ......aaahh, there''s no doubt.@k@v10/10101309. Six people died in the beginning!@k @v10/10101310.And even on the shutter where the magic circle was drawn, no, where the Hebrew was written, it mentioned the offering of sacrifices...!!"'
6617: 'Maria@r@v13/10400798."......Uu.@k@v13/10400799_1. ...I''ve been saying that from the beginning."'
6618: '@rThat''s right, Maria had said it at the very beginning!@k@rRight after we found the six bodies, when Maria was in the parlor watching TV, she had said it!'
6619: '@r -  ............Uu.@k Killer''s not human.@k Just the sacrifices chosen by the key.'
6620: 'Battler@r@v10/10101311."This has nothing to do with the location of the hidden gold!!@k @v10/10101312.It''s black magic or something, the instructions for a resurrection ritual!@k @v10/10101313.If I remember right, this epitaph requires a large number of "deaths"!"'
6621: 'Jessica@r@v04/10200717."...It, it sure does.@k@v04/10200718. Even reading through it quickly, there''d be 6+2+5...@k@v04/10200719....13 people who have to die...!"'
6622: 'George@r@v07/10300713."...How many people are normally on this island?!"'
6623: 'Natsuhi@r@v03/10900521."It, ...it varies depending on the shifts for the servants, but there''s Father, my husband, me and Jessica.@k@v03/10900522. And two or three servants.@k@v03/10900523. ...Today and yesterday, there were five of them, but there aren''t normally that many."'
6624: 'Battler@r@v10/10101314."Which means that normally,@k@v10/10101315. ......there wouldn''t be enough sacrifices to carry out this "ritual".@k@|@y@v10/10101316. ......No, wait.@k@v10/10101317. ......There''s that rumor that Grandfather was collecting servants from the Gospel House to be used as sacrifices in some creepy ritual..."'
6625: 'Jessica@r@v04/10200720."So, what?!@k @v04/10200721.He increased the number of servants to increase the number of sacrifices, ......and waited for the annual family conference when even more people would gather...@k@v04/10200722. ...Isn''t now the only time of the year that this ritual could be held?!"'
6626: '@rWhen Jessica screamed this, Maria broke out in that creepy laugh, looking truly pleased.'
6627: 'Maria@r@v13/10400800."...............Kihihihihihihihihihihihihihihi.@k@v13/10400801. ...Aren''t there some people who make bets to test their fate?"'
6628: '@rLike throwing a sandal and saying that if it lands right side up, tomorrow will be sunny.@k@r...Or saying that tomorrow will be a good day if a coin lands on heads.'
6629: '@r......There are many little superstitions like that.'
6630: '@rIf you''re fed up at how nothing is going right for you, and you happen to roll some dice and get three sixes, it would probably make you want to believe that it''s a sign of some miracle.'
6631: '@r...When flipping a sandal, you have at worst a fifty percent chance.@k@rEven if you get it right side up, it''s not worth much.'
6632: '@r...But if you carelessly roll three dice and they all come up six, you might think that''s a small miracle.'
6633: 'Maria@r@v13/10400802.".........Sorcery works the same way.@k@v13/10400803. ...You keep on praying earnestly, hoping for that impossibly unlikely outcome.@k@v13/10400804. ......Then, when that impossible result shows itself, the feelings from all those stored up prayers are made incarnate through magic."'
6634: 'Maria@r@v13/10400805."............The sorcery that Grandfather was trying to perform was probably like that.@k@v13/10400806. The key randomly selected sacrifices in a lottery.@k@v13/10400807. So to reduce the chance that he himself was selected, he chose the day with the greatest number of people on the island to carry out the ritual..."'
6635: 'Natsuhi@r@v03/10900524."How ridiculous!!@k @v03/10900525.Are you saying that all these incidents were part of the process of some questionable magic ritual?!"'
6636: '@rNatsuhi yelled.'
6637: '@r......She couldn''t stop thinking fearfully about how she might have been protected just because of the scorpion charm.'
6638: '@r.........If I hadn''t received that charm from Jessica and hung it from my doorknob,@k ......would I have been killed, been one of those six?!'
6639: '@rAnd the strangest part is...even though I hung the charm from the inside of my door, they couldn''t get through the door.'
6640: '@r......The killer had noticed the charm from outside the door, and had given up trying to open the door.'
6641: '@r......A human couldn''t have perceived that.'
6642: '@rThe charm meant to stop someone that was not human...had done just that...!!@k Impossible, impossible, impossible!!!'
6643: 'Nanjo@r@v19/11900210."However, Natsuhi-san...@k@v19/11900211. Look, ......the epitaph traces the events that followed..."'
6644: 'Kumasawa@r@v18/11800153."O-on the second twilight, those who remain shall tear apart the two who are close...@k@v18/11800154. ...Could this be talking about Eva-sama and Hideyoshi-sama...?"'
6645: 'George@r@v07/10300714.".........P-painful as it may be, ...we must reach that conclusion.@k@v07/10300715. ...And after the culprit killed them, they left the words from "the third twilight" in a letter there."'
6646: 'Battler@r@v10/10101318."Th-that''s right...@k@v10/10101319. After carrying out the second twilight, they left the third twilight in that place.@k@v10/10101320. ...The third twilight is...just like Aunt Natsuhi just read...!!"'
6647: '@r@a1666."On the third twilight, those who remain shall praise my noble name."'
6648: '@rAaaaaaaaaahhh... Now I read it, it just keeps going on, doesn''t it?'
6649: '@r@a1666."On the fourth twilight, gouge the head and kill."'
6650: '@rGouge the head and kill.'
6651: '@r......George-aniki''s parents were killed with the "demon''s icepicks" gouged into their heads.'
6652: '@r...But if that counted as the second twilight,@w500. ......someone else must be gouged in the head...'
6653: 'Battler@r@v10/10101321."......That''s Grandfather...@k@v10/10101322. He had been burned in the incinerator, and our eyes were so drawn to that part that we didn''t notice,@k@v10/10101323. ......but Grandfather''s forehead,@v10/10101324. ...no, his head had been gouged."'
6654: 'Jessica@r@v04/10200723."Grandfather is......the victim of the fourth twilight?@k @v04/10200724.Th-...then, Kanon-kun...!"'
6655: 'George@r@v07/10300716."...''On the fifth twilight, gouge the chest and kill''.@k@v07/10300717. ......We thought that Kanon-kun''s case was an unexpected encounter with the culprit, .........but that''s wrong.@k@v07/10300718. They had been planning on luring someone out alone and driving something through their chest from the beginning..."'
6656: 'Natsuhi@r@v03/10900526."............If the culprit has followed the epitaph this far...@k@v03/10900527....does that mean that three people still have to die...?!"'
6657: '@r@a1666."On the sixth twilight, gouge the stomach and kill."@k@r@a1666."On the seventh twilight, gouge the knee and kill."@k@r@a1666."On the eighth twilight, gouge the leg and kill."'
6658: 'Kumasawa@r@v18/11800155."......Y-......yes,@v18/11800156. ...you could read it that way...@k@v18/11800157. ......hiiiii..."'
6659: 'Battler@r@v10/10101325."Well, I wonder about that...@k@v10/10101326. .........After those three die, it reaches the ninth twilight.@k@v10/10101327. Take a look..."'
6660: '@r@a1666."On the ninth twilight, the witch revives, and none shall be left alive."'
6661: 'Jessica@r@v04/10200725."We are...all going to be killed by BEATRICE......"'
6662: 'Battler@r@v10/10101328.".........I don''t get it.@k@v10/10101329. Doesn''t that mean that everyone will die no matter how many people there are?@k@v10/10101330. ......What was Grandfather''s goal?@k@v10/10101331. Doesn''t this mean that this ritual would kill Grandfather himself no matter what...?!"'
6663: 'Maria@r@v13/10400808."...............It doesn''t matter that no one''s left alive.@k@v13/10400809. ......On the tenth twilight, we finally arrive at the Golden Land."'
6664: '@r@a1666."On the tenth twilight, the journey ends, and you shall reach the Home of the Gold."@k@r@a1666."The witch shall praise the wise, and bestow four treasures."'
6665: 'Maria@r@v13/10400810."......Grandfather wasn''t afraid of something like death.@k@v13/10400811. .........Look at the second and third of the four treasures."'
6666: 'George@r@v07/10300719."............''One resurrects all the dead people''s souls.@k@v07/10300720. One even revives all the love they possessed.''@k@v07/10300721. ......So Grandfather believed that he would eventually be revived, even if he died partway through this ritual...?"'
6667: 'Jessica@r@v04/10200726."Ridiculous, that''s insane!!@k @v04/10200727.When you die, it''s over, right?!@k @v04/10200728.The dead don''t come back to life.@k@v04/10200729. That''s a miracle that humanity has been chasing after for thousands of years and still hasn''t accomplished!@k @v04/10200730.So it''s gotta be something like this, right?@k @v04/10200731.Something like, you can revive and meet them in the world after death?!"'
6668: 'Battler@r@v10/10101332."......If what you say is right, ......would that mean...@k@v10/10101333.Grandfather, whose remaining life is slim and who is insane because of love, is committing suicide,@k@v10/10101334. no, ...a massive forced group suicide...?!"'
6669: 'Genji@r@v14/11600280."...................................."'
6670: 'Natsuhi@r@v03/10900528."......Genji.@k@v03/10900529. ...Can that possibility be considered...?!"'
6671: 'Genji@r@v14/11600281."............I do not know.@k@v14/11600282. ...The Master is a man who sometimes has the wisdom to see a thousand years into the future.@k@v14/11600283. However, there are times when that appears to be nothing more than madness to commoners such as myself..."'
6672: 'Jessica@r@v04/10200732."What, does that mean "yes"?!@k @v04/10200733.What do you say, Kumasawa-san?!"'
6673: 'Kumasawa@r@v18/11800158."I, I don''t know anything...!@k @v18/11800159.No, you can be sure of that...@k@v18/11800160. Do you think I would be on this island today if I did know?@k @v18/11800161.I would have faked an illness or done whatever it took to get the day off, good gracious, yes!!"'
6674: 'George@r@v07/10300722."What about your opinion, Doctor Nanjo - you''ve been Grandfather''s friend for many years..."'
6675: 'Nanjo@r@v19/11900212.".........I, I feel the same as Genji-san.@k@v19/11900213. ...Kinzo-san was a man who far surpassed ordinary people.@k@v19/11900214. I''ve even felt a sort of inhuman power from him at times."'
6676: 'Nanjo@r@v19/11900215.".........Not even I.........understand what Kinzo-san was thinking when he wrote that epitaph...!"'
6677: 'Natsuhi@r@v03/10900530."...All we can say......is that even if the person who created this outline was Father, the one carrying it out is a different person."'
6678: 'Battler@r@v10/10101335."That''s right.@k@v10/10101336. .........At the very least, there''s another culprit who attacked Grandfather and Kanon-kun.@k@v10/10101337. Furthermore, that person is still continuing the crimes just as the epitaph says...!"'
6679: 'George@r@v07/10300723."...The letter in the beginning that we didn''t think deeply about...@k@v07/10300724. What was it that was written there?"'
6680: '@rWe thought back to the recitation of the letter last night...'
6681: '@rBEATRICE had proclaimed something inside the letter.@k@rShe had proclaimed that, in accordance with her contract with Kinzo, she would collect everything of the Ushiromiya family as interest.'
6682: '@rBut then she had also revealed a special clause.'
6683: '@rIf someone discovered the location of the gold Grandfather had hidden, that right would be lost.'
6684: '@rAt the time that the letter had been read, Grandfather was still alive.@k@r...But at that time, it had already been sealed with wax by the Head''s Ring.'
6685: '@r...Which meant that Grandfather had handed the ring over to BEATRICE while he was still alive.'
6686: '@r.........If you think about that straightforwardly,@k we should probably take that to mean that BEATRICE is carrying out that strange contract, and Grandfather is securing her that right.'
6687: '@r......Simply put, it was the same as saying that Grandfather knew of and approved of the contents of that letter.'
6688: '@rIn other words, it''s as though it was a joint message from BEATRICE and Grandfather...@ktelling us that BEATRICE will start collecting interest if we don''t solve the riddle.'
6689: '@r......In short, Grandfather and BEATRICE were telling us to solve the epitaph''s riddle.@k And if we couldn''t, they were saying they would kill us all, following the procedure in the epitaph.'
6690: '@rWhat meaning is there to that?@k What do they want?!@k@rI don''t have a clue what it means!'
6691: 'Maria@r@v13/10400812.".....................@k@|@y@v13/10400813. .........Look, another letter from BEATRICE."'
6692: 'Battler@r@v10/10101338."......Huh?@k @v10/10101339.What did you say?"'
6693: '@rMaria was pointing at the top of the table, where the canned food that everyone had been eating just now still lay.'
6694: '@rA Western-style envelope was sitting there, ......but so what?'
6695: 'Natsuhi@r@v03/10900531."......What?!"'
6696: '@rAunt Natsuhi let out a hysterical cry, looking between her own hand and the table.'
6697: '@r......Because the envelope that she had just opened was still grasped in her hand.'
6698: '@r......And despite that, there''s an envelope on the table...?!'
6699: 'Jessica@r@v04/10200734."Wh-......what is this?!?!@k @v04/10200735.What''s going on, Maria!!@k @v04/10200736.Where did that envelope come from?!"'
6700: 'Maria@r@v13/10400814."......Just now, I looked and it was lying there.@k@v13/10400815. Uu."'
6701: 'Kumasawa@r@v18/11800162."I, ......I don''t know anything, anything!!"'
6702: 'Battler@r@v10/10101340."This isn''t funny, there''s only the eight of us here!!@k @v10/10101341.There''s no way some ninth person snuck in!!@k @v10/10101342.There wasn''t enough time during the few seconds that we gathered around the portrait, right?!"'
6703: 'Natsuhi@r@v03/10900532."Get back, all of you!!!@k @v03/10900533.Back against the wall!!"'
6704: '@rAunt Natsuhi was pointing the rifle at Genji and the others, bellowing at them...!'
6705: '@rGenji-san was overpowered, his face looking like he didn''t have a clue what was going on...'
6706: '@rOf course, I felt the same, ......but a few moments late, I reached the same conclusion Aunt Natsuhi had.'
6707: '@rUntil just a few seconds ago, there was no letter like this on the table...!@k And nobody had entered this room!@k That means someone among us had placed it there during the few seconds when everyone was looking away, preoccupied with the portrait...!!'
6708: 'Natsuhi@r@v03/10900534."Battler-kun, open that envelope and read what''s inside!"'
6709: 'Battler@r@v10/10101343."S-sure!!"'
6710: '@rI picked up the envelope.@k ......It was still sealed with wax.'
6711: '@rEven without disturbing its contents, I realized that this was an unopened envelope, an unknown envelope!'
6712: '@rWithout relying on a letter opener, I violently tore it open and pulled out the letter inside.'
6713: '@rThe contents were as follows.'
6714: '@r@v27/10700001.@z70. -  Are you enjoying the riddle of Kinzo-sama''s epitaph?@k@r@v27/10700002.As you are all probably aware, you have very little time remaining.@k@r@v27/10700003.Please abandon any naive hopes of escaping after the storm passes.@k@r@v27/10700004.This game can only end with my victory or yours.@k@r@v27/10700005.When time runs out, I will win by default.@k@v27/10700006. There will be no ties.@k@r@v27/10700007.Make sure that you do not misunderstand your current situation.'
6715: 'Battler@r@v10/10101344."That''s what it says......"'
6716: 'Natsuhi@r@v03/10900535.".........It isn''t clear who put this letter there.@k@v03/10900536. However, I have been able to narrow down the list of suspects.@k@|@y@v03/10900537. It''s all of you!!"'
6717: 'Kumasawa@r@v18/11800163."......M-Madam...@k@v18/11800164. That''s just......too horrible......"'
6718: 'Natsuhi@r@v03/10900538."Just before I moved towards the portrait, I set a can of food down here.@k@v03/10900539. At that time, there definitely wasn''t anything as strange as this letter there!!"'
6719: 'Natsuhi@r@v03/10900540."And at that time, Jessica, George-kun and Battler-kun were already in front of the portrait!!@k @v03/10900541.And they didn''t leave the spot in front of the portrait until the letter appeared!@k @v03/10900542.So the person who set that letter down is one of you four!!!@k @v03/10900543.BEATRICE is one of you!!!"'
6720: 'Maria@r@v13/10400816.".........Uu.@k@v13/10400817. We aren''t BEATRICE.@k@v13/10400818. ...BEATRICE "exists"!"'
6721: 'Natsuhi@r@v03/10900544."Silence!!!@k @v03/10900545.I don''t know whether I should suspect one of you or all of you.@k@v03/10900546. ...But without a doubt, at least one among you is the culprit!!!"'
6722: 'Jessica@r@v04/10200737."......Th-...that''s right.@k@v04/10200738. There can''t be a 19th person...!@k @v04/10200739.There''s no way witches exist!!@k @v04/10200740.Even when Kanon-kun was killed,@v04/10200741. ......yeah, that could be explained if Kumasawa-san was the one who did it!!"'
6723: 'Jessica@r@v04/10200742."The truth is that Kumasawa-san entered the boiler room with Kanon-kun and killed him!@k @v04/10200743.And then she lied, saying he had already fallen when she got there!!"'
6724: 'Kumasawa@r@v18/11800165."Y-you''re making a mistake, Milady...!!@k @v18/11800166.Why would I do something like that...?!!"'
6725: 'George@r@v07/10300725."...I don''t have the slightest idea how my parents were killed in that locked room.@k@v07/10300726. But when they were killed, everyone except for the servants had an alibi."'
6726: 'George@r@v07/10300727."......The only ones who didn''t were the servants...@k@v07/10300728. But, ...is it really correct to suspect them...?!"'
6727: 'Battler@r@v10/10101345."......W-...well, now that you mention it, they do have no alibi for any of the cases, but...@k@v10/10101346. .........nghh!!"'
6728: '@rShould we really be so quick to make that judgment?!@k@rBut this time...in this room, in this place, in this moment...in this minimally small bit of time and space, it''s obvious.'
6729: '@rOnly one of the four of them could have set the letter there in our blind spot...!!@k@rWe can''t tell who put it there, but it''s obvious that one of the four did it...!!'
6730: 'Nanjo@r@v19/11900216."...Na-......Natsuhi-san.@k@v19/11900217. Please, calm yourself...@k@v19/11900218. A lot has happened today!@k @v19/11900219.I understand the condition your heart is in right now...!"'
6731: 'Natsuhi@r@v03/10900547."Doctor Nanjo, it truly pains me to call you suspicious...!@k@v03/10900548. However, as Father''s personal doctor - and his closest friend! - you have been by his side for many years."'
6732: 'Natsuhi@r@v03/10900549."You might know about BEATRICE as well.@k@v03/10900550. Could you be hiding some kind of old personal connection of his?!"'
6733: 'Nanjo@r@v19/11900220."Of course not...!!@k @v19/11900221.Calm yourself...!"'
6734: '@rIt was pitiful to watch Doctor Nanjo frantically pleading his innocence.@k@rIt was probably a normal reaction that anyone would give if they were suspected.'
6735: '@rKumasawa was the same.@k Since Jessica had started suspecting her in the murder of Kanon, she was now totally flustered.'
6736: '@rThat was why Genji''s still-calm appearance looked so bold.'
6737: '@rAunt Natsuhi pointed the barrel of the gun.'
6738: 'Natsuhi@r@v03/10900551."............Genji.@k@v03/10900552. You were Father''s number one subordinate.@k@v03/10900553. ...Was BEATRICE a fantasy you showed to Father, with you as the performer?!"'
6739: 'Genji@r@v14/11600284.".........If by suspecting me, you recognize me as the Master''s greatest servant,@k@v14/11600285. ......then it is a great honor to me, regardless of the circumstances.@k@v14/11600286. .........However, I am not the one who put the letter there."'
6740: 'Natsuhi@r@v03/10900554."Do you expect me to just accept that?!!@k @v03/10900555.You must be the ringleader!@k @v03/10900556.Maybe Kumasawa and Doctor Nanjo are your accomplices!!@k @|@y@v03/10900557..........And you too, Maria-chan."'
6741: '@rNot content to doubt just the adults, Aunt Natsuhi pointed the gun relentlessly at Maria too.'
6742: '@rBut Maria acted as though nothing had happened.'
6743: '@r.........Or maybe she thought she would be fine even if she was shot.'
6744: 'Natsuhi@r@v03/10900558."Maria-chan.@k@v03/10900559. ...By this point, we can no longer remove someone from suspicion just because they are young.@k@v03/10900560. So for the last time, let me ask the question that everyone''s brought to you since last night!"'
6745: 'Natsuhi@r@v03/10900561."...Yesterday, who was the BEATRICE that handed you the letter?!!"'
6746: 'Maria@r@v13/10400819."..................Uu."'
6747: 'Jessica@r@v04/10200744."......Maria, don''t try to fool us!!@k @v04/10200745.Make it clear!@k @v04/10200746.Who the hell gave you that letter?!!"'
6748: 'Maria@r@v13/10400820."...Kihihihihihi.@k@v13/10400821. ...How many times do I have to tell you?@k@v13/10400822. It''s BEATRICE.@k@v13/10400823. The thousand-year-old Golden Witch."'
6749: 'Maria@r@v13/10400824."............If you want to know what she looks like, just turn around.@k@v13/10400825. ...See, she''s right there.@k@v13/10400826. BEATRICE is.@k@v13/10400827. ......Kihhihihihihihihihihihihihihihihihihihihihihihihihihihihi!"'
6750: 'Jessica@r@v04/10200747."You, you think this is a game, you little bitch?!?!!!!!!!!!!!!"'
6751: 'Battler@r@v10/10101347."Stop it, Jessica!@k @v10/10101348.Maria, too.@k@v10/10101349. Don''t you understand the situation?!@k @v10/10101350.What are you hoping to gain by saying stuff like that?!@k @v10/10101351.Stop stirring each other up pointlessly!"'
6752: 'Maria@r@v13/10400828."......I don''t understand.@k@v13/10400829. ...Who do you people want to be the culprit?"'
6753: 'Maria@r@v13/10400830."You only believe in BEATRICE when you don''t want to doubt one of your own,@k@v13/10400831. ......and when you''re trying to settle a grudge because someone who''s close to you has been killed, only then do you want to believe in a Human culprit who you can attack with violence, and deny BEATRICE."'
6754: 'Maria@r@v13/10400832."............That''s why you can''t ''see'' her.@k@v13/10400833. ......BEATRICE "exists".@k@v13/10400834. You all can''t ''see'' her!"'
6755: 'Natsuhi@r@v03/10900562."Silence!!!@k @v03/10900563.I don''t want to label you as the culprit, but there is no longer any doubt that you enjoy making this situation unpleasant, serving the interests of the enemy!!"'
6756: 'Maria@r@v13/10400835."......Kihihihihihihihi.@k@v13/10400836. ...Then what will you do?@k @v13/10400837.Shoot me?@k @v13/10400838.I don''t mind.@k@v13/10400839. Very soon, the door to the Golden Land will be opened.@k@v13/10400840. Then all the dead will be resurrected.@k@v13/10400841. ......Right now, death is nothing to be afraid of.@k@v13/10400842. ......Kihihihihihihihihihihihihihihihihihihihihihi!"'
6757: 'Jessica@r@v04/10200748."M-Mom, she really is suspicious!!@k @v04/10200749.We can''t stay with her!!"'
6758: 'George@r@v07/10300729."But Aunt Natsuhi, please, calm down...!@k @v07/10300730.There''s no reason to shoot Maria-chan!@k @v07/10300731.Please remain composed...!"'
6759: 'George@r@v07/10300732."The letter was meant to provoke us, but it''s nothing to be afraid of!@k @v07/10300733.Even the culprit is scared - scared of tomorrow.@k@v07/10300734. Scared of the police!@k @v07/10300735.Right now, this island is free from the reach of the law, but that''s only because it''s isolated by this typhoon!@k @v07/10300736.Once the typhoon passes, the law will return!@k @v07/10300737.So you mustn''t shoot...!!"'
6760: 'Jessica@r@v04/10200750."...How can you stay so calm, George nii-san?!!@k @v04/10200751.One of these four is the culprit!@k @v04/10200752.No, maybe all four of them are working together!@k @v04/10200753.How can you stay so calm when one of these four might be the culprit who killed your parents?!!"'
6761: 'George@r@v07/10300738."Even I have the desire to find the culprit and kill them...!@k @v07/10300739.But that would be simple barbarism.@k@v07/10300740. I will leave the judgment of crimes to the law!@k @v07/10300741.So no matter how suspicious they are, you mustn''t pull that trigger!!"'
6762: 'Battler@r@v10/10101352."I, I feel the same as George-aniki...@k@v10/10101353. Aunt Natsuhi.@k@v10/10101354. Get ahold of yourself for a second...@k@v10/10101355. Anyway, it''d be bad to shoot, ihihi...!@k @v10/10101356.In times like this, I hear you should tilt your head back and say "Stay cool" three times..."'
6763: 'Natsuhi@r@v03/10900564."...............Let me make this clear.@k@v03/10900565. Witches don''t exist!@k @v03/10900566.Not on Rokkenjima, not in the Ushiromiya mansion!"'
6764: 'Natsuhi@r@v03/10900567."I declare it as Ushiromiya Natsuhi, representative of the Ushiromiya family!!@k @v03/10900568.There''s no witch here!@k @v03/10900569.I won''t accept BEATRICE!!@k @v03/10900570.No matter what you''re planning, I won''t let you lay one finger on my daughter or the rest of them!!!@k @v03/10900571.That''s my duty as a mother and as representative to the family!!"'
6765: '@rThose words, ......were the final words of farewell that settled everything.'
6766: '@r...To protect her daughter, Aunt Natsuhi would regard any suspicious person as an enemy.'
6767: '@r......The only reason George-aniki and I were standing on this side was because, by coincidence, we had a clear alibi regarding the letter.'
6768: '@rIf I hadn''t approached the portrait,@k ......I too may have been at the other end of that gun barrel, treated like a criminal...'
6769: '@r......But even though part of me thought that,@k ...part of me was thinking that chasing all of the suspicious people from this room would finally guarantee our safety...'
6770: '@rGenji-san, Kumasawa-san, and Doctor Nanjo - all of them were on Grandfather''s side.@k@rYou could even say that Maria was on Grandfather''s side, since she had a blind belief in BEATRICE.@k ......That''s right, they''re all suspicious.'
6771: '@rBut is this really alright...?!@k@rIs it really alright for us to fight back against the lawlessness of the witch by throwing out all the suspicious ones without due process...?!'
6772: '@rAunt Natsuhi didn''t tell them to leave with her own words.'
6773: '@r......But with wordless pressure, she was inducing them to say that themselves.'
6774: '@r......So, if Doctor Nanjo hadn''t said those words, this cold silence would surely have continued forever.'
6775: 'Nanjo@r@v19/11900222."............Calm yourself, Natsuhi-san.@k@v19/11900223. .........But I understand your feelings well.@k@v19/11900224. I myself feel like there''s something wrong with my head after all of these strange, repeated incidents...@k@v19/11900225. So I understand well why you want to suspect us..."'
6776: 'Natsuhi@r@v03/10900572."..................If you really have nothing to do with this, ...I would think that what I am doing is beyond rude.@k@v03/10900573. .........However, ...please understand, just this once."'
6777: 'Nanjo@r@v19/11900226.".........I understand.@k@v19/11900227. ...Let''s leave the room.@k@v19/11900228. .........What do you say, Genji-san?@k@v19/11900229. ...Shall we return to the parlor and continue our chess game?"'
6778: 'Genji@r@v14/11600287."........................If that is what you wish, ......by all means."'
6779: 'Kumasawa@r@v18/11800167."......I, ......I don''t want to...!@k @v18/11800168.I mean, that means we''ll have to leave this room knowing that the wolf is among us...!@k @v18/11800169.I don''t want to, Madam, please forgive me, hiiiiiiiiiiiiiiii......!"'
6780: '@rWhat Kumasawa-san was trying to say made total sense.@k@rIf she was innocent, then she was being ejected into dangerous territory along with the culprit.'
6781: '@r......In the current situation, pressing her to leave this room along with the suspects was almost exactly the same as letting her get killed...'
6782: '@rHowever, Kumasawa-san really was suspicious just for being the first one to discover that Kanon-kun had been murdered.'
6783: '@r...At that time, everyone except Kumasawa-san had an alibi.'
6784: '@r......As long as the use of some trick or the existence of some 19th person could not be established, Kumasawa-san was one of the most likely suspects by far.'
6785: '@rI didn''t want to believe it.@k However, Aunt Natsuhi and the rest of us were in such a difficult situation that we couldn''t help doubting any of them, Kumasawa-san included...'
6786: '@rSo we didn''t say anything to stop Aunt Natsuhi from trying to oppressively chase them from the room.@k ......We had stopped her from shooting, but when it came to exiling them from the room, we were passively agreeing...!'
6787: '@rMaria spoke to the still-fretful Kumasawa-san.'
6788: 'Maria@r@v13/10400843."............You''ll be alright.@k@v13/10400844. ......BEATRICE is kind to those who respect her.@k@v13/10400845. ...You believe that BEATRICE "exists"."'
6789: 'Maria@r@v13/10400846."...So I''m sure you''ll be fine.@k@v13/10400847. ......I''m going to watch TV in the parlor.@k@v13/10400848. Let''s watch it together.@k@v13/10400849. ...This place has no TV and it''s boring.@k@v13/10400850. ............Kihihihihihihihihihihihihihihihihihihi."'
6790: '@rIt looked like Kumasawa found Maria''s roguish laugh very frightening...'
6791: '@rHowever, the three other people had agreed to leave the room.@k@rKumasawa couldn''t fight the flow, and had to agree, crying as she left the room...'
6792: 'Nanjo@r@v19/11900230."...Well then, Natsuhi-san.@k@v19/11900231. I shall leave you for tonight.@k@v19/11900232. ......Let us meet again tomorrow."'
6793: 'Natsuhi@r@v03/10900574."......Yes.@k@v03/10900575. Please understand, at least for tonight.@k@v03/10900576. When the police come, I promise to apologize to you all for my rudeness."'
6794: 'Natsuhi@r@v03/10900577."...You may play chess, but do it in a safe place if you can.@k@v03/10900578. ...Genji, I leave it to you."'
6795: 'Genji@r@v14/11600288.".........Certainly."'
6796: 'Kumasawa@r@v18/11800170."...Ho......hohoho...@k@v18/11800171. It can''t be helped, can it...@k@v18/11800172. They always say that the most frightening bears are those with their cubs."'
6797: 'Natsuhi@r@v03/10900579."......Genji, Kumasawa, my sincere apologies.@k@v03/10900580. ......Let us meet again tomorrow.@k@v03/10900581. ............Maria-chan too.@k@v03/10900582. ...Please forgive your cold aunt."'
6798: 'Maria@r@v13/10400851."Uu.@k@v13/10400852. I forgive.@k@v13/10400853. Uu!"'
6799: 'Genji@r@v14/11600289."Madam, the keys to this room.@k@v14/11600290. ......I will hand both over to you."'
6800: '@rGenji-san pulled the two golden keys from his pocket and handed them to Aunt Natsuhi...'
6801: 'Genji@r@v14/11600291."...And I will also hand over my bundle of keys to the inside of the mansion."'
6802: '@rHe took out a bundle of about ten keys of various shapes, and handed it over.'
6803: '@r.........To the servants, those keys were probably the proof of their position.@k@rBeing placed in charge of those keys meant that they were trusted, relied upon.'
6804: '@r......Being forced to return them...meant that they had lost that trust.'
6805: '@r...Thinking about it this way, ......there could have been no greater humiliation for Genji-san, who had served here for all these years.'
6806: '@r......However, his usual indifferent expression remained on his face.'
6807: 'Natsuhi@r@v03/10900583."......Genji.@k@v03/10900584. ......I had planned that, after Father passed away, I would reward you for your many years of hard work and allow you to retire.@k@|@y@v03/10900585. .........And yet, I am treating you like this...@k@v03/10900586. ...It makes me feel ashamed from the bottom of my heart............"'
6808: 'Genji@r@v14/11600292."I have already received the Master''s favor.@k@v14/11600293. ......Everything I have done until today has been in repayment for that.@k@v14/11600294. .........Please, do not worry over it."'
6809: 'Nanjo@r@v19/11900233."......Well, then, ...shall we, everyone?@k@v19/11900234. ...Good night to you all."'
6810: 'Maria@r@v13/10400854."Uu.@k@v13/10400855. Night-night.@k@v13/10400856. Battler too, night-night, uu!"'
6811: 'Battler@r@v10/10101357."......Ah, ......Maria.@k@v10/10101358. Wait a sec."'
6812: '@rGuilt made me call Maria back.'
6813: '@r...I groped around in my pocket, ......and took out that scorpion keyholder.'
6814: 'Battler@r@v10/10101359."............This repels magic, right?@k@v10/10101360. ...Keep it on you."'
6815: 'Maria@r@v13/10400857."Uu...?@k @v13/10400858.Didn''t you say you dropped it......"'
6816: 'Battler@r@v10/10101361."...Back then, I was kinda pissed off, and I was just bluffing that I''d lost it.@k@v10/10101362. ......There''s no way I''d lose your precious charm."'
6817: 'Maria@r@v13/10400859."........................"'
6818: '@rMaria silently took the charm.@k@r......I was unable to say anything after that...'
6819: 'Genji@r@v14/11600295."............Well then, everyone, good night to you......"'
6820: '@rUnable to respond, ......we watched them leave, our expressions completely tired out.'
6821: '@r......And until the door closed and we heard the auto-lock, we were unable to even draw our next breath...'
6822: '@rThen, when I was finally allowed to take a breath.@k@r...I noticed that BEATRICE''s letter, which I had been gripping the whole time and which was soaked with my sweat, actually had two sheets.'
6823: '@r...The paper had been tightly stuck together, so I had mistakenly thought that there was only one.'
6824: '@rThere was nothing written on the second sheet.@k@r......The thing drawn there was a magic circle, written with a red ink like blood.'
6825: '@r.........Just like how every magic circle up until then had been different, this magic circle was one that I had never laid eyes on.'
6826: '@rInside the circle, a large triangle and a small triangle were fit together in a simple design.'
6827: '@rBut just as before, there was writing in Hebrew, and it seemed clear that it held some kind of meaning.'
6828: '@rI wanted to know what that could be, ...but we had just chased Maria, the only person who could understand the meaning of magic circles, out of the room...'
6829: '@r............I thought of the magic circles as a second set of messages from BEATRICE.'
6830: '@r...What does this one mean?@k ..................Damn it...!'
6831: '@rWe''ve chased out all the suspicious people; now all we have to do is stay barricaded here until morning, and...then will everything be over?'
6832: '@r......Once the typhoon has passed, when the seagulls cry, will everything be resolved?'
6833: '@rBut the letter that had unexpectedly appeared in the study had rejected that naivety.@k@r......It had made it very clear that, if time ran out, it would mean victory for the witch.'
6834: '@rWhen time runs out, is the witch planning to take on the offensive?@k@r......Is she, finally, planning to display some fearful magical power, maybe something that could have been used to kill six adults at once?'
6835: '@r...Wait, when is time supposed to run out?@k ......I don''t know...anything...'
6836: 'Natsuhi@r@v03/10900587."............Now......we should finally be safe.@k@v03/10900588. ......Finally.@k@v03/10900589. .........Definitely..."'
6837: '@rEven as she said that, Aunt Natsuhi couldn''t stop gripping that rifle.@k ...There was no release in the tension of her expression.'
6838: '@rOf course, none of us felt like breathing a sigh of relief yet.'
6839: '@r.........At least, not until we could hear the cries of the seagulls once more......'