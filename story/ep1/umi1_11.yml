4490: '@rAll that could be heard was the sound of the rain, the voices from the kids'' television program that Maria was watching,@k and the engrossed Maria''s cackling voice.'
4491: '@rIn other words,@k ......what greeted them as they returned dumbfounded from that horrible, bizarre scene,@k was the voice of Maria as she rolled around laughing at the television...'
4492: '@rNot knowing how to explain to Maria that her mother, Rosa, was dead, those who returned to the room couldn''t manage any more than a suffocating silence.'
4493: '@rAt first, Maria returned their stares with a dubious look,@k but when she realized that they weren''t trying to blame her for anything, she ignored them and again immersed herself in the television program...'
4494: '@rThe children wordlessly sat down on the sofa...@k@rTheir minds were probably blank from their state of shock.'
4495: '@rThough they had all cried and mourned so much...now they just vaguely sat there, their faces expressionless...'
4496: '@rOnly Kanon had returned to his usual calm expression.@k@r...However, that probably didn''t mean he had been able to wipe out the shock.'
4497: '@r...Nothing was reflected in his eyes as he stared into the emptiness...'
4498: '@rHideyoshi, fidgeting as he remembered that horrible scene, kept muttering.@k Unbelievable—That can''t be somethin'' of this world—It''s the work of the devil.'
4499: '@rEvery once in a while, he turned these into questions and bounced them off Nanjo,@k@|@y but Nanjo, in a calm doctorly manner, kept repeating that nothing could be understood by only glancing at the scene,@k and that until the police arrived, he wouldn''t know anything.'
4500: '@rHowever, Nanjo only appeared calm by comparison to Hideyoshi, who could not contain his agitation and fear.'
4501: '@rIn fact, Nanjo had also received a huge shock, and his face was deathly pale.'
4502: '@rMaybe it was because of their attitudes that Natsuhi tried to rise to the challenge and take control.'
4503: '@rNatsuhi was apparently unchanged from her normal attitude.@k@rAnd she briskly gave directions.'
4504: 'Natsuhi@r@v03/10900292."......I will head to where Father is.@k@v03/10900293. ...Genji, quickly contact the police."'
4505: 'Genji@r@v14/11600141."Certainly..."'
4506: 'Eva@r@v05/11000373."I wonder if you would allow me to tag along, Natsuhi nee-san?@k @v05/11000374.......Since Krauss nii-san is now gone, the task of aiding Father has been left to me.@k@v05/11000375. It would be improper of me to relax here while relying entirely on you."'
4507: '@rNatsuhi was struck speechless by Eva''s aggressive actions in a situation like this.'
4508: '@rIt seemed that she was claiming that, with Krauss dead, the one to take responsibility should not be his wife,@k but herself, the next highly ranked in the family.'
4509: '@r...Possibly, she was not happy that Natsuhi was ignoring her and handling matters herself in this extreme situation.'
4510: '@rOf course, even Eva''s mind had been blank from the shock until just now.'
4511: '@r...She only returned to herself after Natsuhi started giving orders.'
4512: 'Natsuhi@r@v03/10900294."........................@k@v03/10900295. ......You may do as you please."'
4513: '@rNatsuhi walked out without saying anything more.@k@rEva followed behind her.'
4514: '@r...Mere moments after they left, Kumasawa ran into the parlor.'
4515: '@rSince she wasn''t the kind of person to run around, it would be normal to sense that something had happened,@k ...but since everyone had been stricken by that earlier shock, none of them took any notice of this trivial difference.'
4516: 'Kumasawa@r@v18/11800078."......U-umm,@v18/11800079. ...Madam,@v18/11800080. ...Madam.........!"'
4517: 'Hideyoshi@r@v06/11100286."If you''re lookin'' for Natsuhi nee-san, she went to see Father.@k@v06/11100287. She''ll probably be back soon.@k@v06/11100288. ...What happened, Kumasawa-san?"'
4518: 'Kumasawa@r@v18/11800081."Th-that is, .........in the dining hall, ......blood, .........blood...!"'
4519: '@rEveryone in the parlor turned to listen.'
4520: '@rEveryone thought the same thing.@k ..."I hope I misheard that."'
4521: '@r......Just like how any container has a limit to how much you can put in it,@k ...no one felt like they could accept any more tragedies beyond what had already happened.'
4522: '@rSo they all thought it.@k I hope I misheard that......'
4523: 'Hideyoshi@r@v06/11100289."Wh-......what?@v06/11100290. ......In the dining hall...?"'
4524: 'Kumasawa@r@v18/11800082."When I went to the dining hall...@v18/11800083.to set up for breakfast...@v18/11800084.@|@y ......Awawawawawa...wawa..."'
4525: '@rThe first to start running was George.@k@rHis harsh footsteps jogged Hideyoshi and Nanjo to their senses, and they chased after him.@k Battler and the others followed.'
4526: '@rThey flew into the dining hall one after another, but they didn''t find any change that would have caused Kumasawa to go pale.'
4527: '@r...To those who had viewed that gruesome scene in the storehouse, it was a bit of an anticlimax.'
4528: '@rHowever, Kumasawa, who had followed them, pointed it out.@k@r......There really were some traces of blood on the floor.'
4529: '@r...Compared to that terrible scene, it was not very dramatic.@k@r...However, if you calmly thought about it, this definitely indicated the loss of a lot of blood.'
4530: 'George@r@v07/10300512."......There''s a puddle of blood here as well.@k@v07/10300513. ......What in the world..."'
4531: 'Nanjo@r@v19/11900126."......It appears that a great deal of time has passed...@k@v19/11900127. ......It''s probably safe to say that they were killed here last night..."'
4532: 'Hideyoshi@r@v06/11100291."I-it would seem to mean that...@k@v06/11100292. ...We''d been talkin'' together in the dinin'' hall until late into the night...@k@v06/11100293. After that, someone must''ve broken in..."'
4533: 'George@r@v07/10300514."Father, when did you two let yourselves out of the meeting and go to sleep......?"'
4534: 'Hideyoshi@r@v06/11100294."...Hmm...@k@v06/11100295. It was a little past midnight...@k@|@y@v06/11100296. ......So,@v06/11100297. ...sometime after that...@v06/11100298.is probably when it happened..."'
4535: 'Jessica@r@v04/10200451.".........Christ...@k@v04/10200452. .........I can''t take this........."'
4536: 'Kanon@r@v16/10600149."Milady, ......stay strong......"'
4537: 'Battler@r@v10/10100764."...Heheheheh...@k@v10/10100765. ...After seeing that hell on earth in the storehouse, I think I can handle this much..."'
4538: 'Jessica@r@v04/10200453."......Really? Great for you...@k@v04/10200454. I feel like my head''s gonna friggin'' explode...@k@v04/10200455. ......This is the dining hall, you know?@k @v04/10200456.This is where every day I would eat, complain about school, complain about homework,@k@v04/10200457. ......talk to Dad about my grades,@v04/10200458. ......that''s what this place is to me......"'
4539: 'Kanon@r@v16/10600150."............Milady.@k@v16/10600151. It wouldn''t be good to remain here any longer.@k@v16/10600152. ...Let''s return to the parlor."'
4540: 'Battler@r@v10/10100766."I agree...@k@v10/10100767. .........Uncle Hideyoshi!@k @v10/10100768.I think this room will be really important to the police.@k@v10/10100769. Don''t you think it would be bad if we trampled all over it?"'
4541: '@rBattler proposed this in a slightly powerful voice as, together with Kanon, he grabbed the pale and shaking Jessica''s shoulders.'
4542: 'Nanjo@r@v19/11900128.".........Everything is just as Battler-san has said.@k@v19/11900129. There is nothing more to be gained from remaining in this room."'
4543: '@rNanjo spoke while looking at the pale faces all around.'
4544: '@r......Even though that horrible scene in the storehouse had felt like something not of this world,@k at least it was in a place far from here, a place we had been able to cut ourselves off and run away from, which had helped everyone to keep on going.'
4545: '@r......However, this dining hall was different.'
4546: '@rIt was in the mansion''s main wing,@k ...and as Jessica had said, it was supposed to be one of the more relaxing places within the mansion.@k It was the same place where all of the relatives had enjoyed lunch and dinner yesterday.'
4547: '@r......The shock of seeing this place smeared with blood reminded us of that horrible spectacle in the storehouse,@k and forced us to accept that we really hadn''t been able to run away from the scene of that tragedy......'
4548: 'Hideyoshi@r@v06/11100299."...Yeah.@k@v06/11100300. I agree too...@k@v06/11100301. The killer might have left traces in this room!"'
4549: 'Hideyoshi@r@v06/11100302."Amateurs like us shouldn''t stir the place up.@k@v06/11100303. ...Let''s leave quick.@k@v06/11100304. Come on, come on!"'
4550: '@rHideyoshi also understood the meaning of what Battler had said, and pushed everyone to hurry out of the dining hall.'
4551: '@r...The way we were then, looking at that blood any longer would have been too harsh.'
4552: '@rNobody went against his words.@k Everyone raced each other out of the dining hall.@k ............Almost as though the last person in the room would be trapped in there, all alone...'
4553: '@rOnce in the hallway, we lent a shoulder to Kumasawa, who was leaning against the wall still trembling, and we all headed back to the parlor together.'
4554: '@r...Then, Genji returned.'
4555: 'Nanjo@r@v19/11900130."......Oh, Genji-san.@k@v19/11900131. Were you able to contact the police?"'
4556: 'Genji@r@v14/11600142."..................I can only offer my sincerest apologies.@k@|@y@v14/11600143. ...Whether it was a failure of the radio or something else that caused it, I cannot tell, but—"'
4557: 'Hideyoshi@r@v06/11100305."What... You can''t reach the police...?!!@k @v06/11100306.You tried the phone and the radio and both failed?!"'
4558: 'Genji@r@v14/11600144."...My apologies.@k@v14/11600145. A boat will be arriving on Monday morning, and I believe we will be able to borrow their communications equipment."'
4559: 'Hideyoshi@r@v06/11100307."Isn''t there a boat on this island?!@k @v06/11100308.Can''t we just take a little trip out to the Niijima Police Department?!"'
4560: 'Nanjo@r@v19/11900132."...Hideyoshi-san, that would be impossible with this weather...@k@v19/11900133. At the very least, we can''t do anything until the typhoon passes by us."'
4561: 'Genji@r@v14/11600146."Krauss-sama''s boat is being repaired and is not on the island...@k@v14/11600147. Therefore, I am afraid we have no option but to wait for Monday''s boat......"'
4562: 'Hideyoshi@r@v06/11100309."H-how could this happen...?!@k @v06/11100310.Six people are dead!!@k @v06/11100311.The phones and radio aren''t working, and there''s no boat!@k @v06/11100312.So until the typhoon passes and the boat comes—until tomorrow morning—we just have to stay here on this island, unable to even contact the police?!"'
4563: 'Battler@r@v10/10100770.".........Which means that...@k@v10/10100771....not just us,@v10/10100772. ...but the criminal who killed everyone is also confined to this island..."'
4564: 'George@r@v07/10300515."......That certainly follows.@k@v07/10300516. ......The culprit who killed everyone is still here on the island."'
4565: 'Jessica@r@v04/10200459."S-......so the bastard who killed Dad and the others can''t get off the island, and he''s still hiding somewhere...@k@|@y@v04/10200460. ......Damn it, dammitdammitdammit!!!@k @v04/10200461.I''ll find you, you bastard, you think I''ll hand you over to the police?!!"'
4566: 'Jessica@r@v04/10200462."I''ll tear you to shreds myself...!!!@k @v04/10200463.Uuuughh!!!"'
4567: 'Maria@r@v13/10400536."...................................."'
4568: '@rMaria had finally realized that something was odd in the parlor.'
4569: '@r...Or, rather than noticing something odd,@k it was probably better to say that she felt unhappy and neglected since everyone was getting so excited about something only she didn''t know about.'
4570: 'Maria@r@v13/10400537.".........Uu.@k@v13/10400538. ...Jessica onee-chan.@k@v13/10400539. Did someone die?"'
4571: '@rThe way she spoke was completely calm.@k ...Just as though she was talking about characters in a TV drama—as though it didn''t affect her at all.'
4572: '@r...Jessica probably didn''t like that.'
4573: '@r......As though trying to say "can''t you tell just by looking at me, overwhelmed with grief!", she flared up against Maria.'
4574: 'Jessica@r@v04/10200464."They all died, everyone, everyone!!@k @v04/10200465.My dad, Battler''s mother and father!!@k @v04/10200466.Gohda-san and Shannon!!@k @v04/10200467.And even your mother, too!!"'
4575: 'George@r@v07/10300517."Stop it, Jessica-chan...!!@k @v07/10300518.You aren''t the only one who''s sad...!"'
4576: 'Nanjo@r@v19/11900134."...Maria-san...@k@v19/11900135. I know this will come as a shock, but please listen.@k@v19/11900136. ......Your mother...@k@v19/11900137.......has died."'
4577: 'Maria@r@v13/10400540."............Mama is dead?@k @v13/10400541.......Uu...?"'
4578: 'Battler@r@v10/10100773."......Yes, someone killed her.@k@v10/10100774. ...I know it''s sad, but stay strong—"'
4579: 'Maria@r@v13/10400542."........................How many people...@v13/10400543.died?"'
4580: 'Jessica@r@v04/10200468."Six people!!@k @v04/10200469.Six!@k @v04/10200470.......Shit, shit, shit!@k @v04/10200471.How could you do something so cruel!!@k @v04/10200472.There''s a limit to how cruel you can be, if you''re a human...!@k @v04/10200473.I don''t know who it is, but the killer''s not human!!@k @v04/10200474.There''s no way their blood is red!!"'
4581: 'Maria@r@v13/10400544."............Uu.@k@v13/10400545. Killer''s not human.@k@v13/10400546. Just the ——— chosen by the ———."'
4582: 'Battler@r@v10/10100775."Huh?@k @v10/10100776................Hey, Maria,@v10/10100777. did you say something just now?"'
4583: '@rMaria had just said something,@k but since the words were so remotely separated from the flow and context of the conversation, for a second, I couldn''t understand them.'
4584: '@rAs I was about to ask her to repeat it,@k I was shocked by the sudden sound of Aunt Natsuhi''s loud voice coming from the entrance to the parlor.'
4585: '@rIt looked like Aunt Natsuhi and Auntie Eva had returned from their trip to see Grandfather.'
4586: 'Natsuhi@r@v03/10900296."You can''t contact them with the radio?!@k @v03/10900297..........If we can''t use it at a time like this, why do we even have an emergency radio!"'
4587: 'Genji@r@v14/11600148."...............My apologies.@k@v14/11600149. I believe it was having annual maintenance inspections, but..."'
4588: 'Eva@r@v05/11000376."Wait, what about one of those boat signaling devices where you can flicker the light on and off?@k @v05/11000377.Couldn''t you use something like that to contact the next island?"'
4589: 'Genji@r@v14/11600150."......We do not have such equipment...@k@v14/11600151. ...My apologies..."'
4590: '@rJust then, Kumasawa came pushing a serving cart loaded with breakfast.@k@r......Since there was no way we would be able to eat in the dining hall, Hideyoshi had ordered her to bring it to the parlor.'
4591: 'Natsuhi@r@v03/10900298."Why are we eating breakfast here?"'
4592: 'Hideyoshi@r@v06/11100313."......Aaaahhh, Natsuhi-san... I''ll tell you later.@k@v06/11100314. More importantly, Eva, how was Father?"'
4593: 'Nanjo@r@v19/11900138."Judging by the fact that he is not with you,@v19/11900139. .........he won''t even leave his room for a situation like this..."'
4594: 'Eva@r@v05/11000378."He isn''t there.@k@v05/11000379. ......The room was empty."@|@y'
4595: 'Hideyoshi@r@v06/11100315."What the...@k@v06/11100316. Where could he have gone at a time like this...?!"'
4596: 'Kanon@r@v16/10600153."............Did you say that the Master has left his study...?"'
4597: 'Natsuhi@r@v03/10900299."...That''s right. I am as surprised as you...@k@v03/10900300. I wonder when he left his room......@k@v03/10900301. Do either of you have an idea?"'
4598: '@rNatsuhi looked at Genji and Kanon as she said this.'
4599: '@r...She probably thought that the servants permitted the One-winged Eagle, who served directly under him, would know of a place he might go.'
4600: '@r.........However, it seemed to be the other way around.@k@r...Their faces made it clear that those who knew Kinzo best realized even more than everyone else how impossible it was for him to leave his room.'
4601: 'Kanon@r@v16/10600154.".........Even we have no idea."'
4602: 'Genji@r@v14/11600152."...As you all know, the Master had everything set up within that study, from a place to sleep to a bathroom.@k@v14/11600153. I cannot imagine him leaving that room except under very exceptional circumstances."'
4603: 'Hideyoshi@r@v06/11100317."............In that case, ...what?@k@v06/11100318. Isn''t it natural to think that one of those "very exceptional circumstances" came up...?!"'
4604: 'Natsuhi@r@v03/10900302."We still don''t know whether that is the case!"'
4605: 'Natsuhi@r@v03/10900303."Anyway, he is a fickle person, so it''s possible that he went for a walk by himself without knowing the current situation.@k@v03/10900304. ......If that is the case, we have to tell him what has happened and ask for instructions as fast as we can."'
4606: 'Eva@r@v05/11000380."......That''s right.@k@v05/11000381. .........Although I don''t want to think about it, ...it''s possible that something has happened to him, isn''t it...?"'
4607: 'Natsuhi@r@v03/10900305."I don''t even want to think about something that ominous...!"'
4608: '@rNo one had seen Kinzo since the six horrible corpses had been found.@k@rOn top of that, the phones were broken, the radio wouldn''t reach anyone, and there was no way to contact the police.'
4609: '@r...It looked like the typhoon would leave tomorrow and a boat would come,@k ......but until then, no one could rely on anyone outside the island, nor could they escape the island.'
4610: '@rEveryone had lost their composure at the extremely sudden tragedy.'
4611: '@r...A heavy silence and a sense of impatience.@k@r...Even though they needed to do something, they couldn''t think of anything;@k some of them became irritated, while others merely held their heads in their hands.'
4612: '@r.........But not one of them...could explain what was occurring on this island of Rokkenjima......'
4613: '@rAfter that, we sat in the parlor and wordlessly chewed through the breakfast that Kumasawa-san had made.'
4614: '@rOf course, this was right after something like that had happened.@k@rNo one had any appetite.'
4615: '@r...However, we realized that not eating would weaken our bodies.@k ...It would also be rude to Kumasawa-san, who had made the breakfast.'
4616: '@rKumasawa-san had taken the tasteful western vegetables, ones that Gohda-san had probably special ordered for the purpose of some extravagantly fancy dish, and cooked them in a Japanese style,@k making them turn an unpleasant color.'
4617: '@rAs to what Gohda-san had been planning to cook with those ingredients...@kright then I couldn''t even imagine it.'
4618: '@rIf I did think about it, I would be reminded of the way Gohda-san had died, and the inside of my mouth would be filled with a sour taste...'
4619: '@rFor the time being, everyone pretended to eat, but there was no hope of anyone making any headway into the meal.'
4620: '@rThen, everyone was brought up to speed on the current situation.'
4621: '@rFirst off, ......that Uncle Krauss,@k my dad,@k Kyrie-san,@k Auntie Rosa,@k Gohda-san and Shannon-chan...@khad been found in the rose garden storehouse as cruelly mutilated corpses.'
4622: '@rAnd that despite that, we were unable to use phones or radio, and still couldn''t contact the police.'
4623: '@r......So until the typhoon passed, there was nothing we could do.'
4624: '@rFurthermore, Grandfather, who we had hoped might be able to show a little leadership in this kind of a situation, had disappeared at some point.'
4625: '@r......Gohda-san hadn''t made breakfast, so Grandfather''s stomach must have been empty,@k and if he had just been taking a casual walk, by now he should have been stomping back to whine about how hungry he was.'
4626: '@rAnd yet,@w583. he hadn''t appeared.'
4627: '@r......There was more than a small chance that he had become caught up in the earlier crime.'
4628: '@rAunt Natsuhi and Auntie Eva had said that, on their return trip from going to see Kinzo, they had called out to him on every floor, looking for him, but were not able to find him.'
4629: '@r...If you think about the timing of it all, it was probably best to think that he had been caught up in the crime.'
4630: '@rIf the culprit had taken the trouble to move the bodies of Dad and the rest, who we figured had been killed in the dining hall, all the way to the storehouse,@k then maybe they had already killed Grandfather,@k moved his body to some strange location, and we had simply not found it yet...@k No one actually said it, but this theory seemed extremely convincing...'
4631: 'Natsuhi@r@v03/10900306."We will go check that all of the windows and doors are closed.@k@v03/10900307. We must also carefully search for Father.@k@v03/10900308. Children, make sure you do not leave this room."'
4632: 'Natsuhi@r@v03/10900309."Eva-san and Hideyoshi-san, I''m sorry, but please stay here with the children.@k@v03/10900310. Doctor Nanjo as well."'
4633: 'Nanjo@r@v19/11900140."...I understand.@k@v19/11900141. I will wait here......"'
4634: '@rAunt Natsuhi led the servants—Genji-san, Kumasawa-san, and Kanon-kun—out of the parlor.'
4635: '@rAll that was left was Auntie Eva, Uncle Hideyoshi,@k@rDoctor Nanjo, and the four of us children for a total of seven people.'
4636: 'Hideyoshi@r@v06/11100319."Let''s all stick together, and maybe watch some TV while we wait.@k@v06/11100320. Geez, Sunday daytime TV sure doesn''t have many good shows on, huh?"'
4637: '@rUncle Hideyoshi tried to stir up this gloomy atmosphere, acting cheerfully.'
4638: 'Maria@r@v13/10400547."Uu.@k@v13/10400548. Good show, watch it, watch it.@k@v13/10400549. Uu-uu!"'
4639: 'Hideyoshi@r@v06/11100321."Oh, really?@k@v06/11100322. You want to watch TV, Maria-chan?@k@v06/11100323. Then come and watch it with your uncle."'
4640: '@rMaria was the only one who played along.'
4641: '@r...Even though Maria had been told of her mother''s death, she didn''t show the slightest flicker in her emotions.'
4642: '@rWas nine really this young an age......?'
4643: '@rNo one else was feeling the slightest bit like joining in, and they each sank into their sofas and let their minds go blank...'
4644: 'Battler@r@v10/10100778."............Aniki.@k@v10/10100779. Can I ask you something?"'
4645: 'George@r@v07/10300519."...What is it?"'
4646: 'Battler@r@v10/10100780."......Just now in the storehouse.@k@v10/10100781. You said something about Shannon-chan and a ring.@k@v10/10100782. ......Did you give that to her?"'
4647: '@rGeorge-aniki didn''t answer, but he hung his head and closed both of his eyes.@k ......There could be no clearer response.'
4648: 'Jessica@r@v04/10200475."Quit it, Battler.@k@v04/10200476. ......Have some tact."'
4649: 'Battler@r@v10/10100783."......You''re right.@k@v10/10100784. I shouldn''t have asked that."'
4650: 'George@r@v07/10300520."...............That''s right.@k@v07/10300521. It was me.@k@v07/10300522. .........Last night,@v07/10300523. I proposed to her.@k@v07/10300524. ...That was when I gave her the ring.@k@v07/10300525. ......I told her that tomorrow,@v07/10300526. she should put it on whatever finger she wanted,@v07/10300527. as her answer.@k@v07/10300528. ......Haha, I must have sounded so full of myself."'
4651: '@r......And that ring had been...@w666....on the ring finger of Shannon-chan''s left hand.'
4652: 'Jessica@r@v04/10200477.".....................Actually,@k@v04/10200478. ...I''ve been having talks with Shannon for several years.@k@v04/10200479. ...About you, George nii-san."'
4653: 'George@r@v07/10300529."......I wonder what she could have said."'
4654: 'Jessica@r@v04/10200480."...............Shannon was always really bad at lying.@k@v04/10200481. It was instantly obvious that it was you she was talking about."'
4655: 'Jessica@r@v04/10200482."...............She...@v04/10200483.asked whether it would be okay if she got close to you, being just a servant.@k@v04/10200484. ......She asked about stuff like what kind of things do boys like,@k@v04/10200485. and what kind of clothes should she wear to make them happy,@k@v04/10200486. lots of stuff like that.@k@v04/10200487. ..................How should I say it... Well, I was jealous of her."'
4656: 'Battler@r@v10/10100785.".........All that...and right after she''s handed the engagement ring...@k@v10/10100786.it''s just...@v10/10100787....all over?"'
4657: 'Jessica@r@v04/10200488."......I know people value things differently.@k@v04/10200489. ......But being proposed to by a man,@k@v04/10200490. .........is, in a way,@v04/10200491. the high point of a girl''s life.@k@v04/10200492. ......So I''m sure.@k@v04/10200493. Last night, I think Shannon was...@v04/10200494.happy from the bottom of her heart...@v04/10200495....no, the happiest she''d ever been since she was born..."'
4658: 'George@r@v07/10300530.".........................................."'
4659: '@r...George-aniki, without raising his head, sighed deeply...@k@r......Or maybe tears had risen to his eyes.'
4660: 'George@r@v07/10300531."............It seems that Shannon was on duty in the guesthouse last night.@k@v07/10300532. ......But, ...because she was too embarrassed to go back to the guesthouse with me,@k@v07/10300533. ......she went over to the mansion."'
4661: 'Jessica@r@v04/10200496."......Think about Shannon''s feelings.@k@v04/10200497. ...When you receive an engagement ring, no matter how much you''ve prepared for it beforehand, it''s normal to feel so elated your mind goes blank.@k@v04/10200498. ......She must have been so embarrassed she didn''t know what to do with herself."'
4662: 'George@r@v07/10300534."......And then, Shannon,@v07/10300535. ............even though she hadn''t been on duty there, she went to the mansion,@k@v07/10300536. to help Gohda-san with his work...@v07/10300537. ...............and got caught up in all this........."'
4663: 'George@r@v07/10300538."If only I hadn''t,@k@v07/10300539. ...on that day,@k@v07/10300540. in that place,@k@v07/10300541. ......given her that ring......@v07/10300542.Shannon wouldn''t have,@v07/10300543. ......Sayo wouldn''t have...@v07/10300544....been caught up in this incident...!@|@y@k @v07/10300545....uuuuughh!!"'
4664: 'Battler@r@v10/10100788."Aniki.@k@v10/10100789. It''s not like that.@k@v10/10100790. It''s definitely not like that.@k@v10/10100791. ......So don''t cry any more."'
4665: 'George@r@v07/10300546."..................uuuuughh..."'
4666: 'Eva@r@v05/11000382."Battler-kun.@k@v05/11000383. Leave him be."'
4667: '@rAfter those words from Auntie Eva, I stopped talking to him.'
4668: '@r...Misplaced words of comfort might actually hurt him.@k@rJessica sat down next to Aniki, and quietly put an arm around him.'
4669: '@r.........Maybe only Jessica, who had known about Aniki and Shannon''s love since the beginning,@k and who had been discussing that relationship with Shannon, ...could comfort Aniki now.'
4670: '@rI went over to Auntie Eva and sat down on the opposite sofa...'
4671: 'Eva@r@v05/11000384."Battler-kun, you really are strong...@k@v05/11000385. It looks like you''ve kept a good hold on yourself."'
4672: 'Battler@r@v10/10100792."...Umm, well, look, the depth of the love becomes the depth of the wound, right?@k@v10/10100793. That old bastard, I couldn''t care less about no matter how he snuffed it.@k@v10/10100794. ...I feel bad about Kyrie-san, but...well, she wasn''t actually my parent."'
4673: 'Eva@r@v05/11000386."My, my.@k@v05/11000387. But on the other hand, you were crying a lot back then, right?"'
4674: 'Battler@r@v10/10100795."Well, I did think that at least that much crying was due as gratitude to the parent who raised me...@k@v10/10100796. Hehehe..."'
4675: 'Eva@r@v05/11000388.".........The way you can switch your mood quickly like that, and your dry tone, must have come from Rudolf.@k@v05/11000389. ...That kid would always get violently happy, sad, and angry,@k@v05/11000390. but he would always regain his cool immediately afterwards."'
4676: 'Battler@r@v10/10100797."......It''s nothing like that.@k@v10/10100798. I haven''t really been able to get over the shock yet either.@k@|@y@v10/10100799. ...I think it''s just that the emotions that rose up in me were...different from everybody else''s."'
4677: 'Eva@r@v05/11000391."What do you mean?"'
4678: '@rI was acting much calmer than George-aniki and Jessica were.'
4679: '@r...That wasn''t because my sadness was less intense and I''d already sprung back to normal.@k@rIt was because my sadness had been gradually replaced, by a different emotion.'
4680: 'Battler@r@v10/10100800."............Rather than sadness,@v10/10100801. .........it''s more like I''m irritated.@k@v10/10100802. What bastard did this and where the hell is he?@k@v10/10100803. ...I feel like I can''t settle down until I''ve smacked him upside the face."'
4681: '@rThat was what I really wanted to do.@k It was like I couldn''t allow myself to just sit here, overwhelmed with sadness and hugging my knees.'
4682: 'Battler@r@v10/10100804."......Since the time Dad and everyone else was killed, this island has remained covered by the typhoon.@k@v10/10100805. ......In short, that means that the asshole who pulled this disgusting, detestable bullshit is still somewhere on this island."'
4683: 'Eva@r@v05/11000392."It certainly does.@k@v05/11000393. .........I wonder if they''re hiding themselves somewhere in that dark forest even now?"'
4684: '@r.........I felt like I''d had...@w333.a very similar conversation with Kyrie-san the night before.'
4685: '@rThat''s right.@k After the letter from the person who claimed to be BEATRICE appeared at the dinner table last night,@k ......we had talked about whether or not a 19th person actually exists.'
4686: 'Battler@r@v10/10100806."Auntie Eva.@k@v10/10100807. .........These murders,@v10/10100808. ...do you think they have anything to do with the letter from BEATRICE last night?"'
4687: 'Eva@r@v05/11000394."...Aah, that thing?@k @v05/11000395.............Well, I wonder.@k@v05/11000396. Although all of us siblings were in agreement that the mysterious letter had been sent to further complicate the problem of Father''s inheritance,@k@v05/11000397. .........as to whether that and the incident this morning are related, it''s impossible to tell at this stage..."'
4688: 'Battler@r@v10/10100809."Was that letter really given to Maria by some witch called BEATRICE?"'
4689: 'Eva@r@v05/11000398."How could it be?@k@v05/11000399. All of it was a farce devised by Father, wasn''t it?@k @v05/11000400.He made someone like Shannon-chan wear the dress from the portrait and deceive Maria-chan, right?@k @v05/11000401.Isn''t that just like the kind of intricate prank Father would pull?"'
4690: 'Battler@r@v10/10100810.".........Last night, I talked with Kyrie-san about whether BEATRICE actually exists,@k@v10/10100811. and she also said that BEATRICE was probably one of the 18 of us."'
4691: 'Eva@r@v05/11000402."Isn''t that obvious?@k@v05/11000403. There''s no one else on this island besides us!@k @v05/11000404.So obviously it must have been someone amongst us pretending to be BEATRICE."'
4692: 'Battler@r@v10/10100812."There''s no one else but us on this island,@v10/10100813. huh..."'
4693: 'Eva@r@v05/11000405."Obviously, right?@k @v05/11000406.Who else could be here?@k @v05/11000407.No one is on this island except us.@k@v05/11000408. There are only 18 people.@k@v05/11000409. ...So the one who pretended to be BEATRICE has to be one of those 18."'
4694: '@rKyrie-san had denied that there was a 19th person by "flipping over the chessboard".'
4695: '@rEven though Auntie Eva hadn''t constructed an argument that complicated, her opinion at least was the same.'
4696: '@r...Except, if that is the case, our situation starts to look very ugly......'
4697: '@rAt the time of BEATRICE''s letter, we were able to dismiss the matter as just someone''s prank.'
4698: '@r...However, if we deny the existence of a 19th person at this point, matters are not so jovial.'
4699: '@r.........In other words,'
4700: 'Battler@r@v10/10100814."...If there is no 19th person,@k@v10/10100815. ......then the culprit who killed Dad and the others is also one of the 18, right?@k@v10/10100816. .........So, in other words, that would mean that someone in this very mansion is the one who killed them...!"'
4701: 'Eva@r@v05/11000410."......................................."'
4702: '@rAuntie Eva smiled meaningfully.'
4703: '@r...It looked like Auntie thought that this conclusion should have been obvious from the very beginning.'
4704: 'Eva@r@v05/11000411."The culprit carried the bodies of those six into the storehouse.@k@v05/11000412. But they sure did a good job getting into that storehouse, didn''t they?@k @v05/11000413.That shutter was always kept closed and locked, I''m told."'
4705: 'Eva@r@v05/11000414."In other words, in order to carry them into the storehouse, the culprit would need to unlock the shutter.@k@v05/11000415. ...Understand?"'
4706: 'Battler@r@v10/10100817."......Is there any possibility that the shutter was left open by mistake that day?"'
4707: 'Eva@r@v05/11000416."The servants said that it''s always shut.@k@v05/11000417. In other words, unless they brought the keys out of the servant room, they definitely couldn''t have opened the storehouse."'
4708: 'Battler@r@v10/10100818."Is the only key the one in the servant room...?"'
4709: 'Eva@r@v05/11000417_1."Genji-san said so, yes.@k@v05/11000417_2. Which means that the culprit knew where that single key was stored and took it out."'
4710: 'Eva@r@v05/11000417_3."Just now, I saw Kanon-kun return the key to the servant room.@k@v05/11000417_4. The wall was packed with keys, and I don''t think that a novice would know where and to what those keys went to.@k@v05/11000417_5. The culprit was magnificently able to select the key to the storehouse from all of those."'
4711: 'Eva@r@v05/11000417_6."Furthermore, even though the key didn''t have a tag or anything sticking to it, they knew it was the key to the storehouse behind the rose garden.@k@v05/11000417_7. ...And while I''m at it, they also knew where the storehouse was.@k@v05/11000417_8. .........I''ll say it even clearer.@k@v05/11000417_9. The culprit knew the inside of the servant room well."'
4712: '@rHer argument was extremely plain and clear.'
4713: '@r......If the bodies had been thrown somewhere in the bushes of the rose garden, no explanation would have been necessary.'
4714: '@rHowever, the one key to the storehouse was in the servant room,@k and stored with a large group of other keys, such that a novice would not be able to tell them apart.'
4715: '@rThis meant that the culprit was someone who was used to going in and out of the servant room, and knew well where the key was.'
4716: '@r...The family didn''t normally go into the servant room.@k@r......Which meant that............'
4717: 'Battler@r@v10/10100828."......Which means that...@v10/10100829....one of the servants...@v10/10100830....is the culprit......"'
4718: 'Eva@r@v05/11000418."I''m sorry, but even your auntie can''t say any more than that.@k@v05/11000419. ......However, I''ll tell you one thing."'
4719: 'Battler@r@v10/10100831."......What''s that?"'
4720: 'Eva@r@v05/11000420."The culprit, ......we should properly say they were culprits in the plural, and what''s more, they were well-armed.@k@v05/11000421. You see it, don''t you?"'
4721: 'Eva@r@v05/11000422."They had to assault the four in the dining hall and kill them all at once, drag a total of six bodies all the way to the storehouse beyond the rose garden, and scribble that disgusting makeup on their faces.@k@v05/11000423. ......There''s no way that a single culprit could carry all of this out on their own, right?"'
4722: '@rIt was impossible.@k It might not have been if a single person spent enough time on it, but that would have taken ages.'
4723: '@rIt was probably best to think that a significant number of people had been part of it.'
4724: 'Battler@r@v10/10100832."...............Whoo.@k@v10/10100833. So what you mean is...@v10/10100834....maybe all of the servants were in cahoots."'
4725: 'Eva@r@v05/11000424."Please keep it quiet, okay?@k @v05/11000425.It''s bad to speak from speculation alone."'
4726: 'Eva@r@v05/11000426."......Besides, what would you do if it really was true?@k @v05/11000427.They might not let us return alive.@k@v05/11000428. This is an opponent who had no trouble killing Nii-san and the three others."'
4727: 'Eva@r@v05/11000429."The only people in this room right now who look like they could put up a decent fight are the three people in my family, and maybe you as well—four at most?@k @v05/11000430.The situation is no different than it was last night.@k@v05/11000431. ......In short, it would be easy for the culprit to massacre the rest of us."'
4728: '@rI had been playing detective with Auntie Eva out of a desire to expose the person who had killed Dad and the rest before the police did.'
4729: '@r...If I could manage to skillfully penetrate the culprit''s identity, I wanted to stick the evidence in their face.'
4730: '@r......I had gotten it into my head that if I did that, the culprit would give up and surrender, just like in one of those detective movies.'
4731: '@rHowever, the culprit only surrenders there because they are in a situation where resisting would be futile.'
4732: '@rThe culprits behind these incidents on the island were far from helpless,@k and might even be able to massacre all of the remaining people on the island.'
4733: '@r...And on top of that, this island was like a giant locked room, cut off from the outside world by the typhoon,@k so they had the full day until tomorrow to kill, scheme, and cover up their handiwork......'
4734: '@rIn short, we weren''t in the kind of safe atmosphere where we could entertain ourselves by playing detective...'
4735: '@rOn the contrary, we were at a stage where we had to be scared stiff,@k since playing detective might displease the culprits, and cause them to repeat another mass murder......'
4736: 'Eva@r@v05/11000432."...Well, it is just a possibility, right?@k @v05/11000433.......But I can''t bring myself to trust the servants yet.@k@v05/11000434. And that doesn''t mean they''re the only ones I suspect.@k@v05/11000435. I also think there might be some mastermind behind all this."'
4737: 'Battler@r@v10/10100835."A mastermind?@k @v10/10100836.Hmm... Why do you say that?"'
4738: 'Eva@r@v05/11000436."It''s just a feeling.@k@v05/11000437. ......Think about what the word servant literally means.@k@v05/11000438. It means they serve someone—they do someone''s bidding, right?"'
4739: 'Eva@r@v05/11000439."Everyone who was killed had some relation to the Ushiromiya family.@k@v05/11000440. So it would be natural for someone with interest in that result to be involved."'
4740: '@rThis was also plain and clear...'
4741: '@rThe Ushiromiya family were currently right in the middle of discussing how to distribute the inheritance if Grandfather died.'
4742: '@rIf this followed the formulaic plot used to death by many classic mystery novels,@k it would definitely be a crime by someone with ties to the Ushiromiya family and who was entangled in the inheritance problem...'
4743: '@rAuntie had probably also read a few books in that genre.'
4744: '@r......Her theory did have a few one-sided conclusions to it, but it was a run-of-the-mill idea that anyone would surely hit upon.'
4745: '@rI think anyone would have suspected the servants, even if their logic was different.'
4746: '@rEspecially the talk revolving around the key to the shutter—that was enough to make it easy to suspect strongly that one of the servants was involved in the case...'
4747: 'Battler@r@v10/10100837."...............Which is whyyy...@v10/10100838.I don''t like it for some reason."'
4748: 'Eva@r@v05/11000441."What do you mean, you don''t like it?"'
4749: 'Battler@r@v10/10100839."Nah, just talking to myself.@k@v10/10100840. Ihihi!"'
4750: '@rI dodged the question by joking, but I couldn''t wipe out the sense of unease I felt inside me.'
4751: '@r......Because the reasoning we had arrived at was altogether too simple.@k@rReasoning that anyone could arrive at.@k ...And I just couldn''t accept that.'
4752: '@r...If I tried "flipping over the chessboard" like I had learned from Kyrie-san,@k ......that was exactly why it was impossible for the servants to be the culprits.'
4753: '@rIf the servants really had been the culprits, they wouldn''t have hidden the bodies in a place that was tied to themselves.'
4754: '@rCertainly not the rose garden storehouse of all places, whose key they themselves controlled.'
4755: '@rThe police would probably immediately pursue whoever had been in control of the key.'
4756: '@rThat would create a danger for exposure.@k@r......If we were to assume that they were the culprits, they had no reason to carry the bodies into the storehouse.'
4757: '@r...Did they expect us to think that, and so put them in the storehouse deliberately?@k@rNo, that definitely didn''t make sense.'
4758: '@rWhen the police come and inspect the site, all kinds of things will probably become clear.'
4759: '@rNo matter how deeply careful the culprits were in carrying out murder, some kind of traces will definitely be found.'
4760: '@rSo, in summary, they have everything to lose and nothing to gain.'
4761: '@rIf you think about it this way, and look at the game from the culprit''s side,@k it feels like there''s no point in advertising the location of the corpses.'
4762: '@rIf the bodies were found, a report would be sent to the police,@k the remaining people would become more cautious,@k they could start looking for who was responsible,@k ...anyway, none of these things would make the culprits feel any more comfortable.'
4763: '@r...Just like the words of the main character''s mother in a novel I read recently called@rHigurashi: When They @c900.C@c.ry.'
4764: '@rA mystery story has four parts—introduction, development, turn, and conclusion—and so, to commit the perfect crime, it is essential to eliminate the "introduction".'
4765: '@r......Right now, no one knew where Grandfather was.'
4766: '@rWe didn''t know whether he had already become a victim, or if he was one of the culprits,@k .........but this state of confusion had to be beneficial to whoever did this.'
4767: '@rBy blatantly advertising the bodies to us,@k and declaring "Hey! There''s a murder case going on!", the culprit had absolutely nothing to gain.'
4768: '@rRight, that was where we could "flip over the chessboard".'
4769: '@rSo this blatant advertisement of the bodies was itself the culprit''s goal.'
4770: '@r......So, it may well be that, to the culprit, having the six corpses be present there meant more than the deaths themselves.'
4771: '@rIn other words, the culprit wanted to display these murders.@k To who?'
4772: '@r......To us.@k It was a message.@k@rThe culprit was trying to shove something in our faces.'
4773: '@r...I didn''t know what that could be.'
4774: '@rAt the current time, none of us could grasp anything from this vulgar mass murder except malice.'
4775: '@r......Malice towards...@w583.everyone...@w666. perhaps.'
4776: '@rEach one of the survivors had some kind of connection to one of the six who had been killed.'
4777: '@rUncle Krauss''s death brought sorrow to Jessica''s family.'
4778: '@rThe deaths of Dad and Kyrie-san brought sorrow to me,@k while Auntie Rosa''s death brought sorrow to Maria.'
4779: '@r......Gohda-san''s death probably dealt a shock to his fellow servants,@k and Shannon-chan''s death brought grief to George-aniki, who had proposed to her, and to Kanon-kun, who had loved her like an older sister.'
4780: '@r......Everyone now on this island had received an equal amount of sadness.'
4781: '@rAuntie Eva had claimed that the servants were definitely in cahoots,@k ......but then how could you explain the deaths of Gohda-san and Shannon-chan?'
4782: '@r......And by this argument,@k the grief caused by the six deaths hit everyone but Auntie Eva and Uncle Hideyoshi.'
4783: '@rIt was very possible to doubt Auntie Eva herself,@k who was acting like she was outside the net of suspicion, and who might have been trying to point that suspicion at the servants.'
4784: '@r......In the first place, she had managed to avoid suspicion and place it on the servants with that argument about the key to the shutter,@k ......but if you looked at it from a perspective of motive, about who would gain something from the murders,@k ............Auntie Eva''s name floated to the top of the list.'
4785: 'Eva@r@v05/11000442."......Battler-kun, Auntie knows what you''re thinking, okay?"'
4786: 'Battler@r@v10/10100841."Huh?@k @v10/10100842.Ihihi, oh no,@v10/10100843. please don''t tell anyone,@v10/10100844. that I had my head all full of y''know, that kind of stuff..."'
4787: 'Eva@r@v05/11000443."I''m the one who would gain the most from these murders.@k@v05/11000444. ......Since I''m going to be suspected anyway, I might as well get it out in the open myself."'
4788: '@rI had tried to dodge this conversation by joking around, but it looked like it hadn''t worked.'
4789: 'Eva@r@v05/11000445."The inheritance is to be divided between the siblings.@k@v05/11000446. But now, the four siblings are just me.@k@v05/11000447. All the assets of the Ushiromiya family will become mine.@k@v05/11000448. ......Heheheheh."'
4790: 'Battler@r@v10/10100845."If Uncle Hideyoshi heard you, he''d say "Give it a rest Eva, it''s not a joke"..."'
4791: 'Eva@r@v05/11000449."I''m sorry, okay?@k @v05/11000450.No matter how I try to smooth it over, I''ll just be suspected anyway, so I was just fooling around."'
4792: 'Eva@r@v05/11000451."......So I''ve been thinking, from my point of view, this murder might have been planned to cast suspicion on me.@k@v05/11000452. ......Unfortunately, my alibi for last night is weak."'
4793: 'Battler@r@v10/10100846."Could you tell me about it?@k@v10/10100847. About last night?"'
4794: 'Eva@r@v05/11000453."As you know, the discussion of how we siblings would gnaw apart the inheritance continued until late in the night.@k@v05/11000454. But I don''t know how late it lasted.@k@v05/11000455. My husband and I had woken up early that morning.@k@v05/11000456. We were so sleepy, and we let ourselves out a little past midnight.@k@v05/11000457. We then returned to the guesthouse and rested there."'
4795: 'Battler@r@v10/10100848."......Can anyone other than Uncle Hideyoshi prove that?@k @v10/10100849.Oh, of course, it''s not like I''m suspecting you or anything, you kno~w?@k @v10/10100850.Hihihi!"'
4796: 'Eva@r@v05/11000458."My, I wonder about that!@k @v05/11000459.*giggle*.@k@v05/11000460. I don''t know if it counts as proof, but when we returned to the guesthouse, we were greeted by Genji-san and asked if we needed a towel."'
4797: 'Eva@r@v05/11000461."I think that should be enough to prove that we returned to the guesthouse a little after midnight.@k@v05/11000462. ......Of course, if my theory was correct and the servants were all in cahoots, that wouldn''t actually make for an alibi, would it?"'
4798: 'Battler@r@v10/10100851."That is a point, isn''t it?@k @v10/10100852.Does that mean that, right now, I''m playing detective with the real culprit?@k @v10/10100853.Ihihi!"'
4799: 'Eva@r@v05/11000463."But let me say this for my honor''s sake: if my goal was the inheritance, I wouldn''t commit this weird kind of murder!"'
4800: 'Eva@r@v05/11000464."After all, if I just wanted to make them forfeit their rights to the inheritance, the method of their deaths wouldn''t have mattered.@k@v05/11000465. On the contrary, I''d try to make their deaths look like an accident, wouldn''t I?@k @v05/11000466.If I''d been roping in the servants, and carefully planning everything out, that''s even more reason I''d do that."'
4801: 'Battler@r@v10/10100854."You''re right about that...@k@v10/10100855. If you were killing someone to make a profit, you definitely shouldn''t make it look like a murder."'
4802: 'Eva@r@v05/11000467."You see?@k @v05/11000468.So from here on, your auntie will be in a very blue mood.@k@v05/11000469. ......I''ll probably be treated as the person behind this by the police, and harshly investigated.@k@v05/11000470. I can''t wait..."'
4803: '@rAuntie Eva shrugged with a bitter smile.'
4804: '@r......Just like it was easy to think of the servants as suspicious, it was also very easy to think of Auntie Eva as suspicious.'
4805: '@rSo if we "flip over the chessboard",@k ......did that mean it was impossible for the culprit to be the easily doubtable Auntie Eva...?'
4806: '@rHowever, if that logic could pass so easily, then motive wouldn''t count for anything.'
4807: '@rNo, that can''t be right...@k@rKnowing the motive should be a big clue towards knowing the culprit.'
4808: '@r...That is why murderers throughout history have tried to ensure their motive will not be found out, by skillfully complicating the incidents......'
4809: '@r.........I don''t know, ...I don''t know...@k@rEvery time I flip over the chessboard, it keeps flipping from front to back and back to front...'
4810: '@r...Were my thoughts closing in on the truth?@k@r......Or.........'
4811: '@rAuntie Eva didn''t want to talk any more than that, so I headed to the window, folding my arms, so that I could cool my head a little.'
4812: '@rAs I looked over the parlor, I saw George-aniki and the others gathered, talking.'
4813: '@r...It looked like they were talking about the magic circle that had been painted onto the shutter.'
4814: '@rAs Uncle Hideyoshi thought back to that time, he started drawing the shape in the margins of Maria''s notebook.'
4815: '@r......Yes, Maria is second only to Grandfather in knowledge of the occult, so she might understand what it meant.'
4816: 'Hideyoshi@r@v06/11100324."Hmmm, I think it was probably somethin'' like that!@k @v06/11100325.There was a mark like a cross, but tweaked a bit."'
4817: 'Hideyoshi@r@v06/11100326."And then, there were these closely packed strange letters all inside the outer circle like this, and there was somethin'' written on all four sides of the cross, and in the empty spaces in the corners as well.@k@v06/11100327. It didn''t look like the alphabet or somethin'' like that.@k@v06/11100328. It was what they call ancient characters."'
4818: 'Nanjo@r@v19/11900142."......Also, around the top of the circumference, there was a small mark.@k@v19/11900143. ...Five small circles arranged in a plus sign, and straight lines connecting them..."'
4819: 'Hideyoshi@r@v06/11100329."Ah, yes, there definitely was somethin'' like that drawn there...!@k @v06/11100330.Yep, this was it, there''s no mistakin'' the shape.@k@v06/11100331. I don''t know the exact characters, but the arrangement was nearly the same."'
4820: '@rEveryone was staring down at the shape, so I stared down at it too.'
4821: '@r...From what I had heard, this had been painted on the shutter to the storehouse with some material that looked like blood.'
4822: '@r......I see, this sure is unsettling.'
4823: 'Jessica@r@v04/10200499."...Grandfather''s about the only one who''d get it into his head to draw this nonsense.@k@v04/10200500. ......Seriously, where did he go?!@k @v04/10200501.I wanna grab him and ask what the hell this is supposed to mean!!"'
4824: '@rJessica''s voice contained impatience and anger.'
4825: '@rShe hadn''t gone so far as to say that Grandfather was the culprit,@k but it looked as though she thought that Grandfather definitely knew the culprit''s identity.'
4826: '@r......Certainly, if you asked around for the link that bound the Ushiromiya family and the occult together, ten out of ten people would name Grandfather.'
4827: '@r......And, to a person who knew nothing of the occult, this strange mark would have no meaning.'
4828: '@rWhich meant that......@k...this might have been...something addressed to Grandfather......'
4829: '@rThat''s right, the reason to advertise the crime is to show it off to the survivors.'
4830: '@r......In that case, where had Grandfather, as the essential recipient of this message, disappeared off to......?'
4831: 'George@r@v07/10300547."Does this shape ring any bells...?"'
4832: 'Maria@r@v13/10400550."..............................@k@v13/10400551. ......Uu."'
4833: '@rMaria looked at the shape with a serious face.'
4834: '@r...Maybe she was enthusiastic since this was her area of expertise.'
4835: '@r...However, her appearance was that of someone separated from the events at hand,@k ...as though this thing hadn''t been drawn on the shutter closed around her mother''s corpse...'
4836: 'George@r@v07/10300548."......My first impression was that the design resembled some kind of foreign cross-like symbol..."'
4837: 'Hideyoshi@r@v06/11100332."Aah...@k@v06/11100333. It certainly does have that kind of design.@k@v06/11100334. Does that mean it has somethin'' to do with that foreign country?"'
4838: 'Nanjo@r@v19/11900144."That cross symbol was originally a crest from a religious order of knights and was supposed to protect pilgrims traveling to sacred places..."'
4839: 'Jessica@r@v04/10200502."......Then this magic circle has some religious meaning or something...?@k @v04/10200503.This is starting to sound like gibberish......"'
4840: '@rWhen I looked over at all of them, preparing to jump into the discussion, ......something shocked me.'
4841: '@rMaria was...grinning, an eerie expression on her face that defied description.'
4842: '@r...A sort of grin almost like she was making fun of everyone''s ignorance.@k ......It was an expression that I wouldn''t ever have believed Maria to be capable of making...'
4843: '@rAnd then,@w500. ......she laughed.'
4844: '@rAn eerie, jarring laugh;@w500. ...even though I was looking at it right in front of my eyes, I really didn''t want to accept it as real.'
4845: 'Maria@r@v13/10400552."Kihihihihihihihihihihihihihihihihi.@k@v13/10400553. That''s completely wrong, everyone.@k@v13/10400554. Kihhihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihi...@k@v13/10400555. Can''t you tell just by looking?@k@v13/10400556. Kihhihihihihihihihihi."'
4846: '@rWhile everyone was scared out of their wits, Maria, alone, kept on cackling happily...'
4847: '@rAfter a while, that laugh suddenly and abruptly cut off.'
4848: '@rBut her expression was still like someone completely different from Maria.'
4849: 'Maria@r@v13/10400557."This is the seventh magic circle of the sun.@k@v13/10400558. ......The characters are Hebrew.@k@v13/10400559. Lend it here?"'
4850: 'Hideyoshi@r@v06/11100335."Ah, ......yes."'
4851: '@rMaria stole the writing materials from the stunned Hideyoshi''s hand.'
4852: '@rShe then started drawing another magic circle, effortlessly, right next to the one that Hideyoshi had drawn...'
4853: 'Maria@r@v13/10400560."......See?@k @v13/10400561.It was this kind of shape, right?"'
4854: 'Nanjo@r@v19/11900144_1."Y......yes...@k@v19/11900144_2. It was..."'
4855: 'Jessica@r@v04/10200504."...M-Maria, that''s incredible...@k@v04/10200505. You really do know a lot..."'
4856: '@rJessica tried to smooth things over by praising Maria.'
4857: '@r......Maybe she wanted to make sure that this was still the Maria who everyone knew so well.'
4858: '@r...But Maria didn''t give her any particular response.'
4859: '@rMaria started fluently writing unfamiliar characters in the corners of the shape.'
4860: '@r...At this sight, the eyes of Uncle Hideyoshi and Doctor Nanjo instantly began to widen...'
4861: 'Maria@r@v13/10400562."Written on the four arms of the cross are the names of the angels who preside over air, fire, water, and earth.@k @v13/10400562_1a.Chasan, Arel, Taliahad and Phorlakh.@k@v13/10400563a. And in the four diagonal directions are the names of the four great rulers.@k@v13/10400563_1. Ariel, Seraph, Tharshis, Cherub.@k@v13/10400564. ...Do they match?"'
4862: '@rEven if you are unable to correctly write what you have seen,@k ...if you are once again shown something identical, it isn''t difficult to state that the two are the same.'
4863: '@rAsked by Maria whether they matched, Uncle Hideyoshi and Doctor Nanjo nodded over and over again.'
4864: 'Hideyoshi@r@v06/11100338."It''s unmistakable... Yes, these kinds of characters were definitely written there...!@k @v06/11100339.How can you write somethin'' like that......?"'
4865: 'Nanjo@r@v19/11900145."Th-...there were also characters written around the circumference......"'
4866: 'Maria@r@v13/10400565."I know.@k@v13/10400566. .................................Like this, right?"'
4867: '@rMaria began jotting down Hebrew all around the circumference...'
4868: 'Maria@r@v13/10400567."It''s from the Old Testament''s Book of Psalms, Psalm 116, verses 16 and 17.@k@v13/10400568. ......You must at least read the Bible.@k@v13/10400569. Kihihihihihihihi......"'
4869: '@rActing as though knowing this was only common sense, Maria laughed.'
4870: '@rFor a while, everyone, including me, was at a loss for words.@k@r...After some moments, George-aniki returned to his senses, and slowly managed to speak.'
4871: 'George@r@v07/10300549."......That''s incredible, I''m surprised...@k@v07/10300550. ...So, what meaning does this magic circle have?"'
4872: 'Maria@r@v13/10400570."It''s a magic circle to borrow the power of the sun.@k@v13/10400571. ......He who wears it as a talisman drawn in gold shall receive the power to break free from the bonds of any prison, and gain freedom."'
4873: 'Jessica@r@v04/10200506."...Break free from the bonds,@v04/10200507. ......and gain freedom...?@k @v04/10200508.It sounds deep..."'
4874: 'Maria@r@v13/10400572."The word "bonds" is not limited in its interpretation to some kind of physical object.@k@v13/10400573. ...Therefore it does not only hold meaning for people locked up in an actual jail.@k@v13/10400574. It can also refer to the release from mental bonds such as ties of obligation and inescapable fate."'
4875: 'Battler@r@v10/10100856."......Ties of obligation...@v10/10100857. and inescapable fate......you say?@k@v10/10100858. ...That''s also pretty deep."'
4876: 'Hideyoshi@r@v06/11100340."But I really don''t understand...@k@v06/11100341. What does this have to do with those six bodies?@k@v06/11100342. ...Far from bein'' released, they were killed and stuffed in a storehouse, weren''t they?!"'
4877: 'Maria@r@v13/10400575."It''s not like the magic circle was drawn for their sakes.@k@v13/10400576. The six of them were there for the sake of the magic circle.@k@v13/10400577. It is truly pitiable.@k@|@y@v13/10400578. ...Kihihihihihihihihihihihihihihihihi."'
4878: 'George@r@v07/10300551."What do you mean...?@k @v07/10300552.What in the world do you mean when you say the six of them were there for the sake of the magic circle?"'
4879: '@rMaria lifted up her index finger and waggled it as if she were making fun of us.'
4880: 'Maria@r@v13/10400579."That''s written around the circumference.@k@v13/10400580. Can''t you read?@k @v13/10400581.Psalm 116, verses 16 and 17."'
4881: 'Maria@r@v13/10400582."......I''ll read it for you.@k@v13/10400583. "The Lord has freed me from my chains.@k@v13/10400584. I will offer to you the sacrifice of thanksgiving, and will call on the name of the Lord."@k@v13/10400585. ......See?"'
4882: 'Jessica@r@v04/10200509."See, you say...@v04/10200510. .........I have no idea what you''re saying."'
4883: 'Battler@r@v10/10100859."............You''re saying that...@v10/10100860....they''re sacrifices?"'
4884: '@rIf the part that Maria had just read aloud was the vital part of the magic circle,@k ......then it was saying that the benefit of this magic circle required sacrifices to be offered in exchange.'
4885: '@r...So inside the storehouse, where the magic circle had been drawn, the sacrifices had been offered.........'
4886: '@rIt looked like everyone else had slowly arrived at the same conclusion.'
4887: '@r...Some were shocked, others spat out "they''re insane" as they punched their knees...'
4888: '@r......This was starting to become a seriously disturbing story.@k@r...And we couldn''t accept it, nor understand it.'
4889: '@r......I don''t care what kind of magic circles or curses other people believe in—@kthat''s their right, and I won''t pick a fight with them.'
4890: '@r...But did they really kill Dad and the rest as sacrifices for some bullshit like that......?!'
4891: '@rI just couldn''t stand that feeling.'
4892: '@r......I''d rather still be disgusted over all that talk around the inheritance...!'
4893: '@rAs I started getting pissed off with a feeling between anger and sadness, I broke from the circle everyone was in and returned once again to the window.'
4894: '@r......Something had gone insane since yesterday.'
4895: '@rThat letter from the witch, BEATRICE, that Maria had read aloud at last night''s dinner.'
4896: '@r...I feel like ever since that point, we...@k...no, this whole mansion and this whole island...have begun to be drawn into some kind of peculiar world...'
4897: '@rThat''s right.@k When I think back on it, that letter was an invitation from the witch.'
4898: '@rThe ruler of the nighttime island had invited us inhabitants of the day into another world.'
4899: '@rWith the phone and the radio interrupted, and the island shut off by the typhoon, you could now call it another world cut off from the real one.'
4900: '@r......Yes, on this island right now, it is perfectly normal for witches to send letters, and for sacrifices to be offered to magic circles.'
4901: '@r.........So what will happen next?@k@rWill some weird people wearing goat masks start doing the Bon Festival dance or something...?!'
4902: '@r...Aah, it''s no good, it''s no good, I don''t get it...@k@rThe inside of my head''s all screwed up, and I don''t even know what to think...'
4903: '@rAnger, sadness.@k@rThe opposing emotions all swirled up together, and they started to suck me in.'
4904: '@rUnable to resist, ...I could do nothing but cover my eyes with my hands and entrust my mind and body to the spiral swallowing me.........'
4905: '@r.........As I started losing heart, I began to recall a distant memory.'
4906: '@rIt was from when I was very young.'
4907: '@rI had unfortunately seen a scary occult movie on TV, and for a while, I hadn''t even been able to go to the bathroom by myself.'
4908: '@r...That old bastard had given an exaggerated laugh and said this:'
4909: 'Rudolf@r@v08/11200301.......Hey, Battler.@k@v08/11200302. Why do you think they go to all of the trouble to make movies like this about demons and the occult and such?'
4910: 'Rudolf@r@v08/11200303.It''s ''cause they don''t exist. ...Something that ridiculous can''t be found anywhere on the planet.'
4911: 'Rudolf@r@v08/11200304.''Cause they don''t exist, people want to see them and go to a lot of effort making them.@k@v08/11200305. That''s why those occult movies just make me laugh.'
4912: 'Rudolf@r@v08/11200306.If you ask me, rather than demons and monsters, this year''s earnings call and angry wives are a hundred million times scarier.'
4913: 'Rudolf@r@v08/11200307.I''ll go further, alright? If you ask me...@k @v08/11200308.being scared is an emotion for the entertainment of people who have too much time on their hands and too much empty space in their minds.'
4914: 'Rudolf@r@v08/11200309.They have so much free time they don''t know what to do with it, so in order to play around with unusual emotions, they created a culture of demons and monsters and stuff.'
4915: '@r.............................................@k@r......Seriously, why have I been acting so damn thickheaded.@k@rI was totally taken in.'
4916: '@r.........To hell with that shit, this is the human world.@k@rAs if I give a crap about witches, demons, magic circles and sacrifices.'
4917: '@rThe human who killed Dad and everyone else is still on this island.@k@rThat''s all there is, right...?!'
4918: '@rNext to start speaking to my heart was Kyrie-san.'
4919: 'Kyrie@r@v09/11300223_1.You know, in chess and shogi...@k @v09/11300223_2.the deeper you proceed into the mating attack, the very last moment of the endgame, the more limited your best possible moves become.'
4920: 'Kyrie@r@v09/11300223_3.......Therefore, in that very moment when you''re backing someone against the wall,@k@v09/11300223_4. or someone is doing the same to you,@k@v09/11300223_5. both players'' moves become infinitely easier to read.'
4921: 'Kyrie@r@v09/11300223_6.In other words, when you are completely cornered and you think you have no moves left, that is the moment when it is easiest to read your opponent.'
4922: 'Kyrie@r@v09/11300223_7.......However, when a person is forced into a defensive position, they can''t help but lose their ability to think clearly, so they forget to read their opponent''s moves.'
4923: 'Kyrie@r@v09/11300223_8.......That''s when...@k@|@y@v09/11300223_9.you "flip over the chessboard".'
4924: '@rWith all of my strength, I slapped my face with both hands.@k@r.........Now, my eyes were truly open.'
4925: '@rWhen you don''t understand anything, and you''re completely cornered just like I am now, isn''t that the perfect time to "flip over the chessboard"...!'
4926: '@rWith us put on the defensive, we couldn''t even guess at the culprit''s scheme.'
4927: '@r...If you flipped it over and looked at it the other way, just how far could you see?'
4928: '@r......First off, at the time the murders were committed by the culprit, they knew that the island was cut off by the typhoon.'
4929: '@rSo, they should have understood that even if they carried out the murders, they wouldn''t be able to get away until the next morning.'
4930: '@rIn short, the culprit had begun without securing a way to escape.'
4931: '@rFurthermore, the bastard had even tossed the corpses in the storehouse,@k while doing the courtesy of telling us "They are here" with that weird graffiti.'
4932: '@rIn other words, since we would probably find the corpses sooner or later, they wanted to "show us them".'
4933: '@r......If we had all been dim,@k and hadn''t noticed the storage shed, perhaps the culprit''s goal "would not have been achieved"?'
4934: '@rHehe, if you think about it this way, that murdering maniac...@k@rSince this morning, he must have been watching our every move with bated breath.'
4935: '@rAfter all, if we hadn''t been so kind as to discover what was on the storehouse,@k all of that hard work and preparation that they had done last night would have just gone "poof".'
4936: '@rWhat did the culprit want to make us feel by showing us the corpses in the storehouse?'
4937: '@rAll six of the bodies had had their faces noticeably destroyed.@k@r...A grudge?@k A warning?'
4938: '@rThe defacement of the bodies had occurred after death.@k@rSo it hadn''t been the means by which the culprit had murdered.@k@rIt didn''t mean anything to those who had been killed.@k@r...It had "meaning to those who discovered it".'
4939: '@rThe culprit wanted to show them to us—look how brutally I killed them!'
4940: '@rHa!@k After thinking this way, I really want to tell that asshole to stop taking me so lightly.'
4941: '@rWho would dance to that tune? If I''m told "Please be scared", I''m not just gonna say "Really? Sure thing!"'
4942: '@r...When someone tells the great Ushiromiya Battler "Entrance This Way", I''m the kind of guy who''ll start wanting to sneak in through the window!'
4943: '@rThe next thing that had me concerned was the attempt at a magic circle on the shutter.'
4944: '@r...It was a genuine magic circle, declared authentic by even Maria, who had demonstrated that her knowledge of the occult rivaled Grandfather''s.'
4945: '@rThey must have drawn that thing in pitch-black darkness while holding an umbrella in one hand,@k and it must have taken them a lot of time—that''s a formidable amount of hard work and attention to detail.'
4946: '@rWhat purpose would have been worth all of that effort?'
4947: '@r...If something related to the occult happened in this mansion, most likely, we would all automatically suspect the involvement of Grandfather.'
4948: '@rDid they want to "make us think Grandfather was involved"?'
4949: '@rBut if that was all they wanted, they could have just drawn any old scribble that looked like a magic circle.'
4950: '@rIt wasn''t like any of us amateurs could tell the difference between genuine and fake.'
4951: '@r...However, this magic circle was genuine, and furthermore, it had even been written in Hebrew.'
4952: '@r.........So this magic circle...@khad a message "that could only be understood by someone with knowledge of the occult".'
4953: '@rMessages are a form of communication.@k@r......You send them, and hope for a reaction from the other party.'
4954: '@r...Reaction?@k@r.........For some reason, we couldn''t find Grandfather now.'
4955: '@rI don''t know how Grandfather could have managed to see the magic circle on the shutter,@k ...but had he chosen to hide himself in reaction to that sign...?'
4956: '@rNo, was it a trap to make us suspect Grandfather''s involvement?'
4957: '@r...You could read it either way—damn, that''s annoying.'
4958: '@r......What kind of reaction was the culprit hoping to get out of us by showing this imitation of the occult...?'
4959: '@rSomehow, that felt like the culprit''s weak point...'
4960: '@rA section of BEATRICE''s letter that Maria had read aloud during last night''s dinner sprang back into my mind.'
4961: '@r......The part that said "I ask that you enjoy your battle of wits".'
4962: '@rSounds like fun.@k This is a battle of wits between us and the witch.'
4963: '@rWhich will be first, us being swallowed up by your occult games?'
4964: '@rOr me revealing you for who you are?'
4965: '@r......There''s a whole day until the typhoon passes.@k@rWhy not enjoy ourselves...?!'
4966: '@rI finally noticed that the inside of the parlor had gone quiet again.'
4967: '@rEveryone had sunk into their favorite sofas, some deep in thought,@k some irritated, some depressed.'
4968: '@rMaria was once again enjoying the television as if she had never left it.'
4969: '@r...It looked like she found the commercials more fun than the boring program, and she happily yelled "uu-uu" and giggled.'
4970: '@rI stared at each person''s appearance in turn.@k@rIf there isn''t a 19th person,@w500. .........the culprit must be in this room.'
4971: '@r...Right now, Aunt Natsuhi was searching the mansion with the servants, though, wasn''t she?'
4972: '@r......Then it shouldn''t be "in this room".@k@r......"In this mansion" is what we should say.'
4973: '@r...After all, there was also the possibility that Aunt Natsuhi was behind this,@w583. ...and we still couldn''t deny that one of the servants could be the killer.'
4974: '@r.........Anyone could be the bad guy.'
4975: '@rStill, Aunt Natsuhi and the rest sure are slow...'
4976: '@rOf course, it''s not a small mansion, but isn''t this taking a little too long just to walk around, checking the windows and doors...?'
4977: '@rJust as I thought that, Aunt Natsuhi and the rest returned.'
4978: '@rNot one of them was missing.@k@r......But our relief was short-lived.'
4979: '@rEveryone looked at Aunt Natsuhi, shocked...'
4980: 'Battler@r@v10/10100860_1.".........!!"'
4981: '@r......The talk I''d had with Auntie Eva started to creep back into my mind.'
4982: '@rThe possibility that the culprits had enough in numbers,@k or weapons, to kill all of those six at once.'
4983: 'Natsuhi@r@v03/10900311.".........Sorry if I''ve startled you.@k@v03/10900312. I brought this to be prepared for the worst."'
4984: '@rBecause that thing in Aunt Natsuhi''s hand was a rifle.'
4985: '@rAt a glance, its silhouette looked a lot like a hunting gun,@k but it was unusually short, and kinda looked like a kid-sized gun.'
4986: '@rHowever, it had a thickness to it which revealed that this was definitely not some kid''s toy.'
4987: 'Nanjo@r@v19/11900146."...Isn''t that Kinzo-san''s gun...?"'
4988: 'Natsuhi@r@v03/10900313."Did you know about it?@k@v03/10900314. That''s right.@k@v03/10900315. I remembered that it was in Father''s old collection, and I managed to find it."'
4989: 'Battler@r@v10/10100861."Whoa!@k @v10/10100862.Awesome...@k@v10/10100863. Aunt Natsuhi, is that thing real?"'
4990: 'Natsuhi@r@v03/10900316."Yes, it''s real.@k@v03/10900317. It can fire live ammunition.@k@v03/10900318. Long ago, Father used it to scare off wild birds."'
4991: 'Eva@r@v05/11000471."......Ah, I remember.@k@v05/11000472. Where could that have come from?@k@v05/11000473. No matter how much I asked him to let me touch it, he never let me lay even one finger on it."'
4992: 'Jessica@r@v04/10200511."Huh...@k@v04/10200512. Grandfather had one of these...?@k@v04/10200513. I didn''t know."'
4993: 'Eva@r@v05/11000474."Long ago, Grandfather was really addicted to westerns.@k@v05/11000475. That generation really liked this kind of rifle."'
4994: 'George@r@v07/10300553."It looks like it has some considerable history to it.@k@v07/10300554. But I''ve never seen one this short before."'
4995: 'Hideyoshi@r@v06/11100343."Ahhhh!@k @v06/11100344.I remember that gun!!@k @|@y@v06/11100345.That''s the one the gunman goes firin'' off with in that old movie I used to love!!@k @v06/11100346.Father sure has good tastes...!"'
4996: 'Genji@r@v14/11600154.".........Long ago, the Master had that brought over specially from America.@k@v14/11600155. ...As you can see, it is a real gun, so I would ask that you keep this a secret..."'
4997: 'Kumasawa@r@v18/11800085."He was quite tickled by it when he first got his hands on it.@k@v18/11800086. It seems the workings that ejected the cartridges were more interesting to him than shooting it, and he played around with it back in the forest all the time.@k@v18/11800087. Hoh-hoh-hoh-ho..."'
4998: 'Eva@r@v05/11000476."......Still, what a dangerous thing.@k@v05/11000477. Are you sure you should be dragging this out?"'
4999: 'Natsuhi@r@v03/10900319."This is preparing for the worst.@k@v03/10900320. .........There''s probably more than one of them.@k@v03/10900321. Furthermore, they are terrifying people who killed six of us, including my husband.@k@v03/10900322. ......I have the responsibility to protect everyone until tomorrow, in my husband''s place."'
5000: '@rAs Natsuhi-san said this, she slumped down into one of the sofas and took a deep breath.'
5001: '@rAs well as checking the doors and windows, ...she had also been trying to find Grandfather.'
5002: '@rSince Grandfather was not with her, apparently his whereabouts were still unknown.'
5003: 'Natsuhi@r@v03/10900323."...I carefully checked all of the doors and windows throughout the mansion.@k@v03/10900324. However, we must be prepared for anything.@k@v03/10900325. Everyone, I think it would be best if we all remained here."'
5004: 'Eva@r@v05/11000478."I agree.@k @v05/11000479.If everyone is gathered here, then we can all feel more secure by keeping an eye on each other."'
5005: 'Natsuhi@r@v03/10900326.".........What do you mean by that, Eva-san?"'
5006: 'Eva@r@v05/11000480."Nothing really?@k @v05/11000481.I''m just agreeing with your opinion, aren''t I?"'
5007: '@rThere was a dangerous atmosphere between the two of them...@k@rIf you thought about who stood to gain the most from the inheritance problem standpoint, Auntie Eva was the obvious answer.'
5008: '@r...However, there was no proof that Aunt Natsuhi was innocent.'
5009: '@r......No, if you view BEATRICE''s letter as Grandfather''s elaborate prank,@k and think of this incident as just an extension of that, there was more than enough evidence to doubt even Grandfather.'
5010: '@rAunt Natsuhi thought that the criminal was on the outside.@k@r...But Auntie Eva thought the criminal was on the inside.'
5011: '@rIn short, it was the question of whether or not a 19th person exists.'
