1959: 'Eva@r@v05/11000187."They aren''t wild, they''re right on the money, aren''t they?@k @v05/11000188.He wants to make his business succeed so that he can recover his losses, but his debt is actually growing!@k @v05/11000189.All he wants is to get himself out of the hole he''s dug, by making an even bigger gamble than before.@k@v05/11000190. If he had funds close at hand, it''s only logical that he''d try to use them!"'
1960: 'Eva@r@v05/11000191."Let me say it clearly, Nii-san—what you are doing is embezzlement.@k@v05/11000192. You are betraying our father.@k @v05/11000193.I imagine that we will leave you to the mercy of the courts after this is all over.@k @v05/11000194.Do you think those people will kindly agree to address you as "successor to the Ushiromiya head house"?"'
1961: 'Natsuhi@r@v03/10900067."O-of all the things...sa-saying that he''s betraying the head is not something I can overlook!!@k @v03/10900068.You no longer have the right to darken the doors of the glorious Ushiromiya house!!@k @v03/10900069.Leave this place immediately!!@k @v03/10900070.Go on!!@k @v03/10900071.Get out!!"'
