1924: 'Eva@r@v05/11000162."I understand that.@k@v05/11000163. If the value of this island rises, that will increase our shares when we distribute the inheritance.@k@v05/11000164. Of course, we won''t ask you to physically divide the island and the mansion into four equal parts.@k@v05/11000165. We''re quite happy to settle this with whatever you calculate its financial worth to be."'
1925: 'Krauss@r@v02/10800100."If you understand that much, what about my business makes you so dissatisfied?"'
1926: 'Rudolf@r@v08/11200157."We aren''t dissatisfied, we''re uneasy.@k@v08/11200158. In the first place, Aniki,@k@v08/11200159. when do you plan to open that hotel?@k @v08/11200160.Keep this up, and every square inch of it will be covered in our grubby hand prints!"'
1927: 'Eva@r@v05/11000166."That''s right.@k@v05/11000167. It''s an important tool for your business, isn''t it?@k @v05/11000168.I understand that you can''t keep it locked up until the moment you open it for business.@k @v05/11000169.Buildings go bad if you don''t use them and air them out every once in a while."'
1928: 'Eva@r@v05/11000170."Even so, it''s a bit extravagant for a guesthouse that we only use once a year.@k@v05/11000171. Wouldn''t you say, Rosa?"'
1929: 'Rosa@r@v12/11400094."..................That''s right.@k@v12/11400095. If it''s that wonderful, I''m sure that it will become quite popular once you open it."'
1930: 'Kyrie@r@v09/11300073."Oh...@v09/11300074..........the hotel you mentioned earlier was referring to the guesthouse, I see..."'
1931: 'Rudolf@r@v08/11200161."Hell of a building, isn''t it?@k@v08/11200162. Just as Rosa said, I''m sure it would become popular if he were to open it."'
1932: '@rThe lodging they had been guided to had not been constructed with the intent of building a guesthouse.'
1933: '@r...It was originally constructed as a resort hotel.@k@rHowever, even though it had been completed two years ago, there was absolutely no schedule for it to be opened...'
1934: 'Eva@r@v05/11000172."Nii-san, it''s just like all of your enterprises.@k@v05/11000173. Your attention and planning are both fabulous.@k@v05/11000174. Then, it always becomes unable to maintain itself partway, and ends without being able to collect any profit."'
1935: 'Rudolf@r@v08/11200163."It was brilliant of you to spot that it was a waste to use this island only as a place to live.@k@v08/11200164. I think that turning it into a resort which could use things like marine sports, fishing, or honeymoons to attract customers was a pretty good plan."'
1936: 'Rudolf@r@v08/11200165."If I were the oldest son, I''m sure I too would have racked my brains over what kind of profit I could get out of this island."'
1937: 'Eva@r@v05/11000175."But, two full years have passed since you finished building, right?@k @v05/11000176.After two years, you still don''t know when you''ll be able to open it?@k @v05/11000177.Where is the managing company you entrusted it to?"'
1938: 'Natsuhi@r@v03/10900055."......Impertinence!@k @v03/10900056.That is not my husband''s fault!@k @v03/10900057.There has just been some trouble with the company that my husband contracted with—no matter how you look at it, we are victims here!"'
1939: 'Hideyoshi@r@v06/11100129."That''s the thing, though...@k@v06/11100130. This company that Krauss nii-san hired...@v06/11100131.I haven''t heard many good rumors about it, y''know?"'
1940: 'Eva@r@v05/11000178."Let''s not beat around the bush.@k@v05/11000179. ......The project disintegrated mid-way due to nonpayment, embezzlement, and other troubles—did you think the rumors wouldn''t reach our ears?@k @v05/11000180.I''ve been collecting evidence."'
1941: 'Natsuhi@r@v03/10900058."I don''t know what kind of evidence you found, but it''s all baseless!@k @v03/10900059.As new members in the sightseeing business, it is necessary to lay the groundwork with various people.@k@v03/10900060. It is also important to discuss how trustworthy the other party is.@k@v03/10900061. This is nothing more than taking some time to meet that end!"'
1942: 'Krauss@r@v02/10800101."......I''ll accept that, in my rashness, the hotel was completed too early.@k@v02/10800102. However, we are not paying maintenance costs.@k@v02/10800103. It''s a slow and vital strategic arrangement."'
1943: 'Rudolf@r@v08/11200166."Yeah, I bet.@k@v08/11200167. More like you want to sell it but can''t.@k@v08/11200168. There''s no reason for anyone to buy such an extravagant hotel on an isolated island with nothing on it and no established sightseeing routes.@k@v08/11200169. Besides, what''s happening with the loans you gathered for this project?"'
1944: 'Hideyoshi@r@v06/11100132."It might not be costing you maintenance, but the borrowed money you can''t return is just goin'' up and up.@k@v06/11100133. ......Sorry, Krauss nii-san.@k@v06/11100134. I investigated the development plan for this island a little.@k@v06/11100135. ...I gotta be honest, I''ve not heard anythin'' good either."'
1945: 'Krauss@r@v02/10800104."Hideyoshi-san.@k@v02/10800105. I''m sure that only looking at the current financial condition could lead you to that impression.@k@v02/10800106. However, that is a prior investment.@k@v02/10800107. I have no choice but to admit that my prediction was mistaken, and that up until now, several liabilities have been created."'
1946: 'Krauss@r@v02/10800108."However, the times have finally caught up with me.@k@v02/10800109. I will soon regain everything that I have lost up to this point.@k@v02/10800110. No, actually, all of the investments I have made until now will finally return to my possession.@k@v02/10800111. That''s right, just like throwing away a small fry which then becomes a salmon, they will come back even bigger than before."'
1947: 'Hideyoshi@r@v06/11100136."Sure, I''m with you on that.@k@v06/11100137. Startin'' soon, the resort business will probably see an unprecedented boom...@k@v06/11100138. Though who knows whether it''ll be enough to bury all of your liabilities..."'
1948: 'Hideyoshi@r@v06/11100139.".........But I gotta ask, Krauss nii-san.@k@v06/11100140. After all the crushing defeats you''ve suffered so far, who in the world supplied you with the funds?@k@v06/11100141. That''s a heck of a sum we''re talkin''.@k@v06/11100142. Enough to cover your massive debt, right?"'
1949: 'Natsuhi@r@v03/10900062."......What are you trying to say, Hideyoshi-san?"'
1950: 'Hideyoshi@r@v06/11100143."Ahh, Natsuhi-san, please, don''t get mad!@k @v06/11100144.We''ve done our research, see.@k@v06/11100145. ...We looked into it, tryin'' to see who could''ve loaned Krauss nii-san, who''s lost all his battles thus far, enough to support his recent massively gutsy investments."'
1951: 'Rudolf@r@v08/11200170."...And the result—@k@v08/11200171.no one.@k@v08/11200172. There is no backer.@k@v08/11200173. The iron rule of the money roulette is to bet against the unfortunate.@k@v08/11200174. And Aniki, you are a well known unfortunate in this neighborhood."'
1952: 'Rudolf@r@v08/11200175."Surely this era seems set to welcome an economic boom, but when we asked who, with respect to Aniki''s failures,@k@v08/11200176. would find him worthy of funding,@v08/11200177. there was no one."'
1953: 'Eva@r@v05/11000181."So you see...@k @v05/11000182.Where did you raise that money from?@k @v05/11000183....That''s what we started to question next."'
1954: 'Krauss@r@v02/10800112.".........Hoh.@k@v02/10800113. Isn''t this an interesting story.@k@v02/10800114. And?"'
1955: 'Natsuhi@r@v03/10900063."D-dear!@k @v03/10900064.How long do you plan to ignore these abusive remarks!!"'
1956: 'Rudolf@r@v08/11200178."Sit down, Natsuhi-san.@k@v08/11200179. .........Let me be blunt.@k@v08/11200180. Aniki, you have been diverting Dad''s private funds for your own business.@k@v08/11200181. There is almost no doubt.@k@v08/11200182. If we made some mistake, please, feel free to explain it for us."'
