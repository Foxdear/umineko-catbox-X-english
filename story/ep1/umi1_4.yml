1585: '@rThe Ushiromiya family conference was held once every year.@k@rIt took place on the first weekend of October.'
1586: '@rIf a normal family were to use a pretentious name like "family conference",@k you''d expect it to be nothing more than a reunion of rarely seen relatives who greet each other surrounded by buckets of sushi.'
1587: '@rHowever, in the Ushiromiya family, where the sons and siblings are lent great fortunes,@k and only those that achieve success in business are considered adults, it literally was a conference.'
1588: '@rHow much of the fortune was invested? What kind of business was conducted? How much was earned?'
1589: '@rAs a result, how much of the fortune borrowed from the main family could be repaid?@k@rOr, alternatively, how much would be borrowed for future business ventures?@k@rWhat lessons had they learned, and what could they learn from their mistakes?'
1590: '@rIt seems that topics like these had been discussed very seriously in the past.'
1591: '@rMy dad called it a bed of nails.'
1592: '@rApparently, it used to be a very serious family meeting, where one would commonly be showered with harsh and angry voices, and even get slapped in the face despite being well past the age for it.'
1593: '@rHowever, that was all a thing of the past.'
1594: '@rBy now, everyone had achieved success in their own independent business ventures,@k and it was on the road to becoming a normal yearly get-together.'
1595: '@rEven so, being asked by Grandfather about the current state of play was an extremely stress-inducing event,@k and while to us grandchildren it was nothing more than a simple meeting, to our parents it was still a real stomachache.'
1596: '@rThe absence of the man responsible for all this, whatever the reason behind it, must surely have made today''s lunch even more delicious.'
1597: '@rThe phrase "when the cat is away, the mice will play" comes to mind.'
1598: '@rWell then, let me introduce Jessica''s father, whose face I haven''t seen for six years.'
1599: '@rThe man sitting to my dad''s left is his older brother and the father of Jessica,@|@y Uncle 蔵臼.'
1600: '@r......This name sure is easy to read.@k Krauss (蔵臼).'
1601: '@r...After so many weird names, it warps your sense of what''s normal, and you start to think,@k "hey, what''s wrong with Krauss,@k sounds pretty cool actually"...'
1602: '@rJust like with Aunt Natsuhi, I don''t have many memories of speaking with Uncle Krauss.'
1603: '@rHe had never been one to talk to children, and I felt like he was always talking with the adults, just like Aunt Natsuhi.'
1604: '@rFrom the way my dad talked about him, it seems that he used to be a pretty spiteful and unreasonable person.'
1605: '@rIf what Dad said is true, he used to be very domineering as the oldest sibling,@k and was hated by Auntie Eva, Auntie Rosa, and the rest of the family.'
1606: '@r......Odd, considering they''re all having fun chatting together.'
1607: '@rWell, I guess even if their relationship was bad when they were children, sometimes when people grow up and go their separate ways, their relationship changes.'
1608: '@rThat''s probably what this is.'
1609: '@rAfter all, they all have children of about the same age.'
1610: '@rSince they share similar family environments, they probably all profit by exchanging opinions.'
1611: '@rMaybe because of that, the parents'' circle has been deep in conversation for a while now about the exams Jessica and I are going to be taking.'
1612: '@rJessica, in order to escape the discussion of exams with the old bastard sitting on her left,@k was purposefully facing to the right, firing off topic after topic so as not to give him an opening.'
1613: '@rMoving on, let''s look at the end opposite from Uncle Krauss and the others.'
1614: '@rIn the very last seat at the table, an old gentleman with a sturdy physique sat facing Kyrie-san.@k This was my first time meeting him.'
1615: '@rI had only just been introduced to him, but it seems that he''s Grandfather''s personal doctor, a man called Nanjo (南條).'
1616: '@rApparently he used to own a huge clinic on the nearby Niijima island, but he turned it over to his son and then began living a life of leisure in his old age.'
1617: '@rHe''s known Grandfather since the very beginning when the mansion was first constructed on this island, and they have a history going back several decades.'
1618: '@rI thought he might be Grandfather''s companion in his suspicious hobbies, but, surprisingly, it seems that he''s Grandfather''s chess partner.'
1619: '@r......I see, that kind of hobby does seem very like our grandfather, with his love of Western style.'
1620: '@rYou could probably also call him the only person able to enter Rokkenjima who is neither a family member nor a servant.'
1621: '@rFrom listening in on his conversation with the womenfolk seated near him, he gave the impression of a calm old gentleman.'
1622: '@r......Considering he''s managed to put up with our short-tempered grandfather for so long, I''m sure his big heart is nothing to laugh at.'
1623: '@r...Still, even if he is his doctor, having someone from outside the Ushiromiya family attending the family conference is a little odd.'
1624: '@rFrom that fact, I imagine that Grandfather''s condition has grown much worse,@k and it may even be one of the major topics of discussion at the family conference...'
1625: '@rGeorge-aniki was just saying it, too.@k@rFor the past year, Grandfather has been continually pronounced as having very little time left to live.'
1626: '@r...It''s awful to talk about, but Grandfather is an extremely rich man.@k@rAt the time of his death, his wealth will suddenly be released, along with our parents'' stomach acid, surely leading to some serious ulcers.'
1627: '@rWith this kind of thing, the greater the number of ways it must be split, the more trouble will be caused splitting it.'
1628: '@r...This kind of talk would probably also be included in the family conference.@k@r...Oh well, it''s not like it has anything to do with us children.'
1629: '@r......Finally, even though he''s absent, let me introduce our Grandfather.'
1630: '@rThe person who should be sitting in that seat of honor is Ushiromiya Kinzo (金蔵).'
1631: '@r...It really sucks.@k He gave everyone else in the family these weird names, but he himself uses one which is conservative as all hell.'
1632: '@rIf only his name were written with those same characters for "gold" and "vault", but he let us call him "Goldsmith" or something,@k that''d be totally awesome!'
1633: '@rAs you can probably gather from all the talk about him, he''s a frightening person with an extremely short temper.'
1634: '@r...Because I''m just his grandkid, and haven''t met him since I was in elementary school six years ago,@k I don''t remember ever having been beaten by him, but it seems that our parents were raised with an iron fist.'
1635: '@rThat earlier conversation between my dad and Uncle Krauss,@k about who should go try to convince Grandfather to come out, seems oddly funny if you take this into account.'
1636: '@rIn order to tell Grandfather''s story, you have to take yourself all the way back to before the Showa era, to recount the tale of the Ushiromiya family.'
1637: '@rUntil the Meiji and Taisho eras, the Ushiromiya family was great and prosperous.'
1638: '@rThey owned several spinning mills, and were very wealthy people who merely had to fall about laughing while the money rolled in.'
1639: '@rIncidentally, Grandfather, as a member of a branch family, originally had nothing to do with the main family.'
1640: '@rDistantly separated from the head''s inheritance, he apparently had very little involvement with the head house.'
1641: '@rHowever, during the Great Kanto Earthquake in 1923, the mansion owned by the Ushiromiya main family in Odawara was flattened.'
1642: '@rThe spinning mills in Tokyo were all burned down in a huge fire,@k and the Ushiromiya family lost most of its wealth and family members in an instant.'
1643: '@rIt then became a matter of who would become the heir to the main family, and as it turned out, none were left except for Kinzo, who was as far removed from the main family line as they come.'
1644: '@rKinzo himself later said that it was such good luck, it was as though fate itself had been turned upside-down.'
1645: '@rWith that, Grandfather''s ordinary life did a 180.@k@rHe was entrusted with reviving the wealth that the dying Ushiromiya family had almost completely lost.'
1646: '@rOf course, just because you suddenly dump a task on someone doesn''t mean they can do squat to accomplish it.@k@rI doubt the people around him were expecting much.'
1647: '@rBut this is where Grandfather began to display his extraordinary talent and good luck.'
1648: '@rGrandfather used all of the family funds, and everything from the hair on his head to his toenails, as collateral to borrow a massive amount of money,@k created a gigantic supply of funds, and immediately started a business.'
1649: '@rIt was like tumbling down a hill on a bike without any brakes.'
1650: '@rAnd then, jumping onto a neighboring bike, and then another one!@k Just like some crazy street performance.@k Probably, anyone would have thought that Grandfather had no business ability.'
1651: '@rBut with an unbelievable amount of good luck and miracles, with coincidences piling up and every chance taken advantage of,@k before anyone knew it, he had forged powerful connections with the Allied forces.'
1652: '@rAt that time, MacArthur and the GHQ were in charge of Japan.'
1653: '@rGrandfather, in a twinkle of the eye, began succeeding in business under the protection of the occupying forces, quickly becoming very rich.'
1654: '@rAt this point, it was no longer luck but information that won the day.'
1655: '@rHe must have made some seriously thick connections with the occupying forces.'
1656: '@r......Grandfather knew about the emergency demands that would be made for the Korean War, before they happened.'
1657: '@rNo, more than that, he must have foreseen these special procurements and started penetrating those markets from the very beginning.'
1658: '@rHistory textbooks say that all of Japan made a large profit off the emergency demands for the Korean War, but that wasn''t the case in reality.'
1659: '@rOnly a very limited number of the super-rich played the money game and made an easy profit.'
1660: '@rMost of the citizens remained poor.@k@r......In other words, Grandfather was an extremely lucky member of this group of winners.'
1661: '@rThis all happened...during the year 1950, I think?@k@rAnd since the year of the Great Kanto Earthquake was 1923...'
1662: '@r......that means Grandfather was able to revive the near-dead Ushiromiya family, to a level even higher than it had been before, in the span of only twenty to thirty years.'
1663: '@rWith that, you''d think that he would revive the main family in Odawara,@k but for some reason, he went and did something as crazy as buying an entire small island in the Izu Archipelago.'
1664: '@rBuying an entire island is not something that you can ordinarily do today.'
1665: '@rHowever, Grandfather was clever.@k@rHe contacted the GHQ and applied for the establishment of a marine resource base.'
1666: '@rHe acquired this island as a business property, and then reneged on it and claimed it as his own plot of land.'
1667: '@rAfter the war there were prevention measures against food shortages, and, furthermore, he had the sponsorship of the GHQ, which meant that nobody could oppose him.'
1668: '@rIt seems that Tokyo provided the land for next to no money at the time.'
1669: '@rTokyo later made repeated complaints for the land to be returned, but not much could be done due to the involvement of the GHQ, even though they''d been pushed into it.'
1670: '@rNo doubt he''d bribed everyone there was to bribe.@k@rIn the end, the city gave up in frustration.'
1671: '@rGrandfather, with considerable skill and blessed with good luck, managed to weather the stormy seas of that period,@k obtaining a vast fortune and his own island.'
1672: '@rOf course, it wasn''t all luck.@k@rHe was skilled with English, and this was cultivated by his Western obsession.@k@rIt was by using that as a weapon that he was able to make inroads into the GHQ.'
1673: '@rA mansion was immediately built on the island.@k That would be this mansion.'
1674: '@rGrandfather, who had always loved the West, made this once uninhabited island, Rokkenjima, a canvas upon which he could realize his dreams to his heart''s content.'
1675: '@rThe Western mansion that he had always imagined, overflowing with emotion; the beautiful garden where various roses had been planted.'
1676: '@rAnd a private beach where nobody other than himself would ever be permitted to leave a footprint.'
1677: '@r......To have this much would be every man''s dream.'
1678: '@rAfter that, making good use of his huge fortune,@k he became a large stock holder in the extremely stable iron and steel industry, and was able to live an easy and comfortable life just using the dividends.'
1679: '@rWell, he''s just that incredible.'
1680: '@rThis kind of person normally gets portrayed after the fact as having the ability to foresee and predict the future or something,@k but Grandfather denies all of that,@k repeatedly saying that he was simply blessed with extraordinary luck...'
1681: '@r......Anyway, even a lord like that, with all of his dreams made real,@k can''t help but grow increasingly odd when locked up alone on an island.'
1682: '@rEveryone knows he''s been obsessed with the West for a very long time,@k ...but none of our parents really knows when his bizarre black magic hobby began.'
1683: '@rPerhaps his love of black magic began way back when he became fascinated with the West,@k or, possibly, his miraculous stretch of good luck which allowed him to revive the family caused him to feel a mysterious power in himself.'
1684: '@r...At some point, Grandfather began to make the research of black magic his life''s work,@k filling his study up with suspicious books, chemicals, and magical items as he became increasingly bizarre.'
1685: '@rThese being the few remaining years of a person successful in life, those around him "warmly" watched over him, feeling the time was his to spend as he pleased...or so I hear, but...'
1686: '@r.........No way in hell that''s true.@k They probably were just driven away, thinking "that''s disturbing, I don''t want to get involved".'
1687: '@rWell, ...that war-torn period was a time for big gambles, with both opportunities and risks.'
1688: '@rI''d like to see Grandfather do so well if he''d been born in this time period.'
1689: '@rHe would''ve had no opportunities, and would probably have advanced like a chess piece from mandatory education to college at a leisurely pace,@k never becoming more than an average company employee.'
1690: '@rIf that had happened, he''d probably be sitting here with the rest of us, regaling us with tales of his shitty boss.'
1691: '@rNo, no—not here, in the dining hall of a mansion—we might have been around a table at some bar.'
1692: '@rIf that were the case, I''m sure that this would have been a more comfortable family conference.'
1693: '@rAlright, that''s enough talk about the old geezer who won''t pop off.@k@rMore importantly, let''s talk about this incre~dible lunch!!'
1694: 'Battler@r@v10/10100342."I was already sold by the sashimi salad!@k @v10/10100343.Gohda-san is one hell of a chef!@k @v10/10100344.Plus, these fish were caught in the oceans near here, weren''t they?@k @v10/10100345.The sashimi you get at the supermarket don''t even come close!"'
1695: 'Rudolf@r@v08/11200104."Hey, quit it, Battler.@k@v08/11200105. Your upbringing will be exposed."'
1696: '@rEveryone let out a big laugh.'
1697: '@rDamn it, you say that even though you love those cheap pubs.'
1698: 'George@r@v07/10300177."Hahahaha.@k@v07/10300178. My job occasionally leads me to eat at some quite interesting places, but even compared to those, this is an excellent dish.@k@v07/10300179. I imagine you could have become reasonably well-known in that field, Gohda-san."'
1699: 'Jessica@r@v04/10200193."I don''t know too much about it, but...@k@v04/10200194.at the famous hotel where he used to work, employee politics got pretty complicated and everyone split into factions.@k@v04/10200195. In the middle of all that, he was apparently forced to retire.@k@v04/10200196. And, it just so happened that Mom had job offers for a servant out at the same time."'
1700: '@rAs Gohda cleared away the empty plates, he began to recount his own eventful past, never losing his smile.'
1701: 'Gohda@r@v17/11700047."......The world is a difficult place.@k@v17/11700048. However, it is thanks to this that I was given a chance to display my skills as a chef once again, this time for the Ushiromiya family."'
1702: 'Gohda@r@v17/11700049."Although I also enjoy the smiles of a larger number of people,@k@v17/11700050. it is also extremely entertaining to be able to perform delicate work in order to please solely the limited number of people I have pledged to serve.@k@v17/11700051. All of this is thanks to the opportunity given to me by Madam."'
1703: '@rGohda-san respectfully bowed his head towards Aunt Natsuhi.'
1704: 'Natsuhi@r@v03/10900027."That is because among all of the applicants, you were the most talented.@k@v03/10900028. The decision was not based on personal feelings, but purely objective, so there is no need to thank me."'
1705: '@r...Oh man, why does Aunt Natsuhi always have to speak so frankly.'
1706: '@rIf only she spoke more gently, she might give off a different impression.'
1707: '@rShannon-chan and Kumasawa-san entered from the hallway with a serving cart.'
1708: 'Shannon@r@v15/10500060."......Please excuse us."'
1709: 'Gohda@r@v17/11700052."Now then, let us move on to today''s dessert."'
1710: '@rGohda-san and the others laid out the beautifully adorned dessert.'
1711: '@rI guess it''s true when they say you have another stomach for desserts...'
1712: '@rI''d thought that being fed all that delicious food had totally filled me up,@k but as soon as I laid eyes on the dessert, my stomach started yelling "More!"'
1713: '@rI don''t know much about desserts, but this looked really good.'
1714: '@rA white pudding-like substance was garnished with two shades of red sauce,@k and elegant rose petals adorned the dish.'
1715: '@rWhen you dine on such magnificent food as this, first it is distributed in front of everybody, and then the chef takes a moment to extol the virtues of his creation.@k Until he has finished, as a rule, you don''t touch the food.'
1716: '@rHowever, Maria, who had no experience with these ceremonious rules, got excited by this beautiful and delicious-looking dessert and jumped into the fray as soon as it was placed before her.'
1717: '@rAuntie Rosa scolded her, calling it bad manners, but George responded by saying "Now, now, it''s alright."'
1718: 'Maria@r@v13/10400207."Uu?!@k @|@y@v13/10400208.This one''s sour!@k @v13/10400209.This one''s sour!@k @v13/10400210.Battler, the wrong one is this one!@k @v13/10400211.Uu!"'
1719: '@rMaria exclaimed as she sampled the two colored sauces.'
1720: 'Battler@r@v10/10100346."What, there''s a right one and a wrong one?! Alright, I''ll give it a go~!@k @v10/10100347.Mmmmm?!"'
1721: '@rApparently the two sauces were one sweet and one sour.@k@rDespite it being bad manners, I also stuck my little finger in and licked it.'
1722: '@rWhoa, one of them was sour enough to make you pucker up.@k@rIf it were yellow, I''d have suspected lemon, but I couldn''t guess what kind of sourness would be red.'
1723: '@rI decided to ask Shannon, who was putting away the serving cart behind us.'
1724: 'Battler@r@v10/10100348."Shannon-chan, what kind of sauce is this sour stuff?"'
1725: 'Shannon@r@v15/10500061."......Umm......@v15/10500062.............err...@v15/10500063.......u..."'
1726: '@rShannon-chan hesitated to speak.'
1727: '@rMaybe she was just setting the table and doesn''t really know.@k@rShe''s hesitating a bit much for that, though.@k@r......Did I ask something wrong?'
1728: '@rOr did they use something that we''d be better off not knowing about?'
1729: '@rWhile Aunt Natsuhi acted as though she had a headache, Kumasawa-san, who was setting the other side of the table, began to laugh with a "hoh-hoh-ho".'
1730: 'Kumasawa@r@v18/11800042."What do you think we made it out of?@k @v18/11800043.Hoh-hoh-ho, it''ll shock you..."'
1731: 'Battler@r@v10/10100349."Huh? ...I, I don''t have a clue.@k@v10/10100350. And, Kumasawa baa-san, that laugh creeps me the hell out.@k@v10/10100351. So, what is it?!"'
1732: 'Kumasawa@r@v18/11800044."......Don''t tell anyone, alright?@k @v18/11800045.Let me borrow your ears."'
1733: '@rKumasawa-san leaned across from the other side of the table.@k She''d asked to borrow my ears, so I leaned forward too.@k Their interest caught, Jessica, George-aniki, and, of course, Maria, also put their ears closer.'
1734: 'Maria@r@v13/10400212."Uu.@k@v13/10400213. What?@k @v13/10400214.Whaat?@k @v13/10400215.Tell mee!@k @v13/10400216.Tell mee!"'
1735: 'Kumasawa@r@v18/11800046."The sour part is, well...@k@|@y@v18/11800047. ......Actually, it''s squeezed juice from a mackerel, hoh-hoh-ho!"'
1736: '@r@v99/awase0001."""WHAT, mackerel?!?!"""@|@y'
1737: '@r"Don''t be ridiculous," we all thought, horrified.@k@rOnly Maria accepted it, nodding with an "uh-huh".'
1738: 'Maria@r@v13/10400217."Uu?@k @v13/10400218.Mackerels are sour.@k @v13/10400219.If you squeeze them, this comes out!"'
1739: '@r@v99/awase0002.""...ha, wahahahahaha...!""@|@y'
1740: '@rWhen Maria started clamoring that mackerel were sour, the adults were unable to contain their laughter.'
1741: 'Rosa@r@v12/11400071_1."You''ve got it wrong, that''s vinegared mackerel!"'
1742: '@rAuntie Rosa said to Maria in a small voice while turning red.'
1743: '@rAhhhh, now I remember it perfectly.@k@rKumasawa-san was always this kind of a character, wasn''t she?@k@rI think I remember her tricking me about all kinds of things when I was young as well!'
1744: '@rAmongst all of them, the most painful must have been that one!@k@rThat flimsy black stuff you get in Chinese food!@k Kikurage mushrooms!@k@rShe told me it was penguin meat and I went all around school like a smartass telling everyone, didn''t I?!'
1745: 'Battler@r@v10/10100353."Kumasawa baa-chan, you sure haven''t changed...!@k @v10/10100354.You know Maria''s gonna believe now, right?"'
1746: 'Kumasawa@r@v18/11800048."Hoh-hoh-ho, it''s just a joke!@k @v18/11800049.Gohda-san will tell you what the sauce is in just a moment!"'
1747: '@rGohda-san looked a little put out from having his masterpiece laughed at in such a strange way,@k but after clearing his throat once, he introduced the dessert to us.'
1748: 'Gohda@r@v17/11700053."Well then, allow me to describe tonight''s dessert.@k@v17/11700054. Based on the rose garden that everyone seemed to enjoy so much today, I finished this panna cotta in a rose garden style.@k@v17/11700055. The rose petals scattered across were selected just now from that rose garden."'
1749: 'Gohda@r@v17/11700056."For the sauces, I have prepared two different reds for you, strawberry and rose hip.@k@v17/11700057. Please enjoy the strawberry''s sweetness and the rose hip''s sourness in turn.@k@v17/11700058. Finally, the rose petals are merely decoration, so please set them aside before eating.@k@v17/11700059. With that said, please, enjoy."'
1750: '@r......Hahhh... ...Man, I almost want to applaud before I''ve even eaten it.'
1751: '@rIt''s like when you take medicine, you know, how it seems to work better when you''ve read the instructions.'
1752: '@rThanks to Gohda-san elaborating on the details of this dessert, I feel like he''s knocked it up another notch.'
1753: '@rSeriously, should you call him meticulous or just talented?'
1754: '@rThe dessert was probably planned from the beginning, but he took a cue from our stopping in front of the rose garden earlier today,@k and displayed an incredibly timely awareness of the season by just adding a few rose petals from that garden.'
1755: '@rThis combination of sweet and sour was also exquisite.@k@rIf it was just sweet, you''d just get used to it and become bored halfway through.'
1756: '@rBut by bringing in the sour sauce at that point, you get a really vivid taste.@k And then, once you return to the sweet sauce, all of the sourness in your mouth is replaced with an enjoyable sweetness again.'
1757: '@rI''m sure everyone else felt the same way.'
1758: '@rEvery time Gohda-san passed by one of the seats, someone praised the taste and his creation.'
1759: 'Gohda@r@v17/11700060."How is it, Madam?"'
1760: 'Natsuhi@r@v03/10900030."Splendid, as always.@k@v03/10900031. It is a worthy treat for our guests."'
1761: 'Gohda@r@v17/11700061."I am most grateful for your words.@k@v17/11700062. ......Madam, did you know?@k @v17/11700063.I have heard that rose hip has the ability to cure headaches.@k@v17/11700064. I thought that you especially would appreciate it, so I had it specially prepared."'
1762: 'Natsuhi@r@v03/10900032."...Is that so?@k@v03/10900033. Thank you."'
1763: 'Kyrie@r@v09/11300063."See, didn''t I tell you, Natsuhi nee-san?@k@v09/11300064. Rose hip works on headaches."'
1764: 'Natsuhi@r@v03/10900034."So it seems.@k@v03/10900035. ...I can only hope it has some effect."'
1765: 'Hideyoshi@r@v06/11100095."Haahh!@k @v06/11100096.Gohda-san, I love ya!@k @v06/11100097.Hey, later, whisper me how much compensation you''re gettin'' for this, won''t ya?!@k @v06/11100098.If you''re sworn to silence, you can stick up some fingers instead, let me know your price!"'
1766: 'Hideyoshi@r@v06/11100099."Havin'' your talent monopolized by this small island is sacrilege to humanity''s cookin'' culture!@k @v06/11100100.Wouldn''t you be willin'' to display your talent to all the customers at my company?"'
1767: 'Krauss@r@v02/10800036."Hahaha, Hideyoshi-san.@k@v02/10800037. Are you trying to recruit our Gohda?@k @v02/10800038.How troubling.@k@v02/10800039. We had better make some improvements to his salary, or he''ll get snatched away."'
1768: 'Eva@r@v05/11000115."*giggle* Yes, you really should.@k@v05/11000116. If you don''t, he''ll be lured away and you''ll be stuck with three meals a day of Kumasawa-style mackerel cooking, won''t you?"'
1769: 'Kumasawa@r@v18/11800050."Hoh-hoh-ho, that is indeed harsh.@k@v18/11800051. It seems someone''s holding a grudge."'
1770: '@r@v99/awase0003."""Wahahahahaha!!!"""'
1771: '@rEveryone let out a huge laugh.'
1772: '@rAccording to Jessica, Kumasawa-san''s "mackerel jokes" were a type of running gag,@k and our parents had long since gotten used to it.'
1773: '@rKumasawa-san often claimed that mackerel contained precious nutrients that could do things such as prevent aging and make people smarter.'
1774: '@r...It seemed that while it couldn''t stop the outward signs of aging, it helped prevent aging on the inside.'
1775: '@rSince she was still healthy enough to tell these kinds of jokes at her age, that benefit must be the real thing.'
1776: 'Kumasawa@r@v18/11800052."Hoh-hoh-ho...@k@v18/11800053. Well then, if you''ll excuse me.@k@v18/11800054. Prepare yourself for tonight''s dinner!@k @v18/11800055.I''ll be cooking plenty of mackerel dishes for you to eat, so look forward to it!"'
1777: 'Rudolf@r@v08/11200108."Wahahaha, we sure will.@k@v08/11200109. I want to treat myself to some vinegared mackerel tonight!"'
1778: 'Rosa@r@v12/11400073."That sounds wonderful.@k@v12/11400074. I wonder if any delicious Japanese sake will be included."'
1779: 'Kumasawa@r@v18/11800056."Oh, it certainly will!@k @v18/11800057.How about some of our famous Rokkenjima mackerel liquor..."'
1780: '@r@o55.@v99/awase0004|08/11200110|12/11400075."""Wahahahahaha!!!"""'
1781: '@rKumasawa-san, together with Shannon-chan, bowed and pushed the serving cart away.'
1782: '@rAmusingly, Gohda-san, who looked just as though his stock had been stolen from him, explained very seriously that tonight''s dinner would actually be calf steak.'
1783: 'Shannon@r@v15/10500064."......Umm...@v15/10500065..........Kumasawa-san, ...thank you for doing that back there..."'
1784: '@rAs she pushed the serving cart, Shannon bowed her head very deeply.'
1785: 'Kumasawa@r@v18/11800058."Hoh-hoh-ho, I haven''t done a~nything that requires thanks."'
1786: '@rKumasawa played dumb, but it was no accident that she had thrown Shannon a lifeline.'
1787: '@rBack when Battler had asked for the details of the dessert, Shannon had unfortunately hesitated.'
1788: '@rThere may have been several ways to dodge the question, but all of them should have been delivered deftly.'
1789: '@rShannon, who hesitated when hard pressed for a response, was always suffering because of this small weakness.'
1790: '@rIf only Shannon, like Gohda, had a little of the craftiness needed to skillfully shake off a mistake, her days would be a little more comfortable.'
1791: '@r...This weakness was especially unfortunate considering how flawlessly she could handle her work.'
1792: '@rOf course, there were those who well understood Shannon''s meek nature and her inability to remember to gloss over her mistakes.'
1793: '@r...Which is why Kumasawa came to her aid without hesitation.'
1794: 'Kumasawa@r@v18/11800059."I just heard from Genji-san that there''s been a change to the afternoon shifts.@k@v18/11800060. I believe you were given a break until this evening.@k@v18/11800061. Hoh-hoh-ho, I am jealous."'
1795: 'Shannon@r@v15/10500066."Huh, ...ah, I''m sorry—I haven''t checked the list of shifts yet."'
1796: 'Kumasawa@r@v18/11800062."Ah, yes.@k@v18/11800063. I was thinking I might start cooking some mackerel in the oven.@k@v18/11800064. If you don''t mind, I would be happy if you would help out a bit before your break."'
1797: 'Shannon@r@v15/10500067."Ah, yes...!@k @v15/10500068.I would be delighted to help."'
1798: '@rTo Shannon, Kumasawa was like a mother among the servants.'
1799: '@rThe dining hall needed to be cleaned up, so we were chased out.@k@rInstead, tea would be served in the parlor.'
1800: '@rIt seemed that they would be preparing the black tea that Auntie Rosa had bought for Aunt Natsuhi.'
1801: '@rMaria insisted that she also wanted to drink the black tea, but was rejected by the old bastard, who told her and the rest of us kids to go play outside.'
1802: 'George@r@v07/10300183."Battler-kun, why don''t we all go for a walk outside?"'
1803: 'Hideyoshi@r@v06/11100103."Go look at the roses or something.@k@v06/11100104. But keep a close eye on the weather.@k@v06/11100105. The sky''s still clear, but the weather report kept on talkin'' about rain."'
1804: 'Maria@r@v13/10400222."Uu!@k @v13/10400223.I want the beach, want the beach!!"'
1805: 'Eva@r@v05/11000119."Ah, isn''t that a wonderful idea!@k@v05/11000120. Playing on a sandy beach isn''t something that you get to do often, is it?"'
1806: 'Jessica@r@v04/10200200."I guess not.@k@v04/10200201. Alright, let''s all go to the sandy beach then!"'
1807: 'Maria@r@v13/10400224."Uu! Let''s go, let''s go!"'
1808: 'Rosa@r@v12/11400076."Maria, be careful not to get your clothes wet.@k@v12/11400077. Your shoes, too."'
1809: 'Maria@r@v13/10400225."Uu!@k @v13/10400226.Won''t get wet!"'
1810: 'Kyrie@r@v09/11300067."*giggle*, so obedient and cu~te.@k@v09/11300068. Battler-kun, make sure you keep an eye out for Maria-chan, okay?"'
1811: 'Battler@r@v10/10100357."Sure thing, leave it to me!"'
1812: 'Rudolf@r@v08/11200111."Ohh? You''re pretty cute and obedient too when Kyrie asks you something, huh?@k@v08/11200112. ...Why don''t you try listening to me obediently for a change?"'
1813: 'Battler@r@v10/10100358."Heh!@k @v10/10100359.Hell no!@k @v10/10100360.Let''s go everyone, c''mon!"'
1814: '@rThe children flew out of the parlor.'
1815: '@rThey were replaced by Genji, who pushed a serving cart in and prepared the black tea.'
1816: '@rThe parlor was filled with a sublime aroma which entertained everyone while they waited to appease their thirst...'
1817: 'Krauss@r@v02/10800042."Hahahahaha...@k@v02/10800043. Rudolf, you and your family all seem to get along so well with each other.@k@v02/10800044. Good for you."'
1818: 'Rudolf@r@v08/11200113."Oh, please—you have us beat on that front."'
1819: 'Eva@r@v05/11000121."So true.@k@v05/11000122. Jessica-chan really has grown into an innocent little thing, hasn''t she?@k@v05/11000123. It''s all the fruit of your training, isn''t it, Natsuhi nee-san?"'
1820: 'Natsuhi@r@v03/10900038.".........Thank you."'
1821: '@rNatsuhi answered coldly.'
1822: '@r...With that, the conversation halted, and the parlor became silent.'
1823: '@rPossibly because he couldn''t stand it anymore, Hideyoshi broke the silence while performing an exaggerated gesture.'
1824: 'Hideyoshi@r@v06/11100106."Still, they sure do grow fast.@k@v06/11100107. ...I thought they''d be kids forever, but they''ve been gettin'' huge right before my eyes, and before I knew it, they''ve joined the ranks of us adults.@k@v06/11100108. Battler-kun, for one, is beyond recognition!"'
1825: 'Kyrie@r@v09/11300069."His body has gotten much bigger, but he is still a child.@k@|@y@v09/11300070. Well, my husband is still a child as well."'
1826: 'Rosa@r@v12/11400078."...I wonder where the border between child and adult is.@k@v12/11400079. I still don''t feel as though I''ve grown up."'
1827: 'Krauss@r@v02/10800045."Hmph, isn''t that pitiful.@k@v02/10800046. That''s not something the mother of a child should say."'
1828: 'Eva@r@v05/11000124."That''s right.@k@v05/11000125. We''re not children anymore.@k@v05/11000126. We are all adults.@k@v05/11000127. So I would like it if we could all hold an intellectual discussion without becoming emotional."'
1829: '@rWhen Eva smiled with sharp sarcasm, everything seemed to get more tense.'
1830: '@r...It felt like the smell of the tea that had been prepared so carefully just flew out the window.'
1831: 'Krauss@r@v02/10800047."We have always strived to hold intellectual discussions.@k@v02/10800048. ......Your sarcasm is ill-placed sometimes.@k@v02/10800049. You''ve never changed in that respect."'
1832: 'Eva@r@v05/11000128."...''Always strived'', is it?@k @v05/11000129.My, my.@k@v05/11000130. I wish I could wrap those words up and send them to this room a few decades ago.@k@|@y@v05/11000131. Right, Rosa?"'
1833: 'Rosa@r@v12/11400080.".................."'
1834: '@rRosa smiled with a vague expression.@k@r...Whether she agreed or disagreed, she knew that she would earn the displeasure of either her brother or her sister.'
1835: '@rIt was a bit of worldly wisdom she had needed to learn as the youngest sibling.'
1836: 'Rudolf@r@v08/11200114."Quit it, Aneki.@k@v08/11200115. We should enter into the main topic while the brats aren''t around, right?@k@v08/11200116. Let us make that our intellectual discussion."'
1837: '@rAs Rudolf glanced over the faces of all present, some let out a slight sigh and some let a small look of resignation cross their face.'
1838: '@r......This was the unavoidable...@w500.true agenda.'
1839: 'Rudolf@r@v08/11200117."Last year, his life expectancy was estimated at about three months.@k@v08/11200118. Which means he''s already at minus nine.@k@v08/11200119. The Grim Reaper could come flying through the window in a blind panic at any moment."'
1840: 'Natsuhi@r@v03/10900039.".........The family head is still in good health.@k@v03/10900040. Raising such an inappropriate topic while the sun is still bright...I must question whether you are in your right mind, Rudolf-san."'
1841: 'Hideyoshi@r@v06/11100109."Still, Natsuhi-san.@k@v06/11100110. ...If we don''t discuss this until somethin'' happens, it''ll be too late.@k@v06/11100111. He''s still healthy now, so we''ve gotta figure out something while we still have some time left over.@k@v06/11100112. It''s a kind of financial etiquette."'
1842: 'Krauss@r@v02/10800050."It seems as though everyone is concerned about Father.@k@v02/10800051. ...Doctor Nanjo.@k@v02/10800052. Could we hear the details from you?@k@v02/10800053. It seems as though they are also hoping for that."'
1843: 'Nanjo@r@v19/11900044.".....................*cough*."'
1844: '@rNanjo, standing by the window and staring out at the rose garden, let out a single cough when he realized that he was being called.'
1845: 'Rosa@r@v12/11400081."......Doctor Nanjo.@k@v12/11400082. ...How is Father''s condition?"'
1846: 'Nanjo@r@v19/11900045."Well, first...@k@v19/11900046. My estimate last year that he had only three months to live still appears to be making its presence felt, so allow me to start by correcting it."'
1847: 'Eva@r@v05/11000132."No need to explain.@k@v05/11000133. You''re saying that measuring remaining life is only a prediction, not a promise, right?"'
1848: 'Nanjo@r@v19/11900047."...That is correct.@k@v19/11900048. Because of that, I can offer no definitive answer to the question you all so often ask me, of when he will pass away.@k@v19/11900049. A human''s life is supported by their body and their mind.@k@v19/11900050. ...If the body is weak, the situation becomes more dangerous, but if the mind is strong enough to compensate for that weakness, it is possible to maintain a state of remission."'
1849: 'Kyrie@r@v09/11300071."So you''re saying that even if his body is weak, his mind is still firm and spirited."'
1850: 'Rudolf@r@v08/11200120.".........Kyrie, sorry, but please stay quiet for a while."'
1851: 'Kyrie@r@v09/11300072."......Sorry."'
1852: 'Nanjo@r@v19/11900051."That is correct.@k@v19/11900052. Kinzo-san''s body has been ravaged by disease.@k@v19/11900053. With him continuing to partake of that kind of strong liquor on top of all that, I really must think..."'
1853: 'Rudolf@r@v08/11200121."So booze is the reason he''s teetering on the edge.@k@v08/11200122. And booze is also the reason he''s hanging on.@k@v08/11200123. Sounds like Dad, the heavy drinker."'
1854: 'Eva@r@v05/11000134."Well then, Doctor, I know you can''t give anything more than a prediction...@k@v05/11000135.......but what do you think about Father''s chances of living until this day next year...?"'
1855: 'Natsuhi@r@v03/10900041."That is quite the rude question to ask about the head."'
1856: '@rNatsuhi jumped on Eva, unable to hide her astonished expression.'
1857: '@rIn response, Eva returned a defiant look, but Hideyoshi noticed and tried to smooth things over with a forced smile.'
1858: 'Hideyoshi@r@v06/11100113."Ah, Natsuhi-san, forgive her!@k @v06/11100114.Eva, try and choose your words a bit more carefully, okay?"'
1859: 'Eva@r@v05/11000136."I''m sorry.@k@v05/11000137. I was just so concerned over Father''s condition.@k@v05/11000138. *giggle*."'
1860: 'Natsuhi@r@v03/10900042."............Is that so?@k@v03/10900043. I hadn''t realized."'
1861: 'Krauss@r@v02/10800054."Doctor Nanjo, please tell us.@k@v02/10800055. For the sake of the beautiful family love of a daughter worried about her father''s lifespan."'
1862: '@rKrauss laughed sarcastically, and Eva, smiling sweetly, returned an identical chuckle.'
1863: 'Nanjo@r@v19/11900054."...You ask whether he will still be healthy next year,@k@v19/11900055. ......but it is a very difficult question for me as a doctor.@k@v19/11900056. While I do think this remission will last for a while yet,@v19/11900057. if he suffers some kind of fit, there may be nothing we can do."'
1864: 'Nanjo@r@v19/11900058."......After all, Rokkenjima is a solitary island.@k@v19/11900059. It is not as though an ambulance can come rushing in to save him.@k@v19/11900060. Normally, I would want to have him hospitalized in a large hospital on the mainland, but..."'
1865: 'Krauss@r@v02/10800056."Father stated that he does not want his noble research interrupted.@k@v02/10800057. ......It seems he holds a grudge over the way we tried to force him out last year.@k@v02/10800058. Apparently, he strongly suspects that he''ll be shut away in some hospital if he goes outside.@k@v02/10800059. And that''s how things are now."'
1866: 'Rosa@r@v12/11400083."Has Doctor Nanjo been examining him?"'
1867: 'Krauss@r@v02/10800060."Father trusts Doctor Nanjo.@k@v02/10800061. ...It seems he can be examined when in a good mood."'
1868: 'Nanjo@r@v19/11900061."......I can examine his condition, but if I try to recommend medicine or hospitalization, he refuses to listen.@k@v19/11900062. ......I''ve really only been able to look."'
1869: 'Hideyoshi@r@v06/11100115."It''s true that there are people that hate doctors...@k@v06/11100116. Still, what a hassle!"'
1870: '@rNanjo sighed deeply.@k@rThe purpose of an examination was to determine what medical treatment was appropriate.'
1871: '@rReceiving an examination and then not following the advice given made the whole thing pointless...'
1872: 'Rudolf@r@v08/11200124."Then, in summary,@k@v08/11200125. his expected life is still three months,@k@v08/11200126. and there''s no way to guess how long he will continue to live while still on the verge of death."'
1873: 'Natsuhi@r@v03/10900044.".........Rudolf-san.@k@v03/10900045. Couldn''t you be more discreet with your words?"'
1874: 'Rudolf@r@v08/11200127."Ah, sorry.@k@v08/11200128. I''ve always talked this way.@k@v08/11200129. Cut me a break."'
1875: 'Rosa@r@v12/11400084."I understand Doctor Nanjo''s opinion.@k@v12/11400085. ......What do you think, Krauss nii-san?"'
1876: 'Krauss@r@v02/10800062."......Hmph.@k@v02/10800063. To be perfectly honest, I have to disagree with Doctor Nanjo.@k@v02/10800064. I find it truly difficult to think of Father as a person so sick that he has only three months to live.@k@v02/10800065. His yell is as healthy as ever, and I still get the chills at the thought of his fists raining down on me.@k@v02/10800066. ......Pushing the task of caring for Dad solely on the shoulders of the eldest son is far from fair."'
1877: 'Rudolf@r@v08/11200130."Hahhaha.@k@v08/11200131. In the next world, be born after me."'
1878: 'Rudolf@r@v08/11200132.".........Alright, let''s return to our discussion.@k@v08/11200133. In that case, according to the impartial and neutral doctor''s opinion, it wouldn''t be odd for him to go any time.@k@v08/11200134. Sorry, Aniki, but I''d rather trust the opinion of a specialist.@k @v08/11200135.With that, I believe the discussion of Dad''s fortune is no longer a premature topic."'
1879: 'Eva@r@v05/11000139."Father''s personal funds probably reach into the tens of billions of yen, right?@k @v05/11000140.But, it''s not as though all of that is neatly gathered as ready cash.@k@v05/11000141. It''s not as simple as neatly cutting a birthday cake with a knife."'
1880: 'Rudolf@r@v08/11200136."...Interesting metaphor, Aneki.@k@v08/11200137. That''s right, sometimes strawberries or chocolates are placed on top of the cake, making it hard to cleanly divide it into equal parts.@k@v08/11200138. Taking that into consideration, I think it''s important to first discuss how best to stick the knife in, don''t you...?"'
1881: 'Natsuhi@r@v03/10900046."I truly don''t understand you all. Even while the head is still alive, you''re discussing the matter in loud voices as though he were already dead."'
1882: 'Eva@r@v05/11000142."Come now, don''t you see how important this is?@k @v05/11000143.After all, when the time comes, the inheritance of his fortune must be carried out immediately, right?@k @v05/11000144.Moreover, the wealth of the glorious Ushiromiya house is vast.@k@v05/11000145. Don''t you understand that a careful discussion is necessary beforehand?@k@|@y@v05/11000146. There''s a huge difference between the assets of this family and your old one."'
1883: 'Natsuhi@r@v03/10900047."......How rude.@k@v03/10900048. The family I was born to has nothing to do with this."'
1884: '@rAs Natsuhi resentfully responded in a low voice, the already dark atmosphere grew even more hostile...'
1885: 'Hideyoshi@r@v06/11100117."Give it a rest, Eva...@k@v06/11100118. Natsuhi-san, forgive us!@k @v06/11100119.Pardon her rudeness."'
1886: '@rHideyoshi tried to smooth things over by glancing at both with a forced smile, but it only resulted in making the hostility between Eva and Natsuhi even more intense...'
1887: 'Nanjo@r@v19/11900063."............It seems that I will just be in the way if I stay any longer.@k@v19/11900064. Please excuse me."'
1888: '@rNanjo rose from his seat and exited the parlor.'
1889: '@r......This may well have been a normal act of courtesy expected of an outsider, but even so, his back was watched by several glances envious of his ability to escape.'
1890: '@rAfter the doctor had exited and his footsteps had disappeared into the distance, Krauss recrossed his legs.'
1891: 'Krauss@r@v02/10800067."So let me see if I understand your point of view correctly.@k@v02/10800068. ......Father''s remaining life is short.@k@v02/10800069. You want to quickly enter into a practical conference concerning the distribution of the inheritance.@k@v02/10800070. ......Why are you so eager, I wonder?"'
1892: 'Krauss@r@v02/10800071."Certainly, as you say, estimating and distributing the Ushiromiya family''s wealth is no simple task.@k@v02/10800072. In that case, shouldn''t we carefully and deliberately calculate?@k @v02/10800073.It seems to me that you are all impatient to split up the cake tonight.@k@v02/10800074. That''s true, isn''t it, Rosa?@k@v02/10800075. Is something making you impatient?"'
1893: 'Rosa@r@v12/11400086."...............It''s not that we''re impatient.@k@v12/11400087. ...But a decision between the siblings is essential.@k@v12/11400088. It doesn''t matter when,@k@v12/11400089. but if Father''s condition is worsening, and the day is drawing near,@k@v12/11400090. discussing the matter beforehand...isn''t what I would call impatience..."'
1894: '@rRosa sneaked a glance at Eva and Rudolf.@k@r...As the youngest daughter in the family, being cross-examined by the eldest was harsh.'
1895: 'Krauss@r@v02/10800076.".........Hoh.@k@v02/10800077. Is that your true opinion?@k @v02/10800078.I didn''t expect that the most honest and pure-hearted of the siblings would say something like that.@k@v02/10800079. I wonder if those two told you to say that...?"'
1896: 'Rosa@r@v12/11400091."........................"'
1897: 'Rudolf@r@v08/11200139."Quit it, Aniki.@k@v08/11200140. Rosa is a sibling just like the rest of us.@k@v08/11200141. She has a fair right to Dad''s inheritance.@k@v08/11200142. It''s obvious she would be interested, right?@k@v08/11200143. ...After all, Dad will definitely die, and that''s not something that''ll happen in the distant future."'
1898: 'Rudolf@r@v08/11200144."......On the contrary, Aniki, you are far too relaxed.@k@v08/11200145. It seems almost as though you would like nothing better than to turn the discussion away from the distribution of the inheritance."'
1899: 'Natsuhi@r@v03/10900049.".........What do you mean by that?@k@v03/10900050. Are you trying to accuse my husband of something?"'
1900: 'Hideyoshi@r@v06/11100120."Calm down, Natsuhi-san.@k@v06/11100121. Listen to what we have to say..."'
1901: 'Eva@r@v05/11000147."Nii-san, I hear these are very good times nowadays.@k @v05/11000148.That''s right, since last year the yen has just been going up and up thanks to the unprecedented boom in prosperity.@k@v05/11000149. It seems that it''s no longer a dream that the dollar will reach 100 yen."'
1902: 'Eva@r@v05/11000150."Also, the ruling party says that it will establish a health resort maintenance law by next year.@k@v05/11000151. At this moment, resort development companies across Japan are running about trying to gather as much capital as they can."'
1903: 'Krauss@r@v02/10800080."......You know your stuff.@k@v02/10800081. Soon, Japan will see an unprecedented boom.@k@v02/10800082. Just like when Father revived the Ushiromiya family—another case like the Korean war demands."'
1904: 'Krauss@r@v02/10800083."......The people of Japan have worked at a frenzied pace, realized vast economic growth, and become the most prosperous people in the world; they are enjoying the height of their prosperity.@k@v02/10800084. Private spending has increased, and institutions that can profit from that can make easy money in this era."'
1905: 'Krauss@r@v02/10800085."The people''s needs are no longer merely the essential three electrical appliances.@k@v02/10800086. Places to ski, to golf, public pools.@k@v02/10800087. Resort hotels and theme parks!"'
1906: 'Krauss@r@v02/10800088."Have you gone to Delsney Land, which opened just a few years ago?@k @v02/10800089.What an excellent theme park that is!@k @v02/10800090.In that place, even an adult can be a kid and have fun with his family."'
1907: 'Krauss@r@v02/10800091."The old era, where the only virtue was to selflessly devote yourself to your country while failing to consider your family, is ending.@k@v02/10800092. Now, as the most prosperous people in the world, we can finally accept that."'
1908: 'Hideyoshi@r@v06/11100122."Krauss nii-san, your foresight is somethin'' else.@k@v06/11100123. ...When I heard this several years ago, I thought it was ridiculous.@k@v06/11100124. ......But see, when I heard about the G5 nations'' Plaza Accord, that changed."'
1909: 'Hideyoshi@r@v06/11100125."The yen''s gettin'' stronger and stronger, and the price of land will skyrocket soon, I bet.@k@v06/11100126. The day that Japan becomes the economic center of the world isn''t far off.@k@v06/11100127. ......You have a very forward looking view.@k@v06/11100128. There''s no mistakin'' that at least."'
1910: 'Rudolf@r@v08/11200146."I feel the same as Hideyoshi nii-san.@k@v08/11200147. Aniki, you can read into the next decade of history.@k@v08/11200148. That keen sense surely came from Dad.@k@v08/11200149. It''s incredible."'
1911: 'Rudolf@r@v08/11200150."......However, unlike Dad, there have been cases where the timing of your predictions has been mistaken, haven''t there?"'
1912: 'Eva@r@v05/11000152."Nii-san, believing that Japan will definitely face an economic boom, you have been launching resort projects everywhere, and almost all of them continue to fail.@k@v05/11000153. ...While I''m sure that the era you predicted is arriving, it seems that you misread the timing of that boom."'
1913: 'Eva@r@v05/11000154."......You were too early.@k@v05/11000155. And then you hurriedly tried to sell everything off, and as a result opened the wound even further.@k@v05/11000156. ...If your nose was really so reliable and you predicted the coming of a boom, then there should be no reason for you to sell off your property.@k@v05/11000157. Isn''t this proof that you don''t trust your own ability?"'
1914: 'Natsuhi@r@v03/10900051."......How rude!@k @v03/10900052.Are you trying to insult my husband?"'
1915: '@rNatsuhi''s forehead creased as she rose from the sofa.'
1916: '@rEva, paying this no heed, stared at Krauss with a confident smile.'
1917: '@r...Krauss, who also maintained his confident appearance, told Natsuhi to sit down.'
1918: 'Krauss@r@v02/10800093."Please stop, Natsuhi.@k@v02/10800094. My little sister is incapable of speaking any other way and always has been.@k@v02/10800095. ...Calm yourself a little.@k@v02/10800096. Your headache will get worse."'
1919: 'Eva@r@v05/11000158."Proof that you have no talent is also right here.@k@v05/11000159. ............After all, Nii-san, weren''t you all excited about turning this island into a resort?@k @v05/11000160.Building a wonderful resort hotel, beautifully maintaining the garden.@k@v05/11000161. I''m just an amateur and don''t pretend to understand, but you must have used a significant amount of money, right?"'
1920: 'Natsuhi@r@v03/10900053."What are you trying to say?!@k @v03/10900054.My husband''s business has nothing to do with you!"'
1921: 'Rudolf@r@v08/11200151."Actually, that''s not true, Natsuhi-san.@k@v08/11200152. Rokkenjima is not Aniki''s.@k@v08/11200153. It is Dad''s.@k@v08/11200154. The hotel that was constructed is Aniki''s, of course.@k @v08/11200155.If you like, you can charge us lodging fees tonight.@k@v08/11200156. Right, Rosa?"'
1922: 'Rosa@r@v12/11400092."...............Well, hmm.@k@v12/11400093. ...If what I have on hand will suffice."'
