109: 'Nanjo@r@v19/11900001."............You''ve...@k@v19/11900002.been indulging in alcohol again, haven''t you?"'
110: '@rThe old physician let out a sigh as he removed the stethoscope.'
111: '@rTwo elderly men could be seen in the dimly lit study, which was filled with dust and a sickly sweet stench.'
112: '@rIn the corner of this room, which was much larger than what most people would call a study,@k there was an expensive-looking bed, a man undergoing a medical examination, and the physician conducting it.@k@rThere was also what appeared to be a servant watching over the whole scene.'
113: 'Kinzo@r@v01/11500001."The bottle is my friend.@k@v01/11500002. It is no less of a friend than you, and it has stood by my side even longer than you have."'
114: '@rThe man who had bared his chest for the stethoscope spoke unapologetically as he straightened out his clothes.'
115: 'Nanjo@r@v19/11900003."............Kinzo-san.@k@v19/11900004. ...Your body only appears to be well thanks to the effects of the medicine.@k@v19/11900005. However, if you continue to drink such strong spirits, the treatment will become meaningless.@k@v19/11900006. ...Trust my judgment.@k@v19/11900007. Temper your drinking."'
116: 'Kinzo@r@v01/11500003."I thank you, though only for the sentiment,@k@v01/11500004. my friend.@k@v01/11500005. .........Genji.@k@v01/11500006. Another glass.@k@v01/11500007. Water it down slightly.@k@v01/11500008. That way Nanjo can save face."'
117: 'Genji@r@v14/11600001.".........Are you quite sure?"'
118: '@rAfter eyeing both the master who demanded the alcohol and his doctor who forbade it,@k@|@y Genji, the old butler, silently gave a slight nod and carried out his master''s orders faithfully.'
119: '@rNanjo, the man''s personal doctor, let out a deep sigh once again as he watched the butler busy himself alongside the liquor cabinet...'
120: '@rThere was a smell filling up the room.'
121: '@r...This sweet, poisonous aroma felt as though it melted the heart, if not the soul itself.@k It was the smell of that venomous green drink that the man couldn''t bring himself to part from.'
122: 'Kinzo@r@v01/11500009."......Nanjo.@k@v01/11500010. You are my close friend of many years.@k@v01/11500011. I am deeply grateful for all that you have done to keep me alive this long."'
123: 'Nanjo@r@v19/11900008."I have done nothing.@k@v19/11900009. ......After all, you never listen to my advice as your physician."'
124: 'Kinzo@r@v01/11500012."Hahahaha...@k@v01/11500013. And you never listen when I warn you about a mistaken chess move you''re about to make.@k@v01/11500014. It seems we are even."'
125: 'Genji@r@v14/11600002."......My lord."'
126: 'Kinzo@r@v01/11500015."Thank you.@k@v01/11500016. ......I wouldn''t die if I ran out of your medicine, but I would if I ran out of this."'
127: '@rWith one eye on Nanjo, who had his face set in a resigned expression, Kinzo took the glass that Genji was holding out to him.'
128: '@r...There are probably very few people who would associate the venomous color which filled the glass with an alcoholic beverage.'
129: 'Kinzo@r@v01/11500017.".........Nanjo.@k@v01/11500018. Be honest with me.@k@v01/11500019. How much time do I have left?"'
130: 'Nanjo@r@v19/11900010."Well now...@k@v19/11900011. How short must I make it to get you to stop drinking?"'
131: '@rNanjo once again let out a sigh of resignation.@k@rAs he watched Kinzo down the glass regardless, he spoke.'
132: 'Nanjo@r@v19/11900012.".........You don''t have much time."'
133: 'Kinzo@r@v01/11500020."...What precisely do you mean by that?"'
134: 'Nanjo@r@v19/11900013."......Let us illustrate it with the chess game here.@k@v19/11900014. You are closing out the game quite well, but I do not ultimately see you cornering my king."'
135: '@rNanjo''s gaze was directed at a side table with a stately chess set placed on top of it.'
136: '@rJudging by the positioning of the pieces, the match was well into the endgame.@k@rThe black rook and bishop were cutting deeply into the enemy lines.'
137: '@rThe white king had already been castled and cornered, so that even an amateur could see that the match would reach its conclusion before too long.'
138: '@rEvery time Nanjo came to give a medical examination, both of them would make a few moves.'
139: '@rNanjo was stating with confidence that Kinzo would most likely fall into his eternal sleep before this game could be concluded.'
140: '@r...These were less the words of a physician than they were the words of an old friend.'
141: 'Nanjo@r@v19/11900015."............Were you a normal patient,@v19/11900016. I would recommend that you write a will at this point."'
142: 'Kinzo@r@v01/11500021."......And what is a will, Nanjo?@k@v01/11500022. Handwritten instructions to the vultures on how to devour and scatter my corpse?"'
143: 'Nanjo@r@v19/11900017."No, not at all.@k@v19/11900018. ......As the word suggests, it is a way for you to record your will for later generations.@k@v19/11900019. It is far more than just a means to divide up your inheritance."'
144: 'Kinzo@r@v01/11500023."Hoh.@k@v01/11500024. ......And apart from the division of the inheritance, what might I write of?"'
145: 'Nanjo@r@v19/11900020."............Oh, there''s your regrets...@v19/11900021.and matters you have left unfinished.@k@v19/11900022. Things you want to be passed down...@v19/11900023....and things you want to tell.@k@v19/11900024. ......Anything you want."'
146: 'Kinzo@r@v01/11500025."......Hmph.@k@v01/11500026. .........Things I want to be passed down and things I want to tell?@k @v01/11500027.Ridiculous.@k@v01/11500028. I, Ushiromiya Kinzo, have not one thing I want to tell or leave behind!!"'
147: 'Kinzo@r@v01/11500029."I was born with nothing.@k@v01/11500030. I will die with nothing!@k @v01/11500031.There is nothing I wish to leave to my foolish children!!@k @v01/11500032.Even if the end were to come today - even if it were to come right now!@k @v01/11500033.I shall accept this fate of death without a trace of fear!!"'
148: 'Nanjo@r@v19/11900024_1."......Kinzo-san."'
149: 'Kinzo@r@v01/11500034."I created everything.@k@v01/11500035. My fortune!@k @v01/11500036.My prestige!@k @v01/11500037.Everything!!@k @v01/11500038.Those were built up by me, and they will be lost along with me.@k@v01/11500039. There is nothing I wish to leave behind!!"'
150: 'Kinzo@r@v01/11500040."Nothing!!@k @v01/11500041.After I''m gone, I care not if it all goes to waste!@k @v01/11500042.I desire no tomb, no coffin!!@k @v01/11500043.Those were the terms of the contract I made with the witch!@k @v01/11500044.When I die, everything will be lost!@k @v01/11500045.That has been part of the promise since the beginning, and that''s why nothing will be left behind.@k@v01/11500046. There is nothing I can leave behind!!"'
151: '@rAfter reaching a furious crescendo, Kinzo suddenly slumped over.'
152: '@r...His expression was limp and feeble, as though an evil spirit had possessed him and then left.'
153: 'Kinzo@r@v01/11500047."..................@k@v01/11500048. However, I do have one regret.@k@v01/11500049. I have nothing to leave behind, but there is one thing I cannot leave undone..."'
154: 'Nanjo@r@v19/11900025.".........You would do well to write it down.@k@v19/11900026. Of course, it would be best if you could finish it before your time comes.@k@v19/11900027. However, even if the worst happens, those who come after you will carry it to completion.@k@v19/11900028. You must leave behind your regrets so that they can be resolved even if you are unable to do so yourself.@k@v19/11900029. ......That is the purpose of a will."'
155: '@rWhen Nanjo tried to gently pat Kinzo''s shoulder, the dying man flew into a sudden rage and batted away Nanjo''s hand.'
156: 'Kinzo@r@v01/11500050."That is no good, no good, no good!!"'
157: 'Kinzo@r@v01/11500051."It must be done while I still live! At the moment of my death, my soul will be devoured by the demons of the contract and wiped out of existence!@k @v01/11500052.For me, there will be no peace or another world after death!@k @v01/11500053.That''s why everything must be done before I go!!@k @v01/11500054.That''s why a will has no meaning for me!!"'
158: 'Kinzo@r@v01/11500055."And if I had the time to write such a thing...@v01/11500056. ...If I had such time to spare!!@k @v01/11500057....I''d want to see it.@k@v01/11500058. I''d want to see it one more time!@k @v01/11500059.I want to see BEATRICE''s smiling face one last time!!"'
159: 'Kinzo@r@v01/11500060."Oh, BEATRICE, why do you resist me so?!@k @v01/11500061.I would return everything you have given me right this very moment - I am prepared to lose everything!!@k @v01/11500062.So please, show me your smile just one more time..."'
160: 'Kinzo@r@v01/11500063."BEATRICE, I beg of you - you must be able to hear this final plea - that''s the kind of woman you are!@k @v01/11500064.I beg of you, show yourself to me!!@k @v01/11500065.You''re here, aren''t you?!@k @v01/11500066.You''re standing there invisible, listening to every word I say, and even now you''re mocking me from somewhere in this room, aren''t you?!"'
161: 'Kinzo@r@v01/11500067."Please, appear before me one more time and smile!!@k @v01/11500068.Feel free to scold me, even snatch away my life by your own hands if you wish!!@k @v01/11500069.I don''t want to die alone like this!!@k @v01/11500070.I cannot let myself die until I''ve seen your smile just one more time!!"'
162: 'Kinzo@r@v01/11500071."Aah, BEATRICE, BEATRICE!!@k @v01/11500072.I offer up this life of mine, I offer it up to you!!@k @v01/11500073.I''m begging you, BEATRICEEEEEE!!!"'
163: 'Battler@r@v10/10100001."Whoa...@k@v10/10100002. Things sure move with the times...@k@v10/10100003. I can''t believe we''ll be able to make the trip in just twenty minutes..."'
164: '@rI couldn''t help but scratch my head and marvel at how far things have come in recent years.@k@rWe used to go by boat.'
165: '@rBack then, we were all forced to endure nearly half a day of swaying back and forth over the sea before we reached Niijima.@k Things have gotten so much more convenient these days.'
166: '@rStill, I''ve never been on a plane this small.@k@rI''ve flown in a huge jumbo jet before, but this will be my first experience in such a tiny one.'
167: '@r...It''s going to shake, isn''t it...@k They say that smaller boats shake more, so I guess the same rule probably applies to planes.'
168: '@r...Aaah, just spare me.'
169: 'George@r@v07/10300001."Haahahaha, don''t worry, Battler-kun.@k@v07/10300002. It''ll shake much less than that boat did."'
170: 'Battler@r@v10/10100004."Gyah?! ...I-is that you, George-aniki?!"'
171: 'Battler@r@v10/10100005."Heheh, don''t scare me like that... You just shaved three years off my life.@k@v10/10100006. Anyway, what''s shaking got to do with anything?"'
172: 'Battler@r@v10/10100007."Ihihihi, you don''t think I''m actually scared of the plane shaking or maybe falling out of the sky or something, ri~ght?"'
173: 'George@r@v07/10300003."Oh, of course not, my mistake.@k@v07/10300004. I''m sure that you''ve changed a lot since we last saw you.@k@v07/10300005. After all, it''s been six years since then.@k@v07/10300006. You''re not a kid anymore.@k@v07/10300007. Hahahahaha."'
174: 'Battler@r@v10/10100008."Sheesh, and here you are, old enough to smoke and drink.@k@v10/10100009. I''ve got no interest in smoking, but I''ve always wanted to try some booze, heheheh!@k @v10/10100010.Well, if you''ve got your dad''s genes, I''ll bet you can hold your own when it comes to drinking, right?"'
175: 'George@r@v07/10300008."Well, I usually drink for business rather than pleasure.@k@v07/10300009. It''s pretty hard to do business in Japan without it."'
176: 'Battler@r@v10/10100011."Ihihihi!@k @v10/10100012.That''s exactly right!@k @v10/10100013.So I was thinking I''d take my first shot at it tonight at dinner!"'
177: 'George@r@v07/10300010."Th-that''s no good, Battler-kun, you''re still a minor!@k @v07/10300011.Drinking alcohol is known to stunt the growth of minors and...@v07/10300012....um, never mind."'
178: 'Battler@r@v10/10100014."Come on, I''m tall enough already!@k @v10/10100015.In fact, it''d be easier to find clothes if I shrunk a little!"'
179: '@rI puffed my chest out proudly.'
180: '@rUntil I hit my growth spurt, my height was below average in my class.'
181: '@rBut then, I grew and grew, and before I knew it, I was over 180 cm.'
182: '@rI guess I have all that muscle training and those shady mail-order performance-enhancing drugs to thank for that.'
183: '@rBefore then, I''d never dreamed that I''d shoot ten centimeters above George-aniki, who''d reached his peak height early on.'
184: '@r......Damn, I''ll bet my relatives all say "look how big you''ve grown, Battler-chan!" or something.'
185: '@r...That kind of thing is really embarrassing, so I hope they cut me a break.'
186: '@rAnyway, my name, "Battler"...@k...well, it''s pretty damn weird, don''t you think?'
187: '@rI''ve got to wonder what my parents were thinking when they gave me that name.@k@rI''ve never met anyone who could read it right the first time.'
188: '@rI usually get called "Sento-kun".@k@rToo bad, swing and a miss.'
189: '@rMy name is written 右代宮 戦人.@k@rCan you read it?@k The first part is my family name, "Ushiromiya".@k That''s a fairly plausible Japanese pronunciation so far.'
190: '@rThe problem is my own name.@k@r.........戦人 is made up of the characters for "fight" and "person", and it''s pronounced "Battler".'
191: '@rPut it all together, and you''ve got Ushiromiya Battler.'
192: '@rPretty crazy, right?@k It''s crazy enough that my parents decided to call me that, but it''s even more crazy that some government worker let them make it official.@k ...Both groups are at the top of my must-kill list.'
193: '@rAnyway, this is one of my cousins.'
194: '@rHis name is 右代宮 譲治, pronounced Ushiromiya George.'
195: '@rHe''s five years older than me, so he''s probably turning 23 this year.@k@rSince the Ushiromiya cousins consist of two boys and three girls, I ended up playing with George all the time.'
196: '@rAnd because I''ve always thought of him as a big brother, I still call him "Aniki" today.'
197: 'Hideyoshi@r@v06/11100001."Whoo, Battler-kun, look how big you''ve gotten.@k@v06/11100002. You know what they say, "leave a boy for three days and you''ll hardly recognize him"!"'
198: 'Eva@r@v05/11000001."It must be in his blood, I suppose.@k@v05/11000002. Rudolf wasn''t that tall either until around his high school years.@k @v05/11000003.Perhaps people end up taller if their growth spurt comes late."'
199: 'Battler@r@v10/10100016."Nah, it''s nothing special.@k@v10/10100017. A real man needs to be tough on the inside too!"'
200: 'Hideyoshi@r@v06/11100003."Exactly!@k @v06/11100004.Battler-kun here knows how it works!@k @v06/11100005.Real men win or lose based on what they''ve got on the inside!@k @v06/11100006.Can''t ever forget to keep up your trainin'' and discipline.@k@v06/11100007. You do that, wait verrry alertly for the perfect moment...and strike!"'
201: 'Hideyoshi@r@v06/11100008."Now, even I never imagined that I''d become the company president I am today, master of my own domain...@k@v06/11100009. Yep, to think I''ve come this far after starting out penniless and ruined...!"'
202: '@rThis portly and slightly chubby man...@|@yis George-aniki''s dad, Uncle Hideyoshi (秀吉).'
203: '@rHe''s the husband of Dad''s older sister.@k@rIn other words, we''re not blood-related.'
204: '@rHe''s nice to children, sociable all the time, even quick to give out some spending money to us kids - simply put, he''s an awesome uncle.'
205: '@rHe speaks in an odd and very noticeable Kansai-style dialect seemingly of his own creation, but he''s actually a natural-born Kanto man.'
206: '@rApparently, leaving an impression is everything in the business world,@k so speaking in a different style than other people is an act that makes him stick out more.'
207: '@r......However, I hear that he gets embarrassed when talking within earshot of a real Kansai person, so he switches back to standard Japanese.'
208: '@r...I don''t really get it, but he''s definitely an interesting person.'
209: 'Eva@r@v05/11000004."If only you weren''t so quick to brag about your life''s story.@k@v05/11000005. That''s enough for now, I think.@k@v05/11000006. I''m sure Battler-kun''s getting tired of it.@k@v05/11000007. Aren''t you?"'
210: 'Battler@r@v10/10100018."Nope, not at all, hihihi!@k @|@y@v10/10100019.Nothing wrong with that.@k@v10/10100020. I think it''s pretty cool for a man to have some stories he can brag about.@k@v10/10100021. I don''t have anything like that at all."'
211: 'Eva@r@v05/11000008."Oh, really?@k @v05/11000009.I''d imagine a man with your looks would leave girls crying left and right, so I have trouble believing that you have nothing at all to brag about..."'
212: 'Battler@r@v10/10100022."Nonononono!@v10/10100023. Y-y-@v10/10100024.you''re joking, right?!@k @v10/10100025.Of course nothing weird like that''s ever happened to me!@k @v10/10100026.In fact, if you know anyone, I''m all ears!"'
213: 'Eva@r@v05/11000010."Oh, I''m sure you do have some stories!@k@v05/11000011. ...*giggle* You must tell your aunt all about it later.@k@|@y@v05/11000012. After all, George never comes to me with anything of the sort.@k@v05/11000013. Heheheh..."'
214: '@rThis is my aunt and George-aniki''s mother, Auntie Eva (絵羽).'
215: '@rShe''s my dad''s older sister.@k@rShe and Uncle Hideyoshi are a pair of jokers, and they''ve always teased me back as far as I can remember.'
216: '@rThis sometimes made them a bit hard to get along with when I was small.@k@r...That said, I''m currently in the process of discovering that they still are hard to get along with.'
217: '@rEven so, George-aniki''s family is interesting and fun, and they seem to get along just fine.'
218: '@r......Sheesh, that''s pretty much the total opposite of my family.'
219: 'Kyrie@r@v09/11300001."Battler-kun,@k@v09/11300002. have you seen Rudolf-san?"'
220: 'Battler@r@v10/10100027."Huh?@k @v10/10100028.He headed off to the bathroom a while ago.@k @v10/10100029.Is he still not back?@k @|@y@v10/10100030.Heh, maybe the poor geezer dropped dead... Namunamunamu."'
221: 'Kyrie@r@v09/11300003."That''s no way to talk about your own father.@k@v09/11300004. Still, this isn''t the first time he''s taken so long in the bathroom."'
222: 'Battler@r@v10/10100031."Yeah, the guy''s always been that way.@k@v10/10100032. Does he really have to take a magazine with him every time he needs to take a dump?@k@v10/10100033. Oh, what on Earth might he be doing with those?!@k @v10/10100034.Ihihi!"'
223: 'Kyrie@r@v09/11300005."Oh, you don''t need to worry about that at all.@k @v09/11300006.As long as we''re together, I won''t be letting him do that on his own."'
224: 'Battler@r@v10/10100035."Hihihi!@k @v10/10100036.Oooh, I''ll have to get the juicy details later!@k @|@y@v10/10100037.Sounds like Dad''s got his balls in an iron grip."'
225: 'Kyrie@r@v09/11300007."You know exactly what would happen with that man if I didn''t keep a tight grip, don''t you?"'
226: 'Battler@r@v10/10100038."Oh, no kidding.@k@v10/10100039. You''re the only one capable of reigning in that old bastard.@k@v10/10100040. As his son, I''m more than happy to let you take over."'
227: 'Kyrie@r@v09/11300008."Yes, leave it all to me.@k@v09/11300009. After all, that''s my specialty."'
228: '@rThis woman is my dad''s wife.'
229: '@rHer name is Ushiromiya Kyrie (霧江).'
230: '@rAs you can probably tell from our conversation, she''s not my real mother.@k@rShe''s basically my stepmother.'
231: '@rMy real mom died six years ago.@k@rKyrie-san is the woman Dad married afterwards.'
232: '@rI mean, I''m not a kid anymore.@k@rIt''s way too late now for me to start calling his second wife "Mom".'
233: '@rAnd I doubt she feels like using the word "son" on this massive kid who''s no relation to her at all.'
234: '@rWe aren''t little kids.@k@rWe know there''s nothing to be gained by fighting.'
235: '@rSo, we decided that we wouldn''t force ourselves to pretend that we were family.@k@rI''ve decided to act a bit more frank with her, as though she''s a friendly neighbor instead.'
236: '@rIt''s much easier to just keep a little distance, instead of forcing ourselves to act all close and making each other uncomfortable.'
237: '@rKyrie-san has been very open about all this, and thanks to that, we''ve been able to get along pretty well.'
238: '@rAs we were capitalizing on Dad being away in the bathroom to badmouth him,@k the man himself came back, wiping his hands with a handkerchief.'
239: 'Rudolf@r@v08/11200001."Hmm?@k @v08/11200002.Battler."'
240: 'Battler@r@v10/10100041."Hey, what''s up, Dad?"'
241: 'Battler@r@v10/10100042."...Owowowowww!@k @v10/10100043.Don''t pinch my ear, gaah!"'
242: 'Rudolf@r@v08/11200003."So, you''ve been talking trash about me with Mom again, haven''t you?@k@v08/11200004. What makes it so hard to show a little respect for your father, hmm?"'
243: 'Battler@r@v10/10100044."Owowow, owowowowow!@k @v10/10100045.Dammit, that hurts, you old bastard!@k @v10/10100046.Stretch my ear all you want, I''m still not gonna be able to fly - owwwww!!"'
244: 'Rudolf@r@v08/11200005."C''mon now.@k@v08/11200006. Upwards,@|@v08/11200007. upwards,@|@v08/11200008. sideways,@|@v08/11200009. sideways,@|@v08/11200010. round in a circle,@|@v08/11200011. back the other way,@|@v08/11200012. multiplier maxed out,@|@v08/11200013. with an extra x2 on top!@|@|@k@v08/11200014. Now say "Father, please forgive me for being so rude"."'
245: 'Battler@r@v10/10100047."Like hell I will, go find yourself some members-only store if you want it that much!@k@|@y@v10/10100048. Gyaah, let goooo!!"'
246: '@r......This old bastard is my dad.@k@rI think I''m pretty tall, but Dad''s about the same height.'
247: '@rIt''s probably no surprise that Auntie Eva started talking about Dad''s blood when she saw my height.'
248: '@rBy the way, my height isn''t the only thing I got from him.@k@rIt seems having weird names runs in the family.'
249: '@rDad''s full name is written 右代宮 留弗夫.'
250: '@r......Can you read it?@k Not many could, I''ll tell you that.@k@rThat mess of characters is pronounced "Rudolf".'
251: '@rHaha...he must hate Grandfather for giving him that name.'
252: '@rStill, that''s no reason to pass that weird naming tradition onto me.'
253: '@rAs the old bastard twisted my ear all over the place, Auntie Eva snuck up behind him and grabbed his ear.'
254: 'Eva@r@v05/11000014."Hey, Rudolf?@k @v05/11000015.Don''t take your frustrations out on your kid."'
255: 'Rudolf@r@v08/11200015."Gyaah, that hurts, Aneki..."'
256: '@rThe scene before me was a perfect realization of the trope of the older sister who deals out punishment to her prankster younger brother despite his size.'
257: 'Kyrie@r@v09/11300010."I think that''s good enough for now, Eva nee-san.@k@v09/11300011. I''ll make sure to stretch out his other ear later on."'
258: 'Eva@r@v05/11000016."Oh, my apologies.@k@v05/11000017. I must leave some pulling for you to do, Kyrie-san."'
259: 'Eva@r@v05/11000018."Rudolf?@k @v05/11000019.Make sure Kyrie-san gives you lots and lots of punishment later on, alright?"'
260: 'Rudolf@r@v08/11200016."You''re one to talk, Aneki, bullying your little brother like that."'
261: 'Rudolf@r@v08/11200017."Hideyoshi nii-san, I''d like to thank you very much for picking her up.@k@v08/11200018. If you hadn''t been so generous, she''d still be unsold in the store.@k@v08/11200019. You have my gratitude and apologies."'
262: 'Eva@r@v05/11000020."...Hmm~?!@k @v05/11000021.Who are you calling "unsold"?"'
263: '@rAfter taking two or three steps back,@w666.@|@y Auntie Eva unleashed one of her beautiful high reverse roundhouse kicks, which stopped just a centimeter away from the tip of Dad''s nose.'
264: '@rAfter starting out with Tai-chi-chuan for her figure, Auntie Eva had then developed an interest in the Chinese martial arts.@k After that, she went through karate, taekwondo, capoeira, ...and what is it she''s learning now, again?'
265: '@r...Well, anyway, they say a woman''s weapons are in her lower body, and that''s literally true for Auntie Eva.'
266: 'Eva@r@v05/11000022."Rudo~lf?@k @v05/11000023.Did you know that a single direct blow to the side of the head like that would knock you unconscious?@k @v05/11000024.Not so long ago, I accidentally connected in a practice match, and my opponent was out cold."'
267: 'Rudolf@r@v08/11200020."...Sheesh, what a pain.@k@v08/11200021. Guess I have to apologize for her tendency to lash out with her feet, too."'
268: '@rDad, completely unfazed, shrugged and smiled ironically at Uncle Hideyoshi.'
269: 'Hideyoshi@r@v06/11100010."Wahahaha, never had a brother or sister myself.@k@v06/11100011. So, when I see you two bickerin'' with each other, it makes me feel all warm and fuzzy inside.@k@v06/11100012. It sure is nice to have a big family and siblings."'
270: 'Kyrie@r@v09/11300012."Oh, then why not consider making a little brother for George-kun?@k @v09/11300013.He''s already a fine adult who''s about to go off on his own, so it might be a good time to have another child."'
271: 'Rudolf@r@v08/11200022."Hey, have a little sympathy for the new kid and all the pain and suffering he''d have to live through.@k@v08/11200023. I''m surprised even George-kun turned out as well as he did after being born from this sinister sister of mine."'
272: 'Rudolf@r@v08/11200024."And what an awesome kid he is.@k@v08/11200025. Please share some of that with our blockhead of a son someday, will you?"'
273: 'Kyrie@r@v09/11300014."That''s not how it worked.@k@v09/11300015. It''s thanks to Eva nee-san''s proper rearing that George-kun became the good, gentle kid he is now.@k@|@y@v09/11300016. Isn''t that right, Nee-san?"'
274: 'Eva@r@v05/11000025."Oh, come now...heheh, you think so...?@k @v05/11000026.Our George still has a long way to go."'
275: 'Eva@r@v05/11000027."Ah, by the way, how''s your little Ange-chan doing?@k @v05/11000028.I heard she was vomiting?"'
276: 'Hideyoshi@r@v06/11100013."Oh, that''s right!@k @v06/11100014.And I was hopin'' to finally see her face after such a long time.@k@v06/11100015. Is she alright?"'
277: 'Kyrie@r@v09/11300017."She often catches a cold when the seasons change.@k@v09/11300018. She''s very frail...@k@v09/11300019. I did want to bring her along, but we decided to have my family look after her this time."'
278: 'Eva@r@v05/11000029."I think that''s a wise move.@k @v05/11000030.She''ll be on the mend faster if she''s not exposed to that toxic head house.@k@v05/11000031. A child''s health is always more important than an adult''s convenience, don''t you think?"'
279: 'Hideyoshi@r@v06/11100016."I know of some great medicine for vomitin'' colds like that!@k @v06/11100017.When we get back home, I''ll send it over right away, so be sure to give her some!"'
280: 'Kyrie@r@v09/11300020."Thank you very much, Hideyoshi nii-san.@k@v09/11300021. I''m always in your debt..."'
281: '@r...And once the conversation suddenly veered off in that direction, we kids didn''t have any chance of butting in.'
282: '@rFor now, I''m just happy that Auntie Eva gave Dad his just deserts for tugging on my ear.'
283: 'George@r@v07/10300013."Looks like we''re still waiting for the weather report."'
284: '@rGeorge-aniki pointed at the counter.@k@rThe "Pending Weather Clearance" sign was still stuck next to the scheduled departure time for the flight we were scheduled to board.'
285: '@rAccording to Aniki, smaller planes are more subject to winds and other effects of the weather,@k and it''s not at all uncommon for flights to be delayed because of that.'
286: '@r......Wait a sec, it isn''t really going to shake...is it...?'
287: '@rFrom down here on the ground, it just looks cloudy, not windy.'
288: '@r...Well, I guess it''s different up where the planes fly.'
289: 'Eva@r@v05/11000032."The weather''s a bit uncertain today."'
290: '@rAuntie Eva was looking at a TV in the lounge.@k@rThe weather forecast was being broadcast, informing us that a typhoon was approaching the Kanto region.'
291: 'Rudolf@r@v08/11200026."A typhoon again?@k@v08/11200027. ......I guess we''re doomed to these, with the family conference being in October every year.@k@v08/11200028. Couldn''t he choose a better season?"'
292: 'Eva@r@v05/11000033."I agree.@k@v05/11000034. I''ve always hoped we could have it sometime around the Obon festival in mid-August.@k@v05/11000035. In that case, why don''t you suggest that to Father and Nii-san during the conference?"'
293: 'Rudolf@r@v08/11200029."...Very funny.@k@v08/11200030. Why don''t you do it yourself?@k@v08/11200031. Our brother would never listen to anything I suggested."'
294: 'Eva@r@v05/11000036."No way.@k@v05/11000037. It doesn''t really bother me that much to have it in October.@k@v05/11000038. You were the one who complained about the typhoon, so I said "ask them to change it then",@k @v05/11000039.that''s all."'
295: 'Rudolf@r@v08/11200032."I only said that typhoons always come around this time of year.@k@v08/11200033. You''re the one who said you wanted to move it nearer to Obon."'
296: 'Eva@r@v05/11000040."Well, you said it too last year!@k @v05/11000041.Didn''t you say that it would be easier to fit into your schedule if we had it nearer Obon?!"'
297: 'Rudolf@r@v08/11200034."I''ve never said anything like that."'
298: 'Eva@r@v05/11000042."Oh yes, you did.@k@v05/11000043. I certainly wouldn''t forget something like that!"'
299: 'Rudolf@r@v08/11200035."No, I didn''t... You''re the one saying that all the time!"'
300: 'Eva@r@v05/11000044."Are you aware?@k @v05/11000045.Stopping a kick just a hair''s breadth away is a very high-level technique."'
301: 'Rudolf@r@v08/11200036."Sheesh, women your age should be more proper than that!"'
302: '@rDad and Auntie Eva''s argument looks no different from a couple of brats bickering...'
303: 'George@r@v07/10300014."I expect that''s because, although they normally act as mothers and fathers,@k@v07/10300015. they turn right back into kids again when they meet their old siblings at these family conferences."'
304: 'Battler@r@v10/10100049."You''re the one who looks like a real adult, analyzing it all calmly.@k@v10/10100050. ......I hope I never turn out like that old bastard.@k@v10/10100051. I''d much rather end up as an intellectual adult like you, Aniki."'
305: 'George@r@v07/10300016."Like me?@k @v07/10300017.Oh, I still have a long way to go.@k@v07/10300018. I still have very little experience out there in the real world, and I need to work on becoming more bold and sociable.@k@v07/10300019. ...I think you''ve far surpassed me on all of those counts, Battler-kun.@k@v07/10300020. I''m sure you''ll outstrip me fast enough when you become an adult."'
306: '@rGeorge-aniki scratched his head and laughed, as though trying to hide his embarrassment.@k@rOf course, he was just being humble.'
307: '@rAniki entered a university and became an apprentice at Uncle Hideyoshi''s company at the same time, studying both academics and how to become a business emperor in parallel.'
308: '@rThen, right after graduating, he got into Uncle Hideyoshi''s company as his father''s aide, piling up a lot of real-life experience as he devoted himself zealously to his work.'
309: '@rHe even has grand dreams, of one day standing on his own and becoming lord of his own domain.'
310: '@rAniki is a real paragon of a man, sparing no effort as he strives towards his goal.@k It''s no exaggeration to say that I really respect him.'
311: '@rAnd then there''s me.@k I''m nothing at all like Aniki.'
312: '@rI''m living my happy-go-lucky idle high-school life to the max.'
313: '@rI''ve got no dreams for the future!@k@rI''d like to just sit back, stay cool, and let the money flow in, but of course that could never happen.'
314: '@r...When Aniki was my age, he had already formed an impressive objective and had started devoting himself towards studying for that goal, so I guess I can''t compare at all.'
315: '@rMy dad just says "sure you can study at my company, if you like cleaning toilets".'
316: '@rDammit, I''m not gonna be in the debt of that old bastard.@k@rI''ll find my way myself!@k@r.........I guess that intensity is my one qualification towards adulthood.'
317: '@rShould I go on one of those self-searching journeys that are all the rage these days?@k@r......Well, it''s not like I could mooch off my parents for that kind of money...'
318: 'Hideyoshi@r@v06/11100017_1."......hm?! Ohh~!"'
319: '@rRight then, Uncle Hideyoshi shouted out loudly.@k@rUncle''s a really nice person on the whole, but he does have a problem controlling the volume of his voice.'
320: '@rWhen I looked over, I saw that he was greeting Auntie Rosa, who had come late.'
321: 'Hideyoshi@r@v06/11100018."Ohoooooooooh!!!@k @v06/11100019.If it isn''t Rosa-san!@k @v06/11100020.Maria-chan, long time no see!!"'
322: 'Maria@r@v13/10400001."Long time no seee!@k @v13/10400002.Uu!"'
323: 'Rosa@r@v12/11400001."Maria!@k @|@y@v12/11400002.Shouldn''t that be "It''s good to see you again"?@k @v12/11400003.Greet your uncle properly."'
324: 'Maria@r@v13/10400003."Uu.@k@v13/10400004. It''s...good to see you again..."'
325: 'Hideyoshi@r@v06/11100021."There you go!@k @v06/11100022.Well said!@k @v06/11100023.How about some candy as a reward?!@k @|@y@v06/11100024.......Oh, huh?@k @v06/11100025.Where''d I put ''em..."'
326: 'Kyrie@r@v09/11300022."Rosa-san, it''s good to see you again.@k@v09/11300023. It''s good to see you too, Maria-chan."'
327: 'Rosa@r@v12/11400004."It''s been too long, Kyrie nee-san, Hideyoshi nii-san."'
328: 'Rosa@r@v12/11400005."...And...@v12/11400006....oh my, Battler-kun?!@k @|@y@v12/11400007.Look how big you''ve gotten...!"'
329: 'Battler@r@v10/10100052."Ah, come on, hahaha...@k@v10/10100053. It''s embarrassing hearing that from every person I meet...!"'
330: 'Rudolf@r@v08/11200037."Hey, Rosa.@k@v08/11200038. You''re late.@k@v08/11200039. If the plane was on time, you''d barely have made it..."'
331: 'Rosa@r@v12/11400008."I''m sorry.@k@v12/11400009. We had some trouble making our train connection.@k@v12/11400010. So we''re waiting on the weather yet again?"'
332: 'Eva@r@v05/11000046."Oh, don''t complain.@k@v05/11000047. I much prefer the thirty-minute plane trip to spending six hours bouncing about on a boat.@k@v05/11000048. Even if we''re kept waiting here for an hour, it''s still much faster overall."'
333: 'Hideyoshi@r@v06/11100026."Maria-chan''s gotten huge too!!@k @v06/11100027.So, how tall are you now?"'
334: 'Maria@r@v13/10400005."Uu!@k @v13/10400006.So, how tall am I now?!"'
335: '@rMaria parroted Uncle Hideyoshi''s question, looking up at her mother.'
336: '@rI guess she doesn''t remember her own height.@k@rShe''s probably right in the middle of a growth spurt, so her height must change every month.'
337: '@rIn just a few more years, she''ll probably start looking very feminine.'
338: 'Rosa@r@v12/11400011."Umm, ...how tall were you the last time you got measured...?@k@v12/11400012.@|@y She just keeps getting bigger and bigger.@k@v12/11400013. Don''t you?"'
339: 'Maria@r@v13/10400007."Uu!"'
340: 'Kyrie@r@v09/11300024."I think she''s grown a lot since last year.@k@v09/11300025. Let''s see, she turned nine years old this year, didn''t she?"'
341: 'Maria@r@v13/10400008."Nine years old.@k@v13/10400009. Uu."'
342: 'George@r@v07/10300021."That''s right, you''re nine years old now.@k@v07/10300022. Glad to see you''re doing well too, Maria-chan!"'
343: 'George@r@v07/10300023."Up you...@v07/10300024.@|@y@w500....nng...@v07/10300025. I guess you''ve gotten a bit too heavy to play airplane with..."'
344: 'Battler@r@v10/10100054."George-aniki, what a rude thing to say to a lady.@k@v10/10100055.@|@y Here, I''ll do it... Up ya go~..."'
345: 'Maria@r@v13/10400010."......Uu."'
346: '@rWhen I went to lift her up in Aniki''s place, Maria stiffened defensively, staring suspiciously at my face.'
347: '@r...Ah, that''s right.@k The last time I met Maria, it was six years ago, and she was only three years old.'
348: '@rOf course she doesn''t remember my face.'
349: 'Kyrie@r@v09/11300026."Maria-chan, don''t you remember?@k @v09/11300027.It''s Battler-kun.@k@v09/11300028. You used to play together, remember?"'
350: 'Maria@r@v13/10400011.".........Uu."'
351: 'Rudolf@r@v08/11200040."I doubt you''ll have any luck.@k@v08/11200041. The last time she met Battler, she was only three.@k@v08/11200042. You don''t keep memories at that age."'
352: '@rShe must know everyone''s face apart from mine because she meets them every year, but I haven''t had contact with the Ushiromiya family for about six years now.'
353: '@rSo, it''s no surprise that this nine-year-old girl doesn''t have any memories of me.'
354: '@rEven I can only just barely remember her being a three-year-old crybaby.'
355: 'Rosa@r@v12/11400014."Maria.@k@v12/11400015. This is Battler onii-chan.@k@v12/11400016. Uncle Rudolf''s son.@k@v12/11400017. ...Understand?"'
356: 'Maria@r@v13/20400057."............Uncle''s son is...@k@v13/20400058. Uncle''s the son...@k@v13/10400014. ............??@k @|@y@v13/10400015.......Uuuu!!"'
357: '@rThat "uu" was probably the sound of her brain breaking, unable to understand the complicated explanation.'
358: '@rI guess it was a bit too confusing for her.'
359: 'George@r@v07/10300026."Maria-chan.@k@v07/10300027. This is Battler-kun.@k@v07/10300028. He''s your cousin, like me."'
360: 'Maria@r@v13/10400016."......Like George onii-chan?@k @v13/10400017............................Battler?@k @v13/10400018.Cousin?@k @v13/10400019.......Uu."'
361: 'George@r@v07/10300029."That''s right.@k@v07/10300030. You got it."'
362: '@rThis part of Aniki is what makes me really look up to him.'
363: '@rFor someone who isn''t married, he''s just great at dealing with kids.@k@rI''m sure that he''ll be an indulgent father in the future.'
364: 'Maria@r@v13/10400020."...Battler onii-chan?"'
365: '@rMaria looked straight at me with a questioning expression, as though asking whether it was alright to call me that.'
366: 'Battler@r@v10/10100056."Yep, that''s me, Battler.@k@v10/10100057. Nice to meet you, Maria!"'
367: 'Maria@r@v13/10400021."Uu!@k @v13/10400022.Battler!"'
368: 'Rosa@r@v12/11400018."Maria!@k @v12/11400019.You mustn''t address him without honorifics - call him Battler onii-chan...!"'
369: 'Battler@r@v10/10100058."It''s cool, Auntie Rosa.@k@v10/10100059. I don''t sweat the small stuff.@k@|@y@v10/10100060. Right, Maria?!@k @v10/10100061.We''re buddies on a first-name basis, us two, aren''t we?!"'
370: 'Maria@r@v13/10400023."Battler, Battler, Battleeerrr!@k @v13/10400024.Uu-uu!"'
371: 'Battler@r@v10/10100062."That''s right, Maria, Maria, Mariaaa!@k @v10/10100063.Uu-uu!!"'
372: '@rWe horsed around for a while to make up for the six-year gap in our friendship.'
373: '@rShe probably still thinks of me as nothing more than a big new friend, but things''ll probably work out as we get to know each other again.'
374: '@rBut I''m surprised.@k She''s just the way I remembered her being six years ago.'
375: '@rSeems that people just don''t change that much after all.@k@rI''m a bit happy that she''s still the pure, innocent girl I remember.'
376: '@rHer name is written 真里亞.@k@r...That one''s not so difficult to read.@k Of course, it says "Maria".@k@rThe third character looks like a cross, which is pretty cool.'
377: '@rHer feelings don''t usually show up on her face, so it can be difficult to know just what she''s thinking, but that''s just how she looks on the outside.@k@rOn the inside, she''s just a sweet, normal girl.'
378: '@rThen there''s Maria''s mother, Auntie Rosa.@k@rShe''s my dad''s younger sister.'
379: '@rRosa is written 楼座.@k ...Here''s a name that''s totally not Japanese.'
380: '@rSorry to say it, but her name''s almost as ridiculous as Dad''s...@k I''ve got to respect her for not ending up as screwed up as he is.'
381: '@r...When I think about it, all the names in my family sound foreign.@k@rJust why is Grandfather so obsessed with this?'
382: '@rBecause of him, even us grandchildren have to put up with this weird naming sense.@k@rIt''s even more annoying since Grandfather''s own name is perfectly normal.'
383: '@rAnyway, there''s one thing about Auntie Rosa that''s a relief compared to the other family members.'
384: '@rThe old bastard and Auntie Eva have this annoying urge to tease and mock people all the time,@k but even though she shares their blood, Auntie Rosa isn''t like that at all.'
385: '@rShe has the most common sense among all the siblings.'
386: '@rLike Uncle Hideyoshi, she''s a kind aunt who''ll always be on the kids'' side.'
387: '@r......However, possibly because she''s more strict as a parent, she''s not liberal with handing out spending money like Uncle Hideyoshi is.'
388: '@rAlright.@k Now we have the entire group of family members who are going to board the plane.'
389: '@rAs though it had waited for us all to gather, an announcement rang out through the lobby.'
390: '@r@v99/anaF1001."Our apologies for the wait.@k@v99/anaF1002. Boarding will now commence for flight 201 to Niijima.@k@v99/anaF1003. We ask that the passengers please form two lines in front of the counter, behind the white line."'
391: 'Rudolf@r@v08/11200043."Rosa, you still haven''t gone through boarding procedures, right? Hurry up."'
392: 'Rosa@r@v12/11400020."Oh no...!@k @v12/11400021.Maria, come on!"'
393: 'Maria@r@v13/10400025."Uu!"'
394: '@rWe had to go through a metal detector before going out on the runway.'
395: '@rOur small plane wasn''t as massive as an international flight, but it was still a plane.@k A staff member holding a metal detector checked us all.'
396: '@rOnce all of us cleared the check, we followed the staff member out onto the runway.'
397: '@rCome to think of it, everyone here is in the Ushiromiya family.'
398: '@rIt''s like this is a reserved charter flight or something.'
399: '@rOur group stopped in front of the entrance to the airplane.@k@rThen, our guide turned around and spoke, looking down at the passenger list as she did.'
400: '@r@v99/StaF1001."Boarding will now commence.@k@v99/StaF1002. As I call out the names on the passenger list,@k@v99/StaF1003. please take your seats in order, starting from the front row on the right side and going right to left, then onto the next row.@k@v99/StaF1004. I will now begin reading the passenger list.@k@v99/StaF1005. Ushiromiya Hideyoshi-sama!"'
401: 'Hideyoshi@r@v06/11100028."Oh, I''m first!@k @v06/11100029.Right here!@k @v06/11100030....By the way, do you have the candies, Eva?@k @v06/11100031.I''ve been lookin'' all over for ''em, but I can''t find ''em."'
402: '@r@v99/StaF1006."Ushiromiya Eva-sama."'
403: 'Eva@r@v05/11000049."They''re in my handbag.@k@v05/11000050. I''ll get them once we''re inside the plane."'
404: '@rI''ve heard that candies are a good way to protect your ears from hurting due to variations in atmospheric pressure when landing or taking off.@k That''s probably what they''re talking about.'
405: 'Battler@r@v10/10100064."...Hope I get a window seat!"'
406: 'George@r@v07/10300031."Hahaha, don''t worry.@k@v07/10300032. There aren''t any other kinds of seats."'
407: '@rAccording to George-aniki, there are apparently only two lines of seats.'
408: '@rYep, it''s a small plane alright...@k .........It isn''t really going to shake...is it...?'
409: '@r@v99/StaF1007."Ushiromiya George-sama."'
410: 'George@r@v07/10300033."Right here.@k@v07/10300034. Don''t worry, Battler-kun.@k@v07/10300035. It won''t shake too much."'
411: '@r@v99/StaF1008."Ushiromiya Battler-sama."'
412: 'Battler@r@v10/10100065."A-Aniki, how much is "not too much"?!@k @v10/10100066.You can just swim if you fall from a boat, but if a plane crashes you''re screwed, right?!@k @v10/10100067.We all get our own parachutes in our seats, don''t we?@k @v10/10100068.Wait, we don''t?!"'
413: '@r@v99/StaF1009."Ushiromiya Rudolf-sama."'
414: 'Rudolf@r@v08/11200044."Come on, Battler, quit being a wuss and get in."'
415: 'Battler@r@v10/10100069."Ow! Dad!@k @v10/10100070.Don''t push me!@k @v10/10100071.We don''t get parachutes!"'
416: '@r@v99/StaF1010."Ushiromiya Kyrie-sama."'
417: 'Kyrie@r@v09/11300029."Alright, stop fooling around.@k@v09/11300030. Let''s move along."'
418: 'Rudolf@r@v08/11200045."Ow! Kyrie!@k @v08/11200046.Don''t push me!@k @v08/11200047.This blockhead isn''t moving forward!"'
419: '@r@v99/StaF1011."Ushiromiya Maria-sama."'
420: 'Maria@r@v13/10400026."Uu!@k @v13/10400027.Forward, forward!"'
421: '@r@v99/StaF1012."Ushiromiya Rosa-sama."'
422: 'Rosa@r@v12/11400022."Maria!@k @v12/11400023.Keep quiet..."'
423: '@r@v99/kawaC1001."This is your pilot, Kawabata.@k@v99/kawaC1002. We''d like to thank you for taking New Tokyo Aviation''s flight 201 today.@k@v99/kawaC1003. We estimate that the flight to Niijima Airport will take about twenty minutes."'
424: '@r@v99/kawaC1004."We are receiving reports of atmospheric turbulence.@k@v99/kawaC1005. There might be some shaking of the aircraft, so we ask that you do not unfasten your seat belts after takeoff."'
425: 'Battler@r@v10/10100072."A-Aniki, did that guy just say we needed to wear seatbelts?!@k @v10/10100073.In a jumbo jet, they let you undo them after takeoff!@k @v10/10100074.So it''s gonna shake so much we can''t take them off?!"'
426: 'Battler@r@v10/10100075."Dammit, you tricked me, it is going to shake after all!@k @v10/10100076.Where are the parachutes?!@k @v10/10100077.I knew I should''ve taken the boooooaaaaat!!"'