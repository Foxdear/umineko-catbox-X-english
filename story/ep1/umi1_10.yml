3908: '@rGenji once again tightened his bow tie, and looked outside through a crack in the curtains.'
3909: '@rMaybe the rain had died down a tiny bit since the previous night.@k@r...But it didn''t look like the thick rain-clouds were planning to let any trace of the morning sun get by.'
3910: '@rThe morning was dim, and far from refreshing.'
3911: 'Genji@r@v14/11600088.".........As expected, it doesn''t seem that it will stop today..."'
3912: 'Kanon@r@v16/10600117."My apologies for keeping you waiting, Genji-sama."'
3913: '@rKanon finished checking his appearance, and exited the washroom.@k@rIn a normal schedule, it was rare for anyone to have to suffer going straight from a midnight shift to a morning shift.'
3914: '@rIt was a special system, for just the two days of the family conference.'
3915: '@rBut then, as long as the typhoon didn''t leave today, the relatives'' stay on this island would last until tomorrow.'
3916: '@rKanon thought that it was best to be prepared for the special schedule to be extended one more day.'
3917: '@rThe two of them left the guesthouse, opening their umbrellas.@k@rThe rose garden had been devastated by the wind and rain last night.'
3918: '@rEven though they had spent several days making it beautiful to welcome the guests, it had only taken one stormy night to ruin it.'
3919: '@rKanon sighed.'
3920: '@rThe two headed for the mansion.@k@rThey were supposed to meet up with Gohda and prepare breakfast.'
3921: '@rGohda was such a perfectionist that he would undoubtedly have been up for some time already, and now be in the middle of preparing a breakfast both exquisite and as elegant as glasswork.'
3922: '@rThey reached the overhang by the entrance to the mansion, and folded up their umbrellas.'
3923: '@rGenji took from his pocket a bundle of several keys, and used it to unlock the front door.'
3924: '@rThere was nothing on Rokkenjima outside the Ushiromiya family mansion, so there never used to be a custom of locking up.'
3925: '@rHowever, Natsuhi had ordered that it be part of their duties to lock up the mansion from around midnight to early morning.'
3926: '@rAnd unlocking in the early morning was to be done by the servants who had the morning shift.'
3927: '@rSince Gohda would begin the preparations for breakfast as soon as he woke up, this task was to be undertaken by Genji and Kanon.'
3928: '@rSilence had fallen in the mansion, giving the impression that the mansion itself was still asleep.'
3929: 'Genji@r@v14/11600089.".........Well then, let us begin the morning chores."'
3930: 'Kanon@r@v16/10600118."Yes."'
3931: '@rThe two of them split up and began opening the curtains throughout the mansion.'
3932: '@r...If the curtains remained closed, the inside of the mansion would be unable to shake off its gloom, as if it hadn''t yet managed to escape the previous night.'
3933: '@rKanon, following a well versed procedure, went around the mansion opening one window after another without having to retrace his steps once.'
3934: '@rEven with this horrible weather, by opening the curtains, it began to feel just a little bit like morning.'
3935: '@rWhile doing that, he passed in front of the kitchen.'
3936: '@r...Even though he hadn''t yet smelled anything, his empty stomach started aching in anticipation of the scent of Gohda''s much bragged-about cooking.'
3937: 'Kanon@r@v16/10600119.".........Good morning.@k@|@y@v16/10600120. ..................?"'
3938: '@rHe tried to greet Gohda, who he had thought would be preparing the meal inside the kitchen, but Gohda was nowhere to be seen.'
3939: '@rThe kitchen was darkly lit, and never mind the curtains, the ventilation fan wasn''t even spinning.'
3940: '@rIt was still cold in the room, without a hint of a flame, and of course no preparations for breakfast were taking place.'
3941: '@r...Although it must not be allowed to happen, maybe Gohda had overslept.'
3942: '@rServants are humans too.@k@rThey can sometimes fail to wake up or something, and be late as a result.'
3943: '@r...In the rare case of that happening, it was the virtue of a servant to casually smooth the situation over so as not to cause an unsightly scene,@k and to make sure that their masters never even notice that such a mistake happened in the first place.'
3944: '@rKanon took up the receiver of the phone fitted to the wall, and dialed the extension number for the room where the servants slept.'
3945: 'Kanon@r@v16/10600121."........................?"'
3946: '@r......He couldn''t hear that characteristic sound of a dial tone.'
3947: '@rKanon tried picking up the receiver again, but even so, he couldn''t hear the usual dial tone.'
3948: '@rHe tried dialing again, but it had no apparent effect.'
3949: '@r......Could it be that the lightning last night had caused a mechanical fault and broken the internal telephone lines?'
3950: '@rThe equipment in this mansion was all worn out.@k@rKanon fully understood that even the smallest thing could have caused it to break down.'
3951: '@rKanon gave up trying to wake him with the phone, and dashed off to the room where the servants slept.'
3952: '@r...How long had she slept until? How long had it been since she had awoken and started lazily staring up at the ceiling?'
3953: '@r......That vague sense of awakening was Natsuhi''s usual morning experience.'
3954: '@rHer sleep was always light, and she wouldn''t even have been able to sleep at all without medicine.@k@r...To Natsuhi, sleeping was definitely not a happy thing.'
3955: '@rWhen she looked outside, she saw that it was still pouring.@k@rIf she hadn''t sensed a tiny amount of light, she might have mistakenly thought that it was still last night.'
3956: '@r...She herself was one of the hosts, so she mustn''t wake up later than her guests.'
3957: '@rUrging herself on, she raised up her body, which still hadn''t completely recovered from yesterday''s weariness.'
3958: '@rWhile she was inside this room, no one would torment her.@k@rHer headache wouldn''t get any worse than it already was.@k@r......This room was her only peaceful space.'
3959: '@rSo when she left, it meant returning to the world of her husbands'' siblings probing each others'' minds.'
3960: '@r...Then wouldn''t it be better to just stay locked up in this room forever...?'
3961: '@rNatsuhi smiled bitterly at this fantasy.@k@r...She was starting to sound like Kinzo.'
3962: '@r...Even though most of the time she would call Kinzo names for staying locked up in his own room and taking no notice of anyone, the truth was that she actually longed to do so herself.'
3963: '@r......Natsuhi gave her head a small shake, and her fantasy was replaced by the reawakening of her usual headache.'
3964: '@rWhen she reached for the doorknob, trying to leave the room, her hand touched the scorpion charm that she had hung from it before going to sleep the previous night.'
3965: '@r......It was Maria''s charm, that Jessica had given Natsuhi.'
3966: '@rIf she remembered correctly, Jessica had said something about it having the power to repel magic, and that she should hang it from her doorknob.'
3967: '@r...Maybe it was thanks to the charm that at least this room had been protected from her husband''s siblings'' malice.'
3968: '@r......As she thought this, her mood began to get a little more cheerful.'
3969: 'Natsuhi@r@v03/10900171."...............So perhaps it was thanks to Jessica...that I was able to get a little peaceful sleep..."'
3970: '@rThen Natsuhi remembered.@k@rThat''s right, last night, I promised Jessica that I would give her a charm of my own in exchange for this one, didn''t I?'
3971: '@rNatsuhi opened a drawer of her dresser, and took out an antique accessory case that she had treasured ever since she was a child.'
3972: '@rInside, there were many small objects that Natsuhi had thought were valuable at the time.'
3973: '@rFrom amidst those, she pulled out a red pouch.@k@r...Inside was a small, round mirror about ten centimeters across.'
3974: '@rIt looked quite old, but the design on the back of the mirror was very ornate, and it felt like something with historical value.'
3975: '@rAt the very least, it looked much more effective when compared to the other charm, which looked like a plastic scorpion key-holder.'
3976: '@rShe had heard that this mirror was a spiritual mirror to ward off evil spirits, and she had been given it specially by her grandmother when her grandfather''s mementos had been distributed.'
3977: '@rIt has been believed since ancient times that strange powers dwell within mirrors.@k@rMost likely, the way they reflect light created a belief that they also deflect misfortune and malice in the same way.'
3978: '@rNatsuhi returned the mirror to its pouch.@k@r...It would probably be a fitting object to hand over to Jessica.'
3979: '@rJust as she was placing it in her pocket, the sound of someone knocking on the door suddenly echoed throughout the room.'
3980: 'Natsuhi@r@v03/10900172.".........Yes?"'
3981: 'Genji@r@v14/11600090."Good morning, Madam. It is Genji.@k@v14/11600091. My apologies for waking you so early."'
3982: 'Natsuhi@r@v03/10900173."......I am coming now.@k@v03/10900174. What is it?"'
3983: '@rNo servant had ever come to her this early in the morning, and especially not directly.'
3984: '@r...Maybe something bad had happened.@k@rFor example, maybe some fatal oversight had been made during the preparations for breakfast, and the household would be put to shame in front of the guests, or something.'
3985: '@r...Natsuhi breathed out slowly, as if getting a headstart on the troubles she was surely about to be told of...'
3986: '@rWhen she opened the door, Genji once again said a morning greeting to her while bowing deeply.@k@rNatsuhi tentatively responded.'
3987: 'Natsuhi@r@v03/10900175.".........Good morning.@k@v03/10900176. Did something happen?"'
3988: 'Genji@r@v14/11600092."My apologies.@k@v14/11600093. .........It seems that the telephones are out of order due to last night''s lightning.@k@v14/11600094. ...The internal lines have gone dead, so please forgive my coming to see you directly."'
3989: 'Natsuhi@r@v03/10900177."The internal lines have gone dead?@k @v03/10900178.That will be troublesome.@k@v03/10900179. Will it be possible to repair it?"'
3990: 'Genji@r@v14/11600095."......I am afraid that we don''t know the location of the damage.@k@v14/11600096. I would like to call an expert and have him repair it."'
3991: 'Natsuhi@r@v03/10900180."Which means that we will be unable to repair it until the typhoon has passed?@k@v03/10900181. ...In other words, the lines will be out of order for the remainder of our guests'' stay.@k@v03/10900182. ...Will there be issues with providing them proper service?"'
3992: 'Genji@r@v14/11600097."............We will do all we can to make sure there are none."'
3993: 'Natsuhi@r@v03/10900183."Very well.@k@v03/10900184. ...I will be counting on you to ensure that everything goes smoothly."'
3994: '@rNatsuhi let out a small sigh of relief.'
3995: '@rShe had been prepared for the worst,@k but a telephone breakdown wasn''t the kind of trouble she was worried about.'
3996: '@r...But then, even this would probably be enough to spark sarcasm from Eva.'
3997: '@rNatsuhi gave her head a light shake.'
3998: 'Natsuhi@r@v03/10900185."Are the preparations for breakfast proceeding well?"'
3999: 'Genji@r@v14/11600098."......About that, ...we haven''t been able to find Gohda.@k@v14/11600099. The arrangements for breakfast have yet to be carried out..."'
4000: 'Natsuhi@r@v03/10900186."What did you say?"'
4001: '@rNatsuhi was indignant.'
4002: '@r...To her, this was a much bigger problem than the phones not working.'
4003: '@rAnd despite that, this piece of information was the part that had been postponed.'
4004: '@rWhy did everything go well most of the time, and then come to something like this when the relatives were visiting...'
4005: '@rNatsuhi placed a hand to her forehead, and shook her head sharply.'
4006: 'Natsuhi@r@v03/10900187."Most likely he is oversleeping.@k@v03/10900188. Anyway, it doesn''t matter who does it, just hurry with preparing breakfast.@k@|@y@v03/10900189. ...............Wha—"'
4007: '@rNatsuhi had exited into the hall and turned around for a second to close the door to her room.'
4008: '@rThe unpleasant "thing" that she saw there silenced her completely.'
4009: '@r...It was an unsettling sight, as if someone had dipped their fingers in a dark red liquid and clawed at the area around the doorknob.'
4010: '@rAs though someone had soaked both of their hands in blood and groped at the door and the knob—@klike someone had wanted to stage something like that and left this mark as an awful prank.'
4011: 'Natsuhi@r@v03/10900190."Wh-@v03/10900191.......what wicked mischief is this.........?@k@v03/10900192. How awful...!"'
4012: 'Genji@r@v14/11600100.".........I also just noticed it as I came to call you.@k@v14/11600101. I will clean it later."'
4013: 'Natsuhi@r@v03/10900193."...M-...most likely,@v03/10900194. a vulgar joke by one of the guests.@k@v03/10900195. ......Disgusting, truly disgusting...!"'
4014: '@rWho in the world would pull such a childish and disgusting prank!'
4015: '@rNatsuhi had a pretty good idea, but of course there was no proof,@k so even if she pushed the issue, it would just seem as though she was making a fuss about nothing.'
4016: '@rOn the contrary, it would definitely be better for her to say she hadn''t even noticed that such a prank had been played in the first place.'
4017: '@rNatsuhi gave the order to have it cleaned, and headed off to the parlor with clacking heels.'
4018: '@rWhen Natsuhi and Genji arrived in the parlor, Eva and Hideyoshi were already there.'
4019: 'Natsuhi@r@v03/10900196.".........Good morning, everyone."'
4020: 'Hideyoshi@r@v06/11100206."Mornin'', Natsuhi-san.@k@v06/11100207. I heard Gohda-san would be makin'' us breakfast too, isn''t that right?@k@v06/11100208. My stomach''s been gettin'' all excited since I woke up.@k@v06/11100209. Wahahaha."'
4021: 'Eva@r@v05/11000307."Yes, food is about the only thing worth looking forward to here, isn''t it?@k @v05/11000308.*giggle* *giggle*."'
4022: 'Natsuhi@r@v03/10900197.".........You too, Eva-san, I''m pleased to hear that you are well this morning."'
4023: '@rNatsuhi returned Eva''s gaze, which was fiercely competitive even though it was early in the morning, with a weary expression.'
4024: '@rThen Kanon jogged in.'
4025: '@rAfter bowing in apology to the relatives for running inside the mansion, he approached Genji and told him something in a small voice.'
4026: 'Natsuhi@r@v03/10900198."......Kanon.@k@v03/10900199. Have you still not found Gohda?"'
4027: 'Kanon@r@v16/10600122.".........My apologies, Madam.@k@v16/10600123. I went all around the inside of the mansion and the guesthouse,@v16/10600124. ...but, still..."'
4028: 'Natsuhi@r@v03/10900200."Where in the world has he gone?@k@v03/10900201. ......For now, breakfast is a higher priority than finding Gohda.@k@v03/10900202. Quickly, take care of it."'
4029: 'Kanon@r@v16/10600125.".........Yes."'
4030: '@rKanon glanced at Genji.@k@r...It looked like he had something else to report, but needed to ask Genji whether he was the right person to say it.'
4031: '@r...Genji nodded, and decided to give the report himself.'
4032: 'Genji@r@v14/11600102."............Madam.@k@v14/11600103. It is not only Gohda.@k@v14/11600104. ...Your husband is also nowhere to be found."'
4033: 'Natsuhi@r@v03/10900203."My husband?"'
4034: 'Genji@r@v14/11600105."Yes.@k@v14/11600106. I thought I would report to him before you about the lack of preparation for breakfast, and visited his room, but I did not find him there.@k@v14/11600107. Furthermore, it was not only he who was missing.@k@v14/11600108. ......Rudolf-sama and his wife, as well as Rosa-sama, are nowhere to be found."'
4035: 'Natsuhi@r@v03/10900204."Not even in the guesthouse?@k @v03/10900205.And not in the mansion?"'
4036: 'Kanon@r@v16/10600126.".........Yes.@k@v16/10600127. Nor are they in their rooms in the guesthouse."'
4037: '@rWhen she had heard that Gohda alone was missing, she had thought that he might have slept in or was loafing around somewhere,@k but once she heard that several of the relatives were also missing, she began to start thinking a little more optimistically.'
4038: '@rLast night''s family conference might have continued all night, and in fact might still be going on.'
4039: '@rIt would then be imaginable that they had wanted to cool off their heads after being in that stuffy room,@k and had all gone off on a group walk through the rain.'
4040: '@r...The part about "cooling off their heads" really sounded like something Krauss would like to say.'
4041: '@rProbably, Gohda had been called to go with them to aid them with something.'
4042: '@rGohda was not a man who lost track of time.@k@rHe had to have understood that, if he did not return, the preparations for breakfast would be hindered.'
4043: '@rSo perhaps, as much as he''d like to leave, the atmosphere would not permit him to,@w500. and the conference was continuing in that manner even this very moment.'
4044: '@r......Yes, Natsuhi thought this to be an extremely persuasive theory.'
4045: '@rNatsuhi remembered the illusion that she had felt that morning of being sucked into a continuation of the previous night,@k ...and upon learning that the feeling wasn''t just an illusion, she once again let out a deep, weary breath.'
4046: '@rBecause the banquet of the filthy vultures circling around Kinzo''s property was still continuing.'
4047: 'Natsuhi@r@v03/10900206."......Most likely, they are still repeating that same discussion about the inheritance somewhere in the garden, or maybe the beach.@k@v03/10900207. ...In any case, we must call Gohda back, or we will never be able to complete the preparations for breakfast."'
4048: 'Hideyoshi@r@v06/11100210."So what''re you sayin''?@k@v06/11100211. ...Are Nii-san and the rest still continuin'' their discussion...?!"'
4049: '@rShe had thought she''d spoken in a small voice, but Hideyoshi had overheard her, and managed to grasp the situation.'
4050: 'Eva@r@v05/11000309."Nii-san and Rudolf sure are tough.@k@v05/11000310. And maybe it''s just youth in Rosa''s case?@k @v05/11000311.......The two of us were so tired that we had to go back to bed just after midnight.@k@v05/11000312. I do remember that Nii-san and the rest were still having a heated discussion at that point.@k@v05/11000313. ......Men sure are nasty when they get excited."'
4051: '@rNatsuhi snorted, her face still blank.'
4052: 'Natsuhi@r@v03/10900208."Kanon, search outside.@k@v03/10900209. If you find Gohda, tell him to return immediately and begin preparations for breakfast."'
4053: 'Kanon@r@v16/10600128."......Certainly."'
4054: 'Eva@r@v05/11000314."Natsuhi nee-san, they aren''t necessarily outside, right?@k @v05/11000315.Couldn''t they also be inside Father''s study?"'
4055: 'Hideyoshi@r@v06/11100212."...Ah, sure, I could see that.@k@v06/11100213. I don''t know what they''ve been discussin'',@k@v06/11100214. but there''s also a decent chance that they''ve moved to Father''s study and included him in the discussion."'
4056: 'Natsuhi@r@v03/10900210."......I cannot imagine that Father would willingly invite that detestable topic into his study."'
4057: 'Eva@r@v05/11000316."You really think so?@k @v05/11000317.Well, then there''s nothing we can do.@k@v05/11000318. I''m sorry, Genji-san, Kanon-kun, but could you search outside?@k@v05/11000319. I''m sure it wouldn''t be odd for Nii-san to propose that they go outside for a walk to cool their heads.@k@v05/11000320. Even in this weather."'
4058: 'Eva@r@v05/11000321."I will go to Father''s study.@k@v05/11000322. After all, there''s still some chance they''ll be there, isn''t there?"'
4059: 'Natsuhi@r@v03/10900211."..................Eva-san, a guest such as you mustn''t trouble herself.@k@v03/10900212. I will go.@k@v03/10900213. I can also tell him good morning."'
4060: 'Eva@r@v05/11000323."Really, then I''m counting on you, alright?@k @v05/11000324.But I somehow doubt whether he will return your greeting.@k @v05/11000325.Natsuhi nee-san, were you on good terms with Father?"'
4061: 'Natsuhi@r@v03/10900214.".........I don''t know whether it could be called good terms,@k@v03/10900215. but I am certain that I have gained his trust as the wife of the successor to the Ushiromiya family."'
4062: 'Eva@r@v05/11000326."Then I''m sure that he will at least answer you, won''t he?@k @v05/11000327.I want to at least eat breakfast with Father.@k@v05/11000328. I wonder if you could convince him to come down and join us?"'
4063: 'Eva@r@v05/11000329."......It seems that he thoroughly despises the rest of us, but I''m sure if his trusted Natsuhi asks, he will surely listen."'
4064: 'Eva@r@v05/11000330."...If you can''t convince Father after speaking to me so sharply, and have to come down by yourself.........@k@v05/11000331.I doubt you''ll ever again be able to say that you have gained his trust, will you...?@k @v05/11000332.*giggle*giggle*!"'
4065: 'Natsuhi@r@v03/10900216."............I am not confident, but I will try."'
4066: '@rNatsuhi responded, discouraged.@k@rHowever, knowing Kinzo''s temperament, she had absolutely no confidence in her ability to bring him out.'
4067: '@r...Eva herself was treating it like a joke, expecting that it couldn''t be done.'
4068: '@rBut even so, Natsuhi would lose face if she gave up, said it was impossible for her, and let Eva go instead...'
4069: '@rEva''s mean-spirited and unreasonable demand caused Natsuhi''s tightly clenched fist to shake.'
4070: '@r...When Genji realized this, he softly spoke to her over her shoulder.'
4071: 'Genji@r@v14/11600109."......Madam.@k@v14/11600110. If you would, please take this."'
4072: 'Natsuhi@r@v03/10900217."Is that...?"'
4073: '@rGenji handed Natsuhi a sparkling gold key of ornate design.@k@rIt was the key to Kinzo''s study.'
4074: '@rThe study would always lock itself, and couldn''t be unlocked as long as Kinzo forbade entrance.'
4075: '@rHowever, since Genji was especially trusted by Kinzo, he was allowed to carry a key to that door...'
4076: 'Natsuhi@r@v03/10900218."But, if this key is used, won''t you also receive the blame...?"'
4077: 'Genji@r@v14/11600111."......When the Master is sleeping deeply, simple knocking on the door may not reach his ears."'
4078: 'Genji@r@v14/11600112."...And when persuading the Master to leave his room, it would be more difficult if you must talk through the door.@k@v14/11600113. Please use it..."'
4079: 'Natsuhi@r@v03/10900219."......Genji..."'
4080: '@rUntil now, Natsuhi had thought of Genji as a cold servant who worked directly under Kinzo, and would never work for her.'
4081: '@rBut it looked like she would have to alter her understanding of him...'
4082: '@rShe wanted to communicate her feelings of thanks, but by then, Genji had already turned his back on her, and was walking down the corridor with Kanon.'
4083: '@r...But as Natsuhi watched them go, the words that reached her from behind were sneering.'
4084: 'Eva@r@v05/11000333."Be sure you bring Father with you, then, okay?@k @v05/11000334.After all, it''s his son''s darling wife who''s asking. I''m sure he''ll listen to you.@k@v05/11000335. *giggle*giggle*.@k@v05/11000336. We are guests, so let us leisurely relax here."'
4085: 'Hideyoshi@r@v06/11100215."Quit it, Eva, you''re talkin'' too much.@k@v06/11100216. Sorry, but Natsuhi nee-san, we''ll leave Father to you..."'
4086: '@rNatsuhi left without replying, at a swift pace, her heels clacking loudly with every step.'
4087: '@rAfter all that excitement the previous night, there was no way anyone was going to wake up soon.'
4088: '@rGeorge-aniki, Jessica and I were snoring loudly on the bed in the cousins'' room.'
4089: '@rBut Maria, who didn''t join in, and who had gone straight to bed the previous night, suddenly and completely opened her eyes.'
4090: 'Maria@r@v13/10400515."......................................."'
4091: '@rAs she rubbed her sleepy eyes and looked around, the loud snoring coming from the three cousins continued.'
4092: '@r...For a while, Maria had to think about what had happened.'
4093: '@rAfter that, she realized that her mother was not with her, and quickly got lonely.'
4094: '@rMaria left the cousins'' room, trying to head to the room that had been arranged for her and her mother.'
4095: '@rPaying no heed to the three who were sleeping soundly, she made a loud slamming sound on the way out.'
4096: '@rIn response, Battler mumbled and rolled over in his sleep, but it wasn''t enough to wake him up.'
4097: '@rAfter a while, Maria returned, once again opening the door with a lively bang.'
4098: 'Maria@r@v13/10400516."..................Uu."'
4099: '@rWhen she had left the room, her face had been sleepy, but after returning, she now looked discontent.'
4100: '@rAfter that, she climbed up on Battler''s bed, which happened to be the closest, and started yelling and jumping on it like it was a trampoline.'
4101: 'Maria@r@v13/10400517."Uu-uu-uu!!@|@y@k @v13/10400518.Waaake uuup!!@|@y@k @v13/10400519.Uu-uu-uu!!"@|@y'
4102: 'Battler@r@v10/10100711."Waaa, what, what?!@k @v10/10100712.Is it a raid?!@k @v10/10100713.Surround themmmm!!"'
4103: '@rAfter making sure that I was awake, Maria jumped over onto George-aniki''s bed and started bouncing on that too.'
4104: '@r...In that manner, the three of us were all greeted with an extremely pleasant awakening.'
4105: 'George@r@v07/10300454."Thanks, Maria-chan, for waking us up.@k@v07/10300455. You stopped us from sleeping in after that late night..."'
4106: 'George@r@v07/10300456."...But it would have been perfect if you could have just been a little more gentle..."'
4107: 'Jessica@r@v04/10200436."...George nii-san, you really are an adult, I respect that..."'
4108: 'Battler@r@v10/10100714."It''s almost seven...@k@v10/10100715. Well, not really a bad time to wake up.@k@v10/10100716. *yaaawn*."'
4109: 'Maria@r@v13/10400520."Uu!@k @v13/10400521.Mama''s not heeere!@k @v13/10400522.Uu-uu-uu!"'
4110: 'George@r@v07/10300457."Auntie Rosa?@k @v07/10300458.She wasn''t in her room?@k @v07/10300459.I wonder if she has already woken up and gone to the mansion."'
4111: 'Maria@r@v13/10400523."She''s—not—heeere!!@k @v13/10400524.Uu-uu!@k @v13/10400525.Uu!@k @v13/10400526.Mammaa!@k @v13/10400527.Uu-uu-uu!!"'
4112: '@rMaria kept groaning "uu-uu" and looking unhappy.@k@rIt seemed like she wasn''t simply lonely because she couldn''t find her mother, but actually unhappy because her mother wasn''t in the place she thought she was, and this made her feel like she''d been tricked.'
4113: '@rIf we could have just told her where her mother was, that might have been enough to satisfy her,@k but unfortunately, as long as we were here, we had no way of finding that out.'
4114: 'Jessica@r@v04/10200437."It''s time to go for breakfast anyway, so let''s head over to the mansion."'
4115: 'Battler@r@v10/10100717."Good idea.@k@v10/10100718. Maria, let''s go to the mansion together, okay?@k @v10/10100719.I''m sure Auntie Rosa will be over there too."'
4116: 'Maria@r@v13/10400528."Uu?@k @v13/10400529.Mama''s in the mansion?@k @v13/10400530.Then I''ll go.@k@v13/10400531. Uu."'
4117: 'George@r@v07/10300460."That''s right, let''s go to the mansion.@k@v07/10300461. Our parents have probably already gone there."'
4118: '@rMaria regained her usual composure, as though her earlier temper had never happened.'
4119: '@rWe got dressed, left the room, and headed for the mansion.'
4120: '@rThe door to the study was once again knocked upon.@k But there was no answer.'
4121: '@r...He was still sleeping, and she couldn''t wake him.@w500. ...If she returned downstairs saying something like that, Eva would be very amused and triumphant.'
4122: '@rAnd even aside from the whole Eva issue, there was the problem that yesterday, during this once-a-year family conference, he had stayed locked up all day, and had still not come out to greet the guests.'
4123: '@r...Even though he was the head—no, especially because he was the head—he couldn''t fail to make an appearance.'
4124: '@r...Could she convince him?@k@rNatsuhi readied herself, and, using the key that she had borrowed from Genji, opened the door...'
4125: '@rA sweet stench that seemed to eat into her brain poured from the narrow opening she had created, and though she was prepared for it, she couldn''t help but grimace.'
4126: '@rThinking that he might still be sleeping, Natsuhi entered the room quietly...'
4127: '@rWhen she did, Kinzo, already awake, was looking down out of the window.'
4128: 'Natsuhi@r@v03/10900220."S-......so you''re awake...@k@v03/10900221. Good morning..."'
4129: 'Kinzo@r@v01/11500319."..................How did you get in?"'
4130: '@rKinzo spoke with his back still facing her.'
4131: '@rHis voice was not harsh, but calm, and Natsuhi was slightly reassured.'
4132: '@r...However, he was at least in a bad enough mood that he had ignored the sound of all of that knocking even though he had been awake.'
4133: '@rNatsuhi wasn''t able to break the tension.'
4134: 'Natsuhi@r@v03/10900222."......My sincere apologies.@k@v03/10900223. I asked Genji-san, and he allowed me to borrow the key to the study..."'
4135: 'Kinzo@r@v01/11500320."Hoh...@k@v01/11500321. Genji did?@k@v01/11500322. .........If my friend thought it was that important, then I have no choice but to listen.@k@|@y@v01/11500323. Tell me, ...what business do you have?"'
4136: 'Natsuhi@r@v03/10900224."Y-yes...@k@v03/10900225. .........Breakfast will soon be prepared, and I would greatly appreciate it if you would join us..."'
4137: 'Kinzo@r@v01/11500324."I will eat here.@k@v01/11500325. Have it brought here like always."'
4138: 'Natsuhi@r@v03/10900226."But Father...@k@v03/10900227. This is the annual family conference.@k@v03/10900228. Please, at least let them see your face."'
4139: 'Kinzo@r@v01/11500326.".........You ask me to go downstairs,@k@v01/11500327. and join in on the discussion of how my inheritance is to be chewed apart after I die?@k@v01/11500328. How foolish."'
4140: 'Kinzo@r@v01/11500329.".........They can keep talking about that kind of thing as much as they like without me.@k@v01/11500330. And if that''s what you call a family conference, it''s nothing so important that I should leave my room for it.@k@v01/11500331. I am busy.@k@v01/11500332. Do not bother me."'
4141: '@rWith his last words came the threat that any further questions would be useless.'
4142: '@r...Natsuhi realized that adding any further pleas would finally bring his wrath down upon her.'
4143: '@rIt would be annoying to hear Eva sarcastically say that she hadn''t been able to convince him after all, but there was nothing more Natsuhi could do...'
4144: 'Natsuhi@r@v03/10900229.".........Is that so......?@k@v03/10900230. ...Understood......@k@v03/10900231. I am sure that everyone will be sorry to hear it, but I will tell them."'
4145: '@rNatsuhi decided to give up.@k@rBowing silently, she made to leave the room before Kinzo''s spasmodic temper could fire up.'
4146: '@rAs she did, Kinzo called out to her.'
4147: '@r......Compared to the usual Kinzo, this voice was calm and gentle, like it came from another person.'
4148: 'Kinzo@r@v01/11500333."......Natsuhi.@k@v01/11500334. ...It has been quite some time since you married into the Ushiromiya family."'
4149: 'Natsuhi@r@v03/10900232."Y-......yes.@k@v03/10900233. ...It has been a while since I was first permitted to bear the name Ushiromiya."'
4150: 'Kinzo@r@v01/11500335."......Do you sometimes long for your previous family?"'
4151: 'Natsuhi@r@v03/10900234."...............No.@k@v03/10900235. ...Marriage means throwing away your parents'' family.@k@v03/10900236. I am Ushiromiya Natsuhi.@k@v03/10900237. If I have a family to return to, or to reminisce over, it is only the Ushiromiya family."'
4152: '@rIt was definitely not an exaggeration.@k@rSuch was the level of Natsuhi''s resolve in calling herself an Ushiromiya.'
4153: '@r......That was why she was so sorrowful that, despite all of her effort, it had been fruitless and she was not even accepted by her husband.'
4154: 'Kinzo@r@v01/11500336.".........If Krauss had been a woman,@v01/11500337. ...and you had been the husband...@k@v01/11500338. ............No, ...I won''t say that."'
4155: 'Natsuhi@r@v03/10900238."Wh-......what do you mean by that,@v03/10900239. ...Father?"'
4156: '@rNatsuhi was shocked.@k@r......If Kinzo''s words just now had been meant literally...'
4157: '@r.........They would have been more than enough to make up for all she had suffered up to that point.'
4158: 'Kinzo@r@v01/11500339."...............Forget it.@k@v01/11500340. It''s just the nonsense of an old man."'
4159: '@rKinzo once again faced away from her.@k@r...He had told her to forget it, but Natsuhi couldn''t help feeling a warmth in her heart...'
4160: 'Natsuhi@r@v03/10900240."...Father.@k@v03/10900241. ............Even though I am not connected to you by blood, I am still your daughter.@k@v03/10900242. .........The honor and glory of the Ushiromiya family,@v03/10900243. ...and everything that you have left,@v03/10900244. ......I guarantee you, I will see it protected myself......!"'
4161: 'Kinzo@r@v01/11500341."..................You do not have the qualifications to wear the One-winged Eagle.@k@v01/11500342. ...However, the One-winged Eagle is surely engraved in your heart.@k@v01/11500343. .........In that case, you are unmistakably my blood relative, and one who will inherit the glory of the Ushiromiya family."'
4162: 'Kinzo@r@v01/11500344."............Some will sneer that there is no eagle on your clothes.@k@v01/11500345. However, that is nothing to lend an ear to.@k@v01/11500346. ...Only those who hold the eagle in their hearts are my true blood relatives.@k@v01/11500347. ............I now believe it an honor that I was able to welcome you into the Ushiromiya family..."'
4163: '@rWithout saying anything more, Kinzo remained with his back to Natsuhi.'
4164: '@rHowever, Natsuhi couldn''t help but feel something warm well up inside her that she hadn''t felt since long ago, when she had been just a child...'
4165: '@rNatsuhi bowed silently to his back and left the room...'
4166: 'Eva@r@v05/11000337."...Ah, what perfect timing.@k@v05/11000338. How is Father?@k @v05/11000339.You were taking so long, I came to check, you see?"'
4167: '@rWhen Natsuhi left the study, she saw Eva climbing the stairs, and their eyes met.'
4168: '@rEva was smirking unpleasantly, thinking that Natsuhi had just left the room trudgingly after failing to convince Kinzo.'
4169: '@rHowever, the way Natsuhi was now, such a frivolous laugh would not disturb her.'
4170: '@r......She was not permitted to wear the family crest on her clothing.@k@r.........But she was permitted to wear it in her heart.'
4171: '@rSo she spoke calmly, clearly, ...and confidently, with the dignity of the one who would protect the glory of the Ushiromiya family.'
4172: 'Natsuhi@r@v03/10900245."Father said that he would not join in on the family conference.@k@v03/10900246. He says that he has no interest in such an obscene topic."'
4173: 'Eva@r@v05/11000340."...Yes, yes, excuses, excuses.@k@v05/11000341. If you weren''t able to persuade Father, say so frankly."'
4174: 'Natsuhi@r@v03/10900247."......How pitiful.@k@v03/10900248. I''m beginning to understand Father''s feelings of regret."'
4175: 'Eva@r@v05/11000342."Wha-......what do you mean by that...?"'
4176: '@rNatsuhi did not answer.'
4177: '@rJust as Kinzo had done earlier, she showed Eva her back as she headed down the stairs.'
4178: '@rStruggling to gather what had happened, Eva could only determine that she had been made fun of, and that something had happened to quickly bolster Natsuhi''s confidence.'
4179: '@rEven so, she didn''t have the courage to risk Kinzo''s wrath.'
4180: '@rUnable to even knock on the door, she could only scratch at the air in front of it, cluck her tongue, and follow after Natsuhi.'
4181: 'Eva@r@v05/11000343."S-so, were Nii-san and the rest there?@k @v05/11000344.Did Father tell you about them?"'
4182: 'Natsuhi@r@v03/10900249."......I didn''t get the chance to ask, but they were not inside the study.@k@v03/10900250. ...Father would never let them into his room to discuss such a lowly topic, so it is unlikely that he knows where they went.@k@v03/10900251. Let us go downstairs and wait for the servants to return from their search."'
4183: 'Natsuhi@r@v03/10900252."...Breakfast may be late, but how about some tea, Eva-san?"'
4184: 'Eva@r@v05/11000345."......I, ...I will be fine."'
4185: '@rEva couldn''t hide her confusion over the complete difference in Natsuhi''s demeanor.'
4186: '@r...She was acting so boldly, and while Eva hated to admit it, she even had a sense of dignity about her.'
4187: '@rUnable to find fault with anything, she could only follow Natsuhi back to the parlor.'
4188: '@rWhen the two of them returned to the parlor, not only Hideyoshi, but the four children and Nanjo as well had gathered there.'
4189: '@rGenji, who had been talking with Hideyoshi, reported the current situation when he noticed that Natsuhi had returned.'
4190: 'Natsuhi@r@v03/10900253."You still have not found my husband and the rest?"'
4191: 'Genji@r@v14/11600114."......Yes, my apologies.@k@v14/11600115. ......Also, Kumasawa has begun the preparations for breakfast.@k@v14/11600116. She said that she will need just a little longer."'
4192: '@rThe clock read a little past 8 a.m.'
4193: '@rEight o''clock was the time that breakfast was supposed to have started.@k@rThe mere fact that the hosts had gone over that time limit was a disgrace under normal circumstances.'
4194: 'Genji@r@v14/11600117."......Kanon is now searching outside.@k@v14/11600118. ...Furthermore, no one has seen Shannon."'
4195: 'Natsuhi@r@v03/10900254."Even Shannon?@k @v03/10900255..........Honestly, how many people has my husband taken on this walk of his?"'
4196: '@rHow many people couldn''t be found?'
4197: '@rWith the number of people having grown so large, it was starting to feel truly unpleasant, as though they were the only ones being left out on something interesting.'
4198: '@rAt the very least it looked like the children, no, Maria especially felt the same way.'
4199: '@rShe was indignant, her stomach grumbling, almost as though her mother and the others had left her alone to go off and eat something delicious without her.'
4200: '@rTrying to fix her bad mood, the other children were flipping through the channels on the television, trying to find a program that might interest Maria.'
4201: '@rNanjo was sitting on the sofa, gazing blissfully at the children while reading a book.@k No doubt it was a book about chess.'
4202: '@rThe sound of footsteps came rushing towards them with a pitter-patter.@k@rThere was only one set, so they realized before they saw the source that it was not Krauss and the rest, but probably Kanon.'
4203: 'Kanon@r@v16/10600129."............Madam, excuse me."'
4204: 'Natsuhi@r@v03/10900256."Judging by your appearance, you still haven''t been able to find them."'
4205: 'Kanon@r@v16/10600130."...My apologies.@k@v16/10600131. I still—"'
4206: 'Natsuhi@r@v03/10900257."That will be enough.@k@v03/10900258. You''ve worked hard."'
4207: '@rShe didn''t know where they were, but they had to be somewhere on this island.@k@rThey hadn''t put anything in their mouths since last night, so their stomachs must be growling about now.'
4208: '@rThey would surely saunter in any time now.'
4209: '@r...Natsuhi was already dumbfounded, and she had begun to think that there was no urgent need to find them right then.'
4210: 'Natsuhi@r@v03/10900259."I will go to the kitchen to prepare some tea for all of the guests.@k@v03/10900260. Thanks to both of you for all of your hard work so early in the morning."'
4211: '@rNatsuhi, acting as though the release in tension had caused a new surge in her headache, left the parlor.'
4212: '@r...Kanon tried to call her as she left, but Natsuhi departed swiftly.'
4213: 'Genji@r@v14/11600119."............What is it?@k @v14/11600120.Was there something else?"'
4214: 'Kanon@r@v16/10600132.".........Yes.@k@v16/10600133. ...I was unable to find her husband or anyone else, but,@v16/10600134. .........ummm."'
4215: '@rKanon sounded evasive.@k@rHe still didn''t know where they were, but maybe he had found something with some relation to that.'
4216: '@rWhen Eva and Hideyoshi noticed this exchange of words, they came over.@k@rThey had probably noticed the slightly strange way Kanon was acting.'
4217: 'Hideyoshi@r@v06/11100217."What''s goin'' on, Kanon-kun?@k@v06/11100218. Did you find Krauss nii-san and the others?"'
4218: 'Kanon@r@v16/10600135."......Actually...@k@v16/10600136. Something looked odd about the rose garden storehouse."'
4219: 'Genji@r@v14/11600121."............Something looked odd...?@v14/11600122. What do you mean by that?"'
4220: 'Kanon@r@v16/10600137."......It was, um,@k@v16/10600138. .........how should I explain it..."'
4221: '@rKanon once again hesitated.@k@r...He wasn''t speaking anything like you''d expect from the usually fearless Kanon.'
4222: '@rEva and Hideyoshi exchanged quizzical looks at this display...'
4223: 'Eva@r@v05/11000346."What do you mean?@k @v05/11000347.You don''t mean to say they''re inside the storehouse?"'
4224: 'Kanon@r@v16/10600139."No, ...I am going to inspect the inside now.@k@v16/10600140. I was just returning to get the key, but...@k@v16/10600141. ......Umm..."'
4225: 'Hideyoshi@r@v06/11100219."I don''t really get it, but it sounds like we just gotta investigate inside, right?@k@v06/11100220. Where''s the key to that storehouse?"'
4226: 'Kanon@r@v16/10600142.".........It is in the servant room.@k@v16/10600143. Let us check inside the storehouse immediately."'
4227: '@rKanon dashed off to the servant room and returned with the key.'
4228: '@rGenji left the parlor, saying that he would go check, but Eva and Hideyoshi also followed.'
4229: '@r...What was this "something odd about the storehouse" that had caused the usually fearless Kanon to hesitate?'
4230: '@rIt was still pouring outside, but their curiosity over this "something" that Kanon couldn''t talk about won out.'
4231: '@rWhile the children made a big fuss watching television, Kanon and the rest dashed off to the entrance...'
4232: '@rThe rose garden storehouse was a place that housed various tools used to manage the garden.'
4233: '@rIt was definitely not a pretty building.@k@rBecause of its appearance, it had been built hidden in a corner of the rose garden.'
4234: '@rKanon, Genji, Eva, and Hideyoshi came cutting across the rose garden holding umbrellas.'
4235: '@rThey entered a small path just off the rose garden, which was not used by those simply appreciating the garden, but only by those maintaining it.'
4236: '@rAs they dashed further along it, the front of the storehouse came into view.'
4237: '@rIt was a very old shed of a storehouse, and compared to the flawlessly perfect beauty of the rose garden, it was pretty seedy-looking.@k It was easy to understand why it had been built in a hard-to-see place.'
4238: '@rEva and Hideyoshi arrived at the storehouse long after Kanon and Genji.'
4239: 'Hideyoshi@r@v06/11100221."Hah...@v06/11100222.hah...@k@v06/11100223. You two sure are fast...!@k @v06/11100224.I thought my heart was gonna explode..."'
4240: 'Eva@r@v05/11000348."I guess they did build a storehouse over here.@k@|@y@v05/11000349. .........bu—@v05/11000350.wha-@v05/11000351.......what is that...?"'
4241: '@rWhen Eva looked at where Kanon was pointing, she was at a loss for words.@k@rNoticing this, Hideyoshi also followed Kanon''s finger and was likewise too shocked to speak.'
4242: '@rThe entrance to the storehouse was a kind of shutter.@k ......And there, .........'
4243: '@r......Everyone there now understood why Kanon had been unable to find words that could describe what he saw.'
4244: '@rOn the shutter, which was completely filthy from being exposed to wind and rain for so long,@k ......plastered on it...'
4245: '@r......Something that looked like a strange dark red...liquid?@k Mucus?@k Or maybe it was some sticky paint...@k ...Some kind of ghastly substance...had been used to draw an indescribably eerie shape.'
4246: '@rThe rain had caused it to drip down in several places, like fresh blood leaking from an open wound...'
4247: '@rThere was no longer any point in being choosy with words.'
4248: '@r......A ghastly dark red substance meant to look like blood...@k...had been used to draw some kind of figure or mark,@k ...intended to suggest something ominous.'
4249: '@r...Two concentric circles were drawn there, and inside them was a design that looked like a cross.'
4250: '@rThe four ends of the cross were widely exaggerated, and it looked like some kind of crest from somewhere around Europe.'
4251: '@rAnd in the cracks between these shapes, written closely packed together, were some unfamiliar characters,@k or possibly symbols......'
4252: 'Hideyoshi@r@v06/11100225.".........What a vulgar bit of graffiti...@k@v06/11100226. ......Could this be...one of those?@k @v06/11100227.One of those magic circles used in demonic rituals?!"'
4253: '@rWith reference to this ghastly shape, drawn with a deep-red, dripping substance, Hideyoshi''s comparison was not unreasonable.'
4254: 'Eva@r@v05/11000352."When was this drawn...?!"'
4255: 'Kanon@r@v16/10600144."......Last night, I came here before it started raining, but there was nothing drawn here at that time."'
4256: 'Genji@r@v14/11600123."............We must do something before anyone else sees this.@k@v14/11600124. If they laid eyes upon it, it would cause them great discomfort......"'
4257: 'Eva@r@v05/11000353."That''s right...@k@v05/11000354. Even though it''s just a shed, I don''t want to leave such an unpleasant scribble untouched for even one second."'
4258: 'Genji@r@v14/11600125."There is some paint inside the storehouse.@k@v14/11600126. Let us paint over it temporarily as an emergency measure,@v14/11600127. then repaint it again someday when the weather is good.@k@v14/11600128. .............................."'
4259: '@rGenji remembered that he had just recently seen another piece of graffiti, and that it too had been made with a strange, dark red substance of the same color as this...'
4260: '@r.........That must have been...@w500. .........That''s right, he had seen it on the door to Natsuhi''s room...'
4261: 'Eva@r@v05/11000355."Kanon-kun.@k@v05/11000356. Let''s remove this graffiti quickly and return, alright?@k @v05/11000357.Even though it''s just a storehouse, it''s really irritating to have graffiti around the home I was brought up in."'
4262: 'Kanon@r@v16/10600145."......Yes.@k@v16/10600146. I will take care of it immediately..."'
4263: '@rKanon squatted in front of the shutter and unlocked it.@k@rHe then lifted it up with all of his strength.'
4264: '@rA boisterous noise resounded, and the eerie shape drawn on the shutter began to get sucked in through the top as the shutter was raised.'
4265: '@r...At least for the time being, that ominous thing disappeared from their direct gaze, and they all breathed a sigh of relief...'
4266: '@rThanks to a kids'' program that they had come across, Maria was feeling much better.'
4267: '@rBattler and Jessica were making fun of the kids'' program at every turn, cackling.'
4268: '@rGeorge was enjoying the program along with Maria.'
4269: '@rNanjo sat on a sofa by himself, passing the time by reading quietly.'
4270: '@rThey heard hurried footsteps coming from the hallway.'
4271: '@rThey were footsteps from a single person.'
4272: '@r...Did that mean that it wasn''t the group of four that had just left?'
4273: '@rGenji was the one who had returned.'
4274: '@rIt was very rare for Genji, who considered being out of breath a violation of a servant''s virtues,@k to be gasping for air.'
4275: '@rHe had probably come dashing back from outside the mansion.@k@rHis shoulders were soaking wet, and he didn''t have his usual smart appearance.'
4276: '@rWhen Genji noticed Nanjo looking at him, he gave a small, silent bow and quickly approached him.'
4277: 'Genji@r@v14/11600129.".........Doctor Nanjo, my apologies.@k@v14/11600130. Please, come with me, quickly."'
4278: 'Nanjo@r@v19/11900109."Wh-@v19/11900110..........what has happened?"'
4279: '@rAs Genji whispered something into Nanjo''s ear, Nanjo''s face changed color.'
4280: '@rHe stood from the sofa, trying not to be noticed by the children who were still engrossed by the TV,@k and the two of them rapidly left the parlor, muffling their footsteps.'
4281: '@rJust as they were leaving the parlor, they came across Natsuhi, who was pushing a serving cart loaded with a tea set.'
4282: '@rGenji whispered something into Natsuhi''s ear, and Natsuhi''s face too changed color, shocked.'
4283: '@r...Then, leaving the serving cart where it was, the three of them started dashing towards the entrance...'
4284: '@rGeorge noticed them running down the rose garden through the window.'
4285: 'George@r@v07/10300462."......What''s this?@k@v07/10300463. Genji-san and Doctor Nanjo and,@v07/10300464. ......and that''s Aunt Natsuhi, isn''t it?"'
4286: 'Battler@r@v10/10100720."What''s up, Aniki?"'
4287: 'George@r@v07/10300465.".........Maybe something has happened.@k@v07/10300466. They looked horribly flustered."'
4288: '@rJessica and Maria also realized that something had happened from the fact that Eva, Hideyoshi and Nanjo were no longer in their seats,@k and because the serving cart had been abandoned at the entrance to the parlor.'
4289: 'Jessica@r@v04/10200438."Could there have been some kind of accident...?"'
4290: 'Battler@r@v10/10100721."...Let''s go check it out.@k@v10/10100722. It''s no fun if we''re the only ones left out, right?@k @v10/10100723.Ihihi!"'
4291: '@rFor some reason, what Battler said sounded extremely indiscreet.'
4292: '@r...But they couldn''t deny that they were a little insecure and concerned after seeing the adults run off into the rain disregarding their appearance.'
4293: 'Jessica@r@v04/10200439."......Let''s check it out, alright?@k @v04/10200440.I need to know what''s happened..."'
4294: '@rJessica''s insecure words spoke for all of them.'
4295: 'Battler@r@v10/10100724."Hey Maria, are you coming too?@k @v10/10100725.Or will you watch TV?"'
4296: 'Maria@r@v13/10400532."Uu!@k @v13/10400533.I want TV!@k @v13/10400534.Uuu."'
4297: 'George@r@v07/10300467."Then the rest of us will go by ourselves.@k@v07/10300468. Maria-chan, we''ll be back soon.@k@v07/10300469. Stay here watching TV."'
4298: 'Maria@r@v13/10400535."Uu!"'
4299: '@rBy the time the kids went outside, they had lost sight of the adults, who had left earlier.'
4300: '@rBut it looked like Jessica had a pretty good idea of where they had gone from the direction they had been running.'
4301: '@rFollowing Jessica, they ran through the rain-soaked rose garden...'
4302: '@rIt felt like the wind suddenly got stronger.@k@r...The malicious sound of thunder began to ring out like it had the previous night.'
4303: '@rIt felt like something eerie had surrounded the island, and was trying to stop them from moving forward.'
4304: 'Battler@r@v10/10100726."Jessica, what''s over this way?!"'
4305: 'Jessica@r@v04/10200441."I''m pretty sure there''s a storehouse for gardening tools or something."'
4306: 'George@r@v07/10300470."What in the world could there be in a place like that..."'
4307: '@rJust as Jessica had said, a storehouse came into view in front of them.@k@rThey could also see the adults there.'
4308: '@rThe shutter to the storehouse was open, and several of the adults looked as though they were searching for something.'
4309: '@rFor some reason, only Natsuhi was outside the storehouse, not even holding an umbrella; she was facing away from them, and it looked like she was hanging her head...'
4310: '@rThe ones who had just left—Genji, Nanjo, Natsuhi—'
4311: '@rand the ones who had left before them—Kanon, Eva, and Hideyoshi—made this a large gathering of people, but there was absolutely no bustle of activity.'
4312: '@rWhen Natsuhi realized that the children had come, a terrible expression rose to her face, and she ran at them with her arms spread wide.'
4313: 'Natsuhi@r@v03/10900261."Don''t come over here!!!@k @v03/10900262.Go back to the mansion!!"'
4314: '@r......However,@w333. ...no,@w250. because of that,@w416. the kids saw that scene which Natsuhi was trying to keep them away from.'
4315: '@rInside the storehouse with the shutter wide open, a flickering fluorescent light shone down.@k And over there, ......'
4316: 'Jessica@r@v04/10200442."KyaaaaaAAAAAAaaaaaAAaa!!!"'
4317: '@rJessica''s piercing shriek rang out.'
4318: '@r...But that was just because Jessica''s scream was the loudest.@k ...The same thing spilled out of Battler and George''s mouths as well...'
4319: '@rEva, just like Natsuhi, spread her arms, and with a terrible expression roared at the kids.'
4320: 'Eva@r@v05/11000358."George, take everyone and return to the mansion!!!@k @v05/11000359.Quickly!!@k @v05/11000360.Right now!!"'
4321: '@rWhen Natsuhi had spread her arms, one might have thought that she was trying to prevent them from advancing any further.'
4322: '@r...However, right now, that wasn''t why Eva was spreading her arms.'
4323: '@r...She was trying to hide that terrible scene from the kids.'
4324: '@rIt was her mother''s heart, trying to protect the eyes and hearts of us children by attempting to block our view of that terrible scene by at least the width of one of her arms!'
4325: 'Battler@r@v10/10100727."......Is this some kind of joke? Is it...?!"'
4326: '@r...I had seen this kind of cheap scene all too often.@k@rIn manga, TV, anime, and movies, I had seen it over and over again...'
4327: '@rThis was just, just seeing something appear in real life that I had seen plenty of times before in some of those more sensational movies, wasn''t it...?!!'
4328: '@rThat alone shouldn''t...@w416. Aaaaah,@w500. but that, that suit,@w333. ...it''s that old bastard''s, isn''t it...?@k I get it, then that''s Uncle Krauss...@k And Kyrie-san, and Auntie Rosa, uwooOOOOOOoooooOOo!!!'
4329: 'Jessica@r@v04/10200443."Dad, DAD!!!"'
4330: 'Natsuhi@r@v03/10900263."You mustn''t, Jessica!!@k @v03/10900264.You mustn''t go in!!@k @v03/10900265.You mustn''t look!!!"'
4331: 'Jessica@r@v04/10200444."Dad, Dad!!@k @|@y@v04/10200445.HyyaaaaaAAAAAAa!!!"'
4332: 'Nanjo@r@v19/11900111.".........Rigor mortis has set in across the entire body...@k@v19/11900112. ......Probably,@v19/11900113. at least six hours have passed since death...@k@v19/11900114. As far as I can tell by looking at the damaged area, there is a high probability that they were damaged after their deaths..."'
4333: 'Nanjo@r@v19/11900115."......No, I must watch what I say...!@k @v19/11900116.I''m a general practitioner...examining corpses is outside my area of expertise...!"'
4334: 'Hideyoshi@r@v06/11100228."......So what does that mean?@k@v06/11100229. Just killin'' them wasn''t enough, ...so they went on to do somethin'' like this?!!@k @v06/11100230.The devil, this here''s the work of the devil!!"@|@y'
4335: '@rAunt Natsuhi caught Jessica in her arms and Auntie Eva caught George-aniki,@k ......so I was the only one who could approach the entrance to the storehouse.'
4336: '@r............Aah,@w500. ...if only there had been someone here to catch me too,@k ......I wouldn''t have needed to have this horrible, evil scene burned into my eyes...'
4337: '@r......No, that''s not it.'
4338: '@r...I''m standing here, not because the people who would catch me aren''t here...@k but because the people who would catch me are right there!!'
4339: '@r...Just as Jessica had said, it did look like a storehouse used to keep gardening tools.'
4340: '@rA lawn mower and its replacement blades,@k a grass sickle and a hammer,@k a saw and some construction tools...@k Piled up potted plants and bags of fertilizer.'
4341: '@rAnd treated just the same, the corpses of several people had been laid to rest there.@k No, had been thrown in there!'
4342: '@rI could tell them by their clothes.'
4343: '@r......That old bastard and Kyrie-san.@k ...Uncle Krauss and Auntie Rosa.@k ......Further back, ...Gohda-san and...@|@y@kthere''s still more of them?@k How many people died...@k ......Fucking hell, I can''t even count them on one hand, god fucking dammit!!!!!!!@|@y'
4344: '@rI didn''t know whether it had been one of these gardening tools, which if used for something other than their intended purpose could definitely be wielded with a naked brutality,@k or whether some horrible tool had been brought in here specifically for this.'
4345: '@r......Whatever the case,@w333. .........the bodies lying about here, each of them had been given an atrocious makeover.'
4346: '@r...This isn''t a damn makeover...this is more like...@w500."their faces have been plowed"...!'
4347: '@rTheir faces were smashed, forced into an expression that a normal person couldn''t make even after death.@k ...I couldn''t tell where the eyes or the nose were, but I could find the mouth...because it was gaping wide, the ridges of the teeth exposed!'
4348: '@rBut the front teeth were missing, and even the cheek that should have covered that was all torn up and exposed!@k The stylish makeup that he spent way too much time fussing over for a guy...is no help at all...!!'
4349: 'Battler@r@v10/10100728."...UwooooOOOOoooooooohh!!!@|@y@k @v10/10100729.Daaaaaaaaaaad!!@k @v10/10100730.@rSure, I always thought you were going to hell!"'
4350: 'Battler@r@v10/10100731."But you weren''t this bad, right?@k @v10/10100732.You weren''t such a son of a bitch to have this done to you!!@k @v10/10100733.And Kyrie-san,@v10/10100734. ......didn''t I tell you to stop going out with this guy...@k@v10/10100735. ...There was no reason...@v10/10100736....for you to go through this as well......"'
4351: 'Battler@r@v10/10100737."...There''s no face... There''s no fucking face...@k@v10/10100738. Shit shit shit shit, hiiiiiiiiiiiiiii!!!"'
4352: 'Nanjo@r@v19/11900117."......Battler-san, you mustn''t look any more...@k@v19/11900118. There''s no way that your mother and father would want you to see them like this...!@k @v19/11900119.For your mother and your father''s sakes, ...you mustn''t look any more!!"'
4353: 'Battler@r@v10/10100739."Dead people are supposed to have faces that look like they''re sleeping peacefully, aren''t they?!@k @v10/10100740.There''s no face, my dad and Kyrie-san have no faces!!@|@y@k @v10/10100741.I don''t even know what kind of faces they were wearing when they died!!"'
4354: 'Battler@r@v10/10100742."What the hell am I meant to do?!@|@y@k @v10/10100743.Are you telling me I have to see these mangled monstrous faces every time I remember Dad and the rest?!@|@y@k @v10/10100744.Well that''s perfect,@|@y@v10/10100745. ''cause I didn''t even want to remember that old bastard''s smug face anyway, this is perfect, perfect!!@|@y"'
4355: 'Battler@r@v10/10100746."But you know, why Kyrie-san''s face as well...?@k @v10/10100747.Kyrie-san wasn''t a bastard...@k@v10/10100748. ...I sometimes got a little sick of her, but...@v10/10100749.she was a little cool, just like a big sister to me......"'
4356: 'Battler@r@v10/10100750."......She didn''t deserve this...@v10/10100751. She didn''t deserve this......!!@k @v10/10100752.At least Uncle Krauss is better, isn''t he?!!@k @v10/10100753.It''s not his whole face, just the side!!@k @v10/10100754.He at least has half of his fucking face left!!@k @v10/10100755.Better that than this, better that than this!!"'
4357: 'Jessica@r@v04/10200446."NooooooooooooooooooOOOOOOOOOOooooooooooooooooooOOOOOooooo!!!"'
4358: '@rTrying to shut out my reckless words, Jessica tried to fill her ears with the sound of her own screaming.'
4359: 'George@r@v07/10300471."...Stop it, Battler-kun...!@k @v07/10300472.Just stop it...just stop it......!"'
4360: 'Battler@r@v10/10100756."Aniki, Aniki!!@k @v10/10100757.UoooOoooOOOooooooooo!!!"'
4361: '@rDisregarding age and appearance,@k ......I fell to my knees, clinging to Aniki''s waist and sobbing.'
4362: '@rIt was as if I was crying on behalf of everyone there...'
4363: '@rRepresenting the feelings of everyone there, I screamed over and over......'
4364: 'George@r@v07/10300473."...............Father...@k@v07/10300474. .........The ones who d—@v07/10300475. .........who are lying over there are...@v07/10300476.Uncle Krauss, Uncle Rudolf, Auntie Kyrie,@k@v07/10300477. Auntie Rosa, Gohda-san...@v07/10300478. ...............Five people...?"'
4365: 'Hideyoshi@r@v06/11100231."............No.@k@v06/11100232. ......Six.@k@v06/11100233. ......There''s...@v06/11100234.one more here..."'
4366: '@rThe body that Hideyoshi was looking down on now...was hidden in the shadow of a mountain of random objects,@k in a blind spot to George, who stood by the entrance.'
4367: '@r...So George couldn''t tell...whose body it was......'
4368: '@r...Therefore, .........George cursed himself.@k@rHe cursed that part of himself that imagines the worst......and is always right...!'
4369: 'George@r@v07/10300479."...So,@v07/10300480. ......the one lying at your feet is...@v07/10300481..........Sha-@v07/10300482....Shannon, isn''t it.........?"'
4370: 'Hideyoshi@r@v06/11100235.".........Yes.@k@v06/11100236. ......It''s Shannon-chan."@|@y'
4371: 'George@r@v07/10300483."....................."'
4372: '@rGeorge was completely silent.@k ......He shook slightly, his lower lip trembling...'
4373: '@rHe wanted to run up to his beloved, screaming and crying.'
4374: '@r...But, .........before rashly running up to her,@k ......he mustered up all of his strength, and asked his father.'
4375: 'George@r@v07/10300484."......Is Shannon also...@k@v07/10300485.......the same as...@k@v07/10300486..........Uncle Krauss and the others?"'
4376: 'Hideyoshi@r@v06/11100237."................................."'
4377: '@rHideyoshi deeply understood the meaning of those words.@k@r...So he couldn''t give George a quick answer.'
4378: '@r......No, ......he thought that, to George right now, that was the only possible sincere and loving response.'
4379: '@rWhen George had asked whether she was the same,@k ...he had meant to ask whether her corpse was the same as the others.'
4380: '@r......Since Hideyoshi hadn''t denied it,@w416. .........it meant that the body was just as horrible.'
4381: 'George@r@v07/10300487."............Can I...@v07/10300488....look at Shannon.........?"'
4382: 'Hideyoshi@r@v06/11100238.".....................No,@v06/11100239. .........you can''t."'
4383: 'George@r@v07/10300489."......Why...?@k @v07/10300490.After all, ......I won''t be able to see Shannon''s face again, right...?@k @v07/10300491.So, ......why can''t I see...@k@v07/10300492....her last face......?"'
4384: 'Hideyoshi@r@v06/11100240."......The last time you met Shannon-chan was yesterday?"'
4385: 'George@r@v07/10300493.".........Yes."'
4386: 'Hideyoshi@r@v06/11100241."I see...@k@v06/11100242. .........When you left her,@v06/11100243. what kind of face was she showin'' you...?"'
4387: 'George@r@v07/10300494.".................................@k@v07/10300495.It was a wonderful smile."'
4388: '@rAfter receiving the ring,@k ......she was bewildered even though her heart should have been decided,@k bashful,@k ...and so embarrassed to show him that face that she ran away...@k ...That expression was revived in George''s mind...'
4389: 'Hideyoshi@r@v06/11100244."............I see.@k@v06/11100245. ......Then, I''m sure Shannon-chan......would also have wished to leave you with that smile."'
4390: '@r...Hideyoshi looked down upon Shannon''s body lying at his feet.@k@r.........Just like the other bodies, it was in such a horrible state that it would make anyone want to cover their eyes.'
4391: '@r......Half of the face had been smashed off, and no more than half of her expression remained.'
4392: '@r.........If that remaining half, soaked red with blood,@k had been wiped clean, that graceful smiling face might have peeked out.@k .........Only half of it......'
4393: '@rWithout thinking, Hideyoshi slapped his hand over his eyes.@k@r......How cruel...'
4394: '@rIf only all of it had been crushed, if they were going to crush it; then he might have been able to deceive George''s heart for a while by saying that it was just someone else wearing Shannon''s clothes.'
4395: '@rYet, they had left half of the face...!'
4396: '@rIt caused the body so much humiliation, ......and also made it clear that this body was none other than Shannon!@k How inhuman, how monstrous...'
4397: '@rThere at Hideyoshi''s feet, trying his best to burn the image of the remaining half of Shannon''s expression into his eyes, was Kanon.'
4398: '@r......Kanon was not crying.@k@r...Tears had risen to his eyes, but they did not drip down.'
4399: '@rBut that didn''t mean that he wasn''t feeling as much sadness as everyone else.'
4400: '@r......Losing Shannon, who had lived with him in the Gospel House,@k whom he had loved as a sister,@k must have been just the same as losing a blood relative...'
4401: 'Hideyoshi@r@v06/11100246."............George.@k@v06/11100247. ......I''m sure Shannon-chan...@k@v06/11100248.would be grateful...@k@v06/11100249. She wouldn''t want you to see her like this.@k@v06/11100250. .........I''m sure...@v06/11100251....she''d be thankin'' you for stayin'' strong..."'
4402: 'George@r@v07/10300496."......I understand.@k@v07/10300497. .........I understand, Father, ......I understand......"'
4403: '@rGeorge leaned against the outside wall of the storehouse, ...sinking down powerlessly.'
4404: 'George@r@v07/10300498.".........Father.@k@v07/10300499. ......I have a request."'
4405: 'Hideyoshi@r@v06/11100252."What is it......?"'
4406: 'George@r@v07/10300500."......I want you to look for me.@k@v07/10300501. ...............On Shannon''s finger,@k@v07/10300502. .........is there a ring...?"'
4407: 'Hideyoshi@r@v06/11100253."...A ring......?@k @v06/11100254.......Let me see..."'
4408: '@rHideyoshi crouched down.@k@r...As he did, Kanon silently pointed to one of Shannon''s hands.'
4409: 'Hideyoshi@r@v06/11100255."............Yeah,@v06/11100256. ......there is.@k@v06/11100257. It''s a diamond ring.@k@v06/11100258. And not a chip diamond.@k@v06/11100259. ...Must have been pretty expensive..."'
4410: 'George@r@v07/10300503."And,@k@v07/10300504. ...............which hand,@k@v07/10300505. which finger is it on?"'
4411: 'Hideyoshi@r@v06/11100260."......Hmm,@v06/11100261. the ring finger of her left hand.@k@v06/11100262. ......I see...@v06/11100263. ......So Shannon-chan...@v06/11100264.was engaged..."'
4412: 'Eva@r@v05/11000361."...............George...@k@v05/11000362. ......You...couldn''t have—"'
4413: 'Hideyoshi@r@v06/11100265."Eva!!@k @v06/11100266.Right now that doesn''t matter!!@k @v06/11100267.A man made a lifelong promise to Shannon-chan...!@k @v06/11100268.A man promised her happiness for life...@k@v06/11100269. It doesn''t matter who it was!"'
4414: 'Hideyoshi@r@v06/11100270."Being told that by a man...@v06/11100271. ......It''s a woman''s dream, isn''t it...?@k@v06/11100272. ...I don''t know when she received this ring.@k@v06/11100273. I also don''t know who gave it to her!@k @v06/11100274.But,@v06/11100275. .........even so, Shannon-chan took this ring."'
4415: 'Hideyoshi@r@v06/11100276."And, ...she accepted it, and put it on her left ring finger.@k@v06/11100277. ...I''m sure the man who gave it to her...@v06/11100278.was happy too."'
4416: '@rTo most of the people there, Hideyoshi was simply disturbed by this extraordinary situation and was blurting out strange things.'
4417: '@r.........But...@w333....to those who really knew the truth...@w583.about George and Shannon''s relationship,@w833. ......everything he said made sense.'
4418: 'George@r@v07/10300506."............I see.@k@v07/10300507. .........Thank you,@v07/10300508. ............Father."'
4419: '@rGeorge stood up.@k The traces of tears still streaked his face, but his expression had returned to its usual calm...'
4420: 'George@r@v07/10300509."......Let''s go.@k@v07/10300510. Battler-kun, Jessica-chan.@k@v07/10300511. ......If we stay here any longer, we''ll get in the way of the adults."'
4421: 'Jessica@r@v04/10200447."............*sniff*@k@v04/10200448. .........You''re right..."'
4422: '@rJessica sniffled once, and, trying to say that she was alright, she showed her face to her mother, who had been holding her the whole time.'
4423: '@r...When she faced George again, she once again had on her usual face.'
4424: '@r......Although she still couldn''t recover her smile.'
4425: 'Jessica@r@v04/10200449."......Battler...@k@v04/10200450. Don''t lose heart........."'
4426: '@rBattler kept on crouching in front of his parents'' bodies...'
4427: 'Battler@r@v10/10100758."........................I''m sorry.@k@v10/10100759. ...It took this much crying to calm me down...@k@v10/10100760. You bastard, Dad, ...I bet you''re laughing at me, always talking shit about you,@k@v10/10100761. then crying like a baby just ''cause you died."'
4428: 'Battler@r@v10/10100762."......It''s not my fault...@k@v10/10100763. It''s wired into our genes to cry when our parents die...!"'
4429: '@rBattler''s face was still bright red from the tears, but even though it was forced,@k ...he had at least recovered enough to fake a smile.'
4430: 'Natsuhi@r@v03/10900266."......Kanon.@k@v03/10900267. ...You mustn''t remain here any longer either.@k@v03/10900268. Take the children and return to the mansion."'
4431: '@rNatsuhi, unable to take a step into the storehouse, had been standing under the rain the whole time.@k ...Maybe she had her own way of grieving, different from Battler''s.'
4432: '@rShe realized that she had to take on a sense of responsibility now that her husband was dead,@k ......so she gave Kanon those orders.'
4433: 'Kanon@r@v16/10600147."...............Yes.@k@v16/10600148. Madam."'
4434: '@rKanon rose silently, and turned to face them.'
4435: '@r......His face was pure white, almost as though his own heart had died along with Shannon;@k ......there was no life in his expression.'
4436: '@rIf, during the course of a normal day, he had been instructed to do a tour of the beautiful rose garden,@k Kanon may have led the way for them.'
4437: '@r......But now, there was no distinction between Kanon and the children.@k@r...They were now just kids of about the same age...with the wounds of having lost someone close to them.'
4438: '@rAfter seeing the children go back, Natsuhi gave orders to Genji.'
4439: 'Natsuhi@r@v03/10900269.".........Genji.@k@v03/10900270. ...Contact the police immediately.@k@v03/10900271. They probably won''t be able to come until the typhoon passes, but they should be able to tell us what to do next."'
4440: 'Genji@r@v14/11600131."......Understood.@k@v14/11600132. There is an emergency radio, so I will use that to contact them."'
4441: '@rWhen she heard that, Natsuhi remembered.@k@rThat''s right, the telephones were out today, weren''t they...'
4442: '@rHowever, since it had been assumed that there could be trouble with the phones on this isolated island, a radio had been installed.'
4443: '@r......Anyway, let''s contact the police and seek their instructions.@k@r...Everything else can wait.'
4444: 'Natsuhi@r@v03/10900272.".........Doctor Nanjo.@k@v03/10900273. .........Is there anything further you can do here?"'
4445: 'Nanjo@r@v19/11900120."Unfortunately...@k@v19/11900121. .........I cannot do anything........."'
4446: 'Natsuhi@r@v03/10900274."............Understood.@k@v03/10900275. ...Genji, could you at least cover their faces with something?@k@v03/10900276. Exposing them like this is humiliating to them as well..."'
4447: 'Genji@r@v14/11600133.".........Yes."'
4448: '@rGenji picked up several towels hanging inside the storehouse,@k when Eva stopped him in a shrill voice.'
4449: 'Eva@r@v05/11000363."Wait a second!@k @v05/11000364.Stop.@k@v05/11000365. This is the scene of the crime, isn''t it?@k @v05/11000366.Then we can''t disturb it.@k@v05/11000367. In our confusion, we''ve tracked muddy footprints all over the scene, and I''m sure that will have caused trouble for the police''s investigation!"'
4450: 'Natsuhi@r@v03/10900277."........................"'
4451: '@rNatsuhi glared at Eva testily.@k@r......Objectively speaking, Eva was right.'
4452: '@rEven so, she glared at Eva as though accusing her of refusing to do those tragic corpses,@k which had been humiliated even after death, the simple kindness of covering their faces.'
4453: '@r......However, Eva had spoken both calmly and correctly.'
4454: '@rThis horrible state was definitely not an accident.@k@rIt was a crime.@k ......Someone had killed them.@k It was a murder case.'
4455: '@rIn that case, they should be careful not to further disturb the site...'
4456: '@rThey had to aid the police as much as possible, so that they might hand over a clue that could be used to find the detestable culprit.'
4457: 'Nanjo@r@v19/11900122."............I agree with Eva-san.@k@v19/11900123_b. ...Until the police come, we should leave everything be..."'
4458: 'Genji@r@v14/11600134."......What do you say, Madam?"'
4459: 'Natsuhi@r@v03/10900278."...............You''re right.@k@v03/10900279. ...Understood.@k@v03/10900280. Close it up.@k@v03/10900281. ...And, just in case, we should put a different lock on it."'
4460: 'Hideyoshi@r@v06/11100279."......A different lock?"'
4461: 'Natsuhi@r@v03/10900282."Yes.@k@v03/10900283. ......When we came here, the shutter was locked.@k@v03/10900284. ...That means that the culprit used the key to the shutter to lock it."'
4462: 'Hideyoshi@r@v06/11100280."Th-......that makes sense.@k@v06/11100281. Then, does that mean that the key which opens this shutter will have the killer''s fingerprints?!"'
4463: 'Eva@r@v05/11000368."......I am sure it will be worthwhile to submit it to the police as evidence,@k@v05/11000369. but Kanon-kun handled it just as normal, and used it to open this.@k@v05/11000370. It will probably also have his fingerprints on it."'
4464: 'Eva@r@v05/11000371."Also, that key was handed to Genji just now, and he took it with his bare hands.@k@v05/11000372. ...It doesn''t look like it will be very useful as evidence."'
4465: 'Genji@r@v14/11600135.".........That was careless of me.@k@v14/11600136. ...My apologies..."'
4466: 'Hideyoshi@r@v06/11100282."Genji-san.@k@v06/11100283. Are there other keys to this storehouse?"'
4467: 'Genji@r@v14/11600137."......No.@k@v14/11600138. Only this one."'
4468: 'Hideyoshi@r@v06/11100284."Which means that the killer walked out of the servant room with that key,@k@v06/11100285. ...and then conscientiously returned the key to where they found it, right......?"'
4469: '@rHideyoshi''s theory sounded plausible, but was actually very strange if you thought about it.@k@rWhy would they go to all the trouble of returning a key they stole?@k@r......No, if you think about it even more deeply, there are some even more bizarre points.'
4470: '@rUsually, when a criminal hides a body, they are trying to delay the point at which it will be found and use that time to escape.'
4471: '@rThe actual place where the six were killed wasn''t necessarily here, but they had been killed somewhere on this island,@k and it would be normal to think that the reason they had been carried to this storehouse was to hide the bodies and delay the discovery of the crime.'
4472: '@r......But that graffiti drawn on the shutter that looked like an eerie magic circle...@khad eloquently indicated that the corpses were hidden here.'
4473: '@r......It didn''t specifically say that they were here, but after six people had gone missing,@k by making such an obvious scribble and even returning the key to open it,@k ......it seemed almost as though someone had wanted the corpses to be discovered here.'
4474: 'Natsuhi@r@v03/10900285."......In any case, a lock that the killer has opened once before will not be sufficiently trustworthy on its own.@k@v03/10900286. If we want to protect this place from the killer''s hand, I think we should put a new lock on."'
4475: 'Nanjo@r@v19/11900124."I think that is a good plan...@k@v19/11900125. I agree."'
4476: '@rGenji fished around inside the storehouse, and unsealed a brand-new padlock which had been inside a small box.'
4477: 'Genji@r@v14/11600139."What would you have me do with the key...?"'
4478: 'Natsuhi@r@v03/10900287."......I will take it.@k@v03/10900288. I will take responsibility and hand it over to the police."'
4479: '@rNatsuhi took the key to the padlock from Genji''s hand.'
4480: '@rAfter that, they all exited and lowered the shutter.'
4481: '@r......Because of that, the corpses were once again sealed behind that shutter, covered with that gruesome magic circle.'
4482: '@rGenji crouched down in front of the shutter to fasten the new padlock.'
4483: '@r...In addition to the main lock on the shutter, there is sometimes a place where you can attach your own lock in front of it.@k This was one of those types.'
4484: '@rIn the midst of the roar of thunder and the pouring rain, the storehouse stood there, ominously...@k@rOn its closed shutter was the magic circle, drawn in a creepy blood-like substance, and swallowing up the bodies of six whole people.'
4485: '@r......To Natsuhi, putting the new lock on may not have been entirely to preserve the scene for the police,@k ......but rather, she might have felt like she wanted to shut that mouth for all eternity,@k to prevent any more victims from being swallowed by that eerie demon......'
4486: 'Natsuhi@r@v03/10900289."......Come on, let''s go, everyone.@k@v03/10900290. ...Doctor Nanjo, thank you very much for your work.@k@v03/10900291. ...Genji, quickly, contact the police."'
4487: 'Genji@r@v14/11600140."I will contact them as soon as I return..."'
4488: '@rThe adults left the storehouse.'
4489: '@r...The ghastly magic circle drawn on the shutter,@k still swallowing the six bodies, loomed eerily, occasionally lit up by the lightning......'