5021: '@rLunch had ended, and the servants had removed the tableware, and were now in the kitchen.@k@rThe wind and rain had neither weakened nor strengthened, and the island remained cut off from the outside world.'
5022: '@rIt seemed that, at first, Natsuhi had planned not to let anyone set one foot outside the room,@k but when it came time to prepare lunch, she finally realized that this was impossible.'
5023: '@rHowever, in order to avoid having anyone alone in the kitchen, she told the three servants to go together.'
5024: '@rBecause of that, the servants were the first ones given the right to leave the stuffy parlor, which had been packed with eleven people.'
5025: '@r......Since breakfast had immediately followed that terrible incident,@k and many of them hadn''t eaten much, everyone tore into their lunches in silence.'
5026: 'Kumasawa@r@v18/11800088."I will wash the dishes, so you can rest a while, Genji-san, Kanon-kun.@k@v18/11800089. ...Do you want something to drink?"'
5027: 'Genji@r@v14/11600156.".........Nothing for me.@k@v14/11600157. .........Kanon?"'
5028: 'Kanon@r@v16/10600155."......Nothing for me either."'
5029: 'Kumasawa@r@v18/11800090."You two must have been so busy, and so early in the morning...@k@v18/11800091. It''s no wonder you''re worn out..."'
5030: '@rThe only sound was that of Kumasawa washing the dishes, which resounded throughout the kitchen.'
5031: '@rGenji and Kanon sat in some chairs a short distance away, their eyes lightly closed.'
5032: '@rJust as Kumasawa had said, those two had probably built up a great deal of fatigue.'
5033: '@rBut that didn''t mean they could let it show in front of the relatives.'
5034: '@r...Avoiding that was one of their virtues.'
5035: '@rAfter the silence had continued for some time,@k .........Kanon opened his mouth and muttered.'
5036: 'Kanon@r@v16/10600155_b."...............Shannon...@k@v16/10600155_c. ...............Why...did she have to die in such a horrible way...?"'
5037: 'Genji@r@v14/11600158."......Forget about how she died.@k@v14/11600159. .........It was nothing more than...bad luck."'
5038: 'Kanon@r@v16/10600156.".........You''re right.@k@v16/10600157. ...It was nothing more than bad luck..."'
5039: '@rThey both fell silent once again.@k ...Kanon''s expression was filled with grief.'
5040: 'Kumasawa@r@v18/11800092."To think that Shannon-chan''s actually dead...@k@v18/11800093. I still can''t believe it.@k@v18/11800094. ......Poor, poor Shannon-chan...@k@v18/11800095. ......Not being able to meet her again feels like a lie...@k@v18/11800096. I just wanted to see that girl''s smiling face one more time..."'
5041: '@rKumasawa spoke with her back facing them.'
5042: '@r...Kumasawa hadn''t seen Shannon''s corpse,@k so she had no trouble mentioning Shannon''s face.'
5043: '@r...When Kanon heard those words, it reminded him again of how only half of Shannon''s face had been left, and his grieving expression twisted even further...'
5044: 'Kanon@r@v16/10600158.".........Why did BEATRICE-sama do that to Shannon...?@k@v16/10600159. ......If she wanted a sacrifice, there were plenty of others to choose from...@k@v16/10600160. ......Why... ......Why...?!"'
5045: 'Genji@r@v14/11600160.".........It was nothing more than bad luck.@k@v14/11600161. ...If chance had fallen even slightly differently, it could have been me or you lying out there."'
5046: 'Genji@r@v14/11600162."Or even someone else.@k@v14/11600163. ......Everything is left to fate."'
5047: 'Kanon@r@v16/10600161."Genji-sama.@k@v16/10600162. .........You said that the door to Madam''s room was stained with traces of something like blood, right...?@k @v16/10600163.The same substance that was painted on the shutter?"'
5048: 'Genji@r@v14/11600164."......Yes.@k@v14/11600165. ...It was an unpleasant mark.@k@v14/11600166. Almost as though someone with blood-stained fingers had been trying to pull out the doorknob,@k@v14/11600167. ...no, scratch through the door...@k@v14/11600168. ...That sort of unpleasant mark."'
5049: 'Kanon@r@v16/10600164."So does this mean that...BEATRICE-sama came to visit Madam''s room,@k@v16/10600165. ......and tried to open the door, but...@v16/10600166.couldn''t...?@k@v16/10600167. Is that what this means...?"'
5050: '@rGenji thought back to the time he had seen those traces of blood on the door to Natsuhi''s room...'
5051: '@rWith the substance sticking to the door around the doorknob, and the marks of something scratching against the door...@k it had definitely appeared as though someone had tried to open the door,@w500. but couldn''t...'
5052: 'Kanon@r@v16/10600168."...Why...@v16/10600169.......was Madam not chosen as a sacrifice...?@k@v16/10600170. If only she had been chosen,@v16/10600171. ......Shannon wouldn''t,@v16/10600172. ......Shannon wouldn''t have had to die..."'
5053: '@rJust then, a loud, sharp noise resounded from the hall.@k@rBoth of them turned around, surprised.'
5054: 'Battler@r@v10/10100864."........................Sounds like a pretty interesting discussion you''re having.@k@v10/10100865. Let me join in too."'
5055: '@rBattler was standing in the doorway to the kitchen.'
5056: 'Kanon@r@v16/10600173."......Battler-sama.@k@v16/10600174. Please, excuse me..."'
5057: '@rGenji-san and Kanon-kun stood up, surprised, and hastily bowed.'
5058: '@r...But I didn''t care about stuff like that.@k@rI was more concerned with continuing their discussion.'
5059: 'Battler@r@v10/10100866."I told them I was going to the bathroom, so they let me go.@k@v10/10100867. I thought I''d suffocate if I was locked up in that room any longer."'
5060: 'Battler@r@v10/10100868."...When I was about to come ask you for some water, I overheard something pretty interesting.@k@v10/10100869. ......You don''t need to bow your heads or anything.@k@v10/10100870. Please, let me hear the rest."'
5061: 'Kanon@r@v16/10600175."............That just now......wasn''t really......"'
5062: 'Battler@r@v10/10100871."I''ve been listening to you for a while.@k@v10/10100872. Don''t try to hide it now."'
5063: 'Battler@r@v10/10100873."............So I''ll ask directly.@k@v10/10100874. ...Who is this BEATRICE?@k @v10/10100875.She''s supposed to be a witch from a kid''s story, but it doesn''t look that way now."'
5064: 'Kanon@r@v16/10600176."........................"'
5065: '@rKanon-kun averted his gaze.'
5066: '@r...It was obvious that he didn''t want to talk about this,@k ...which only made me want to ask even more.'
5067: '@rWhile making an effort to smile, I grabbed the collar of his shirt.'
5068: 'Battler@r@v10/10100876."......If it were last night, this''d be none of my business.@k@v10/10100877. But after this morning, everything''s changed.@k@v10/10100878. Now that Dad and the rest have been killed, this is totally my business.@k@v10/10100879. .........I have the right to listen to this suspicious story, don''t I...?"'
5069: '@rI glared into Kanon-kun''s eyes as he still continued to look away, in apparent pain.'
5070: '@r...Since there was a big difference in our heights, Kanon-kun had to stand on his toes, and it looked like it hurt a bit.'
5071: 'Kumasawa@r@v18/11800097."............Battler-san...@k@v18/11800098. ...Please let go of him...@k@v18/11800099. It''s not like Kanon-san is really hiding anything..."'
5072: 'Battler@r@v10/10100880."Then you won''t have any problem talking about it, right?@k@v10/10100881. It''s lonely being out of the loop, get it?"'
5073: '@rWhen I tried to further twist up his collar, Genji-san cut between us and spoke.'
5074: '@r...There was a slight sense of resignation on his face.@k@r......It looked like he didn''t plan on hiding anything.'
5075: 'Genji@r@v14/11600169.".........I can talk about it.@k@v14/11600170. ......Kanon only hesitated because you might have taken it badly, Battler-sama..."'
5076: 'Battler@r@v10/10100882."Hesitating isn''t very manly, is it?@k @v10/10100883.Keeping it a secret''s even more unpleasant."'
5077: 'Battler@r@v10/10100884."......Tell me about it.@k@v10/10100885. It''s not like I have anything better to do before tomorrow comes.@k@v10/10100886. A slightly shady story might be the best way to stave off boredom."'
5078: '@rAfter Genji-san and Kanon-kun looked at each other, they nodded as though they had decided to talk...'
5079: 'Kanon@r@v16/10600177."......Understood.@k@v16/10600178. Please ask us anything.@k@v16/10600179. ............We will talk."'
5080: 'Battler@r@v10/10100887."Right.@k@v10/10100888. Then I''ll ask."'
5081: 'Battler@r@v10/10100889."......Who in the world is BEATRICE?@k@v10/10100890. ...All I know is that she''s a witch who lives in the forest of Rokkenjima.@k@v10/10100891. ...I''ve heard that it''s a story that Grandmother or someone invented to keep people out of the dangerous forest.@k@v10/10100892. ......Is that wrong?"'
5082: 'Kanon@r@v16/10600180."............No, ...it isn''t wrong.@k@v16/10600181. It''s as you say.@k@v16/10600182. BEATRICE-sama is a witch who dwells in the forest of Rokkenjima."'
5083: 'Genji@r@v14/11600171."......Battler-sama.@k@v14/11600172. .........I don''t expect you to believe this all of a sudden, but...@k@v14/11600173.BEATRICE-sama exists.@k@v14/11600174. ...She is a real person, the one who gave the Master a vast amount of gold and who has worked by his side for many years."'
5084: 'Battler@r@v10/10100893."Huh...?@k @v10/10100894.Ah, come on...@k@v10/10100895. Is Grandfather paying you to repeat everything he says...?"'
5085: '@rI laughed like it was a joke,@k but neither Genji-san nor Kanon-kun laughed,@w500. ......not even Kumasawa baa-chan, who avoided my eyes, flustered, and started washing the utensils.'
5086: '@rSo unfortunately, I was the only one laughing.@k ...Painfully, bitterly.'
5087: 'Battler@r@v10/10100896."......I see now why you warned me, Genji-san.@k@v10/10100897. ...Anyone sane would take this badly.@k@v10/10100898. ............So you''re saying that a person named BEATRICE actually exists?"'
5088: 'Genji@r@v14/11600175."......Yes.@k@v14/11600176. She has been working for the Master since before the mansion was built on this island.@k@v14/11600177. ...Most likely, she has been working for him even longer than I have."'
5089: 'Battler@r@v10/10100899."What do you know, Kyrie-san''s theory was off...@k@v10/10100900. ......Grandfather really did have a confidante called BEATRICE.@k@|@y@v10/10100901. ......And she''s on the island now...?"'
5090: 'Kanon@r@v16/10600183."...............Yes.@k@v16/10600184. I believe that she is here."'
5091: 'Battler@r@v10/10100902."...That''s a vague way to say it.@k@v10/10100903. I guess that means you haven''t seen her face today or yesterday."'
5092: 'Kanon@r@v16/10600185."......Yes.@k@v16/10600186. ......It is extremely difficult to say, but...@v16/10600187....umm..."'
5093: '@rKanon-kun once again dropped his gaze, avoiding my eyes.'
5094: 'Battler@r@v10/10100904."...Come on, don''t just stop there.@k@v10/10100905. That''s like freezing an inch before the blow!"'
5095: '@rI urged him on jokingly.'
5096: '@r...However, it looked like Kanon-kun was still unsure as to whether he should speak or not.'
5097: '@r.........Then, Kumasawa baa-chan whispered.'
5098: 'Kumasawa@r@v18/11800100."...Hoh-hoh-ho...@k@v18/11800101. You cannot see her face,@v18/11800102. .........because BEATRICE-sama has no form..."'
5099: 'Battler@r@v10/10100906."............She has no...@v10/10100907.......what?"'
5100: 'Genji@r@v14/11600178."BEATRICE-sama has no body.@k@v14/11600179. ...Therefore, unless BEATRICE-sama wishes it, common people like us are not able to see her form."'
5101: 'Kumasawa@r@v18/11800103."I have heard that the portrait shows what BEATRICE-sama looked like back when she had a human form...@k@|@y@v18/11800104. ......I hear she often lingers in front of the portrait, yearning for her old form...@k@v18/11800105. ...Hoh-hoh-ho..."'
5102: 'Kanon@r@v16/10600188."BEATRICE-sama sometimes changes her form into glittering butterflies and shows herself.@k@v16/10600189. ......On the rare occasion that you spot them somewhere in the mansion, there is a rule that you absolutely mustn''t chase after them."'
5103: 'Kanon@r@v16/10600190."It is whispered that you will meet with disaster if you follow them.@k@v16/10600191. ...In fact, there was a servant who broke that rule and quit because of a great injury."'
5104: 'Battler@r@v10/10100908."......Wait a sec, are you kidding me?@k@v10/10100909. Are you all serious about this......?"'
5105: 'Genji@r@v14/11600180."...Battler-sama, BEATRICE-sama has already arrived.@k@v14/11600181. Such language may be unwise."'
5106: 'Kanon@r@v16/10600192."BEATRICE-sama is not fond of those who profane her.@k@v16/10600193. ......If you doubt her existence, you will surely meet with disaster."'
5107: 'Kumasawa@r@v18/11800106."Battler-san... You probably find this story unpleasant.@k@v18/11800107. But you know what?@k @v18/11800108.BEATRICE does "exist", okay?"'
5108: 'Genji@r@v14/11600182."......She "exists".@k@v14/11600183. BEATRICE-sama has an exceptional dislike of that being called into question."'
5109: 'Kanon@r@v16/10600194."............Don''t you understand, Battler-sama?@k@v16/10600195. ......BEATRICE-sama has already arrived here..."'
5110: 'Battler@r@v10/10100910."...Come on, quit it.@k@v10/10100911. I''m weak against that stuff, you know...?@k @v10/10100912.You''re freaking me out..."'
5111: '@rHowever, there was no trace of a joke in the eyes of the three servants.'
5112: '@rOn the surface, I laughed and tried to look unconcerned, but I was quickly starting to sober up.@k@r...Their eyes were also sobering up fast.'
5113: 'Kumasawa@r@v18/11800109."......Battler-san... I beg that you stop profaning BEATRICE-sama.@k@v18/11800110. Please trust me..."'
5114: '@rKumasawa baa-chan, who was usually cheerful and would always tease people,@k ......now spoke with a totally straight face that I had never known her to make.'
5115: 'Battler@r@v10/10100913.".........W-......well...@k@v10/10100914. Sure you say she exists...@k@v10/10100915. But I don''t see anything...@k @v10/10100916.Are you trying to say that she''s standing right next to me or something?@k @v10/10100917.Quit joking around..."'
5116: 'Maria@r@v13/10400586."Kihihihihihihihihihihihihihihihihi......"'
5117: '@rJust then, that unnerving laugh suddenly filled the kitchen...'
5118: '@r...When I turned around, Maria was standing there by the entrance.@k@r...But her expression and the feeling about her, her presence...felt exactly the same as the servants.'
5119: 'Maria@r@v13/10400587."...Whether your wavelength matches or not is determined at birth.@k@v13/10400588. Battler, you were born with a mismatched wavelength.@k@v13/10400589. That''s why you can''t see her,@k@v13/10400590. can''t meet with her,@k@v13/10400591. can''t talk to her."'
5120: 'Maria@r@v13/10400592."...Kihihihihihihihihihihihihihihihi.@k@v13/10400593. You''re the type BEATRICE hates the most."'
5121: '@rMaria''s laugh sounded like she was greatly enjoying herself, ...yet it was extremely eerie.'
5122: '@r......It was almost like she was laughing at me because I alone didn''t understand.'
5123: 'Maria@r@v13/10400594."Do you want to know about BEATRICE?@k @v13/10400595.............BEATRICE is a thousand-year-old witch.@k@v13/10400596. ......She has all the demons at her command, and can harness the power of alchemy to create the philosopher''s stone and a vast quantity of gold.@k@v13/10400597. Grandfather built up all of the vast wealth of the Ushiromiya family by making a contract with her."'
5124: 'Maria@r@v13/10400598."......Yesterday, I read BEATRICE''s letter, didn''t I?@k @v13/10400599.That was real.@k@v13/10400600. ...Well, I guess it''s pointless for me to try and force you to believe."'
5125: 'Maria@r@v13/10400601."...After all, it looks like you were born without a trace of the sixth sense.@k@v13/10400602. Kihihihihihihihihihihihihihihihihi...!"'
5126: 'Battler@r@v10/10100918."......What are you talking about?@k@v10/10100919. Witches, demons?@k @v10/10100920.Who told you that...?"'
5127: 'Maria@r@v13/10400603."Kihihihihihihihihi.@k@v13/10400604. I heard it from BEATRICE herself.@k@v13/10400605. Kihihihihihihihihihihi!"'
5128: '@rMaria kept doing that unpleasant laugh.@k@r...However, the servants who watched over this didn''t even blink.'
5129: '@rShe heard it from...that witch in the portrait adorning the entrance hall.@k@rMaria kept on laughing in a weird voice, as though this was nothing more or less than the truth...'
5130: 'Battler@r@v10/10100921."...Maria, it might be rude to ask, but I''ll ask one more time, okay...?@k @v10/10100922.Who gave you that letter yesterday?"'
5131: 'Maria@r@v13/10400606."I got it from BEATRICE. How many times must I tell you before you understand?"'
5132: 'Maria@r@v13/10400607."......You don''t get it, do you?@k @v13/10400608.You can''t see her, I know.@k@v13/10400609. You can''t believe it, I know!@k @v13/10400610....Kihihihihihihihihihihihihihihihi."'
5133: '@rJust then, Maria''s laughter suddenly stopped.'
5134: 'Maria@r@v13/10400611.".........Battler.@k@v13/10400612. You still can''t tell?@k @v13/10400613_1.That BEATRICE "exists"."'
5135: 'Battler@r@v10/10100923."She "exists", you say.........but where?"'
5136: 'Maria@r@v13/10400614_1."Like I said, BEATRICE "exists", right here."'
5137: '@r......That''s right.@k@rNow that I think about it, I''ve been feeling for some time now that the others haven''t been looking in quite the right direction.'
5138: '@r...I''d figured that everyone had just been gazing into the distance, but......that wasn''t the case.'
5139: '@rThe four here - Genji-san,@w500. Kanon-kun,@w500. Kumasawa-san,@w500. ...and Maria - @k ......everyone except me - @k ...............was looking at a spot right behind me......'
5140: '@rHolding my breath tightly, I slowly looked over my shoulder.'
5141: '@r...Of course, there wasn''t anyone there.@k@rI''ve known that the whole time!'
5142: '@r.........However, everyone in the room except me was focusing on that point as if there was someone there.'
5143: 'Maria@r@v13/10400615."BEATRICE is a great witch of gold who has lived for one thousand years.@k@v13/10400616. ......But she can''t show her form to humans of the wrong wavelength, and she can''t talk to them."'
5144: 'Maria@r@v13/10400617."...And you know what?@k @v13/10400618.She finds that really sad.@k@v13/10400619. ...That''s why she truly despises it when people like you, who were born without a fragment of magic sensitivity, deny that she exists...!"'
5145: 'Maria@r@v13/10400620.".........You''re lucky, Battler.@k@v13/10400621. Good thing that I gave you that charm yesterday, right?@k @v13/10400622.Who knows what kind of curse BEATRICE would have put on you by now if you hadn''t been carrying it around.@k@v13/10400623. ...You really are lucky, Battler.@k@|@y@v13/10400624. Kihihihihihihihihihihihihihihihihihihi...!"'
5146: 'Battler@r@v10/10100924.".........Right, that scorpion keyholder.@k@v10/10100925. I''d thought that was just some cheap gift or something, but I guess it really had some benefit, then?"'
5147: 'Maria@r@v13/10400625."Kihihihihihihihi.@k@|@y@v13/10400626. If it weren''t for that, you''d be lying in that storehouse as a sacrifice with your face crushed by now.@k@v13/10400627. Kihihihihihihihihi, you''re so lucky, Battler...!@k @v13/10400628.Kihhihihihihihihihihihihihihihihihi!"'
5148: 'Battler@r@v10/10100926."......I see.@k@v10/10100927. So if it weren''t for that, I''d have been killed by now......"'
5149: 'Maria@r@v13/10400629."Battler, why don''t you believe in BEATRICE...?@k @v13/10400630.Even though she "exists".@k@v13/10400631. Right now, over there, look."'
5150: 'Maria@r@v13/10400632."Kihihihihihihihi!@k @v13/10400633.Hey, I''ll bet you want to believe it now.@k@v13/10400634. Believe it.@k@v13/10400635. And thank me for giving you that charm...!"'
5151: 'Maria@r@v13/10400636."If it weren''t for that, you''d be in the storehouse right now.@k@v13/10400637. But then, maybe you would have saved someone else in exchange, right?@k @v13/10400638.Kihhihihihihihihihihihi!"'
5152: '@rPff...!'
5153: '@r......Right then, I burst into laughter.@k@rPlaying witches had been pretty fun up until a second ago, but unfortunately, that last one didn''t quite hit the mark.'
5154: 'Battler@r@v10/10100928."Hahahahahahah.@k@v10/10100929. ......Then it''s no goddamn good at all, is it, Maria?@k @v10/10100930.If that''s true, then I''m sorry, but it''s no goddamn good at all."'
5155: '@rWhen Maria saw me suddenly start laughing, she stopped.@k@rEven though she didn''t understand what I was laughing at, she realized it wouldn''t be pleasant for her.'
5156: 'Maria@r@v13/10400639.".............................."'
5157: 'Battler@r@v10/10100931."I thought it might hurt you, so I didn''t say it earlier, but..."'
5158: 'Battler@r@v10/10100932."......Although I thought I''d put that charm you gave me in my pocket,@k@v10/10100933. I must have dropped it somewhere, you see?"'
5159: 'Battler@r@v10/10100934."......That means the charm can''t be the reason I''m alive now, and even though I should have been cursed by the witch, I''m perfectly fine.@k@v10/10100935. ......Sorry, but I don''t believe in things I don''t see with my own eyes."'
5160: 'Battler@r@v10/10100936."Sixth sense?@k @v10/10100937.Wavelengths?@k @v10/10100938.Magic sensitivity?@k @v10/10100939.Sorry, but I don''t believe in fake stuff like that.@k@v10/10100940. When I hear the girls in class start talking about how good or bad their ability to sense the supernatural is, it pisses me off!"'
5161: 'Battler@r@v10/10100941."...I don''t know how much Grandfather is paying you, but if you''re trying to talk me into joining some cult,@k@v10/10100942. believe me, you won''t be able to do it that easily."'
5162: 'Kanon@r@v16/10600196."...............Battler-sama..."'
5163: 'Battler@r@v10/10100943."...You guys are free to believe whatever you want.@k@|@y@v10/10100944. But when it comes to whether I believe or not,@v10/10100945. that is always@v10/10100946. for me@v10/10100947. to decide!"'
5164: 'Battler@r@v10/10100948."Sorry, but I can''t believe in something as shady as BEATRICE until I''ve seen her with my own eyes...!!"'
5165: '@rI spoke forcefully and sharply...@k@rWhen I did, Maria started cackling again.'
5166: 'Maria@r@v13/10400640."Kihhihihihihihihihihihihi...!@k @v13/10400641.Well that''s just fine, isn''t it...?@k @|@y@v13/10400642.Eventually, even people like you with totally mismatched wavelengths will be able to see BEATRICE."'
5167: 'Maria@r@v13/10400643.".........Very soon, she will revive.@k@v13/10400644. BEATRICE will revive.@k@v13/10400645. ......Once that happens, she''s promised to talk with me and play with me a lot."'
5168: 'Maria@r@v13/10400646."...There''s neither a need to doubt nor to force yourself to believe.@k@v13/10400647. ......She will appear, very soon.@k@v13/10400648. Kihihihihihihihihihi...!"'
5169: '@rSome people usually head to the bathroom after a meal; others prefer to take a short nap.'
5170: '@rIt seemed that several people had gone out of the parlor, just like I did when I went to the kitchen to drink some water.'
5171: '@rIn the end, Aunt Natsuhi''s order to keep everyone packed together in the parlor was reluctantly withdrawn, under the conditions that:@k no one was to be on their own,@k and no one was to go far from the parlor.'
5172: '@rAfter all, if eleven people are shut up in the same room starting early in the morning, the air will start to stagnate.'
5173: '@r...And now that a little time had passed,@k everyone had started to recover from the shock of that morning - maybe their sense of danger was weakening over time, too.'
5174: '@r......However, it was a certain fact that six people had been killed inside this mansion,@k so no one was completely negligent.'
5175: '@rSo when they went out into the hallway for a breath of fresh air, trying to act tough,@k ......they would get scared of standing there, isolated, and would end up returning to the parlor.'
5176: '@r...Like that fable.@k You know, "The North Wind and the Sun".@k@rIf you force someone to stay shut in, they''ll resist, but if you tell them to do whatever they want, they''ll come back, obediently.'
5177: '@rPeople sure are hypocrites.'
5178: '@r.........When the servants finished cleaning up from the meal,@k they returned obediently to the parlor just as Aunt Natsuhi had told them to, and sat in a sofa near the entrance, patiently awaiting orders.'
5179: '@rMaria, almost as though she had suddenly finished playing witches,@k had returned to the pure Maria I knew well, saying "uu-uu".'
5180: '@r...What in the world was that back there?@k@r.........I hadn''t felt even an atom of the presence of this person called BEATRICE, supposedly standing behind me, invisible.'
5181: '@r...However, it felt like, inside Maria, I could catch a glimpse of a little of that presence...'
5182: 'George@r@v07/10300555."You''re right.@k@v07/10300556. When Maria-chan starts talking about witches, she changes.@k@v07/10300557. ...Battler-kun, you also saw it down by the beach yesterday, right?"'
5183: 'Battler@r@v10/10100949."You mean when she gave me that scorpion keyholder?@k@v10/10100950. ...No, I don''t mean like when her feelings were hurt,@k@v10/10100951. I''m talking about when she looked like she had, you know, a dual personality."'
5184: 'Jessica@r@v04/10200514."Aah, that happens sometimes too.@k@v04/10200515. ......Just like when Maria started talking about the magic circle, not very often, but it happens.@k@v04/10200516. It''s freaky though."'
5185: '@rApparently, according to Jessica, the "Kihihihihihi" laughing Maria shows up every now and then.'
5186: '@rThis was just bad timing, and furthermore, it was the first time I''d seen it, so it really shocked me...'
5187: 'Battler@r@v10/10100952."So what is that?@k @v10/10100953.Does Maria have a dual personality or something?@k@v10/10100954. Or are you saying that her spiritual sense really is that strong, and she gets possessed by stuff like that?"'
5188: 'George@r@v07/10300558."...No, I don''t think it''s that.@k@v07/10300559. Didn''t you ever experience it?@k @v07/10300560.A desire to be someone other than yourself, when you were small."'
5189: '@rRight when humans are born, no one has any individuality.@k@rHowever, when they reach their growth period, and their sense of self starts to be born, they start to gain a sense of individuality.'
5190: '@rThey want to be different from other people.'
5191: '@r...But of course, they will find that they''re no different from the others in their class,@k since they are learning the same thing in school and forced into the same lifestyle.'
5192: '@rWhen they realize that, they start off by breaking the rules, in what''s called the rebellious age.@k@rSince everyone follows the rules, they want to show off their individuality by breaking them.'
5193: '@r...Even those who call everyone around them babies and stir up trouble...@kare just cute kids searching for themselves when you look at them this way.'
5194: '@r......Well, I''m lecturing about all this like I''m so smart, but I actually got it second-hand from George-aniki.'
5195: '@rI myself was one of those embarrassing guys who thought it was cool to act like a little bastard...'
5196: '@rWell, that was when I was the age where you try standing out for the opposite sex.'
5197: 'George@r@v07/10300561."At the very foundation of the growing period is an impulse to escape from being a kid, much the same as a chick trying to crack the shell of their egg.@k@v07/10300562. Do you know what the difference between a child and an adult is?"'
5198: 'Battler@r@v10/10100955."Age?@k @v10/10100956.Or physique?"'
5199: 'George@r@v07/10300563."No, it''s experience.@k@v07/10300564. Adults look down on children because children have very little life experience.@k@v07/10300565. The reason they snort and look down on children whenever they say anything is because children don''t know anything about the world."'
5200: 'Jessica@r@v04/10200517."Yeah, I know what you mean.@k@v04/10200518. When you''re a kid, you try to say things like you''ve got life all figured out, and try to act like an adult.@k@v04/10200519. ...No matter what a kid says, adults will just snort at them because they''re too naive or because they''d "understand once they grew up" or something."'
5201: 'Jessica@r@v04/10200520."...Well, it''s probably true, but to a kid, it''s just annoying, like they''re being looked down upon."'
5202: 'Battler@r@v10/10100957."......I get it.@k@v10/10100958. It''s about whether they have knowledge and experience.@k@v10/10100959. ...You''re right, you don''t earn respect just by becoming old and not achieving anything."'
5203: 'George@r@v07/10300566."Therefore, what we have is: a period where they have the impulse to escape from being a kid; and also, they want to have individuality, different from other people.@k@|@y@v07/10300567. If what separates kids and adults is knowledge and experience, then...?"'
5204: 'Battler@r@v10/10100960."............I get it, if they know something that no one else knows, that''s one way to form an identity."'
5205: 'Jessica@r@v04/10200521."When you''re in, like, elementary school, if you knew stuff no one else knew,@k@v04/10200522. had stuff no one else had, wore stuff no one else wore, you could become a bit of a hero for it.@k@v04/10200523. I bet you did the same thing, Battler."'
5206: 'Battler@r@v10/10100961."Yeah, yeah.@k@v10/10100962. There was definitely an age when I wanted to excel in something.@k@v10/10100963. ...I see, that was because I was trying to separate myself from being a child, my growing period."'
5207: 'George@r@v07/10300568."If you look at it in a good way, the growing period, by forcing you to separate yourself from others, pushes you to gain skills and knowledge that no one else has."'
5208: 'George@r@v07/10300569."...This is also interesting from a sociological standpoint.@k@v07/10300570. Because people hate being like everyone else, they try to learn skills that other people don''t know.@k@v07/10300571. In this way, society can acquire the broad range of skills it needs to survive.@k@v07/10300572. ...The quality of the gods'' programming is truly surprising."'
5209: 'Battler@r@v10/10100964."Well, individual personalities can also be negative, right?@k @v10/10100965.Like saying, everyone else in the class is studying hard, so I''ll slack off so I stick out."'
5210: '@r...That was actually me.@k@rIt was only recently that I''d finally been able to feel thankful towards that middle school teacher who had slapped me after school.'
5211: 'Battler@r@v10/10100966."But, well, I did have those desires to jump over the vaulting box that no one else could,@k@v10/10100967. or sprint as fast as I could trying to lap those guys with good grades when we did a marathon."'
5212: 'Battler@r@v10/10100968."...It was in my nature that, if I couldn''t study well, then at least I could get back at them by exercising.@k@|@y@v10/10100969. ......I get it, I really went all out during my growing period."'
5213: 'Jessica@r@v04/10200524."I guess boys do tend to focus more on physical things."'
5214: 'Jessica@r@v04/10200525."But you know? Girls of the same age tend to focus more on emotional things.@k@v04/10200526. ......I''ll bet there were groups of girls in your classes that were really interested in like, fortune telling and their spiritual senses."'
5215: 'Battler@r@v10/10100970."Yeah, yeah! There was, there was!@k @v10/10100971.They''d come over, asking me for my sign and my blood type! And then they''d laugh, "Aah, I thought so, *giggle*giggle*!"@k @v10/10100972.It really got on my nerves."'
5216: 'Battler@r@v10/10100973."No matter which class you go to, girls like fortune telling.@k@v10/10100974. There was always a group that went on about spirit senses being strong or weak, or "sensitivity", or seeing things that can''t be seen."'
5217: 'George@r@v07/10300573."That''s because fortune telling and spiritual senses are things that aren''t taught in school.@k@v07/10300574. To girls, who unlike guys are more introverted,@k@v07/10300575. that''s a genre which is easy to build an identity upon, and one that they find very interesting."'
5218: 'Jessica@r@v04/10200527."Just like when boys enter their growing period, and start acting tough and rebelling against adults,@k@v04/10200528. when girls enter their growing period, they start getting interested in that kind of thing instead.@k@|@y@v04/10200529. ......Well, not me though!"'
5219: 'Battler@r@v10/10100975."......So Maria having so much interest in the occult isn''t that rare among girls her age?"'
5220: '@r...Even if you accept that, ...I wonder if it explains that creepy dual personality thing...'
5221: '@r............Well, I think I can accept it vaguely.'
5222: 'George@r@v07/10300576."As I said before, becoming an adult means gaining knowledge and experience.@k@v07/10300577. So kids must study various things so that they can gain knowledge and truly awaken."'
5223: 'George@r@v07/10300578."...There is a specific kind of fantasy useful for this, which is and has always been prolific in the world of children.@k@v07/10300579. Do you know what that is?"'
5224: 'Jessica@r@v04/10200530."You see it all the time in manga and anime, right?@k @v04/10200531.You know.@k@v04/10200532. Like, memories coming back to you from a former life.@k@v04/10200533. Or like, channeling the soul of the great whatever."'
5225: 'Battler@r@v10/10100976."Ah, there''s also sleeping genes awakening,@k@v10/10100977. or sealed powers or memories returning...there''s a lot of versions.@k@v10/10100978. For some reason, those kinds of things are really popular at that age.@k@v10/10100979. ...Why''s that?"'
5226: 'George@r@v07/10300580."All of those examples you''ve just mentioned are fantasies by which children can immediately add knowledge and experience to their childhood selves.@k@v07/10300581. Even a nine-year-old girl simply has to say that she has a thousand-year-old witch possessing her,@k@v07/10300582. and she can gain a 1009-year-old identity."'
5227: 'Jessica@r@v04/10200534."So what you''re saying is that for people who think studying is annoying,@k@v04/10200535. but want to learn different skills from everyone else and brag about it, and get attention from it, it''s a convenient delusion."'
5228: '@rSo you can brag about something without having to work hard or study.@k@r......I see, isn''t that a kid''s greatest dream?'
5229: 'George@r@v07/10300583."Furthermore, their ideal self image is always self-projected onto their desires to escape from being a kid,@k@v07/10300584. and it''s not rare for that desired form to become established as an alternate personality."'
5230: 'George@r@v07/10300585."Even you, Battler-kun, I''m sure your character is a little different at home and at school, right?@k @v07/10300586.It would probably be embarrassing if anyone at school saw how you were at home.@k@v07/10300587. At school, you try to project yourself as you want to be, but home is where you are your true self."'
5231: 'Battler@r@v10/10100980.".........So, in other words, I''m changing my character for different situations.@k@v10/10100981. ......Are you trying to say that having multiple personalities is actually really common?"'
5232: 'Jessica@r@v04/10200536."A girl who is a fan of the occult might say that she''s being possessed, or has awakened.@k@v04/10200537. Honestly, there are some kids who can change their personalities so drastically, it can change your whole opinion of them."'
5233: 'Jessica@r@v04/10200538."......Even some boys, right?@k @v04/10200539.Guys who just blow their top and get violent over nothing.@k@v04/10200540. I bet they think it''s pretty cool, but it''s painful to watch."'
5234: 'Battler@r@v10/10100982."So let''s sum this all up.@k@v10/10100983_b. ...Girls of about Maria''s age, even if they show a creepy second personality like she did a minute ago,@k@v10/10100984. you''re saying that''s not such a rare thing...?"'
5235: 'George@r@v07/10300588."If you bring it all together simply, that''s what it means.@k@v07/10300589. ...Identity is an important thing used to build up one''s sense of self.@k@v07/10300590. If you make fun of that, it could actually cause children to go back into their shell."'
5236: 'George@r@v07/10300591."So it''s important to go along with them to some degree.@k@v07/10300592. ...Although to accept it completely requires the tolerance of a parent."'
5237: 'Battler@r@v10/10100985."......Aniki, I can''t believe you aren''t married...@k@v10/10100986. You sound like you''ve already raised kids through middle school.@k@|@y@v10/10100987. .........Then, I wonder if Auntie Rosa also knew much about Maria''s dual personality."'
5238: 'Jessica@r@v04/10200541."She knew.@k@v04/10200542. .........Just between us, Auntie Rosa couldn''t friggin'' stand it.@k@v04/10200543. She said it was creepy, and it was just making Maria more and more separated from the rest of the class."'
5239: 'Jessica@r@v04/10200544."So any time Maria started talking about the occult or laughing like a witch, she''d slap her.@k@v04/10200545. ...And it looks like Maria stopped talking that way in front of her."'
5240: '@r.........Maybe it was just a little game, from a girl facing her growing period,@k ...that thing that had happened back there.'
5241: '@rJust a girl trying to show that she was different and independent by holding interest in witches and the occult.'
5242: '@r...And since she wanted to have another side to herself that wasn''t infantile, she was switching between her normal personality and the personality of her ideal, a witch.'
5243: '@r.........In the beginning, I had found that very disturbing,@k but after George-aniki''s lecture, it felt like this was a path that everyone walked down at one time or another.'
5244: '@r......I haven''t told anyone, but when I was in kindergarten,@k I joined up with a little gang of kids trying to form a Earth Defense Force, saying we''d help protect peace on earth.'
5245: '@rMy face turns red when I remember how, during what we called battle practice, we would chant "EDF! EDF!"...'
5246: '@rJust like usual, Maria was relaxing,@k immersed in the TV, "uu-uu"ing and laughing just like any girl her age.'
5247: '@r......But on the inside, another personality, that of the ideal witch that she admired and blindly accepted, was sleeping.'
5248: '@rBut that wasn''t anything extraordinary; it was perfectly natural for a girl of her age...'
5249: '@r............I calmed down a little.@k@rI had started to recover from the shock of my bizarre experience in the kitchen.'
5250: '@r...If I hadn''t talked to Aniki and Jessica, I might still have been frightened by the idea that an invisible witch was standing right behind me.'
5251: '@r...However, ......can I really accept that as an explanation of what happened back there?'
5252: '@rIf it had just been Maria, I could have explained it as the fickle fantasies of a growing girl.'
5253: '@r...But Genji-san, Kanon-kun, and Kumasawa baa-chan had also been there.'
5254: '@rNone of them had denied what Maria said.'
5255: '@r.........They had silently accepted that BEATRICE "exists".'
5256: '@rI was starting to feel a little uneasy...'
5257: '@rAuntie Eva had claimed that no 19th person exists,@k saying that someone within the family had committed the crime in connection with their messy quarrel.'
5258: '@rOn the other hand, Aunt Natsuhi had claimed that the culprit was hiding somewhere outside the mansion.'
5259: '@rThat meant that she was denying that the crime had been committed by one of us, and accepting that a 19th person exists.'
5260: '@rAnd in the kitchen, Maria and the servants had agreed that a 19th person exists.'
5261: '@rBut according to them, this 19th person isn''t human.@k@r......They had said that it was an invisible witch, plotting something mysterious.'
5262: '@rIs there a 19th person, or not?@k@rAnd is the culprit a human, or a witch?'
5263: '@rFor some reason, I couldn''t just laugh off any of the possibilities.@k@r...Not even the most ridiculous one about the witch.'
5264: 'Battler@r@v10/10100988."......Jessica,@k@v10/10100989. all I know about the story of the witch is that it was a story made by the adults to keep the kids too scared to enter the forest, but...@k@v10/10100990....is it different here in the mansion...?"'
5265: 'Jessica@r@v04/10200546."............Hmmm...@k@v04/10200547. I''m with you on this."'
5266: 'Jessica@r@v04/10200548."I think it was just a dumb ghost story made by the parents so their kids would listen to them.@k@v04/10200549. ......But I can''t deny that the atmosphere inside the mansion makes it a little hard to say it out loud..."'
5267: 'George@r@v07/10300593."......Because Grandfather has proclaimed that BEATRICE does exist.@k@v07/10300594. And because of their position, the servants can''t doubt that.@k@v07/10300595. Jessica''s mother and father don''t want to get into a fight with him either, so on the surface, they go along with it."'
5268: 'George@r@v07/10300596."......So you could probably say that, inside this mansion, doubting the existence of BEATRICE is a kind of taboo.@k@v07/10300597. Unlike the rest of us, who only come here once a year.@k@v07/10300598. ......Is that right?"'
5269: '@rJessica puffed out air in admiration...@k@rIt looked like Aniki had guessed right.'
5270: 'Jessica@r@v04/10200550."......You''ve got it totally.@k@v04/10200551. No one really believes it on the inside.@k@v04/10200552. ...But on the outside, they accept she exists."'
5271: 'Jessica@r@v04/10200553."See, it''s just like the way some people are about gods.@k@v04/10200554. Even if you know there''s actually no such thing, it feels rude to actually say that out loud..."'
5272: 'Battler@r@v10/10100991."......How do you think the servants feel about it amongst themselves?@k @v10/10100992.Is it true that, since Grandfather who employs them says she "exists", they have to go along with it...?"'
5273: 'Jessica@r@v04/10200555."Well...@k@v04/10200556. I don''t really know the details,@v04/10200557. ......but between the servants, the story about BEATRICE has been treated a bit like a ghost story."'
5274: 'Jessica@r@v04/10200558."...Remember yesterday, when Shannon was talking to us down by the beach?@k @v04/10200559.About how they saw unsettling things while doing the rounds in the mansion at night."'
5275: '@rShe had said something like that, hadn''t she...'
5276: '@rBack then, I didn''t give it much thought, assuming she was just going along with the displeased Maria,@k ...but now that I think about it, she did say that, and completely seriously.'
5277: '@r......That''s right.@k She definitely said it.'
5278: '@r...She definitely said the same kind of thing that Genji-san and the rest had all unanimously declared back in the kitchen...'
5279: 'Shannon@r@v15/10500246."In addition, some servants have also seen will-o''-the-wisps and glittering butterflies dancing around.@k@v15/10500247. ......Kanon-kun also said he saw something like that when he went patrolling one night."'
5280: 'Shannon@r@v15/10500248."And recently, the servants have been talking about strange footsteps inside the mansion near midnight.@k@v15/10500249. We have whispered together that the BEATRICE-sama from the portrait sometimes walks through the mansion invisible."'
5281: 'Shannon@r@v15/10500250."...It happened a long time ago, but I have also heard those kinds of footsteps while patrolling at night."'
5282: '@r......That''s right.@k She definitely said that.@k@rExactly the same thing that I had been told just now.'
5283: 'Shannon@r@v15/10500251."Ah, ...but, there''s nothing to be afraid of, you know?@k @v15/10500252.BEATRICE-sama is another ruler of this mansion separate from the Master.@k@v15/10500253. So, she won''t do anything bad, as long as you respect her and don''t act oddly afraid."'
5284: 'George@r@v07/10300599."However, she''s fearsome if you don''t respect her, right?"'
5285: 'Shannon@r@v15/10500254."...Yes.@k@v15/10500255. I heard that someone who quit just before I began working, after falling down the stairs and receiving a large injury to their back,@k@v15/10500256. had been speaking badly of BEATRICE-sama.@k@v15/10500257. Because of that, there was a rumor between the servants that BEATRICE-sama''s anger had been brought down upon this person..."'
5286: 'Battler@r@v10/10100993."......If you don''t respect her, her anger will be brought down upon you, and you will be injured.@k@v10/10100994. ...So, to the servants, BEATRICE''s existence...@k@v10/10100995. is just as credible as the story that, if you pull pranks on Inari-san, you will be cursed by the kitsune."'
5287: '@rOf course, even though everyone accepts that curses and the like don''t exist in the modern era,@k... ...people are still afraid and still have a little respect for them.'
5288: '@rYou see it a lot even in residential areas, such as when someone is building a house, and they call a Shinto priest for a ceremony to honor the god of that plot of land.'
5289: '@r...You might think that''s just a big waste of time and money,@k but the workers say that a big accident will occur if they don''t do it, so they apparently never neglect the procedure.'
5290: '@rYou also hear about how, if an Inari shrine is carelessly removed during a town replanning,@k there would be a curse by Kitsune-sama.'
5291: '@rI think I might have read somewhere that when the occupying forces were trying to expand an airport, and had to remove an Inari-san that was in the way,@k all of the workers were suddenly taken out by some mysterious fever.'
5292: '@rEven in modern cities like Tokyo,@k it isn''t rare to see modern buildings packed all around an old Inari shrine, leaving the shrine itself untouched.'
5293: '@rAnd this isn''t limited to Japan.@k@rIt''s probably similar to how people baptize babies.'
5294: '@rIf I remember correctly, by the Christian doctrine,@k unbaptized souls, though their sin is the lightest, still fulfill the conditions for going to hell.'
5295: '@rPutting water on a child''s forehead doesn''t do anything but make them cry.'
5296: '@rBut if a parent can prevent their child from going to hell with just that little effort, they will happily go through with that ceremony.'
5297: '@r......In short, even in this modern society of reason,@k we are still unable to throw away every trace of belief and fear.'
5298: '@r...You could say that it''s a passive acceptance of the supernatural.'
5299: '@rMaybe the only difference on this island was that BEATRICE was the name that was respected here...'
5300: 'Battler@r@v10/10100996."...So, in other words,@k@v10/10100997. if anything happens that doesn''t seem explainable in human terms, it''s called the work of BEATRICE."'
5301: 'Battler@r@v10/10100998.".........I think Shannon-chan was talking about it.@k@v10/10100999. About windows and doors that had definitely been properly shut or locked being open the next time they were checked.@k@v10/10101000. Lights that had been off being on, and lights that had been on being off."'
5302: 'Battler@r@v10/10101001."......And, if I remember right, Jessica, you used to joke that it was BEATRICE''s doing that you couldn''t find your bag sometimes when you went to leave in the morning, right?"'
5303: 'Jessica@r@v04/10200560."Good memory.@k@|@y@v04/10200561. ...Normally, you''d say a fairy took them, but on this island, it''s BEATRICE.@k@v04/10200562. Man, what a stupid story."'
5304: 'George@r@v07/10300600."This mansion has been standing for about thirty years by now, hasn''t it?@k@v07/10300601. It''s natural for things that old to get their fair share of ghost and occult stories.@k@v07/10300602. Like the seven mysteries at a school."'
5305: 'Battler@r@v10/10101002."...............So here...@k@|@y@v10/10101003.is where we "flip over the chessboard"."'
5306: 'Jessica@r@v04/10200563."Huh?"'
5307: 'Battler@r@v10/10101004.".........Basically, on this island, there''s a rule that BEATRICE can be blamed for anything that couldn''t have been done by humans.@k@v10/10101005. Anything that the humans can''t do.@k@v10/10101006. ......How many humans are there?@k @v10/10101007.There''s 18."'
5308: 'Battler@r@v10/10101008."............In other words, the culprit is modelling things after this rule, trying to make it appear that this crime was the work of the witch.@k@v10/10101009. In short, they desperately want to claim this as the doing of a 19th person."'
5309: 'Battler@r@v10/10101010."............I don''t like it.@k@v10/10101011. I really don''t like it."'
5310: 'Jessica@r@v04/10200564."What don''t you like...?"'
5311: 'Battler@r@v10/10101012."............Just assume that an invisible 19th person existed, and that this person wanted to make it known that they existed.@k@v10/10101013. ......If it were me, I''d do it with more perfect timing."'
5312: 'George@r@v07/10300603."......What do you mean by perfect timing?"'
5313: 'Battler@r@v10/10101014."...Well.@k@v10/10101015. After all, the crime took place after midnight while it was still dark, right?@k @v10/10101016.People were talking together until midnight, some people had the night shift, and some people had returned to their rooms and were sleeping."'
5314: 'Battler@r@v10/10101017."...Everyone''s alibi is really vague, and there''s plenty of room to suspect that the crime was committed by one of us.@k@v10/10101018. George-aniki, Auntie Eva probably told you too, right?@k @v10/10101019.That there''s a good chance that one of us is the culprit?"'
5315: 'George@r@v07/10300604."...mh......yes.@k@v07/10300605. ...I guess."'
5316: 'Battler@r@v10/10101020."......In other words, if the 19th person really existed and wanted to show themselves, this first crime was a complete failure."'
5317: 'Battler@r@v10/10101021."...No, in the first place, the timing was a mistake.@k@v10/10101022. If this invisible 19th person really wanted to show themselves,@k@v10/10101023. they had to make sure that the crime took place under conditions which proved that the remaining twelve people were all innocent."'
5318: 'Battler@r@v10/10101024."Unless there are no suspicious humans, they can''t prove that they exist.@k@v10/10101025. So by killing them in the middle of the night, when everyone''s alibi was at its most ambiguous,@k@v10/10101026. whether or not this 19th person exists was also at its most ambiguous.@k@v10/10101027. Even so, they chose that time to commit the crime."'
5319: 'George@r@v07/10300606."......By committing the crime then, it''s obvious that one of the 18 would be suspected.@k@v07/10300607. ...Yet they took the name of the witch and handed Maria the letter, and everyone denies doing it."'
5320: 'Jessica@r@v04/10200565."In other words, ......you''re trying to say that one of the 18 is trying to make it look like a 19th person called BEATRICE exists...?"'
5321: 'Jessica@r@v04/10200566."That''s pretty crazy......@k@v04/10200567. ...I think my mom''s theory that someone is hiding outside the mansion is a little more credible...@k@v04/10200568. ...Battler, don''t tell me you actually suspect that someone in this room is the culprit...?"'
5322: 'Battler@r@v10/10101028."Yeah.@k@v10/10101029. ...Someone trying to force us to accept that BEATRICE exists.@k@v10/10101030. ......That''s right, the letter last night is when this whole thing started.@k@v10/10101031. ...I don''t have any basis or proof, but..."'
5323: 'Battler@r@v10/10101032."......With the chessboard upside-down, this is my best guess."'
5324: 'Jessica@r@v04/10200569."......Seriously, that''s too crazy...@k@v04/10200570. Haven''t you been reading too many weird detective novels...?"'
5325: 'George@r@v07/10300608."But it does hit on a point that we can''t ignore.@k@v07/10300609. ......Whether there''s a 19th person or not,@k@v07/10300610. the culprit is definitely planning something based around that rule about this island."'
5326: 'George@r@v07/10300611."......Just now, listening to Battler-kun talk, I remembered something that''s a little disturbing."'
5327: 'Battler@r@v10/10101033."Something disturbing...?"'
5328: 'George@r@v07/10300612."Yes.@k@v07/10300613. ......Do you remember?@k @v07/10300614.BEATRICE''s letter.@k@v07/10300615. ......It said that BEATRICE was going to collect interest.@k@v07/10300616. And as for what that interest is, it said: everything of the Ushiromiya family."'
5329: '@rJessica and I thought back on what Maria had read aloud the previous night...'
5330: 'Jessica@r@v04/10200571."...It said that.@k@v04/10200572. It definitely said that.@k@v04/10200573. That the collecting of the interest would now take place, but if the riddle of the gold could be solved, she would lose that right."'
5331: 'George@r@v07/10300617."...Grandfather was granted the gold, and the Ushiromiya house prospered.@k@v07/10300618. Basically, BEATRICE is saying that everything he birthed from that gold counts as interest.@k@v07/10300619. ......In other words - "'
5332: 'Battler@r@v10/10101034.".........That''s pretty scary for a joke, Aniki...@k@v10/10101035. ......Don''t tell me that everything of the Ushiromiya family - @k@v10/10101036.in other words, everything that Grandfather gave birth to - @k@v10/10101037.refers to everyone with Grandfather''s blood flowing through their veins...?!"'
5333: 'George@r@v07/10300620."If you read the letter that way,@k@v07/10300621. ...these murders are just BEATRICE legitimately collecting interest.@k@v07/10300622. ...If that''s the case, these crimes will continue.@k@v07/10300623. ...Because the collection of interest is still only halfway completed."'
5334: '@rGeorge turned around, looking over the parlor.@k@r......There were still many people who held the name Ushiromiya.'
5335: '@rAnd we knew that, since Gohda-san and Shannon-chan had been killed,@k not even the servants, who didn''t bear the name Ushiromiya, would be spared...'
5336: 'Jessica@r@v04/10200574."A-...are we...@v04/10200575.......all gonna be killed...?"'
5337: 'Jessica@r@v04/10200576."...But that''s weird, George nii-san!@k @v04/10200577.Why only six people, then?@k @v04/10200578.They could have killed a lot more.@k@v04/10200579. In the worst case, it might even have been possible for them to assault us all while we were sleeping and kill everyone in a single night.@k@v04/10200580. Why didn''t they do that?!"'
5338: 'George@r@v07/10300624."............The special clause.@k@v07/10300625. ...If someone managed to solve the riddle of the gold, the right to the interest would be lost.@k@v07/10300626. ......And remember how the very last part of the letter concluded?@k @v07/10300627....It said for everyone to try to solve the riddle of Grandfather''s gold."'
5339: 'Battler@r@v10/10101038."Jesus...!@k @v10/10101039.......It looks like we''re finally getting close to understanding the culprit''s message...@k@v10/10101040. In other words, the culprit is telling us to try and solve the riddle on that epitaph Grandfather had made.@k@v10/10101041. ......Furthermore, they''re saying that if we just sit around, they''ll keep collecting the interest..."'
5340: '@rI realized that this was all based on several crazy guesses.'
5341: '@r......But not everything that happens in this world is joined together in a perfect line.'
5342: '@r...Most unknown phenomena are nothing but individual points.@k@r......By joining them together into lines, we deepen our understanding.'
5343: '@rThe closer together the points at the ends of those lines are, the more logical it is, and the easier to understand.'
5344: '@r...And the farther away they are, the more it lacks those qualities.@k@rThat is why we use a distance analogy, and call such theories "way out there".@k@r...However, if you can only join up to a small, limited distance away, we call it having a "limited imagination".'
5345: '@rIs imagination different from reasoning?@k@rWas I just trying to force everything that I knew about the case to fit my simple imagination?'
5346: '@rNo, that''s not it.@k@rWhen you''re searching around with your hands in the dark, that search is imagination.'
5347: '@rOnly imagination can find the two points you should connect together.@k@r...Reasoning is nothing more than the action of drawing the line between them.'
5348: '@rIf you can''t imagine, you can''t reason.@k@r......What I was doing might be "out there"...but it shouldn''t be wrong, either.'
5349: '@rOnly the power of imagination can pull out a clue from the darkness.@k@r......And the power of reasoning ties those clues together.'
5350: '@r...It''s a lot like the process of searching out an enemy''s weak spot and striking.'
5351: '@rIt''s alright if it''s crazy.@k@rFind the weak point first.@k@rThen we can think about how to strike!'
5352: '@rNow was the time to find the points that we could tie together later...!'
5353: '@rFor the time being, I put aside whether a 19th person exists,@k and announced the theory that the goal of the culprit might have been to make us solve the riddle of the epitaph.'
5354: '@rUncle Hideyoshi looked like he was really interested, but Aunt Natsuhi thought it was ridiculous.'
5355: 'Hideyoshi@r@v06/11100347."Of course.@k@v06/11100348. If you think about it that way, even that letter from yesterday makes sense.@k@v06/11100349. That motive seems to fit pretty well with the facts...!@k @v06/11100350.Settin'' aside whoever it was that gave Maria-chan the letter."'
5356: 'Maria@r@v13/10400649."Uu!@k @v13/10400650.BEATRICE exists!!@k @v13/10400651.Uu."'
5357: '@rEven though she was puffing up her cheeks in that cute way she had been doing since yesterday, ...I couldn''t think of it as cute.'
5358: '@r...If I took it lightly, it might suddenly transform into a creepy laugh...'
5359: 'Natsuhi@r@v03/10900327."...The hidden gold doesn''t exist.@k@v03/10900328. However, the idea that we have a culprit who foolishly believes otherwise, wants Father''s gold,@k@v03/10900329. and whose motive is to make us solve the riddle and then steal the gold from us, does indeed make some sense."'
5360: 'Natsuhi@r@v03/10900330."However, in that case, why did they kill those most highly ranked in the Ushiromiya family first?"'
5361: 'Nanjo@r@v19/11900147.".........A good point.@k@v19/11900148. If they wanted to make us solve the riddle, killing those closest to Kinzo-san doesn''t sound like a good plan to me."'
5362: 'Eva@r@v05/11000482."I agree...@k @v05/11000483.Besides, if we follow that argument, wouldn''t it have been quicker if they had threatened Father in the first place?@k @v05/11000484.You''d think it would be faster to just ask the person who wrote it, rather than try to force us to solve it."'
5363: 'Hideyoshi@r@v06/11100351."That''s also a good point.@k@v06/11100352. ...''Course, I don''t think that Father would let it slip from any ordinary threat."'
5364: 'Nanjo@r@v19/11900149."Anyone who knows Kinzo-san well would surely be well aware that he won''t bow to ordinary threats..."'
5365: 'Natsuhi@r@v03/10900331."......He is the man who bears the burden of the Ushiromiya family and all its wealth.@k@v03/10900332. He has been exposed to many threats and attacks in the past.@k@v03/10900333. It is because he was able to overcome them that the family prospers today."'
5366: 'Jessica@r@v04/10200581."Totally agreed on that.@k@v04/10200582. I can''t imagine our grandfather letting himself get pushed around just ''cause some asshole threatened him!"'
5367: 'Natsuhi@r@v03/10900334."...Jessica, that is not how we talk."'
5368: 'Jessica@r@v04/10200583."............u...@v04/10200584.......yes."'
5369: 'Battler@r@v10/10101042."In that case, .........what about this one?@k@v10/10101043. ......No wait, is this "out there" as well...?"'
5370: '@r...I couldn''t hesitate!@k A crazy idea is like a bow and arrow.'
5371: '@r...It might be hard to hit with, but it''s a great weapon that can strike enemies from afar.'
5372: '@r......Research shows that most people who have died in battles were killed by wounds from arrows.'
5373: '@r......In a battle, you don''t shoot off just one arrow.'
5374: '@rYou shoot off a whole bunch of arrows at once, and assault the enemy soldiers with a wall of them.@k@r......So shoot them, over and over!@k "Assault the truth with a wall...!"'
5375: 'Battler@r@v10/10101044."If the culprit is after the hidden gold, it would be very inefficient for them to force us to solve the riddle.@k@v10/10101045. Asking the person who made it in the first place would be much quicker and easier."'
5376: 'Battler@r@v10/10101046.".........In that case, the question is,@k@v10/10101047. ...is this all a message directed at Grandfather?"'
5377: '@rIn other words, these murders were a threat directed at Grandfather.@k@r......If he didn''t tell the culprit where the gold was, his family members would be killed off one by one.'
5378: '@rWhat if we weren''t the only ones being forced to solve this riddle...@k ...What if Grandfather was too?!'
5379: '@rIf you think about it that way, it explained Grandfather''s mysterious disappearance.'
5380: '@rIf the culprit had attacked Grandfather, then judging by the state the six bodies were left in,@k he would definitely have been displayed somewhere with that horrible makeup added.'
5381: '@rBut despite that, we still hadn''t found him.@k ......Did that mean that Grandfather had been kidnapped, and was being held somewhere?!'
5382: 'Natsuhi@r@v03/10900335.".........How could...@k@v03/10900336. .........You aren''t saying, how could......!"'
5383: 'Eva@r@v05/11000485."*giggle*giggle*.@k@v05/11000486. That sounds interesting.@k@v05/11000487. ...So Father is being confined somewhere,@k@v05/11000488. and being threatened that if he doesn''t tell them the location of the gold, we will be killed off one by one?"'
5384: 'Natsuhi@r@v03/10900337."I struggle to understand what you find interesting about that...!"'
5385: '@rAunt Natsuhi threatened her, but Auntie Eva just smiled calmly.'
5386: 'George@r@v07/10300628."......Since we still haven''t seen him after all this time, I think that it''s almost certain that Grandfather has gotten caught up in the crime.@k@v07/10300629. When you think about that, you can''t just ignore Battler-kun''s theory, right...?"'
5387: 'Eva@r@v05/11000489."Stay quiet, George.@k@v05/11000490. ......In the first place, when exactly was it that Father went missing?"'
5388: 'Hideyoshi@r@v06/11100353."...Who was the last one to see Father?"'
5389: 'Natsuhi@r@v03/10900338.".........It was probably me.@k@v03/10900339. This morning, when we were worried that we didn''t know where my husband and the rest were, we were talking about how they might be in Father''s study,@k@v03/10900340. and I went to check his room and greeted him."'
5390: 'Natsuhi@r@v03/10900341.".........Come to think of it, I''ve been holding the key to his study the whole time, haven''t I.@k@v03/10900342. Genji, let me return this to you."'
5391: '@rAunt Natsuhi pulled out the gold key and handed it to Genji-san...'
5392: '@rLooking at the key, Auntie Eva giggled...'
5393: 'Eva@r@v05/11000491."...Hey, Genji-san.@k@v05/11000492. I''m sure the police will inspect Father''s room thoroughly anyway.@k@v05/11000493. ...It doesn''t matter what you hide, it will just be exposed anyway.@k@v05/11000494. ......So you might as well just tell us about it right here, right now, don''t you think?"'
5394: 'Genji@r@v14/11600184."............What are you talking about?"'
5395: 'Eva@r@v05/11000495."It''s simple.@k@v05/11000496. .........Don''t forget, Father''s study is a locked room, with no way in or out except for that key.@k @v05/11000497.I want to double-check how that''s being defined.@k@v05/11000498. There is one entrance to Father''s study.@k@v05/11000499. And also the windows?@k @v05/11000500.Any other entrances or exits?"'
5396: 'Genji@r@v14/11600185."............There are none.@k@v14/11600186. There is no way to get in except for the entrance."'
5397: 'Eva@r@v05/11000501."You''re sure about that?@k @v05/11000502.There isn''t some secret hidden door or anything?@k @v05/11000503.......Since Father isn''t here, I am the highest ranked member of the Ushiromiya family.@k@v05/11000504. I am asking you as a representative of the Ushiromiya family head.@k@v05/11000505. Understand that and answer me."'
5398: 'Eva@r@v05/11000506."Are there any ways in or out of that room other than the main entrance?@k @v05/11000507.......As Father''s closest aide, I''m sure you know."'
5399: '@rAunt Natsuhi looked a little offended at the part about the "highest ranked family member",@k but she kept her mouth closed for the time being, and waited for Genji''s answer.'
5400: '@r......I couldn''t help but feel a little uncomfortable.@k@rWhy was she going on and on about hidden doors...??'
5401: 'Eva@r@v05/11000508."You too, Kanon-kun, Kumasawa-san - if you know, won''t you tell me?@k @v05/11000509.If there is one, it would be better if you said it."'
5402: 'Eva@r@v05/11000510."...If there isn''t, then someone is going to be very much driven into a corner in a second.@k @v05/11000511.......If I''m given that there is a hidden door, then my argument comes to nothing."'
5403: '@rAuntie Eva didn''t specify which person was about to be driven into a corner,@k ...but following the flow of the conversation, I had to feel that she was referring to Aunt Natsuhi.'
5404: 'George@r@v07/10300630."......Mother, ...what are you talking about?"'
5405: 'Eva@r@v05/11000512."George, stay quiet for a while.@k@v05/11000513. .........What do you say?@k @v05/11000514.Genji-san?@k@v05/11000515. Kanon-kun?@k@v05/11000516. And Kumasawa-san?@k @v05/11000517.Is there a hidden door?@k @v05/11000518.Or not?@k @v05/11000519.Genji-san, when you remodeled Father''s study, you must have overseen the construction.@k@v05/11000520. I won''t let you say that you don''t know."'
5406: 'Genji@r@v14/11600187."............There is nothing of that nature in the Master''s study."'
5407: 'Eva@r@v05/11000521."You''re sure?@k @v05/11000522.What about Kanon-kun, entrusted with the One-winged Eagle?"'
5408: 'Kanon@r@v16/10600197."......Yes.@k@v16/10600198. I''m sure.@k@v16/10600199. ......There is nothing like a hidden door in the Master''s study."'
5409: 'Eva@r@v05/11000523."Kumasawa-san?"'
5410: 'Kumasawa@r@v18/11800111."N-......no, I haven''t heard of such a thing..."'
5411: 'Eva@r@v05/11000524."What about Doctor Nanjo, who had a close relationship with Father?"'
5412: 'Nanjo@r@v19/11900150."......I, I have never heard of something like that..."'
5413: 'Eva@r@v05/11000525."Great!@k @v05/11000526.Then are you ready?@k @v05/11000527.Let me begin.@k@v05/11000528. It''s really simple."'
5414: '@rEveryone tilted their head doubtfully, wondering what Auntie Eva was so proudly starting to talk about.'
5415: '@r...Auntie Eva laughed triumphantly, as though she were about to reveal a secret that only she knew.'
5416: 'Eva@r@v05/11000529."Natsuhi nee-san was the last person to spot Father, right?@k @v05/11000530....I forget the exact time, but I think it was a little before nine in the morning."'
5417: 'Eva@r@v05/11000531."......Nee-san, do you remember?@k @v05/11000532.I ran into you just as you were coming out of Father''s study, right?"'
5418: 'Natsuhi@r@v03/10900343."......Yes, I remember.@k@v03/10900344. What does that have to do with anything?"'
5419: 'Eva@r@v05/11000533."And the next time you went to visit Father''s study?@k @v05/11000534.That was after we had found the bodies of Nii-san and the rest, right?@k @v05/11000535.Together with me, you went up to the study to report that, and we discovered that he wasn''t there."'
5420: 'Eva@r@v05/11000536.".........By the way, Nee-san.@k@v05/11000537. At that time, when you went to enter Father''s study, did you notice anything?"'
5421: 'Natsuhi@r@v03/10900345.".........Notice anything?@k @v03/10900346....What are you talking about?"'
5422: 'Eva@r@v05/11000538."Come on.@k@v05/11000539. You picked up some trash, right?@k @v05/11000540.A folded receipt."'
5423: 'Natsuhi@r@v03/10900347."......I do seem to remember picking up some trash.@k@v03/10900348. What does that have to do with...?"'
5424: 'Eva@r@v05/11000541."I got that receipt when I bought some candy at a store in the airport."'
5425: '@rAuntie Eva pulled a small bag of candy out of her handbag.'
5426: 'George@r@v07/10300631."...Aah, the receipt from when you bought that candy?@k @v07/10300632....But, Mother, what does that receipt have to do with anything...?"'
5427: 'Hideyoshi@r@v06/11100354."George, stay quiet and listen for just a little longer..."'
5428: '@rUncle Hideyoshi''s expression was a little strict.@k@r...Somehow, it seemed that he understood what Auntie Eva was getting at.'
5429: 'Eva@r@v05/11000542."It was really just on a whim, you see?@k @v05/11000543.It wasn''t out of any foresight,@k@v05/11000544. and I certainly wasn''t planning on setting a trap for you or anything."'
5430: 'Eva@r@v05/11000545."......Actually, this receipt...@k@v05/11000546. You remember, Nee-san, that just after you met Father and left, you met me, right?@k @v05/11000547.At that time, I stuck this into the door to the study."'
5431: 'Battler@r@v10/10101048."......So, what does that mean?@k@v10/10101049. Does it mean that, until Aunt Natsuhi picked up that receipt, no one had opened the door...?"'
5432: 'Jessica@r@v04/10200585."W-wait a second, Auntie Eva...!@k @v04/10200586.Sticking a receipt in would be obvious!@k @v04/10200587.It''s possible that, when Grandfather opened the door, he noticed it, found it interesting, and stuck it back in the door..."'
5433: '@rJessica hurriedly argued back.'
5434: '@r...She still didn''t really know what it meant,@k but she realized that, whatever it was, it was placing some kind of suspicion on her own mother.'
5435: 'Eva@r@v05/11000548."Of course, I folded the receipt up very small so that no one would notice it.@k@v05/11000549. But even if you assume that he saw it fall, he would have no way of knowing how high up the door it had been stuck, right?"'
5436: 'Eva@r@v05/11000550."I checked it while Natsuhi nee-san was taking the key out.@k@v05/11000551. The receipt was still stuck not one millimeter away from where I had put it...!"'
5437: 'Natsuhi@r@v03/10900349."I, ......I can''t understand why you would pull such a childish prank!@k @v03/10900350.I, I''ll bet you were the one who did that prank on the door to my room, too!"'
5438: 'Nanjo@r@v19/11900151."......The door to your room?"'
5439: 'Natsuhi@r@v03/10900351."...It was unpleasant to talk about, so I didn''t,@k@v03/10900352. but this morning, when I woke up, there were the signs of some prank on the outside of my door, with what was probably the same red paint that was scribbled across the shutter.@k@v03/10900353. There were some unpleasant marks, as though someone had been tearing at the door..."'
5440: 'Hideyoshi@r@v06/11100355."Wait, what is this!@k @v06/11100356.Why have you been silent about this until now...?!!"'
5441: 'Natsuhi@r@v03/10900354."My apologies.@k@v03/10900355. Since so many horrid things have happened since then, I had completely forgotten about it until just now."'
5442: 'Eva@r@v05/11000552."I don''t know or care about that.@k@v05/11000553. I am not talking about your door, but the door to Father''s room, okay?@k @v05/11000554.After you checked that he was in his room, and until we made sure that he wasn''t, that door wasn''t opened even once.@k@v05/11000555. How did Father get out if he didn''t use the door?"'
5443: 'Natsuhi@r@v03/10900356.".........I, ...I don''t know that...!@k @v03/10900357.That''s what I want to know!!!"'
5444: 'Hideyoshi@r@v06/11100357."Natsuhi nee-san, other than you, who else checked to see whether Father was in his room?"'
5445: 'Nanjo@r@v19/11900152."The last time I met Kinzo-san was when we were playing chess last night...@k@v19/11900153. ...I believe I was with him until just before dinner......"'
5446: 'Hideyoshi@r@v06/11100358."Did anyone see him after that?"'
5447: 'Genji@r@v14/11600188."...............I did.@k@v14/11600189. I gave him his dinner last night."'
5448: 'Kanon@r@v16/10600200."......Yes.@k@v16/10600201. Shannon and I were with him."'
5449: 'Hideyoshi@r@v06/11100359."So up till then, Father was still definitely in his room.@k@|@y@v06/11100360. ...But, Natsuhi nee-san.@k@v06/11100361. It sounds like when you found out he wasn''t there, all ways in or out of the study were closed, right?@k@v06/11100362. ......But even so, you said that you met and talked with him this morning."'
5450: 'Nanjo@r@v19/11900154."......I, ......I don''t understand why everyone has become so gloomy.@k@v19/11900155. ...Could someone explain it to me...?"'
5451: 'George@r@v07/10300633."M-......Mother and Father, are you...@v07/10300634.......saying that what Aunt Natsuhi says about meeting Grandfather this morning...@v07/10300635....is a lie?"'
5452: 'Jessica@r@v04/10200588."Wh-why the hell would she tell a lie? Mom''s innocent!!@k @v04/10200589.Why the hell would she lie!!"'
5453: 'Natsuhi@r@v03/10900358."Jessica!@k @v03/10900359.I keep telling you to watch your language!"'
5454: '@rAll at once, everything became confused...'
5455: '@rFrom across the parlor table, Auntie Eva and Aunt Natsuhi confronted each other,@k while George-aniki confronted Jessica...@k ......What the hell is going on...?!!'
5456: 'Eva@r@v05/11000556."Remember, it''s only up until last night that we have multiple people saying they saw him.@k @v05/11000557.But the only one who claims that they saw Father since this morning is Natsuhi nee-san."'
5457: 'Eva@r@v05/11000558."......And then there''s that strange fact we learned from the receipt.@k@v05/11000559. ...So, how can we connect these points together...?"'
5458: '@rAuntie Eva urged everyone to work their imaginations...'
5459: '@r......Sure, that receipt could become an important point.@k@r...But I didn''t know what other point I could draw a line towards...!'
5460: '@rThe answer Auntie Eva was hoping for...@k......was that Aunt Natsuhi had lied to make it seem as if Grandfather had been in that room this morning.'
5461: '@rAnd Auntie Eva''s mere whim had exposed that......??'
5462: 'Jessica@r@v04/10200590."That makes no friggin'' sense!!@k @v04/10200591.Why the hell would Mom lie?!!@k @v04/10200592.She has no friggin'' reason to!!"'
5463: 'Eva@r@v05/11000560."......That''s what I want to know."'
5464: 'Eva@r@v05/11000561."But Jessica-chan.@k @v05/11000562.You can''t say that there''s no possible reason for her to lie about Father being in the room, right?@k @v05/11000563.You see it every once in a while in detective novels, don''t you?@k @v05/11000564.That trick of confusing the time of death to create an alibi."'
5465: 'Jessica@r@v04/10200593."Wh-what are you talking about?!@k @v04/10200594.I''ve never even heard of that!!"'
5466: 'Eva@r@v05/11000565."...We still haven''t found Father yet, but if you think about it normally, it would be natural to assume that he has already been killed.@k@v05/11000566. In that case, we should expect to find his corpse soon."'
5467: 'Eva@r@v05/11000567."...If, at that point, the time of death could be faked, Natsuhi nee-san would be able to create an alibi.@k@v05/11000568. ......Do you understand?@k @v05/11000569.Everyone?"'
5468: '@r...This morning, when Aunt Natsuhi went to check that Grandfather was there, she lied,@k ...and he was already dead at that time?'
5469: '@r...And, she moved the body to some location, and disguised it to make it seem like he had just been killed there.'
5470: '@r......And then she could stay with everyone else to prepare an alibi.'
5471: '@r......And then, she could say "I heard someone screaming!"@k or something and dash over there, and become the first to find the body along with everyone else... Is that what Auntie Eva''s saying......?'
5472: 'Natsuhi@r@v03/10900360."How preposterous.@k@v03/10900361. Detective novels are nothing more than indulgent entertainment!@k @v03/10900362.You can only think of such an indiscreet idea because you read them all the time!"'
5473: 'Jessica@r@v04/10200595."Yeah!!@k @v04/10200596.Even if she tried to fake the time of death a little, all of that would be blown away in an instant once the police did their autopsy!!@k @v04/10200597.It might have fooled the people in old books, but do you seriously think that kind of trick would fly in modern Japan?!@k @v04/10200598.Are you insane?!"'
5474: 'Eva@r@v05/11000570."......You think so?@k @v05/11000571.This morning, when Doctor Nanjo looked at the corpses, he was only able to give a vague estimate of the time of death, right?@k @v05/11000572.Autopsy results are affected greatly by the corpse''s surroundings and individual peculiarities.@k@v05/11000573. It''s a very rough estimate with an uncertainty of several hours."'
5475: 'Eva@r@v05/11000574."And, unfortunately, the police''s scientific investigation will have to wait until tomorrow.@k@v05/11000575. Measuring the exact time of death after that, even in modern Japan like you said, wouldn''t be that easy, you know?@k @v05/11000576.Right, Doctor Nanjo...?"'
5476: 'Nanjo@r@v19/11900156."............Examining a corpse is an extremely difficult task that requires both experience and instinct...@k@v19/11900157. I have heard that there is a very high rate of mistaken diagnoses...@k@v19/11900158. I imagine it is very possible for a misreading of just a few hours to occur..."'
5477: 'Hideyoshi@r@v06/11100363."...However, for an alibi, that''s more than enough!@k @v06/11100364.It''s not just a trick for the classics!@k @v06/11100365.It''s a trick that actually works!@k @v06/11100366.......Natsuhi nee-san.@k@v06/11100367. It''s not like we want to suspect you, alright?@k @v06/11100368.We don''t, an'' that''s why we just want you to prove you''re innocent."'
5478: 'Natsuhi@r@v03/10900363."What is this innocence you want me to prove?!!@k @v03/10900364.This morning, I definitely met with Father!!@k @v03/10900365.And he told me to keep the One-winged Eagle engraved in my heart...@k@v03/10900366. ......Are you denying that he said that, too?!!"'
5479: 'Natsuhi@r@v03/10900367."I will definitely not permit that!!@k @v03/10900368.I won''t permit you to deny that Father said those words!!"'
5480: 'Eva@r@v05/11000577."......Maybe Father''s body won''t appear at all?@k @v05/11000578.Normally, a person has to be missing for seven years before they''re officially declared dead.@k@|@y@v05/11000579. Wouldn''t that be a clever way to extend Father''s nearly finished life another seven years and keep all of his wealth for yourself!"'
5481: 'Natsuhi@r@v03/10900369."I, I cannot abide this!!@k @v03/10900370.I cannot abide any more from you!!"'
5482: 'Natsuhi@r@v03/10900371."I am Ushiromiya Natsuhi!!@k @v03/10900372.Although I do not have the right to wear the One-winged Eagle on my body, it is certainly engraved in my heart!!@k @v03/10900373.Speaking that way to the wife of Krauss, successor to the head - to the person who will act as such in his place - absolutely disgusting!!!"'
5483: 'Eva@r@v05/11000580."What''s thiiis?@k @v05/11000581.Are you going to shoot me with that gun?@k @v05/11000582.Go ahead, then?@k @|@y@v05/11000583.Why don''t you just shoot?!@k @v05/11000584.You''re just desperate because you can''t think of a way out, aren''t you?!@k @v05/11000585.Do it, just try to obscure the truth with violence...!!"'
5484: 'Natsuhi@r@v03/10900374."Y-......youuu!!!!"'
5485: '@rIt wasn''t like Aunt Natsuhi had been actually holding that gun at the ready and threatening anyone.@k@rBut after she was told to by Auntie Eva, she did hold it at the ready!'
5486: '@r...Unsurprisingly, once things got to this stage, Jessica and Genji-san tried to stop her.'
5487: 'Genji@r@v14/11600190."...Madam, please, calm yourself......!"'
5488: 'Jessica@r@v04/10200599."Mom, you aren''t lying!@k @v04/10200600.So there''s no reason for you to listen to this!!"'
5489: 'Hideyoshi@r@v06/11100369."......Calm down, Natsuhi nee-san.@k@v06/11100370. Don''t you just have to swear that Father was definitely in that room?@k @v06/11100371.Why are you getting so worked up over that...?"'
5490: 'Nanjo@r@v19/11900159."...Th-...that''s right.@k@v19/11900160. Natsuhi-san isn''t lying.@k@v19/11900161. Isn''t that the end of it...?"'
5491: 'Eva@r@v05/11000586."Then I want you to explain.@k@v05/11000587. How did Father manage to disappear from the room?@k@v05/11000588. ...The windows were closed tight from the inside.@k@v05/11000589. And the door too, remember!"'
5492: 'Eva@r@v05/11000590."......If you really met with Father this morning,@k@v05/11000591. ...then you must explain how he disappeared from this "unopened door" locked-room scenario.@k@v05/11000592. If you don''t, that would mean that you are a liar after all, right?"'
5493: 'Natsuhi@r@v03/10900375."How far do you plan to mock me......?!!!"'
5494: 'Eva@r@v05/11000593."If you want to argue back, go ahead!!@k @v05/11000594.That''s right, try explaining it right here, right now.@k @v05/11000595.After that, I can apologize to you for doubting you.@k@v05/11000596. How did Father manage to get out from that locked room?!!"'
5495: 'Natsuhi@r@v03/10900376."I can''t explain that, and I don''t need to!!"'
5496: 'Eva@r@v05/11000597."Really?@k @v05/11000598.Then let me explain it!@k @v05/11000599.We''ll take the best parts from my perspective and yours, and come up with a more friendly explanation!@k @v05/11000600.......I''ll believe that, like you said, Father was still in his room this morning."'
5497: 'Eva@r@v05/11000601."But the next time the door was opened, Father wasn''t there.@k@v05/11000602. You don''t have any objections so far, right?"'
5498: 'Natsuhi@r@v03/10900377."I have no desire to listen to anything more you have to say!!@k @v03/10900378.Shut your frivolous mouth!!"'
5499: 'Eva@r@v05/11000603."My reasoning goes like this, alright?@k @v05/11000604.I verified on both occasions that you were the only one to go through that door.@k@v05/11000605. And the receipt is proof of that!@k @v05/11000606.So what is the answer to the puzzle of how Father was sent out of the room regardless?"'
5500: 'Eva@r@v05/11000607."The window!@k @v05/11000608.He was sent out the window.@k@v05/11000609. ......Natsuhi nee-san, you pushed Father out of the third-story window of the study into the courtyard!!!"'
5501: 'Natsuhi@r@v03/10900379."YOU....@w500.VICIOUS MALCONTENT!!!!!!!!!!!!"'
5502: 'Kanon@r@v16/10600202."Madam, please, endure it...!!"'
5503: 'Kumasawa@r@v18/11800112."Eva-sama... Please stop this.....!!"'
5504: 'Eva@r@v05/11000610."Father died from the fall into the courtyard,@k@|@y@v05/11000611. and when you left saying you were going to check the doors and windows, you went and hid the corpse somewhere!@k @v05/11000612.That was probably when you took some measures to fake the time of death, right?!"'
5505: 'Hideyoshi@r@v06/11100372."......This all ties in with the case regardin'' Krauss nii-san and the rest, and also the case regardin'' BEATRICE last night!@k @v06/11100373.There''s an extremely good chance that Natsuhi-san is suspicious in those cases...@k@v06/11100374. Normally, I wouldn''t want to say this."'
5506: 'Hideyoshi@r@v06/11100375."...But now it''s out in the open, there''s nothin'' else I can do...!@k @v06/11100376.Please, Natsuhi nee-san!@k @v06/11100377.Please explain how you can be innocent!!@k @v06/11100378.Or else, I can''t help but suspect you...!!"'
5507: 'Natsuhi@r@v03/10900380."Why me?!!@k @v03/10900381.Why must I, Ushiromiya Natsuhi, be insulted like this!!!!!!!!"'
5508: '@r...............Hmm.@k ...Looks like everyone else has said their piece.'
5509: 'Battler@r@v10/10101050."Ihihihi.@k@|@y@v10/10101051. ...No good. No goddamn good at all,@k @v10/10101052.Auntie Eva."'
5510: 'Jessica@r@v04/10200601."...Wh-...what do you mean "no good", Battler..."'
5511: '@rJessica looked up at me, hanging on to my every word.@k@rAuntie Eva''s expression was composed as always.'
5512: 'Eva@r@v05/11000613."......No good at all, you say? What is?@k @v05/11000614.Battler-kun.@k@v05/11000615. Tell me."'
5513: 'Battler@r@v10/10101053."You can only see this from one angle - that''s why you''re convinced that it has to be Aunt Natsuhi.@k@v10/10101054. ...It''s not like I''m defending her, but bluffing a checkmate like that isn''t gonna work."'
5514: 'Battler@r@v10/10101055."I think the theory you''ve based around that receipt is passable.@k@v10/10101056. It''s not a bad thread of logic.@k@v10/10101057. But I''d only give it a grade of 65 at best.@k@v10/10101058. If this were an exam, that''d be bad enough to get you extra lessons in detention, you know?@k @v10/10101059.Ihihi!"'
5515: 'Eva@r@v05/11000616."...Oh my. Well, how would you break through a door sealed by a receipt, and make Father disappear? Other than by my theory?!"'
5516: 'Battler@r@v10/10101060."Your theory is interesting, I admit.@k@v10/10101061. And if we could state definitively that there was no way to make Grandfather disappear other than yours,@k@v10/10101062. then we could say for certain that the last person to see him, Aunt Natsuhi, has to be responsible."'
5517: 'Battler@r@v10/10101063."However, since there still is a possibility that she is innocent, and that these accusations are false, you can''t make that claim!!"'
5518: 'Eva@r@v05/11000617."......Hmm. Then, Battler-kun, who are you saying could have made Grandfather disappear, other than Natsuhi nee-san?@k @v05/11000618.It would be impossible for anyone else to do it.@k@v05/11000619. My receipt proved that, right?"'
5519: 'Eva@r@v05/11000620."From the first time she visited that study,@k@v05/11000621. and until the second time when we visited it together, the study was a perfect locked room, and when the seal was broken on the locked room, he was already missing!@k @v05/11000622.If this doesn''t prove that she was the culprit, what kind of trick could they have used?!"'
5520: 'Battler@r@v10/10101064."Like I said, Auntie Eva, only 65 points.@k@|@y@v10/10101065. So, let''s try "flipping over the chessboard", shall we?@k @v10/10101066.It''s not about how they managed to make Grandfather disappear from the outside.@k@v10/10101067. Think about how Grandfather disappeared from the inside."'
5521: 'Battler@r@v10/10101068."The door had the receipt stuck in it, so it couldn''t have been used.@k@v10/10101069. He also couldn''t have gone through a window, because they can''t be locked from the outside, and when you visited the study, you checked to make sure they were locked.@k@v10/10101070. So the windows also weren''t used.@k@v10/10101071. At that point, the study really was a locked room.@k@v10/10101072. We have to accept this!"'
5522: 'Battler@r@v10/10101073."However, the study didn''t remain a locked room forever.@k@v10/10101074. Once the seal created by the receipt was removed, it became possible to use the door, and possible to escape through the door."'
5523: 'Battler@r@v10/10101075."...In other words, it''s not about how Aunt Natsuhi made Grandfather disappear.@k@v10/10101076. ...We need to think about how he was able to escape!!"'
5524: 'Battler@r@v10/10101077."Grandfather''s study isn''t any ordinary study, right?@k @v10/10101078.According to Genji-san, there''s a toilet and a kitchen and even a bedroom, almost like a little house.@k@v10/10101079. ......If he hid under the bed, for example, he could trick the two of you into thinking he''d disappeared, right?"'
5525: 'Battler@r@v10/10101080."Auntie Eva, even you didn''t check that carefully, did you?@k @v10/10101081.And then the two of you went back down the stairs, thinking that he wasn''t there."'
5526: 'Battler@r@v10/10101082."At that time, the receipt was already gone!@k @v10/10101083.In other words, if Grandfather was hiding in his room the whole time when it was a locked room,@k@v10/10101084. and escaped after letting the two of you go past him, we can crack this locked room right open!!"'
5527: 'Eva@r@v05/11000623."Wh-what is this?!@k @v05/11000624.Why would Father want to do something that weird and then escape the room?!@k @v05/11000625.Don''t be so absurd!"'
5528: 'Battler@r@v10/10101085."Yeah, it might be absurd.@k@v10/10101086. However, it still shows that there is a possibility that Aunt Natsuhi is being accused falsely.@k@v10/10101087. Your receipt wasn''t perfect.@k@v10/10101088. In chess, we might call that check,@k@v10/10101089. but it isn''t checkmate!!"'
5529: 'Battler@r@v10/10101090."And the thing that I like least,@k@v10/10101091. is how you pressure Aunt Natsuhi to explain it, and then argue that if she doesn''t, she must be guilty!@k @v10/10101092.If that passes as logic, then why don''t you let me......"'
5530: 'Battler@r@v10/10101093."...flip over the chessboard one more time!!"'
5531: 'Battler@r@v10/10101094."Auntie Eva, according to your argument,@k@v10/10101095. ......you must explain to us here and now why you and Uncle Hideyoshi couldn''t have killed those six last night and then casually returned to the guesthouse...!"'
5532: 'Battler@r@v10/10101096."You''ve been trying to force Aunt Natsuhi to explain.@k@v10/10101097. I''m sure you can prove your own innocence, right?!@k @v10/10101098.Auntie Eva, who''s had all of Grandfather''s wealth suddenly dropped right into her hands!!"'
5533: 'Jessica@r@v04/10200602."Th-that''s right, you''re pretty damn suspicious yourself, aren''t you!!@k @v04/10200603.If you say Mom''s suspicious ''cause she was the last person to see him,@k@v04/10200604. then what about you, Auntie Eva, who was the last person to see Dad and the rest?!!@k @v04/10200605.Just like Battler said, prove that you two weren''t the ones that killed them!!"'
5534: 'George@r@v07/10300636.".........Mother, I also think that your reasoning was a little overeager.@k@v07/10300637. ......I''m sure that the receipt was an important hint."'
5535: 'George@r@v07/10300638."But, like Battler-kun said, that''s not enough to prove that Aunt Natsuhi is guilty to any degree.@k@v07/10300639. ......We''re all equally suspicious.@k@v07/10300640. It''s not right for only Aunt Natsuhi to be persecuted."'
5536: 'Eva@r@v05/11000626."Our, our noble father, crawling on the floor under his bed?@k @v05/11000627.You call nonsense like that an explanation?!"'
5537: 'Jessica@r@v04/10200606."Then why don''t you explain first?!!@k @v04/10200607.Who killed those six, and how, and then try showing us proof that you weren''t involved!!"'
5538: 'Jessica@r@v04/10200608."......*cough*,@v04/10200608_1. *cough* *cough* *cough*,@v04/10200608_2. *cough*,@v04/10200608_3. *kof*!!!@k @v04/10200609.uu, *cough* *cough* *cough*!!@k @|@y@v04/10200610.*coughCOUGH*!!@k @v04/10200611.*kofkofkofkof*!!!"'
5539: 'Kanon@r@v16/10600203."Milady... Milady...!!"'
5540: '@rJessica suddenly started coughing.@k At first I thought that she was just choking after yelling too loud, but it seemed to be lasting too long for that, and she really looked like she was suffering...'
5541: '@rJessica kept coughing and choking, down on her hands and knees...'
5542: 'Natsuhi@r@v03/10900382."Jessica... Hang in there...!!@k @v03/10900383.Doctor Nanjo...!"'
5543: 'Nanjo@r@v19/11900162."...Jessica-san, your inhaler, quickly.@k@v19/11900163. ......No, wait, I have one with me."'
5544: '@rDoctor Nanjo pulled a bronchodilator inhaler from his own bag, which was lying on the sofa, and handed it to Kanon-kun.'
5545: '@r......Come to think of it, six years ago, didn''t Jessica sometimes break into violent coughing and have to use that...?'
5546: '@rBut six years ago, I never saw Jessica look like she was in this much pain.'
5547: 'Battler@r@v10/10101099."......Aniki, was Jessica''s asthma always this bad...?"'
5548: 'George@r@v07/10300641."It''s gotten a lot worse these last few years...@k@v07/10300642. It''s no problem when she''s normal...@k@v07/10300643. But when an attack comes suddenly, she can''t stop coughing."'
5549: 'Jessica@r@v04/10200612."*cough* *cough*!!@k @v04/10200613.uu, ga*COUGH* *coughcough*!!@k @v04/10200614.*kofkof*, *kofkof*!!"'
5550: 'Kanon@r@v16/10600204."......Milady, your medicine.@k@v16/10600205. .........Here..."'
5551: 'Jessica@r@v04/10200615."...............nnn...@w500....@k@v04/10200616. ......*coughcough*!!"'
5552: '@rTaking the inhaler from Kanon-kun, Jessica used it with a practiced hand.'
5553: '@r...For a while, it looked like her throat was still feeling itchy, but it gradually settled down...'
5554: 'Battler@r@v10/10101100."Are you alright, Jessica...?@k@v10/10101101. You scared me..."'
5555: 'Jessica@r@v04/10200617."......It''s no big deal.@k@v04/10200618. ...Don''t worry about it..."'
5556: '@rBeads of sweat covered Jessica''s whole body and she couldn''t hide her rough breathing, but it looked like her sudden attack had calmed down for now...'
5557: '@rThis disturbance had left the room''s hostile atmosphere in an awkward, unsettled state.'
5558: '@rBut that was fine.@k ......There was absolutely no need to be driving up everyone''s suspicions of each other.'
5559: '@rWhen you think about it, even probing at each other''s alibis and searching for the killer were probably completely unnecessary.'
5560: '@rAfter all, we''re just powerless, ordinary people,@k and when the police come tomorrow, they''ll definitely employ cutting-edge techniques and investigate the case thoroughly,@k solve all of the riddles and arrest the killer...'
5561: 'Eva@r@v05/11000628."............I wonder if Battler-kun is right after all.@k@v05/11000629. ...Just like Natsuhi nee-san is suspicious, I can''t ignore the fact that we are suspicious too.@k@v05/11000630. Arguing about that now is certainly unproductive.@k@v05/11000631. ...Everything will be fine if we just leave it to the police tomorrow."'
5562: 'Eva@r@v05/11000632.".........But don''t you want to know too, Battler-kun?@k @v05/11000633.Who the killer is?@k@v05/11000634. ...Don''t you want to let them know right this very second the pain you feel from losing someone precious to you?"'
5563: 'Battler@r@v10/10101102.".........I won''t deny that.@k@v10/10101103. Even one day would be too long to let the bastard who pulled this detestable bullshit go."'
5564: 'Battler@r@v10/10101104."......But that doesn''t mean that I want to doubt one of the 18.@k@v10/10101105. Even though I said what I said earlier, I don''t even want to doubt you, Auntie Eva.@k@v10/10101106. ...To me, you''re an awesome aunt who''s always mischievous and entertaining."'
5565: 'Battler@r@v10/10101107."......I don''t want to trade insults with an aunt like that.@k@v10/10101108. Not a single person here wants to do that.@k@|@y@v10/10101109. .........Right?@k @v10/10101110.Everyone?"'
5566: 'George@r@v07/10300644."..................I feel the same as Battler-kun.@k@v07/10300645. ...It''s pointless to trade insults.@k@v07/10300646. ......It''s probably just the stress built up because so many people have been crammed in one place since morning."'
5567: 'Nanjo@r@v19/11900164."......Probably.@k@v19/11900165. It is only natural...@k@v19/11900166. It may be easier said than done, but I think we should all relax as much as possible..."'
5568: 'Hideyoshi@r@v06/11100379."...............Eva.@k@v06/11100380. Don''t you think we should cool our heads?@k@v06/11100381. ...I do think the receipt is gonna be an important clue in searchin'' for Father''s whereabouts.@k@v06/11100382. We should tell the police about it when they come..."'
5569: 'Eva@r@v05/11000635."...Yes, you''re right.@k@v05/11000636. ...Yes.@k@v05/11000637. I just felt a little triumphant when I figured out that part with the receipt.@k@|@y@v05/11000638. ......Of course it isn''t fair to only doubt Natsuhi nee-san.@k @v05/11000639.We''re just as suspicious."'
5570: 'Eva@r@v05/11000640."......But still, Battler-kun?@k @v05/11000641.At least the part about the receipt is real, alright?@k @v05/11000642....Don''t forget this.@k@v05/11000643. And try thinking deeply about what this means, okay...?"'
5571: 'Battler@r@v10/10101111."....................."'
5572: 'Natsuhi@r@v03/10900384."...................................."'
5573: '@rAuntie Eva and Uncle Hideyoshi stood up.@k@rIt looked like they planned on leaving the parlor.'
5574: 'Eva@r@v05/11000644."In the end, it''s pointless for us to continue playing detectives.@k@v05/11000645. After all, the police will reveal everything in the end anyway."'
5575: '@r.........That''s right.'
5576: '@rEven if we don''t play this detective game, when the typhoon passes,@k ...and those lively seagulls return to the harbor, everything will settle itself.'
5577: '@rYes.@k If you think about it, this kind of crime is completely trivial.'
5578: '@r......It will definitely be resolved - @k@reven if we do nothing - @kwhen the seagulls cry.'
5579: 'Eva@r@v05/11000646."...Natsuhi nee-san, I''ll take it that you don''t want to see my face anymore?@k @v05/11000647.I feel the same.@k@v05/11000648. ...If I remember correctly, yesterday, you had some rooms prepared for us in the mansion so that we wouldn''t need to go back to the guesthouse, right?"'
5580: 'Eva@r@v05/11000649."There should be a bath and a toilet there, as well as a lock and a chain to secure the door.@k@v05/11000650. There''s even a bed to lie on, and my husband will be able to watch TV without having to fight with Maria-chan over which channel to watch, okay?"'
5581: 'Natsuhi@r@v03/10900385."....................................@k@v03/10900386. ......You may do as you please.@k@|@y@v03/10900387. ...But...make sure to be cautious."'
5582: 'Eva@r@v05/11000651."Thank you, Nee-san.@k@v05/11000652. ...And mind your own business.@k@v05/11000653. I''ll be counting on you to keep an eye on everyone, alright?@k @v05/11000654.Because the killer is definitely among us.@k@|@y@v05/11000655. ...And Nee-san, make sure you don''t forget that you''re being watched, too."'
5583: 'Natsuhi@r@v03/10900388.".........Haven''t you made enough parting remarks?"'
5584: 'Eva@r@v05/11000656."...Yes, that''s enough.@k@v05/11000657. .........See you, Natsuhi nee-san.@k@v05/11000658. ......Genji-san, please call for us when it''s dinnertime.@k@v05/11000659. Until then, we''ll keep ourselves locked in with the chain."'
5585: 'Hideyoshi@r@v06/11100383."..........................."'
5586: 'Natsuhi@r@v03/10900389."......Genji, Kanon.@k@v03/10900390. Escort them to the guest room."'
5587: 'Eva@r@v05/11000660."We''ll be fine.@k@v05/11000661. I don''t want to end up being escorted by the killer.@k@v05/11000662. In fact, I would be more comfortable if nobody left this room until we reach ours.@k@v05/11000663. .........Let''s go, George."'
5588: 'George@r@v07/10300647."...............I''ll stay here with everyone else."'
5589: 'Eva@r@v05/11000664."George...!@k @v05/11000665.The killer is in this room.@k@v05/11000666. Do you plan on staying in a place like that...?!"'
5590: 'George@r@v07/10300648."......Leaving this room...would be the same as suspecting one of my relatives.@k@v07/10300649. ...I......refuse to believe that anyone in our family is capable of something so horrifying."'
5591: 'Eva@r@v05/11000667."George...!@k @v05/11000668.......Honey, say something to him...!"'
5592: 'Hideyoshi@r@v06/11100384.".........George is already an adult.@k@v06/11100385. ...If his code tells him not to leave this room, then it''s up to him.@k@v06/11100386. Let him do what he wants..."'
5593: 'George@r@v07/10300650."...Father..."'
5594: '@rAuntie Eva and Uncle Hideyoshi left.@k@rThe only voice that called after them was the sound of the rain.'
5595: '@rThe parlor was being buried beneath the savage atmosphere...@k@rWhen I looked at the clock, I was surprised to find that it was already evening.'
5596: '@r.........Had we really spent that much time worrying, talking, fighting about such needless things...?'
5597: '@rFeeling bored, I started clawing at my head, when...'
5598: '@r...Maria and I made eye contact.'
5599: '@rSince I had thought she was completely immersed in the TV, I was a little surprised.'
5600: 'Battler@r@v10/10101112."......I''ll believe it now."'
5601: 'Maria@r@v13/10400652."Uu...?"'
5602: 'Battler@r@v10/10101113."The letter, the murders, everything - it was all BEATRICE.@k@v10/10101114. ...No, actually, I wish she would just come out and say that was true.@k@v10/10101115. .........I want it to be the work of a 19th person.@k@v10/10101116. Otherwise, the 18 of us will have to keep on doubting each other...@k@v10/10101117. ...I think believing in a 19th person is better than that..."'
5603: 'Maria@r@v13/10400653.".............................."'
5604: 'Battler@r@v10/10101118."...Bringing Grandfather outside without opening the doors or windows must be a piece of cake for BEATRICE, right...?"'
5605: '@rMaria, after taking a single, short breath, hung her head, ......and then raised her face again.'
5606: 'Maria@r@v13/10400654."............That''s right.@k@v13/10400655. Kihihihihihihihi, locking a door is useless against a witch.@k@v13/10400656_1. ......BEATRICE is familiar with all 72 demons.@k@v13/10400657. The 33rd ranked, Gaap, gives the power to instantly carry the desired person to any location."'
5607: 'Maria@r@v13/10400658."...To her, taking a person out of any locked room isn''t hard at all, you see?@k @v13/10400659.Kihihihihihihihihihihihihihihihihihi..."'
5608: 'Battler@r@v10/10101119."Witches sure are incredible.@k@v10/10101120. ......Tell her, if she still plans on committing another crime, to do it in a way that no human could,@k@|@y@v10/10101121. ......to make me believe that a 19th person,@v10/10101122. ......no, a witch, exists."'
5609: 'Maria@r@v13/10400660.".................................Kihihi.@k@v13/10400661. ......Alright.@k@v13/10400662. If I meet her, I''ll tell her."'
5610: '@rDammit...@k I don''t even understand my own thoughts anymore...'
5611: '@rWhen I''m led to believe in a 19th person, I deny it, and when I''m led to believe that there are only 18 people, I deny that too.'
5612: '@rEven though I wish that there were more than just the 18 people here, I can''t accept the existence of that 19th person.'
5613: '@r......In short, even though there are more than 18 people, there are less than 19.@k@r......The number of people in this mansion is 19>X>18.@k@rSo the number of people can''t be represented by an integer.'
5614: '@r......However, it''s impossible for there to be anything after the decimal point.@k@rYou shouldn''t be able to represent the number of people with anything but an integer.'
5615: '@r...And yet, 19>X>18.@k@rWhy does a fraction less than 1 play into this...!'
5616: '@rIt''s no wonder.@k ...That 19th person is an invisible being, that can''t be ''seen''.@k@rThat''s why, in the integer representation that must be used to describe numbers of people, she can''t be ''seen''.'
5617: '@rThat witch cannot be ''seen''.@k@rBecause BEATRICE has no body.@k@rTherefore, she is invisible.'
5618: '@rIs there a 19th person, or not?@k@rDoes the witch exist, or not?'
5619: '@r19>X>18.@k@r...The witch exists somewhere in that X...!'