50744: 'Lion@r@v53/75300266."......I think...@k@v53/75300267.I now understand just how much the woman called Beatrice influenced Grandfather''s life."'
50745: 'Will@r@v54/75400526."We haven''t learned anything.@k@v54/75400527. "Who killed BEATRICE?"@k@v54/75400528. That''s what we''ve got to figure out, or we''ll never be able to get out of here."'
50746: 'Lion@r@v53/75300268."......You''re right.@k@v53/75300269. We need to finish this quickly.@k@v53/75300270. The funeral is already over, after all."'
50747: 'Will@r@v54/75400529."...........................@k@v54/75400530. You''ve got it all wrong.@k@v54/75400531. ......This is...@k@v54/75400532....the funeral."'
50748: 'Lion@r@v53/75300271."You mean, what she''s making us do...?"'
50749: 'Will@r@v54/75400533."None of the Beatrices we''ve heard about so far were killed.@k@v54/75400534. ......We need to change that.@k@v54/75400535. That''s the real funeral, as far as BERNKASTEL''s concerned."'
50750: 'Lion@r@v53/75300272."............No one knows about the "killed" factor.@k@v53/75300273. And that''s the truth we''re trying to expose?"'
50751: 'Will@r@v54/75400536."Hmm, ......you are perceptive.@k@v54/75400537. It hardly feels like I''m talking to a piece from the lower plane.@k@v54/75400538. It must be because you were given to me as my Watson.@k@|@y@v54/75400539. ............Ouch!"'
50752: 'Lion@r@v53/75300274."Don''t call your partner a piece.@k@v53/75300275. ......So, what next,@k @v53/75300276.Willard Holmes?"'
50753: 'Will@r@v54/75400540."The basis of investigation is asking questions.@k@v54/75400541. There''s still a BEATRICE we need to ask about."'
50754: '@rTo indicate who they should talk to next, Will nodded in the direction of George, Jessica, and Maria.'
50755: '@rMaria seemed to be lecturing the others about something.'
50756: 'George@r@v07/70300001."Wow.@k@v07/70300002. BEATRICE sounds pretty incredible."'
50757: 'Maria@r@v13/70400001."Yeah!@k @v13/70400002.And then, inside the upside-down cup,@k @v13/70400003.she made tons of candies appear out of nowhere!"'
50758: 'Jessica@r@v04/70200001."Inside the overturned cup?@k @v04/70200002.That''s wild.@k@v04/70200003. Sounds like magic to me."'
50759: 'Lion@r@v53/75300277."......Maria-chan really does love witches and magic."'
50760: 'Will@r@v54/75400542."Can''t pass up the chance to talk to the authority on witches, can we?"'
50761: '@rIf looking for someone to ask about BEATRICE, Maria would rise to the top of the list.'
50762: '@rThe BEATRICE she spoke of wasn''t the real Beatrice spoken of by Kinzo and the others.'
50763: '@rHowever, on the Rokkenjima of 1986, the being that the name BEATRICE referred to was probably the BEATRICE that Maria always talked about.'
50764: 'Will@r@v54/75400543.".........I don''t see Battler anywhere."'
50765: '@rUshiromiya Battler.@k ......The one who was made to fight as BEATRICE''s opponent in many games, and the most important person in this game and this tale.'
50766: '@rA Battler in this world would probably be the piece version, but even so, it should be possible to get some vital information out of him.'
50767: '@r......Will probably wanted to talk with Battler too, but he was nowhere to be seen in the cousins'' group.'
50768: 'Lion@r@v53/75300278."Battler-kun isn''t present at the funeral today.@k@v53/75300279. It''s a shame, seeing as he''s the cousin closest in age to me."'
50769: 'Will@r@v54/75400544."Are you two on good terms?"'
50770: 'Lion@r@v53/75300280."Yes, of course."'
50771: 'Will@r@v54/75400545.".........And you pinch his butt every time he says something perverted."'
50772: 'Lion@r@v53/75300281."Oh, how did you know?@k@v53/75300282. Did your detective instincts tell you that?"'
50773: 'Will@r@v54/75400546."Poor guy."'
50774: '@r......BERNKASTEL said that everything was gathered here.'
50775: '@rSince Battler isn''t here, that probably means it''s possible to find out everything without asking for his side of the story.'
50776: '@rOr, maybe she''s intentionally hiding the core elements and making us take the long way around, as part of some fickle witch''s game.'
50777: 'Will@r@v54/75400547."Since he isn''t here, ......that probably means there''s no need to hear his story for the time being.@k@v54/75400548. ......Let''s talk to Maria and the others.@k@v54/75400549. ......I won''t say anything perverted, so keep your hands off my ass."'
50778: 'Lion@r@v53/75300283."Then why not try choosing your words a bit more carefully?"'
50779: '@rWith a roguish smile, Lion pinched the air, index finger against middle.'
50780: 'Jessica@r@v04/70200004."Ah, it''s the future heir.@k@v04/70200005. Are you done babysitting the old geezer?@k @|@y@v04/70200006..........Gyaah!"'
50781: '@rAt least Lion is impartial.@k No mercy, even for Jessica.@k Will felt a bit gratified.'
50782: 'Will@r@v54/75400550."......I see.@k@v54/75400551. Since you''re both the successor and Krauss''s child, ......that makes Jessica your little sister."'
50783: '@rHe was so used to Jessica being an only child that, though the scuffle between the two looked perfectly natural,@k something didn''t feel quite right about it.'
50784: 'Lion@r@v53/75300284."Jessica.@k@v53/75300285. Can''t you talk a bit more like a little sister''s supposed to?@k @v53/75300286.And while we''re at it, why not try talking more like a girl your age.@k@v53/75300287. Also, how many times do I have to tell you to stop calling me "future heir"?"'
50785: 'Jessica@r@v04/70200007."C-cram it!@k @v04/70200008.I''ll live the way I want to!@k @v04/70200009.I''d suffocate if I had to act all refined like you, future heir...!"'
50786: 'Jessica@r@v04/70200010."Yeek!@k @v04/70200011.Ouch!@|@y@k @v04/70200012.Owowowowow!!@|@y@k @v04/70200013.Stop it, don''t pinch me!@|@y@k @v04/70200014.This is sister bullying—@v04/70200015. pervert—@v04/70200016.stop it—@v04/70200017.owow!"@|@y'
50787: 'Lion@r@v53/75300288."Jessica!@k @v53/75300289.Why are you talking like that in front of a guest...?!@k @v53/75300290.Do you want me to get Mother involved again?!"'
50788: 'Will@r@v54/75400552.".........Looks like those two are close, in their own special way."'
50789: 'George@r@v07/70300003."Well, Lion is a person of impeccable character, perfectly suited to being the next head.@k@|@y@v07/70300004. ......I guess I understand how Jessica-chan feels... Lion might be a bit too perfect sometimes."'
50790: 'Will@r@v54/75400553."She gets compared to Lion no matter what she does.@k@v54/75400554. So you think that made her rebel?"'
50791: 'George@r@v07/70300005."If Jessica-chan had been born an only child, I''m sure she''d have become a composed, quiet young lady.@k@v07/70300006. ......Ahaha, that''s an interesting thought."'
50792: 'Will@r@v54/75400555."Don''t worry.@k@v54/75400556. Only child or not, her personality wouldn''t change a bit."'
50793: 'Maria@r@v13/70400004."George onii-chan,@v13/70400005. ......who''s this?"'
50794: 'George@r@v07/70300007."This is the first time I''ve met you, correct?@k @v07/70300008.But it sounds as though you know a lot about our family.@k@v07/70300009. I''m George,@k@v07/70300010. and this here is Maria.@k@v07/70300011. Pleased to meet you."'
50795: 'Will@r@v54/75400557."Call me Will.@k@v54/75400558. I''m investigating BEATRICE.@k@v54/75400559. I want you to tell me what you know."'
50796: 'Maria@r@v13/70400006."BEATRICE?! Uu!!@k @v13/70400007.See?!@k @v13/70400008.BEATRICE exists!@k @v13/70400009.Uu-uu-uu!!"'
50797: '@rThough Maria had looked hostile towards this unfamiliar man,@k as soon as she heard the name of the witch she loved pass his lips, her eyes began to sparkle.'
50798: 'George@r@v07/70300012."Hey, Maria-chan.@k@v07/70300013. You''ve got to greet our guest properly."'
50799: 'Maria@r@v13/70400010."Hello!@k @v13/70400011.My name is Ushiromiya Maria, uu!@k @v13/70400012.I''m glad to meet someone who knows BEATRICE.@k@v13/70400013. Handshake, uu!"'
50800: 'Will@r@v54/75400560."Nn."'
50801: '@rMaria suddenly stuck out her small hand, and Will reached out for it reflexively.'
50802: '@rAs soon as he did, ......he felt a bright light seeping out from the gap between their hands.'
50803: '@rThe theatergoing power that BERNKASTEL had given him had affected Maria.'
50804: 'Maria@r@v13/70400014."BEATRICE is the witch of Rokkenjima...!@k @v13/70400015.She plays with me every time I come to Rokkenjima!@k@v13/70400016. She''s my best friend, and a fellow member of Mariage Sorciere! Uu!!"'
50805: '@rThe light grew brighter and brighter......'
50806: '@rThis time, he could feel himself being drawn into Maria''s world...'
50807: '@rI''m Ushiromiya Maria.@k My mama is Rosa.@k My papa......... I don''t have a papa.'
50808: '@rI think I remember Mama showing me a picture long ago and saying "this is your papa".'
50809: '@rIt was a picture of a man with a dark suntan, on a beach, wearing a swimsuit.'
50810: '@r......Later on, when I learned what "Papa" meant,@k I asked Mama to show me that picture again, but she said there wasn''t any photo like that.'
50811: '@rBut there was.@k I drew a picture of it and showed it to Mama.@k When I did, she got really mad and said that photo didn''t exist, or that, if it did, she had already thrown it away.'
50812: '@rEver since then,@w250. ......she kept saying that I didn''t have a papa.'
50813: 'Maria@r@v13/70400017."......Did you know?@k @v13/70400018.People say you need a papa and a mama to have a baby, but that''s a lie."'
50814: 'Will@r@v54/75400561."The virgin birth..."'
50815: 'Maria@r@v13/70400019."''Behold, a virgin shall be with child, and shall bring forth a son,@k@v13/70400020. and they shall call his name Emmanuel.''@k@v13/70400021. ......If I was a boy, that might have been my name."'
50816: 'Will@r@v54/75400562."Book of Matthew, chapter 1, verse 20."'
50817: 'Maria@r@v13/70400022."No, verse 23.@k@v13/70400023. Verse 20 is "But while he thought on these things, behold, the angel of the Lord appeared unto him in a dream,@k@v13/70400024. saying, Joseph, thou son of David,@k@v13/70400025. fear not to take unto thee Mary thy wife:@k@v13/70400026. for that which is conceived in her is of the Holy Ghost.""'
50818: 'Will@r@v54/75400563."......So you think your father is the Holy Ghost."'
50819: 'Maria@r@v13/70400027."Everyone said that everyone has a papa.@k@v13/70400028. They said it was strange to not have a papa, that I was weird, that they felt sorry for me."'
50820: 'Maria@r@v13/70400029."But when I asked Mama, she said I didn''t have a papa, that he didn''t exist.@k@v13/70400030. She got mad and hit me even though all I did was ask.@k@v13/70400031. So......I didn''t really understand who gave birth to me."'
50821: 'Maria@r@v13/70400032."......I was...not right as a Human, an immature and irregular creature.@k@v13/70400033. I realized I was a strange, pitiful girl, different from everyone else."'
50822: 'Will@r@v54/75400564."It doesn''t matter who your parents are or what other people say.@k@v54/75400565. You are who you are."'
50823: 'Maria@r@v13/70400034."It must have been hard to teach that to a young, immature girl.@k@v13/70400035. My kindergarten teacher might have said that to me when I cried after being bullied.@k@v13/70400036. ......But even those words of encouragement couldn''t fill the blank space...@v13/70400037....no, the questions.@k@v13/70400038. Nothing anyone said could answer the questions in my mind."'
50824: 'Will@r@v54/75400566."And the Book is what gave you the answers?"'
50825: 'Maria@r@v13/70400039."A priest came to see us."'
50826: '@rI think his sermon was part of a class to enrich our minds.'
50827: '@rTo most of us kids, it was no different from an ordinary fairy tale a teacher could have told us.@k ......No, it was harder to understand, and I think that made us bored.'
50828: '@rThen, at the end, the priest said something important.'
50829: 'Will@r@v54/75400567."That God knows everything?"'
50830: 'Maria@r@v13/70400040."Yep.@k@v13/70400041. So I asked him.@k@v13/70400042. ......I only have a mama.@k@v13/70400043. I don''t have a papa.@k@v13/70400044. Mama gave birth to me without a papa.@k@v13/70400045. Is that strange and sad? ...I asked."'
50831: '@rThe priest taught me.@k@rHe said there was nothing strange about a child having no papa.'
50832: '@rAfter all, Jesus Christ was born of a virgin.'
50833: '@rAnd the one who gave birth to him...@w500.was the Blessed Virgin...Maria...?'
50834: '@rI was surprised!'
50835: '@rMaria, the name I was given, was the answer all along.'
50836: 'Maria@r@v13/70400046."I was so surprised, I asked the priest to say it again.@k@v13/70400047. ......He said that the Virgin Maria gave birth to a baby by herself!@k@|@y@v13/70400048. So, I asked him if that meant I could give birth to a baby all by myself too."'
50837: 'Will@r@v54/75400568."And how''d he answer that?"'
50838: 'Maria@r@v13/70400049."He said the Virgin Maria was with child because of the Holy Ghost.@k@v13/70400050. Book of Matthew, chapter 1, verse 20, last part.@k@v13/70400051. "For that which is conceived in her is of the Holy Ghost".@k@|@y@v13/70400052. ......That surprised me again!@k @v13/70400053.What do you think that means?!"'
50839: 'Will@r@v54/75400569."......You interpreted this to mean that...@k@v54/75400570.Ushiromiya Maria had no Human father.@k@v54/75400571. ......That your real father was the Holy Ghost."'
50840: '@rRegardless of what the Bible actually meant,@k ......the young, sad girl, who had lost her sense of identity because of her lack of a father,@k had finally created a way to understand herself.'
50841: 'Maria@r@v13/70400054."Once I realized that, I knew why I was different from all the other kids!@k @v13/70400055.The ones who made fun of me were all children of Joseph.@k@v13/70400056. But I alone was different!@k @v13/70400057.I wasn''t worse than everyone else...!@k @v13/70400058.I was a child of God, a child of the Holy Ghost!!@k @v13/70400059.When I got back, I told Mama.@k@v13/70400060. I had no papa after all.@k@v13/70400061. Mama gave birth to me all on her own thanks to the power of God."'
50842: '@rIt was probably painful for Rosa whenever Maria asked about her father.'
50843: '@r"Why do I have no papa, when everyone else has a papa and a mama?"'
50844: '@rEvery time she was asked this, Rosa flew into a rage and changed the subject.'
50845: '@r......And now, somehow or other, Maria had independently found an explanation that satisfied her.'
50846: '@rShe had no papa;@k she was the child of Mama and God.'
50847: '@rIt isn''t too difficult to imagine that Rosa, after hearing the explanation the young girl had found in the Bible, might have gone along with it as though it were true......'
50848: 'Maria@r@v13/70400062."Beato said that the minimum number of people needed to create a world was two.@k@v13/70400063. I thought she meant that you need two parents to create a child.@k@|@y@v13/70400064. ......That was when I came to a new thought.@k@v13/70400065. Beato may be a witch, but she''s a witch born of a Human.@k@v13/70400066. Beato isn''t a child of the Holy Ghost."'
50849: 'Maria@r@v13/70400067."But I''m different.@k@v13/70400068. I was born from Mama alone.@k@v13/70400069. I was born of the Holy Ghost!@k @v13/70400070..........Beato can''t create a universe without me.@k@v13/70400071. But I have...@k@v13/70400072.''God with us.''@k@v13/70400073. I can make a universe all by myself, along with the Holy Ghost!"'
50850: 'Maria@r@v13/70400074_b."Beato called me the Witch of Origins.@k@v13/70400075. And she also said that eventually, I might become a Creator, who can create anything alone.@k@v13/70400076. All by myself, I can create something out of nothing!@k @v13/70400077.Beato can take that and make it expand infinitely!@k @v13/70400078.Ange was the witches'' apostle, who would spread the word far and wide!"'
50851: 'Will@r@v54/75400572."And that was Mariage Sorciere."'
50852: 'Maria@r@v13/70400079."There''s a huge difference between one and infinity.@k@v13/70400080. That''s why Beato is so great.@k@v13/70400081. But compared to the difference between something and nothing, one and infinity are both just "something".@k@v13/70400082. I''m the child destined to become the best witch—no!@k @v13/70400083.The greatest Creator in the world...!"'
50853: 'Maria@r@v13/70400084."Mariage Sorciere was the nest to warm up my egg!@k @v13/70400085.I am Ushiromiya Maria!!@k @v13/70400086.Maria, who stands by God''s side!!"'
50854: '@r......If we liken Maria''s sense of identity to a universe,@k ......then this endless stream of words coming from her might be like the Big Bang.'
50855: '@rShe spent so long tormented over how to interpret her lack of a father.@k ......Then, by chance, she saw a line in the Bible that seemed to affirm her existence, and she finally formed an understanding of herself.'
50856: '@rThe sad girl, who had hated herself for being different from all of her classmates, finally found her own meaning.'
50857: '@rAt that moment, Maria''s universe, which had once been nothingness, was born as a clump of ultra-hot, ultra-high-pressured energy.'
50858: '@r.........Then, later on, she went to Rokkenjima, met the Endless Witch who called herself BEATRICE,@k ......and the clump of energy exploded in a Big Bang, giving birth to their joint system of magic.'
50859: '@r......That was the universe known as Mariage Sorciere.'
50860: 'Will@r@v54/75400573."...........................@k@v54/75400574. ......We''re jumping ahead a bit too fast.@k@v54/75400575. Let''s take things one at a time."'
50861: 'Maria@r@v13/70400087."Sure.@k@v13/70400088. Where do you want to start?"'
50862: 'Will@r@v54/75400576."After you decided that you were the child of the Holy Ghost, it''s easy to imagine that you gradually became more and more interested in the occult.@k@|@y@v54/75400577. .........And then what?@k@v54/75400578. Once you reached that state, where did you meet BEATRICE, and how did the two of you interact?"'
50863: 'Maria@r@v13/70400089."It really did happen all of a sudden, one day.@k@v13/70400090. .........I had wanted to meet the witch called BEATRICE, who lived on Rokkenjima.@k@v13/70400091. As a fellow witch."'
50864: 'Will@r@v54/75400579."At that time, you already thought that you were a witch?"'
50865: 'Maria@r@v13/70400092."I did.@k@v13/70400093. I already knew more about the Bible and the occult than most adults.@k@v13/70400094. So, even though I couldn''t use magic, I believed that I was a witch.@k@|@y@v13/70400095. ......Kihihi, it''s a bit funny, isn''t it?@k@v13/70400096. That''s why I''m only a witch apprentice."'
50866: 'Will@r@v54/75400580."When did you meet BEATRICE?"'
50867: 'Maria@r@v13/70400097."I don''t really remember when.@k@|@y@v13/70400098. But I do remember what it was like.@k@v13/70400099. It was really, really sudden."'
50868: 'Maria@r@v13/70400100."............Huh?"'
50869: 'BEATRICE@r@v27/70700231."So, you are.........Ushiromiya Maria, I presume?"'
50870: '@rIt was such a very, very...@k...abrupt encounter.'
50871: '@rI had just been drinking some milk tea, all alone in the rose garden arbor.@k Mama said that she had to talk about something important with Uncle Krauss,@k ......so she told me to go outside and play.'
50872: '@rSuddenly, ......she was sitting right there.@k@rI didn''t know anyone who spoke that way.'
50873: '@rI quickly realized that she was someone I didn''t know at all......'
50874: 'Maria@r@v13/70400101."......Who...are you?"'
50875: 'BEATRICE@r@v27/70700232."You were the one who first said that you wished to see me.@k@v27/70700233. Here I am, welcoming the witch who came to visit my island, and yet you ask my name?@k@v27/70700234. *cackle*cackle*."'
50876: 'Maria@r@v13/70400102."..................@v13/70400103. BEAT...@v13/70400104....RICE...@v13/70400105....?"'
50877: 'BEATRICE@r@v27/70700235."Precisely.@k@v27/70700236. I am BEATRICE."'
50878: 'Will@r@v54/75400581."Yeah, that is pretty sudden."'
50879: 'Maria@r@v13/70400106."Yep. Really, really sudden.@k@v13/70400107. .........Witches and spirits always exist right beside us.@k@v13/70400108. They just choose not to show themselves.@k@v13/70400109. And, when they do show themselves, ......it''s always sudden, as though they''ve been there the whole time.@k@v13/70400110. ......That''s what I learned that day."'
50880: 'Will@r@v54/75400582."And then, you and BEATRICE became friends?"'
50881: 'Maria@r@v13/70400111."Yeah.@k@v13/70400112. She stayed and chatted with me the whole time, until Mama was done with her business.@k@v13/70400113. We talked about magic...and witches.@k@v13/70400114. And about how I was a child of the Holy Ghost."'
50882: 'Will@r@v54/75400583."......And what was your impression of BEATRICE then?"'
50883: 'Maria@r@v13/70400115."I don''t like saying it,@k@v13/70400116. but I knew more than she did back then.@k@v13/70400117. At first, I thought she wasn''t a very good witch."'
50884: 'Maria@r@v13/70400118."......Well, that was just my conceit.@k@v13/70400119. There are many different systems of magic.@k@v13/70400120. Also, mine was based on self-study.@k@v13/70400121. I probably only viewed Beato that way because her system of magic was different from mine.@k@v13/70400122. It wasn''t long before I came to regret that and apologized."'
50885: 'Will@r@v54/75400584."Apologized?@k @v54/75400585..........Did BEATRICE do something to win your respect?@k@|@y@v54/75400586. .........I see.@k@v54/75400587. So, she showed you magic."'
50886: '@rWe moved to the beach and talked lots, sitting at a table under an umbrella.'
50887: 'BEATRICE@r@v27/70700237."Very interesting.@k@v27/70700238. ......Maria.@k@v27/70700239. I see you have been quite diligent in your studies.@k@v27/70700240. At your age, to be capable of teaching a thousand year old witch such as myself is truly an accomplishment worthy of admiration.@k@|@y@v27/70700241. .........And what sort of magic can you use?"'
50888: 'Maria@r@v13/70400123."......Magic?"'
50889: 'BEATRICE@r@v27/70700242."If you call yourself a witch, you must be able to show me some sort of magic, correct?"'
50890: '@rI was stunned for a second.@k@rOf course, it should have been obvious.'
50891: '@rI was a child of the Holy Ghost, and since I''d studied so much of the occult, I was also a witch, not a Human.@k Until that day, I had been so sure of both of those things.'
50892: '@rSo, when I was asked what sort of magic I could use, it left me in a daze...'
50893: 'BEATRICE@r@v27/70700243."When one knows of magic and can speak of it, they finally reach the rank of apprentice.@k@v27/70700244. ......One is only a witch if they can put such knowledge into practice and use magic, correct?"'
50894: 'Maria@r@v13/70400124."......So, .........I''m not a witch yet......?"'
50895: 'BEATRICE@r@v27/70700245."You have studied well.@k@v27/70700246. And I can sense a very rare talent within you.@k@v27/70700247. One day, you may become a witch so great that even I could not compare,@k@v27/70700248. ......or perhaps even a Creator as you have told me.@k@v27/70700249. However, you are still young and immature.@k@v27/70700250. .........You are...yes.@k@v27/70700251. You are an apprentice.@k@v27/70700252. A witch apprentice, you might call it."'
50896: 'Maria@r@v13/70400125."So, does that mean you can use magic, Beato?"'
50897: 'BEATRICE@r@v27/70700253."Of course.@k@v27/70700254. I could not call myself a witch otherwise."'
50898: 'Maria@r@v13/70400126."Incredible......@k@v13/70400127. ......Show me!@k @v13/70400128.I wanna see your magic!!"'
50899: '@rUntil this day, Maria had never doubted the magic-related concept that she was the child of the Holy Ghost.'
50900: '@r......However, no one had ever proven to her that occult phenomena actually existed.'
50901: '@rMaria could create a universe all by herself.@k ......However, she wanted to share it with a second person, so that she could believe in it even more strongly.'
50902: 'BEATRICE@r@v27/70700255."In the past, I could have drawn a rainbow in the sky,@k@v27/70700256. transformed it into seven colors of candy, and eaten them at my leisure.@k@v27/70700257. However, my power has weakened so much that I cannot even preserve my form as well as I would like."'
50903: 'Maria@r@v13/70400129."I just heard about that.@k@v13/70400130. You can''t use your full power because of the shrine."'
50904: 'BEATRICE@r@v27/70700258."It will take quite some time before my power returns.@k@v27/70700259. At this moment, I cannot turn rainbows to candy.@k@|@y@v27/70700260. ......However, perhaps I can show you a bit of that power with some simpler magic."'
50905: 'Maria@r@v13/70400131."I wanna see...!@k @v13/70400132.I wanna see your magic...!!"'
50906: 'BEATRICE@r@v27/70700261."Very well.@k@v27/70700262. However, I must ask you for your assistance.@k@v27/70700263. As I have already told you,@k@v27/70700264. no matter how pure your soul might be, all Humans are tainted and filled with the toxin that resists magic."'
50907: 'Maria@r@v13/70400133."Yeah, I remember.@k@v13/70400134. You told me about the anti-magic toxin.@k@v13/70400135. It wasn''t in any of the books I''ve read.@k@v13/70400136. You must really be incredible to know so much."'
50908: '@rBEATRICE lifted up an empty teacup,@k then turned it around in front of Maria to show that there weren''t any tricks or strings.'
50909: 'Will@r@v54/75400588."Right, the magic to make candy appear inside an overturned cup."'
50910: 'Maria@r@v13/70400137."How did you know?!@k @v13/70400138.You''re incredible, Will! You even know about witch magic!"'
50911: 'Will@r@v54/75400589."............That''s because......it''s one of the most basic types of magic a witch can use."'
50912: 'Maria@r@v13/70400139."It was just a normal cup, without any tricks in it.@k@v13/70400140. I wanted to see. I wanted to see true magic."'
50913: '@rMaria had a desire.'
50914: '@rShe had a desire to discover the occult in others......to help her believe that there was an occult side to herself.'
50915: '@rThat was why she agreed to help BEATRICE with her magic.'
50916: '@rShe didn''t want her own toxin to ruin her chance of knowing the miracles of magic.'
50917: 'BEATRICE@r@v27/70700265."Good.@k@v27/70700266. ......Now, try looking inside that cup."'
50918: 'Maria@r@v13/70400141."............Ah.@k@v13/70400142. ......There''s candy.@k@v13/70400143. ......There''s candy...!!"'
50919: 'BEATRICE@r@v27/70700267."As a gift to mark my meeting with a new witch, and as a sign of our friendship, I offer this to you."'
50920: '@rThis...was a true miracle of magic.@k@rFor the first time, I felt shame and embarrassment at my conceit.'
50921: '@rI could feel that sense of omnipotence disappear,@k the idea that I was the child of the Holy Ghost and the most important and special person in the world.'
50922: '@r......Instead of a child of the Holy Ghost who can''t do anything,@k I''d rather be a witch who can use magic...!'
50923: '@rI, Ushiromiya Maria, wanted to become a witch...!!@k@rStarting off as a witch apprentice!!'
50924: '@rAlready, I was obsessed with Beato.'
50925: 'Maria@r@v13/70400144."I want to become a real witch too!@k @v13/70400145.I want to be your disciple!!"'
50926: 'BEATRICE@r@v27/70700268."How modest.@k@v27/70700269. You already have an abundance of talent and diligence.@k@v27/70700270. Also, though it may have been different when I was at my full power, I cannot take on a disciple in my current state."'
50927: 'Maria@r@v13/70400146."......So I can''t become a witch''s disciple......?"'
50928: 'BEATRICE@r@v27/70700271."Mm.@k@v27/70700272. You cannot become my disciple.@k@|@y@v27/70700273. ......However, you can become my friend."'
50929: 'Maria@r@v13/70400147."Really...?!"'
50930: 'BEATRICE@r@v27/70700274."Yes.@k@v27/70700275. From this point forth, we shall be friends.@k@v27/70700276. Let us continue to talk of the deep and profound world of witches."'
50931: 'Maria@r@v13/70400148."Uu!!!@k @v13/70400149.Thank you, Beato!!@k @v13/70400150.Can I eat this candy?!"'
50932: 'BEATRICE@r@v27/70700277."No, let that be a souvenir.@k@v27/70700278. Instead of eating it, keep it in that lovely bag of yours."'
50933: 'Maria@r@v13/70400151."Right.@k@v13/70400152. I''ll eat it at home...!!@k @v13/70400153.Uu, uu-uu-uu-uu!!"'
50934: 'BEATRICE@r@v27/70700279."Maria.@k@v27/70700280. That candy was brought into being by magic.@k@v27/70700281. Therefore, it is fragile.@k@v27/70700282. If you deny my existence with that toxin of yours, it will melt and fade away."'
50935: 'Maria@r@v13/70400154."Uu......@k@v13/70400155. No.@k@v13/70400156. I don''t want your precious magic to disappear."'
50936: 'BEATRICE@r@v27/70700283."Then be sure that you do not forget your meeting with me.@k@|@y@v27/70700284. ......And if you will keep some simple promises to me,@k@v27/70700285. I will greet you the next time you come to this island."'
50937: 'Maria@r@v13/70400157."Uu! I''ll keep them.@k@v13/70400158. What are the promises?!"'
50938: 'BEATRICE@r@v27/70700286."Well, to start...@k@v27/70700287. Each time you arrive home, wash your hands.@k@v27/70700288. Then, rinse out your mouth.@k@v27/70700289. You must not complain about this, for it is an important part of a witch apprentice''s training."'
50939: 'Maria@r@v13/70400159."I''ll do it!@k @v13/70400160.Every day, when I come home, I''ll wash my hands!@k @v13/70400161.I''ll rinse out my mouth!@k @v13/70400162.If I do that, will I see you again?!"'
50940: 'BEATRICE@r@v27/70700290."I promise it.@k@v27/70700291. If you keep your end of the promise,@k@v27/70700292. your body will be cleansed, and I will regain even more of my magical power.@k@v27/70700293. ......Then, the next time you come, I will show you magic of even greater splendor."'
50941: 'Maria@r@v13/70400163."Uu!@k@v13/70400164. I''ll keep my promise! No matter what!!@k @v13/70400165.I''ll do it!@k @v13/70400166.I''ll become your friend and a witch apprentice!"'
50942: 'BEATRICE@r@v27/70700294."Your resolve is heartening, Ushiromiya Maria.@k@v27/70700295. I hope that you will quickly grow to become a full witch and my close friend."'
50943: 'Maria@r@v13/70400167."I think that was the first time I met BEATRICE."'
50944: 'Will@r@v54/75400590."And was that candy still there when you got home...?"'
50945: 'Maria@r@v13/70400168."Yep.@k@v13/70400169. ......But I doubted a little, so it was half-melted.@k@v13/70400170. I regretted almost doubting her."'
50946: 'Maria@r@v13/70400171."If I had doubted her more, I''m sure the candy would have been completely gone.@k@v13/70400172. I almost lost the proof of the magical miracle that had happened before my eyes."'
50947: 'Will@r@v54/75400591."A hard piece of candy melted?"'
50948: 'Maria@r@v13/70400173."It wasn''t hard, it was......caramel, I think.@k@v13/70400174. It was half-melted and squishy."'
50949: 'Will@r@v54/75400592."About what time of the year did this happen?"'
50950: 'Maria@r@v13/70400175."I''m not too sure.@k@v13/70400176. But I remember that the milk tea had ice in it.@k@v13/70400177. ......Why does that matter?"'
50951: 'Will@r@v54/75400593."Never mind.@k@v54/75400594. ......Did you tell Rosa about your meeting with BEATRICE?"'
50952: 'Maria@r@v13/70400178."Yep.@k@v13/70400179. I told everyone about it at dinner that day.@k@|@y@v13/70400180. Uncle Krauss laughed at me.@k@|@y@v13/70400181. Then, Mama, who was sitting next to me, got mad and told me to stop talking about it.@k@v13/70400182. ...Uu."'
50953: 'Will@r@v54/75400595."Next to you...?@k @v54/75400596.By your family''s ranking system, your seat shouldn''t be next to Rosa''s."'
50954: 'Maria@r@v13/70400183."It wasn''t a family conference.@k@v13/70400184. It was when just Mama and I came to visit.@k@v13/70400185. So, there was only Uncle Krauss''s family, Mama, and me.@k@v13/70400186. And we didn''t leave gaps, so we weren''t sitting in the same spots as a family conference."'
50955: 'Will@r@v54/75400597."...........................@k@v54/75400598. .........And Rosa was sitting in the seat next to you?"'
50956: 'Maria@r@v13/70400187."Yeah.@k@v13/70400188. ......Why does that matter?"'
50957: 'Will@r@v54/75400599.".........It doesn''t.@k@v54/75400600. ......Have you ever met with BEATRICE outside Rokkenjima?"'
50958: 'Maria@r@v13/70400189."No.@k@v13/70400190. After all, Beato''s body is fragile, so she can''t go wherever she wants.@k@|@y@v13/70400191. I told her she could just possess me if she wanted,@k@v13/70400192. but she said that she couldn''t leave the island."'
50959: 'Will@r@v54/75400601."And after that, you met her every time you came to Rokkenjima."'
50960: 'Maria@r@v13/70400193."Yeah.@k@v13/70400194. We became really good friends.@k@v13/70400195. The more I talked to Beato, the more I realized what an amazing witch she was.@k@v13/70400196. She showed me wonderful magic every time I saw her.@k@v13/70400197. Then, she told me about a system of magic that was different from mine, and we both talked together about the mysteries of magic."'
50961: 'Maria@r@v13/70400198."I wanted to reach her level as soon as I could.@k@v13/70400199. I wanted to become the kind of witch Beato was."'
50962: 'Will@r@v54/75400602."Did you ever introduce BEATRICE to your mother?"'
50963: 'Maria@r@v13/70400200."Nope.@k@v13/70400201. She said Mama''s toxin was too strong, so they couldn''t meet each other yet.@k@v13/70400202. ......Almost all adults are no good when it comes to the toxin.@k@v13/70400203. They''re all tainted.@k@v13/70400204. Kihihihihi."'
50964: 'Will@r@v54/75400603."Was anyone other than you able to see BEATRICE?"'
50965: 'Maria@r@v13/70400205."They couldn''t at first.@k@v13/70400206. She said her magical power was weak, so her body would crumble if even a little bit of the toxin reached her.@k@|@y@v13/70400207. ......But she gathered magical power bit by bit, and eventually, she could appear in front of other people who had small amounts of toxin."'
50966: 'Will@r@v54/75400604."And who was that?"'
50967: 'Maria@r@v13/70400208."Hmmmmmmm......@k@v13/70400209. ......There weren''t many of them.@k@v13/70400210. Just a few of the servants."'
50968: 'Will@r@v54/75400605."Specifically?"'
50969: 'Maria@r@v13/70400211."All of the servants here today.@k@|@y@v13/70400212. ......Uu?@k @v13/70400213.But not Gohda-san, I think."'
50970: 'Will@r@v54/75400606."So, there were four of them: Genji, Shannon, Kanon, and Kumasawa."'
50971: 'Maria@r@v13/70400214."And Doctor Nanjo too."'
50972: '@rApparently, they would sometimes come to visit Maria and BEATRICE''s witch tea parties.'
50973: '@rOf course, it was only for small things, like bringing them extra tea.'
50974: '@rHowever, they were certainly aware of BEATRICE, and even talked with her.'
50975: 'Will@r@v54/75400607."......How did the servants react to BEATRICE?@k@v54/75400608. She was a guest who shouldn''t have existed.@k@v54/75400609. Weren''t they surprised?"'
50976: 'Maria@r@v13/70400215."No...@k @v13/70400216.After all, BEATRICE is the other master of the mansion."'
50977: '@rShe said that the servants treated BEATRICE as an honored guest.'
50978: '@rAnd, sometimes, they were permitted to witness the new miracle of magic along with Maria.'
50979: 'Will@r@v54/75400610."So, on the Rokkenjima of 1986, the ones who could actually meet with BEATRICE were...@k@v54/75400611.you, Nanjo, and the four servants excluding Gohda, for a total of six?"'
50980: 'Maria@r@v13/70400217."Yeah.@k@v13/70400218. Beato said that she''d need to store up much more magical power before she could appear in front of anyone else."'
50981: 'Will@r@v54/75400612."So, she intended to show herself in front of more people sometime in the future?"'
50982: 'Maria@r@v13/70400219."Yep.@k@v13/70400220. She said that the day she made all of the Humans acknowledge her would be the day of her resurrection."'
50983: 'Will@r@v54/75400613."...................................."'
50984: '@rMaria, the servants, and Nanjo had acknowledged her.'
50985: '@rShe had probably chosen those Humans whose anti-magic toxin was weakest and appeared before them first.'
50986: '@rBEATRICE''s game must have been to steadily increase the number of Humans who could recognize her,@k until she could make everyone on the island acknowledge her.'
50987: '@rIn that case, the last person for BEATRICE to appear in front of...@kwould be Battler, the one said to have the strongest anti-magical power.'
50988: '@r......Does this mean BEATRICE thought that Battler would be the hardest one to convince......?'
50989: '@rIt seems true that Battler was one of BEATRICE''s goals.'
50990: '@r......However, if we go with Battler''s chessboard thinking...'
50991: '@r...we might say that BEATRICE, who wanted others to acknowledge her existence, was someone who could not exist unless she was acknowledged.'
50992: '@rBattler reached this thought himself back in the first game.'
50993: '@rYes, there is something different about the BEATRICE of 1986.'
50994: '@rShe''s different from the Italian Beatrice or the Kuwadorian Beatrice, both of whom certainly did exist.'
50995: '@rThe BEATRICE of 1986, the one whom we are so familiar with in a mysterious way, yet who has no existence.'
50996: '@rWhat does it mean to "kill" the BEATRICE who has no existence?'
50997: '@r......The minimum number of people required to create a universe is two.'
50998: '@rHowever, Maria had said that even a single person could give birth to a universe.'
50999: '@rAnd yet, Maria had desired a second person.@k A second person to nurture the world she had given birth to alone.'
51000: '@rBecause if it was born and not nurtured, it would die and disappear?'
51001: '@r.........Let''s replace the word "universe" with "BEATRICE".'
51002: '@rThe minimum number of people required to create BEATRICE is two.'
51003: '@rHowever, even a single person could give birth to her.'
51004: '@rAnd yet, that single person desired a second person.@k A second person to acknowledge the BEATRICE created by the first person.'
51005: '@rThat meeting with a second person is the scene that Maria has just described.'
51006: '@rThe single person who created BEATRICE had looked for a second person to acknowledge BEATRICE...@kand selected Maria.'
51007: '@rWe don''t need Furudo Erika''s heartless reasoning to know that the tea cup magic was a sleight of hand.'
51008: '@rMaria, believing in the story about the anti-magic toxin, would close her eyes whenever magic happened.'
51009: '@rAny sleight of hand would be possible while she had her eyes closed.'
51010: '@r......The caramel Maria had been given as proof of her meeting with a witch had melted a little because Maria had doubted.'
51011: '@rIn a season where one was likely to put ice in their tea, it was only natural for a caramel left in a bag to melt.'
51012: '@rUshiromiya Maria, the girl who''s too trusting and will accept a story easily.'
51013: '@rBEATRICE appeared first in front of this girl, who had, in the language of witches,@k very little of the anti-magic toxin......'
51014: '@rIf we liken the creation of BEATRICE to the laying of an egg,@k then when a single person creates her, it is no more than a delusion.@k Like a chick inside the egg.'
51015: '@rIf, and only if, a second person acknowledges her, the shell cracks, and she appears.@k@rShe only appears when a second person comes to warm the egg.'
51016: '@rWhen Maria acknowledged BEATRICE, she finally hatched, and the chick was born.'
51017: '@rIn that case, Mariage Sorciere, which nurtured BEATRICE and her system of magic, was like a nest.'
51018: '@rBEATRICE had a dignified presence, called herself the witch of Rokkenjima, and claimed to have lived a thousand years.'
51019: '@r......Thinking about the BEATRICEs who appeared in the previous game, this sounds less like the chick Beato, and more like Beato the Elder.'
51020: '@rSo, does this mean that the meeting Maria has just spoken of marks the birth of Beato the Elder...?'
51021: '@rThe egg itself had already been created by "the first person".'
51022: '@rDuring the time before the meeting with Maria, it matured fully inside its shell, becoming the "character" with the dignified presence of a thousand years.'
51023: '@rThen, when Maria acknowledged it, it hatched,@w583. .........and the witch of Rokkenjima finally gained a form.'
51024: '@rPerhaps, ......that moment marks the birth of the BEATRICE of 1986.'
51025: '@r......The younger, chick Beato was born out of love for Battler.'
51026: '@rSince that birth has not yet occurred at this point in time,@k then the birth of Beato the Elder and the existence of BEATRICE at this time must have nothing to do with Battler.'
51027: '@r..............................'
51028: '@rAre you enjoying this reasoning,@k BERNKASTEL......?'
51029: '@rIf you are, let''s at least have some applause from the audience.'
51030: '@r............Great, thanks a bunch.'
51031: 'Maria@r@v13/70400221."I have a lot of things I want to ask Beato to grant for me with magic.@k@v13/70400222. So, I''m helping Beato with her resurrection."'
51032: 'Will@r@v54/75400614."......What kinds of things?"'
51033: 'Maria@r@v13/70400223."Lots and lots.@k@v13/70400224. Kihihihihihi. Not telling."'
51034: 'Will@r@v54/75400615."You want to protect your mama from the black witch, right?"'
51035: 'Maria@r@v13/70400225."How do you know so much?@k @|@y@v13/70400226.You''re incredible. Uu!"'
51036: 'Will@r@v54/75400616."......And your happy world will never return without a witch''s help...@k@v54/75400617. That''s what you...think now?"'
51037: 'Maria@r@v13/70400227."Yep.@k@v13/70400228. I love Mama.@k@v13/70400229. She''s so nice.@k@v13/70400230. I want to be with her forever.@k@v13/70400231. For all eternity."'
51038: 'Will@r@v54/75400618."...........................@k@v54/75400619. ......Now I''d like to hear about Mariage Sorciere."'
51039: 'Maria@r@v13/70400232."................................."'
51040: 'Will@r@v54/75400620."...............@k@v54/75400621. ......What''s wrong?"'
51041: 'Maria@r@v13/70400233."Don''t wanna."'
51042: 'Will@r@v54/75400622."............Huh?"'
51043: 'Maria@r@v13/70400234."I''m thirsty, so I''m gonna go get something to drink.@k@v13/70400235. See you later."'
51044: '@rMaria suddenly started acting distant, bowed her head, and left without waiting for a reply.'
51045: '@r......It was a very un-Maria-like thing to do.'
51046: 'Will@r@v54/75400623."................................."'
51047: '@rI see.@k So, the Game Master has moved the piece.'
51048: '@r......Apparently, she''s telling me to ask about something different for now.'
51049: '@rAt some point, Lion had started chatting with the other family members.'
51050: '@rJessica seemed to be getting irritated at having her butt pinched so much, and George was trying to calm her down.'
51051: '@r......Jessica and George.@k Guess I''ll hear their stories next.'
51052: '@rCompared to Maria, the anti-magic toxin is very strong in these two.'
51053: '@rAt least at the beginning of the other games, they didn''t acknowledge BEATRICE.'
51054: '@rMaria showed me the point of view of one who believes.@k@rNow to hear from those who don''t.'