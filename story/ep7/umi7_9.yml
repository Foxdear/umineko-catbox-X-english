51805: '@r@v55/75500002.".........Let it be heard.@k@v55/75500003. I am one yet many.@k@v55/75500004. What I speak is our tale.@k@v55/75500005. However, this is a small world, sealed by glass and cork, with no one to hear.@k@v55/75500006. None shall lay eyes upon it, and my entire tale shall be sealed away,@k@v55/75500007. set adrift in the sea of my heart until it disappears along with the seaweed......"'
51806: 'Furfur@r@v52/75200001."Ah, where is this place?!@k @v52/75200002.And who am I?!"'
51807: 'Zepar@r@v51/75100001."Then let me ask!@k@v51/75100002. Where would you like it to be? Who do you want to be?!"'
51808: 'Furfur@r@v52/75200003."Any place, so long as it will blanket me gently!@k @v52/75200004.Anyone, so long as I am treated kindly!"'
51809: 'Zepar@r@v51/75100003."Yes, for us—"'
51810: 'Furfur@r@v52/75200005."For us—"'
51811: '@r@v00/awase7003_o.""Where and who we are hardly matters!!""'
51812: 'Clair@r@v55/75500008."Indeed,@k@v55/75500009. to us, that is a very insignificant thing.@k@v55/75500010. At least, until that day comes to pass.@k@v55/75500011. Why must we be cast into a new fate?@k @v55/75500012.The pronouncement of Fate arrives sudden and abrupt."'
51813: 'Zepar@r@v51/75100005."It is not the fate I wished for."'
51814: 'Furfur@r@v52/75200007."But it did make the heart pound...!"'
51815: 'Zepar@r@v51/75100006."Where will the new fate take us?!"'
51816: 'Furfur@r@v52/75200008."It doesn''t matter where!"'
51817: '@r@v00/awase7004_o.""So long as that place is kind to us...!!""'
51818: 'Clair@r@v55/75500013."The tidings brought to the temporary dwelling where unfortunate children without mother or father gather—@k@v55/75500014.do they herald God''s salvation, or does the Devil beckon us to be the playthings of a new fate?@k@v55/75500015. We have no means of knowing."'
51819: 'Clair@r@v55/75500016."And yet, we want to believe.@k@v55/75500017. We want to believe that it is gospel, good tidings, salvation offered us by God."'
51820: 'Furfur@r@v52/75200010."But why would I be chosen?@k @v52/75200011.I have no religious beliefs!"'
51821: 'Zepar@r@v51/75100008."Then this is not gospel; the Devil beckons!"'
51822: 'Clair@r@v55/75500018."And yet we have not the means to resist fate.@k@v55/75500019. Oh, I am one yet many.@k@v55/75500020. I pray that the new fate brings us blessings.@k@v55/75500021. The time is April of 1976.@k@v55/75500022. A month too cold to speak of spring.@k@v55/75500023. There is no change in the strange new land, which ever plagues us with its stale air and ceaseless breezes......"'
51823: 'Natsuhi@r@v03/70900015."Those are all of the family rules.@k@v03/70900016. They may be strict, but I believe that the discipline you learn in this house will serve you well in the future."'
51824: '@r@v00/awase7005_o."""Yes, Madam."""'
51825: '@rThe servants who would start working this April all called out in unison.'
51826: '@rThe rules of the Ushiromiya family are no more or less strict than those at the Gospel House.'
51827: '@rHowever, here, we get paid a lot of money.@k@rThey also give us a lot of help in finding our next job.'
51828: '@rWe work for the Ushiromiya family, store up money, use their influence to get a job at a good company, and start on a new, happy life.'
51829: '@r......That was the dream, and it was a very realistic one, held by all of us at the Gospel House.'
51830: '@rHowever, not everyone can become an Ushiromiya family servant.@k@rOnly kids with a record of exemplary conduct and good grades are recommended.'
51831: '@rSo, all of the kids who want to be sure of leaving the Gospel House to live a happy life are feverishly devoted to their studies......'
51832: 'Natsuhi@r@v03/70900017."That''s enough for today.@k@v03/70900018. Tomorrow, you start early.@k@v03/70900019. Make sure the lights are all out at the appropriate time.@k@v03/70900020. That is all."'
51833: '@r@v00/awase7006."""Yes, Madam.@k@v00/awase7007. Thank you very much."""'
51834: '@rAfter bowing until Natsuhi was no longer in sight,@k the new servants all followed the lead of one of the more experienced servants and raised their heads.'
51835: '@r@v38/72300004."Okay, we''re done for the day.@k@v38/72300005. Starting tomorrow, you''ll be following your shift schedule.@k@v38/72300006. Madam is very strict about time.@k@v38/72300007. If any of you sleep in, it''ll be my responsibility.@k@v38/72300008. So if you do, I''ll kick you awake.@k@v38/72300009. Got it?!"'
51836: '@rOf course, this experienced servant was one of the older girls from the Gospel House.@k@rShe''s been here for two years, apparently.'
51837: '@rThat''s probably why all the other new servants, who are older than me, seem to know her well.'
51838: '@rThey all chatted noisily, saying things like "Madam looks so strict" and "Dang, I''m tired."'
51839: '@r@v38/72300010."......By the way, just who is this?@k @v38/72300011.Who chose this kid to be a servant?"'
51840: '@rThe older servant pointed at me and asked the room at large, a dubious look on her face.'
51841: '@rIt''s no surprise, really.@k Most of us become servants when we graduate middle school or high school.'
51842: '@rBut I''m just starting elementary school.'
51843: '@rThe others will be working as servants every day, according to their shifts.'
51844: '@rHowever, I was going to go to the elementary school on Niijima with Milady,@k only working on the weekends and when I had free time.'
51845: '@rIt was an exception among exceptions, something that had never happened before.'
51846: '@r......It was clear at a glance that the others, who had obtained their positions after a rigorous selection process,@k didn''t like the fact that I was here too.'
51847: '@r@v38/72300012."......Both Madam and Genji-sama have told me that you are to put your studies first.@k@v38/72300013. But you''re still getting paid.@k@v38/72300014. Doesn''t make any sense."'
51848: '@rIf you''re going to talk behind someone''s back, at least do it behind them.@k ......She didn''t even try to hide her discontent.'
51849: '@r@v38/72300015."Is this kid really that smart?@k @v38/72300016.A child prodigy, or something?"'
51850: '@r@v39/72400004."Beats the heck out of me."'
51851: '@r@v40/72500004."I didn''t know this kid at all back in the House. They kept this one separate, apparently, something to do with a weak constitution."'
51852: '@r@v38/72300017."......Now that you''re here, you''re part of the collective responsibility system.@k@v38/72300018. If you screw up, it''s the same as everyone from the Gospel House screwing up.@k@v38/72300019. Make sure you don''t, okay?"'
51853: '@rI nodded weakly.@k ......I''d never been threatened by someone this much older than me, and I was very frightened.'
51854: 'Shannon@r@v15/70500092."Don''t worry.@k@v15/70500093. I''ll help you through.@k@v15/70500094. Let''s give it our all together,@k@v15/70500095. okay?"'
51855: '@rShannon smiled at me as she spoke...'
51856: 'Zepar@r@v51/75100009."Don''t you find it scary, Shannon?@k @v51/75100010.This house looks pretty strict...!"'
51857: 'Furfur@r@v52/75200012."No, there''s nothing scary about it.@k@v52/75200013. It''s only scary to you because that''s what you think."'
51858: 'Zepar@r@v51/75100011."Then if I think it''s fun, will it be fun?!"'
51859: 'Furfur@r@v52/75200014."Yes, it will.@k@v52/75200015. So just like before, let''s put on a smile and give it our all."'
51860: 'Clair@r@v55/75500026."......Shannon was my only friend in the Gospel House.@k@v55/75500027. She was confident and popular.@k@v55/75500028. The complete opposite of me.@k@v55/75500029. I was embarrassingly dull-witted, and no one wanted to be my friend."'
51861: 'Clair@r@v55/75500032."I would never have made it through those days in the Gospel House had it not been for her encouragement.@k@v55/75500033. ......So, I would probably make it through here too, with her by my side."'
51862: 'Zepar@r@v51/75100012."Well, isn''t it about time we got ready for bed?@k @v51/75100013.I''ve got work early tomorrow morning, but you have a different job."'
51863: 'Furfur@r@v52/75200016."That''s right. Unlike everyone else, I have to go to school.@k@v52/75200017. When I spend the night on Rokkenjima, I have to get ready for school and wait for Milady at the dock."'
51864: 'Zepar@r@v51/75100014."Milady looks like an energetic person.@k@v51/75100015. I hope you get along well!"'
51865: 'Furfur@r@v52/75200018."D-do you think I will...?@k@v52/75200019. I''m scared of school, nervous...!"'
51866: 'Clair@r@v55/75500034."......I had grown used to life in the Gospel House, so the more relaxed rules at school made life easy.@k@v55/75500035. But until I grew used to it, everything was new, and everything made me nervous."'
51867: '@rMy new life on Rokkenjima probably deserves an explanation.'
51868: '@rIt was completely different from the comfortable yet stagnant life I''d lived at the Gospel House.'
51869: '@rIn addition to the time I spent as a servant to the Ushiromiya family on Rokkenjima, I also traveled to the elementary school on Niijima on school days.'
51870: '@rIt was the start of a time that was both rushed and busy, with hardly any time to relax.'
51871: '@rUnlike at the Gospel House, I didn''t get to sleep in the same bed every day here.'
51872: '@rHalf of the week, I slept in the servants'' quarters in the Rokkenjima mansion.'
51873: '@rI would return from school with Milady, go to the mansion, and work there as a servant.@k I would then stay the night and head to school with Milady again the next morning.'
51874: '@rOn days when I didn''t have work, I would return to the dormitory on Niijima, where I could have some time to myself in the room that had been assigned to me.'
51875: '@rThere was an adult dorm mother who strictly controlled mealtimes and lights-out,@k but I was already used to that sort of life from the Gospel House, so it wasn''t hard for me.'
51876: '@rThe rooms were slightly larger than average and housed three people each.'
51877: '@rHowever, either because of the number of people or some lucky chance, I was not given a three-person room.'
51878: 'Shannon@r@v15/70500096."Looks like we''ll share a room back here in the dorms too."'
51879: '@rWith Shannon by my side, I felt like I''d be able to manage well enough...'
51880: 'Natsuhi@r@v03/70900021."Correct.@k@v03/70900022. Every year, new servants came from the Gospel House, replacing some of the old ones."'
51881: 'Krauss@r@v02/70800017."It was something Father organized with them all on his own.@k@v02/70800018. The rest of us weren''t allowed to meddle."'
51882: 'Natsuhi@r@v03/70900023."Our family provided a strict upbringing for these children without relatives and supported them on their path to adulthood.@k@v03/70900024. I always viewed this as the wealthy Ushiromiya family''s obligation to society."'
51883: 'Furfur@r@v52/75200020."What sort of kids came to serve the Ushiromiya family?"'
51884: 'Zepar@r@v51/75100016."I''m sure they were diligent,@k @v51/75100017.lovable kids of irreproachable conduct!"'
51885: 'Natsuhi@r@v03/70900025."It seemed to me that there were a lot of glaring hyenas among them."'
51886: 'Krauss@r@v02/70800019."Let us say they had high ambitions.@k@v02/70800020. Those poor children without relatives.@k@|@y@v02/70800021. They were determined to use this rare opportunity to launch their careers, so that they could take control of their lives."'
51887: 'Furfur@r@v52/75200021."Did all of them have to balance school and servant work?"'
51888: 'Zepar@r@v51/75100018."That must be tough!@k @v51/75100019.You wouldn''t be able to get much work done!"'
51889: 'Natsuhi@r@v03/70900026."There has been no case of a servant going to school while they worked...except for that child."'
51890: 'Krauss@r@v02/70800022."To be honest, I was fairly surprised when that child first came to greet me.@k@v02/70800023. So obviously young.@k@v02/70800024. The others were all around 16 or 18 years old, but that child looked almost ten years younger."'
51891: 'Natsuhi@r@v03/70900027."The young servants who come from the Gospel House visit only to gain experience in working in the real world,@k@v03/70900028. so I do not expect a high level of skill from them as servants."'
51892: 'Krauss@r@v02/70800025."Very true.@k@v02/70800026. You can''t rely on them to the same degree as an adult, seasoned servant."'
51893: 'Natsuhi@r@v03/70900029."But this was a child who hadn''t even started school.@k@v03/70900030. No knowledge of housework, no practical experience, and yet to begin compulsory education.@k@v03/70900031. I don''t know what Father was thinking, but I always thought there was something clearly odd about it."'
51894: 'Krauss@r@v02/70800027."I spoke to Father about it.@k@v02/70800028. I asked if it might be better to wait for our servants to graduate middle school before having them serve here."'
51895: 'Furfur@r@v52/75200022."And what did Kinzo say?"'
51896: 'Zepar@r@v51/75100020."Come on, we all know what he said."'
51897: '@r@v00/awase7008.""Oooooh, BEATRICE~~!!""'
51898: 'Krauss@r@v02/70800029."Hahaha...@k@v02/70800030. By that time, he was already a complete shut-in inside his study, obsessed with the occult.@k@v02/70800031. If you tried to talk to him, he''d yell and tell you to stop interrupting "the journey of his mind"."'
51899: 'Natsuhi@r@v03/70900032."And Father''s decisions are absolute.@k@v03/70900033. ......However, the case with this particular child just didn''t make sense."'
51900: 'Krauss@r@v02/70800032."I even asked the Gospel House about it.@k@v02/70800033. They said to ask Genji-san.@k@v02/70800034. I then asked Genji-san, and he said to ask the Master."'
51901: 'Zepar@r@v51/75100022."And then you asked the Master, and he said "BEATRICE~"!"'
51902: 'Furfur@r@v52/75200024."Ahahahaha!@k @v52/75200025.No one knows the truth!"'
51903: 'Krauss@r@v02/70800035."Jessica was the only child on the island.@k@v02/70800036. The servants would often play with my daughter, but she wanted a friend of her own age.@k@v02/70800037. Someone she could play with at home, as well as at school."'
51904: 'Natsuhi@r@v03/70900034."......I began to think that Father had employed this servant out of pity for Jessica.@k@|@y@v03/70900035. ......But if that were the case, why wouldn''t he talk to us about it beforehand?@k @v03/70900036.We should be the ones to decide which friends are suitable for our daughter."'
51905: 'Furfur@r@v52/75200026."Scaaaryyy! Ahahahahaha!"'
51906: 'Zepar@r@v51/75100023."Natsuhi wouldn''t cope well with taking her kid to the playground!"'
51907: 'Will@r@v54/75400946."We should probably view this as an arrangement planned by Genji."'
51908: 'Lion@r@v53/75300450.".........Yes, probably.@k@v53/75300451. ......Genji-san knew that the "me" in this other world carried Grandfather''s blood,@k@v53/75300452. so he must have made special arrangements for that "me" to be brought to Rokkenjima."'
51909: 'Will@r@v54/75400947."Are you feeling okay now?"'
51910: 'Lion@r@v53/75300453."......It was a really big shock, that''s all.@k@v53/75300454. ......I just feel a bit dizzy now."'
51911: 'Will@r@v54/75400948."In the world we''re in now, you''re the successor.@k@v54/75400949. But if your world had been different, you could have been a servant......or maybe a witch.@k@v54/75400950. ......You do have a troubled fate."'
51912: 'Lion@r@v53/75300455."Seriously......@k@v53/75300456. I don''t regret learning about it, but if I could forget it now, I would."'
51913: 'BERNKASTEL@r@v28/72100153."*giggle*, isn''t it interesting?@k@v28/72100154. Even though you''re a servant, you''re actually an illegitimate child of the head......@k@v28/72100155. Isn''t that romantic, like some fairy tale?"'
51914: 'Lion@r@v53/75300457."......Romantic?@k @v53/75300458.......Considering how Mother must feel, I''m not sure about that."'
51915: 'BERNKASTEL@r@v28/72100156."Eheheh, true.@k@v28/72100157. In Natsuhi''s eyes, the Lion of this world is nothing more than the detestable baby she was ordered to raise.@k@v28/72100158. And this is also a world in which she refused that order."'
51916: 'BERNKASTEL@r@v28/72100159."......Natsuhi''s natural child, Jessica, is hundreds of times more precious to her.@k@v28/72100160. A baby that doesn''t share your blood is nothing more than a dirty, lukewarm sack of filth."'
51917: 'Will@r@v54/75400951."Have some decency.@k@v54/75400952. Next time, I''ll be the one pinching your butt."'
51918: 'Lion@r@v53/75300459."......Thank you, Will.@k@v53/75300460. ......I think I understand, more or less.@k@v53/75300461. This makes it all the more important for me to be grateful to Mother.@k@v53/75300462. She''s raised me fairly all these years."'
51919: 'BERNKASTEL@r@v28/72100161."Though at a probability so low it''d take a miracle to happen.@k@v28/72100162. ......You know, animals are always brutal towards children that don''t carry their blood.@k@v28/72100163. Lions do that too, don''t they? ......*giggle*giggle*.""'
51920: 'Will@r@v54/75400953."Genji''s thinking must have gone something like this.@k@v54/75400954. ......''This is a true member of the Ushiromiya bloodline.@k@v54/75400955. I want this child to live on Rokkenjima if at all possible.''@k@v54/75400956. However, he couldn''t suddenly bring Lion over and tell everyone everything."'
51921: 'Lion@r@v53/75300463."......I agree.@k@v53/75300464. Maybe he intended to have me live on the island until it became normal, and then reveal everything when the chance presented itself."'
51922: 'Will@r@v54/75400957."However, the Lion of this world was not given special treatment.@k@v54/75400958. Notably, the silver ring doesn''t exist."'
51923: 'Lion@r@v53/75300465."I wonder if that means Grandfather never heard about me."'
51924: 'Will@r@v54/75400959."It might mean that Genji never found a good opportunity...@k@v54/75400960.to reveal the truth..."'
51925: 'Clair@r@v55/75500036."Genji must have wanted...@k@v55/75500037.to someday tell Kinzo the truth that the child of his beloved Beatrice was still alive.@k@v55/75500038. However, revealing this truth would not be so easy."'
51926: 'Zepar@r@v51/75100024."I wonder why it isn''t easy?!"'
51927: 'Furfur@r@v52/75200027."You dummy, what would happen if Natsuhi found out?!"'
51928: 'Zepar@r@v51/75100025."Oh, right, if Lion suddenly appeared, Jessica wouldn''t be the successor anymore!"'
51929: '@rStrictly speaking, Jessica wasn''t the successor to the headship, but since she''d be able to select the successor, it all came to the same thing.'
51930: 'Clair@r@v55/75500039."It is a tale that becomes less simple the more one learns of it.@k@v55/75500040. Some would celebrate my birth; others would not.@k@v55/75500041. ......Genji could only wait in silence for the day of revelation to come."'
51931: 'Zepar@r@v51/75100026."Was it a tale hidden only within Genji''s heart?"'
51932: 'Furfur@r@v52/75200028."Lion and Kinzo and Natsuhi and Krauss and Jessica and everyone else!@k @v52/75200029.None of them knew of this tale!"'
51933: 'Clair@r@v55/75500042."Thus, the curtains slowly rise on this curious tale in the year 1976.@k@v55/75500043. Oh, I am one yet many.@k@v55/75500044. Why must fate proceed so selfishly and freely, leaving us behind......?"'
51934: '@rPeople only found the young servant strange for the first month.'
51935: '@rNatsuhi and Krauss''s protests came to naught.'
51936: '@rAfter all, there was no harm in it.'
51937: '@rSo why not indulge Kinzo''s whim...?'
51938: '@rEventually, everyone grew accustomed and began to accept this slightly abnormal everyday life.'
51939: 'Clair@r@v55/75500045."However, it was not so for the other servants of the Gospel House, who were always close by and who believed that everyone should be treated equally.@k@v55/75500046. As time went on, their little grievances about my special treatment began to accumulate......"'
51940: '@r@v39/72400005."Good job, Sawachi.@k@v39/72400006. How''d it go today?"'
51941: '@r@v40/72500005."Madam was in a real shitty mood.@k@v40/72500006. She literally ran her finger across the windowsills!"'
51942: '@r@v39/72400007."Tadacchi got chewed out for cleaning too slow.@k@v39/72400008. Like, what does she want from us?!"'
51943: '@rThe Gospel House treats all the children under its care as family.'
51944: '@rBecause of this, their original names are not spoken there, and everyone uses new "blessed names" instead.'
51945: '@rMaybe because the "@bon.@<音@>" character is in the word "Gospel" (@bfukuin.@<福音@>),@k that character is almost always combined with at least one character from the child''s original name to make their new name.'
51946: '@r......Still, just giving a person a new name doesn''t mean they''ll accept it so easily.'
51947: '@rThe boys and girls of the Gospel House, living without relatives due to all kinds of circumstances,@k often feel as though their real first and last names are a bond that''s worth holding onto.'
51948: '@rSo, many of the Gospel children hate their "@bon.@<音@>" names and call each other by nicknames based on their original names.'
51949: '@rOf course, this is only privately.@k When in the presence of the House Director or other important people, only the blessed names are used.'
51950: '@rOn the job, the blessed names are used.@k And off the job, the informal nicknames are used.'
51951: '@rEveryone is very used to living with two names like this, so they''re all naturals at switching between the two.'
51952: '@r@v39/72400009."Whoo, you stink.@k@v39/72400010. Go take a shower."'
51953: '@r@v40/72500007."Dang, why''s it so cramped in here?@k@v40/72500008. Can''t they get a bigger dorm if they have that huge mansion?"'
51954: '@r@v39/72400011."Hey, Garashi-sa~n.@k@v39/72400012. Why''s Yasu the only one who isn''t in a three-person room?"'
51955: '@rBy "Yasu", they probably mean me.'
51956: '@rI can''t remember my parents at all, ......but I was given the family name "Yasuda".'
51957: '@rAnd, apparently, my nickname comes from that.'
51958: '@r@v38/72300020."How should I know? Genji-sama''s the one who decides the rooms.@k@v38/72300021. I don''t like it either."'
51959: '@r@v39/72400013."Yes, seriously!@k @v39/72400014.Wouldn''t you normally split it two and two?!"'
51960: '@r@v40/72500009."What''s the deal with Yasu anyway?"'
51961: '@r@v38/72300022."It''s like that kid''s job is going to school with Milady or something.@k@v38/72300023. ......A school friend position?@k @v38/72300024.Doesn''t make any sense."'
51962: '@r......Of course, on days when I am given work,@k I return to the mansion right after school and work alongside all the others.'
51963: '@rI help out with caring for the garden and cleaning up the mansion.@k@rI can''t do any jobs on my own, so I''m always just helping out.'
51964: '@r......Maybe because I''m young, the adult servants are always kind to me.'
51965: '@rIt seems my fellow Gospel House servants are annoyed by this.'
51966: '@r@v39/72400015."Don''t you think Kumasawa-san''s being blatantly soft on Yasu?@k @v39/72400016.It''s like she''s mistaken Yasu for her own grandchild or something!"'
51967: '@r@v40/72500010."And why on Earth does that kid get paid the same as the rest of us?@k@v40/72500011. I don''t get it!"'
51968: '@r@v38/72300025.".........I realize that you have school to worry about,@k@v38/72300026. but don''t forget that you''re a servant too, okay?@k @v38/72300027.You need to stop being a helper and learn to do work by yourself like the rest of us.@k@v38/72300028. We aren''t going to let you have things easy forever, okay?"'
51969: '@r..............................'
51970: '@rI have been trying my best.'
51971: '@rHowever, I''m not very strong yet, so I can''t carry heavy things.@k I can''t carry a lot of things at once, either.'
51972: '@rI can''t fold clothes right, and I''m not good at using a dustpan.'
51973: '@rI just can''t do it as well as everyone else......'
51974: '@rAs my face turned red,@k ......I spotted Shannon, who was watching from the sidelines and not joining in.'
51975: '@r......Shannon is my only ally.@k@rUnlike me, she can do everything well.'
51976: '@rHowever, she''ll never pamper me.'
51977: '@rShe''ll show me how things are done, but she''ll never steal my jobs from me.'
51978: '@rShe really is incredible.'
51979: '@rI really want to be like Shannon, as soon as I can.'
51980: '@r......She never talks behind people''s backs, and no one talks behind her back.@k She''s kind, and she gets along with everyone.'
51981: '@rI want to be like her.@k And she''s always kindly watching over my efforts to become like her.'
51982: '@r"......Why......did I end up here?"'
51983: 'Shannon@r@v15/70500097."I don''t know."'
51984: '@rThough I''d just been muttering to the ceiling,@k Shannon gave me an honest answer.'
51985: 'Shannon@r@v15/70500098."I guess there''s no way to say it except that it''s part of God''s plan."'
51986: '@r"Is this another test from God...?"'
51987: 'Shannon@r@v15/70500099."Yep.@k@v15/70500100. Think of it as a test to help you grow into a wonderful person.@k@v15/70500101. After all, you''re a special, chosen person."'
51988: '@r"......Am I...@w500....special?"'
51989: 'Shannon@r@v15/70500102."Of course you are.@k@v15/70500103. After all, everyone else here is big, but you were the only one special enough to be chosen young."'
51990: '@r"Why am I the only one who''s little?@k I can''t do any jobs by myself."'
51991: '@rEveryone complains that I''m just there to play with Milady.'
51992: '@rAnd yet, Madam made it clear that I''m not to think of Milady as a friend and speak to her in a casual manner.'
51993: 'Shannon@r@v15/70500104."You may be ten years younger than everyone else,@k@v15/70500105. but that means, if you keep it up until you''re the same age as the others,@k@v15/70500106. you''ll be much more experienced than the new people who come later.@k@v15/70500107. Even Genji-sama will acknowledge your talents, and you''ll become a leader who can teach the new kids who come from the Gospel House."'
51994: 'Shannon@r@v15/70500108."And then, I''m sure that everyone will respect you.@k@v15/70500109. By that time, even Madam, the Master, and Krauss-sama will acknowledge your skills.@k@v15/70500110. That''s your future."'
51995: '@r"......You mean like the ugly duckling becoming a swan?"'
51996: 'Shannon@r@v15/70500111."That might be it.@k@v15/70500112. After all, it was very unusual for you to be chosen as an Ushiromiya family servant.@k@|@y@v15/70500113. ......In fact, that rumor might be true,@k@v15/70500114. and you might be the secret child of someone in the Ushiromiya family.@k@v15/70500115. *giggle*."'
51997: '@rShannon laughed, saying "wouldn''t that be cool" and "then you''d be super-rich too".'
51998: '@rBut I felt a bit doubtful.'
51999: '@rAfter all, ......if that was the case, why did I have to live all alone in the Gospel House?'
52000: '@rShannon and people like the House Director were the only ones who would play with me.'
52001: '@rI wasn''t allowed to play with any other friends, ......and I spent all my time by myself, in my isolated room.'
52002: '@rMaybe it''s because I''m frail and always half-asleep, .........but it has been lonely.'
52003: 'Furfur@r@v52/75200030."Hey, Genji!@k @v52/75200031.How much of this did you know?"'
52004: 'Zepar@r@v51/75100027."You never talk about anything, but you''ve known everything since the beginning, haven''t you?"'
52005: 'Genji@r"...................................."'
52006: 'Zepar@r@v51/75100028."19 years ago,@k@v51/75100029. you heard from Natsuhi that a servant had fallen from a cliff holding a baby."'
52007: 'Furfur@r@v52/75200032."You went to the bottom of that cliff and realized that the baby was still alive, didn''t you?"'
52008: 'Genji@r@v14/71600024.".........The question of whether it was alive or dead...@k@v14/71600025.was not one that I was qualified to answer."'
52009: 'Zepar@r@v51/75100030."Then who was?"'
52010: 'Furfur@r@v52/75200033."The doctor, of course!"'
52011: '@r@v00/awase7009_o.""What do you say, Doctor Nanjo?!!""'
52012: 'Nanjo@r@v19/71900069."..................@k@|@y@v19/71900070. ......Perhaps it is fitting.@k@v19/71900071. ...Shall I speak?"'
52013: 'Genji@r@v14/71600026."......If you would be willing,@v14/71600027. ......then I ask it of you."'
52014: 'Nanjo@r@v19/71900072."..................@k@v19/71900073. Very well."'
52015: 'Nanjo@r@v19/71900074.......I was contacted by Genji-san immediately after the accident, and I was asked to conduct an examination in secrecy.'
52016: 'Zepar@r@v51/75100032."In secrecy?"'
52017: 'Furfur@r@v52/75200035."Why?"'
52018: 'Nanjo@r@v19/71900075."......Both the Beatrice of Kuwadorian and her child were unregistered people who weren''t supposed to exist.@k@v19/71900076. It would lead to various problems if it went public..."'
52019: 'Genji@r@v14/71600028."I had started the procedures to have the baby registered, but they were not complete at that time.@k@|@y@v14/71600029. ......It was a very bad time for the baby to "die"."'
52020: 'Furfur@r@v52/75200036."So, the servant who fell was treated as the only death?"'
52021: 'Zepar@r@v51/75100033."Natsuhi wouldn''t talk to anyone.@k@v51/75100034. It would''ve been easy to set up!"'
52022: 'Furfur@r@v52/75200037."But that baby was alive, wasn''t it?"'
52023: 'Nanjo@r@v19/71900077."Correct.@k@v19/71900078. ......Of course, the child was gravely injured.@k@v19/71900079. It was a miracle that it survived those injuries.@k@v19/71900080. If some angle had been slightly different,@k@v19/71900081. or if Genji-san had been any slower in bringing the baby to me...@k@v19/71900082. ......That baby only managed to survive thanks to a series of miracles."'
52024: 'Genji@r@v14/71600030.".........I had given up.@k@v14/71600031. I didn''t believe the baby could survive."'
52025: 'Furfur@r@v52/75200038."But it did."'
52026: 'Zepar@r@v51/75100035."How strong and resilient is life!"'
52027: 'Furfur@r@v52/75200039."No, this is fate."'
52028: 'Zepar@r@v51/75100036."Fate!@k @v51/75100037.So the baby was fated to live on and eventually accomplish something great?!"'
52029: 'Genji@r"..................@k@v14/71600033. ......Yes,@k@v14/71600034. I did think that it was fate.@k@v14/71600035. I thought the blood of the Kuwadorian Beatrice-sama, whose life ended on Rokkenjima,@k@v14/71600036. must have imparted something onto this child to make it survive."'
52030: 'Clair@r@v55/75500054."However, Genji did not tell his master, Kinzo, that the child had survived.@k@v55/75500055. He simply said that it had fallen to its death in an unfortunate accident.@k@v55/75500056. Kinzo mourned, but his mourning was more one of madness than of sorrow......"'
52031: 'Zepar@r@v51/75100038."Ooh, BEATRICE, why have you run away from me once more?!"'
52032: 'Furfur@r@v52/75200040."Why, even though I swore I''d never make the same mistake again, why?!!"'
52033: 'Clair@r@v55/75500057."There was one matter for which Genji did not trust the master he so respected.@k@v55/75500058. That matter was whether Kinzo would be capable of accepting Beatrice''s grandchild as family."'
52034: 'Clair@r@v55/75500059."Genji had served the Kuwadorian Beatrice for many years as well.@k@v55/75500060. He was very aware of what she had felt.@k@v55/75500061. He knew that she accepted Kinzo''s affection and respected him as her father."'
52035: 'Clair@r@v55/75500062."However, her love was not the same as Kinzo''s love.@k@v55/75500063. Kinzo thought her to be Beatrice reborn,@k@v55/75500064. and tried to use her to satisfy the many feelings he had felt for the late Beatrice.@k@v55/75500065. Of course, the Kuwadorian Beatrice could not accept those feelings.@k@v55/75500066. In the end, Kinzo himself, the one she respected and thought of as her father...@k@v55/75500067.stole away her chastity......"'
52036: 'Zepar@r@v51/75100039."She thought he was her father, and he thought she was his wife!"'
52037: 'Furfur@r@v52/75200041B."Oh, what unmanageable, forbidden love!"'
52038: 'Genji@r@v14/71600037.".........I do understand Kinzo-sama''s feelings to some degree.@k It is not as though Kinzo-sama saw the late Beatrice-sama in the girl at the time of her birth, nor did he decide at that moment to make her his plaything."'
#s.ins 0x86, ushort(52039), byte(0), byte(1), s.layout(''@rもちろん、金蔵とて最初に彼女を目にした時から亡きベアトリーチェの面影を映し、かつて遂げられなかった想いを強引に果たそうなどと思っていたわけではあるまい.'')
52040: 'Nanjo@r@v19/71900083."He......spoke to me about it a few times when we were drinking.@k@v19/71900084. I always thought he was just joking."'
52041: 'Zepar@r@v51/75100040."As she grew up, was he surprised to find that she looked more and more like her mother?"'
52042: 'Furfur@r@v52/75200042B."As she became older, did he suffer from a forbidden emotion he could not suppress?"'
52043: 'Genji@r@v14/71600040B."......I thought that the tragedy...@v14/71600041B....might repeat itself.@k@v14/71600042. ......That was my view."'
52044: 'Nanjo@r@v19/71900085."................................."'
52045: 'Genji@r@v14/71600043."Beatrice-sama suffered much.@k@v14/71600044. And ultimately, she never truly understood the difference between her feelings and Kinzo-sama''s.@k@v14/71600045. .........I spoke with Beatrice-sama many times, listening to her deepest feelings.@k@v14/71600046. However, I could not bring myself to tell her the truth."'
52046: 'Zepar@r@v51/75100041."That would be hard to say!"'
52047: 'Furfur@r@v52/75200043."Imagine telling her that the one she respects as her father wants to use her as a replacement for her dead mother!"'
52048: 'Nanjo@r@v19/71900086."......Let me say this for the sake of Kinzo-san''s honor.@k@v19/71900087. He also suffered greatly.@k@v19/71900088. It pained him when he found that he could no longer think of his daughter as a daughter.@k@|@y@v19/71900089. ......I told him to love her as a father.@k@v19/71900090. I think Kinzo-san listened to reason and his conscience and fought for some time..."'
52049: 'Clair@r@v55/75500068."Kinzo loved her.@k@v55/75500069. He poured his affection onto the daughter that Beatrice had left behind.@k@v55/75500070. He did so as a father.@k@v55/75500071. And yet, if so, why did he give the daughter the same name as the mother?"'
52050: 'Clair@r@v55/75500072A."Yes, Kinzo''s sin started from the moment she received life.@k@v55/75500073A. Beatrice gave birth to her and died as if in exchange.@k@v55/75500074A. ......He passed the name down from mother to daughter.@k@v55/75500075A. From the moment of her birth, Kinzo had already decided that she was Beatrice reborn..."'
52051: 'Will@r@v54/75400961."Lion, in other words,@k@v54/75400962. is what happens when Kinzo, trying to atone for his sin,@k@v54/75400963. succeeds in bringing the child into the Ushiromiya family officially."'
52052: 'BERNKASTEL@r@v28/72100164."......Exactly.@k@v28/72100165. I get the feeling I''ll get my butt pinched if I talk about other fragments,@k@v28/72100166. ......but maybe there''s one where Lion is accepted...@v28/72100167....and Kinzo commits a tragedy,@v28/72100168. who knows...?@k@v28/72100169. ......Wanna see if we can find it?@k @v28/72100170.*giggle*giggle*........."'
52053: 'Lion@r@v53/75300466."Who would want to see something like that?@k@v53/75300467. .........Is it your job to mix together the worst imaginable possibilities for every part of a person''s life and laugh at their horrible fate?!"'
52054: 'Will@r@v54/75400964."Unfortunately, that''s the sort of demon she is."'
52055: 'BERNKASTEL@r@v28/72100171."Witch, thank you.@k@v28/72100172. *giggle*......"'
52056: 'Will@r@v54/75400965."......Genji foresaw that worst of all possible futures, and, trying to secure a better future, he intentionally lied about the baby being dead."'
52057: 'BERNKASTEL@r@v28/72100173."Right.@k@v28/72100174. Kinzo was a man of such burning desire that he took advantage of his own daughter.@k@v28/72100175. Genji, who knew Beatrice''s feelings and felt sympathy for her, couldn''t trust Kinzo so easily."'
52058: 'Will@r@v54/75400966."Even Genji, Kinzo''s most devoted servant?"'
52059: 'BERNKASTEL@r@v28/72100176."Genji is a man who can draw a clear line between the professional and the personal.@k@v28/72100177. While he served Kinzo faithfully, he also felt that the mistake Kinzo had made with his daughter was not one to be forgiven easily."'
52060: 'Will@r@v54/75400967."......Probably.@k@v54/75400968. And to make sure that Lion wouldn''t be found out easily, Genji lied about the kid''s age, lowering it by three years."'
52061: 'Lion@r@v53/75300468."You''re right.@k@v53/75300469. In this world, I''m just entering elementary school in 1976.@k@v53/75300470. I was actually supposed to become a fourth year then."'
52062: 'Will@r@v54/75400969."If your frailness wasn''t the reason, .........then Genji must have been careful to disguise the year of your birth.@k@v54/75400970. The "baby from 19 years ago" was unforgettable not just to Kinzo, but to Natsuhi as well.@k@v54/75400971. If a suspiciously young servant of that age came to the island, Natsuhi''s feminine intuition would definitely have picked up on it."'
52063: '@rHad the child been too sick to go to school for three years?@k Or had the age been faked, so that Natsuhi wouldn''t figure everything out?'
52064: 'Will@r@v54/75400972."Either way, we know that your age has been lowered by three in this world."'
52065: 'BERNKASTEL@r@v28/72100178.".........Correct.@k@v28/72100179. The age of this world''s Lion has been altered by three.@k@v28/72100180. ......This is a small, feeble kid we''re talking about.@k@v28/72100181. An underdeveloped kid.@k@v28/72100182. It seems it was surprisingly easy to fake."'
52066: 'Clair@r@v55/75500076."Genji thought he should wait and see.@k@v55/75500077. In the end, would Kinzo be able to accept Beatrice''s child as his offspring, or not?@k@v55/75500078. He had the child live in the Gospel House until a suitable age, and then summoned the child to the island as a young servant.@k@v55/75500079. Neither father nor child knew the other.@k@v55/75500080. Genji''s thinking was as follows.@k@v55/75500081. If Kinzo truly did possess the affection of a parent,@k@v55/75500082. he would notice traces of the late mother and daughter in this child."'
52067: 'Clair@r@v55/75500083."They would surely be able to regain their parent-child relationship without the truth needing to be revealed to anyone.@k@v55/75500084. That was his belief.@k@v55/75500085. ......Or, perhaps, the time might come naturally.@k@v55/75500086. When that happened, he could tell the truth to both father and child.@k@v55/75500087. Believing that this day would eventually come, Genji told nothing of this to anyone.@k@v55/75500088. ......He watched over Beatrice''s child, waiting for the fated day..."'
52068: '@rAnd time continued to pass.'
52069: '@rDays slid by as he quietly watched over Beatrice''s child......'