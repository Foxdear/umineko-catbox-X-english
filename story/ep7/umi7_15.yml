53902: 'Rosa@r@v12/71400114."Eheheh, maybe it would.@k@v12/71400115. How have you been, Shannon-chan?@k@v12/71400116. I think you''ve gotten a bit taller since last time."'
53903: 'Shannon@r@v15/70500460."......Thank you very much."'
53904: 'Hideyoshi@r@v06/71100025."And the weather''s good again this year...!@k @v06/71100026.We should count our blessin''s that we can bring the whole family together like this without a single one of us missin''."'
53905: 'Shannon@r@v15/70500461."Please allow me to guide you to the mansion......"'
53906: '@rSo, after all, ......Battler-san has been so thoroughly forgotten that he might as well not have existed in the first place.'
53907: '@rThe sadness must be showing on my face.'
53908: '@rNot wanting anyone to see it, ......I turned my back to the family and led the way up to the mansion.'
