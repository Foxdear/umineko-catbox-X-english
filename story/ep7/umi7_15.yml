53763: '@r@v42/72700006."Totally!@k @v42/72700007.Why do guys turn into total morons when they get together?!"'
53764: '@rJessica''s room was filled with laughter.'
53765: 'Jessica@r@v04/70200299."It was one hell of a reality check...!@k @v04/70200300.I thought this guy was a bit cool, a bit mature.@k@v04/70200301. And then I see him with some of the other guys in our class, talking about dirty stuff with this creepy laugh!"'
53766: 'Shannon@r@v15/70500448."It''s true that boys always act like little kids when they''re together."'
53767: '@r@v42/72700008."Well, it''s not like girls are any better!"'
53768: '@r@v00/awase7015_o.""Ahhahahahahahaha!!""'
53769: '@rThe fun chat between girls continued without end.'
53770: '@rTonight, Krauss and Natsuhi were out late at a meeting on Niijima.'
53771: '@rNormally, Natsuhi was always watching, so Jessica would make sure to be curt with the young servants,@k but when Natsuhi wasn''t around, Jessica never did that.'
53772: '@rShe had invited the servants of similar age to her room, and they were chatting away noisily...'
53773: '@rAll of them were at the age when they wanted to know about love.'
53774: '@rJessica enjoyed talking about love all the more thanks to the rigid and constricting way she had been brought up, and she seized upon this chance...'
53775: '@r@v42/72700009."What about you, Milady? You''ve got charm, you''re the right age...@k @v42/72700010.Aren''t there any boys you''re interested in?"'
53776: 'Jessica@r@v04/70200303."W-well, I''d like to fall in love, but there really aren''t any...g-good ones around...!"'
53777: '@r@v42/72700011."I think you should be a bit more proactive when it comes to love.@k@v42/72700012. You act relaxed now, but it won''t last long!@k @v42/72700013.Once one of your friends starts going out with someone, it''ll turn your world upside down."'
53778: 'Jessica@r@v04/70200304."Th-there''s no way that''ll happen...@k@v04/70200305. None of my friends are traitors...@k@v04/70200306. I, I think."'
53779: '@r@v42/72700014."Ah, no, no, no!@k @v42/72700015.The one thing you definitely can''t count on from a girl you call your friend is that she won''t fall in love before you!@k @|@y@v42/72700016.If you met someone you liked, you''d betray your friends and go out with the guy without a second thought, wouldn''t you?!"'
53780: 'Jessica@r@v04/70200307."A-ahahahahahahahahahaha......@k@v04/70200308. Wh-what about you, Shannon...?!@k @v04/70200309.It''s not fair if I''m the only one who has to talk!"'
53781: 'Shannon@r@v15/70500450."I, umm, ......don''t have anyone like that around..."'
53782: '@r......Not around.'
53783: '@rHe''s far, far away, ......and like Orihime and Hikiboshi, I don''t get to see him very often.'
53784: '@rIn fact, ......I don''t even know when I''ll be able to see him again.'
53785: '@r......However, I believe that he''ll come for me someday.@k ......I believe it.'
53786: 'Jessica@r@v04/70200310."Don''t you betray me, okay, Shannon?!@k @v04/70200311.If we get boyfriends, we''ll get them together, okay?!@k@v04/70200312. Right? Right? We promised, right?!"'
53787: '@r@v42/72700017."Oh, you wouldn''t think it, but it''s girls like Shannon-chan...@k @v42/72700018.who are the type to beat you to the punch!@k @v42/72700019.*giggle*giggle*!"'
53788: 'Jessica@r@v04/70200313."Shannon, fess up!!@k @v04/70200314.You aren''t going out with anyone, are you?!@k @v04/70200315.You aren''t, right?!"'
53789: 'Shannon@r@v15/70500451."I, I''m not. Really......"'
53790: 'Jessica@r@v04/70200316."Really?!"'
53791: 'Shannon@r@v15/70500452."R-really..."'
53792: 'Jessica@r@v04/70200317."We''ll get boyfriends together, okay?@k @v04/70200318.No matter what happens, okay?!@k @v04/70200319.Cross your heart and hope to die, stick a needle in your eye!!"'
53793: 'Shannon@r@v15/70500453."Y-yes......@k@v15/70500454. I promise......"'
53794: '@r@v42/72700020."That''s the face of a liar!@k @v42/72700021.I''m willing to bet Shannon-chan''s the first of us all!@k @|@y@v42/72700022.I can tell.@k@v42/72700023. It''s always the quiet ones that go first...!"'
53795: 'Jessica@r@v04/70200320."Shannon, how could you?!@k @v04/70200321.Fess up, fess up!!"'
53796: 'Shannon@r@v15/70500455."P-please stop, Milady...!@k @v15/70500456.Th-that tickles...!@k @v15/70500457.A-ahahahahaha...!!"'
53797: '@r......Amid cheerful laughter, another lazy Sunday afternoon passed by.'
53798: '@rI worked my way out of the fight and looked up at the sky through the window.'
53799: '@r......I wonder if Battler-san is somewhere out there right now...@ksurrounded by his friends and chatting about the same topic we are.'
53800: '@rI only hope that you''re thinking of me...@k...the same way that I''m thinking of you...'
53801: '@rBut if I beg for that, it''s the same as admitting that I don''t trust you.'
53802: '@r.........I''ll wait.'
53803: '@rAnd when you do come for me, I''ll announce then and there that I''m quitting my job.'
53804: '@rI''ve already prepared myself for it.@k@r......But...you haven''t come yet.'
53805: '@rThat isn''t because you won''t come, ......but because I''m not resolved enough yet, right?'
53806: '@rIt''s because I haven''t clearly envisioned a future with you, right?'
53807: '@rI''ll wait.@k ......No matter how long.'
53808: '@r......Until you come for me, riding a white horse...'
53809: '@rI will always treasure our promise.@k@rThe promise of our precious resolve......'
53810: '@r@v42/72700024."No, never make a promise with a guy.@k@v42/72700025. You can''t count on them!"'
53811: '@rThinking that she had read my mind, I spun around.'
53812: '@rOf course, she hadn''t...'
53813: 'Jessica@r@v04/70200322."Well, as far as that goes,@k@v04/70200323. I think guys and girls have different ideas of what''s important."'
53814: '@r@v42/72700026."They do, they do! Totally different.@k@v42/72700027. On the whole, girls tend to be dreamers, and guys just do stuff without thinking."'
53815: 'Jessica@r@v04/70200324."I guess understanding between the sexes is pretty much impossible after all."'
53816: '@r@v42/72700028."At least, I think it''s pretty hard.@k@v42/72700029. Girls often have the bad habit of thinking they know exactly what the guy is thinking right away.@k@v42/72700030. They search for hidden meanings behind words that guys say for no reason in particular,@k@v42/72700031. and just get the wrong idea."'
53817: 'Jessica@r@v04/70200325."Ah, yeah, I''ve known girls like that.@k@v04/70200326. Girls who''ve taken what anyone could tell them was just some meaningless comment as a sign that the guy is totally into them.@k@v04/70200327. Yeah, I see it all the time."'
53818: '@r@v42/72700032."It''s painful to watch when a girl gets the wrong idea."'
53819: '@rAhhahahahahahahaha.@k The pair of them laughed together.'
53820: '@r......When a girl...gets the wrong idea.@k Could that be......me...?'
53821: '@rNo, that can''t be.@k@rAfter all, Battler-san made a clear promise to me.@k@rHe said he''d come for me riding a white horse.'
53822: '@r......I mustn''t doubt.'
53823: '@rI''m sure this conversation I''m hearing is just another one of God''s trials.'
53824: '@rSo, I won''t listen.@k I won''t even think twice about it.'
53825: 'Jessica@r@v04/70200328."If there''s one thing I never want to be, it''s one of those embarrassing girls who thinks a guy''s heart is linked to hers for no reason."'
53826: '@r@v42/72700033."Ahhahahahahahahahahahaha."'
53827: '@rThose demonic sneers tormented me and tried to lead me astray.@k@r......I''m sure he''ll come to the next family conference......'
53828: '@rBut Battler-san didn''t come to the 1982 conference either......'
53829: '@rMore and more things keep changing away from the way they were at the last family conference he came to.'
53830: '@rKyrie-sama, Rudolf-sama''s new wife, now blends in perfectly here,@k ......coming down off the boat with a familiar stride.'
53831: '@rHer daughter, Ange-sama, is growing well, and all of the family focus their attention on her.'
53832: '@rAlso, Maria-sama, who was so small at the time, is already five years old.@k She is full of energy, and old enough to enjoy playing with George-sama.'
53833: '@rNeither Jessica-sama nor George-sama brought up Battler-san''s absence.'
53834: '@rThe other relatives were the same way.@k ......No one touches upon the subject, as though they''ve forgotten that Battler-san is missing.'
53835: '@rMaria-sama was only three when she last saw Battler-san.'
53836: '@rI doubt whether she even remembers him.'
53837: '@r......In just two short years...'
53838: '@rAll trace of your existence......has been erased from the Ushiromiya family conference.'
53839: '@rThat made me sad.@k And so I said...'
53840: 'Shannon@r@v15/70500458_b."......It looks like Battler-sama didn''t come back this year either."'
53841: 'George@r@v07/70300076."True.@k@v07/70300077. ......Do you miss having him here?"'
53842: 'Shannon@r@v15/70500459."Well, ......umm......"'
53843: 'George@r@v07/70300078."Uncle Rudolf and Auntie Kyrie don''t even bring him up anymore.@k@v07/70300079. ......It looks like Battler-kun was much more serious than we thought."'
53844: 'Jessica@r@v04/70200329."I wonder if he really will stay away forever."'
53845: 'George@r@v07/70300080."Looks like it was leaving the nest after all.@k@v07/70300081. He''s spread his wings and left for a new stage of life.@k@v07/70300082. That''s my assumption."'
53846: 'Jessica@r@v04/70200330."......He''s always been crazy and reckless.@k@v04/70200331. Well, what more''d you expect from a guy?"'
53847: 'George@r@v07/70300083."Well, we know Battler-kun.@k@v07/70300084. I''m sure he''s adapted to his new life and is enjoying himself.@k@v07/70300085. So, there''s no reason to worry."'
53848: '@rEven though George-sama said that with a smile, his words disconcerted me.'
53849: '@rHe''s "enjoying himself", so there''s "no reason to worry"...?@k .........What is that supposed to mean......?'
53850: 'Jessica@r@v04/70200332."This is Battler we''re talking about, so you can bet he''s forgotten all about us and is having a great time."'
53851: 'George@r@v07/70300086."Yeah, I''m sure that''s the case.@k@v07/70300087. And I think that''s best for him.@k@v07/70300088. Battler-kun must have given a lot of thought to himself, his family, and his late mother, and made the independent decision to start a new life.@k@v07/70300089. So, I hope he lives that new life with conviction.@k@v07/70300090. Forgetting about the Ushiromiya family would do him a lot of good."'
53852: '@rGeorge-sama smiled at me, expecting me to agree.'
53853: '@r......After a moment of shock, I smoothed my expression over and found the expression he was expecting.'
53854: '@rIs Battler-san......living happily,@k ......having forgotten about the family, about me, about our promise......?'
53855: '@rThat can''t be true. It just can''t be.'
53856: '@rBattler-san must be striving to reach that day of resolve just like me.'
53857: '@rI''m not mistaken about that.'
53858: '@rHe promised me.@k@rHe said he''d come riding a white horse.'
53859: '@rI never asked him to say that.@k@rHe said he''d come for me on the day I resolved to live life for his sake.'
53860: '@rHe made that promise himself.'
53861: '@rFor two years,@k I''ve believed that.'
53862: '@rI''ve done all I could to make it through God''s trials and the whisperings of demons that tried to throw me from my path.'
53863: '@rAnd yet, ......the things both George-sama and Jessica-sama are saying...are so cruel.'
53864: '@rBattler-san has forgotten about us and has started a new life?'
53865: '@rWhy are they telling such obvious lies......?'
53866: '@rBut that night...@k@rI dreamed of Battler-san for the first time in a long while.'
53867: '@rThe Battler-san in my dream.........wasn''t the Battler-san I believed in.'
53868: '@r......It was the Battler-san that George-sama and Jessica-sama had spoken of,@k .........the one who had forgotten everything and started a new life.'
53869: '@rMorning arrived.@k I woke up with a tear-stained face.'
53870: '@rThe me in the mirror......whimpered through tears that she couldn''t wait any longer.'
53871: '@rIf you''ve managed to wait this long, why can''t you wait any longer...?@k@rThis is a trial.@k ......We have to believe in him and wait.'
53872: '@rBut the me in the mirror spoke.@k ......It was sharper than a fragment of glass.'
53873: '@r.........We talk about this promise, ......but did we actually make a promise with him...?'
53874: '@rDon''t you remember what Jessica-sama said?@k ......That some girls are dreamers who get the wrong idea?'
53875: '@rDon''t you remember what George-sama said?@k ......That Battler-san has gotten used to his new life......and has forgotten about the Ushiromiya family?'
53876: '@r.........He wouldn''t be the only one to forget.@k@rWithout me asking about Battler-san, everyone on this island would have forgotten his name.@k@rEven Rudolf-sama doesn''t say his name anymore.'
53877: '@rIf I weren''t here to remember his face,@k ......perhaps his existence would have been erased from the hearts and minds of everyone here.'
53878: '@r......I don''t believe it.@k So, I won''t doubt him.'
53879: '@rBattler-san must still remember our promise.'
53880: '@rWe''re both waiting for the day of resolve, the day we''ll be together.'
53881: '@r............Battler-san.@k@rMy mind is firmly made up.'
53882: '@rDoes the fact that you''re not here mean that I''m still not resolved enough?'
53883: '@rNo.@k ......It''s because you and God are testing me, isn''t it?'
53884: '@rIn that case, I will endure.@k@rUntil that promised day inevitably comes.'
53885: '@r.........So, ......please.'
53886: '@rBattler-san.'
53887: '@rI want some sign......that you haven''t forgotten me.........'
53888: '@rThat...was the crack that ran across my ceramic heart.'
53889: '@rAt last, I had to acknowledge the possibility.'
53890: '@r......The possibility that something terrible and dreadfully sad was happening......and I was pretending not to notice.'
53891: '@rBattler-san...makes me yearn for him.@k@rBattler-san...makes me sad.@k@rBattler-san...makes it hurt.........'
53892: '@rBattler-san.'
53893: '@r......Do you still remember me, now.........?'
53894: '@rAnd then......came the third family conference since Battler-san left.'
53895: '@rIf the number of beds was going to increase, we would be told about that when setting up.'
53896: '@rThe fact that nothing has changed in particular......means that he probably won''t be here this year either.'
53897: '@rClinging to a final bit of hope, I stood by the docks, watching the boat draw closer.'
53898: 'Rudolf@r@v08/71200046."Hey, Shannon-chan.@k@v08/71200047. You''re looking as pretty as ever."'
53899: 'Kyrie@r@v09/71300026."Careful, Ange.@k@v09/71300027. Watch your step."'
