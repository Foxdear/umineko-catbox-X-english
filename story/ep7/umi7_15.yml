53910: 'George@r@v07/70300093."What, you saw Battler-kun?"'
53911: 'Jessica@r@v04/70200333."Is he doing well...?!"'
53912: 'Kyrie@r@v09/71300028."Yes,@k@v09/71300029. he''s doing very well.@k@v09/71300030. I took Ange and had some tea with him the other day."'
53913: '@rI was surprised.@k ......So, Kyrie-sama was in touch with Battler-san.'
53914: '@rAccording to her, the fight between Battler-san and Rudolf-sama had calmed down a long time ago,@k but both were so stubborn that they hadn''t found a good chance to make up.'
53915: '@rAnd since Battler-san had gotten used to living with his grandparents and going to school near there,@k it wasn''t going to be easy to get him to come back home, especially considering that the grandparents were adding extra complications.'
53916: 'Kyrie@r@v09/71300031."......It''s just too bad.@k@v09/71300032. I think Asumu-san''s parents were even more angry than Battler-kun was.@k@v09/71300033. This isn''t just an issue between Battler-kun and Rudolf-san anymore."'
53917: 'Jessica@r@v04/70200334."Then will Battler be coming back sometime soon?"'
53918: 'Kyrie@r@v09/71300034."He will make up with Rudolf-san, but it looks like he doesn''t intend to return to the Ushiromiya family.@k@v09/71300035. ......Such a shame.@k@v09/71300036. Though I do understand how he feels."'
53919: '@rIt was a bit of a relief to hear that some of the bad feeling had died down in these three years.'
53920: '@rTaking Asumu-sama''s parents into account, it''s no surprise that things haven''t gone as well as they could.'
53921: '@rBut if Battler-san doesn''t hate Rudolf-sama anymore, ......then someday...'
53922: '@r......Surely he''ll come back.@k He''ll have grown so much.'
53923: '@rMy resolve will never waver again.'
53924: '@rFor some nights these past three years, I''ve felt sad and resentful.'
53925: '@rBut now, ......it feels as though those three years were something I needed.'
53926: '@rAfter all, ......the seeds of love, the faint feelings I once had for you...@k...have budded powerfully, waiting for the day that we''ll be reunited.'
53927: '@rThis is how honest my feelings for you are now.'
53928: '@r.........I...love you.'
53929: '@rI want to see you again as soon as I can.'
53930: '@rUntil that time, ......I''ll keep this sprout of love warm and growing for you......'
53931: '@rI won''t doubt the coming of that day anymore.'
53932: '@rJust as I think of you, under the same sky...'
53933: '@r...I believe that you are thinking of me.'
53934: '@r......I''m sure this news about him is a sign that God is cheering me on.'
53935: '@rSo, I asked God one more time, inside my heart.'
53936: '@rSince my feelings for Battler-san have not wavered for a day these past three years...'
53937: '@rLet me know that he feels the same way.'
53938: '@rI know that asking for that is a sin.'
53939: '@rHowever, now that we''ve reached a three-year turning point,@k ......I want some gift from God, any gift, to show that I have not waited in vain.'
53940: '@rThat is what I prayed.'
53941: 'Kyrie@r@v09/71300037."Oh, that''s right.@k@v09/71300038. It''s been so long since Battler-kun last saw you all, right?@k@v09/71300039. I thought you might be feeling lonely, so I told him to write you letters.@k@v09/71300040. Here they are."'
53942: '@r..................Huh...?'
53943: '@rDid God......really hear my prayers?@k@rI felt as though my heart was going to leap out of my chest.'
53944: 'Jessica@r@v04/70200335."A letter from Battler?@k @v04/70200336.Awesome!@k @v04/70200337.What''d he write?!"'
53945: 'George@r@v07/70300094."Did he say anything about how he''s been doing lately?@k@v07/70300095. I can''t wait to read it."'
