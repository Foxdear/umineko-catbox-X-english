53947: '@rJust one?'
53948: '@rWhen George-sama opened it, several folded letters came out.'
53949: 'George@r@v07/70300096."Looks like this one''s addressed to me.@k@|@y@v07/70300097. ......They all have different names on them.@k@|@y@v07/70300098. Here, this one''s yours, Jessica-chan."'
53950: 'Jessica@r@v04/70200338."Thanks!"'
53951: 'George@r@v07/70300099."And this one''s for Maria-chan.@k@v07/70300100. Will she be able to read it...?"'
53952: 'Rosa@r@v12/71400117."I''ll read it to her later.@k@v12/71400118. Thank you."'
