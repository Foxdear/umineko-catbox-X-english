53954: 'Kyrie@r@v09/71300041."*giggle*.@k@v09/71300042. I''ll give it to her when she does learn."'
53955: 'Jessica@r@v04/70200339."He says he''s doing great and having a blast...!@k @v04/70200340.That''s awesome."'
53956: 'Shannon@r@v15/70500462."......Umm,@v15/70500463. ......is that...@v15/70500464.all of them...?"'
53957: 'George@r@v07/70300103."Yep.@k@v07/70300104. Looks like that''s all of them.@k@|@y@v07/70300105. Thanks a lot."'
53958: '@rGeorge-sama handed me the empty envelope.'
53959: '@r......Apparently, he thanked me because he thought I was offering to throw it away for him.'
53960: '@rAnd, clearly, ......there was nothing inside it.'
53961: '@rThere was no letter for me...'
53962: 'George@r@v07/70300106."Whoa.@k@v07/70300107. The more I read, the more fun it looks like Battler-kun''s been having.@k@v07/70300108. Living every day to the fullest."'
53963: 'Jessica@r@v04/70200341."That''s what it looks like in mine, too.@k@v04/70200342. If he''s happy, then I guess that''s what counts."'
53964: 'Rosa@r@v12/71400119."*giggle*.@k@v12/71400120. That''s so mean of Battler-kun.@k@v12/71400121. It sounds like he forgot about us until you told him to write those letters."'
53965: 'Kyrie@r@v09/71300043."Well, you know what he''s like.@k@v09/71300044. Battler-kun enjoys life.@k@v09/71300045. And I hear he''s popular with the ladies at school, too."'
53966: 'George@r@v07/70300109."Wow...!@k @v07/70300110.Incredible!"'
53967: 'Jessica@r@v04/70200343."There should be plenty of girls who like those hilarious, melodramatic lines of his.@k@v04/70200344. Makes sense to me."'
53968: 'Rosa@r@v12/71400122."I wonder if he really does plan to stay away."'
53969: 'George@r@v07/70300111."It looks like he does.@k@v07/70300112. In my letter, it says that he doesn''t plan to return to Rokkenjima."'
53970: '@rI know that all these letters and the things written inside them...@k...are trials from God.'
53971: '@rThe absence of a letter for me,@k the information that he''s enjoying life and has forgotten about Rokkenjima,@k ......are all just trials upon trials.'
53972: '@rHe is...@w250. God is...@w583....testing me.'
53973: '@rThe fact that I''m the only one without a letter is proof of that......'
53974: '@r............I...@w500.............wanted to believe that............'
53975: '@r......But...@w500.......at last.........'
53976: '@rI couldn''t believe any longer...............'
53977: 'Will@r@v54/75401024."......It might''ve been an important promise to you,@k@v54/75401025. ......but it looks like it wasn''t for Battler."'
53978: 'Clair@r@v55/75500735."................................."'
53979: 'Lion@r@v53/75300512."......No way.@k@v53/75300513. ......Then, that promise about him coming on a white horse was..."'
53980: 'Clair@r@v55/75500736."I was a dreamer... It was just an illusion I created......"'
53981: 'Will@r@v54/75401026."To Battler, they were probably just meaningless words to make him sound cool."'
53982: '@r......What a ludicrous story it might seem to an outside observer.@k@rThat promise with Battler might have been an illusion the whole time.'
53983: '@rWe don''t even know......if they felt the same way about each other in the first place.'
53984: '@rLove is an illusion.'
53985: '@rWhen both sides see the same illusion, the love becomes true.'
53986: '@rHowever, when the feelings of each side are different, ......then it''s nothing more than a joke.'
53987: 'Will@r@v54/75401027."This is Battler''s sin."'
53988: 'Lion@r@v53/75300514."......That he created the illusion......of a promise."'
53989: 'Will@r@v54/75401028."No."'
53990: 'Lion@r@v53/75300515.".........Huh?"'
53991: 'Will@r@v54/75401029."......It''s that he didn''t even remember."'
53992: 'Clair@r@v55/75500737."If he had simply broken his promise, ......I could have confronted him about it.@k@v55/75500738. I could have regretted, or I could have recovered.@k@|@y@v55/75500739. .........However, since he didn''t even remember, I am unable to question him about it."'
53993: 'Lion@r@v53/75300516.".............................."'
53994: 'Clair@r@v55/75500740."I am unable to hate Battler-san.@k@v55/75500741. ......After all, Battler-san didn''t even break his promise."'
53995: 'Will@r@v54/75401030."There just wasn''t......any promise from the beginning."'
53996: 'Clair@r@v55/75500742."......It was nothing more than a sad.........joke."'
53997: '@r.........I kept on crying and crying.@k@rI dug my fingernails into my pillow, soaking it with my tears.'
53998: '@rHow much easier it would be to hate something...'
53999: '@rBut I can''t hate anything.'
54000: '@rI just couldn''t get over my miserable arrogance,@k ......which had led me to believe for three whole years that he felt the same as I did.'
54001: 'BEATRICE@r@v55/75500743."......I am to blame for this.@k@v55/75500744. ......My irresponsible words led you to believe that Battler made a promise..."'
54002: 'Shannon@r@v15/70500465."No.........@k@v15/70500466. This isn''t anyone''s fault.@k@v15/70500467. ......It''s all because I assumed that he felt the same way I did..."'
54003: 'BEATRICE@r@v55/75500745."Battler did not make a promise.@k@v55/75500746. However, that does not mean his feelings were anything to be laughed at!@k @v55/75500747.Though there might have been a difference in degree when compared to yours,@k@v55/75500748. it is true that he liked you!@k @v55/75500749.Of that, there can be no doubt."'
54004: 'Shannon@r@v15/70500468."......Please, ......just stop it......@k@v15/70500469. ......I''ve believed that he liked me the way I liked him, ......without ever doubting that.@k@v15/70500470. .........Please don''t try to cheer me up.@k@v15/70500471. ......I''d rather......that you mocked me........."'
54005: '@rBefore I knew it......@ka dull inescapable pain had pierced my chest.@k@rWhen I pressed my hand against my chest, I realized what that pain was.'
54006: '@rIt was the bud of love, which I had sown the seeds of and raised in my heart.'
54007: '@rIts roots had spread throughout my chest,@k ......tormenting me like a metal wire wrapped around my heart.'
54008: '@rRather than roots, ......they looked more like fissures running through my heart.'
54009: '@rThe only way to kill the pain would be to tear out the roots of love.'
54010: '@rBut no matter how much I clawed at them, it was only my heart that got torn and scratched.@k ......The roots of love didn''t move at all.'
54011: '@rIf my feelings for Battler-san were to turn to hate, without any lingering interest or regrets,@k ...I''d be able to pull out these roots easily.'
54012: '@rThey would probably leave a hole behind, but at least they wouldn''t hurt me anymore.'
54013: '@rBut they won''t come out.@k ......Even though it hurts so much, those roots of love are still stuck in my heart.'
54014: 'BEATRICE@r@v55/75500750."......Shannon..............."'
54015: 'Shannon@r@v15/70500472."I...@v15/70500473. .........Even now,@v15/70500474. ......I love Battler-san...@v15/70500475.......so much.@k@v15/70500476. ......I miss him.@k@v15/70500477. I want him to come back......@k@v15/70500478. I believe he will come back someday,@v15/70500479. ......and I want to wait for him...@k@v15/70500480. ......But...@v15/70500481....now it''s just...@v15/70500482....too much........."'
54016: '@rAs I sobbed, the tightness in my chest grew even stronger.'
54017: '@rAs long as I love Battler-san, that pain will always continue.'
54018: '@rBecause I love him, I want to hold onto that pain forever.'
54019: '@rBut......it was written right there in the letters for George-sama and the others.'
54020: '@rBattler doesn''t plan on returning to the Ushiromiya family.'
54021: '@rHe''s forgotten about me and Rokkenjima,@k ......and has started a new life with a different name.'
54022: '@rI have to endure all this aching, biting, agonizing pain...@k......and wait forever for someone who will never return...'
54023: 'Shannon@r@v15/70500483."Is this another trial......?@k @v15/70500484.To wait for him forever?@v15/70500485. ......Is that what God is asking of me......?@k @v15/70500486.I can''t do that......@k@v15/70500487. I...@v15/70500488....want to be with Battler-san.@k@v15/70500489. But if this is the trial...@v15/70500490.that I must go through for that...@v15/70500491....it''s just...@v15/70500492.......too painful......"'
54024: 'BEATRICE@r@v55/75500751."...................................."'
54025: '@rBEATRICE hung her head in shame.'
54026: '@rIf she hadn''t encouraged Shannon so much, it probably wouldn''t have been this painful.'
54027: '@rShannon may have been the one to sow the seed of love in her heart.@k@rHowever, BEATRICE had irresponsibly watered it and told Shannon not to give up.'
54028: '@r......BEATRICE scratched at her chest, trying to share Shannon''s pain...'
54029: 'BEATRICE@r@v55/75500752."........................This is...my fault."'
54030: '@rBEATRICE mumbled to herself.'
54031: 'Shannon@r@v15/70500493."......How can any of this be your fault?"'
54032: 'BEATRICE@r@v55/75500753."For three years, I tortured you with the illusion of a promise that never happened.@k@v55/75500754. ......If I had not nourished the bud of love within you, ......you would not have suffered so."'
54033: 'Shannon@r@v15/70500494."................................."'
54034: 'BEATRICE@r@v55/75500755."Shannon.@k@v55/75500756. This may sound harsh, ......but listen."'
54035: 'Shannon@r@v15/70500495."...............What is it...?"'
54036: 'BEATRICE@r@v55/75500757."Forget Battler.@k@v55/75500758. ......There was no bud of love in the first place."'
54037: 'Shannon@r@v15/70500496."......No.@k@v15/70500497. I''m the one who nourished it.@k@v15/70500498. ......No matter how painful it is, I can''t forget it."'
54038: 'BEATRICE@r@v55/75500759."But you cannot bear that pain any longer, can you......?"'
54039: 'Shannon@r@v15/70500499."......................................."'
54040: '@rWordlessly, Shannon held her chest and hung her head.'
54041: '@rI......yearn for Battler.'
54042: '@rEven now, that feeling burns inside me,@k ......and no matter how much it hurts, I can''t let it go.'
54043: '@rI''ve spent three years pretending not to notice that pain.'
54044: '@rNow, I know that I feel it.'
54045: '@rAnd now that I know, ......it''s unbearable...'
54046: 'BEATRICE@r@v55/75500760."So, you cannot throw away your bud of love for Battler?"'
54047: 'Shannon@r@v15/70500500."..................I can''t."'
54048: 'BEATRICE@r@v55/75500761."However, at this rate,@v55/75500762. ......the bud...the roots...will kill you."'
54049: 'Shannon@r@v15/70500501.".............................."'
54050: 'BEATRICE@r@v55/75500763."People need a universe to survive.@k@v55/75500764. ......And one person cannot create that universe alone.@k@v55/75500765. Two are needed."'
54051: 'Shannon@r@v15/70500502.".........A universe......"'
54052: 'BEATRICE@r@v55/75500766."Together with Battler, you created the universe of that bud of love.@k@v55/75500767. ......Now that one half of that pair is gone, your universe has crumbled.@k@v55/75500768. ......People cannot......complete a universe on their own."'
54053: 'Shannon@r@v15/70500503."But...@v15/70500504....the other person who creates my universe,@v15/70500505. ......Battler-san, won''t come back..."'
54054: 'BEATRICE@r@v55/75500769."Then you must create a new universe with someone else."'
54055: 'Shannon@r@v15/70500506.".........You mean, ......create one with someone other than Battler-san?"'
54056: 'BEATRICE@r@v55/75500770."I will give you that someone."'
54057: 'Shannon@r@v15/70500507."......Who are you.........talking about......?"'
54058: 'BEATRICE@r@v55/75500771."A creature to bury the pain in your heart and heal you.@k@v55/75500772. ......He will not betray you.@k@v55/75500773. ......Yes, ......let it be a sibling.@k@v55/75500774. ............I will give you a little brother."'
54059: 'Shannon@r@v15/70500508."A little brother..............."'
54060: 'BEATRICE@r@v55/75500775."A boy you have always been close to at the Gospel House, whom you love as if he were your real brother.@k@v55/75500776. ......That, I shall give to you.@k@v55/75500777. ......Together with him, you will create a new universe."'
54061: 'Shannon@r@v15/70500509."......Will that little brother......make me forget about the pain of my love for Battler-san......?"'
54062: 'BEATRICE@r@v55/75500778."Indeed.@k@v55/75500779. .........You need a universe."'
54063: 'Shannon@r@v15/70500510."Then, ......what will happen to the bud of love...@v15/70500511....in my heart?@k@v15/70500512. .........My feelings for Battler-san won''t change.@k@v15/70500513. ......I can''t make them wither."'
54064: 'BEATRICE@r@v55/75500780."..............................@k@|@y@v55/75500781. ......I shall accept that bud and those roots...@k@v55/75500782.in your place."'
54065: 'Shannon@r@v15/70500514."......You will............?"'
54066: 'BEATRICE@r@v55/75500783."You can forget the pain of love and create a new universe.@k@v55/75500784. ......I will accept the bud of love in your place.@k@v55/75500785. ......It means that I will accept the pain as well, ......but I will also learn of the single element I do not possess,@k@v55/75500786. ......the element of love."'
54067: '@rBEATRICE......wanted to know love.@k@rShe wanted to feel what Shannon had felt in the world of humans.'
54068: 'BEATRICE@r@v55/75500787.".........And,@k@v55/75500788. if Battler ever does return,@k@v55/75500789. if the bud still has not withered and you still desire it,@k@v55/75500790. I shall return it to you.@k@v55/75500791. ......What do you think of that?"'
54069: 'Shannon@r@v15/70500515."...................................."'
54070: '@rStill hanging her head, ......Shannon gave a small nod, but said nothing.'
54071: '@rIt would mean release from this unbearable pain.'
54072: '@rAnd...it would mean giving the bud of love to the witch, to hold in her place......'
54073: '@rShannon spread the hands that she had held to her chest.'
54074: '@rAs she did, a faint light slipped out of her chest and floated in the air,@k ......gradually swallowing everything with its brightness.'
54075: '@rAs the brilliant light began to fade away, Shannon and BEATRICE, still facing each other,@k were now inside a vast, starry sphere, like a planetarium.'
54076: '@rThey were the only ones in this pitch-black starry sea.'
54077: '@r.........Shannon felt as though she had seen this place once before, but she could not remember.'
54078: '@rThen, I made another announcement.'
54079: 'BEATRICE@r@v55/75500792."The world shall be modified.@k@v55/75500793. ......Let the bud of love travel from Shannon to BEATRICE."'
54080: '@rThis way, Shannon won''t be tormented by the bud of love anymore.'
54081: '@rOn top of this, so that Shannon can create a new universe, ......I''ll give her a little brother.'
54082: '@rThe backstory for the little brother will be a younger boy at the Gospel House with whom Shannon was close.'
54083: '@rFor a name, ...............let there be the @bon.@<音@> character, as Gospel House rules state.'
54084: '@r............Yeah, I''ve decided.@k@r......That''s a perfect name to go with Shannon''s.'
54085: '@rHe''ll be......a quiet, reticent boy.@k@rHe''ll come to Rokkenjima as a new servant.'
54086: '@rThere, he''ll establish an immediate rapport with Shannon.'
54087: '@rAs a duty-minded boy who loves Shannon like a big sister, he''ll always be there for her......'
54088: '@rLet''s have him be a special servant like Genji, who is permitted to serve Kinzo directly.'
54089: '@r......Yeah.@k That sounds kinda cool.'
54090: '@rThen, BEATRICE.@k@rFrom now on, you will carry the bud of love.'
54091: '@rIn other words, ......the role of being infatuated with Battler and waiting for his return will go to you.'
54092: '@rWhile you are still the witch who reigns over Rokkenjima''s night...@k@rYou have also been waiting for Ushiromiya Battler, ever since that day three years ago.'
54093: '@rAlong with this change in setting, I''ll give you a new form as well...'
54094: '@rHe did tell us what his ideal woman would look like once, remember?'
54095: '@r......A woman with a great figure and long, golden hair, like a foreign model.'
54096: '@rGolden hair.@k Long hair.@k A great figure.'
54097: '@r......Yeah.@k Something like that.@k@rThat''s what the new BEATRICE will look like.'
54098: '@rCome now, hold that bud of love in your heart as you wait for Battler.'
54099: '@r......You will learn of love at last...and pay the price of pain.'
54100: '@rYes, this will be the setting for my new world.'
54101: '@rFor Shannon, a new servant like a little brother will come.@k@rHe will be a silent, reticent boy.@k A duty-minded kid who loves Shannon as a sister.'
54102: '@rAnd the bud of love that has tortured Shannon......will go to the witch, BEATRICE.'
54103: '@rShe will just be holding onto the bud of love for the time being.'
54104: '@rHowever, while she holds onto it, she will be a maiden in love with Battler.'
54105: '@rFor that time, you will be able to learn what love is......'
54106: '@rCome, let the world be modified.@k@rOh, I am one yet many.'
54107: '@rAwaken, us.'
54108: '@rAnd stretch your wings in this new world......'
54109: '@r.........Slowly, .........I opened my eyes to the gentle rays of the morning sun.'
54110: '@r..............................'
54111: '@rHow long has it been since I woke to such a pleasant morning?'
54112: '@r......The face in my mirror is tear-stained and pathetic.'
54113: '@rHowever, ......my heart is as clear as the morning sun.'
54114: '@rI could still clearly remember that strange dream.@k@rHowever, I could feel myself forgetting it rapidly...'
54115: '@rThe place I''d been in my dreams......had been such a strange place.'
54116: '@rA peaceful, calm place.'
54117: '@r......There, ......I had left behind the pain I had carried in my chest until yesterday.'
54118: '@rSo this morning, my heart was at peace...'
54119: 'Shannon@r@v15/70500516."Good morning, me........."'
54120: '@rMy tear-stained face really looked pathetic.@k@rHowever, my expression was bright and cheery.'
54121: '@rI still do...@w500....love...@w416.Battler-san.'
54122: '@rBut, ......I think I''d say...@k......I''ve calmed down.'
54123: '@rIt feels like I''ve put something precious safely away in the place it belongs.'
54124: '@r............ Battler-san.@k When will you come back, I wonder...@k@rWhen you do, I''d like to talk about mystery novels again.'
54125: '@r......Oh, I almost forgot.@k@rA new boy servant will be coming today, won''t he?'
54126: '@rOne of the rare servants who will serve the Master directly.@k@rWhat kind of kid will he be?@k I hope we get along well......'
54127: '@rWhat was his name again?@k@rI think......it was......'