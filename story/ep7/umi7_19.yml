56237: '@r......Kyrie understood this sort of mind game better than anyone else.'
56238: '@rRudolf reflexively averted his gaze from the cold glint in her eyes, but then he just shrugged and answered her question.'
56239: 'Rudolf@r@v08/71200229."Of course.@k@v08/71200230. .........We have a billion yen riding on this.@k@v08/71200231. I''m a man.@k@v08/71200232. I''m not going to miss a chance that''ll never come again in my lifetime."'
56240: 'Kyrie@r@v09/71300189."......I expected no less of you, Rudolf-san.@k@v09/71300190. ......I love people who seize chances when they come.@k@v09/71300191. That''s why I fell in love with you."'
