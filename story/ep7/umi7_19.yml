56248: 'Kyrie@r@v09/71300196."I''ll do that.@k@|@y@v09/71300197. ............Take care, now.@k @v09/71300198.If you really treasure Battler-kun, don''t kill George-kun in front of the chapel, okay?@k @v09/71300199.It''ll be a pain if he finds the corpse."'
56249: 'Rudolf@r@v08/71200241."......Yeah, I know.@k@v08/71200242. ......I''ll lure him away somehow.@k@v08/71200243. It''s raining outside.@k@v08/71200244. Should be some way to do it."'
56250: 'Kyrie@r@v09/71300200."And you aren''t a villain in some old western, got it?@k @v09/71300201.Don''t grant any last requests or ask for any last words, okay?"'
56251: '@rKyrie lifted up her gun again and pulled on the lever.@k@r......To eject the casing from the bullet she had killed Gohda with.'
56252: 'Eva@r@v05/71000292.".........Honey......@k@v05/71000293. ......Honeyyyy...@k@v05/71000294. Uuuughhhuuuuuu......"'
