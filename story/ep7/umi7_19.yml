56296: 'Lion@r@v53/75300707."......By now, even I realize that you''re the Game Master here.@k@v53/75300708. ......Please, tell me.@k@v53/75300709. ...Why are you showing us this game...?"'
56297: '@rOf course, no one answered Lion''s muttered question.'
56298: '@rThe game created to mock Ange continued emotionlessly,@k ......with more terrible twists that didn''t betray anyone''s expectations anymore......'
56299: 'Ange@r@v11/72000109."Ha!@k @v11/72000110.Show whatever terrible game you like!@k @v11/72000111.You''re trying to say that this is one of the endless possibilities inside the cat box, right?!@k @v11/72000112.Just do whatever you want...!@k @v11/72000113.I won''t let something like this get to me!!@k @v11/72000114.Someday, I''ll find out the truth of what happened on October 5th, 1986!!"'
56300: '@rAfter meeting Kyrie in the parlor, Jessica was told that the test would be held in the dining hall, and she followed Kyrie there...'
56301: 'Jessica@r@v04/70200370.".........Auntie Kyrie, there''s no one here."'
56302: 'Kyrie@r@v09/71300202."He''ll be here soon.@k@v09/71300203. Sit over there."'
56303: 'Jessica@r@v04/70200371."..........................."'
56304: '@rJessica sat in that chair, looking nervous and agitated.'
56305: '@rKyrie was by far the calmer of the two.'
56306: '@rKyrie closed the door behind her, revealing the gun that rested behind it.@k Jessica was facing the other way, so she saw nothing......'
56307: 'Jessica@r@v04/70200372."......Did you hear anything, Auntie Kyrie?@k @v04/70200373.You know what kind of test this is?"'
56308: 'Kyrie@r@v09/71300204."Yes.@k@v09/71300205. It''ll be over soon."'
56309: 'Jessica@r@v04/70200374."I sure hope so."'
56310: '@rAs she complained, Jessica turned her head around, and the tip of her nose bumped into cold metal.'
56311: 'Jessica@r@v04/70200375."............Huh—"'
56312: 'George@r@v07/70300205."U-Uncle Rudolf......?!@k @v07/70300206.What......are you doing......?"'
56313: 'Rudolf@r@v08/71200245."Heheh.@k@v08/71200246. Just can''t bring myself to shoot you in the back."'
56314: 'George@r@v07/70300207."......C-......careful, guns are dangerous.@k@v07/70300208. What on Earth are you doing...?!"'
56315: 'Rudolf@r@v08/71200247."You really have to ask why someone''d point a gun and pull the trigger?"'
56316: '@rRudolf reloaded rapidly and pulled the trigger again without any sign of hesitation.'
56317: '@rAs the sound of gunfire thundered through the rain, George grabbed at his side and fell to his knees...'
56318: 'George@r@v07/70300209."Unnggg......ggnhh......!!"'
56319: 'Rudolf@r@v08/71200248."That''s weird.@k@v08/71200249. Looks like it shoots low.@k@v08/71200250. ......This gun''s really got it bad."'
56320: 'George@r@v07/70300210."S-somebody......!!@k @v07/70300211.Help me, ...Uncle Rudolf is......!!"'
56321: '@rGeorge started stumbling away, still clutching at his side.@k@rHis voice as he called for help was weak and thin.'
56322: '@rBehind him, Rudolf looked perfectly calm as he fiddled with his gun and inspected the sights.'
56323: 'George@r@v07/70300212."......It hurts...... ...It hurts......@k@v07/70300213. ......Gah, .........nngg...!"'
56324: '@rA gouging pain in George''s side tormented him.@k It was so painful that he could barely stand and walk......'
56325: '@rHe leaned against the trunk of a tree.'
56326: '@rAfter he crouched down, trying to cover his wound, ......he was no longer able to stand back up.'
56327: '@rGeorge didn''t have a clue what was going on.@k However, he had thought it strange the whole time.'
56328: '@rOf course it was strange that he should be called out to a place like this at a time like this.'
56329: '@r.........And yet,@w166. ......how could he have guessed that something was wrong...?'
56330: '@rAfter all,@k ......his own uncle...@khad told him that his grandfather was calling for him from the family conference.@k ......How could he have gotten suspicious......?'
56331: 'Rudolf@r@v08/71200251."......Sorry ''bout this, George-kun.@k@v08/71200252. It hurts, doesn''t it?@k @v08/71200253.If I knew it''d be like this, it''d have been more merciful to blow your brains out from behind.@k@v08/71200254. I thought it''d be too cruel to finish you off before you knew what hit you, but it looks like I got it backwards."'
56332: 'George@r@v07/70300214.".........Wh-@v07/70300215.......why,@v07/70300216. Uncle Rudolf......?@k@v07/70300217. ......Why would...@v07/70300218....my kind uncle...@v07/70300219....do...@v07/70300220....this............?"'
56333: 'Rudolf@r@v08/71200255."Just forget about all this.@k@v08/71200256. By tomorrow night, none of it will have happened."'
56334: '@rWith a quick use of the lever handle, he loaded another bullet.'
56335: '@rThe casing of the bullet that had pierced George''s side fell heartlessly in front of him...'
56336: 'Rudolf@r@v08/71200257."Everyone''s gonna die in a sudden, unfortunate accident.@k@v08/71200258. Until that moment, we''ll all have been a big, happy family.@k@|@y@v08/71200259. ......That''s how it''s gonna be.@k@v08/71200260. So don''t worry about this.@k@v08/71200261. Forget it all."'
56337: '@rOf course, George didn''t have a clue what Rudolf was talking about.'
56338: '@rAll he knew was that Rudolf wanted to kill him, and that he showed no trace of hesitation...'
56339: '@r......The image George had of Rudolf as the ideal cool, joke-loving adult...@k...didn''t match up with the Rudolf standing in front of him, holding a gun.'
56340: '@rNo, maybe it didn''t fit because it fit too well.'
56341: '@rEven though there was a gun in his hands,@k ......Rudolf had a huge smile on his face, as though he was about to tell some hilarious joke.'
56342: '@r......Why would that kind, funny...@w500....Uncle Rudolf...@w500.......do this......?'
56343: '@rIt made him feel unimaginably sad, ......and tears flowed from his eyes.'
56344: 'George@r@v07/70300221."Ungh, ......uughh... ...Uncle Rudolf......@k@v07/70300222. ......I......admired you so much......"'
56345: 'Rudolf@r@v08/71200262."Haven''t I always told you, George-kun?@k@v08/71200263. ......To make sure you don''t end up as an adult like me?@k@|@y@v08/71200264. Now you see.@k@v08/71200265. In the next world, make it your first priority to learn how to recognize a real bastard.@k@v08/71200266. .........I know you can do it.@k@v08/71200267. After all, it''s just another kind of studying."'
56346: 'George@r@v07/70300223."Uu...khh......rrrraaaaaaaaaaaaaaaaahhhhhhhh!!"'
56347: '@rBiting down the pain in his side,@k ......and summoning the last of his strength, George threw his whole body into a roundhouse kick.'
56348: '@rAt the same time, fire spat from Rudolf''s gun.'
56349: '@r......The bullet pierced George''s chest.@k@rGeorge twisted and fell as blood gushed from the wound.'
56350: '@rHe moaned wordlessly, clenching blood-stained teeth.@k@rThe frigid gun was pressed harshly against his temple.'
56351: 'Rudolf@r@v08/71200268."So long.@k@v08/71200269. ......Go become a great man in the next world.@k@v08/71200270. Don''t get blinded by money like me."'
56352: 'George@r@v07/70300224."......I can''t believe...@v07/70300225....that my uncle...@v07/70300226.......would kill for money......@k@v07/70300227. Khghaaaahhhhh........."'
56353: 'Rudolf@r@v08/71200271."You''re so innocent.@k@v08/71200272. ......People can.@k@v08/71200273. Kill for money."'
56354: '@rThe ruthless trigger forestalled any further questions.'
56355: '@rGeorge''s hands, which had been covering his wound, dropped lifelessly......'
56356: '@rAfter Rudolf saw the last glimmer of life leave him, he let out a deeply exhausted sigh he''d been holding back for some time.'
56357: 'Rudolf@r@v08/71200274."Hahh. ......Hahahahahahahahahaha.@k@v08/71200275. .........I expected worse."'
56358: '@rRudolf looked up into the dark, rainy sky, the rain drops hitting him full in the face,@k ......and laughed with an indescribable expression, his tongue hanging out.'
56359: 'Rudolf@r@v08/71200276."I figured my conscience would be giving me a harder time.@k@v08/71200277. ......Now that it''s over, ...I''m surprised how little I feel."'
56360: '@r*chuckle*chuckle*,@w583. gahahahahahaha.@k@rRudolf started laughing.@k@rThis was probably just the thing Kyrie had hoped for.'
56361: '@rIt had taken some effort to kill George.'
56362: '@r......Though he had been merciless, the last traces of conscience in Rudolf''s heart had probably slowed him down.'
56363: '@rHowever, now that he had killed someone with his own hands, a turning point that few people ever reach, ......Rudolf had finally awakened.'
56364: '@r...No, he finally understood.'
56365: 'Rudolf@r@v08/71200278.".........It''s exactly the same as screwing suckers out of their money.@k@v08/71200279. .........The same old game of musical chairs.@k@v08/71200280. When there''s a pile of money up for grabs, there''s no prize for taking your time.@k@v08/71200281. The slow ones just get kicked down to hell."'
56366: '@rI''ve scammed dozens of unfortunate saps and buried them in debt.'
56367: '@rSeveral of them probably ended up bankrupt, and some of those might''ve hanged themselves.@k And I always laughed, saying that wasn''t my problem.'
56368: '@rThat''s all there is to it.'
56369: '@rThe only difference now is that, for the first time,@k .........I''ve dealt the final blow with my own hands.'
56370: 'Rudolf@r@v08/71200282.".........Thanks, Kyrie.@k@v08/71200283. ......You''re always the best at cutting away my naivety.@k@v08/71200284. ......Heheheh, ...hehhahahahahahahaahah!@k @v08/71200285.Hyahhhahahahahahahahahaahahahaha!!!"'
56371: '@rRudolf''s evil laugh rang out.'
56372: '@rThe laugh was so purely evil, it was almost refreshing.@k@rEvil that still has a conscience and thinks itself good is far more repulsive to behold.'
56373: '@rIf a man commits himself to an evil act, how much more pleasant and graceful it is when he is honest about his intentions.'
56374: '@rIn that sense, Rudolf''s evil smile and laugh...@k.........truly were pleasant and graceful......'
56375: '@r......And so.'
56376: '@rSurely the brutal, bloody stage of the dining hall......was also refreshing.'
56377: '@rA clang.@|@y@k A thud.@|@y@k A crack, a squish.@|@y@k ......A strange mixture of these sounds kept repeating over and over at the same tempo.'
56378: '@r......Each time, a red splash landed on the nearby dangling tablecloth.'
56379: 'Kyrie@r@v09/71300206."Jessica-chan, .........are you listening......?"'
56380: '@rKyrie asked this with the sort of smile any aunt might make to her niece.@k@rHowever, Jessica didn''t answer.'
56381: '@rThere was nothing particularly surprising about this.'
56382: '@r......After all, by now,@w500. ......her nose was broken,@w166. her eyes had been smashed,@w500. ......her teeth had been knocked out,@w583. ......and not only her nose, but her entire face was now hardly recognizable as a face,@w583. ......just a lump of bloody flesh......'
56383: '@rKyrie finally stopped her task of repeatedly smashing Jessica''s face with the stock of her gun.'
56384: '@rStill sitting on top of Jessica, Kyrie tossed her gun to the side, ......pulled a compact out of her pocket, and looked at her own face in the mirror.'
56385: '@rThen, finally, ......she realized that her face was covered by speckles of fresh blood.'
56386: 'Kyrie@r@v09/71300207."How terrible.@k@v09/71300208. These clothes will have to go too.@k@v09/71300209. ......*cackle*cackle*, *cackle*cackle*cackle*cackle*!!"'
56387: '@rWith a muffled laugh, Kyrie shakily rose to her feet.'
56388: '@rJessica wasn''t moving anymore.@k ......She had been convulsing a bit until a second ago, but now, she was as still as stone.'
56389: 'Kyrie@r@v09/71300210."......When it comes to punching women in the face,@k@v09/71300211. your aunt is an old pro.@k@v09/71300212. Sorry about that.@k@v09/71300213. .........If you hadn''t resisted, I could''ve let you have a much cleaner death."'
56390: '@rKyrie pulled the tablecloth off and used it like a towel to wipe the blood from all over her body.'
56391: '@rHowever, instead of taking the blood off, it just smeared it around,@k ......and did nothing to remove the stench of blood and death that covered her.'
56392: '@rWhen she got tired of smearing blood over the tablecloth, Kyrie walked over to the extension telephone in the corner of the room.'
56393: '@rThen, she dialed the number for the cousins'' room in the guesthouse......'
56394: 'Kyrie@r@v09/71300214.".........Hello.@k@v09/71300215. It''s me.@k@v09/71300216. .........It''s your turn now, Battler-kun.@k@v09/71300217. ......You''re next to go to the front of the chapel.@k@v09/71300218. ............Yes, that''s right.@k@v09/71300219. I haven''t been given any instructions about Maria-chan.@k@v09/71300220. Have her wait there.@k@v09/71300221..........*giggle*.@k@v09/71300222. Yes, take it seriously.@k@v09/71300223. ......I''m rooting for you to be chosen as the successor."'
56395: '@rWith the same smile as usual and the partly-wiped splashes of blood still covering her face, ......Kyrie finished her call to Battler.'
56396: '@rWhen she set down the receiver, there was a small knock, and Rudolf came back into the room.'
56397: 'Rudolf@r@v08/71200286.".........Whoa, what a mess."'
56398: 'Kyrie@r@v09/71300224."Jessica-chan has better reflexes than I gave her credit for.@k@v09/71300225. I didn''t expect her to knock the gun away when she did."'
56399: 'Rudolf@r@v08/71200287."It''s a bit of a shame she had to end up looking like this.@k@v08/71200288. ......What a waste of the good looks she got from Natsuhi nee-san."'
56400: 'Kyrie@r@v09/71300226."And how about your end?@k @v09/71300227.Did he give you much trouble?"'
56401: 'Rudolf@r@v08/71200289."No problems there.@k@v08/71200290. Plain and simple."'
56402: '@rWhen Kyrie heard Rudolf''s instant response, she favored him with an evil smile.'
56403: '@rYes, the man she loved was the sort who could do whatever he put his mind to, without letting cheap emotions get in the way...'
56404: 'Kyrie@r@v09/71300228."I love you, Rudolf-san.@k@v09/71300229. I wouldn''t have it any other way."'
56405: 'Rudolf@r@v08/71200291."It''s hard to imagine an easier job to net you a billion yen.@k@v08/71200292. ......It''s like Dad always said.@k@v08/71200293. In the life of every man, there comes one day where he has to be willing to kill."'
56406: 'Kyrie@r@v09/71300230."In other words, always be willing to kill if your own survival depends on it.@k@v09/71300231. ......That''s my favorite of the things he used to say."'
56407: 'Rudolf@r@v08/71200294."What''s next?@k @v08/71200295.My rifle is hungry for blood."'
56408: 'Kyrie@r@v09/71300232."You''ve got a big job coming up.@k@v09/71300233. Convincing Battler-kun."'
56409: 'Rudolf@r@v08/71200296."Ah, that''s right.@k@v08/71200297. That''ll be a pain.@k@v08/71200298. Hope I don''t have to end it by pulling the trigger."'
56410: 'Kyrie@r@v09/71300234."I''m fond of it, you know.@k@v09/71300235. ......Our little family of three with Ange.@k@v09/71300236. ......But, if you really want Battler-kun to join in on that, ......good luck."'
56411: 'Rudolf@r@v08/71200299."Sure.@k@v08/71200300. .........I''m not gonna give him the room to argue back.@k@v08/71200301. Don''t worry, I''ve worked out a scenario to trick him good."'
56412: 'Kyrie@r@v09/71300237."Good luck.@k@v09/71300238. I do hope for Ange''s beloved big brother not to get caught up in an explosion accident if it can be avoided."'
56413: 'Rudolf@r@v08/71200302."I know.@k@v08/71200303. Alright, I''m heading back to the chapel."'
56414: 'Kyrie@r@v09/71300192."Rudolf-san."'
56415: 'Rudolf@r@v08/71200304."What...?"'
56416: 'Kyrie@r@v09/71300240.".........If Battler-kun doesn''t buy it..."'
56417: 'Rudolf@r@v08/71200305."...........................@k@v08/71200306. ......I know, I know.@k@v08/71200307. If it comes to that, bang."'
56418: 'Kyrie@r@v09/71300241."Remember, Battler-kun is the type to take action, so much so that he left the family out of protest when I married you.@k @v09/71300242.......If your story to him isn''t airtight, and he starts questioning things later on,@k@v09/71300243. ......he''ll prove fatal to us."'
56419: 'Rudolf@r@v08/71200308."I know.@k@v08/71200309. Believe in me."'
56420: 'Kyrie@r@v09/71300244.".........So...@k@v09/71300245.if I decide that Battler-kun is the least bit suspicious,@k@|@y@v09/71300246. ......I''ll kill him myself.@k@v09/71300247. He''s not my kid, after all."'
56421: 'Rudolf@r@v08/71200310."......Yeah,@k@v08/71200311. I know.@k@v08/71200312. .........So, Kyrie,@k@v08/71200313. promise me one thing."'
56422: 'Kyrie@r@v09/71300248."What''s that...?"'
56423: 'Rudolf@r@v08/71200314."If.........I can trick Battler, and the three of us make it off this island..."'
56424: 'Kyrie@r@v09/71300249.".........Yes?"'
56425: 'Rudolf@r@v08/71200315."..............................@k@v08/71200316. ......Never say that Battler isn''t your kid again.@k@v08/71200317. ......You''re......his mother.@k@v08/71200318. ......Please."'
56426: 'Kyrie@r@v09/71300250.".....................@k@|@y@v09/71300251. ......Sure, I promise."'
56427: '@rKyrie shrugged and answered as she loaded bullets.'
56428: 'Kyrie@r@v09/71300252."You go to the chapel.@k@v09/71300253. I''ll wait until Battler-kun has left, and then clean up everything inside the guesthouse."'
56429: 'Rudolf@r@v08/71200319."Sure you''ll be alright doing that alone?"'
56430: 'Kyrie@r@v09/71300254."You worry about yourself."'
56431: '@rBattler left the guesthouse under an umbrella.'
56432: '@rHe had been called to the area in front of the chapel, just like George had been.'
56433: '@rNot even half an hour had passed since the time George and Jessica had been called out.@k@r......Apparently, this test didn''t last too long.'
56434: 'Battler@r@v10/70100181."......Damn geezer.@k@v10/70100182. You didn''t even show up for lunch, and now you show up in the middle of a night with a test.@k@v10/70100183. ......I''ll bet living as a shut-in''s got his sense of day and night all backwards."'
56435: '@rComplaining all the way, Battler strolled off into the rain.'
56436: '@rAlmost immediately, he was swallowed up by the darkness of the rose garden and passed out of sight......'
56437: '@r.........And then...'
56438: '@rKyrie could be seen coming out from the darkness of the rose garden.'
56439: '@rHer right hand held a gun.@k Her left an umbrella.'
56440: '@rHer inner pocket contained the master key ring she had stolen from Gohda.'
56441: '@rHer right pocket had a handful of bullets.@k Her left held a knife she had taken from the kitchen.'
56442: '@rShe was a carefully and perfectly outfitted murderer.'
56443: '@rAnother bolt of lightning struck down from the swirling skies.@k It lit up only half of Kyrie''s face.'
56444: '@rHer cheek......was still covered with Jessica''s blood......'
56445: '@rUnder the eaves, Kyrie folded up her umbrella, smiled, and spoke to no one.'
56446: 'Kyrie@r@v09/71300255."How''s it going, everyone?"'
56447: '@rRudolf could be seen under the eaves of the chapel.@k@rHe had hidden his gun in the nearby shadows and was now smoking a cigarette...'
56448: 'Rudolf@r@v08/71200320.".........Should be easy to trick that dimwit.@k@v08/71200321. ......And if it doesn''t work, that''s just too bad."'
56449: '@rHe glanced over at the place he had stowed his gun.@k@rThe cigarette smoke began to pleasantly cloud his mind.'
56450: '@r......Battler isn''t a kid anymore.@k He''s an adult, who can choose his path through life as he pleases.'
56451: '@rWhen animals grow up, it''s normal for them to leave their group and go on a journey.@k@rHumans are the only ones that keep treating them like kids even after they get big......'
56452: 'Rudolf@r@v08/71200322.".........If it was gonna come to this,@k@v08/71200323. I should never have begged for you to come back.@k@v08/71200324. .........I regret......dragging you back into the family......"'
56453: '@rHe puffed out those words...@w583....along with the smoke.'
56454: '@rWhen Battler came, he didn''t intend to voice those regrets of his.'
56455: '@rRudolf had already determined to play the part of the evil murderer who kills for money......'
56456: 'Rudolf@r@v08/71200325."......He''s still not here.@k@v08/71200326. .........What''s taking him so long?"'
56457: '@rAt that moment, he heard the sound of someone stepping on gravel.'
56458: '@rHe looked up, thinking that Battler had finally arrived, ......but the sound had come from the direction opposite of the mansion.'
56459: 'Rudolf@r@v08/71200327."...........................!"'
56460: 'Eva@r@v05/71000304."......Rudolf.........@k@v05/71000305. ...How could you...@v05/71000306. .........How could you...do that to my husband......?!!"'
56461: 'Rudolf@r@v08/71200328."Aneki...... So, you''re alive......"'
56462: 'Eva@r@v05/71000307."Yeah, sorry, but I lived...@v05/71000308. Too bad!@k @v05/71000309.But my husband wasn''t so lucky...@v05/71000310. How could you...@v05/71000311. ......How could you...?!!"'
56463: '@rWith a face obscured by anger and tears, Eva slowly walked closer, her gun raised.'
56464: '@rHer husband had been killed right in front of her.@k She probably wouldn''t even hesitate.'
56465: '@rRealizing that a gun, quivering with anger, was pointed right at his chest, Rudolf backed away.'
56466: '@rAs he pretended to back away, ......he approached the gun he had hidden in the shadows.'
56467: 'Rudolf@r@v08/71200329."C-calm down, Aneki......@k@v08/71200330. Put the gun down...@k@v08/71200331. ......I never wanted that to happen.@k@v08/71200332. Everything happened so fast. There was nothing I could do...!"'
56468: 'Eva@r@v05/71000312."How can you say such half-baked lies?!!"'
56469: '@rAs Eva had said, it really had been a half-baked, pointless thing to say.'
56470: '@rRudolf would have said anything if he thought it would calm Eva''s emotions before she pulled the trigger, which she looked capable of doing at any moment now...'
56471: '@r......Then, Rudolf''s foot came in contact with his gun.'
56472: 'Rudolf@r@v08/71200333."L-let''s just talk this over.@k@v08/71200334. ......George-kun should be here soon.@k@|@y@v08/71200335. ......Oh.@k@v08/71200336. ...Hey, George-kun, we''re over here."'
56473: '@rRudolf waved, as though George was coming from behind Eva.'
56474: '@rLet Eva''s attention turn in that direction......'
56475: '@r.........That idiot...@k My simple, big sister has always been a sucker.'
56476: '@rDie!!!'
56477: '@rGunfire. '
56478: '@r......Then, a bit later, the sound of something heavier than rain......drip-dropping onto the cobblestone floor.'
56479: 'Rudolf@r@v08/71200337."...............Agh,@v08/71200338. ..................nggg........."'
56480: 'Eva@r@v05/71000313.".........Rudolf...@k@v05/71000314. I''ve always been able to see through your tricks...!!"'
56481: '@rThe bullet Eva fired had struck Rudolf square in the chest.@k@rThe bullet Rudolf fired had missed, landing near Eva''s feet.'
56482: 'Rudolf@r@v08/71200339."Guess I was right...@v08/71200340. This gun...@v08/71200341.......does shoot...@v08/71200342....low......"'
56483: '@rHe dropped the gun into a puddle with a splash, staggered backwards, and leaned against the wall of the chapel.'
56484: 'Rudolf@r@v08/71200343."Nah, that''s not it......@k@v08/71200344. .........All good westerns end......with the bad guy''s bullet missing......"'
56485: '@rEva dashed up to him, kicked away the gun that had fallen into a puddle, and grabbed Rudolf by the collar.'
56486: 'Eva@r@v05/71000315."What about George?!@k @v05/71000316.Where is he?!@k @v05/71000317.I won''t let you kill him...!!"'
56487: 'Rudolf@r@v08/71200345.".........Sorry, Aneki.@k@v08/71200346. ......The deed''s...already done."'
56488: 'Eva@r@v05/71000318."You''re lying!!"'
56489: 'Rudolf@r@v08/71200347."......Did it in the bushes over there.@k@v08/71200348. ......Go take a look.@k@v08/71200349. You''ll see......"'
56490: 'Eva@r@v05/71000319."...............R-@v05/71000320.......Rudolf......@v05/71000321....you............"'
56491: '@rEva, who said she had always been able to see through her little brother''s tricks,@k ......also knew that Rudolf''s final words, as his consciousness began to fade from having been shot, were not a lie.'
56492: 'Eva@r@v05/71000322."How could you...... .........George... Geoooooooooooooooooorge!!!"'
56493: '@rAn empty shell casing bounced off the cobblestone.@k The furious gun barrel was pressed against Rudolf''s forehead.'
56494: 'Rudolf@r@v08/71200350.".........Go ahead and shoot.@k@v08/71200351. ......I doubt that''ll bring you much peace though."'
56495: '@rA bolt of lightning turned everything white.@k@rHowever, the wall of the chapel......was stained blood red.'
56496: '@rA red splash like a crushed tomato covered the wall behind Rudolf''s head......'
56497: '@rThen, leaving a red trail behind him,@w500. ......Rudolf slid down the wall,@w500. sat on the ground, and fell over.@|@y'
56498: 'Eva@r@v05/71000323."George, Geooooooooorge!!@k @v05/71000324.Geooooooooorge, uwaaaaaaaaaaaahhh!!"'
56499: '@rEva dashed off towards the bushes.@k ......She found George''s corpse almost immediately, screamed, and broke down sobbing.'
56500: '@r......Rudolf''s bloody corpse was exposed to the rain that ran down off the eaves.'
56501: '@rHis eyes were still wide open.@k A ragged, fist-sized hole had been torn open in the back of his head, ......exposing its contents to the open air.'
56502: '@rInside was minced flesh and bright red jelly.'
56503: '@rThat goop, which looked like someone had mixed it up with a spoon, dripped from his eyes, nose, ears, mouth, and the hole in his head......'
56504: 'Ange@r@v11/72000115.".........Dad......Dad......@k@v11/72000116. ......Aaaaaaaaahhh...!!!"'
56505: '@rAnge clutched at her head, sobbing and moaning.'
56506: '@rHer father had dirtied his hands with murder over money, and on top of that, he had faced such a cruel end, and Ange had been forced to see his corpse.@k It was hard to imagine a more painful experience for a daughter to go through.'
56507: '@r......I''m totally fed up with this. It''s completely meaningless.'
56508: 'Lion@r@v53/75300710."BERNKASTEL-san...!@k @v53/75300711.I know you''re here somewhere!@k @v53/75300712.Please, make this game stop...!!@k @v53/75300713.There''s no point to it!"'
56509: '@rAs if in answer to that yell, ......a black shadow appeared a few seats in front of them.'
56510: '@rOr perhaps she had been sitting there the whole time.'
56511: '@rMaybe we just couldn''t see her until we realized she was there.'
56512: '@rIt was, without a doubt, the back of BERNKASTEL''s head.'
56513: 'Lion@r@v53/75300714."BERNKASTEL-san......!!"'
56514: 'BERNKASTEL@r@v28/72100261."......Pipe down back there.@k@v28/72100262. Can''t you watch the show quietly?"'
56515: '@rThe witch turned around with bored eyes.@k ......As though the two who were yelling were the strange ones.'
56516: 'Lion@r@v53/75300715."Please stop this...!@k @v53/75300716.We realize that this world is the sealed cat box world of October 4th and 5th...!"'
56517: '@rThe games are like messages.'
56518: '@rOr maybe more like a roundabout love letter,@k conveying a single message over several games.'
56519: '@rBut we already understand.@k We know that endless tales can seep out of the sealed, two-day cat box.'
56520: '@rAnd beyond that, I even know the culprit and the motive.@k That has already been revealed, and it has nothing to do with this game.'
56521: 'Lion@r@v53/75300717."We both know the answer, that this is a cat box tale...!@k @v53/75300718.So, there shouldn''t be any reason to hold further games like this...!!@k @v53/75300719.If this is supposed to be a game between you and us, then we already know the answer...!!@k @v53/75300720.The game should be able to end now!!"'
56522: 'LAMBDADELTA@r@v29/72200001."Just shut up already.@k@v29/72200002. Didn''t you hear Bern tell you to be quiet?"'
56523: '@rAnother shadow appeared in the next seat over, turned around, and scolded the pair.'
56524: 'BERNKASTEL@r@v28/72100263.".........There is a point.@k@v28/72100264. If you just watch, you''ll see it.@k@v28/72100265. ......*giggle*giggle*."'
56525: 'Lion@r@v53/75300721."Are you the Game Master...?!"'
56526: 'BERNKASTEL@r@v28/72100266."......Not at all."'
56527: 'Lion@r@v53/75300722."Then who is it?!@k @v53/75300723.Could it be.........Clair...?"'
56528: 'BERNKASTEL@r@v28/72100267."If you watch, you''ll see.@k@v28/72100268. Not much longer now.@k@v28/72100269. ......*giggle*giggle*."'
56529: 'LAMBDADELTA@r@v29/72200003."The tragedy is already reaching its climax.@k@v29/72200004. Who''ll survive, I wonder?@k@v29/72200005. Eheheheheheheheheh......"'
56530: '@rBERNKASTEL isn''t the Game Master...?'
56531: '@rThen who is?@k@rCould Clair have created this cruel tale......?'
56532: '@rOr are there even more witches playing around with this cat box......?'
56533: '@rThe guesthouse......was wrapped in silence.'
56534: '@rThere were no sounds.'
56535: '@rNo trace of anyone''s presence.@k No breathing from anyone alive.'
56536: '@rThere wasn''t anything to be heard anymore......'
56537: '@rIf there was a sound...@k@rThen that would be only the sound of a murderer''s feet stepping across the floor......'
56538: '@rKyrie slowly passed through the lounge.'
56539: '@rIn her right hand...was a gun.@k@rIn her left hand...was a knife.'
56540: '@rThe knife was stained with blood, and some was still dripping from the tip,@k ......leaving behind red tracks like a demon''s footprints......'
56541: '@rHer hands were filled with tools of murder.@k@rSo, she wasn''t capable of doing anything but murder.'
56542: '@rIn that sense, at this moment, she was nothing more than a pure and unadulterated murderer.'
56543: '@r......The murderer reached the front door, and then, finally, she looked down at her blood-stained hands.'
56544: '@rThe hands that carried the tools of death with which she had performed her cruel massacre.'
56545: '@rAt last, the murderer realized that she couldn''t even open the door like this, and threw away the knife in her left hand...'
56546: '@rThen, she placed her hand on the door, turned around calmly, ......and spoke.'
56547: 'Kyrie@r@v09/71300256."Sorry, everyone.@k@v09/71300257. ......But don''t worry.@k@v09/71300258. In a few days, the newspapers will be talking about an unfortunate accident.@k@v09/71300259. ......And I''m sure the news shows, newspapers, and all the rumor-spreading people will say that you must have spent your time in happy ignorance until the instant of the accident.@k@v09/71300260. ......In other words, that''ll mean you all had a good time until midnight on October 5th."'
56548: '@rSo said the one who had stained the guesthouse red.'
56549: 'Kyrie@r@v09/71300261."At this hour, the cousins are all staying up late and playing around.@k@v09/71300262. ......The servants who have the morning shift are all snoring.@k@v09/71300263. The ones on the late shift are probably filling in the log or taking a break about now."'
56550: 'Kyrie@r@v09/71300264.".........That''s how it is.@k@v09/71300265. From where I am now, I can hear the laughter coming from the cousins'' room.@k@v09/71300266. ...............*giggle*."'
56551: '@rHumans outside the cat box would probably never understand what Kyrie was saying.'
56552: '@rOnly she, shut inside the cat box of the explosion accident, could understand the true meaning of her words......'
56553: '@rOutside, the rain poured down heavily.'
56554: '@rKyrie almost picked up an umbrella, but then stopped suddenly, as if she''d just thought of something.'
56555: '@rThen, she started walking out into the rain, not caring at all whether she got wet or not...'
56556: '@rDid the murderer not want an umbrella to get in the way of her pointing her gun?@k ......Or was she hoping that the rain could act as a shower to get the blood off her?'
56557: 'Kyrie@r@v09/71300267."......................................."'
56558: '@rKyrie stopped walking.@k As though something unexpected had caught her attention.@k@rHowever, this time, it was no whim of hers......'
56559: 'Eva@r@v05/71000325.".........How could you...@v05/71000326....kill my husband......?!!!"'
56560: 'Kyrie@r@v09/71300268."Oh,@k@v09/71300269. ......Eva nee-san.@k@v09/71300270. .........That''s surprising.@k@v09/71300271. How could I have missed you from that distance?"'
56561: 'Eva@r@v05/71000327."I''m just as surprised.@k@v05/71000328. I still can''t believe I survived."'
56562: 'Kyrie@r@v09/71300272."......You came here from the underground stairway behind the chapel, right?@k @v09/71300273.......In that case—"'
56563: 'Eva@r@v05/71000329."That''s right.@k@v05/71000330. I bumped into Rudolf in front of the chapel!"'
56564: 'Kyrie@r@v09/71300274."Did he look well?"'
56565: 'Eva@r@v05/71000331."Oh, yes.@k@v05/71000332. It''s been a while since we siblings had a nice chat."'
56566: 'Kyrie@r@v09/71300275.".....................@k@v09/71300276. ......I see.@k@v09/71300277. ......He''s such a show-off, but so unreliable in a tight spot.@k@v09/71300278. ......Looks like he''s hopeless without me after all."'
56567: '@rKyrie had already realized that Rudolf had been killed.'
56568: '@rHowever, no trace of urgency or panic rose to her face.'
56569: '@rShe just closed her eyes with her usual unconcerned expression,@k ......and when she opened them again, she had regained her composed smile.'
56570: 'Kyrie@r@v09/71300279.".........Thank you.@k@v09/71300280. I''m grateful.@k@v09/71300281. Now I really can have everything to myself."'
56571: 'Eva@r@v05/71000333."What''s that blood on your clothes...?@k @v05/71000334.You just came out of the guesthouse, didn''t you......?@k@v05/71000335. ......Don''t tell me......"'
56572: 'Kyrie@r@v09/71300282."Yes, that''s right.@k@v09/71300283. ......I''m in the middle of a murder right now."'
56573: 'Eva@r@v05/71000336."You killed them?!@k @v05/71000337.All of them?!!@k @v05/71000338.Even Maria-chan...?!"'
56574: 'Kyrie@r@v09/71300284."There was no reason to let them live until morning.@k@v09/71300285. When morning came, there would be an uproar, and that could prove to be a pain.@k@v09/71300286. They might have used a wireless to contact someone off the island and gotten help.@k@v09/71300287. ......So, this was clearly the best move to take.@k@v09/71300288. If you flip over the chessboard and look at it that way."'
56575: 'Eva@r@v05/71000339."Monster!!@k @v05/71000340.I can''t believe you''re so blinded by greed that you committed murder...!!"'
56576: 'Kyrie@r@v09/71300289."Don''t forget what you did yourself."'
56577: 'Eva@r@v05/71000341."That was an accident!!@k @v05/71000342.I didn''t mean to kill them!@k @v05/71000343.I''m not like you!!"'
56578: 'Kyrie@r@v09/71300290."Oh, yes, you are.@k@v09/71300291. ......If that gun hadn''t gone off, you would have kept on arguing and grappling with each other.@k@v09/71300292. If you had, then the two of you would eventually have reached the same answer as I did, just a few steps slower."'
56579: 'Eva@r@v05/71000344."I''m not a murderer!!"'
56580: 'Kyrie@r@v09/71300293."Not true.@k@v09/71300294. You''re absolutely a murderer, just one who didn''t get a chance.@k@v09/71300295. You were saved by an accidental discharge, that''s all.@k@v09/71300296. .........If it weren''t for that bit of good luck, and if I hadn''t sprung into action before you did,@k@v09/71300297. ......then you would have played the same role I''m playing now.@k@v09/71300298. That is a fact, a truth of an alternate future, and it won''t go away no matter how much you try to deny it."'
56581: 'Eva@r@v05/71000345."D-don''t try and confuse me!"'
56582: '@rHowever, ......on the inside, Eva understood.'
56583: '@rBack then, she probably had been saved by that coincidental misfire.'
56584: '@rIf the argument had continued much longer, she would surely have grown a desire to kill Krauss and the others, and might even have carried it out.'
56585: '@r......She simply could not deny the existence of that demon deep within her heart.'
56586: '@rOnly the theatergoers knew.@k@rThey knew that she could become a killer in another world.'
56587: '@rAnd Kyrie, who did not have the theatergoing ability, knew this fact also.@k ......Apparently, she really was an extraordinary person.'
56588: '@rSo, for some time, Eva could only grind her teeth in silence, still pointing her gun......'
56589: 'Eva@r@v05/71000346."......I don''t understand.@k@v05/71000347. You''re also a mother, you''ve felt the pain of giving birth to your own child.@k@v05/71000348. How can you not know how precious a life is...?!@k @v05/71000349.How are you capable of doing all this...?!"'
56590: 'Kyrie@r@v09/71300299."You can create a child without even trying."'
56591: 'Eva@r@v05/71000350."What does that have to do with anything...?!!"'
56592: 'Kyrie@r@v09/71300300."Children are bonds...is what I mean."'
56593: 'Eva@r@v05/71000351."What?!"'
56594: 'Kyrie@r@v09/71300301."Children are bonds that can tie you to your husband.@k@v09/71300302. ......In my case, a bond to make Rudolf-san acknowledge me, so I could take him back from that woman."'
56595: 'Kyrie@r@v09/71300303."But you''ve killed Rudolf-san now.@k@v09/71300304. So, .........you understand what that means, right?"'
56596: 'Eva@r@v05/71000352."What do you mean...@v05/71000353....I understand?!"'
56597: 'Kyrie@r@v09/71300305."Right now,@k@v09/71300306. I''m no man''s wife, so there''s no need for me to be a mother.@k@v09/71300307. ......I am me.@k@v09/71300308. Kyrie.@k@v09/71300309. Now that Rudolf-san''s dead, I''m not even an Ushiromiya anymore.@k@v09/71300310. I live to benefit me."'
56598: 'Eva@r@v05/71000354."Right, Rudolf is dead, so maybe you aren''t a wife anymore.@k@v05/71000355. But you still have Ange-chan, right...?!@k @v05/71000356.You''re still a mother, aren''t you...?!"'
56599: 'Kyrie@r@v09/71300311."Didn''t you hear what I just said about bonds?@k@v09/71300312. Now that Rudolf-san is gone, Ange is of no use to me."'
56600: 'Eva@r@v05/71000357."......Y-@v05/71000358....you......@v05/71000359. How can any mother say that about her own daughter?!"'
56601: 'Kyrie@r@v09/71300313."Eva nee-san.@k@v09/71300314. Let''s put a stop to this.@k@v09/71300315. Stop pretending to be so noble."'
56602: 'Eva@r@v05/71000360."Pretending...?!"'
56603: 'Kyrie@r@v09/71300316."Did either of us marry because we wanted children?@k @v09/71300317.We didn''t, right?@k @v09/71300318.We married because we wanted to live with the man we loved.@k @v09/71300319.And, once you''ve married, you never want to let that man go, for the rest of your life, correct?@k @v09/71300320.Children are weapons to be used for that goal."'
56604: 'Eva@r@v05/71000361."No one would have children for a reason like that...!!"'
56605: 'Kyrie@r@v09/71300321."Some people would have children for a reason like that."'
56606: '@rKyrie kept on speaking emotionlessly, ignoring the falling rain......@k@rHer relaxed smile did not falter for an instant.'
56607: 'Kyrie@r@v09/71300322."Ange was just a chain I used to tie Rudolf-san to me.@k@v09/71300323. ......Or, you could call her a chess piece, someone to play the role of the kid in our family drama.@k@v09/71300324. ......To me, Ange was nothing more than a piece, necessary so that I could act the part of the good mother in front of Rudolf-san."'
56608: 'Eva@r@v05/71000362."......You... ...Could you say that to Ange-chan''s face?!"'
56609: 'Kyrie@r@v09/71300325."Of course, that''d be pointlessly cruel, so I won''t say this to her directly.@k@v09/71300326. I plan to write her a letter asking her to forgive her bad mother, then vanish from her life.@k@v09/71300327. You''ve seen what Rosa-san and Maria-chan are like, right?@k @v09/71300328.Now that Rudolf-san''s gone, Ange''s just a chain tying me down."'
56610: 'Kyrie@r@v09/71300329."......I''ll go back to being just Kyrie, and enjoy the rest of my life at my leisure.@k@v09/71300330. A new challenge, and a new life.@k@v09/71300331. And maybe even a new love.@k @v09/71300332.*giggle*............"'
56611: 'Eva@r@v05/71000363."......And you call yourself human......@k@v05/71000364. ......You call yourself Ange-chan''s mother?!"'
56612: 'Kyrie@r@v09/71300333."*giggle*giggle*.@k@v09/71300334. Who gives a damn about Ange?@k@v09/71300335. She''s a little brat.@k@v09/71300336. I''ve never once felt any affection for her."'
56613: 'Eva@r@v05/71000365."......H-......how can you......"'
56614: 'Kyrie@r@v09/71300337."You''ve been released from your family drama too, haven''t you?@k @|@y@v09/71300338.Let''s sing the praises of a woman''s freedom.@k@v09/71300339. You should thank me for having George-kun killed for you."'
56615: 'Eva@r@v05/71000366."Y-......you.........monsteeeeeeeeeer!!"'
56616: 'Kyrie@r@v09/71300340."Ahhahhahahahahhaaahhhyahhahahahaaaaaaaaaaaahhhhh!!!"'
56617: '@rThe two yells...and the sound of gunfire......thundered across the dark rose garden.'
56618: '@r......Slowly, Eva fell backwards.'
56619: '@rThen, she landed in a puddle, ......scattering countless drops of water.'
56620: '@rAcross from her, Kyrie spun around as though dancing.'
56621: '@rBeautiful, black rose petals scattered around her.'
56622: '@rThey were dark red rose petals.'
56623: '@r......As these rose petals sprayed from her throat, she spun around in a circle,@k ......and slowly crumpled.'
56624: '@rThen, she fell to the ground, sending muddy water flying.'
56625: '@rThe two women had both fired their guns......and fallen.........'
56626: '@rHowever, when the thunder roared, it was only Eva who sat back up...'
56627: 'Eva@r@v05/71000367.".........*pant*...@v05/71000368. .........*pant*...@v05/71000369. ............*pant*......"'
56628: '@rEva hadn''t been shot.'
56629: '@rKyrie''s intensity had made her fall backwards, ......but the bullet had once again only grazed her......'
56630: '@rEva cursed her good luck.@k@rWhy couldn''t this luck have saved her husband or her son?'
56631: 'Eva@r@v05/71000370."............Die there......for Ange-chan''s sake.@k@v05/71000371. .........You''ll be killed in the explosion accident.@k@v05/71000372. Until the moment of your death, you worried about the daughter you left behind.@k@v05/71000373. ......I''ll carve that message...@k@v05/71000374.into the lid of the cat box........."'
56632: 'Kyrie@r@v09/71300341."......................................."'
56633: '@rWhen Kyrie heard this, ......blood dripped from her grinning mouth, and she seemed to say something in response.'
56634: '@rHowever, her voice came out only as globs of blood from the hole in her throat, not words......'
56635: 'Ange@r@v11/72000117."M-......@v11/72000118.Mom......@k@v11/72000119. ......Mom......@v11/72000120. ......Uwaaaaaa......!@k @v11/72000121.It''s...@v11/72000122.a lie...@v11/72000123. .........It''s all a lie...!!@k @v11/72000124.Aaaaaaagggghhhhhh...!!"'
56636: 'Lion@r@v53/75300724."Ange, ...please, calm down...!@k @v53/75300725.This is just a game...!@k @v53/75300726.That couldn''t possibly be what your mother truly feels...!@k @v53/75300727.It''s just something that the Game Master made Aunt Kyrie''s piece say...!!"'
56637: '@rBut saying that did nothing to calm Ange''s sobs.'
56638: '@rI don''t blame her.@k Even if she knows it''s just a game, ......she''s been forced to see not only her mother''s death,@k ......but also her mother announcing that she was the culprit of a mass murder, who didn''t even love her daughter.@k Anyone would sob after hearing that...'
56639: 'Lion@r@v53/75300728."BERNKASTEL-san!!@k @v53/75300729.Enough of this!!@k @v53/75300730.I don''t care who the Game Master is!!@k @v53/75300731.Stop this pointless game right now!!"'
56640: '@rWhen Lion yelled this, the theater suddenly went pitch-black, swallowed in darkness.'
56641: '@rHowever, that wasn''t enough to shock Lion.'
56642: '@rLion continued to yell BERNKASTEL''s name into the darkness, telling the witch to stop this game.'
56643: '@rThen, a single beam of light shone down upon the stage.'
56644: '@rThere......was Clair, the one who had appeared for just a second right before this cruel game began.'
56645: 'Lion@r@v53/75300732."Clair...!!@k @v53/75300733.So, ......you were the Game Master after all?!@k @v53/75300734.......I don''t understand! Why?!"'
56646: '@rClair didn''t answer.'
56647: '@r......In fact, ......it looked as though she hadn''t even heard.'
56648: '@rHer eyes were blank, and you couldn''t tell what she was looking at.@k@rIn fact, she was even forgetting to blink...'
56649: '@r......She looked......just like a doll......'
56650: '@rThen, another beam of light lit up the side of the stage.'
56651: '@rUnder that light......stood BERNKASTEL.'
56652: '@rAt the same time, though there appeared to be no one in the audience, a large applause rang out...'
56653: 'BERNKASTEL@r@v28/72100270."........................*giggle*."'
56654: '@rBERNKASTEL raised her right hand in response to the applause.@k@rShe kept doing so until the applause died down......'
56655: 'Lion@r@v53/75300728."BERNKASTEL-san!!@k @v53/75300736.So, ......you were the Master of this game after all...!!"'
56656: 'BERNKASTEL@r@v28/72100271."......Lion.@k@v28/72100272. How many times do I have to tell you that I''m not the Game Master?"'
56657: 'Lion@r@v53/75300737."Then are you saying it''s Clair?!@k @v53/75300738.That''s impossible...!!"'
56658: 'BERNKASTEL@r@v28/72100273."Yep.@k@v28/72100274. That is, of course, impossible.@k@v28/72100275. After all,@k@v28/72100276. Clair is dead.@k@|@y@v28/72100277. .........We were just conducting her funeral.@k@v28/72100278. Did you forget that......?"'
56659: 'Lion@r@v53/75300739."Then just who is standing there......?"'
56660: 'BERNKASTEL@r@v28/72100279."A corpse.@k@v28/72100280. It''s not taxidermy.@k@v28/72100281. So, of course, she still has her insides.@k@v28/72100282. ......She''s hiding it under a beautiful exterior, but she''s actually packed full of guts."'
56661: '@rWhen BERNKASTEL raised her right hand, ......a light fell on it, and a black, shining scythe appeared there.'
56662: '@rIt was a cold, merciless, and cruel object, like something a classic grim reaper might hold.'
56663: 'Lion@r@v53/75300740."Wh-......what are you planning to do.........?"'
56664: 'BERNKASTEL@r@v28/72100283.".........When they''re alive, you can enjoy watching them struggle.@k@v28/72100284. When they''re dead, you can enjoy tearing out their guts.@k@v28/72100285. Tales are things you get to enjoy twice.@k@v28/72100286. ......That''s what it means to be a Witch of Theatergoing."'
56665: '@rBERNKASTEL pressed the blade of her reaper scythe against Clair''s stomach,@k then slowly slid it across.'
56666: '@rThen, along the line she traced, Clair''s dress was sliced open.'
56667: '@rIt was now clear that the scythe she held was not a fake one for theatrical use.@k ......And, it was clear just what she planned to do next that made her cruel smile so fitting.'
56668: 'BERNKASTEL@r@v28/72100287."Ange.@k@v28/72100288. Can you hear me?"'
56669: 'Ange@r@v11/72000125.".........I hear you...@k@v11/72000126. You tear me to bits, make me read!@k @v11/72000127.What''s next?!@k @v11/72000128.Are you showing me this worst possible tale to hurt me even more?!"'
56670: 'Ange@r@v11/72000129."Is this fun for you?!@k @|@y@v11/72000130.Yeah, I''ll bet it is.@k@v11/72000131. I had a grand old time with it too...!@k @v11/72000132.Did you think......that this would be enough to break me?!@k @v11/72000133.You think......I''ll sit around crying any longer because of this disgusting game of yours?!!"'
56671: 'BERNKASTEL@r@v28/72100289."......Both you and Lion...@k@v28/72100290.seem to have the wrong idea.@k@v28/72100291. I''m not the Game Master.@k@v28/72100292. This tale is not one that I created."'
56672: 'Ange@r@v11/72000134."Then that woman in the dress is the Game Master?!"'
56673: 'Lion@r@v53/75300741."No, she isn''t...!@k @v53/75300742.That can''t be!@k @v53/75300743.Then who''s the Game Master?!@k @v53/75300744.Who created this disgusting tale?!!"'
56674: 'BERNKASTEL@r@v28/72100293."You still don''t understand?"'
56675: 'Ange@r@v11/72000135."What don''t we understand?!!"'
56676: 'BERNKASTEL@r@v28/72100294."Ange.@k@v28/72100295. You gambled everything on a faint chance of a miracle, throwing yourself forward.@k@v28/72100296. ......Out of respect for your courage, I invited you to the two-day world of October 4th and 5th, 1986."'
56677: 'BERNKASTEL@r@v28/72100297."......What was your goal?@k @v28/72100298.To take your family back.@k@v28/72100299. ......That would be a very difficult thing, and without the blessing of a miracle, a thoroughly impossible one.@k@v28/72100300. You were prepared for that, weren''t you?"'
56678: 'Ange@r@v11/72000136."Yes, I''m prepared...!!@k @v11/72000137.And I still haven''t given up on Onii-chan, Mom, and Dad!"'
56679: 'BERNKASTEL@r@v28/72100301."Whether you give up or not is your choice.@k@v28/72100302. That''s your own game, after all.@k@v28/72100303. I won''t support you, and I won''t interfere either.@k@v28/72100304. I''ve already enjoyed my fill of games that use you as a piece, so I have no need for you any longer."'
56680: 'Ange@r@v11/72000138."Well, that''s a relief.@k@v11/72000139. Then why am I here?@k @v11/72000140.Didn''t you invite me?!"'
56681: 'BERNKASTEL@r@v28/72100305."Yes, that''s right.@k@v28/72100306. I invited you here.@k@v28/72100307. ......To thank you for entertaining me for a while, as my piece."'
56682: 'Ange@r@v11/72000141."To thank me?!@k @v11/72000142.Ha, so this is how witches show gratitude!!@k @v11/72000143.Yeah, it''s been a real blast, you sick monster!@|@y@k @v11/72000144.How dare you do this to my parents,@v11/72000145. ......putting them in this...@v11/72000146..........this sick game?!!"'
56683: 'BERNKASTEL@r@v28/72100308."Ange.@k@v28/72100309. You made a wish, hoping that you could take your family back.@k@v28/72100310. However, you made one more wish.@k@v28/72100311. Remember?"'
56684: 'Ange@r@v11/72000147."No, I don''t!!"@|@y'
56685: 'BERNKASTEL@r@v28/72100312."You wanted to know what happened on that day."'
56686: '@rWhat happened on Rokkenjima on October 4th and 5th, 1986?'
56687: '@rDidn''t Ange leave on her journey with Amakusa because she longed to answer that question?'
56688: 'Ange@r@v11/72000148."That''s right......@k@|@y@v11/72000149. So what''s your point?!"'
56689: 'Lion@r@v53/75300745."......You don''t............mean......"'
56690: '@rLion realized what BERNKASTEL was getting at.'
56691: '@rAnd because of that, ......Lion was too shocked to speak......'
56692: '@rThe Game Master isn''t BERNKASTEL or Clair.'
56693: '@rThen who is it......?'
56694: '@rThat''s the wrong question.@k There is.........no Game Master.'
56695: '@rThat could mean only one thing......'
56696: 'BERNKASTEL@r@v28/72100313."Ange.@k@v28/72100314. You still don''t understand?"'
56697: 'Ange@r@v11/72000150."......What......?"'
56698: 'BERNKASTEL@r@v28/72100315."This is the truth.@k@v28/72100316. The insides of the cat box of October 4th and 5th, 1986.@k@v28/72100317. After this, Eva survives the explosion by escaping to Kuwadorian.@k@v28/72100318. ......And, since she never spoke of the inside of the cat box no matter how much you wanted to know, that truth was shut within the cat box for all eternity."'
56699: 'Ange@r@v11/72000151."What......are you saying......?"'
56700: 'BERNKASTEL@r@v28/72100319."Only Eva returned alive.@k@v28/72100320. Even though the police claimed it was an accident, the public didn''t believe it.@k@v28/72100321. Then, she took over her husband''s company, and the harder she worked to make it more and more successful, the more enemies she made.@k@v28/72100322. In the eyes of the public, she became viewed as the queen of a vast criminal plot."'
56701: 'BERNKASTEL@r@v28/72100323."......I''m sure she wanted to tell people what really happened.@k@v28/72100324. The truth that no one would ever believe without proof.@k@v28/72100325. .........Bit by bit, Eva''s heart began to snap."'
56702: 'BERNKASTEL@r@v28/72100326."You rejected Eva just like everyone else, so she rejected you in turn.@k@v28/72100327. You were the last two members of your family, and your relationship was completely strained.@k@v28/72100328. Each time she compared you with her beloved son, she grew more and more twisted and broken."'
56703: '@rThen, a strange message bottle was picked up and became a topic of conversation.'
56704: '@rIt contained a bizarre story, one which told of a mysterious serial murder related to the gold on Rokkenjima.'
56705: '@rEveryone rejected the explosion accident theory and started to think up conspiracy theories.'
56706: '@rSome of those theories named Eva as the culprit, which tormented her even more.'
56707: '@rBut Eva used even that to create the cat box.'
56708: '@rAnd until the moment of her death, she protected it.@k@rShe protected the lock that held the cat box shut.'
56709: '@rSo, no Human would ever reach the truth inside the cat box.@k@rNot unless the witches who crossed the sea of fragments opened the lock......'
56710: 'BERNKASTEL@r@v28/72100329."This is the truth."'
56711: 'Ange@r@v11/72000152."...............You''re lying......@k@|@y@v11/72000153. ......You''re lying......lying...!!@k @v11/72000154.If this was actually true, you''d be able to say it using the red truth!!@k @|@y@v11/72000155.But you can''t, of course you can''t!!@k @v11/72000156.Aaaaaaaaaaaaaaaaaaaaaahh!!!"@|@y'
56712: 'Lion@r@v53/75300746."Ange...!!@k @v53/75300747.Ange, calm down...!!@k @|@y@v53/75300748.Ungh, ......ah...?!"'
56713: '@rAnge writhed with such strength that the chains on her arms and legs looked like they might snap.'
56714: '@rAll over her body, ......a red, gooey liquid started to seep out.'
56715: '@rIt was as though cracks had opened up all over her and blood was leaking out of all of them.'
56716: 'BERNKASTEL@r@v28/72100330."What''s that?@k @v28/72100331.You want me to announce it clearly with the red truth?@k @v28/72100332.Then I''ll do that, just for you."'
# This is written without closing quotes or a breaking dash in Japanese as well
56717: 'BERNKASTEL@r@v28/72100333_o.@e@s00."''@c900.This is all truth@c.@|@y'
56718: 'Ange@r@v11/72000157."NOOOOOOOOOOOOOOOOOOOOOOOOOOO!!!"@|@y'
56719: '@rAnge''s scream covered up Bern''s red truth.'
56720: 'BERNKASTEL@r@v28/72100334."*giggle*giggle*giggle*,@|@y@v28/72100335. ahhahahahahahahahahaha...!!@|@y@k @v28/72100336.Stupid kid.@k@v28/72100337. If only you hadn''t made me say that, I could''ve shut it up inside the cat box."'
56721: 'BERNKASTEL@r@v28/72100338."But you did tell me to, right?@k @v28/72100339.I knew you would, of course.@k@v28/72100340. And I so wanted to see you scream like that."'
56722: 'BERNKASTEL@r@v28/72100341.".........What a lovely expression, one that''ll keep me laughing for about a hundred years.@k@v28/72100342. ......*giggle*giggle*, *giggle*giggle*giggle*giggle*!!!@|@y@k @v28/72100343.Go back to being scrap meat.@k@v28/72100344. Ahhahahahahahahahahahahahaha!!!"@|@y'
56723: 'Ange@r@v11/72000158."Uwaaaaaaaaaaaaaaaaaaaaaaaaaaaahh, gyaaaaaaaaaaaaaaaaaaaaaahhhh!!"'
56724: 'Ange@r@v11/72000159."Mom, Dad,@v11/72000160. ......it''s a lie, right?!@k @v11/72000161.Lies,@v11/72000162. ......lies......@v11/72000163....gyaaaaaaaaaaaaaaaaaaaaaaaahhhh........."'
56725: 'Lion@r@v53/75300749."A-Ange......!@k @v53/75300750.Ange......?!"'
56726: '@rAs Ange held her head and screamed, the blood dripping from her finally grew so thick that it started scattering all over the place.'
56727: '@rThen, bit by bit, her body began to melt—no, to fall apart.@k@rThen, bits of her began to pile up on the chair, ......until she was nothing but a pile of guts and scraps......'
56728: 'BERNKASTEL@r@v28/72100345."Ahhahahahahahahahahahahah, aaaahhahahahahaaaaahhaahaha!!@k @v28/72100346.Is the truth really such a precious thing?@k @v28/72100347.How absurd, how foolish!!"'
56729: 'BERNKASTEL@r@v28/72100348."Why can''t Humans control their own truth?@k@v28/72100349. They stupidly search for the truth like that''s all that matters, and when they finally find it and can''t stand it, they turn themselves into scrap meat!!"'
56730: 'BERNKASTEL@r@v28/72100350."Hey, are you watching?@k @v28/72100351.Clair?@k @v28/72100352..........You wanted to hide this truth too, didn''t you?"'
56731: 'BERNKASTEL@r@v28/72100353."For fun, you wrote several cat box tales,@k@v28/72100354. and sealed them in message bottles like the end of one of those mystery novels you admired.@k@v28/72100355. Then, you threw them into the sea.@k@v28/72100356. To save those who would suffer if they knew the truth...!!"'
56732: 'BERNKASTEL@r@v28/72100357."You sealed everything in a cat box, and Eva provided the lock.@k@v28/72100358. *giggle*giggle*!!@k @v28/72100359.And I''ve sliced that box open for you...!!"'
56733: 'BERNKASTEL@r@v28/72100360."Ahhahahahahahahahahaha,@|@y@v28/72100361. all that effort you spent to hide it has gone to waste!!@k @v28/72100362.I''ve exposed all of the truth you hid with your death!!@k @v28/72100363.Ahhahahahahahhahhahhahhahha!!"@|@y'
56734: 'Lion@r@v53/75300751."Is that......what you''ve been after?!@k @v53/75300752.You......did all of this just to insult Clair''s death?!!@k @v53/75300753.And then...you showed it to Ange to make her suffer...!@k @v53/75300754.You really were......an evil witch after all!!"'
56735: 'BERNKASTEL@r@v28/72100364."I''ve been a witch the whole time.@k@v28/72100365. A traveler whose only goal is to escape boredom.@k@v28/72100366. ......Care for it and love it while it''s alive, then eat the guts when it''s dead.@k@v28/72100367. That''s how witches live!"'
56736: 'Lion@r@v53/75300755."What you have done is unforgivable to me...!!@k @v53/75300756.You''ve hurt Ange and humiliated Clair, ......the person I would become in another world...!!@k @v53/75300757.I cannot forgive you for this...!!"'
56737: 'BERNKASTEL@r@v28/72100368."Lion.@k@v28/72100369. Despite all of this, you are what Clair longs to be.@k@v28/72100370. Even after death, she longs for it."'
56738: 'Lion@r@v53/75300758."..................!"'
56739: 'BERNKASTEL@r@v28/72100371."From the moment that Clair was thrown from the cliff, her fate was already sealed.@k@v28/72100372. I''m sure it gave her a little bit of salvation to know that another "her"...@k@v28/72100373.lives in happiness in another world."'
56740: 'Lion@r@v53/75300759."......That''s right.@k@v53/75300760. I''m her salvation...!@k @v53/75300761.So, I must live life to the fullest...live life for the both of us...!"'
56741: 'BERNKASTEL@r@v28/72100374."Lion.@k@v28/72100375. ......Let me show you just a bit more of this tale of the truth."'
56742: 'Lion@r@v53/75300762."I''m not interested!"'
56743: 'BERNKASTEL@r@v28/72100376."Don''t worry, it''ll be very interesting.@k@v28/72100377. ......After the duel between Eva and Kyrie, the guesthouse is wrapped in silence.@k@v28/72100378. Let me invite you to the parlor at that point in time."'
56744: 'Lion@r@v53/75300763."The parlor......?@k @v53/75300764.The one in the mansion?"'
56745: '@rBERNKASTEL snapped her fingers, and the scene of the mansion''s parlor unfolded before them.'
56746: '@rIn the cruel tale they had just been shown, the parlor hadn''t been particularly important.'
56747: '@rJessica had been summoned to the parlor, but she was then immediately led to the dining hall and killed there.'
56748: '@rSo, there had been nothing in the parlor.@k@rAnd, right now, there was nothing in the parlor that appeared before Lion.'
56749: 'Lion@r@v53/75300765."Just what is supposed to be here?"'
56750: 'BERNKASTEL@r@v28/72100379."*giggle*.@k@v28/72100380. ......As you can see, there''s nothing here.@k@v28/72100381. But watch.@k@v28/72100382. I''m about to show you something interesting."'
56751: 'Lion@r@v53/75300766."If you call it interesting, that''s a sure sign that it isn''t."'
56752: 'BERNKASTEL@r@v28/72100383."*giggle*giggle*.@k@v28/72100384. ......Go on, take a look.@k@v28/72100385. ......It''s right there.@k@v28/72100386. Right in that corner."'
56753: '@rBERNKASTEL was pointing.........at nothing more than a corner of the room.'
56754: '@rThere was nothing there.'
56755: '@rShe had told Lion to look there, so Lion was expecting something terrible to be there,@k ......but there really was nothing there at all.'
56756: 'Lion@r@v53/75300767."..............................??"'
56757: 'BERNKASTEL@r@v28/72100387."......That''s right, there''s nothing there.@k@v28/72100388. At least, not in this world.@k@|@y@v28/72100389. But what if we peek into the next fragment over......?"'
56758: 'Lion@r@v53/75300768.".....................?!"'
56759: '@rOn the white, blank wall...@w500....bit...@w250.by bit...@w500....a splash of blood seeped into view.'
56760: '@rThen, right there, .........a corpse appeared.@k@rBut, ......that couldn''t be.........'
56761: 'Lion@r@v53/75300769."Th-@v53/75300770.......this is......@k@v53/75300771.......m-@v53/75300772.............me......?!"'
56762: '@rIt was Lion, ......lying dead against the wall......'
56763: '@rUshiromiya Lion''s corpse lay there exposed......'
56764: 'Lion@r@v53/75300773."Wh-what''s going on here......?@k@v53/75300774. Why am I here...?@k@v53/75300775. ......This is supposed to be Clair''s world, not mine...!@k @v53/75300776.Clair and I can''t exist at the same time, right...?!"'
56765: 'BERNKASTEL@r@v28/72100390."Yes, that''s right.@k@v28/72100391. That''s because I just switched worlds, switched fragments.@k@v28/72100392. Switched to your world, that is."'
56766: 'Lion@r@v53/75300777."......I don''t understand!"'
56767: 'BERNKASTEL@r@v28/72100393."It''s very simple.@k@v28/72100394. They both end the same way.@k@v28/72100395. .........*giggle*giggle*!!"'
56768: 'Lion@r@v53/75300778."I don''t get it!!@k @v53/75300779.Why would I be dead here?!!"'
56769: 'BERNKASTEL@r@v28/72100396."In your world,@k@v28/72100397. on October 4th, 1986,@k@v28/72100398. Beatrice''s funeral was held just before the family conference."'
56770: 'Lion@r@v53/75300780."Yes, I know that.@k@v53/75300781. And for me, that happened today, a short while ago!"'
56771: 'BERNKASTEL@r@v28/72100399."From that time until late that night, do you know what happened...?"'
56772: 'Lion@r@v53/75300782."Nothing at all!!@k @v53/75300783.The cousins are all going to play together, and the whole family will have dinner together!"'
56773: 'BERNKASTEL@r@v28/72100400."Then, that night, the family conference took place.@k@v28/72100401. .........You were going to succeed the headship when you turned twenty, right?@k @v28/72100402.Was the entire family satisfied with that, I wonder...?"'
56774: 'Lion@r@v53/75300784.".........I don''t know if they''re satisfied, but the decision has been made.@k@v53/75300785. ......The head made it himself."'
56775: 'BERNKASTEL@r@v28/72100403."Looks like even you don''t believe they were satisfied.@k@v28/72100404. That''s it right there.@k@v28/72100405. ......Kinzo adored you more than anything...and tried to make an exception and set you up as the next head.@k@v28/72100406. Of course, his children wouldn''t have been happy with that."'
56776: '@rThe siblings objected to having Lion succeed the headship.'
56777: '@rEven Krauss joined in, saying that Lion was still too young.'
56778: '@rThen, on the night of the family conference, Kinzo tried proposing a difficult riddle......'
56779: 'Lion@r@v53/75300786."You.........don''t mean..............."'
56780: 'BERNKASTEL@r@v28/72100407."That''s right.@k@v28/72100408. The riddle of the epitaph.@k@v28/72100409. .........As you can tell by the mechanism set into the chapel, Kinzo thought up the epitaph trick near the beginning, when the mansion on Rokkenjima was being built.@k@v28/72100410. ......He had the romantic idea of someday using it as a test to select the next head."'
56781: '@rKinzo decided to present that riddle at the family conference.'
56782: '@rDid he plan to give the position of successor to the person who solved it?@k Or did he promise to reconsider Lion''s position as the head if it was solved?'
56783: '@rEither way, Kinzo was confident.'
56784: '@rHe was confident that no one would be able to solve this tough riddle, which he had created himself.'
56785: 'BERNKASTEL@r@v28/72100411."After that, everything happened exactly like the truth you just saw.@k@v28/72100412. The siblings solved it right away, and there was a clash over the pile of gold.@k@v28/72100413. *giggle*......"'
56786: 'BERNKASTEL@r@v28/72100414."Then, Kyrie and Rudolf carried out the late night murders to prevent any chance of the crime being discovered the next morning and an outcry being raised.@k@v28/72100415. .........They called the kids out from the cousins'' room one by one, then killed them."'
56787: 'BERNKASTEL@r@v28/72100416."......As the first of the cousins, you were the first to be called out.@k@v28/72100417. Then, Kyrie shot you dead right here in the parlor."'
56788: 'BERNKASTEL@r@v28/72100418.".........No, that''s not quite right.@k@v28/72100419. You''re the Ushiromiya Lion from the early evening of October 4th, 1986.@k@v28/72100420. So, I''ll say it this way.@k@v28/72100421. ......Tonight, Kyrie will shoot you dead in the parlor."'
56789: 'Lion@r@v53/75300787."That''s............insane............@k@|@y@v53/75300788. It''s—that''s right, probability!"'
56790: 'Lion@r@v53/75300789."Just like the miracle called Lion only has a slight probability of arising from Clair,@k@v53/75300790. Aunt Kyrie must only commit murder with a tiny probability close to zero!@k @v53/75300791.Aren''t you the witch who specializes in finding extremely improbable worlds?!!"'
56791: 'BERNKASTEL@r@v28/72100422."That is correct.@k@v28/72100423. I had to find one fragment out of 2,578,917 in order to discover the miracle that is you."'
56792: 'BERNKASTEL@r@v28/72100424."......However,@k@v28/72100425. it was very, very easy to find this result for your world.@k@v28/72100426. After all, probability isn''t a factor.@k@v28/72100427. .........I''m a witch who can find any miracle, no matter how unlikely it is."'
56793: 'BERNKASTEL@r@v28/72100428."But I can''t find things that don''t exist.@k@v28/72100429. ......If the Witch of Certainty really guarantees that something is certain, even I can''t win against her."'
56794: 'Lion@r@v53/75300792."But...@v53/75300793.......then...@v53/75300794....I.................."'
56795: 'BERNKASTEL@r@v28/72100430."With a 2,578,916 out of 2,578,917 probability,@k@v28/72100431. you live in the world as Clair, are toyed with by an inescapable fate, and meet with a tragic end.@k@v28/72100432. And, with a 1 out of 2,578,917 probability, you live as Ushiromiya Lion...@k@v28/72100433.and are killed by Kyrie tonight."'
56796: 'BERNKASTEL@r@v28/72100434.".........In other words, your fate—no, the fate the two of you share—traps you in an inescapable dead end, a hell of fate, with a 2,578,917 out of 2,578,917 probability.@k@v28/72100435. .........To put it another way, it''s a certain fate, with absolutely no chance for a miracle!"'
56797: 'BERNKASTEL@r@v28/72100436."*giggle*, eheheheheheheheheheh!!@|@y@k @v28/72100437.Too bad for you, Clair.@k@v28/72100438. No, BEATRICE."'
56798: '@rA bright light seemed to turn the world white—then, the next moment, they were back in the theater.'
56799: '@rAs Clair stood absolutely still on the stage, the tip of BERNKASTEL''s reaper scythe traced a line across her stomach.'
56800: '@rA red line was drawn across her white skin, exposed now that the dress had been cut, and black blood began to seep out......'
56801: 'BERNKASTEL@r@v28/72100439."BEATRICE.@k@v28/72100440. Trapped in that inescapable, certain, locked-away pair of days, you became a witch who could give birth to endless possibilities within that two-day cat box.@k@v28/72100441. ......In exchange, it was absolutely certain that you would not be saved or rewarded."'
56802: 'BERNKASTEL@r@v28/72100442."However, you had a dream.@k@v28/72100443. ......You dreamed of Ushiromiya Lion.@k@v28/72100444. .........You consoled yourself with the thought of a miracle world, where you could have lived in happiness and would never have become Clair!"'
56803: 'BERNKASTEL@r@v28/72100445.".........I really had to work hard to find Lion.@k@v28/72100446. As Beato dreamed, Lion''s existence was a true miracle.@k@v28/72100447. And, at the end of your funeral, I wanted to show you.@k@|@y@v28/72100448. .........That even with that miracle, you couldn''t have escaped this tragedy!!"'
56804: '@rFaced with the little bit of sky that she could see through the bars of the jail that imprisoned her,@k the witch called BEATRICE dreamed of a world where she might have been happy...'
56805: '@rHowever, the sky beyond the bars...@w833..........was also part of a larger jail......'
56806: 'Lion@r@v53/75300795."The more I hear......the less I understand about you......!@k @|@y@v53/75300796.Why......would you do something like this...?!"'
56807: 'BERNKASTEL@r@v28/72100449."I lost a game to Beato, so I wanted to get back at her.@k@v28/72100450. ......*giggle*giggle*!!@|@y@k @v28/72100451.Yeah, now I feel a lot better about losing that game...!@k @v28/72100452.Hey, Beato, are you watching?@k @v28/72100453.Can you see this?!@k @v28/72100454.And do you remember?@k @v28/72100455.Remember when I promised you that there would be absolutely no miracles?!"'
56808: 'BERNKASTEL@r@v28/72100456."Ahhahahahahahahah, ahhahahahahaahahahahahahahaha!!@|@y@k @v28/72100457.So, Lion!@k @v28/72100458.Allow me to return you to your world, right before Beato''s eyes!!"'
56809: 'BERNKASTEL@r@v28/72100459."It looks like the Witches of Theatergoing are all sick and tired of those happy family get-together scenes.@k @v28/72100460.So, I''ll send you to the moment just before Kyrie shoots you!@k @v28/72100461.Then, I''ll make sure Beato witnesses that moment!!"'
56810: 'BERNKASTEL@r@v28/72100462."Ahhahahahahahhahhahhahaha!!@k @v28/72100463.Die, pukespittle Lion!@k@v28/72100464. The last hope of pukespittle Beato, uhyahhahhyaahhaaaaaaaaahhh!!!"'
56811: '@rBERNKASTEL raised her reaper scythe,@w333. .........swung it down with gusto,@w500. ......and plunged it deep into Clair''s stomach......'
56812: 'BERNKASTEL@r@v28/72100465."Did you think you''d get an easy death?@k @v28/72100466.Hehihihihihihihi!!@k @v28/72100467.But humiliating a corpse and tearing out its guts is what I''m best at...!!"'
56813: '@rHeartlessly, ruthlessly, brutally, ......she swung the enormous blade buried in Clair''s stomach back up towards the heavens.'
