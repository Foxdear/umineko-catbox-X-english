56278: 'Eva@r@v05/71000299."Please,@v05/71000300. honey......@k@v05/71000301. Lend me your strength......@k@v05/71000302. .........Help me protect George...@v05/71000303. ......Lend me your strength......"'
56279: '@rIn Hideyoshi''s hand was Krauss''s gun, which he had been trying to pick up.'
