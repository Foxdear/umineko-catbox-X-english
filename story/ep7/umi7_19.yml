56269: 'Eva@r@v05/71000297."They''re going to kill everyone else.@k@v05/71000298. That has to be it... I''m sure of it...!"'
56270: '@rWhen she looked at the table with the box of bullets,@k she saw signs that they had grabbed several large handfuls of bullets from the box.'
56271: '@rIt clearly showed......that they planned to use that many bullets.'
56272: '@r......I have to fight.'
56273: '@r......If only to protect just the life of my precious son......'
