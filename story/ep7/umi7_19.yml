56283: '@r......There was another metallic clang.'
56284: '@rIt was the sound of a new bullet being loaded......'
56285: 'Ange@r@v11/72000106."......Hmph.@k@v11/72000107. I figured it''d be something like this.@k@v11/72000108. ......Someone''s scheming to show me the game that''d disgust me the most, so they can laugh at me...."'
56286: '@rIn the games so far, various people have been suspected of being the culprit or an accomplice.'
56287: '@rThe only difference now was that Rudolf and Kyrie were those suspects...'
56288: '@rHowever, that was the most aggravating development possible for Ange.'
56289: 'Lion@r@v53/75300703."..........................."'
56290: '@rEven Lion was full of painful thoughts.'
56291: '@rThey had been lucky enough to solve the epitaph, which was the only miracle that could lead to a game with no victims.@k ......How ironic that they were unable to prevent the tragedy.'
56292: '@rDoes this mean that we aren''t allowed to have a future where we all happily return from this island alive,@k ......even if the epitaph is miraculously solved before the crime occurs...?'
56293: '@rThere will be...absolutely...no miracles.'
56294: '@r......I recalled those words, which I had heard in one of the fragments BERNKASTEL had shown me......'
