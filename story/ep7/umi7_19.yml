55283: '@r...............When I came to, all was silent.@k@rThe lights were dim.@k And yet......the room felt large.'
55284: '@r......Where on Earth............is this............?'
55285: '@rI was sitting in what seemed to be a very small single sofa.@k@rIt was very constricting, and there seemed to be several more of them off to each side of me...'
55286: '@rOnce I noticed that, I realized that I was in a theater.'
55287: 'Lion@r@v53/75300627."............Where on Earth.........am I.........?"'
55288: '@rI don''t know how long I''ve been here.@k@rAnd, more importantly, I don''t know where this is.'
55289: '@r......Beatrice''s funeral ended,@k everyone went back to the mansion, and......'
55290: '@r........And after that, my memory gets fuzzy, and I can''t recall anything else.'
55291: '@rThen, I was surprised to notice the presence of another person.'
55292: '@rApparently, I wasn''t the only one sitting in the audience seating of this vast theater.'
55293: '@r......The sound had come from a seat to the side of mine.'
55294: '@rWhen I looked, I saw a girl sitting several seats off to my left.'
55295: '@rIt was a face I had never seen before.@k ......I wondered who she was.@k@rShe looked like a high-schooler or a college student,@k about the same age as I was.'
55296: '@r@v11/72000001."...............nnn......"'
55297: '@rShe groaned.@k Apparently, she had just woken up...'
55298: '@rI didn''t want to scare her, so I decided to introduce myself first...'
55299: 'Lion@r@v53/75300628.".........Hello."'
55300: 'Ange@r@v11/72000002.".....................!!"'
55301: '@rApparently, she was equally surprised to find someone other than herself here.@k@rShe jumped when she heard my greeting.'
55302: 'Ange@r@v11/72000003."......Who on Earth are you?"'
55303: 'Lion@r@v53/75300629."I feel the same way.@k@v53/75300630. ......It seems that neither of us is here of our own accord."'
55304: 'Ange@r@v11/72000004."...............Is that...the One-Winged Crest...?"'
55305: 'Lion@r@v53/75300631."Huh?@k @v53/75300632.......Do you recognize this crest?"'
55306: '@rShe looked suspiciously at the One-Winged Crest emblazoned on my collar.'
55307: '@rHer stare, which was unmoving but not openly hostile, wasn''t exactly pleasant for me.'
55308: 'Lion@r@v53/75300633."Allow me to introduce myself first.@k@v53/75300634. ......I am Ushiromiya Lion."'
55309: 'Ange@r@v11/72000005."Ushiromiya—huh?@k @v11/72000006.What?"'
55310: 'Lion@r@v53/75300635."Lion.@k@v53/75300636. Written as "理御", but pronounced "Lee-on".@k@v53/75300637. ......Pretty strange name, don''t you think?"'
55311: 'Ange@r@v11/72000007."......No stranger than mine.@k@v11/72000008. But I''ll have to apologize.@k@v11/72000009. I don''t know who you are."'
55312: 'Lion@r@v53/75300638."That''s hardly surprising,@k@v53/75300639. since I don''t know you either."'
55313: 'Ange@r@v11/72000010."That''s not what I meant.@k@v11/72000011. Who are you?@k @v11/72000012.There''s no one like you in the Ushiromiya family."'
55314: 'Lion@r@v53/75300640."And why are you so sure?@k @v53/75300641.Do you have something to do with my family?"'
55315: 'Ange@r@v11/72000013."I''m a member of the Ushiromiya family."'
55316: 'Lion@r@v53/75300642.".........But that''s..."'
55317: '@rShe showed me her left sleeve......and the crest of the One-Winged Eagle emblazoned upon it.'
55318: 'Lion@r@v53/75300643."......I regret having to ask the same question, but who are you?@k @v53/75300644.I''ve never seen you in the Ushiromiya family."'
55319: 'Ange@r@v11/72000014.".................................@k@v11/72000015. ......First they tear me into little bits, then they make me read...@k@v11/72000016. .........What''s next?@k @v11/72000017.What witch am I supposed to be entertaining this time?"'
55320: '@rShe spat out those words and seemed to be complaining about something.'
55321: 'Ange@r@v11/72000018."Ange.@k@v11/72000019. ......I''m Ushiromiya Ange.@k@v11/72000020. Rudolf and Kyrie''s daughter."'
55322: 'Lion@r@v53/75300645."What?!@k @v53/75300646.A-......Ange-chan......?!@k @v53/75300647.But you''re supposed to be six years old......"'
55323: 'Ange@r@v11/72000021."............I was six during the year of the final family conference on Rokkenjima.@k@v11/72000022. ......Now I get it.@k@v11/72000023. So, you''re from the year 1986.@k@v11/72000024. I''m eighteen.@k@v11/72000025. And I''m from the year 1998."'
55324: 'Lion@r@v53/75300648."I-in other words, ......you''re the Ange-chan......of twelve years in the future......?"'
55325: 'Ange@r@v11/72000026."I''m glad you can wrap your head around it.@k@v11/72000027. But, unfortunately, I don''t have a clue who you are.@k@v11/72000028. ......Who are you?@k @v11/72000029.Who are your parents?"'
55326: 'Lion@r@v53/75300649."My father is Krauss.@k@v53/75300650. Natsuhi is my mother."'
55327: 'Ange@r@v11/72000030."That would make you Jessica onee-chan."'
55328: 'Lion@r@v53/75300651."Jessica is my little sister."'
55329: 'Ange@r@v11/72000031."..............................@k@v11/72000032. ...What''s going on?@k @v11/72000033.Wasn''t Jessica onee-chan an only child...?"'
55330: '@rBy this point, I was starting to figure out the situation this Ange had come from.'
55331: '@r......She''s probably from the world where I awakened as a witch—the world where Lion doesn''t exist.'
55332: 'Lion@r@v53/75300652."It will be a bit difficult to explain, ......but think of it this way.@k@v53/75300653_b. In a world slightly different from the one you know, I am also a member of the Ushiromiya family.@k@v53/75300654. In your world, a different fate leads me to walk a different path through life, so that I do not live as an Ushiromiya family member."'
55333: 'Ange@r@v11/72000034."...............Are you...a witch......?"'
55334: 'Lion@r@v53/75300655."Sorry to disappoint you, but I''m just an ordinary human.@k@v53/75300656. ......What I just told you is something I heard from the witch called BERNKASTEL-san."'
55335: 'Ange@r@v11/72000035.".........BERNKASTEL?@k @v11/72000036.That one with the long, blue hair and the gloomy face...?"'
55336: 'Lion@r@v53/75300657."Y-......yes.@k@v53/75300658. That probably describes her, I think......"'
55337: 'Ange@r@v11/72000037.".........In other words,@k@v11/72000038. I''m being forced to play along with another witch''s farce.@k@v11/72000039. ......Just where is this place?"'
55338: 'Lion@r@v53/75300659."I only woke up a second ago myself.@k@v53/75300660. ......I wonder where this is."'
55339: 'Ange@r@v11/72000040."It looks like a theater.@k@v11/72000041. ......Are we supposed to watch a play, or something?"'
55340: 'Lion@r@v53/75300661."......I''m really not in the mood now.@k@v53/75300662. Let''s look for an exit."'
55341: 'Ange@r@v11/72000042."............You haven''t noticed yet?@k @v11/72000043.Look."'
55342: 'Lion@r@v53/75300663."Huh?@k @v53/75300664...................Ah, these are......"'
55343: '@rClank.'
55344: '@rI finally noticed.@k Both of my wrists and ankles had chains attached to them.'
55345: '@rAs long as I sat here, I had enough slack that I could move about a little, but it looked like there wouldn''t be nearly enough for me to get out of this place.'
55346: 'Lion@r@v53/75300665."......When did...@k@v53/75300666. .........Who would do something like this......?"'
55347: 'Ange@r@v11/72000044."............Once a witch has made you her piece,@k@v11/72000045. you''ll be their plaything forever.@k@v11/72000046. ......There''s no way to escape."'
55348: '@rAnge crossed her legs, making the chains clank together.'
55349: '@rShe must realize that no amount of struggling will break these chains,@k ......that getting panicky won''t accomplish anything.@k She seemed to have nerves of steel.'
55350: 'Lion@r@v53/75300667."What do you mean, a witch''s piece?"'
55351: 'Ange@r@v11/72000047."......It''s like being their slave.@k@v11/72000048. ......I made a deal, once.@k@v11/72000049. ......I said I wanted to see my family, to bring them back from that day.@k@v11/72000050. In exchange for making that a possibility, that witch turned me into a witch''s piece.@k@v11/72000051. .........At least the witch kept her promise.@k@v11/72000052. I was able to see Onii-chan again."'
55352: 'Lion@r@v53/75300668.".........You mean Battler-kun......?"'
55353: 'Ange@r@v11/72000053."Well, I wasn''t even able to tell him who I was.@k@v11/72000054. ......And, in exchange for that short bit of time, I''m now trapped inside the witches'' toy box for all eternity.@k@v11/72000055. ......Looks like you are too.@k@v11/72000056. ......What bargain did you make?"'
55354: 'Lion@r@v53/75300669."I, I didn''t......"'
55355: 'Ange@r@v11/72000057."You never asked a witch for anything?"'
55356: 'Lion@r@v53/75300670."Never.@k@v53/75300671. .........She taught me what a miracle my existence is.@k@v53/75300672. That''s all."'
55357: 'Ange@r@v11/72000058.".........Either way, neither of us is getting out of here.@k@v11/72000059. ......Okay, witches!@k @v11/72000060.What kind of show do you have for us this time?!@k @v11/72000061.Have we moved from reading aloud to theatergoing?@k @v11/72000062.Am I supposed to watch someone else read aloud this time, or what?!@k @v11/72000063.If that''s it, then start it up.@k@v11/72000064. I''m bored enough as it is!"'
55358: '@rAnge yelled this to the pitch-black stage.@k@rHer voice reverberated throughout the theater, but no one gave an answer......'
55359: '@r......No, someone did.@k And that was also in a voice that rang out across the theater.'
55360: '@rHowever, that voice sounded theatrical, as though someone was announcing the start of a play.'
55361: '@r@v34/73300001."What happened on that day, you ask?@k @v34/73300002.I''m not telling.@k@v34/73300003. Why don''t you just give up and die?!"'
55362: 'Lion@r@v53/75300673.".........W-was that the voice of...?"'
55363: 'Ange@r@v11/72000065."That old hag.@k@v11/72000066. It was Aunt Eva''s voice."'
55364: 'Lion@r@v53/75300674."What does she mean by "what happened on that day"?"'
55365: 'Ange@r@v11/72000067."......She''s talking about the 4th and 5th of October in the year 1986.@k@v11/72000068. ......The day of the final family conference on Rokkenjima."'
55366: 'Lion@r@v53/75300675."In other words, ......today."'
55367: '@rToday is October 4th, 1986.'
55368: '@rAs a prelude to the family conference, Beatrice''s funeral was held...'
55369: 'Ange@r@v11/72000069."That''s a surprise.@k@v11/72000070. So, you''ve come here from October 4th, 1986?@k @|@y@v11/72000071.Tell me.@k@v11/72000072. What happened during those two days...?!"'
55370: '@rThe answer she seeks is inside the cat box.@k Even I can tell her nothing except that there was a tragic misunderstanding of the heart.'
55371: '@rHowever, I doubt that explanation would satisfy her.'
55372: '@rThen, ......a pillar of bright light pierced the stage.'
55373: '@rThere stood a figure in white.@k@r.........That figure, clothed in a white dress, was obviously Clair.'
55374: '@rOf course, Ange didn''t recognize her.@k She looked suspicious, apparently wondering who in the world this was.'
55375: '@rHowever, even I felt as though something was wrong.'
55376: '@r......Didn''t she settle all of her regrets in that funeral a short while ago, before being sent off into the next world...?'
55377: '@rShe stood all alone in the narrow beam of light in the center of the stage, and the expression on her face......was lifeless.'
55378: '@rThe light began to grow brighter and brighter.'
55379: '@rIt shone more and more fiercely on her, until it became blinding just to look at her.'
55380: '@rThe world was enveloped by a light so bright that we couldn''t keep our eyes open,@k enveloped by a sound like wind or television static,@k ......and our minds began to go blank...'
55381: 'Hideyoshi@r@v06/71100032."Whoo......!@k @v06/71100033.They''re bloomin'' wonderfully again this year!"'
55382: 'Rudolf@r@v08/71200057."It must be a pain to take care of all these.@k@v08/71200058. Pretty easy for us though, just looking at ''em."'
55383: 'Kyrie@r@v09/71300055."*giggle*, I agree.@k@v09/71300056. We''ve got to thank the people who take care of them for us."'
55384: 'Eva@r@v05/71000050."But it is a bit lacking in grace.@k@v05/71000051. I prefer the way it used to be, before Nii-san decided to meddle with it."'
55385: 'Rosa@r@v12/71400136."The old ones did have their charm, didn''t they?"'
55386: 'Maria@r@v13/70400351."Uu!@k @v13/70400352.I love roses!@k @v13/70400353.I''d like them even more if they didn''t have thorns!@k @v13/70400354.Uu!"'
55387: 'Battler@r@v10/70100142."Whoa!@k @v10/70100143.Now I remember this old garden!@k @v10/70100144.I''d totally forgotten about it these past six years...!"'
55388: 'George@r@v07/70300113."It has been a long time for you.@k@v07/70300114. Both you and this garden have changed so much."'
55389: 'Jessica@r@v04/70200345."Ah, let me introduce you!@k @v04/70200346.This is Kanon-kun, one of our servants!@k @v04/70200347.This is the first time you''ve met Battler, right?"'
55390: 'Kanon@r@v16/70600037."......Pleased to meet you."'
55391: 'Battler@r@v10/70100145."You can just call me Battler!@k @v10/70100146.Nice to meet you!"'
55392: 'Jessica@r@v04/70200348."Shannon''s here too, today.@k@v04/70200349. Remember when we used to play together?"'
55393: 'Battler@r@v10/70100147."Oh, Shannon-chan!@k @v10/70100148.I''d totally forgotten... That really takes me back!@k @v10/70100149.How''s she been doing?!"'
55394: 'George@r@v07/70300115."She''s blossomed into a beautiful young lady over the last six years.@k@v07/70300116. You should say hi to her later on."'
55395: 'Maria@r@v13/70400355."Shannon and George onii-chan are really good friends! Uu!"'
55396: 'Jessica@r@v04/70200350."Maria, shhh!@k @v04/70200351.That''s a secret!"'
55397: 'Gohda@r@v17/71700040."If you would, everyone, allow me to guide you to the guesthouse."'
55398: '@rAfter enjoying the lovely welcome provided by the roses, the relatives followed Gohda in the direction of the guesthouse......'
55399: '@rOctober 4th, 1986.'
55400: '@rRokkenjima.@k A world without Lion.@k@r......The day of the Ushiromiya family''s family conference.'
55401: '@rThe mysterious letter that Maria read aloud after dinner, just as she had been told to.'
55402: '@rThe writer of the letter claimed to be the Golden Witch BEATRICE and challenged the family.'
55403: '@rSolve the riddle of the epitaph.@k Otherwise, I will take everything.'
55404: '@rIt was the letter that declared the start of BEATRICE''s game, just as it had appeared in so many games before.'
55405: '@rHad an unknown person appeared to complicate the inheritance problem?@k@rWhere was the 20 billion yen''s worth of gold hidden?@k@rWhat was the purpose of this letter? For what goal had it been written?@k@rWho on Earth was this BEATRICE?'
55406: '@rIt was that tangled web of suspicion and paranoia that had been a constant in every game: .........the dinner of October 4th.'
55407: 'Rosa@r@v12/71400137."George-kun.@k@v12/71400138. I''m sorry, but could you take the others and go back to the guesthouse?@k@v12/71400139. My apologies."'
55408: 'Natsuhi@r@v03/70900074."......Shannon.@k@v03/70900075. Take the children to the guesthouse.@k@v03/70900076. We will move straight on to the family conference."'
55409: 'Shannon@r@v15/70500542."Y-yes.@k@v15/70500543. As you wish..."'
55410: 'Krauss@r@v02/70800078."BEATRICE, the Golden Witch......@k@v02/70800079. What a fascinating letter you''ve sent us..."'
55411: 'Eva@r@v05/71000052."She''s telling us to solve the epitaph...?@k @v05/71000053.Ridiculous.@k@v05/71000054. That gold belongs to us.@k@v05/71000055. Why would we ever give it up to some outsider...?!"'
55412: 'Rudolf@r@v08/71200059."......If we could just find that gold, we''d all be happy.@k@v08/71200060. No one''d have to lose anything."'
55413: 'George@r@v07/70300117."Let''s go, everyone.@k@v07/70300118. Looks like it''ll be adult time from here on out..."'
55414: 'Battler@r@v10/70100150."......Give me a break.@k@v10/70100151. Sounds like things are going to get complicated."'
55415: 'Jessica@r@v04/70200352."Come on, Maria...@k@v04/70200353. Let''s go......"'
55416: 'Maria@r@v13/70400356."Beato''s ritual has begun......@k@v13/70400357. Kihihihihihihi......"'
55417: 'Shannon@r@v15/70500544."Okay, everyone, ...I shall guide you to the guesthouse......"'
55418: 'Lion@r@v53/75300676.".........What''s......all this about......?"'
55419: 'Ange@r@v11/72000073."Probably a replay of one of the old games, ......or else an entirely new game.@k@v11/72000074. In all the games, October 4th happens in pretty much the same way."'
55420: 'Lion@r@v53/75300677."......A new game?@k @v53/75300678.You mean, a tale that hasn''t appeared in any of the fragments so far?"'
55421: 'Ange@r@v11/72000075."There''s no way they''d go to the trouble of chaining us down if they just wanted to show us a game we already know.@k@v11/72000076. ......We should probably assume it''s a new game.@k@v11/72000077. That means there should be a Game Master.@k@v11/72000078. ......Who is it?@k @v11/72000079..........That witch?@k @v11/72000080.BERNKASTEL......?"'
55422: 'Lion@r@v53/75300679."I......can''t imagine so.@k@v53/75300680. ......Clair should have vanished already.@k@v53/75300681. There should be no need to spin up a new tale..."'
55423: 'Ange@r@v11/72000081."Beato''s game board was hijacked by those evil witches long ago.@k@v11/72000082. Even Beato is nothing more than a piece in their games."'
55424: 'Lion@r@v53/75300682."......Just who is behind this......and what are they after?@k@v53/75300683. What do they want to show us......?"'
55425: '@rBefore this tale began,@k Clair definitely appeared on the stage.'
55426: '@rShe is "me" from a world of a different fate......and the teller of the tale that is BEATRICE''s game.'
55427: '@rHowever, didn''t she entrust everything to Will and have all of her riddles solved?'
55428: '@rThere should be no need for her to make new riddles......'
55429: '@r.........In that case, is BERNKASTEL using this tale to test me...?'
55430: '@rAlong with Will, I have at least touched the deepest depths of this tale...and understood the culprit''s heart.'
55431: '@rSo, even if an entirely new tale presents itself, I should be able to see through the riddles.'
55432: '@r.........Is that...what my role is......?@k@rIs my role to teach Ange about the truth of this tale......?'
55433: 'Lion@r@v53/75300684."......Do you know?@k@v53/75300685. ......Do you know the truth of this tale?"'
55434: 'Ange@r@v11/72000083."I have several theories.@k@v11/72000084. Still, none of those can give a conclusive answer.@k@v11/72000085. The truth is always inside the cat box.@k@v11/72000086. I can''t say anything for sure."'
55435: '@rIn this world, Ange is absent on this day.@k@rSo, it''s only natural that she doesn''t know what happened.'
55436: '@rHowever, at the very least, I do know who the culprit is...and what they were trying to do......'
55437: 'Lion@r@v53/75300686.".........Yes.@k@v53/75300687. I think I''ve finally understood my role in this."'
55438: 'Ange@r@v11/72000087."What do you mean?"'
55439: 'Lion@r@v53/75300688."Apparently, you''re here as a theatergoer, and I''m here to explain things."'
55440: 'Ange@r@v11/72000088."And what are you supposed to be explaining?"'
55441: 'Lion@r@v53/75300689."I know......who''s behind the crime that''s about to occur."'
55442: 'Ange@r@v11/72000089."What did you say.........?"'
55443: 'Krauss@r@v02/70800080."Thinking about this normally,@k@v02/70800081. ......the only explanation I see is that someone''s trying to make us solve the epitaph, aiming to grab the gold for themselves."'
55444: 'Rudolf@r@v08/71200061."I agree.@k@v08/71200062. If they''d already solved it, they could just take it.@k@v08/71200063. There''d be no need to challenge us to solve the riddle."'
55445: 'Eva@r@v05/71000056."It''s a prank by one of the servants.@k@v05/71000057. They''re hoping to pick up the scraps from the celebration if the gold is found."'
55446: 'Natsuhi@r@v03/70900077."I cannot imagine that any of our servants would do such a thing..."'
55447: 'Rosa@r@v12/71400140."......Or, maybe one of us sent the letter, pretending to be a servant."'
55448: 'Eva@r@v05/71000058."If that''s it, you''re the most suspicious one.@k@v05/71000059. You schooled Maria-chan on her part and made her read the letter, didn''t you?"'
55449: 'Rosa@r@v12/71400141."I, I wouldn''t do that...!"'
55450: 'Hideyoshi@r@v06/71100034."Give that a rest, Eva.@k@v06/71100035. We can''t jump to conclusions.@k@v06/71100036. Isn''t this the time for us all to stick together?"'
55451: 'Kyrie@r@v09/71300057."That''s right.@k@v09/71300058. The aim of this strange letter is probably to disrupt our unity.@k@v09/71300059. The more we let it affect us, the more things go the way of this "BEATRICE" who sent it."'
55452: 'Krauss@r@v02/70800082."Kyrie-san''s right.@k@v02/70800083. Wouldn''t it be best to simply ignore a letter like that from the start?"'
55453: 'Natsuhi@r@v03/70900078."That is what I have been saying the whole time.@k@v03/70900079. This sort of prank is not worth considering!"'
55454: 'Hideyoshi@r@v06/71100037."Yes, that''s it exactly.@k@v06/71100038. If a couple improbable claims for damages get ya flustered, you''ll never be able to sell anythin''!"'
55455: 'Eva@r@v05/71000060."My husband''s right.@k@v05/71000061. This is a child''s prank, and taking it seriously is just a waste of time.@k@v05/71000062. If someone really wanted to shake up the inheritance issue, they''d come forward boldly instead of using something this roundabout."'
55456: 'Rudolf@r@v08/71200064."You''ve got it right there.@k@v08/71200065_b. Someone probably wants to make us think there''s another person trying to make demands about the inheritance, when their real goal is just to pick up the scraps."'
55457: 'Rosa@r@v12/71400142."......I wonder if they''ll ask for some hush money in exchange for staying out of the inheritance issue."'
55458: 'Kyrie@r@v09/71300060."If that were the case, they would have written it into the letter already."'
55459: 'Krauss@r@v02/70800084."And the letter is just a challenge, telling us to solve the epitaph or have everything taken from us."'
55460: 'Hideyoshi@r@v06/71100039."The culprit is tryin'' to make us solve the epitaph''s riddle!@k @v06/71100040.Nothin'' more, nothin'' less."'
55461: 'Rudolf@r@v08/71200066."So, it''s simple.@k@v08/71200067. If we let this letter scare us, we lose."'
55462: 'Krauss@r@v02/70800085."Yes, I agree.@k@v02/70800086. ......After that big mysterious show, like something out of a mystery novel, we''ve all gotten carried away.@k@v02/70800087. ......Hahahaha.@k@v02/70800088. It shows how tense we all are."'
55463: 'Natsuhi@r@v03/70900080."But who did it?@k@v03/70900081. ......Such an aggravating thing to do."'
55464: 'Eva@r@v05/71000063."If it wasn''t a servant, then one of us must have written it.@k@v05/71000064. I''m not naming names, of course."'
55465: 'Rosa@r@v12/71400143."St-stop it.@k@v12/71400144. I really know nothing about this...!"'
55466: 'Hideyoshi@r@v06/71100041."Settle down.@k@v06/71100042. Anyway, what this letter says does make a bit of sense.@k@v06/71100043. ......All of us need money.@k@v06/71100044. And, if possible, we need it right away.@k@v06/71100045. No one here has any objections to that, right...?"'
55467: 'Rudolf@r@v08/71200068."......Of course not.@k@v08/71200069. Who''d object to money or love?"'
55468: 'Krauss@r@v02/70800089."We don''t know when Father''s inheritance will come to us.@k@v02/70800090. ......However, the gold of the epitaph is different.@k@v02/70800091. If we find it, we could just split it then and there."'
55469: 'Eva@r@v05/71000065."In a sense,@k@v05/71000066. it''s even closer to us now than the inheritance is."'
55470: 'Rosa@r@v12/71400145."Assuming we can solve the epitaph......"'
55471: 'Kyrie@r@v09/71300061."......Everyone here has made their own attempt at the riddle, yes?"'
55472: '@rKyrie asked the room at large, and everyone wordlessly nodded back.'
55473: 'Kyrie@r@v09/71300062."We have a whole four people here who inherit the blood of the one who made that riddle, yet we''re all tackling it individually.@k@v09/71300063. That doesn''t sound very efficient, does it?"'
55474: 'Rudolf@r@v08/71200070."......True.@k@v08/71200071. We''ve all been greedy and tried to go it alone.@k@v08/71200072. ......However.@k@v08/71200073. We''ve already reached a decision about how we''ll split the gold up if it''s found.@k@v08/71200074. And about acknowledging Aniki as the successor."'
55475: 'Krauss@r@v02/70800092."Though you demanded quite a lot in exchange."'
55476: 'Rosa@r@v12/71400146.".........I wonder if we can solve that epitaph...if we pool our efforts and work together..."'
55477: 'Kyrie@r@v09/71300064."Two heads are better than one.@k@v09/71300065. And here, we have seven."'
55478: 'Eva@r@v05/71000067."Today, we reached a general agreement about the inheritance problem.@k@v05/71000068. ......Why not take a shot at the epitaph for a bit of fun on the side?"'
55479: 'Hideyoshi@r@v06/71100046."Nice idea.@k@v06/71100047. Let''s give it a try and call it a break."'
55480: 'Natsuhi@r@v03/70900082."......Ridiculous.@k@v03/70900083. There is no......"'
55481: 'Rudolf@r@v08/71200075."Take it easy.@k@v08/71200076. Just think of it as a game.@k@v08/71200077. Let''s have Gohda-san bring us something cool to drink.@k@v08/71200078. We can take a break and all play with riddles as a big, happy bunch of siblings for once."'
55482: 'Krauss@r@v02/70800093."Hmmm.@k@v02/70800094. Well, the night is long.@k@v02/70800095. It would be, at least, more productive than pointless inquiries regarding Father''s health."'
55483: 'Rosa@r@v12/71400147."I''ll ring up Gohda-san.@k@v12/71400148. He can bring us something."'
55484: 'Eva@r@v05/71000069."Some tea, snacks, and...@k@v05/71000070.......oh, could you also ask him for a map of Taiwan?"'
55485: '@rTwo figures could be seen in the rose garden arbor.@k@r......It was George and Shannon''s secret meeting.'
55486: 'George@r@v07/70300119."I want you to take this ring."'
55487: 'Shannon@r@v15/70500545."G-......George-sama......"'
55488: 'George@r@v07/70300120."I swear to love you all my life.@k@v07/70300121. ......Not just while we''re young.@k@v07/70300122. I swear to love you and keep you happy until we grow old and go to our graves."'
55489: 'Shannon@r@v15/70500546."......Are there any lies in your words?"'
55490: 'George@r@v07/70300123."Nope, none.@k@v07/70300124. I''m confident in my resolve to love you and build a happy household together with you."'
55491: 'Shannon@r@v15/70500547."And what would this happy household be like?"'
55492: 'George@r@v07/70300125."Well,@k@v07/70300126. it will be full of happiness.@k@v07/70300127. We''ll have a house, with a car and a garden.@k@v07/70300128. And one dog.@k@v07/70300129. The garden will be a vegetable garden.@k@v07/70300130. The kids will run around, and we''ll smile down on them from the balcony.@k@v07/70300131. That''s what our typical future Sunday will look like."'
55493: 'Shannon@r@v15/70500548."That...would be wonderful......"'
55494: 'Battler@r@v10/70100152."Whaaaa?!!@k @v10/70100153.Those two are a couple?!"'
55495: 'Jessica@r@v04/70200354."Shhh!@k @v04/70200355.Why are you so damn loud?!@k @v04/70200356.Maria''ll wake up...!"'
55496: 'Battler@r@v10/70100154."Oh, r-right.@k@v10/70100155. So that''s how it is, huh...@k@v10/70100156. Now that you mention it, they seemed to have a pretty good mood going on there.@k@v10/70100157. ......That''s right, we''re all about the age where you fall in love."'
55497: 'Jessica@r@v04/70200357."We''ve changed a lot in the last six years.@k@v04/70200358. George nii-san used to be a bit unreliable, but he isn''t anymore."'
55498: 'Battler@r@v10/70100158."That''s what I thought.@k@v10/70100159. George-aniki''s got one of those "air of dignity" things around him."'
55499: '@r......But still, Shannon-chan and George-aniki.@k That''s a bit unexpected.'
55500: '@rThey played together often enough six years ago, but I didn''t think they were that close.'
55501: 'Battler@r@v10/70100160."......Well, six years is a long time."'
55502: 'Jessica@r@v04/70200359."The last six years have been huge for all of us."'
55503: 'Battler@r@v10/70100161."Yep.@k@v10/70100162. ......Honestly, so much happened to me over the past six years that I pretty much forgot about Rokkenjima."'
55504: 'Jessica@r@v04/70200360."Yeah, and I almost totally forgot about you as well."'
55505: 'Battler@r@v10/70100163."Now that really hurts, ihihi~!"'
55506: '@rTalking together like this, it felt as though we''d been transported six years into the past.'
55507: '@rThose six years were so long that I forgot almost everything.@k@rAnd yet......it''s coming back to me, bit by bit.'
55508: '@r.........Shannon-chan...'
55509: '@rSix years ago, you were part of our group, and we played together a lot, didn''t we...'
55510: '@rBack then, I think I might''ve......liked Shannon-chan.'
55511: '@rThat was the age when we were all overly self-conscious, in love with love.'
55512: '@rI recalled bittersweet memories of jokes involving melodramatic, flippant words.'
55513: 'Battler@r@v10/70100164."......That takes me back.@k@v10/70100165. I think I remember saying all kinds of stuff that I''d be way too embarrassed to say now.@k@v10/70100166. Gyaaah, just remembering it is making my face go red!"'
55514: 'Jessica@r@v04/70200361."Hihihi.@k@v04/70200362. Shannon might be a scatterbrain, but her memory''s incredible.@k@v04/70200363. Guess I''ll just have to ask her all about your dark, embarrassing history."'
55515: 'Battler@r@v10/70100167."Qu-quit it.@k@v10/70100168. That was six years ago, so give me a break...!"'
55516: '@r......I see...@k So, Shannon-chan is going out with George-aniki...'
55517: '@r...............................'
55518: '@rWhat am I thinking?@k Could this be...jealousy?'
55519: '@rI didn''t really think about it until now, ...but that thing Shannon-chan and I had back then...... That was probably my first love.'
55520: '@rWell, it''s not like I have any right to be jealous, after forgetting the whole thing until we met again.'
55521: 'Rudolf@r@v08/71200079."Everyone knows that Dad''s old home was Taishou in Taiwan."'
55522: 'Krauss@r@v02/70800096."Father still chews areca nuts from time to time in memory of Taiwan.@k@v02/70800096B. Apparently, he got hooked on that instead of smoking when he was young."'
55523: 'Rosa@r@v12/71400149."......But there must have been countless rivers there with sweetfish swimming in them."'
55524: 'Eva@r@v05/71000071."There''s an endless number of streams that are famous sweetfish fishing spots.@k@v05/71000072. ......You could probably have found sweetfish living in every body of clear water.@k@v05/71000073. We''re completely stuck."'
55525: 'Hideyoshi@r@v06/71100048."Could it be some nearby creek that Father used to play in as a kid?@k@v06/71100049. He said sweetfish, but maybe we''re looking for somethin'' more like carp."'
55526: 'Kyrie@r@v09/71300066."......Or, it could be some sort of metaphor.@k@v09/71300067. The river isn''t necessarily a river with water flowing through it."'
55527: 'Natsuhi@r@v03/70900084."What do you mean by that...?"'
55528: 'Kyrie@r@v09/71300068."Well now......@k@v09/71300069. ...Who knows?"'
55529: 'Rudolf@r@v08/71200080."Kyrie has a point there.@k@v08/71200081. Isn''t it a bit too early to be sure that Taiwan is this "home of old", or that this sweetfish river is a river with water flowing down it?"'
55530: 'Hideyoshi@r@v06/71100050."If we look at it that way, we''re just stuck again.@k@v06/71100051. The more you think about this puzzle, the harder it seems."'
55531: 'Eva@r@v05/71000074.".........That''s it.@k@v05/71000075. This is just a silly puzzle.@k@v05/71000076. ......Kyrie-san is right.@k@v05/71000077. We need to be flexible in our thinking..."'
55532: 'Rosa@r@v12/71400150."If we''re looking for a river near Taishou, .........that would have to be Tamsui River..."'
55533: 'Eva@r@v05/71000078."Are you even listening?!@k @v05/71000079.We just said that it might not be the kind of river with water flowing down it!@k @v05/71000080.Is there any proof that that river is a sweetfish river?!"'
55534: 'Rosa@r@v12/71400151."Y-you''re right...... I, I''m sorry..."'
55535: 'Rudolf@r@v08/71200082."......Well, it probably did have sweetfish in it.@k@v08/71200083. I mean, it''s literally called Freshwater River.@k@v08/71200084. Makes sense that a freshwater fish like sweetfish would be swimming in it."'
55536: 'Krauss@r@v02/70800097."Sweetfish are freshwater fish.@k@v02/70800098. So, a sweetfish river would be a freshwater river.@k@v02/70800099. ......Is that how we get Tamsui River?@k @v02/70800100.Hahahaha, quite the word game."'
55537: 'Kyrie@r@v09/71300070."Now that''s an interesting theory.@k@v09/71300071. ......Let''s advance our reasoning a bit further.@k@v09/71300072. As you travel down the river, you will see a village.@k@v09/71300073. ......What''s the name of the town at the mouth of Tamsui River?"'
55538: 'Natsuhi@r@v03/70900085.".........It says "Tamsui" here."'
55539: 'Eva@r@v05/71000081."I went sightseeing in Tamsui.@k@v05/71000082. It was a calm and gentle harbor town.@k@v05/71000083. Beautiful sunsets."'
55540: 'Rudolf@r@v08/71200085."In that village, did you find "the shore the two spoke of"?"'
55541: 'Eva@r@v05/71000084."......Not really.@k@v05/71000085. It doesn''t ring any bells."'
55542: 'Rosa@r@v12/71400152."I guess the beloved home of old doesn''t refer to Taiwan.@k@v12/71400153. It might be Odawara after all."'
55543: 'Krauss@r@v02/70800101."If we can''t discount any possibilities, ......then we won''t get anywhere.@k@v02/70800102. We can''t even get past the first line of the epitaph."'
55544: 'Eva@r@v05/71000086."Quiet, you''re distracting me!@k @v05/71000087.......It has to be Taiwan.@k@v05/71000088. Father wouldn''t describe any other place as "beloved"!"'
55545: 'Natsuhi@r@v03/70900086.".........That is one thing we can agree upon.@k@v03/70900087. To this very day, Taiwan is the homeland of Father''s heart."'
55546: 'Rosa@r@v12/71400154."It''s probably best if we don''t spend too much time on the first line.@k@v12/71400155. I''m going to take a look at the other lines.@k@v12/71400156. ......Just a quick peek, starting at the first twilight."'
55547: 'Rudolf@r@v08/71200086."......Me too.@k@v08/71200087. I''ll leave the sweetfish river to you, Aneki, and have a go at the second half."'
55548: 'Kyrie@r@v09/71300074."On the first twilight, sacrifice the six chosen by the key......@k@v09/71300075. How mysterious."'
55549: 'Eva@r@v05/71000089."I, ......I''ve got it."'
55550: '@rEva suddenly muttered.@k@rAll of the others spun around to look at her.'
55551: '@rEva flipped through the pages about Taiwan with incredible force,@k then found the page she was looking for and slammed the book open so hard that it almost tore.'
55552: '@rThis whole time, they had been looking at pages with place names.@k@rAs far as the overall mass of information went, those had seemed the most useful pages to start from.'
55553: '@rHowever, the page that Eva opened to was very limited in the scope of its information.'
55554: '@rIt was.........a map of railway lines.'
55555: 'Eva@r@v05/71000090."......As you travel down it, ......you will see a village......a village.@k@v05/71000091. .........!!@k @v05/71000092.There it is, the village!"'
55556: 'Krauss@r@v02/70800103."Wh-......what are you talking about, Eva?@k@v02/70800104. Explain yourself."'
55557: 'Eva@r@v05/71000093."Quiet!!@k @v05/71000094.There''s a shore too, and a mouth for "speak"...!@k @v05/71000095.I''m not sure what it means by "the two", ......but there definitely is a village and a shore and a mouth...!!@k @v05/71000096.This is it... This is definitely the village where the key to the gold sleeps...!!"'
55558: 'Hideyoshi@r@v06/71100052."C-calm down...!@k @v06/71100053.Explain it so we can understand too!"'
55559: 'Kyrie@r@v09/71300076."......The Tamsui Line?@k @v09/71300077.......I see.@k@v09/71300078. So, the sweetfish river was actually a railway called the Tamsui Line?"'
55560: 'Natsuhi@r@v03/70900088."Well, I doubt there are any sweetfish swimming there......"'
55561: 'Eva@r@v05/71000097."Look!!@k @v05/71000098.If we follow the Tamsui Line down, there''s a station that used to be known as Kirigan!@k @v05/71000099.Look at the characters it''s written with!!@k @v05/71000100.There''s a village (@bsato.@<里@>), a mouth (@bkuchi.@<口@>), and a shore (@bkishi.@<岸@>)!!"'
55562: 'Hideyoshi@r@v06/71100054."Sh-she''s right...!@k @v06/71100055.There''s a village, mouth, and shore...!!"'
55563: 'Rudolf@r@v08/71200088.".........As you travel down it, you will see a village.@k@v08/71200089. ......True, that''s the only station on the Tamsui Line that has the character for village in its name."'
55564: 'Krauss@r@v02/70800105."I see, it''s like a code pointing towards this station''s name......"'
55565: 'Eva@r@v05/71000101."This has to be it! There''s no doubt...!!@k @v05/71000102.We just need to look a bit further, then we''ll definitely find out what "the two speak of" means...!!@k @|@y@v05/71000103.......L-look!!@k @v05/71000104.This is it! This is it!"'
55566: 'Kyrie@r@v09/71300079."The town near the station is also called Kirigan but with a mouth in the second character.@k@v09/71300080. ......That makes a total of two mouths in Kirigan.@k@v09/71300081. Is that "the two speak"...?"'
55567: 'Rosa@r@v12/71400157."I-......incredible, Nee-san.@k@v12/71400158. This has to be it......"'
55568: 'Natsuhi@r@v03/70900089."Does this mean that the key is hidden somewhere in this town of Kirigan...?"'
55569: 'Kyrie@r@v09/71300082."I wonder.@k@v09/71300083. ......The whole riddle so far has been a word game.@k@v09/71300084. If so, isn''t it likely that the sleeping key is also a word game?"'
55570: 'Eva@r@v05/71000105."I agree.@k@v05/71000106. On the first twilight, the key selects six sacrifices, right?@k @v05/71000107.So, it''s hard to imagine that it''s actually something key-shaped...!"'
55571: 'Rudolf@r@v08/71200090."......Whoo.@k@v08/71200091. ......This is getting......damn interesting..."'
55572: 'Eva@r@v05/71000108."Sacrifice the six chosen by the key.@k@v05/71000109. ......Let''s think of a key that''s somehow related to this!@k @v05/71000110.And let''s break down this name, "Kirigan"!@k @v05/71000111.I''m absolutely sure that this is a word game!@k @v05/71000112.It has to be...!!@k @v05/71000113.Think, everyone!!"'
55573: 'George@r@v07/70300132."It''s funny, isn''t it?@k@v07/70300133. ......If I were alone, this kind of rain would get me down, but it feels nice and cool when you''re by my side."'
55574: 'Shannon@r@v15/70500549."......It''s about time for us to head back.@k@v15/70500550. I''m keeping Kanon-kun waiting."'
55575: 'George@r@v07/70300134."You''re right.@k@v07/70300135. And I''ve probably kept Jessica-chan and Battler-kun waiting."'
55576: 'Shannon@r@v15/70500551."It brings back good memories.@k@v15/70500552. Remember when the four of us used to play together?@k@v15/70500553. ......It was a lot of fun back then too."'
55577: 'George@r@v07/70300136."To me, it''s a lot more fun now.@k@v07/70300137. Because I get you all to myself."'
55578: 'Shannon@r@v15/70500554."*giggle*.@k@v15/70500555. ......Oh, George-sama."'
55579: '@rThey laughed at George''s melodramatic line.@k However, George''s laugh seemed just slightly forced.'
55580: 'Shannon@r@v15/70500556."......George-sama?"'
55581: 'George@r@v07/70300138."Hm?@k @v07/70300139.......Oh, I''m sorry.@k@v07/70300140. .........Well,@k@v07/70300141. I guess I still have a bit of a complex about Battler-kun."'
55582: 'Shannon@r@v15/70500557."A complex......?"'
55583: 'George@r@v07/70300142."Like Uncle Rudolf, he''s lively, interesting, and just full of energy.@k@v07/70300143. He''s a much more charming person than I am.@k@v07/70300144. ......I can tell how much he outshines me when we''re together."'
55584: 'Shannon@r@v15/70500558."That''s not true.@k@v15/70500559. You''re an accomplished and charming man.@k@v15/70500560. You aren''t inferior to Battler-sama in any way."'
55585: 'George@r@v07/70300145.".........Really?"'
55586: 'Shannon@r@v15/70500561."Yes.@k@v15/70500562. Really."'
55587: 'George@r@v07/70300146."The truth is,@k@v07/70300147. ......when I heard that Battler-kun would be coming back this year, ......I felt unhappy about it at first."'
55588: 'Shannon@r@v15/70500563."Why...?"'
55589: 'George@r@v07/70300148.".........Six years ago,@k@v07/70300149. ......Battler-kun was the one who was really close to you.@k@v07/70300150. I wanted to get closer to you, but I just couldn''t manage to get between the two of you.@k@v07/70300151. ......You two just looked made for each other, and all I could do was watch on longingly."'
55590: 'Shannon@r@v15/70500564."Is that how you remember it...?@k @v15/70500565.I don''t really think we were "made for each other"...... It was just Battler-sama teasing me......"'
55591: 'George@r@v07/70300152."......You two were the perfect couple.@k@v07/70300153. There''s no doubt about it.@k@v07/70300154. ......I was sure that you two were going out."'
55592: 'Shannon@r@v15/70500566."That never happened.@k@v15/70500567. You''re thinking too much..."'
55593: 'George@r@v07/70300155.".........I really am pathetic.@k@v07/70300156. I was afraid that I''d hand you this ring today and you''d refuse."'
55594: 'Shannon@r@v15/70500568."Why is that?@k@v15/70500569. ......Why should I refuse your ring, George-san?"'
55595: 'George@r@v07/70300157."Because...Battler-kun came back.@k@v07/70300158. I was afraid that, deep down, you might still like Battler-kun...@k@v07/70300159....and that, now that he was here, you wouldn''t have any use for me."'
55596: 'Shannon@r@v15/70500570."............George-san?@k @v15/70500571.Please, look at this.@k@v15/70500572. Do you see this silver glint on my ring finger?@k@v15/70500573. What do you think it is?"'
55597: 'George@r@v07/70300160."......You''re right.@k@v07/70300161. Sorry.@k@v07/70300162. What''s got me so shaken, I wonder.@k@v07/70300163. ......I''m probably feeling jealous at the fact that he''s cooler than ever six years later.@k@v07/70300164. ......How pathetic."'
55598: 'Shannon@r@v15/70500574."No, it''s okay.@k@v15/70500575. Those feelings are a sign that your love for me is so strong, ......you don''t want to give me up to anyone.@k@v15/70500576. ......If you''re worried about my feelings switching to Battler-sama,@k@v15/70500577. please love me so strongly that the thought never enters my mind.@k@v15/70500578. ......Love me so much that I don''t have time to think about any other man."'
55599: 'Shannon@r@v15/70500579."I''m scared too.@k@v15/70500580. I''m sure you''ll meet many women in the future who have much more attractive qualities than I do.@k@v15/70500581. Or, I might not meet your expectations, and you might tire of me.@k@v15/70500582. It scares me to think that I might not be able to keep you to myself for the rest of our lives."'
55600: 'George@r@v07/70300165."There''s no need for you to be scared of that.@k@v07/70300166. I swear to uphold my love for you as long as I live."'
55601: 'Shannon@r@v15/70500583."And I swore the same thing, but you stopped taking my word for it when Battler-sama came back."'
55602: '@rAs Shannon giggled,@k George finally realized that his own lack of confidence had hurt her...'
55603: 'Shannon@r@v15/70500584."......I''ve won the heart of a wonderful man named Ushiromiya George-san.@k@v15/70500585. And he has sworn to love me all his life and given me a ring as a sign of this oath.@k@v15/70500586. With this ring here on my ring finger, I''m going to be honest with you."'
55604: 'George@r@v07/70300167."Sure."'
55605: 'Shannon@r@v15/70500587."Yes, as you said,@k@v15/70500588. ......I did like Battler-sama six years ago.@k@v15/70500589. I think I probably liked him more than you."'
55606: 'Shannon@r@v15/70500590."However,@k@v15/70500591. that was six years ago.@k@v15/70500592. Now, things are different.@k@v15/70500593. In these six years, I''ve sorted out my feelings for Battler-sama and put them in the past along with the memories.@k@v15/70500594. Now, I exist only to love you."'
55607: '@rShannon spoke clearly and strongly...'
55608: '@rGeorge gave a single, uncertain laugh.@k It was probably the same sort the George of six years ago had made.'
55609: '@rThen, he straightened up his back and hugged Shannon without saying a word.@k In that moment, he parted ways with the person he had been six years ago......'
55610: 'Hideyoshi@r@v06/71100056."I''ve got the ladder...!@k @v06/71100057.Here we go!"'
55611: 'Rosa@r@v12/71400159."<Quadrillion>.@k@v12/71400160. ......This is the only place you''ll find that number written on this island."'
55612: 'Eva@r@v05/71000114."One tenth of a "@bkei.@<京@>"...@k@v05/71000115. Who''d have thought it?"'
55613: 'Kyrie@r@v09/71300085."If our idea is right, then the letters of that relief should be the mechanism."'
55614: 'Krauss@r@v02/70800106."We just need to check.@k@v02/70800107. Who''s going up?"'
55615: 'Rudolf@r@v08/71200092."I''ll go.@k@v08/71200093. Hold that ladder steady, okay?"'
55616: 'Natsuhi@r@v03/70900090."Be careful.@k@v03/70900091. It is fairly high..."'
55617: '@rRudolf climbed up the propped up ladder.@k Step by step, as the rain poured down on him...'
55618: 'Kyrie@r@v09/71300086."Look at the "Q".@k@v09/71300087. See anything?@k @v09/71300088.Does it look like there''s anything to it?"'
55619: 'Rudolf@r@v08/71200094."Nnn......@k@v08/71200095. There''s a bit of play.@k@|@y@v08/71200096. ......Hmm?@k @v08/71200097.Crap......"'
55620: 'Eva@r@v05/71000116."What is it?!@k @v05/71000117.Did something happen?!"'
55621: 'Rudolf@r@v08/71200098."............Heheh...@k@v08/71200099. Bingo.@k@v08/71200100. Take a look at this."'
55622: '@rRudolf tossed the "Q" down.@k@rIt hit Krauss on the shoulder and landed in a puddle.'
55623: 'Rosa@r@v12/71400161."This is......a key!"'
55624: 'Hideyoshi@r@v06/71100058."What does it mean?!@k @v06/71100059.Rudolf-kun!@k @v06/71100060.Can you take out the other letters too?!"'
55625: 'Rudolf@r@v08/71200101."......Yeah, looks like it.@k@v08/71200102. Guess our crazy theories were on the right track after all!@k @v08/71200103.What''s the next letter to take out?!"'
55626: 'Natsuhi@r@v03/70900092."U-ummm, "i"!@k @v03/70900093.And then "l"!"'
55627: '@rFollowing her instructions, Rudolf removed the six letters of the first twilight...'
55628: '@rNow that they''d gotten this far, ......nothing stood in the way of them solving the riddle.'
55629: '@rBy trial and error, ......they finally reached the final stage.'
55630: 'Krauss@r@v02/70800108."It says to gouge starting from the head, which must mean going from left to right."'
55631: 'Kyrie@r@v09/71300089."Rudolf-san!@k @v09/71300090.Starting from the left, turn the keys before taking them out!"'
55632: 'Rudolf@r@v08/71200104."Got it...!"'
55633: 'Rudolf@r@v08/71200105."Now we''ve massacred all of the letters.@k@v08/71200106. So, none are left alive on the ninth twilight."'
55634: 'Rosa@r@v12/71400162."So?!@k @v12/71400163.Did something happen?"'
55635: 'Rudolf@r@v08/71200107."It felt like something clicked, but nothing''s different.@k@v08/71200108. Maybe a hidden door or something opened up somewhere."'
55636: 'Hideyoshi@r@v06/71100061."H-hey!@k @v06/71100062.Look at that!@k @v06/71100063.It moved, I''m sure it did!!"'
55637: 'Eva@r@v05/71000118."...............?!@k @v05/71000119.Everyone, look!@k @v05/71000120.The lion statue''s facing the other way...!"'
55638: 'Natsuhi@r@v03/70900094."Wh-what is going on?@k @v03/70900095.Is there some secret inside the lion statue...?!"'
55639: 'Krauss@r@v02/70800109."......That''s not it.@k@v02/70800110. It''s probably telling us to look where the lion''s pointing.@k@v02/70800111. See?@k@v02/70800112. Look that way."'
55640: 'Rosa@r@v12/71400164."That lion''s facing a different way too...!@k @v12/71400165.What does it mean?!"'
55641: 'Eva@r@v05/71000121."It''s guiding us, stupid!@k @v05/71000122.We have to go in the direction the lions face...!"'
55642: '@rEva dashed ahead.@k@rThe others all chased after her.'
55643: '@r......The gold was right in front of them.'
55644: 'Krauss@r@v02/70800113.".........Now this is a surprise.@k@v02/70800114. Who would have thought that a hidden stairway like this existed."'
55645: 'Eva@r@v05/71000123."It makes sense now.@k@v05/71000124. Father didn''t like people going near the chapel..."'
55646: 'Rosa@r@v12/71400166."......I wonder how long that mechanism has been there.@k@v12/71400167. Judging by the feel of this underground passage, probably for quite a long time..."'
55647: 'Kyrie@r@v09/71300091."I imagine it was nearly the same time that the mansion itself was built.@k@v09/71300092. ......The riddle of the epitaph was probably also planned many decades ago."'
55648: 'Rudolf@r@v08/71200109."Well, this is Dad we''re talking about.@k@v08/71200110. ......I try not to let the things he does surprise me, but this..."'
55649: 'Natsuhi@r@v03/70900096."Just how far does this stairway go......?"'
55650: 'Hideyoshi@r@v06/71100064."Hey, maybe that old rumor was true.@k@v06/71100065. ......You know, the story about him having a mistress in a hidden mansion somewhere in the forest."'
55651: 'Krauss@r@v02/70800115."I see.@k@v02/70800116. It''s likely that this underground passage goes all the way there."'
55652: 'Rosa@r@v12/71400168.".........I wonder if it connects to the mansion from that day......"'
55653: 'Eva@r@v05/71000125."I think we''ve found the goal.@k@v05/71000126. ......Look at that filthy door.@k@v05/71000127. Something''s written on it."'
55654: 'Rudolf@r@v08/71200111."......Whoo.@k@v08/71200112. This is it."'
55655: '@rSomething was written on the door in red paint.'
55656: '@rOn the tenth twilight, the journey ends, and you shall reach the Home of the Gold......'
55657: 'Kyrie@r@v09/71300093."Does it open......?"'
55658: 'Eva@r@v05/71000128."It does.@k@v05/71000129. ......Ready?@k @v05/71000130.I''m going to open it."'
55659: 'Krauss@r@v02/70800117."Have we finally reached the gold......?"'
55660: 'Hideyoshi@r@v06/71100066."It sounds too good to be true, ......but I''m wishin'' it is."'
55661: 'Rosa@r@v12/71400169."Let''s open it, Nee-san."'
55662: 'Eva@r@v05/71000131."Right.@k@v05/71000132. Here goes."'
55663: '@rThe heavy door......opened slowly......'
55664: '@rThen, the gold-filled, underground VIP room showed itself......'
55665: '@rThey only had an instant to admire the splendid furnishings of the underground VIP room.'
55666: '@rAs soon as the mountain of gold next to the canopy bed came into sight, they all froze, stunned.'
55667: '@rAfter a second, the stunned silence faded and was replaced by cries of astonishment and wild joy......'
55668: 'Krauss@r@v02/70800118."............Incredible!!@k @v02/70800119.Haha, hahhahahahahahaha!!"'
55669: 'Rosa@r@v12/71400170."I, I can''t believe it... It''s 20 billion yen in gold...!!@k @v12/71400171.It really...really exists!!"'
55670: 'Kyrie@r@v09/71300094."What a shining mountain.@k@v09/71300095. It almost blinds the eyes......"'
55671: 'Hideyoshi@r@v06/71100067."Uhhahahahahahahaha!!@k @v06/71100068.We did it! We did it!!@k @v06/71100069.We win this game!!"'
55672: 'Natsuhi@r@v03/70900097.".........Y-you mustn''t touch it without permission!@k @v03/70900098.This is Father''s gold!!"'
55673: 'Eva@r@v05/71000133."Oh, really?!@k @v05/71000134.Then why don''t you call Father down here now!@k @v05/71000135.Right away!!@k @v05/71000136.Your little farce is long over!!"'
55674: 'Rudolf@r@v08/71200113."Natsuhi nee-san.@k@v08/71200114. Let''s put an end to the obvious lies, shall we?@k @v08/71200115.This mountain of gold is as real as can be!@k @v08/71200116.Let''s all be just as real with one another."'
55675: 'Eva@r@v05/71000137."Fortunately, we''re all in a good mood and feeling very generous right now.@k@v05/71000138. Just give it up already!"'
55676: 'Natsuhi@r@v03/70900099."Nng......!"'
55677: '@rA pile of gold this massive carries magical power within it.@k That power draws out the most honest feelings within people.'
55678: '@rThe light from the chandelier glinted off the golden mountain, lighting them up with its golden gleam.'
55679: '@rIt was as though the gleam manipulated them.'
55680: '@rFor some time, they forgot their age,@k and howled and laughed, running about and rolling around like a bunch of excited kindergartners at a park......'
55681: 'Ange@r@v11/72000090.".........What is all this?@k@v11/72000091. What''s it supposed to mean?"'
55682: 'Lion@r@v53/75300690."The epitaph has been solved before the crime occurred.........and by all of the siblings together..."'
55683: 'Ange@r@v11/72000092."That hasn''t happened in any of the games before now."'
55684: 'Lion@r@v53/75300691."......Supposedly, BEATRICE decided not to commit the crime if the epitaph was solved..."'
55685: 'Ange@r@v11/72000093."Yeah, supposedly.@k@v11/72000094. ......Hmph.@k@v11/72000095. I wonder."'
55686: '@rAnge snorted, ......but I believed.'
55687: '@r......This is what Clair decided.'
55688: '@rShe entrusted everything to the roulette of fate, so she would obey the result.'
55689: '@rShe let the roulette decide her own fate specifically because "they" couldn''t decide on their own.'
55690: '@rSo, she''ll do what it says.@k She''ll follow her own rule.'
55691: '@rShe''ll definitely keep her promise.'
55692: 'Lion@r@v53/75300692."It won''t occur.@k@v53/75300693. The crime."'
55693: 'Ange@r@v11/72000096."......Are you sure about that?"'
55694: 'Lion@r@v53/75300694."Yes.@k@v53/75300695. ......Her roulette has already made its decision.@k@v53/75300696. This is the end of her game."'
55695: 'Ange@r@v11/72000097."If it''s the end, what happens next?@k @v11/72000098.They all become happy rich people and leave the family conference unharmed?@k @v11/72000099.My family comes back to me with a souvenir of an ingot that isn''t made of chocolate?@k @v11/72000100.And everything ends happily?@k @v11/72000101.You think those witches would chain us to chairs to show us a naive dream like that?!"'
55696: 'Lion@r@v53/75300697.".....................mgh..."'
55697: '@rWhen she showed off the chain on her wrist with a clank, I was unable to counter her with confidence.'
55698: '@rBut I want to believe.'
55699: '@rThat Clair''s game has now come to one of its possible conclusions, even if it is the least eventful.'
55700: '@r......Perhaps, just once at the end, she wanted to show us a world where no crime occurs.'
55701: '@rHaving disappeared with no regrets,@k perhaps she left us a parting gift in the form of a game where no crime occurs—in a sense, the most peaceful sort of game.'
55702: '@rI would like to believe that.'
55703: '@r......If only these heavy, cold chains weren''t holding us in place in this theater.'
55704: 'Rosa@r@v12/71400172."I-is someone there?!?!"'
55705: '@rRosa''s shrill cry brought the celebrating to an immediate stop.'
55706: '@rRosa knew she''d seen it.'
55707: '@rThe curtain against the wall had fluttered, and the shape of a person had been there behind it.'
55708: 'Rudolf@r@v08/71200117."......None of that, if you don''t mind.@k@v08/71200118. You''re just imagining things......"'
55709: 'Eva@r@v05/71000139."Is someone there?!@k @v05/71000140.If you are, come out...!"'
55710: '@rWhen Eva yelled,@k ......the curtain shook.'
55711: '@rAnd then, ......a witch wearing a black dress appeared from the other side......'
55712: '@rIn an instant, everyone realized that the dress was the same as the one worn by the witch of the portrait,@k ......and they realized one more thing.'
55713: '@rThis person......was the owner of this room.'
55714: 'BEATRICE@r@v27/70700571.".........Welcome to the room of the gold."'
55715: '@rHer face and her voice were expressionless, blank.'
55716: '@rThe others all looked at each other, wondering who should respond.@k Rudolf was the first to speak.'
55717: 'Rudolf@r@v08/71200119."......So, you are BEATRICE."'
55718: 'BEATRICE@r@v27/70700572."Indeed."'
55719: 'Rosa@r@v12/71400173."A-and you''re the one who gave Maria that letter...?!"'
55720: 'BEATRICE@r@v27/70700573."Indeed."'
55721: 'Krauss@r@v02/70800120."......Is Father behind this?"'
55722: 'BEATRICE@r@v27/70700574."No.@k@v27/70700575. This is my...game."'
55723: 'Eva@r@v05/71000141."If that''s so, then we''ve won.@k@v05/71000142. We''ve solved the epitaph''s riddle and found the gold...!"'
55724: 'Hideyoshi@r@v06/71100070."We''ve accepted your challenge and won...!@k @v06/71100071.That means this gold belongs to us, right?!"'
55725: 'BEATRICE@r@v27/70700576."Indeed, it is as you say.@k@v27/70700577. ......You have solved the epitaph splendidly and discovered the hidden gold.@k@v27/70700578. This game ends in your victory.@k@v27/70700579. ......This gold no longer belongs to me, but to all of you......"'
55726: 'Krauss@r@v02/70800121.".........It seems you''re graceful in defeat."'
55727: 'Eva@r@v05/71000143."Hey, you.@k@v05/71000144. ......If we hadn''t solved the epitaph''s riddle, what were you planning to do?"'
55728: 'Rudolf@r@v08/71200120."The letter said that you''d take "everything of the Ushiromiya family"."'
55729: 'BEATRICE@r@v27/70700580."Yes.@k@v27/70700581. I planned to take all of your wealth...and all of your lives.@k@v27/70700582. ......I planned to do as I pleased with everything that exists on this island."'
55730: '@r......The witch walked towards the table next to the bed.'
55731: '@rThen, for the first time, the others realized what sat on that table.'
55732: '@rThey were...four rifles.@k There was also a case filled with bullets......'
55733: '@rThe witch picked up one of the lead bullets lying on the table and played with it, her face still expressionless, as she spoke.'
55734: 'BEATRICE@r@v27/70700583."If...@k@v27/70700584.the night had ended before you managed to solve the epitaph''s riddle,@k@v27/70700585. ......I planned to follow its instructions and commit thirteen murders."'
55735: 'Rosa@r@v12/71400174."Wh-......what did you say......?"'
55736: 'Kyrie@r@v09/71300096."......That''s what I thought when I first saw that epitaph.@k@v09/71300097. ......It almost looks like something you''d find in a serial murder mystery novel.@k@v09/71300098. ......That''s right.@k@v09/71300099. If you had killed thirteen people to match the epitaph, ......that would have made for quite a mysterious crime..."'
55737: 'Natsuhi@r@v03/70900100."Th-there''s no way you could do that all by yourself...!@k @v03/70900101.No matter how many guns you have, killing thirteen people...that would just be...!!"'
55738: 'BEATRICE@r@v27/70700586."......My planning was meticulous and involved many different alternatives.@k@v27/70700587. I envisioned all of the actions you might take from tonight and through tomorrow...and prepared a mystery to deal with each of those.@k@v27/70700588. .........I''m afraid I can no longer reveal them, but I had quite the number of intricate and entertaining locked-room murders prepared."'
55739: 'Rudolf@r@v08/71200121."You could probably have gunned a few of us down in our sleep.@k@v08/71200122. But there''s no way you''d have been able to kill thirteen of us...!@k @v08/71200123.We aren''t that stupid."'
55740: 'BEATRICE@r@v27/70700589.".........It would seem so.@k@v27/70700590. I will admit that the epitaph being solved before the first twilight was the result I considered the most unlikely."'
55741: 'Krauss@r@v02/70800122."So, you never accounted for us reaching this place."'
55742: 'BEATRICE@r@v27/70700591."That is not so.@k@v27/70700592. .........Even this was one of the results of the roulette I wished to create.@k@v27/70700593. And it is most likely the best outcome for all of you.@k@v27/70700594. No one will die, and you can leave this island with the gold.@k@v27/70700595. ......Congratulations.@k@v27/70700596. This game ends with a perfect victory for you all."'
55743: '@rIf no one could solve the riddle, she planned to take those guns and commit a serial murder.@k Everyone gulped as they watched the witch emotionlessly make her confession...'
55744: 'Kyrie@r@v09/71300100."......If your confession is the truth,@k@v09/71300101. that means you were trying to kill us."'
55745: 'BEATRICE@r@v27/70700597."Yes.@k@v27/70700598. That is true."'
55746: 'Rudolf@r@v08/71200124."The hell......@k@v08/71200125. I can''t believe you can just admit to that."'
55747: 'Krauss@r@v02/70800123."You can''t possibly expect us to treat you favorably now that you''ve revealed that to us..."'
55748: 'BEATRICE@r@v27/70700599."I am prepared.@k@v27/70700600. .........You may do as you will with me.@k@v27/70700601. ......If you hadn''t solved the epitaph, I would have done the same to you, so it is only fair."'
55749: 'Hideyoshi@r@v06/71100072."......This girl''s got guts."'
55750: 'BEATRICE@r@v27/70700602."I planned this game because I was prepared to bet my life.@k@v27/70700603. I am satisfied with the result.@k@v27/70700604. ......If you wish to kill me now, I am prepared."'
55751: '@rShe no longer even treasured her life.'
55752: '@rThe witch walked towards the others as she spoke, and they automatically stepped back...'
55753: 'BEATRICE@r@v27/70700605."The gold belongs to all of you.@k@v27/70700606. I planned to give everything to the one who discovered it first, but I didn''t expect there to be seven of you.@k@v27/70700607. ......I leave the decision of how to split the gold to the seven of you.@k@v27/70700608. I will not involve myself.@k@v27/70700609. ......And..."'
55754: '@rThe witch walked even closer.'
55755: '@rShe walked through the middle of the group up to the antique clock behind them.'
55756: '@rThe clock was large and had a dignified feel to it.@k The witch patted it and spoke.'
55757: 'BEATRICE@r@v27/70700610."......Allow me to explain the device within this clock.@k@v27/70700611. For you have gained not just the gold,@k@v27/70700612. but the entirety of this island."'
55758: 'Krauss@r@v02/70800124."What.........do you mean by that?"'
55759: 'Kyrie@r@v09/71300102.".....................@k@v09/71300103. If you interpret the epitaph as a series of murders, then yes, there are only thirteen people killed on the first eight twilights.@k@v09/71300104. ......But on the ninth twilight,@k@v09/71300105. ......it says clearly that none shall be left alive."'
55760: 'Rudolf@r@v08/71200126."What does that mean?@k@v08/71200127. ......In other words, she was planning to massacre all of us?"'
55761: 'Eva@r@v05/71000145.".........Don''t tell me, that clock......"'
55762: 'BEATRICE@r@v27/70700613."As you have guessed,@k@v27/70700614. ......it is connected to a set of explosives."'
55763: 'Kyrie@r@v09/71300106."Are you the one who set that up?@k @v09/71300107.......Or was that Ushiromiya Kinzo?"'
55764: 'BEATRICE@r@v27/70700615."Ushiromiya Kinzo is the one who set up the device.@k@v27/70700616. This device is the source of his mad magical power......"'
55765: 'Hideyoshi@r@v06/71100073."......I, I don''t have a clue what you''re talking about."'
55766: 'Rudolf@r@v08/71200128."In other words,@k@v08/71200129. ......Dad set up this bomb,@k@v08/71200130. and if he ever went broke, he was prepared to die in a blast that would wipe away everything including himself......?"'
55767: 'BEATRICE@r@v27/70700617."On this island, Ushiromiya Kinzo made a contract with the Golden Witch and obtained the gold.@k@v27/70700618. However, that was not all he gained."'
55768: 'Natsuhi@r@v03/70900102.".........Wh-what are you talking about...?"'
55769: 'Eva@r@v05/71000146."Wait, ......don''t tell me......@k@v05/71000147. ........................"'
55770: 'Krauss@r@v02/70800125."There is that rumor about the remains of an old Japanese military base existing on Rokkenjima...@k@v02/70800126. Could it be......"'
55771: 'BEATRICE@r@v27/70700619."Your guess is correct.@k@v27/70700620. ......Beneath this island sleep the remains of an underground Japanese military base from the time of the war.@k@v27/70700621. Along with nine hundred tons of explosives."'
55772: 'Hideyoshi@r@v06/71100074."Ni-......nine hundred tons?!@k @v06/71100075.Th-that''s unbelievable!@k @v06/71100076.If that exploded, the result would be unimaginable!@k @v06/71100077.Forget just the mansion blowing up, it''d leave a massive crater!!"'
55773: 'BEATRICE@r@v27/70700622."I believe an expert''s estimate measured it as a hole several dozen meters deep and a kilometer across."'
55774: 'Krauss@r@v02/70800127."...............There wouldn''t be.........even a trace left......"'
55775: 'BEATRICE@r@v27/70700623."There is a special mechanism that controls the detonation of these explosives.@k@|@y@v27/70700624. ......This switch I just flipped arms the mechanism."'
55776: '@rThe witch toyed with a switch on the top of the antique clock.'
55777: 'BEATRICE@r@v27/70700625."......If midnight arrives while the switch is in this position, the explosives will detonate."'
55778: 'Natsuhi@r@v03/70900103."B-but it''s almost midnight now......"'
55779: 'Kyrie@r@v09/71300108."In other words, it''s not a time bomb that explodes a certain number of hours after you activate it.@k@v09/71300109. ......It''s one that only explodes at the stroke of midnight."'
55780: 'BEATRICE@r@v27/70700626."Indeed.@k@v27/70700627. .........It is almost midnight now.@k@v27/70700628. If an explosion is what you desire, you can just leave it like this."'
55781: 'Eva@r@v05/71000148."Who would want that...?!!@k @v05/71000149.Turn it off!"'
55782: '@rBy this time, Kinzo was probably the only one who knew.'
55783: '@rThe secret base on Rokkenjima had started out as a submarine base.'
55784: '@rHowever, when that plan reached a standstill, it was redefined as a top secret base for homeland defense.'
55785: '@rA huge plan had been drawn up to have the army and navy perform a pincer attack on American forces if the latter decided to land on Kujuukuri Beach and press towards Tokyo.'
55786: '@rAs a trump card for this massive defensive maneuver, the navy started stockpiling large quantities of explosives and fuel in absolute secrecy.'
55787: '@rAnd the Rokkenjima base was the location those were stockpiled at.'
55788: '@rThe total weight of the buried explosives was nine hundred tons.'
55789: '@rAlso, fearing that the Americans might find out the island''s secrets and seize the explosives,@k they set up a system for the self-destruction of the entire island......'
55790: '@rKinzo, who knew about all of this, decided not only to keep this self-destruct system active, but to connect it up to this strange clock that could cause the explosion any night at midnight.'
55791: '@r......Kinzo is famous for building up his funds using a vast store of gold,@k and then using those funds in several sink-or-swim gambles, one after another.'
55792: '@rJust what did his stockpile of gold......and the nine hundred tons of sleeping explosives mean to him?'
55793: '@rAt this point, we can only speculate.@k Perhaps the true source of Kinzo''s mad power......wasn''t the gold after all.'
55794: '@rPerhaps it was this device, with which he could erase himself and this entire island from existence if he lost a big gamble and all that he owned.'
55795: '@rHe must have been putting the gold and everything else he had on the line at every point in his life......'
55796: '@rKinzo had probably looked at this clock at times, ......maybe flipping the activation switch and letting the clock tick down.'
55797: '@rWhenever things got tough and he got stuck, maybe he would hide in here and flip the switch......'
55798: '@rHe might have made it a rule for himself that he would blow everything away if he couldn''t think of a brilliant plan before midnight came.'
55799: '@rHe would gaze at the mountain of gold, listening to the clock tick towards his death as he searched for an idea......'
55800: '@rPerhaps Ushiromiya Kinzo''s real study wasn''t the one in the mansion,@k but this place instead......'
55801: 'Rudolf@r@v08/71200131."......This whole setup sounds just like Dad.@k@v08/71200132. ......So, maybe each time Dad worried about something, all of us kids were put on the line as well..."'
55802: 'Rosa@r@v12/71400175."For our Father, ......it wouldn''t be unthinkable......"'
55803: 'BEATRICE@r@v27/70700629."This device now belongs to all of you.@k@v27/70700630. ......If you want a massive explosion, use it whenever you please."'
55804: 'Hideyoshi@r@v06/71100078."A-are you crazy...?!@k @v06/71100079.Who''d want a big explosion...?!!"'
55805: 'Kyrie@r@v09/71300110."......These explosives are half a century old, right?@k @v09/71300111.Would they really go off?"'
55806: 'BEATRICE@r@v27/70700631."Yes, of course.@k@v27/70700632. The explosives and the fuses are still working.@k@v27/70700633. ......I tested them myself."'
55807: 'Natsuhi@r@v03/70900104."You tested them......?"'
55808: 'Rudolf@r@v08/71200133.".........Could it be......that?"'
55809: 'Krauss@r@v02/70800128."Yes, now I finally understand.@k@v02/70800129. So that''s why the shrine disappeared without a trace..."'
55810: '@rThis summer, the shrine had disappeared without a trace, along with the reef under it.'
55811: '@rIt felt strange that the waves could have destroyed it without a trace like that, but no one had paid it much mind.'
55812: '@rAnd now, this piece perfectly fit into the hole left by that strange feeling......'
55813: 'BEATRICE@r@v27/70700634."Indeed.@k@v27/70700635. .........I used that shrine to test whether the explosives were still working after half a century.@k@v27/70700636. I believe you are all aware of the result."'
55814: 'Natsuhi@r@v03/70900105."......................................."'
55815: 'BEATRICE@r@v27/70700637."The little bit I used was enough to make that entire reef vanish.@k@v27/70700638. As I''m sure you can imagine, nine hundred tons of that would cause an explosion large enough to rewrite the map..."'
55816: 'Krauss@r@v02/70800130."......If an explosion like that happened, all of us would most certainly die.@k@v02/70800131. But what would you have done?@k @v02/70800132.I somehow doubt that you intended on going down with the rest of us..."'
55817: 'BEATRICE@r@v27/70700639."This underground VIP room is connected to an underground passage from the remnants of the military base.@k@v27/70700640. If you go straight along that, you''ll come out at the hidden mansion on the opposite side of the island, Kuwadorian.@k@v27/70700641. It''s about two kilometers away.@k@v27/70700642. If you make it all the way there, it should be possible to escape the blast."'
55818: 'Kyrie@r@v09/71300112."......I see.@k@v09/71300113. So, you planned to escape to there just before the blast."'
55819: 'BEATRICE@r@v27/70700643."I have only said that such a thing is possible.@k@v27/70700644. ......You may not believe this, but if the ninth twilight had ended before any of you could solve the riddle,@k@v27/70700645. ......I planned to die along with everything else."'
55820: 'Rudolf@r@v08/71200134."............There''s something seriously wrong with this girl..."'
55821: 'Eva@r@v05/71000150."She''s insane...@k@v05/71000151. There''s no point thinking about it!@k @v05/71000152.If we hadn''t solved the epitaph, she would have used those guns,@k @v05/71000153.or else that switch,@k @v05/71000154.to massacre all of us!@k @v05/71000155.There''s no doubt in my mind!!"'
55822: 'BEATRICE@r@v27/70700646."You are correct.@k@v27/70700647. ......You have ended this game in the best possible way, without there being even a single victim.@k@v27/70700648. ......I wish to convey my respect and admiration.@k@v27/70700649. Though it was a seven-person effort, it took you only a single night to solve the riddle that took me a very long time to solve.@k@v27/70700650. .........That is worthy of praise."'
55823: 'Krauss@r@v02/70800133."I also admire you for your graciousness and honesty in defeat.@k@v02/70800134. .........We haven''t decided how you will be dealt with, but I hope to do all I can to reach a gentlemanly agreement."'
55824: 'BEATRICE@r@v27/70700651.".........Do not concern yourself with me any longer.@k@v27/70700652. As someone who was already prepared to kill you all and die in the process, I am already one of the dead."'
55825: '@rThe Golden Witch BEATRICE solved the epitaph, reached this room, and revived.'
55826: '@rAnd now.@k ......New people had solved the riddle and reached this room, ......so her role was finished.'
55827: '@rWhen the epitaph''s riddle was solved, ......BEATRICE''s witch illusion ended.'
55828: '@rMost likely, no one in this room would have been capable of understanding her tragic resolve.'
55829: '@r......She herself was probably the only one who could.'
55830: '@rAs long as the many selves inside of her understood, that was enough.'
55831: '@r.........I am one yet many.'
55832: '@rI entrusted myself to the magical roulette of endless possibilities.@k@rThe result, the answer, is this.@k@rThis is what the tarot cards known as the ritual of the epitaph have shown me.'
55833: '@r......BEATRICE is now dead.'
55834: '@rThey did not kill her.@k@rI killed her myself......in accordance with fate''s command.@k@rThey will never understand, .........for all eternity.'
55835: '@r............................'
55836: '@rThe witch stared up at the ceiling without speaking for a while, then looked as though she''d suddenly remembered something.'
55837: '@rShe grabbed at the sleeves of her dress and took out some sort of card.'
55838: 'BEATRICE@r@v27/70700653."Oh, yes.@k@v27/70700654. I forgot.@k@v27/70700655. .........I have no need for money after death.@k@v27/70700656. I will give this to all of you as well."'
55839: 'Rosa@r@v12/71400176."......A cash card?"'
55840: 'BEATRICE@r@v27/70700657."I have converted a portion of the gold to cash.@k@v27/70700658. This is for the account that the money is in."'
55841: 'Hideyoshi@r@v06/71100080."I see.@k@v06/71100081. So this is the magical energy of the Golden Witch."'
55842: 'Krauss@r@v02/70800135."How much is in the account?"'
55843: 'BEATRICE@r@v27/70700659."I''ve forgotten the exact figure.@k@v27/70700660. However, there is more than a billion yen."'
55844: 'Rudolf@r@v08/71200135."A billion...!@k @v08/71200136.......Now that really is magic!"'
55845: 'Kyrie@r@v09/71300114."True.@k@v09/71300115. There''s nothing you couldn''t do with that much money."'
55846: 'BEATRICE@r@v27/70700661."Very true.@k@v27/70700662. The strongest magic to counter the Humans'' anti-magic toxin is this magic of gold.@k@v27/70700663. ......It may be that this card holds greater power than the ingots."'
55847: 'Krauss@r@v02/70800136."Certainly.@k@v02/70800137. Cash would be much more agreeable than ingots."'
55848: 'BEATRICE@r@v27/70700664."Here you go.@k@v27/70700665. .........I have no need of this anymore."'
55849: '@rThe card she held out......was not taken by any of them.'
55850: '@rWho would ever just hand over a card with a billion yen in it?'
55851: '@rThe mountain of gold, the device for blowing up the island, the card with a billion yen...@k ......All of these surpassed their understanding.'
55852: '@rSo, ......no one could bring themselves to take it.'
55853: 'Eva@r@v05/71000156."......I don''t like it."'
55854: 'BEATRICE@r@v27/70700666.".........What don''t you like?"'
55855: 'Eva@r@v05/71000157."Here you go, here''s a mountain of gold.@k@v05/71000158. And I''ll turn off the explosives and give you a card worth a billion yen while we''re at it.@k@v05/71000159. .........It sounds far too good to be true.@k@v05/71000160. ......You''re trying to trick us somehow, aren''t you?"'
55856: 'BEATRICE@r@v27/70700667."I have no desire to trick you, but I won''t try to force you to believe.@k@v27/70700668. ......I have offered you everything, revealed everything.@k@v27/70700669. What you believe and what you do is now for you, the new masters of the gold, to decide.@k@v27/70700670. You are even free to disbelieve all I say and leave this place."'
55857: 'Krauss@r@v02/70800138."Eva.@k@v02/70800139. I can''t imagine that she''s lying."'
55858: 'Eva@r@v05/71000161."And how could you know that?!@k @v05/71000162.I don''t like how relaxed she''s acting!@k @v05/71000163.It''s as though she thinks she''s already won!@k @v05/71000164.......I just had an idea, a second ago!!@k @v05/71000165.What if she''s lying about which is the "off" side of the switch?!"'
55859: 'Rosa@r@v12/71400177."Wh-what do you mean, Nee-san...?"'
55860: 'Eva@r@v05/71000166."Just a second ago, this woman flipped the switch, saying she''d turn off the bomb!@k @v05/71000167.But what if that actually armed the bomb?!@k @v05/71000168.We solved the riddle, so you turned the bomb''s switch to "on", trying to blow us and everything else up, right?!"'
55861: 'BEATRICE@r@v27/70700671."........................@k@v27/70700672. ......If that is what you think, then please feel free to flip the switch on this clock.@k@v27/70700673. It will be midnight in one minute.@k@v27/70700674. ......The clock will show you the truth."'
55862: 'Eva@r@v05/71000169."Wh-......what did you say............?"'
55863: 'Rudolf@r@v08/71200137."H-hey, what''re we supposed to do...?@k@v08/71200138. Is the bomb set to "on" now?@k @v08/71200139.Or "off"?!"'
55864: 'Krauss@r@v02/70800140."I don''t think she could be lying...!@k @v02/70800141.It''s inactive now.@k@v02/70800142. We shouldn''t flip it...!"'
55865: 'Eva@r@v05/71000170."But I don''t like it!!@k @v05/71000171.Why is she so resigned to her fate?!@k @v05/71000172.Why''s she offering us things one after another?!@k @v05/71000173.She''s tricking us to buy time!!@k @v05/71000174.She wants to buy time until midnight so that she can go down in flames along with us!!"'
55866: 'BEATRICE@r@v27/70700675."...................................."'
55867: 'Rosa@r@v12/71400178."Wh-what about the switch itself?@k @v12/71400179.Is there some way to tell if it''s on or off...?"'
55868: '@rOn the upper part of the antique clock was a metal switch that could slide right or left.'
55869: '@rCurrently, it was set to the left.'
55870: '@rHowever, there were no marks in particular on either side to indicate which side was "off" and which was "on".'
55871: 'Rudolf@r@v08/71200140."Hey, tell us the truth!!@k @v08/71200141.Which way is off?!"'
55872: 'BEATRICE@r@v27/70700676.".........Left.@k@v27/70700677. It''s off now."'
55873: 'Eva@r@v05/71000175."Rudolf, you idiot!@k @v05/71000176.You really expect an honest answer from her?!@k @v05/71000177.It''s the opposite... It has to be!!@k @v05/71000178.The right side has to be "off"!!"'
55874: 'Rosa@r@v12/71400180."W-we don''t have any more time, Nee-san...!!"'
55875: 'Krauss@r@v02/70800143."Stop it, Eva!!@k @v02/70800144.Don''t touch the switch!@k @v02/70800145.It''s already off!!"'
55876: 'Natsuhi@r@v03/70900106."Eva-san, take your hand off it!!"'
55877: 'Kyrie@r@v09/71300116."I agree.@k@v09/71300117. It''s "off" now.@k@v09/71300118. If she wanted to kill us with a bomb, she wouldn''t have told us about it."'
55878: 'Eva@r@v05/71000179."...............!!!@k @|@y@v05/71000180.B-......BEATRICEEEEEEE...!!@k @v05/71000181.Don''t think you can trick me......!!!"'
55879: 'BEATRICE@r@v27/70700678."....................................@k@v27/70700679. ...Five,@k@v27/70700680. ......four, ......three..."'
55880: 'Eva@r@v05/71000182."Nng, aah....aaaaaaaaaarrrrgggghh!!!"'
55881: '@rThe second hand of the clock......ticked past midnight.'
55882: '@rOctober 4th ended, ......and the curtain rose on October 5th, 1986......'
55883: '@rThe switch was still pointing to the left.@k@r......The witch''s words had been proven correct.'
55884: 'BEATRICE@r@v27/70700681."............Have I gained your trust now...?"'
55885: 'Eva@r@v05/71000183."Y-...............you bitch!"'
55886: '@rWith a hideous, sweat-covered expression, Eva snatched the cash card away from the witch''s hand.'
55887: 'Eva@r@v05/71000184."......How about a bankbook and seal?@k @v05/71000185.We can''t withdraw anything with just a card!"'
55888: 'BEATRICE@r@v27/70700682."All you need is the PIN.@k@v27/70700683. It''s eight digits long."'
55889: 'Eva@r@v05/71000186."W-wait a second!!@k @v05/71000187.I''m writing it down...!!"'
55890: '@rEva and Kyrie both took out a pen and notepad and began writing the eight-digit number the witch told them.'
55891: 'BEATRICE@r@v27/70700684.".........That is everything I have to tell you and give you.@k@v27/70700685. ......I will say nothing more.@k@v27/70700686. All of my tasks have been completed."'
55892: '@rAfter saying this, the witch spun around......and sat down on the bed.'
55893: '@rShe wasn''t even looking at the others anymore.'
55894: '@rShe sat there like an empty husk which had, just as she had said, finished everything it existed to do......'
55895: '@rFor a while, everyone watched the witch to see if she would remember something else and start talking.'
55896: '@rHowever, she said nothing further.'
55897: '@rThe witch who had called herself one of the dead was now little more than a large French doll wearing a black dress......'
55898: '@rGold is the only physical embodiment of magic that can appear in the human world.@k@rSince ancient times, even a small fragment of it could control men with its magic.'
55899: '@rIn that case, how much magic power would dwell in it...@kif it was piled up in a mountain so high you''d have to look up to see the top?'
55900: 'Eva@r@v05/71000188."Don''t be stupid, we''ll split it evenly!@k @v05/71000189.Isn''t that the obvious solution?!"'
55901: 'Krauss@r@v02/70800146."Didn''t we say that half of this pile would belong to me, and the other half would be split between the four of us?!"'
55902: '@rThe yells of the people dancing around the gold reverberated throughout the underground room...@k@rIn front of the pile of gold, they were arguing about how it should be split.'
55903: 'Eva@r@v05/71000190."Could you have solved the riddle all by yourself, Nii-san?@k @v05/71000191.You couldn''t have, could you?!@k @v05/71000192.The four of us siblings solved it together!@k @v05/71000193.Of course we''ll split it in four equal parts!!"'
55904: 'Natsuhi@r@v03/70900107."Coward!@k @v03/70900108.Weren''t you the ones who first made that proposal about the gold''s distribution?!!@k @v03/70900109.How can you disregard that so easily...?!!"'
55905: 'Rudolf@r@v08/71200142."You really think you''re in a position to bargain?@k @v08/71200143.When you''re the ones hiding Dad''s death...?!!"'
55906: 'Rosa@r@v12/71400181."Th-that''s right, that''s right...!!@k @v12/71400182.You''ve been swindling us this whole time, treating Father''s wealth as if it were your own...!"'
55907: 'Kyrie@r@v09/71300119."All you need to do is split the gold evenly, and we''ll drop all the rest.@k@v09/71300120. It sounds very fair to me."'
55908: 'Krauss@r@v02/70800147."Well, if you''re going to say that, let''s just try splitting it four ways.@k@v02/70800148. Feel free to split this pile in four and carry your own shares home."'
55909: 'Krauss@r@v02/70800149."I hope you have pockets that can hold 2.5 tons of ingots...!@k @v02/70800150.It seems you''ve all been driven mad by the gold and lost all ability to make rational judgments."'
55910: 'Hideyoshi@r@v06/71100082."What do you mean by that, Krauss nii-san?"'
55911: 'Krauss@r@v02/70800151."Look at this ingot.@k@v02/70800152. As you can see, there are no official markings, just Father''s crest.@k@v02/70800153. ......How do you intend to turn unmarked gold into cash?"'
55912: 'Rudolf@r@v08/71200144."Nnn, .........well......"'
55913: 'Krauss@r@v02/70800154."Have you finally figured it out?@k @v02/70800155.This pile of gold may well be worth 20 billion yen.@k@v02/70800156. However, that''s only if you can exchange it for cash.@k@v02/70800157. Are any of you capable of liquidating this many unmarked, unknown ingots at the proper exchange rate without word of it getting out?!"'
55914: '@rIf it was a necklace or a ring, exchanging it for cash would have been a manageable problem.'
55915: '@rHowever, to do that with several tons of unmarked gold that couldn''t be made public...would be impossible for any normal person.'
55916: '@r......However, Krauss could do it.'
55917: '@rAmong the several business associates who had been close to the family since Kinzo''s generation, there were some who had black market ties and sufficient financial clout.'
55918: '@rThe billion yen tied to the cash card that the Golden Witch had handed out was also money that had been liquidated via one of Kinzo''s connections......'
55919: '@rHowever, none of the other siblings had any connections like that.'
55920: '@rThey would have to rely on Krauss to exchange the gold for cash.'
55921: 'Krauss@r@v02/70800158."Now you''re finally seeing it.@k @v02/70800159.I apologize for hiding all of those things about Father.@k@v02/70800160. However, your position is not so strong that you can use them as leverage against me."'
55922: 'Eva@r@v05/71000194."......Y-you really think that little thing gives you the advantage?!?!"'
55923: 'Krauss@r@v02/70800161."What do you intend to do with that gun?@k@v02/70800162. Please, put that vicious thing away."'
55924: '@rEva was gripping the gun so hard it looked like it might snap.'
55925: '@r......The four guns that the witch had placed in this room were now in the hands of the relatives.'
55926: '@rJust as the gold had led their hearts astray,@k it seemed these guns had the magical power to turn their hearts to violence......'
55927: '@rFinally, a scuffle arose between Eva and Krauss.'
55928: '@rOff to the side, Natsuhi started arguing with Rudolf and his wife, and the grand underground VIP room filled with a cacophony of angry outbursts......'
55929: 'Ange@r@v11/72000102."...................................."'
55930: '@rAnge''s face was starting to contort with pain after being forced to watch this scene for so long.'
55931: '@rIt was only natural, after being shown this abusive argument between her parents and her other relatives.'
55932: 'Lion@r@v53/75300698."......What on Earth........."'
55933: '@rIt was painful for Lion too.@k@rLion would have tried to intervene and calm them, if that had been possible.'
55934: '@rThe gold wouldn''t go anywhere.@k If they just took their time and thought about it calmly, they would be able to resolve this.'
55935: '@rEva and the others had argued that they needed a lot of money before the end of the year, which was understandable.'
55936: '@rHowever, the billion yen cash card would be more than enough to pay for that.'
55937: '@rWith their emergency expenses taken care of, they could liquidate the gold at their leisure, then just split it amongst themselves.'
55938: '@rSure, maybe Krauss was the only one capable of converting the gold.@k That might give him an advantage over the other siblings.'
55939: '@rHowever, this gold couldn''t be dealt with by open means.@k In addition to attracting public attention, it would also lead to various legal problems.'
55940: '@rIt was better for this secret money to remain secret.'
55941: '@rIf they wanted to get the largest portions possible, then they should all agree not to tell anyone about this gold.'
55942: '@rIn other words, to maximize their profits, they needed a gentleman''s agreement that all of them would keep the secret.'
55943: '@rKrauss did have a slight advantage.@k However, it was possible for the other relatives to refuse to cooperate and tell the world about the gold.'
55944: '@rAnd then, ......there was also the concealment of Kinzo''s death to consider.'
55945: '@rKrauss was an investor.@k He needed not only financial clout, but also a certain degree of public confidence.'
55946: '@rHis advantage wasn''t big enough for him to act so overbearing.'
55947: 'Lion@r@v53/75300699."......The mountain of gold......has made everyone lose their ability to think rationally.@k@v53/75300700. ......This isn''t an argument between adults.@k@v53/75300701. ......It''s just a fight between kids."'
55948: 'Ange@r@v11/72000103."What''s so fun about showing this to us......?@k@v11/72000104. Or is this the game of some new witch...?@k @v11/72000105.Are they watching us suffer from somewhere and laughing?!"'
55949: 'Lion@r@v53/75300702."......................................."'
55950: '@rBy now, ......even I didn''t have a clue who was showing us this, or for what reason.'
55951: '@rAt the very least, it doesn''t look as though this new tale is overflowing with affection.'
55952: '@r......At first, I thought it was a tale of a beautiful world where no crime occurred, since Clair had gotten past all of her regrets.'
55953: '@rBut something''s different.'
55954: '@rThis tale is clearly filled with ill will towards us.'
55955: '@rI''m sure of that much now, ......but I don''t have a clue who would want to show us this.'
55956: '@rSuddenly, a loud explosion rang out.'
55957: '@r......It didn''t feel like the sound of gunfire.'
55958: '@rAfter all, ......most people living a normal life never hear that sound.'
55959: '@rDrip, drip drip drip.@k@rThe sound of thick raindrops hitting the floor.'
55960: '@r......There was no rain in this underground room.'
55961: '@r......It was the sound of blood dripping down......from Natsuhi''s right eye.'
55962: '@rThe bullet had gone in through her right eye...towards the back of her head......'
55963: 'Krauss@r@v02/70800163."N-.........Natsuhi.........?"'
55964: 'Eva@r@v05/71000195."...I-it''s your fault...for jumping at me......"'
55965: '@rThe gun......which fell from Eva''s grasp......landed on the floor with a hard metallic clang.'
55966: '@rAs though in response to that sound, Natsuhi''s head slowly turned to face the ceiling...'
55967: 'Krauss@r@v02/70800164."......Na-.........Natsuhi......@k@v02/70800165. ......Natsuhiiiiiiiiiiiii!!!"'
55968: '@rNatsuhi flopped backwards.'
55969: '@rWhen the back of her head hit the floor, a red splash spread out beneath it, ......forming a single flower to adorn her dead face...'
55970: 'Rosa@r@v12/71400183."Natsuhi......nee-san......"'
55971: 'Krauss@r@v02/70800166."Wh-why did you shoot her?!@k @v02/70800167.Why did you shoot her, Eva?! Evaaaaaaaaaaaaaaaaaaaaa!!"'
55972: '@rKrauss howled, raised his gun, and ran at Eva.'
55973: '@rAt the same time, Hideyoshi leapt between them.@k A scuffle broke out between the two men.'
55974: 'Krauss@r@v02/70800168."You killed Natsuhi, you killed Natsuhiiiiiiiiiiiii, nngaaaaaaaaaaaahhh!!"'
55975: 'Hideyoshi@r@v06/71100083."K-Krauss nii-san, you''ve got it wrong... You''ve got it all wrong... It was...just an accident......!!"'
55976: 'Krauss@r@v02/70800169."Evaaaaaaaaaa, how could you?!!@k @v02/70800170.I''ll kill you! I''ll kill yooooooooou!!"'
55977: 'Eva@r@v05/71000196."I, .........I didn''t shoot her... I didn''t...@k@v05/71000197. I, ......I told her to stop, and she just jumped at me, and...!!"'
55978: '@rKrauss, who had just seen his wife killed before his eyes, had lost all traces of rationality in his expression.'
55979: '@rHe was so furious that, if he had knocked Hideyoshi aside and jumped at Eva, he might have torn her throat out.'
55980: 'Krauss@r@v02/70800171."Why did you kill her?! Why did you kill her?!@k @v02/70800172.Evaaaaaaaaaaaa!!"'
55981: 'Hideyoshi@r@v06/71100084."It was an accident, ...an accident...!!@k @v06/71100085.Calm down, Krauss nii-san...!!@k @v06/71100086.......Owowowowowow, .........nngggggggggghhhh......"'
55982: '@rAnother explosion rang out.@k@rHideyoshi''s face was covered with blood.'
55983: '@rThe two of them had been fighting over the gun Krauss held, trying to push it away from themselves.'
55984: '@rWhen the barrel had turned to point at Krauss''s chin, .........the sneering, formless reaper, master of the room of gold, had swung its scythe once more.'
55985: '@rA line of blood......trickled from Krauss''s mouth.'
55986: 'Hideyoshi@r@v06/71100087."U-......uwaaaaaaahh, ...hyaaaaaaaaaaahhh...!!"'
55987: '@rThe two fell down, with Krauss''s body on top of Hideyoshi.'
55988: '@rLetting out a cowardly cry, Hideyoshi backed away before Krauss''s body could cover him...'
55989: 'Eva@r@v05/71000198."H-......honey...!!"'
55990: 'Hideyoshi@r@v06/71100088."I didn''t do anythin''!!@k @v06/71100089.Krauss nii-san''s finger just got caught on the trigger...!@k @v06/71100090.It''s an accident, an accident I tell you...!!"'
55991: 'Eva@r@v05/71000199."Th-that''s right, an accident...... This was all an accident......!!"'
55992: '@rAs the pair of them broke down sobbing and repeatedly claiming that it was all an accident, Rosa and the others were unable to say a thing......'
55993: '@rThe witch also watched this scene, but said nothing, and appeared to be completely disinterested.'
55994: 'Hideyoshi@r@v06/71100091."I-......it wasn''t our fault...!@k @v06/71100092.It''s just an accident, an accident...!@k@v06/71100093. You saw, right?! Right? Right?!"'
55995: 'Eva@r@v05/71000200."You saw that, didn''t you, Rosa?!@k @v05/71000201.Krauss nii-san and Natsuhi nee-san both let their emotions get ahold of them and charged at us...!"'
55996: 'Rosa@r@v12/71400184."............Well,@k@v12/71400185. I can''t say I''m sure."'
55997: 'Eva@r@v05/71000202."Stupid Rosa!!@k @v05/71000203.You saw, didn''t you?!@k @v05/71000204.You saw it from right there, so you must know!!"'
55998: 'Rosa@r@v12/71400186."I''m sorry.@k@v12/71400187. I can''t tell if it happened by accident...or if you killed them and tried to make it look like an accident."'
55999: 'Eva@r@v05/71000205."R-Rosa, you......!!!"'
56000: 'Hideyoshi@r@v06/71100094."Rudolf-kun...!@k @v06/71100095.You saw!@k @v06/71100096.You know what happened, right?!@k@v06/71100097. Right?!"'
56001: 'Rudolf@r@v08/71200145."........................@k@v08/71200146. ......Sorry, but I agree with Rosa.@k@v08/71200147. We can''t tell if it was an accident or intentional."'
56002: '@rRosa''s and Rudolf''s gazes looked very cold and indifferent to Eva and her husband.'
56003: 'Eva@r@v05/71000206."What are we going to do? They were shot to death...!@k @v05/71000207.We can''t just write this off as an accident...!!"'
56004: 'Hideyoshi@r@v06/71100098."Th-the forest!@k @v06/71100099.We''ll say they went to the forest and went missing! Then we can buy some time...!"'
56005: 'Eva@r@v05/71000208."That won''t get us off the hook, right?!@k @v05/71000209.The police will just search the whole forest!!@k @v05/71000210.And anyway, why would those two go off into an uncultivated forest like that?!@k @v05/71000211.It''ll look suspicious from the start!@k @v05/71000212.There''s no way we''ll get away with it!!"'
56006: 'Hideyoshi@r@v06/71100100."It''ll be okay...!@k @v06/71100101.If we hide the corpses here, no one will be able to find them!@k @v06/71100102.If we all play dumb, it''ll work!"'
56007: 'Rosa@r@v12/71400188."It won''t......@k@v12/71400189. There''s no way you can fool the police.@k@v12/71400190. If the two of them disappear during a family conference where we were arguing over the inheritance problem,@k@v12/71400191. ......the police won''t just put it down as a case of missing persons."'
56008: 'Eva@r@v05/71000213.".....................@k@|@y@v05/71000214. .........I, I just thought of something..."'
56009: '@rThough Eva had been scratching at her head, overcome with emotion,@k ......her arms suddenly fell as though their strings had been cut.'
56010: 'Hideyoshi@r@v06/71100103."Wh-......what did you think of?"'
56011: 'Eva@r@v05/71000215."......An accident.@k@v05/71000216. ......We just need to make it look like an accident."'
56012: 'Hideyoshi@r@v06/71100104."Don''t talk stupid...!@k @v06/71100105.What kind of accident...?!@k @v06/71100106.There are clear gunshot wounds on both corpses!@k @v06/71100107.Even if we burn them to make it look like they were caught in a fire, it''ll still be obvious that they were killed by guns!!"'
56013: 'Eva@r@v05/71000217."......A fire?@k @v05/71000218.That''s not good enough.@k@v05/71000219. ......We need more.@k@v05/71000220. A much more massive accident."'
56014: 'Hideyoshi@r@v06/71100108."A, ......a massive accident......?"'
56015: '@rEva slowly walked forward, .........tapped on it, and spoke.'
56016: 'Eva@r@v05/71000221."An explosion accident.@k@v05/71000222. ......We just need the sort of accident that will leave no traces of their corpses."'
56017: '@rAs she played with the switch that would cause an automatic explosion at midnight,@k ......Eva spun around to face them, a crazed expression on her face...'
56018: '@rIt was truly...a mad inspiration.'
56019: '@rIf they flipped the switch to the right and waited for midnight, the nine hundred tons of explosives would wipe out the mansion without a trace.'
56020: '@rThere wouldn''t even be remnants of the corpses.@k There would be no way to tell that they had died by gunshot wounds before the explosion.'
56021: 'Eva@r@v05/71000223."It''s an unshakable fact that this island is still filled with explosives from the war!@k@|@y@v05/71000224. Then, by coincidence, tomorrow night...something will set it off by chance and the whole thing will explode!!@k@|@y @v05/71000225.Yes, it''ll be an accident!@k @v05/71000226.An explosion accident!!@k@|@y @v05/71000227.What do you say?!!@k @v05/71000228.There''s no way the police will find out the truth!!@k@|@y @v05/71000229.This way, we can pull it off!!@k @v05/71000230.We can hide the manner of their deaths!!"'
56022: 'Hideyoshi@r@v06/71100109."Ha......hahaha......how......ridiculous......"'
56023: '@rShaking, Hideyoshi frantically searched for a counterargument, hoping to repudiate Eva''s mad idea.'
56024: '@r.........But he couldn''t find one.'
56025: '@rIf they blew everything up, the facts would all be muddled......@k@rThey could make it look as though Krauss and Natsuhi had died in an explosion accident......!'
56026: 'Eva@r@v05/71000231."It''s perfect, just perfect...!!!@k @v05/71000232.After all, it was an accident that they died anyway!@k @v05/71000233.We''re just changing the type of accident!!@k @v05/71000234.Isn''t that right?@k @v05/71000235.We can think up any story we want!!@k @v05/71000236.By chance, the rest of us will happen to be in the hidden mansion tomorrow night!@k @v05/71000237.Then, when the explosion accident occurs, we''ll be lucky enough to survive!!@k @v05/71000238.That story should work!!"'
56027: 'Rosa@r@v12/71400192.".........J-just what sort of story are you planning on?@k@v12/71400193. ......What kind of story could explain how the two of them alone remained here,@k@v12/71400194. while the rest of us went to the hidden mansion and conveniently managed to escape...?!"'
56028: 'Eva@r@v05/71000239."That''s what we''ve got to think up now, stupid Rosa!!!@k @v05/71000240.It doesn''t matter what it is, as long as we all agree to it!!@k @v05/71000241.I''ll think of something... I am thinking... You all think too!!@k @v05/71000242.Someone think of somethiiiiiiiiiiiing!!!"@|@y'
56029: 'Hideyoshi@r@v06/71100110."C-calm down, Eva...@k@v06/71100111. I''ll think about it, and so will everyone else!@k @v06/71100112.We''ll definitely think of something, and it''ll all work out!@k @v06/71100113.We''ll share the burden. You won''t have to carry it all yourself...!!@k @v06/71100114.It''ll be okay... It will!!@k @v06/71100115.I know we''ll think of a good excuse!"'
56030: 'Rosa@r@v12/71400195."......What kind of excuse?@k @v12/71400196.We took the kids and all the servants to go exploring an underground passageway, leaving just the two of them behind,@k@v12/71400197. and the rest of us all decided to spend the night in the hidden mansion?@k @v12/71400198.How could any excuse work?@k@v12/71400199. ......It''s insane!"'
56031: 'Eva@r@v05/71000243."And thinking up that insane thing is our job!!@k @v05/71000244.Why are you acting like this has nothing to do with you?!@k @v05/71000245.You think of something too!!!"@|@y'
56032: 'Rosa@r@v12/71400200.".........Nee-san.@k@v12/71400201. Let me ask you a question.@k@v12/71400202. ......If you blow up the island, what will happen to this gold?"'
56033: 'Eva@r@v05/71000246."Nnn, ......w-.........well....................."'
56034: 'Rosa@r@v12/71400203."We''ve finally gotten our hands on 20 billion yen of gold.@k@v12/71400204. And you want to blow it all away...?"'
56035: 'Eva@r@v05/71000247."We can just carry it away, it''s as simple as that!!@k @v05/71000248.The explosion will happen tomorrow at midnight!@k @v05/71000249.We have a full day!!@k @v05/71000250.If we all carry it together, we might—"'
56036: 'Rosa@r@v12/71400205."You realize there''s ten tons of it, right?@k @v12/71400206.......We''re a small group who can each shoulder a sack of rice in weight at best, and we only have a single day.@k@v12/71400207. Just how much do you think we can carry back and forth across this long underground passage that goes all the way across the island?@k@v12/71400208. You''re being absurd."'
56037: 'Eva@r@v05/71000251."H-here!!@k @v05/71000252.We have this card!@k @v05/71000253.The card worth a billion yen which that woman gave us!!@k @v05/71000254.We can just carry whatever gold we can!@k @v05/71000255.We have the card worth a billion yen on top of that!@k @v05/71000256.If we split that three ways, we''ll have more than 300 million each!@k @v05/71000257.That should be enough for all of our purposes!!"'
56038: 'Rosa@r@v12/71400209."No thanks."'
56039: 'Eva@r@v05/71000258."Wh-......what.........?"'
56040: 'Rosa@r@v12/71400210."There''s a mountain worth 20 billion yen right here.@k@v12/71400211. Why should I be satisfied with a measly 300 million?"'
56041: 'Eva@r@v05/71000259."R-......Rosaaaaa......"'
56042: '@rEva''s face twisted in anguish, ......and was met by Rosa''s look of cold unconcern.'
56043: 'Rosa@r@v12/71400212."......Even if we factor in Krauss nii-san''s share,@k@v12/71400213. that gives us a rightful share of 5 billion yen each.@k@v12/71400214. Subtract the 300 million from the card, and the rest of my share is 4.7 billion.@k@v12/71400215. ......If you agree to pay that much to me, then you can do whatever you want with this mountain of gold."'
56044: 'Eva@r@v05/71000260."What do you think you''re saying?!@k @v05/71000261.So, you don''t intend to cooperate?!"'
56045: 'Rosa@r@v12/71400216."Nee-san.@k@v12/71400217. Please calm down and listen.@k@v12/71400218. I''m going to suggest to you the way that both of us can leave with the most money."'
56046: 'Eva@r@v05/71000262."Wh-what......?!?!"'
56047: 'Rosa@r@v12/71400219."I want you to go to the police and turn yourself in, admitting that you got into a scuffle and the gun went off."'
56048: 'Eva@r@v05/71000263."A-are you crazy?! I don''t want to go to the police!!!"'
56049: 'Rosa@r@v12/71400220."Of course, we don''t want to say that the crime happened here.@k@v12/71400221. The police would find the gold.@k@v12/71400222. ......Yes, what about the rose garden?@k @v12/71400223.It''s pouring rain now, so the police probably won''t find any contradictions in the crime scene."'
56050: 'Rosa@r@v12/71400224."I''ll let you think of an excuse for why you and Nii-san started fighting while you were holding guns in the rainy rose garden.@k@v12/71400225. ......Don''t try to get us and our shares involved just because you want to hide your crime."'
56051: 'Eva@r@v05/71000264."R-Rosaaaaaaaaaaaaaaaaaaaaa!!!"@|@y'
56052: 'Rosa@r@v12/71400226."It''s not so bad, right?@k@v12/71400227. It''s not like they''ll lock you up for decades.@k@v12/71400228. It was an accident, right? You''ll be able to get out after just a few years.@k@v12/71400229. ......Once you''ve paid for your crime and gotten out, then you can do whatever you want with your 5 billion."'
56053: 'Eva@r@v05/71000265."No, absolutely no!!@k @v05/71000266.What would happen if we were arrested?!@k @v05/71000267.What would happen to my husband''s company?!"'
56054: 'Rosa@r@v12/71400230."Who cares about the company?@k@v12/71400231. With 5 billion yen, working any longer would just be a waste of time, right?"'
56055: '@rRosa had never intended to go along with the idea Eva proposed.'
56056: '@rAs far as the size of each person''s portion went, no one had anything to gain from an explosion accident.'
56057: '@rBy doing that, they could conceal Krauss and Natsuhi''s deaths.@k There was no other reason to do it.'
56058: '@rFrom Rosa''s perspective, the ideal outcome would be for them to confess to their crimes, without any unnecessary tricks.'
56059: '@rAll she wanted to do was to change the crime scene from here to a different place.'
56060: '@rHowever, Eva didn''t want to be arrested.'
56061: '@rShe didn''t like having her share shrink from 5 billion to 300 million,@k but even that was more than enough to cover the amount she had been trying to wring out of Krauss in the first place.'
56062: '@rShe wanted to hide what had happened here, even if it meant blowing away 4.7 billion yen.'
56063: '@rWhat would happen if they were arrested?'
56064: '@rThe life, the company, and the trust that Eva and her husband had worked so long to build...... Those were things that couldn''t be bought back with money.'
56065: '@rSo, she wanted to hide Krauss and Natsuhi''s deaths, even if it meant blowing up all 4.7 billion yen worth of her gold...!'
56066: '@rBut from Rosa''s perspective, that was just irrational nonsense.'
56067: 'Eva@r@v05/71000268."R-Rosaaaaaaaaaaaaa!!"'
56068: 'Rosa@r@v12/71400232."What do you think you''re doing with that gun, Nee-san?@k@v12/71400233. ......Are you going to "misfire" and kill me too?@k @v12/71400234.That''ll make finding an excuse even harder.@k@v12/71400235. In fact, it''ll also make it harder to explain away the other two deaths as accidents too..."'
56069: 'Rosa@r@v12/71400236."If you end up linked to three deaths, that''s a fairly huge crime.@k@v12/71400237. .........They''ll seek the death penalty, most likely.@k@v12/71400238. And settle for a life sentence.@k@v12/71400239. At the very least, you''ll be put away for a good ten-plus years."'
56070: 'Rosa@r@v12/71400240."Give up and turn yourself in.@k@v12/71400241. If you do, this''ll be no more than a pair of unfortunate accidents.@k@v12/71400242. Of course, your prison term won''t be too terrible either.@k@v12/71400243. ......Don''t worry about George-kun.@k@v12/71400244. We''ll take good care of him.@k@v12/71400245. And we''ll make sure that all 5 billion of your share will be waiting for you when you get back."'
56071: '@rEva ground her teeth and glared.'
56072: '@rThe Rosa she knew should have been shaking and obeying her commands.@k And yet, ......Rosa wasn''t scared.'
56073: '@rHer blank expression—@kno, that slight smile—was one that Eva had never seen before.'
56074: 'Rosa@r@v12/71400246."Put the gun down, Nee-san.@k@v12/71400247. If you calm down, you''ll see that my plan is the best one.@k@v12/71400248. ......Prison isn''t so bad, right?@k@v12/71400249. Think of it as a financial strategy."'
56075: 'Rosa@r@v12/71400250."Even if they put you in for ten years, there will be 5 billion waiting for you when you get out.@k@v12/71400251. That''s like working for a 500 million yen salary, right?@k @v12/71400252.If you think of it that way, you might even enjoy your job."'
56076: 'Eva@r@v05/71000269."Liar!!!@k @v05/71000270.You just want to make off with my share while I''m in there!!@k @v05/71000271.Like your man did to you!!!"'
56077: 'Rosa@r@v12/71400253."H-he has nothing to do with this, okay?!?!@k @v12/71400254.I''m not going to run off! I would never, ever run away with money!@k@v12/71400255. ...I, .......I would never do thaaaaat!!!"'
56078: '@rRosa''s once-stony expression was filled with rage.@k@rThe two howling people pointed their guns at each other, shouting insults at each other......'
56079: '@rYou could smell the gold room''s reaper slinking closer.'
56080: '@rThe smell of gunpowder, the explosive smell of death, ......filled the room......'
56081: '@rBlorp.'
56082: '@rA bubble of blood dripped from Rosa''s mouth.'
56083: '@rThen, ......she fell over lifelessly, ......like a mannequin.'
56084: 'Hideyoshi@r@v06/71100116."......E-......Eva......?!"'
56085: 'Eva@r@v05/71000272."I-......i-it wasn''t me!@k @v05/71000273.I swear I didn''t even pull the trigger?!"'
56086: 'Kyrie@r@v09/71300121."............Eva nee-san, you just shot Natsuhi-san, so your gun wasn''t loaded, right...?@k @v09/71300122.You never reloaded, so even if you pull the trigger, that gun wouldn''t kill anyone.@k@v09/71300123. Have no fear."'
56087: '@rAs Kyrie said this, she maneuvered the lever action with a practiced hand, and a smoke-smelling shell casing was ejected...'
56088: '@rIt hit the floor with a small, metallic sound.@k That tiny sound had a disturbing ring to it...'
56089: 'Kyrie@r@v09/71300124."Rosa-san''s analysis was a little naive.@k@v09/71300125. ......Converting this many unmarked gold ingots into usable money...@k@v09/71300126. She has no idea how difficult that would be."'
56090: 'Rudolf@r@v08/71200148.".........Dad just used it as show money to gain confidence, and even that was enough to create the rumor called the Legend of the Ushiromiya Gold.@k@v08/71200149. ......It''s impossible to liquidate it.@k@v08/71200150. A pile of gold you can''t use is no better than a pile of shit."'
56091: 'Kyrie@r@v09/71300127."Ten tons of gold exchanged on the black market. The successor and his wife dead in suspicious circumstances.@k@v09/71300128. Expecting that not to attract attention is what''s really impossible.@k@v09/71300129. ......It''s better not to get the police involved.@k@v09/71300130. We''ll blow up this island and destroy all the evidence.@k@v09/71300131. If it''s tough parting with the gold, feel free to grab a few ingots.@k@v09/71300132. The billion yen on the cash card is more than enough.@k@v09/71300133. ......In other words, Eva nee-san, you''re right."'
56092: 'Eva@r@v05/71000274."I, .........I''m glad......@k@v05/71000275. ......It looks like we''re on the same page......@k@v05/71000276. ...I-if the police get involved, who knows what might happen?@k@v05/71000277. It''s the same with cashing in the gold.@k@v05/71000278. It''d just create more opportunities for word to get out somehow, it''s more than we can handle...!!"'
56093: 'Eva@r@v05/71000279."The billion yen that woman over there exchanged for cash is the only money we can get our hands on!@k @v05/71000280.And even splitting that billion, it''ll be more than enough for what we need...!@k @v05/71000281.On top of that, now that Rosa is dead, our shares have increased even more...!@k @v05/71000282.We can each leave this island with 500 million...!"'
56094: 'Kyrie@r@v09/71300134."Exactly.@k@v09/71300135. As long as we don''t let our greedy desire to cash in the gold control us,@k@v09/71300136. ......we can pretend that everything that occurred on this island never happened.@k@v09/71300137. We have a way to do that right here."'
56095: '@rThere was no longer any reason to worry about accidental discharges or people being shot to death on this island.'
56096: '@rEverything would be erased equally by the explosion accident.'
56097: '@rNo matter what happened between now and midnight the next day, everything would be rewritten by the explosion accident.'
56098: 'Eva@r@v05/71000283."......And you told me......to turn myself in?! Stupid Rosa...!@k @v05/71000284.You weren''t satisfied with a measly 300 million?@k @v05/71000285.This is what you get for being too greedy......@k@v05/71000286. Y-...you got nothing more than you deserved......"'
56099: 'Hideyoshi@r@v06/71100117."But Kyrie-san, ......there was no need to shoot her, right......?@k@v06/71100118. Even Rosa-san would''ve figured it out if you''d just told her......"'
56100: 'Kyrie@r@v09/71300138."I did need to shoot her.@k@v09/71300139. After all, Rosa-san''s the only one who didn''t fire her gun."'
56101: 'Hideyoshi@r@v06/71100119.".........What does that matter...?"'
56102: 'Kyrie@r@v09/71300140."The guns lying at your feet are Krauss nii-san''s and Eva nee-san''s.@k@v09/71300141. Both of those have been fired.@k@v09/71300142. However, Rosa-san''s gun can shoot if you just pull the trigger.@k@v09/71300143. It''s hard to reload one of these if you aren''t used to a lever action.@k@v09/71300144. An amateur couldn''t do it."'
56103: 'Eva@r@v05/71000287."Kyrie-san, what are you talking about......?"'
56104: 'Hideyoshi@r@v06/71100120."Y-......you......!!"'
56105: '@rThey finally realized what Kyrie meant.'
56106: '@r..."Rosa had the only gun that could still fire, so I shot her first".'
56107: '@rOh, how foolish we were... Why didn''t we realize sooner?'
56108: '@rWe should have realized that there''s a mechanism for erasing everything that happens on this island...'
56109: '@rEva and Hideyoshi hurried to pick up the guns that lay at their feet.'
56110: '@rAt the same time, fire spat from Kyrie''s gun once more.'
56111: '@rHideyoshi let out a short scream, clutched at his chest, and fell over face-down.'
56112: 'Eva@r@v05/71000288."Honey?!@k @v05/71000289.Honey...!!"'
56113: 'Eva@r@v05/71000290."......Ngh, ......what''s wrong with this—"'
56114: '@rEva fiddled with the lever action, trying to imitate something she vaguely remembered from old westerns,@k but something seemed to be caught, and the still-open lever didn''t budge.'
56115: 'Kyrie@r@v09/71300145."See?@k @v09/71300146.It''s pretty hard."'
56116: 'Eva@r@v05/71000291."Y-......you.........!!!"'
56117: '@rKyrie finished reloading with a fluid motion.@k@rThe way she held it was as innocent and sure as a kid playing with a squirt gun.'
56118: '@rWith another heartless cry of gunfire, the puppet called Eva slumped down to the floor...@kas though all her strings had been cut......'
56119: 'Kyrie@r@v09/71300147."......Rudolf-san.@k@v09/71300148. The billion yen card."'
56120: 'Rudolf@r@v08/71200151."Sure......"'
56121: '@rThe cash card with a billion yen, which Eva had just grabbed from the witch.'
56122: '@rThat alone was worth more than enough.'
56123: '@rThe 20 billion yen pile of gold had skewed everyone''s sense of value.'
56124: '@rPeople could kill over a few million yen.@k And this was a billion.'
56125: 'Kyrie@r@v09/71300149."Rosa-san.@k@v09/71300150. Those were some famous last words there.@k @v09/71300151."A measly 300 million"?@k @v09/71300152.......You were too greedy."'
56126: 'Rudolf@r@v08/71200152."Heheh......@k@v08/71200153. No doubt.@k@v08/71200154. .........Ah, lucky me.@k@v08/71200155. I don''t have to fish through her corpse."'
56127: '@rAs Rudolf walked up to Eva''s body, he found the card lying beside it...and picked it up.'
56128: 'Rudolf@r@v08/71200156."So, this thin, little card is worth a billion yen...@k@v08/71200157. ......Keeping the company going feels ridiculous now.@k@v08/71200158. Shall we close up shop and spend the rest of our lives in some southern country?"'
56129: 'Kyrie@r@v09/71300153."That would just get boring.@k@v09/71300154. Besides, I like seeing you get all worried about some problem, then play around like a little kid when you finally overcome it."'
56130: 'Rudolf@r@v08/71200159."Heheheh...!@k @v08/71200160.Sure you do..."'
56131: 'Kyrie@r@v09/71300155."Thank you, Ms. Golden Witch.@k@v09/71300156. ......Rudolf-san and I will make good use of this billion."'
56132: 'BEATRICE@r@v27/70700687."................................."'
56133: 'Kyrie@r@v09/71300157."Krauss nii-san promised to treat you in a gentlemanly fashion.@k@v09/71300158. But I haven''t made any such promise."'
56134: '@r......She pulled the trigger without a trace of mercy.'
56135: '@rWhen the ringing of the gunfire died down, ......blood trickled from the witch''s mouth, and she fell over onto the bed.'
56136: '@rOnce again, Kyrie ejected the used shell casing.'
56137: '@rThe four metal sounds of used shells hitting the floor seemed to symbolize the fact that Rudolf and his wife now possessed all shares of the gold......'
56138: 'Kyrie@r@v09/71300159."......All of them were really slow-witted......@k@v09/71300160. ......From the moment she explained about the bomb, the entire notion of playing nicely vanished from this island, and they failed to notice."'
56139: 'Rudolf@r@v08/71200161."Sorry ''bout this, Aniki, Aneki, Rosa.@k@v08/71200162. ......What can I say, that''s just how the cookie crumbles.@k@v08/71200163. Cut me a break, okay?@k@v08/71200164. Aniki and Aneki get into a fight, Rosa gets dragged in,@k@v08/71200165. and I run away with the bone.@k@v08/71200166. ......Just the same way it''s always been, right?"'
56140: '@rAt the start, Rudolf and Kyrie hadn''t planned to kill everyone and take everything for themselves.'
56141: '@rKyrie had quickly realized by the size of the gun in her hands that it would probably hold five rounds at a time.'
56142: '@r.........Yes.@k Both Kyrie and Rudolf knew a lot about these guns.'
56143: '@rRudolf, who had gotten his interest in old-style western guns from his father, owned a shotgun of a similar design.'
56144: '@rSince Kyrie had the same skill at handling firearms, they both knew enough about these guns to enjoy shooting together...'
56145: '@rIncluding the witch, there had been eight people there.@k Six people besides the two of them.'
56146: '@rEach gun held five rounds.@k ......That was one short.@k They didn''t have enough to kill everyone.'
56147: 'Rudolf@r@v08/71200167."......I was honestly surprised when they got into a fight and one of the guns went off."'
56148: '@rThat coincidental accident......had provided the missing bullet.'
56149: '@rIt wasn''t the second shot.@k The very first shot, which had accidentally killed Natsuhi, had guaranteed the result of this massacre...'
56150: '@rIn this smoke and corpse-filled room of gold, the two of them wore easygoing smiles, hardly any different from the ones they usually wore...'
56151: 'Rudolf@r@v08/71200168."......So.@k@v08/71200169. What now?"'
56152: '@rRudolf picked up Rosa''s gun.@k Then, he fired a test shot at the wall and ejected the old shell with a smooth motion like Kyrie''s.'
56153: '@rKyrie went to the box of bullets on the table, casually picked up a few, and loaded them one after another into her gun.'
56154: 'Kyrie@r@v09/71300161."Set the bomb switch to "on".@k@v09/71300162. Then, we just need to wait twenty-four hours."'
56155: 'Rudolf@r@v08/71200170."The others''ll make a lot of noise when they realize everyone''s missing in the morning."'
56156: 'Kyrie@r@v09/71300163."Then we just need to shut them up."'
56157: 'Rudolf@r@v08/71200171."Guess so.@k@v08/71200172. ......What about Battler?"'
56158: 'Kyrie@r@v09/71300164."He''s your son.@k@v09/71300165. Not mine."'
56159: 'Rudolf@r@v08/71200173."Don''t say that.@k@v08/71200174. He really took a shine to you.@k@v08/71200175. He respects you, you know."'
56160: 'Kyrie@r@v09/71300166."Then think of something clever that''ll convince him.@k@v09/71300167. I''ll worry about Ange.@k@v09/71300168. You worry about Battler-kun.@k@v09/71300169. Fair enough?"'
56161: 'Rudolf@r@v08/71200176."Nn, .........sure."'
56162: 'Kyrie@r@v09/71300170."I may be kind to my own child,@k@v09/71300171. ......but it''s quite a struggle for me to treat Asumu-san''s kid the same way.@k@v09/71300172. You understand, I hope?"'
56163: 'Rudolf@r@v08/71200177.".............................."'
56164: '@rKyrie''s voice had grown cold.'
56165: '@rKyrie had acted warmly towards Battler because that had been the adult thing to do.'
56166: '@rHe was Rudolf''s son, so she just tried to avoid being unkind.'
56167: '@rBut underneath, he was the son of Asumu, the woman whose death had done nothing to quell the hate Kyrie harbored towards her.'
56168: '@rNow that she had given birth to Ange and finally built up a new family,@k .........was Battler''s return really such a happy thing for her......?'
56169: 'Kyrie@r@v09/71300173."Brace yourself.@k@v09/71300174. Now that we''ve come this far,@k@v09/71300175. ......we can only go for the billion yen or die trying.@k@v09/71300176. If Battler-kun is unconvinced, I''m sorry, but I won''t be taking any chances."'
56170: 'Rudolf@r@v08/71200178.".........No need to threaten me.@k@v08/71200179. I''ll take care of it.@k@v08/71200180. I''ll find a good story to tell him."'
56171: 'Kyrie@r@v09/71300177."Make sure you do a good job of it.@k@v09/71300178. ......If Ange hears that Battler-kun has died in an accident, I''m sure she''ll be very sad."'
56172: 'Rudolf@r@v08/71200181."Sure......@k@v08/71200182. .....................@k@v08/71200183. ......How do we start?"'
56173: 'Kyrie@r@v09/71300179."We have nothing to gain by waiting for morning.@k@v09/71300180. Now is the best time."'
56174: 'Rudolf@r@v08/71200184."......Oh, wonderful.@k@v08/71200185. Not even time for a break."'
56175: 'Battler@r@v10/70100169."......A test?@k @v10/70100170.What is he thinking?@k@v10/70100171. At this time of night?@k @v10/70100172.Right now?"'
56176: '@rBattler yelled wildly into the receiver.'
56177: '@rWhen he said "at this time of night", George and Jessica turned to look.'
56178: '@rAccording to the clock, it was past midnight.'
56179: '@rIt might be a normal time to be told to brush their teeth and go to bed, but they couldn''t understand what this "test" was all about.'
56180: 'Battler@r@v10/70100173."Okay, I''ll hand it over.@k@|@y@v10/70100174. .........Here, George-aniki.@k@v10/70100175. It''s my dad."'
56181: 'George@r@v07/70300168."......Hello,@k@v07/70300169. this is George speaking."'
56182: 'Rudolf@r@v08/71200186."Ah, hey, George-kun.@k@v08/71200187. Sorry to call so late.@k@v08/71200188. I''ll bet I didn''t wake you, though, right?@k @v08/71200189.You''re all still up chatting away?"'
56183: 'George@r@v07/70300170."Pretty much.@k@v07/70300171. Maria-chan is sleeping, ......oh, wait, looks like she just woke up.@k@v07/70300172. So, what did you want to talk about?@k @v07/70300173.Battler-kun said something about a test..."'
56184: 'Rudolf@r@v08/71200190."Yep.@k@v08/71200191. Dad can be such a pain sometimes.@k@v08/71200192. He suddenly came down from his room.@k@v08/71200193. A bunch of stuff happened, and he suddenly started talking about which grandchild would make the best successor."'
56185: 'George@r@v07/70300174."......But isn''t Uncle Krauss the successor?"'
56186: 'Rudolf@r@v08/71200194."He says that none of us are good enough to be the successor.@k@v08/71200195. ......So, he''s talking about skipping us adults and choosing one from you grandchildren instead.@k@v08/71200196. It''s really shaken us up, having this forced on us all of a sudden.@k@v08/71200197. Aniki and the others are all arguing about it across the room.@k@v08/71200198. Maybe you can hear Aneki''s shrill voice leaking through across the phone."'
56187: 'George@r@v07/70300175."I-......is that so?@k@v07/70300176. If that''s what Grandfather says, then there''s no way around it, I guess...@k@v07/70300177. In that case, what should we do?"'
56188: 'Rudolf@r@v08/71200199."He says he wants to call you out one by one, starting with Jessica-chan.@k@v08/71200200. ......Oh, wait a sec.@k@v08/71200201............................@k@v08/71200202. ......Okay, you still there?@k@v08/71200203. Looks like George-kun and Jessica-chan will be the first up to bat.@k@v08/71200204. He wants Jessica-chan to go to the parlor in the mansion.@k@v08/71200205. You''re supposed to go out by the chapel."'
56189: 'George@r@v07/70300178."It''s so sudden, I hardly feel ready......@k@v07/70300179. What sort of test is it?"'
56190: 'Rudolf@r@v08/71200206."It looks like Dad''s made some sort of crazy quiz.@k@v08/71200207. ......Some weird questions about what it means to be the head."'
56191: '@rOf course, George felt as though something wasn''t right.'
56192: '@rHowever, Kinzo was famous for doing radical things on a whim.@k ......Even this strange test seemed plausible once he heard that it was a sudden idea of Kinzo''s.'
56193: '@r......But even in that case, if he wanted to test them one by one, why wouldn''t he call them out one by one?'
56194: '@rLike an interview, they should just have to wait in the reception room and go when they were called.'
56195: '@rWhy would two people be called to different places at the same time?@k ......The plan didn''t seem to make sense, which made George feel as though he was missing something.'
56196: 'Rudolf@r@v08/71200208."Still, I wonder why he wanted you to go to the chapel, of all places.@k@v08/71200209. ......It seems your grandfather expects a lot from you.@k@v08/71200210. I''m not sure what it is, but I think he wants to talk to you about something alone."'
56197: 'George@r@v07/70300180."......Grandfather...wants to talk to me?"'
56198: 'Rudolf@r@v08/71200211."I wonder what it is.@k@v08/71200212. You are the most accomplished of all his grandchildren, after all.@k@v08/71200213. I guess there''s something he wants to tell you in particular.@k @v08/71200214.......Well, anyway, that''s what he says.@k@v08/71200215. Get over there right away.@k@v08/71200216. I''m also supposed to go there.@k@v08/71200217. Let''s get this over with.@k@v08/71200218. We''ll both catch cold if we keep this up."'
56199: 'George@r@v07/70300181."............Is that so?@k@v07/70300182. I see.@k@v07/70300183. Then I''ll head towards the chapel.@k@v07/70300184. Jessica-chan will go to the parlor.@k@v07/70300185. .........Okay.@k@v07/70300186. I''ll see you in a bit, then."'
56200: '@rJust what sort of test, what sort of private conversation could Kinzo want to have at this time of night?'
56201: '@rHowever, it was a well-known fact that Kinzo didn''t have very long to live.'
56202: '@rIt was conceivable that he had some last words for each of his individual descendants...'
56203: '@rInside George''s mind, the faint feeling that something was wrong was replaced by curiosity...and a desire to meet Kinzo directly and hear the details.'
56204: '@rGeorge set down the receiver and quickly explained to the others.'
56205: 'George@r@v07/70300187."It''s as you heard.@k@v07/70300188. .........Grandfather says he wants to give us all some kind of test."'
56206: 'Maria@r@v13/70400358."Uu?@k @v13/70400359.A test...?"'
56207: 'Jessica@r@v04/70200364."After hiding in his study all these years, he decides to give us a pop quiz this late at night?@k@v04/70200365. ......Damn that old geezer.@k@v04/70200366. What''s he thinking?"'
56208: 'George@r@v07/70300189."It seems our parents feel the same way.@k@v07/70300190. It sounds as though they''re very worked up about it."'
56209: 'Battler@r@v10/70100176."Well, I doubt getting worked up about it will change Grandfather''s mind any."'
56210: 'George@r@v07/70300191."Exactly.@k@v07/70300192. ......We might as well accept it.@k@v07/70300193. It''s the order of the head of the family, after all.@k@v07/70300194. Let''s obey it.@k@|@y@v07/70300195. ......To start, Jessica-chan and I are being called out.@k@v07/70300196. I''m going to the chapel.@k@v07/70300197. Jessica-chan, you''re supposed to go to the parlor in the mansion."'
56211: 'Battler@r@v10/70100177."What about Maria and me?"'
56212: 'George@r@v07/70300198."I think they''ll call about you later.@k@v07/70300199. You can wait here."'
56213: 'Maria@r@v13/70400360."Uu!@k @v13/70400361.A midnight test!@k @v13/70400362.What could it be?!@k @v13/70400363.What kind of test is it?!@k @v13/70400364.A quiz?@k @v13/70400365.A puzzle?@k @v13/70400366.I''m really good at wolves and sheep puzzles!@k@v13/70400367. Uu!"'
56214: '@rMaria, who was now fully awake, seemed to be very excited about this unexpected midnight test.'
56215: 'Battler@r@v10/70100178."Then we''ll just hang out here."'
56216: 'George@r@v07/70300200."Yes.@k@v07/70300201. Okay, I''m going.@k@v07/70300202. I think they''re already waiting for us."'
56217: 'Jessica@r@v04/70200367."......So, he''s making one of his grandkids the successor.@k@|@y@v04/70200368. Sounds just great for me.@k@v04/70200369. Now I can let one of you guys deal with it!"'
56218: 'Maria@r@v13/70400368."I''m gonna become the successor!@k @v13/70400369.I wanna do it!@k @v13/70400370.Uu-uu-uu!"'
56219: 'Battler@r@v10/70100179."Ahaha.@k@v10/70100180. It''d be fun to have Maria as the successor."'
56220: 'George@r@v07/70300203."Bye.@k@v07/70300204. See you later."'
56221: '@rRudolf put down the receiver and stood up.'
56222: 'Rudolf@r@v08/71200219."Okay.@k@v08/71200220. ......Guess I''m going to the chapel.@k@v08/71200221. It''s damn cold out there.@k@|@y@v08/71200222. ......Gohda-san.@k@v08/71200223. Have some coffee waiting for me when I get back, will you?"'
56223: '@rNext to Rudolf, .........Gohda was lying face-up.'
56224: '@rHis face was covered by a crossword puzzle book.'
56225: '@rHowever, its pages were stained with blood, and there was no need to move the book to imagine how he had met his pitiful end...'
