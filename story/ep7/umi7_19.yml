56227: 'Rudolf@r@v08/71200224."Yep.@k@v08/71200225. We should be thanking Dad.@k@v08/71200226. All we''ve gotta do is say it''s him being fickle, and no one thinks to doubt it."'
56228: 'Kyrie@r@v09/71300183."*giggle*.@k@v09/71300184. Then, let''s split up.@k@v09/71300185. ......I''ll take care of Jessica-chan.@k@v09/71300186. You take care of George-kun."'
56229: 'Rudolf@r@v08/71200227."You got it.@k@v08/71200228. ......Let''s get this over with quickly, then relax with some coffee."'
56230: 'Kyrie@r@v09/71300187."There won''t be any problems, yes?@k @v09/71300188.......No sudden pangs of conscience?"'
56231: '@rKyrie smiled coldly......'
56232: '@rIt probably would have been safer to call them out one by one and finish them off together.'
