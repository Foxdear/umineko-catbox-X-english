49656: 'Shannon@r@v15/70500009."Th-...that''s............"'
49657: 'Will@r@v54/75400304."Don''t worry.@k@v54/75400305. I don''t recognize Lion either.@k@v54/75400306. ......Krauss is supposed to be the successor to the head.@k@v54/75400307. Jessica is supposed to be his only child.@k@v54/75400308. There hasn''t been a single fragment with anyone named Lion in the Ushiromiya family."'
