49679: 'Will@r@v54/75400316."That''s right.@k@v54/75400317. The name of the ghost rumored to wander the mansion night after night is also BEATRICE."'
49680: '@rThat brings the number of Beatrices to three.'
49681: '@rThe first is the "Beatrice" from more than thirty years ago, who is said to have given Kinzo the gold.'
49682: '@rThe second is the "Beatrice" from twenty years ago, who met Rosa.'
49683: '@rThe third is the "BEATRICE" of the ghost stories, who is rumored to be the master of the night on Rokkenjima.'
49684: 'Will@r@v54/75400318."......Furudo Erika''s reasoning was probably correct.@k@v54/75400319. It started out as the legend of the evil spirits on Rokkenjima.@k@v54/75400320. Later on, elements such as Kinzo''s occult hobbies, the name and portrait of the mysterious woman "Beatrice",@k@v54/75400321. and the epitaph got mixed in, and it all fused into the legend of the Golden Witch."'
49685: 'Will@r@v54/75400322."......And so the darkness of the night gained the personality of a witch.@k@v54/75400323. That''s the third BEATRICE.@k@v54/75400324. This is the veil the serial killer hides behind."'
