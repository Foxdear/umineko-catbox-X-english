49659: '@rApparently, she was a bit relieved to find that she wasn''t going crazy by herself.'
49660: '@r......However, her expression quickly grew uncertain once more.'
49661: 'Shannon@r@v15/70500010."Wh-where......is this place...?@k @v15/70500011.I think it''s the Ushiromiya family chapel.@k@v15/70500012. ......However, something feels different about it."'
49662: 'Shannon@r@v15/70500013."Also, I never knew that someone named L-......Lion-sama existed.@k@v15/70500014. ......And yet, Madam, Krauss-sama, ......the Master, Milady, and all the relatives all talk as though it''s perfectly natural......@k@v15/70500015. I just......don''t understand what''s happening......"'
49663: 'Will@r@v54/75400309."......Lion is a piece placed by BERNKASTEL.@k@v54/75400310. She also said that she''d switched to a larger cat box to place that piece.@k@v54/75400311. ......On top of that, it seems this world isn''t a proper world, but one made out of several different fragments sewn together."'
