49601: 'Lion@r@v53/75300147."Thanks, Aunt Rosa.@k@|@y@v53/75300148. .........Is that enough for you, Will?@k @v53/75300149.Are you satisfied?"'
49602: 'Will@r@v54/75400272."That''s enough.@k@v54/75400273. It was a nice review."'
49603: '@rTo Will, Rosa''s memories gave only information that was already known.'
