49611: '@rAfter giving an elegant bow, Lion made a face, tongue sticking out.'
49612: '@rUnless Will had eyes on the back of his head, he couldn''t have seen this last bit......'
49613: '@rWill returned to the chapel by himself.@k@rThe cold air and the monotonous sound of the rain were comforting.'
49614: 'BERNKASTEL@r@v28/72100060."......So, how''s the game?"'
49615: '@rAnd he had come here for a little peace and quiet...'
49616: '@rNo sooner had he let out a sigh of relief than that voice rang out.'
49617: 'Will@r@v54/75400279."That''s one for you to answer."'
49618: '@rIt was as though she had been sitting there all along.@k ......BERNKASTEL appeared on top of the altar once more.'
49619: '@rApparently, she found this particular altar extremely comfortable.'
49620: 'BERNKASTEL@r@v28/72100061."......Battler annoyed me over and over with his incompetence.@k@|@y@v28/72100062. You''re very competent compared to him, so it''s a lot easier to relax."'
49621: 'Will@r@v54/75400280."Unlike Ushiromiya Battler''s games, I have nothing standing in my way.@k@v54/75400281. It''s easy."'
49622: 'BERNKASTEL@r@v28/72100063."That sort of game has already ended.@k@v28/72100064. Tales can be enjoyed twice.@k@v28/72100065. First you love them.@k@v28/72100066. Then you tear out their guts.@k@v28/72100067. ......*giggle*giggle*."'
49623: 'Will@r@v54/75400282."Tch. You think I''m a butcher?"'
49624: 'BERNKASTEL@r@v28/72100068."Well?@k @v28/72100069.Do you think you know who killed BEATRICE...?"'
49625: 'Will@r@v54/75400283."Rosa''s confession is something I already know from a previous fragment.@k@v54/75400284. There was no brand new information.@k@v54/75400285. ......We''re still at square one."'
49626: 'BERNKASTEL@r@v28/72100070."*giggle*giggle*......"'
49627: 'Will@r@v54/75400286."Unless Ushiromiya Kinzo tells us what really happened, we won''t get any further than this.@k@v54/75400287. Don''t tell me that sweet-talking Kinzo into spilling the beans...@k@v54/75400288.is all part and parcel of this game."'
49628: 'BERNKASTEL@r@v28/72100071."If it were, I''d die of boredom.@k@v28/72100072. ......Kinzo refuses to speak of the truth and is himself the king protected by his castle,@k@v28/72100073. but it wouldn''t be any fun to have that stand in the way of your game..."'
49629: 'Will@r@v54/75400289."......I won''t torture.@k@v54/75400290. It''s not my style."'
49630: 'BERNKASTEL@r@v28/72100074."I know that.@k@v28/72100075. As the Game Master, I will grant you power.@k@v28/72100076. So that you can get the truth from Kinzo, of course."'
49631: '@rStill wearing shoes, BERNKASTEL stepped into the casket, picked up one of the flowers that had been set as offerings,@k ......and blew hard, as though scattering fluff from a dandelion.'
49632: '@rWhen she did, a single petal broke off and drifted down towards Will,@k no longer gold, but with the shine of a transparent crystal......'
49633: 'Will@r@v54/75400291."The "detective''s authority"?"'
49634: 'BERNKASTEL@r@v28/72100077."Heh, what''s that pathetic ability?@k@|@y@v28/72100078. ......No.@k@v28/72100079. This is your invitation to the auditorium."'
49635: 'Will@r@v54/75400292."......The "theatergoing authority"?@k@v54/75400293. .........Granting that is supposed to be forbidden without authorization from the Senate."'
49636: 'BERNKASTEL@r@v28/72100080."I''m granting it. On my game board.@k@v28/72100081. Who''s going to stop me......?"'
49637: 'Will@r@v54/75400294."............Hmph."'
49638: '@rThough the crystal flower petal danced in the wind, it wouldn''t fly away anywhere until Will accepted it.'
49639: '@rWill remembered how useless it was to argue with witches, and he snatched it up.'
49640: '@rWhen he did, the petal flashed brightly for an instant, melted into Will''s palm, and disappeared...'
49641: 'BERNKASTEL@r@v28/72100082."Entertain me if you can.@k@v28/72100083. And try and enjoy yourself.@k@v28/72100084. ......You must also be interested in seeing what the guts of BEATRICE''s game board look like, right?"'
