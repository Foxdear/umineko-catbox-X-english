49605: '@rApparently, Rosa really didn''t know any more than this......'
49606: '@rIf he wanted to learn something beyond the fragments given to him by BERNKASTEL, he would need to find new testimony.'
49607: 'Will@r@v54/75400274."Lion.@k@v54/75400275. Tell Kinzo that I want to talk to him.@k@v54/75400276. It looks like we won''t get anywhere without asking the man himself."'
49608: 'Lion@r@v53/75300150."Where are you going?"'
49609: 'Will@r@v54/75400277."......Off to cool my head and organize my thoughts.@k@v54/75400278. Don''t follow me."'
