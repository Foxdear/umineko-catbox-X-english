49427: '@rThe Ushiromiya family members were relaxing here and there around the waiting room.'
49428: '@rA light buffet-style meal had been set up, but it looked a bit stale and not particularly appetizing.'
49429: '@rEven so, those voracious kids seemed to find it intensely appealing.'
49430: '@rThe cousins had set up camp around it, with Maria at the center.@k@rThe adult siblings had also formed a group in a different corner.'
49431: '@rPerhaps because of Kinzo''s absence, everyone seemed to be a little more relaxed.'
49432: 'Natsuhi@r@v03/70900003."......Lion.@k@v03/70900004. Where did you go?@k @v03/70900005.......And who is that?"'
49433: 'Lion@r@v53/75300086."Mother,@k@v53/75300087. I was entertaining this guest of ours.@k@v53/75300088. Will, this is my mother, Natsuhi."'
49434: 'Will@r@v54/75400196."No introductions needed.@k@v54/75400197. I just need to hear what she has to say."'
49435: 'Natsuhi@r@v03/70900006."Huh? Did you say something?"'
49436: 'Lion@r@v53/75300089."No, he said nothing.@k@v53/75300090. This is Will-san.@k@v53/75300091. It seems he knew the deceased."'
49437: '@rWith a smile, Lion casually smoothed over Will''s words.'
49438: 'Lion@r@v53/75300092."He wants to know more about Beatrice.@k@v53/75300093. ......Do you know anything about her, Mother?"'
49439: 'Natsuhi@r@v03/70900007."........................@k@v03/70900008. ......Lion. The deceased is a woman to whom the head once owed a great debt.@k@v03/70900009. Nothing more, nothing less.@k@|@y@v03/70900010. This funeral is a ceremony for the head to repay the debts he made to her while she was alive.@k@v03/70900011. That is what I have heard, and there is nothing more to it than that."'
49440: 'Lion@r@v53/75300094."......Thanks, Mother.@k@v53/75300095. Will, that''s all my mother knows."'
49441: '@rNatsuhi was very resistant to the scandalous rumors that Kinzo, a man she greatly respected, had once had a concubine called Beatrice.'
49442: '@rHowever, she also understood that the scandal was probably the truth.'
49443: '@rPicking up that Natsuhi was in a bad mood and didn''t want to talk about this anymore,@k Lion brought an end to that conversation before Will could say something rude again.'
49444: 'Lion@r@v53/75300096."Will.@k@v53/75300097. This chapel is the property of our family."'
49445: 'Will@r@v54/75400198."So you''re telling me to follow the family''s rules?"'
49446: 'Lion@r@v53/75300098."You''ll speak in a manner appropriate for a guest of the family.@k@v53/75300099. And you''ll conduct all of your conversations through me.@k@v53/75300100. I must ask that you follow those two rules."'
49447: 'Will@r@v54/75400199."I''ll work on that."'
49448: 'Lion@r@v53/75300101."......The actions of this "BERNKASTEL" witch have caused us all a great deal of inconvenience.@k@v53/75300102. Because of that, I am willing to help you.@k@v53/75300103. However, both of us stand on an even footing, so make sure you don''t forget it."'
49449: 'Will@r@v54/75400200."And I thought you were just some pampered rich kid.@k@v54/75400201. You''ve got guts."'
49450: 'Lion@r@v53/75300104."I must be prepared to shoulder the Ushiromiya family''s future, after all."'
49451: 'Will@r@v54/75400202.".........Got it.@k@v54/75400203. Let''s solve this crime together, Watson."'
49452: 'Lion@r@v53/75300105."I''m glad to have your cooperation.@k@v53/75300106. I wouldn''t want to keep your dear cat Diana waiting.@k@v53/75300107. Don''t you need to feed her soon?"'
49453: 'Will@r@v54/75400204."I gave her extra food today,@k@v54/75400205. so she should be good for a while.@k@v54/75400206. .........I''m surprised you realized Diana was a cat."'
49454: 'Lion@r@v53/75300108."I figured a woman who scratches the sofas when you keep her waiting would be a bit too eccentric."'
49455: 'Will@r@v54/75400207."......Hm."'
49456: 'Lion@r@v53/75300109."So?@k @v53/75300110.Who will you talk to first?"'
49457: 'Will@r@v54/75400208."Anyone.@k@v54/75400209. Everyone.@k@|@y@v54/75400210. ......Those ones over there are Krauss''s siblings, right?"'
49458: 'Lion@r@v53/75300111."From right to left, there''s Aunt Eva,@v53/75300112. Uncle Hideyoshi."'
49459: 'Lion@r@v53/75300113."Over there is Uncle Rudolf,@v53/75300114. Aunt Kyrie."'
49460: 'Lion@r@v53/75300115."And over there is—"'
49461: 'Will@r@v54/75400211."Ushiromiya Rosa.@k@v54/75400212. ......When she was a girl, she once got lost in the forest and bumped into a woman calling herself Beatrice in a hidden mansion."'
49462: 'Lion@r@v53/75300116."......I know I shouldn''t be surprised anymore,@k@v53/75300117. but you really do know everything, don''t you?"'
49463: 'Will@r@v54/75400213."So, you know about that story too?"'
49464: 'Lion@r@v53/75300118."I managed to overhear her saying that today.@k@v53/75300119. ......It looked as though it was bothering her, so I pretended not to hear."'
49465: 'Will@r@v54/75400214."Real model student, you are.@k@v54/75400215. ......Introduce me.@k@v54/75400216. I want to ask about it."'
49466: 'Lion@r@v53/75300120."You''re asking this of the model student who pretended not to hear because it just might be a painful topic?"'
49467: '@rEven this outrageous arrogance is nothing compared to Kinzo.'
49468: '@rAfter muttering this several times mentally, Lion shrugged and nodded at Will.'
49469: 'Eva@r@v05/71000002."Oh, it''s our great successor.@k@v05/71000003. And who is this......?"'
49470: 'Lion@r@v53/75300121."Oh, Aunt Eva.@k@v53/75300090. This is Will-san.@k@v53/75300123. He came to offer flowers for the departed."'
49471: 'Will@r@v54/75400217."But who cares about that.@k@v54/75400218. Tell me everything you know about—@v54/75400219.@|@y......nng—"'
49472: 'Lion@r@v53/75300124."He says he wants to know about the deceased''s connection to the Ushiromiya family."'
49473: '@rLion spoke with a bright smile while pinching Will''s butt.'
49474: '@rWill silently protested, as though saying "even for a gag, that hurts",@k but Lion just played dumb and smiled at Eva like a model student.'
49475: 'Eva@r@v05/71000004."Her connection to the Ushiromiya family?@v05/71000005. ......Well, what is there to say...?"'
49476: 'Hideyoshi@r@v06/71100003."It''s probably more accurate to say "her connection to Father"."'
49477: 'Rudolf@r@v08/71200002."We can be honest here.@k@v08/71200003. She was Dad''s mistress."'
49478: 'Kyrie@r@v09/71300002."If you call her that, Natsuhi nee-san will yell at you again.@k@v09/71300003. He''s "indebted" to her, right?@k @v09/71300004.*giggle*."'
49479: 'Hideyoshi@r@v06/71100004."Yes, of course.@k@v06/71100005. Wahahahaha."'
49480: 'Lion@r@v53/75300125."......Well, there you have it."'
49481: 'Will@r@v54/75400220."I have no interest in anyone but Rosa—@k@|@y@v54/75400221.gghh—"'
49482: 'Lion@r@v53/75300126."I do believe......that you said you met with Beatrice, Aunt Rosa."'
49483: 'Rosa@r@v12/71400003."........................"'
49484: '@rThis whole time, Rosa had been hanging her head.@k@rLion''s words made her shoulders quiver.'
49485: 'Eva@r@v05/71000006."She just suddenly came out with it today.@k@v05/71000007. It''s a bit hard to believe."'
49486: 'Rosa@r@v12/71400004."It''s the truth...!@k @v12/71400005.I killed Beatrice!"'
49487: 'Will@r@v54/75400222."Great, our work here is finished."'
49488: 'Lion@r@v53/75300127."Don''t get ahead of yourself."'
49489: '@rRosa broke down crying and laid her head on the table.@k Kyrie and Hideyoshi tried to console her......'
49490: 'Eva@r@v05/71000008."Rokkenjima is covered by a dense forest.@k@v05/71000009. We only know about one tiny portion of it.@k@v05/71000010. Just the mansion, the rose garden,@k@v05/71000011. and the little path that leads to the harbor."'
49491: 'Rudolf@r@v08/71200004."Since ages ago, there''ve been stories about how Dad built a hidden mansion somewhere in the vast forest that no one knew about,@k@v08/71200005. and that he had his mistress living there."'
49492: 'Hideyoshi@r@v06/71100006."Rosa-san probably came upon that hidden mansion by chance......"'
49493: 'Lion@r@v53/75300128."But Aunt Rosa, why would you say you killed Beatrice...?"'
49494: 'Rosa@r@v12/71400006."If I hadn''t taken her out, she never would have died...!@k @v12/71400007.She was so innocent, like a chick.@k@v12/71400008. I took her out, so she just followed along obediently!@k @v12/71400009.She stayed right behind me, trusting me completely...!@k @v12/71400010.And because I made her take such a dangerous path...!!"'
49495: 'Will@r@v54/75400223."Did you make her walk that way because you were hoping she''d slip and fall from the cliff?"'
49496: 'Rosa@r@v12/71400011."I never meant to do that!@|@y@k @v12/71400012.I just thought she''d like to see the ocean...!@|@y@k @v12/71400013.No,@v12/71400014. it just looked like the path would be hard to walk,@v12/71400015. and I thought it would be easier going if we went down the cliff first...!!"'
49497: 'Will@r@v54/75400224."That''s not what killing someone means.@k@v54/75400225. It was an accident."'
49498: 'Rosa@r@v12/71400016."It''s an accident she never would have had if I hadn''t brought her with me, right?!@k @v12/71400017.It''s my fault!!@k @v12/71400018.And then, I abandoned her when she was covered in blood and ran home!!"'
49499: 'Will@r@v54/75400226."It isn''t your fault.@k@v54/75400227. Beatrice had never seen the ocean before.@k@v54/75400228. ......You showed it to her for the first time ever.@k@v54/75400229. She was probably so excited that she just happened to take a bad step."'
49500: 'Rosa@r@v12/71400019."......H-how can you...?"'
49501: 'Will@r@v54/75400230."Beatrice is grateful to you for what you did. Of course she doesn''t hate you for it."'
49502: 'Rosa@r@v12/71400020."........................@k@v12/71400021. Really?@v12/71400022. ......Is that...@v12/71400023.really true...?"'
49503: 'Will@r@v54/75400231."She was the one who begged to see the world outside the fence, right?@k@v54/75400232. Though it was only for a short while, you made that dream of hers come true.@k@v54/75400233. If I were Beatrice, I would thank you for that short bit of time.@k@v54/75400234. If she knew that you''ve been suffering all this time for it, she''d probably feel bad herself."'
49504: 'Will@r@v54/75400235."......Beatrice is grateful for what you did.@k@v54/75400236. You''re the one who taught her that the sea is blue."'
49505: 'Rosa@r@v12/71400024.".........Is that...@v12/71400025....true.........?"'
49506: 'Will@r@v54/75400237."I guarantee it."'
49507: '@rWill made that statement openly and boldly.'
49508: '@rNo one could tell how Rosa took those words.'
49509: '@rHowever, ......they had apparently been enough to remind her to take a handkerchief out of her pocket and wipe her eyes.'
49510: 'Rosa@r@v12/71400026."......Thank you."'
49511: 'Will@r@v54/75400238."Even now, Beatrice is whispering those words to you."'
49512: 'Rosa@r@v12/71400027."...............Thank you......"'
49513: '@rRosa wiped her eyes with the handkerchief one more time and hung her head.'
49514: '@rIt no longer looked like a fit of sobbing, but more as though she was speaking with the Beatrice of that day within her heart...@kone last time.'
49515: 'Lion@r@v53/75300129."......That was a lot of confidence you put behind a claim you can''t back up."'
49516: 'Will@r@v54/75400239."Back up?@k@v54/75400240. Is that really necessary to comfort a woman?"'
49517: 'Lion@r@v53/75300130."........................@k@|@y@v53/75300131. I misjudged you a little."'
49518: '@rFor how many years had this tormented Rosa?'
49519: '@rNow, for the first time,@k ......Rosa would probably be able to face that innocently smiling Beatrice, who had seen the ocean for the first time in her life.'
49520: '@rShe was the only one who could forgive Rosa.'
49521: '@rNow, the two of them could finally speak together......'
49522: 'Rosa@r@v12/71400028."......I don''t know who you are, but thank you.@k@v12/71400029. ......I wonder if she forgives me."'
49523: 'Will@r@v54/75400241."You''ve beat yourself up about it for nearly twenty years.@k@v54/75400242. That''s far too long.@k@v54/75400243. She''s telling you to knock it off."'
49524: 'Lion@r@v53/75300132."......That''s right, Aunt Rosa.@k@v53/75300133. The more you grieve, the sadder Beatrice would be."'
49525: 'Rosa@r@v12/71400030."............You too...@k@v12/71400031. Thank you.@k@v12/71400032. ......I don''t know if I will be forgiven,@k@v12/71400033. ......but I''ll keep on speaking to my heart to see whether she''ll forgive me or not.@k@|@y@v12/71400034. ......Thanks, you two.@k@v12/71400035. Sorry for showing you such an embarrassing side of me."'
49526: 'Will@r@v54/75400244."And I''m sorry to say this right after saying something so pretty,@k@v54/75400245. ......but I want you to talk to me.@k@v54/75400246. Tell me what happened back then."'
49527: 'Lion@r@v53/75300134.".........Will-san!"'
49528: 'Rosa@r@v12/71400036."Thanks, but it''s alright.@k@v12/71400037. ......I''ll talk.@k@v12/71400038. Hiding this and keeping quiet about it for so long might have been my greatest sin."'
49529: 'Will@r@v54/75400247."Exactly when was it that you met Beatrice?"'
49530: '@rUpon hearing this question, ......Rosa closed her eyes lightly, reaching back to a past she didn''t want to remember...'
49531: 'Rosa@r@v12/71400039."......It was about twenty years ago.@k@v12/71400040. .........Twenty.........or, wait, it might have been nineteen or eighteen years ago.@k@|@y@v12/71400041. .........I''m sorry.@k@v12/71400042. I''ve tried to force myself to forget it for so long that I''ve nearly forgotten that part completely."'
49532: 'Will@r@v54/75400248."It should have been 1967."'
49533: '@rRonove had guaranteed that with the red truth in the third game.'
49534: 'Rosa@r@v12/71400043."Th-that''s right......@k@v12/71400044. It was probably about 1967.@k@|@y@v12/71400045. I can remember what happened as clearly as a picture......@k@v12/71400046. I''ll never forget......"'
49535: 'Lion@r@v53/75300135."If it''s tough for you, don''t feel like you have to tell us."'
49536: 'Will@r@v54/75400250."Yes, clear as a picture, if you don''t mind.@k@|@y@v54/75400251. ............Ngah!@k@v54/75400252. ......Dammit, that hurts, Lion."'
49537: 'Lion@r@v53/75300136."What does?"'
49538: 'Rosa@r@v12/71400047."I took it very hard when I found out that my tutor had told Mother about something I''d shared in confidence.@k@v12/71400048. I lost control of myself and ran deep into the forest."'
49539: '@rThis tale had also been told in a previous fragment.'
49540: '@rBack when Rosa was just a kid, she had gone deep into the forest,@k ......found a hidden mansion, and met with a mysterious woman who called herself Beatrice......'
49541: 'Lion@r@v53/75300137."......But that forest is so thick it''s hard just to move around in it."'
49542: 'Rosa@r@v12/71400049."I even surprised myself......@k@v12/71400050. To think that I made it so far into such a dense forest.@k@v12/71400051. ......I was tormented by twigs and sharp leaves over and over again."'
49543: 'Rosa@r@v12/71400052."However, that wasn''t enough to bother me on that day.@k@v12/71400053. ......After all, I wanted to disappear into the forest and vanish forever.@k@v12/71400054. ......If, by some chance, there really was a witch''s mansion in the depths of the forest,@k@v12/71400055. ......I hoped that she might take me to the land of happiness, or else turn me into a frog and make me a resident of the forest."'
49544: 'Will@r@v54/75400253."So, you then reached the hidden mansion, Kuwadorian,@k@v54/75400254. and met a woman who called herself Beatrice."'
49545: 'Rosa@r@v12/71400056.".........Yes.@k@v12/71400057. I did."'
49546: 'Will@r@v54/75400255."Was that Beatrice the same as the one in the portrait?"'
49547: 'Rosa@r@v12/71400058."........................@k@v12/71400059. ......Yes.@k@v12/71400060. They were the same person."'
49548: 'Rosa@r@v12/71400061."Beautiful blue eyes.@k@v12/71400062. Golden hair.@k@v12/71400063. A black dress.@k@v12/71400064. It truly was the subject of that portrait.@k@v12/71400065. ......When Father first had it hung,@k@v12/71400066. ......I realized that the twenty years I had spent trying to forget must have seemed just as long for Father,@k@v12/71400067. if not even longer, and I was wracked by even greater guilt..."'
49549: 'Kyrie@r@v09/71300005."Stop there.@k@v09/71300006. ......Are we sure that this is the same Beatrice that Rosa-san met?"'
49550: '@rImmediately, Kyrie spoke the question that Will had been thinking of.'
49551: '@rIt would be too rash to assume that the Beatrice Kinzo met...@kwas the same person as the one Rosa met.'
49552: '@rThe time and generation were different for each.'
49553: 'Rudolf@r@v08/71200006."Beatrice is supposed to be that lady of leisure who lent Dad all that gold shortly after the war, right?"'
49554: 'Hideyoshi@r@v06/71100007."Usin'' Beatrice''s gold as a foundation, Father revived the Ushiromiya family and got super rich.@k@v06/71100008. Then he bought Rokkenjima and moved over.@k@v06/71100009. Rosa-san''s meetin'' must have been at least ten years after that."'
49555: 'Eva@r@v05/71000012."A woman with free control over ten tons of gold could hardly be some little girl.@k@v05/71000013. And ten more years passed after that before she met Rosa.@k@|@y@v05/71000014. ...Rosa,@k@v05/71000015. about how old did the Beatrice you met look?"'
49556: 'Rosa@r@v12/71400068."......She looked older than I was at the time,@k@v12/71400069. ......but even so, it looked as though she might just be on the cusp of adulthood.@k@|@y@v12/71400070. Yes, exactly the sort of age of the Beatrice in the portrait."'
49557: 'Rudolf@r@v08/71200007."Did she look middle-aged or past her prime?"'
49558: 'Rosa@r@v12/71400071."If I had to call her an adult or a child, she was clearly closer to being a child.@k@v12/71400072. There''s no way she was middle-aged."'
49559: 'Eva@r@v05/71000016."And isn''t that strange?@k@v05/71000017. We have the Beatrice you met, and the Beatrice who gave Father the gold,@k@v05/71000018. but their ages don''t match."'
49560: 'Will@r@v54/75400256."In other words, they''re different people."'
49561: 'Lion@r@v53/75300138."Different people...who look very similar and have the same name......"'
49562: 'Hideyoshi@r@v06/71100010."It might have been her daughter.@k@v06/71100011. It makes sense for them to look alike if they were mother and child."'
49563: 'Kyrie@r@v09/71300007."His mistress''s daughter......@k@v09/71300008. It is possible.@k@v09/71300009. Perhaps Father had an illegitimate child with the Beatrice who gave him the gold."'
49564: 'Rudolf@r@v08/71200008."So, the one Rosa bumped into was Beatrice II.@k@v08/71200009. ......Makes those ages work out nicely."'
49565: 'Will@r@v54/75400257."................................."'
49566: 'Lion@r@v53/75300139."I see......@k@v53/75300140. In other words, there are two people called Beatrice."'
49567: '@rKinzo secretly raised his mistress''s child in a hidden mansion.'
49568: '@rThat would make logical sense.@k Everyone nodded, agreeing.'
49569: '@r......However, Will''s expression was slightly unsatisfied, and he scratched at his head...'
49570: 'Lion@r@v53/75300141."So, it would seem that this funeral...@k@v53/75300142.exists for the two Beatrices he couldn''t hold a ceremony for because he''d kept them secret......"'
49571: 'Will@r@v54/75400258."Rosa.@k@v54/75400259. I know you probably don''t want to remember, but tell me about that accident.@k@v54/75400260. After Beatrice fell, was she still breathing?"'
49572: 'Rosa@r@v12/71400073."No.@k@v12/71400074. ......Her eyes were open wide.@k@v12/71400075. She fell upside down, head first, and knocked her head against a sharp crag on the rocky beach.@k@v12/71400076. And she fell from such a height......@k@v12/71400077. ............Her skull had split and caved inwards.@k@v12/71400078. ......That beautiful golden hair was stained red with blood almost instantly......"'
49573: 'Will@r@v54/75400261."Was it the sort of wound that showed at a glance that she was undoubtedly dead?"'
49574: 'Rosa@r@v12/71400079."Yes.@k@v12/71400080. I saw the insides of her cracked head!@k @v12/71400081.It had caved in deep enough to fit your fist inside it...!@k @v12/71400082.No one could be naive enough to see that and still hope she was alive!"'
49575: 'Lion@r@v53/75300143."......Will.@k@v53/75300144. Do you really need to ask anything more?"'
49576: 'Will@r@v54/75400262."That''s enough for the time of the accident.@k@v54/75400263. What did you do afterwards?"'
49577: 'Rosa@r@v12/71400083."I dashed away at full speed.@k@v12/71400084. ......I wasn''t even thinking about calling for help."'
49578: 'Rosa@r@v12/71400085.".........I wanted to escape from that place as fast as I could.@k@v12/71400086. Half-crazed, sobbing, and out of breath, I kept on running about at random.@k@v12/71400087. ......Eventually, I came across a familiar lion statue."'
49579: 'Eva@r@v05/71000019."Oh, the one in front of the chapel?"'
49580: 'Rosa@r@v12/71400088."No, the one behind it.@k@v12/71400089. ......Anyway, I made it back to the mansion.@k@v12/71400090. I couldn''t tell anyone, and I didn''t want to.@k@v12/71400091. I stayed quiet until nightfall.@k@|@y@v12/71400092. It was so horrible of me.@k@v12/71400093. If I had hurried and told someone, they might have brought her a first aid kit, and she might have been saved......"'
49581: 'Will@r@v54/75400264."How is a first aid kit going to help with a crushed cranium?@k@v54/75400265. ......You didn''t kill her.@k@v54/75400266. Don''t worry about that anymore."'
49582: 'Rosa@r@v12/71400094."..........................."'
49583: 'Lion@r@v53/75300145."Then, ......what did you do next?"'
49584: 'Rosa@r@v12/71400095."......That night, I turned over in my bed so many times.@k@v12/71400096. I couldn''t sleep.@k@v12/71400097. ......Late that night, I quietly...@v12/71400098.......called Genji-san on the phone and told him..."'
49585: 'Will@r@v54/75400267."......What did he say?"'
49586: 'Rosa@r@v12/71400099."He told me to let him handle everything, and to speak of this to no one.@k@v12/71400100. ......I spent the next several days terrified that Father would call for me and scold me brutally."'
49587: 'Rosa@r@v12/71400101."But......he didn''t.@k@v12/71400102. Genji-san kept on doing his job quietly, just like normal.@k@v12/71400103. ......Father stayed locked up in his study, not knowing any of it......"'
49588: 'Eva@r@v05/71000020."At the very least, none of us ever heard about it."'
49589: 'Rudolf@r@v08/71200010."......Genji-san probably managed to clean everything up nicely."'
49590: 'Kyrie@r@v09/71300012."After all, I expect they couldn''t let knowledge of that child go public......"'
49591: 'Hideyoshi@r@v06/71100012."Hmmmmm......@k@v06/71100014. It must have been tough for Father, not bein'' able to hold a real funeral for her......"'
49592: 'Lion@r@v53/75300146.".........I guess that''s why we''re having this funeral."'
49593: 'Will@r@v54/75400268."And then?"'
49594: 'Rosa@r@v12/71400104."That''s all I know."'
49595: 'Will@r@v54/75400269.".....................@k@v54/75400270. And that''s all I know too."'
49596: 'Rosa@r@v12/71400105."I''m not hiding anything else.@k@v12/71400106. I''ve told you everything.@k@v12/71400107. ......I swear it."'
