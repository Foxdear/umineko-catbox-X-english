49052: 'VIRGILIA@r@v30/73200001.Earth to earth.@k@r@v30/73200002.Ashes to ashes,@k@v30/73200003. dust to dust.@k@v30/73200004. Illusions to illusions.@k@r@v30/73200005.And dreams to dreams.'
49053: 'VIRGILIA@r@v30/73200006.A dream is something drawn in the sand between the coming and receding waves.'
49054: 'VIRGILIA@r@v30/73200007.Something so fragile that it is wiped blank each time the waves draw back.'
49055: 'VIRGILIA@r@v30/73200008.For this reason, the heartless might sneer at the drawing and call it useless.'
49056: 'VIRGILIA@r@v30/73200009.However, no wave will ever come again to wipe away the dream she drew.'
49057: 'VIRGILIA@r@v30/73200010.Her final, beautiful dream will not disappear for all eternity.'
49058: 'VIRGILIA@r@v30/73200011.Come, try to picture it.'
49059: 'VIRGILIA@r@v30/73200012.Picture it as the gentle afternoon sunshine on a warm spring day,@k@r@v30/73200013.as though that light would never dim again.'
49060: 'VIRGILIA@r@v30/73200014.After all, it is such a wonderful thing......'
49061: 'VIRGILIA@r@v30/73200015.——Witness to your final dream,@k@r@v30/73200016.         @z80.PUBLIUS VIRGILIA MARO'
49062: '@rThe suspects were gathered in a room, and several Inquisitors were reporting on the results of their investigation.'
49063: '@rTheir uniforms closely resembled those of Eiserne Jungfrau, but they were slightly different.@k Also different were the badges signifying their department.'
49064: '@rThen came the sound of someone clapping their hands once.@k@rIt was the lead female Inquisitor.'
49065: '@rIt was her signal that all reasoning had been completed.'
49066: '@r@v99/SHINM7001."For your attention: it is now beyond doubt.@k@v99/SHINM7002. The preceding logic has proven the nonexistence of your alibi."'
49067: '@rAt the other end of her pointing finger was a quivering maid with frightened eyes.'
49068: '@rHer name was—@kno, that wasn''t important.'
49069: '@rAll that mattered now was that she could have freely entered the locked-room study where the victim was found,@k and furthermore, that it had been proven that her claimed alibi for the time of the crime was contradictory.'
49070: '@rShaking, the maid tried to continue her illogical pleading, but all her arguments had already been destroyed.'
49071: '@r@v99/SHINM7003."With this, we have found sufficient proof for the whodunit and the howdunit.@k@v99/SHINM7004. Know that your position as the culprit is now an unshakable fact."'
49072: '@r@v99/MAID7001."Y-you must be joking...!@k @v99/MAID7002.Wh-wh-why would I kill the Master I loved and respected so...?!@k @v99/MAID7003.I, I have no motive, no reason...!"'
49073: '@r@v99/SHINM7005."......Who did it and how.@k@v99/SHINM7006. Know that these are all that need to be established.@k@v99/SHINM7007. For your attention: I beg to inform you of the following.@k@v99/SHINM7008. Know that motives are unnecessary in mysteries."'
49074: '@rThe Inquisitor spoke coldly.'
49075: '@rAfter finishing her witch''s prayer, VIRGILIA stepped back from the casket, which lay on an altar bedecked with many beautiful roses.'
49076: '@rIn her place, Battler moved to the front of the casket, wearing his territory lord''s cape......'
49077: '@rThough the cape was supposed to represent dignity and majesty,@k it somehow made Battler look smaller.'
49078: '@rBattler held a book with a majestic binding in his hand.'
49079: '@rIt was......a game record that had just been written.'
49080: '@rOr, perhaps it was a tale.@k A game.@k Or else a fragment.'
49081: '@rWritten in it......@kwas the "dream" that would be more enjoyable for her than any other......'
49082: '@rBattler pressed it against his forehead and contemplated for some time.'
49083: 'Battler@r@v10/70100001."................................."'
49084: '@rThen, he kissed it, .....and laid it gently in the casket.'
49085: '@rIt was placed upon her chest.'
49086: '@rIt made her look like a little girl clutching her favorite stuffed animal as she drifted off to sleep......'
49087: 'Battler@r@v10/70100002."......This story is my gift to you.@v10/70100003. ......The only one there will ever be."'
49088: '@rThis tale will be shut up with you in your casket for all eternity.'
49089: '@rSo, no one will be able to read it except for you in your casket.'
49090: 'VIRGILIA@r@v30/73200017."Shut away in that cat box,@v30/73200018. the only...@v30/73200019.unchanging,@v30/73200020. inviolable,@v30/73200021. ......eternal tale."'
49091: 'Battler@r@v10/70100004."This way,@v10/70100005. ......no one will be able to defile her tale.@k@v10/70100006. ...No one can deny it,@v10/70100007. and no one can argue against it.@k@v10/70100008. ......Belonging to just me and her,@v10/70100009. ......just the two of us,@v10/70100010. this is the one and only...@v10/70100011.certain truth."'
49092: '@r@v54/75400001.Those bastards......'
49093: '@rA man dashed through a town wrapped in twilight.'
49094: '@rThe daytime hustle and bustle of this charming old-fashioned village, which combined tradition with stylistic beauty in the classic style of the last century, now seemed like a mere dream.'
49095: '@rThe orange setting sun was already hidden behind the clock tower, and the narrow alleyways were rapidly descending into darkness.'
49096: '@rAs the gas lights began to turn on, they only made the darkness of the twilight stand out all the more.'
49097: '@rThe man sprinted.@k There was no time.@k He had to hurry.'
49098: '@rHe''d had several experiments to do and things he had to check, and it had all taken longer than he''d expected.'
49099: '@r@v54/75400002."Yes, there''s no mistake there.@k@v54/75400003. The whodunit and howdunit are all you need in mysteries."'
49100: '@rIn the mystery genre, the motive, or the whydunit, is given the least precedence.'
49101: '@rThe only thing needed for a murder to exist is for a culprit to commit it.'
49102: '@rNo part of that requires a motive.@k So, it''s usually the most ignored element.'
49103: '@rIn fact, these days, there are even some who call it an unnecessary element in mystery stories.'
49104: '@r@v54/75400004."If you determine the culprit with nothing but the whydunit, that''s no mystery.@k@v54/75400005. That''s propaganda.@k@v54/75400006. However..."'
49105: '@r@v54/75400007.That doesn''t mean you can ignore the motive.@k@r@v54/75400008.It doesn''t make it okay to ignore the heart.'
49106: 'VIRGILIA@r@v30/73200022."......We both know how enjoyable her final rest will be.@k@v30/73200023. So, I doubt there is anyone who could disturb it.@k@|@y@v30/73200024. ......After all, who could possibly disturb the sleep of a child dreaming with a smile on their face?"'
49107: 'Battler@r@v10/70100012.".............................."'
49108: 'VIRGILIA@r@v30/73200025."Come.@k@v30/73200026. ......It is time for us to leave.@k@v30/73200027. If we''re too noisy, we''ll wake her from her dream."'
49109: 'Battler@r@v10/70100013."......You''re right.@k@v10/70100014. What else should you do with a sleeping kid except put a blanket on them,@k@v10/70100015. ......turn off the lights, and walk away quietly..."'
49110: '@rAfter looking at the casket one last time, VIRGILIA turned around quietly.'
49111: '@rBattler did the same, .........but he then stopped and turned to face the rose-covered altar...'
49112: 'Battler@r@v10/70100016.".............................."'
49113: '@rBattler said his final words with his heart.'
49114: '@rAs long as those words didn''t leave his mouth, no one would ever know what they were.'
49115: '@r......However, those words of the heart caused Battler''s expression to change several times.'
49116: '@rAt first, he frowned sadly, ......then, his face clouded with remorse, and then changed to a resigned, bittersweet smile.@k ......It flashed through several varied expressions.'
49117: '@rThen, ......the final expression that crossed his face, was, surprisingly,@k ......a gentle smile.'
49118: 'Battler@r".....................@k@v10/70100018. ............"'
49119: '@rSomething rose to Battler''s lips.@k However, he bit it back down.'
49120: '@rThere could certainly be no words...@k...to express the many feelings he kept in his chest.'
49121: '@rSo, ...saying anything aloud would probably be crude.'
49122: '@rBattler understood this, and stopped himself from speaking once more with a resigned smile.'
49123: 'VIRGILIA@r@v30/73200028."..........................."'
49124: 'Battler@r@v10/70100019."......Thank you."'
49125: 'VIRGILIA@r@v30/73200029."Oh, I have done nothing deserving of your gratitude..."'
49126: 'Battler@r@v10/70100020."......I''ll leave the rest to you."'
49127: '@rAfter seeing VIRGILIA nod back at him, Battler turned away from the altar one more time...@k......and left the chapel.'
49128: '@rVIRGILIA also disappeared,@k ......and all disturbances that might have interrupted her blissful sleep were gone...'
49129: '@rThe Inquisitors listened with calm—no, scornful gazes.'
49130: '@rThey listened to the frantic babbling of the maid accused of murdering her master.'
49131: '@rHowever, nothing she said could bury the fault in her own alibi.'
49132: '@rThey were all mere emotional arguments.@k@r"I loved and respected my master so much. I had no motive for killing him."'
49133: '@rNo matter how much she spoke,@k it only made her look more and more like the floundering true culprit struggling pathetically.'
49134: '@rThe whodunit and howdunit had been satisfied.@k@rAs for the whydunit, the motive, the heart—who would care?'
49135: '@r......No matter how much she spoke of her gratitude for her master, who had graciously fed her and given her a job when she had been left to starve on the streets after various misfortunes,@k that didn''t help her case in the slightest in the mystery genre.'
49136: '@rTherefore, her motive didn''t matter.@k@rAll of that could just be squeezed out of the culprit afterwards.'
49137: '@rAn Inquisitor took out a roll of parchment and held it forth, cutting off the maid''s sobs and protests.'
49138: '@r@v99/SHINM7009."This is how you committed the crime.@k@v99/SHINM7010. Know that this indictment has been received by the Great Court and that your arrest has been approved.@k@v99/SHINM7011. Here is the warrant for your arrest.@k@v99/SHINM7012. The motive is unnecessary.@k@v99/SHINM7013. Know that such a thing is completely extraneous in the matter of pinpointing the culprit.@k@v99/SHINM7014. With that in mind, I beg to inform you of the following.@k@v99/SHINM7015. Know that we of the SSVD possess methods of forcing unrepentant criminals to reveal the truth."'
49139: '@r@v99/SHINM7016."Be advised that with these interrogation tools blessed by the powers of justice, we Inquisitors will strap up your limbs, burn them, crush them, hang you by them,@k@v99/SHINM7017. and thereby wring the red truth out of you.@k@v99/SHINM7018. ......It isn''t even necessary for you to confess!@k @|@y@v99/SHINM7019.Aides, arrest that maid!"'
49140: '@r@v99/MAID7004."It wasn''t me! I didn''t kill the master...!!@k @v99/MAID7005.N-no, noooooooooo!!"'
49141: '@r@v54/75400009."Hold it right there.@k@v54/75400010. You''ve got the wrong culprit."'
49142: '@rA man kicked the door open, and the Inquisitors were all shocked at the sight of him.'
49143: '@r@v99/SHINM7020."Wh-......why are you here?@k@v99/SHINM7021. Know that you are no longer in charge of this case...!"'
49144: '@r@v54/75400011."Quiet.@k@v54/75400012. You find one person without an alibi and just assume that she''s the culprit?@k@v54/75400013. Do you really think there''s no need for a motive, for a heart, in crime?@k@v54/75400014. Crimes are committed by people.@k@v54/75400015. There are no crimes without a heart.@k@v54/75400016. I''ll never accept any theory that ignores the heart."'
49145: '@r@v99/SHINM7022."Kn-know that your focus on the whydunit is simply embarrassing...!@k @v99/SHINM7023.The whydunit is unnecessary!@k @v99/SHINM7024.Such a thing can be easily extracted through interrogation!@k @v99/SHINM7025.Even the Great Court has already acknowledged that this woman is the culprit...!!"'
49146: '@r@v54/75400017."The Great Court has heard your argument that the maid must be guilty because everyone besides her has an alibi,@k@v54/75400018. and they''ve mistaken your overconfidence and conceit for wisdom.@k@v54/75400019. If any one of the other suspects loses their alibi, your evidence so far proves nothing.@k@v54/75400020. ......Just look at how pathetic some of these other alibis are.@k@v54/75400021. Did the clock in the reception hall chime midnight at exactly the right time?@k @v54/75400022.Did the dog by the back door bark at everyone?"'
49147: '@r@v54/75400023."So, you managed to prove the maid''s alibi false.@k@v54/75400024. Congratulations.@k@v54/75400025. But does it end there?"'
49148: '@r@v54/75400026."It may''ve been possible for her to do it, but does she have any motive at all?@k @v54/75400027.Are the alibis for the others absolutely perfect?@k@v54/75400028. This maid wasn''t the only one with a false alibi.@k@v54/75400029. You have to keep on searching if you want to find the others."'
49149: '@r@v54/75400030."Was there some sort of grudge against the victim? Or some money-related problem?@k @v54/75400031.Don''t abandon motive, don''t abandon the heart.@k@v54/75400032. Dry mysteries where the motive can just be figured out later aren''t worth anyone''s time."'
49150: '@r@v99/SHINM7026."I-if the maid isn''t the culprit, then why did she fake an alibi?!@|@y@k @v99/SHINM7027.Even asking such a question is a waste of time!@k @v99/SHINM7028.Know that we just have to interrogate her, wring out the red truth, and have her sign in red blood to everything that happened at the time of the crime!"'
49151: '@r@v54/75400033."Yeah, you probably can do that.@k@v54/75400034. You can just use that torture of yours to squeeze out everything frankly and objectively, as seen from the eyes of God.@k@v54/75400035. But you know what?@k@v54/75400036. ......I''ll never accept mysteries and theories that lack heart."'
49152: '@r@v99/SHINM7029."I, I have already taken over responsibility for this case!!@k @v99/SHINM7030.I even have a decree right here!@k @v99/SHINM7031.Come now, Aides, know that there is no reason to hesitate!@k @v99/SHINM7032.I order you to arrest this maid!!"'
49153: '@rWhen she gave this order, her subordinates hesitated, looking back and forth between their superior and that man...'
49154: '@r@v54/75400037."I won''t let you.@k@v54/75400038. The real culprit''s a different person.@k@v54/75400039. It''s possible to use motive to find them,@k@v54/75400040. and the alibi trick''s an old one.@k@v54/75400041. You can''t forget the heart."'
49155: '@r@v99/SHINM7033."Th-there''s no need for that...!!@k @v99/SHINM7034.We just have to find the suspicious ones who could have committed the crime, interrogate them, and squeeze out the red truth!!@k @v99/SHINM7035.On the off-chance that they are not the culprit,@v99/SHINM7036. then we just have to interrogate the next suspect...!!"'
49156: '@r@v54/75400042."You call that reasoning?"'
49157: '@r@v99/SHINM7037."Stand back!!@k @v99/SHINM7038.We will arrest that woman!!@k @v99/SHINM7039.Know that this maid is the culprit!!"'
49158: '@r@v54/75400043.@|@y"@c900.@[It is forbidden for a servant to be the culprit!!@]@c."'
49159: '@r@v99/SHINM7040."Wh-@v99/SHINM7041.what...@v99/SHINM7042.......did you say.........?!?!"'
49160: '@rThe words of power blasted away the Aides who were trying to arrest the maid.'
49161: '@r@v54/75400044.@|@y"@c900.@[......Van Dine''s Twenty Rules, Rule #11.@]@c.@k@v54/75400045. ......If you want to torture this maid, make sure you double check the alibis for the second wife and her lover first."'
49162: '@r@v99/SHINM7043."Th-those two already have a clear alibi for the time of the crime...!!"'
49163: '@r@v54/75400046."That, an alibi?@k@v54/75400047. Dammit, a fool like you couldn''t understand no matter how easy I make it for you.@k@v54/75400048. If you want to call yourself a Chief Inquisitor, try and figure out at least that much for yourself.@k@v54/75400049. Until then, I''ll be taking that maid''s arrest warrant."'
49164: '@r@v99/SHINM7044."Th-then what about you?!@k @v99/SHINM7045.Can you prove that this maid didn''t commit the crime?!@k @v99/SHINM7046.Know that she was clearly away from the kitchen at the time of the crime!@k @v99/SHINM7047.What was she doing then, and where?!@k @v99/SHINM7048.She can''t prove it, I can''t prove it, and you can''t prove it! No one can!@k @v99/SHINM7049.That''s why we have no choice but to use these torture devices to interrogate her until the red truth is squeezed out!!"'
49165: '@r@v54/75400050."You can squeeze as much blood and truth from the true culprit as you damn well please.@k@|@y@v54/75400051. But know this.@k@v54/75400052. I won''t let you interrogate or torture anyone who isn''t that culprit."'
49166: '@r@v99/SHINM7050."Th-this is why everyone says you''re too soft...!@k @v99/SHINM7051.All the suspicious must be interrogated!@k @v99/SHINM7052.That is how we Inquisitors conduct our witch trials!!"'
49167: '@r@v54/75400053."That''s right, we are Inquisitors.@k@v54/75400054. Felling evil witches is our job.@k@v54/75400055. However, we must not risk hurting the innocent.@k@v54/75400056. We must not suspect them...!@k @v54/75400057.All humans have their own personal truths.@k@v54/75400058. Those should only be exposed when they commit crimes.@k@v54/75400059. We''ve been given the right to expose them.@k@v54/75400060. But there''s one thing we can''t do."'
49168: '@r@v99/SHINM7053."......Wh-...what......?!"'
49169: '@r@v54/75400061."No one, not even God, has the right to expose the innocent truths of those who have not sinned!!"'
49170: '@rThe maid finally realized that he was trying to protect her.'
49171: '@r@v99/MAID7006."......I, I don''t know who you are, but......@k@v99/MAID7007. Th-@v99/MAID7008.......thank you...@v99/MAID7009....very much...!@k @v99/MAID7010.I''m......really not......the culprit!"'
49172: '@r@v54/75400062."Yeah, I know.@k@v54/75400063. ......Your boyfriend said he''d be willing to give up everything to prove your alibi.@k@v54/75400064. You should thank him.@k@v54/75400065. That kid said that honor and reputation are worth nothing compared to you."'
49173: '@r@v99/MAID7011."B-......but, if he does that, he''ll......"'
49174: '@r@v54/75400066."It won''t come to that.@k@v54/75400067. Exposing the secrets between lovers is a job for third-rate magazines.@k@v54/75400068. That''s not mystery.@k@v54/75400069. ......I''ll never allow for heartless reasoning."'
49175: '@rThen, for the first time, the man''s sullen expression relaxed, and he patted the maid''s head unreservedly.'
49176: '@r@v54/75400070."......I''m sure you two will be happy together.@k@v54/75400071. Still, meeting together in secret while on the job is hardly praiseworthy.@k@v54/75400072. Try to keep that to a minimum."'
49177: '@r@v99/MAID7012."Th-......thank you so much......@k@v99/MAID7013. Thank you so much......"'
49178: '@rThese words were heard only by the two of them.'
49179: '@rThe man had learned of her innocence, which could only be proven by exposing the secrets of a pair of young lovers, and he had rushed about in search of a solution, resentful of the arrogance of those trying to expose this by forcible means.'
49180: '@r@v54/75400073."The point of theory-making is not to create a culprit, nor is it to trample the truth in the hearts of the innocent in the process.@k@v54/75400074. Heart matters.@k@|@y@v54/75400075. ......If you want to play the detective, don''t forget the heart.@k@v54/75400076. Forget that, and we''re just intellectual rapists.@k@|@y@v54/75400077. Don''t forget it!!"'
49181: '@r@v99/SHINM7054."Uu......ggh......ggggghhhhh......!!"'
49182: '@rThe Inquisitors couldn''t argue back any longer after the man''s forceful words.'
49183: '@rThe man''s name was Will.@k But everyone used to call him by a different title.'
49184: '@rChief Inquisitor in SSVD, the Eighth District Repentance Enforcement Agency of the Great Court of Heaven—'
49185: '@rWizard-hunting Wright.'
49186: 'Will@r@v54/75400078."That''s the last thing I''m leaving behind for you all.@k@v54/75400079. If you want to be the next "Wizard-hunting Wright", remember it.@k@v54/75400080. Never forget!!"'