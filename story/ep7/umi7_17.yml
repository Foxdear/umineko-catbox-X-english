54669: '@rQuadrillion.'
54670: '@rThere''s only one place you''ll find that word on Rokkenjima.'
54671: '@rGold butterflies flitted from shadow to shadow, dodging raindrops.'
54672: 'BEATRICE@r@v27/70700421."......Unless my memory is mistaken, this is probably the place."'
54673: '@rIt was......the chapel.@k@rThat mysterious building, one of the oldest on Rokkenjima, which had been built at the same time as the mansion.'
54674: '@rIt was called the chapel, but not once had Kinzo used it for worship, and the members of the family had never been allowed inside.'
54675: '@rThere were strict orders that none approach it without reason, and its purpose was always a mystery.'
54676: '@rHowever, any mystery will lose its luster after several decades.'
54677: '@rAt some point, everyone forgot the chapel even existed,@k and that splendid building passed from the thoughts of Rokkenjima''s residents......'
54678: '@rOf course, this had been true for Beato as well.'
54679: '@rBeato, who hated boredom, had no desire to approach places that humans never went.'
54680: '@rHer last memory of the place was of the time she went in there to taunt Shannon as she tried to clean.'
54681: 'BEATRICE@r@v27/70700422."......There can be no doubt.@k@v27/70700423. That is it.@k@v27/70700424. ......Quadrillion."'
54682: '@rBeato looked up......above the door of the chapel.@k@rThere was a relief displayed over an arch.'
54683: '@rEnglish words were written there.'
54684: 'BEATRICE@r@v27/70700425."''You will be blessed only at a probability of a Quadrillion to one''.@k@|@y@v27/70700426. .........Heheh.@k@v27/70700427. So, you thought that was the probability of someone solving this riddle...?"'
54685: '@rThis chapel was built long ago.'
54686: '@rIf there is a mechanism like the one I imagine,@k ......Kinzo must have prepared that epitaph riddle many decades ago.'
54687: '@rHe must have been planning to use it as a ritual for choosing a fitting successor all this time.'
54688: '@r......However, that ritual is now a ritual to open the door to the Golden Land and to my resurrection.'
54689: '@rWhen I snapped my fingers,@k the ground bulged, and several dead trees sprouted out of it, curving and twisting like snakes.'
54690: '@rThey twisted around each other to form a ladder, which leaned itself against the door.'
54691: 'BEATRICE@r@v27/70700428."If my guess is right, ......there''s some sort of mechanism in that relief."'
54692: '@rI slowly climbed the ladder.'
54693: '@rBecause of the size of the door, the relief was very high up.'
54694: '@rThis close up, it looks much bigger than it did from the ground.'
54695: 'BEATRICE@r@v27/70700429."............Come to think of it, whenever we cleaned the chapel,@k@v27/70700430. ......this relief was the only thing that Genji always made sure he polished himself.@k@v27/70700431. ......I always wondered why he didn''t leave something so trivial to the younger servants."'
54696: '@rI thought it strange, but nothing more.'
54697: '@rThe Master treasured this relief, so the head servant cared for it himself.@k ......I always accepted that excuse.'
54698: '@rBut now, I understand.@k@rThere must be a trick to this relief.'
54699: '@rAnd Genji polished it himself to make sure that no one else accidentally found out......'
54700: 'BEATRICE@r@v27/70700432."So, from this Quadrillion, I am to sacrifice the six letters chosen by the key......?"'
54701: '@rI prodded and played with the letter "Q".'
54702: '@rMy fingertips were soon covered with dust.@k However, I quickly realized that something felt strange about it.'
54703: 'BEATRICE@r@v27/70700433."......Don''t tell me this letter...@k@v27/70700434. ......No, ......it had to be like this.@k@v27/70700435. There would be no other way to offer up sacrifices......"'
54704: '@rBeato grabbed hold of the letter "Q", and after experimenting with different levels of force,@w583. ......the letter came out with a scraping sound.'
54705: 'BEATRICE@r@v27/70700436."Just......as I thought........."'
54706: '@rHere''s the "Q" I pulled out.@k And there''s a wedge—no.@k It''s a key.'
54707: '@rA key was attached to the back of the "Q", and that had been stuck into a keyhole in the relief.'
54708: 'BEATRICE@r@v27/70700437."......I see......@k@v27/70700438. In that case, I know what to do next.@k@v27/70700439. ......Very good, this "Q" key is a wrong answer.@k@v27/70700440. Away with you."'
54709: '@rBeato carelessly tossed the "Q" key aside.'
54710: '@rThis was the first sacrifice.'
54711: '@rShe kept on pulling out the keys for the six letters representing "the key".'
54712: 'BEATRICE@r@v27/70700441."......So, "a" will also be sacrificed.@k@v27/70700442. ......And both "i"s.@k@v27/70700443. ......And then the "n" at the end."'
54713: 'BEATRICE@r@v27/70700444."Now, I only sacrifice one "l", ......but unfortunately, there are two "l"s here."'
54714: '@rThere were two "l"s.@k I didn''t know which I should sacrifice.'
54715: '@rI tried pulling both out, but the keys were of different shapes.'
54716: '@rSo, one is a right answer, and one is a wrong answer.'
54717: 'BEATRICE@r@v27/70700445."Well, there are only two.@k@v27/70700446. ......If I make a mistake, I can just try the other one."'
54718: '@rUnless messing up sets off a trap that blows up the island, of course.'
54719: '@rThinking it a waste of time to sit here worrying, I decided on the "l" on the right and pulled it out.'
54720: '@rFive letters remained in the word.'
54721: 'BEATRICE@r@v27/70700447."And now, the first twilight is over.@k@|@y@v27/70700448. ......On to the second twilight."'
54722: '@rOn the second twilight, those who remain shall tear apart the two who are close.'
54723: 'BEATRICE@r@v27/70700449."The "d" and "r" are close.@k@v27/70700450. What does it mean to tear them apart...?@k @v27/70700451.Do I pull them out?"'
54724: '@rBut if I do, there will only be three letters left.'
54725: '@rBy this point, I was able to make a good guess at what the "gouge and kill" lines from the fourth twilight onwards meant.'
54726: 'BEATRICE@r@v27/70700452."Gouge and kill probably means to turn the keys and take them out.@k@v27/70700453. In that case, the parts about going from head to leg must mean starting at the left and going right."'
54727: '@rIf that''s the case, five letters have to remain on the board.@k@rIn other words, "tear apart" doesn''t mean kill.'
54728: 'BEATRICE@r@v27/70700454."If so, then we can read "tear apart" to mean putting a gap between the "d" and the "r".@k@v27/70700455. ......But how?@k @v27/70700456.Once again, there are two ways to do it..."'
54729: '@rDo I remove the "d" and move it to the left?@k@rDo I remove the "r" and move it to the right?'
54730: '@r......After pondering this for some time, I realized that both choices were wrong.'
54731: 'BEATRICE@r@v27/70700457."No.@k@v27/70700458. That''s not right.@k@v27/70700459. I''ve had it wrong since I removed that "l"."'
54732: '@rA short while ago, I removed the right of the two "l"s.@k@rHowever, if I had removed the left one...'
54733: '@r......It would look like this.'
54734: '@rIf you line it up this way, it''s easy to see the next step.@k@rThe "r" gets shifted to the right.'
54735: '@rThis way, all of the letters are spread out evenly.@k@rThis must be it.'
54736: 'BEATRICE@r@v27/70700460."And this next part......is another tough one.@k@v27/70700461. ......Praise my name...?"'
54737: '@rIt''s already clear that this is a word game.'
54738: '@rThose who remain shall praise my noble name.'
54739: '@rI am supposed to do something with the remaining five letters.@k Most likely, rearrange them.'
54740: 'BEATRICE@r@v27/70700462."......''u'', "d", "r", "l", "o"...@k@v27/70700463. ......Can I do something with these five letters to give them some sort of meaning?"'
54741: '@rPraise...my name.'
54742: 'BEATRICE@r@v27/70700464."Gh.@k@v27/70700465. ......How can I get stuck after coming so far......?@k@v27/70700466. How are these five letters supposed to praise a name...?!"'
54743: '@rThat man''s name is Ushiromiya Kinzo.@k@rIs the "u" part of Ushiromiya......?'
54744: '@rNo, several letters don''t match, and there aren''t nearly enough letters to make Ushiromiya...'
54745: 'BEATRICE@r@v27/70700467."One thing that is certain... "My name" must refer to Kinzo.@k@v27/70700468. ......Then, does the "u" stand for Ushiromiya after all?@k @v27/70700469.Like an initial.@k@v27/70700470. ......Then what do the "d", "r", "l", and "o" stand for?@k @v27/70700471.They can''t mean Kinzo.@k@v27/70700472. Do the "r" and "o"......stand for Rokkenjima...?@k @v27/70700473.The master of Rokkenjima, Kinzo......@k@v27/70700474. ......Hmm, not nearly enough letters......"'
54746: '@rThis riddle left me totally confused.@k@rHowever, there were only five letters left.'
54747: '@rThere can''t be so many possible combinations of those letters.@k I could use process of elimination.'
54748: '@rThinking I''d play around with it, I pulled out the "u".'
54749: '@r......There were four letters left.@k "d", "r", "l", and "o".'
54750: 'BEATRICE@r@v27/70700475."...................................."'
54751: '@rMy idea that the "u" stood for Ushiromiya was like a heavenly oracle.'
54752: '@rWhen I removed the "u", I thought of making a word with the remaining four letters.'
54753: '@r"d", "r", "l", and "o".'
54754: '@rThose four letters spun around in my head, changing their orders,@k ......and led me to a single English word that would serve to "praise" Kinzo...'
54755: 'BEATRICE@r@v27/70700476."It''s lord.@k@v27/70700477. ......Lord...!"'
54756: '@rI had absolutely no basis for it.@k ......However, it was like a flash of inspiration.'
54757: '@rI quickly changed the letters around before that flash faded from my mind.'
54758: 'BEATRICE@r@v27/70700478."''l'', "o", "r", "d"!@k @v27/70700479.Lord!@k @v27/70700480."u"!@k @v27/70700481.Ushiromiya!@k @v27/70700482.......Lord Ushiromiya! How do you like that?!"'
54759: 'BEATRICE@r@v27/70700483."On the fourth twilight, .........gouge the head...@w583..........oho?!"'
54760: '@rIt was a key, so it wouldn''t turn if it was the wrong one.'
54761: '@rBut it did turn.@k@|@y I could gouge it...!'
54762: '@rWith a sound of scraping stone, I gouged the first letter, the "l", ......and then pulled it out.'
54763: 'BEATRICE@r@v27/70700484."Next! The fifth twilight...!@k @v27/70700485.Gouge the chest......and kill......!"'
54764: '@rThe "o" was gouged and pulled out easily.'
54765: '@rThen, the "r".@k@|@y Next, the "d".@k@|@y And finally, the "u".'
54766: '@rWhen I turned the key of the "u", I could feel a resistance, as though some mechanism had been activated.'
54767: '@rI waited for something to change, ......but nothing did.'
54768: '@rHowever, I had felt something happen.@k@rA secret door or something must have opened up somewhere around here.'
54769: '@r......Waiting around won''t accomplish anything.'
54770: '@rI''ve probably done everything I can here......'
54771: '@rAll of the letters in "Quadrillion" had been removed.'
54772: 'BEATRICE@r@v27/70700486."On the ninth twilight, ......the witch revives, and none shall be left alive......"'
54773: '@rSo now...has the witch...have I...revived......?'
54774: '@rThe tenth twilight.@k@rThe journey ends, and you shall reach the Home of the Gold......'
54775: '@rWhen I stepped down off the ladder and looked around,@k ......I immediately noticed that small change.'
54776: 'BEATRICE@r@v27/70700487."......That lion statue............"'
54777: '@rAt some point, the lion statue in front of the chapel had turned to face a different direction.'
54778: '@r......What an elaborate mechanism...!'
54779: '@rDid Kinzo plan up this extravagant device back when he first started building on this island......?'
54780: '@rI walked up to the lion statue and stared at it.@k@rOther than the fact that it was pointing a different direction, nothing had changed.@k@rIn that case, is the lion looking at something in particular now......?'
54781: '@rI followed its line of sight.........and saw another lion statue.'
54782: '@rAnd that lion statue had also changed its direction.'
54783: 'BEATRICE@r@v27/70700488."I see......@k@v27/70700489. So, let the lions guide you.@k@v27/70700490. ......As elaborate as ever, I see, Kinzo."'
54784: '@rI wasn''t complaining anymore.'
54785: '@r......I felt a bit of respect and awe at Kinzo for setting up such an intricate device...@kand having it go undiscovered for all these years.'
54786: '@rThere were lion statues standing like guards at the entrance and the corners of the chapel.'
54787: '@rThe direction they faced had changed, pointing around to the back of the chapel.'
54788: '@rThere was something there.'
54789: 'BEATRICE@r@v27/70700491."....................................@k@v27/70700492. ............Hoh........."'
54790: '@rIt was no longer a surprise.'
54791: '@rThis was after the mechanism in the relief.@k After being guided by the lions.'
54792: '@rSo, when a gaping open secret passageway appeared, .........with stairs leading down to the darkness below, ......it wasn''t surprising to me anymore.'
54793: 'BEATRICE@r@v27/70700493."So, .........is this the entrance to the Golden Land, Kinzo......?!!"'
54794: 'Lion@r@v53/75300576.".........Did you find it...?@k@v53/75300577. Grandfather''s......gold......?"'
54795: 'Clair@r@v55/75500888."Yes.@k@v55/75500889. .........At the end of my long, long journey......was the Golden Land."'
54796: 'Will@r@v54/75401103."According to the previous games, there was an underground VIP room there, along with ten tons of gold, right?"'
54797: 'Clair@r@v55/75500890."Yes.@k@v55/75500891. After going down a rough stairway, ......there was a door at the end of the passage.@k@v55/75500892. Inside, it was beautifully furnished, a true VIP room."'
54798: 'Will@r@v54/75401104."......And was the gold all you found there?"'
54799: 'Clair@r@v55/75500893."Yes, at the time......@k@v55/75500894. It would be a lie to say that I was not dizzied by the sight of all that gold stacked high..."'
54800: 'BEATRICE@r@v27/70700494."............Is this...@v27/70700495....real......?"'
54801: '@rI lightly touched the pile of gold with my finger.@k@rIt was hard...and cold.'
54802: '@rI had almost thought that it might crumble like a sandcastle if I touched it.'
54803: '@rNow, there could be no doubt.@k@rThis certainly was......a ten ton pile of gold ingots.'
54804: 'BEATRICE@r@v27/70700496."......Haha,@v27/70700497. ...............ha......"'
54805: '@rConsidering the amount of gold I had just found, I figured I ought to be crying out in delight.'
54806: '@r......I didn''t really feel like laughing, but I thought it only good manners to do so in a situation like this,@k so I forced it out.'
54807: '@rBecause of this, only a few feeble laughs slipped from my mouth.'
54808: '@rAt that moment, even stronger than any delight...@kwas a feeling as though I''d entered a place I wasn''t supposed to be...'
54809: '@rFor a while, all I could do was stand there shocked, unsure what I should do now that the epitaph''s riddle had been completed.'
54810: '@rThen, I heard approaching footsteps.'
54811: '@rThey were coming from the stairway I had entered by.'
54812: '@rSomeone was coming.@k Could it be...Kinzo?'
54813: '@rIf he finds out I''ve been in a place like this, won''t I get scolded harshly......?'
54814: '@rI thought about hiding and pretending this never happened, but my legs wouldn''t move.'
54815: '@rI kept standing there, stunned, in front of the pile of gold......as the footsteps drew closer and closer...'
54816: 'BEATRICE@r@v27/70700498.".................................!"'
54817: '@rThe door opened, ......and I saw who it was.'
54818: '@r......It............wasn''t Kinzo.'
54819: 'Genji@r"................................."'
54820: 'BEATRICE@r@v27/70700499.".........You......"'
54821: 'Genji@r@v14/71600119."......Did you reach this place by your power alone?"'
54822: 'BEATRICE@r@v27/70700500."I-......indeed..."'
54823: 'Genji@r"................................."'
54824: '@rFor some time, Genji stared at Beato in silence, as though he was calculating something.'
54825: '@rThen, he slowly clapped his hands together.@k ......He did it again, over and over.'
54826: '@rIt took quite a long time before I realized that he was applauding me...'
54827: 'Genji@r@v14/71600121."The Master has said that he will hand over the gold and the headship to the first person who solves the epitaph.@k@v14/71600122. ......And, he believed that this person would be BEATRICE..."'
54828: 'BEATRICE@r@v27/70700501."......BEATRICE......@k@v27/70700502. .........Me......?"'
54829: 'Genji@r@v14/71600123."This is fate.@k@v14/71600124. .........It is fate that brought you to this day."'
54830: 'BEATRICE@r@v27/70700503.".............................."'
54831: '@rI didn''t really understand what Genji was saying.'
54832: '@rThe shock of seeing the gold still had me paralyzed...'
54833: 'Genji@r@v14/71600125."......Come this way."'
54834: 'BEATRICE@r@v27/70700504."O-okay......"'
54835: '@rGenji opened a closet.'
54836: '@rInside it was a dress form wearing a beautiful dress made of black cloth and golden stitching.'
54837: '@rWhen I saw it, I understood immediately.'
54838: '@r......It was the witch''s dress.'
54839: '@rThe black dress worn by the BEATRICE in the portrait......'
54840: 'Genji@r@v14/71600126."Change into this."'
54841: 'BEATRICE@r@v27/70700505."......This is.........."'
54842: 'Genji@r@v14/71600127."It is something that.........you once wore."'
54843: '@rI''ve never worn a dress like this.@k However, I understood what Genji meant.'
54844: '@rThis dress was one that BEATRICE once wore.'
54845: '@rAnd the one who shows a miracle by solving the epitaph is BEATRICE.'
54846: '@rBy reaching this room, .........I had succeeded the position of the real BEATRICE,@k the one in the portrait.'
54847: '@rWhy do I call myself BEATRICE?'
54848: '@rBecause the name of the Golden Witch who rules over Rokkenjima''s night is BEATRICE.'
54849: '@r......That''s right.@k I was never the real BEATRICE.'
54850: '@rI was a different witch, stealing the name of the witch from Kinzo''s delusions.'
54851: '@rAnd now, ......I have become the real BEATRICE......'
54852: '@rBy solving the epitaph''s riddle, I would achieve my resurrection.@k@r......I was the one who decided on that rule, or so I thought...'
54853: '@rBut as it turns out, ......this really was.........a ritual to resurrect BEATRICE...'
54854: '@rI believed that I could create my own fate with magic.@k@rI was a master of that magic, ......yet fate had led me here by the hand...'
54855: '@rAt this moment, I was forced to truly accept and believe in this word called "fate"...'
54856: 'BEATRICE@r@v27/70700506."And after I put this on.........?"'
54857: 'Genji@r@v14/71600128."......You will go to the Master.@k@v14/71600129. Ready yourself."'
54858: 'Genji@r@v14/71600130.".........Wait here."'
54859: 'BEATRICE@r@v27/70700507."......O-...okay."'
54860: 'Genji@r@v14/71600085."My lord.@k@v14/71600132. It is Genji."'
54861: '@rAfter Genji knocked, the sound of the study''s door unlocking could be heard.'
54862: '@rAfter a single glance telling me to wait, Genji entered alone.'
54863: 'Kumasawa@r@v18/71800139."I cannot believe that this day has come......@k@v18/71800140. Fate can be such a strange thing......"'
54864: '@rKumasawa was with us too.'
54865: '@rI thought this dress, which didn''t really suit me, would lead to a lot of jokes, ......but she didn''t laugh at me at all.'
54866: '@rOn the contrary, when she saw me, ......her expression had turned stern, as though a long-awaited day had finally come.'
54867: '@r......My heart raced.'
54868: '@rIt wasn''t supposed to matter who solved the epitaph.@k There shouldn''t be anything strange about me solving it......'
54869: '@rEveryone else maintained solemn expressions, ......and that, along with everything else, made this feel like some sort of grand ceremony.'
54870: '@rThe suffocating silence continued.'
54871: '@rEventually, the door opened, and Genji peeked out.'
54872: 'Genji@r@v14/71600133.".........Please enter,@k@v14/71600134. .........BEATRICE-sama."'
54873: '@rHe was saying those words to me, ......but not to the person I had been until a short while ago.'
54874: 'BEATRICE@r@v27/70700508."....................."'
54875: 'Kumasawa@r@v18/71800141."Go ahead,@k@v18/71800142. ......BEATRICE-sama..."'
54876: '@rKumasawa also urged me forward with a respectful bow.@k@rKinzo was probably waiting for me inside.'
54877: '@rWhat expression should I wear as I go in...?@k How should I greet him...?@k@rI don''t have a clue...'
54878: '@rAs the two of them motioned me forward, it was all I could do to avoid tripping over my dress as I walked.'
54879: 'Nanjo@r@v19/71900091.".........Kinzo-san.@k@v19/71900092. She is here."'
54880: '@rKinzo was before the portrait of BEATRICE, crouched on the ground as though kneeling.'
54881: '@rAt Nanjo''s words, he slowly turned, still crouching...'
54882: 'Kinzo@r@v01/71500186."...............Oh...@k@v01/71500187. .........Oohhhhhh........."'
54883: '@rKinzo''s eyes were already red with crying.@k@rWhen he saw me, he groaned with wonder.'
54884: 'Kinzo@r@v01/71500188."......BEATRICE......@k@v01/71500189. .........BEATRICE........."'
54885: '@rHad he even forgotten how to stand up?@k@rHe crawled over to where I was.'
54886: '@r...As he called out to me with the name of the woman he had loved long ago.'
54887: '@rI was too stunned to move.'
54888: '@rThen, Kinzo grabbed the hem of my dress, gripped it tightly, ......then curled up and sobbed.'
54889: 'Kinzo@r@v01/71500190."BEATRICE......@k@v01/71500191. ......I''m sorry. I''m so sorry......@k@v01/71500192. I knew how you felt, ......and yet I......@k@v01/71500193. I''m so sorry...... Forgive me...... Forgive me, I beg you......"'
54890: 'BEATRICE@r@v27/70700509."...................................."'
54891: '@rThere was nothing I could say.@k However, just standing here like this was all I needed to do.'
54892: '@rKinzo''s moment of atonement, the moment he had spent half of his life searching for, had finally come.'
54893: '@r......A human''s life is packed with sin.'
54894: '@rSo, humans seek forgiveness while they still live.@k However, in most cases, there are none in this world capable of giving such forgiveness.'
54895: '@rIt was like that for Kinzo.@k There was no longer anyone in the world who could give that to him.@k@r......But a miracle had woven one together, and in this moment, he had obtained the impossible...'
54896: 'Kinzo@r@v01/71500194."Oooohhhh, BEATRICE...@k@v01/71500195. ......BEATRICE......@k@v01/71500196. ...You need not forgive me, you need not say anything...!@k @|@y@v01/71500197.All I ever wanted......was to say one word......of apology......!@k @v01/71500198.Oooohhhhhh........."'
54897: '@rKinzo kept grasping the dress''s hem and sobbing.'
54898: '@rThe sins of humans are not forgiven by other people.@k@rThey find forgiveness through regret and repentance.'
54899: '@r......I want to believe that some sin, some fault of his......has been forgiven thanks to the way I look...'
54900: '@rKinzo''s sobbing gradually ceased,@k ......and he slowly looked up at me and rose.'
54901: '@rHe staggered.@k Nanjo rushed forward to support him.'
54902: 'BEATRICE@r@v27/70700510."................................."'
54903: 'Kinzo@r@v01/71500199.".........To know.........that you are alive......@k@v01/71500200. ......It brings me such...joy......"'
54904: '@rThis time, his words weren''t directed through me, but at me.@k@rI hesitated, unsure how I should respond.'
54905: 'Genji@r@v14/71600135."......My lord, I beg your forgiveness for keeping this a secret from you all this time."'
54906: 'Kinzo@r@v01/71500201."No matter.@k@v01/71500202. ......I do not fault you, Genji...@k@v01/71500203. ......Considering the sin that I committed, ......every single day until now has been necessary for my atonement......"'
54907: 'Genji@r@v14/71600136."However, there can be no doubt that today''s miracle is a true one.@k@v14/71600137. ......By her own power, without anyone''s help,@k@v14/71600138. ......she solved the epitaph before anyone else."'
54908: 'Kinzo@r@v01/71500204."You did well.........to solve that convoluted epitaph......"'
54909: 'BEATRICE@r@v27/70700511."Th-.........thanks......"'
54910: 'Kinzo@r@v01/71500205."......Yes.@k@v01/71500206. ......Your voice resembles your mother''s.@k@v01/71500207. Even your face reminds me of that mother and daughter......@k@v01/71500208. ...There can be no doubt that BEATRICE''s blood flows through your veins......"'
54911: 'Kumasawa@r@v18/71800143."Yes.@k@v18/71800144. ......The traces of the lady of Kuwadorian in her youth are right there."'
54912: '@rWho......are they saying I look like......?'
54913: 'Genji@r@v14/71600139."......BEATRICE-sama,@k@v14/71600140. please forgive me for keeping what I am about to tell you a secret for all this time.@k@v14/71600141. You are the child of BEATRICE-sama and the Master."'
54914: 'BEATRICE@r@v27/70700512."........................What......?"'
54915: 'Kumasawa@r@v18/71800145."It''s true.@k@v18/71800146. ......You have been raised as a child without parents.@k@v18/71800147. However, your true father is the Master.@k@v18/71800148. And your true mother......is BEATRICE-sama."'
54916: 'BEATRICE@r@v27/70700513."......Is that, ......umm, ......really............?"'
54917: 'Genji@r@v14/71600142."Yes.@k@v14/71600143. You truly are a descendant of BEATRICE-sama."'
54918: '@rIs such a strange fate.........really possible......?'
54919: '@rI''ve dreamed about it.@k Dreamed about what it''d be like to be the Golden Witch, BEATRICE.'
54920: '@rBut that dream was for me alone.'
54921: '@rSo, I''d dreamed that if I solved the epitaph,@k ......and carried out its ritual, I would revive as the true BEATRICE.'
54922: '@r......Is it really conceivable...@w500....that after I solved it...@w583....BEATRICE actually did revive......?'
54923: 'BEATRICE@r@v27/70700514."I...@v27/70700515....truly carry...@v27/70700516.......BEATRICE''s...@v27/70700517.......blood......?"'
54924: 'Genji@r@v14/71600144."Yes.@k@v14/71600145. There is no doubt of that whatsoever."'
54925: 'Kumasawa@r@v18/71800149."......It must have been hard for you to live until this day without knowing a parent''s affection...@k@v18/71800150. ......And yet, look at how wonderfully you''ve grown......"'
54926: 'BEATRICE@r@v27/70700518."......So, ......you all knew.........?@k@v27/70700519. About me......?"'
54927: '@rGenji, Kumasawa, and even Nanjo nodded wordlessly.'
54928: '@r......Now that I think about it, that explains so many things.'
54929: '@rI was always...in some way...special.@k@rGenji and especially Kumasawa always treated me very kindly.'
54930: '@rThen, ......does that mean this day is a promised day, which would eventually have come no matter what......?'
54931: '@rI don''t understand anything anymore.'
54932: '@rIt''s all God''s miracle.'
54933: '@rThe promised fate has led me to this day.'
54934: 'Kinzo@r@v01/71500209.".........BEATRICE.@k@v01/71500210. ............No,@v01/71500211. .........Lion."'
54935: 'BEATRICE@r@v27/70700520."...............?"'
54936: 'Kinzo@r@v01/71500212."That is the name I wanted to give you......"'
54937: 'Genji@r@v14/71600146."......It is your true name."'
54938: 'Kinzo@r@v01/71500213."Lion......@k@v01/71500214. I will now return to you everything that BEATRICE gave me.@k@v01/71500215. ......I return to you the gold, as well as everything of the Ushiromiya family, which was created by it."'
54939: '@rKinzo stuck out a wrinkled hand.'
54940: '@rOn his finger was a ring with the One-winged Eagle crest, which was the symbol of the Ushiromiya family head.'
54941: '@rHe pulled it off, grasped it tightly, and then held it out to me.'
54942: '@r......I didn''t know what to do.'
54943: '@rSlowly, as though they were being drawn forward, ......I held out my hands, palms up.'
54944: '@rAfter pressing his fist against my cupped hands, Kinzo slowly opened his hand and let the ring drop.'
54945: 'Kinzo@r@v01/71500216.".........Lion, my child.........@k@v01/71500217. ......That your fate has been toyed with is a result of my sin.@k@v01/71500218. ......Please forgive me...@k@v01/71500219. ......You now inherit my ring as the new and proper head of the Ushiromiya family."'
54946: 'Kinzo@r@v01/71500220."All of that gold belongs to you.@k@v01/71500221. I ask that you use it as you please, and hope that it will be enough to heal some small part of the pain you have suffered...@k@v01/71500222. That trifling amount of gold may be nothing in comparison with the sin I committed,@k@v01/71500223. .........but even so, it should be enough to bring you some comfort."'
54947: 'BEATRICE@r@v27/70700521."Th-.........thank...you........."'
54948: 'Kinzo@r@v01/71500224.".........Lion.@k@v01/71500225. .........I have one.........final request."'
54949: 'BEATRICE@r@v27/70700522."Wh-......what is that.........?"'
54950: 'Kinzo@r@v01/71500226."Could you..................@k@v01/71500227..........call me........."'
54951: 'BEATRICE@r@v27/70700523."......Huh? ......Sorry, what did you say......?"'
54952: 'Kinzo@r@v01/71500228."Could you............call me.........Father?"'
54953: 'BEATRICE@r@v27/70700524.".............................."'
54954: 'Kinzo@r@v01/71500229."......I understand why you are not able to...@k@v01/71500230. ......I have not been a father to you in any way.@k@v01/71500231. Furthermore, you have been raised without knowing anything about your father.@k@v01/71500232. ......I realize that it''s not a name you can call me by.@k@v01/71500233. And, I realize that I have no right to ask this of you.@k@v01/71500234. .........But, knowing all of that, ......still, I ask you......@k@v01/71500235. ......If I could just hear that, ......I would have no further regrets......"'
54955: '@r.........After being asked like that, ......was it possible for me to refuse?'
54956: '@rEven if I am his child, ......I cannot see him as my father...'
54957: '@rSo, I felt a strong resistance to saying that word.'
54958: '@rBut......I decided that saying it was the right thing to do.'
54959: '@rOnly God can truly forgive sins.'
54960: '@rBut, ......though it may be temporary,@k people can be saved by the forgiveness of others.'
54961: 'BEATRICE@r@v27/70700525.".........F-....................."'
54962: 'Kinzo@r@v01/71500236."........................"'
54963: 'BEATRICE@r@v27/70700526."..................@k@v27/70700527. .........Fath......er............"'
54964: 'Kinzo@r@v01/71500237."Heh, ............heheheh............"'
54965: '@rThat awkward word made Kinzo laugh.@k@rDrops of silver fell from both of his eyes.'
54966: '@rAt that moment, ......the shadow that had covered his face......was wiped away......'
54967: 'Kinzo@r@v01/71500238."Thank you, ......Lion.@k@v01/71500239. My child......@k@v01/71500240. .........And BEATRICE, as well.@k@v01/71500241. Thank you for this last chance......to ask for forgiveness........."'
54968: 'Kinzo@r@v01/71500242."......Of course, I don''t believe that such a simple act will earn me forgiveness.@k@v01/71500243. ......The rest, I will do as I burn in the fires of hell.@k@|@y@v01/71500244. .........I, Ushiromiya Kinzo, have no more regrets in this life!!@k@v01/71500245. None at all! No regrets or things left undone!!@k @v01/71500246.Wahaha, ......wahahahahahahahaahahah!!@k @v01/71500247.Waaahhahahahahaahahahahahaha!!!"'
54969: '@rLooking up to the heavens, Kinzo spread his arms as though facing an applauding audience,@k ......laughing at the top of his lungs.'
54970: '@rIt was the final pleasure, known only by those who have been released from all regrets of this world.'
54971: '@r.........Kinzo''s laugh weakened, ......and when it disappeared...'
54972: '@rHe dropped to his knees...@w166....like a puppet with its strings cut...@w250.............and slowly...@w166.......fell to the ground.........'
54973: 'Kumasawa@r@v18/71800151."......M-.........my lord......"'
54974: 'Genji@r@v14/71600147."Doctor Nanjo......"'
54975: 'Nanjo@r@v19/71900093."Y-......yes........."'
54976: '@rThough their master had fallen, ......they walked up to him slowly.'
54977: '@rThey already knew.@k@rKinzo''s soul......had already burned itself out.'
54978: '@rAfter checking Kinzo''s pulse, Nanjo shook his head and stood back up.'
54979: 'Nanjo@r@v19/71900094."............It was a peaceful death.@k@v19/71900095. ......I don''t think he had any regrets at all."'
54980: 'Kumasawa@r@v18/71800152."It may be......that the Master died long before now.@k@v18/71800153. ......It was only his magic and tenacity that kept him here so long.@k@v18/71800154. ......And.........once he finally had a chance to apologize to BEATRICE-sama for everything, .........he finished everything he had to do..."'
54981: 'Genji@r@v14/71600148.".........Please, ......rest in peace.@k@v14/71600149. ............I believe that you have redeemed yourself."'
54982: 'BEATRICE@r@v27/70700528.".................................Father........."'
54983: '@rThat was...@w500....the one-night reunion...@w583....between me and my father...@w500....and also our final farewell......'
54984: 'Genji@r@v14/71600150.".........This gold all belongs to you now.@k@v14/71600151. ......If you wish to exchange it for money, I can arrange for that."'
54985: 'Nanjo@r@v19/71900096."I hear it''s worth 20 billion yen.@k@v19/71900097. .........All of your dreams in this world can now be granted with money."'
54986: 'Kumasawa@r@v18/71800155."Hoh-hoh-hoh-ho......@k@v18/71800156. It must be tough to think of what to do with this much money when it suddenly comes your way."'
54987: 'BEATRICE@r@v27/70700529."............There is nothing I desire among the things money can buy.@k@v27/70700530. ......So, for the present, I would like to leave this here."'
54988: '@r......Of course, I''m glad I have a lot of money.'
54989: '@rHowever, money can''t heal the pain in my heart.@k@rI just.........want him to come back.'
54990: 'Genji@r@v14/71600152."As you wish.@k@v14/71600153. Then it shall be left here.@k@|@y@v14/71600154. ......Also, take this key."'
54991: 'BEATRICE@r@v27/70700531.".........What is this?"'
54992: 'Genji@r@v14/71600155."It is the key to this underground VIP room.@k@v14/71600156. If you use this, you won''t need to use the more complicated device."'
54993: '@rShe was the only one who knew the answer to the epitaph''s riddle, and the only key to this place was now hers.'
54994: '@r......At this point, she truly was the master of this golden VIP room.'
54995: 'Genji@r@v14/71600157."You are already the master of Rokkenjima.@k@v14/71600158. You have the right to know all of this island''s secrets."'
54996: 'Nanjo@r@v19/71900098.".........We should talk about Kuwadorian too."'
54997: 'Kumasawa@r@v18/71800157."That''s the mansion your mother lived in.@k@v18/71800158. ......I''m sure you''ve heard rumors about it."'
54998: 'BEATRICE@r@v27/70700532."Kuwadorian........."'
54999: 'Genji@r@v14/71600159."There are two mansions on this island, one at either end.@k@v14/71600160. ......One is the mansion we know well.@k@v14/71600161. The other is a hidden mansion known as Kuwadorian."'
55000: 'Kumasawa@r@v18/71800159."Below this island are the remains of a military base built during the war.@k@v18/71800160. The Master used that to travel between the two ends of the island..."'
55001: 'Genji@r@v14/71600162_b."There is an underground path in the back of this room, and if you follow it, you will reach the basement of Kuwadorian on the other end of this island.@k@v14/71600163. ......That is a secret mansion, which only the Master knew of.@k@v14/71600164. Of course, that mansion, like everything else, now belongs to the new head."'
55002: 'Nanjo@r@v19/71900099."......It''s the mansion your mother lived in.@k@v19/71900100. It''s probably worth taking a trip over there sometime."'
55003: 'BEATRICE@r@v27/70700533."My......mother............"'
55004: '@rI''ve lived alone my whole life.'
55005: '@rThe only person I''ve ever felt like calling "Mother" is Kumasawa-san, who always helped me out.'
55006: '@rThe mansion where a mother I''ve never met nor seen lived...'
55007: '@r.........Who in the world.........am I......?'
55008: 'Genji@r@v14/71600165."Ask any questions you wish.@k@v14/71600166. ......You now deserve to know everything."'
55009: 'BEATRICE@r@v27/70700534."......Right now, ......I''m feeling very confused.@k@v27/70700535. ......I don''t even know where I should start asking questions.@k@v27/70700536. ......But I''m sure......I''ll think of plenty of things to ask about.@k@v27/70700537. ......When I do, please tell me..."'
55010: 'Genji@r@v14/71600167."As you wish."'
55011: 'BEATRICE@r@v27/70700538."A-......also,@v27/70700539. ......being treated so respectfully like that...@v27/70700540.is a bit uncomfortable.@k@v27/70700541. I''d be happier if you could talk to me the same way you''ve always done."'
55012: 'Genji@r@v14/71600168."If that is what you wish, then I will do so."'
55013: 'Kumasawa@r@v18/71800161."Hoh-hoh-hoh-ho.@k@v18/71800162. That''s easier for me too."'
55014: 'Nanjo@r@v19/71900101.".........Well now.@k@|@y@v19/71900102. What will we do now, Genji-san?@k@v19/71900103. ......Kinzo-san is dead."'
55015: 'Genji@r@v14/71600169."I will tell Krauss-sama and Madam that he has passed away.@k@|@y@v14/71600170. ......Then, we must tell them that Lion-sama is the official successor to the headship.@k@v14/71600171. After all, from this point forth, you are the Ushiromiya family head."'
55016: 'BEATRICE@r@v27/70700542."M-me as the head? That''s......@k@v27/70700543. And isn''t Krauss-sama the successor......?"'
55017: 'Genji@r@v14/71600172."The one who solves the epitaph''s riddle is the successor.@k@v14/71600173. .........There exists a will specifying this.@k@v14/71600174. .........The Master''s final order was that you were to inherit everything."'
55018: 'BEATRICE@r@v27/70700544."P-please wait...!@k @v27/70700545.I appreciate the sentiment, ......but I can''t do the job of being the successor,@k@v27/70700546. ......and I can''t accept such a big responsibility.@k@v27/70700547. I think it would be better for Krauss-sama to inherit that role......"'
55019: 'Genji@r@v14/71600175.".........Are you certain?"'
55020: 'BEATRICE@r@v27/70700548."Today, ......I have learned who I am.@k@v27/70700549. ......Everyone knows about their parents,@k@v27/70700550. but I didn''t, since the time of my birth.@k@v27/70700551. ......And here, today, I finally learned the truth.@k@v27/70700552. ......That alone is enough for me."'
55021: '@rIf I suddenly became the Ushiromiya family head, how would Krauss-sama react?@k How angry would Madam be?'
55022: '@rI don''t want to become the head if it means making them feel like that.'
55023: '@rToday, I learned who I am.'
55024: '@rWho gave birth to me, how, and when?@k ......These are things I want to learn from them as time goes by.'
55025: '@rThat alone is enough.'
55026: 'BEATRICE@r@v27/70700553.".........I am Lion.@k@v27/70700554. ......And I am the Golden Witch, BEATRICE.@k@v27/70700555. Knowing that is enough for me.@k@v27/70700556. ......I don''t plan on calling myself the head.@k@v27/70700557. ......Krauss-sama can take that job."'
55027: 'Genji@r@v14/71600176."Is that your order, as the Ushiromiya family head?"'
55028: 'BEATRICE@r@v27/70700558.".........Yes."'
55029: 'Genji@r@v14/71600177.".....................@k@|@y@v14/71600178. ......As you wish, Master.@k@v14/71600179. Then I will make it so."'
55030: 'BEATRICE@r@v27/70700559."And please, don''t tell anyone about what happened tonight.@k@v27/70700560. .........I want to stay me.@k@v27/70700561. ......There''s nothing I''d want to do if I had the Ushiromiya headship or the gold."'
55031: '@r......I just...'
55032: 'BEATRICE@r@v27/70700562."I want to wait.........here on this island......as I have done in the past.@k@v27/70700563. I want everything to be exactly the same as it was.@k@v27/70700564. .........That''s my only wish."'
55033: 'Genji@r"...........................@k@|@y@v14/71600181. As you wish, Master.@k@v14/71600182. ......Everything that has happened tonight will not go beyond those present here.@k@v14/71600183. ......Kumasawa.@k@v14/71600184. Doctor Nanjo.@k@v14/71600185. That is the wish of the new head."'
55034: 'Nanjo@r@v19/71900104."......If that''s what you want, I have no objections.@k@|@y@v19/71900105. Kinzo-san''s will entrusts everything to you.@k@v19/71900106. If this is what you want to do, none of us will complain."'
55035: 'Kumasawa@r@v18/71800163."You say "exactly the same as it was",@k@v18/71800164. ......but do you really mean exactly the same...?@k @v18/71800165.With no differences at all...?"'
55036: 'BEATRICE@r@v27/70700565."Yes.@k@v27/70700566. .........We''ll keep this a secret.@k@v27/70700567. ......This place and the gold will be sealed away.@k@v27/70700568. If I need money, I''ll ask you about it then.@k@v27/70700569. .........That''s enough for me."'
55037: 'Genji@r@v14/71600186."As you wish.@k@v14/71600187. The mechanism leading to this place and the key both belong to you.@k@v14/71600188. ......And all of us swear to keep the events of this night a secret.@k@v14/71600189. .........Krauss-sama will be the successor,@k@v14/71600190. ......but in my heart, you will be the only true successor."'
55038: 'Genji@r@v14/71600191."......As you have ordered, we will behave the same way we always have, but please order us whenever it suits you.@k@v14/71600192. You are my only master."'
55039: 'BEATRICE@r@v27/70700570."..................Th-.........thank you very much..."'
55040: '@rA vast mountain of gold and the ring of the Ushiromiya family head.@k@rThe dress of the portrait BEATRICE.'
55041: '@rAnd.........I became the true BEATRICE, the Golden Witch.'
55042: '@rRight here in my very own Golden Land.'
55043: '@rIf I think about it, not much has actually changed.'
55044: '@rAfter all, I''ve always been the Golden Witch. ......I''ve just had a few more people acknowledge that.'
55045: '@rNovember 29th.@k@rThe day I became a true witch.'
55046: 'Clair@r@v55/75500895.Oh, I am one yet many.@k@r@v55/75500896.I am the Golden Witch, BEATRICE.'
55047: 'Clair@r@v55/75500897.The true ruler of Rokkenjima,......and the possessor of endless gold.'
55048: 'Clair@r@v55/75500898.Yet, I am in no way complete.'
55049: 'Clair@r@v55/75500899.......Here I wait...for the return of the one person I love......'