50022: '@r@v99/JOUKA7001."Step it up!!@k @v99/JOUKA7002.What are you doing, slacking off when the fighting''s so close?!"'
50023: '@rStars seemed to spin around inside my head.'
50024: '@rI could just lie down on the floor, but that''d only make him more angry.'
50025: '@rI''ve no intention of being obedient.'
50026: '@r......Still, it''d be stupid to get myself punched for no reason, so I got up and stood at attention...'
50027: 'Kinzo@r@v58/75600072."................................."'
50028: '@rThe fighting''s close, is it?@k You really think the American troops are likely to show up on this forgotten island?'
50029: '@rThen let them come right now.@k@rThat''s what I''ve been waiting for all this time.'
50030: '@r@v99/JOUKA7003."What''s this cowardly look you''re wearing?!@k @v99/JOUKA7004.Is this how afraid you are of death?!@k @v99/JOUKA7005.Are you so scared of those Americans?!@k @v99/JOUKA7006.You won''t be killin'' any of them with an attitude like that!!"'
50031: 'Kinzo@r@v58/75600073.".............................."'
50032: '@rThey hit me again.'
50033: '@r......Could you please quit your whining already?@k Filthy cowards.'
50034: '@rThey give themselves over to this inexplicable anger because it''s the only way to distract themselves from their own fear.'
50035: '@rHeart and spirit aren''t any use when the battle becomes hopeless.'
50036: '@rWhen trapped by an insurmountable hopelessness, humans rely on several other emotions to escape their fear.'
50037: '@rThese young, inexperienced soldiers found anger to be a very convenient emotion to fall back upon.'
50038: '@rThey did "drills" by shouting in loud voices and swinging their bamboo spears around.@k Drinking the wine called anger was simply what they needed to do to numb their fear.'
50039: '@rThe more one drinks wine, the more one needs to drink to get drunk.'
50040: '@rTheir useless anger continued to pile up, day after day, without pause.'
50041: '@rAs for me, I did not fear death.'
50042: '@rSo, I had no need of the wine called anger.'
50043: '@rThis made their cowardice all the more apparent to me.'
50044: '@r@v99/JOUKA7007."There you go again, that look in your eyes!@k @v99/JOUKA7008.Ushiromiya, your spirit is rotten to the core!!@k @v99/JOUKA7009.You''re a fish, that''s what you are.@k@v99/JOUKA7010. You''ve got the eyes of a dead fish!!"'
50045: '@rHowever, it went both ways.'
50046: '@rJust as I was able to spot their cowardice...@k@rThey were able to pick up on my lethargy.'
50047: '@r@v99/JOUKB001."Is Ushiromiya Kinzo here?!@k @v99/JOUKB002.The lieutenant''s looking for you!"'
50048: '@r@v99/JOUKA7011."Stand up!@k @v99/JOUKA7012.No slouching about!@k @v99/JOUKA7013.Double tiiiiime!!"'
50049: '@rFirst Lieutenant Yamamoto was the commanding officer in charge of the Rokkenjima garrison.'
50050: '@rHe was just another filthy coward trying to forget his fear with violence,@k and would reprimand his subordinates for slacking off at the drop of a hat.'
50051: '@rThe stories of his life he''d spout off when in a good mood were all about how much of a thug he had been, ignoring the rules of society.'
50052: '@rOn and on about how so-and-so was a prick so he taught them a lesson, or how everyone was so scared of him that he got special treatment.'
50053: '@r......He kept on talking about what a vile human he was as though it was a badge of honor.'
50054: '@rNormally, I had nothing to do with this disagreeable lieutenant.'
50055: '@rHe would always hang around with his non-commissioned subordinates,@k so as long as I treated him with a snappy salute, I could more or less ignore him for the time being.'
50056: '@rNow that the construction project on this island had been suspended indefinitely, there was no longer any use for an engineer like me.'
50057: '@rSo, why did the lieutenant ask for me specifically?@k@rAt that moment, I couldn''t think of anything......'
50058: '@r@v99/75700001."Ushiromiya!@k @v99/75700002.I hear you''re good at speaking foreign languages, is that true?!"'
50059: 'Kinzo@r@v58/75600074."I am proficient in both English and Chinese, sir."'
50060: '@rThe lieutenant liked to brag about his education in front of the non-commissioned officers,@k but he held a bit of a grudge against me for being even more highly educated than him.'
50061: '@rHe also felt uncomfortable about having me as a subordinate because he was younger than me,@k so I was definitely not the kind of person he could hit it off with.'
50062: '@rJust the fact that I knew several languages must have hurt his pride.'
50063: '@r@v99/75700003."What about Italian, do you speak that?"'
50064: 'Kinzo@r@v58/75600075."I''m afraid not."'
50065: '@r@v99/75700004."So, you wouldn''t be much help as an Italian interpreter, then."'
50066: 'Kinzo@r@v58/75600076."It should be possible if one of them speaks English as well, sir."'
50067: '@r@v99/75700005."......Ah, yes, very true!@k @v99/75700006.Have you ever talked with a foreigner in English?!"'
50068: 'Kinzo@r@v58/75600077."I have, sir."'
50069: '@rWhy on Earth would he need an interpreter in a cave on an uninhabited island that even our superiors have forgotten?'
50070: '@rHis question made it clear that someone who would need an interpreter would be visiting Rokkenjima.'
50071: '@r@v99/75700007."Good!@k @v99/75700008.Ushiromiya, you''ll be my interpreter, that''s an order!"'
50072: '@rThat evening, I found out exactly what he was talking about.'
50073: '@rThat pointless cavern submarine dock that had never been used...@k.........was now being approached slowly by a submarine of the Italian Navy.'
50074: '@rOf course, I knew that the Italians had been our allies.@k@rHowever, this was the first time I had seen anything from their military with my own eyes.'
50075: 'Lion@r@v53/75300217."What was the Italian Navy doing here......?@k@v53/75300218. Didn''t Italy surrender in 1943?@k@v53/75300219. What''s going on...?"'
50076: 'Kinzo@r@v58/75600078."It was the Kingdom of Italy that surrendered.@k@v58/75600079. ......However, the ones who couldn''t accept that surrender formed a pro-German government called the RSI so that they could continue fighting."'
50077: 'Lion@r@v53/75300220."The RSI?"'
50078: 'Will@r@v54/75400479."The Italian Social Republic.@k@v54/75400480. Also known as the Salo Republic."'
50079: 'Kinzo@r@v58/75600080."You know your history.@k@v58/75600081. ......The ignorant often call the Italians cowards, saying that they surrendered first of the Axis powers in 1943.@k@v58/75600082. That''s not true.@k@v58/75600083. The military of the Italian Social Republic fought bravely from the outbreak of war until April 29th, 1945."'
50080: 'Will@r@v54/75400481."And Berlin fell just three days after that.@k@v54/75400482. Far from being cowards, they gave one hell of a fight.@k@v54/75400483. ......Still, I''m surprised the RSI Navy even had possession of a submarine that could travel all the way to Japan."'
50081: 'Lion@r@v53/75300221."......Even if they did, it''s a surprise that they''d come out this far at all.@k@v53/75300222. ......Why would they come to Japan?@k @v53/75300223.To Rokkenjima?"'
50082: '@rThe submarine was both weather-worn and massive.'
50083: '@rThis dock had never even been used by one of our own country''s submarines.@kI doubt anyone here imagined that it would end up welcoming in one from a far-off nation.'
50084: '@rAll of the guards of Rokkenjima, of which there were only about thirty, stood at attention as the submarine docked.'
50085: '@r@v99/HEISA7001."......Never seen the Italian military before......"'
50086: '@r@v99/HEISB7001."I heard a mine or some kinda accident trashed their sub."'
50087: '@r@v99/HEISA7002."From what I heard, their ventilation system was hit and they couldn''t stop the cabin filling up with chlorine gas."'
50088: '@r@v99/HEISB7002."The lieutenant was hinting about there being something very important in there......"'
50089: '@r@v99/HEISA7003."You mean like a code machine or the blueprints for some new kind of engine?"'
50090: '@r@v99/HEISB7003."I couldn''t care less what they''re carrying, I''m more surprised that the higher-ups still remember we exist..."'
50091: '@r@v99/75700009."Move it, Ushiromiya!!@k @v99/75700010.How''re you supposed to interpret from over there?!!"'
50092: 'Kinzo@r@v58/75600084."Yes, sir......"'
50093: '@rOn top of the hatch was a young Italian saluting us.'
50094: '@r......Normally, this should have been the job of a commissioned officer, but his clothes looked like those of a sailor,@k and it really didn''t look like he had the dignity and composure of a ship''s captain.'
50095: '@rThat probably meant that all of the commissioned officers in charge had died in the accident that had befallen this sub.'
50096: '@rCrew members crawled out of the hatch one by one, but they all looked pale and entirely worn out.'
50097: '@rI wasn''t sure how long ago the accident had happened,@k but being crammed together in a tiny sub filled with chlorine gas for any amount of time can''t be good for your health.'
50098: '@rAdding to the problem of the broken ventilation system was the fact that they couldn''t afford to travel about carelessly on the surface of the waters around Japan right now.'
50099: '@r......They had essentially traveled here inside a can of poison gas.'
50100: '@rAlmost all of them were unable to walk without leaning on someone else—it looked like a bunch of people staggering out of a hospital boat.'
50101: '@r@v99/75700001."Ushiromiya!@k @v99/75700012.Ask them who the captain is!@k @v99/75700013.Tell them that I''m in charge of this island!"'
50102: 'Kinzo@r@v58/75600085."<......Welcome to Japan.@k@v58/75600086. Do any of you speak English?>"'
50103: '@rThe crew members seemed to understand that I was speaking English, but it looked as though none of them could speak it.'
50104: '@rEventually, someone who seemed to be dressed as an officer saluted.'
50105: 'Kinzo@r@v58/75600087."<Welcome to Japan.@k@v58/75600088. Are you the captain?>"'
50106: '@r@v99/75800001."<I cannot speak English>......@k@v99/75800002. <Please, wait.>"'
50107: '@rThe officer answered in slow, laborious English.'
50108: '@r......After asking us to wait, he shouted something to his subordinates in rapid Italian.'
50109: '@rIt looked as though he was telling them to get someone among them who could speak English.'
50110: '@r@v99/75700014."Ushiromiya, what''re they talking about?!"'
50111: 'Kinzo@r@v58/75600089."They''ve asked us to wait.@k@v58/75600090. They might be looking for someone there who can speak English."'
50112: '@rAt that moment, I heard a high-pitched cough.@k@rIt wasn''t a man''s cough.@k ......It was a woman''s.'
50113: '@r@v59/70700007."<I speak English.>"'
50114: '@rAs she came down from the hatch, .........a woman with beautiful golden hair said this in English.'
50115: '@rIn this filthy cavern,@k the appearance of one as beautiful as she was seemed like an angel descending upon us......'
50116: 'Kinzo@r@v58/75600091."<Welcome to Japan.@k@v58/75600092. Is the captain there?>"'
50117: '@r@v59/70700008."<The captain is dead.@k@v59/70700009. That man over there is the only officer left.>"'
50118: 'Kinzo@r@v58/75600093."<My condolences.@k@v58/75600094. Can we do anything to assist you?>"'
50119: '@r@v59/70700010."<Well, we would like some fresh air and water.@k@v59/70700011. Some of us are still having trouble breathing.@k@v59/70700012. We''d like a place to rest.>"'
50120: 'Kinzo@r@v58/75600095."<We would be happy to help.@k@v58/75600096. Do any of the others understand English?>"'
50121: '@r@v59/70700013."<There were some who did, but they''re all dead.@k@v59/70700014. I''m the only one now.>"'
50122: '@r@v99/75700015."Ushiromiya! What''s that woman talking about?!@k@v99/75700016. Who''s the captain? That man from a second ago?!@k@v99/75700017. Who is that woman?! Let''s see some translating, dammit!!"'
50123: '@rThe lieutenant wouldn''t shut up.'
50124: '@r......He must have been surprised to see such a beautiful woman appear from the submarine...@kand more than a little annoyed to see all of her attention focused on me alone.'
50125: '@rIt was a mark......of how divinely beautiful she was.'
50126: 'Kinzo@r@v58/75600097."Sir,@k@v58/75600098. it seems that she''s the only one who understands English.@k@v58/75600099. She will act as their interpreter.@k@v58/75600100. Their captain is dead.@k@v58/75600101. That officer seems to be acting in his place."'
50127: '@r@v59/70700015."<Who''s that loud man who keeps yelling at you?@k @v59/70700016.Don''t tell me he''s your superior.>"'
50128: 'Kinzo@r@v58/75600102."<Yes, unfortunately.@k@v58/75600103. He probably doesn''t like seeing me have such a beautiful lady all to myself.>"'
50129: '@r@v59/70700017."<Oho.@k@v59/70700018. I didn''t expect such flattery from an Asian.@k@v59/70700019. Your English is superb.@k@v59/70700020. I imagine you''ve been brought up very well.@k@v59/70700021. Unlike that rude man who keeps on shouting.@k@v59/70700022. They should have made you the officer in charge around here.>"'
50130: 'Kinzo@r@v58/75600104."<Oh?@k@v58/75600105. I didn''t expect such flattery from a Westerner.>"'
50131: '@r@v59/70700023."<*giggle*!@k @v59/70700024.You''re an interesting man.@k@v59/70700025. What''s your name?>"'
50132: 'Kinzo@r@v58/75600106."<Ushiromiya...Kinzo.@k@v58/75600107. If you don''t mind, may I ask for your name as well?>"'
50133: '@r@v59/70700026."<Beatrice Castiglioni.>"'
50134: 'Kinzo@r@v58/75600108."<Welcome, Beatrice.@k@v58/75600109. Welcome to Japan.>"'
50135: '@rThat was when I first met Beatrice, the woman who would capture my heart for the rest of my life......'
50136: 'Lion@r@v53/75300224."......So, Beatrice was an Italian."'
50137: 'Kinzo@r@v01/71500097."Yes.@k@v01/71500098. She was the daughter of a high-ranking RSI official.@k@v01/71500099. Apparently, their most important cargo was her father himself.@k@v01/71500100. ......Sadly, he had already died by the time they reached Rokkenjima."'
50138: 'Will@r@v54/75400484."Why would a high official like that come to Japan?@k @v54/75400485.You''re saying he went through the Suez Canal and crossed the Indian Ocean to come all the way here?"'
50139: 'Lion@r@v53/75300225."That''s a good point.@k@v53/75300226. If they wanted to reach one of their allies, Germany should have been much closer.@k@v53/75300227. ......So, why would they make the long trip to Japan?"'
50140: 'Kinzo@r@v01/71500101.".........It may have been part of some grand, outrageous strategy.@k@v01/71500102. ......I don''t know all the details,@k@v01/71500103. but shortly after, I learned that this submarine''s mission was far from a minor one..."'
50141: '@rThey said that there had been about sixty of them at the time of their departure.'
50142: '@rHowever, only about ten of them, including Beatrice, had survived.'
50143: '@rTheir submarine had apparently hit a mine or something in the nearby waters and sustained a great deal of damage.'
50144: '@rThey told us that it had flooded rapidly with water, which had taken out the batteries and released a large amount of chlorine gas.'
50145: '@rTheir sub had become completely incapable of continuing further,@k nothing but a massive lump of metal floating in the dock.'
50146: '@rSince the sub seemed to be carrying "something of immense value",@k the higher-ups ordered us to investigate.'
50147: '@rAfter questioning the Italians, with Beatrice and me acting as double interpreters,@k we concluded that this thing of immense value must have been her father himself.'
50148: '@rApparently, Beatrice''s father was extremely high up in the RSI hierarchy,@k and it was thought that he might have worked alongside the Italian Prime Minister himself.'
50149: '@rThough their massive voyage had apparently been part of some top-secret mission, now that the man himself and all of the commissioned officers had died,@k their reason for coming to Japan remained a mystery.'
50150: '@rAnd, since the higher-ups were telling us to investigate, that meant that even they didn''t know what it was.'
50151: '@rTheir ship had broken down, their mission was unknown, and the high official they had been carrying was dead.@k@rAnd even the Japanese government didn''t know why they were here.'
50152: '@r......The Italians'' great and perilous voyage...@k...had come to a meaningless and utterly fruitless end...'
50153: 'Beatrice@r@v59/70700027."<That''s a relief.@k@v59/70700028. I always assumed the Japanese ocean air would smell like soy sauce.>"'
50154: 'Kinzo@r@v58/75600110."<What a coincidence.@k@v58/75600111. I''ve always thought Italians had hair made of pasta.>"'
50155: 'Beatrice@r@v59/70700029."<Of course we do.@k @v59/70700030.You don''t know how hard it is to get that perfect al dente texture.@k@v59/70700031. I imagine you Japanese all wear spaghetti al nero?>"'
50156: 'Kinzo@r@v58/75600112."<Oh, you know quite a lot, I see.@k@v58/75600113. In Japan, we like to use squid ink instead of shampoo.>"'
50157: 'Beatrice@r@v59/70700032."<*giggle*!@k @v59/70700033.You really are amazing, Kinzo.@k@v59/70700034. It seems you know everything!@k @v59/70700035.Have you ever been to Italy?>"'
50158: 'Kinzo@r@v58/75600114."<Never.@k@v58/75600115. I have read a lot of your books, though.>"'
50159: 'Beatrice@r@v59/70700036."<An Asian man reading Italian books?!@k @v59/70700037.Wow, what kinds of books?>"'
50160: 'Kinzo@r@v58/75600116."<Niccolo Machiavelli.@k@v58/75600117. And Dante Alighieri.@k@v58/75600118. So, I know of course that you are the eternal lady.>"'
50161: 'Beatrice@r@v59/70700038."<Oh, what a surprise...@k@v59/70700039. You must be quite the bookworm.@k@v59/70700040. Does this mean you came from some Japanese noble family?>"'
50162: 'Kinzo@r@v58/75600119."<.........Who knows?>"'
50163: 'Beatrice@r@v59/70700041."<You''re completely different from those other savage-looking Japanese soldiers.@k@v59/70700042. I can tell!@k @v59/70700043.You must''ve come from a noble family.@k@v59/70700044. Are the Ushiromiyas some sort of Japanese aristocrats?>"'
50164: 'Kinzo@r@v58/75600120."<......Of course not.@k@v58/75600121. They just managed to strike it rich in the spinning industry in recent generations.@k@v58/75600122. I didn''t study to prepare myself for nobility or anything like that.@k@v58/75600123. ......I just wasn''t allowed to do anything else.@k@v58/75600124. Reading books, playing around with roses,@k@v58/75600125. and getting myself drunk were the only ways I had to occupy myself.>"'
50165: '@rBeatrice hadn''t asked that question out of malice.@k@rIt had just been a curious question asked to a friend from a faraway country.'
50166: '@rHowever, ......Beatrice was from a noble family herself, so she could tell.'
50167: '@r......She could see the faint gloomy look on Kinzo''s face.'
50168: 'Beatrice@r@v59/70700045."<Forgive me, Kinzo.@k@v59/70700046. I was so surprised that a high-class person like you would be a simple soldier in a place like this...@k@v59/70700047....that I didn''t stop to think about why.>"'
50169: 'Kinzo@r@v58/75600125_A."<I don''t really care about my family line.@k@v58/75600125_B. The name Ushiromiya will mean nothing when I''m dead.@k@v58/75600125_C. And that will be what finally sets me free.>"'
50170: 'Beatrice@r@v59/70700048."<.........So, you joined the army because you wanted to die?@k @v59/70700049.You mustn''t do that.@k@v59/70700050. Your family would be so sad.>"'
50171: 'Kinzo@r@v58/75600125_D."<Family?@k@v58/75600125_E. ......I have no family.>"'
50172: '@rI have a wife for the sake of public appearances...and children.@k@rHowever, I''ve never wanted any of them.'
50173: '@r......Everything, everything......is a fleeting daydream created by selfish, greedy old men.'
50174: '@r......So, at least being stuck on this island, I can forget about all of that......and find some peace.'
50175: '@rPeace.........?'
50176: '@rBut haven''t I spent each and every day complaining that I wasn''t sent to the front and haven''t managed to die yet......?'
50177: 'Beatrice@r@v59/70700051."<......I can''t understand the pain you''re going through, but I do realize that my thoughtless words have hurt you.@k@v59/70700052. Forgive me, Kinzo.>"'
50178: '@rForgive me, Kinzo.'
50179: '@rOhh, those words...I think...they set me free.'
50180: '@rAll of the Japanese people call me Ushiromiya.'
50181: '@r......Every time I hear it, it''s a constant reminder that I''m the property of the Ushiromiya family.'
50182: '@rBut she is different.@k@rShe calls me...Kinzo.@k Not Ushiromiya.'
50183: '@rSo maybe.........just for the time I chat with her like this,@k ......I can forget that cursed family.'
50184: 'Beatrice@r@v59/70700053."<............Kinzo.>"'
50185: '@rI hadn''t meant to make Beatrice feel guilty,@k but she seemed certain that her thoughtless words had hurt me.'
50186: 'Kinzo@r@v58/75600126."<Thank you.>"'
50187: 'Beatrice@r@v59/70700054."<Huh?>"'
50188: 'Kinzo@r@v58/75600127."<You calling me "Kinzo" makes me feel like I can finally be my own man.@k@v58/75600128. ......I think...that I''ve finally met a person who truly sees me for who I am.>"'
50189: 'Beatrice@r@v59/70700055."<Kinzo.@k@v59/70700056. You may be a foreigner I met in a distant land,@k@v59/70700057. ......but I know your heart is very sensitive and beautiful.@k@v59/70700058. If we had grown up in the same neighborhood, I''m sure we''d have become quick friends.>"'
50190: 'Beatrice@r@v59/70700059."<......I''m happy too.@k@v59/70700060. You always call me Beatrice.@k@v59/70700061. Not "the daughter of the Castiglioni family".>"'
50191: '@rWe were both in the same position.'
50192: '@rHer Castiglioni family must have been a rigid place as well.'
50193: '@r......Though we came from different countries, we had finally found something we could truly understand about each other.'
50194: 'Beatrice@r@v59/70700062."<Do you have a nickname that people close to you use?>"'
50195: 'Kinzo@r@v58/75600129."<No.@k@v58/75600130. They would just call me Kinzo.>"'
50196: 'Beatrice@r@v59/70700063."<Well then, you should stop calling me Beatrice.@k@v59/70700064. All of my close friends used to call me Bice.@k@v59/70700065. I''d like you to call me that too.>"'
50197: 'Kinzo@r@v58/75600131."<Very well.@k@v58/75600132. From this point onwards, I will call you Bice as a sign of our friendship.>"'
50198: 'Beatrice@r@v59/70700066."<Ah, come on.@k@v59/70700067. You can''t talk all stiff like that.@k@v59/70700068. We''re friends now, okay?>"'
50199: '@rA bright smile stretched across Beatrice''s face......'
50200: 'Kinzo@r@v01/71500109."No matter how many decades pass,@k@v01/71500110. ......that smile will never fade from my memory......"'
50201: 'Lion@r@v53/75300228."......So, by meeting Beatrice, you managed to regain your sense of self."'
50202: 'Will@r@v54/75400486."Or, as most people would put it, he cheated on his wife.@k@|@y@v54/75400487. .........Nggyaahh, ggrrrrkkk......"'
50203: 'Lion@r@v53/75300229."If you plan to continue being rude, I suggest you get in the habit of covering your butt."'
50204: '@rAfter having his butt pinched once more, Will hopped around in pathetic agony...'
50205: 'Lion@r@v53/75300230."So, in your eyes, Grandfather, Rokkenjima was...@k@v53/75300231.always special for being the place you first met Beatrice."'
50206: 'Kinzo@r@v01/71500111.".........Mm.@k@v01/71500112. ...If I had never come to this island, I would never have met her... It truly is an island of miracles..."'
50207: 'Will@r@v54/75400488."Is there anything left of that submarine base today?"'
50208: 'Kinzo@r@v01/71500113."Yes, it''s still there, close to Kuwadorian.@k@v01/71500114. It''s in the shadows of a cove that can''t be seen from the outside.@k@v01/71500115. After all, fishermen never approach this supposedly ill-omened island.@k@v01/71500116. It is unlikely that anyone besides me still knows of its existence."'
50209: 'Will@r@v54/75400489."Is the two-kilometer-long underground passage between Kuwadorian and the mansion a remnant of that base?"'
50210: 'Kinzo@r@v01/71500117."That is correct.@k@v01/71500118. There was some nonsense about carving a network of tunnels out of the limestone caverns...@k@v01/71500119.which would connect a number of bunkers across the island.@k@v01/71500120. I made use of those tunnels and had two mansions built, one at each end of the island."'
50211: 'Lion@r@v53/75300232."Two mansions, two families.@k@v53/75300233. ......The Ushiromiya family mansion, ......and the mansion for "Kinzo", released from the shackles of the Ushiromiya family."'
50212: 'Kinzo@r@v01/71500121."............Correct.@k@v01/71500122. ......It was something I needed.@k@v01/71500123. ......A place for me to escape from the cursed name of Ushiromiya."'
50213: 'Will@r@v54/75400490."...................................."'
50214: 'Kinzo@r@v58/75600133."<Still, I do feel bad for you.@k@v58/75600134. It must be awful to have come all the way out here and been unable to fulfill your mission.>"'
50215: 'Beatrice@r@v59/70700069."<I don''t really know what Papa''s plan was.@k@v59/70700070. He said that we needed to run far away to hide "it" until the time came.>"'
50216: 'Kinzo@r@v58/75600135."<And what is "it"?>"'
50217: 'Beatrice@r@v59/70700071."<I don''t know.@k@v59/70700072. ......''It'' was something very important,@k@v59/70700073. and he planned to hide it for many years until the right moment.@k@v59/70700074. Oh, and he planned for us to remain hidden along with it.@k@v59/70700075. I know because he apologized to me that I might be spending a very long time on foreign soil.>"'
50218: 'Kinzo@r@v58/75600136."<Didn''t Ensign Angelo say that you had no cargo in particular,@k@v58/75600137. and that you were transporting your father instead?>"'
50219: 'Beatrice@r@v59/70700076."<The ensign doesn''t trust you or the others.@k@v59/70700077. Even I know a few things he''s kept hidden from you.@k@v59/70700078. ......He might even know what Papa''s goal was...and what the cargo is.>"'
50220: 'Kinzo@r@v58/75600138."<Whatever it is, that''s a mission for the Italian military.@k@v58/75600139. It has nothing to do with us.@k@v58/75600140. In fact, given that we''re allies,@k@v58/75600141. we''d be willing to help if only they asked.>"'
50221: 'Beatrice@r@v59/70700079."<I have no doubts that you''re a good person, Kinzo.@k@v59/70700080. I''ve even told Ensign Angelo that you''re a man we can trust, but...@k@v59/70700081. ......Why is it that men always get so rigid and uptight when they''re in a strange land?>"'
50222: 'Beatrice@r@v59/70700082."<Normally, they''re all very bright and cheery people.@k@v59/70700083. Ever since we came here, there''s been this strange feeling of tension.@k@v59/70700084. ......Ensign Angelo has ordered that his subordinates be armed at all times.@k@v59/70700085. It''s almost as though we''re in enemy territory.>"'
50223: '@rThat was true.'
50224: '@rThe Italians were clearly the very opposite of relaxed.'
50225: '@rThe Japanese soldiers, watching this, began to suspect that the Italians didn''t really trust them at all.'
50226: 'Kinzo@r@v58/75600142."<That''s normal for a soldier.@k@v58/75600143. This is precisely the time for them to straighten up their guard, so they don''t embarrass themselves in front of a friendly army.>"'
50227: 'Beatrice@r@v59/70700086."<They have a person stand watch every time they sleep,@k@v59/70700087. and they''re still keeping a lookout to make sure none of you approach the submarine, even though it''s nothing more than an unusable scrap heap now.@k@v59/70700088. It almost feels as though they''re acting openly hostile towards the Japanese, and that bothers me.>"'
50228: '@rTrue, they had set up a constant sentry by the submarine and had refused to let any of the Japanese soldiers come near.'
50229: '@rThis hadn''t made the Japanese particularly happy.'
50230: '@r......However, submarines are treated as classified in all countries.'
50231: '@rMaybe it was just natural for them to stop foreigners from approaching it without reason.'
50232: 'Kinzo@r@v58/75600144."<They''re probably uncomfortable with being made to live in a way they aren''t used to.@k@v58/75600145. ......That boat which is supposed to take you back to the mainland is still being delayed by weather and problems up the command chain.@k@v58/75600146. Just how long will it take before they can send you there...>"'
50233: '@rWe had been told that a boat was being sent for them directly from the mainland,@k but apparently, thanks to the weather, problems up the command chain, and the recent air raids,@k there were no ships to spare for a forgotten island like this.'
50234: '@rThere might have been some sort of diplomatic problem.'
50235: '@r......After all, their homeland had already surrendered to the Allies.'
50236: '@r......I didn''t know the details.'
50237: '@rThe only thing I knew for sure...@kwas that they''d been stuck on Rokkenjima for two whole weeks and no one had come to get them.'
50238: '@rOf course, we had some small boats on Rokkenjima.@k@rThere was nothing physically stopping us from taking them to a nearby island.'
50239: '@rStill, Rokkenjima was technically a top-secret base, and contact with the outside world had been strictly forbidden...'
50240: 'Beatrice@r@v59/70700089."<Well, nothing we can do about it, and it isn''t all that bad, really.@k@v59/70700090. After all, if a boat did come for us, I''d probably never see you again, Kinzo.>"'
50241: 'Kinzo@r@v58/75600147."<.........True.>"'
50242: '@rTo me, those two weeks......were the first I''d ever truly lived.'
50243: '@rThe faint twenty years before all seemed to vanish in the sparkle of those two weeks.'
50244: '@r......I realized that she would have to leave this place eventually.'
50245: '@rAnd yet, this one moment felt so rich and dazzling...@w500....that I felt myself wishing it could last forever......'
50246: '@rThen, I heard a voice calling for Beatrice in Italian.'
50247: 'Kinzo@r@v58/75600148."<......It''s Ensign Angelo.@k@v58/75600149. Looks like he wants you for something.>"'
50248: 'Beatrice@r@v59/70700091."<Probably to scold me.@k@v59/70700092. These days, he keeps yapping on about how I shouldn''t get too friendly with the Japanese soldiers.>"'
50249: '@rThe ensign approached, saluting Kinzo,@k and after glancing at Beatrice as though asking her to translate something, he began to speak in Italian.'
50250: '@rJudging by his tone, it sounded like something serious.'
50251: 'Beatrice@r@v59/70700093."<......Ensign Angelo has something very important to say, so he wants to talk with your commanding officer.@k@v59/70700094. ......He seeks assistance with something.@k@v59/70700095. I don''t know what.>"'
50252: 'Kinzo@r@v58/75600150."<Something important...?@k @v58/75600151.Got it.@k@v58/75600152. I''ll go find Lieutenant Yamamoto.>"'
50253: '@rEnsign Angelo had two of his subordinates with him and wore a stern expression on his face.'
50254: '@rThey didn''t have to say anything for us to realize that this must be something very serious......'
50255: '@r@v99/HEISA7004."That''s it!!@k @v99/HEISA7005.Lift it up!!"'
50256: '@rThe winch creaked and the thick chains rang out with a dull clang.'
50257: '@rVery, very slowly, ......it was lifted up out of the submarine''s cargo hold.'
50258: '@r@v99/75700018."......Now I get it!@k@v99/75700019. ......So this is why those Italians didn''t want us near their sub...!"'
50259: '@rThe lieutenant and the others looked up at what the winch was slowly lifting up,@k ......all of them wearing unpleasant, forced smiles......'
50260: 'Beatrice@r@v59/70700096."<.........Unbelievable...@k@v59/70700097. ......So this is what Papa brought all this way...?>"'
50261: 'Kinzo@r@v58/75600153."<I-......incredible......@k@v58/75600154. ......I''ve never seen anything like this......>"'
50262: '@rIt was...a mountain of gold ingots.'
50263: '@rThose carefully piled bars were being slowly lifted out of the cargo hold, one group after another......'
50264: '@rThis gold had been their true cargo.'
50265: '@rI don''t know where they were planning to take it.'
50266: '@rThey might have been trying to sneak it into Japan, one of their allies,@k ......or they might have been on their way to hide it in some remote area.'
50267: '@rWas it some sort of strategy?@k A conspiracy? Embezzlement?@k Top-secret transportation of wealth?'
50268: '@rThis incomprehensible amount of gold led to all sorts of dark suspicions, but we didn''t know anything about the truth.'
50269: '@rAll told, the gold weighed an incredible ten tons.@k@rThat was the only truth we could wrap our minds around at the moment......'
50270: '@rThey had strongly resisted showing this to us.@k@rHowever, the submarine could no longer make sea, and it was apparently continuing to take in water bit by bit.'
50271: '@rRokkenjima had been outfitted in an extremely slipshod way, so we had no means of repairing it.'
50272: '@rAlso, while we could unload the sub, there was no way we could lift it up again once it had filled with water and sunk to the bottom.'
50273: '@rIt was clear that unless action was taken, the gold would soon become completely impossible to transport.@k ............And so, they had made the decision to unload it.'
50274: '@rOf course, they made no effort to explain the reason for all this gold.@k@rThey just asked us to help them take it out......'
50275: 'Kinzo@r@v58/75600155."<Why would they take so much gold out of the country...?@k @v58/75600156.Couldn''t they have changed the course of the war with this much wealth...?>"'
50276: 'Beatrice@r@v59/70700098."<......Weapons change the course of war,@k@v59/70700099. but after the war, they aren''t useful for anything.@k@v59/70700100. ......Money may also change the course,@k@v59/70700101. but it remains just as valuable after the war.>"'
50277: '@rThere was no longer any way to change the course of this war.@k@rThe Axis powers would probably all surrender, leading to an Allied victory.'
50278: '@rAnyone could tell this simply by looking at the American planes flying across the sky day after day.'
50279: '@rHowever, gold would still be valuable after the war was over.'
50280: '@rEveryone stared upwards,@w583. dumbfounded...@w666....as the winch slowly lifted the dully sparkling gold......'