50281: 'Kinzo@r@v58/75600157."Lieutenant Yamamoto.@k@v58/75600158. The Italians don''t want us to tell the mainland about this gold."'
50282: '@r@v99/75700020.".........Aha.@k@v99/75700021. So, they don''t want our country to take possession of it."'
50283: 'Beatrice@r@v59/70700102."<What did he say?>"'
50284: 'Kinzo@r@v58/75600159."<He''s saying your group probably doesn''t want it reported because you fear that Japan will take possession of the gold.>"'
50285: 'Beatrice@r@v59/70700103."<Ensign Angelo is actually more afraid of Italy itself finding out.@k@v59/70700104. To us, our homeland''s current government is a mere puppet set up by the Allied Forces.@k@v59/70700105. If they find out, the gold will be returned to them.@k@v59/70700106. However, that would be the same as handing the gold over to our enemies.>"'
50286: '@rThey had come all this way to make sure that the gold didn''t fall into enemy hands.'
50287: '@rThey needed to hide this gold from the puppet government...@k...until their homeland could be truly restored...'
50288: '@r@v99/75700022."Ushiromiya.@k@v99/75700023. Make a proposal to the Italians.@k@v99/75700024. Tell them that we wish to offer our assistance."'
50289: 'Kinzo@r@v58/75600160."What sort of assistance...?"'
50290: '@r@v99/75700025."I understand what the Italians are trying to say.@k @v99/75700026.They want that gold to be hidden so that their homeland doesn''t find out about it.@k@v99/75700027. However, they would need to obtain at least a transport ship if they plan to take it from this island.@k@v99/75700028. If they tried that, however, the mainland would hear about it, which means that the Italian government would too."'
50291: 'Kinzo@r@v58/75600161."That''s right.@k@v58/75600162. ......In other words, there''s no longer any way to take that gold off Rokkenjima."'
50292: '@rTheir mission must have been to hide that gold in absolute secrecy until the day of their homeland''s restoration.'
50293: '@rLater on, several plausible rumors would circulate...@kabout how Germany also moved much of its secret wealth to certain hidden areas in South America just prior to its surrender.@k It was a very natural conclusion to reach.'
50294: '@rThat submarine was their only method of transporting the gold in secrecy, and it''s become completely useless.@k They can''t fully stop the water from seeping in, and it''ll probably sink completely before much longer.'
50295: '@rThere''s no longer any way for them to transport the gold in secrecy.'
50296: '@rIn other words, their mission has ended in failure here in the Far East.'
50297: '@rSo, just how is Lieutenant Yamamoto proposing that we assist them......?'
50298: '@r@v99/75700029."The Rokkenjima base is top-secret, and no one knows about it.@k@v99/75700030. The islanders in the surrounding area believe this island to be ill-omened and deserted, so they never come near it.@k@v99/75700031. ......Do you get my meaning, Ushiromiya?"'
50299: 'Beatrice@r@v59/70700102."<What did he say?>"'
50300: 'Kinzo@r@v58/75600163."<As we told you earlier, no one knows about this base.@k@v58/75600164. And, as you can see, it''s of no use strategically, so the higher-ups have already forgotten about it.@k@v58/75600165. ......Sounds like Lieutenant Yamamoto''s suggesting that you hide the gold on this island.>"'
50301: '@rBeatrice quickly translated this and told Ensign Angelo.'
50302: '@rThe ensign began discussing rapidly with his subordinates.'
50303: '@rThey didn''t look happy.'
50304: '@rJapan may have been their ally, but they probably didn''t want the gold for reconstructing their motherland to be entrusted to Asians.'
50305: '@rStill, it''s hard to imagine any other option for them.'
50306: 'Beatrice@r@v59/70700108."<......It''s a fierce debate.@k@v59/70700109. Some say that there''s no other option, while others think we should remain loyal to our homeland no matter the cost.@k@v59/70700110. ......Ensign Angelo is stuck between a rock and a hard place.>"'
50307: '@rHiding this gold was the final order given to them by their fallen homeland.@k@rHowever, by now, there was no way for that order to be carried out successfully.'
50308: '@rIf the mainland or their own homeland found out, the gold would probably be confiscated by the wrong people, from their point of view.'
50309: '@rIf they really wanted to carry out their homeland''s orders faithfully,@k .........Lieutenant Yamamoto''s proposal was extremely reasonable...'
50310: '@rThough the lieutenant couldn''t understand their words, it seemed he realized how divided they were.'
50311: '@r@v99/75700032."Heheheh, if we help out, we''ll be able to hide the gold in the utmost secrecy.@k@v99/75700033. Fortunately, there''s an abandoned tunnel that stretches all the way across this island."'
50312: 'Kinzo@r@v58/75600166."<......He''s saying that, if you hide the gold underground and bury it on this island, no one will be able to find it.>"'
50313: 'Beatrice@r@v59/70700111."<Our side is saying that it sounds like a realistic proposal.@k@|@y@v59/70700112. ......However, there seems to be some resistance against accepting Japanese assistance.>"'
50314: 'Kinzo@r@v58/75600167."......It seems they''re having difficulty coming to a decision."'
50315: '@r@v99/75700034."Heheh.@k@v99/75700035. Do you really have a choice, Italians?@k@v99/75700036. You don''t think you can hide that gold without our help, do you?@k @v99/75700037.And I doubt you want to leave it lying around on the beach for much longer."'
50316: 'Beatrice@r@v59/70700113."<Ensign Angelo wants to minimize the number of people who know about the gold.@k@v59/70700114. ......He doesn''t trust the Japanese, but it looks like he''s decided that Lieutenant Yamamoto''s plan is the best possible option.@k@|@y@v59/70700115. But...he seems suspicious.>"'
50317: 'Kinzo@r@v58/75600168."<About what?>"'
50318: 'Beatrice@r@v59/70700116."<He''s wondering whether they really intend to move a full ten tons of gold and swear themselves to secrecy...without any sort of compensation......>"'
50319: '@r@v99/75700038."Fifty-fifty."'
50320: 'Kinzo@r@v58/75600169."......Sir, you can''t be—"'
50321: '@r@v99/75700039."Hand over half of the gold to us.@k@v99/75700040. With that as our work wages, we''ll hide the other half nice and safe for them."'
50322: 'Kinzo@r@v58/75600170."<......H-he''s telling you to give us half of it.>"'
50323: '@rThe instant Beatrice translated that sentence, Ensign Angelo slammed his hands on the desk and stood up.'
50324: '@rInstead of flinching, Lieutenant Yamamoto, true to his boasts of once being a thug that everyone feared,@k actually looked even more relaxed and confident than he had previously.'
50325: '@r@v99/75700041."After all, they really don''t have the option of refusing.@k@v99/75700042. I could demand eighty percent if I wanted.@k@v99/75700043. I''ve lowered that to an even split as a sign of good faith."'
50326: '@r@v99/75700044."......Of course, we aren''t the only ones with leverage here.@k@v99/75700045. If the Italians decide to leak this to the outside, all of the gold will probably be taken by Japan or Italy.@k@v99/75700046. We won''t get even a single yen out of it.@k@v99/75700047. This can only work if we''re both partners in crime here."'
50327: 'Kinzo@r@v58/75600171."<He''s saying we should all be partners in the crime of embezzlement.@k@v58/75600172. ......By now, he''s already moved on to speaking as an individual, not as a soldier...>"'
50328: 'Beatrice@r@v59/70700117."<Insane......@k@v59/70700118. So, he''s been blinded by greed...>"'
50329: '@rLieutenant Yamamoto was grinning.'
50330: '@rIt really did look as though he had been blinded by greed, just as Beatrice said...'
50331: '@r@v99/75700048."If they leave it just piled up where it is, you can be sure that it''ll be noticed when the boat comes for them from the mainland.@k@v99/75700049. If that happens, none of us will profit.@k@v99/75700050. They ought to accept our proposal and hide the gold as soon as possible."'
50332: 'Beatrice@r@v59/70700119."<......It sounds like Ensign Angelo is dead set on the Japanese and Italian governments not finding out about this.@k@v59/70700120. He wants to carry out his duty until the end.>"'
50333: 'Kinzo@r@v58/75600173."<So, what exactly does that mean?>"'
50334: 'Beatrice@r@v59/70700121."<He wants the gold buried deep within the island, even if he has to pay some percentage to buy your silence.@k@v59/70700122. ......Of course, some of his subordinates object strongly.@k@v59/70700123. They''re saying that fifty percent is out of the question.>"'
50335: '@r@v99/75700051."Ushiromiya.@k@v99/75700052. How is it going over?"'
50336: 'Kinzo@r@v58/75600174.".........They also don''t want any more people laying eyes on the gold.@k@v58/75600175. ......However, they seem to object to the portions."'
50337: 'Beatrice@r@v59/70700124."<Ensign Angelo says that they''ll consider 10%.@k@v59/70700125. ......Though he''s also saying that he''s fairly sure Lieutenant Yamamoto won''t accept that.>"'
50338: '@r@v99/75700053."Ushiromiya.@k@v99/75700054. What is the Italians'' answer?"'
50339: 'Kinzo@r@v58/75600176."......They''ll consider handing over ten percent."'
50340: '@rThis time, it was Lieutenant Yamamoto who slammed down on the desk.@|@y'
50341: '@rBut the Italians didn''t flinch either.'
50342: '@r......An incredible tension filled the small room...'
50343: '@rHowever, despite his violent outburst a second ago, Lieutenant Yamamoto''s expression still looked smug and in control.'
50344: '@rHe was probably confident that he now had the initiative.'
50345: '@r@v99/75700055."Ten percent!@k @v99/75700056.Now there''s a modest proposal.@k@v99/75700057. ......Very well, I''ll give up ten percent.@k@v99/75700058. Forty-sixty.@k@v99/75700059. Tell them I won''t go any further than that!"'
50346: '@rForty percent for the Japanese.@k Sixty for the Italians.'
50347: '@rThe lieutenant made it sound like he was willing to stand firm on that, but in truth, these negotiations were not being made on an equal footing.'
50348: '@rIf the Italians just wanted the gold for themselves, there wouldn''t be much of a problem.'
50349: '@rBut what if...@kwhat if they really were true patriots, ......and decided that they ought to return the gold,@k even to the defeated puppet government of their homeland, for the purpose of reconstruction?'
50350: '@rIf so, they would probably report the existence of the gold to the Italian embassy.'
50351: '@rEventually, the Italian government would petition the Allied nations for the retrieval of their gold.'
50352: '@r......It probably wouldn''t all make it back to Italy, but it might be used effectively to repair and rebuild the battered towns.'
50353: '@rIf that happened, Lieutenant Yamamoto and his friends would only be able to sneak out a few ingots at most.'
50354: '@rHe was greedily planning to make this his own treasure island, so that he and his subordinates could have an enormous fortune all to themselves.'
50355: '@r......If he wanted those ambitions to bear out, the Italians would have to conceal the presence of the gold.'
50356: 'Kinzo@r@v58/75600177."<But there''s one thing I don''t get.@k@v58/75600178. .........If Ensign Angelo doesn''t want to let anyone have the gold, he could have just let the submarine sink.@k@v58/75600179. Why did he have it unloaded?>"'
50357: 'Beatrice@r@v59/70700126."<......I''d rather not think about it,@k@v59/70700127. ......but Ensign Angelo might have started planning to embezzle the gold as soon as he found out that their mission would be impossible to complete.@k@v59/70700128. Right now, he''s asking his subordinates for their opinions both as soldiers...@k@v59/70700129.and as individuals with families waiting for them back home.@k@v59/70700130. ......The more straight-laced soldiers are furious.>"'
50358: '@rThe discussion between the Italians was becoming fierce and emotional.'
50359: '@rThough their homeland had fallen, they had come all this way in accordance with its orders.'
50360: '@rThey had probably been given this mission because they were particularly faithful and duty-minded troops.'
50361: '@rIt seemed they couldn''t just agree to a foreigner''s proposal to embezzle and split up the gold......'
50362: '@rEnsign Angelo looked like he was doing all he could to calm the unexpectedly fervent rage of his subordinates.'
50363: '@r......Looks like the gold is blinding them too.'
50364: '@rIt seems no one can sort out their own personal feelings and the way they want to be perceived......'
50365: '@r@v99/75700060."How''s their answer coming?!@k @v99/75700061.Ushiromiya!!"'
50366: 'Kinzo@r@v58/75600180."<......Bice.@k@v58/75600181. Lieutenant Yamamoto''s asking for an answer.>"'
50367: 'Beatrice@r@v59/70700131."<.........They''re saying they want some time to think.@k@v59/70700132. I had you to talk to, so I could let off some tension, but that wasn''t true for the rest of them.>"'
50368: 'Beatrice@r@v59/70700133."<......They lost a lot of comrades at the end of a very long journey, and now they''re here in a tight spot.@k@v59/70700134. They''ve even lost their mission, the one thing they could depend upon to guide them.@k@v59/70700135. They don''t know what to do...>"'
50369: 'Kinzo@r@v58/75600182."Sir.@k@v58/75600183. ......They say they''d like some time."'
50370: '@r@v99/75700062."Heheh, sure, let ''em talk it over all they want.@k@v99/75700063. But there isn''t much time.@k@v99/75700064. If we''re going to hide it, that''ll take time and effort.@k@v99/75700065. ......Make your decision before noon tomorrow.@k@v99/75700066. That''s all, Italians!"'
50371: 'Kinzo@r@v58/75600184."<......He''s giving you until noon tomorrow.@k@v58/75600185. ......That bastard, it''s like he''s trying to threaten you.>"'
50372: 'Beatrice@r@v59/70700136."<Ensign Angelo is saying he''ll ask everyone''s opinions...>"'
50373: 'Kinzo@r@v58/75600186."<How does it look?>"'
50374: 'Beatrice@r@v59/70700137."<It''ll probably be tough going.@k@v59/70700138. ......It seems the ensign is willing to consider splitting it,@k@v59/70700139. but his subordinates and the others will probably oppose that.@k@v59/70700140. ......All of them have lost close friends on their voyage to the Far East.@k@v59/70700141. They''re firm in their desire to do their duty for our homeland.>"'
50375: 'Kinzo@r@v58/75600187."<......Will they refuse the lieutenant''s proposal?>"'
50376: 'Beatrice@r@v59/70700142."<Even if they do, the gold will just fall into someone else''s hands.@k@v59/70700143. ......If nothing is going to be left anyway, Ensign Angelo suggests that they each sneak at least one ingot back with them, and some of the others seem to agree, but......@k@|@y@v59/70700144. Men always get carried away at times like this.@k@v59/70700145. Even I can''t guess what they''ll do...>"'
50377: 'Lion@r@v53/75300234."......I imagine the Italians had some complicated feelings about all this."'
50378: 'Will@r@v54/75400491."In their eyes, Italy after the surrender was probably like an enemy country.@k@v54/75400492. Letting the gold go back to that Italy would erase the meaning of their entire voyage."'
50379: 'Lion@r@v53/75300235."However,@k@v53/75300236. embezzling and splitting the gold would also erase the meaning of their journey..."'
50380: 'Will@r@v54/75400493."The country they felt obligated to serve had already fallen.@k@v54/75400494. That alone destroyed the significance of their journey.@k@v54/75400495. Not a happy story for them."'
50381: 'Lion@r@v53/75300237."......If it''s bound to be meaningless anyway,@k@v53/75300238. wouldn''t keeping hold of even just a few ingots be better than nothing?"'
50382: 'Will@r@v54/75400496."Sure, if you want to calculate straight-up profit and loss.@k@v54/75400497. ............But men aren''t like that."'
50383: '@rThe Italians were gathered in a cramped room, arguing fiercely.'
50384: '@r@v99/ITHEA7001."I don''t like it!@k @v99/ITHEA7002.We must remain true to our soldier spirit until the end, for the sake of our fallen comrades!"'
50385: '@r@v99/75800003."And how do you define "remaining true"?@k@v99/75800004. By hiding the gold on this island?@k@v99/75800005. By accepting the proposal of those Asians?!"'
50386: '@r@v99/ITHEA7003."We can''t trust them!@k @v99/ITHEA7004.Especially that Yamamoto person!@k @v99/ITHEA7005.We must not let our guards down!"'
50387: '@r@v99/ITHEB7001."Unloading the gold and letting the Japanese see it was a huge mistake!@k @v99/ITHEB7002.We should have let it sink with the sub!"'
50388: '@r@v99/75800006."Oh, wonderful idea, let''s just sink it right inside a Japanese base!@k @v99/75800007.It would have been pulled up eventually.@k@v99/75800008. That wouldn''t hide anything!"'
50389: '@r@v99/75800009."There''s no way to get the gold off this island without anyone knowing in any case."'
50390: '@r@v99/ITHEB7003."If we had just taken the honorable path and scuttled the sub, none of this would have happened...!!"'
50391: '@r@v99/ITHEA7006."If we had known back then that the sub was already broken beyond repair......"'
50392: '@r@v99/ITHEA7007."Why did you ask the Japanese military for help, Ensign?@k @v99/ITHEA7008.How were you planning to carry out the mission if they found out about the gold?"'
50393: '@r@v99/75800010."Our mission was a failure from the moment you asked them for help!"'
50394: '@r@v99/75800011."All of us have families waiting for us back home.@k@v99/75800012. And we''ve more than done our part, I''d say, voyaging all the way to this island country in the Far East.@k@v99/75800013. You could call this a fair and just payment for our services."'
50395: '@r@v00/awase7001."*chatter*chatter*!@k @v00/awase7002.*chatter*chatter*chatter*!!"'
50396: '@r@v99/ITAG7003."Ensign Angelo.@k@v99/ITAG7004. ......If the Japanese prove to be less than amicable, we need to be prepared to take extreme measures."'
50397: '@r@v99/75800014."......And what do you mean by extreme measures, Corporal?"'
50398: '@rSomeone gulped.'
50399: '@rA stiff tension hung over the room...'
50400: '@r@v99/ITAG7005."The Japanese here are pushovers.@k@v99/ITAG7006. They''re all cowards with no battle experience."'
50401: '@r@v99/ITAG7007."And we are elites.@k@v99/ITAG7008. We know the layout of almost the entire base, along with the number of Japanese troops and how they are arranged.@k@v99/ITAG7009. If Ensign Angelo gives the order, we should be able to subdue them quickly."'
50402: '@r@v99/ITAG7010."Only a few of them, Yamamoto included, look like fighters.@k@v99/ITAG7011. The rest are just laborers attached to the military.@k@v99/ITAG7012. It may look like they have the advantage of numbers, but we have the greater military force."'
50403: '@r@v99/75800015."If we kill the Japanese, how are we going to explain it when the boat comes for us?@k @v99/75800016.You really think that''ll work?!"'
50404: '@r@v99/ITAG7013."There should be plenty of ways, as long as the corpses aren''t found."'
50405: '@r@v99/ITAG7014."Ensign Angelo.@k@v99/ITAG7015. ......It will be easy to subdue this base.@k@v99/ITAG7016. If we kill Yamamoto and the few strong fighters, the laborers will probably surrender easily."'
50406: '@r@v99/ITAG7017."Let''s have them carry the gold and bury it.@k@v99/ITAG7018. ......Of course, we''ll have to silence them afterwards."'
50407: '@r@v99/75800017."Are you suggesting we massacre all of them......?"'
50408: '@r@v99/ITAG7019."Let''s do it.@k@v99/ITAG7020. If we kill them all, no one will have to know about the gold."'
50409: '@rAt that moment, the door, which had supposedly been locked, opened slightly, and a metal object was thrown in.'
50410: '@r@v99/ITHEA7011.@z120."Granata!!!"'
50411: '@rAs the yell rang out, the table was kicked over to be used as a shield, and they all dropped to the floor.'
50412: '@rHowever, in this cramped room, it probably wouldn''t do them any good.@k The Italians were all prepared for death.'
50413: '@r@v99/ITHEA7012."...............?"'
50414: '@r@v99/ITHEB7006."A dud! It''s a dud!!"'
50415: '@rFortunately, the shoddy grenade was a dud.'
50416: '@rThe door was slammed open, and three Japanese soldiers wielding pistols jumped in.'
50417: '@r@v99/HEISA7006."Dammit, it''s a dud!!@k @v99/HEISA7007.Kill the Italians, kill the Italians!!"'
50418: '@r@v99/ITAG7021."Return fire!! Fire at will!!"'
50419: '@rIn this small room, no matter who shot where, it was bound to hit someone.'
50420: '@rThe exchange of bullets instantly caused a rain of blood, with casualties on both sides.'
50421: '@rThe three who had jumped in were covered with bullet holes and fell over, moaning and thrashing...'
50422: '@r@v99/GEAN7003."Gggghgggghghgh...@v99/GEAN7004.gghh...@v99/GEAN7005..........!@v99/GEAN7006. *cough*...@v99/GEAN7007.*cough*......"'
50423: '@r@v99/ITHEA7013."Gino!! Gino!!@k @v99/ITHEA7014.Damn, they got his lung, we can''t save him!!"'
50424: '@r@v99/ITHEB7007."We should consider ourselves lucky!@k @v99/ITHEB7008.If that grenade had gone off, we''d all be dead!"'
50425: '@rThe grenade was still rolling about on the floor...'
50426: '@rIt had been a surprise attack.@k ......Lieutenant Yamamoto had probably judged that the negotiations would not go his way and had decided to make the first move.'
50427: '@rOr else, maybe he had been planning from the beginning to put them in the position of having to take a vote...@kin order to gather them all in one place.'
50428: '@rRokkenjima belonged to the Japanese.@k If they killed all of the Italians, then not half, but all of the gold would go to them.'
50429: '@rThere was still a chance the grenade might go off late.@k@rThe Italians rushed out into the corridor.'
50430: '@rThey heard gunfire from down the hallway.@k It was coming from the direction of the submarine dock.@k Clearly, the troops guarding the pile of gold were being attacked.'
50431: '@r@v99/ITAG7022."Ensign Angelo!! What are your orders?!!"'
50432: '@r@v99/75800018."We have no choice!!@k @v99/75800019.Kill the Japanese!!"'
50433: '@r@v99/HEISB7004."L-Lieutenant!@k @v99/HEISB7005.These guys are good.@k @v99/HEISB7006.Those Italians aren''t your ordinary sailors!"'
50434: '@r@v99/75700067."Heheh, I see, they needed men good enough to guard that gold.@k@v99/75700068. We have the numbers.@k@v99/75700069. Keep your cool, surround them, and kill them!! Let''s hunt some Italians!!"'
50435: '@rAs soon as I heard the sound of repeated gunfire, I knew.'
50436: '@rI knew that whatever it was that had been smoldering since the time the gold was unloaded......had finally burst into flame.'
50437: '@rThe eyes of our soldiers when looking at the gold had not been normal.@k Yes, those eyes had been entranced by demons.'
50438: '@rThe Italians had also been at breaking point due to the heavy burden they bore.'
50439: '@rWho wouldn''t have snapped after becoming trapped in a distant land where you can''t understand the language or the writing?'
50440: '@rThinking I had to do something, I ran towards the sound of gunfire.'
50441: '@r......Looking back on it, that was an extremely foolish thing to do.'
50442: '@rThat sound meant that there were people shooting at each other.@k People killing each other.'
50443: '@rAnd yet, unarmed as I was, I dashed towards the sound, as though I was trying to mediate some schoolyard fight.@k ......It didn''t take long before I learned how foolish and naive such a thing was in the heat of battle.'
50444: 'Kinzo@r@v58/75600188."......H-Hiraoka?!"'
50445: '@rWarrant Officer Hiraoka was lying face down, his entire body drenched in blood.'
50446: '@rJudging by the trail of blood behind him, it was clear that he had somehow managed to crawl here from a different room before dying.'
50447: '@rNo, he was still twitching.@k He might not be dead yet.'
50448: '@r......But, on this island without a doctor—@w333.no, even if we had a doctor...@w416.how could anyone possibly...@w500....save a man who had been shot this many times in the chest...'
50449: '@rWhen I looked into the room he must have crawled out of,@k I saw two more blood-stained Japanese corpses.'
50450: 'Kinzo@r@v58/75600189."Ah, aaah......aaaah......@k@v58/75600190. Th-......they''re d......"'
50451: '@rI fell backwards pathetically on my butt, my mouth hanging open in shock......'
50452: '@r......Come to think of it, that was the first time I had ever faced death in my life.'
50453: '@rThe entire world was at war.@k Even though millions were dying both East and West,@k ......this was the first time I met with a person''s death directly.'
50454: '@rRidiculous.@k ......Didn''t I join the army hoping to die?'
50455: '@rDidn''t I whine about not being sent to the front lines?'
50456: '@rYeah, so rejoice, Kinzo.@k Isn''t this the death you were looking for...?!'
50457: '@rWhy not spread your hands and yell out loud?@k "Come for me, magnificent death!!"'
50458: '@rSomeone came running towards me.@k It was a colleague of mine, a Japanese man. Tajima-kun.'
50459: '@r@v99/TAJIM7001."R-ru—ru—r—...!!"'
50460: '@rHe dashed towards me, pale-faced and out of breath.'
50461: '@rHis face seemed horribly contorted with terror.@k Mine probably looked the same.'
50462: 'Kinzo@r@v58/75600191."Tajima-kun... Wh-what happened......?"'
50463: '@r@v99/TAJIM7002."R-run away...@k@v99/TAJIM7003. W-we''ll...we''ll all be killed!!"'
50464: '@rSomeone yelled in Italian, and at the same time, Tajima-kun let out a scream...'
50465: '@rThen, he grabbed onto me as he fell to the floor.'
50466: '@rA red stain was spreading across his back before my eyes...'
50467: 'Kinzo@r@v58/75600192."Tajima-ku...n......"'
50468: '@r@v99/TAJIM7004."R-@v99/TAJIM7005.......run...@v99/TAJIM7006.......@v99/TAJIM7007.*cough*...@v99/TAJIM7008......."'
50469: '@rAs he spat bubbles of blood, .........he said that one word......and died.'
50470: '@rBut the shocking event of seeing someone die right in front of me did not capture my attention.'
50471: '@r......No living thing is concerned with the deaths of others at a fundamental level.@k The one thing that matters is whether they themselves die or not.'
50472: '@rMy attention was fully occupied by the barrel of the gun the Italian soldier was pointing......'
50473: '@rTajima-kun''s back burst once more as he leaned against me.@k Flesh tore, blood splattered.@k The warm splash of it covered my face.'
50474: '@rWas the Italian still trying to finish him off, even though he had stopped moving for good?'
50475: '@rHow foolish I''ve been......@k Can I still not understand the scene in front of me?!'
50476: '@rRejoice, Kinzo!!@k Now you''ll finally get what you''ve wanted all this time...!!'
50477: '@rThe Italian hadn''t fired to finish off Tajima-kun.@k He had been aiming at the man Tajima-kun had fallen on: me, Ushiromiya Kinzo.'
50478: 'Kinzo@r@v58/75600193."Uu......uuu....uwaah......!!!"'
50479: '@rI pushed his corpse aside, scrabbled against the floor, and dashed away, tumbling over myself.'
50480: '@rMy hands had pushed off against the floor hard enough to tear off the ring finger fingernail on my left hand.@k@rWhen faced with death, humans truly can resist with all they''ve got.'
50481: '@rI tumbled over and over as I ran, scraping up parts of my body.@k It was painful, hot.@k But that didn''t matter at all!'
50482: '@rI heard the yelling in Italian come from behind me over and over again.@k It felt like they were running, chasing after me.'
50483: '@rI didn''t want to look back.@k So I kept on running and running, as though the Italians were right behind me.'
50484: '@rThis......is death......!!@k@rDidn''t you want to die?'
50485: '@rNo, I don''t want to die!!'
50486: '@rWhy?@k Didn''t I want to die so badly?@k@rBut now, I know.@k@rI know how wonderful it is to be alive.'
50487: '@rShe taught me.@k Bice did.'
50488: '@rI can only be free when I talk with her.@k No!@k@rBy talking with her, I was finally alive for the first time.@k I was finally born!!'
50489: '@rI want to live.@k I want to live, I want to live, I want to live!!@k I don''t want to die!'
50490: '@rI want to live and see her, right now!!@k If I don''t see her, I''ll die! I''ll be killed!!'
50491: '@r.........Stay cool, Kinzo.@k ......She might be killed too...!'
50492: '@rIf you live and she dies, you might as well be dead......!!'
50493: '@rBefore I knew it, my face was covered in tears, snot, and drool.'
50494: '@rWhen I stumbled over something and fell, I was finally able to come to my senses a little.'
50495: 'Kinzo@r@v58/75600194."..................Haah......haah...@k@v58/75600195. .................."'
50496: '@rI could still hear intermittent gunfire.'
50497: '@rThe gunfight was still going on.@k And it had spread throughout the entire base.'
50498: '@r......Bice.@k ......Are you...okay......?'
50499: '@rI''ll find her and take her to a safe place.@k ......The lieutenant will probably kill all of the Italians to steal the gold.@k Bice probably won''t be an exception.'
50500: 'Kinzo@r@v58/75600196."Bice......@k@v58/75600197. .........Bice...!"'
50501: '@rMeeting you was the first time I ever lived,@k the first time I was ever born.@k So if you die, I''ll die again.'
50502: '@rI could feel every cell in my body being reborn, not as Ushiromiya Kinzo, ......but as a completely different Kinzo.'
50503: '@r......Of course, I was terrified that I might really be shot if I went back.'
50504: '@rBut I no longer wanted to die,@k in the truest possible sense.@k So, I was able to overcome my fear.'
50505: 'Kinzo@r@v58/75600198."......Biiiiceeeeeeee!!"'
50506: 'Beatrice@r@v59/70700146."Rubens!@k @v59/70700147.What on Earth is going on?!@k @v59/70700148.What is all this?!"'
50507: '@r@v99/75900003."There''s no need for you to know.@k@v99/75900004. Just stay hidden there.@k@v99/75900005. Don''t come out until one of your fellow countrymen calls for you!"'
50508: '@r@v99/HEISB7007."I heard an Italian voice!!@k @v99/HEISB7008.He''s over there!!"'
50509: '@r@v99/75900006."Goddamn Asians!!"'
50510: '@rRubens stood with Beatrice behind his back and neatly shot the two men rushing at him with two 9mm bullets from his Beretta M1934.'
50511: '@rHowever, one of the 8mm bullets from their Type 94 semi-auto pistols went straight into Rubens''s chest.'
50512: '@rAll three of the shooters were struck in the chest and fell down in a heap.'
50513: 'Beatrice@r@v59/70700149."N-no!!@k @v59/70700150.Rubens!!"'
50514: '@r@v99/75900007."......Go up to the surface...@k@v99/75900008. Hide in the forest......@v99/75900009.......*cough*cough*!!@k @|@yGgh....."'
50515: 'Beatrice@r@v59/70700152."Rubens!!!"'
50516: '@r@v99/75700070."......Heheheh. My, my.@k@v99/75700071. Aren''t we chatty?"'
50517: '@rThe next person to appear......was the commanding officer of the Japanese soldiers, Yamamoto.'
50518: '@rThe blast of three guns had just sounded.'
50519: '@rAdding on Beatrice''s screams, it was hardly surprising that he had noticed the encounter.'
50520: '@r@v99/75700072."If it had to come to this anyway, we should''ve taken this woman as a hostage in the first place.@k@v99/75700073. Damn annoying, that''s what they are!"@|@y'
50521: '@rYamamoto spat.@k Beatrice used that moment to snatch up Rubens''s gun.'
50522: 'Beatrice@r@v59/70700153."Aahh......!!!"'
50523: '@r@v99/75700074."Oh, picking up a gun without hesitation!@k @v99/75700075.Italian women sure are scary!@k @v99/75700076.Dammit, you both managed to screw up...!!"'
50524: '@rHe spat this last part at the two dying men who lay moaning at his feet.'
50525: '@rHowever, it wasn''t particularly surprising.@k And this wasn''t the only place it was happening.'
50526: '@rNearly everyone met head on in these tiny, cramped tunnels.@k When both sides shot recklessly in a situation like that, the result was two corpses.'
50527: '@rSo the way to be fastest was to pull the trigger immediately the moment you sensed another person.@k That was the only way to make it through this battle without ending up with a bullet in your chest.'
50528: '@rBecause of this, both Japanese and Italians killed each other without hesitation, and they sometimes even pulled the trigger on their own countrymen when they unexpectedly ran into each other.'
50529: '@rAnd in the midst of all this, large numbers of Japanese men who had no idea what was going on ran towards the noise and became victims one after another.'
50530: '@rIt didn''t matter whether the other person was holding a gun or not.'
50531: '@rEveryone reflexively pulled the trigger at the sight of anyone other than themselves, trying to stay alive.'
50532: '@rThe slaughter engulfed the entire base......'
50533: '@rThere was a fierce gun battle taking place in the submarine dock.@k And a massacre resembling a hunt was taking place inside the base.'
50534: '@rMost of the non-combatants assigned to this base were killed before they knew what was going on.'
50535: '@rThe Italians were indeed quite seasoned troops, but their numbers began to drop bit by bit.'
50536: '@rBlood-stained corpses lay scattered all across the base......'
50537: '@rAt first, it had probably been a proper gunfight.'
50538: '@rHowever, as they gradually became desensitized,@k it devolved into that most basic cause of wars throughout humanity, the desire to kill all foreigners you don''t understand...'
50539: '@rWhenever they heard words they didn''t understand, they pulled the trigger.@k By that point, the screams of foreigners sounded no different from those of man-shaped beasts.@k@|@y After all, they couldn''t understand pleading in another language.'
50540: '@rSo, it had long ago turned into a mere massacre......'
50541: '@rAs the number of dead surpassed the number of living, ......silence began to return to the base.'
50542: '@rJust when it felt as though everyone had died and the desolate sound of the wind blew through the caves,@k there would be a sudden scream, the crisp sound of a gun, and one would remember that the massacre still wasn''t over.'
50543: '@rThis happened...over and over again...@w666.......until eventually, true silence fell.'
50544: '@r......It marked the pitiful end for those led astray by gold.'
50545: '@rThe leader of the Italian soldiers, Angelo, had managed to survive somehow.'
50546: '@rHe encountered......nothing but the corpses of friend and foe.'
50547: '@rAll was quiet once more in the base.'
50548: '@rIf he was careless enough to call out, he might be shot from the shadows somewhere.'
50549: '@r......So, he snuck about like a panther, breathing quietly and searching for the remaining enemies...'
50550: '@rThere was no sign or trace of any living person.'
50551: '@r......Maybe all of the people in this base had died.'
50552: '@r@v99/75800020."......Damn Japanese......"'
50553: '@rThe Japanese struck first, but at that time, we were also talking about killing them.'
50554: '@rThey simply made the first move as military men.@k@rSo, perhaps I should be grateful for today.'
50555: '@rEven if the boat had come to take us away, there would have been no honor for us.'
50556: '@rWe would have been mere failures in our mission, unfit to face our dead comrades.'
50557: '@rPerhaps dying here in the Far East alongside my gun......is a more fitting end for a soldier.'
50558: '@rFrom around the corner, I noticed the sound of a leg being dragged along the ground, and I strained to hear.'
50559: '@r.........Is someone seriously wounded and shuffling with a limp?@k Noticing them before they notice me greatly helps my chances.'
50560: '@rAt this stage, there''s no point in taking prisoners.@k@rWe must dispose of all the Japanese.'
50561: '@rI''ll dash around the corner, quickly check to see who they are, ......and shoot if it''s a Japanese person.@k Nothing more.'
50562: '@rI''ve been hiding my footsteps the whole time.@k They probably don''t know I''m here.'
50563: '@rOnce the shuffling footsteps had come close enough, Angelo leaned around the corner and raised his gun.'
50564: '@rThe voice that reached him...spoke Italian.'
50565: 'Beatrice@r@v59/70700154."R-run......"'
50566: '@r@v99/75800021."......?!@k @v99/75800022.Y-you......!!"'
50567: '@r@v99/75700077."Heheheh, I''ve been looking for you, Ensign Angelo...@k@v99/75700078. That makes all of you.@k@v99/75700079. I''ve been counting Italian corpses, you see...!!"'
50568: 'Beatrice@r@v59/70700155."No, don''t die!!@k @v59/70700156.Ensign Angelo!"'
50569: '@rBlood poured from Angelo''s chest,@w666. ......his gun fell to the floor,@|@y@w1000. then his knees,@|@y and then the rest of his body crumpled...@w416....and stopped moving.'
50570: '@rYamamoto''s accuracy with a gun wasn''t particularly stellar.'
50571: '@rHowever, Angelo had waited until they were fairly close before jumping out, so Yamamoto had been able to hit his target.'
50572: '@rAnd he had managed it with a short-barreled handgun in one hand......and a woman as a hostage in the other.'
50573: '@r@v99/75700080."Really, though, our Rokkenjima garrison was pathetic!@k @v99/75700081.Am I the only one who''s not dead?!@k @v99/75700082.Trash, all of them!"'
50574: 'Beatrice@r@v59/70700157."Can''t you fight without using a woman as a shield, you brute?!!@k @v59/70700158.Let go!"'
50575: '@r@v99/75700083."Quiet!@k @v99/75700084.Noisy, these Italian girls.@k@v99/75700085. If you''d just be cooperative, I''d at least spare your life. Heheheh!"'
50576: '@rIt was such an obvious lie that even he wore a bitter smile.'
50577: '@r"The Italians were spies working for the enemy, and they all died along with the garrison in a gunfight".'
50578: '@rThat was the story Yamamoto wanted to tell, and so he couldn''t afford to have any Italian survivors.'
50579: '@rAt this point, he wouldn''t be able to keep the entire pile of gold,@k but he could at least grab as many ingots as he could carry.@k Even that would be worth a huge amount of money.'
50580: '@rBeatrice suddenly swung her head,@k smashing Yamamoto''s nose hard.'
50581: 'Beatrice@r@v59/70700159."Someone, help! Someoooooone!!!@k @v59/70700160.......Aaah!!"@|@y'
50582: '@r@v99/75700086."Y-......you...bitch......@k@v99/75700087. Ngaaah......"'
50583: '@rShe almost managed to escape.@k However, Yamamoto quickly grabbed her leg and tripped her.'
50584: '@rShe fell onto her back, and Yamamoto mercilessly stomped his foot down on her stomach and pointed his gun at her.'
50585: '@r@v99/75700088."Heheheh, I don''t make a hobby of taming tomboys...!@k @v99/75700089.Die!!"'
50586: 'Kinzo@r@v58/75600199."Lieutenant Yamamoto, she had nothing to do with this!@k @v58/75600200.Let go of her!"'
50587: '@rKinzo had jumped out from the shadows.@k@rHe was holding a gun he had stolen from one of the corpses.'
50588: '@r@v99/75700090."Hmmm? Ushiromiya?@k@v99/75700091. Ah, so you''re alive!"'
50589: 'Kinzo@r@v58/75600201."Let her go! You''re hurting her...!!"'
50590: '@r@v99/75700092."......It was you, wasn''t it?@k @v99/75700093.You tipped the Italians off."'
50591: 'Kinzo@r@v58/75600202."What are you talking about...?!"'
50592: '@rYamamoto didn''t know that the grenade had been a dud.'
50593: '@rThe surprise attack, which he had been certain would work, had failed,@k so he had decided that Kinzo must have tipped them off.'
50594: '@r@v99/75700094."It''s your fault the surprise attack failed, and now look what''s happened!@k @v99/75700095.You turncoat...@k@v99/75700096. I know you''ve been working with them through this woman!"'
50595: 'Kinzo@r@v58/75600203."Can''t you see that you caused all this because you were blinded by gold?!"'
50596: 'Beatrice@r@v59/70700161."<Run, Kinzo!@k @v59/70700162.This man has shot people begging for their lives!@k @v59/70700163.He''ll shoot you too!>"'
50597: '@r@v99/75700097."Don''t talk, Italian!@k @v99/75700098.If you open your mouth again, I won''t hesitate to shoot."'
50598: 'Beatrice@r@v59/70700164."<I-......it hurts......ggaahhh...>"'
50599: '@rYamamoto ground his heel into Beatrice''s gut.'
50600: 'Kinzo@r@v58/75600204."Stop it, stop it!!@k @|@y@v58/75600205.She has nothing to do with this!!"'
50601: '@r@v99/75700099."Oho?@k @v99/75700100.Are you pointing a gun at a superior officer?@k@v99/75700101. ......Stop and think a bit, fool.@k@v99/75700102. If we agree to keep to the same story, we can have that pile of gold all to ourselves, right?@k@v99/75700103. ......I could only grab a few for myself, but if we work together, we can sneak off with even more.@k@v99/75700104. ......I don''t mean this as your superior officer.@k@v99/75700105. Let''s split it between us as men."'
50602: 'Kinzo@r@v58/75600206."Haven''t you already killed the last people you said you''d split the gold with?!"'
50603: '@r@v99/75700106."Tch.@k@v99/75700107. Ushiromiya,@v99/75700108. looks like you prefer lead to gold!!"'
50604: '@rWithout any hesitation, Yamamoto raised the barrel of his gun towards Kinzo and pulled the trigger.'
50605: '@rIt grazed Kinzo''s right ear.'
50606: '@rIf Yamamoto''s aim had been just a bit better, the bullet would undoubtedly have slammed into Kinzo''s face.'
50607: 'Beatrice@r@v59/70700165."<Kinzo?!@k @v59/70700166.H-how could you?!!>"'
50608: '@r@v99/75700109."You.....gyah?!?!"'
50609: '@rNot letting Yamamoto''s momentary distraction go to waste, Beatrice lashed out and planted her right foot in Yamamoto''s crotch.'
50610: '@rAfter moaning in pain, a demonic expression flashed across Yamamoto''s face, and he stomped on her chest.'
50611: 'Kinzo@r@v58/75600207."<Bice!!>"'
50612: '@r@v99/75700110."You biiiiitch!! Diiiiiiiiiiiiiiiie!!"'
50613: '@rBeatrice shut her eyes tightly, hoping that she could withstand the coming pain.'
50614: '@rNo one would want to have their eyes open at the moment they were shot......'
50615: '@r@v99/75700112."Gy-@v99/75700113.......y...@v99/75700114.you...@v99/75700115................"'
50616: '@rThick...@w500....spurts of blood...@w416....squirted out of Yamamoto''s chest.'
50617: 'Kinzo@r@v58/75600208."Just as you took many lives for your own sake,@k@v58/75600209. ......I take your life...@v58/75600210....for mine."'
50618: '@rWas Yamamoto able to hear the last of Kinzo''s words to him?'
50619: '@rIn his last moments, Yamamoto seemed to grin.'
50620: '@rThen, slowly, he fell over backwards,@w500. ......a river of blood trailing from his body.'
50621: 'Beatrice@r@v59/70700167."<Kinzo!@k @v59/70700168.Are you okay?!@k @v59/70700169.I was sure you''d been shot...!@k @|@y@v59/70700170.Uggh...ggh......>"'
50622: '@rBeatrice tried to stand up, but then doubled over and started coughing.'
50623: 'Kinzo@r@v58/75600211."<Bice!@k @v58/75600212.Are you hurt...?!>"'
50624: 'Beatrice@r@v59/70700171."<......My ribs are hurting.@k@v59/70700172. That brute really was stomping them hard.>"'
50625: 'Kinzo@r@v58/75600213."<Will you be alright...?@k@v58/75600214. I hope they aren''t broken......>"'
50626: 'Beatrice@r@v59/70700173."<Italian women don''t break so easily.@k@v59/70700174. ......But...thanks.@k@v59/70700175. I owe you my life.@k@v59/70700176. If you hadn''t come, it''d have all ended there.@k@v59/70700177. ......Ggh......>"'
50627: '@rYamamoto had shown no mercy.@k ......Her ribs were probably cracked.'
50628: '@r......We didn''t have the option of waiting, possibly for several days, for the ship that was coming.'
50629: '@rI made the decision to ferry her off this island.'
50630: '@rThe man who kept yelling about preserving the secrecy of the base is lying there dead.'
50631: '@r......The next island over, Niijima, is close.@k A small boat should be able to take us there.'
50632: 'Kinzo@r@v58/75600215."<I need to take you to a hospital.@k@v58/75600216. ......The wound might be more serious than you realize.>"'
50633: 'Beatrice@r@v59/70700178."<......That''s interesting.@k@v59/70700179. Never knew there was a hospital on this island.>"'
50634: 'Kinzo@r@v58/75600217."<There isn''t.@k@v58/75600218. I''ll use a boat to take you to the next island.@k@v58/75600219. ......I''ll take you to a hospital,@k@v58/75600220. but I need to return here and clean up the mess on this island, ......or it''ll mean a court-martial.>"'
50635: 'Beatrice@r@v59/70700180."<I have a request.@k@v59/70700181. ......Please, don''t take me to a hospital.>"'
50636: 'Kinzo@r@v58/75600221."<Why...?>"'
50637: 'Beatrice@r@v59/70700182."<If we go to a hospital and the embassy is contacted, I''ll eventually be sent back to Italy.@k@v59/70700183. ......If that happens, I''ll be interrogated about all kinds of things.@k@v59/70700184. I won''t acknowledge those people, who let Mama die.>"'
50638: 'Kinzo@r@v58/75600222."<........................>"'
50639: 'Beatrice@r@v59/70700185."<There''s no homeland for me to return to now.@k@v59/70700186. This is the end for me.@k@v59/70700187. So, there''s nowhere I want to go anymore.@k@v59/70700188. ......The people who were so kind to me—Ensign Angelo,@v59/70700189. Rubens,@v59/70700190. and everyone else,@v59/70700191. ......they''re all dead.>"'
50640: 'Kinzo@r@v58/75600223."<And because of that, you want to die here too?@k @v58/75600224.I thought you said Italian women weren''t weak.@k @v58/75600225.Live.>"'
50641: 'Beatrice@r@v59/70700192."<Hey, Kinzo?@k@v59/70700193. What does it mean...to live?@k @v59/70700194.You''re the one who taught me, aren''t you?@k@v59/70700195. Living is more than just breathing.@k@v59/70700196. .........I don''t want to go back to Italy.>"'
50642: 'Kinzo@r@v58/75600226."<......Bice.>"'
50643: 'Beatrice@r@v59/70700197."<You''ve said that you were dead before you met me.@k@v59/70700198. But it''s the same for me.@k@v59/70700199. ......I died in that submarine.@k@v59/70700200. My homeland fell, Mama died.@k@v59/70700201. Even Papa died.>"'
50644: 'Beatrice@r@v59/70700202."<......I prayed that our sub would just sink to the bottom of the ocean.@k@v59/70700203. So, when we reached this place, I was actually disappointed that we''d survived.@k@v59/70700204. .........Then, right after that,@k@v59/70700205. Ensign Angelo started asking whether anyone could speak English.>"'
50645: '@rWhen Kinzo met Beatrice, he finally forgot about dying.'
50646: '@rAnd when Beatrice met Kinzo, ......she also forgot about dying.'
50647: 'Beatrice@r@v59/70700206."<I...@k@v59/70700207. ......Now that I''ve lost my homeland, my family, and my friends,@k@v59/70700208. ............I wish you would whisk me away.>"'
50648: 'Kinzo@r@v58/75600227."<.........Bice......>"'
50649: 'Beatrice@r@v59/70700209."<But, ......I know that''s a wish that couldn''t come true.@k@v59/70700210. ......So, at the very least,@k@v59/70700211. ......I want to be with you until the boat comes for us.@k@v59/70700212. I don''t care about the pain in my chest.@k@v59/70700213. After all, when the boat comes and takes me away, ......I''ll die.>"'
50650: '@rBeatrice spoke this, smiling softly.@k ......She did her best to hide the pain in her chest.'
50651: 'Beatrice@r@v59/70700214."<Please, Kinzo.@k@v59/70700215. ......Just for the few days until the boat comes,@k@v59/70700216. ......steal me away.>"'
50652: 'Kinzo@r@v58/75600228."<.........That''s a wish...@v58/75600229....I cannot grant.>"'
50653: '@rLooking apologetic, Kinzo lifted Beato up and gently sat her in the boat.'
50654: 'Beatrice@r@v59/70700217."<......Coward.@k@v59/70700218. ......So, Japanese men are weak after all.>"'
50655: 'Kinzo@r@v58/75600230."<You''re right.@k@v58/75600231. ......I am a coward.@k@v58/75600232. So, I can only grant you half of your wish.>"'
50656: '@rWith a clunk, he placed the object wrapped in a jacket into the boat.'
50657: 'Beatrice@r@v59/70700219."<What do you mean......?>"'
50658: 'Kinzo@r@v58/75600233."<The part about "until the boat comes for you".@k@v58/75600234. ......I can''t make that a reality.>"'
50659: 'Beatrice@r@v59/70700220."<......Huh?@k @v59/70700221.What do you mean?>"'
50660: 'Kinzo@r@v58/75600235."<Stealing you away.@k@v58/75600236. ......That wish, I will make come true.>"'
50661: 'Beatrice@r@v59/70700222."<......K-......Kinzo.........>"'
50662: '@rThere has to be a doctor on Niijima.'
50663: '@rI''m wearing a Navy uniform.'
50664: '@rI should be able to pass myself off as a survivor of a boat carrying a VIP that was sunk by enemy ships.'
50665: '@rIf the doctor happens to be of the greedy sort, all the better.'
50666: '@r......After all, I have right here the golden magic to make people do what I say.'
50667: '@rShe came from a distant country, took my lifeless body, and gave me a soul.'
50668: '@rThe witch......who came bearing gold......revived me with her magic.'
50669: 'Kinzo@r@v58/75600237."<You...are a witch.@k@v58/75600238. ......The Golden Witch.>"'
50670: 'Beatrice@r@v59/70700223."<*giggle*.@k@v59/70700224. Yes, the Golden Witch.@k@|@y@v59/70700225. Even though I use the same recipe as everyone else, only my alchemy can turn pasta into a smoking black heap.>"'
50671: 'Kinzo@r@v58/75600239."<Haha, hahahahahahahahaha.>"'
50672: 'Beatrice@r@v59/70700226."<......Just like you, I''m nothing but a corpse that''s only allowed to live while you''re there beside me.@k@v59/70700227. ......If you disappear, I''ll die within moments.>"'
50673: 'Kinzo@r@v58/75600240."<I won''t let you die.>"'
50674: 'Beatrice@r@v59/70700228."<Really?>"'
50675: 'Kinzo@r@v58/75600241."<No matter what.>"'
50676: 'Beatrice@r@v59/70700229."<Take some responsibility.@k@v59/70700230. .........After all, you''re the one......who''s spirited me away.>"'
50677: 'Nanjo@r@v19/71900001."......I see.@k@v19/71900002. So, Kinzo-san told you that much."'
50678: 'Lion@r@v53/75300239."Then, ......wait, it was you?!@k @v53/75300240.You''re the Niijima doctor that Grandfather took Beatrice to...?"'
50679: 'Will@r@v54/75400498."Why so shocked?@k@v54/75400499. He should''ve leapt to mind at the moment the words "Niijima doctor" showed up."'
50680: 'Nanjo@r@v19/71900003."All of a sudden, a soldier of the Navy appeared along with a foreign woman.@k@v19/71900004. Of course, I was astounded.@k@v19/71900005. ......What''s more, he told me to treat her wounds confidentially, since their presence was a military secret."'
50681: 'Lion@r@v53/75300241."Was that the first time you met Grandfather...?"'
50682: 'Nanjo@r@v19/71900006."......Yes.@k@v19/71900007. That was when we first met."'
50683: 'Will@r@v54/75400500."So, you''re the greedy doctor who followed orders for the sake of the gold?"'
50684: 'Nanjo@r@v19/71900008."That''s a bit harsh......@k@v19/71900009. He suddenly brought in a foreign woman patient, told me it was a military secret,@k@v19/71900010. promised that he''d pay the medical fees later, and handed me a gold ingot as collateral.@k@v19/71900011. I didn''t want to get involved with any funny business.@k@v19/71900012. I was reluctant to say the least."'
50685: 'Lion@r@v53/75300242."I see your point.@k@v53/75300243. ......But in the end, you did conceal Beatrice, didn''t you?"'
50686: 'Nanjo@r@v19/71900013."I may not be as skilled as Kinzo-san, but I do have some familiarity with English.@k@v19/71900014. I managed to overhear part of their conversation, and that was enough to convince me that they were not troublesome people."'
50687: 'Nanjo@r@v19/71900015."*cough*...@k@v19/71900016. ......Of course, if I were to say that the ingot didn''t tempt me, that would be a lie.@k@v19/71900017. I was much younger then, you see."'
50688: 'Will@r@v54/75400501."What happened to her next?"'
50689: 'Nanjo@r@v19/71900018."I treated her for some time before someone came to me on behalf of the Ushiromiya family and said that she would be moved to Odawara.@k@v19/71900019. They took her away."'
50690: 'Lion@r@v53/75300244."So Grandfather didn''t come to get her himself?"'
50691: 'Will@r@v54/75400502."Regardless of how Kinzo explained away the incident on Rokkenjima,@k@v54/75400503. he probably wouldn''t have been able to move about freely for some time afterwards."'
50692: 'Nanjo@r@v19/71900020."Precisely.@k@v19/71900021. Kinzo-san has said that deceiving the military was the greatest challenge of his life."'
50693: 'Lion@r@v53/75300245."So, Beatrice went to Odawara, and then what...?"'
50694: 'Nanjo@r@v19/71900022."I have heard that she hid in one of their unused villas.@k@|@y@v19/71900023. ......After all, Kinzo-san already had a family at that time.@k@v19/71900024. It must have been tricky to manage."'
50695: 'Will@r@v54/75400504."So, Kinzo was a master of the double life before Kuwadorian even existed.@k@|@y@v54/75400505. .........Whoosh."'
50696: 'Lion@r@v53/75300246."What are you doing...?@k @v53/75300247.Is your butt itching?"'
50697: 'Will@r@v54/75400506."......Tch."'
50698: 'Lion@r@v53/75300248."And later on?@k @v53/75300249.Beatrice and Grandfather continued their happy relationship in the villa from then on...?"'
50699: 'Nanjo@r@v19/71900025B."I have heard that it was a modest, peaceful life.@k .......Several years later, they had a child."'
#s.ins 0x86, ushort(50700), byte(0), byte(1), s.layout(''@r彼女に金蔵とは血の繋がらない忘れ形見がいたことを南條が知るのは、その後しばらく経ってからのことである.'')
50701: 'Will@r@v54/75400507B."And so Kuwadorian''s Beatrice was born."'
#s.ins 0x86, ushort(50702), byte(0), byte(1), s.layout(''@rだが南條がそれを知った時には、ベアトリーチェは既にひどく身体を患い、今際の際にあったらしい.残された娘は金蔵に託され、そして.......'')
50703: 'Nanjo@r@v19/71900027B."The birth...didn''t go well......@k@v19/71900028. Truly a sad tale."'
50704: 'Lion@r@v53/75300250."You don''t mean...she died?!"'
50705: 'Will@r@v54/75400508."Don''t be surprised.@k@v54/75400509. Kinzo believed his daughter was Beatrice reborn.@k@v54/75400510. ...Don''t ignore the heart. It''s possible to reason it out."'
50706: 'Lion@r@v53/75300251."Y-......you''re right.@k@v53/75300252. ......My apologies."'
50707: 'Nanjo@r@v19/71900029."I don''t know how many years Kinzo-san spent with her in Odawara.@k@v19/71900030. .........However, judging by Kinzo-san as we know him afterwards...@k@v19/71900031. Even if it was only a few years, one can tell how deeply he loved her."'
50708: 'Lion@r@v53/75300253."...........................@k@v53/75300254. ......I see."'
50709: 'Will@r@v54/75400511."So then, he made Kuwadorian for his daughter......"'
50710: 'Nanjo@r@v19/71900032."Kinzo-san cleverly made use of the submarine''s gold to build up a fortune in a flash.@k@v19/71900033. Then, he made use of his considerable skills in English to make connections with the GHQ, becoming immensely wealthy in a short span of time.@k@v19/71900034. I''m sure there''s no need to explain this part to you, Lion-san."'
50711: 'Lion@r@v53/75300255."......Yes.@k@v53/75300256. He used that vast wealth, ......bought Rokkenjima, and built the mansion.@k@v53/75300257. The remaining relatives in Odawara scoffed at Grandfather, thinking he was crazy to buy an entire deserted island."'
50712: 'Will@r@v54/75400512."If you could carry ten tons of gold around in your pocket, Kinzo probably wouldn''t have bought Rokkenjima."'
50713: '@rHe hid the gold somewhere in Rokkenjima,@k built up a fortune with the ingots he''d taken out of it, ......and then bought up the whole treasure island...'
50714: 'Nanjo@r@v19/71900035."Exactly.@k@v19/71900036. .........And that started the legend of the Ushiromiya gold."'
50715: 'Will@r@v54/75400513."......What about the mark of the One-winged Eagle that was supposedly pressed into the ingots?"'
50716: 'Nanjo@r@v19/71900037."It was less a one-winged eagle......than an eagle that appeared to have only one wing."'
50717: 'Lion@r@v53/75300258."What do you mean?"'
50718: 'Nanjo@r@v19/71900038."You see it often in Europe, do you not?@k@v19/71900039. A crest or coat of arms with an eagle spreading its wings on it.@k@v19/71900040. ......The flag of the Salo Republic also had an eagle—or was it a hawk?—@k@v19/71900041.emblazoned on it."'
50719: 'Will@r@v54/75400514."So, the imprint was made too lightly......or else it was poorly done."'
50720: 'Nanjo@r@v19/71900042."Correct.@k@v19/71900043. .........It was a hasty, wartime stamping.@k@v19/71900044. It was probably supposed to look like the crest of an eagle spreading its wings.@k@v19/71900045. But half of it, cut off at a diagonal, was too faded to see."'
50721: 'Lion@r@v53/75300259."So half of the eagle spreading its wings disappeared, ......making it look like a One-winged Eagle?"'
50722: 'Will@r@v54/75400515."Kinzo thought the seal on the gold of Beatrice, the woman who had changed his fate, looked like a one-winged eagle.@k@v54/75400516. That must be why he decided to make that his own crest."'
50723: 'Nanjo@r@v19/71900046."......If the imprint had been made correctly, it would have been the eagle of the Salo Republic''s flag,@k@v19/71900047. ......or could it have been the two-headed......"'
50724: 'Nanjo@r@v19/71900048."......No, no, that would be ridiculous.@k@v19/71900049. At any rate, passing the night away with Kinzo-san in front of that massive pile of gold, drinking and dreaming, was truly an enjoyable experience."'
50725: 'Nanjo@r@v19/71900050."However, Kinzo-san didn''t want anyone using that stamp to figure out where the gold had come from.@k@v19/71900051. The gold he took outside was all re-pressed with the One-winged Eagle design he had created."'
50726: 'Will@r@v54/75400517."And all he did was show you the gold?@k @v54/75400518.What a cheapskate."'
50727: 'Nanjo@r@v19/71900052."Of course, after he became immensely rich, Kinzo-san came to me once more and paid me in full for the overdue medical expenses.@k@v19/71900053. The amount he came with was a bit much for medical fees.@k@v19/71900054. Though I did make sure to give him his change."'
50728: 'Lion@r@v53/75300260."And you''ve been friends ever since......?"'
50729: 'Nanjo@r@v19/71900055."Yes.@k@v19/71900056. Kinzo-san was extremely grateful to me for keeping his secret and concealing Beatrice."'
50730: 'Lion@r@v53/75300261."......Grandfather always says that the old relatives in Odawara were a bunch of greedy liars.@k@|@y@v53/75300262. ......I''m sure he appreciated your strong sense of duty, Doctor Nanjo.@k@v53/75300263. I think I understand why a person like Grandfather came to trust you."'
50731: 'Nanjo@r@v19/71900057."I also had some interest in foreign countries, as well as a hobby of playing chess.@k@v19/71900058. Kinzo-san and I have gotten along well ever since.@k@v19/71900059. It was a friendship that built up gradually, but grew strong before we knew it.@k@v19/71900060. Yes, we have been friends a very long time......"'
50732: 'Will@r@v54/75400519."People who deal with large amounts of money are quite mindful of small amounts as well.@k@v54/75400520. ......When you refused to accept anything more than the medical fees, that must have earned you his admiration."'
50733: 'Nanjo@r@v19/71900061."You think too highly of me.@k@v19/71900062. No, I was just frightened by the large quantity of money.@k@v19/71900063. I began to regret it later, ......wahahahaha.@k@v19/71900064. It seems I''ve never had real guts."'
50734: 'Will@r@v54/75400521."No need to worry there.@k@v54/75400522. Guts are one thing you''ve got no shortage of."'
50735: 'Nanjo@r@v19/71900065."You think so?@k@v19/71900066. Well, I appreciate the flattery."'
50736: 'Will@r@v54/75400523."That wasn''t flattery."'
50737: 'Lion@r@v53/75300264.".........?"'
50738: '@r......After Kinzo dies, Nanjo is complicit in keeping his death a secret for at least a whole year.'
50739: '@rOf course, Natsuhi must have given him a fairly hefty sum of hush money.'
50740: '@rAll the same, he''s at least gutsy enough to withstand the pressure from Kinzo''s children for that amount of time without slipping up once......'
50741: 'Will@r@v54/75400524."You''re plenty gutsy, if you ask me.@k@v54/75400525. That sense of duty must be part of your character."'
50742: 'Nanjo@r@v19/71900067."......Hahahah.@k@v19/71900068. Perhaps that is my only redeeming quality..."'
50743: 'Lion@r@v53/75300265."I think Grandfather was blessed with a good friend."'