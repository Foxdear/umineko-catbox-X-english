52757: '@rShe must have realized that I was staring at it.'
52758: '@r@v43/72800142."Almost had Yasu complain that I shouldn''t leave keys lying about like this.@k@v43/72800143. I''d never put something down and forget about it."'
52759: '@rWith a grin, she put the key back into her pocket.'
52760: '@rHowever, she still hadn''t noticed.'
