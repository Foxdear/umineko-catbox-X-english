52895: '@r@v32/73700281."Now, if you can keep this up and give me a wonderful name, that''d be great.@k @v32/73700282.If I have to go around nameless for too long, I''ll get all sulky."'
52896: 'BEATRICE@r@v55/75500387."Fear not, I shall find you a splendid name!@k @v55/75500388.But first, there is something I must consider: what shall be the form of my magic?!"'
52897: 'BEATRICE@r@v55/75500389."Hiding objects and transporting them instantaneously is your theme.@k@v55/75500390. So, I must think of my own particular theme of magic.@k@v55/75500391. ......When I use magic, gold butterflies will flit about.@k@v55/75500392. I''m not backing down on that part...!"'
52898: '@r@v32/73700283."*giggle*. Splendid.@k@v32/73700284. Just perfect for the Golden Witch.@k@|@y@v32/73700285. ......Then the weaknesses such as spiderwebs and the sacred mirror in the shrine will also go to you?"'
52899: 'BEATRICE@r@v55/75500393."Hmm.@k@v55/75500394. Even an all-powerful witch needs a few small weaknesses to keep things interesting.@k@v55/75500395. Then let us do it like so.@k@v55/75500396. If I touch a spiderweb, it will burn me."'
52900: '@rSilently, a silvery spider dropped down vertically.'
52901: '@rBeato, now in her new form, lightly touched the silver spiderweb that trailed out behind it.'
52902: '@rAs she did, ......there was a faint sound of flesh burning, and a thin burn was left across her fingers.'
52903: '@rBEATRICE can''t stand spiderwebs.@k@rThat was one of the weaknesses of the evil spirits Kumasawa-san spoke of.'
52904: '@rSince the witch BEATRICE had revived thanks to the power of those evil spirits,@k she also inherited their weaknesses.'
52905: '@rSo, the sacred mirror is also one of her weaknesses.'
52906: '@r......However, I am unlikely to cross paths with that sacred mirror in the shrine very often.'
52907: '@rThat''s not very fun.'
52908: 'BEATRICE@r@v55/75500397.".........Then, while mirrors with sacred power will obviously be a weakness, let us make mirrors in general a weakness too."'
52909: '@r@v32/73700286."They do often say that mirrors have magical powers.@k@v32/73700287. Good idea, I think.@k @v32/73700288.Sounds just like a witch."'
52910: 'BEATRICE@r@v55/75500398."Let us say that I cannot abide mirrors because when I look at one, it feels as though my magical power is being sucked out.@k@v55/75500399. Hmm, that sounds quite entertaining."'
52911: '@r......Now that I really think about it,@k I''ll be bad with mirrors whether I invent a story for it or not.'
52912: '@rNo matter who I want or strive to be,@w583. ......the only face that will ever show in a mirror...@w500.is the heartlessly pathetic and realistic face of "Yasu".'
52913: '@rMirrors, which will always force me to face my shabby reality, are something I always want to avoid.'
52914: '@rThat''s right.@k ......I hate mirrors.'
52915: '@r......I don''t want to look at...@w166.my own...@w166.pitiful self.'
52916: '@r@v32/73700289."You don''t need to decide everything at once.@k@v32/73700290. It''s fun to build up a world one little bit at a time."'
52917: 'BEATRICE@r@v55/75500400."True.@k@v55/75500401. I understand.@k@v55/75500402. I shall enjoy life as a witch as I slowly expand my world."'
52918: '@r@v32/73700291."That tiny, dark room is no place for you to sleep now."'
52919: 'BEATRICE@r@v55/75500403."Indeed.@k@v55/75500404. I am the Golden Witch!@k @v55/75500405.I am the ruler of Rokkenjima''s night, and the nighttime mansion belongs to me.@k@v55/75500406. That is where I should be living, is it not?"'
52920: 'Zepar@r@v51/75100075."A room for BEATRICE?@k @v51/75100076.Haha, isn''t it obvious?!"'
52921: 'Furfur@r@v52/75200078."Yeah, that''s right!@k @v52/75200079.That wonderful room on the second floor of the mansion......"'
52922: 'Zepar@r@v51/75100077."The VIP room of the witch—that is BEATRICE''s room!"'
52923: 'BEATRICE@r@v55/75500407."Oh, so it is.@k@v55/75500408. From this evening forward, that room in the nighttime mansion shall be my dwelling place...!@k @|@y@v55/75500409.Why didn''t I think of that myself, hahaha, hehahahahahahahaha...!!"'
52924: '@r@v32/73700292."Then let''s go, Beato.@k@v32/73700293. If we''re going to drink tea together, we''ll need a much better room than that cramped one."'
52925: 'BEATRICE@r@v55/75500410."Indeed.@k@v55/75500411. That room is too crude to welcome friends to and serve tea in.@k@v55/75500412. We shall change rooms.@k@v55/75500413. Let us go, my friend...!"'
52926: '@r@v32/73700294.".........So, this is goodbye to Shannon."'
52927: '@rWhen I looked at my feet, ......I could see my own dorm room far beneath me.'
52928: '@rI could see Shannon, who had dashed up to the bed I lay on and had been saying "wait" at the moment time froze.@k She was as rigid as a doll.'
52929: '@rLooking down at it from this height, it really did look like a small dollhouse...'
52930: 'BEATRICE@r@v55/75500414."Farewell, Shannon.@k@v55/75500415. ......The days I spent as a Human, growing our friendship as I attempted to emulate you, were truly fun.@k@v55/75500416. ...If I had never learned the joys of magic and awakened as a witch,@k@v55/75500417. everything would doubtless have remained as it was."'
52931: '@r.........I was your only close friend as well, wasn''t I?@k@rPlease forgive me for erasing that friend so suddenly.'
52932: '@rAs a parting gift, ......I will erase "me" from your world.'
52933: '@rStarting now, this will not be a two-person room.'
52934: '@rIt will be a single-person room, with just you in it.'
52935: '@rStrive to be a kind, reliable servant loved by everyone,@k and embody that ideal as you always have.'
52936: '@rYasu, the stupid, clumsy servant who lost things all the time, no longer exists.'
52937: '@rFarewell, Shannon.'
52938: '@rWhen I mature as the witch BEATRICE and wander freely about the nighttime mansion,@k ......I may bump into you as you do your nighttime rounds.'
52939: '@rHowever, when I meet you again,@k it will not be a reunion.@k@rIt will be our first meeting.'
52940: '@rAfter all, though you have heard the rumors about the witch BEATRICE, you have never met her......'
52941: '@rFarewell, Shannon.'
52942: '@rLet us meet again sometime and spin up some fun tale.........'
52943: 'Shannon@r@v15/70500216."Wait......!!@k @v15/70500217.Wai...@v15/70500218..........t...@v15/70500219.............@k@v15/70500220. ..........................."'
52944: '@r....................................'
52945: '@r.........What...@w583....was I doing...?'
52946: '@rWas I......talking in my sleep......?'
52947: '@rApparently, I had gotten out of bed, stretched my hand out towards it,@k ......and said "wait".'
52948: '@rThis isn''t the first time I''ve woken myself up by saying something strange in my sleep, but...'
52949: '@r......I don''t remember ever waking up to find myself out of bed and standing up.'
52950: '@rCould this be what they call......sleepwalking...?'
52951: '@rAm I just tired......?'
52952: '@r......Gotta sleep.@k Gotta get back to sleep.'
52953: '@rI turned around to face my bed.'
52954: '@r............?'
52955: '@rMy bed wasn''t there.@k@rThere was no bed in this room except the one I had just turned my back on.'
52956: '@rIf I''m the only one in this room, and the only bed is the one behind me,@k ......that must mean it''s my bed.'
52957: '@r......That feels wrong, for some reason.'
52958: '@rThe bed sheets are all disarranged, as though someone slipped out of them.'
52959: '@r"Someone"...?@k This is my own, single-person room.'
52960: '@rSo, that there is my bed, and the rumpled sheets mean...@kthat I was just sleeping there until a second ago, don''t they...?'
52961: '@r......But, for some reason,@w583. .........that bed...@w333....doesn''t feel like my bed.'
52962: '@rBut I, Shannon, have a single-person room—I was the only person to be given one while all the other kids had to share.'
52963: '@rSo, there''s only one bed.@k@rAnd it must be mine.'
52964: '@r...........................'
52965: 'Shannon@r@v15/70500221.".........Am I just...@v15/70500222....tired?@v15/70500223. ......I wonder..."'
52966: '@rI must just be half-asleep.@k I have school again first thing tomorrow.'
52967: '@rAnd after school, I''ll go to the mansion, help out with some work,@k and then I want to talk to Kumasawa-san about the mystery novel I just read.'
52968: 'Shannon@r@v15/70500224."Time to sleep.@k@v15/70500225. I''m probably just so worn out that I''m imagining things.@k@|@y@v15/70500226. .........Good night, Shannon.@k@v15/70500227. Just crawl in bed and close your eyes...@k@v15/70500228....and you won''t have to think about anything complicated......"'
52969: '@rI went back into my bed.'
52970: '@rIt felt a bit uncomfortable to crawl into a bed that wasn''t mine.'
52971: '@rStill, it might just be because I''m getting so sleepy, but it''s starting to feel as though this is my bed after all.'
52972: '@r.........I''m just half-asleep......'
52973: 'Shannon@r@v15/70500228_a.I am...Shannon.@k@v15/70500228_b. A lonely servant.'
52974: 'Shannon@r@v15/70500228_c.I mess up from time to time,@v15/70500228_d. ......but I want to become a kind servant whom everyone loves......'
52975: 'Shannon@r@v15/70500228_e..........Goodnight,@k@v15/70500228_f. .........me.........'
52976: 'BEATRICE@r@v55/75502000.Oh, I am one yet many.@k@r@v55/75502001.I have grown tired of playing the servant.@k@v55/75502002. I have grown tired of playing the Human!'
52977: 'BEATRICE@r@v55/75502003.From this moment forth, from this night forth, I am BEATRICE!@k@r@v55/75502004.The Golden Witch BEATRICE, who has lived for a thousand years!'
52978: 'BEATRICE@r@v55/75502005.Praise me, servants.@k@v55/75502006. Have fear when you are chosen for the night shift!@k@r@v55/75502006_b.On the nighttime island, the mansion is my place, and that is my time...!'
52979: 'BEATRICE@r@v55/75502007.Oh, I am one yet many!'
52980: 'BEATRICE@r@v55/75502008.Yes, let our world swallow up everything.@k@v55/75502009. It is like the raging seas!'
52981: 'BEATRICE@r@v55/75502010.Well now, let us drink the mysterious moon dry tonight, with this Human book as a side dish!'
52982: 'BEATRICE@r@v55/75502011.You call this mystery?@|@y@k @v55/75502012.You call this a locked room?@|@y@k @v55/75502013.You call this "a crime impossible for Humans"?@|@y'
52983: 'BEATRICE@r@v55/75502014.Don''t make me laugh!@k @v55/75502015.With all these holes and weak points, you call this a crime impossible for Humans?!'
52984: 'BEATRICE@r@v55/75502016.Is there no splendid locked-room magic capable of astonishing me?'
52985: 'BEATRICE@r@v55/75502017.Oh, not here, not there, not this, not that, all of them pathetic!'
52986: 'BEATRICE@r@v55/75502018.It draws out a chuckle, but leaves me unsure which is the side dish, the moon or the book?!'
52987: 'BEATRICE@r@v55/75502019.If I get tired of mystery, I can change myself into a butterfly!@k @v55/75502020.I can flit about the island,@k @v55/75502021.the mansion, the vast forest at will!'
52988: 'BEATRICE@r@v55/75502022.I''ll follow those cowardly servants as they do their nighttime rounds,@k@v55/75502022_b. and when they check to see that a window is locked, they''ll see me laughing at them in the reflection on the glass!'
52989: 'BEATRICE@r@v55/75502023.I can be fickle, and do as I please!@k@r@v55/75502024.Pranks at night will probably be a lot of fun.'
52990: 'BEATRICE@r@v55/75502025.Yes, my mind is made up—I will play like that starting tonight!'
52991: 'BEATRICE@r@v55/75502026.*cackle*cackle*, how pleasurable!@k @v55/75502027.Tonight will truly be pleasurable!'
52992: 'BEATRICE@r@v55/75502028.In the world of witches, the only limits to your fun are the limits of your imagination!'
52993: 'BEATRICE@r@v55/75502029.My imagination shall become the source of my magical power!'
52994: 'BEATRICE@r@v55/75502030.Very well, then—this will be fun!@k @v55/75502031.I shall allow my imagination to grow without bound.@k@v55/75502032. And with it, I shall swallow up the entire island.@k@v55/75502033. All nights on this island belong to me!!'
52995: 'BEATRICE@r@v55/75502035.Oh, how refined and pleasant are the days of a witch!'
52996: 'BEATRICE@r@v55/75502036.Oh, I am one yet many!@|@y@k @v55/75502037.Kihahahahahahhha, hyahhaha!!@|@y'
52997: 'BEATRICE@r@v55/75502038.Here''s to the wonderful world of witches!!'