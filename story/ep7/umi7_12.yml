52875: '@r@v55/75500369."Yeah.@k@v55/75500370. That haughty way of speaking with "warawa" will be mine."'
52876: '@r@v32/73700270."Hmm, very well.@k@v32/73700271. Then I shall—no, I can''t speak like that any more.@k@v32/73700272. ......Then I need to find a good way to sound like BEATRICE''s big-sister-like witch friend."'
52877: '@r@v55/75500371."Yeah.@k@v55/75500372. ......Or should it be...@v55/75500373.@w583..........very well."'
52878: '@r@v32/73700188."Ahahahaha.@k@v32/73700274. Now there''s a nice, dignified voice."'
52879: '@r@v55/75500374."What about the way I—let''s try that again.@k@v55/75500375. And what of my appearance?"'
52880: '@r@v32/73700275."Good point.@k@v32/73700276. I''ve got a sort of blood-red witch look.@k@v32/73700277. Why not choose a different color for yourself?"'
