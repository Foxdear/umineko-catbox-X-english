52869: '@r@v55/75500359.".....................@k@v55/75500360. I''ll put that on hold until I can think of one.@k@v55/75500361. You''ll be nameless for a while.@k@v55/75500362. Sorry about that."'
52870: '@r@v32/73700261."Worry not, worry not.@k@v32/73700262. It is to be my name, after all.@k@v32/73700263. You had better take your time and think carefully about it.@k@v32/73700264. *cackle*."'
