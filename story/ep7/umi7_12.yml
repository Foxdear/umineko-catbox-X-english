52813: '@rShannon was confused.'
52814: '@rIt was hardly surprising.@k ......All this about quitting as a servant was at least understandable.'
52815: '@rBut she didn''t know how to answer after hearing that her roommate wanted to become a witch...'
52816: '@r@v55/75500319."A witch.@k@v55/75500320. BEATRICE.@k@v55/75500321. ......You see, today, BEATRICE possessed me and used my body to do magic.@k@v55/75500322. That unknown world felt so......thrilling.@k@v55/75500323. It was far, far more thrilling than even the time I learned that I''d been selected as an Ushiromiya family servant."'
52817: '@r@v55/75500324."It was like learning about a new world.@k@v55/75500325. ......As though I''d been living in a world of darkness all my life and thought I knew what the world was like,@k@v55/75500326. then finally learned what light was and saw the world for the first time.@k@v55/75500327. It was...joy.@k@v55/75500328. ......Excitement."'
52818: '@rAt that time, Beato had only used my fingers, made a key ring dance,@k and turned a key into a butterfly before hiding it in a locker.'
52819: '@rBut I had understood it with my body.'
52820: '@rIf I had moved my fingers a different way, the ring could have flown into the air instead of just dancing,@k and I could have turned it into a scurrying lizard instead of a butterfly. ......I could have done anything.'
52821: '@rTrue, BEATRICE''s magical power was still weak.'
52822: '@rIt had all happened in the little world behind the backs of the servants filled with the anti-magic toxin.'
52823: '@rHowever, inside that tiny, short-lived world, I could have done anything at all.@k@rBeato just happened to settle on making the keys dance and turning one into a butterfly.@k@rBut if she wanted to, she could have done anything else!'
52824: '@rThe endless sensation of that free, unrestricted power...@k@rI could still feel it in my fingertips.'
52825: '@rCould it be that, along with that sensation, a sliver of that magical power might also remain...?'
52826: '@rI can tell.@k It''s still there.@k .........There''s still just a bit of it there, along with that sensation.'
52827: '@rI can do it.@k ......I can still.........do it......'
52828: 'Shannon@r@v15/70500207."............Ah......"'
52829: '@rA single spot of golden light suddenly lit up in this dark room.@k@rIt was right between my clasped hands.'
52830: '@rWhen I slowly opened them,@k ......I could see a single dot that sparkled gold.'
52831: 'Shannon@r@v15/70500208."What...@v15/70500209.......is...@v15/70500210.......?"'
52832: '@rShannon didn''t know what the light meant.'
