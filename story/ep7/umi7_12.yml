52724: '@rIt was like an anime fairy tale I''d seen once as a kid.'
52725: '@rThe happy way the keys danced and spun made it look as though they had a will of their own.'
52726: '@rI could feel the fun of making those keys dance with my fingers wash over me...'
52727: '@rYes, this is...pleasure......'
52728: '@rAs I powerlessly watched the witch control me,@w500. ......I couldn''t help but surrender myself to this new joy called magic......'
52729: 'BEATRICE@r@v32/73700233."Whoops, that''s no good.@k@v32/73700234. If the whole ring disappears, my friend will be suspected again.@k@v32/73700235. ......All we need to disappear is...@v32/73700236....yes, just the key to this room."'
52730: '@rBeato controlled my fingers, controlling the magic.@k ......And thereby controlling the keys.'
52731: '@rThe key ring slumped down on the bed,@k@|@y .........and then just the mansion''s master key stood on end.'
52732: 'BEATRICE@r@v32/73700237."Well now, what shall I do with this?@k@v32/73700238. ......Just erasing it would be terribly dull.@k@|@y@v32/73700239. So, ............*cackle*cackle*!@k @v32/73700240.Why don''t I throw it into her locker?!@k @v32/73700241.That way, I''ll give my friend, who''s been working here with her the whole time, a perfect alibi!"'
52733: 'BEATRICE@r@v32/73700242."Come, try to remember.@k@v32/73700243. Where have you been sleeping?!@k @v32/73700244.Yes, it was a warm, dark place..."'
52734: 'BEATRICE@r@v32/73700245."The inside of Belne''s locker!!@k @|@y@v32/73700246.*cackle*cackle*cackle*!!"'
52735: '@rWhen Beato snapped her fingers, the key burst and became a gold butterfly.'
