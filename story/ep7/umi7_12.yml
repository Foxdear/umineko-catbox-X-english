52778: '@r@v43/72800159."I, I don''t get it?@k@v43/72800160. What''s going on?@k@|@y@v43/72800161. ......My master key''s gone.@k@v43/72800162. Just my master key is gone.@k@v43/72800163. Wh-why...?!@k @v43/72800164.This ring''s so stiff... There''s no way it''d come off......!"'
52779: '@rI could faintly feel that tingling sensation...@kin the tips of my fingers......'
52780: '@rThat night.'
