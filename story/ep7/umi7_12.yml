52772: '@r@v43/72800150."...........................@k@|@y@v43/72800151. ...............Huh......?"'
52773: '@r@v44/72900054."What''s wrong?@k@v44/72900055. Why''re you taking so long?"'
52774: '@r@v43/72800152.".........Huh?@k@v43/72800153. .........Huh? Huh??@k@v43/72800154. ......Wait, are you kidding me?"'
52775: '@r"What''s wrong...?"'
52776: '@r@v43/72800155."......It''s not this one.@k@v43/72800156. ......And it isn''t this one.@k@|@y@v43/72800157. ......Huh?@k @v43/72800158.What the...?"'
