52800: '@rHowever, ......I had no confidence that I could do that anymore.'
52801: '@r"I guess...@k.........I can''t become like you after all."'
52802: 'Shannon@r@v15/70500193."......What do you mean?@k@v15/70500194. This is a bit abrupt."'
52803: '@r"You were my ideal.@k Always."'
52804: 'Shannon@r@v15/70500195.".........Yeah."'
52805: '@r"At the Gospel House, you were kind to everyone and loved by everyone.@k ......You would always play with me, and you were my only friend.@k And at the Ushiromiya mansion, you were a wonderful servant, who could carry out any task flawlessly and gracefully.@k My idol and goal.@k ......That''s what you were."'
52806: 'Shannon@r@v15/70500196."Yeah.@k@v15/70500197. ......Let''s give it our all together.@k@v15/70500198. As they say, perseverance prevails.@k@v15/70500199. You''re gaining recognition from everyone now.@k@v15/70500200. So let''s aim to become wonderful servants together."'
