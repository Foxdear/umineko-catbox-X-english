52763: '@r......But, with magic...'
52764: '@rWith just a little dance of the keys and a butterfly popping, ......it had disappeared.'
52765: '@r@v44/72900051."Alright, fingertip inspection!@k @v44/72900052.Bed, okay.@k@v44/72900053. Curtains, okay!"'
52766: '@r@v43/72800144."Tools, okay.@|@y@v43/72800145. And keys too!@|@y@k @v43/72800146.See?@k @v43/72800147.Nothing wrong, right?"'
52767: '@r"Y-yes, that''s good......@k Then let''s go on to the next room.@k ......Ah, ......Belne-san.@k Could you......lock up this room for me?"'
52768: '@r@v43/72800148."Hmm?@k @v43/72800149.Su~re."'
52769: '@r.........Did Belne-san''s key...@w500....really disappear by magic?'
52770: '@rWas that fun magic just a daydream I had......?'
