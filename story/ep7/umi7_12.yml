52849: '@r@v55/75500329."This is magic.@k@v55/75500330. .........It''s really fun."'
52850: 'Shannon@r@v15/70500212."M-.........magic............"'
52851: '@r@v55/75500331."Yeah.@k@v55/75500332. Magic.@k@v55/75500333. ......I was able to use it just now because there was still a little left in my fingers.@k@v55/75500334. ......But if I became a real witch, ......I''d be able to use it whenever and however I wanted......to do anything.@k@v55/75500335. Now that I''ve learned how fun this can be,@k@v55/75500336. I don''t want to go back to being Human.@k@v55/75500337. Being a servant is just too boring.@k@v55/75500338. So, ......I''m going to become a witch."'
