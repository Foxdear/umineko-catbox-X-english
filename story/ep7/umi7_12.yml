52884: '@rI need a different look than the witch in the demon-red dress.@k@rA white, noble witch.'
52885: '@r......Unlike the time with the red witch, I''m thinking about my own look now,@k ......so I''d like to make it beautiful and......cute if I can.'
52886: '@rA white dress.@k A noble look.@k@rLike one of noble blood, but with a dark, sarcastic streak......'
52887: '@rNo, she''s like a tomboy princess, so her voice is a mix of formality and rudeness.'
52888: '@rThen the dress should be the exact opposite, pure and clean, to make a nice contrast......'
52889: 'BEATRICE@r@v55/75500380."..............................@k@v55/75500381. ......How does this form suit me?"'
