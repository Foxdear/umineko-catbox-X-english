52744: '@rIt was the completely alien concept...called magic.@k@rA completely unknown pleasure that left me in a trance.'
52745: 'BEATRICE@r@v32/73700247."......It is done, my friend.@k@v32/73700248. I shall return this body to you..."'
52746: '@rNn, ..................ah......'
52747: '@r"..........................."'
52748: '@rIt felt as though I had been spinning through space,@k and gravity had suddenly come back and thrown me to the ground.'
52749: '@rLike when you''re having a great dream, but you''re suddenly woken up,@k ......and all you can remember about the dream was that it was fun.@k ......That sort of lonely feeling.'
52750: '@rThough Beato had been borrowing my body, it was my own body that used magic.'
52751: '@rI could still feel that sensation in my hands.'
52752: '@rThe key ring over there had danced along with the movements of my fingers.'
