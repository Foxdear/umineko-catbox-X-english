52861: '@r@v55/75500350."......Shannon can just be Shannon, and stay as a respected servant.@k@v55/75500351. She''ll stay the same.@k@v55/75500352. But from now on, it won''t be the two of us together, but her alone."'
52862: 'BEATRICE@r@v32/73700253."Partings can be so sudden.@k@v32/73700056. ......Ah, well.@k@v32/73700255. Being fickle makes life more entertaining.@k@v32/73700256. Then what will you do instead?"'
