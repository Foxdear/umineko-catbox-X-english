52542: '@rThe months and years slid by.'
52543: '@rIn my new, more colorful life, I smiled at the spring sunshine peeking through the trees, gazed up at the column of summer clouds,@k enjoyed the piles of fallen leaves in autumn, and played in the winter snow the few times it did fall.'
52544: '@rAs these days passed one after another, there was a considerable change to my environment.'
52545: '@rThat was a complete rotation in the servants from the Gospel House.'
52546: '@rThere weren''t specific grades like in school, so there was no rule saying how long a servant could work before quitting.'
52547: '@rEach servant made their own decision about when they would "graduate" from Rokkenjima.'
52548: '@rSome of those who couldn''t stand the environment would quit in as little as three days.'
52549: '@rAfter all, life on Rokkenjima was strict.'
52550: '@rIt was also strict in the Gospel House, of course, but there were a lot of Rokkenjima-only rules,@k and Natsuhi, the one who supervised the servants, was also very authoritarian.@k It was probably easy to feel constrained.'
52551: '@rThat constrained feeling and the money sat on opposite sides of the scale that they used to decide the time of their graduation.'
52552: '@rAnd sometimes, someone from the Ushiromiya family would use their influence to secure someone a new job, encouraging them to spread their wings and start a new life.'
52553: '@rThe cycle usually lasted two or three years.'
52554: '@rNo one decided this, but it was one of the goals most servants shot for, an unspoken rule.'
52555: '@rHowever, I was an exception to that rule.'
52556: '@rI continued to live as a servant while going to school in Niijima......'
52557: '@rThat year, all of the Gospel House servants quit at once.'
52558: '@rIt wasn''t at all rare for friends to quit at the same time as each other.'
52559: '@rAll of my fellow servants from the Gospel House graduated from the island at once, leaving only me behind...'
52560: '@rOf course, I hadn''t been on particularly good terms with them.'
52561: '@rOn the contrary, it was annoying to be treated like a kid and called Yasu all the time.'
52562: '@rEven when new servants had joined,@k the older ones got them believing that "Yasu loses things all the time",@k so things had still been unpleasant even then.'
52563: '@rThose unpleasant older servants, as well as the ones who started at the same time or after I did, all quit at once.'
52564: '@rThe Ushiromiya family had no quarrel with those who left.@k Adult servants were easier to handle in the first place.'
52565: '@rThe Gospel House servants were only accepted so that they could be trained.'
52566: '@rSo, all of the servants except for me left, and no one tried to stop them......'
52567: '@r@v38/72300044."Later, Yasu.@k@v38/72300045. Don''t go losing stuff again."'
52568: '@r"......I don''t lose things anymore."'
52569: '@r@v38/72300046."Hmph, later.@k@v38/72300047. Make sure you listen to what Madam says.@k@v38/72300048. Don''t you go troubling the next group of servants."'
52570: '@r@v39/72400023."......You know, it''s still a mystery.@k@v39/72400024. Why did someone recommend Yasu?"'
52571: '@r@v40/72500027."It''s even more surprising that Madam let Yasu stay this long."'
52572: '@r@v41/72600008."Hey, at least the kid''s got the guts to not give up and run away.@k@|@y@v41/72600009. Keep it up, Yasu."'
52573: '@r"I, I......hate being called Yasu..."'
52574: '@rAt the very end, ......I finally said the one thing I''d always wanted to say to them.'
52575: '@rHowever, they basically ignored me, and just picked up their things and left...'
52576: '@r"........................"'
52577: 'Shannon@r@v15/70500160."......Guess you never got a chance to become friends with them."'
52578: '@r"I wouldn''t even want to."'
52579: 'Shannon@r@v15/70500161."Yep.@k@v15/70500162. I''m sure they feel the same way, so you''re even.@k@|@y@v15/70500163. Just forget about those people.@k@v15/70500164. They don''t have anything to do with you anymore.@k@v15/70500165. So, there''s no reason to give them any more thought."'
52580: '@r"............Yeah.@k ......You''re right."'
52581: '@rI felt just a bit disappointed.'
52582: '@rI was never able to get them to acknowledge that I''d become a fully-fledged servant who could take care of myself.'
52583: 'Shannon@r@v15/70500166."It''s hard for people to throw off their first impressions.@k@v15/70500167. ......That''s just how it is.@k@|@y@v15/70500168. No matter how wonderful a person you grow into,@k@v15/70500169. they would probably always call you Yasu and make fun of you.@k@v15/70500170. There''s no reason for you to seek their validation."'
52584: '@r"......Yes.@k Yeah, you''re right, Shannon.@k I''ll completely forget about those people."'
52585: 'Shannon@r@v15/70500171."Good.@k@v15/70500172. You have two great friends, Kumasawa-san and me.@k@v15/70500173. And when the new servants come, you can show them from the start that you can take care of yourself."'
52586: '@rShannon was exactly right.'
52587: '@rI regained a sense of confidence and pride that I hadn''t felt since that day when I held the key with the spiderweb charm up high.'
52588: '@r......I am now the most experienced Gospel House servant.'
52589: '@rThe new servants who come will still probably be older than me,@k but I need to teach them the ropes as the more experienced servant.'
52590: '@rGenji-sama even told me to guide the newer servants...'
52591: '@rOkay.@k ......I''ll give it my all.'
52592: 'Shannon@r@v15/70500174."That''s the right attitude.@k@v15/70500175. Let''s give it our all together."'
52593: '@r"Yeah!"'
52594: '@r@v44/72900001."My name is @bAsne.@<明日音@>.@k@v44/72900002. Pleased to meet you."'
52595: '@r@v43/72800001."My name is @bBelne.@<鐘音@>.@k@v43/72800002. Pleased to meet you."'
52596: '@r......................'
52597: '@rThe newly arrived servants looked......a bit frivolous.'
52598: '@rWhen I first joined the Ushiromiya family, I was incredibly nervous.'
52599: '@rHowever, I couldn''t see any trace of that nervousness on these girls...'
52600: 'Shannon@r@v15/70500176."Yes.@k@v15/70500177. Usually, kids with good grades and behavior were selected."'
52601: 'Zepar@r@v51/75100065."How are they selected?@k @v51/75100066.Who chooses?"'
52602: 'Shannon@r@v15/70500178."People from the board of directors come and interview them.@k@v15/70500179. And other things are considered like their everyday conduct..."'
52603: 'Furfur@r@v52/75200069."So! As long as they acted like good kids in front of the adults, they could pass?"'
52604: 'Shannon@r@v15/70500180."......Well,@v15/70500181. ummm,@v15/70500182. ......there were times that they passed because the adults thought they looked suitable..."'
52605: 'Clair@r@v55/75500272."All of the children who came from the Gospel House were highly individualistic.@k@v55/75500273. Their rough edges would be sanded down as they worked as servants,@k@v55/75500274. and eventually they would grow to be servants who would not shame the Ushiromiya family."'
52606: 'Clair@r@v55/75500275."However, it was the role of the more experienced servants to encourage this model behavior.@k@v55/75500276. ......Since I was now the only one with experience, it was my responsibility to guide them."'
52607: 'Zepar@r@v51/75100067."What were the new kids like?"'
52608: 'Furfur@r@v52/75200070."Elites, no doubt?!@k @v52/75200071.Of irreproachable conduct!"'
52609: 'Shannon@r@v15/70500183."......I think they were like that when Madam and Genji-sama were around.@k@v15/70500184. However,@v15/70500185. ......when their superiors weren''t around, well,@v15/70500186. ......they didn''t take things quite as seriously..."'
52610: 'Shannon@r@v15/70500187."Asne-san...@k@v15/70500188. Make sure you put your tools on the cart when you''re done using them."'
52611: '@r@v44/72900003."Kyahhahahahaha!@k @|@y@v44/72900004.......Huh?@k @v44/72900005.Su~re. So~rry."'
52612: '@rAs an experienced servant, I also gave them a warning.'
52613: '@r"And Belne-san, you shouldn''t set your key down in a place like that.@k You''ll lose it."'
52614: '@r@v43/72800003."I''m not gonna lose it.@k@v43/72800004. I never forget where I put things."'
52615: '@rWhen I first arrived here, the older servants would often tell me off just as I was doing now.'
52616: '@rThey would probably have been far more mean and obnoxious about it.'
52617: '@rI had hated that, so I tried to be more gentle when admonishing them, but they wouldn''t take me seriously...'
52618: '@r"L-listen up.@k You know there''s a witch living in the mansion, don''t you...?"'
52619: '@r@v43/72800005."Oooh, BEATRICE~!"'
52620: '@r@v44/72900006."Kyahahahaha! That sounded just like him!"'
52621: '@r@v43/72800006."Shannon-chan,@k@v43/72800007. don''t tell me you believe in that too?"'
52622: 'Shannon@r@v15/70500189."Y-yes, she really exists...@k@v15/70500190. If you leave things lying around, the witch will prank you and hide them..."'
52623: '@r"It''s true.@k It''s gotten me into trouble many times..."'
52624: '@r@v44/72900007."A witch hiding things?"'
52625: '@r@v43/72800008."That''s totally impossible."'
52626: '@r@v44/72900008."I mean, come on, witches?"'
52627: '@r@v43/72800009."They don''t even exist!@k @|@y@v43/72800010.Kyahhahahahaha!"'
52628: '@r@v44/72900009."They don''t exist.@k@v44/72900010. ......Witches."'
52629: '@r@v43/72800011."......I thought they were just pranks.@k@v43/72800012. No, ......I think it just gave me peace of mind to think of them that way......while I still could."'
52630: 'Zepar@r@v51/75100068."Do you think the witch BEATRICE actually existed...?"'
52631: '@r@v44/72900011."I don''t believe it."'
52632: '@r@v43/72800013."......I don''t know if it was BEATRICE,@k@|@y@v43/72800014. but I do think that something that wasn''t human...@k@v43/72800015....really did exist in that mansion."'
52633: 'Furfur@r@v52/75200072."Do you think there''s a chance that this non-human thing was BEATRICE...?"'
52634: '@r@v44/72900012."Ridiculous."'
52635: '@r@v43/72800016."......I wish I could say it was ridiculous."'
52636: '@r@v44/72900013."That must have been a prank of Yasu''s. No, not a prank, revenge."'
52637: '@r@v43/72800017."I did think that at first, but......"'
52638: 'Zepar@r@v51/75100069."Did something happen that couldn''t be explained away as a prank...?"'
52639: '@r@v43/72800018."......It was persistent.@k@v43/72800019. ......And creepy."'
52640: 'Furfur@r@v52/75200073."Specifically, what sorts of things happened?"'
52641: '@r@v43/72800020."Things I set down would disappear as soon as I looked away for a second."'
52642: '@r@v44/72900014."Didn''t Yasu just hide them?"'
52643: '@r@v43/72800021."I thought so at first.@k@v43/72800022. It was only natural to think that.@k@v43/72800023. But I started getting this feeling that something wasn''t right.@k@v43/72800024. I kept thinking...would a timid kid like that really pull such nasty pranks?"'
52644: 'Zepar@r@v51/75100070."Can you tell us what happened?"'
52645: '@r@v43/72800025."......When my key ring disappeared, it was easy to think that Yasu snatched it when I wasn''t looking.@k@v43/72800026. ......But when just a single key disappeared off that key ring...@k@v43/72800027.and reappeared somewhere impossible, I couldn''t think of it that way."'
52646: '@r@v44/72900015."Maybe Yasu just pulled that one key off while you weren''t looking...?"'
52647: '@r@v43/72800028."Is that even possible?! Practically speaking?!@k @v43/72800029.Quickly hiding the whole ring is one thing,@k@v43/72800030. but if you really think about it, taking a single key off a key ring isn''t that easy!@k @v43/72800031.The keys would jingle and jangle.@k@v43/72800032. I was standing right next to them, facing the other way!@k @v43/72800033.If someone had taken their time to carefully remove a key when I was that close, even an idiot like me would''ve noticed!"'
52648: '@r@v43/72800034."But a single key just vanished without a sound.@k@v43/72800035. ......At that moment, I finally realized.@k@v43/72800036. This wasn''t Yasu trying to get back at me,@v43/72800037. ......it was something...@v43/72800038....worse...@v43/72800039.than that."'
52649: 'Furfur@r@v52/75200074."And where did you find this disappearing key?"'
52650: '@r@v43/72800040."It was...@v43/72800041.......in my locker."'
52651: '@r@v44/72900016."Belne, you''re such a ditz sometimes...@k@v44/72900017. Are you sure you didn''t just take that key off yourself and forget that you put it in your locker......?"'
52652: '@r@v43/72800042."Why would I take that one key off the ring?!@k @v43/72800043.Have you ever taken a key off your key ring, Asne, or put one on?!@k @v43/72800044.I tried doing it myself.@k@v43/72800045. It''s really stiff!@k @v43/72800046.I would never go to all that trouble.@k @v43/72800047.There''s no point in it!@k @v43/72800048.Am I a sleepwalker or something?!@k @v43/72800049.How could I not remember something I''d done?!"'
52653: '@r@v43/72800050."I may be stupid, but I''m not that stupid!@k @v43/72800051.I don''t forget about things I do that easily!!@k @v43/72800052.And anyway, I know I had my key with me when I entered the room!@k @v43/72800053.Otherwise, how could I have unlocked the door?!"'
52654: '@r@v44/72900018."......Okay then...@k@v44/72900019. Being careful not to make any sound,@k@v44/72900020. Yasu must have, um,@v44/72900021. ...slipped the key off,@v44/72900022. and hid it in your locker..."'
52655: '@r@v43/72800054."That''s what I thought at first!@k @v43/72800055.I jumped at Yasu, telling that kid not to mess with me!@k @v43/72800056.But even as I said it, I realized.@k@v43/72800057. Isn''t there something completely wrong here?!"'
52656: '@r@v43/72800058."I mean, we were with Yasu the whole time that day as we went around cleaning the rooms, right?!@k @v43/72800059.There''s no way Yasu had enough time to take a jangly key off the ring!@k @v43/72800060.It was impossible for Yasu!@k @v43/72800061.In fact, that would have been impossible for anyone, to remove just a single key in that short amount of time without making a sound!!"'
52657: '@r@v44/72900023."M-maybe the ring was missing a master key when you got it..."'
52658: '@r@v43/72800062."I already told you!!@|@y@k @v43/72800063.The key really was there in the beginning!@k @v43/72800064.I was the one who unlocked that room!@k @v43/72800065.So it must have been there!@k @v43/72800066.......And then, I went into the room!@k @v43/72800067.I''m an idiot who hates hearing the keys clattering around, so I placed the ring on the bed...!"'
52659: '@r@v43/72800068."Then, when we finished cleaning, I picked up the ring, tried to lock the door, and it was gone!@k @v43/72800069.I may have turned my back on the ring, but it was right next to me!@k @v43/72800070.So, if someone tried to pull a prank by removing just one key, I''d have heard the clinking!@k @v43/72800071.And yet, just the key for that room vanished and appeared again in my locker!!"'
52660: '@r@v43/72800072."......So okay, let''s say that Yasu managed to sneak it away.@k@v43/72800073. It''s less stressful to imagine.@k@v43/72800074. ......But still!@k @v43/72800075.How could Yasu have put it in my locker, then?!@k @v43/72800076.We were together with Yasu the whole time, right?!@k @v43/72800077.When I started yelling about it being gone and ran all over the place looking for it, Yasu was with me until the moment I found it in my locker, get it?!"'
52661: '@r@v43/72800078."I''m telling you it''s impossible!!@|@y@k @v43/72800079.Even as I jumped at Yasu, I began to feel it.@k@v43/72800080. I mean, Yasu''s eyes seemed to be saying it silently.@k@v43/72800081. ......According to Yasu, the reason things used to go missing all the time...@k@v43/72800082.wasn''t because Yasu was forgetful, as everyone said, ......but actually...@k@v43/72800083.......because impossible things would suddenly happen, just like they had to me,@k@v43/72800084. ......and.........and...!"'
52662: 'Furfur@r@v52/75200075."......Yasu was with you the whole time, so there was no chance for Yasu to put the key in the locker?"'
52663: 'Zepar@r@v51/75100071."Did other strange things like that happen?"'
52664: '@r@v43/72800085."Yeah, they did.@k@v43/72800086. More stuff went missing, but not just that... Things kept happening, over and over...@k@v43/72800087. ......Of course, I started getting nervous and being careful not to just leave stuff lying around, ......but that didn''t help."'
52665: '@r@v43/72800088."......At first, I was angry at Yasu,@k@v43/72800089. ......but at some point, I began to realize that I was mistaken.@k@v43/72800090. One time, a key even disappeared from a ring that was in my pocket!@k @v43/72800091.Then, I realized.@k@v43/72800092. ......These weren''t Yasu''s pranks.@k@v43/72800093. The same thing that had happened to Yasu was now happening to me...!"'
52666: '@r@v44/72900024."C-calm down a bit...@k@v44/72900025. I think some of those were Yasu''s pranks,@k@v44/72900026. ...and the others were just you being clumsy.@k@v44/72900027. ......It''s true that the mansion''s always dark and eerie,@k@v44/72900028. ......and it does feel like the sort of place you''d find a curse.@k@v44/72900029. I''m sure that''s what made you scared like that..."'
52667: '@r@v43/72800094."You saw it too, didn''t you?!@|@y@k @v43/72800095.Remember that white shadow we saw vanish into the VIP room that rainy day?!"'
52668: '@r@v44/72900030."......Y-yes, I saw,@k@v44/72900031. but couldn''t that just have been Madam or Milady wearing something white...?"'
52669: '@r@v43/72800096."What do you mean, something white?!@|@y@k @v43/72800097.Have you ever seen either of them wearing something like that?!@k @v43/72800098.And besides, that VIP room is always locked!@k @v43/72800099.They don''t have keys to it!@k @v43/72800100.That had to have been some kind of ghost or evil spirit...@k@v43/72800101....no, the silhouette of the witch!"'
52670: '@r@v44/72900032."........................@k@v44/72900033. ......Ha...hahaha...@k@|@y@v44/72900034. So, as you can see, ......Belne started acting like this at one point.@k@v44/72900035. Totally scared.@k@v44/72900036. ......I''ve got more street smarts than her,@k@v44/72900037. so the more scared she became, the more strongly I felt that this whole thing was stupid and witches couldn''t exist."'
52671: '@r@v44/72900038."......Still, I had to be careful about what I said.@k@v44/72900039. ......I mean, I was starting to realize that this wasn''t something I should talk about carelessly.@k@v44/72900040. ......All ghost stories and curses sound stupid to outsiders.@k@v44/72900041. ......But to the people who believe in them, it''s absolutely not a joking matter.@k@v44/72900042. It really was......no joke."'
52672: '@r@v43/72800102."......Asne didn''t believe a word of what I said.@k@v43/72800103. So, I eventually stopped telling Asne about it......and confessed to Yasu instead.@k@v43/72800104. I told Yasu "I thought you were the culprit, but it couldn''t have been you".@k@v43/72800105. I said that something...@v43/72800106....strange...was happening to me...!"'
52673: 'Zepar@r@v51/75100072."......And what was the reply?"'
52674: '@r@v43/72800107."Yasu said that the same thing had happened many times before, but no one would believe it...!@k @v43/72800108.Besides, even though the older servants always made fun of Yasu, I knew that Yasu wasn''t as clumsy or stupid as they said."'
52675: '@r@v43/72800109."I hated being bossed around by a younger person, so I always fought back, but Yasu did have the job pretty much down pat.@k@v43/72800110. I''d always thought it strange that people made so much fun of Yasu for losing things...!"'
52676: '@r@v43/72800111."I was then sure.@k@v43/72800112. It "existed"!@k @v43/72800113.Some strange, inhuman thing "existed" in this mansion!"'
52677: 'Furfur@r@v52/75200076."And that was the witch BEATRICE...?"'
52678: '@r@v43/72800114."If BEATRICE is what you want to call it, then I believe in BEATRICE!@k@v43/72800115. Anyway, something that can''t be explained away by human actions definitely "existed" there!@k @v43/72800116.People who didn''t understand kept calling Yasu and me forgetful!@k @v43/72800117.They didn''t get it... They just didn''t get it!!"'
52679: '@r@v44/72900043."......B-but still,@k@v44/72900044. ......you got a little scared, but it spooked you into shaping up, didn''t it?@k@v44/72900045. And then all that fuss about you losing things went away, right...?@k @v44/72900046.So it must have been your imagination all the time......"'
52680: '@r@v43/72800118."You''re wrong!!@k @v43/72800119.I talked to Yasu, Shannon, and Kumasawa-san about it!@k @v43/72800120.And they said that the witch really did exist...@k@v43/72800121. That all the old servants make sure to respect her!"'
52681: '@r@v43/72800122."They said I had been cursed because I''d stupidly gone around saying that BEATRICE didn''t exist...!@k @v43/72800123.So I reformed!@k @v43/72800124.Yasu taught me how to give offerings to the doll in the VIP room!@k @v43/72800125.I asked Genji-sama for permission and prayed at the shrine on the reef!@k @v43/72800126.And then it all stopped, all at once!!"'
52682: '@r@v43/72800127."You were okay, Asne, since you stopped making fun of the witch,@k@v43/72800128. but if you''d cluelessly gone on making fun of her, you would surely have been cursed next!@k @v43/72800129.Yes, I guarantee it! You definitely would have been cursed...!!"'
52683: '@r@v44/72900047.".........Yeah,@v44/72900048. .....that kind of stuff makes even me uncomfortable...@k@v44/72900049. ......Though I''d never say it to their faces..."'
52684: '@r@v43/72800130."You just don''t get it!@|@y@k @v43/72800131.You really don''t!!@k@|@y @v43/72800132.So, I made sure to teach all the newer servants well!@k @v43/72800133.A witch called BEATRICE-sama lives in this mansion...!@k @v43/72800134.If you make fun of her, you really will be cursed...!!"'
52685: '@r@v44/72900050_o.".....................Belne..."'
52686: '@r@v43/72800135."When things, you know, ......disappear, that''s a sign that the witch is close by and watching us...@k@v43/72800136. If you say it''s a prank, or that witches aren''t real,@k @v43/72800137.you''ll be cursed even more...!!@k @v43/72800138.It was like that for both Yasu and me!@k @v43/72800139.Whenever a key vanishes,@v43/72800140. ......that''s a sign that the witch has appeared...!!"'
52687: '@rBelne-san carelessly tossed her key ring on the bed again, humming as she started to clean...'
52688: '@rNo matter how much I warn her, she doesn''t change her ways.@k She''s always making fun of me and calling me Yasu, so she won''t listen to what I tell her......'
52689: '@rWhy won''t she listen to what I say...?'
52690: '@rYou mustn''t leave things lying carelessly about.@k If you lower your guard, the witch will prank you......'
52691: 'BEATRICE@r@v32/73700208."......Ahyahhyahhya!@k @v32/73700209.Look at that delicious key ring lying out there in the open......"'
52692: '@r"St-stop it, please...!@k That''s Belne-san''s key!@k Keep your pranking to me alone.@k Let the others be......!"'
52693: 'BEATRICE@r@v32/73700210."You have become so cautious lately that you are no longer fun.@k@v32/73700211. ......*cackle*cackle*, I jest, of course."'
52694: 'BEATRICE@r@v32/73700212."Still, how unpleasant these people are, refusing to listen to my friend''s kindly advice.@k@v32/73700213. Any insult to my friend, I take as an insult to myself...!"'
52695: '@r"......Are you planning to steal Belne-san''s key...?@k Please, don''t do it...!@k She''ll think I hid it again...!"'
52696: 'BEATRICE@r@v32/73700214."She thinks my magic is naught but the work of a child like you...?!@k @v32/73700215.*cackle*cackle*, very well, then.@k@v32/73700216. I shall simply show her a feat impossible for Humans to perform...!"'
52697: 'BEATRICE@r@v32/73700217."I shall show her my magic!!@k @v32/73700218.Foolish Belne, if that is your name!@k @v32/73700219.You will regret that you did not heed the warnings given you by my friend!@k@v32/73700220. This flimsy body of mine will not do the trick! I''m borrowing yours!!@k @v32/73700221.It''s been too long since I last demonstrated real magic!@k @v32/73700222.Let my body return for a spell......to the land of the living!"'
52698: '@r"Huh?@k Ah, ..................!"@|@y'
52699: '@rA shiver ran up my whole body like an electric shock.'
52700: '@rFrom that moment onwards, ......I couldn''t move any part of my body by my own will.'
52701: '@rLike a moment of shock after a blackout,@k I could do nothing but accept the fact that I had lost control over my body......'
52702: '@rAll of the cells throughout my body felt tingly.@k ......It felt as though my body had been transformed into someone else''s.'
52703: '@r......I realized that the witch BEATRICE was using my body as a vessel to revive for a short period of time...'
52704: 'BEATRICE@r@v32/73700223."......Hmm, very nice.@k@v32/73700224. That ticklish feeling of the air on my skin... Having a body is simply wonderful!"'
52705: '@rWh-......what are you trying to do?!@k Please, don''t do anything mean......'
52706: '@rThis time, everything was backwards.@k My words were spoken inside my heart.@k And the witch''s voice was coming out of my mouth...!'
52707: 'BEATRICE@r@v32/73700225."Fear not.@k@v32/73700226. I will return your body soon enough.@k@v32/73700227. I just need to teach her a lesson with a little prank.@k@v32/73700228. However, it will not be one so simple that suspicion could fall on you...!@k @|@y@v32/73700229.Come, try to remember.@k@v32/73700230. Where have you been sleeping?!"'
52708: '@rEverything went completely white and my mind stopped.'
52709: '@rOnce again, that tingling sensation slid up my body.'
52710: '@rI could feel it all gather in the fingers of both my hands, ......and come out through my fingertips.'
52711: '@rIt was an incomprehensible,@w500. indescribable,@w500. ......unknown sensation.'
52712: '@rMy head went blank, and I couldn''t think at all.'
52713: '@rI could do nothing......but abandon my soul to the sensation.'
52714: '@rI finally understood.'
52715: '@rThis is...@w583.......what it''s like...@w250.to use magic......'
52716: 'BEATRICE@r@v32/73700231."Come, try to remember.@k@v32/73700232. Where have you been sleeping......?"'
52717: '@rMy fingers moved like a puppet''s, and danced around as though I was a conductor—not of music, but of magic.'
52718: '@rI never knew that having my body move without my control could be so exciting...'
52719: '@rWhen Beato lifted my finger as if a string was attached to it,@k the key ring lying on the bed stood on end.'
52720: '@r......Belne-san...didn''t notice.@k ......Neither did Asne-san.'
52721: '@rThey were fully occupied by their happy chat as they cleaned the room...'
