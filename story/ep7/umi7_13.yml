52998: 'Shannon@r@v15/70500229."Did you check the bathroom amenities?"'
52999: '@r@v42/72700001."Yep, went down the whole list."'
53000: 'Shannon@r@v15/70500230."Did you make sure they were facing the right way when you set them down?"'
53001: '@r@v42/72700002."Yes, of course.@k@v42/72700003. Everything''s as the list says."'
53002: 'Shannon@r@v15/70500231."*giggle*, thanks.@k@v15/70500232. Genji-sama, the guest rooms are ready now."'
53003: 'Genji@r@v14/71600059."Good work.@k@v14/71600060. Make sure you check over everything with your own eyes, Shannon.@k@v14/71600061. Also, Madam has ordered us to change the tablecloth in the dining hall again."'
53004: 'Kumasawa@r@v18/71800127."My, my. Why again, when we all worked so hard to change it earlier today...?"'
53005: 'Natsuhi@r@v03/70900037."The color of that tablecloth simply does not fit.@k@v03/70900038. Once I saw it against the backdrop of the room, I could see that it matched terribly.@k@v03/70900039. We should use a different tablecloth."'
53006: 'Natsuhi@r@v03/70900040."Oh, and you did make sure to clean the chandelier in the parlor, correct?@k@v03/70900041. Last time, Eva-san looked up and said "Oh, is that dust? And even a cobweb?"@k @v03/70900042.That incident must never be repeated...!"'
53007: 'Genji@r@v14/71600062."Do not worry.@k@v14/71600063. It has already been carefully cleaned and checked.@k@v14/71600064. I will now perform a final check on everything myself."'
53008: 'Natsuhi@r@v03/70900043."Is that so? Very well.@k@v03/70900044. I will do the same.@k@v03/70900045. Shannon, take the young servants and prepare a new tablecloth.@k@v03/70900046. Try to find something white, with a bit more of a clean feeling."'
53009: 'Shannon@r@v15/70500233."Y-yes, as you wish."'
53010: '@rNatsuhi was even more high-strung than normal and walked about barking orders here and there.'
53011: '@rEven though the sky was beginning to get dark, the servants moved hurriedly about.'
53012: '@rTomorrow would be the annual family conference.'
53013: '@rIt wasn''t particularly rare for the siblings'' individual families to visit the island, but this was the only time that they would all come together.'
53014: '@rIt was the most important day of the year for both the Ushiromiya family and Rokkenjima.'
53015: '@rNatsuhi, who was short-tempered on top of being high-strung, kept issuing orders one after another,@k only to later change her mind or ask for the work to be done again, keeping the servants busy until late into the night.'
53016: '@rShannon now had many years of experience and Natsuhi had put her in a position of responsibility,@k which meant that she was frequently called over to be given all kinds of strict orders...'
53017: '@rSo, when Shannon finished her shower and lay down on the bed in the servants'' quarters, she fell into a deep sleep almost immediately......'
53018: '@r......I can hear the sound of wind...coming from somewhere far away.'
53019: '@r............It''s a bit different from the sound wind outside a room would make.'
53020: '@rIt''s almost as though......I''m sitting in a deck chair in the rose garden,@k turning over in my sleep, ......with the feel of the wind in my hair.'
53021: '@rThat''s right, the feel.@k ......This isn''t a sound, it''s a feeling.'
53022: '@rThen is this...@w500....a dream......?'
53023: '@rJust as I was about to accept this theory, ......I thought I heard someone talking to me.'
53024: '@r——My, my.@k It seems the work of a servant is just as boring as it ever was.'
53025: '@rNot only boring, but difficult, strict, constraining, joyless...'
53026: '@rAll you get in return for your years of service is some level of respect from the newer servants.'
53027: '@rAnd even that is far from sufficient to repay you for all the hard work you''ve done...'
53028: '@r@v55/75500420."Do you not tire...@k@v55/75500421.of such a life?"'
53029: '@rHuh? ......Who......?'
53030: '@rShe wasn''t just imagining someone talking to her.@k ......She was shocked to find that it was real.'
53031: '@rWhen Shannon opened her eyes, ......she gulped.'
53032: 'Shannon@r@v15/70500234."Th-@v15/70500235.......this place..............."'
53033: '@rShe couldn''t say any more.@k .........She was literally stunned silent.'
53034: '@rShannon, who had been sleeping on a bed, ......was somehow in a rose garden.'
53035: '@rHowever, though this rose garden somehow resembled the rose garden on Rokkenjima, it was also completely different.'
53036: '@rAfter all, ......the roses were golden.@k@rNot only the flowers, but the dancing butterflies too.'
53037: '@rIt was a golden rose garden of mysterious beauty.'
53038: '@rSomehow, Shannon was sitting in the chair under the arbor.@k@rIt was as though she''d taken a nap there and woken up from a dream.'
53039: '@r......But it felt strange.'
53040: '@rIs this golden rose garden a dream?'
53041: '@rFor some strange reason, it even felt as though my entire life up to this point had been a dream,@k and that I had finally awakened here...'
53042: '@r@v55/75500422."Welcome, Shannon.@k@v55/75500423. Welcome to my golden rose garden......"'
53043: '@rThere was that voice again.@k Shannon looked around to find who it was.'
53044: '@rAs she did, a golden butterfly landed on the seat across from her and instantly created a human form...'
53045: 'BEATRICE@r@v55/75500424."It has been quite some time, Shannon.@k@v55/75500425. Have you been well...?@k @v55/75500426.Of course, I know already that you have.@k@v55/75500427. After all, I have been watching all of you, every day."'
53046: '@rThis woman laughed as though she was an old friend of Shannon''s.'
53047: '@rHowever, Shannon obviously didn''t remember this strange gold rose garden, and she didn''t remember this person''s face either...'
53048: 'BEATRICE@r@v55/75500428."Indeed.@k@v55/75500429. You no longer remember me, do you?"'
53049: 'Shannon@r@v15/70500236.".........Have I forgotten about you...?@k @v15/70500237.If so, please forgive me..."'
53050: 'BEATRICE@r@v55/75500430."There is no need to apologize.@k@v55/75500431. I made you that way, so it is no sin of yours.@k@|@y@v55/75500432. ......Allow me to introduce myself.@k@v55/75500433. I am the Golden Witch, BEATRICE."'
53051: 'Shannon@r@v15/70500238."......B-Beatrice...sama......?@k @v15/70500239.Th-the benefactor of the Ushiromiya family, whom the Master always speaks of......?"'
53052: 'BEATRICE@r@v55/75500434."Not that Beatrice.@k@v55/75500435. I am BEATRICE the Golden Witch, the one who controls Rokkenjima''s night.@k@v55/75500436. ......I am the other master of the mansion, the one you always pay homage to."'
53053: 'Shannon@r@v15/70500240."Y-@v15/70500241.......you are...@v15/70500242....BEATRICE...@v15/70500243.sama........."'
53054: 'BEATRICE@r@v55/75500437."Hahaha...@k@v55/75500438. You need not fear.@k@v55/75500439. The two of us used to be friends—no, roommates, did we not?@k@v55/75500440. At one time, I idolized you and tried to be the best servant I could."'
53055: 'Shannon@r@v15/70500244.".........I''ve always had a single-person room, so I couldn''t have had a......"'
53056: 'BEATRICE@r@v55/75500441."When we last parted, I stole away your memory.@k@v55/75500442. However, I have not forgotten that we were once roommates.@k@v55/75500443. ......I also remember that I was the one who destroyed our friendship and left."'
53057: 'BEATRICE@r@v55/75500444."So as to not leave you alone in sadness,@k@v55/75500445. I erased all of your memories and the very world of our days together."'
53058: 'Shannon@r@v15/70500245."...................................."'
53059: 'BEATRICE@r@v55/75500446."You do not need to understand...@k@v55/75500447. But believe this.@k@v55/75500448. I have not called you here to do you harm."'
53060: 'Shannon@r@v15/70500246."I-isn''t this inside one of my dreams...?"'
53061: 'BEATRICE@r@v55/75500449."You may think of it that way.@k@v55/75500450. Strictly speaking, I beckoned your soul to my garden while you were sleeping.@k@v55/75500451. To invite you to be a resident of this world."'
53062: '@rBEATRICE snapped her fingers,@k and a storm of gold butterflies all rose up around the rose garden.'
53063: '@rAs the cloud of butterflies danced over the table, a gorgeous tea set appeared.'
53064: '@rThere were tea cups and a tea pot, more elegant even than those used by the Ushiromiya family.'
53065: '@rThe tea filled the cups to the brim and had a sweet rose scent, one which Shannon had never smelled before.'
53066: '@rBefore there was even time to be amazed by that scent,@k butterflies started gathering one by one on the table, and a tea stand sprouted right out of it.'
53067: '@rIt was like watching a magical mushroom from a fairy tale kingdom grow out of the ground.'
53068: '@rThe many-layered tea stand was filled with beautiful cakes that were deserving of being called edible jewels.'
53069: '@rOf course, there were also several lovely, light-brown scones.@k The honey truly was golden honey, with bits of gold leaf dancing through it......'
53070: 'BEATRICE@r@v55/75500452."It seems the Ushiromiya family holds tea parties from time to time, but those cannot compare to mine."'
53071: 'Shannon@r@v15/70500247."......I-.........incredible......@k@v15/70500248. ...I''ve never seen anything like this..."'
53072: 'BEATRICE@r@v55/75500453."*cackle*cackle*.@k@v55/75500454. Even if you had, it would only have been as a waitress.@k@v55/75500455. You are my friend.@k@v55/75500456. I need no waitress.@k@v55/75500457. After all, I am a witch.@k@v55/75500458. That is more than enough.@k@v55/75500459. Come, do not be shy.@k@v55/75500460. Stuff yourself to your heart''s content."'
53073: 'Shannon@r@v15/70500249."Th-@v15/70500250.......thank you...@v15/70500251.very much......"'
53074: '@rThat was all Shannon could manage to say.@k .........It would be hard for anyone to say much more after being suddenly invited to such a beautiful witch tea party.'
53075: 'BEATRICE@r@v55/75500461."Let us begin with black tea.@k@v55/75500462. The milk is fresh, and the sugar is so delectable that you''d almost want to eat it raw.@k@|@y@v55/75500463. But I recommend you try your tea straight first.@k@v55/75500464. With nothing more than a single rose petal floating on the top,@k@v55/75500465. it will surely be so delicious that you''ll be unable to drink the black tea of the human world ever again...!"'
53076: '@rLaughing happily, BEATRICE opened, not a sugar pot, but a rose petal pot,@k picked up a single crimson petal, and floated it on her tea after relishing its scent.'
53077: '@rShannon did the same, picking up a single petal and smelling its aroma.'
53078: 'Shannon@r@v15/70500252."...............It smells so wonderful......@k@v15/70500253. ......Is this...really the scent of the roses in this world?"'
53079: 'BEATRICE@r@v55/75500466."I am glad you enjoy it.@k@v55/75500467. I bred this rose simply for the purpose of using the petals with black tea.@k@v55/75500468. If you crush them, they''re also splendid for making jam!@k @v55/75500469.That goes better with scones than anything else imaginable.@k@v55/75500470. Do you want to try?"'
53080: 'Shannon@r@v15/70500254."Uh, ah......sure, just a bit."'
53081: '@rShannon had been invited to this witch tea party suddenly.'
53082: '@rHowever, the witch seemed so truly innocent, and her smile as she played the hostess was so happy that it made Shannon want to smile too.'
53083: '@rThe tension in Shannon''s heart gradually faded, and she started to enjoy her chat with this witch......'
53084: 'BEATRICE@r@v55/75500471."Servant work really is tiring.@k@v55/75500472. I remember it well.@k@v55/75500473. Particularly cleaning the windowsills in the chapel."'
53085: 'Shannon@r@v15/70500255."How surprising.@k@v15/70500256. So, you worked as a servant once too?"'
53086: 'BEATRICE@r@v55/75500474."For a short time.@k@v55/75500475. You probably don''t remember, but I worked alongside you.@k@v55/75500476. I was a clumsy fool who always lost things.@k@v55/75500477. You were my idea of a perfect servant and the person I looked up to."'
53087: 'Shannon@r@v15/70500257."......That makes me even more sorry that I can''t remember."'
53088: 'BEATRICE@r@v55/75500478."There is no need for apologies.@k@v55/75500479. Here, you are not a servant, but my friend and guest.@k@v55/75500480. There are no inconveniences here, no trials nor boredom.@k@v55/75500481. I can give you anything you desire.@k@v55/75500482. That is how much power I currently possess.@k@v55/75500483. ......I wanted to let you know that I have now reached that level."'
53089: 'Shannon@r@v15/70500258.".........I can''t believe you''ve given someone as ordinary as me such wonderful treatment...@k@v15/70500259. Thank you very much."'
53090: 'BEATRICE@r@v55/75500484."*cackle*!@k @v55/75500485.Think of it as a reward for all of the painful days you have withstood."'
53091: 'BEATRICE@r@v55/75500486."Come, gold butterflies!@k @v55/75500487.Do not bore my friend! Show her a little dance!@k @v55/75500488.When you have tired of that, allow me to call the band to perform any song you would like.@k@v55/75500489. If you tire of that as well, my refined familiars will show you magic without tricks."'
53092: 'BEATRICE@r@v55/75500490."Fear not, for time is endless here.@k@v55/75500491. And I can grant your wishes endlessly.@k@v55/75500492. My tea party has no end...!"'
53093: '@rIn a truly good mood, the witch told Shannon several strange stories.'
53094: '@rThey were all stories Shannon had never heard before.@k Very interesting stories.@k And they were all odd, bizarre fairy tales.'
53095: '@rShannon felt as though she had become Alice in Wonderland.@k The time she spent at this tea party was wholly strange, pleasant, and relaxed.'
53096: '@rNo,@k at this tea party, there were no hands of a clock.'
53097: '@rSo, the time passed like a Sunday morning, when you can wrap yourself in your blanket for as long as you want......'
53098: 'Shannon@r@v15/70500260."......I can''t express how grateful I am to you for this."'
53099: 'BEATRICE@r@v55/75500493."There is no need for thanks.@k@v55/75500494. In the human world, words of thanks go along with words of farewell, do they not?@k @v55/75500495.There will be no end to this tea party.@k@v55/75500496. So, there is no need for thanks either."'
53100: 'Shannon@r@v15/70500261."*giggle*.@k@v15/70500262. But I am grateful.@k@v15/70500263. Thank you so much, BEATRICE-sama, for this wonderful tea party.@k@|@y@v15/70500264. .........But all dreams must end, and so must this one."'
53101: 'BEATRICE@r@v55/75500497."Hoh.@k@v55/75500498. And why must they end?"'
53102: 'Shannon@r@v15/70500265."Because......I have to get up early tomorrow.@k@v15/70500266. If I stay here talking too long, I''ll sleep in,@k@v15/70500267. and Madam will give me a good scolding..."'
53103: 'BEATRICE@r@v55/75500499."Pft, hahhahhahahahhaahahahahaha!@k @v55/75500500.Why are you so anxious to return to the world of that short-tempered Natsuhi?@k@v55/75500501. Really, now.@k@v55/75500502. Are you really saying you want to return to the Human world, where it''s all work and no rewards?"'
53104: 'Shannon@r@v15/70500268."But I am Human.@k@v15/70500269. I can''t impose myself on you forever."'
53105: 'BEATRICE@r@v55/75500503."Shannon.@k@v55/75500504. It seems that you do not understand.@k@v55/75500505. I invited you here, but I have no desire to chase you away again."'
53106: 'BEATRICE@r@v55/75500506."Here, time is eternal.@k@v55/75500507. You are not obligated to say farewell.@k@v55/75500508. I will never tire of enjoying tea with you.@k@v55/75500509. On the contrary, it is quite agreeable to have you to talk to."'
53107: 'Shannon@r@v15/70500270."I''m grateful for your words, but I am Human.@k@v15/70500271. I must return to my own world."'
53108: 'BEATRICE@r@v55/75500510."That colorless world where you waste all your time with school and your job, and the family works you to the bone?@k@v55/75500511. Why do you want to return there?"'
53109: 'Shannon@r@v15/70500272."Despite all that, ......it''s still my world."'
53110: 'BEATRICE@r@v55/75500512."Shannon.@k@v55/75500513. Does that sort of world really need to be yours?@k @v55/75500514.Let me be honest with you.@k@v55/75500515. ......Shannon.@k@v55/75500516. I didn''t just invite you here.@k@v55/75500517. I came to take you home."'
53111: 'Shannon@r@v15/70500273."Take me home.........?"'
53112: 'BEATRICE@r@v55/75500518."Once, I tried to become a good servant like you.@k@v55/75500519. ......Then, I became fascinated by witches...@k@v55/75500520.and became one myself, learning all the pleasures of magic.@k@v55/75500521. ......And now, I have come to take you home."'
53113: '@rBEATRICE spoke quietly and slowly rose from her seat.'
53114: 'BEATRICE@r@v55/75500522."Shannon.@k@v55/75500523. ......The world of witches truly is more fun than being a servant.@k@v55/75500524. This tea party is nothing more than a mere welcoming party for an old friend.@k@v55/75500525. We can hold as many fun festivities as we desire.@k@v55/75500526. Yes—endlessly, eternally."'
53115: 'BEATRICE@r@v55/75500527."......Now that this golden rose garden has been completed, I have reached my goal.@k@v55/75500528. This place is paradise.@k@v55/75500529. Yes, let us call it the Golden Paradise.@k@v55/75500530. Now that it has been completed, I have come to welcome you in.@k@v55/75500531. There''s no need for any inconveniences, any perseverance or hard work.@k@v55/75500532. Here, you and I can enjoy ourselves for all eternity.@k@v55/75500533. It will be like a never-ending fairy tale......"'
53116: 'Shannon@r@v15/70500274."......I''m truly grateful for your splendid proposal.@k@v15/70500275. ......However, I need to go back to my original world."'
53117: 'BEATRICE@r@v55/75500534."Why?"'
53118: 'Shannon@r@v15/70500276."Because this isn''t my world."'
53119: 'BEATRICE@r@v55/75500535."I acknowledge it.@k@v55/75500536. This is not the world you have lived in until now.@k@v55/75500537. That''s why I have invited you here!"'
53120: 'BEATRICE@r@v55/75500538."From this point forth, this will be our world.@k@v55/75500539. You are no longer a guest.@k@v55/75500540. You are the second master of this world.@k@v55/75500541. You need not show any restraint for my sake.@k@v55/75500542. We will simply live in this endless world like we once lived as roommates......"'
53121: 'Shannon@r@v15/70500277."I regret that I have no memory of that time.@k@|@y@v15/70500278. .........However, I''ll have to turn down your invitation."'
53122: 'BEATRICE@r@v55/75500543."Why?@k@v55/75500544. ......What responsibility do you have to the world of Humans?@k@v55/75500545. What duty do you have to return there?!"'
53123: '@rTrue, the world of Humans, or the world of servants, is busy all the time.'
53124: '@rMadam is strict, high-strung, and has a short temper.'
53125: '@rIt''d be a lie if I said the everyday chores weren''t a pain, and having to balance work with school makes it even harder.'
53126: '@rBEATRICE had watched over those painful days the whole time.'
53127: '@rShe had seen those constantly tired shoulders heave in a sigh many times.'
53128: '@rThat was why she had invited Shannon here.@k To this Golden Paradise.'
53129: '@rShe had tried to give Shannon a perfect welcome, to truly make her happy.'
53130: '@r......So why had Shannon selected her original world over this one?'
53131: '@rBEATRICE was overcome with shock, and completely unable to understand.'
53132: 'BEATRICE@r@v55/75500546."I have given you the perfect welcome to this paradise.@k@v55/75500547. And the days to follow will be even more fun."'
53133: 'BEATRICE@r@v55/75500548."......So, if you still choose the Human world after all of that, does it mean that you find something there that is even more fun than the pleasures of witches?"'
53134: 'Shannon@r@v15/70500279.".........That''s right.@k@v15/70500280. There are things in the Human world that are even more fun than magic."'
53135: 'BEATRICE@r@v55/75500549."Absurd...... That can''t be...!"'
53136: 'Shannon@r@v15/70500281.".........Yes,@k@v15/70500282. it''s true."'
53137: '@rShannon''s expression was soft.'
53138: '@rHowever, her words were firm.@k There was something wonderfully alluring in the Human world.'
53139: '@rAnd that something was apparently not in this paradise, which was supposed to have everything just as they wanted it......'
53140: 'BEATRICE@r@v55/75500550."..................Absurd...@k@v55/75500551. ......I don''t understand,@v55/75500552. ......I don''t understand......"'
53141: '@rAs BEATRICE muttered, she shifted restlessly several times.'
53142: '@rHowever, no matter how often she said it, Shannon''s smile didn''t falter, and BEATRICE couldn''t think of an answer...'
53143: 'Shannon@r@v15/70500283."In that case, .........it''s time for me to leave.@k@v15/70500284. Your tea really was delicious."'
53144: 'BEATRICE@r@v55/75500553."............I don''t understand, I don''t understand!@k@v55/75500554. ......I am the great Golden Witch, the one who can have an infinite quantity of anything I desire.@k@v55/75500555. You tell me that there is something I cannot obtain?"'
53145: 'Shannon@r@v15/70500285.".........Yes."'
53146: 'BEATRICE@r@v55/75500556."I want to know.@k@v55/75500557. I believed I had everything, so tell me what it is I lack...!"'
53147: 'Shannon@r@v15/70500286."I think......that you already know.@k@v15/70500287. Isn''t that why you invited me here...?"'
53148: 'BEATRICE@r@v55/75500558."............Are you trying to speak in riddles to a witch?@k@v55/75500559. ......Heh, ...*cackle*."'
53149: 'Shannon@r@v15/70500288."That''s all for now then......@k@v15/70500289. I can''t live here, but I would be glad to come over whenever you invite me for tea."'
53150: 'BEATRICE@r@v55/75500560."I won''t call for you again...@k@v55/75500561. Have no fear of that."'
53151: '@rBEATRICE snapped her fingers and Shannon popped out of existence.'
53152: '@rShe had returned Shannon''s soul to the dream of her original self.'
53153: '@rAlthough people have many dreams in a night, they can remember none of them.'
53154: '@rThe tea party in this paradise would mix in with many other dreams and vanish.'
53155: '@rThe next morning, Shannon would not remember this tea party.'
53156: '@rHowever, Shannon''s cup remained here.'
53157: '@rThe witch who had lost her guest and was standing alone looked all the more lonely...'
53158: 'BEATRICE@r@v55/75500562."...................................."'
53159: '@rThe witch dug her fingernails into the tablecloth.'
53160: '@rThat grimace as she bit her lower lip made it clear...@kthat she still hadn''t solved the puzzle Shannon had left behind.'
53161: '@r@v32/73700295."Riiche.@k@v32/73700296. There''s no need to worry about it."'
53162: '@rAbove Shannon''s empty seat, a black hole opened, and the owner of that voice fell out of it.'
53163: 'BEATRICE@r@v55/75500563."......I do worry.@k@v55/75500564. How could she say it with such certainty..."'
53164: '@r@v32/73700297."Maybe she just wanted to get back to sleep quickly, since dawn is coming soon."'
53165: 'BEATRICE@r@v55/75500565."............What pleasure could Shannon know that I do not?!@k @v55/75500566.What is this "something" that can be found in the Human world but not in my paradise?!@k @v55/75500567.I don''t understand!@k @v55/75500568..........I want to know!"'
53166: '@r@v32/73700298."Thinking about complicated stuff will just fuel your headache.@k@v32/73700299. I can be of service in Shannon''s place.@k@v32/73700300. Let''s enjoy a tea party together."'
53167: 'BEATRICE@r@v55/75500569."I am no longer of the mood.@k@v55/75500570. .........I am bored of having tea parties with you."'
53168: '@r@v32/73700301."......Aw, she''s cranky."'
53169: '@rThe witch shrugged and laughed, then took a bite out of a scone.'
53170: '@rShe then blew into it, and it swelled up like a balloon before finally popping.'
53171: '@rGolden ribbons and butterflies flew out, but BEATRICE didn''t appear to notice......'
53172: 'BEATRICE@r@v55/75500571.".........Just what is it that I do not possess?@k@v55/75500572. ......What......?"'
53173: 'Kawabata@r@v24/73800001."Watch your step there."'
53174: 'Eva@r@v05/71000024."Thank you, captain.@k@v05/71000025. Make sure you take good care of yourself."'
53175: 'Hideyoshi@r@v06/71100017."I''ve got a friend who sells this stuff that''s supposed to be great for stiff shoulders.@k@v06/71100018. I''ll bring you a sample next time...!"'
53176: 'Kawabata@r@v24/73800002."Oh, no need to trouble yourself... But thanks for caring."'
53177: 'Rudolf@r@v08/71200014."Hey, brats!@k @v08/71200015.How long are you gonna mess around up there?@k @v08/71200016.Let''s go."'
53178: 'Rosa@r@v12/71400108."Hey, Maria.@k@v12/71400109. Come down off the boat with Mama..."'
53179: '@rMaria, who Rosa led by the hand, was still too young for kindergarten.'
53180: '@rHowever, she seemed to notice that her cousins, whom she rarely ever saw, were playing all around her, and she was very excited.'
53181: '@rBattler and George had the energy of middle-school or nearly middle-school kids.'
53182: '@rThose two, along with Jessica who had met up with them on Niijima, were making a lot of noise on the deck.'
53183: 'Rudolf@r@v08/71200017."You okay, Asumu?@k@v08/71200018. ......You really don''t like riding things, do you..."'
53184: '@rRudolf lent an arm to his wife, Asumu...'
53185: 'Genji@r@v14/71600065."......Welcome to Rokkenjima.@k@v14/71600066. Thank you for making such a long journey."'
53186: '@rThe whole family had gathered for the conference.'
53187: '@rAt this point in time, Rudolf''s wife was still Asumu, and Ange hadn''t been born.'
53188: '@rGohda and Kanon hadn''t yet been employed by the Ushiromiya family,@k and the witch''s epitaph, which would toy with the family''s fate, hadn''t appeared yet.'
53189: '@rThey probably couldn''t even imagine...@kthe bizarre crime that awaited them several years in the future......'
53190: 'Kumasawa@r@v18/71800128."Krauss-sama, Madam.@k@v18/71800129. The family has arrived."'
53191: 'Krauss@r@v02/70800038."Good......@k@v02/70800039. Then I will call for Father."'
53192: 'Natsuhi@r@v03/70900047."Please do.@k@v03/70900048. I will go welcome everyone.@k@|@y@v03/70900049. ......Ah! Shannon...!@k@v03/70900050. Who cleaned this window frame?!@k @v03/70900051.It still has dust on it...!@k @v03/70900052.Quickly, wipe it off!"'
53193: 'Shannon@r@v15/70500290."A-as you wish, Madam."'
53194: '@r.........Oh, come on. Natsuhi is making her work so hard again.'
53195: '@rJust what good does she find in such a fussy, ulcer-inducing life?'
53196: '@rI wanted to know.'
53197: '@r......Shannon.@k What is it that you found?'
53198: '@rAnd what did you mean when you said I already knew what I was missing?'
53199: '@rShannon.@k Is this something I must learn by learning about you......?'
53200: 'Zepar@r@v51/75100078."What''s different about the day of the family conference on Rokkenjima?!"'
53201: 'Furfur@r@v52/75200080."It''s got to be the noise!@k @v52/75200081.There''s never this many kids around!"'
53202: 'George@r@v07/70300040."......It may have been a tension-filled day for the adults,@k@|@y@v07/70300041. but to us kids, it was a wonderful day, the only time we got to see all of the cousins we loved."'
53203: 'Battler@r@v10/70100021."In the summer, we could play with our cousins on the beach, and there were plenty of games we could play in the winter!@k @v10/70100022.The family conferences were tons of fun for us."'
53204: 'Jessica@r@v04/70200270."Same here.@k@v04/70200271. Mom was always yelling about how there must be no mistakes,@k@v04/70200272. but to me, it was just the day I got to play with all my cousins.@k@v04/70200273. After all, there''s usually nothing at all to do on Rokkenjima."'
53205: 'Battler@r@v10/70100023."Jessica got to live in this huge mansion with a private beach.@k@v10/70100024. I was always jealous of her when I was a brat.@k@v10/70100025. But thinking about it from her perspective, it must''ve been a pretty constricting place to live."'
53206: 'George@r@v07/70300042."Yes, probably......@k@v07/70300043. There''s hardly anything on Rokkenjima.@k@v07/70300044. No friends'' houses, no next door neighbors, no neighborhood.@k@v07/70300045. When I consider Jessica-chan''s feelings about that, I feel a little sad for her."'
53207: 'Jessica@r@v04/70200274."That''s why the family conference was so special to me.@k@v04/70200275. Jumping around, messing around!@k @v04/70200276.It felt like I was at a festival.@k@v04/70200277. We spent every last second joking around together."'
53208: 'Furfur@r@v52/75200082."If the adults always talked about adult things and told you to go play somewhere else—"'
53209: 'Zepar@r@v51/75100079."And you were three cousins at about the same age,@k@v51/75100080. of course you''d horse around!"'
53210: 'George@r@v07/70300046."No, it wasn''t three.@k@v07/70300047. There were four of us."'
53211: 'Furfur@r@v52/75200083."I thought Ange wasn''t born yet, and Maria was still too young to play with you?"'
53212: 'Zepar@r@v51/75100081."You''ve got it wrong, Furfur.@k@v51/75100082. The cousins weren''t the only ones at the same age."'
53213: 'Battler@r@v10/70100026."Shannon-chan was the fourth.@k@v10/70100027. She was about the same age as the rest of us."'
53214: 'Jessica@r@v04/70200278."Mom was always going on about not talking with the servant kids,@k@v04/70200279. but Shannon and I started to get close.@k@v04/70200280. After all, she was the one girl closest to me in age on Rokkenjima."'
53215: 'George@r@v07/70300048."All four of us played together.@k@v07/70300049. We played at every family conference.@k@v07/70300050. Right, Shannon?"'
53216: 'Shannon@r@v15/70500291."......Yes.@k@v15/70500292. I knew that Madam would scold me if she found out, but......"'
53217: 'Jessica@r@v04/70200281."I wouldn''t have let her!@k @v04/70200282.You were always the one close friend I had who could understand me...!"'
53218: 'Shannon@r@v15/70500293."Thank you for your words, ......Milady......"'
53219: '@rI could not hide my shock.'
53220: '@rHow had she formed a relationship with the children of the family, despite being only a servant?'
53221: '@rNatsuhi had probably been very careful to prevent such a relationship.'
53222: '@rHowever, it''s no surprise that Jessica, all alone on this island,@k would want to be friends with a kid of her own age.'
53223: '@rAnd Shannon was also alone on this island without any friends her age.'
53224: '@rThough they both understood their relationship as master and servant, they somehow managed to strike up a friendship...'
53225: '@rThen, at the family conference, Jessica had introduced Shannon to George and Battler.'
53226: '@rAll of the adults had their hands full with their complicated discussions in the mansion.'
53227: '@rDuring that time, Shannon was able to put aside her role as a servant for a little bit,@k and act her age with Jessica, George, and Battler.'
53228: '@rI had no idea that Shannon had constructed this new world so quickly.'
53229: '@rAs a butterfly hiding in the shadows,@k ......I observed this new world of Shannon''s.'
53230: 'George@r@v07/70300051."That day, we ran all around the rose garden and the beach."'
53231: 'Jessica@r@v04/70200283."Just running around and playing was a blast."'
53232: 'Battler@r@v10/70100028."Yep.@k@v10/70100029. Those were the only times that Shannon-chan smiled like a girl her age."'
53233: 'Shannon@r@v15/70500294."I might have......gotten a bit carried away.@k@v15/70500295. It''s embarrassing..."'
53234: 'Jessica@r@v04/70200284."Battler''s insanely huge now, but back then, Shannon and I were both taller and stronger than him."'
53235: 'Battler@r@v10/70100030."I just grew slowly back then."'
53236: 'Shannon@r@v15/70500296."*giggle*.@k@v15/70500297. They say that those who start late end up the tallest."'
53237: 'Battler@r@v10/70100031."Ihihi!@k @v10/70100032.Yeah, totally!@k @|@y@v10/70100033.Back then, your chest was nothing like this, right?"'
53238: 'George@r@v07/70300052."That''s not true...@k@v07/70300053. Even back then, Shannon was starting to develop womanly charm. Right?"'
53239: 'Shannon@r@v15/70500298."Uh...ah...wh-who knows......"'
53240: 'Jessica@r@v04/70200285."What the hell do you mean by "womanly charm"? Sounds kinky!"'
53241: 'Battler@r@v10/70100034."Well, I was still pretty adorable back then myself.@k@v10/70100035. That strap you could see through the shoulder of her summer clothing set off the lightning of youth in me...!@k@v10/70100036. I remember whispering with George-aniki that night about how big her tits were! Ihihi!"'
53242: 'Shannon@r@v15/70500299."I-is this true, George-sama...?!"'
53243: 'George@r@v07/70300054."*cough*, *cough*cough*!!@k @v07/70300055.I believe there has been a great misunderstanding...!@k @v07/70300056.A-all I remember was lecturing him, as the older and more knowledgeable cousin, about the differences between how boys and girls grow, *cough*cough*!!@k @v07/70300057.And so, rather than dirty talk between cousins late at night, it was, instead, a sign of healthy growth and, umm..."'
53244: 'Jessica@r@v04/70200286."......Ye~ah, I remember all of us cousins talking about that kinda stuff until midnight...@k@v04/70200287. ......About how apparently, someone in the next class had kissed someone else,@k@v04/70200288. or how you held hands with a girl you liked at summer camp...@k@v04/70200289. And about so-and-so who you thought probably liked you, stuff like that...!@k @v04/70200290.......Dammit, it''s so embarrassing it makes me shiver...!"'
53245: 'Zepar@r@v51/75100083."Isn''t that nice!@k @v51/75100084.Another sweet page in the book of adolescence!"'
53246: 'Furfur@r@v52/75200084."The most pure love comes when boys and girls first start noticing each other!"'
53247: 'Zepar@r@v51/75100085."That simple, pure desire just to be around someone of the opposite sex,@k@v51/75100086. the noble first loves."'
53248: 'Furfur@r@v52/75200085."Just wonderful...@k@v52/75200086. A bunch of kids thinking and talking about the world of love...!"'
53249: 'Shannon@r@v15/70500300."D-@v15/70500301.......did that sort of thing...@v15/70500302.r-@v15/70500303.really happen......?"'
53250: 'Battler@r@v10/70100037."Ihihi~!@k @v10/70100038.Don''t play dumb!@k @|@y@v10/70100039.You were the most absorbed and curious of all of us, sitting there ''til even your ears turned red, ihihi!"'
53251: 'Shannon@r@v15/70500304."I, I was not curious...!@|@y@k @v15/70500305.I, I was just...@v15/70500306.s-@v15/70500307.surprised at how much everyone knew...@v15/70500308.and......@v15/70500309.um......"'
53252: 'Jessica@r@v04/70200291."Yeah.@k@v04/70200292. Shannon always played dumb the most, even though she was the most interested.@k@v04/70200293. She was the biggest pervert the~re. Ihihihi."'
53253: 'Shannon@r@v15/70500310."Th-that''s not true,@v15/70500311. that''s not true,@v15/70500312. I hate you, Milady!"'
53254: 'George@r@v07/70300058."Hahahahahahahahahaha...@k@v07/70300059. Yeah, it was always like this.@k@v07/70300060. In the day, we''d run around like kids, and at night, we''d hug our pillows and talk about secret stuff.@k@v07/70300061. Looking back on all of it now, ......it really brings back some fond memories."'
53255: 'Battler@r@v10/70100040."We''d be whispering about something dirty, and whenever we heard the footsteps of the adults coming by, we''d jump under the covers and pretend to be sleeping!"'
53256: 'Jessica@r@v04/70200294."Yeah, I remember that!@k @v04/70200295.Like some school field trip!"'
53257: 'Shannon@r@v15/70500313."Those times we all dove under the covers at once.@k@v15/70500314. It felt like some sort of unspoken rule, like a strange sense of unity.@k@v15/70500315. I really liked that feeling."'
53258: 'George@r@v07/70300062."Well, anyway.@k@v07/70300063. That''s not all we talked about.@k@v07/70300064. There was a lot more than that.@k@v07/70300065. We really did enjoy our youth to the fullest."'
53259: 'BEATRICE@r@v55/75500573."And what.........is this?"'
53260: '@rShannon.@k ......Is this that "fun thing" of the Human world?'
53261: '@rIs this incomprehensible messing around the thing that you found?'
53262: 'BEATRICE@r@v55/75500574."A bunch of kids gathered together, playing stupid games and talking about trivial things.@k@v55/75500575. ......Is this the Human pleasure you found that surpasses the pleasures of witches?"'
53263: 'Shannon@r@v15/70500316.".........Yes.@k@v15/70500317. Doesn''t it look fun to you?"'
53264: 'BEATRICE@r@v55/75500576."I will not call it boring.@k@v55/75500577. However, the idea that such a vulgar game could compare to my paradise, where all wishes can be granted,@k@v55/75500578. ......is unfathomable to me."'
53265: 'Shannon@r@v15/70500318."Interacting with people......is a lot of fun.@k@v15/70500319. Of course, I also think your world is fun.@k@v15/70500320. But even so, ......I choose this world."'
53266: 'BEATRICE@r@v55/75500579."............I don''t understand.@k@v55/75500580. .........I don''t understand......"'
53267: '@rBEATRICE held her head as though she was having a headache.@k@rBut no matter how much she grimaced, she couldn''t think of an answer.'
53268: 'BEATRICE@r@v55/75500581."......Tell me.@k@v55/75500582. .........What is it you found within this vulgar playing?"'
53269: 'Shannon@r@v15/70500321."..............................@k@|@y@v15/70500322. Do you want to know...?"'
53270: 'BEATRICE@r@v55/75500583."I do!"'
53271: 'Shannon@r@v15/70500323."Love."'
53272: 'BEATRICE@r@v55/75500584."Lo............ve...............?"'
53273: 'Battler@r@v10/70100041."Here.@k@v10/70100042_c. It''s the mystery novel I promised."'
53274: 'Shannon@r@v15/70500324."Th-thank you very much.@k@v15/70500325. I''d be happy to borrow it."'
53275: 'Battler@r@v10/70100043."That''s okay. You can keep it, Shannon-chan.@k@v10/70100044. I''ve already read it."'
53276: 'Shannon@r@v15/70500326."B-but...@k@v15/70500327. I can''t accept this......@k@v15/70500328. It was probably expensive."'
53277: 'Battler@r@v10/70100045."It''s just something I got for a few hundred yen at a bazaar.@k@v10/70100046. Don''t worry about it.@k@v10/70100047. I''d rather if you read it quickly so we can talk about it.@k@v10/70100048. It''s fun to talk about this sort of stuff with you, Shannon-chan."'
53278: 'Shannon@r@v15/70500329."Yes,@k@v15/70500330. it''s fun for me too.@k@v15/70500331. It''s much more fun to read mystery novels with two people instead of alone."'
53279: 'Battler@r@v10/70100049."I like discussing it and imagining all kinds of things.@k@v10/70100050. With mystery novels, reading''s only half the fun.@k@v10/70100051. My theory''s that you can only really enjoy a mystery novel when you talk with other people who''ve read it too."'
53280: '@rIt all started when we realized that we both read mystery novels.'
53281: '@rWe were both surprised and very interested to find that the other not only read tons of mystery novels,@k but read them very thoroughly.'
53282: '@rEver since then, it''s been like this.'
53283: '@rSeparate from the games we played with all the cousins, the two of us met together for some time alone......'
53284: '@rAt first, it was like a sort of contest to see who knew more than the other.'
53285: '@rHowever, eventually, this turned into respect for how much the other had read and how deeply they were able to think about it.'
53286: '@rRespect.@k Trust.@k@rThose emotions made our friendship even stronger.'
53287: '@rOf course, all of that had still fallen within the category of "friendship"......'
53288: '@r......But we were still slightly aware of the fact that the other was of the opposite sex,@k making for a relationship that was charming, or youthful, .........or maybe you could call it exciting.'
53289: '@rHowever, we were still so young that even the word "youth" felt like it might be overstating our age.'
53290: '@rOf course, we didn''t know a thing about love.'
53291: '@rSo, we couldn''t understand that tickling feeling in our chests,@k both bitter and sweet, that we only felt when we were alone together.'
53292: '@rHowever, we realized that there was some unknown emotion hidden behind that feeling,@k ......and as our hearts raced,@w500. we had our hands upon the door.@k ......That was the exciting age we were at.'
53293: '@rSo.'
53294: '@rAt some point, our discussions about mystery novels became just an excuse for us to spend time alone together...'
53295: 'Battler@r@v10/70100052."There aren''t many mystery novels that care much about the whydunit."'
53296: 'Shannon@r@v15/70500332."The whydunit?@k @v15/70500333.You mean the culprit''s motive...?"'
53297: 'Battler@r@v10/70100053."Yeah.@k@v10/70100054. There are three points you need to figure out in mystery novels: the whodunit, the howdunit, and the whydunit.@k@v10/70100055. A lot of mysteries deal with the first two, but surprisingly few worry about the final one."'
53298: 'Shannon@r@v15/70500334."Well, I know about many works that take great care to have the culprit confess his motive after he''s found out..."'
53299: 'Battler@r@v10/70100056."But it has to be something that you can reason out before the culprit confesses, or it doesn''t count.@k@v10/70100057. When the culprit is someone who didn''t appear to have a motive, and they commit the crime for reasons that are impossible to deduce,@k@v10/70100058. personally, I think that''s unfair."'
53300: '@r"Whodunit".@k Who''s the culprit?@k@r"Howdunit".@k How did they commit the crime?@k@r"Whydunit".@k Why did they commit the crime?'
53301: 'Battler@r@v10/70100059."Who the culprit is, and what tricks they used...@k@v10/70100060. There are a ton of works that ask you to figure that out.@k@v10/70100061. In fact, almost all are like that.@k@v10/70100062. However, I don''t think there are many novels that ask you to figure out the motive."'
53302: 'Shannon@r@v15/70500335."Good point.@k@v15/70500336. Out of the trio of "who", "how", and "why", "why" might be the most neglected."'
53303: 'Battler@r@v10/70100063."Mysteries that don''t take the whydunit seriously don''t really feel complete to me.@k@v10/70100064. ......Don''t get me wrong, I''m not saying they''re boring.@k@v10/70100065. ......It''s more like...they''re missing the most important part."'
53304: 'Shannon@r@v15/70500337."The most important part...is missing......?"'
53305: 'Battler@r@v10/70100066."The heart.@k@v10/70100067. The heart is missing."'
53306: 'Shannon@r@v15/70500338.".........The heart........."'
53307: 'Battler@r@v10/70100068."I think the human heart is a really important thing.@k@v10/70100069. For a person to decide to commit murder, plan it out, get everything ready, and actually carry it out,@k@v10/70100070. that''d take an incredibly strong force of the heart.@k@v10/70100071. The heart is what moves people."'
53308: '@r......In other words,@k only the heart can kill a person.'
53309: '@rWhen an emotional upheaval grows strong enough to make a person want to kill, the result is the tragedy called murder.'
53310: '@rPutting it the other way around, that means that the true way to close in on the crime is by searching for the heart that brings about the tragedy of murder.'
53311: '@rOnly the heart can kill.'
53312: '@rSo, if a person has been killed, you must search for the heart.'
53313: '@rThat''s what he told me.'
53314: 'Battler@r@v10/70100072."So...@k@v10/70100073.novels where the culprit is just a homicidal maniac who kills for fun...@k@v10/70100074.don''t really do it for me."'
53315: 'Shannon@r@v15/70500339.".........Then you like novels that show a strong enough movement of the heart to lead to murder?"'
53316: 'Battler@r@v10/70100075."That''s right.@k@v10/70100076. And the ones that let you reason that out are my favorite stories of all."'
53317: '@rAs he spoke, he looked back at me and smiled.'
53318: '@r......Before today, I used to like novels that focused on exposing the tricks.'
53319: '@rHowever, I decided to look for novels like the ones he recommended in the future.'
53320: 'Battler@r@v10/70100077."I don''t like ignoring the heart.@k@v10/70100078. .........The heart is what drives people to act."'
53321: 'Shannon@r@v15/70500340."......Yes.@k@v15/70500341. I think you''re right......"'
53322: '@rThis isn''t limited to the mystery genre.@k@rAll people, at all times, are driven by their hearts.'
53323: '@rFiguring out the heart is the essence of interactions between people—@w583.no, interactions between hearts.'
53324: '@rNone of us humans can live on our own.@k@rAnd yet, we have no way of peeking into the hearts of others.'
53325: '@rThat''s why every meeting between people............is its own mystery of the heart.'
53326: '@rEncountering those mysteries, reasoning about them, and understanding them, is what allows people and hearts to connect with one another.'
53327: '@rThe two of us are here, by ourselves, talking together about mysteries.'
53328: '@rAnd through that...'
53329: '@r...we are exploring each other''s heart and debating its mysteries......'
53330: '@rI want you to feel about me...@w500....the way I feel about you.'
53331: '@rWe''re both exploring,@w500. trying to figure out the depths of the other''s heart,@w500. ......in this mystery of love.'
53332: 'Battler@r@v10/70100079."Nn, ......look how late it''s gotten.@k@v10/70100080. I wonder if Aniki and the others are waiting for us."'
53333: 'Shannon@r@v15/70500342."Yes, we should probably go back soon......"'
53334: 'Battler@r@v10/70100081."......Time seems to fly by when I''m talking with you, Shannon-chan."'
53335: '@rHe seemed to be speaking the words of my heart.'
53336: '@rWe were thinking the same thing, so the same words came out.'
53337: 'Shannon@r@v15/70500343."I wish we could talk together like this forever......@k@v15/70500344. I hate clocks."'
53338: 'Battler@r@v10/70100082."Same here.@k@v10/70100083. Talking about this stuff with you is the most fun part of coming to Rokkenjima."'
53339: '@rWhen I saw that his smiling eyes were looking right at me, ......I turned around.'
53340: '@rI couldn''t let him see my suddenly red face.'
53341: 'Shannon@r@v15/70500345."If only I could go out into the world at large,@k@v15/70500346. ......I''d be able to read so much more..."'
53342: 'Battler@r@v10/70100084.".............................."'
53343: '@rThe bookshop on Niijima that I go to and the bookshop he goes to in the city are on completely different scales.'
53344: '@rThe book exchange between the two of us had become completely one-sided, with him giving me all the books.'
53345: 'Battler@r@v10/70100085."How long do you plan to be a servant, Shannon-chan?"'
53346: 'Shannon@r@v15/70500347."......I don''t know."'
53347: 'Battler@r@v10/70100086."If, someday,@k@v10/70100087. you decide to quit..."'
53348: 'Shannon@r@v15/70500348."If I do......?"'
53349: 'Battler@r@v10/70100088."Come over to my place."'
53350: '@rHe said it......almost carelessly.@k@rMaybe he was a bit embarrassed, since he laughed weakly and blushed.'
53351: 'Battler@r@v10/70100089."And then,@k@v10/70100090. ......we won''t need to worry about time running out anymore."'
53352: 'Shannon@r@v15/70500349."......That''s right.@k@v15/70500350. ......We could be together......as long as we wanted..."'
53353: '@rThe little secret dates on this island only happened a few times a year,@k ......and even when they did happen, it was only for a short, uncertain period of time.'
53354: '@rIt wouldn''t work over the phone or with letters.'
53355: '@rWe can only talk about our mystery when we''re standing together like this.'
53356: 'Battler@r@v10/70100091."I know that day''ll come someday."'
53357: 'Shannon@r@v15/70500351."......You think it will...?"'
53358: 'Battler@r@v10/70100092."Yeah.@k@v10/70100093. I''m certain of it."'
