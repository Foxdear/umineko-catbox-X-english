51577: 'Lion@r@v53/75300332."So, did you figure out...@k@v53/75300333....who killed Beatrice?"'
51578: 'Will@r@v54/75400739."Yeah.@k@v54/75400740. More or less."'
51579: 'Lion@r@v53/75300334."I hope you''re not going to suggest...@k@v53/75300335....that the head killed her..."'
51580: 'Will@r@v54/75400741."BERNKASTEL isn''t asking about the two Beatrices involved with Kinzo.@k@v54/75400742. She''s talking about who killed the 1986 BEATRICE."'
51581: 'Lion@r@v53/75300336."......I''m not really sure what you mean by "this year''s BEATRICE".@k@v53/75300337. What''s all this about a witch called BEATRICE?@k @v53/75300338.You''ve mentioned a ghost story, you''ve mentioned an epitaph...@k@v53/75300339. Isn''t it about time you explained all this to me?"'
51582: 'Will@r@v54/75400743."Alright.@k@|@y@v54/75400744. No point stringing you along."'
51583: 'Lion@r@v53/75300340."Let''s start from the beginning.@k@v53/75300341. ......Who is this witch BEATRICE?"'
51584: 'Will@r@v54/75400745."Strictly speaking, it isn''t a person.@k@v54/75400746. "BEATRICE, the Golden Witch" is the name of a concept."'
51585: 'Lion@r@v53/75300342."You mean the ghost stories themselves?"'
51586: 'Will@r@v54/75400747."To be more specific, even the ghost stories are only one of the elements that create the concept."'
51587: 'Lion@r@v53/75300343."You''ve lost me."'
51588: 'Will@r@v54/75400748."Ghost stories are normally told in the third person or second person.@k@v54/75400749. However, someone started telling those in the first person."'
51589: 'Lion@r@v53/75300344."You mean someone started saying that they were BEATRICE themselves...?"'
51590: 'Will@r@v54/75400750."The legend of Rokkenjima''s evil spirits, and the made-up story for keeping kids out of the forest...@k@v54/75400751. These were combined with Kinzo''s constant cries of "Beatrice, Beatrice" and gradually became the legend of the witch.@k@v54/75400752. Ushiromiya Maria became entranced by that fictional witch and begged for a chance to meet her.@k@v54/75400753. And then, someone...@v54/75400754.@|@ygranted her wish."'
51591: 'Lion@r@v53/75300345.".........I''m still not following, but I''ll just nod and tell you to keep going.@k@v53/75300346. ......What do you mean by "granted her wish"?"'
51592: 'Will@r@v54/75400755."Because of the unfortunate way in which Ushiromiya Maria was brought up, she became obsessed with the occult.@k@v54/75400756. ......Someone felt sympathy for her, acted the part of BEATRICE, and played with her."'
51593: '@rMaria tends to recognize people by their behavior instead of their physical appearance.'
51594: '@rWhen Rosa becomes violent, Maria calls her "the black witch", and at these times, Maria views her as a different person, not her mother.'
51595: '@rSo,@k this means that she tends to think of the same person as different people depending on their behavior.'
51596: '@rWe can use this to see the scene where Maria first met BEATRICE in a new light.'
51597: '@rAfter being chased out of the mansion by the adults, Maria decided to drink some tea in the rose garden.'
51598: '@rAt that time, someone probably started talking to Maria.'
51599: '@rThen, ......when they heard this occult-loving girl talking happily about how she wanted to meet the witch BEATRICE,@k .........this person acted as though BEATRICE was possessing them.'
51600: '@rOn the outside, they didn''t look like BEATRICE.'
51601: '@rHowever, when their manner of speech and behavior changed abruptly, Maria would recognize them as a different person.'
51602: '@rThat''s why "her" appearance was so sudden.'
51603: 'Will@r@v54/75400757."We can probably view Maria''s love of witches and the occult as a form of escapism.@k@v54/75400758. ......She believed the power of witches could change her unfulfilling and incomplete life.@k@v54/75400759. So, she wanted to believe in them.@k@v54/75400760. Because if she believed in witches, she could also believe in her own happiness."'
51604: 'Lion@r@v53/75300347."......It''s true that Aunt Rosa is bringing up Maria by herself, and that she''s always busy with work.@k@v53/75300348. I do feel sorry for Maria, but still..."'
51605: 'Will@r@v54/75400761."Don''t ignore the heart.@k@v54/75400762. ......So, Maria believed for the sake of believing.@k@v54/75400763. She believed in BEATRICE''s simple conjuring trick from the bottom of her heart.@k@v54/75400764. That probably comforted her a lot.@k@v54/75400765. ......And at that moment, the witch BEATRICE was born."'
51606: 'Lion@r@v53/75300349."Someone saw that Maria-chan wanted to meet a witch, so they decided to play witches with her...?"'
51607: 'Will@r@v54/75400766."That''s right."'
51608: '@rThis marks the birth of Beato the Elder.'
51609: '@rAll of that about living a thousand years and being bound to Rokkenjima.'
51610: '@rThat was all the result of mixing the legend of Rokkenjima''s evil spirits with the story of a ghost wandering the mansion at night.'
51611: '@rAs Furudo Erika guessed, the two ghost stories fused.'
51612: '@rSomeone fused the two stories together and acted the part.'
51613: '@rSo, BEATRICE held traits from both ghost stories: she was the master of the mansion''s night, while also fearing spiderwebs.'
51614: 'Lion@r@v53/75300350."So, when BERNKASTEL asks us who killed BEATRICE,@k@v53/75300351. she means who killed the kind person who pretended to be BEATRICE?"'
51615: 'Will@r@v54/75400767."That''s close, but not quite.@k@v54/75400768. It''s not the one who pretended.@k@v54/75400769. We''re talking about two different people.@k@|@y@v54/75400770. ......In Maria''s eyes, just like how her mother and the black witch are different people,@k@v54/75400771. BEATRICE and the person who played that part are also different people."'
51616: '@rIt''s just like Mariage Sorciere.'
51617: '@rThat was where one person would be the creator, and the other person would acknowledge those creations, thereby nurturing the illusion.'
51618: '@rThe Golden Witch BEATRICE was also created by one person, and then nurtured when Maria acknowledged her.'
51619: 'Lion@r@v53/75300352."You mean, even if you kill the acted character, that doesn''t mean you''ve killed the kind person who was playing the part?"'
51620: 'Will@r@v54/75400772."Even if BEATRICE''s vessel is lost, that isn''t the same as BEATRICE being killed."'
51621: 'Will@r@v54/75400773."......It''s easier to understand if we use a telephone as an example.@k@v54/75400774. Let''s say I call you on the phone.@k@v54/75400775. From my perspective during the call, the phone is you, in the sense that it is what I talk to."'
51622: 'Will@r@v54/75400776."But what if I destroy the phone?"'
51623: 'Lion@r@v53/75300353."......I see.@k@v53/75300354. If you kill the phone, you won''t be able to talk to me, but that doesn''t mean you''ve killed me."'
51624: 'Will@r@v54/75400777."We know Maria once offered to let BEATRICE possess her, early on in their relationship.@k@v54/75400778. That clearly shows that BEATRICE did not look like the portrait at that time."'
51625: 'Lion@r@v53/75300355."So, if the person acting the part and the witch character they play are different people, ......we''re talking about killing just the witch character itself.@k@v53/75300356. ......Is that even possible?"'
51626: 'Will@r@v54/75400779."Only the actor can kill the character.@k@v54/75400780. In other words, the person who killed BEATRICE is the person who played the part of BEATRICE."'
51627: 'Lion@r@v53/75300357."You mean that the person who played witches with Maria-chan is the culprit BERNKASTEL''s talking about?"'
51628: 'Will@r@v54/75400781."That''s it.@k@v54/75400782. .........But, as if this wasn''t confusing enough, this chapel is now a world inside a cat box.@k@v54/75400783. The culprit is the cat, and there are now two cats existing at the same time—one alive, and one dead."'
51629: 'Lion@r@v53/75300358."......Confusing is right.@k@v53/75300359. I''m still lost, but keep going.@k@v53/75300360. You''re saying that there are two culprits?"'
51630: 'Will@r@v54/75400784."Right.@k@v54/75400785. ......The person who can create and kill BEATRICE...@k@v54/75400786....and the person who never gave birth to BEATRICE in the first place, who can kill the entire concept of BEATRICE.@k@v54/75400787. Both of those people are here."'
51631: 'Lion@r@v53/75300361."Then let me ask.@k@v53/75300362. In this BEATRICE murder case,@k@v53/75300363. who are the two culprits?"'
51632: 'Will@r@v54/75400788."Let''s start with...@k@v54/75400789....the dead cat."'
51633: 'Lion@r@v53/75300364."Who is it?"'
51634: 'Will@r@v54/75400790."You."'
51635: 'Lion@r@v53/75300365."Wha@v53/75300366.......@v53/75300367.......?"'
51636: 'Will@r@v54/75400791."The logic is extremely simple.@k@v54/75400792. Your world is the only one where the witch BEATRICE doesn''t exist."'
51637: 'Lion@r@v53/75300368."I don''t understand."'
51638: 'Will@r@v54/75400793."Both Maria and Jessica told me stories about the witch BEATRICE.@k@v54/75400794. However, when they talked about the ranking system at the dining table, you weren''t there."'
51639: 'Lion@r@v53/75300369."I...wasn''t there...?"'
51640: 'Will@r@v54/75400795."Maria came to visit Rokkenjima with Rosa.@k@v54/75400796. And Rosa was sitting next to her.@k@v54/75400797. That''s impossible.@k@v54/75400798. .........If you exist, then after Rosa comes you, then Jessica, then Maria."'
51641: '@rThere should be two people between Rosa and Maria in rank.'
51642: '@rIn that case, they should be across the table from each other and separated by one seat.'
51643: '@r......In other words, in the world where Lion exists, it''s impossible for Maria to be sitting next to Rosa.'
51644: 'Will@r@v54/75400799."It was the same in Jessica''s story.@k@v54/75400800. If you''re included in the ranking, then when looking down the table towards Kinzo''s seat, you should be on the left side and Jessica should be on the right.@k@v54/75400801. After that comes George on the left side and Ange on the right.@k@v54/75400802. ......Jessica and Ange will be sitting next to each other whether you''re there or not.@k@v54/75400803. However, which side of the table they''re sitting on changes."'
51645: '@rIn the world where Lion exists, Ange''s seat is on Jessica''s left.@k@rHowever, if Lion doesn''t exist, then Ange''s seat is on Jessica''s right.'
51646: 'Will@r@v54/75400804."Every time someone talked about the witch BEATRICE of 1986, they were all talking about a world where you don''t exist.@k@v54/75400805. And, in your world, there are no ghost stories about a witch.@k@v54/75400806. To you, "Beatrice" is either Kinzo''s mistress or his benefactor, not a wandering ghost."'
51647: 'Lion@r@v53/75300370."The head loved Beatrice deeply, did he not?@k @v53/75300371.I can''t imagine why she would be made into a ghost story."'
51648: 'Will@r@v54/75400807."Exactly.@k@v54/75400808. If you exist, the witch BEATRICE doesn''t.@k@v54/75400809. Your existence...@v54/75400810....kills BEATRICE."'
51649: 'Lion@r@v53/75300372."Are you saying I''m the culprit who killed BEATRICE......?@k @v53/75300373.That''s......just crazy.@k@v53/75300374. How can I be the culprit if I don''t even understand her and have never met her?"'
51650: 'Will@r@v54/75400811."Flip it around.@k@v54/75400812. ......If you don''t exist, BEATRICE will be born."'
51651: 'Lion@r@v53/75300375."Flip it?@k @v53/75300376.Are you trying to say BEATRICE and I are two sides of a coin?"'
51652: 'Will@r@v54/75400813."That''s a good way to put it.@k@v54/75400814. That''s it exactly.@k@v54/75400815. You''re a coin, and BEATRICE is on the other side."'
51653: 'Lion@r@v53/75300377."I don''t get it at all."'
51654: 'Will@r@v54/75400816."At first, I didn''t get your existence either.@k@v54/75400817. ......But, I have formed a theory about you, after hearing all this.@k@v54/75400818. The important fact is that you''re 19 years old."'
51655: 'Lion@r@v53/75300378."......I don''t remember telling you my age, but you got it right.@k@v53/75300379. ......How?"'
51656: 'Will@r@v54/75400819."Jessica said you were already the student council vice-president when she started, and that you became the president the next year.@k@v54/75400820. That means you''re one year older than Jessica."'
51657: '@rJessica is 18 years old, .........so Lion must be 19.'
51658: 'Lion@r@v53/75300380."I see...@k@v53/75300381. And what sort of theory can you make, now that you know I''m 19?"'
51659: 'Will@r@v54/75400821."You aren''t Ushiromiya Natsuhi''s child, that''s the theory."'
51660: 'Lion@r@v53/75300382."...........................@k@|@y@v53/75300383. ......How rude.@k@v53/75300384. I don''t know what game you''re playing, but I demand that you take back that slanderous insult to both me and my mother."'
51661: 'Will@r@v54/75400822."Why are you the successor to the headship, instead of Krauss?"'
51662: 'Lion@r@v53/75300385."I will succeed the headship when I come of age.@k@v53/75300386. When I have a kid, I''ll probably pass the title down to them when they come of age."'
51663: 'Will@r@v54/75400823."Then why didn''t Kinzo give the headship to Krauss when he came of age?"'
51664: 'Lion@r@v53/75300387.".........You heard what our head said.@k@v53/75300388. He was used by the cunning elders of the Ushiromiya family and suffered much.@k@v53/75300389. That''s why he decided that only young people should inherit the headship from now—"'
51665: 'Will@r@v54/75400824."In the world without you in it, the silver ring for the successor to the headship doesn''t even exist.@k@v54/75400825. ......That silver ring on your finger proves that Kinzo has a strong desire to see that you become the next head,@k@v54/75400826. a desire which does not manifest in any other world."'
51666: 'Lion@r@v53/75300390."......I can''t deny that you may have a point there.@k@v53/75300391. The head always seemed to adore me particularly.@k@v53/75300392. I was told from a young age that I would succeed the headship at once when I became an adult, and that it was very important for me to keep up with my studies in preparation for that day."'
51667: 'Lion@r@v53/75300393."......But I don''t think my father was any less talented.@k@v53/75300394. Why did Grandfather skip over him and make me the successor?@k@v53/75300395. .........I''ve thought it strange from time to time, but since it''s always been that way, I never said so aloud."'
51668: 'Will@r@v54/75400827."Do you know why Kinzo wanted you and not Krauss to become the next head?"'
51669: 'Lion@r@v53/75300396."How could I know?@k@v53/75300397. .........Are you trying to tell me to stop ignoring the heart again?@k @v53/75300398.Tell me, what deduction can you make about how the head''s heart works?"'
51670: 'Will@r@v54/75400828."It''s because you''re the child of Kinzo and Beatrice."'
51671: 'BERNKASTEL@r@v28/72100085."......Well done.@k@v28/72100086. ...*giggle*giggle*giggle*giggle*."'
51672: '@rThere was a crisp applause and a mocking laugh.'
51673: 'Will@r@v54/75400829."BERNKASTEL."'
51674: 'BERNKASTEL@r@v28/72100087."......That was faster than I expected.@k@v28/72100088. I thought you''d let me play a bit longer."'
51675: '@rBERNKASTEL appeared sitting on the altar,@k ......almost as though it had become her own personal chair.'
51676: 'BERNKASTEL@r@v28/72100089."When did you realize that Lion shared Beatrice''s blood?"'
51677: 'Will@r@v54/75400830."As soon as I realized that Lion was 19.@k@v54/75400831. ......It was the same number as "the baby from 19 years ago", that hint which appeared in the fifth game."'
51678: 'BERNKASTEL@r@v28/72100090."......Didn''t that baby fall off a cliff?"'
51679: 'Will@r@v54/75400832."Lion is the baby who was accepted by Natsuhi and didn''t fall off the cliff.@k@v54/75400833. In other words, if Natsuhi rejects the baby, Lion doesn''t exist."'
51680: 'Lion@r@v53/75300399."You''re saying......I''m not Mom''s child...?!@k @v53/75300400.That''s insane......@k@|@y@v53/75300401. ....................."'
51681: 'BERNKASTEL@r@v28/72100091."You say that, but you don''t look too sure.@k@v28/72100092. ......*giggle*.@k@v28/72100093. That''s right.@k@v28/72100094. Ushiromiya Lion is not Natsuhi''s child.@k@v28/72100095. This is the grown-up version of the baby Kinzo got from somewhere 19 years ago."'
51682: 'Will@r@v54/75400834."Not "somewhere".@k@|@y@v54/75400835. ......Lion clearly shares Beatrice''s blood.@k@v54/75400836. The proof is the silver ring, which is only ever given to Lion across all of the many worlds."'
51683: 'Lion@r@v53/75300402."Why does the ring prove that I share Beatrice''s blood?"'
51684: 'Will@r@v54/75400837."In all of the many worlds, you are the only one who is given it.@k@v54/75400838. That means that, in all worlds, you are the most important person to Kinzo, second only to Beatrice.@k@v54/75400839. And his love for you is far greater than it is for his son, Krauss, or his granddaughter, Jessica.@k@v54/75400840. And you are 19 years old.@k@v54/75400841. ......In other words, if we look back to see what happened 19 years ago, we are led to one theory."'
51685: 'Lion@r@v53/75300403."19 years ago?@k @v53/75300404.What''s supposed to have happened at the time I was born?"'
51686: 'BERNKASTEL@r@v28/72100096.".........You heard it too, didn''t you?@k @v28/72100097.Today, even.@k@v28/72100098. Will was with you."'
51687: 'Lion@r@v53/75300405."........................@k@v53/75300406. ......You don''t mean...Aunt Rosa''s story?!"'
51688: 'Will@r@v54/75400842."That''s right.@k@v54/75400843. Rosa''s story came out in the third game, and when the age of the baby in the fifth game matched that date, a certain theory became possible.@k@v54/75400844. The fact that Kinzo brought a baby from somewhere and tried to add it to his family...@k@v54/75400845.proves that the baby was somehow important to him."'
51689: 'Lion@r@v53/75300407."I''m...@v53/75300408....the Kuwadorian Beatrice''s...@v53/75300409....child......"'
51690: 'Will@r@v54/75400846."The Kuwadorian Beatrice was the daughter of the Beatrice who came in the submarine.@k@v54/75400847. ......But Kinzo didn''t think of her as a daughter.@v54/75400848. He believed she was the same person, Beatrice reborn.@k@v54/75400849. ......When that "reincarnation" reached the same age as the first Beatrice, and truly looked like Beatrice''s double,@k@v54/75400850. ......Kinzo made a terrible mistake."'
51691: 'Lion@r@v53/75300410.".........I...I don''t want to hear it!"'
51692: 'BERNKASTEL@r@v28/72100099."That''s how it is.@k@v28/72100100. Kinzo got Beatrice pregnant with Beatrice,@k@v28/72100101. and then he got that Beatrice pregnant with you.@k@v28/72100102. ......So, you''re both Kinzo''s child and Beatrice''s grandchild."'
51693: 'Lion@r@v53/75300411."...........................!"'
51694: 'Will@r@v54/75400851."If we consider Kinzo''s heart, this is the inevitable theory we reach for explaining why he treated you so specially.@k@v54/75400852. He regretted his mistake so badly that he attempted to have you formally accepted into the Ushiromiya family as a descendant."'
51695: 'BERNKASTEL@r@v28/72100103."......In almost all cases, Natsuhi''s pride is brutally hurt, and she refuses to raise you.@k@v28/72100104. Because of that, you almost always fall from the cliff and disappear."'
51696: 'Lion@r@v53/75300412.".........I, I was told that after their marriage,@v53/75300413. ......I was born after much hardship,@k@v53/75300414. ......and Jessica was born the next year..."'
51697: 'Will@r@v54/75400853."If you really never suspected that Natsuhi wasn''t your mother,@k@v54/75400854. ......then you should thank her in this world.@k@v54/75400855. The reason you never realized the truth is because she''s shown as much affection for you as she did for Jessica."'
51698: 'BERNKASTEL@r@v28/72100105.".........There''s no need to thank her.@k@|@y@v28/72100106. ......After all, it took a staggering amount of effort just to find a fragment with you in it."'
51699: 'BERNKASTEL@r@v28/72100107."Mathematically speaking,@k@v28/72100108. there''s actually a 2,578,916/2,578,917 chance of her refusing to raise you.@k@v28/72100109. You should probably be thanking me for creating this miracle, not Natsuhi.@k@v28/72100110. ......*giggle*giggle*."'
51700: 'Will@r@v54/75400856."Enough with your stupid probability games."'
51701: 'BERNKASTEL@r@v28/72100111."Oh, I''m sorry."'
51702: 'Lion@r@v53/75300415."...................................."'
51703: 'Will@r@v54/75400857."No matter whose blood you bear, that doesn''t change the debt you owe to the family that raised you."'
51704: 'Lion@r@v53/75300416."I realize that.@k@v53/75300417. ......Still, I would like some time to calm down and think things through.@k@v53/75300418. ...That is, if you''ll do me the kindness of not ignoring my heart."'
51705: 'Will@r@v54/75400858.".........Sure."'
51706: '@rLion took a deep breath and looked upwards.'
51707: '@r......Anyone would be shocked...@kto find that their parents weren''t who they believed them to be.'
51708: '@rBut all the same, Lion, ...you''re allowed to feel grateful.@k Grateful to the family who raised you and met your every need...'
51709: 'Will@r@v54/75400859."It is pretty interesting.@k@v54/75400860. ......Hard to believe that the Golden Witch BEATRICE might''ve lived such an ordinary life,@k@v54/75400861. even at absurdly low probabilities."'
51710: 'BERNKASTEL@r@v28/72100112."Isn''t it?@k @v28/72100113.I think moments like this are hilarious......"'
51711: '@rWill had said it plainly.'
51712: '@rUshiromiya Lion......is how the Golden Witch BEATRICE appears in a different world.'
51713: '@rThe baby Natsuhi rejected 19 years previous.'
51714: '@rIf she accepts that child, this is the future that results...'
51715: '@rHowever, if she does not accept it, ......a witch is born.'
51716: '@rThe baby whose birth was not celebrated becomes a witch...'
51717: 'Will@r@v54/75400862."Lion is the dead cat.@k@v54/75400863. ......However, Lion''s existence has nothing to do with what you''re interested in, the Rokkenjima Serial Murders.@k@v54/75400864. ......In other words, Lion is the cat that disappears when you open the cat box."'
51718: 'BERNKASTEL@r@v28/72100114.".........*giggle*, exactly.@k@v28/72100115. Lion is just a disappearing cat.@k@|@y@v28/72100116. But this was a pretty entertaining diversion, don''t you think?"'
51719: 'Will@r@v54/75400865."You''re the only one who finds it entertaining.@k@v54/75400866. ......If I wasn''t trapped in here, I wouldn''t have bothered to reason this out."'
51720: 'Lion@r@v53/75300419.".....................@k@|@y@v53/75300420. ......I think I know why I was chosen to be your partner in this strange detective game.@k@v53/75300421. ......It seems this BERNKASTEL witch...@k@v53/75300422.enjoys toying with people''s fates and making a mockery of them."'
51721: 'BERNKASTEL@r@v28/72100117."Wow, incredible.@k@v28/72100118. ......It''s rare for someone to understand me the same day they meet me.@k@v28/72100119. ......*giggle*."'
51722: 'Lion@r@v53/75300423."Apparently, ......I become something that''s called a witch in another world.@k@v53/75300424. And, apparently, I''m the cause of some sort of crime.@k@v53/75300425. Is that my sin to bear?"'
51723: 'Will@r@v54/75400867."Of course it isn''t.@k@v54/75400868. You are you.@k@v54/75400869. How things would be if the coin were flipped the other way shouldn''t matter a bit."'
51724: 'Lion@r@v53/75300426."Thank you.@k@v53/75300427. Even so, to be told that I caused some sort of trouble in a world of a different fate...@k@v53/75300428. I don''t think anyone would be pleased to hear that.@k@v53/75300429. ......Please, tell me.@k@v53/75300430. What do I do in that other world?"'
51725: 'Will@r@v54/75400870."............BERNKASTEL?"'
51726: 'BERNKASTEL@r@v28/72100120."You have the fragments... Why not show them?"'
51727: 'Will@r@v54/75400871."..............."'
51728: '@rWill opened his hand...@w500.and something that looked like a pale-blue, glowing shard of crystal appeared there.'
51729: '@rIt contained the memories—no, the records—of all the games so far.'
51730: 'Will@r@v54/75400872."......Touch this.@k@v54/75400873. You''ll be able to see your fate in other worlds."'
51731: 'Lion@r@v53/75300431."...............I''ll be happier not touching it,@v53/75300432. ...is what your face is telling me."'
51732: 'Will@r@v54/75400874."Of course.@k@v54/75400875. ......I''m sure you guessed this, ...but it isn''t pretty."'
51733: 'Lion@r@v53/75300433."Even so......@k@v53/75300434. ......Even if it is another world, ......it''s still about me."'
51734: 'Will@r@v54/75400876."......You have both the right to know and the right not to know.@k@v54/75400877. If you can convince yourself that what you''re seeing is a person similar to yet different from you—that it is not you but someone else—then go ahead and touch it."'
51735: 'BERNKASTEL@r@v28/72100121."You want to know, don''t you...?@k @v28/72100122.About the path that fate could have chosen for you..."'
51736: 'Lion@r@v53/75300435."............I ask this as your partner.@k@v53/75300436. Would you show that to me?"'
51737: 'Will@r@v54/75400878."As your partner, I''d say "look".@k@v54/75400879. ......But as a friend, I''d say "don''t"."'
51738: 'Lion@r@v53/75300437."Unfortunately,@k@v53/75300438. I''m not your friend."'
51739: 'Will@r@v54/75400880."Then, as a partner, I have one last question."'
51740: 'Lion@r@v53/75300439."What?"'
51741: 'Will@r@v54/75400881."Are you............@k@v54/75400882..........a man or a woman?"'
51742: 'Lion@r@v53/75300440."..................Well, that came out of nowhere."'
51743: 'Will@r@v54/75400883."I could see you as a fairly slender boy.@k@v54/75400884. But then again, I could also see you as a no-nonsense sort of girl.@k@v54/75400885. ......Even BERNKASTEL has been intentionally keeping it a secret.@k@v54/75400886. She made Jessica call you "the future heir" all the time, instead of "big brother" or "big sister"."'
51744: 'BERNKASTEL@r@v28/72100123."......*giggle*.@k@v28/72100124. You are quick."'
51745: 'Lion@r@v53/75300441."People often ask me about my gender.@k@v53/75300442. It''s become quite frustrating, so I always give the same response.@k@v53/75300443. ......''Which do you think I look like?''"'
51746: 'Will@r@v54/75400887.".........In the fifth game, you''re treated as a man.@k@v54/75400888. But in countless other games, you''re thought of as a woman."'
51747: 'Will@r@v54/75400889."......In the sixth game, when Ushiromiya Battler was the Master, two demons of different sexes appeared, but we didn''t know which was which, referencing this again.@k@v54/75400890. ......In fact, strictly speaking, it started all the way back in the very first game.@k@v54/75400891. .........Your gender is one of the hidden mysteries that exists outside the games themselves."'
51748: 'Lion@r@v53/75300444."Having to say it straight out frustrates me, so I won''t give you an answer.@k@v53/75300445. We''re partners, right?@k @v53/75300446.Does it really matter if I''m not the gender you''d prefer?"'
51749: 'Will@r@v54/75400892."........................@k@|@y@v54/75400893. ......You''re right.@k@v54/75400894. If we''re working together on this, I don''t care what your gender is."'
51750: 'Lion@r@v53/75300447."Thank you.@k@v53/75300448. ......I''ve formed a bit of a complex about it, so your words are very gratifying."'
51751: 'Will@r@v54/75400895."I''m all for gender equality.@k@v54/75400896. .........If someone''s a waste of space, I''ll smack ''em no matter who they are."'
51752: 'Lion@r@v53/75300449."And of course, I''ll pinch rude people no matter which gender they are."'
51753: '@rSlowly, ......Lion reached out and touched the fragment.'
51754: '@rA moment later, Lion seemed to undergo a violent bout of dizziness...and silently slumped over like a puppet with its strings cut.@|@y'
51755: '@rIt was no surprise.@k When people who don''t understand parallel universes have many different fates jammed into their heads,@k they tend to feel like their heads are swelling and their sense of self is melting away.'
51756: '@r......Lion seemed to have lost consciousness.'
51757: 'Will@r@v54/75400897."So, ......Lion had what it took to learn everything."'
51758: 'BERNKASTEL@r@v28/72100125."A perfect piece to be your partner, wouldn''t you say?"'
51759: 'Will@r@v54/75400898."I''ll continue my reasoning.@k@v54/75400899. ......I''ve talked about the dead cat."'
51760: 'BERNKASTEL@r@v28/72100126."Very true.@k@v28/72100127. Next up is the living cat."'
51761: 'Will@r@v54/75400900."The only one who can kill the BEATRICE of 1986 is the one who created her."'
51762: 'BERNKASTEL@r@v28/72100128."There were tons of hints.@k@v28/72100129. If you think about it, they''ve been coming since back when BEATRICE was running the games."'
51763: 'Will@r@v54/75400901."That''s true.@k@v54/75400902. ......In the fourth game between BEATRICE and Battler, BEATRICE''s origin became clear.@k@v54/75400903. And, at that point, I learned who BEATRICE was, and I understood that person''s heart."'
51764: 'BERNKASTEL@r@v28/72100130."What do you mean by heart?"'
51765: 'Will@r@v54/75400904."......The reason for committing the crime.@k@v54/75400905. ......The reason that BEATRICE had to gamble her own fate in the commission of a game-like crime on October 5th, 1986—@k@v54/75400906.the motive."'
51766: 'BERNKASTEL@r@v28/72100131."Impressive.@k@v28/72100132. So, you''d figured out the whodunit and the whydunit by the end of the fourth game.@k@v28/72100133. ......Then what about the howdunit?"'
51767: 'Will@r@v54/75400907."Once you know who the culprit is, theorizing about the howdunit isn''t impossible.@k@v54/75400908. ......Those linked locked rooms in the third game were so skillfully done, I felt like clapping."'
51768: 'BERNKASTEL@r@v28/72100134."And what about the riddle at the end of the fourth game,@k@v28/72100135. "who am I"......?"'
51769: 'Will@r@v54/75400909."The "culprit" who can kill you for certain at the stroke of midnight on October 5th no matter where you are.@k@v54/75400910. It was possible to form a certain kind of hypothesis at the moment the question was asked.@k@v54/75400911. ......You might call that the other treasure of the Golden Land."'
51770: 'BERNKASTEL@r@v28/72100136."......Oh?@k@v28/72100137. So, you say that by the fourth game,@k@v28/72100138. ......in other words, with just BEATRICE''s games, you managed to reach all of the answers?"'
51771: 'Will@r@v54/75400912."It''s possible.@k@v54/75400913. ......LAMBDADELTA''s and Battler''s games after that were just an extra helping of hints.@k@v54/75400914. ......As is this game of yours."'
51772: 'BERNKASTEL@r@v28/72100139."*giggle*giggle*......@k@v28/72100140. ......In that case, why don''t you stop beating around the bush, and just tell me?@k @v28/72100141..........Who is...@v28/72100142.the culprit......?"'
51773: '@rAt that moment, .........though there hadn''t been anyone but them in the chapel, quiet footsteps rang out.'
51774: '@rThat silhouetted figure slowly walked up to Will and BERNKASTEL...and gave a small bow.'
51775: 'Will@r@v54/75400915.".........So, you''ve come."'
51776: 'BERNKASTEL@r@v28/72100143."Did you call this person here?"'
51777: 'Will@r@v54/75400916."Yeah.@k@v54/75400917. ......Whodunit.@k@v54/75400918. Howdunit.@k@v54/75400919. And...whydunit.@k@v54/75400920. ......I understand this person''s motive."'
51778: 'BERNKASTEL@r@v28/72100144."......And you, are you going to give up just because he''s found out your motive...?@k @v28/72100145.There''s no concrete evidence, right?@k @v28/72100146.You could make a flashy fight of it, with red and blue."'
51779: 'Will@r@v54/75400921."That''s not what they want anymore."'
51780: '@rThe person nodded slightly.'
51781: '@rTheir wish......was for someone to realize.'
51782: '@rNow that this had happened, they had no intention of engaging in trivial excuses or pointless word games...'
51783: 'Will@r@v54/75400922."I believe that I understand your motive,@v54/75400923. ......your heart.@k@v54/75400924. ......I am going to talk about it now.@k@v54/75400925. I called you here...@v54/75400926.to listen...@v54/75400927....and correct me if I''ve gotten anything wrong."'
51784: 'Will@r@v54/75400928."...................................."'
51785: '@rThe two of them nodded to each other once more.'
51786: 'Will@r@v54/75400929."I found the message you put into your four games.@k@v54/75400930. ......And through three games with different Masters, I pictured the strange sort of fate that must have toyed with your life.@k@v54/75400931. ......I was left speechless.@k@v54/75400932. ......In every game, you die without revealing that truth to anyone."'
51787: '@rHaving you confess in this empty chapel might be pointless.'
51788: '@rHowever, even so, .........I believe it will bring you some measure of salvation.'
51789: '@rPeople are only saved when someone understands them.'
51790: '@rIt''s time someone forgave this pitiable witch, who went years after her death without being understood,@k ............and whose life ended before the one man she wanted to understand her could do so.'
51791: '@rAt the end of the fifth game, Battler finally understood.'
51792: '@r......However,@w333. .........it took him so long...@w166....that he didn''t make it in time.'
51793: '@rSo, even though she is alive here and now, Battler cannot save her.'
51794: '@rThat''s why he''s absent from BEATRICE''s funeral. He won''t come.@k ......He won''t make it in time.'
51795: 'Will@r@v54/75400933."......This is BEATRICE''s funeral.@k@v54/75400934. You will confess,@v54/75400935. ......the divine Master will hear,@v54/75400936. .........and I will forgive you.@k@v54/75400937. .........That''s supposed to be Battler''s job, but he didn''t make it in time.@k@v54/75400938. So, you''ll have to settle for me."'
51796: 'BERNKASTEL@r@v28/72100147."......Beato gave out so many hints, too.@k@v28/72100148. Lambda also gave that bonehead Battler a ton of hints.@k@v28/72100149. ......And his response, that game of repentance, that was hilarious as well.@k@v28/72100150. ......But I won''t be making anyone laugh.@k@v28/72100151. I''ll just indifferently carry out your funeral."'
51797: 'Will@r@v54/75400939."No more talking from you.@k@v54/75400940. That''s my job."'
51798: 'BERNKASTEL@r@v28/72100152."............*giggle*."'
51799: 'Will@r@v54/75400941."If you''re ready, let''s begin.@k@v54/75400942. ......No one will rush you.@k@v54/75400943. .........BERNKASTEL has closed off time for eternity until your funeral ends.@k@v54/75400944. You have endless time to prepare yourself emotionally..."'
51800: '@rThe shadowy figure slowly shook its head.'
51801: '@rIt had come here because it was already ready.'
51802: '@rWill nodded to show he understood.'
51803: '@r......Then, the two of them looked into BERNKASTEL''s eyes,@k ......and Will spoke out clearly.'
51804: 'Will@r@v54/75400945.@a1666."Here''s the culprit."'