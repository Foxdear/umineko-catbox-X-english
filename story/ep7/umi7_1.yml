49383: 'Lion@r@v53/75300057."What...@v53/75300058....do you mean by that...?!"'
49384: 'Will@r@v54/75400162.".........Explaining''s a pain, so I''ll give you the short version.@k@v54/75400163. Basically, unless we play along with that witch''s game, no one can leave this place."'
49385: 'Lion@r@v53/75300059."Wh-......what are you talking about...?!@k @v53/75300060.The funeral is already over!@k @v53/75300061.I''m sure some people will want to return to the mansion or the guesthouse.@k@v53/75300062. We can''t be locked up in here!"'
49386: 'Will@r@v54/75400164."If you''ve got a problem, that witch is the one to hate.@k@v54/75400165. Being stuck in a place like this isn''t any more pleasant for me."'
49387: 'Lion@r@v53/75300063."That girl''s your friend, right?!@k @v53/75300064.Make her stop all this weirdness."'
49388: 'Will@r@v54/75400166."She''s probably sitting in a spectator''s seat with a bucket of popcorn about now.@k@v54/75400167. Even if I call her, she won''t come."'
49389: 'Lion@r@v53/75300065."Wh-what on Earth is going on?!!"'
49390: '@rThat short sentence described all of Lion''s feelings at that moment.'
49391: '@rHowever, Lion had seen the rose Will threw wither in an instant in the rainy darkness.'
49392: '@r......Lion tried doing the same thing with another rose, but the effect was exactly the same.'
49393: '@rNo one would want to use their own body to test this fearsome something that could make roses crumble instantly......'
49394: 'Will@r@v54/75400168."There''s only one way for us to be released from here.@k@v54/75400169. ......We have to play along with BERNKASTEL''s game."'
49395: 'Lion@r@v53/75300066."......You mean the one about who killed Beatrice?"'
49396: 'Will@r@v54/75400170."That''s what she''s telling us to investigate.@k@v54/75400171. If you could tell me about it, it''d make things go more quickly.@k@v54/75400172. ......That fickle witch will be totally satisfied.@k@v54/75400173. You''ll be able to get rid of the two of us, and I get to go home in time for my date with Diana.@k@v54/75400174. ......If I keep her waiting too long, she''ll start tearing up the sofa again."'
49397: 'Lion@r@v53/75300067."Who killed Beatrice, you say......@k@v53/75300068. That''s hardly something to go barging into a funeral and start asking the family about."'
49398: 'Will@r@v54/75400175."Questioning the family of the deceased is one of the basics of the mystery genre.@k@v54/75400176. Just give up and accept it.@k@|@y@v54/75400177. ......I do know that Beatrice is the mistress of Kinzo, the family head."'
49399: 'Lion@r@v53/75300069.".....................@k@v53/75300070. You really are a strange person.@k@|@y@v53/75300071. ......How do you know so much about this family?@k@v53/75300072. ......Are you sure you have no connections with us...?"'
49400: '@rWill knew so much about the Ushiromiya family because BERNKASTEL had shown him all of the fragments so far.'
49401: '@rOf course, he had no sort of connection with the Ushiromiya family himself.@k@rThe very plane of his existence was on a different level.'
49402: 'Will@r@v54/75400178."However, Beatrice died a long, long time ago.@k@v54/75400179. According to Genji, she passed away before the mansion was completed,@k@v54/75400180. but the reason for her death is unclear.@k@v54/75400181. .........To be honest, this is the first I''ve heard that she was "killed".@k@v54/75400182. ......Tell me about it."'
49403: 'Lion@r@v53/75300073.".........My name is Ushiromiya Lion."'
49404: 'Will@r@v54/75400183."Willard.@k@v54/75400184. Call me Will."'
49405: '@rFor the first time, Will introduced himself.'
49406: '@rThe mutual introduction was finally completed, and Lion was finally able to talk with him on an even footing.'
49407: '@r......However, Lion took a deep breath, and looked up at the sky, wearing a vague smile.'
49408: 'Lion@r@v53/75300074."Will-san."'
49409: 'Will@r@v54/75400185."Call me Will.@k@v54/75400186. I''ll call you Lion."'
49410: 'Lion@r@v53/75300075."......Will.@k@v53/75300076. To be honest, ......even I don''t know much about this person called Beatrice."'
49411: 'Will@r@v54/75400187."...............I see.@k@v54/75400188. I guess it''s called a game for a reason."'
49412: '@rIf only Lion could''ve told him everything, revealing the truth without any effort from Will......'
49413: '@rApparently, things wouldn''t be so easy after all.'
49414: 'Lion@r@v53/75300077."Everyone who enters the Ushiromiya family knows the name and image of Beatrice."'
49415: 'Will@r@v54/75400189."That''s because of the massive portrait hanging in the entrance hall, isn''t it?@k@v54/75400190. That portrait was first displayed in April of 1984."'
49416: 'Lion@r@v53/75300078."Really, ......how is it that you know so much?@k@|@y@v53/75300079. ......Ah, well.@k@v53/75300080. It''s about time I stopped finding that odd.@k@v53/75300081. I''m sure you''ll just start speaking in riddles again."'
49417: '@rLion was the successor to the head and lived with the main family.@k@rKinzo frequently chose to speak with his successor.'
49418: '@rBecause of this, Lion must have been used to chatting with people who were moody or hard to follow.'
49419: '@rDeciding once and for all that getting hung up on trivialities would be nothing but a waste of time,@k Lion was able to converse naturally with this unknown man called Will, as though the two of them had been friends for a long time......'
49420: 'Will@r@v54/75400191."Everyone knows Beatrice.@k@v54/75400192. And yet, no one knows her.@k@v54/75400193. Kinzo''s the only one who''s ever met her."'
49421: 'Lion@r@v53/75300082."......The head seems to be particularly upset today.@k@v53/75300083. I''ll find a good time to introduce you to him, so I ask that you adopt an appropriately reserved and polite attitude, Will-san."'
49422: 'Will@r@v54/75400194."That makes things easy.@k@v54/75400195. ......I thought you''d resist a bit more than that."'
49423: 'Lion@r@v53/75300084."I''m used to speaking with the family head.@k@v53/75300085. I''ve learned to accept most unreasonable situations and just go with the flow."'
49424: '@rBERNKASTEL had set up a "barrier" cutting the chapel off from the rest of the world.'
49425: '@rTo destroy that, they would have to find out "who killed BEATRICE".'
49426: '@rFor Lion, who had been made to go along with Kinzo on many an occasion, understanding this much was all that was necessary......'