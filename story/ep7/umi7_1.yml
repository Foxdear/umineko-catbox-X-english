49332: 'BERNKASTEL@r@v28/72100047.@|@y"@c279.@[That''s a Devil''s Proof.@k@v28/72100048. Maybe it just isn''t inside the casket?@k@v28/72100049. Unless you can prove that no corpse exists, this is mystery.@]@c."'
