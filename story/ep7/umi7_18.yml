55050: 'Clair@r@v55/75500900."............And that...@k@v55/75500901....is the end of my tale."'
55051: 'BERNKASTEL@r@v28/72100201."Oh,@k@v28/72100202. ......you''re ending it there?@k @v28/72100203.But aren''t the next two years the fun part...?"'
55052: 'Will@r@v54/75401105."We don''t need them.@k@v54/75401106. ......After all we''ve heard in the past games about your inner conflict and how you suffered,@k@v54/75401107. you don''t need to say any more."'
55053: 'Lion@r@v53/75300578."............You mean......the conflict of the furniture with incomplete souls?"'
55054: 'Clair@r@v55/75500902."There was a duel.@k@v55/75500903. The result had almost been decided.@k@v55/75500904. .........However, the year 1986......was incredibly merciless."'
55055: 'Will@r@v54/75401108."......I''ll bet you cursed your fate."'
55056: 'Clair@r@v55/75500905."Yes.@k@v55/75500906. .........If it had been one year sooner.@k@v55/75500907. ......Or else, one year later."'
55057: 'Will@r@v54/75401109."The duel would''ve been settled... Though in different forms."'
55058: '@rSilently, Clair hung her head.'
55059: '@r......If only I had been given time...@k Or else, if I hadn''t been given time to think and agonize.'
55060: '@rI curse...everything.@k Why......did it have to be 1986?'
55061: 'Clair@r@v55/75500908."I decided...@k@v55/75500909....to delegate my fate."'
55062: 'Lion@r@v53/75300579.".........Delegate it......"'
55063: 'Clair@r@v55/75500910."Like the ritual by which I inherited everything from the previous head,@k@v55/75500911. ......I decided to put myself in the hands of that fate called a miracle."'
55064: '@rIt may be more accurate to say that I entrusted my fate to a spin of the roulette.'
55065: '@rI—we—could not even decide our own fate,@k so we let fate decide everything for us.'
55066: '@rPerhaps someone''s efforts would be rewarded.@k@rOr, perhaps all would be joined and set free.@k@rOr, perhaps someone would be kind enough to put a stop to this lunacy.'
55067: 'Clair@r@v55/75500912."......No matter which fate the roulette chose,@k@v55/75500913. I planned to obey its ruling.@k@v55/75500914. I would not resist fate.@k@v55/75500915. ......After all, ......whenever I have tried in the past, fate has always been heartless to me........."'
55068: '@rClair hung her head and let a single tear drop down...'
55069: '@rHumans will carelessly say that people have infinite possibilities.@k@rHowever, the Endless Witch......knows how limited those possibilities really are.'
55070: '@rSo, within the limits of her fate, she tried to find the infinite.'
55071: '@rBy entrusting her fate to God, she tried to find the infinite.'
55072: '@rHowever, this did not mean that she abandoned her fate.@k@rBecause she spun fate''s roulette with an unshakable and certain will.'
55073: '@rA certain fate, where absolutely no one could escape if the epitaph was not solved.'
55074: '@rWith it, she sealed up the island, herself included.'
55075: '@rOctober 4th and 5th, 1986, were sealed away by an absolute and certain will,@k .........and she entrusted herself to one of the fates that could be chosen in that short span of time on that island.'
55076: 'Clair@r@v55/75500916.".........And now,@k@v55/75500917. my confession truly is over.@k@v55/75500918. ......This should be enough to find the motive for the crime.@k@v55/75500919. .........If you still do not know, I will say no more.@k@v55/75500920. It''s not as though...anyone could understand my heart anyway."'
55077: 'Will@r@v54/75401110."Yeah.@k@v54/75401111. ......There''s no need to say any more."'
55078: 'Clair@r@v55/75500921."......After watching how I wandered into a dead-end of fate,@k@v55/75500922. ......Lion, do you see how great a hope you represent to me?"'
55079: 'Lion@r@v53/75300580."........................@k@v53/75300581. ............I''m...a different possibility for you."'
55080: 'Clair@r@v55/75500923."The fact of your happiness makes me jealous, but to an even greater degree, it shines brightly in my eyes.........and makes me smile.@k@v55/75500924. ......You were a possible future.@k@v55/75500925. .........Right now, .........that fact is my salvation."'
55081: 'Lion@r@v53/75300582.".........I.................."'
55082: 'Clair@r@v55/75500926."......Live with enough happiness for the both of us.@k@v55/75500927. I''m glad I got to meet you once...at the end.@k@v55/75500928. .........You have my thanks,@k@v55/75500929. Lady BERNKASTEL."'
55083: 'BERNKASTEL@r@v28/72100204.".........I''m just carrying out your funeral.@k@v28/72100205. There''s no need to thank me.@k@|@y@v28/72100206. ......Well, it''s about time to end this.@k@v28/72100207. It''s about time to send the dead to the land of the dead."'
55084: 'Clair@r@v55/75500930."..................Yes.@k@v55/75500931. This is my funeral, after all.@k@v55/75500932. It''s time for me to go back to where I belong."'
55085: 'Lion@r@v53/75300583."................................."'
55086: 'Clair@r@v55/75500933."Don''t make that face.@k@v55/75500934. And please, rejoice that you are not me.@k@v55/75500935. After all, I rejoice in that fact as well."'
55087: 'Lion@r@v53/75300584.".........I''ll live.@k@v53/75300585. ......I''ll live life for the both of us..."'
55088: 'Clair@r@v55/75500936."Thank you.@k@v55/75500937. .........Live in happiness.@k@v55/75500938. And someday, find yourself a wonderful person.@k@|@y@v55/75500939. ......I pray that you live as a Human, without awakening as a witch.@k@v55/75500940. ......That you have a whole and single soul...and love one person with all your strength...@k@v55/75500941. ......I hope you live your life like that."'
55089: 'Lion@r@v53/75300586."............Okay......"'
55090: 'Clair@r@v55/75500942."Will-san.@k@v55/75500943. I thank you for being an observer.@k@v55/75500944. ......You aren''t the one I truly wanted to understand me, ......but you have saved my heart."'
55091: 'Will@r@v54/75401112."I...understand you.@k@v54/75401113. I don''t ignore the heart."'
55092: 'Clair@r@v55/75500945.".........Thank you.@k@v55/75500946. ............So, now that I have a splendid observer who understands me, ......I want to entrust my final moments to you."'
55093: 'Will@r@v54/75401114.".....................Are you sure?"'
55094: 'Clair@r@v55/75500947."Yes.@k@v55/75500948. ......For me, the important thing is whether the person understands me, not how well I know them."'
55095: '@r......The one I wanted to understand me...didn''t.@k......A person with no connection to me...did.'
55096: '@rThere''s nothing sad about it.@k On the contrary, the fact that a person with no relation to me was still able to understand me is a miracle that I feel grateful for.'
55097: 'Clair@r@v55/75500949."You are a good observer...and the only one who has managed to understand me.@k@v55/75500950. ......That connection is strong enough."'
55098: 'Will@r@v54/75401115."............Alright."'
55099: 'Clair@r@v55/75500951."I offer my heart to you, ......nameless and wonderful observer."'
55100: 'Will@r@v54/75401116."..........................."'
55101: 'BERNKASTEL@r@v28/72100208."......Lion.@k@v28/72100209. Get back."'
55102: 'Lion@r@v53/75300587."Huh?@k @v53/75300588.......What''s going to happen...?"'
55103: 'BERNKASTEL@r@v28/72100210."A mystery story can''t meet its death...unless the detective performs the last rites."'
55104: 'Will@r@v54/75401117."............Will just stopping your heart be enough...?"'
55105: 'Clair@r@v55/75500952."When you mourn the dearly departed, do you put just their heart into the coffin?"'
55106: 'Will@r@v54/75401118.".........Got it.@k@v54/75401119. ......That which was born from earth will return to earth.@k@v54/75401120. ......I''ll return all of you to the earth."'
55107: 'Clair@r@v55/75500953."Earth to earth.@k@v55/75500954. Ashes to ashes, dust to dust.@k@v55/75500955. Illusions to illusions.@k@v55/75500956. And dreams to dreams."'
55108: 'Will@r@v54/75401121."..................Right."'
55109: 'Clair@r@v55/75500957.".........Then let us begin.@k@v55/75500958. .........This is my...burial."'
55110: 'Will@r@v54/75401122."Whenever you''re ready."'
55111: 'Clair@r@v55/75500959."Let us start.@k@v55/75500960. ......In the manner of the end of my final game."'
55112: '@rLight gathered at Will''s back, and a sword materialized there.'
55113: '@rSlowly, ......he drew it out.'
55114: '@rIts pitch-black tip, which could neatly slice apart truth from fiction,@k swung once, leaving a black trail, and then again, leaving a white trail.'
55115: 'Will@r@v54/75401123.".........I''ll cut the truth out from the fiction.@k@v54/75401124. ............Come."'
55116: '@rFollowing Will''s lead, a similar sword appeared in Clair''s hand.'
55117: '@rIts tip glinted silver, the opposite of Will''s.'
55118: 'Clair@r@v55/75500961."First game, first twilight.@k@v55/75500962. Six corpses in the gardening shed."'
55119: 'Will@r@v54/75401125."Illusions to illusions.@k@v54/75401126. ......The corpse that cannot return to earth returns to illusions."'
55120: '@rWill''s pitch-black slash cut across Clair''s body at an angle.'
55121: '@rThe blade passed through her like she was water, ......but its tip sent golden flower petals scattering.'
55122: 'Clair@r@v55/75500963."First game, second twilight.@k@v55/75500964. Two corpses are close together in a locked room protected by a chain."'
55123: 'Will@r@v54/75401127."Illusions to illusions.@k@v54/75401128. ......A chain of illusions can imprison only illusions."'
55124: '@rThe razor-thin black blur sent golden flower petals scattering again...'
55125: 'Clair@r@v55/75500965."First game, fourth twilight.@k@v55/75500966. The old head from the locked-room study, confined in a scorching furnace."'
55126: 'Will@r@v54/75401129."Illusions to illusions.@k@v54/75401130. ......Let the man of illusions go to where he belongs."'
55127: 'Clair@r@v55/75500967."First game, fifth twilight.@k@v55/75500968. The last moments of the boy who offered his chest to a stake."'
55128: 'Will@r@v54/75401131."Illusions to illusions.@k@v54/75401132. ......The witch and stake of illusions can pierce naught but illusions."'
55129: 'Clair@r@v55/75500969."First game, sixth, seventh, and eighth twilights.@k@v55/75500970. Three corpses lying in the locked room of the singing girl."'
55130: 'Will@r@v54/75401133."Illusions to illusions.@k@v54/75401134. ......Illusions are the blind girl''s song. Illusion of a locked room."'
55131: 'Clair@r@v55/75500971."...............Well done.@k@v55/75500972. ......Yes, you really are splendid."'
55132: 'Will@r@v54/75401135."......That was a risky game from the very start.@k@v54/75401136. ......What would you have done if he''d insisted on seeing your face and just stepped inside?"'
55133: 'Clair@r@v55/75500973."That''s what it means to entrust yourself to fate."'
55134: 'Will@r@v54/75401137.".........And that''s the roulette you were talking about."'
55135: 'Clair@r@v55/75500974."Let us continue.@k@|@y@v55/75500975. Second game, first twilight.@k@v55/75500976. Six with their stomachs split in the locked-room chapel."'
55136: 'Will@r@v54/75401138."Illusions to illusions.@k@v54/75401139. ......The gold truth locks the lock of illusions."'
55137: 'Clair@r@v55/75500977."Second game, second twilight.@k@v55/75500978. Even the corpses of the two who are close cannot be close."'
55138: 'Will@r@v54/75401140."Illusions to illusions.@k@v54/75401141. ......Illusions who have fulfilled their role do not leave a corpse."'
55139: 'Clair@r@v55/75500979."Second game, fourth, fifth, and sixth twilights.@k@v55/75500980. In Natsuhi''s locked room, none are left alive."'
55140: 'Will@r@v54/75401142."Earth to earth.@k@v54/75401143. ......No one would dispute that a coffin is a locked room."'
55141: 'Clair@r@v55/75500981."Second game, seventh and eighth twilights.@k@v55/75500982. The two sliced to death by the red-eyed phantom."'
55142: 'Will@r@v54/75401144."Earth to earth. Illusions to illusions.@k@v54/75401145. ......No illusion can create a corpse."'
55143: '@rEvery time the blade passed through Clair''s body, golden flower petals flew everywhere.'
55144: '@r......Bit by bit, the petals covering her heart were being torn away.'
55145: '@rThe witch illusion......was scattering.'
55146: 'Clair@r@v55/75500983."Third game, first twilight.@k@v55/75500984. Six corpses connected by the linked locked rooms."'
55147: 'Will@r@v54/75401146."Illusions to illusions.@k@v54/75401147. ......In a locked-room ring, the end and the beginning overlap."'
55148: 'Clair@r@v55/75500985."Third game, second twilight.@k@v55/75500986. The corpses of mother and child lie together in the rose garden."'
55149: 'Will@r@v54/75401148."Earth to earth.@k@v54/75401149. ......No falsehoods in their final moments as told."'
55150: 'Clair@r@v55/75500987."Third game, fourth, fifth, and sixth twilights.@k@v55/75500988. Three corpses lying in the mansion."'
55151: 'Will@r@v54/75401148."Earth to earth.@k@v54/75401149. ......No falsehoods in their final moments as told."'
55152: 'Clair@r@v55/75500989."Third game, seventh and eighth twilights.@k@v55/75500990. The corpses of husband and wife lie exposed under the arbor."'
55153: 'Will@r@v54/75401152."Earth to earth.@k@v54/75401153. ......The obvious culprit wields the blade of impermanence."'
55154: 'Clair@r@v55/75500991."Fourth game, first twilight.@k@v55/75500992. A massacring storm sweeps through the dining hall."'
55155: 'Will@r@v54/75401154."Illusions to illusions.@k@v54/75401155. ......Tales woven by the gold truth return to illusions."'
55156: 'Clair@r@v55/75500993."Fourth game, second twilight.@k@v55/75500994. The two young ones face their trials and pass away together."'
55157: 'Will@r@v54/75401154."Illusions to illusions.@k@v54/75401155. ......Tales woven by the gold truth return to illusions."'
55158: 'Clair@r@v55/75500995."Fourth game, fourth, fifth, sixth, seventh, and eighth twilights.@k@v55/75500996. None of the runaways are left alive."'
55159: 'Will@r@v54/75401158."Earth to earth. Illusions to illusions.@k@v54/75401159. ......Silent corpses, adorned by fiction."'
55160: 'Clair@r@v55/75500997."Fourth game, ninth twilight.@k@v55/75500998. And none shall be left alive."'
55161: 'Will@r@v54/75401160."Earth to earth. Illusions to illusions.@k@v54/75401161. ......Fiction locked inside a cat box becomes truth."'
55162: '@r......Over and over again, Clair''s body was sliced by the pitch-black sword.'
55163: '@rAs proof, the chapel was now filled with golden flower petals, ......which danced around like gold snow.'
55164: 'Lion@r@v53/75300589.".........It''s beautiful............"'
55165: 'BERNKASTEL@r@v28/72100211."Who wouldn''t want their last moments to be like that?"'
55166: '@rThe gold snow was like confetti at the finale of a show.@k@rThe curtains were finally falling on the stage that was her.'
55167: 'Clair@r@v55/75500999."......Then, one final question."'
55168: 'Will@r@v54/75401162."............Sure."'
55169: '@rClair slowly raised her hands.@k@rThe sword she held became golden rose petals and melted away.'
55170: '@rShe stood there, arms wide, waiting for the final strike......'
55171: 'Clair@r@v55/75501000."Who...am I......?"'
55172: 'Will@r@v54/75401163."Illusions...to illusions.@k@v54/75401164. ......The promised reaper lowers the curtains on the tale regardless of the witch''s will."'
55173: '@rThe wide swing of Will''s pitch-black blade...@k......cleaved through Clair''s form.'
55174: '@rBlown away by a powerful gust of wind,@k ......her human form crumbled in an instant, became a storm of golden flower petals, and was torn apart.'
55175: '@rAfter she was blown away, a golden heart remained in midair,@k but it too was swallowed by the vortex of wind and broke down into flower petals.'
55176: '@rThe golden vortex swirled around the chapel......@k Then, the swirl of petals gradually scattered out of existence......and vanished......'
55177: '@rA few remaining petals danced around like snowflakes,@k and those final vestiges decorated the chapel beautifully.'
55178: '@r.........A beam of light lit the center of the stage.'
55179: '@rThere stood Clair, whose tale had ended.'
55180: '@rThen, slowly, ......softly, .........she faced the audience and bowed.'
55181: '@rApplause spread throughout the theater.'
55182: '@rThe long, long tale she had just finished telling was being given massive applause.'
55183: '@rIt went on and on.@k .........And on and on.'
55184: '@rThe stage slowly sunk into the darkness of oblivion.'
55185: '@rClair continued to bow in front of the unending applause......and as the curtain fell, she faded into the darkness.'
55186: '@r......People are born with sin...and live life to obtain forgiveness from someone.'
55187: '@rOr perhaps they are born as mysteries...and live life searching for someone to solve them.'
55188: '@rHere, all of her riddles had been solved, ......with no lingering regrets.'
55189: '@rPeople are riddles.'
55190: '@rThey want someone else to solve their riddle.@k@rThey live life wanting someone to solve the riddle that they are, the most difficult riddle in the world.'
55191: '@rThey want someone to look at the riddle they are.@k@rAnd they want that person to solve it.'
55192: '@rFor her, that wish has been granted......'
55193: '@r.........Her soul will wander no longer.'
55194: '@rRest in eternal slumber......within your cat box coffin.........'
55195: '@rThough there had been so many golden flower petals flitting about like a blizzard, ......not a single one remained.'
55196: '@rEverything had become dust, vanished as though there had been nothing there in the first place, ......and all was silent once more.'
55197: '@rEven the sound of rain was gone.@k The rain must have stopped at some point.'
55198: 'Lion@r@v53/75300590.".............................."'
55199: 'Will@r@v54/75401165.".........Meeting you was her salvation."'
55200: 'Lion@r@v53/75300591."I......hope so."'
55201: 'Will@r@v54/75401166."She cursed herself and her inescapable, dead-end fate...and gave up.@k@v54/75401167. ......Meeting you, a happy miracle in her eyes, saved her in a way nothing else could.@k@v54/75401168. ......So don''t make that face."'
55202: 'BERNKASTEL@r@v28/72100212."...........................Heh."'
55203: 'Will@r@v54/75401169."That was a pretty tasteful ending...for you."'
55204: 'BERNKASTEL@r@v28/72100213."......Auau only told me to carry out the funeral.@k@v28/72100214. ......Well, I just called a facilitator, you, and let you do everything."'
55205: 'Lion@r@v53/75300592."Thank you, Will."'
55206: 'Will@r@v54/75401170.".........Nn."'
55207: 'Lion@r@v53/75300593."In Clair''s place, I want to thank you.@k@v53/75300594. ......Thanks for cutting off all the lingering regrets...for a "me" of a different fate."'
55208: 'Will@r@v54/75401171.".........I thought I''d see a bit more head clutching and blind confusion from you."'
55209: 'Lion@r@v53/75300595."I understand now.@k@v53/75300596. ......I realize how happy my life has been.@k@v53/75300597. ......If fate had toyed with me...and if I was living in another world, I might have gotten stuck in the same dead-end of fate.@k@v53/75300598. ......However, thanks to an extremely improbable bit of good luck, I live in this world.@k@v53/75300599. ......I now know how much that means...how much it''s worth."'
55210: 'Will@r@v54/75401172."................................."'
55211: 'BERNKASTEL@r@v28/72100215.".........What''s up?@k @v28/72100216.Why the significant look?"'
55212: 'Will@r@v54/75401173."I thought decent witches didn''t exist,@k@v54/75401174. ......but I might have to change that theory."'
55213: 'BERNKASTEL@r@v28/72100217."Don''t worry, no need to change it.@k@v28/72100218. ......I only joined that kid''s game to kill some time.@k@v28/72100219. ......And, though I lost, I enjoyed playing."'
55214: 'BERNKASTEL@r@v28/72100220."......That kid died without folding up her game board.@k@v28/72100221. ......I just took charge of cleaning up...as thanks to her for letting me play and because it''s the loser''s duty."'
55215: 'Will@r@v54/75401175.".........I was sure you''d be a lot crueler than this."'
55216: 'BERNKASTEL@r@v28/72100222."Crueler?"'
55217: 'Will@r@v54/75401176."I thought this''d be a cruel game that ignores the heart."'
55218: 'BERNKASTEL@r@v28/72100223."Yes, it was a cruel game.@k@v28/72100224. .........Though she claimed that the game was fantasy,@k@v28/72100225. I''ve brought you along and made it end as a mystery.@k@v28/72100226. ......The witch illusion has been spectacularly crushed, and my little bit of revenge is complete."'
55219: 'Will@r@v54/75401177.".............................."'
55220: 'BERNKASTEL@r@v28/72100227."To bring an end to this tangled tale of love with absolute and certain willpower.@k@v28/72100228. ......Out of respect for that certain willpower, the Witch of Certainty made that kid a witch for just two days."'
55221: 'BERNKASTEL@r@v28/72100229."......Even within this limited span of two days, I''ve been able to enjoy an endless kaleidoscope.@k@v28/72100230. ......I won''t be bestowing my favor, so no miracle will occur.@k@v28/72100231. .........However, even that ending is something that child wished for."'
55222: 'Lion@r@v53/75300600."......Which truth did those endless tales settle on in the end?"'
55223: 'Will@r@v54/75401178."Who knows?@k@v54/75401179. ......We can''t say for sure—that''s what makes it a cat box."'
55224: 'BERNKASTEL@r@v28/72100232."When you open the box, you get a tale where no trace of the mansion remains, and no one except Eva survives.@k@v28/72100233. ......And since Eva died without saying anything, all the truth is inside the cat box.@k@v28/72100234. .........Endless possibilities, all kept within a limited box."'
55225: 'Lion@r@v53/75300601."......Now that I think about it,@k@v53/75300602. maybe the whole island where she lived and died was the Golden Land."'
55226: 'BERNKASTEL@r@v28/72100235."If you can call a cat box a Golden Land, that is.@k@v28/72100236. ......And of all the imaginable stories that could occur within that cat box, Battler wrote the most enjoyable."'
55227: 'Will@r@v54/75401180."......You mean that book in BEATRICE''s coffin?"'
55228: 'BERNKASTEL@r@v28/72100237."That''s right.@k@v28/72100238. .........It''s the happiest possible tale for her, which he thought up himself."'
55229: 'Lion@r@v53/75300603."It was a really fun, love-filled, ......happy tale.@k@v53/75300604. ......I also think......that tale was the most fitting one to put in her coffin."'
55230: 'Will@r@v54/75401181."No, that''s wrong."'
55231: 'Lion@r@v53/75300605."......Huh?"'
55232: 'Will@r@v54/75401182."............You heard Clair.@k@v54/75401183. ......You are her hope and her salvation.@k@v54/75401184. More than anything else, it''s you living on in happiness that will be her salvation."'
55233: 'Lion@r@v53/75300606."........................@k@v53/75300607. ............Right."'
55234: 'BERNKASTEL@r@v28/72100239."......Live happily.@k@v28/72100240. That''s all you need to do to be that kid''s miracle."'
55235: 'Lion@r@v53/75300608."Yes.@k@v53/75300609. .........I''ll live happily enough for the both of us."'
55236: 'Will@r@v54/75401185."......I''m surprised you found this kid.@k@v54/75401186. Didn''t you have to search through about...@k@v54/75401187.two million of them in that vast sea?"'
55237: 'BERNKASTEL@r@v28/72100241."Such trivialities are all I am capable of."'
