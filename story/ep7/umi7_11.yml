52299: '@r@v38/72300029."Yeah, seriously.@k@v38/72300030. Not only was Yasu slow-witted, that kid also lost stuff all the time."'
52300: '@r@v40/72500018."But even so, Yasu always had this look that said "I didn''t lose it! I put it down and someone took it away!"@k @v40/72500019.It really pissed me off!"'
52301: '@r@v41/72600004."That kid just didn''t know how to concentrate.@k@v41/72600005. If you do things without thinking, it''s no surprise that your actions grow careless."'
52302: 'Shannon@r@v15/70500127."But it was only like that in the beginning, right...?@k @v15/70500128.After some time, that kid started concentrating, and all of that bad stuff stopped happening......"'
52303: '@r@v39/72400017."Hmm, really?@k @v39/72400018.Well, it was all stuff that anyone should be able to do anyway."'
52304: 'Kumasawa@r@v18/71800072."Learning to do things that everyone can do is part of growing up.@k@v18/71800073. I doubt the rest of you were so clever about everything when you first started, yes?"'
52305: '@r@v40/72500020."......Are you kidding?@k@v40/72500021. If we weren''t clever, we''d never have been selected to work for the Ushiromiya family."'
52306: '@r@v38/72300031."We''re supposed to be the elite!!@k @v38/72300032.The fact that Yasu was young was no excuse."'
52307: '@r@v41/72600006."That''s right.@k@v41/72600007. ......If Yasu is supposed to learn cleverness by growing up, then that should be done before coming to work for the Ushiromiya family."'
52308: 'Shannon@r@v15/70500129."Come on...@k@v15/70500130. That kid worked really hard to balance school and work...@k@v15/70500131. I think you''re all being too harsh..."'
52309: '@r@v39/72400019."We were selected because we made it through a harsh process, right?@k @v39/72400020.There''s no need for us to pamper Yasu."'
52310: '@r@v40/72500022."I''m sick of this.@k@|@y@v40/72500023. I don''t get why someone as dull-witted as Yasu was chosen!"'
52311: 'Clair@r@v55/75500151."Being selected as an Ushiromiya family servant was an achievement that all Gospel children respected.@k@v55/75500152. The older servants had achieved glory by making it through the strict selection process.@k@v55/75500153. Yasu was so clumsy that they all wondered why that child had been selected."'
52312: 'Clair@r@v55/75500154."......Of course, Yasu was working very hard for a child of that age.@k@v55/75500155. However, the older servants were unsatisfied,@k@v55/75500156. and before long, they started being mean to Yasu whenever they got the chance.@k@v55/75500157. Even after getting used to life on Rokkenjima, Yasu could not make a single friend.@k@v55/75500158. At least, not any Human friends......"'
52313: 'Kumasawa@r@v18/71800074."Hoh-hohohoho.@k@v18/71800075. Yes, that can sometimes happen, and always when you''re busy.@k@v18/71800076. Perhaps a fairy is pulling pranks on you."'
52314: '@r"......It''s a witch pulling pranks on me.@k I mean, I know I put it right there, and all I did was glance around a bit, ...and it disappeared..."'
52315: '@rThe witch pranked me again.'
52316: '@rI left my master key behind,@k Madam found out, and I got in a lot of trouble.'
52317: '@r......Why, when I always put my master key back in my pocket after I use it...@k ......Why was it in a place like that......?'
52318: '@rAnd this is the third time it''s happened.'
52319: '@rThe first two times, I realized that it wasn''t in my pocket, and managed to find it before anyone found out.'
52320: '@rBut the third time, Madam found it.'
52321: '@rI was really mad and frustrated with that witch in the red dress.'
52322: 'Kumasawa@r@v18/71800077."Hoh-hoh-ho, BEATRICE-sama''s pranks can be quite troublesome.@k@v18/71800078. But if you''re dealing with a witch, shouldn''t you be able to use some sort of charm?"'
52323: '@r"A charm...?"'
52324: '@rKumasawa-san started fishing through the kitchen cupboards, saying "now where did that get to".'
52325: '@rThe thing she finally found and brought to me...was a kite string.'
52326: '@rShe stretched it out for me to see, then used a knife to cut off a 50 cm piece.'
52327: 'Kumasawa@r@v18/71800079."Try tying this end to the key,@k@v18/71800080. then tie the other end to your pocket button or some other place that doesn''t stick out.@k@|@y@v18/71800081. ......This is the spiderweb charm."'
52328: '@r"Spiderwebs?@k Like the ones the evil spirits of Rokkenjima fear?"'
52329: 'Kumasawa@r@v18/71800082."Good, I''m glad you remember.@k@v18/71800083. It is said that the spiderwebs on this island are imbued with magical power, and that they are very effective at repelling evil.@k@v18/71800084. See? If you stretch it out like this, it looks like a spiderweb, doesn''t it?@k @v18/71800085.Hoh-hoh-ho, this way, that spiderweb-hating BEATRICE won''t be able to prank you anymore."'
52330: '@rThat......does make sense.'
52331: '@rIt really does look like a spiderweb when pulled tight.@k .........Since Kumasawa-san says so, it must have some pretty strong evil-repelling power.'
52332: '@rI can just ask her to make several of these kite strings for me, and then I can tie them to everything I don''t want to lose.'
52333: '@r......But, clearly, that won''t be very practical.'
52334: '@rI''d have strings all over me.'
52335: '@r"What about things I can''t keep tied to me,@k ......like pencils and erasers?"'
52336: 'Kumasawa@r@v18/71800086."Hoh-hoh-ho, for times like that, there''s a different charm.@k@v18/71800087. All you have to do is make a house for Mr. Pencil and Mr. Eraser."'
52337: '@rMake a house...?@k ......You mean, build a roof and a bed and stuff??'
52338: 'Kumasawa@r@v18/71800088."You aren''t actually building a house, you''re giving them one.@k@v18/71800089. ......For example, take Mr. Knife here, who I cut the string with.@k@v18/71800090. "I wanna go ho~me!" he says.@k@v18/71800091. Eheheheh, he gets lonely when he''s left alone, so he always wants to go home right away.@k@v18/71800092. So, if you leave him anywhere else, he''ll be lost and start crying."'
52339: 'Kumasawa@r@v18/71800093."......See, I left Mr. Knife lying around, and now he''s gotten lonely and started to cry."'
52340: '@r"......Poor thing.@k We need to get Mr. Knife home..."'
52341: 'Kumasawa@r@v18/71800094."Here is Mr. Knife''s house.@k @v18/71800095.See, his whole family of knives is waiting for him.@k@|@y@v18/71800096. "Mama~, I''m ho~me." "Welcome ba~ck." See?"'
52342: '@rKumasawa-san returned the knife to the knife-holder under the sink.'
52343: '@rEven though she had done something so ordinary, I felt slightly moved, as though the lost little knife had finished his adventure and finally returned home.'
52344: '@rOnce he slid into the spot he was supposed to be in,@k ......everyone in the knife family was together again, and they all started talking happily...'
52345: '@rThen, Kumasawa-san said we should give them their privacy,@k and shut the door...'
52346: 'Kumasawa@r@v18/71800097."The poor things hidden by the witch must get lonely easily.@k@v18/71800098. So, when the witch tells them she''ll take them somewhere fun, they''re just happy to go along with her.@k@v18/71800099. How do you think we can stop this from happening?"'
52347: '@r"Take them home right away......"'
52348: 'Kumasawa@r@v18/71800100."Exactly.@k@v18/71800101. They''re lonely, naughty kids, so they''ll go with the witch if they get the chance.@k@v18/71800102. So, you must always take them home quickly."'
52349: 'Kumasawa@r@v18/71800103."......Look at Master Key there you just tied to a string.@k@v18/71800104. He''s sitting there all alone, crying and asking you to put him in his home in your pocket."'
52350: '@r*sob*sob*......@k I''m lonely.'
52351: '@rThe voice of the lonely master key finally reached my ears.'
52352: '@rI hurried to pick it up,@k took the other end of the string and tied it to my pocket button, and put the key in my pocket.'
52353: 'Kumasawa@r@v18/71800105."See, "I''m ho~me".@k@v18/71800106. Master Key gets lonely so easily, so let''s take him home right after we use him, okay?@k@v18/71800107. If you keep making little friends like this, even BEATRICE-sama won''t be able to prank you much longer..."'
52354: '@rJangle, thud.'
52355: '@rWhen break time was over and I stood up to see what I should help with next,@k I felt a tug, and the key ring with the master key fell to the floor.'
52356: '@r......Once again, I had left the master key on the side of the sofa...@kand forgotten it was there.'
52357: '@rThe instant I stood up, the string pulled on it and it fell to the floor.'
52358: '@rWithout Kumasawa-san''s spiderweb charm,@k I would probably have left that master key lying here again.'
52359: '@rThe master key left all alone would have been led away by the witch and disappeared...'
52360: '@rWhew, that was close...'
52361: '@rAnd, once again, I heard the master key, who had almost been left alone, cry and tell me that it wanted to go home...'
52362: '@r".........I''m sorry.@k Come on, let''s go back home to my pocket..."'
52363: '@rYay, I''m home!@k Back at last!'
52364: '@r..............................'
52365: '@r......Thank goodness.@k ...I almost got pranked by the witch again......'
52366: '@r@v32/73700083."Oh, what''s this...?!@k @v32/73700084.Nice trick, using string like that!"'
52367: '@rAll of a sudden, I heard a wild, shocked voice from over my shoulder.'
52368: '@rIt was a voiceless voice.@k A witch''s voice, the kind you can''t hear unless you try.'
52369: '@r".........BEATRICE...?"'
52370: 'BEATRICE@r@v32/73700085."That''s me, my friend.@k@v32/73700086. You forgot about your key again, so I was just about to use it to toy with you...!"'
52371: '@r"It''s a spiderweb charm that Kumasawa-san showed me.@k It seems to work very well."'
52372: 'BEATRICE@r@v32/73700087."Indeed.@k@v32/73700088. I hate to admit it, but it does.@k@v32/73700089. I have no desire to touch that.@k@v32/73700090. After all, you wouldn''t want to put your finger on a razor and slide it across, would you?"'
52373: '@r"......Uwa, ......that''s a scary example...@k My finger hurts just thinking about it..."'
52374: 'BEATRICE@r@v32/73700091."But good for you.@k@v32/73700092. You managed to avoid Natsuhi yelling at you for losing your key.@k@v32/73700093. *cackle*cackle*, you should be thanking me!"'
52375: '@r"Why?"'
52376: 'BEATRICE@r@v32/73700094."You learned about the charm because I annoyed you, did you not?@k @v32/73700095.Thanks to that charm, you have managed to take care of the forgetfulness that made you leave keys lying around.@k@v32/73700096. In other words, it is all thanks to me.@k@v32/73700097. Wahahahaha, it is only natural that I be thanked, don''t you agree?"'
52377: '@r"Nn, ......nnnnn......"'
52378: '@rI really don''t like it, but she does have a point.'
52379: '@rBecause of all the trouble BEATRICE caused me, I told Kumasawa-san and learned the charm from her.'
52380: '@rEven without the witch''s pranking,@k ......if I didn''t have the charm, I would have gone to my next job and left the master key here.'
52381: '@rIf that happened, ......then surely, I wouldn''t have been able to find the key, and it would''ve been a big mess.'
52382: 'BEATRICE@r@v32/73700098."This is what they call punishment to teach someone a lesson.@k@v32/73700099. By magnifying your mistakes, I''ve shown you what they are, as a friend.@k @v32/73700100.And you have grown splendidly as a result."'
52383: '@r"......Nn, nnnn......@k I get the feeling that Kumasawa-san''s the one I should be thanking, not you."'
52384: 'BEATRICE@r@v32/73700101."My, my.@k@v32/73700102. What a thankless job we witches have.@k@v32/73700103. *cackle*."'
52385: '@r"Anyway,@k I win this time.@k Okay, I need to get back to work now."'
52386: 'BEATRICE@r@v32/73700104."Very well, my friend.@k@v32/73700105. We''ll call this your victory."'
52387: 'BEATRICE@r@v32/73700106."However, giving up is not my forte.@k@v32/73700107. I shall keep watching you, even more closely now, until I can even the score.@k@v32/73700108. Prepare yourself.@k@v32/73700109. There are countless small items that a person like you is likely to forget.@k@v32/73700110. You can''t attach string to all of them.@k@v32/73700111. *cackle*cackle*...!"'
52388: '@r"The spiderweb charm isn''t the only one I have.@k ......I also learned the "take them home" charm.@k I won''t let you have your way anymore."'
52389: 'BEATRICE@r@v32/73700112."Hmph.@k@v32/73700113. Let us see how well you can actually do.@k@|@y@v32/73700114. On another matter,@k@v32/73700115. that''s quite the bright smile you''ve got there.@k@v32/73700116. When a witch comes, that''s a time to cry, not laugh.@k@v32/73700117. Your break time is over.@k@v32/73700118. See if you can manage to do your job today without slowing down the older servants."'
52390: '@r"Sure. Today is Sunday, and the weather is wonderful.@k I''d better do my best."'
52391: 'BEATRICE@r@v32/73700119."Go do whatever you can.@k@v32/73700120. Oh, that''s right, @bSanon.@<玲音@>''s been in a bad mood all morning.@k@v32/73700121. I suggest you avoid eye contact with her.@k@v32/73700122. Also, your fortune for the day is "water hazard".@k@v32/73700123. Make sure you take care when standing near buckets of water.@k@v32/73700124. ......I am well aware of your weaknesses.@k@v32/73700125. I will be waiting for you to knock over a bucket and get scolded just like usual."'
52392: '@r"*giggle*.@k ......Thank you, BEATRICE."'
52393: '@rBack when I could not yet ''see'' her...@k@rI simply hated this prank-loving witch.'
52394: '@rBut now that I could talk with her, ......it seemed to me that she was not all bad.'
52395: '@rOf course, I felt no need to be grateful to her.'
52396: '@rThe witch BEATRICE despises boredom, and subsists on mocking the misfortune of others.'
52397: '@rHumans and witches are different.@k Incompatible beings.'
52398: '@rAnd yet, ......it felt as though we could become friends.'
52399: '@rOf course, she was still a witch.@k I could not afford to be careless.'
52400: '@rHowever, not being careless is a very good thing.'
52401: '@rUsing charms and tricks to pay attention, so that her pranks would no longer work on me, was not a bad thing by any means.'
52402: '@rThose techniques would be useful for my job and my life, even without the witch''s pranks.'
52403: '@rYes, this witch called BEATRICE would go to any lengths to make a point.@k@rI learned that it was possible to build up a friendship through verbal abuse...'
52404: 'Shannon@r@v15/70500132."Ever since then, there was an incredible change in that kid."'
52405: 'Zepar@r@v51/75100052."Because of all the charms?!"'
52406: 'Kumasawa@r@v18/71800108."Hoh-hohoho.@k@v18/71800109. That''s right.@k@v18/71800110. What an assiduous child.@k@v18/71800111. All of the charms I taught were followed with great dedication."'
52407: 'Furfur@r@v52/75200057."With strings attached to everything?@k @v52/75200058.Or else that "going ho~me" thing?"'
52408: 'Shannon@r@v15/70500133."Yes.@k@v15/70500134. That kid would sometimes say it out loud.@k@v15/70500135. It was really cute, like watching someone play house with a bunch of tools."'
52409: 'Zepar@r@v51/75100053."Just like a kid!"'
52410: 'Furfur@r@v52/75200059."The kid was a kid, silly!"'
52411: '@r@v00/awase7012.""Ahhahahahahahahahahahaha!!""'
52412: 'Kumasawa@r@v18/71800112."With adults, you can say something one way and all of them will understand.@k@v18/71800113. However, there really are many different types of kids, and you need many different ways to teach them things.@k@v18/71800114. If you can find just the right way, they learn quite easily."'
52413: 'Shannon@r@v15/70500136."Some kids learn better when they''re punished, and some learn better when they''re praised."'
52414: 'Kumasawa@r@v18/71800115."I used to scare a neighborhood kid and tell him that a fairy would take his things if he didn''t put them away after using them.@k@|@y@v18/71800116. Hoh-hoh-ho, this was the same, except the fairy became a witch......"'
52415: 'Zepar@r@v51/75100055."Still, doesn''t that sound like fate?!"'
52416: 'Furfur@r@v52/75200061."After all, you knew this kid was Beatrice''s child, didn''t you?"'
52417: 'Kumasawa@r@v18/71800117."Yes, I did know."'
52418: 'Shannon@r@v15/70500137."So you told Beatrice''s child that "the witch BEATRICE will play pranks on you unless you put your stuff away neatly"...@k@v15/70500138. ......That''s kind of funny, isn''t it?"'
52419: 'Kumasawa@r@v18/71800118."Hoh-hoh-hoh-ho......@k@v18/71800119. I just thought of it after the child came and told me that a witch was stealing things and pulling pranks."'
52420: 'Kumasawa@r@v18/71800120."I took it as a sign that the late Beatrice-sama had become a witch...@k@v18/71800121.and was coming to teach her child to keep track of things.@k@v18/71800122. ......That''s why I thought this the best way to teach that child."'
52421: 'Shannon@r@v15/70500139."That kid started out with a bad reputation for forgetting and losing things,@k@v15/70500140. but got a lot more cheery after overcoming those bad habits."'
52422: 'Kumasawa@r@v18/71800123."By overcoming weaknesses, those weaknesses become strengths,@k@v18/71800124. and that is how people gain confidence and grow up.@k@v18/71800125. ......Those tiny spurts of growth, day by day, were precious to watch over.@k@v18/71800126. Yes, it was as though I was watching the growth of my very own grandchild."'
52423: '@r@v00/awase7013_o."""Thank you, Genji-sama."""'
52424: 'Genji@r@v14/71600047."......Good work with the big cleanup today.@k@v14/71600048. The guest rooms are rarely used, but we can never predict when an important guest might stay the night.@k@v14/71600049. You must not allow yourselves to become complacent when cleaning them."'
52425: '@r@v38/72300034."Of course.@k@v38/72300035. All of us are fully aware of this fact."'
52426: 'Genji@r@v14/71600050."......I wish that were the case.@k@v14/71600051. When I looked around, I found this.@k@v14/71600052. Whose is it?"'
52427: '@rGenji took a master key ring out of his pocket.@k@r......Apparently, someone had dropped their master key.'
52428: '@rAll of the servants swung around to look at me, the usual offender.'
52429: '@r@v38/72300036."Come on. Yasu again?"'
52430: 'Shannon@r@v15/70500142."Y-you shouldn''t be so quick to judge."'
52431: '@r@v40/72500024."I have mine, of course.@k@v40/72500025. There''s no way I''d drop something that important.@k@v40/72500026. And the rest of you?!"'
52432: 'Shannon@r@v15/70500143."I have mine..."'
52433: '@r@v39/72400022."Got it!"'
52434: '@r@v38/72300037."So, it was you, Yasu!@k @v38/72300038.Do you still not get it, even after that scolding Madam gave you?!@k @|@y@v38/72300039.You''re just so...!"'
52435: 'Clair@r@v55/75500192."......Normally,@k@v55/75500193. I would cower and apologize under their glares, whether I was guilty or not.@k@v55/75500194. However, I had changed.@k@v55/75500195. So, I proudly held up the key with the spiderweb string still attached......"'
52436: 'Genji@r@v14/71600053.".....................Hoh.@k@v14/71600054. ......You tied it up to keep yourself from dropping it.@k@v14/71600055. A laudable attitude."'
52437: '@rGenji-sama''s face was as expressionless as ever.@k However, those were unmistakably words of praise.'
52438: 'Shannon@r@v15/70500144."*giggle*, that''s right.@k@v15/70500145. You won''t drop them anymore.@k@v15/70500146. After all, you have your charm now."'
52439: '@r......That''s right.'
52440: 'Clair@r@v55/75500196."I nodded proudly, a huge smile on my face.@k@v55/75500197. The proud experience of that day, of that moment,@k@v55/75500198. would inscribe an unforgettable page in the memory of my young life......@k@v55/75500199. In that case, whose key did Genji find......?"'
52441: '@r@v38/72300040."...............!"'
52442: '@rThere was only one servant who hadn''t raised their key.'
52443: '@rAs she muttered "It has to be Yasu''s key!@k Of course it''s not mine",@k@|@y and fished in her pocket, her face went pale...'
52444: 'Genji@r@v14/71600056."There is no room for complacency in the everyday duties of a servant.@k@v14/71600057. Nevertheless, mistakes do happen.@k@v14/71600058. I will not criticize you for a single mistake; however, blaming a fellow servant instead of reflecting on your own actions is not an attitude I would consider praiseworthy."'
52445: '@r@v38/72300041."M-@v38/72300042.my...@v38/72300043....apologies..."'
52446: '@rThe older servant turned red and hung her head.'
52447: '@rBehind her, ......though no one else could see it, was the witch.'
52448: 'BEATRICE@r@v32/73700126."*cackle*!@k @v32/73700127.My friend will not make the same mistake again.@k@v32/73700128. I am ever on the lookout for signs of weakness, yet even I have not yet been presented a single further opportunity!@k @|@y@v32/73700129.But this is a shame.@k@v32/73700130. If I had known this girl here would lose her key, I could have pranked her this time...!"'
52449: '@r"Please don''t prank people other than me."'
52450: 'Shannon@r@v15/70500147."Huh?@k @v15/70500148.Did you say something?"'
52451: '@r"N-no, nothing......"'
52452: 'Clair@r@v55/75500202."I tried not to feel schadenfreude,@k@v55/75500203. but after being called dull-witted for so long, I was finally able to hold my head up high.@k@v55/75500204. After that day, I was at last able to feel as though I had become accustomed to life as a servant of the Ushiromiya family......"'
52453: 'Zepar@r@v51/75100056."When people compliment you, you feel like you''ve been accepted!"'
52454: 'BEATRICE@r@v32/73700131."It is very important.@k@v32/73700132. People cannot grow without it."'
52455: 'Furfur@r@v52/75200062."And what happens when people grow?"'
52456: 'BEATRICE@r@v32/73700133."Firstly, the mind is freed up.@k@v32/73700134. You become able to carry out jobs with confidence, jobs that you initially carried out while worrying that you might be doing them the wrong way."'
52457: 'Zepar@r@v51/75100057."You''re right!@k @v51/75100058.Once you become comfortable in your work, that does free up the mind!"'
52458: 'Furfur@r@v52/75200063."And what happens once the mind is freed up?"'
52459: 'BEATRICE@r@v32/73700135."You can then enjoy your days more.@k@v32/73700136. To use Genji''s words, you might say that it gives you the freedom to be a little bit complacent."'
52460: 'Zepar@r@v51/75100059."If you''re tense all the time, that just wears you out!@k @v51/75100060.It''s good to relax a bit, if you can!"'
52461: 'Furfur@r@v52/75200064."You mean, you learn so much that you can start slacking off on the job?"'
52462: 'BEATRICE@r@v32/73700137."It sounds bad when you put it that way.@k@v32/73700138. However, there is nothing wrong with skillfully carrying out your tasks quickly and using your free time to enjoy yourself.@k@v32/73700139. Times like that are what enrich a person''s life."'
52463: 'Zepar@r@v51/75100061."Come to think of it, Gohda plays crosswords a lot between jobs!"'
52464: 'Furfur@r@v52/75200065."He also invents dishes with leftover ingredients!"'
52465: 'BEATRICE@r@v32/73700140."Playing a bit and refreshing yourself can also be good for your efficiency.@k@v32/73700141. You might say that inventing dishes combines work and play."'
52466: 'BEATRICE@r@v32/73700142."Even Genji slacks off when no one''s looking.@k@v32/73700143. He''ll watch TV or swipe some of his master''s drink.@k@v32/73700144. And he reads complicated books."'
52467: '@r@v00/awase7014.""Even Genjiiiiiii?!""'
52468: 'BEATRICE@r@v32/73700145."*cackle*cackle*!@k @v32/73700146.In short, it''s all about cleverly using the gaps between jobs to play.@k@v32/73700147. If it goes too far, it can be called complacency.@k@v32/73700148. However, people only become mature when they learn to balance work with pleasure.@k@v32/73700149. Simply put, if all you care about is work all the time, you''re not fully mature."'
52469: 'Furfur@r@v52/75200067."So, that kid learned how to play between jobs?"'
52470: 'Zepar@r@v51/75100063."It''s hard to imagine that serious kid slacking off at work!"'
52471: 'BEATRICE@r@v32/73700150."It started with interaction.@k@v32/73700151. That kid formed a relationship with Kumasawa, the person who was always kind,@k@v32/73700152. and started borrowing books from her and talking together about them."'
52472: 'Clair@r@v55/75500205."Even I had friends at school, but because of my work, there was no chance to deepen our friendship.@k@v55/75500206. Jessica never concerned herself with her status and was always kind to me, but there was Natsuhi''s stern order to think of, so we were unable to play together very much."'
52473: 'Clair@r@v55/75500207."......So, at that time, it was Kumasawa, the one who was always as kind as a mother to me, who was the person I felt closest to."'
52474: 'BEATRICE@r@v32/73700153."The two of them were as distant in age as a grandmother and her grandchild.@k@v32/73700154. They did not run around and play together.@k@v32/73700155. Instead, the child developed an interest in Kumasawa''s hobby."'
52475: 'Furfur@r@v52/75200068."And what''s Kumasawa''s hobby?!"'
52476: 'BEATRICE@r@v32/73700156."Books.@k@v32/73700157. It might be hard to believe, but Kumasawa was a pretty big fan of mystery novels."'
52477: 'Zepar@r@v51/75100064."The kid wanted to find out what sorts of books they were and started reading them?"'
52478: 'BEATRICE@r@v32/73700158."That''s right.@k@v32/73700159. The nice thing about mystery novels is that you can talk about them while you read them.@k@v32/73700160. Even Kumasawa, who already knew the answer, must have enjoyed listening and hearing...@k@v32/73700161.what sorts of theories a young intellect could create."'
52479: 'Clair@r@v55/75500208."Of course, I didn''t start right away with the difficult books Kumasawa read.@k@v55/75500209. First, I asked for her recommendations and got books from the school library.@k@v55/75500210. I would even bring them into the servant room and read a bit during every break."'
52480: 'Clair@r@v55/75500211."Every time a new theory popped into my head, I told Kumasawa about it,@k@v55/75500212. and she, who already knew the answer, would give non-committal responses and grin.@k@v55/75500213. ......That was a lot of fun for me."'
52481: 'Shannon@r@v15/70500149."Are you going to take a bath?@k @v15/70500150.Bath time''s almost over."'
52482: '@r"......Yeah, ...just a bit more......@k Another one of the figures just disappeared..."'
52483: 'Shannon@r@v15/70500151."*giggle*.@k@v15/70500152. You''ve become a total mystery nut.@k@v15/70500153. If you get too excited reading, you won''t be able to sleep again."'
52484: '@r".........According to Kumasawa-san, the culprit has already appeared...@k But I don''t have a clue who it is..."'
52485: 'Shannon@r@v15/70500153_b."What kind of story is it?"'
52486: '@r"It starts with everyone receiving an invitation to a small island.@k No boat is coming to pick them up, and one by one, they''re being found dead in a way that''s connected to the nursery rhyme, and each time, one of the figures disappears......@k ......It''s really interesting.@k Almost like it''s a crime happening on Rokkenjima."'
52487: 'Shannon@r@v15/70500154."Yes, that''s a really famous mystery novel.@k@v15/70500155. Wasn''t that one a perfect crime, at least until the culprit confesses to the truth in a message bottle at the end?@k @v15/70500156.An incredible book."'
52488: '@r"Shhh,@|@y shhh!@|@y@k I''m enjoying myself, so don''t spoil me!@k Go take a bath now, I''ll go by myself later...!"'
52489: 'Shannon@r@v15/70500157."Okay, okay.@k@v15/70500158. ......See you later then.@k@v15/70500159. Don''t forget to take a bath, okay?"'
52490: '@rShannon picked up a change of clothes and smiled amusedly as she left the room.'
52491: '@rI probably won''t be able to read the whole thing tonight.'
52492: '@rEven though I know that, I just keep turning the pages, unable to find a good place to stop.'
52493: '@rMy new joy, the mystery genre.@k@rThe mental game of thinking and theorizing.'
52494: '@rAnd also talking about it with Kumasawa-san.'
52495: '@r......All of that left me enraptured.'
52496: 'BEATRICE@r@v32/73700162."You''ve become a complete bookworm.@k@v32/73700163. Well, if you do stay up and get sleepy, that just makes my job all the easier."'
52497: '@r"We can''t have that.@k I''d better find a place to stop soon."'
52498: 'BEATRICE@r@v32/73700164."*cackle*.@k@v32/73700165. .........In the times of old when I was born, there were no such pleasures as mystery novels.@k@v32/73700166. I have been reading over your shoulder, and this really is an interesting book."'
52499: '@r"Beato, who do you think is the culprit?"'
52500: 'BEATRICE@r@v32/73700167."In the book you are reading?"'
52501: '@r"Yeah.@k Who is the sender of the message bottle, I wonder..."'
52502: 'BEATRICE@r@v32/73700168."The culprit who lured the victims to the island, of course."'
52503: '@r"There are only ten people on this island.@k And the sender of the message bottle is "UNKNOWN"......"'
52504: 'BEATRICE@r@v32/73700169."No doubt the person who stranded the ten of them there is somewhere far away, waiting patiently for all of them to starve to death."'
52505: '@r"No, that''s not right.@k He or she is on the island.@k They''re one of the ten.@k I just don''t know who..."'
52506: 'BEATRICE@r@v32/73700170."How do you know that there are only ten people on the island?"'
52507: '@r"......That''s just how it is."'
52508: '@rSince if you don''t trust that, what can you trust, or it''s just one of the assumptions of the mystery genre, ......or...hmmm...'
52509: 'BEATRICE@r@v32/73700171."It is the owner of the island, correct?@k @v32/73700172.They might be hiding in some hidden room.@k@|@y@v32/73700173. Or maybe they''re like me!@k @v32/73700174.They may be a thousand year old witch!@k @v32/73700175.No, no, if they had to go to all this trouble just to kill ten people, they couldn''t be a thousand years old.@k@v32/73700176. 495 years old at most, I''d say. *cackle*cackle*!"'
52510: '@r"Locked rooms do appear a lot in mystery novels.@k And books often use a phrase like "it could only conceivably have been done with magic" to describe them.@k ......And here I am, with a witch right before my eyes. It''s a complicated feeling."'
52511: 'BEATRICE@r@v32/73700177."Pft, *cackle*cackle*!@k @v32/73700178.Very entertaining, these locked-room murders.@k@v32/73700179. ......Once you read the answer, it becomes a tale about humans, or a mystery novel.@k@v32/73700180. But, if you rip out the part that reveals the answer and throw it away,@k@v32/73700181. it becomes a tale about witches, or a fantasy novel."'
52512: '@r".........Hmmm?@k That''s an interesting way to look at it.@k So, you''re saying that there''s only a razor-thin margin between human novels and witch novels when it comes to mysteries?"'
52513: 'BEATRICE@r@v32/73700182."If a trick exists, it is a human novel.@k@v32/73700183. If not, it is a witch novel.@k@v32/73700184. If you just tear out the last few pages of that book you''re reading,@k@v32/73700185. you might think of that person as UNKNOWN, a witch on the same level as me...!"'
52514: '@r"......That might be surprisingly wise, coming from you.@k ......So, the culprit of detective novels without an answer is a witch."'
52515: 'BEATRICE@r@v32/73700186."All of the dark places in this world belong to us witches.@k@v32/73700187. Therefore, I could reign as the culprit of all detective novels old and new across the world."'
52516: '@r"Except, if you reason it out right and find the true answer, then the witch is done for."'
52517: 'BEATRICE@r@v32/73700188."*cackle*cackle*.@k@v32/73700189. Detective novels are quite interesting, it seems.@k@v32/73700190. This looks to be a truly entertaining mental game."'
52518: '@r"That''s right.@k This is a mental game.@k You fight against the book, make a theory, and then have debates to battle friends who have also read the book."'
52519: 'BEATRICE@r@v32/73700191."Not only that. It is also a battle between witch and human.@k@v32/73700192. Will you allow my locked-room murders, my magic, to withstand scrutiny.....or will you deny it?@k@v32/73700193. A mystery is a game of chess by another name!"'
52520: '@r"........................@k ......So, I''m not reading a book alone, but playing a game against you?"'
52521: 'BEATRICE@r@v32/73700194."Indeed!@|@y@k @v32/73700195.As Shannon said a short while ago,@k@v32/73700196. this story apparently has the truth revealed by a message bottle at the end.@k@v32/73700197. In other words, if you cannot expose the truth of the tale before that point, you lose."'
52522: 'BEATRICE@r@v32/73700198."After all, the message bottle just happened to drift somewhere that it could be seen.@k@v32/73700199. If it got smashed and sank before anyone saw it, this would be a perfect crime,@k@v32/73700200. a crime impossible for humans to accomplish—a crime committed by a witch."'
52523: '@r"......That''s a fun way to look at it.@k A battle between me and the witch.@k............That''s right.@k I really like thinking of it that way."'
52524: 'BEATRICE@r@v32/73700201."*cackle*!@k @v32/73700202.Starting now, and until you finish reading,@k @v32/73700203.I am UNKNOWN, the 495-year-old witch!@k @|@y@v32/73700204.Can you see through my deserted island murder tricks?@k @|@y@v32/73700205.Ahihhyahahahaha!"'
52525: '@r"......I have formed one theory.@k You want to play with me, don''t you?@k I''ve been reading books so much, you''ve gotten lonely."'
52526: 'BEATRICE@r@v32/73700206."That too!"'
52527: '@r"Pft—"'
52528: '@r@v32/73700207.""Hahahahahahahahahahaha......""'
52529: '@r......Incidentally...'
52530: '@rThe game Beato and I played with this book ended with my defeat.'
52531: '@rIn the end, I wasn''t able to build a satisfying theory, and I had to learn the truth from the message bottle.'
52532: '@rLuckily, it did manage to drift into human hands.@k If it had sunk to the bottom of the ocean, as Beato had suggested, I would have had no way of knowing the truth.'
52533: '@rIn other words, I would have been forced to accept that the sender of the message bottle was a witch.'
52534: '@rMystery—I once thought it was just a genre for novels.'
52535: '@rTo think that it could so easily become a fight between witches and humans, truth and fantasy.'
52536: '@rI was instantly enraptured by this new "game".'
52537: '@rAs the months passed by, I read through all of the mystery novels in the school library,@k and started to read mystery novels for adults.'
52538: '@rI discussed them with Kumasawa.@k I discussed them with Shannon.@k@rI played my game of theory chess, the fight between witches and the truth.'
52539: '@rHow enjoyable those days were......'
52540: '@rOh, I am one yet many.'
52541: '@rHere''s to the fun game of the mind that enraptured me......'