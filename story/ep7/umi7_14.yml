53423: 'Will@r@v54/75400973."........................"'
53424: '@r@v55/75500589."............This form is......"'
53425: 'BERNKASTEL@r@v28/72100183."I''m lending it to you.@k@v28/72100184. After all, I hate idiots.@k@|@y@v28/72100185. ......*giggle*giggle*.@k@v28/72100186. Call yourself Clair, as a temporary name.@k@v28/72100187. Or would you prefer Beato?"'
53426: 'Clair@r@v55/75500590."........................@k@|@y@v55/75500591. ...You have my gratitude.@k@v55/75500592. This way, I won''t have to expose my pitiful form."'
53427: '@rBERNKASTEL had given this person a fake form.'
53428: '@rIt was a temporary form for the person acting the part of BEATRICE.@k@rA false appearance intended for those yet to reach the truth of BEATRICE''s identity......'
53429: 'Lion@r@v53/75300471."......Is that...@v53/75300472....a story about...@v53/75300473....me in another world?"'
53430: 'Clair@r@v55/75500593."Lion.@k@v55/75500594. ......It is a tale about me, who is also another world''s you.@k@v55/75500595. ......The tale of the world where I live as a witch, not a Human..."'
53431: 'Lion@r@v53/75300474."............I sometimes imagine "what if" scenarios for my own life.@k@v53/75300475. ......However,@v53/75300476. ......the tale you tell...@v53/75300477....is beyond anything...@v53/75300478.I can imagine..."'
53432: 'Will@r@v54/75400974."Even so,@k@v54/75400975. ......it''s the life that another "you" has led."'
53433: 'Lion@r@v53/75300479."But still!@k @v53/75300480.That doesn''t mean I can accept it easily."'
53434: '@rLion suddenly yelled and looked at the floor.@k@rLion already knew.'
53435: '@rBecause of the fragments provided by BERNKASTEL, Lion knew.'
53436: '@rThis was a different world, where the same person lived as the Golden Witch BEATRICE.'
53437: '@rAnd, in this world, .........eventually,@k ............on the day of the October 1986 family conference,@k .........this person would be the ringleader of a terrible crime.'
53438: 'Lion@r@v53/75300481."......Even if it is a different world,@k@v53/75300482. ......you''re saying that I get my immediate and extended family and all of the servants involved in a terrible crime that I''m the mastermind of!@k@v53/75300483. How am I supposed to deal with that?!"'
53439: 'Will@r@v54/75400976."...............Be quiet, listen, and understand."'
53440: 'Lion@r@v53/75300484."In a different life, I end up as a servant!@k @v53/75300485.And if that wasn''t enough, I suddenly become a witch!@k @v53/75300486.And then, I eventually carry out several horrifying murders...!@k @v53/75300487.How am I supposed to "understand" that?!"'
53441: 'Clair@r@v55/75500596.".............................."'
53442: 'Will@r@v54/75400977."Yeah, that''s what I expected you to say.@k@v54/75400978. ......I doubt anyone could understand.@k@v54/75400979. ......This person here''s long past expecting anyone to understand.@k@v54/75400980. That''s why you are here.@k@v54/75400981. ......That''s why BERNKASTEL brought you two, two people who never could have met, together like this."'
53443: 'BERNKASTEL@r@v28/72100188."............It''s not like I had any deep reason for it.@k@v28/72100189. It was just a whim."'
53444: 'Will@r@v54/75400982."It''s a motive that no one else can understand, Lion, so you need to be the one to understand it.@k@v54/75400983. I''m not the main character in this tale.@k@v54/75400984. You are.@k@v54/75400985. .........I''m just here to help you understand."'
53445: 'Lion@r@v53/75300488."You said that you understood the culprit''s motive."'
53446: 'Will@r@v54/75400986."......Yeah."'
53447: 'Lion@r@v53/75300489."Is it...a satisfying motive...@k @v53/75300490.for explaining why I''d kill my entire family...?!"'
53448: 'Will@r@v54/75400987."Who knows.@k@v54/75400988. That''s for you to decide.@k@v54/75400989. Even if I say it''s satisfying, that doesn''t mean it''ll satisfy you.@k@v54/75400990. ......You have to decide that for yourself."'
53449: 'Lion@r@v53/75300491."I really don''t have a clue what''s going on...!@k @v53/75300492.I''ve seen several crimes called game boards that BEATRICE supposedly carried out.@k@v53/75300493. And now, I''m hearing another me talk about a different life from mine.@k@v53/75300494. But none of that fits with the crime!@k @v53/75300495.I don''t understand!!"'
53450: 'Clair@r@v55/75500597."..................At this point in the tale, ......even I...@k@v55/75500598.could not have dreamed that I would eventually carry out such a terrible crime.@k@v55/75500599. In fact, even if I could have dreamed it,@k@v55/75500600. .........I did not have the power to commit that crime at that time."'
53451: 'Will@r@v54/75400991."Probably.@k@v54/75400992. ......Your misfortune probably came...@k@v54/75400993....when you solved the epitaph''s riddle."'
53452: 'Lion@r@v53/75300496.".........Huh?@k @v53/75300497.You mean that epitaph about the hidden gold, which Grandfather supposedly wrote...?!"'
53453: 'Will@r@v54/75400994."There was a system by which the culprit obtained different accomplices each time the crime was committed.@k@v54/75400995. .........Reasoning leads us to the possibility that the culprit possessed a vast amount of money.@k@v54/75400996. And...@v54/75400997.......for inviting all to the Golden Land...@v54/75400998_b.......and making all loves bear fruit......there was one other system."'
53454: 'Clair@r@v55/75500601."...............So, it''s not just the motive...@k@v55/75500602....that you''ve figured out."'
53455: 'Will@r@v54/75400999."That''s the answer to the final riddle in the fourth game.@k@v54/75401000. ......Your greatest misfortune was solving the epitaph,@k@v54/75401001. .........reviving as the Golden Witch in the truest sense, and gaining that magical power."'
53456: 'Clair@r@v55/75500603."......Looking back, ......perhaps that was an ill-fortuned event.@k@v55/75500604. .........I do not know.@k@v55/75500605. However, as long as the fact that Battler-san returns in 1986 remains unchanged,@k@v55/75500606. .........some sort of tragedy would certainly have occurred."'
53457: 'Will@r@v54/75401002."That''s right.@k@v54/75401003. ......If Battler had returned a year earlier or later,@k@v54/75401004. .........that incident might not have occurred."'
53458: '@rNo, some small incident would probably have occurred.'
53459: '@rAnd it would surely have been a mysterious, impossible incident, which no one could understand.'
53460: '@rBut even so, it would have been insignificant compared to the Rokkenjima Serial Murders......'
53461: 'Lion@r@v53/75300498."......If Battler-kun...@v53/75300499....had returned a year earlier or later,@v53/75300500. ......then what?"'
53462: 'Clair@r@v55/75500607."........................@k@|@y@v55/75500608. ......Fate can be so filled with irony.@k@v55/75500609. .........It made me walk the path of a witch, ......and when I solved the epitaph, I became a true witch.@k@v55/75500610. ......Then, after six years, I learned of his return.@k@v55/75500611. .........If all of that was fate,@k@v55/75500612. .........then this crime must have been inevitable and inescapable for me."'
53463: 'Will@r@v54/75401005."In 1980,@k@v54/75401006. when Asumu, his mother, died, and his father remarried too soon for his liking, Battler left the Ushiromiya family in disgust.@k@v54/75401007. And he was gone for six whole years."'
53464: '@rHe convinced his grandparents on his mother''s side to help him and had his last name changed to his mother''s maiden name.'
53465: '@rThen, when those grandparents passed away, he finally made up with Rudolf...and returned to the Ushiromiya family again in 1986...'
53466: 'Will@r@v54/75401008."That bad luck......gave birth to your motive for the crime."'
53467: 'Clair@r@v55/75500613.".........I did think it.@k@v55/75500614. ......''Why, after six whole years,@k@v55/75500615. .........have you come back now?''"'
53468: 'Will@r@v54/75401009."I understand.@k@v54/75401010. In a way, ......it would have been better for you if he had never come back."'
53469: 'Clair@r@v55/75500616."Of course, my suffering would have continued.@k@v55/75500617. ......However, I may have avoided tainting myself with the unforgivable crime of mass murder."'
53470: 'Lion@r@v53/75300501.".........How could Battler-kun leaving the Ushiromiya family...@k@v53/75300502....create a motive?"'
53471: 'Will@r@v54/75401011."You''ve got it backwards."'
53472: 'Lion@r@v53/75300503."......Backwards?"'
53473: 'Will@r@v54/75401012."The crime didn''t occur because Battler left.@k@v54/75401013. .........It happened because Battler came back."'
53474: 'Clair@r@v55/75500618."...........................@k@v55/75500619. ......The more I think about it, the more I realize.@k@v55/75500620. ......Ushiromiya Battler.@k@v55/75500621. ......What a detestable man he was.@k@v55/75500622. More than anything else, because he never realized that the outbreak of the crime was his fault."'
53475: 'Will@r@v54/75401014."He did remember, in the end.@k@v54/75401015. ......However, that was long after you gave up and disappeared."'
53476: 'Clair@r@v55/75500623."............If that is so,@k@v55/75500624. ......then it would give my heart some peace..."'
53477: 'Lion@r@v53/75300504."I still don''t have a clue what you two are talking about.@k@v53/75300505. ......But I''d like to ask you straightforwardly.@k@v53/75300506. I want to know.@k@v53/75300507. ......What on Earth happened to you that made you decide to commit the crime?"'
53478: 'Will@r@v54/75401016."Yes.@k@v54/75401017. That''s the most important part.@k@v54/75401018. ......Just like how Ushiromiya Battler respected the whydunit in mystery novels.@k@v54/75401019. .........In the tale of the Golden Witch and in the game, ......the answers to all the riddles are hidden there."'
53479: 'Clair@r@v55/75500625."In that case,@k@v55/75500626. .........allow me to continue.@k@v55/75500627. ......1980.@k@v55/75500628. ......Six years before I resolved myself to commit the crime."'
53480: 'Shannon@r@v15/70500384."......Battler-sama has...@v15/70500385.......left the Ushiromiya family......?"'
53481: '@r@v42/72700004."That''s what Krauss-sama and Rudolf-sama were saying!@k @v42/72700005.What a shock!"'
53482: 'Krauss@r@v02/70800040."You have your own way of life and your own family situation.@k@v02/70800041. I have no intention of criticizing those.@k@|@y@v02/70800042. However, Father is in a towering rage.@k@v02/70800043. Disinheriting a son is one thing, but I''ve never even heard of a child becoming so fed up with his family that he changed his own name."'
53483: 'Rudolf@r@v08/71200019."......No idea who he gets it from,@k@v08/71200020. but that Battler''s as stubborn as a mule."'
53484: 'Natsuhi@r@v03/70900053."If you are unable to understand Battler-kun''s feelings, I believe that would make you a failure as a father."'
53485: 'Krauss@r@v02/70800044."That''s enough.@k@v02/70800045. I''m sure Rudolf was just trying to show his commitment to raising Kyrie-san''s child properly."'
53486: 'Natsuhi@r@v03/70900054."That would be perfectly satisfactory if it happened next year.@k@v03/70900055. ......But why this year?@k@v03/70900056. He''s still in a period of mourning.@k@v03/70900057. ......If you consider the timing of this pregnancy, one must acknowledge that Rudolf-san has acted disgracefully."'
53487: 'Rudolf@r@v08/71200021."............Come on, don''t be so harsh.@k@v08/71200022. ......This is my way of atoning for what I''ve done..."'
53488: 'Natsuhi@r@v03/70900058."Battler-kun feels as though he''s resisting you for the sake of his departed mother, Asumu-san.@k@v03/70900059. ......I deeply understand how he feels.@k@|@y@v03/70900060. If he were here, I would like to hold him and cry along with him."'
53489: '@rNatsuhi''s words were sharp.@k They pierced Rudolf mercilessly.'
53490: '@rRudolf had no retort.@k@rHis relationship with Kyrie had been improper, plain and simple.'
53491: '@r......According to Rudolf, he had been close to Kyrie longer than Asumu.'
53492: '@rAnd, even after his marriage to Asumu, that relationship had not disappeared......'
53493: 'Battler@r@v10/70100115.What the hell?!@k @v10/70100116.You old bastard!!'
53494: 'Battler@r@v10/70100117.So what you''re telling me is, you''ve been betraying Mom all this time!!'
53495: 'Battler@r@v10/70100118.Sure, I know Kyrie-san.@k@v10/70100119. You''ve told me that she was your business partner and a friend whose advice you can always rely on!'
53496: 'Battler@r@v10/70100120.Now you''re telling me she was more than that all along, and you think I give a damn about that now?!!'
53497: 'Battler@r@v10/70100121.If all this had happened after Mom died, that''d be your own damn business!@k @v10/70100122.I''d be right there with you, saying that you should live life as you please!'
53498: 'Battler@r@v10/70100123.But just when did Kyrie-san get pregnant?!@k @v10/70100124.Back when Mom was still alive, right?!'
53499: 'Battler@r@v10/70100125.Yeah, now I finally get it!@k @v10/70100126.This is why looking at you makes me feel sick to my stomach!'
53500: 'Battler@r@v10/70100127.You were glad when Mom died, weren''t you? Weren''t you?!'
53501: 'Battler@r@v10/70100128.It must have been so hard on you, keeping your infidelity and even a kid secret while Mom was still alive!!'
53502: 'Battler@r@v10/70100129.And now that Mom conveniently kicked it, you get to marry Kyrie-san and make the kid my new little brother or sister... The nerve of you!!'
53503: 'Battler@r@v10/70100130.Mom is crying her eyes out in heaven!!@k @v10/70100131.You should be ashamed of yourself, you should be ashamed!!'
53504: 'Battler@r@v10/70100132.I am!!@k @v10/70100133.I am goddamn ashamed to have the same last name as you!!'
53505: 'Battler@r@v10/70100134.The kid''s done nothing wrong.@k@v10/70100135. They''ll need two parents to look after them.@k@v10/70100136. So you go ahead and build a new family and give that kid a happy life!!'
53506: 'Battler@r@v10/70100137.But don''t expect any forgiveness from me!!'
53507: 'Battler@r@v10/70100138.''Cause Mom isn''t even here to hate you anymore!!@k @v10/70100139.So I''m gonna hate you in her place!!@k @v10/70100140.With all of my body and soul!!'
53508: 'Battler@r@v10/70100141.So long, you old bastard!!'
53509: 'Rudolf@r@v08/71200023."................................."'
53510: 'Krauss@r@v02/70800046."That is enough, Natsuhi.@k@|@y@v02/70800047. ......Rudolf hasn''t lost the affection he feels for Battler-kun.@k@v02/70800048. ......It may take some time, but he wants to fix their relationship one day."'
53511: 'Natsuhi@r@v03/70900061."No less should be expected of him as a father.@k@v03/70900062. ......Battler-kun is not a stranger.@k@v03/70900063. He is Rudolf-san''s flesh and blood, and Rudolf-san has a bounden duty to repair their relationship."'
53512: 'Rudolf@r@v08/71200024.".........Go ahead.@k@v08/71200025. Heap it on me.@k@v08/71200026. I won''t argue back.@k@v08/71200027. ......That''s the only way I can atone."'
53513: 'Krauss@r@v02/70800049."At the very least, make sure you give the new child a happy life."'
53514: 'Rudolf@r@v08/71200028."............The new kid......and Battler.@k@v08/71200029. ......They''re both my kids."'
53515: 'Krauss@r@v02/70800050."Wedding Kyrie-san after Asumu-san''s death...@k@v02/70800051....may have been painful for Battler-kun, but it was the best choice you could make for the coming child.@k@|@y@v02/70800052. ......I understand why you did it."'
53516: 'Natsuhi@r@v03/70900064."And I understand why Battler-kun felt like accusing you of being glad when Asumu-san passed away."'
53517: 'Krauss@r@v02/70800053."Stop, Natsuhi.@k@v02/70800054. ......Rudolf has already been scolded enough from the person most fit to do so."'
53518: 'Krauss@r@v02/70800055."......Now then, how about some black tea?@k @v02/70800056.Would you mind asking someone in the kitchen to make us some?"'
53519: 'Natsuhi@r@v03/70900065."...............Very well."'
53520: '@rNatsuhi took this as a signal to leave the room and did so.'
53521: '@rOnce she left, Krauss relaxed slightly.'
53522: 'Krauss@r@v02/70800057."............It is a terrible shame about Asumu-san,@k@v02/70800058. ......but considering the best interests of the coming child, the timing of all this might have been fortuitous."'
53523: 'Rudolf@r@v08/71200030."It''s almost as though Asumu...@v08/71200031....knew about it, and stepped down from the stage of her own choosing.@k@|@y@v08/71200032. .........Was I the one who killed her...?@k @v08/71200033..........If so, ......how long ago did I start...?"'
53524: 'Krauss@r@v02/70800059."If you still treasure Asumu-san''s memory,@k@v02/70800060. ......then, though it may take several years, you must fix your relationship with Battler-kun."'
53525: 'Rudolf@r@v08/71200034.".........Yeah.@k@v08/71200035. ......I know."'
53526: 'Krauss@r@v02/70800061."And be sure to pour just as much affection on Kyrie-san and the new child that is to be born.@k@v02/70800062. ......While also bearing Asumu-san''s cross."'
53527: 'Rudolf@r@v08/71200036."..............................@k@v08/71200037. .........If they have reserved seating in hell..."'
53528: 'Krauss@r@v02/70800063."......Hmm?"'
53529: 'Rudolf@r@v08/71200038."I hope that one of their finest seats...@v08/71200039....has got my name on it......"'
53530: 'Krauss@r@v02/70800064."..........................."'
53531: '@rThe news that Battler had left the Ushiromiya family swept across the family.'
53532: 'Kumasawa@r@v18/71800130."How terrible for Battler-san, too......@k@v18/71800131. I do believe that they will make up eventually, but......"'
53533: 'Genji@r@v14/71600067."......This is a matter for the family.@k@v14/71600068. We servants have nothing to do with it.@k@v14/71600069. Instead, we should focus on memorizing the face of the newest member of the Ushiromiya family, Kyrie-sama."'
53534: 'Kumasawa@r@v18/71800132."Yes, that''s true.@k@v18/71800133. She will be coming to the family conference this year......"'
53535: '@rIf the person new to the Ushiromiya family would be coming to the conference...'
53536: '@r......Then what about the person who just left...?'
53537: '@r@v32/73700302."That means Battler isn''t coming, right?"'
53538: 'BEATRICE@r@v55/75500631."That seems the most probable outcome.@k@v55/75500632. How lonely is the loss of a single, noisy man."'
53539: '@rThough most people felt that it was sad to see Battler leave the Ushiromiya family and that he would be missed, they didn''t think any more about it than that.'
53540: '@rHowever, .........what about Shannon?'
53541: '@rWasn''t Battler supposed to come for her on a white horse......?'
53542: '@rAt first, I was shocked.'
53543: '@rBecause I immediately thought that his departure from the family meant that he wouldn''t be coming to this island anymore.'
53544: '@r......And I do think that''s understandable given how he must feel.'
53545: '@rI understand painfully well why he wanted to leave his family...'
53546: '@rBut, ......does that really mean he won''t come to Rokkenjima anymore...?'
53547: '@rWhat on Earth is going on?@k@rWill he really never return?'
53548: '@rUnable to ask him this directly, I was forced to spend each day contending with a growing sense of anxiety...'
53549: '@r......Battler-san.@k@rI understand how you feel......'
53550: '@rBut............'
53551: '@r.........You wouldn''t leave this place behind forever just because you broke away from the Ushiromiya family, would you...?@k ......Tell me it isn''t true......'
53552: '@rI was so confused that the world seemed to be spinning around me...'
53553: '@rI felt tightness in my chest, and I couldn''t think at all.'
53554: '@rWhen I happened to touch my cheek,@w166. ......I was surprised to find it hot and wet.'
53555: '@r......With a miserable expression on my face,@w166. I was...@w333....crying......'
53556: '@r@v55/75500633.Shannon......@v55/75500634....Shannon.........'
53557: '@rFrom far away, ......I could hear someone calling to me.@k@rBut it was a very strange sort of distance.'
53558: '@rThough it felt very far away, ......the voice also seemed to be coming from right beside me.'
53559: 'BEATRICE@r@v55/75500635."......Shannon.@k@v55/75500636. I understand......how you must be feeling..."'
53560: '@r@v32/73700303."It''s okay.@k@v32/73700304. ......It''s just a fight between a boy and his father.@k@v32/73700305. And rumors always blow things out of proportion.@k@v32/73700306. Everything''s just being exaggerated."'
53561: 'BEATRICE@r@v55/75500637."Indeed.@k@v55/75500638. There are none who can say with certainty that Battler will not return to this island.@k@v55/75500639. You would do well to remain strong."'
53562: '@r......Where......is this place......?'
53563: '@rI seem to remember it somehow.'
53564: '@rIt''s like it reminds me of the scenery of a strange dream I once had.@k@r......Then, ......this must be another dream......'
53565: '@rI was there, under an arbor in a golden rose garden,@k ......and two witches in white and red dresses were showering words of encouragement upon me...'
53566: 'BEATRICE@r@v55/75500640."You can be sure that those rumor-mongering young servants are embellishing the story however they please.@k@v55/75500641. That he has changed his name is obviously a gross exaggeration!@k @v55/75500642.Surely, this can be nothing more than a family quarrel."'
53567: 'Shannon@r@v15/70500386."........................@k@v15/70500387. ......Thank you.@k@v15/70500388. ......I wish I could believe that..."'
53568: '@r@v32/73700307."Of course that''s true.@k@v32/73700308. He''s a boy, after all.@k@v32/73700309. You can hardly be surprised that he has a few arguments with his dad."'
53569: 'BEATRICE@r@v55/75500643."Precisely, as you say.@k@v55/75500644. Clearly, they will make it up to each other once they cool their heads."'
53570: '@r@v32/73700310."Arguments between men flare up quickly, but they burn out just as fast."'
53571: 'BEATRICE@r@v55/75500645."In contrast, an argument between women never bursts into flame, but smolders and lasts forever.@k@v55/75500646. Men''s arguments are fierce but short!@k @v55/75500647.Quick and easy."'
53572: 'Shannon@r@v15/70500389."......You''re right.@k@v15/70500390. ......I hope Battler-san and Rudolf-sama...@v15/70500391....make up soon..."'
53573: 'BEATRICE@r@v55/75500648."Oh, they will!@k @v55/75500649.Haven''t you heard all the times Battler has spoken of it?@k@v55/75500650. He always fights with his father!@k @v55/75500651.This is just another of those fights.@k@v55/75500652. His mother''s death and his father''s remarriage have upset him—that is all."'
53574: '@r@v32/73700311."It sounds as though he''s gone to live with his mother''s parents, but he''ll come back after he''s had a few days to cool his head.@k@v32/73700312. You know, like a kid running away from home."'
53575: '@rThe two witches kept saying that Battler''s fight hadn''t been anything huge.'
53576: '@r......If it was just a family quarrel, the rumors wouldn''t have started in the first place.@k I just can''t feel optimistic about this...'
53577: 'BEATRICE@r@v55/75500653."In any case,@k@v55/75500654. this is a problem between Battler and his father.@k@v55/75500655. Have patience, and time will heal all wounds!@k @v55/75500656.Matters will not be helped by you worrying about it."'
53578: '@r@v32/73700313."Just because Battler didn''t come today doesn''t mean we can be sure he''ll never come.@k@v32/73700314. All this means is that Rudolf came alone today."'
53579: 'BEATRICE@r@v55/75500657."Very true.@k@v55/75500658. Of course he will appear at the next family conference, as energetic as ever!@k @v55/75500659.By then, Rudolf will probably bring that Kyrie here too.@k@v55/75500660. Battler may be sulky about it, but I am certain that he will come too!"'
53580: 'Shannon@r@v15/70500392."......You''re right.@k@v15/70500393. ......Yeah.@k@v15/70500394. .........I''m sure...you''re right."'
53581: '@rHow nice would it be if they were right...'
53582: '@rIn fact, if I could, I''d like to flip through the calendar until autumn right now and check to see whether he does come to the next conference.'
53583: '@rIf he does, then all of my fears are groundless.'
53584: '@rIt would mean the rumor-mongering family members and servants just blew things out of proportion......'
53585: '@rIf Battler-san were right here, I''d like to question him right away...@k "Hey, it isn''t true that you''ll never come to Rokkenjima again, right...?"'
53586: '@rIf I could just hear him say "of course not", ......I could stop worrying about it...'
53587: '@rI don''t know the phone number for Rudolf-sama''s house, but I could probably look it up if I tried.'
53588: '@rHowever, as a servant of the family, I have no excuse for making the call.'
53589: '@rAnd anyway, I have no way of finding out the phone number at Battler-san''s grandparents'' house......'
53590: '@rAll I can do is wait for Rudolf-sama''s family to come visit and hope that my fears are groundless......'
53591: '@rHowever, will I be able to make it through the day feeling like this...?'
53592: '@rNo way.@k I doubt I''ll sleep a wink tonight.'
53593: '@rJust waiting around, feeling like this, ......when I don''t know when my next chance will come...@k I can''t do that...'
53594: '@rWill it be next month?@k Or the month after?@k@r......In the worst case, I might have to wait until the next family conference.'
53595: '@rAnd I have to wait that long......while holding back this suffocating feeling......'
53596: '@r......I can''t bear it.........'
53597: '@r@v32/73700315."Hey, Shannon.@k@v32/73700316. Sorry for asking this out of the blue,@k@v32/73700317. ......but when you said that by the next year you''d have made a resolved decision about something, that something wasn''t just quitting work as a servant on this island, right?"'
53598: 'Shannon@r@v15/70500395."......Huh? ......Well, I.........@k@v15/70500396. ........................"'
53599: '@rIt was......to make up my mind to start a new life.'
53600: '@rInstead of remaining a servant by force of habit.'
53601: '@rI''m supposed to resolve to step into a new life and leave my old life as a servant behind.'
53602: '@r@v32/73700318."And Battler promised that he''d come here on the day you make that resolved decision, right...?"'
53603: 'Shannon@r@v15/70500397.".........Ummm,@v15/70500398. .........yes..."'
53604: 'BEATRICE@r@v55/75500661."Tact is not one of my strong points, so I shall speak frankly.@k@v55/75500662. You are supposed to resolve to start a new life with Battler, correct...?"'
53605: 'Shannon@r@v15/70500399."......A new life...@v15/70500400....with...Battler-san..."'
53606: 'BEATRICE@r@v55/75500663."You are afraid that Battler will not come for you on the day of your decision.@k@v55/75500664. However, there is more to that day of decision than just Battler coming to see you."'
53607: '@r@v32/73700319."It''s also the day for you to show your resolve to spend the rest of your life with Battler."'
53608: 'BEATRICE@r@v55/75500665."That resolve is yours to create.@k@v55/75500666. It is not something that will be created automatically upon Battler''s visit."'
53609: '@r@v32/73700320."......Shannon.@k@v32/73700321. Are you already resolved to spend the rest of your life with him?@k @v32/73700322.You decided to put it off until the next family conference because you didn''t have that resolve the last time, right?"'
53610: 'BEATRICE@r@v55/75500667."What does it mean to live life with Battler?@k@v55/75500668. Have you ever thought seriously about it in detail?"'
53611: 'Shannon@r@v15/70500401."Well, .........uh............"'
53612: '@rAs long as I''m working as a servant on Rokkenjima, my opportunities for meeting him are limited.'
53613: '@rWe''re both underage, so it''s too early to talk about......umm......marriage.'
53614: '@rHowever, if I quit working as a servant, I should have many more opportunities to meet him.'
53615: '@rOnce I quit work here, ......I''ll return to the Gospel House.'
53616: '@rI have my wages for serving the family, so I should have more than enough to make visits to Battler-san''s house.'
53617: '@rAnd when I graduate from school, I can rent an apartment near to Battler-san''s house.'
53618: '@rThen, well......I can work while going to school.@k@rThat life will be a lot more difficult than my vague conception of it.'
53619: '@r......However, I''ll be able to see Battler-san much, much more often.@k@rIf not every day, then every week.'
53620: '@rI won''t be a servant anymore, so we''ll finally be equals.@k ......I''ll be allowed to call him whenever I want.'
53621: '@rAnd I''m already balancing school and work.'
53622: '@rThanks to my experience here, I know more than enough to do simple housework......'
53623: 'BEATRICE@r@v55/75500669."......Doesn''t that sound like a fun life?@k@v55/75500670. You can rent a humble abode, and once you''ve built up your own home, you can invite Battler over."'
53624: '@r@v32/73700323."And then, the time you spend together, the world the two of you make, will begin.@k@v32/73700324. Doesn''t that sound wonderful?"'
53625: 'Shannon@r@v15/70500402.".........Y-@v15/70500403.......yes.@k@v15/70500404. ......It does sound a bit...@v15/70500405....wonderful......"'
53626: '@rThis was the first time I had ever imagined that future clearly.'
53627: '@rI''ve been able to appreciate the feeling of my love for him...@k......and my honest desire to live my life with him.'
53628: '@rHowever, now that I have a clear picture of the future I plan to choose, I finally understand.'
53629: '@rI need to mentally commit myself to embarking on this future.'
53630: '@r@v32/73700325."You dream of...@k@v32/73700326.......marriage, eventually, don''t you?"'
53631: 'BEATRICE@r@v55/75500671."Hohoh!@k @v55/75500672.Girls these days, dating with marriage in mind at such a young age...!"'
53632: 'Shannon@r@v15/70500406."W-well, that''s a bit, umm......"'
53633: '@r@v32/73700327."Don''t deny your dreams, okay?@k @v32/73700328.There''s no point in taking a first step if your eyes are closed and you don''t look to the future."'
53634: 'BEATRICE@r@v55/75500673."If a girl''s in love with a man, there''s nothing wrong with thinking "I wanna marry hi~m"!@k@v55/75500674. That''s a young girl''s natural right."'
53635: '@rMy face had turned bright red.'
53636: '@rBefore today, I had thought that considering marriage really was a bit premature, and I had been trying my best not to think about it.'
53637: '@r......However, now that the witches had encouraged me to imagine it, that image was both exciting and fresh.'
53638: '@rI felt an indescribable feeling of refreshment and awakening,@k ......like the gentle breeze that washes over you when you go outside during a brief spot of sunshine on a rainy day.'
53639: '@rCertainly, I hadn''t yet reached that level of resolve.'
53640: '@rI need to create that resolve by the time the next family conference comes around.'
53641: '@rIf I can''t do that, then sticking around as a servant on this island is no more than I deserve.'
53642: '@r@v32/73700329."And at the same time, this is also a trial."'
53643: 'BEATRICE@r@v55/75500675."True.@k@v55/75500676. A trial to be overcome."'
53644: 'Shannon@r@v15/70500407."......A trial...?@k @v15/70500408.Why is that...?"'
53645: 'BEATRICE@r@v55/75500677."Fool.@k@v55/75500678. Battler promised that he would come for you at the next family conference, did he not?"'
53646: '@r@v32/73700330."He said he''d come on a white horse, right?"'
53647: 'Shannon@r@v15/70500409."Y-......yes......"'
53648: 'BEATRICE@r@v55/75500679."You are thinking that Battler will not come anymore.@k@v55/75500680. In other words, you have no trust in Battler''s promise."'
53649: '@r@v32/73700331."That''s why this is a trial.@k@v32/73700332. To pass through this trial, you''ll have to show that you can trust him and wait."'
53650: 'Shannon@r@v15/70500410.".........A trial......"'
53651: '@rI never thought of it that way.'
53652: '@rSince he promised to come for me in a year...@k@rI must believe that he will come for me in a year.'
53653: '@r......If I doubt that, I don''t have the right to wait for him in the first place.'
53654: '@r..............................'
53655: 'BEATRICE@r@v55/75500681."In fact, the reason that Battler left the Ushiromiya family might have been...@k@v55/75500682.that he has his sights set on a future with you."'
53656: '@r@v32/73700333."Oh, why would that be?"'
53657: 'BEATRICE@r@v55/75500683."If he knows that you will live together and eventually exchange marriage vows,@k@v55/75500684. having the name Ushiromiya could cause problems, since Shannon is a servant of the Ushiromiya family."'
53658: '@r@v32/73700334."Ah, I see!@k @v32/73700335.He realizes that there''ll be all kinds of trouble if he decides to marry a servant girl, so he''s abandoned the Ushiromiya name beforehand...!"'
53659: 'BEATRICE@r@v55/75500685."What do you think, Shannon?!@k @v55/75500686.That way, everything makes sense!@k @v55/75500687.Battler has abandoned the Ushiromiya name for your sake!@k @v55/75500688.This sudden argument with Rudolf was undoubtedly just an excuse."'
53660: '@r@v32/73700336."What splendid reasoning!@k @v32/73700337.Nice going, Riiche!"'
53661: 'BEATRICE@r@v55/75500689."Wahahahahahahahahaha...!@k @|@y@v55/75500690.What do you say, Shannon?@k@v55/75500691. There''s no reason to feel down!@k @v55/75500692.On the contrary, it is as though Battler has shown his resolve first!"'
53662: 'Shannon@r@v15/70500411."......*giggle*.@k@v15/70500412. ......*giggle*giggle*giggle*......"'
53663: '@rA smile finally returned to my face.@k@rOf course, I hadn''t taken the witches seriously and let myself be reassured.'
53664: '@rThe opposite, in fact.@k It was just funny that they could think up such ridiculously convenient explanations for everything.'
53665: '@rHowever, they had made all of those ridiculous theories to cheer me up.'
53666: '@r......The witches are right when they say that I must trust Battler-san...@kand that there''s no point moping about just because I''ve heard a few rumors.'
53667: '@rBy the date of the next family conference, I intend to have a firm resolve to live my life with him.'
53668: '@rAnd......I believe that he''ll accept my feelings and come for me.'
53669: '@rThe idea that Battler left the family so that he could be married to me some day...@k......is laughable, of course.'
53670: '@rBut right now, I should try to feel confident enough to accept even crazy ideas like that.'
53671: 'Shannon@r@v15/70500413."............Thanks so much.@k@v15/70500414. ......I feel a little better now."'
53672: 'BEATRICE@r@v55/75500693."That is well.@k@v55/75500694. I cannot stand watching you dampen your pillow with tears."'
53673: 'Shannon@r@v15/70500415."Thanks for coming into my dreams to encourage me."'
53674: 'BEATRICE@r@v55/75500695."Yes.@k@v55/75500696. ......It will be morning soon.@k@v55/75500697. This is all a dream.@k@v55/75500698. You will surely have forgotten it when you wake up.@k@v55/75500699. However, your heart will be at peace."'
53675: 'Shannon@r@v15/70500416.".........Yes.@k@v15/70500417. ......I''ll believe in him...and wait.@k@v15/70500418. ......So, I won''t listen to every little rumor."'
53676: 'BEATRICE@r@v55/75500700."Very good.@k@v55/75500701. Wait until the next conference while improving yourself.@k@v55/75500702. If you think of it as training to become a wife, all of your everyday chores will grow more meaningful!"'
53677: 'Shannon@r@v15/70500419."*giggle*.@k@v15/70500420. ......Thanks a lot."'
53678: '@r@v32/73700338."......Riiche.@k@v32/73700339. It''ll be morning soon."'
53679: 'BEATRICE@r@v55/75500703."Is that so?@k@v55/75500704. Then so long, Shannon.@k@v55/75500705. ......You may not remember me,@k@v55/75500706. but I will always be by your side, watching over you......"'
53680: 'Shannon@r@v15/70500421."Thank you......@k@v15/70500422. ......Thank you..."'
53681: 'BEATRICE@r@v55/75500707."......The next family conference will be here in a flash.@k@v55/75500708. ......Wait for it at your leisure......@k@v55/75500709. Battler will certainly keep his promise........."'
53682: 'Kyrie@r@v09/71300013."Pleased to meet you.@k@v09/71300014. .........My name is Kyrie.@k@v09/71300015. I hope we can all become quick friends."'
53683: 'Eva@r@v05/71000026."I''ve known your name longer than I''ve known Asumu-san''s.@k@v05/71000027. I hear you''re Rudolf''s old girlfriend."'
53684: 'Kyrie@r@v09/71300016."*giggle*.@k@v09/71300017. Yes, we''ve known each other for quite a long time..."'
53685: 'Natsuhi@r@v03/70900066."......Welcome to the Ushiromiya family.@k@v03/70900067. I hope you find it easy to grow comfortable here."'
53686: 'Kyrie@r@v09/71300018."Yes.@k@v09/71300019. I''d like to grow comfortable quickly, so that I can support my husband."'
53687: 'Hideyoshi@r@v06/71100019."But look at how cute that little girl is.@k@v06/71100020. What''s her name...?!"'
53688: 'Rosa@r@v12/71400110."This is Ange-chan.@k@v12/71400111. What a cute name."'
53689: 'Krauss@r@v02/70800065."............So, you two couldn''t make up after all."'
53690: 'Rudolf@r@v08/71200040."I thought this would be the perfect chance to bring him back, but...@k@v08/71200041. ......He''s as stubborn as Dad."'
53691: 'Rosa@r@v12/71400112."Will Battler-kun ever come back...?@k @v12/71400113.I''ll miss him."'
53692: 'Hideyoshi@r@v06/71100021."Nothin'' wrong with a man havin'' the backbone to find his own way in the world.@k@v06/71100022. I''m sure he''ll make it big and come right back...!"'
53693: 'Eva@r@v05/71000028."You think so?@k @v05/71000029.Right now, Battler-kun''s home isn''t home for him.@k@v05/71000030. There''s no reason for him to go back there."'
53694: 'Krauss@r@v02/70800066."......Enough.@k@v02/70800067. This concerns Rudolf''s family only.@k@v02/70800068. It is not our place to meddle."'
53695: 'Kyrie@r@v09/71300020."Thank you, Krauss nii-san.@k@v09/71300021. ......This is an issue for our family alone.@k@v09/71300022. However, I intend to do all I can to see that Battler-kun and Rudolf-san can live together again someday.@k@v09/71300023. After all, he''s Ange''s one and only big brother."'
53696: 'Rudolf@r@v08/71200042."......Yep.@k@v08/71200043. When that kid gets stuck on something, anything you say to him will have the opposite effect.@k@v08/71200044. ......Asumu''s father has a bit of a short temper.@k@v08/71200045. Looks like he''s been adding fuel to the fire."'
53697: 'Kyrie@r@v09/71300024."It''ll be okay.@k@v09/71300025. I''m sure he''ll understand your feelings before too long."'
53698: 'Hideyoshi@r@v06/71100023."We can''t do anything except cheer you on.@k@v06/71100024. ......Even if he doesn''t come back, we''re all prayin'' that the two of you will make up quickly."'
53699: 'Jessica@r@v04/70200296."......It''s kinda boring without Battler."'
53700: 'George@r@v07/70300066."Yeah.@k@v07/70300067. ......I hope he and Uncle Rudolf can make up soon."'
53701: 'Shannon@r@v15/70500423."............If you think about how Battler-sama feels......it must be painful."'
53702: 'Jessica@r@v04/70200297."It''s like his family''s suddenly changed around him...@k@v04/70200298. ......It probably doesn''t feel comfortable at home anymore."'
53703: 'George@r@v07/70300068."All men need to go out into the world one day or another.@k@v07/70300069. It might just be that Battler-kun''s time has come."'
53704: 'Shannon@r@v15/70500424."Do you think so......?"'
53705: 'George@r@v07/70300070."I do.@k@v07/70300071. It''s not cool for a guy to hang around at his parents'' for too long.@k@v07/70300072. You''ve got to leave the nest in a flurry and make your name in the world.@k@v07/70300073. ......I planned to do that eventually, but it looks like he''s gone and done it first."'
53706: 'Shannon@r@v15/70500425."O-once he makes his name in the world, ......do you think he will come back?"'
53707: 'George@r@v07/70300074."It may be......that he never comes back.@k@v07/70300075. After all, this might be leaving the nest to him."'
53708: 'Shannon@r@v15/70500426."......Leaving the nest....................."'
53709: '@r@v32/73700340."Battler didn''t come, did he......"'
53710: 'BEATRICE@r@v55/75500710."Oh, how terrible.@k@v55/75500711. And I kept telling Shannon that he was sure to come.@k@v55/75500712. .........I''m sure she feels very upset about Battler not coming.@k@v55/75500713. And it''s all because I irresponsibly raised her hopes...!"'
53711: '@r@v32/73700341."She''s practically been living for the sake of this day...@k@v32/73700342. It pains me to think of how she must feel."'
53712: 'Shannon@r@v15/70500427."...............Thanks, you two.@k@v15/70500428. ......I''m...okay."'
53713: '@rI had been reunited with the witches once again in that dream world.'
53714: '@r.........Though I could never remember anything during the day, now that I was in the dream world, I somehow knew that this was a reunion.'
53715: '@rThe witches both looked apologetic.'
53716: '@rThough they had tried to cheer me up by saying that Battler would come today,@k now that he hadn''t come, it was like they had been lying, and they seemed to regret it heavily.'
53717: 'BEATRICE@r@v55/75500714."Shannon,@v55/75500715. ......umm...@v55/75500716....well......"'
53718: 'Shannon@r@v15/70500429."......Thanks for your concern.@k@v15/70500430. It''d be a lie to say I''m not sad,@k@v15/70500431. .........but I''ll be okay."'
53719: 'BEATRICE@r@v55/75500717."Y-you will?@k @v55/75500718.You are certain?@k @v55/75500719.......That would be splendid, but......"'
53720: '@r@v32/73700343."Clearly, Battler''s fight was so over-the-top that he couldn''t bring himself to back down so soon.@k@v32/73700344. Men are so stubborn."'
53721: 'BEATRICE@r@v55/75500720."Y-yes, that is true...!@k @v55/75500721.He stormed out of the family with some very strong words, so his stubbornness is preventing him from taking back what he said so easily!@k @v55/75500722.He probably regrets not coming today.@k@v55/75500723. Yes, that must be it...!"'
53722: '@rFor some reason, ......they seemed nearly desperate in their attempts to encourage me.'
53723: '@rIt was almost funny to watch.@k ......I couldn''t help but giggle.'
53724: 'Shannon@r@v15/70500432."Thanks a lot, both of you.@k@v15/70500433. After all, .........you''re the ones who told me in the first place.@k@v15/70500434. That this is a test, a trial to be overcome."'
53725: '@rThe truth was, I couldn''t really fool myself so easily.'
53726: '@rWhen will he come back?@k@rWhen will he come for me?@k@rWhen...isn''t the question.@k ......Will he come for me, ever?'
53727: '@rIf I start moping right now, the uncertainty and sadness will probably tear me apart.'
53728: '@rBut they''ve taught me.'
53729: '@rThis is.........a test to see whether I really have faith in him or not.'
53730: '@rThe very fact that I feel uncertain and anxious is a betrayal of my resolve......and of his promise to come for me someday.'
53731: 'Shannon@r@v15/70500435."George-sama said something about it.@k@v15/70500436. ......He said this might be the same as leaving the nest for Battler-san."'
53732: '@r@v32/73700345."That''s right.@k@v32/73700346. This is his chance to leave behind the Ushiromiya name and spread his wings as his own man."'
53733: 'Shannon@r@v15/70500437."If you really think about it, ......we''re still very young.@k@v15/70500438. Even if we want to be tied together, we''re still lacking many years of social experience and trust.@k@v15/70500439. If Battler-san is really and truly taking this seriously, ......then it''s too soon for him to come for me now."'
53734: 'BEATRICE@r@v55/75500724."Well done.@k@v55/75500725. Yes, that''s the right attitude...!@k @v55/75500726.You have done well to reach this understanding."'
53735: 'Shannon@r@v15/70500440."......I haven''t reached anything...@k@v15/70500441. .........But I''ve decided to think of it that way for now.@k@v15/70500442. This is a trial......to see whether I trust Battler-san or not."'
53736: '@rIf he had showed up today,@k ......then today, I would have had to inform Madam that I was quitting my job as a servant.'
53737: '@rBut was I mentally prepared for that?'
53738: '@rI spent all last night worrying about whether Battler-san would come or not.'
53739: '@rI spent so much time worrying that not only was I not mentally prepared to quit my job, I didn''t even prepare a letter of resignation.'
53740: '@r......In short, I still don''t have the "resolve" that I promised him that day.'
53741: '@rI''m sure that God knew that.@k@rBattler is supposed to come for me when I''ve found my resolve.'
53742: '@rI wasn''t resolved, so it''s only natural that he didn''t come today......'
53743: '@r..............................'
53744: '@r......Yeah.@k ...It all makes sense now.'
53745: 'Shannon@r@v15/70500443."So,@k@v15/70500444. ......I''m sure Battler-san didn''t come today......because I wasn''t resolved enough.@k@v15/70500445. It''s only natural, since I couldn''t even truly believe that he would come..."'
53746: 'BEATRICE@r@v55/75500727."I''m sure Battler was the same way.@k@v55/75500728. He did not yet have the resolve to come for you."'
53747: '@r@v32/73700347."......God isn''t heartless.@k@v32/73700348. When your feelings truly do draw close, I''m sure He''ll bring the two of you together."'
53748: 'BEATRICE@r@v55/75500729."Just like Orihime and Hikoboshi...!"'
53749: 'Shannon@r@v15/70500446."Yes, it''s as though the weather just happened to be bad during this year''s Tanabata...@k@v15/70500447. ......That''s how I''d like to think about what happened today."'
53750: '@rThat''s how...I''d like to think about it.'
53751: '@r......I have no other choice.'
53752: '@r..............................'
53753: '@r......Battler-san......'
53754: 'Lion@r@v53/75300508."But Battler-kun didn''t come back for......"'
53755: 'Will@r@v54/75401020."Six years.@k@v54/75401021. ......Still a long way to go until then."'
53756: 'Lion@r@v53/75300509."......So this agonizing wait continued for six whole years...?"'
53757: 'Clair@r@v55/75500730."When one waits every year for something to happen the next, and then the same thing the next year and the next,@k@v55/75500731. ......it becomes similar to waiting for an eternity."'
