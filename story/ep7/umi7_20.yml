56968: '@rTwo white pieces were set on the chessboard.'
56969: '@r......The countless black pieces surrounding them were packed tightly together, not even placed on the squares anymore.'
56970: '@rThen, BERNKASTEL tipped the two white pieces over...@k...and took them off the board.'
56971: 'BERNKASTEL@r@v28/72100543."May I end it there?"'
56972: 'FEATHERINE@r@v50/75000001.".........Yes.@k@v50/75000002. Your reading truly does fit my ears well, my miko."'
56973: 'BERNKASTEL@r@v28/72100544."As you wished, I''ve scraped out even the inner parts of the guts.@k@v28/72100545. Was this enough to check your answers with?"'
56974: 'FEATHERINE@r@v50/75000003."Yes.@k@v50/75000004. ......I am very satisfied.@k@v50/75000005. Using the answer you have revealed as a key, I will go back through all the tales so far,@k@v50/75000006. opening the locked rooms like treasure boxes, one by one."'
56975: 'FEATHERINE@r@v50/75000007.".........It''s fun finding the key.@k@v50/75000008. And it''s even more fun to stick it into all the locks.@k@v50/75000009. You have done well, my miko.@k@v50/75000010. From this point on, I would like to enjoy my thoughts alone.@k@v50/75000011. This has been enough......"'
56976: '@rThe Witch of Theatergoing sat back in her rocking chair, a satisfied smile on her face, as though enjoying a pleasant aftertaste.'
56977: '@rThere was no need for a game board anymore.'
56978: '@rShe just had to go back in her mind, through the whole set of tales, to check whether her theory was right or not.'
56979: '@rIt seemed to leave her pleasantly drunk, even better than the most expensive wine......'
56980: 'BERNKASTEL@r@v28/72100546.".........Are you done with me now?"'
56981: 'FEATHERINE@r@v50/75000012."You have done well, my miko.@k@v50/75000013. I absolve you of your duty.@k@v50/75000014. ......I will return to my slumber.@k@v50/75000015. I''d like to enjoy this pleasant dream for a few more centuries."'
56982: 'FEATHERINE@r@v50/75000016."And when I grow tired of that,@k@v50/75000017. ......you will find yet another tale to keep me entertained.@k@v50/75000018. ......For those centuries, which will pass in the blink of an eye,@k@v50/75000019. I grant you your freedom."'
56983: 'FEATHERINE@r@v50/75000020."Heheheheheh......@k@v50/75000021. Splendidly done, BERNKASTEL, my darling, darling miko......"'
56984: 'BERNKASTEL@r@v28/72100547.".........That''s not my concern.@k@v28/72100548. Just shrivel up and die, won''t you.@k@v28/72100549. So long, for the rest of time."'
56985: 'FEATHERINE@r@v50/75000022."You call a few mere centuries "for the rest of time"?@k @|@y@v50/75000023.*cackle*cackle*...............@k@v50/75000024. ......................................."'
56986: '@rFEATHERINE''s consciousness slowly faded away.'
56987: '@rAs the owner of the study''s slumber grew deeper,@k ......the lights about the room slowly darkened.'
56988: 'BERNKASTEL@r@v28/72100550."Good night forever, Auaurora.@k@|@y@v28/72100551. ............You don''t need this game board anymore.@k@v28/72100552. I''ll take it."'
56989: '@rBERNKASTEL reached out towards Beato''s game board, which lay on the table in front of FEATHERINE''s rocking chair, and tapped it twice.'
56990: '@rThe game board and the pieces flew into the air, folded up and put themselves away, then landed on BERNKASTEL''s outstretched right hand.'
56991: 'BERNKASTEL@r@v28/72100553."......I still haven''t had a chance to do any real Game Mastering.@k @v28/72100554.......I just did Beato''s funeral.@k@v28/72100555. That, and tearing out the guts.@k@v28/72100556. ............I still haven''t done anything."'
56992: '@rBERNKASTEL''s smile twisted evilly.'
56993: '@rThen, the game board floated up once again, .........and a world unfolded itself above BERNKASTEL''s palm......'
56994: 'BERNKASTEL@r@v28/72100557."Now, pieces of Beato''s game......?@k @v28/72100558.I''m going to have you spin a truly brutal tale to truly entertain me.@k@v28/72100559. Tremble with fear of the absolute fate you have been promised.@k@v28/72100560. ......By the name of BERNKASTEL, Witch of Miracles,@k@v28/72100561. ......and as the final Game Master of Beato''s game, I proclaim it."'
56995: 'BERNKASTEL@r@v28/72100562."......Though just saying it would be boring.@k@v28/72100563. ......Maybe I should follow Beato''s rules and say it in red."'
56996: 'LAMBDADELTA@r@v29/72200006."Good idea, I think.@k @v29/72200007.It looks like there might still be some witches with naive dreams."'
56997: 'BERNKASTEL@r@v28/72100564."Ah, Lambda. So you''re here?@k @|@y@v28/72100565.Of course you are. You''re always wherever I am."'
56998: 'LAMBDADELTA@r@v29/72200008."Go on and say it.@k@v29/72200009. You tell those naive dreamers."'
56999: 'BERNKASTEL@r@v28/72100566."Yes, I will.@k@v28/72100567. ......As the Witch of Miracles, and as the final Game Master, I proclaim the start of the final game.@k@v28/72100568. And I make you this promise."'
57000: '@r@v00/awase7016_o.@c900.@[I will not give this game a happy ending.@]@c.'
57001: '@r@v11/72000164.*sob*.@k@v11/72000165. ......*sob*sob*......'
57002: '@rA single girl......was crying in a desolate, quiet chapel.'
57003: '@rShe was a small girl.@k ......Only six years old.'
57004: '@rThe girl who would, for twelve years starting now,@k lament the fact that she wasn''t on the island on October 4th and 5th, 1986......'
57005: '@rThen,@w833. .........a man appeared......'
57006: '@rThe man noticed the girl,@w583. ......walked up to her quietly, trying not to scare her,@w500. ......and put an arm gently around her shoulder......'
57007: '@r@v11/72000166.".........Onii-chan..............."'
57008: 'Battler@r@v10/70100184."I''ve been looking for you, Ange......"'
57009: '@rThe girl jumped into her big brother''s chest and started crying again...'
57010: 'Battler@r@v10/70100185."What''s wrong?@k@v10/70100186. ......Why are you so sad?"'
57011: 'Ange@r@v11/72000167."Today, a kid in class bullied me......@k@v11/72000168. He said the people on TV were saying Mom had ties to bad people.@k@v11/72000169. .........So, he said that Mom and Dad were the culprits, and that they probably killed everyone......@k@v11/72000170. ......I asked Auntie Eva, hoping she''d say it wasn''t true, but she didn''t say anything......@k@v11/72000171. ......Mom and Dad aren''t bad people, are they?@k @v11/72000172.Are they...?"'
57012: 'Battler@r@v10/70100187."Poor thing......@k@v10/70100188. ......Everyone says whatever they please about what might have happened on that island on that day...@k@|@y@v10/70100189. ......Sit over here."'
57013: 'Ange@r@v11/72000173."...............Okay..."'
57014: '@rWhen the man pointed to the floor, a group of gold butterflies gathered there and created a chair.'
57015: '@rThe girl obediently sat down on it......'
57016: 'Ange@r@v11/72000174."......You know, don''t you, Onii-chan?@k @v11/72000175.You know that Mom and Dad aren''t bad people, right?"'
57017: 'Battler@r@v10/70100190."Yeah. Of course I know that.@k@v10/70100191. ......I know that none of them were bad people."'
57018: 'Ange@r@v11/72000176."Then tell me.@k@v11/72000177. What happened that day?@k @v11/72000178.What happened on Rokkenjima?"'
57019: 'Battler@r@v10/70100192."Okay.@k@v10/70100193. .........I''ll tell you.@k@v10/70100194. This is what happened on that day."'
57020: 'Ange@r@v11/72000179."Is it......a scary story...?"'
57021: 'Battler@r@v10/70100195."Come now."'
57022: 'Ange@r@v11/72000180."Is it a sad story......?"'
57023: 'Battler@r@v10/70100196."Of course not."'
57024: 'Ange@r@v11/72000181."Then, ......what kind of story is it......?"'
57025: 'Battler@r@v10/70100197."You can decide that for yourself when you hear it.@k@v10/70100198. It isn''t a painful story at all.@k@v10/70100199. So listen up."'
57026: 'Ange@r@v11/72000182."Okay,@k@v11/72000183. Battler onii-chan......"'
57027: 'Battler@r@v10/70100200.@e@s50."On that day, we all went to Rokkenjima.@|@y@v10/70100201. There were a lot of us.@|@y@v10/70100202. It was an important day, the day of the family conference."@|@y'
57028: 'Battler@r@v10/70100203.@e@s50.".........Hmm, where should I start?"@|@y'
57029: '@r@v10/70100204.@e@s50.This is...@|@y@v10/70100205.the final game, made just for Ange.@|@y'
57030: 'Battler@r@v10/70100206.@e@s50.Listen, Ange.@|@y@r@v10/70100207.This is what happened on Rokkenjima on that day.@|@y@r@v10/70100208.It isn''t sad or painful at all.........@|@y'