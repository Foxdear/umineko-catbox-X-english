49767: 'Lion@r@v53/75300168."I''ve brought Willard-san."'
49768: 'Will@r@v54/75400362."........................"'
49769: '@rKinzo and Genji could be seen in the VIP room.'
49770: '@rKinzo was sitting back in a chair, his eyes closed as though in a troubled sleep.'
49771: 'Genji@r@v14/71600004."......My lord.@k@v14/71600005. The guest has come to see you."'
49772: 'Kinzo@r@v01/71500006."..............................nn."'
49773: '@rKinzo slowly opened his eyes.@k@r......Those eyes were red from crying.'
49774: '@rThey regained their focus and slowly fell on Will.'
49775: 'Kinzo@r@v01/71500007."......I am...Ushiromiya Kinzo."'
49776: 'Lion@r@v53/75300169."......Will."'
49777: 'Will@r@v54/75400363."I''m Willard.@k@v54/75400364. Allow me to express my condolences."'
49778: 'Kinzo@r@v01/71500008."......So, you''ve come to visit Beatrice''s funeral.@k@v01/71500009. ......Just who are you?"'
49779: 'Will@r@v54/75400365."I''m no one. I have no connections with anyone.@k@v54/75400366. Don''t think too deeply about it.@k@v54/75400367. You''ll just get a headache.@k@|@y@v54/75400368. .........Ow."'
49780: 'Lion@r@v53/75300170."I ask that you choose your words a little more carefully."'
49781: 'Kinzo@r@v01/71500010."......Hmph, what a strange guest.@k@v01/71500011. So?@k @v01/71500012.What business do you have with me?"'
49782: 'Will@r@v54/75400369."I want to ask about Beatrice."'
49783: 'Kinzo@r@v01/71500013."What..................?"'
49784: '@rKinzo''s gaze grew sharp.'
49785: '@rLion felt a bit lightheaded and wondered why this guy had to be so direct.'
49786: 'Kinzo@r@v01/71500014."Why do you ask?@k@v01/71500015. I thought you were no one.@k@v01/71500016. Why do you want to know about Beatrice?@k@v01/71500017. What purpose could it serve?"'
49787: 'Will@r@v54/75400370."Because I am no one,@k@v54/75400371. I can listen to your tale without bias and record it.@k@v54/75400372. You will probably leave this world before too long.@k@v54/75400373. If you die without telling anything about Beatrice,@k@v54/75400374. your children will adorn her with their own fanciful tales and write them into history."'
49788: 'Kinzo@r@v01/71500018."Pft, hahahahahahahahahaha!@k @v01/71500019.You entertain me, boy.@k@v01/71500020. You think yourself a testament taker?!"'
49789: 'Kinzo@r@v01/71500021."But that is wholly unnecessary.@k@v01/71500022. Beatrice is mine alone.@k@v01/71500023. No matter what anyone says,@k@v01/71500024. no one can defile our story. What they say is of no consequence!@k @v01/71500025.No matter how Krauss and the others misconstrue it, it matters nothing to me!"'
49790: 'Genji@r@v14/71600006."......Willard-sama.@k@v14/71600007. The Master does not like wills.@k@v14/71600008. He is not one to abandon anything while he still lives."'
49791: 'Will@r@v54/75400375."......Probably true.@k@v54/75400376. I thought it sounded a bit unlike him."'
49792: 'Kinzo@r@v01/71500026."The spirit to struggle onward to our dying breaths is what makes us human!@k @v01/71500027.The idea that I would give up before my time and leave behind a will is laughably absurd!"'
49793: 'Will@r@v54/75400377."Yes, that does sound a bit more like you.@k@|@y@v54/75400378. ......It''s not your style to ask someone to write about the past just because you feel you might die soon."'
49794: 'Lion@r@v53/75300171."......We know how deeply you loved Beatrice-sama.@k@v53/75300172. You are the model most worthy of respect that any of us know, and an example for us to follow in every aspect of our lives."'
49795: 'Lion@r@v53/75300173."Please, for the sake of us wandering souls,@k@v53/75300174. may we learn of how you loved her to the last, how your love for her guided you through life,@k@v53/75300175. ......and the strength of your love for her, so that your story might guide us through our own lives...?"'
49796: 'Will@r@v54/75400379."You''re pretty good at this."'
49797: 'Lion@r@v53/75300176."It''s your fault for being so tactless."'
49798: 'Kinzo@r@v01/71500028."Boy.@k@v01/71500029. What do you know of Beatrice?@k @v01/71500030.A truly ignorant person would not hold any interest at all.@k@v01/71500031. The mere fact that you know her name shows that you are neither ignorant nor unconnected."'
49799: 'Will@r@v54/75400380."Good point.@k@v54/75400381. ......The Beatrice I know of...@k@v54/75400382.is the woman you loved, the one you met before the mansion on Rokkenjima was even built.@k@v54/75400383. However, she probably departed from this world, leaving behind a daughter.@k@v54/75400384. That is the girl who was raised in Kuwadorian."'
49800: 'Kinzo@r@v01/71500032.".........Oho."'
49801: 'Genji@r@v14/71600009."Willard-sama.@k@v14/71600010. There is no building known as Kuwadorian on Rokkenjima."'
49802: 'Lion@r@v53/75300177."......That name, Kuwadorian...@k@v53/75300178. ...You mentioned it when we were talking with Aunt Rosa too.@k@v53/75300179. ......What in the world does it mean?"'
49803: 'Will@r@v54/75400385."You should have an idea by now.@k@v54/75400386. It''s the name of the hidden mansion deep in the forest where his mistress''s daughter lived."'
49804: 'Kinzo@r@v01/71500033."Interesting.@k@v01/71500034. ......So, you actually know the name of Kuwadorian.@k@v01/71500035. ......Continue. You have sparked my interest."'
49805: '@rKinzo shrugged and grinned......'
49806: 'Will@r@v54/75400387."The one living in Kuwadorian was probably Beatrice''s daughter.@k@v54/75400388. However, it seems that you didn''t think of her that way."'
49807: 'Kinzo@r@v01/71500036."Oho.@k@v01/71500037. ......Then how did I think of her?"'
49808: 'Will@r@v54/75400389."When Ushiromiya Rosa went to Kuwadorian, Beatrice told her a little about herself.@k@v54/75400390. ......In that conversation, she referred to you as Kinzo.@k@v54/75400391. It was the same when she spoke to you directly."'
49809: 'Will@r@v54/75400392."Though she said that she thought of you as a father, she didn''t call you Father.@k@v54/75400393. ......She either didn''t call you that, or she wasn''t allowed to call you that.@k@v54/75400394. That can only mean one thing."'
49810: 'Kinzo@r@v01/71500038."And what might that be......?"'
49811: 'Will@r@v54/75400395."Reincarnation.@k@v54/75400396. You didn''t think of your daughter as a child Beatrice left behind.@k@v54/75400397. You believed that the dead Beatrice had revived into a new body.@k@|@y@v54/75400398. ......Genji.@k@v54/75400399. Once in the past, you spoke in front of Natsuhi and several other family members,@k@v54/75400400. stating that there had never been a child between Kinzo and Beatrice."'
49812: 'Genji@r@v14/71600011_o.".........I have no memory of saying this."'
49813: '@rOf course, "this game''s" Genji probably wouldn''t remember that.'
49814: '@rHowever, near the end of the first game, when the survivors all gathered in Kinzo''s study...'
49815: '@r...Genji was asked whether Kinzo and Beatrice ever had a child together,@k and he denied it, saying "I have not heard of anything like that".'
49816: 'Will@r@v54/75400401B."''I have not heard that''... In a way, it was a perfect sort of answer for one of Kinzo''s confidants.@k@v54/75400402B. ......After all, in Kinzo''s eyes, she wasn''t a daughter, but Beatrice reborn."'
49817: 'Lion@r@v53/75300180."Will...!@k @v53/75300181.I don''t know what you''re talking about, but I will not let you slander the family head!"'
49818: 'Will@r@v54/75400404."This isn''t slander.@k@v54/75400405. It''s reasoning.@k@v54/75400406. ......However, I understand the heart.@k@v54/75400407. Beatrice was the woman you loved most.@k@v54/75400408. She remained that way even after death, for all eternity, and without fading in the slightest."'
49819: 'Will@r@v54/75400410."However, given the child''s blue eyes, beautiful blonde hair, and facial features which resembled Beatrice from a young age,@k@v54/75400411. if you had gradually begun to think that she might actually be Beatrice reborn,@k@v54/75400412. that wouldn''t be surprising."'
49820: 'Genji@r@v14/71600012."...............My lord.@k@v14/71600013. Shall I...?"'
49821: '@rShall I throw this insolent man out?@k Genji asked Kinzo.'
49822: '@rFor a while, Kinzo hung his head in silence, as though remembering something from his own past.'
49823: 'Will@r@v54/75400413."Your daughter grew to be beautiful and nearly identical to her mother.@k@v54/75400414. You must have been ecstatic.@k@v54/75400415. However, it''s doubtful that you were fully satisfied by this.@k@v54/75400416. ......After all, though she was Beatrice reborn to you,@k@v54/75400417. she didn''t feel that way herself."'
49824: 'Kinzo@r@v01/71500039."......How can you know that?"'
49825: 'Will@r@v54/75400418."She couldn''t shake the feeling that there was something out of place about her being called Beatrice.@k@v54/75400419. ......People never feel anything out of place about the name they were given at the time of their birth.@k@v54/75400420. However, she did have that feeling.@k@v54/75400421. That must mean that she was aware that the name "Beatrice" was not hers."'
49826: '@rIn Kuwadorian, she asked both Kinzo and Rosa about who she was.'
49827: 'BEATRICE@r@v27/70700001.— Who am I?@k@v27/70700002_b. ......Everyone calls me BEATRICE.@k@v27/70700003. ...And that does certainly seem to be the name of a great witch, as you say.'
49828: 'BEATRICE@r@v27/70700004.— ......But that is not me.@k@v27/70700005. I cannot use any magic.@k@v27/70700006. ......I simply have the soul of that witch sealed inside my body.'
49829: 'Kinzo@r@v01/71500040."........................Her memory...@k@v01/71500041.would have returned.@k@|@y@v01/71500042. ......She was without a doubt Beatrice reborn.@k@v01/71500043. ......Her memory was coming back bit by bit.@k@v01/71500044. My magical rituals were helping her regain her memories one little bit at a time......"'
49830: 'Lion@r@v53/75300182."G-......Grandfather......"'
49831: 'Will@r@v54/75400422."There''s no need to be surprised.@k@v54/75400423. If you line up the information in all the games so far, this is the answer it leads you to.@k@v54/75400424. ......The Beatrice on the higher plane talked about this in metaphor, saying that Kinzo refused to let the witch''s soul escape even after death, and instead caught it and locked it up in a body of flesh.@k@v54/75400425. She also said that her power and memory had been sealed.@k@v54/75400426. If you match that interpretation of hers to this theory, it all makes sense."'
49832: 'Genji@r@v14/71600014."............Willard-sama.@k@v14/71600015B. Thanks to a powerful magical ritual, the Master gained a reborn child of the late Beatrice-sama.@k@v14/71600016. That cannot be denied."'
49833: 'Will@r@v54/75400427B."I won''t contradict the stork.@k@v54/75400428. And I don''t intend to doubt the depths of Kinzo''s love for this woman called Beatrice.@k@v54/75400429. .........It''s no one''s business how a person chooses to show their affection towards their only living reminder of the departed.@k@v54/75400430. If she grew to look more and more like Beatrice, and Kinzo''s love gave rise to a new, special emotion,@k@v54/75400431. I find that a very human reaction."'
49834: 'Kinzo@r@v01/71500045.".........You think...@v01/71500046....you can understand my love.........?"'
49835: 'Will@r@v54/75400432."I''m not qualified to understand it.@k@v54/75400433. However, I''m also not qualified to deny it."'
49836: 'Kinzo@r@v01/71500047."..................Oooh,@v01/71500048. ......Beatrice......@k@v01/71500049. ......Please,@v01/71500050. .........forgive me........."'
49837: '@rKinzo sobbed quietly for a while, wiping away his tears...'
49838: '@rBecause of love,@w250. he believed she was Beatrice reborn,@w333. and raised her that way.'
49839: '@rHowever, somewhere in his heart,@w416. ......he might have felt...@k...pangs of conscience,@k telling him that he might be forcing his emotions on someone who wasn''t really Beatrice.'
49840: '@rThen, the Beatrice of Kuwadorian had an unexpected guest, Rosa.'
49841: '@rUnable to believe that she was the Beatrice that Kinzo desired,@k and suffering from her inability to understand who she was, she expressed a desire to escape to the outside world.'
49842: '@rThen, ............she fell from the cliff...and died.'
49843: 'Will@r@v54/75400434."Genji handled that death, which couldn''t become public knowledge, very quietly."'
49844: 'Genji@r"...................................."'
49845: 'Will@r@v54/75400435."Funerals aren''t for the dead.@k@v54/75400436. ......They exist so that those who are alive can sever their ties with the dead.@k@v54/75400437. ......You could never do that.@k@v54/75400438. That''s why it festered within you."'
49846: 'Kinzo@r@v01/71500051."......Beatrice......@v01/71500052....ooooooooohhhh......"'
49847: 'Lion@r@v53/75300183."G-......Grandfather........."'
49848: 'Will@r@v54/75400439."You lost your mistress''s—@k@v54/75400440.no, you lost Beatrice twice.@k@v54/75400441. Unable to let that sorrow show on the outside, you kept it locked up in your heart,@k@v54/75400442. ......and it eventually festered and turned to madness.@k@v54/75400443. That''s what spurred on your abnormally strong interest in the occult in your later years."'
49849: 'Kinzo@r@v01/71500053."Oooooooooohhhh!!@k @v01/71500054.Beatriceeeeee, Beatriceeeeee!!@k @|@y@v01/71500055.Why?!!@k @v01/71500056.Why did you leave me twice?!@k @v01/71500057.Your smile,@v01/71500058. that beautiful hair,@v01/71500059. those eyes...@v01/71500060. ......Why did you die in my arms not once,@v01/71500061. ......but twice?!"'
49850: 'Kinzo@r@v01/71500062."Is that how much...@v01/71500063....how much you...@v01/71500064.......ooooooohhhh,@v01/71500065. oooooooooooooooooooooooohhhh...oohhh..."'
49851: '@rBy now, Kinzo wasn''t even trying to suppress his sobs.'
49852: '@rSometimes, he scratched at his head in anguish;@k@rother times, he faced the heavens like an opera singer.'
49853: '@rKinzo yelled over and over again, repeating Beatrice''s name......'
49854: '@rAt that moment, there was a quiet sound of a door closing.'
49855: '@r......When they turned around, she was already there.@k@rKumasawa had appeared.'
49856: 'Kumasawa@r@v18/71800003.".........If they already know that much,@k@v18/71800004. perhaps we can tell them the rest...?"'
49857: 'Genji@r@v14/71600018."......Though, if they know that much,@k@v14/71600019. I don''t believe there is anything more to tell..."'
49858: 'Kumasawa@r@v18/71800005."No, we should tell them.@k@v18/71800006. As a woman,@k@v18/71800007. ......I''ve always thought that the heart of Kuwadorian''s Beatrice is a story that should be told.@k@v18/71800008. And now, someone has appeared who is worthy to hear it.@k@v18/71800009. I believe that now is the time to tell all, without holding back."'
49859: 'Genji@r".............................."'
49860: 'Lion@r@v53/75300184."Kumasawa-san, do you know something?@k @v53/75300185.About Beatrice......?"'
49861: 'Will@r@v54/75400444."Of course she does.@k@v54/75400445. ......In the fourth game, we have testimony from the ferryboat captain saying that Kumasawa went in and out of Kuwadorian.@k@v54/75400446. I''d be willing to bet that Kumasawa had different work shifts at the mansion and Kuwadorian.@k@v54/75400447. There was a young girl to be taken care of.@k@v54/75400448. Kumasawa, with her long experience in taking care of children, must have been of immense value."'
49862: 'Kumasawa@r@v18/71800010.".........That is correct.@k@v18/71800011. You might even call me her wet nurse."'
49863: 'Lion@r@v53/75300186."No way......@k@v53/75300187. ......I can''t believe it.@k@v53/75300188. ......So, ......everything Will-san is saying is the truth."'
49864: 'Kumasawa@r@v18/71800012.".........Yes.@k@v18/71800013. It is a fact.@k@v18/71800014. ......There was a secret mansion constructed on the opposite side of the island for Beatrice-sama.@k@v18/71800015. The existence of Kuwadorian is the truth."'
49865: 'Will@r@v54/75400449."I don''t know when Kinzo married his official wife,@k@v54/75400450. but back when Kinzo already had an enormous store of wealth and had bought Rokkenjima whole,@k@v54/75400451. he built two mansions and set up two separate lives."'
49866: '@rKinzo''s children had also been aware of Kinzo''s clandestine eccentricities at the time.'
49867: '@rIt probably hadn''t been easy to set up two lives.@k@rMoreover, Kinzo''s wife had been suspicious and had sniffed around all the time...'
49868: 'Kumasawa@r@v18/71800016."The Master stayed in Kuwadorian as much as time allowed.@k@v18/71800017. He would sometimes pretend to go on a business trip and stay there for several days,@k@v18/71800018. treasuring the time he spent with Beatrice-sama.@k@|@y@v18/71800019. ......It was not simply a father-daughter relationship.@k@v18/71800020. You could sometimes catch a glimpse of his great love for the late Beatrice-sama, and it was a heart-warming thing."'
49869: 'Will@r@v54/75400452."The way you say it makes it sound like he sometimes treated her...@k@v54/75400453....as a substitute for Beatrice."'
49870: 'Kumasawa@r@v18/71800021."Oho.@k@v18/71800022. If it sounded that way, my apologies.@k@|@y@v18/71800023. ......Beatrice-sama probably accepted her father''s love.@k@v18/71800024. However, I will not deny...@k@v18/71800025.that she was sometimes forced to bear a love she didn''t understand."'
49871: '@rKumasawa''s tone made it sound as though she was scolding Kinzo.'
49872: '@rAs a mother who had raised many kids, Kumasawa had probably spotted that Kinzo''s love was often of a mistaken sort.'
49873: '@rHowever, the more the girl grew to look like her mother,@k the more distorted and twisted Kinzo''s heart became......'
49874: '@rBecause of his deep love,@w250. it grew very,@w250. very...@w500....twisted......'
49875: 'Kinzo@r@v01/71500066.".........You are right to scold me, my friend.@k@v01/71500067. ............I understand.@k@v01/71500068. My love is eternal and undying.@k@v01/71500069. ......However, there were times when I directed it at the wrong person, and...@k@v01/71500070....I...@v01/71500071....must acknowledge that......"'
49876: 'Lion@r@v53/75300189."......Grandfather...@k@v53/75300190. .........Wait, ......you don''t mean......"'
49877: 'Kumasawa@r@v18/71800026."Lion-sama.@k@v18/71800027. All humans in this world are tied to each other.@k@v18/71800028. Even if they do not notice, there is always some sort of tie.@k@v18/71800029. Those ties......wrap themselves around people and bring them together."'
49878: 'Lion@r@v53/75300191."No way...............@k@v53/75300192. ............Grandfather..............."'
49879: '@rJust as Kinzo had done, Lion also wiped away tears and stared down at the floor.'
49880: '@rApparently, the truth had been too much of a shock for the young successor to handle...'
49881: 'Kumasawa@r@v18/71800030."......My lord.@k@v18/71800031. Perhaps the time has come to speak of it."'
49882: 'Kinzo@r@v01/71500072."..............................@k@v01/71500073. ......I see.@k@v01/71500074. So, that time has come, ......my friend."'
49883: 'Will@r@v54/75400454."Unless you tell us,@k@v54/75400455. none of the truth will become clear."'
49884: 'Genji@r@v14/71600021.".........My lord.@k@v14/71600022. ......I believe they may have the qualifications and the right to know."'
49885: 'Kinzo@r@v01/71500075."I know.@k@v01/71500076. Perhaps on this day of my fickle funeral, Beatrice in heaven has given me a chance to atone...@k@|@y@v01/71500077. .........Forgive me for not telling you this before now."'
49886: '@rAfter taking a deep breath, Kinzo finally lowered the hands that had been covering his face,@k ......and looked at Will and Lion with those red eyes.'
49887: 'Kinzo@r@v01/71500078."..........................."'
49888: 'Lion@r@v53/75300193."..................Grandfather..."'
49889: 'Kinzo@r@v01/71500079."You listen too, Lion.@k@v01/71500080. ......Guest.@k@v01/71500081. Willard, was it?"'
49890: 'Will@r@v54/75400456."Yeah."'
49891: 'Kinzo@r@v01/71500082.".........I thank you for giving me a chance to speak of the truth while I still am able.@k@|@y@v01/71500083. ......You must surely be a messenger from heaven sent by Beatrice...@k@v01/71500084. ......You have my gratitude........."'
49892: 'Will@r@v54/75400457."Beatrice isn''t the one you have to thank.@k@v54/75400458. It was some witch.@k@v54/75400459. ......Well, I guess they''re both witches..."'
49893: 'Kinzo@r@v01/71500085."Hmph, ......I do not care who it was.@k@v01/71500086. I have been given a chance.@k@v01/71500087. That is enough.@k@v01/71500088. ......Thank you, Willard."'
49894: '@rKinzo slowly stood up and held out his right hand.@k@rHe was offering to shake hands.'
49895: '@rIt must have been Kinzo''s way of expressing his gratitude...'
49896: '@rWill responded.@k@rThen, the two hands gripped each other tightly in silence.'
49897: '@rWhen they did, ......a bright light poured out from the gap between the two hands.'
49898: 'Will@r@v54/75400460."..................nn—"'
49899: '@rWill felt as though something the size of a grain had burned itself into his palm.'
49900: '@r......It was that power that BERNKASTEL had given him.'
49901: '@rThe light grew brighter and brighter.'
49902: '@rHowever, it seemed that Kinzo and the others could not see it.'
49903: 'Kinzo@r@v01/71500089."......Now, I will speak.@k@v01/71500090. I met Beatrice—@k@v01/71500091.Beatrice Castiglioni—just before the end of the war.@k@v01/71500092. She came from across the sea......"'
49904: '@r"................................."'
49905: 'Will@r@v54/75400461."......So, are you Kinzo?"'
49906: 'Lion@r@v53/75300194."It''s how Grandfather looked in the past.@k@v53/75300195. I''ve seen photos.@k@v53/75300196. ......Just what on Earth......"'
49907: 'Will@r@v54/75400462."It''s the theatergoing power that BERNKASTEL gave me.@k@v54/75400463. ......Don''t try to understand."'
49908: 'Lion@r@v53/75300197."I''ll just get a headache?"'
49909: 'Will@r@v54/75400464."You''re getting the hang of this."'
49910: '@rAt one time, Genji told Battler that he looked like Kinzo in his youth.'
49911: '@rSure enough, though the young Kinzo wasn''t exactly the same as Battler, they looked very similar.'
49912: '@r@v58/75600002.".........Allow me to introduce myself again.@k@v58/75600003. ......I am Ushiromiya Kinzo."'
49913: 'Lion@r@v53/75300198."Grandfather........."'
49914: '@rEven the voice seemed to resemble Battler''s somehow.'
49915: '@rClearly, Battler had inherited Kinzo''s blood more thickly than any other...'
49916: 'Kinzo@r@v58/75600004."I did not want to succeed the Ushiromiya family headship.@k@v58/75600005. ......My being chosen as the head was nothing more than a prank of fate."'
49917: 'Will@r@v54/75400465."......In the Great Kanto Earthquake, those in charge passed away, and you were selected from the branch families."'
49918: 'Lion@r@v53/75300199."That''s correct.@k@v53/75300200. After all, Grandfather was wise despite his youth, and he already possessed a dignity fitting for the headship."'
49919: 'Kinzo@r@v58/75600006."Fuhahahahahahahaha......@k@v58/75600007. Ridiculous.@k@v58/75600008. ......Those greedy elders were so intent on looking out for their own personal interests that they couldn''t even decide on a new head.@k@v58/75600009. They were like fools arguing about who the new captain should be on a sinking ship."'
49920: 'Will@r@v54/75400466."So, since you had no connections with anyone in the main family, you were selected right out of the blue."'
49921: 'Kinzo@r@v58/75600010."It''s all because of my toes.@k@v58/75600011. If only I''d had one fewer toe on each foot, my life may have turned out quite differently......"'
49922: '@rIn the Ushiromiya family, polydactyly was seen as a sign of good fortune.@k@rThis was because it was a common factor among many of the greats in the family''s history.'
49923: 'Kinzo@r@v58/75600012."It was all very pathetic.@k@v58/75600013. The elders didn''t care whom they dragged in as long as it wouldn''t favor any of them over the others."'
49924: 'Will@r@v54/75400467."So, they just happened to hear that someone in one of the branch families had six toes,@k@v54/75400468. and decided that would do well enough."'
49925: 'Kinzo@r@v58/75600014."Precisely.@k@v58/75600015. The elders didn''t care what sort of novice became the head,@k@v58/75600016. as long as they could make him their puppet.@k@v58/75600017. In fact, the more ignorant this person was of how to lead, the better it would be for them."'
49926: 'Lion@r@v53/75300201."......Grandfather......"'
49927: 'Kinzo@r@v58/75600018."Lion.@k@v58/75600019. It is quite different in your case.@k@v58/75600020. ......You will be the one who inherits everything I have.@k@v58/75600021. That is the fate you were granted on the day of your birth.@k@v58/75600022. That is why I gave you that silver ring and raised you so strictly.@k@v58/75600023. ......You are quite different from me.@k@v58/75600024. You are already a splendid successor, of whom no one could be ashamed......"'
49928: 'Lion@r@v53/75300202."...Y-......yes, sir......"'
49929: 'Will@r@v54/75400469."A puppet heir, huh...@k@v54/75400470. ...I doubt that could''ve been easy."'
49930: 'Kinzo@r@v58/75600025.".........Heh,@v58/75600026. ......hehahahahahahahahaha..."'
49931: '@rAs he pondered about where to begin, Kinzo laughed bitterly.'
49932: '@rIt would probably bring back nothing but painful memories no matter where he started from...'
49933: 'Kinzo@r@v58/75600027."It......lasted for so long, that span of gray days.@k@v58/75600028. That mind-numbing stretch of time I spent dead passed like moss growing on a rock......"'
49934: '@rI became the rope in the tug of war between the elders, who thought of nothing but their own profit,@k .....and I probably could have snapped at any moment.'
49935: '@rHowever, people are far more resilient than one would think.'
49936: '@rThough I spent so many days like a dead man, ......I was not killed.'
49937: '@rSo, I would have to search for death on my own......'
49938: '@rThe next thing I knew, I had reached the age when I could no longer refer to myself as "young" without drawing laughter from those who were.'
49939: '@rThey were long, dreary, gray days without any substance.'
49940: '@rAnd they lasted for a full twenty years.'
49941: '@rIn twenty years, a person can be born, find a purpose, and even become their own man with their own place in the world.'
49942: '@rIn short, .....if one truly becomes a human only when they have become a working adult...'
49943: '@r...then I spent an amount of time long enough to create a human...@k...doing nothing except playing the part of puppet to those greedy old men.'
49944: '@rIronically, though that time aged my body, it did not age my mind.'
49945: '@rIn my heart, I was still young,@w166. and I looked back fondly on the fulfilling days before I was summoned to Odawara.'
49946: '@rOnly my body continued to age, and at some point, the gulf between the two had widened to the point that it was hard to comprehend.'
49947: '@rSo, I could hardly believe that the worn-out man in the mirror was really me.'
49948: '@rNo, it really wasn''t me.'
49949: '@rI was the "head of the Ushiromiya family" in name only.'
49950: '@rI had no rights,@k no autonomy.@k There was no need for me to do anything other than what was asked of me.'
49951: '@rI was just a doll sitting there on the shelf, gathering dust.'
49952: '@rI remember nothing but lazily flipping through Western books I liked, locking myself in my own world,@k ......doing nothing but playing with roses and drinking terrible drinks.'
49953: '@rAnd it lasted a full twenty years.'
49954: '@rBefore I knew it...'
49955: '@r...I had a stranger for a wife.@k ......It wasn''t any wife I had chosen.'
49956: '@rShe was someone that the elders had chosen and forced on me for their own reasons, the daughter of some noble family or something,@k ......but that hardly mattered to me.'
49957: '@rI did not love my wife, but neither did I dislike her.'
49958: '@r......I just didn''t care.'
49959: '@rI fathered a few children, but that wasn''t out of love for my wife.'
49960: '@rThey were just born before I knew it.@k ......That''s all there was to it.'
49961: '@rNone of it mattered.@k No, that''s not quite right.'
49962: '@r......Everything was decided by someone other than me, and I simply obeyed.'
49963: '@rThat was the job...@w583.......of the "Ushiromiya family head"......'
49964: 'Kinzo@r@v58/75600029."On some level, I felt as though my life was being slowly and quietly snuffed out."'
49965: 'Lion@r@v53/75300203."I can''t believe it.@k@v53/75300204. You have always been praised for being such a bold and wise ruler, and yet you lived like that for so long......"'
49966: 'Kinzo@r@v58/75600030."......Lion.@k@v58/75600031. There is nothing so long and insubstantial as a life you do not live for yourself.@k@v58/75600032. And yet, it passes in a blink.@k@v58/75600033. ......Take this to heart."'
49967: 'Lion@r@v53/75300205."A life...you live for yourself......"'
49968: 'Will@r@v54/75400471."Living means having your own will.@k@v54/75400472. ......You probably were dead during that time."'
49969: 'Kinzo@r@v58/75600034."Precisely.@k@v58/75600035. I wanted to live.@k@v58/75600036. No, I wanted to die.@k@v58/75600037. ......What must a puppet do to die?"'
49970: 'Lion@r@v53/75300206.".....................@k@v53/75300207. ......Cut...the strings."'
49971: 'Kinzo@r@v58/75600038."Correct.@k@v58/75600039. That would be death, it would be life, and it would be...@v58/75600040....release."'
49972: '@rBefore I realized it, the world had grown troubled.'
49973: '@rWorld War II.@k The Pacific War.'
49974: '@rJapan had extended their war fronts too far to the East and West, and the tide of war was changing.'
49975: '@rThanks to the influence of the elders, I was able to avoid conscription.'
49976: '@r......Of course, this was not out of compassion for me.@k It was because I was their precious puppet.'
49977: '@rSo, the war never really felt that close to me.@k@rHowever, when I personally decided to abandon their protection, it was very easy.'
49978: '@rAt that time, the Ushiromiya family had almost completely collapsed,@k and since the elders had apparently pilfered enough of the scraps to last them the rest of their lives,@k they seemed to care little for what I did, now that they no longer had any use for me.'
49979: '@rSo, I realized that I had finally found my time to die.'
49980: '@rOne by one,@w166. I cut the threads I was hanging from,@w166. ......and began to search...@k...for a place to end my life.'
49981: 'Will@r@v54/75400473."So, you searched for death on the battlefield?"'
49982: 'Kinzo@r@v58/75600041."......I thought that if I was going to die anyway, I should try to be of some use to someone.@k@v58/75600042. ......No, that''s a lie.@k@v58/75600043. I probably just lacked the willpower to end my own life.@k@v58/75600044. War was a suitable excuse for death."'
49983: 'Lion@r@v53/75300208."I heard that your knowledge in public works and construction...@k@v53/75300209.led to you being tasked with setting up facilities for the Navy construction team."'
49984: 'Kinzo@r@v58/75600045."Hmph, and what a miscalculation that was.@k@v58/75600046. If I had just said that I had no useful skills, I would have been sent to the front lines where I could die at a moment''s notice..."'
49985: 'Will@r@v54/75400474."So, you ended up not having to go to the front lines?"'
49986: 'Kinzo@r@v58/75600047."Some of the others were overjoyed at their luck.@k@v58/75600048. It was the opposite for me.@k@v58/75600049. My only desire was to get my hands on the intoxicating liquor of battle and drink myself to death.@k@v58/75600050. ......The US planes did nothing but cut across the skies of that forsaken island.@k@v58/75600051. ......They didn''t have even a bullet to spare for me, much less a bomb."'
49987: 'Lion@r@v53/75300210."Is this the time you met Beatrice, Grandfather......?"'
49988: 'Kinzo@r@v58/75600052."Correct.@k@v58/75600053. She came to me from the sea......"'
49989: 'Will@r@v54/75400475."Where did you meet her?@k@v54/75400476. You mentioned an island."'
49990: 'Kinzo@r@v58/75600054."It was here.@k@v58/75600055. She came to this island."'
49991: 'Will@r@v54/75400477."......So, you met here, on Rokkenjima?"'
49992: 'Lion@r@v53/75300211."What''s going on...?@k@v53/75300212. ......I heard that Rokkenjima was uninhabited until you bought it, Grandfather.@k@v53/75300213. I never knew there was a Japanese military base here."'
49993: 'Kinzo@r@v58/75600056."Pft, hahahahahahahaha......@k@v58/75600057. Ah, yes, you could hardly call that a military base.@k@v58/75600058. It was just a cave.@k@v58/75600059. I was one of the guards of that cave."'
49994: '@r1944.'
49995: '@rDue to the honorable defeats at Saipan and Guam, Japan''s Absolute National Defense Zone strategy was in shambles.'
49996: '@rWhere had the gallantry of the start of the war gone?@k@rThe old attackers were now the ones on the defensive.'
49997: '@rAt that time, it was said that the final trump cards for the Japanese military were the so-called "special attack weapons".'
49998: '@rIt was said that these ultimate weapons were packed with 1.55 tons of explosives...@kand capable of sinking any kind of warship with a single blast.'
49999: '@rTo strengthen homeland defense,@k the Navy drafted a plan to build a string of hidden bases from Hachijojima to Yokosuka, all to house submarines loaded with special attack weapons.'
50000: 'Lion@r@v53/75300214."I knew that there was a base constructed on Hachijojima.@k@v53/75300215. To think there was one on Rokkenjima too......"'
50001: 'Kinzo@r@v58/75600060."Just what sort of fool decided it would be a good idea to plant a base on this desolate island, I have no idea.@k@v58/75600061. ......To better preserve its secrecy?@k @v58/75600062.Hmph, ridiculous.@k@v58/75600063. ......I could never understand what the higher-ups were thinking, and I didn''t particularly care."'
50002: '@rThese truly were ultimate weapons, able to take down large warships in a single strike.'
50003: '@rIt was hoped that the presence of submarines capable of loading these weapons in the waters just off of Japan would allow for a powerful sea ambush as a final line of defense.'
50004: '@rSo, to aid in the establishment of a base with absolute secrecy, the uninhabited island Rokkenjima was raised as a possible candidate.'
50005: '@rAn investigation of the island resulted in the discovery of a large cave in the cliffs,@k and this was apparently deemed to be a suitable location for a submarine base.'
50006: 'Will@r@v54/75400478."So, you were tasked with aiding in the establishment of that base?"'
50007: 'Kinzo@r@v58/75600064."Establishment?@k @v58/75600065.Certainly, if you can call digging out a cave "establishment".@k@v58/75600066. Not only that, the base was abandoned before its completion."'
50008: 'Lion@r@v53/75300216."Why?"'
50009: 'Kinzo@r@v58/75600067."Wahahahahaha!@k @v58/75600068.Because at that time, Japan no longer had any submarines large enough to carry one of those weapons.@k@v58/75600069. How truly laughable.@k@v58/75600070. What''s the point in having a submarine base if there aren''t any submarines left?@k@v58/75600071. If there''s one thing that never changes, it''s politicians and their meaningless projects."'
50010: '@rThe base on Hachijojima was actually outfitted with those weapons and became a base for direct attacks,@k but Rokkenjima was never supplied with any.'
50011: '@rNot only that, they cancelled the construction work entirely,@k leaving only a crew of minimal size stationed on the island, waiting for orders from above that never came.'
50012: '@rCould it be the fact that it was a hidden base sealed our fate?'
50013: '@rThe higher-ups had already completely forgotten about this useless and pointless cavern.'
50014: '@rWe were nothing more than guards for a mere cave.'
50015: '@rWe spent our days farming, fishing, and playing with the dirt,@k all the while gazing up at the American formations flying past.'
50016: '@r......Some of our group were relieved at the prospect of the war ending before anyone remembered we were here...@kand before any of us had to face a real battle.'
50017: '@rOf course, it was the opposite for me.'
50018: '@rI hoped beyond hope for the American troops to advance and kill me as soon as possible.'
50019: '@rAnd then, on one of those hollow days...'
50020: '@rLet us go back there now.'
50021: '@r......Back to the turning point in my life and my fate,@k ......when Ushiromiya Kinzo finally became alive......'