54128: '@rMen in work clothes were spreading a tarp over a section of the hall.'
54129: '@rFrom the way they measured the wall and set out tools, it could be seen that they were preparing to do some sort of construction work.'
54130: 'Genji@r@v14/71600070."This is of the utmost importance to the Master.@k@v14/71600071. Be sure that you do not damage it."'
54131: '@rThe president of the construction company nodded his head several times to show that he understood.'
54132: '@rThen, six young workers carried in a large rectangular object wrapped in a white sheet...'
54133: '@r@v99/SAGYA7001."Ookay, careful there!@k @v99/SAGYA7002.Set ''er down gently... Gently, I say."'
54134: '@r@v99/SAGYB7001."Is this spot good?"'
54135: '@r@v99/SAGYA7003."Great, let''s get started."'
54136: '@rApparently, they were putting something large onto the wall of the hall...'
54137: 'Natsuhi@r@v03/70900068.".........Is that where he wants to hang it?"'
54138: 'Krauss@r@v02/70800069."That''s what he wants.@k@v02/70800070. After all, this mansion is little more than one of Father''s toys."'
54139: '@rNatsuhi took a deep breath.'
54140: '@rThough this was a whim of Kinzo''s, a man she greatly respected,@k ......she seemed to resist the idea of hanging it right here in the entrance hall, the face of the mansion.'
54141: '@rWhen the white sheet was pulled off, a Western woman wearing a beautiful dress came into view...'
54142: '@rIt was a massive portrait of a woman......'
54143: 'Kinzo@r@v01/71500124."Is it proceeding well?"'
54144: 'Genji@r@v14/71600072."Yes.@k@v14/71600073. They will be finished by this evening."'
54145: 'Kinzo@r@v01/71500125."I would like to see it hanging there for all to see as soon as possible.@k@v01/71500126. I want you overseeing this, my friend."'
54146: 'Genji@r@v14/71600074."Leave it to me."'
54147: 'Krauss@r@v02/70800071."......Father.@k@v02/70800072. It seems to be a splendid portrait."'
54148: 'Kinzo@r@v01/71500127."Mm.@k@v01/71500128. The artist has done excellent work.@k@v01/71500129. I am satisfied."'
54149: 'Natsuhi@r@v03/70900069."......This is your benefactor, the woman who gave you the gold?"'
54150: 'Kinzo@r@v01/71500130."Indeed.@k@v01/71500131. ......If I had not met BEATRICE, I would not be here, nor would the Ushiromiya family, nor would, of course, this mansion.@k@|@y@v01/71500132. It''s only natural that her portrait be displayed in the best possible location."'
54151: '@rNow that he had said so this bluntly, there would be no contradicting him.'
54152: '@rKrauss and Natsuhi could only shrug.'
54153: 'Genji@r@v14/71600075."......My lord.@k@v14/71600076. The epitaph plate is here.@k@v14/71600077. Would you please check to see that all is in order?"'
54154: 'Kinzo@r@v01/71500133."Mm.@k@v01/71500134. Each and every word must be correct..."'
54155: '@rEpitaph...?@k Krauss and Natsuhi crooked their heads and followed Kinzo.'
54156: '@rThe leader of the workers set down a plate wrapped in a sheet.'
54157: '@rThe others thought that the picture''s name and an explanation might be on it,@k but it seemed to have quite a lot of words for that...'
54158: 'Natsuhi@r@v03/70900070.".........Father,@k@v03/70900071. what is this......?"'
54159: 'Krauss@r@v02/70800073."Behold...@v02/70800074....the sweetfish river, running through my beloved home of old......?"'
54160: 'Kinzo@r@v01/71500135."Heh.@k@v01/71500136. ......Heheheheheheh.@k@v01/71500137. Read and interpret it as you like."'
54161: 'Will@r@v54/75401031."......So, we finally reach the appearance of the epitaph and the portrait."'
54162: 'Lion@r@v53/75300517."I don''t know much about this epitaph.@k@v53/75300518. It doesn''t exist in my world."'
54163: 'Will@r@v54/75401032."Probably not.@k@v54/75401033. In your world, there''s already a clear successor: you.@k@v54/75401034. But not in this world."'
54164: 'Lion@r@v53/75300519."In other words, ......this epitaph was set up to choose Grandfather''s successor after all...?"'
54165: 'Will@r@v54/75401035."Most likely.@k@v54/75401036. Or, he might have wanted to believe in the chance of a miracle."'
54166: '@rA difficult riddle, made so that no one would be able to solve it.'
54167: '@rIf someone actually could solve it, ......they would be a miraculous person.@k@rAnd that miracle......might shepherd the person Kinzo most desired...'
54168: 'Lion@r@v53/75300520."In short, this epitaph really does show a ritual to revive the witch BEATRICE, just as everyone thought...?"'
54169: 'Clair@r@v55/75500794.".........That is a normal interpretation to make.@k@v55/75500795. A mysterious ritual, sacrificing thirteen people to revive the witch.@k@v55/75500796. ......However, that is not the true ritual.@k@v55/75500797. ......The wait for someone to miraculously solve it.@k@v55/75500798. That is the true ritual.@k@v55/75500799. However, fate does have its irony."'
54170: 'Will@r@v54/75401037."Genji already knew.@k@v54/75401038. ......Maybe Kinzo set this up in the first place because he guessed that Genji knew everything."'
54171: 'Clair@r@v55/75500800."......Was that fate a coincidence, or something engineered?@k@v55/75500801. I do not know.@k@v55/75500802. ......However, with this epitaph, the witch BEATRICE would revive in the truest sense."'
54172: 'BEATRICE@r@v27/70700296.".........This is...@v27/70700297..........BEATRICE..."'
54173: '@rMy soul was captured by the woman shown in that massive portrait.@k@rThat might have been literally true.'
54174: '@rOr, rather than captured, perhaps it would be better to say that my soul had returned to a more fitting place, the place it belonged.'
54175: '@rThe beautiful blonde hair was the same as mine, but tied up.'
54176: '@rThe dress she wore was a deep black, making that golden hair stand out all the more.'
54177: '@r.........This is the witch...BEATRICE.@k@rMy......true form......'
54178: 'BEATRICE@r@v27/70700298."Hm?@k @v27/70700299.............What is this?"'
54179: '@rThere was a plate with too many words for it to be the title of the picture.'
54180: '@rBehold the sweetfish river, running through my beloved home of old......@k@rYou who seek the Golden Land, follow its path downstream in search of the key.'
54181: 'BEATRICE@r@v27/70700300."......The Golden Land...@k@v27/70700301. ......I see,@v27/70700302. .........so my world...@v27/70700303....is the Golden Land..."'
54182: '@rI have always called my own, personal world a Paradise.@k@rBut tonight, I shall change that.'
54183: '@rFrom now on, my world shall be the Golden Land.@k@rI am the master of the Golden Land, BEATRICE......'
54184: '@r......And then, there is the brutal ritual of sacrifices starting with the first twilight.@k@rOn the ninth twilight, the witch revives, and none shall be left alive......'
54185: 'BEATRICE@r@v27/70700304."Is it saying that if I carry out this ritual, ......I will experience a true revival......?"'
54186: '@rThen, on the tenth twilight, the journey ends, and I shall reach the Home of the Gold......@k@rThe witch shall praise the wise, and bestow four treasures.@k@rOne shall be all of the Golden Land''s gold.'
54187: '@r......Kinzo received a massive amount of gold from BEATRICE, and rumor has it that it still lies hidden somewhere.'
54188: '@rIs this, as the family members and servants are all whispering, a code showing the location of Kinzo''s hidden gold?'
54189: 'BEATRICE@r@v27/70700305.".........If a Human reaches the solution, they will obtain a great quantity of gold.@k@v27/70700306. .........However, if I am the one to solve it, it will mean my own resurrection..."'
54190: '@r.................................'
54191: '@r......Kinzo, you aging mage.@k@rJust when I was mocking the shortness of the time left to you, you start a game like this.'
54192: '@rHow intriguing.@k ......I shall solve this riddle of yours.@k@rI shall revive as the real BEATRICE.'
54193: '@rAnd then, I shall use my great magical power to control object and man, day and night, and all of Rokkenjima......'
54194: 'Gohda@r@v17/71700033."They all say that epitaph is a guide to finding hidden treasure...!"'
54195: 'Kumasawa@r@v18/71800134."The rumors tell that the Master has ten tons of gold hidden away...!"'
54196: 'Kanon@r@v16/70600016."......Yes, those rumors about BEATRICE being the one who gave it to him.@k@v16/70600017. I''ve heard that too."'
54197: 'Shannon@r@v15/70500517."Ten tons of gold...... That would be incredible.@k@v15/70500518. I can hardly even imagine it."'
54198: 'Gohda@r@v17/71700034."If you had all that, what would you use it for...?!@k @v17/71700035.I''d like to touch it, just once...!"'
54199: 'Kumasawa@r@v18/71800135."Hoh-ho-ho-ho-ho-ho!@k @v18/71800136.Forget touching it, I''d like to spend it all."'
54200: 'Shannon@r@v15/70500519."But why would he go out of his way to present this epitaph, ......this code showing the hiding place of the gold..."'
54201: 'Kanon@r@v16/70600018."That''s obvious.@k@v16/70600019. He''s laughing at everyone, since he thinks no one can solve it."'
54202: 'Gohda@r@v17/71700036."It''s a challenge to the rest of us, isn''t it?@k @v17/71700037.He wants to know if there''s anyone here wise enough to solve it..."'
54203: 'Kumasawa@r@v18/71800137."It seems that the Master doesn''t intend to let Krauss-sama take the headship easily.@k@v18/71800138. ......Perhaps the one who solves this will become his successor?"'
54204: 'Eva@r@v05/71000033."Genji-san, what is this?!@k @v05/71000034.Could this be a portrait of......BEATRICE? The woman that Father..."'
54205: 'Genji@r@v14/71600078."......Correct.@k@v14/71600079. This is BEATRICE-sama."'
54206: 'Hideyoshi@r@v06/71100027."What on Earth?@k@v06/71100028. There''s a strange little poem-like thing over here."'
54207: 'Eva@r@v05/71000035."..............................@k@v05/71000036. ......What is this all about?@k@v05/71000037. ......It''s almost like......a pirate code that shows the way to hidden treasure.@k@v05/71000038. ......Genji-san.@k@v05/71000039. What does this mean?!"'
54208: 'Genji@r@v14/71600080."The Master says to read and interpret it as you wish.@k@v14/71600081. ......And that the riddle applies equally to all who can see the epitaph."'
54209: 'Eva@r@v05/71000040."You said riddle just now, didn''t you?!@k @v05/71000041.That means this can be solved.@k@v05/71000042. .........Yes, it''s just as I thought.@k@v05/71000043. Father doesn''t want Nii-san to succeed him...!"'
54210: 'Hideyoshi@r@v06/71100029."So, whoever solves this becomes the successor...!"'
54211: 'Eva@r@v05/71000044."*cackle*cackle*, *giggle*giggle*...!!!@k @v05/71000045.Finally......@k@v05/71000046. The tables have finally turned...@v05/71000047. ......I now have a real chance......to become the head......!!"'
54212: 'Rudolf@r@v08/71200048."What do you think, Kyrie?"'
54213: 'Kyrie@r@v09/71300046."......I think it''s extremely likely that this epitaph shows the location of the hidden gold."'
54214: 'Rudolf@r@v08/71200049_b."It looks like Aneki thinks the one who solves it will be chosen as the successor."'
54215: 'Kyrie@r@v09/71300047."That may also be possible.@k@v09/71300048. ......Father doesn''t view Krauss nii-san as someone who has what it takes to succeed him.@k@v09/71300049. Given that Father is reaching the end of his years, this might be a wild, last-ditch gamble to find someone worthy."'
54216: 'Rudolf@r@v08/71200050."So, if we actually solve this riddle, we stand to gain ten tons of gold and the position of successor."'
54217: 'Kyrie@r@v09/71300050."On the face of it, perhaps.@k@v09/71300051. ......However, I''m sensing some malice, as though he doesn''t think us capable of solving it.@k@v09/71300052. I doubt it will be easy."'
54218: 'Rudolf@r@v08/71200051."True.@k@v08/71200052. ......Heheh.@k@v08/71200053. Looks like this''ll keep us entertained for some time."'
54219: 'Rosa@r@v12/71400123.".........Ridiculous.@k@v12/71400124. How could anyone solve this?"'
54220: '@rRosa tossed aside a notepad with the epitaph written on it and flopped over onto the sofa.'
54221: '@rSolving this means ten tons of gold.'
54222: '@rWith that much, I''d never need to worry about making money ever again.'
54223: '@r......If I had money, I could pay off the debt, ......and then maybe he''ll come back to me......'
54224: 'Rosa@r@v12/71400125."............I know where Father''s beloved home of old is.@k@|@y@v12/71400126. What''s the "sweetfish river"?@k @v12/71400127.There are tons of rivers there.@k@v12/71400128. And what "village"?@k @v12/71400129.Aah, I don''t have a clue......!"'
54225: 'Maria@r@v13/70400267."......Uu.@k@v13/70400268. What''s wrong, Mama......?"'
54226: '@rMaria looked concerned.'
54227: '@rKids are really good at puzzles, so maybe......'
54228: 'Rosa@r@v12/71400130."Hey, Maria.@k@v12/71400131. Do you think you know the answer to this puzzle?"'
54229: 'Maria@r@v13/70400269.".........................................."'
54230: '@rMaria gazed at the paper with the epitaph on it as though she was trying to bore through it with her eyes.@k@rHer eyes opened wider and wider......'
54231: 'Rosa@r@v12/71400132."What do you think, Maria...?@k @v12/71400133.I guess it might be a bit too hard for you."'
54232: 'Maria@r@v13/70400270."Kihi.@k@v13/70400271. Kihihihihihihihihi!@k @v13/70400272.This is a witch''s ritual, a resurrection ritual for Beato...!"'
54233: 'Maria@r@v13/70400273."Where''d you get this?!@k @v13/70400274.Hey, Mama, where''d you get this?!@k @v13/70400275.I''m gonna ask Beato, I''m gonna ask Beato!!"'
54234: 'Maria@r@v13/70400276."I''m sure this ritual will let Beato regain her full power!@k @v13/70400277.She''ll be able to appear in front of everyone and do miracles of magic, without having to worry about the anti-magic toxin anymore...!!@k @v13/70400278.Kihihahaha, hahahahahahahahahahaha!!"'
54235: 'Kinzo@r@v01/71500138."......And what of the epitaph?"'
54236: 'Genji@r@v14/71600082."It seems the family members are all competing to solve the riddle."'
54237: 'Kinzo@r@v01/71500139."Hmph......@k@v01/71500140. Good.@k@v01/71500141. Let everyone try.@k@v01/71500142. And none will solve it.@k@v01/71500143. Except for the one blessed by a miracle.@k@|@y@v01/71500144. ......If I let my guard down, even I might forget the process.@k@v01/71500145. That is how difficult it is."'
54238: 'Genji@r@v14/71600083."......Because it is difficult, solving it will bring about a miracle..."'
54239: 'Kinzo@r@v01/71500146."Precisely.@k@v01/71500147. ......This is the final miracle I will desire while I still live.@k@v01/71500148. My final magic.@k@v01/71500149.......When a miracle comes and allows one to solve that inscrutable epitaph, .........it will surely mean BEATRICE''s resurrection.@k@v01/71500150. ......Ohhh, BEATRICE...@k@v01/71500151. I just want to see your face one more time...@k@v01/71500152. I don''t need wealth or honor anymore.@k@v01/71500153. If I could only see you one more time......!"'
54240: '@rKinzo understood that he was facing his last years and considered this his final magic.'
54241: '@rAfter losing BEATRICE across two generations, he was betting everything that she had given him in the hope of being reunited with her.'
54242: '@rHis meeting with her that day had been the true beginning of his life.'
54243: '@rAnd even after the two of them had left the stage, Kinzo had remained there alone in the darkness.'
54244: '@rThe aged monarch had obtained everything, accomplished everything,@k but this was the one element that had always slipped through his fingers, no matter how much he struggled.'
54245: '@rIf he could just have that element, ......he would need nothing else in life.'
54246: '@rIn the end,@k ......perhaps his whole life was just a journey to learn that one single element makes up all that it means to be human.'
54247: 'Kinzo@r@v01/71500154."My friend.@k@v01/71500155. .........Will the final bit of magic in my life bring me a miracle......?"'
54248: 'Genji@r".............................."'
54249: '@rFor a while, Genji was silent.'
54250: '@rHe wasn''t at a loss for words or struggling to find an answer.'
54251: '@r......During that silence, something had passed between the two men, who had known each other for so long that their friendship surpassed that of master and servant.'
54252: 'Kinzo@r@v01/71500156."......Yes...so be it.@k@v01/71500157. ......No one is capable of solving it.@k@v01/71500158. That is why it would be a miracle."'
54253: 'Genji@r@v14/71600085."My lord.@k@v14/71600086. ......Please, tell me one thing."'
54254: 'Kinzo@r@v01/71500159."Nn, ......what is it?"'
54255: 'Genji@r@v14/71600087."If, I ask you.@k@v14/71600088. ............If a miracle does occur..."'
54256: 'Kinzo@r@v01/71500160."Nn........."'
54257: '@rIt may have been different when he was young, but in his old age, Genji was not fond of talking about dreams and "what ifs".'
54258: '@rThat very same Genji now spoke of a hypothetical.@k@r......Kinzo quietly waited for the next words of the man he called a friend.'
54259: 'Genji@r@v14/71600089."If a miracle does occur,@k@v14/71600090. if your magic comes true...@k@v14/71600091..........and BEATRICE-sama does revive,@k@v14/71600092. ......what will you do...?"'
54260: '@rAs the one closest to Kinzo,@k Genji obviously knew of the crazed feelings with which Kinzo had sought BEATRICE in the past.'
54261: '@r......And yet, Genji was asking what Kinzo would do if BEATRICE did revive.'
54262: 'Kinzo@r@v01/71500161."................................."'
54263: 'Genji@r@v14/71600093."......My lord, at one time in the past,@k@v14/71600094. you experienced the miracle of BEATRICE-sama being reborn.@k@v14/71600095. If that miracle happened again,@k@v14/71600096. ......what would you do?"'
54264: 'Kinzo@r@v01/71500162."............My friend.@k@v01/71500163. So, after all, ......you do blame me."'
54265: 'Genji@r@v14/71600097."......I cannot claim to know everything about your heart or the heart of BEATRICE-sama.@k@v14/71600098. ......However, I believe that I do know something...@k@v14/71600099....of the way in which BEATRICE-sama adored you."'
54266: 'Kinzo@r@v01/71500164.".................................@k@v01/71500165. ......I am racked with regret.@k@v01/71500166. You may not believe, ......but as I have aged, I have come to regret everything."'
54267: 'Genji@r"........................"'
54268: 'Kinzo@r@v01/71500167."If a miracle does occur...@k@v01/71500168.and BEATRICE revives,@k@v01/71500169. ......then, of course, I do not care if she knows nothing of the time she spent with me in the past.@k@|@y@v01/71500170. ...No, as long as she is BEATRICE, I don''t care who it is!@k @v01/71500171.......I just............want to apologize...!"'
54269: 'Genji@r@v14/71600101.".........Is that truly how you feel?"'
54270: 'Kinzo@r@v01/71500172."Yes, my friend.@k@v01/71500173. ......I regret it.@k@v01/71500174. I deeply regret the mistakes I made in my youth.@k@v01/71500175. ......You have aged as well, so you must know.@k@v01/71500176. ......I could not feel guilt for the sins of my youth when I was still young.@k@v01/71500177. However, like a deep thorn, it began to fester, .........torturing me.@k@v01/71500178. ......I am willing to accept death in whatever form it may take!"'
54271: 'Kinzo@r@v01/71500179."However, ......this thorn.........this regret.........is the one thing I must resolve......@k@v01/71500180. I must return everything to BEATRICE...@k@v01/71500181.and beg forgiveness for my sins...!@k @v01/71500182.That is, ......that is my only and final wish......@k@v01/71500183. ...Ooh,@v01/71500184. ......oooooohhhh.........@k@v01/71500185. Uwaaaaaaaaaahhhhhhhh......!!"'
54272: '@rKinzo covered his eyes and sobbed.'
54273: '@rThis aged lord, who had built up enormous wealth in a single generation, ......was now, at the end of his life,@k ......sobbing simply because he wanted someone to apologize to...'
54274: 'Lion@r@v53/75300521."......Wasn''t the epitaph a trial Grandfather made to choose the successor?"'
54275: 'Will@r@v54/75401039."..............................@k@v54/75401040. I thought that too at first, ......but it looks like the situation''s a bit different."'
54276: 'Clair@r@v55/75500805."At this point in time, I also thought it was a trial.@k@v55/75500806. That it was a game for selecting the successor, which Ushiromiya Kinzo decided upon on a whim."'
54277: 'Lion@r@v53/75300522."And it wasn''t?"'
54278: 'Clair@r@v55/75500807."......This epitaph...............had a special meaning for Ushiromiya Kinzo and Ronoue Genji,@k@v55/75500808. one that only the two of them could understand.@k@|@y@v55/75500809. So, this was not the workings of fate.@k@v55/75500810. It was a foregone conclusion.@k@v55/75500811. ......I was no more than a Cinderella, with the pumpkin carriage and glass slippers all prepared beforehand."'
54279: 'Will@r@v54/75401041.".........I get it.@k@v54/75401042. ......So, ......this was a farce that Kinzo and Genji set up."'
54280: 'Clair@r@v55/75500812."Kinzo knew.@k@v55/75500813. And Genji understood that this was a message to that effect."'
54281: 'Lion@r@v53/75300523."I, I don''t have a clue what you mean...@k@v53/75300524. ......What did Grandfather know?@k @v53/75300525.And what does Genji-san have to do with this epitaph...?"'
54282: 'Will@r@v54/75401043."The epitaph wasn''t "solved".@k@v54/75401044. It was allowed to be solved."'
54283: 'Clair@r@v55/75500814."............And then, BEATRICE truly revived.@k@v55/75500815. ......If BEATRICE''s revival had never happened..."'
54284: 'Will@r@v54/75401045."......Then, when 1986 came, ......the incident might have been completely different."'
54285: 'Clair@r@v55/75500816."Ultimately, ......since the time of my birth, I have never once stood at the crossroads of fate...@k@v55/75500817....and been given the right to make the choice of my own free will."'
54286: 'Clair@r@v55/75500818.Oh, I am one yet many.@k@r@v55/75500819.And yet, never once have we been able to resist fate.'
54287: 'Clair@r@v55/75500820.We are naught but leaves trapped in a whirlpool.@k@r@v55/75500821.No matter how we dance, we are bound to vanish into its depths......'
54288: 'Maria@r@v13/70400279."Gaap''s the one who specializes in instant movement!!@k @v13/70400280.She''s the 33rd in rank of the Great Demons...!@k @v13/70400281.You must really be incredible to have a friend like that, Beato, uu!"'
54289: 'BEATRICE@r@v27/70700307."I see, the Great Demon Gaap.@k@|@y@v27/70700308. .........Very well, my friend, you will now be Gaap.@k@v27/70700309. You may call yourself by that name!"'
54290: 'Gaap@r@v32/73700349."Oh, wonderful.@k@v32/73700350. So, you''ve finally given me a name.@k@v32/73700351. It''s a relief after being nameless so long."'
54291: '@r@v31/73100001."In that case, I would be honored to receive a name as well.@k@v31/73100002. Being nothing more than the head furniture lacks flavor, does it not?"'
54292: 'BEATRICE@r@v27/70700310."Maria.@k@v27/70700311. I need a name for this guy too.@k@|@y@v27/70700312. He is also a Great Demon, and serves as my butler.@k@v27/70700313. He is a subordinate whom I can trust."'
54293: 'Maria@r@v13/70400154."Uu......@k@v13/70400283. Ronove, I guess?@k @|@y@v13/70400284.The 27th ranked of the Great Demons...!@k @v13/70400285.It''s said he''ll give you reliable underlings!"'
54294: '@r@v31/73100003."My, what a coincidence.@k@v31/73100004. ......The family name of my double, Genji, is Ronoue."'
54295: 'BEATRICE@r@v27/70700314."Hoh, that truly is a coincidence!@k @v27/70700315.Yes, there could be no more fitting name for you.@k@v27/70700316. Very well, you shall now be known as Ronove...!"'
54296: 'Ronove@r@v31/73100005."Oh, how pleasant it is to be called by one''s name.@k@v31/73100006. I thank you for this wonderful name, Lady MARIA."'
54297: 'Maria@r@v13/70400286."Just as the form can be a vessel, so can the name be a strong vessel.@k@v13/70400287. For unknown creatures of the other world, simply gaining a name can greatly increase their magical power...!!@k @|@y@v13/70400288.That''s why names are important.@k@v13/70400289. Uu!"'
54298: 'Gaap@r@v32/73700353."True, names are important and wonderful.@k@|@y@v32/73700354. Right, Lia?!@k@v32/73700355. You can call me Gaap now, okay...?!"'
54299: 'VIRGILIA@r@v30/73200030."Gaap.@k@v30/73200031. A splendid name.@k@|@y@v30/73200032. ......And I''ll ask you to stop shortening my precious name...!"'
54300: 'Ronove@r@v31/73100007."Pu ku ku ku...!@k @v31/73100008.So, you''re VIRGILIA, the one who guides travelers to BEATRICE?@k@v31/73100009. That is also a splendid name.@k@v31/73100010. Perfect for Milady''s master."'
54301: 'VIRGILIA@r@v30/73200033."Yes, I do like it a lot.@k@v30/73200034. A name is a life."'
54302: 'BEATRICE@r@v27/70700317."Maria, thanks to you, my friends have found names.@k@v27/70700318. I am deeply grateful...!"'
54303: 'Maria@r@v13/70400290."Uu-uu!@k @v13/70400291.Now it''s your turn, Beato!@k @v13/70400292.Draw pictures of my bunny friends!@k @v13/70400293.Like you did for Sakutaro!"'
54304: 'BEATRICE@r@v27/70700319."Hmmm, very well.@k@v27/70700320. Lend me that grimoire."'
54305: 'Sakutarou@r@v33/74200001."Uryuu!@k @v33/74200002.Beato''s drawings are really great. I can''t wait to see!"'
54306: 'Maria@r@v13/70400294."What''ll it be like? What''ll it be like?@k @v13/70400295.Can''t wait to see the bunnies!@k @v13/70400296.Uu-uu-uu!!"'
54307: 'BEATRICE@r@v27/70700321."They were in a forest band, were they not?@k@v27/70700322. ......A band, a band......@k@|@y@v27/70700323. ......Hmm.@k@v27/70700324. Yes, something like..."'
54308: '@rAll of a sudden, Maria was no longer a little girl who did nothing but follow her mother around, laughing or crying.'
54309: '@rThough she is still young, she already has a powerful self-image,@k ......and possesses enough knowledge of the magical world to surprise even me.'
54310: '@rTogether, we called ourselves Mariage Sorciere and made each other''s magical worlds deeper and richer...'
54311: 'BEATRICE@r@v27/70700325."So, a name can become a great vessel.@k@v27/70700326. ......How very profound."'
54312: 'Maria@r@v13/70400297."It''s very important to have a form for a vessel, but a name is just as important."'
54313: 'BEATRICE@r@v27/70700327."Indeed.@k@v27/70700328. Those with names leave a greater impression than those without."'
54314: 'Maria@r@v13/70400298."It''s not just about forms and names.@k@v13/70400299. By knowing more and more about them, you can make them exist much more strongly.@k@v13/70400300. So, you have to think up lots of stuff for them."'
54315: 'BEATRICE@r@v27/70700329."Did you do this for Sakutarou as well?"'
54316: 'Maria@r@v13/70400301."Yep.@k@v13/70400302. Sakutaro isn''t just a name and a form.@k@v13/70400303. There''s a lot more to him than that."'
54317: 'BEATRICE@r@v27/70700330."He is a lion cub, correct?"'
54318: 'Maria@r@v13/70400304."Sakutaro''s a vegeta-lion, so he doesn''t eat meat.@k@v13/70400305. But everyone else thinks he does, so they''re scared of him.@k@v13/70400306. But Sakutaro''s also a scaredy-cat, so he''s just as scared as the others.@k@v13/70400307. Ahahahaha, Sakutaro''s such a coward."'
54319: 'Sakutarou@r@v33/74200003."Uryuu.@k@v33/74200004. I don''t eat meat.@k@v33/74200005. I''m not a scary lion."'
54320: 'Maria@r@v13/70400308."Oh, look, a flesh-eating sparrow...!!@k @v13/70400309.Flap flap flap!"'
54321: 'Sakutarou@r@v33/74200006."Uryuu!!@k @v33/74200007.Sparrows are scary!@k @|@y@v33/74200008.Whoosh."'
54322: 'BEATRICE@r@v27/70700331."Wahaha, sparrows don''t eat meat."'
54323: 'Maria@r@v13/70400310."Sakutaro''s a coward, so he thinks they do.@k@v13/70400311. Kihihihihi."'
54324: 'Sakutarou@r@v33/74200009."D-did the sparrow go away...?@k @v33/74200010.Uryuu..."'
54325: 'Maria@r@v13/70400312."You''re such a scaredy-cat, Sakutaro.@k@v13/70400313. If you keep this up, Sakusuke and Sakukichi will start making fun of you again."'
54326: 'Sakutarou@r@v33/74200011."Uryu...!@|@y@k @v33/74200012.I''m not a scaredy-cat!"'
54327: 'Maria@r@v13/70400314."Ah, the sparrow''s back!@k @v13/70400315.Flap flap flap!"'
54328: 'Sakutarou@r@v33/74200013."Nooo, I''ll be eaten!!@k @|@y@v33/74200008.Whoosh."'
54329: 'BEATRICE@r@v27/70700332."Hahahaha.@k@v27/70700333. Sakutaro is quite entertaining.@k@v27/70700334. Then, are Sakusuke and Sakukichi his siblings?"'
54330: 'Maria@r@v13/70400316."Yep.@k@v13/70400317. They''re his little brothers, waiting for him at home!@k @v13/70400318.Sakusuke''s a lot more reliable than Sakutaro, and Sakukichi is so skillful, he can do anything.@k@|@y@v13/70400319. But they''re all really good friends...!@k @v13/70400320.They all play together on my bed."'
54331: 'BEATRICE@r@v27/70700335."Your bed must be covered with lions."'
54332: 'Maria@r@v13/70400321."Yep.@k@v13/70400322. So I call my bed Lion Land!@k @v13/70400323.But there''s lots of other animals too!@k @v13/70400324.Uu!"'
54333: 'Ronove@r@v31/73100011."Lion Land, is it?@k@v31/73100012. It sounds like fun."'
54334: 'Gaap@r@v32/73700356."......By interacting together, all of MARIA''s friends can reinforce their own existence.@k@v32/73700357. She has a great world."'
54335: 'VIRGILIA@r@v30/73200035."Then we should work on deepening our relationships as well.@k@v30/73200036. By strengthening our bonds, our existence and magical power will grow stronger and stronger..."'
54336: 'BEATRICE@r@v27/70700336."Let''s expand our world more and more!@k @v27/70700337.From what I''ve heard, Maria''s world has far more than just Sakutarou and the bunnies!@k @v27/70700338.We have to keep up!"'
54337: 'Ronove@r@v31/73100013."My, my.@k@v31/73100014. In that case, shall we find more minions for ourselves?"'
54338: 'BEATRICE@r@v27/70700339."It''s no fun with just the gold butterflies.@k@v27/70700340. After all, they cannot speak...!@k @|@y@v27/70700341.I''d like some chatty minions who can talk, jump around, and fight with each other."'
54339: 'Gaap@r@v32/73700358."True, of course it''ll be better to spice things up around here."'
54340: 'VIRGILIA@r@v30/73200037."Here in Mariage Sorciere, we have learned how to expand our worlds and create new minions.@k@v30/73200038. At this point, the kinds of minions you may create are limited only by your imagination......"'
54341: 'Ronove@r@v31/73100015."Milady, what about those?@k @v31/73100016.Could you make vessels of those dark tools you found when cleaning out GOLDSMITH''s storehouse?"'
54342: 'BEATRICE@r@v27/70700342."Oh, perfect!@k@v27/70700343. Minions manifested from dark-looking vessels like that will surely be fitting for me...!@k @|@y@v27/70700344.There will be more and more of us, and it will get very lively here...!"'
54343: 'Maria@r@v13/70400325."Uu!@k @v13/70400326.We get more and more new friends...!@k @v13/70400327.That''s my magic!@k @v13/70400328.And Beato can take my friends and give them a form.@k@v13/70400329. You can make them grow...!"'
54344: 'BEATRICE@r@v27/70700345."You create, and I grow.@k@|@y@v27/70700346. ......Hmm.@k@v27/70700347. That''s Mariage Sorciere for you!@k @|@y@v27/70700348.......Hmmm, still, bunny ears are pretty hard...!@k @v27/70700349.It might take some time before the bunnies manifest themselves."'
54345: 'VIRGILIA@r@v30/73200039."Make sure you make them cute."'
54346: 'BEATRICE@r@v27/70700350."But of course.@k@v27/70700351. This is where I get to show my skill...!"'
54347: '@rCreate a creature, give it a name, give it a form.'
54348: '@rDoing that is no different from giving birth to new life.'
54349: '@rWhen a Human gives birth to a child, they give it a form, give it a name to identify it by, and deepen its character by raising it in the world.'
54350: '@rMariage Sorciere is doing exactly the same thing.'
54351: '@rIn our world, we can create whatever creatures we think of, give them forms, give them names, and make them friends we can interact with.'
54352: '@rWe were engrossed with our game in this world called Mariage Sorciere.'
54353: '@rAt least, Maria was engrossed.@k@rShe would badger me to play this game every time she came.'
54354: '@rAnd, of course, I was too.'
54355: '@rHowever, when Maria started happily drawing something and I just sat there for a while,@k ......I must admit that there were times when I sighed and looked up at the sky, making sure she did not notice......'
54356: '@r......It''s fun to increase the numbers of our minions.@k@rThey make things lively, so I do not tire of it.'
54357: '@rI may have tired of my minions alone, but when I can interact with Maria''s minions as well, that does not happen.'
54358: '@rIt takes two people to create a universe.@k I now have that second person, so I am satisfied.'
54359: '@r...............................'
54360: '@r......I think...I am satisfied.'
54361: '@rAnd yet, one little part of me......is not.'
54362: '@rIt truly is a tiny part.'
54363: '@rAfter all, it is so much fun playing with Maria that time seems to fly on by.'
54364: '@rBut even so, ......when I look up at the sky,@k ......during those short moments, I feel an empty feeling I cannot describe...'
54365: '@rI know...'
54366: '@rMy universe is not complete.'
54367: '@rMy apologies to Maria,@k ......but she is not the second person I seek to create a universe with.'
54368: '@r......No matter how much I nurture my world with her, ......the roots of love in my heart leave gaps.'
54369: '@r............Four years have already passed since that day.'
54370: '@rHe left saying he would come for me riding a white horse, ......and I was the only one without a letter.'
54371: '@rAnd he even said that he would likely never return to Rokkenjima......'
54372: 'BEATRICE@r@v27/70700352."...................................."'
54373: '@rThis.........is love?@k ......I always believed that love was so much sweeter, so much more intoxicating.'
54374: '@rBut now, I don''t know anymore.'
54375: '@rThough I long for him so much it''s maddening, ......I can sometimes feel hatred underneath.'
54376: '@rHowever, even that hatred is wrapped in adoration.'
54377: '@rThe roots of love have remained in the corners of my heart all this time.'
54378: '@rSome part of me......has given up and accepted that Battler might never return.'
54379: '@rHowever, the roots of love have stayed right where they were.'
54380: '@r......In other words, ......even four years later, I still believe.'
54381: '@rHe will come back someday.'
54382: '@rThe flower of my love has curled up as if to resist the winter cold, and it even appears to have withered.'
54383: '@rHowever, the roots are still alive.'
54384: '@r......And so it endures, waiting for the day he will surely return,@k waiting for a chance to bloom beautifully again.'
54385: '@rI am grateful to Maria.'
54386: '@rMariage Sorciere has eased the burden on my heart so much.'
54387: '@rIf we had not met like this, ......I may have withered away along with those roots.'
54388: '@r......Even this incomplete universe is now necessary for my survival.'
54389: '@rI must live on...until I can create my complete universe.'
54390: '@rUntil that day......I will not be complete.@k Though I have a form and a name, ......no matter how deep my world grows, ......I will not be complete.'
54391: 'BEATRICE@r@v27/70700353.".........I am not......complete."'
54392: 'Maria@r@v13/70400330."..................Beato...?"'
54393: '@rI accidentally muttered what I had been thinking.@k Maria stopped talking to Sakutaro.'
54394: '@rI regretted that my slip of the tongue had ruined this fun time,@k but I had already remained silent for a little too long to smooth it over...'
54395: '@rI laughed, but it probably sounded hollow.'
54396: '@rMaria, not knowing why my face had suddenly changed like this, looked taken aback.'
54397: 'BEATRICE@r@v27/70700354."......Though my minions will each deepen this world and their own existences, becoming full,@k@v27/70700355. ......I alone will never be complete."'
54398: 'Maria@r@v13/70400331."...................................."'
54399: 'BEATRICE@r@v27/70700356."......I know why I will not be complete."'
54400: 'Maria@r@v13/70400332."It''s because you don''t have enough magical power."'
54401: '@rMaria answered instantly.'
54402: '@rBEATRICE has lost her magical power and is unable to regain the power she once had.'
54403: '@rThat is how the story goes.@k So, Maria''s answer is exactly correct.'
54404: '@r............Yes.'
54405: '@rI may be incomplete because I have lost my magical power.'
54406: '@rIn that case, if my power becomes complete, ......and I revive in the truest sense,@k ......will my world become complete as well?'
54407: '@rDoes that mean.........that the person I want to nourish a universe with will come back?'
54408: '@r......If, as I claim,@k I really was once able to control miracles at will with my magic...'
54409: '@r...then if I succeeded in reviving, that miracle would surely occur.'
54410: '@rIf that is what I could be capable of, .........then I want true magical power...to use for my resurrection.'
54411: 'BEATRICE@r@v27/70700357."......That''s right.@k@v27/70700358. It is because I do not possess enough magical power."'
54412: 'Maria@r@v13/70400333."Poor Beato.@k@v13/70400334. ......It must be pretty inconvenient with your magical power still weak."'
54413: 'BEATRICE@r@v27/70700359."I want to get it back......quickly.@k@v27/70700360. ......My old power."'
54414: 'Maria@r@v13/70400335."I guess you''ll have to do that thing."'
54415: 'BEATRICE@r@v27/70700361."......What thing is that...?"'
54416: 'Maria@r@v13/70400336."The ritual of resurrection.@k@v13/70400337. .........The ritual of the portrait''s epitaph."'
54417: 'BEATRICE@r@v27/70700362."............................................."'
54418: '@rIf you read that epitaph literally, it does sound like a witch''s resurrection ritual.'
54419: '@rTo Maria, who believes in witches, that epitaph must be nothing more or less than a ritual.'
54420: '@rUnlike the other family members, it seems that she''s not very interested in how it might indicate the location of the hidden gold.'
54421: 'BEATRICE@r@v27/70700363."......If that epitaph''s riddle is solved, one might learn the location where Kinzo hid all the gold I once gave him."'
54422: 'Maria@r@v13/70400338."That''s the gold you created with magic, right?"'
54423: 'BEATRICE@r@v27/70700364."Indeed.@k@v27/70700365. A crystallization of the great magic I possessed in those days."'
54424: 'Maria@r@v13/70400339."In that case, ......if you get that gold back, your magical power will go back to normal."'
54425: 'BEATRICE@r@v27/70700366.".........Perhaps...you are right."'
54426: 'Maria@r@v13/70400340."It will. Uu!@k @v13/70400341.It''s got to be your resurrection ritual...!@k @v13/70400342.I''ll help, so let''s solve it together.@k@|@y@v13/70400343. And then you''ll revive!@k @v13/70400344.And when you do, you''ll take me to your Golden Land...!"'
54427: 'BEATRICE@r@v27/70700367."That''s right.@k@v27/70700368. I did promise that I would take you to the Golden Land."'
54428: 'Maria@r@v13/70400345."You said that all wishes are granted there...!@k @v13/70400346.There''s no black witch there, just Mama who''s nice...!@k @v13/70400347.And I might even meet Papa who I''ve never seen before...!"'
54429: 'Maria@r@v13/70400348."Of course, there won''t be any school, or homework, or bullying friends, and we can live happily ever after...!@k @v13/70400349.Hey, Sakutaro, doesn''t that sound fun?!@k @v13/70400350.Uryuu!"'
54430: '@r............The portrait''s epitaph.'
54431: '@rThen, must I face the epitaph''s riddle?'
54432: '@rIf Kinzo''s children struggled uselessly over it,@k ......how could a complete stranger like me solve it...?'
54433: '@r......If I did happen to solve it, ......that would surely be a miracle.'
54434: '@rWill one miracle bring about another and return my miraculous power to me......?'
54435: '@rBehold the sweetfish river running through my beloved home of old.@k@rYou who seek the Golden Land, follow its path downstream in search of the key......'
54436: 'BEATRICE@r@v27/70700369."............So, am I to travel down a river in Kinzo''s homeland in search of a key?"'
54437: '@rAs you travel down it, you will see a village.@k@rIn that village, look for the shore the two speak of.'
54438: '@rThere the key to the Golden Land sleeps......'
54439: 'BEATRICE@r@v27/70700370."......There may be villages down that river,@k@v27/70700371. but what is this shore the two speak of?"'
54440: '@rYou who laid hand upon the key must journey as follows to the Golden Land......'
54441: '@r.........So, those who do not have the key need not read the rest.'
54442: '@rI do not understand it, but that''s how this riddle is.'
54443: '@r......It''s practically unsolvable, so solving it would be a miracle.@k That much makes sense......'
54444: 'BEATRICE@r@v27/70700372."............nn."'
54445: '@rI felt a stabbing pain in my body.@k The anti-magic toxin had burned my skin.'
54446: '@rSome Human is probably approaching.@k I erased my form.'
54447: '@rMultiple sets of footsteps approached.'
54448: '@rIt was Genji, Shannon, ......and Kanon too.'
54449: 'Genji@r@v14/71600102.".........It seems everyone is engrossed with solving the epitaph''s riddle."'
54450: 'Kanon@r@v16/70600020."Yes.@k@v16/70600021. I hear that even some of the servants have written it down and taken it home with them."'
54451: 'Shannon@r@v15/70500520."......If you solve this riddle, will you really find ten tons of gold?"'
54452: 'Genji@r@v14/71600103."Yes.@k@v14/71600104. There can be no doubt of that."'
54453: 'Kanon@r@v16/70600022."I don''t understand.@k@v16/70600023. ......Why is the Master displaying the location of his precious gold,@k@v16/70600024. even in the form of a cryptic epitaph, in a place where everyone can see?"'
54454: 'Genji@r@v14/71600105."......That is the Master''s magic, and also a bet.@k@v14/71600106. The Master believes that the soul of BEATRICE-sama will dwell within the one who solves this inscrutable riddle."'
54455: 'Shannon@r@v15/70500521."............That''s a strange bet—I mean, magic..."'
54456: 'Kanon@r@v16/70600025."Hmph, looks like he''s taken his occult fanaticism as far as it could possibly go."'
54457: 'Shannon@r@v15/70500522."Shh.@k@v15/70500523. You shouldn''t say that......"'
54458: 'Genji@r@v14/71600107."......All have the right to challenge the epitaph''s riddle.@k@v14/71600108. Of course, the servants are no exceptions.@k@v14/71600109. ......Are you making an attempt?"'
54459: 'Shannon@r@v15/70500524."N-no......@k@v15/70500525. ......I could never solve such a hard riddle...@k@v15/70500526. And......"'
54460: 'Genji@r@v14/71600110."......And?"'
54461: 'Shannon@r@v15/70500527."Even if I had ten tons of gold, I can''t think of anything in particular I''d want to use it for......@k@v15/70500528. I''d be more than happy if these peaceful days continued forever."'
54462: 'Kanon@r@v16/70600026."Looks like you and George-sama have been pretty close these days.@k@v16/70600027. I just hope being distracted doesn''t make you even more of a klutz."'
54463: 'Shannon@r@v15/70500529."Th-that won''t happen."'
54464: '@rWith a backward glance at this conversation, Genji walked up to the portrait...@w500....and looked up at the witch.'
54465: 'Genji@r"......................................."'
54466: '@rWhen they saw what Genji was doing, Shannon and Kanon immediately went silent.'
54467: '@r......Genji, who was the head of the servants, ......the closest in age to Kinzo, and the one whom Kinzo called a friend,@k probably understood Kinzo''s heart better than anyone else.'
54468: '@rWhat did he think when he looked at this portrait.........?'
54469: '@rNeither Shannon nor Kanon could tell.'
54470: 'Genji@r@v14/71600112."............Behold the sweetfish river, running through my beloved home of old."'
54471: '@rSuddenly, Genji started reciting the epitaph.'
54472: '@rShannon quickly nodded to show that she was listening, but it wasn''t clear whether he was talking to her at all.'
54473: '@rGenji, his back still to them, continued.'
54474: 'Genji@r@v14/71600113."The Master would not describe Odawara as his beloved home of old."'
54475: 'Kanon@r@v16/70600028."......I''ve heard that he lived far away."'
54476: 'Shannon@r@v15/70500530."Th-though I don''t know where it was......"'
54477: 'Genji@r@v14/71600114."Taiwan."'
54478: '@rGenji turned around and spoke that single word.'
54479: 'Shannon@r@v15/70500531."......O-@v15/70500532.......oh,@v15/70500533. is that so...?"'
54480: 'Kanon@r@v16/70600029."I see, so that explains what Krauss-sama always used to say.@k@v16/70600030. Remember him talking about how the Master liked areca nuts?"'
54481: 'Shannon@r@v15/70500534."......Come to think of it,@k@v15/70500535. Krauss-sama said that those were a luxury item, like tobacco, that was popular in Taiwan...@k@v15/70500536. So that''s why the Master......"'
54482: '@rMany Japanese moved to this land in the half-century before the war.'
54483: '@rKinzo''s family was a branch family of the Ushiromiyas.'
54484: '@rApparently, they were only distantly related to the head family, so they were able to emigrate to this new world with dreams of a new future,@k without being constrained by the head family in Odawara...'
54485: '@rShannon and Kanon nodded their understanding, but they didn''t know why Genji had suddenly broached this subject.'
54486: 'Shannon@r@v15/70500537."......So, ......there was a river with sweetfish in it in the Master''s homeland of Taiwan, and the key is there?"'
54487: 'Kanon@r@v16/70600031."Don''t be so stupid.@k@v16/70600032. There must be countless rivers with sweetfish there."'
54488: 'Shannon@r@v15/70500538."W-we don''t know that for sure, right...?@k @v15/70500539.I don''t know where the Master lived in Taiwan, ......but there might have been only one river there.@k@v15/70500540. If so, that must be the place."'
54489: 'Kanon@r@v16/70600033."You''re too optimistic.@k@v16/70600034. There''s no way the riddle could be solved that easily."'
54490: 'Genji@r@v14/71600115."......The Master says his magical ritual will gain more power if more people try to solve the riddle.@k@v14/71600116. You must try as well, Shannon.@k@v14/71600117. Everyone has been given equal opportunity."'
54491: 'Shannon@r@v15/70500541.".........Y-...yes."'
54492: 'Kanon@r@v16/70600035."It''s not like we have any chance.@k@v16/70600036. So stupid......"'
54493: '@rGenji spun around.@k@|@y Shannon and Kanon hurried to follow after him.'
54494: '@rWhen his footsteps receded and silence returned, a gold butterfly flitted out from among the shadows.'
54495: 'BEATRICE@r@v27/70700373.".........Taiwan, is it?@k@v27/70700374. ......Hoh, so he lived quite far away."'
54496: '@rBehold the sweetfish river, running through my beloved home of old.@k@rIn other words, a sweetfish river running through my beloved Taiwan......?'
54497: 'BEATRICE@r@v27/70700375."......There are countless rivers in Taiwan.@k@v27/70700376. Kanon was right.@k@v27/70700377. How ridiculous."'
54498: '@r.................................'
54499: '@rHowever, the word "Taiwan" interests me.'
54500: '@rHow could it not mean something when Genji, a man of few words, had muttered it unprompted?'
54501: '@rClearly, Genji must have said it in connection with the epitaph''s riddle.@k@rAlmost as though it were a hint for solving it......'
54502: 'BEATRICE@r@v27/70700378."............Though I do find it ridiculous,@k@v27/70700379. ......very well, Genji.@k@v27/70700380. Why don''t I play along with your farce for a while?"'
54503: '@rTaiwan......@k I have traveled the world these past thousand years, but I know nothing of the place.'
54504: 'BEATRICE@r@v27/70700381."......To counter my ignorance, I shall need a crystallization of knowledge.@k@v27/70700382. That which is smoothed out and pressed into many sheets, what is called a book."'
54505: '@rWhere might I find a book about Taiwan?'
54506: '@rKinzo''s study is the first place that comes to mind if one is looking for books.@k@rBut that won''t work.@k The charm on that room prevents me from entering.'
54507: '@rIn that case, the book archive......'
54508: '@rKinzo''s vast library grows each year.'
54509: '@rIt can no longer be completely contained within his study, and so a portion of it is stored in a place called the book archive.'
54510: '@r......Of course, there are countless books just in this place.'
54511: '@rThe archive has everything from valuable books to apparently worthless books, all packed together like an antique shop.'
54512: '@r.........There was a golden glint in the keyhole of the archive''s door, and a gold butterfly flitted out.'
54513: 'BEATRICE@r@v27/70700383."The stench of this room is as overpowering as ever.@k@v27/70700384. ...Dust, mold.@k@v27/70700385. Yes, the stench of knowledge."'
54514: '@r......Well now, how can I find a book on Taiwan amongst all this?@k The prospect is almost dizzying.'
54515: '@rHowever, I realized right away.'
54516: '@rIf I wanted to quickly find out about Taiwanese rivers, I didn''t want a book on Taiwan.'
54517: 'BEATRICE@r@v27/70700386.".........An atlas.@k@v27/70700387. .........There must be one of those somewhere around here.@k@|@y@v27/70700388. ......Search, my butterfly minions...!!@k @v27/70700389.Find the book I seek in this dusty, noble graveyard of knowledge!"'
54518: '@rA cloud of countless gold butterflies appeared at my feet.'
54519: '@rThey rose in a swell, blew like the wind, and swirled around the archive.'
54520: '@rEventually, the cloud of butterflies selected a single book.@k Apparently, this was the one.'
54521: 'BEATRICE@r@v27/70700390."Well done.@k@|@y@v27/70700391. .........Hmm, a world atlas, Asia volume.@k@v27/70700392. Perfect."'
54522: '@rIt was a grand, thick, illustrated encyclopedia of maps, several volumes long.'
54523: '@rThere was a thick section devoted to Taiwan.@k It seemed sufficiently useful as a reference.'
54524: 'BEATRICE@r@v27/70700373.".........Taiwan.@k@v27/70700394. ......394 km north to south, 144 km east to west.@k@v27/70700395. An area of roughly 36,000 square kilometers.@k@|@y@v27/70700396. ......Hohoh, that''s pretty large."'
54525: '@rBy area, that''s about the same size as Kyushu in Japan.@k@r......This led Beato to a very natural question.'
54526: 'BEATRICE@r@v27/70700397."Just where on this massive island did Kinzo live?@k@v27/70700398. ......Genji mentioned Taiwan, but that''s all.@k@v27/70700399. What a careless oversight......"'
54527: '@rBeato had imagined, without much thought, that the riddle would be solved in a flash if only she could look at a map of Taiwan.'
54528: '@rHowever, Taiwan is no small place.@k Just which part of this large island did Kinzo call his beloved home of old?'
54529: '@r......Looking through books in this dusty archive, sometimes having to cough, while this simple problem obstructed my progress...@kwas by no means enjoyable.'
54530: 'BEATRICE@r@v27/70700400."So, the largest city is Taipei.@k@v27/70700401. ......It says here that Japanese people used to live in a spot called Taishou.@k@v27/70700402. ......So, is that where Kinzo lived?@k @v27/70700403.No, it''s too early to be sure of that without proof."'
54531: '@rI''ll skip to the next part before I settle on anything more specific than just Taiwan itself.'
54532: '@rA sweetfish river running through the home of old.@k@rWhat''s this......?@k There are 129 rivers in Taiwan?'
54533: 'BEATRICE@r@v27/70700404."Gah......@k@v27/70700405. 129 rivers...!@k @v27/70700406.And who knows how many of those have sweetfish swimming in them...?!@k @v27/70700407.Just thinking about it is dizzying!"'
54534: '@rThis was quickly becoming ridiculous.'
54535: '@rGenji must have been muttering nonsense to himself after all.'
54536: '@rI only thought he was giving a hint about the epitaph...'
54537: 'BEATRICE@r@v27/70700408."So, the reward for the fool blinded by gold is dust.@k@v27/70700409. *cackle*cackle*, nice one, Genji."'
54538: '@rI tossed the book aside, used magic to turn a bookshelf into a sofa, and plopped down on top of it.'
54539: '@rFor a while, I gazed up at the ceiling as I grumbled about getting tricked.'
54540: '@rThen, I cast my eyes down at the floor, thinking that I would feel a lot better if I gathered all this room''s dust, packed it into a ball, and tossed it into Genji''s teacup. '
54541: '@rA book I had thrown away lay open on the ground.'
54542: '@rA gold butterfly alighted on that open page.'
54543: '@r.........Tossing a book at random and reading an oracle from the page it happens to open to is one kind of charm.'
54544: '@rI see, ......so that page might have some sort of hint.'
54545: '@rNot entirely convinced, I picked the book up......'
54546: '@rThe opened page was probably very near the one I had been reading.@k@rIt seemed to be a page explaining Taiwan''s geography.'
54547: '@rOddly enough, it was a page about rivers and lakes......'
54548: 'BEATRICE@r@v27/70700410.".........I already know that there are 129 rivers.@k@v27/70700411. Is there something else you''re trying to tell me?"'
54549: '@rThere were six major rivers listed.@k@rZhuoshui River.@k Gaoping River.@k Tamsui River.@k Dajia River.@k Zengwun River.@k Dadu River.'
54550: 'BEATRICE@r@v27/70700412."Hoh.@k@v27/70700413. Now then, could any of these rivers have had sweetfish in them...or not?"'
54551: '@rThen, I had a shocking realization.'
54552: '@rSweetfish are freshwater fish.@k And you don''t find ocean water in rivers.'
54553: '@r......Unless it''s extremely dirty or blocked by a dam,@k any river might have sweetfish in it.'
54554: 'BEATRICE@r@v27/70700414."How foolish.@k@v27/70700415. All rivers have fresh water in them.@k@v27/70700416. What''s stopping sweetfish from living in any river?@k@v27/70700417. ............Come to think of it, what a foolish name this Tamsui River has.@k@v27/70700418. Freshwater River? What sort of river isn''t a freshwater river?@k@v27/70700419. Why not at least wait for something besides fresh water to flow down it and name it after that instead?"'
54555: '@rTamsui River flows from Taipei to the harbor town of Tamsui.'
54556: '@rI see—it isn''t called that because of the water in it, but because of the town at its mouth.'
54557: '@r............As you travel down it, you will see a village.@k@rIn that village, look for the shore the two speak of.'
54558: 'BEATRICE@r@v27/70700420."...................................."'
54559: '@rI realize that this is stupid.@k And yet, something about this town seems off.'
54560: '@rBehold the sweetfish river, running through my beloved home of old.'
54561: '@rThat line should be talking about one of the 129 rivers.'
54562: '@r......Sweetfish...are freshwater fish.@k And here''s this "Freshwater River", flowing down to a town called "Freshwater".'
54563: '@rI do think I''m stretching it.@k@r......Or...is it some kind of hint...?'
54564: '@r......I''ve come all the way to this archive and even gotten myself covered in dust in my search for books.'
54565: '@rIf I give up now, it will all have been a waste of time.'
54566: '@r............Very well.'
54567: '@rWhy don''t I test my luck,@k ......and see if the random page the book opened to contains a message from above?'
54568: '@rI turned to the next page, trying to search in even greater detail......'
54569: 'Clair@r@v55/75500822."We treated this riddle as a sort of game.@k@v55/75500823. And all of the servants were engrossed in it."'
54570: 'Clair@r@v55/75500824."I was just trying to be one of that group.@k@v55/75500825. ......I had long since run out of books that I could become enthusiastic about, so, out of boredom, I took that book back with me to my own room and looked through it every night."'
54571: 'Lion@r@v53/75300526."......There''s a hint for the epitaph''s riddle in an atlas?"'
54572: 'Will@r@v54/75401046."In the third game, Eva solved the riddle after reading a book in the book archive.@k@v54/75401047. Then, in the fifth game, Furudo Erika looked for an atlas in the book archive before solving the riddle herself."'
54573: 'Lion@r@v53/75300527."Then there really is some secret in a map of Taiwan......"'
54574: 'Clair@r@v55/75500826."......I believed that the sweetfish river part was code for Tamsui River.@k@v55/75500827. Every day, I researched the surrounding geography in detail.@k@v55/75500828. ......Of course, I also looked up several small streams that might have sweetfish in them.@k@v55/75500829. However, ......that didn''t get me anywhere."'
54575: 'Will@r@v54/75401048."According to some information from a previous game, ......we aren''t looking for an actual river.@k@v54/75401049. But it was something that flowed.@k@v54/75401050. That''s how Eva interpreted it."'
54576: 'Lion@r@v53/75300528."Not a river...?"'
54577: 'Clair@r@v55/75500830."Yes.@k@v55/75500831. In the end, Tamsui River had nothing to do with it.@k@v55/75500832. ......However, thinking about it now, it must have been a message from above after all.@k@v55/75500833. Tamsui River itself was unrelated, ......but it was still an incredible hint."'
54578: 'Lion@r@v53/75300529."The river was unrelated, ......but it was still a hint?"'
54579: 'Will@r@v54/75401051."Slow down and think.@k@v54/75401052. Think of something that flows but isn''t a river."'
54580: 'Lion@r@v53/75300530.".........So, something other than water that flows...?"'
54581: 'Will@r@v54/75401053."What comes to mind?@k@v54/75401054. ......Try to think out of the box."'
54582: 'Lion@r@v53/75300531.".............................."'
54583: 'BERNKASTEL@r@v28/72100194."......Will,@k@v28/72100195. I''m tired of all this puzzle-solving.@k@v28/72100196. ......Stop being annoying and come out with it.@k@v28/72100197. ......You''ve solved it, haven''t you? The epitaph."'
54584: 'Will@r@v54/75401055.".....................@k@v54/75401056. ......Probably."'
54585: 'Lion@r@v53/75300532."......What things flow other than water......@k@v53/75300533. ......What things...@k@v53/75300534. ......Things......?@k @|@y@v53/75300535.......Things...being transported......?@k @v53/75300536.Like on a road or a highway?"'
54586: 'Clair@r@v55/75500834."Correct.@k@v55/75500835. It took me so long to realize that the sweetfish river did not refer to water itself......"'
54587: 'Will@r@v54/75401057."That''s right.@k@v54/75401058. There''s something other than a river with the name Tamsui.@k@v54/75401059. Something that carries both people and things, and which flows both up and down."'
54588: 'Lion@r@v53/75300537."......Both up and down......?@k @|@y@v53/75300538.You mean......"'
54589: 'Will@r@v54/75401060."Yes.@k@|@y@v54/75401061. A railway."'
54590: '@rThe Tamsui Line.@k It''s a railway that goes from Taipei to Tamsui Harbor.'
54591: '@rIt was opened in 1901.@k@rAfterwards, the number of stations continued to grow, and it became a major artery into Taipei.'
54592: '@rThis railroad was used after the war as well and is still in common use as the Taipei Metro Tamsui Line.'
54593: '@rIts route begins at Taipei Station and continues on until the town of Tamsui......'
54594: '@r@bTaipei.@<台北@> Station.@k@r@bChang‐an.@<長安@> Station (old name: @bTaishougai.@<大正街@> Station).@k@r@bShuanglian.@<双連@> Station.@k@rTatung Company Station.@k@r@bYuanshan.@<円山@> Station.@k@r@bJiantan.@<剣潭@> Station (old name: @bMiyanoshita.@<宮ノ下@> Station).@k@r@bShilin.@<士林@> Station.@k@r@bShipai.@<石碑@> Station (old name—'
54595: 'Will@r@v54/75401062.".........What did the epitaph say you''d see if you went down the river?"'
54596: 'Lion@r@v53/75300539."A, a village."'
54597: 'Will@r@v54/75401063."There''s only one station on the Tamsui Line with @bsato.@<里@>, the character for village, in its name, and that''s the old name of this @bShipai.@<石碑@> Station."'
54598: 'Lion@r@v53/75300540."H-how do you read this......?"'
54599: 'Will@r@v54/75401064."The Japanese reading is "Kirigan".@k@v54/75401065. Its name was changed to Shipai Station after the war, but when Kinzo lived there, it was Kirigan Station."'
54600: 'Lion@r@v53/75300541."As you travel down it, you will see a village....@k@v53/75300542. In that village, look for the shore the two speak of......"'
54601: 'BERNKASTEL@r@v28/72100198."......*giggle*.@k@v28/72100199. It''s not just @bvillage.@<里@>. You can also see a @bshore.@<岸@> in the name of that station......"'
54602: 'Clair@r@v55/75500836."I spent no short amount of time trying to decide whether the epitaph truly was referring to this station.@k@v55/75500837. ......It has the character for village and the character for shore.@k@v55/75500838. It felt like a kids'' puzzle, playing with letters..."'
54603: 'Lion@r@v53/75300543."The first character in Kirigan has a @bkuchi.@<口@>, the character for mouth.@k@v53/75300544. The other half of that first character, @bsono.@<其@>, means "that", right...?!@k @v53/75300545.And the mouth could be what "the two speak of" is referring to...!@k @v53/75300546.......Ah, ...but I don''t get what "the two" means..."'
54604: '@rThe three characters of Kirigan can be split into a mouth (@bkuchi.@<口@>), a "that" (@bsono.@<其@>), a village (@bsato.@<里@>), and a shore (@bkishi.@<岸@>).'
54605: '@rThose all feature in the epitaph.'
54606: '@rIn "that" (其) "village" (里), look for the "shore" (岸) the two "speak" (口) of.'
54607: '@rYou can read it as a code for the name of the station.@k@rHowever, I don''t understand the part about "the two"......'
54608: 'Clair@r@v55/75500839."......I was also stuck on that part.@k@v55/75500840. However, by then, I had a strong belief that this station was what the epitaph referred to."'
54609: 'Lion@r@v53/75300547."If the station had an old name, ......then could the place it refers to also have an old name?"'
54610: 'Will@r@v54/75401066."That''s right.@k@v54/75401067. From the start, Kirigan Station was named after a place.@k@v54/75401068. And the name of that place, which was also Kirigan, is written differently—like this."'
54611: 'Lion@r@v53/75300548."Ah, ......there are...two mouths...!"'
54612: 'Clair@r@v55/75500841."It was clear as soon as I looked it up.@k@v55/75500842. ......The epitaph had to be referring to this place called Kirigan."'
54613: 'Lion@r@v53/75300549."Then is this where the key to the Golden Land sleeps...?"'
54614: 'Clair@r@v55/75500843."That would be the obvious answer.@k@v55/75500844. However, I couldn''t have made the long trip to Taiwan to check.@k@v55/75500845. And, of course, the place known as Kirigan is quite large itself.@k@v55/75500846. If a tiny key was hidden somewhere there, I''d never find it.@k@v55/75500847. I was at a loss......"'
54615: 'Will@r@v54/75401069."But you didn''t give up."'
54616: 'Clair@r@v55/75500848."I was certain that I had found the answer, at least to the first five lines of the epitaph.@k@v55/75500849. .........To me, this was a game—no, a mystery—more intriguing than any other."'
54617: '@rI almost gave up at that point.'
54618: '@rHowever, I was certain I had the key in my hand.@k@rSo, I decided to follow the epitaph''s instructions and journey to the Golden Land.'
54619: 'Lion@r@v53/75300550."......On the first twilight, sacrifice the six chosen by the key..."'
54620: 'Will@r@v54/75401070."We can tell by this line that the key refers to six things.@k@v54/75401071. ......From that fact alone, we can deduce that this doesn''t refer to a physical key."'
54621: 'Lion@r@v53/75300551."Six things......?"'
54622: 'Clair@r@v55/75500850."Yes.@k@v55/75500851. Six things.@k@v55/75500852. ......I wasn''t a very flexible thinker, so...@k@v55/75500853.......I decided to look through books for anything related to the number six.@k@v55/75500854. Six.@k@v55/75500855. Six, six, six."'
54623: 'Clair@r@v55/75500856."The location of the key called Kirigan was hidden by a word game.@k@v55/75500857. So I was convinced that the six things would be related to some sort of word game as well.@k@v55/75500858. Six.@k@v55/75500859. Six, six, six.@k@v55/75500860. ......I kept searching for six."'
54624: 'Lion@r@v53/75300552."............Is there some way to split the characters of Kirigan into six parts......?"'
54625: 'Will@r@v54/75401072."A good idea.@k@v54/75401073. But no matter how much you stare at those three characters, you won''t get an answer.@k@|@y@v54/75401074. The problem here is that "Kirigan" is just the Japanese reading of the name."'
54626: 'Lion@r@v53/75300553."Then how did they pronounce it there?"'
54627: 'Clair@r@v55/75500861."......It''s pronounced "Qilian".@k@v55/75500862. The English spelling is six letters long."'
54628: 'Lion@r@v53/75300554."Six letters...!@k @v53/75300555.Then it is a word game after all...!"'
54629: 'Will@r@v54/75401075."Yes. On the first twilight, sacrifice the six letters chosen by the key."'
54630: 'Lion@r@v53/75300556."......I, .........I get it............"'
54631: '@rWhen explained like this, it sounds like the logic can be taken from beginning to end in no time at all.'
54632: '@r......However, it took a long, long time for me to reach this spot on my own.'
54633: '@rA dizzying number of nights passed from the time Genji uttered that single word to the time I got this far.'
54634: 'Lion@r@v53/75300557."So, what does it mean to sacrifice these six letters?"'
54635: 'Will@r@v54/75401076."On the second twilight, we start hearing about "those who remain".@k@v54/75401077. ......We can deduce that the epitaph is telling us to remove the six letters of the key from some longer word or phrase, and then do something with the letters that remain."'
54636: 'Clair@r@v55/75500863."However, what could the six letters be removed from?@k@v55/75500864. I spent a long time on that as well.@k@v55/75500865. It was like the start of an entirely new riddle.@k@v55/75500866. And this time, I had to solve it all by myself, without any assistance."'
54637: 'Lion@r@v53/75300558."......I think there was a previous game where someone—I think it was Aunt Rosa—@k@v53/75300559.formed some sort of theory about the first twilight."'
54638: 'Will@r@v54/75401078."That theory focused on the tenth twilight''s "Home of the Gold".@k@v54/75401079. The epitaph uses the phrase "Golden Land" four separate times, but the phrase "Home of the Gold" is only used that once."'
54639: 'Clair@r@v55/75500867."Why is it written that way only on the tenth twilight?@k@v55/75500868. It took me a long time to notice the significance of this, and just as long to discover the reason."'
54640: 'Will@r@v54/75401080."Rosa''s theory went like this.@k@v54/75401081. She read the "Home" (郷) kanji as "kyou" and interpreted it as @bkyou.@<京@>, which she took as short for "Kyoto" (@bkyouto.@<京都@>).@k@v54/75401082. Then, she reasoned that if you take a ten-day trip from the beloved hometown to Kyoto, there might be some secret at the end of the first tenth of that journey.@k@v54/75401083. .........It was a good theory, but she just missed the mark.@k@v54/75401084. 京 has another meaning besides Kyoto."'
54641: 'Lion@r@v53/75300560."......京 can mean something other than Kyoto......?@k @v53/75300561.Hmmm......"'
54642: 'Will@r@v54/75401085."Don''t think too hard on it.@k@v54/75401086. You either know it or you don''t."'
54643: 'Clair@r@v55/75500869."......There''s another meaning of 京.@k@v55/75500870. One where it''s not read "kyou", but "kei".@k@v55/75500871. It''s the name of a number.@k@v55/75500872. 10,000 is @bman.@<万@>, 10,000 @bman.@<万@> is @boku.@<億@>, 10,000 @boku.@<億@> is @bcho.@<兆@>, and 10,000 @bcho.@<兆@> is @bkei.@<京@>."'
54644: 'Lion@r@v53/75300562."So it''s a number......!"'
54645: 'Clair@r@v55/75500873."......Here, I had a home-field advantage, since I lived on Rokkenjima.@k@v55/75500874. There was a hint there that made it easier to think of the number "kei".@k@v55/75500875. In fact, you might say that I actually found the answer before I knew what the question was."'
54646: 'Will@r@v54/75401087."If you keep making it so complicated, Lion''s gonna get a headache.@k@v54/75401088. Let''s get back to the point.@k@|@y@v54/75401089. ......If you reach one kei on the tenth twilight, how far have you gotten by the first twilight?"'
54647: 'Lion@r@v53/75300563."O-one tenth of one kei, and one kei is ten thousand chou...@v53/75300564. ......So.........a thousand chou?"'
54648: 'Will@r@v54/75401090."Exactly.@k@v54/75401091. We remove the key''s chosen six letters from a thousand chou."'
54649: 'Clair@r@v55/75500876."Since Qilian was written in English, I immediately guessed that "a thousand chou" would also have to be written in English."'
54650: 'Will@r@v54/75401092."A thousand chou in English is "quadrillion".@k@v54/75401093. ......As Battler guessed in the fifth game, it has 11 letters.@k@v54/75401094. Or should I say as you guessed?"'
54651: 'BERNKASTEL@r@v28/72100200."............*giggle*."'
54652: 'Clair@r@v55/75500877."Curiously enough, the first letter is "Q".@k@v55/75500878. The first letter of the six-letter key is also "Q".@k@v55/75500879. I felt that this just had to be right."'
54653: '@rLion took a notepad from a pocket and spelled out Quadrillion and Qilian.'
54654: '@rThe two words even looked similar at a glance.'
54655: 'Lion@r@v53/75300565."..................@k@v53/75300566. ......You''re right.@k@v53/75300567. ......The six letters chosen by the key are right there inside quadrillion...!@k @v53/75300568.So, what happens if we take them out......?!"'
54656: '@rWe''re left with five meaningless letters.@k@rHowever, the important thing is the number five.'
54657: '@rAfter all, in the next part of the epitaph, the word "kill" appears five times,@k and then, on the ninth twilight, "none shall be left alive".'
54658: '@rIn other words, there should be five letters left.'
54659: 'Lion@r@v53/75300569_o."On top of that, just as Battler-san guessed in the fifth game,@k@v53/75300570. two of these letters are close to each other.@k@v53/75300571. The "d" and the "r"!@k @v53/75300572.Those must be the two who are close!"'
54660: 'Clair@r@v55/75500880."......Once you reach this spot, the riddle has been practically solved."'
54661: 'Will@r@v54/75401095."Or, put another way, this is as far as you can go with the epitaph alone.@k@v54/75401096. You might be able to figure out the answer with a little more word play, but you won''t be able to activate the mechanism."'
