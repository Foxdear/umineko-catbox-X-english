52070: '@r@v40/72500012."Yasu.@k@v40/72500013. What''d you do with the small broom?"'
52071: 'Shannon@r@v15/70500116."......Didn''t you use it to clean the window frames?"'
52072: '@rAh, ............'
52073: '@rThe small broom is a small, thin broom that looks like a large paintbrush.'
52074: '@rWe use it to clear out the dust in small corners, like window frames.'
52075: '@rIt''s one of the cleaning tools I was put in charge of...'
52076: '@r@v40/72500014."Come on, that was your responsibility, right?!@k @v40/72500015.What''re you doing, stupid?!"'
52077: 'Shannon@r@v15/70500117."Quickly, go and find it...@k@v15/70500118. You have to do it before Madam finds out..."'
52078: '@r@v41/72600001."What''s up?"'
52079: '@r@v40/72500016."Yasu lost the small broom again.@k@v40/72500017. Is this kid some sort of genius at losing things?!"'
52080: '@r@v41/72600002."That''s why I''m always telling you, never give things to Yasu.@k@v41/72600003. Yasu''s always careless and losing things."'
52081: 'Shannon@r@v15/70500119."Don''t say that, can''t you see this kid''s working hard...?@k@|@y@v15/70500120. Come on, quickly.@k@v15/70500121. I''ll wait for you."'
52082: '@rO-okay......'
52083: '@rNot wanting to hear the servants complain even more, I spun around and headed off.'
52084: '@rIf you lose a tool, you get in trouble.@k If no one knows who did it, we all get yelled at,@k so one of them will probably tell Madam that it was my fault.'
52085: '@rStill, it''s my fault that I lost it in the first place.'
52086: '@rI wonder when I lost it.@k@rWhen, when......'
52087: '@rWe did a big clean of the entire chapel today.'
52088: '@rThe chapel is a large building behind the mansion.@k However, no one ever goes near it, normally.'
52089: '@rEven so, we''re ordered to clean the chapel a few times each year.'
52090: '@rKinzo calls it a sacred building, so Natsuhi is very strict about it......'
52091: '@rWe cleaned every little nook and cranny, from top to bottom.'
52092: '@rIt took all day.'
52093: '@rI''d been put in charge of cleaning the window frames, but I was also given many smaller tasks.'
52094: '@rWhile those small jobs kept me busy, I must have completely forgotten about the small broom...@k...and left it lying around somewhere.'
52095: '@r......I hate myself for doing this.@k@rThis isn''t the first time this has happened.'
52096: '@rIt happens all the time.'
52097: '@rEvery time I set something down, it always disappears.@k@rIt goes somewhere else. Vanishes.'
52098: '@rI''ve come to think that these might be pranks by the witch BEATRICE.'
52099: '@rThe ghost of the witch BEATRICE borrowed the power of Rokkenjima''s evil spirits to become reborn.'
52100: '@rUntil Kumasawa-san told me, I never knew the meaning of the shrine on the rocks by the sea.........'
52101: 'Clair@r@v55/75500091."Kumasawa told an old, old tale, passed down among the local fishermen.@k@v55/75500092. Rokkenjima used to be known as Akujikijima,@k@v55/75500093. and terrible evil spirits who ate human souls lived there......"'
52102: 'Zepar@r@v51/75100042."Hey, Kumasawa!@k @v51/75100043.Let us hear too!"'
52103: 'Furfur@r@v52/75200044."Tell us the scary, scary tale of Rokkenjima''s evil spirits!"'
52104: 'Kumasawa@r@v18/71800055."Hoh-hoh-ho, very well, very well.@k@v18/71800056. Rokkenjima used to be called Azukijima.@k@v18/71800057. However, even deeper in the distant past, it was known as Akujikijima.@k@v18/71800058. It was rumored that sailors who got too near the island were dragged down to the bottom of the sea and had their souls eaten."'
52105: 'Kumasawa@r@v18/71800059."......Those frightening spirits do exist on this island, you know?@k @v18/71800060.Hoh-hoh-hoh-ho."'
52106: 'Clair@r@v55/75500094."It was Kumasawa''s favorite ghost story.@k@v55/75500095. Every new servant who came to the island heard about it.@k@v55/75500096. .........Normally, such a story would be laughed away; however, on Rokkenjima, an island home to nothing but the Rokkenjima mansion,@k@v55/75500097. which rumbled with eerie thunder on stormy nights, people listened to the story with unusual respect."'
52107: 'Furfur@r@v52/75200045."So the shrine by the coast is there to seal evil spirits away!"'
52108: 'Zepar@r@v51/75100044."And the Master has that weird occult hobby, too!"'
52109: 'Furfur@r@v52/75200046."And the mansion is so creepy, something must be lurking around somewhere!"'
52110: 'Kumasawa@r@v18/71800061."Hoh-hohoho.@k@v18/71800062. True, true.@k@|@y@v18/71800063. Sealing up the spirits was all that the traveling ascetic could manage.@k@v18/71800064. The seal just manages to hold them, but to this very day, they wander through the mansion, night after night, searching for a victim.@k @v18/71800065.Hoh-hoh-hoh-ho......"'
52111: 'Zepar@r@v51/75100045."Have you seen the Master''s study?!"'
52112: 'Furfur@r@v52/75200047."I have!@k @v52/75200048.It''s like some kind of demon laboratory!"'
52113: 'Zepar@r@v51/75100046."There''s that rumor about the Master researching demons!"'
52114: 'Furfur@r@v52/75200049."They also say he''s researching how to revive his mistress, Beatrice!"'
52115: 'Zepar@r@v51/75100047."Didn''t they say he was gathering children to be sacrifices for his magic experiments?!"'
52116: 'Furfur@r@v52/75200050."Waah, scary!@k @v52/75200051.What will I do if the Master asks me to come into the study alone?!"'
52117: 'Zepar@r@v51/75100048."I heard that, long ago, one kid went into the study and never came out!"'
52118: 'Furfur@r@v52/75200052."She must have been a victim of an experiment to give Beatrice''s ghost a new body!"'
52119: 'Kumasawa@r@v18/71800066."Hoh-hoh-ho.@k@v18/71800067. Yes, BEATRICE-sama has become a ghost, and wanders around searching for a body.@k@|@y@v18/71800068. The VIP room on the second floor is where BEATRICE-sama dwells...@k@v18/71800069. You must always be respectful when cleaning that room...@k @v18/71800070.Otherwise...@k@|@y@v18/71800071..........uhihihihihhihhi~!"@|@y'
52120: 'Clair@r@v55/75500098."In the eyes of those teenage boys and girls with their fertile imaginations, the ghost story was both terrifying and fascinating.@k@v55/75500099. By experiencing and sharing in a story together, a kind of solidarity forms.@k@v55/75500100. Then, sharing in that experience becomes obligatory,@k@v55/75500101. and accepting the story becomes a rite of passage for joining the group.@k@v55/75500102. That process was an old one that had repeated many times as the story was passed down."'
52121: 'Shannon@r@v15/70500122."That''s right.@k@v15/70500123. Back when I first started work at Rokkenjima,@k@v15/70500124. I heard that story from Kumasawa-san and the older servants."'
52122: 'Kanon@r@v16/70600010."I heard about it too, mostly from Nee-san."'
52123: 'Gohda@r@v17/71700023."I heard it too.@k@v17/71700024. From Kumasawa-san, mainly."'
52124: 'Furfur@r@v52/75200053."So, not only the timid-looking Shannon,@k@v52/75200054. but a boy, Kanon, and a big adult, Gohda, believed in the ghost story?"'
52125: 'Kanon@r@v16/70600011."Well, I didn''t really believe..."'
52126: 'Gohda@r@v17/71700025."There are tales of ghost stories and jinxes in all jobs.@k@v17/71700026. There were several stories of the sort at the hotel I once worked at."'
52127: 'Zepar@r@v51/75100049."So, you thought it was stupid, and you didn''t pay it any mind?"'
52128: 'Kanon@r@v16/70600012."......I think there was a need to blend with the community."'
52129: 'Gohda@r@v17/71700027."That''s it.@k@v17/71700028. Ghost stories and jinxes are all the local rules of your workplace.@k@v17/71700029. If a newcomer turns his nose up at them, he can''t expect to blend in."'
52130: 'Kanon@r@v16/70600013."Exactly.@k@v16/70600014. ......If I said witches couldn''t exist, that it was ridiculous, then I''d get into a fight with Nee-san.@k@v16/70600015. It was easier if I just appeared to go along with it."'
52131: 'Shannon@r@v15/70500125."Come on. If you look at it that way, you''ll be cursed...@k @v15/70500126.There was one servant who got seriously injured..."'
52132: 'Gohda@r@v17/71700030."Hahaha, all workplaces have stories like that.@k@v17/71700031_b. No matter how incredible the ghost stories or the tales about the company founder are, you accept and believe them.@k@v17/71700032. That''s what it means to blend in with your new workplace."'
52133: '@r@v00/awase7010.""Wow!@k @v00/awase7011.Everyone''s so mature!""'
52134: '@rI went to each window around the chapel in the order I had cleaned them, searching carefully in all the places I might have left it.'
52135: '@rI had been cleaning the windows with it, so I''d probably set it down near one of those.'
52136: '@r......When did I leave it behind, I wonder?'
52137: '@rNow that I think about it, I don''t think I had it anymore when I reached the last window,@k so I must have completely forgotten to clean that window frame.'
52138: '@r"..................Ah."'
52139: '@rThrough the window, I could see the others leaving in groups.@k@rShannon turned around and glanced up in my direction, looking worried.'
52140: '@r......I don''t want to be responsible for making everyone wait, so it''s actually a relief that they''re leaving without me...'
52141: '@rStill, ......naive though it may have been, I wanted them to wait......'
52142: '@rThe sun''s beginning to set, and the chapel''s getting darker and darker.@k@rI don''t want to hang around in a place like this all by myself.'
52143: '@rI''d better find the small broom fast.'
52144: '@rNo, that''s not all.@k I also need to clean the window frames I forgot.'
52145: '@rMadam is strict.@k She''ll probably check all of the windows carefully.'
52146: '@rIf she does, I''ll be the one that gets in trouble tomorrow.'
52147: '@rBut really, where did I lose it?@k Why did I lose it?'
52148: '@rThe darkness grew and grew.'
52149: '@r......When it became dark enough that I would need a light before long, I began to panic.'
52150: '@rI dashed around and around the chapel, tears streaming down my face...'
52151: '@rAs I stumbled about pathetically,@k I could feel the presence of a prankster witch, giggling at me from under the door and up by the ceiling.'
52152: '@rThe ghost of BEATRICE, the Master''s mistress, wanders about in search of a body to this very day.'
52153: '@rAs she gains the power of Rokkenjima''s evil spirits, her strength steadily grows, and she waits for the day of her resurrection.'
52154: '@rAnd, ......for some reason, she''s singled me out,@k and if I ever take my eyes off something for a second, she snatches it away and hides it.'
52155: '@rThis isn''t the first time this has happened.'
52156: '@rWhenever I look away, .........keys, handkerchiefs, pencils, erasers...@kall of them vanish almost right away.'
52157: '@rI put things down planning to use them later, or because that''s obviously the right place to leave them,@k and still they disappear as soon as I turn around.'
52158: '@rIt isn''t someone hiding them as a prank.@k@rIt''s happened many times when I''m the only person around.'
52159: '@r......Everyone always says I''m too careless and forgetful, and they laugh at me, get mad at me.'
52160: '@rI do try to be alert,@k but like some kind of bad joke, I lose things easily when I forget about them for just a short while.'
52161: '@rSo, sometimes, I think "I bet this eraser is going to disappear just like everything else", and I stare at it.@k That''s the only time when it doesn''t disappear.@k Nothing disappears when I''m alert.'
52162: '@rSo then I think I''m safe, but the moment I start to think that and relax just a little bit, a different thing will disappear instead...!@k Why is it always me......?!'
52163: '@r@v32/73700001.*giggle*giggle*,@v32/73700002. ......ehehehehahahaha......'
52164: '@r......Yeah, I hear it.'
52165: '@rI can hear that witch laughing at me as I lamely run around in circles...'
52166: '@r@v32/73700001.*giggle*giggle*,@v32/73700002. ......ehehehehahahaha......@k@r@v32/73700005.Ahahahahahahahahahaha......'
52167: '@rListening to that voiceless laugh, I finally slammed my hands against the wall, crying tears of frustration.'
52168: '@r"Please, just stop it...!!@k Why do you always hide my things and get me in trouble?!"'
52169: '@rThe witch answers.'
52170: '@r@v32/73700006.Fool.@k@v32/73700007. ......Isn''t it obvious?'
52171: '@r@v32/73700008.Why else, except to entertain myself by watching you wander about pointlessly?@k@|@y@v32/73700009. *cackle*cackle*, hyahhahahahahahahahhahhahha...!!'
52172: '@rI felt so frustrated.@k I knew all along that that was the reason, but the witch being so blatant about it was incredibly annoying.'
52173: '@rI can tell.@k That small broom is somewhere in this chapel.'
52174: '@rNo, that''s not quite it.@k Until the very moment I walked up to this window, I''m sure it was right by this window frame.'
52175: '@rThat''s right, I''m sure I put it right here by this window.'
52176: '@rBut the prankster witch BEATRICE uses her magic,@k and just before I reach this spot, she instantly teleports the small broom to the next window over.'
52177: '@rThe instant I approach the next window,@k a hole appears beneath the small broom, swallowing it up.'
52178: '@rAnd it comes out by the next window after that.'
52179: '@rIt lands right there, perfectly still, as though it was there the whole time.'
52180: '@rAnd this happens over and over again!'
52181: '@rAs I run up to one window, the small broom falls into a magic hole and goes to the next window.@k And when I go to that window, it goes to the next window...!'
52182: '@rThat''s exactly how she''s teasing me, I can tell!'
52183: '@rSo no matter how much I search, it''ll be useless.'
52184: '@rBut if I stop searching, it''ll be just sitting there by one window or another.'
52185: '@rSo, this isn''t a search.@k It''s a test of endurance.'
52186: '@rI keep chasing after the small broom,@k and BEATRICE keeps making it escape to the next window over, trying to make me give up.'
52187: '@rThis is an eternal chase...that''ll end only when one of us gives up...!'
52188: '@rSo, I keep going around in circles searching the windows, even when I know I''ve already searched them.'
52189: '@rIf it''s not by this one, then the next one, and the next one.'
52190: '@rAnd the witch keeps moving the small broom to the next window, and the next one...!'
52191: '@r"Just give it a rest...!!@k How long are you going to make fun of me?@k This isn''t the only time, you always do this, always!!"'
52192: '@r@v32/73700010.*giggle*,@v32/73700011. heh@v32/73700012.heh@v32/73700013.hah@v32/73700014.hahahahahahahahahaha...!!'
52193: '@rThe shrill, voiceless laugh of the formless witch continues to mock my sobbing.'
52194: '@rThe witch is right beside me, laughing at me.'
52195: '@rAs I dash around the chapel, she''s following along with me, taunting me.'
52196: '@rThen...@w500.she must be...@w583.there.'
52197: '@rShe''s right behind me, ......just over my shoulder,@k cackling away at this very moment.'
52198: '@rI know that turning around won''t help, since she has no form.@k@rI can try to look, but I mustn''t look with my eyes.'
52199: '@rOnce my eyes tell me there''s nothing there, I won''t be able to ''see'' anymore.'
52200: '@rI learned that from the Director of the Gospel House.@k ......You mustn''t try to see with your real eyes.@k ......You must ''see'' with your mind''s eye.'
52201: '@rThe whole world is filled with God''s love.@k In the many blessings of everyday life, one can find God, and angels, and the Holy Ghost.'
52202: '@rIf you try to look at them with your eyes, you won''t be able to see them or ''see'' them.@k So you won''t be able to feel them or understand them.'
52203: '@rInstead, you must quietly understand them with the eye of your heart.'
52204: '@rYou don''t look and have your eyes reflect their image.@kYou ''see''...and picture them in your mind.'
52205: '@rIn this way, I learned how to recognize beings not of this world at the Gospel House.'
52206: '@r......This power doesn''t only allow you to ''see'' God.@k@rIt allows you to ''see'' all those not of this world.'
52207: '@r".........Please, stop it now.@k Stop this prank."'
52208: '@r@v32/73700015."...............Hoh.@k@v32/73700016. ......So, you can speak to me?"'
52209: '@r"I''m clumsy, bad at my job, ......and I do forget where I put things a lot.@k ......But I know which things were my fault, and which things were because of your pranks."'
52210: '@r@v32/73700017."How amusing...@k@v32/73700018. Not only can you perceive me in my formless state, but you even understand my little game.@k@v32/73700019. .........It seems you are a more interesting creature than I thought,@k@v32/73700020. Yasu."'
52211: '@r......I''m usually called Yasu when one of the older servants is laughing behind my back at some mistake I''ve made.'
52212: '@rSo, when I hear that name, it feels bad.'
52213: '@rShe deliberately called me not by the blessed name given to me by the Gospel House, but by that unblessed name.'
52214: '@rUpsetting the heart is a classic move for evil beings to make.@k@rThat is their way of attempting to prevent others from perceiving them.'
52215: '@rTo beings like witches, being understood is like shoving them out into the light of day.'
52216: '@r"......It won''t work.@k In the Gospel House, I learned how to perceive those not of this world.@k So, I already understand you."'
52217: '@r@v32/73700021."Very interesting.@k@v32/73700022. ............I am a being so faint that I would scatter in a gentle breeze, yet you hold me in the grasp of your perception.@k@v32/73700023. ......I have taken a liking to you, Yasu!"@|@y'
52218: '@r"It won''t work.@k I understand you now, and you''re in my grasp.@k No matter how many unpleasant things you say, you''ll just expose the ugliness of your heart."'
52219: '@rWithout turning around, ......I slowly let my field of vision fill the entire chapel.'
52220: '@rIt was as though the viewpoint of my soul was floating out from the shell of my head.'
52221: '@r......See,@w333. ............inch by inch,@w166. ......my field of vision is floating out of my head...@w166....and drifting upwards.'
52222: '@rAs I looked down at myself, standing there with head hanging and eyes tightly shut...'
52223: '@r...my mind''s eye...@w166....very slowly...@w250.......rose up to the ceiling of the chapel.'
52224: '@rAnd when I looked down from there...'
52225: '@r...I looked down at myself, standing in the center of the chapel, .........and the witch standing behind me.'
52226: '@r......Apparently, the witch realized that she was being ''seen''.'
52227: '@rShe turned around...@w500.......and raised her eyes to look at my mind''s eye, floating by the ceiling...'
52228: '@r......At last,@w500. I could ''see'' the witch BEATRICE...@w583....with my mind''s eye......'
52229: 'BEATRICE@r@v32/73700024."A mere Human...@v32/73700025....grasped my form......?"'
52230: '@rThe demonic lips......twisted in an ugly curve.@k@rIt was clearly a challenging, repulsive, ......demon''s smile...'
52231: '@rShe wore a blood-red dress and hat.@k The design was completely different from anything Humans wore.'
52232: '@rHer hair was blonde.@k It had countless beautiful curls, like a princess from a picture book,@k ......but there was no trace of cuteness about her.'
52233: 'BEATRICE@r@v32/73700026."......I thought you were a little different from the other Humans,@k@v32/73700027. but it seems I was mistaken."'
52234: '@r"........................"'
52235: 'BEATRICE@r@v32/73700028."You are not just a little different......you are entirely different from other Humans.@k@v32/73700029. *cackle*cackle*...!"'
52236: '@r"You sad witch, who can be seen by no one, heard by no one.@k ......Have you been pulling these pranks all the time just to catch the attention of Humans...?"'
52237: 'BEATRICE@r@v32/73700030."I use what little magic I have to interfere when Humans aren''t looking, but no matter what I do, none of them think of it as magic.@k@v32/73700031. ......They decide that they just made a little mistake,@k@v32/73700032. and blow my existence away like the candles on a cake."'
52238: '@r"If so, then I''ve just saved you.@k Because I understand you...and perceive you."'
52239: 'BEATRICE@r@v32/73700033."......Saved me?@k @|@y@v32/73700034.*cackle*cackle*cackle*!@k @v32/73700035.To me, this meeting with you is nothing more than a new way to kill time."'
52240: '@r"It''s getting dark.@k I don''t have the time to play with you anymore."'
52241: 'BEATRICE@r@v32/73700036."Well, well, so it is.@k@v32/73700037. My apologies. When one is engrossed, one hardly notices the time."'
52242: '@r".........Please give it back.@k My cleaning tool."'
52243: 'BEATRICE@r@v32/73700038."That small broom, or whatever you call it?@k @v32/73700039.It''s right there, by the next window."'
52244: '@r"But as soon as I get close, you''ll move it to the next window over."'
52245: 'BEATRICE@r@v32/73700040."*cackle*cackle*!@k @v32/73700041.My magic is as elusive as my very own form.@k@v32/73700042. With no more than a snap of my fingers, everything here is under my total control...!"'
52246: '@rThe witch snapped her fingers, and various things throughout the chapel were sucked into black pitfalls beneath them, disappearing.'
52247: '@rNo, they didn''t disappear.@k The instant they vanished into the dark holes, other dark holes appeared in completely different parts of the chapel, and the vanished objects fell out of those.'
52248: '@rChairs, musical scores, clocks, and vases started appearing and disappearing all across the room.'
52249: '@rI felt as though countless tools were flying about the chapel......'
52250: 'BEATRICE@r@v32/73700043."I can perform these acts, but I choose not to.@k@v32/73700044. After all, this would be a bit more than a prank, don''t you agree...?"'
52251: '@rI wonder where a witch draws the line between pranks and magic.'
52252: '@rWhen she snapped her fingers again, all of the objects flying about so energetically returned to their original spots,@k and silence fell.'
52253: 'BEATRICE@r@v32/73700045."I''ve taken a liking to you.@k@v32/73700046. ......You say you have me in your grasp?@k @|@y@v32/73700047.*cackle*cackle*!@k @v32/73700048.That works in reverse.@k@v32/73700049. I have you in mine."'
52254: '@r".............................."'
52255: '@rThe Gospel Director told me that I mustn''t try to ''see'' evil beings.'
52256: '@rIf you ''see'' them, they will haunt you.'
52257: '@rNow that I understood this witch, a bond had been formed between us.'
52258: 'BEATRICE@r@v32/73700050."That is correct.@k@v32/73700051. Now that you have acknowledged my existence, I have formed a bond with you.@k@v32/73700052. ......After all the years I have spent in boredom, it will be nice to have someone to talk to, even a child as young as you."'
52259: '@r"I''ll talk to you from time to time.@k So, will you stop pulling pranks like this?"'
52260: 'BEATRICE@r@v32/73700053."No, I won''t be here to talk to you, but to play with you!@k @v32/73700054.*cackle*cackle*. And if we''re playing, pranks are just part of the game, right?"'
52261: '@r"................................."'
52262: 'BEATRICE@r@v32/73700055."Heheh.@k@v32/73700056. ......Very well.@k@v32/73700057. I''ve had enough fun for one day.@k@v32/73700058. The sun has sunk and the moon is full.@k@v32/73700059. I am tired after appearing in front of you for so long.@k@|@y@v32/73700060. Let us call it a night.@k@v32/73700061. That single broom provided me a great deal of entertainment...!"'
52263: '@r"Please, give it back."'
52264: 'BEATRICE@r@v32/73700062."No.@k@v32/73700063. I will keep this as a token of our meeting.@k@v32/73700064. I assume that you will be fine with this?"'
52265: '@r"......If I said I''m not, would you give it back to me?"'
52266: 'BEATRICE@r@v32/73700065."I never listen to Humans!@k @v32/73700066..........However, I might lend an ear to a friend."'
52267: '@r"......If you give it back, ......I''ll acknowledge you as a friend."'
52268: 'BEATRICE@r@v32/73700067."*cackle*cackle*cackle*...!@k @v32/73700068.Foolish Human, was that your idea of an attractive proposal...?!@k @v32/73700069.......If you want to make a deal with me, try drawing a mysterious magic circle or two!@k @|@y@v32/73700070..........And yet, I might be willing to consider your offer."'
52269: '@r"What do you mean, you might...?"'
52270: 'BEATRICE@r@v32/73700071."I shall take my time in deciding whether you are worthy to be my friend.@k@v32/73700072. ......After all, witches are like demons!@k @v32/73700073.If you ask us for an answer, we will never give one right away.@k@v32/73700074. *cackle*cackle*!"'
52271: '@r".........Alright.@k Then, .........I''ll leave the small broom with you.@k Please give it back when you decide to become my friend."'
52272: 'BEATRICE@r@v32/73700075."Very well.@k@v32/73700076. Will this broom become a bridge of friendship between us, or not?@k@v32/73700077. ......I will hang onto it for now, making my decision in my own good time."'
52273: '@rWhen the witch snapped her fingers, the broom for which I had searched so long fell out of a hole in the air,@k landing between the fingers she had just snapped...'
52274: 'BEATRICE@r@v32/73700078."This is goodbye.@k@v32/73700079. ......This game with you was far from boring.@k@v32/73700080. Let us play again sometime."'
52275: '@r"If you''re my friend, that is."'
52276: 'BEATRICE@r@v32/73700081."When a cat toys with a mouse, does it try to become friends with it first?@k @|@y@v32/73700082.*cackle*cackle*, ahahahahahahahahahaa!!"'
52277: '@rThe witch faded away......@k@rAs she did, my mind''s eye slowly closed......'
52278: '@rWhen I returned to my body, I felt suddenly tired and let out the breath I''d been holding.'
52279: '@r......Of course, when I turned around, there was no one to be seen.'
52280: '@rI couldn''t feel the witch''s presence anywhere anymore.@k@rIt had gotten very dark by this time.'
52281: '@rI decided to leave the chapel.@k@rThere''s no point in searching for the small broom any longer.'
52282: '@r......Not until the witch decides to give it back.'
52283: '@rI went out of the chapel.'
52284: '@rThe chapel key had been left in the lock.@k@rI used it to lock the door.'
52285: '@r............What am I going to do about the small broom?'
52286: '@rThere''s nothing I can do.@k I can''t even blame the witch.'
52287: '@rI must acknowledge that I''m responsible for giving the witch a chance...'
52288: '@r"..............................nn—"'
52289: '@rI happened to glance downwards......and saw a small broom lying there by my feet.'
52290: '@rIt was the broom I had been searching for all this time.'
52291: '@r......Don''t tell me...@kthat it''ll be swallowed up by a dark hole the instant I bend over to pick it up...?'
52292: '@rNo.@k This is...a sign from the witch.'
52293: '@rA sign that she acknowledges me as a friend.'
52294: '@rI picked it up.'
52295: '@rOh, I am one yet many.'
52296: 'Clair@r@v55/75500142."The first friend I made after coming to the island was apparently not a Human at all.@k@v55/75500143. However, when I think back on it, it was only natural.@k@v55/75500144. What other sort of friend would you expect to make on a witch''s island?@k@v55/75500145. This was the first meeting between me and BEATRICE."'
52297: 'Clair@r@v55/75500146."......However, as the more perceptive among you may have noticed, this was not a meeting with the real BEATRICE.@k@v55/75500147. The witch I then called BEATRICE would later be known by another name."'
52298: 'Clair@r@v55/75500148."......However, the fact remains that she was clearly not human.@k@v55/75500149. And being bonded with one who is not human means being bonded with their world.@k@v55/75500150. I still had no means of knowing the strange fate that awaited me on Rokkenjima......"'