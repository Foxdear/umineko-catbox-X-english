51364: 'Jessica@r@v04/70200176."......Like hell I''m doing that.@k@v04/70200177. I can''t give up after coming this far."'
51365: '@rThe key had been freezing in my hand, urging me to turn back.@k@r......But the keyhole made no further attempt to stop me.'
51366: '@rAll that''s left...@w416.......is to turn the knob,@w333. open the door,@w500. ......and I''ll be inside the VIP room.'
51367: '@r......It''s not like I''ve never been in the VIP room.'
51368: '@rLong ago, when I would often play hide-and-seek or go exploring,@k this room that I rarely entered had seemed unusual and exciting.'
51369: '@rHowever, I got in trouble for going in, and was told that this room was important, so one mustn''t enter without reason.@k After that, they made a rule of locking up unused rooms, and I couldn''t go in anymore.'
51370: '@r......So, ...it''s probably been several years since I last went into the VIP room.@k In fact, ......it might be more than a decade.'
51371: '@rThe inside of the room is probably different from how it was when I knew of it.'
51372: '@r......Come to think of it, even then, I felt that there was something unsettling about this room...'
51373: '@rSlowly, I pushed the door open.'
