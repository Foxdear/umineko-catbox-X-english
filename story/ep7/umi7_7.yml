51276: 'Gohda@r@v17/71700005."W-well, I do know of her, of course.@k@v17/71700006. ......Why do you ask?"'
51277: '@rThe two looked at each other.'
51278: '@rThey looked like a pair who had just heard a clueless person suddenly utter a forbidden word...'
51279: 'Jessica@r@v04/70200149."Let''s have it straight.@k@v04/70200150. Does she exist?@k @v04/70200151.That ghost?!"'
51280: 'Gohda@r@v17/71700007."......If it''s a question of whether she exists or not,@v17/71700008. ......I would have to say she doesn''t...@v17/71700009.probably."'
