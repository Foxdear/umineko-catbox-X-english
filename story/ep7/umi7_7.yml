51375: '@rBeyond it......was a darkness as thick and heavy as ink...'
51376: '@rEven the dim light that seeped in from the corridor seemed bright in contrast.'
51377: '@r......Swallowing hard,@k ......I stuck my head in, feeling about for the light switch next to the doorway.'
51378: '@rThis was a horribly unnatural and awkward way to do it.@k@r......All I really had to do was step inside and search for the switch from there.'
51379: '@rUnwilling to take even a single step into the room,@k ......I timidly stuck just my arm into the darkness and felt along the wall...'
51380: 'Jessica@r@v04/70200178."............There..."'
