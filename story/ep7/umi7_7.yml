51254: 'Jessica@r@v04/70200134."I haven''t done anything.@k@v04/70200135. It''s you servants who''ve done a great job."'
51255: 'Kumasawa@r".....................@k@v18/71800037. Is the argument you had with Maria-sama yesterday still playing on your mind?"'
51256: 'Jessica@r@v04/70200136."Nn, .........sorta."'
51257: 'Kumasawa@r@v18/71800038."Come now, she''s just a child.@k@v18/71800039. It''s not something you need to worry about, all grown up and in high school."'
51258: 'Jessica@r@v04/70200137."That stuff Maria was talking about, do you think it''s all just a kid''s nonsense?"'
51259: 'Kumasawa@r@v18/71800040."......About BEATRICE-sama,@v18/71800041. ......you mean?"'
51260: 'Jessica@r@v04/70200138."See, even you call her sama."'
51261: '@rBEATRICE is the name of Grandfather''s mistress, the person he''s still infatuated with.@k ......I realize that, as a servant, Kumasawa-san can''t speak of her indiscreetly.'
51262: '@rStill, ......that''s now become the name of the fictitious witch who lives in the mansion,@k .........and it''s almost normal for people to call her "sama".'
51263: 'Jessica@r@v04/70200139."BEATRICE is just a ghost story created by the adults to stop us from wandering into the forest.@k@v04/70200140. ......Maria just thought it was interesting one day and decided to pretend it was true."'
51264: 'Kumasawa@r@v18/71800042."Hoh-hoh-ho...@k@v18/71800043. You''ll end up cursed if you say such things.@k@v18/71800044. After all, BEATRICE-sama "exists"."'
51265: 'Jessica@r@v04/70200141."Come on, we both know that isn''t true.@k@v04/70200142. I don''t need George nii-san to tell me not to make a fuss about Santa not existing.@k @v04/70200143.But that doesn''t mean Santa actually exists."'
51266: 'Kumasawa@r@v18/71800045."......You''ll find you''re wrong there, Milady."'
51267: 'Jessica@r@v04/70200144."Wrong...?"'
51268: 'Kumasawa@r@v18/71800046."Oh yes.@k@v18/71800047. The gods do dwell in all things.@k@v18/71800048. ......In the same way, BEATRICE-sama dwells on this island, in this mansion.@k@v18/71800049. Like the gods, BEATRICE-sama will do you no harm if you respect her."'
51269: 'Kumasawa@r@v18/71800050."As you say, it is as though she doesn''t exist...@k@v18/71800051. However, if you ever fail to show proper respect, it will most certainly come back to haunt you.@k@v18/71800052. ......Of course, that can be said of more than BEATRICE-sama."'
51270: 'Jessica@r@v04/70200145."Heh, if there''s a curse, let''s see it.@k@v04/70200146. I''d just love to meet her."'
51271: 'Kumasawa@r@v18/71800053."M-Milady...!@k @v18/71800054.You mustn''t say such things...!"'
