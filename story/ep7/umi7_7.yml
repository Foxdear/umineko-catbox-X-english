51333: '@rTen to two.'
51334: '@rIf I want to greet 2 a.m. inside the VIP room, I need to have already gone in there before then.'
51335: 'Jessica@r@v04/70200174."......Guess it''s time.@k@v04/70200175. ......Sorry, but I''m not giving up that easy."'
51336: '@rNothing''s going to happen.@k I know that.@k@rIt''ll just be a stupid waste of time for a few minutes.'
51337: '@rI touched the doorknob to the door of my room...@w500....and was startled by how unpleasantly cold it was.'
51338: '@rAs long as I stayed in this room, I could laugh off anything.'
51339: '@rAfter all, this was my room.'
51340: '@rBut it wouldn''t be like that in the hallway.@k ......That''s...outside my territory.'
51341: '@rAnd the doorknob, the barrier between the two, was ice-cold...'
51342: '@r......Idiot...@k What are you so scared of, me?'
51343: '@rYou aren''t taking Shannon''s, Gohda-san''s, ...or maybe Kumasawa-san''s gossip seriously, are you...?'
51344: '@rI''ll prove it! There''s nothing strange in the VIP room...!!'
51345: '@rThe corridor was only dimly lit.'
51346: '@rThe hallways were brighter before "lights out".'
51347: '@rBut to avoid wasting energy or something like that, we kept the lights to a minimum at night.'
51348: '@rSo, even though I was inside my own house,@w500. ......it was very obviously the middle of the night here.'
51349: '@r......If Mom found out that I was wandering around at a time like this to do a test of courage in the VIP room, which I''m not supposed to go in,@k I''d get in a lot of trouble.'
51350: '@rTo make sure she didn''t find out, I tried to hide my breathing and my footsteps.@k@r......So, the silence felt unbelievably loud.'
51351: '@rEven though it was so quiet, ......the eerie sound of the wind was loud in my ears.'
51352: '@rThe sound of twigs rustling.@k The sound of some pillar in this old mansion creaking.'
51353: '@rWhat''s that sound like a beak tapping against glass?'
51354: '@rThough it was so quiet, ......all of the little, suspicious sounds felt obnoxiously loud.'
51355: '@rDamn, I''m an idiot.@k Why couldn''t I have brought a flashlight, at least?'
51356: '@rA flashlight to use inside my own home?@k@r......Hah, that''s even more idiotic...'
51357: '@rI mumbled this to myself, hoping it would drown out the sound of the wind just a little...'
51358: '@r.........Then, ......I saw it.@k The door to the VIP room.'
51359: '@r......The VIP room was supposedly reserved for important guests.'
