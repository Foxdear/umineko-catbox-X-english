51242: 'Jessica@r@v04/70200121."Something like that.@k@v04/70200122. "If she exists, then just let me see her".@k@v04/70200123. ......Of course, once Maria started crying, I realized I''d gone too far."'
51243: 'Will@r@v54/75400679."And then?"'
51244: 'Jessica@r@v04/70200124."At the end of the family conference, I was the only one still upset.@k@v04/70200125. ......Maria acted as though nothing had happened.@k@v04/70200126. Instead, she went off somewhere on her own, and came back talking happily about how she had played with BEATRICE again."'
51245: 'Jessica@r@v04/70200127."Everyone, me included, decided not to contradict her.@k@v04/70200128. By that time, it was best to just accept it and ignore it."'
51246: 'Will@r@v54/75400680."Is that all you have to say about the family conference?"'
51247: 'Jessica@r@v04/70200129."About the conference, yes.@k@v04/70200130. What I wanted to talk about was what happened after the conference was over and everyone left."'
51248: '@rEven after the conference ended, I still felt a bit uncomfortable.'
51249: '@rIf Maria had just stayed mad,@k we''d have made up with each other and I could''ve put it all behind me.'
51250: '@rBut since Maria got over it, it felt like I was the only one unsatisfied...'
51251: 'Kumasawa@r@v18/71800032."Oh, Milady.@k@v18/71800033. Why the gloomy face?"'
51252: 'Jessica@r@v04/70200131."......Oh, it''s you.@k@v04/70200132. It''s nothing important.@k@v04/70200133. ......Did everyone make it back okay?"'
