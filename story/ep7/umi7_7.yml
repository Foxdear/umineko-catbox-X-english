51562: 'Lion@r@v53/75300316."A witch?@k @v53/75300317.What witch?"'
51563: 'Will@r@v54/75400723."The Golden Witch, ruler of Rokkenjima''s night.@k@v54/75400724. BEATRICE."'
51564: 'Lion@r@v53/75300318."......Beatrice is a woman to whom Grandfather owes a great debt.@k@v53/75300319. Don''t you think it''s a bit rude to treat her like a witch or a ghost?"'
