51532: 'Jessica@r@v04/70200254."The dining hall?"'
51533: 'Will@r@v54/75400701."On the day of the family conference, just before your ghost story, all of the relatives were gathered in the dining hall, right?"'
51534: 'Jessica@r@v04/70200255."Yeah.@k@v04/70200256. Except Battler hadn''t come back to the family yet.@k@v04/70200257. Everyone else was there.@k@v04/70200258. ......Everyone except Grandfather, of course."'
51535: 'Will@r@v54/75400702."And Ange wasn''t in the room because of her stomachache.@k@v54/75400703. ......Her seat was next to yours, wasn''t it?"'
51536: 'Jessica@r@v04/70200259."Yep."'
51537: 'Will@r@v54/75400704."Was that the seat to your right?"'
51538: 'Jessica@r@v04/70200260."Yeah, the seat to my right.@k@v04/70200261. Why does it matter?@k @|@y@v04/70200262................?@k @v04/70200263.......Hm?@k @|@y@v04/70200264.Wait...@k @v04/70200265.......That''s strange, why to the......?"'
51539: 'Will@r@v54/75400705."That''s enough.@k@v54/75400706. ......Try not to think. You''ll just get a headache."'
51540: 'Lion@r@v53/75300292."What''s up, Jessica?@k@v53/75300293. Why the confused look...?"'
