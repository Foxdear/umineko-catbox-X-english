51553: 'Will@r@v54/75400715."''Behold the sweetfish river, running through my beloved home of old''."'
51554: 'Lion@r@v53/75300307.".........Just what...@v53/75300308.are you talking about?"'
51555: 'Will@r@v54/75400716."So, in your world, ......no, in this world,@k@v54/75400717. the portrait exists, but not the epitaph?"'
51556: 'Lion@r@v53/75300309."Of course, I know about the large portrait of Beatrice hanging in the entrance hall.@k@v53/75300310. ......But I haven''t heard of this epitaph.@k@v53/75300311. What is it?"'
51557: 'Will@r@v54/75400718."........................@k@v54/75400719. ......That''s a very interesting difference.@k@v54/75400720. .........You''ve lived on Rokkenjima all your life, right?"'
