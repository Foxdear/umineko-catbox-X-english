51239: '@r....................................'
51240: 'Jessica@r@v04/70200116."Looks like we''ve gone off track.@k@v04/70200117. Anyway, Maria kept up that tantrum until Auntie Rosa got back.@k@v04/70200120. ......It was my fault too, arguing back when I should''ve let her be."'
