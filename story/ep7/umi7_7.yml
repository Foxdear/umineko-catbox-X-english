51409: '@rAnd, as though it was an offering to that owner,@k ......there sat a small plate with several cookies and wrapped chocolates.'
51410: '@rIt was all set out neatly, and there was no dust piled up on the doll.'
51411: '@r......In other words, both the doll and the offering were being taken care of on a regular basis by the servants,@k and kept in good condition along with the rest of the room.'
