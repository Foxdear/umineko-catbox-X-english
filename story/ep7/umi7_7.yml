51055: 'Jessica@r@v04/70200018."So...heheh...about earlier,@k@v04/70200019. sorry you had to see me acting like that... I blame the future heir......"'
51056: 'Will@r@v54/75400624."It''s not going to leave a mark, is it?@k@v54/75400625. Talk about merciless."'
51057: 'Lion@r@v53/75300291.".........Did you say something, Jessica?"'
51058: 'Jessica@r@v04/70200020."O-of course not...!@k @v04/70200021.I''ve already, uh, learned my lesson, okay?!"'
51059: '@rLion, who had apparently been chatting with the adult siblings, spun around with a smile and stared at Jessica.@k ......Looks like the older sibling''s firmly in control around here.'
51060: 'Will@r@v54/75400626."......Those are some sharp ears.@k@v54/75400627. I think I finally get this Lion person."'
51061: 'Jessica@r@v04/70200022."Yeah, yeah, yeah!@k@v04/70200023. The future heir''s always been annoyingly sharp!@k @v04/70200024.Not to mention the favorite of all the adults!@k @v04/70200025.I''m always compared against this kid, at home and at school!"'
51062: 'George@r@v07/70300014."Come to think of it, Lion was the student council president for both middle school and high school.@k@v07/70300015. And the head of the badminton team too."'
51063: 'Will@r@v54/75400628."So everywhere you go, you get compared to Lion, and it doesn''t work out too well for you."'
51064: 'Jessica@r@v04/70200026."I said it as soon as I got into middle school.@k @v04/70200027.The future heir was already the vice-president of the student council.@k@v04/70200028. I said "if you''re planning to become council president next year, that''ll just put more pressure on me, so stop it!""'
51065: 'Jessica@r@v04/70200029."But the next year rolls around, and guess who signs up as a candidate and wins in a landslide?!@k @v04/70200030.Same thing happened when I started high school!@k @v04/70200031.I said "please, just give it a rest this time", but by that point, the future heir was already the vice-president!@k @v04/70200032.Then, senior year? Immediately president of the student council!"'
51066: 'Jessica@r@v04/70200033."Dad was oh so proud!@k @v04/70200034.Mom kept saying "now you make sure you do your best as the little sister", over and over and over again!!@k @v04/70200035.Nngyaaaaaaaaaaahhhh!"@|@y'
51067: 'George@r@v07/70300016."But even so, you''re still proud to be Lion''s little sister, aren''t you?"'
51068: 'Jessica@r@v04/70200036."I-i-it''s not like I ever thought about that!@k @v04/70200037.Nope, never! Not even once...!"'
51069: 'Will@r@v54/75400629."It can be tough to be compared against perfection.@k@v54/75400630. Still, other people are other people, and you are you.@k@v54/75400631. There''s no need to feel dwarfed.@k@v54/75400632. You should live the way you want to with all you''ve got."'
51070: 'Jessica@r@v04/70200038."Of course!@k @|@y@v04/70200039.But Mom and the others are always going on about how I need to follow in the footsteps of Ushiromiya Lion as the younger sibling.@k@v04/70200040. ......They keep telling me to go join the student council, go play badminton......"'
51071: 'Will@r@v54/75400633."Don''t you play in a band?"'
51072: 'Jessica@r@v04/70200041."Wh-......wha?!@k @|@y@v04/70200042.Sh-shhhhhhh!@k @v04/70200043.That''s a secret! No one knows...!"'
51073: '@rApparently, she''s keeping it a secret from her family.'
51074: '@rInteresting.@k ......People often like to blame their family for what they''ve grown up to be like,@k but even in a different world with a different family, the interests of the girl called Jessica are the same as ever.'
51075: '@rIt''s admirable that she has such a true and constant interest in something.'
51076: 'Will@r@v54/75400634."I love that kind of stuff.@k@v54/75400635. "Pettan, pettan".@k@v54/75400636. "Sweets, sweets"."'
51077: 'Jessica@r@v04/70200044."Wah, wah, wah!!@|@y@k @v04/70200045.Shh, shh, shh!!"@|@y'
51078: '@rNothing wrong with the extraordinarily accomplished sort, like Lion, but kids who act their age do have their charms.'
51079: 'Will@r@v54/75400637."That''s the best way to go through life.@k@v54/75400638. Enjoy your youth to the fullest."'
51080: 'Jessica@r@v04/70200046."W-well, uh......thanks."'
51081: '@rApparently, no one had ever told Jessica that they approved of how she lived,@k and the direct way Will had put it made her turn red and hang her head in embarrassment.'
51082: 'Will@r@v54/75400639."I want to ask you two now."'
51083: 'George@r@v07/70300017."The same thing you just asked Maria-chan?"'
51084: 'Will@r@v54/75400640."Yeah.@k@v54/75400641. Please tell me everything you know about BEATRICE."'
51085: 'George@r@v07/70300018."......Well, you can see how much Maria-chan likes witches and the occult.@k@v07/70300019. For her, BEATRICE is a symbol to be admired, like an anime heroine.@k@v07/70300020. She believes every little thing is some sort of prank caused by a witch''s magic."'
51086: 'Will@r@v54/75400642."You are an adult.@k@v54/75400643. And the fact that you never say this to Maria is also very adult of you."'
51087: 'George@r@v07/70300021."Of course.@k@v07/70300022. Childhood dreams only happen when you''re a kid.@k@v07/70300023. I think respecting that precious experience is an adult''s responsibility."'
51088: 'Will@r@v54/75400644."Looks like the two of us will get along well."'
51089: '@rGeorge''s position was that BEATRICE was nothing more than a fairy tale.'
51090: '@rHowever, that phrase—"respecting a child''s dreams is the adult thing to do"—that might be worthy of further scrutiny.'
51091: '@rWhen she got a candy from BEATRICE by magic, Maria probably got excited and told George and the others.'
51092: '@rThen, the adults followed his lead and positively went along with her story "as adults should".'
51093: '@rHowever, there could be other ways this sort of reaction could occur, other than as an adult''s response to a child''s claims.'
51094: '@rFor example, it could be an inferior''s response to the claims of their superior.'
51095: '@r......If Kinzo, tyrant of the Ushiromiya family, claimed that BEATRICE existed and had revived,@k perhaps the other members of the family would positively go along with his story "as his inferiors should".'
51096: '@rThough BEATRICE only appeared directly in front of a limited number of people,@k......it''s probably safe to say that the concept of her existence penetrated deeply within the Ushiromiya family, even among those who had never seen her.'
51097: '@rHowever, no matter how deeply that concept penetrated, she was only viewed as a sort of fairy tale character.'
51098: '@rIt would be necessary to transform the concept of that character from an imaginary fairy tale into reality.'
51099: '@rSo, a person attempting to do this would need to perform something that could only conceivably be done by magic.'
51100: '@rAnd that something......was the series of witch incidents that started with the nighttime window-opening pranks played by Beato the Elder...@k...and ultimately escalated to locked-room murders.'
51101: '@r......Beato the Elder referred to this, saying that the anti-magic power filling the mansion would be weakened bit by bit the more she made her existence known.'
51102: '@rBEATRICE.'
51103: '@rWhy did you desire so greatly to make all others accept your existence?'
51104: '@rBecause the imaginary becomes the truth if everyone accepts it?'
51105: '@rBecause at that moment, the being called BEATRICE will be acknowledged and will become Human?'
51106: '@rIn that case, before BEATRICE is acknowledged by all people, she''s less than Human.@k She''s furniture.'
51107: '@rWhy would furniture want to become Human?'
51108: '@rIt feels like this was the theme of the previous game.'
51109: '@rBecause they want to gain the right.'
51110: '@rFurniture cannot ____.@k@rSo, they try to become Human for the right to ____.'
51111: '@r............................'
51112: '@rIt really is quite simple.'
51113: '@r......It''s directly connected to the reason the chick Beato was born in the first place.'
51114: 'Will@r@v54/75400645.".....................@k@v54/75400646. ......I see.@k@v54/75400647. ......I do understand, but it''s complicated."'
51115: '@rI can''t......ignore the heart.'
51116: 'George@r@v07/70300024."I feel bad for saying this at BEATRICE''s funeral,@k@v07/70300025. ......but, truth be told, I don''t know enough about BEATRICE to explain her.@k@v07/70300026. My apologies."'
51117: 'George@r@v07/70300027."As far as that goes, Jessica-chan does live here, so she might know a little more than I do.@k@v07/70300028. ......Speaking of which, have you introduced yourself to this gentleman yet, Jessica-chan?"'
51118: 'Jessica@r@v04/70200047."Nah, not yet.@k@v04/70200048. ......There''s this idiot going around pinching people''s butts, so I didn''t really have the chance yet...ehehe..."'
51119: '@rA bit late, Jessica looked embarrassed for acting rudely in front of an unfamiliar guest.'
51120: '@rShe cleared her throat and made a beautiful bow that didn''t fit well with her normal attitude.@k She even lifted the corners of her skirt in a curtsy.'
51121: 'Jessica@r@v04/70200049."P-pleased to meet you.@k@v04/70200050. ......My name is Jessica.@k@v04/70200051. Allow me to welcome you to the Ushiromiya family on this splendid day......@v04/70200052.umm, I mean, please enjoy our hospitality...and......."'
51122: 'Will@r@v54/75400648."......Willard.@k@v54/75400649. Call me Will."'
51123: 'Jessica@r@v04/70200053."Huh?@k @v04/70200054..........Huh?@k @v04/70200055................Wah—"'
51124: '@rJessica''s greeting had been of the old-fashioned sort,@k so Will also treated her like an old-fashioned lady.@k He bent down on one knee, took Jessica''s right hand, and kissed the back of it.'
51125: 'Jessica@r@v04/70200056."Wah, wah......waah........."'
51126: '@rNot expecting her greeting to be returned in such an old-fashioned and formal way, Jessica turned red and was unable to speak.'
51127: '@r......However, Will had returned the greeting in what he thought was a perfectly serious way,@k so he didn''t understand what was making Jessica''s face glow.'
51128: 'Will@r@v54/75400650."Have I done something strange?"'
51129: 'Jessica@r@v04/70200057."No, no, I just didn''t...ah, ahahaha..."'
51130: 'Will@r@v54/75400651."I want to hear what you know about BEATRICE.@k@v54/75400652. ...............nn."'
51131: '@rA glow leaked from Will''s right hand, which was grasping Jessica''s.'
51132: '@rLooks like the theatergoing power is having its effect on Jessica.'
51133: '@r......Didn''t mean for that to happen.@k Oh well...'
51134: 'Jessica@r@v04/70200058."BEATRICE, is it...?@k @v04/70200059.W-well, I can tell you, .........but will you promise me something?@k @v04/70200060.Promise you won''t laugh.@k@v04/70200061. Thinking about it now, ......it sounds more than a little crazy."'
51135: 'Will@r@v54/75400653."What is it you know?@k @v54/75400654.I won''t laugh.@k@v54/75400655. Tell me."'
51136: 'Jessica@r@v04/70200062."S-sure...@k@v04/70200063. .........Umm, where should I start......."'
51137: '@rTo me, the Golden Witch BEATRICE is...@k...sort of like one of the "seven mysteries" of the Ushiromiya family.'
51138: '@rYou''ve heard of those, right? Almost all schools have a set of tall tales or ghost stories that get passed down.'
51139: '@rLike "on some days, the piano in the music room will start playing by itself", or "the skeleton in the science room dances around at night".'
51140: '@rEveryone''s heard of them.@k But of course, that doesn''t mean they believe in them.'
51141: '@rThe stories about BEATRICE were the same.'
51142: '@rIt was just one of those strange tales about our way-too-big mansion.'
51143: '@rThe servants would sometimes talk about seeing things or whatever during their night patrols.'
51144: '@rSometimes, I felt a bit annoyed about them turning my home into a place for ghost stories, but I didn''t pay it any more attention than that.@k That''s how little it mattered to me.'
51145: '@rSo, during my normal, everyday life, I would completely forget about the name "BEATRICE".'
51146: '@rOf course, when that huge portrait was first hung, I was definitely creeped out.'
51147: '@rEven I tried not to meet her eyes after dark,@k so yeah, I don''t blame the servants for finding it eerie.'
51148: '@rBut that only lasted for a short while.@k@rI mean, I walked by that portrait every day.'
51149: '@rI gradually got used to it, and eventually bored of it.'
51150: '@rIt was just a portrait that Grandfather blew a bunch of money on, showing the mistress from his delusions... I was past caring.'
51151: 'Will@r@v54/75400656."I get that.@k@v54/75400657. I''ll bet it was different for the other relatives, who only came a few times a year."'
51152: 'Jessica@r@v04/70200064."Exactly.@k@v04/70200065. That''s why every time the family came for a family conference, they''d always stand in front of that portrait and talk about BEATRICE.@k@v04/70200066. So, I was reminded of it every year."'
51153: 'Maria@r@v13/70400236."Uu, BEATRICE!!@k @v13/70400237.I''ve come to play again...!@k @v13/70400238.I''ve drawn another new spell.@k@v13/70400239. Take a look at it later, okay?! Uu!"'
51154: 'George@r@v07/70300029."You really do like BEATRICE, don''t you?@k@v07/70300030. You''ve been in such high spirits ever since Grandfather had this portrait hung."'
51155: 'Jessica@r@v04/70200067."Huh?@k @v04/70200068.Where''s Ange?"'
51156: 'George@r@v07/70300031."She went back with Aunt Kyrie to take some medicine."'
51157: 'Jessica@r@v04/70200069."Ange gets sick so easy.@k@v04/70200070. ......Totally the opposite of Battler."'
51158: 'George@r@v07/70300032."She''s the sort that gets sick whenever she''s stressed.@k@v07/70300033. I also used to get sick on big holidays or days when we were going to the movies."'
51159: 'Jessica@r@v04/70200071."Maria''s really tough by comparison.@k@v04/70200072. ......She''s been talking about BEATRICE non-stop since we left Niijima.@k@v04/70200073. ......Don''t you think she''s taking this a bit too far?"'
51160: 'George@r@v07/70300034."It''s not so bad, right?@k@v07/70300035. It''s normal for kids to have an active imagination.@k@|@y@v07/70300036. If a kid told you that she''d met Santa Claus,@k@v07/70300037. would you tell her she''s a liar?"'
51161: 'Jessica@r@v04/70200074."......Well, of course I wouldn''t go that far."'
51162: '@rMaria kept talking to the portrait as though it was an old friend.'
51163: '@rShe promised to play with it later, as if she was talking to a living human.'
51164: '@rGeorge, a man, seemed to think that this behavior from a younger member of the opposite sex was cute.'
51165: '@r......But, to be perfectly frank...'
51166: '@r...Jessica, who was the same sex as Maria,@k found this behavior a bit unpleasant regardless of Maria''s age.'
51167: '@rAt one time, even I was fascinated by anime heroines and other fictional characters.'
51168: '@rHowever, ......Maria''s behavior seems to signify something more direct than mere fascination.@k ......It''s something much more definite,@w500. ......more vivid.'
51169: '@rAm I the only one who notices something odd about her?'
51170: '@r......I''ll bet the others all notice too, but try to ignore it because of that adult dignity George nii-san is always talking about.'
51171: 'Krauss@r@v02/70800014."......My apologies, everyone.@k@v02/70800015. The head is quite busy with his noble research.@k@v02/70800016. He wishes to eat lunch in his study today."'
51172: '@rUntil a second ago, Kinzo''s children were complaining that eating lunch with their father would give them indigestion.'
51173: '@rBut now that they knew he wasn''t coming, they started grumbling about how he should at least spare the time to come down during the annual family conferences.'
51174: 'Gohda@r@v17/71700001."Then let us begin lunch, everyone.@k@v17/71700002. I, Gohda, have made use of all my talent and experience to make sure that all of you,@k@v17/71700003. who have come from so far away, will be entirely satisfied with your meal..."'
51175: '@rNo one''s stomach would fail to rumble after hearing that from the great Chef Gohda.'
51176: '@rBy the time the splendid dishes were laid out, everyone had stopped talking about Kinzo''s absence...'
51177: '@rIt was now Ange''s absence that was being discussed.'
51178: '@rApparently, her stomachache had gotten so bad that neither she nor Kyrie could make it to lunch.'
51179: 'Natsuhi@r@v03/70900012."Poor thing.@k@v03/70900013. ......Gohda.@k@v03/70900014. Make sure you talk to Kyrie-san later and have some porridge made."'
51180: 'Rudolf@r@v08/71200011."Thanks a bunch for the concern.@k@|@y@v08/71200012. ......Really sorry about this.@k@v08/71200013. Seems she just can''t handle much stress."'
51181: 'Hideyoshi@r@v06/71100015."That''s how it is when they''re young.@k@v06/71100016. They''re cute, at least when they''re not regurgitatin''."'
51182: 'Eva@r@v05/71000021."George used to do that all the time.@k@v05/71000022. He really was frail, way back then.@k@v05/71000023. Right?"'
51183: 'George@r@v07/70300038."Let''s not talk about the past...@k@v07/70300039. It''s not exactly a mealtime topic."'
51184: 'Maria@r@v13/70400240."Uu.@k@v13/70400241. Poor Ange.@k@v13/70400242. She doesn''t get to eat this yummy food?"'
51185: 'Jessica@r@v04/70200075."Yeah, poor girl.@k@v04/70200076. Let''s make sure we play with her a lot when she gets better."'
51186: 'Maria@r@v13/70400243."Uu, can''t.@k@|@y@v13/70400244. She can''t play with me."'
51187: 'Jessica@r@v04/70200077."Wh-what are you talking about?@k@v04/70200078. Why?"'
51188: 'Maria@r@v13/70400245."Because I''m gonna play with BEATRICE, of course.@k@v13/70400246. So I can''t play with Ange."'
51189: 'Jessica@r@v04/70200079."Play with BEATRICE...@k@v04/70200080. ......You mean you''re gonna go off on your own again to mumble to yourself and read some book?"'
51190: '@rJessica slightly regretted that she hadn''t been more tactful.'
51191: '@rHowever, she couldn''t wipe away that uncomfortable feeling she got every time Maria talked about BEATRICE,@k and that feeling slipped out through her words...'
51192: 'Maria@r@v13/70400247."Uu!!@k @v13/70400248.I don''t do it on my own!@k @v13/70400249.Beato is there too!!"'
51193: '@rMaria may have been young, but she already knew how to read a person''s tone.'
51194: '@rShe immediately burst out in anger, drawing the attention of everyone in the room...'
51195: '@rNormally, Rosa would have stopped her at this point.'
51196: '@rHowever, Rosa happened to have gone to the bathroom.@k So, there was no one to calm Maria down...'
51197: 'Maria@r@v13/70400250."Kihihihihi!!@k @v13/70400251.Poor Jessica, you''re just a clump of the toxin!@k @v13/70400252.With Beato''s weak magical power now, she''d burn to a crisp if she ever appeared in front of you!@k @v13/70400253.But she will appear before you eventually.@k @v13/70400254.Yes, in front of everyone else too!!"'
51198: 'Maria@r@v13/70400255."Kihihihi, and then the door to the Golden Land will open!!@k @v13/70400256.But who knows if you''ll be invited in?@k @v13/70400257.Of course, she will take me there, to the Golden Land!@k @v13/70400258.But not Jessica, not Jessica!!@k @v13/70400259.Not someone who makes fun of BEATRICE, not an unenlightened, stupid, confused, filthy, toxin-stained Human!!@k @v13/70400260.Kihihihihihihihihihihhihhihhihhi!!"'
51199: 'Jessica@r@v04/70200081.".........When someone makes fun of BEATRICE, it''s like Maria becomes a totally different person."'
51200: 'Will@r@v54/75400658."There was a theory about Maria having multiple personalities, wasn''t there?"'
51201: 'Jessica@r@v04/70200082."Multiple personalities!@k @v04/70200083.Yeah, that probably describes it perfectly.@k@v04/70200084. Maybe that was Maria''s idea of her ideal personality."'
51202: 'Will@r@v54/75400659."You mean that thing about "creating another self", the way you want to be...?"'
51203: 'Jessica@r@v04/70200085."Huh? ...How''d you know my motto?"'
51204: 'Will@r@v54/75400660."Don''t think too hard on it.@k@v54/75400661. You''ll just get a headache."'
51205: '@rThat was something Jessica had once told Kanon.'
51206: '@rShe had been talking about how anyone can create another self that they can really grow to like.'
51207: '@r......I think we heard those words somewhere near the beginning of the second game.'
51208: '@rNow that I think about it, some very interesting topics have been talked about since very early on...'
51209: 'Jessica@r@v04/70200086."Everyone has something they really want to become.@k@v04/70200087. But they never do it.@k@v04/70200088. ......The restrictions on their everyday life are what made them who they are today,@k@v04/70200089. so they have no way of changing themselves."'
51210: 'Will@r@v54/75400662."True.@k@v54/75400663. Changing yourself means changing your environment.@k@v54/75400664. ......That''s not easy to do."'
51211: 'Jessica@r@v04/70200090."So, my idea was to leave "who I am now" unchanged...@k@v04/70200091....and create another "self" to be the person I want to be."'
51212: 'Will@r@v54/75400665."You felt suffocated, forced to live the life of a rich family''s daughter,@k@v54/75400666. and you thought up a "self" that you wanted to be."'
51213: 'Jessica@r@v04/70200092."But I couldn''t do anything outlandish at home, of course.@k@v04/70200093. Nothing fun about having Mom yell at me all the time.@k@|@y@v04/70200094. ......So, I made my plan.@k@v04/70200095. At home, I would obediently do as my parents said,@v04/70200096. ......but I would also create a second "self" to do what I wanted."'
51214: 'Will@r@v54/75400667."At home, you do everything your parents tell you, and outside, you do what you want.@k@v54/75400668. That''s a good way to live.@k@v54/75400669. You should be proud."'
51215: 'Jessica@r@v04/70200097."Heheh, thanks...@k@v04/70200098. And, well, ......if there''s something you really want to be, and you really work for it, it''s easier to do than you''d think.@k@|@y@v04/70200099. I figured Maria was pretty much the same."'
51216: 'Will@r@v54/75400670."You think Maria''s doing the same thing when she gets excited and starts talking and talking?"'
51217: 'Jessica@r@v04/70200100."That''s the person Maria really wants to be,@k@v04/70200101. is how I think about it sometimes."'
51218: 'Will@r@v54/75400671."......As the youngest member of the family, she is adored, but not respected."'
51219: 'Jessica@r@v04/70200102."Every time she learns something, there''s always someone in the family who already knows it.@k@v04/70200103. She doesn''t get to show off her knowledge about anything.@k@v04/70200104. ......Whenever she does learn something new, we try to smile and praise her,@k@v04/70200105. ......but that might actually have hurt her."'
51220: 'Will@r@v54/75400672."So, Maria wanted to become an authority on something?"'
51221: '@rIt''s something that all young boys and girls, who want to shake off their childhood, think.'
51222: '@rIt''s not a bad feeling when you learn something new and your parents praise you.@k ......But when you realize that your parents already knew that thing, it sometimes feels like they''re talking down to you.'
51223: '@rWhen a kid learns their one-digit times table, their parents will probably praise them.'
51224: '@rHowever, inconsiderate parents will sometimes ask mean questions, like "then what is 11 times 11?"@k or "what is 16 times 16?"@k or something similar.'
51225: '@rIf that happens, the kid will lose his feeling of accomplishment and start to feel as though he could never surpass his parents...'
51226: 'Jessica@r@v04/70200106."So, it''s easy to guess why Maria got interested in the occult, something no one else knew about,@k@v04/70200107. and started learning more and more about it.@k@v04/70200108. ......I think the person Maria wants to be...@k@v04/70200109.is an authority on the occult who is respected by everyone."'
51227: 'Will@r@v54/75400673."And if she talked about the occult all the time during her everyday life, Rosa''d smack her.@k@v54/75400674. ......So, like you, she''s been hiding this other "self" most of the time."'
51228: 'Jessica@r@v04/70200110."That''s what I think she''s doing at times like this.@k@v04/70200111. ......Maybe I should say that this is her real self slipping through the cracks to cover up her normal self."'
51229: 'Jessica@r@v04/70200112."Actually, I''ve had some experience with that myself.@k@v04/70200113. ......I used to admire the image of a delicate, sheltered lady and wanted to seem more frail......so I''d pretend to cough a lot, and it sort of became a bad habit."'
51230: 'Will@r@v54/75400675."Because everyone would be nice to you if you started having coughing fits?"'
51231: 'Jessica@r@v04/70200114."Haha, no...... Whenever the conversation turned to something I didn''t like, or something that made me feel uncomfortable, I could do that to change the subject."'
51232: 'Will@r@v54/75400676."I see.@k@v54/75400677. And that''s another "self" you wanted to become."'
51233: 'Jessica@r@v04/70200115."Haha, I''d appreciate it if you didn''t tell anyone about that."'
51234: '@rThen, ......just what is...@k...the "other self" in Maria''s case?'
51235: '@rAn authority on the occult who can out-argue even adults?@k@rOr else, ......someone who converses and mingles with witches?'
51236: '@r......Either way, denying BEATRICE in front of Maria is clearly taboo.'
