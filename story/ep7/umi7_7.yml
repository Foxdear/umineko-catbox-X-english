51450: '@rAfter all, this is my victory, in a sense.'
51451: 'Jessica@r@v04/70200188.".........Hello?"'
51452: 'Maria@r@v13/70400261.''Uu! @v13/70400262. Hi, BEATRICE...!'''
51453: 'Jessica@r@v04/70200189."Huh?@k @v04/70200190.M-......Maria...?!"'
51454: '@rI don''t get it.'
51455: '@rDid I hear that wrong...?@k Why would Maria be calling here...?!'
51456: 'Jessica@r@v04/70200191."H-hello...?!"'
51457: 'Maria@r@v13/70400263.''Thanks for teaching me that fun song last time.@k@v13/70400264. In return, I''m gonna sing you a song, BEATRICE.@k@v13/70400265. I just learned this one!@k @v13/70400266.Uu!'''
51458: '@rThe voice, the intonation, the manner of speech—all of it clearly belonged to Maria.@k@rBut......what''s she talking about, all by herself...?'
51459: '@rMaria just kept on talking happily as I stood there, stunned and unable to interrupt.'
51460: '@rEventually, Maria started singing an old, familiar kids'' song that even I knew.'
51461: '@rI don''t...get it.'
51462: 'Jessica@r@v04/70200192."......Maria? Hello...?@k @v04/70200193.Wait a sec, stop singing...!@k @v04/70200194.What''s going on?@k @v04/70200195.I don''t get it...!@k @v04/70200196.Hello?!@k @|@y@v04/70200197.Ah—"'
51463: '@rThe voice, the lights—everything disappeared.@k@rIn the pitch-black, I couldn''t see anything, couldn''t tell what was happening.@k@rI don''t get it, what''s going on?!'
51464: 'Jessica@r@v04/70200198."What...@v04/70200199..........the hell...@v04/70200200..........was that......?"'
51465: '@rDoes being in darkness really slow us humans down so much...?'
51466: '@rI know it''s dark, ......but I really do have absolutely no idea what just happened.'
51467: '@r......What was that shuffling sound just now?@k I, I''m not sure... I can''t explain it.'
51468: '@rIt was a loud sound like someone crawling out of bed.'
51469: '@rI wouldn''t say something as non-committal as I "felt like" I heard it.@k I wouldn''t say something as vague as I "sensed a presence".@k I definitely heard it, right next to me, clearly.'
51470: '@rHowever, there was no change to the bed.@k@rNo one had been sleeping there in the first place, and the sheets were still perfectly straight.'
51471: '@rSomeone had crawled out of the bed,@w500. .........and had laughed in a creepy voice before leaving the room......@k ............That''s...@w500....what it felt like.'
51472: '@rFelt like?@k I''m here, and the bed''s right there.'
51473: '@rI''m not only in the same room, I''m right next to it.@k ......So, why am I so unsure about what happened just a few seconds ago?!'
51474: '@rI gripped the receiver, which had gone completely silent,@k .........and waited there alone, unable to move, in a quiet room that seemed exactly identical to the one I had first entered...'
51475: '@r............Huh?@k ............What............?'
51476: '@rIf nothing had changed since the beginning, ......I could just pretend that the last minute or so didn''t happen.'
51477: '@rHowever,@w333. ......if something had changed,@w166. ......that would be proof that something really did happen...'
51478: 'Jessica@r@v04/70200201."......The hell?@v04/70200202. ......Where''d...@v04/70200203.......it go......?"'
51479: '@rDid it fall to the floor...?@k No, it''s not there.@k ......No matter where I look, from whatever angle, ......it''s not there.'
51480: '@rThough the offering plate with the cookies and chocolate is still here,@w583. .........the thing they were being offered to,@k@|@y the doll, is gone.'
51481: 'Jessica@r@v04/70200204."......No way.................."'
51482: '@rThen, ......what just happened......?'
51483: '@rIs the BEATRICE-sama doll supposed to have cackled out loud and left the room...?'
51484: '@rNo, that crawling sound was too loud to have been made by a doll.'
51485: '@rIt was a noisy sort of sound, like a kid playing with a blanket and using it as a cape.'
51486: '@rThen, what......?'
51487: '@rIs that BEATRICE-sama doll...@w166.supposed to have turned into a human...@w333.......and then run cackling from the room...?'
51488: 'Jessica@r@v04/70200205."No......way....................."'
51489: '@rAfter that, nothing happened.@k@rThe doll alone disappeared, .........and nothing else changed.'
51490: '@rIn a VIP room that had remained completely unchanged and was filled only with the sound of wind and rain,@k ......I stood there, too shocked to move......'
51491: 'Will@r@v54/75400682."Did you ever find that doll?"'
51492: 'Jessica@r@v04/70200206."......I looked everywhere, even under the bed.@k@v04/70200207. I literally crawled in there looking for it.@k@v04/70200208. ......But I didn''t find it."'
51493: 'Will@r@v54/75400683."Just what do you think happened in that room?"'
51494: 'Jessica@r@v04/70200209."I don''t think it was actually "BEATRICE-sama''s curse".@k@v04/70200210. ......It might have been a prank done by the servants."'
51495: 'Will@r@v54/75400684."A prank?"'
51496: 'Jessica@r@v04/70200211."Maybe they recorded Maria''s voice on a cassette tape or something ahead of time.@k@v04/70200212. They then called at exactly 2 a.m. and pushed the play button.@k@v04/70200213. They could''ve cut the power at the breaker or something."'
51497: 'Jessica@r@v04/70200214."......Then, someone who had been hiding in the VIP room beforehand would make a creepy laugh, take the doll, and leave.@k@v04/70200215. .........If that was how it happened, everything does fit."'
51498: 'Will@r@v54/75400685."Doesn''t sound like you''re really convinced it happened that way."'
51499: 'Jessica@r@v04/70200216."Can you blame me?@k@v04/70200217. ......I mean, if that was just a prank to scare me, it was way too elaborate."'
51500: '@rThey made Maria sing beforehand and recorded it.'
51501: '@rThen, someone called the VIP room and replayed that recording.'
51502: '@rThen, someone waited until exactly the right time and tripped the breaker for the VIP room.'
51503: '@rTo turn off the power to the VIP room, you''d have to go down to the basement.@k ......There''s a breaker box down in the boiler room.'
51504: '@rThere''s no phone line down there, so you''d need a different person to play back Maria''s tape.'
51505: '@rAnd you''d need another person to hide in the VIP room and cackle before leaving.'
51506: '@rAnd......just how long would this last person have to hide in the VIP room beforehand...?'
51507: '@rHow long would they have to hide in the pitch-black VIP room—under the bed, for example—@kwaiting to scare Jessica, who might or might not come...?'
51508: 'Jessica@r@v04/70200218."......There''s no way it could be a witch''s curse.@k@v04/70200219. ......But still.@k@|@y@v04/70200220. Imagining that so many people planned everything down to the slightest detail...@k@v04/70200221.and waited for several hours in the darkness just to scare me...?@k@v04/70200222. To me, that''s even creepier......"'
51509: 'Will@r@v54/75400686."I agree.@k@v54/75400687. I''d much prefer a curse.@k@v54/75400688. ......Did you ask the servants about that later on?"'
51510: 'Jessica@r@v04/70200223."What''s the point? They''d just play dumb, of course.@k@v04/70200224. ......And there had to have been at least three of them...@k @v04/70200225.On that day, only Genji-san, Gohda-san, Kumasawa-san, and Shannon stayed the night.@k@v04/70200226. So three of those four helped out with that creepy prank?@k @v04/70200227.It doesn''t make sense...!@k @v04/70200228.That''s why......I couldn''t ask about it."'
51511: 'Will@r@v54/75400689.".............................."'
51512: '@rTrue, it had been a strange experience for her, but it wasn''t something completely impossible for humans to do.'
51513: '@r......Even so, it really must have been more unnerving to imagine a large number of people planning so carefully just to scare Jessica.'
51514: '@r......It''s no surprise that she found this scarier than BEATRICE''s curse.'
51515: 'Will@r@v54/75400690."Do you still believe the servants pulled a fast one on you?"'
51516: 'Jessica@r@v04/70200229.".........No.@k@v04/70200230. I probably......just freaked out and mistook what I saw and heard.@k@v04/70200231. The doll probably just fell somewhere, and I just had trouble finding it."'
51517: 'Will@r@v54/75400691."Are you trying to say you imagined the whole thing...?"'
51518: 'Jessica@r@v04/70200232."Other than the doll disappearing, there was no other proof that anything had changed.@k@v04/70200233. ......Later on, I talked to Maria, and she said she didn''t know anything about that song or the phone call.@k@v04/70200234. I don''t know if she was lying or not, of course.@k@v04/70200235. ......Anyway, what happened that night...@v04/70200236....is just something I thought happened...@v04/70200237....and there''s no proof of any kind."'
51519: 'Will@r@v54/75400692."That''s ironic.@k@v54/75400693. Even if you had met BEATRICE directly, you wouldn''t have been able to prove that either."'
51520: 'Jessica@r@v04/70200238."For a while, I was pretty rattled about it, ......but as time went on,@k@v04/70200239. I began to think that lightning or something had shut off the power for a second and spooked me,@k@|@y@v04/70200240. ......and maybe one of the trees in the garden fell while making rustling sounds, which I mistook for someone crawling out of bed because I was already scared."'
51521: 'Will@r@v54/75400694."And the laugh?"'
51522: 'Jessica@r@v04/70200241."Maybe some strange bird.@k@v04/70200242. ......Anyway, I might have misheard something to get that sound..."'
51523: 'Jessica@r@v04/70200243.".........I act tough, but it turns out I''m actually an unbelievable coward.@k@v04/70200244. ...That''s why I let my imagination get ahold of me.@k@v04/70200245. ......I decided to think about it that way......and kept firmly repeating it to myself to help me forget everything that happened that night."'
51524: 'Will@r@v54/75400695."So it all remains in darkness..."'
51525: 'Jessica@r@v04/70200246.".........People are actually pretty good at forgetting things if they try.@k@v04/70200247. ......Ever since that night, I feel uncomfortable every time I hear the word "BEATRICE".@k@v04/70200248. But I try hard to not let it show on my face."'
51526: 'Will@r@v54/75400696."...................................."'
51527: 'Jessica@r@v04/70200249."............That''s all.@k@v04/70200250. I can''t tell you any more than that."'
51528: 'Jessica@r@v04/70200251."It''s really embarrassing, so please don''t tell anyone.@k@v04/70200252. .........I don''t want them knowing what a huge chicken I was."'
51529: 'Will@r@v54/75400697."You got it.@k@v54/75400698. ......I have one last question."'
51530: 'Jessica@r@v04/70200253."About the VIP room?"'
