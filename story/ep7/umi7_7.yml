51414: '@r......So, while the doll was eerie enough by itself,@k ......psychologically, it was even more unnerving to think about how it must have been kept safe and worshiped in a place like this.'
51415: 'Jessica@r@v04/70200183."Stupid.@k@v04/70200184. ......Am I supposed to clap my hands together and say "please don''t curse me"?"'
51416: '@rJessica forced herself to look away from the bizarre doll.'
51417: '@r......She couldn''t bring herself to sit on a bed that wasn''t hers.@k@rThen again, she didn''t really feel like sitting down on a chair either.'
51418: '@rShe had lost any desire to sit on anything in this room.'
51419: '@rWandering about aimlessly,@k ......I peeked out the window through the gaps in the curtains to stare at the dark, rainy night.'
51420: '@r......What the hell am I doing?'
51421: '@rHanging about in the VIP room this late just because that fight with Maria is still eating at me...@k ......This is beyond stupid... I''m disappointed in myself.'
51422: '@rBEATRICE, huh...'
51423: '@rJust when did that strange witch start living in this mansion...?'
51424: '@r......Grandfather''s always yelling about BEATRICE.'
