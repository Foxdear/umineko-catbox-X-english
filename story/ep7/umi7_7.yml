51311: 'Gohda@r@v17/71700022."Milady, you mustn''t approach an ill-omened place without reason..."'
51312: 'Jessica@r@v04/70200167."Hold it, don''t you go calling my house ill-omened.@k@v04/70200168. Anyway, I''ve made up my mind.@k@v04/70200169. If you can''t give me your master key, there''s still that key for the VIP room, right?@k @v04/70200170.Let me borrow it."'
51313: 'Shannon@r@v15/70500091."............M-...Milady......"'
51314: '@rTo Jessica, it was their two expressions that felt more like an ill omen than anything else did.'
51315: '@rIt wasn''t the witch or the VIP room that felt foreboding to Jessica.@k It was them, Maria and the others who believed in witches.'
51316: '@rIn the end, Jessica forced them to agree, and she made them bring her the key to the VIP room...'
51317: 'Will@r@v54/75400681."A classic test of courage, to see if BEATRICE would really appear in the VIP room or not."'
51318: 'Jessica@r@v04/70200171."Pretty much.@k@v04/70200172. ......Still, I wonder why I was so stubborn about it.@k@v04/70200173. It must have been because of my fight with such a little girl."'
51319: '@r......Of course, the weather just had to be terrible on that particular night.'
51320: '@rTo be honest, I slightly regretted sticking my nose into something so pointless.'
51321: '@rBut I''d already said so much, and even borrowed the key from them.'
51322: '@rI couldn''t just go to Shannon the next day, let her ask me how it went,@k and answer "well, I got scared so I gave up,@w333. tehehe......"@w500. That''d just be pathetic.'
51323: '@rNormally, I go to sleep long before 2 a.m.'
