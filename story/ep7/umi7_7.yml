51302: 'Jessica@r@v04/70200159."Yeah, that''s it.@k@v04/70200160. Pretty cool.@k@v04/70200161. All the other stories are about people saying they heard or saw something they thought was BEATRICE, but this one isn''t.@k@v04/70200162. This one says that, if you go to the VIP room at two in the morning, you can actually meet BEATRICE-sama...!"'
