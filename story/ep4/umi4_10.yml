26389: '@rI had been trying to take a nap, ......but the boat really was shaking bad.'
26390: '@rI gave up on sleeping and went up onto the deck.@k@rI was welcomed by the shining sun and a strong sea breeze...'
26391: '@rUp on the deck, Amakusa was doing some stretches.'
26392: '@r......He probably has a lot of time on his hands too.@k@rIt''ll still take a while longer to reach Niijima.'
26393: '@rIt would only have taken on the order of half an hour by airplane, but there was the chance that the Sumaderas'' net extended over Niijima airport.'
26394: '@rThe harbor would probably be the same.@k For that reason, I had obtained a boat that would let me land while avoiding the harbor, with no questions asked.'
26395: '@rI''d bumped into a cheery boat captain,@k treated him with generosity, and he had decided to help me out, amused......'
26396: 'Ange@r@v11/42001087."Still going to be a while?"'
26397: 'Amakusa@r@v20/43000043."I just asked the captain, and it sounds like it''ll take a full two hours more.@k@v20/43000044. Well, beggars can''t be choosers."'
26398: 'Ange@r@v11/42001088.".........The weather sure is nice.@k@v11/42001089. Feels like I''ll burn."'
26399: 'Amakusa@r@v20/43000045."Going to read on the deck?@k @v20/43000046.You''ll damage your book."'
26400: '@rAmakusa apparently got that idea because I was clutching Maria onee-chan''s diary under my arm.'
26401: '@rI''d been reading it as I tried to fall asleep, which was why I had come back up still carrying it.'
26402: 'Amakusa@r@v20/43000047."How''s it going?@k@v20/43000048. Think you''ll be able to find the truth of Rokkenjima from Maria-san''s diary?"'
26403: 'Ange@r@v11/42001090."............Who knows.@k@v11/42001091. No matter how much I investigate what happened on that island, it won''t make for anything more than a theory.@k@v11/42001092. There''s no truth written in the message bottles or Onee-chan''s diary, just a fairy tale with a witch walking around.@k@v11/42001093. ......I''m stuck."'
26404: 'Amakusa@r@v20/43000049."Looks like you''re just going to have to bank on what you can get out of the relevant people on Niijima."'
26405: 'Ange@r@v11/42001094."I imagine the Witch Hunters have subjected them to endless questioning, so I''m pretty sure I won''t find any new facts."'
26406: 'Amakusa@r@v20/43000050."Hehhaha...!@k @v20/43000051.So even though your hopes are that low, you''re willing to spend a half-day trip on a boat to go to Niijima anyway! You really are fickle."'
26407: 'Ange@r@v11/42001095.".........It''s like a journey of self-satisfaction, so that I can say "I investigated".@k@v11/42001096. I''m not so naive as to seriously think that I can unlock the truth of twelve years ago."'
26408: 'Amakusa@r@v20/43000052."When you''ve finished with your self-satisfaction, what do you plan to do?"'
26409: 'Ange@r@v11/42001097."Who knows.@k@v11/42001098. Haven''t thought about it.@k@v11/42001099. .........I''ll go to Niijima, ask some questions of people related to all this.@k@v11/42001100. ...Then, after going to Rokkenjima in the end and leaving some flowers, my journey will be over."'
26410: '@r.........Several days had already passed since this journey began.'
26411: '@rAfter being told by BERNKASTEL on the roof of that building...@kto search for the truth of twelve years ago, I left on a journey akin to trying to grasp a cloud.'
26412: '@rAt the time, I felt something mystical about it, and I remember feeling as if I might be able to grasp some kind of miracle at the end of this journey.'
26413: '@r......But several days are enough to bring a person back down from that high.'
26414: '@rAs I stood on the roof of that skyscraper that day, my heart had nowhere left to go - it was completely dead.'
26415: '@r......Wanting from the bottom of my heart to be released from the cage of my body and rise into the sky,@k ......I crossed the fence in order to die.'
26416: '@rMaybe experiencing the desire to die and actually stepping forwards, throwing my body down...@kcaused some kind of mystical experience inside my head, making me think I had received a message from a witch.'
26417: '@r.........The more the excitement from jumping down lessened over time, and the more I came back to my senses, the more this journey lost its meaning.'
26418: '@rBut I''d never considered suspending this journey just because of that.'
26419: '@rIf I stopped this journey, it would mean acknowledging that the message from that witch was an illusion.'
26420: '@rAnd I felt as if that meant throwing away the promise the witch had made,@k and any chance that someone from my family might come back.'
26421: '@rSo, I''m continuing this journey because I want to believe in that illusion.'
26422: '@rI don''t seriously believe that this journey will change anything.@k@r......I''m even free to end it at any time.@k It''s up to me to choose where the final destination is.'
26423: '@rIn the end, this journey is only for my personal self-satisfaction......'
26424: 'Amakusa@r@v20/43000053."............Self-satisfaction, is it.@k@v20/43000054. It sounds bad when you say it out loud, but I think that actually, that''s life."'
26425: 'Ange@r@v11/42001101."......Heh.@k@v11/42001102. If that''s the answer you reached after crawling across the line between life and death in the mercenary business, that''s probably pretty deep."'
26426: 'Amakusa@r@v20/43000055."Don''t just laugh it off.@k@|@y@v20/43000056. What I''m trying to say is that there''s no self about it - in this world, the only one capable of satisfying you is yourself."'
26427: '@rAmakusa continued stretching as he spoke.@k@rIn an annoyingly eloquent way.'
26428: '@rHearing it told to me as though from a teacher made me instinctively want to resist, but what he was saying was extremely sensible.'
26429: 'Ange@r@v11/42001103.".....................@k@|@y@v11/42001104. ......That may be true."'
26430: 'Ange@r@v11/42001105."People work hard when they want to satisfy someone.@k@v11/42001106. ......In most cases, that someone is their parents.@k@v11/42001107. Children learn how to work hard because they want to be praised by their parents.@k@v11/42001108. .........Of course, that''s why I never learned."'
26431: 'Amakusa@r@v20/43000057."Sorry, that''s not what I intended to say."'
26432: 'Amakusa@r@v20/43000058."......What I want to say is that self-satisfaction is A-OK.@k@v20/43000059. No matter who praises you, it''s meaningless unless you yourself are satisfied.@k@v20/43000060. ......Turning it around, even if no one praises you, that doesn''t matter as long as you''re satisfied yourself."'
26433: 'Ange@r@v11/42001109.".........Self-satisfaction and self-improvement contradict each other, so we''re usually taught that the former is bad.@k@v11/42001110. Your argument is kind of a breath of fresh air."'
26434: 'Amakusa@r@v20/43000061."The anguish of the human world comes when you want to satisfy someone, you want recognition, but you don''t know where to put the effort.@k@v20/43000062. I had a time like that too."'
26435: 'Amakusa@r@v20/43000063."I wanted recognition, but I didn''t know what I wanted recognition for.@k@v20/43000064. And since I didn''t know what I was meant to put effort into, or how much, or even who I wanted to give me that recognition,@k@v20/43000065. I did a lot of crazy things."'
26436: 'Ange@r@v11/42001111."And the answer you reached......was self-satisfaction?"'
26437: 'Amakusa@r@v20/43000066."It sounds bad, but that''s how it is.@k@v20/43000067. Rich is the one who is content with what they are, they say."'
26438: 'Amakusa@r@v20/43000068.".........If I''ve decided this is the life I''m happy with, no one has any right to tell me any different.@k@v20/43000069. It''s the same for your life, and for this journey.@k@v20/43000070. No one has any right to object other than you yourself."'
26439: 'Amakusa@r@v20/43000071."You are the only one who determines the meaning and worth of your journey.@k@v20/43000072. If it turns out to have been a meaningful journey for you, then that''s more than enough."'
26440: 'Ange@r@v11/42001112."...........................@k@v11/42001113. .........I thought you were the kind of guy who never takes things seriously, but you really do say some weird things every once in a while.@k@v11/42001114. I''ll bet you think saying things like that every now and then will make you a hit with the ladies."'
26441: 'Amakusa@r@v20/43000073."You''ve got me all wrong.@k@v20/43000074. That''s not why I said it.@k@|@y@v20/43000075. .........It looks like you want to be alone.@k@v20/43000076_b. I''ll be over with the boat captain.@k@v20/43000077. Please, take your time."'
26442: '@rIt seemed Amakusa had decided I was in a bad mood.@k@r......Although I didn''t feel that way myself.'
26443: '@rMaybe he had just finished a set of stretches and wanted to cool off in the shade.'
26444: '@rThe sea winds were strong, but not enough to take the edge off the rays of the sun.'
26445: '@rAmakusa disappeared.@k Only I remained.'
26446: 'Ange@r@v11/42001115.".........Self-satisfaction is life, he says."'
26447: 'Mammon@r@v42/42700237."That''s just boring.@k@|@y@v42/42700238. Life is nothing without greed."'
26448: '@rI noticed that Mammon had suddenly appeared, her full hair streaming out in the wind by the prow of the ship.'
26449: 'Ange@r@v11/42001116."It''s true that a life of greed would be fun.@k@v11/42001117. But unlike you, Humans have a limited lifespan."'
26450: 'Ange@r@v11/42001118."If a person remains greedy for eternity, that means that they have desires even in the last moment before they die.@k@v11/42001119. Having desires means that there''s something they want.@k@v11/42001120. Something they don''t have, some way they aren''t complete."'
26451: 'Ange@r@v11/42001121."......I''m sure it''s tough to die when you can''t think of yourself as being fulfilled.@k@v11/42001122. So I''m sure self-satisfaction is actually necessary."'
26452: 'Mammon@r@v42/42700239.".........I see.@k@v42/42700240. Then beings with lifespans need to make that kind of compromise?@k@|@y@v42/42700241. Our masters always had very long lifespans, so I''ve never thought of it."'
26453: 'Ange@r@v11/42001123."I wonder if Humans live so that they can be satisfied.@k@v11/42001124. ......If so, to seek nothing is probably the easiest way to live.@k@|@y@v11/42001125. ...Yes, it makes sense why greed is one of the seven deadly sins."'
26454: 'Mammon@r@v42/42700242."*giggle*.@k@v42/42700243. Your praise honors me."'
26455: '@rApparently that counted as praise in Mammon''s eyes.@k@rShe turned and gave a graceful curtsy.'
26456: 'Mammon@r@v42/42700244."Ange-sama.@k@v42/42700245. Do Humans live so that they can be satisfied at the moment of their death?"'
26457: 'Ange@r@v11/42001126."......It must be pretty tough to be somehow incomplete at the moment of your death, right?"'
26458: 'Mammon@r@v42/42700246."If so, then Humans live only so that they can have a satisfying death.@k@v42/42700247. They live so that they can have a better death.@k@v42/42700248. They live to die."'
26459: '@r............Wow, that''s a hell of a thing to say.@k@r...Yes, I should have expected that from a demon stake.'
26460: '@rHowever, her words might be the truth.@k Humans suffer because they aren''t whole, and live only to be made whole.'
26461: '@rThat might be the same, in other words, as a desire to die - to die while whole.'
26462: 'Ange@r@v11/42001127."I have no argument against that.@k@|@y@v11/42001128. ......People live in order to be content.@k@v11/42001129. And they hope to die while still content.@k@|@y@v11/42001130. So, not knowing how to make yourself content, make yourself complete, is very tough."'
26463: 'Mammon@r@v42/42700249."How does a Human do that?@k @v42/42700250.Make their life complete."'
26464: 'Ange@r@v11/42001131.".........Receiving validation, acceptance.@k@v11/42001132. That they''re happy."'
26465: 'Mammon@r@v42/42700251."If it doesn''t matter who accepts you, then I''ll do it myself, if you like."'
26466: 'Ange@r@v11/42001133."Yes, that''s just it.@k@v11/42001134. .........People don''t know whose acceptance they need."'
26467: 'Mammon@r@v42/42700252."So, searching for that person to accept them is the journey of life?@k @v42/42700253.Hmmmm."'
26468: 'Ange@r@v11/42001135."It sounds strange, doesn''t it?@k@v11/42001136. Whether you find acceptance or not, it shouldn''t change your circumstances.@k@v11/42001137. ......And yet, if you find acceptance you''ll be whole, and if you don''t then you won''t."'
26469: 'Ange@r@v11/42001138."...It''s almost like the blue bird.@k@v11/42001139. ......Even though the blue bird is already in the cage, you can''t notice it, so you have to go out on a journey searching everywhere."'
26470: 'Mammon@r@v42/42700254."What the heck.@k@|@y@v42/42700255. Kyahhahaha.@k@v42/42700256. Human lives sure are stupid."'
26471: 'Ange@r@v11/42001140."That''s right.@k@v11/42001141. Amakusa really hit on something.@k@|@y@v11/42001142. ......Rich is the one who is content with what they are...was it?@k@v11/42001143. I don''t know where that proverb came from, but it''s deep."'
26472: 'Ange@r@v11/42001144."......In short, if you won''t be fully content unless you have someone''s acceptance, that''s the same as not being able to accept yourself.@k@v11/42001145. ......Turns out the ultimate self-fulfillment begins with self-acceptance."'
26473: 'Mammon@r@v42/42700257."Well, of course.@k@v42/42700258. Because if you can become aware that you''re fulfilled, there''s no need for anyone else''s acceptance.@k@v42/42700259. Just by taking notice of that small little thing, a Human''s foolish lifelong journey can be ended easily."'
26474: 'Mammon@r@v42/42700260."Then they can spend the rest of their life effectively, playing and having a good time.@k@v42/42700261. A Human''s life is so ridiculous, kyahhahahaha!"'
26475: '@rMammon''s choice of words was bad, but it was surely the truth.'
26476: '@rIf most of a Human''s life...@kis a journey wishing for someone''s acceptance so that they can achieve a satisfied death...'
26477: '@r.........then the moment they realize that the person to accept them is not someone else, but them themselves, they can end that pointless journey.'
26478: '@rHumans who have finished that journey can probably spend the rest of their lives as they wish with their heads held high.'
26479: '@r......How sublime, how praiseworthy would that be.'
26480: 'Ange@r@v11/42001146."You know,@k@v11/42001147. it seems Amakusa''s on pretty bad terms with his parents.@k@v11/42001148. ......Makes sense, right?@k@v11/42001149. Amakusa''s in the kind of trade that any sane parent would want their kid to wash his hands of."'
26481: 'Mammon@r@v42/42700262."Why does it matter?@k @v42/42700263.If he''s enjoying it."'
26482: 'Ange@r@v11/42001150.".........Exactly.@k@v11/42001151. That''s what it comes down to in the end.@k@v11/42001152. Your worth as observed by others doesn''t matter."'
26483: 'Ange@r@v11/42001153."If your existence is firmly accepted by you yourself, that''s enough.@k@v11/42001154. ......If you can live with confidence in yourself, surely you can accept and find satisfaction in any kind of lifestyle."'
26484: 'Ange@r@v11/42001155."I''m sure Amakusa will eventually eat a stray bullet on the battlefield and get seriously injured.@k@v11/42001156. ...He might even die."'
26485: 'Ange@r@v11/42001157."But I don''t think Amakusa will think of it as unfair.@k@v11/42001158. I''m sure he''d cackle about how that too is life."'
26486: 'Mammon@r@v42/42700264."What a great way to live.@k@v42/42700265. I''m enchanted."'
26487: 'Ange@r@v11/42001159."......Pitiful Humans who can''t accept themselves...@k@v11/42001160.wander about searching for it their whole lives, doing nothing but grumbling and complaining, unable to come to terms with anything, ultimately dying while still unfulfilled."'
26488: 'Ange@r@v11/42001161."......How pitiful.@k@v11/42001162. Compared to people whose lives drag on without any purpose,@k@v11/42001163. Amakusa is more likely to eventually die by the roadside, but I think he''s much more noble for living his life with his chest stuck out."'
26489: 'Mammon@r@v42/42700266."Maybe the enlightened are the winners in life?@k @v42/42700267.If you can come to that realization even a little sooner, you''ll be able to put that much more of your life to good use."'
26490: '@r.........At those words of Mammon''s,@w500. ......I finally came to terms with a certain fact.'
26491: '@rI had......described her as an abnormal kid, a little strange.'
26492: '@rHowever,@w500. ......that wasn''t the case.'
26493: '@rShe had simply...@w583.......finished that journey faster than anyone else, and taught herself to keep her own chin up and live with confidence.'
26494: 'Ange@r@v11/42001164.".....................Maybe that''s what made Maria onee-chan...so amazing.@k@|@y@v11/42001165. She had already reached that point at the age where she was only just about to begin elementary school."'
26495: '@rOther people like us, looking at her life from the outside, couldn''t call it happy by any standard.'
26496: '@rBut even though such days were engraved in her diary,@k ......the entries always finished up by saying it was a happy day.'
26497: '@rEven though you can catch glimpses of her mother''s lack of love for her,@k in spite of that, she believed that her mother did love her.'
26498: '@rThe mother''s love that didn''t exist, she created herself, filling her world with love.'
26499: '@rOthers observed her as an unfulfilled, pitiful girl,@k ......but she told herself that she was fulfilled, and accepted herself how she was.'
26500: '@rAnd so, she was happy that way.'
26501: '@rIt''s easy to observe that as something pitiable and sad.@k But to her, that was an outsider''s opinion, and didn''t matter in the slightest.'
26502: '@rThe only important thing was whether or not this was happiness to her.'
26503: '@rIt''s just like how, when people who live in the city point to the lifestyles of those in the country,@k and lament the inconvenience and feel sympathy for them, it''s really just misplaced kindness.'
26504: '@rIf those who live there are satisfied with what they have, that''s more than enough.'
26505: 'Ange@r@v11/42001166.".........I''ve finally realized something.@k@v11/42001167. ...I realized it just now.@k@|@y@v11/42001168. ......I did something horrible to Maria onee-chan.@k@v11/42001169. .........And to all of you, and Sakutarou as well, on that day."'
26506: 'Mammon@r@v42/42700268."................................."'
26507: 'Ange@r@v11/42001170."The question of whether magic exists, or not.@k@v11/42001171. ......That''s not up to other people to decide."'
26508: 'Ange@r@v11/42001172."It''s up to you yourself.@k@v11/42001173. Whether magic exists to Maria onee-chan is a problem for Maria onee-chan to decide, and not for me."'
26509: 'Ange@r@v11/42001174."......And yet, when I was young, I said it, that day.@k@v11/42001175. I told her there''s no way magic exists, ......and I hurt her."'
26510: '@rTo me, magic doesn''t exist - but that''s my world.@k@rDenying Onee-chan''s world as well just because of that was totally barking up the wrong tree.'
26511: 'Ange@r@v11/42001176."Mariage Sorciere is the witches'' alliance Maria onee-chan created.@k@v11/42001177. I was invited into that, and invited to become a witch with her."'
26512: 'Ange@r@v11/42001178."I thought it was a fun new game, and I went along with it for a while.@k@v11/42001179. ......But, because of the cruelty of youth,@k@v11/42001180. I got tired of it half-way through.@k@v11/42001181. And then......with sharp words, I tore her pure and innocent heart apart."'
26513: 'Ange@r@v11/42001182."......At that time, we must have gotten into a huge fight.@k@v11/42001183. I forgot about it right away, but it was unforgettable for her.@k@v11/42001184. ......After all, to her, magic was a natural power that emphatically existed,@k@v11/42001185. and she believed that she''d be able to share that with me."'
26514: 'Ange@r@v11/42001186."......Magic, to Maria onee-chan,@k@v11/42001187. was a power by which she could give the world a happy interpretation, ......no, which could make everything happy - it truly was a magical power.@k@v11/42001188. She just wanted to share that with me too."'
26515: 'Ange@r@v11/42001189."The young me tore those feelings apart.@k@v11/42001190. ......So she closed herself up in a shell, believing that no one could understand magic with her."'
26516: 'Mammon@r@v42/42700269.".........If so, then Lady MARIA''s life-journey wasn''t over after all.@k@v42/42700270. If she had accepted herself, there would be no need for her to feel down just because you denied her."'
26517: 'Ange@r@v11/42001191."Onee-chan was young.@k@v11/42001192. She still hadn''t reached the same kind of philosophical viewpoint as Amakusa.@k@v11/42001193. ......Ahh, and that explains it perfectly.@k@v11/42001194. Why the witches'' alliance called Mariage Sorciere was necessary."'
26518: '@r -  - An alliance where each accepts that the other is a witch.'
26519: 'Ange@r@v11/42001195."...That''s right - I''m pretty sure that was the first article in the agreement of Mariage Sorciere.@k@v11/42001196. ......Witches of the alliance must accept each other and respect each other.@k@v11/42001197. That is the deepest and the only meaning of the witches'' alliance......"'
26520: '@rMaria onee-chan wanted to share with me the secret laws for making the world happy, called magic.'
26521: '@rBut I was young.@k And she was too.'
26522: '@r......I hurt her with innocent cruelty.'
26523: 'Ange@r@v11/42001198.".........On that day, I said it, ...those reckless words.@k@v11/42001199. To all of you and Sakutarou.@k@v11/42001200. I said there''s no way you exist."'
26524: 'Mammon@r@v42/42700271."I''m offended.@k@v42/42700272. We accept that we exist ourselves.@k@v42/42700273. We''re not like Humans, with their souls half-asleep.@k@v42/42700274. ......''I think, therefore I am''."'
26525: 'Mammon@r@v42/42700275."Whether you accept or deny magic, the existence of the magic called the Seven Stakes of Purgatory...is therefore a fact.@k@v42/42700276. ......As long as we accept ourselves, to borrow your words."'
26526: 'Ange@r@v11/42001201."It truly would be violence for another person like me to deny that.@k@|@y@v11/42001202. .........I''m sure that would be like having your true mother yell "I wish you had never been born",@k@v11/42001203. no, "get out of my life"."'
26527: '@r......Even after being slammed by all those words,@k ......Maria onee-chan''s magic...@w583.......made her believe in her mother''s love.'
26528: '@rSakutarou, her magic friend, always encouraged her.'
26529: '@r......He kept saying that her mother loved her, that she was coming home late because of her work,@k and that she would definitely bring back a present.'
26530: '@rEven after Maria learned the fact that it really wasn''t because of work, magic still kept her believing that.'
26531: '@rSo by believing that her mother loved her, by accepting herself,@k she filled her world with love and peace and serenity, ......and established it perfectly.'
26532: 'Ange@r@v11/42001204."What happened twelve years ago, ...what happened to my family.@k@|@y@v11/42001205. ......This was...not a journey to search for that."'
26533: 'Mammon@r@v42/42700277."............Then what is this journey?"'
26534: 'Ange@r@v11/42001206."It was a journey......to apologize to Maria onee-chan for what happened that day."'
26535: 'Mammon@r@v42/42700278.".............................."'
26536: 'Ange@r@v11/42001207."I don''t know why, but that''s what I think.@k@v11/42001208. ......If I hadn''t hurt her that day,@k@v11/42001209. .........the incident twelve years ago might not have occurred.@k@v11/42001210. ......That''s what I think."'
26537: '@rI have no basis for it.@k I don''t have a clue how hurting Onee-chan would be connected to that mysterious incident several years later.'
26538: '@rBut for some reason, I can''t imagine that there is no connection.'
26539: '@rA witch caused that incident.'
26540: '@rAnd the culprit is the Golden Witch, BEATRICE.'
26541: '@rAnd BEATRICE was part of the Mariage Sorciere Alliance of Witches.'
26542: '@rI had horribly hurt the other witch of that alliance.'
26543: '@rI had hurt her by saying that magic doesn''t exist.'
26544: '@r.........And that''s why, several years later, an inexplicable crime by a witch occurred,@k and that two-day period which can''t be explained with anything but magic was thrust in my face via a message bottle.'
26545: 'Ange@r@v11/42001211."......I''m sure that I''m not unrelated.@k@|@y@v11/42001212. .........I don''t know.@k@v11/42001213. It could be chance, it could be fate.@k@v11/42001214. .........For some reason, I''ve just started thinking that way on this journey."'
26546: 'Mammon@r@v42/42700279."And your basis?"'
26547: 'Ange@r@v11/42001215."None.@k@v11/42001216. It''s just what I''m thinking."'
26548: 'Mammon@r@v42/42700280."Hmmmm......@k@v42/42700281. The Japanese sure are interesting.@k@v42/42700282. Even if they''re the victim, they feel as though they did something wrong, and apologize for no reason."'
26549: 'Mammon@r@v42/42700283."......I could understand if you said "I hate BEATRICE-sama for stealing my family!" or something,@k@v42/42700284. but you really are an odd one, feeling guilty for no reason and apologizing."'
26550: 'Ange@r@v11/42001217."Of course I hate BEATRICE.@k@v11/42001218. I couldn''t continue this journey without that feeling."'
26551: 'Ange@r@v11/42001219."But it''s alright for me to find another purpose to this journey.@k@v11/42001220. There''s nothing wrong with me adding the goal of apologizing for past sins onto this journey for revenge on a witch of twelve years prior.@k@v11/42001221. I can at least go to Rokkenjima, apologize for my reckless remarks, and offer flowers."'
26552: 'Ange@r@v11/42001222."......No, .........there''s something better than flowers.@k@v11/42001223. And I think that would be more fitting for Onee-chan."'
26553: '@rI stood up, and, ignoring my hair being blown about by the sea breeze, I concentrated my mind......'
26554: '@rI lifted my palms up to the height of my head, ......and imagined a vast space......'
26555: 'Mammon@r@v42/42700285."............Ange-sama..............."'
26556: 'Ange@r@v11/42001224."......Quiet.@|@y@k@v11/42001225. ........................"'
26557: 'Ange@r@v11/42001226."......Come, arise.@k@v11/42001227. ......I am the witch apprentice, ANGE BEATRICE.@k@v11/42001228. ......Though I was excommunicated, I was once a member of the same alliance, and you are dearly missed furniture who played with me.@k@v11/42001229. Answer to my call........."'
26558: '@rIt was hard to tell in the middle of the day, but a faint blue light gathered around the palms of my hands.'
26559: '@r.........Then,@w583. .........I revived Sakutarou''s form.'
26560: '@rIt truly was long-missed, that figure.'
26561: '@rHis cute ears, his bright-red scarf.'
26562: '@r......It came off easily, so Onee-chan faithfully re-wrapped it all the time, didn''t she...'
26563: 'Mammon@r@v42/42700286."......Sakutaro......@k@v42/42700287. ......Recognize us?@k @v42/42700288.Do you know who we are...?"'
26564: 'Sakutarou@r@v33/44200406.''...Uryu......?@k @|@y@v33/44200407.Uryu......?@k @v33/44200408.Mammon...?@k @v33/44200409.Ange.........?'''
26565: '@rWith a sleepy face, as though waking up from a long slumber, Sakutarou looked all around him as he spoke.'
26566: 'Ange@r@v11/42001230."It''s been a long time, ......Sakutarou.@k@v11/42001231. I''m pretty sure this is the first time I''ve summoned you with my own power.@k@v11/42001232. ......And now, I''m the only one who can."'
26567: 'Sakutarou@r@v33/44200410.''..................Uryu......'''
26568: '@rThose words might have been a bit cruel.@k@rSakutarou''s face clouded over...'
26569: 'Ange@r@v11/42001233."In the past, I denied you.@k@|@y@v11/42001234. .........Now that I have summoned you,@v11/42001235. ......that means that I have accepted your existence."'
26570: 'Sakutarou@r@v33/44200411.''.........Is it okay......?@k @v33/44200412.Is it okay...for me to be summoned into your world......?'''
26571: '@rHis eyes were slightly frightened.'
26572: '@r......It was only natural.@k I, who had played with him like a friend before,@k had one day suddenly denied him and tried to burn him with the anti-magic toxin.'
26573: '@rIt was only natural that he was scared......'
26574: 'Ange@r@v11/42001236."I apologize.@k@v11/42001237. For that day.@k@v11/42001238. .........To you too, Mammon.@k@v11/42001239. And to the rest of you."'
26575: '@rAt some point, ......the rest of the Seven Sisters had gathered on the deck.'
26576: '@rNo, they are there at all times.@k Always by my side.'
26577: '@rAs long as I accept that it''s okay for them to be there, they will appear anytime.'
26578: 'Ange@r@v11/42001240."You certainly do exist.@k@v11/42001241. Lucifer.@k@v11/42001242. And Leviathan.@k@v11/42001243. And Satan.@k@v11/42001244. And Belphegor.@k@v11/42001245. And Mammon.@k@v11/42001246. And Beelzebub.@k@v11/42001247. And Asmodeus.@k@v11/42001248. ......And Sakutarou too."'
26579: 'Lucifer@r@v38/42300051."......Is that alright?@k @v38/42300052.Ange-sama, you are one who is challenging BEATRICE-sama.@k@v38/42300053. ...Is it alright for one in a position of denying witches to accept us?"'
26580: 'Ange@r@v11/42001249."About whether magic exists or not in my world, sorry, but let me put that question on hold.@k@v11/42001250. It''s not like I myself have accepted the existence of magic."'
26581: 'Leviathan@r@v39/42400029."......Yet you accept us? How do you explain that contradiction?"'
26582: 'Ange@r@v11/42001251."Because magic exists for people who believe.@k@v11/42001252. Even if I don''t.@k@v11/42001253. If someone believes, then magic will exist in that person''s world."'
26583: 'Ange@r@v11/42001254."That will not be interfered with in any way, whether I believe in magic or not.@k@v11/42001255. No, it must not be interfered with."'
26584: 'Ange@r@v11/42001256."That person just needs to hold their head up high and believe in their own magic.@k@v11/42001257. And I will accept that.@k@v11/42001258. So it isn''t strange at all for you guys to exist."'
26585: 'Satan@r@v40/42500049.".........That''s quite the rationalization...but, an interesting interpretation, I would say."'
26586: 'Belphegor@r@v41/42600045."What you''re saying, Ange-sama, is probably a Devil''s Proof."'
26587: 'Ange@r@v11/42001259."A Devil''s Proof......?"'
26588: 'Beelzebub@r@v43/42800050."After all!@k @v43/42800051.To prove the existence of demons, you just need to bring one with you..."'
26589: 'Asmodeus@r@v44/42900036."But denying the existence of demons is impossible!"'
26590: 'Mammon@r@v42/42700289."Kyahha!@k @v42/42700290.And we are here.@k@v42/42700291. That means that whether Ange-sama believes in magic or not, our existence is unshakable."'
26591: 'Sakutarou@r@v33/44200413.''......Uryu?@k @|@y@v33/44200414.The anti-magic toxin...@v33/44200415..........is disappearing...@v33/44200416....from Ange......'''
26592: 'Mammon@r@v42/42700292."Y-you''re right......@k@v42/42700293. ......But she''s in a position of denying magic......so why......?"'
26593: 'Ange@r@v11/42001260."That''s probably......@k@v11/42001261.......because I learned respect and acceptance.@k@|@y@v11/42001262. Now, ......I might be able to understand...@k@v11/42001263....the depths of Maria onee-chan''s magic......and BEATRICE''s."'
26594: '@rIn the past, I insisted that I didn''t believe in things like magic,@k that something like that couldn''t exist - I acted like I had my eyes tightly shut and couldn''t see anything.'
26595: '@rBut now I''m different.@k I get the feeling I can look right at the thing called magic, and close in on its true nature......'
26596: 'Satan@r@v40/42500050."......How frustrating.@k@v40/42500051. It''s truly rare to find a Human so free of the anti-magic toxin in this day and age.@k@v40/42500052. And she has such an uncommon genius for being a witch..."'
26597: 'Leviathan@r@v39/42400030."That''s right.@k@v39/42400031. ......If Ange-sama tried to become a witch now,@k@v39/42400032. ......she could grow to be a Great Witch, maybe even at BEATRICE-sama''s level."'
26598: 'Belphegor@r@v41/42600046."Even so, she is our master, and has accepted our existence.@k@v41/42600047. ......Most likely, Ange-sama will be our final master.@k@v41/42600048. Let us think of this as our final service, and apply ourselves to the fullest."'
26599: 'Beelzebub@r@v43/42800052."......Bleghh.@k@v43/42800053. I just can''t sta~nd that Ange-sama still doesn''t believe in magic herself."'
26600: 'Asmodeus@r@v44/42900037."......Ange-samaaa, please believe in magic too~.@k@v44/42900038. Feels like a waste to finally have a master and have it not be a wi~tch."'
26601: 'Mammon@r@v42/42700294."Even though you have outstanding talent which could make you one of the greatest of witches, your goal is to slay them.@k@v42/42700295. It''s such a shame."'
26602: 'Mammon@r@v42/42700296."......Well, that''s her life, her way of living,@k@v42/42700297. and if that''s the way she''s decided her world is going to be, there''s nothing we can achieve by complaining."'
26603: 'Ange@r@v11/42001264."Thanks for understanding me.@k@v11/42001265. Yeah, whether magic exists to me or not,@k@v11/42001266. that''s up to me to decide.@k@v11/42001267. Whether magic actually does exist somewhere in the world or not, you see?"'
26604: '@rWhen I think about it, the world is so vast, ......and yet so small.'
26605: '@rBillions of people live on the Earth.@k@rBut I probably won''t meet even one percent of those people.'
26606: '@rEven so, I will speak of the world.@k@rWithout knowing even one percent of the world - I will speak of "my world".'
26607: 'Ange@r@v11/42001267_1."I''m not qualified to deny the laws of a world I don''t know.@k@v11/42001267_2. ......So just because magic doesn''t exist in my world, I can''t deny that magic exists in a world I don''t know."'
26608: 'Ange@r@v11/42001267_3."That makes it a true Devil''s Proof.@k@v11/42001267_4. No, maybe it''s more like "when in Rome, do as the Romans do"."'
26609: '@rI can be confident in the world I know.@k So even if my world is denied by a complete stranger who doesn''t know a thing about it, that''s nothing to worry about.'
26610: '@rAnd in the same way, just because I don''t know another world,@k that doesn''t make me qualified to deny it.'
26611: 'Ange@r@v11/42001267_5."Which is why,@k@v11/42001267_6. regardless of whether there is magic in my world or not,@k@v11/42001267_7. ......I cannot deny the magic Maria onee-chan taught me."'
26612: 'Sakutarou@r@v33/44200417.''Uryu!@k @v33/44200418.After all, even if you''ve never seen it,@k@v33/44200419. ......magic exists!'''
26613: 'Ange@r@v11/42001268."Yes.@k@v11/42001269. That''s why, as I''ve already said,@k@v11/42001270. ......your existence, as friends of the Mariage Sorciere Alliance of Witches,@k@v11/42001271. cannot be denied by me or anyone else."'
26614: '@rI proclaimed the most important part again.'
26615: '@r............Even though the sea breeze and the crashing of the waves were noisy, it was a time of silence.'
26616: '@rBoth Sakutarou and the Seven Sisters of Purgatory......reflected upon my words.'
26617: '@rAnd, probably, I did too.'
26618: '@rDoes magic exist or not - @k@rDo witches exist or not - '
26619: '@rI reflected on the fact that, while ignoring what the answer was within my world, ......I had declared openly that I would accept their existence, despite it being a contradiction.'
26620: 'Sakutarou@r@v33/44200420.''Thank you, ......Ange.'''
26621: 'Belphegor@r@v41/42600049."If you will accept that much, perhaps one day, witches could also - @k@|@y@v41/42600050. ...No, that was a foolish question.@k@v41/42600051. You already have a clear answer to that question."'
26622: 'Ange@r@v11/42001272."Sorry.@k@v11/42001273. I do accept that witches might exist somewhere in this world.@k@v11/42001274. But my world will not waver."'
26623: 'Mammon@r@v42/42700305."......You won''t accept witches or magic.@k@v42/42700306. You''ll definitely expose the truth of Rokkenjima.@k@|@y@v42/42700307. ......Right?"'
26624: 'Ange@r@v11/42001275."Yes.@k@v11/42001276. That is my world.@k@v11/42001277. Even if a witch really does exist, I won''t accept her in my world.@k@v11/42001278. No matter how much that witch tries to court me."'
26625: 'Lucifer@r@v38/42300054."Your position is to slay witches.@k@|@y@v38/42300055. ......And I now understand well that you have not the slightest wavering in that feeling!"'
26626: 'Lucifer@r@v38/42300056."We are your furniture, the Seven Sisters of Purgatory...!@k @v38/42300057.We will always be by your side.@k@v38/42300058. We will always be waiting for the day that we can be useful...!"'
26627: 'Leviathan@r@v39/42400033."Although, since you don''t believe in magic, we can never be anything more than someone to talk to."'
26628: 'Satan@r@v40/42500053."That''s enough for now.@k@v40/42500054. We''ve been left room to exist.@k@v40/42500055. For that alone, we should thank and accept Ange-sama."'
26629: 'Beelzebub@r@v43/42800054."In short!@k @v43/42800055.All of uuuuus..."'
26630: 'Sakutarou@r@v33/44200421.''Can be together again......@k@|@y@v33/44200422. Uryuu!!'''
26631: 'Asmodeus@r@v44/42900039."Kyaaah!!@k @v44/42900040.Sakutaroo!@k @v44/42900041.Let me fluffle youuuuuuuuu~!!"'
26632: '@rAs Sakutarou was overcome with emotion and tears came to his eyes, the Seven Sisters closed in and mobbed him.'
26633: '@r......They were also celebrating a long-awaited reunion.'
26634: '@rBecause they were granted permission to exist, they can exist here without doubt.'
26635: '@rNo - they can exist even if I don''t permit it.'
26636: '@rBecause I accepted them, they showed their reunion''s joy to me as well.'
26637: '@rAs I watched over that scene, .........I reflected on the meaning of this journey of mine.'
26638: 'Ange@r@v11/42001279.".........I wonder if everyone will forgive me this way."'
26639: 'Mammon@r@v42/42700308."You''ve done enough.@k@v42/42700309. We are furniture.@k@v42/42700310. Just being summoned,@k@v42/42700311. just being allowed to be by your side makes us happy."'
26640: 'Sakutarou@r@v33/44200423.''Uryu...!@k @v33/44200424.Ange, thank you very much......!'''
26641: 'Ange@r@v11/42001280."......Come to think of it, why was I able to summon Sakutarou?@k@|@y@v11/42001281. ......No, it''s the other way around.@k@v11/42001282. Why wasn''t Onee-chan able to summon Sakutarou?"'
26642: '@rMaria onee-chan had despaired, thinking that Sakutarou had died.'
26643: '@rWhich told me that she hadn''t been able to summon him like this anymore.'
26644: '@rIn the past, Onee-chan said it was more advantageous in a summoning to have a vessel.'
26645: '@rHowever, a vessel is like training wheels, and it shouldn''t be absolutely necessary.'
26646: '@r......In other words, even if the stuffed animal lion that was Sakutarou''s vessel didn''t exist, it should have been possible to summon him.'
26647: '@r......In fact, for that matter,@k it''s a little doubtful whether summoned beings even have the concept of life and death.'
26648: '@rMoreover, Sakutarou was an especially important friend to Maria onee-chan.'
26649: '@rShe should have been able to strive hard to summon him one more time.'
26650: '@rIt certainly was sad that the original stuffed animal vessel had been torn apart,@k but why was he "dead", and why couldn''t she summon him again......?'
26651: 'Sakutarou@r@v33/44200425.''...That''s because...@v33/44200426.at that time, Maria saw my stuffed animal get torn,@k@v33/44200427. and she decided@v33/44200428. that I had died.'''
26652: 'Mammon@r@v42/42700312."It''s the same as the existence of magic.@k@v42/42700313. ......If, in Lady MARIA''s world, it becomes a fact that Sakutarou died,@k@v42/42700314. then Sakutarou cannot exist in her world."'
26653: 'Sakutarou@r@v33/44200429.''............Uryu......'''
26654: '@rThe shock of having her beloved stuffed animal torn apart...@khad left a wound in her heart serious enough to prevent her from ever again summoning her irreplaceable close friend.'
26655: '@rIn Maria onee-chan''s eyes, Sakutarou had died.'
26656: '@rSo even if Sakutarou could exist like this to me, he could not exist before her.'
26657: 'Sakutarou@r@v33/44200430.''I......was always together with Maria......@k@v33/44200431. ......As she cried, I was there the whole time right beside her, telling her not to cry......@k@v33/44200432. ......But my form, my voice, ......nothing of me would reach her......'''
26658: '@rSakutarou hung his head, looking sad.'
26659: 'Ange@r@v11/42001283."......After that incident, the nature of Mariage Sorciere rapidly began to change.@k@v11/42001284. Before then, the alliance was a peaceful thing."'
26660: 'Ange@r@v11/42001285."But after the incident, it grew full of shadier things, focusing on how to curse people you hate.@k@v11/42001286. ......Onee-chan''s diary began to show a clear change."'
26661: '@rA diary is a mirror that reflects one''s heart as it is.'
26662: '@rIt probably showed the personality called Maria die,@k and be reborn as the evil witch personality MARIA.'
26663: '@rAs she filled the diary with hatred and sadness, ......her heart surely was not fulfilled.'
26664: '@rBecause she wasn''t fulfilled, she had no choice but to fill it with hatred and sadness.'
26665: '@rAnd while still unfulfilled, she met with death.'
26666: '@r......I wonder if her unfulfilled soul has a hole opened in its chest from sadness even now,@k and continually wanders, tears dripping down and calling Sakutarou''s name......'
26667: '@r.................................'
26668: 'Ange@r@v11/42001287."...............You......are needed by Onee-chan."'
26669: 'Sakutarou@r@v33/44200433.''Uryu.........'''
26670: 'Ange@r@v11/42001288."What can I do to revive you in Maria onee-chan''s world?@k @v11/42001289.If I can learn how to do that, I''ll be able to save Onee-chan.@k@v11/42001290. ......That is the method of atonement I am tasked with.@k@v11/42001291. What can be done to revive you?"'
26671: 'Sakutarou@r@v33/44200434.''......My vessel had a very important meaning to Maria......'''
26672: 'Ange@r@v11/42001292."The vessel.@k@v11/42001293. ......So, if we could revive the lion stuffed animal..."'
26673: 'Sakutarou@r@v33/44200435.''But......@k@v33/44200436. ......Mama Rosa made my stuffed animal herself, so only Mama Rosa can make it......'''
26674: '@rEven inside the diary, Maria onee-chan had asked this of BEATRICE, and had been refused for the same reason.'
26675: '@rThe magical significance of a stuffed animal being unique and handmade is very large.'
26676: '@rThen, if we could make the same thing once more......'
26677: '@rBut Aunt Rosa is already gone from this world.@k@rWe can never make the same thing again.'
26678: 'Ange@r@v11/42001294."......Was there ever another identical stuffed animal made, or anything like that?"'
26679: 'Mammon@r@v42/42700315."He is a stuffed animal made for Lady MARIA''s birthday present, and is the only one in the world.@k@v42/42700316. ......A handmade and unique vessel.@k@v42/42700317. That''s why it conceals a great magical power."'
26680: 'Mammon@r@v42/42700318."And......if lost, it will never be obtained again.@k@v42/42700319. It will not revive..."'
26681: 'Sakutarou@r@v33/44200437.''.........Uryu.........'''
26682: '@r......Maria onee-chan knew that,@k so when she saw that stuffed animal, unique in the world, be torn apart,@w500. .........she despaired.'
26683: '@rBecause it was a stuffed animal unique in the world,@k and it permitted her no compromises such as simply buying another, ......she despaired from the bottom of her heart......'
26684: 'Ange@r@v11/42001295."......But Sakutarou is right here.@k@v11/42001296. Even without a vessel, he''s here.@k@v11/42001297. I accept that, and so he firmly exists in my world."'
26685: 'Ange@r@v11/42001298.".........Even if Maria onee-chan doesn''t accept him, that fact cannot be denied.@k@v11/42001299. Right...?"'
26686: 'Mammon@r@v42/42700320."Logically, that''s true,@k@v42/42700321. ......but I think using the same logic to make Lady MARIA accept him could be difficult."'
26687: 'Sakutarou@r@v33/44200438.''......Maria.........@k@v33/44200439. ......I''m not dead...@k@v33/44200440. I''m right here.........@k@v33/44200441. ......Uryu......'''
26688: 'Ange@r@v11/42001300."I''m sure that on Rokkenjima,@k@v11/42001301. ......I''ll be able to be reunited with Maria onee-chan.@k@v11/42001302. And, ......no matter what, I''m going to revive you inside Onee-chan, and let you be reunited too."'
26689: 'Sakutarou@r@v33/44200442.''Can you do that......?'''
26690: 'Ange@r@v11/42001303."It will probably be hard.@k@v11/42001304. ......Just like how, after being invited into the witches'' alliance, I rejected it without understanding what it meant,@k@v11/42001305. she might also reject your existence."'
26691: 'Ange@r@v11/42001306.".........But I''ve got to do it.@k@v11/42001307. That''s the only way I can atone for my sins."'
26692: 'Mammon@r@v42/42700322."............Ange-sama......"'
26693: 'Ange@r@v11/42001308."What is waiting on Rokkenjima?@k@v11/42001309. And what will happen, what will I be able to achieve?@k@v11/42001310. ......Although maybe nothing will happen at all."'
26694: 'Sakutarou@r@v33/44200443.''........................'''
26695: 'Ange@r@v11/42001311."That island, which was the beginning of everything, will be the final destination of this journey.@k@v11/42001312. .........As your master, I must bring all of you witch''s furniture with me...@k@v11/42001313....and I must return to the witch''s island - to Rokkenjima."'
26696: '@rEven though the rays of the sun had been so strong, at some point clouds had started to hang over us.'
26697: '@rThe spray hitting my cheek might not all be coming from the crashing waves.'
26698: 'Amakusa@r@v20/43000078."Ange-san.@k@v20/43000079. It looks like a light shower is coming.@k@v20/43000080. Shouldn''t you be going down?"'
26699: '@rAmakusa called out to me, with an expression of surprise that I was still here.'
26700: '@rWhen I looked up, I saw that the island''s silhouette had gotten much larger.@k@rWe might reach land very soon.'
26701: '@rI remembered that the weather report had mentioned scattered rains.'
26702: '@rThe sky wasn''t dark enough for rain clouds.@k@rIt''ll probably be just for a short time.'
26703: '@rEven if the rain was light enough not to be a bother,@k ......having rain start to fall as we approached the island felt like some kind of fate.'
26704: '@rIt was probably raining on October 4th, 1986, as well.@k@rI was approaching the Rokkenjima of that day, ......and not just in distance......'
26705: '@rI went back down with Amakusa.'
26706: '@rAmakusa was carrying what looked like a quite large and heavy golf bag.'
26707: '@rIt was something Amakusa had brought back from god-knows-where after we split up for a day.@k@r......I wasn''t going to inquire as to its contents, but it''s hard to imagine that they''re anything peaceful.'
26708: 'Ange@r@v11/42001314.".........I''m deliberately not going to ask what''s inside, but it looks heavy."'
26709: 'Amakusa@r@v20/43000081."Why is it that these are so heavy?@k@v20/43000082. A French instructor taught me something interesting about that once."'
