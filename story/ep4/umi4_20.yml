32479: '@rIt was a graceless show of bravado, unchanged from before.'
32480: '@r......But blood dripped from her mouth, her once beautiful dress was covered with holes,@k and blood poured from all over her body, making her physical appearance look very different from her attitude.'
32481: '@rPerhaps she was still suffering from the shot she''d taken to the flank—@kthe way she was unconsciously clutching it lacked any trace of elegance.'
