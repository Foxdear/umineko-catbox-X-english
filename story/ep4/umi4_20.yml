31836: '@rThat kind of ridiculous mechanism would be surprising even in a ninja mansion.'
31837: '@r......But even so, if Dad and the rest heard about this,@k maybe they''d say "I wouldn''t put it past Grandfather—you bet he''d do this, he''d make this".'
31838: '@r......In any event, I didn''t learn anything more than that from the dining hall.'
31839: '@rDo the pitfalls not exist?@k Or do they exist, but I just can''t find them, amateur that I am?'
31840: '@rI can''t say for sure.'
31841: '@rSince they claimed that the pitfalls were there,@k ......I can''t ignore the pitfalls even if I can''t find them......'
31842: '@rThe next ones to be killed had been Jessica and George-aniki.@k@rI''d already discovered George-aniki, when I was called out for my test.'
