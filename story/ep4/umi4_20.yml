31789: '@r......But there was absolutely no sign of anyone else.'
31790: '@r......Thinking that they might be hiding somewhere and scheming to attack me from behind, I went around searching for possible hiding places,@k sometimes being cautious,@k sometimes intentionally letting my guard down, trying all kinds of things, but in the end, not so much as a kitten appeared...'
31791: '@rThen, morning came.'
31792: '@r......My tension and fatigue, mixed together with my drowsiness, made for the worst kind of dawn.'
31793: '@rHumans are pretty incredible.'
31794: '@r......Even though I didn''t know where the hell the murderer was hiding, I was prioritizing drowsiness and fatigue over worrying for my own life.'
31795: '@r......By this time, I was starting to feel pretty ridiculous.'
31796: '@rI had walked around the mansion for a full six hours until dawn broke, yelling at them to show themselves.'
31797: '@rI had done a painstaking search, tired myself out, and even let my guard down.@k@rStill no one was coming to attack me.'
31798: '@rAnd so at that point I just said screw it, do whatever you want.........'
31799: '@rThe boat wouldn''t come until the typhoon passed.@k They were saying on TV that it wouldn''t pass until tomorrow, so I had a whole day to waste.'
31800: '@rThe idea of just lazing about didn''t seem very appealing,@k ......so, even though I knew it would probably make the police mad, I decided to play detective a bit.'
31801: '@rFirst: the dining hall, where the very first murders occurred.'
