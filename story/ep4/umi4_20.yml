31816: '@rWhy was Maria alone given a sleep-like death?'
31817: '@r.........She was killed, so in that sense, I still felt very sorry for her—there can be no doubt about that—@kbut for some reason, the manner of Maria''s murder in particular seemed very courteous to me......'
