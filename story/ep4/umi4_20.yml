32448: 'BEATRICE@r@v27/90700742."Fine by me, that''s just fiine by meeee, you knoooooww?@k @v27/90700743.You can be a big, happy family getting their hands dirty with mass murder,@k@v27/90700744. and return to Ange stained with blood that will never come oooooooooff!!"'
32449: 'BEATRICE@r@v27/90700745."Isn''t that perfectly fitting for the survivors of the witch''s islaaaaaaaaaand?@k @v27/90700746.Just like that mincemeat Angeeeeeeeeeeeeeeeehyahhaaaaaaaaaaaahhhh!!!"'
32450: 'Battler@r@v10/90100547."Aaaaaarrrrgggghhh, shut uuuuuuuuuuuuuuuupp!!@k @v10/90100548.I''ll kill you!!@k @v10/90100549.I''ll tear you apart!!@k@r@v10/90100550. Don''t worry about begging for your life, I''ll make sure you get the worst kind of death by my very own hands!!"'
32451: 'BEATRICE@r@v27/90700747."Yes, you''re capable of it, I''m sure...!!@k @v27/90700748.I trust you to give me an end fitting for a witch who has explored the depths of cruelty over a thousand years...!!"'
32452: 'BEATRICE@r@v27/90700749."Ooh, will it hurt?@k @v27/90700750.Will it be hard to bear?@k @v27/90700751.Or will it just ticckklllllleee?!@k @|@y@v27/90700752.Is this supposed to torment me?! Come on, Ushiromiya Battleeeeeeer, there are still mysteries leeeeeeeeeeeeft!!"'
