31955: 'Battler@r@v10/90100246.".........Ah...... ...Wh-what the hell...?!@k @v10/90100247.D-......damn it...!!"'
31956: '@rThe old well had a firm cover on it.'
31957: '@rThe cover was an iron grill.'
31958: '@rThe gaps between the bars were perhaps twenty centimeters square.@k You could peer inside, but it really wasn''t something a human could pass through.'
31959: '@rIf I hadn''t known better, I wouldn''t have thought it to be anything more than a simple cover to protect against falling in.'
31960: '@r......But from what Kyrie-san had told me, I knew that it had been made to prevent intruders from entering the secret underground passage at the bottom...!'
31961: '@rBut the cover was fixed in place extremely firmly, and no matter how much I pushed or pulled, I couldn''t even get close to removing it.'
31962: '@rI couldn''t find any obvious lock.@k Maybe it was sealed by some mechanism.'
31963: '@rBut no matter how much I investigated it, I couldn''t find anything to release it.'
31964: '@r.........The underground passage in this well is the biggest piece of information I have, that Kyrie-san gambled her last moments trying to tell me about...!'
31965: 'Battler@r@v10/90100248."Don''t think you can stop me with something like this cover...!@k @v10/90100249.I''ll smash it to bits...!@k @v10/90100250.I''ll search for a tool...!"'
31966: '@rI had an idea of where to get one.@k ......Because I''d seen the various tools in the gardening shed when we locked Gohda-san and Kumasawa-san in there.'
31967: '@rBut the shutter to the gardening shed was locked.@k@rOn top of that, the key was with Gohda-san, who was inside, dead.'
31968: '@r......In other words, this gardening storehouse was a locked room.@k@rThere was no way to open it from the outside.'
31969: '@rIn that case, I would have to break the shutter.@k@rI wonder if there''s a tool for that somewhere...'
31970: '@r......It kind of felt like I was going in circles.'
