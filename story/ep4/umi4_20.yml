31946: '@r...By this time, I was beginning to think that BEATRICE and her accomplices...@kmight have used this underground passage to leave for Kuwadorian.'
31947: '@rThere were supposedly ten or more of these guys, and I hadn''t seen hide nor hair of any of them.'
