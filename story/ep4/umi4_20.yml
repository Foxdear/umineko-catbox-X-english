31865: '@r......If the culprit had stolen a master key from one of the victims, the fact that it was locked is meaningless.'
31866: '@rBut there are no external wounds other than her head.'
31867: '@r.........In which case, should I assume the fatal wound she was prepared to die from and the actual wound that destroyed her head were two different events,@k both of them made to the same part of the body......?'
31868: '@rIn other words, Jessica was struck severely to the head, and received an incredibly bad wound.'
