32503: 'Battler@r@v10/90100575.@|@y"@c279.@[The culprit was among those people who were not confirmed dead prior to EVA''s declaration of the deaths,@]@c.@k @v10/90100576.@|@y@c279.@[and that person had managed to skillfully play dead in the beginning and wait for us to leave them alone...!@]@c.@k @v10/90100577.@|@y@c279.@[They made us think that they had died, while their death still hadn''t been declared in red.@]@c."'
