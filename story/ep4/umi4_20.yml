31915: '@rBut Kyrie-san had definitely said that something like a golden thread had flown in through the keyhole,@k ......and spun around and around, aiming for her, attacking her......'
31916: '@r"A golden thread attacking through the keyhole".@k .........I couldn''t understand what it meant at all.'
31917: '@rWait, actually.@k ......Kyrie-san predicted that I probably wouldn''t be able to understand all this.'
31918: '@rAnd not just Kyrie-san.@k Jessica said it over the phone too.'
31919: '@r......No, since the very beginning, from the time we talked with Gohda-san and Kumasawa-san, and got the phone call from Uncle Krauss''s group,@k everyone has been saying the same, consistent thing.'
31920: '@r.........Grandfather is summoning witches and demons, and killing people with magic.'
