31783: '@rAnd finally, the bodies here weren''t just the six of the first twilight—they had grown in number, and now included one more.'
31784: '@rThe seventh corpse............was Maria.@|@y'
31785: '@rShe was lying next to Aunt Rosa, as though sleeping alongside her.'
31786: '@r...............I cried.'
31787: '@rAt the death of an innocent young girl.@k And at the cruel way my dad and the others had died.'
