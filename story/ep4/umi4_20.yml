32501: 'Battler@r@v10/90100570."......True, the others probably were dead.@k @v10/90100571.@|@y@c279.@[However, the time at which their deaths were declared in red was not the instant Doctor Nanjo died.@]@c.@k@v10/90100572.@|@y@c279.@[Strictly speaking, it was in the fight between me and EVA after Doctor Nanjo''s corpse was found.@]@c."'
