32467: 'BEATRICE@r@v27/90700761."Otherwise, I''ll call another isolated Ange from a different world,@k@v27/90700762. and this time I''ll tear off her arms and legs, stick her with a spear and roast her, okaaaaaaayyy??@k @|@y@v27/90700763.Uhhyahhaaaaaaaaaaaaahhhh!!"'
32468: 'Battler@r@v10/90100555."Shut uuuuuuuuuuup!!@|@y@k @|@y@v10/90100556.Never again!!@k @v10/90100557.Not my family!@k @v10/90100558.Nor my relatives!@k @v10/90100559.Nor any of the servants!!@k @v10/90100560.Never again will you make any of them your toys!!"'
32469: 'Battler@r@v10/90100561."......I''ve already broken through all of the mysteries in the fourth game with the blue truth.@k@v10/90100562. .........The only one left is the very last one from the third game.@k@v10/90100563. ......Only the murder of Doctor Nanjo."'
32470: 'BEATRICE@r@v27/90700764."......Oho, .........have I already been cornered so far......@k@v27/90700765. ......*cackle*cackle*, I am in a precarious state, aren''t I...@k@v27/90700766. ......Iiihhihhihhihhi, ......ghagh, *cough*cough*!"@|@y'
