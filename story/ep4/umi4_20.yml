31995: '@rFirst, they did not die by being hanged.@k@rTheir feet were solidly on the floor.'
31996: '@r......And both of their foreheads showed signs that they had been shot with a gun.'
31997: '@rWhen I thought about what a normal noose was like, the ropes seemed considerably on the long side.'
31998: '@rOn top of that, the length was different on each to match the height of each person.'
31999: '@rIn other words, the lengths had been adjusted so that both Gohda-san, who was tall, and Kumasawa-san, who was short,@k had their feet solidly but barely on the ground.'
32000: '@rAlso, while the ropes carried both of their weights as their heads lolled, both of them had some slack below their knees.'
32001: '@rThis meant that if they stood upright with these nooses around their necks, there would be some extra length.'
32002: '@rIn other words, these ropes were a bit unsuitable to hang someone with.'
32003: '@rThe direct cause of death was probably the shot to the head.'
32004: '@rIt was gruesome.@k Their insides were still dripping out from those deep holes, staining their faces a deep red.'
32005: '@rThen they were hung up by their necks and left on display—that probably makes the most sense.'
32006: '@r......If they were shot with a gun, they would probably have been lying down on the floor.'
32007: '@r......If that had been the case, you wouldn''t have been able to tell they were dead by peeking through the window.'
32008: '@rThe mountain of stuff would have gotten in the way, so if they had been lying down, they would have been hidden.'
32009: '@rTo make the deaths of these two known to the rest of us who couldn''t get inside,@k they had to hang them like this so we could tell from the outside.'
32010: '@r.........Was this......to get back at us for thinking that the two of them would surely be safe if we left the key with them......?'
32011: '@rI wonder where the shutter key we gave Gohda-san, which should have ensured their safety, is now...'
32012: '@rThat key.........was in his trouser pocket.@k@rThe gardening shed key had been kindly left there, and even the tag was still attached.'
32013: '@rIn other words, the gardening storehouse was a locked room after all.'
32014: '@rAnd that gave rise to another question.@k@r......Because this hanging was inexplicable.'
32015: '@rIf they didn''t commit suicide, then the nooses were set up by the culprit.'
32016: '@r......It might have been possible to shoot them through the window, but I really can''t imagine that someone could have tied two ropes to the beam from the outside.'
32017: '@rAnd on top of that, they would have had to lift up the heavy corpses—there''s just no way.@k In other words, to do all of this, they would have had to go inside.'
32018: '@rBut the key was in Gohda-san''s pocket, and the shutter was still locked.'
32019: '@rIn other words, the gardening storehouse was a locked room.'
32020: '@rGohda-san had said that there was only one key for this shutter.'
32021: '@r......But is it possible that there was a copy,@w500. ......and that the culprit was in possession of it......?'
32022: '@rIf we''re allowed to theorize that there were actually multiple gardening storehouse keys, and that Gohda-san just didn''t know about them,@k then this isn''t even close to a locked room.'
32023: '@r.........But why is it that, despite the fact that almost all of the other corpses were shot to death and left almost completely alone,@k these two corpses alone were intentionally hoisted up?'
32024: '@rI couldn''t help but feel something a bit odd about that......'
32025: '@rAssuming that the mystery corpse in the boiler was Grandfather,@k ......the deaths of 16 people had now been confirmed.'
32026: '@rThere were 18 people on this island.@k There''s me, and 16 corpses.'
32027: '@rKanon-kun''s corpse was the only one I hadn''t been able to confirm yet.'
32028: '@rAccording to Kyrie-san, he was killed while climbing out of the well, and fell down into it.'
32029: '@rSo with the well closed up like this, it was impossible to check.'
32030: '@rI tried shining a flashlight through the bars, down into the darkness in the depths of the well.'
32031: '@rBut it seemed that the jet-black darkness had no intention of showing me its innermost depths with this inadequate light...'
32032: '@rIt looked like I''d have to break the bars after all.'
32033: '@rUsing the hatchets and things I''d dragged out of the boiler room and the gardening shed, I tried breaking the cover of the well.'
32034: '@rBut the metal bars were extraordinarily sturdy, and breaking them wasn''t easy.'
32035: '@r......I hit them with the hatchet over and over, until my hands started feeling weird, and eventually gave up on breaking them......'
32036: '@r......It was impossible.@k If they were at least wood, I might have been able to break them.@k@rBut this metal...'
32037: '@rYeah, there''s no way you can slice through metal bars like butter with a human''s strength.'
32038: '@r......I can''t even begin to understand......that story about how Kanon-kun cut through the metal bars.'
32039: '@rShe told me that a light like a red laser beam grew out of his arm,@k and he used it to slice through the metal bars like a knife through butter.'
32040: '@rCutting through metal bars like butter...?'
32041: '@r......And what''s with the red laser beam.@k@rDoes that mean he snuck in a burner or something,@k and used that to burn through the bars......?'
32042: '@rStill, just what kind of laser.........could cut through metal bars like butter?'
32043: '@r...It sounds exactly like the kinds of laser beams that showed up in those robot anime I loved as a kid.'
32044: '@rDoes stuff like that actually exist......?@k@rAnd how did Kanon-kun get that laser beam......?'
32045: '@rAs much as I want to ask him, he''s already been killed.@k@rPlus, even his corpse is now at the bottom of the well, beyond this cover.'
32046: '@rIf Kanon-kun managed to slice through those metal bars, I''m sure he could handle this metal cover in a single swing.'
32047: '@r......It kind of feels like the locked room just now, with Gohda-san locked inside the gardening storehouse holding the key.'
32048: '@rOnly one person can open the door, but they''re locked inside......'
32049: '@r......If only I had that power of Kanon-kun''s, I could do something about this cover myself......@k .................................'
32050: '@rJust who is Kanon-kun?@kHe couldn''t really be......an inhuman being capable of using a strange power, right?'
32051: '@rEven Kyrie-san told me to believe in witches, and I''ve also met an insane woman calling herself one.'
32052: '@r...Could Kanon-kun possibly be...@w500....a human on the witch side...?@k@r......Or else...@w583.......the culprit?'
32053: '@r............What the heck.@k@r......Am I gonna start treating him like the culprit...just because I can''t find his corpse?'
32054: 'BEATRICE@r@v27/90700395.Hoh, ......treating him like the culprit simply because there is no corpse...?@k@r@v27/90700396.And who was the one babbling about the suspicious being innocent......?'
32055: 'BEATRICE@r@v27/90700397..........Very well, I couldn''t bear having you push all the crimes on Kanon and making that into a human culprit theory.@k@v27/90700398. I will guarantee it with the red...'
32056: 'BEATRICE@r@v27/90700399.@|@y@c900.@[Kanon is dead.@]@c.@|@y@k@r@v27/90700400.@|@y@c900.@[Among the five in Kyrie''s group, he was the first to die.@]@c.@k@r@v27/90700401.@|@y@c900.@[In short, he was the ninth victim.@]@c.'
32057: 'Battler@r@v10/90100251."......Since there''s no corpse, ......I can''t say for sure...@v10/90100252.that Kanon-kun is dead."'
32058: 'BEATRICE@r@v27/90700402.So, my whispering in red does not reach the piece you.......@k@v27/90700403..........But it did reach you, right.........?'
32059: '@rAt a glance, this appeared to be a mass murder committed using something strange that could only be thought of as magic.'
32060: '@r......Golden threads that attacked through keyholes.@k No, we even had testimony that something gold had flown around the dining hall during the first six murders.'
32061: '@rThe two might have been the same weapon.'
32062: '@rThen there was the locked-room murder of the garden shed, and the laser beam that could cut metal bars.'
32063: '@r......And that wasn''t all.'
32064: '@rThere was much, much more...like the group of goat monsters,@k the talk of a witch who could create pitfalls just by snapping her fingers, the rabbit-like demons who had fired golden threads...'
32065: '@rI think there were more, .........and each and every one of them was ridiculous.'
32066: '@rI couldn''t possibly accept it, and was forced to suspect that there was some kind of trick or mistake.'
32067: '@r......But why in the world had everyone spoken with one voice, saying the same thing without contradictions in their testimony...?'
32068: '@rIt''s not only the magic.'
32069: '@rMaria''s mysterious death.'
32070: '@rJessica somehow knowing that George-aniki had been killed.'
32071: '@rThe mysterious burnt corpse which I couldn''t confirm actually belonged to my piece-of-shit grandfather.'
32072: '@r......And more, and more.'
32073: '@rAll stuff I just don''t get......!@|@y'
32074: '@rI tilted the bottle and glugged it down noisily.@k@r......I didn''t have a clue what was going on.'
32075: '@rAfter dinner last night, we kids were shooed out of the mansion and told to go back to the guesthouse,@k .........and then there was a massacre in the dining hall.'
32076: '@rKyrie-san and the rest were dropped through pitfalls and captured.'
32077: '@rThen Jessica and George-aniki were called out to a test or whatever and killed.'
32078: '@rKyrie-san''s group managed to escape the dungeon somehow, but all of them were killed in the end.'
32079: '@rAnd at the very, very end, even Maria was killed, leaving me all alone.'
32080: '@r.........In short, I had done nothing except be locked up in the guesthouse.'
32081: '@rDuring that time, a huge incident had occurred, and ended, before I knew it.'
32082: '@rWhat could I call it except incomprehensible?@k@rI don''t have a clue anymore!'
32083: 'Battler@r@v10/90100253."Now I''m nothing but a pig.@k@v10/90100254. You plan on leaving only me alive...?@k @v10/90100255.Hurry up and show yourself and come kill me already.@k@v10/90100256. I can''t be bothered to look for you anymore."'
32084: 'Battler@r@v10/90100257."You show me your true form yourself......!@k @v10/90100258.I won''t run or hide, so come at me with arrows or bullets or whatever...!"'
32085: '@rI haven''t had any sleep since yesterday, and I''m tired as all get-out.@k@rYou wanna kill me, be my guest.'
32086: '@rI decided to return to the guesthouse and boldly rest on the bed.'
32087: '@r......As I exited the kitchen and passed through the lobby,@k .........that portrait of the witch came into view.'
32088: '@rThe big clock did too.@k@r......At that very moment, it was exactly midnight.'
32089: '@rAnd the sound of the bell, proclaiming that it was midnight, rang out......'
32090: '@rAs I listened, ......I looked up at BEATRICE''s portrait.'
32091: '@rExactly twenty-four hours ago, I met you.'
32092: '@rWhat were you trying to say to me...?@k@rAnd where did you go?'
32093: '@rJust who in the world are you.........?@k@rGolden Witch, BEATRICE.'
32094: '@rI haven''t solved a single one of the riddles surrounding you......!'
32095: '@rShow yourself...@k@r.........And fight with me...!!'
32096: '@rThen......the witch showed herself.@k Like a guest of honor finally appearing, she showed herself on the landing at the top of the big staircase......'
32097: 'Battler@r@v10/90100259."So you finally show yourself......@k@v10/90100260. ......I''ve been kept bored for an entire day."'
32098: 'BEATRICE@r@v27/90700404."...............Yes.@k@v27/90700405. I gave you a whole day.@k@v27/90700406. Were you able to sufficiently exercise the rights of the Human side?"'
32099: 'Battler@r@v10/90100261."Yeah.@k@v10/90100262. I was bored, so.@k@v10/90100263. I had a good go at it."'
32100: 'BEATRICE@r@v27/90700407."............Ange...was a good piece."'
32101: 'Battler@r@v10/90100264."Don''t you......speak Ange''s name."'
32102: 'BEATRICE@r@v27/90700408.".........She appeared through a miracle, and sacrificed herself to give you the tenacity for certain victory."'
32103: 'Battler@r@v10/90100265."Don''t you...speak Ange''s name."'
32104: 'BEATRICE@r@v27/90700409."............That brutal death was something that you needed.@k@v27/90700410. If you hadn''t seen that death, you would not have grown serious.@k@v27/90700411. Without the wake-up call of Ange''s ill-fated future, the tenacity for victory would not have arisen within you."'
32105: 'Battler@r@v10/90100266."I told you not to speak Ange''s name...!!"'
32106: 'BEATRICE@r@v27/90700412."............In short, she was a necessary sacrifice.@k@v27/90700413. Otherwise, an anger great enough to kill me would not have been born within you.@k@v27/90700414. The rivalry between us cannot be destroyed."'
32107: 'BEATRICE@r@v27/90700415."Curse that Lady BERNKASTEL—this was no piece, it would be more fitting to call it a trump card.@k@v27/90700416. ......No matter how helpful a piece is, it will never stray from the board.@k@v27/90700417. But a trump card, no matter how powerful its effect, is always discarded after it is used."'
32108: 'BEATRICE@r@v27/90700418."Ange was truly a good trump card for you."'
32109: 'Battler@r@v10/90100267."Don''t you...speak Ange''s naaaaaaaaaaaaaaaaame!!!"@|@y'
32110: '@rAt Battler''s outburst of rage, Beato finally stopped talking.'
32111: 'Battler@r@v10/90100268."......You know, I have no more time to spend playing around in a place like this.@k@v10/90100269. ......Even our draws are keeping Ange waiting."'
32112: 'Battler@r@v10/90100270."............I am going to break through you,@v10/90100271. ......take my family,@v10/90100272. ......and go back home!!@k @v10/90100273.I don''t have a single second to waste playing witches with you!!"'
32113: 'BEATRICE@r@v27/90700419."In that case, I assume you know.@k@v27/90700420. What must be done."'
32114: 'Battler@r@v10/90100274."Yeah!@k @v10/90100275.I''ll beat you down!!@k @v10/90100276.I''ll blast away all witches, magic, illusions, and delusions!!"'
32115: 'Battler@r@v10/90100277."Alright, let''s do this!!!@k @v10/90100278.I won''t ever let you trick me again!!@k @v10/90100279.The game''s restarting, you ready?!@k @v10/90100280.I''ll tear apart the witch''s veil that conceals the outright lie you are!!!"'
32116: 'BEATRICE@r@v27/90700421."You talk too much.@k@v27/90700422. All you have to do is simply say "I will kill you"."'
32117: 'Battler@r@v10/90100281."Yeah.@k@v10/90100282. If those are the words you want, ......I''ll say them for you.@k@v10/90100283. This is the first and last wish of yours that I''ll lend an ear to."'
32118: 'BEATRICE@r@v27/90700423."............I thank you."'
32119: 'Battler@r@v10/90100284."I will.................."'
32120: 'BEATRICE@r@v27/90700424."..........................."'
32121: 'Battler@r@v10/90100285."I will kill you......!!!"'
32122: 'BEATRICE@r@v27/90700425."Then by all means!!@k @v27/90700426.Let us begin, Battler...!!@k @v27/90700427.Come, it is time for the witch hunt...!!@k @v27/90700428.Try and chase me, try and corner me, try and kill me! I''m expecting a lot from you!!@k @v27/90700429.Try and show me what your little sister gave you in her last moments...!!"'
32123: 'Battler@r@v10/90100286."Bring it oooooooooooooooooooooonnn!!!"@|@y'
32124: '@r......Battler''s cry burned the world with a white light.'
32125: '@rAnd when one''s eyes were opened to that brilliant light, ......the two of them could be seen in a rose garden......'
32126: 'BEATRICE@r@v27/90700430.".........Who takes the first move?"'
32127: 'Battler@r@v10/90100287."Me."'
32128: 'BEATRICE@r@v27/90700431."How brave."'
32129: '@rThe rose garden, where beautiful rose petals danced.@k@rThe color of those rose petals...was red.'
32130: '@rWas that a proof, or simply a claim, that the two of them facing each other in this beautiful rose garden...@w666.was the red and only truth?'
32131: '@r.........That must be why...the roses are red.'
32132: '@rBut in the language of flowers, roses are passion.@k@r......Not truth.'
32133: '@rThe flower for truth is a forget-me-not.@k@rThat flower......is blue.'
32134: 'Battler@r@v10/90100288."I''ll pierce through everything with my blue truth.@k@v10/90100289. .........From the very beginning of it all.@k@v10/90100290. I''ll start from the very first game!"'
32135: 'BEATRICE@r@v27/90700432."Very well.@k@v27/90700433. Show me your skill.@k@v27/90700434. ...Come."'
32136: 'Battler@r@v10/90100291."Here I go.........@k@v10/90100292. I''ve already proclaimed it, but I''ll say it again.@k@v10/90100293. ......This isn''t just for the murder of Doctor Nanjo in the last game.@k@v10/90100294. This will tear apart every scene from every game since the beginning...!!"'
32137: 'Battler@r@v10/90100295."@c279.@[Ushiromiya Kinzo is already dead!@]@c.@k @v10/90100296.@|@y@c279.@[Therefore, the true number of people on the island is 17!@]@c.@k @v10/90100297.@|@y@c279.@[By adding an unknown person X to that, it becomes 18 people.@]@c.@k @v10/90100298.@|@y@c279.@[By supposing that this person X exists, the crime is possible even if all 17 people have alibis.@]@c."'
32138: 'Battler@r@v10/90100299.@|@y"@c279.@[By this, even though the number of people reaches 18, it is still possible for culprit X to exist and carry out the crime even if all 18 people seem to have alibis!!@]@c."'
32139: '@rYou can break through all of the murders in Episode 1 by supposing an unknown person X.'
32140: '@rFurthermore, it is even possible to explain the mystery of Kinzo''s evaporation from the locked room sealed by the receipt,@k by making the bold assumption that Kinzo wasn''t there from the beginning.'
32141: '@rUnless Beato countered this with the red truth,@k the witch illusions of Episode 1 would be completely smashed.'
32142: '@r.........The blue truth was valid.'
32143: '@rThe wedge of blue truth that Battler had released stabbed right through the top of Beato''s left foot.'
32144: '@r......Was the red blood that poured out from there her defense in the red truth...?'
32145: '@rBeato shut one of her eyes tight, enduring the unbearable pain from the wedge of blue truth that denied her.'
32146: 'BEATRICE@r@v27/90700435."Hmm, not bad.@k@v27/90700436. ......But I am still far from denied, far from killed.@k@v27/90700437. ......That is not close to enough.@k@v27/90700438. .........The following games contain mysteries that cannot be explained with that alone, do they not?"'
32147: 'Battler@r@v10/90100300."......Which mysteries?"'
32148: 'BEATRICE@r@v27/90700439."In the final stages of the second game,@k@v27/90700440. George, Gohda, and Shannon barricaded themselves in Natsuhi''s room, and were killed.@k@v27/90700441. The key by which they unlocked Natsuhi''s room was locked up inside the room, and all of the remaining keys that could unlock the door were in the hands of Rosa.@k@v27/90700442. Even if culprit X existed, it should be impossible to construct a locked room."'
32149: '@rThe blue wedge piercing Beato shook.@k@rShe was resisting, fighting to push it out.'
32150: 'Battler@r@v10/90100301."No, that doesn''t shake my blue truth.@k@v10/90100302. If culprit X was in possession of a master key, that''s not even close to a locked room."'
32151: 'BEATRICE@r@v27/90700443."No, it was impossible for the culprit to obtain one.@k @v27/90700444.@|@y@c900.@[All of the master keys were under Rosa''s control!@]@c."'
32152: 'Battler@r@v10/90100303."But that''s meaningless if Aunt Rosa was an accomplice to the culprit!@k @v10/90100304.@|@y@c279.@[Aunt Rosa handed a key over to culprit X by some method, assisting in the locked-room murder!@]@c.@k @v10/90100305.@|@y@c279.@[And after that, she retrieved the key by a similar method!@c."'
32153: 'Battler@r@v10/90100306."You''ll have to do better than that, Beato!!@k @v10/90100307.I already put forward that theory at the time!"'
32154: 'BEATRICE@r@v27/90700445."......*cackle*... So you did......"'
32155: 'BEATRICE@r@v27/90700446."...Gwaaargh...!!!@k @v27/90700447..........agh, ......nghh..."'
32156: '@rThe wedge that had been gradually losing its brilliance, and seemed as though it was about to come out,@k regained its strong blue again thanks to Battler''s additional blue truth, and dug into Beato again, eating into her foot.'
32157: '@rBeato let out a moan of anguish at the pain of it.'
32158: 'BEATRICE@r@v27/90700448.".........guh, ......ohh......@k@v27/90700449. .........Not yet...@k@v27/90700450. This is still nothing......@k@|@y@v27/90700451. Not yet,@v27/90700452. .........not yeeeeeeeet!!"'
32159: 'Battler@r@v10/90100308."Continuing on to the third game.@k@v10/90100309. The six linked locked rooms, the murders of Auntie Rosa and Maria, the deaths of Dad and the others in the hall, and the murders of Uncle Krauss and Aunt Natsuhi...@k@v10/90100310.all of them @v10/90100311.@|@y@c279.@[can be explained if we suppose that Aunt Eva was the culprit.@]@c."'
32160: 'Battler@r@v10/90100312."This argument was already won back then.@k@v10/90100313. And even that final riddle you proposed through EVA,@k @v10/90100314.@|@y@c279.@[the murder of Doctor Nanjo, can be explained with an 18th unknown person X.@]@c.@k@v10/90100315. Now I''ve broken through the entire third game!!! Can you counter that?!'
32161: 'BEATRICE@r@v27/90700453."Mgh, gh...!!@k @v27/90700454.......O-of course......!@k @v27/90700455.This much is......nothing to worry about......!"'
32162: 'BEATRICE@r@v27/90700456."In that case, how do you explain George''s disappearance from the guesthouse?@k @v27/90700457.I shall add to the red truth.@k @v27/90700458.@|@y@c900.@[George did not go down the stairs of the guesthouse.@]@c.@k@v27/90700459. He flew out through the window!"'
32163: '@rIn the final stages of the third game, George suddenly vanished from the second floor of the guesthouse.'
32164: '@rEva, who had been on the first floor, claimed that no one had come downstairs,@k but if, as the blue truth claimed, she had carried Krauss and Natsuhi''s corpses outside, there was the possibility that George could have secretly gone downstairs during that gap in time and escaped.'
32165: '@rBut by adding on to the red truth, Beato had disproven that.'
32166: '@rTo go outside without going down the staircase to the first floor, he would have had to leave by the window.@k But all of the windows were locked from the inside...!'
32167: 'Battler@r@v10/90100316."So what.@k@v10/90100317. It''s just like you said.@k@v10/90100318. He flew out the window, right?@k @v10/90100319.Even if he did jump down, you couldn''t tell by the grass, and it was raining so hard.@k@v10/90100320. Any light traces would have disappeared."'
32168: 'BEATRICE@r@v27/90700460."I will repeat the red truth.@k @v27/90700461.@|@y@c900.@[All windows and doors leading to the outside were locked from the inside.@]@c.@k @v27/90700462.@|@y@c900.@[Furthermore, it is impossible to lock any of those from the outside!@]@c.@k @v27/90700463.George had no technique by which to lock them...!"'
32169: 'Battler@r@v10/90100321."I will repeat the blue truth.@k@v10/90100322. I said it myself at the time.@k @|@y@v10/90100323.@c279.@[In that case, everything works out as long as someone locked the window after George-aniki escaped through it!@]@c.@k @v10/90100324.Nothing difficult about it!!"'
32170: 'BEATRICE@r@v27/90700464."Gwaaaaaaaahhaaaaah...!!@k@v27/90700465. Gguuuuhhh...... Is this not......enough to resist...... Is it not enough......?"'
32171: '@rBeato couldn''t remove the blue wedge that was buried into her foot.@k@rThe fake witch was burned more and more by the strong blue......'
32172: 'Battler@r@v10/90100325."In all games up to the third, there is still nothing that shakes the blue truth.@k@v10/90100326. ......In that case, the only game that can prove you''re a witch......is this game, the fourth game."'
32173: 'BEATRICE@r@v27/90700466."......As I have not countered with the red truth, that is indeed the case.@k@v27/90700467. I will have to prove witches with only this game.@k@|@y@v27/90700468. .........Very well.@k@v27/90700469. Hold nothing back."'
32174: 'Battler@r@v10/90100327."There''s nothing strange about the six murders in the dining hall.@k @v10/90100328.@|@y@c279.@[The 18th person X went wild with a gun and killed everyone.@]@c.@k @v10/90100329.@|@y@c279.@[Regarding the pitfalls, there is every chance that pitfalls truly were hidden there,@]@k@v10/90100330.@|@y@[ and it''s also possible to explain them with Kyrie-san''s theory hypothesizing the existence of a poison-dart-shooting device X which can knock a person out instantly.@]@c."'
32175: 'Battler@r@v10/90100331.@|@y"@c279.@[The murders of George-aniki, Jessica, and those who escaped from the dungeon can also be explained with guns, just like the dining hall.@]@c.@k@v10/90100332. There''s nothing strange about it!"'
32176: 'Battler@r@v10/90100333."But I know you, you''ve got a counterattack, right?@k @v10/90100334.Bring it on!!"'
