32476: 'BEATRICE@r@v27/90700771."Well, I don''t know about that...@k @v27/90700772.I have already tired of a life too long after a thousand years...!@k @v27/90700773.I''ve started to think that it might not be so bad to have this life ended by a worthy adversary like you, who I met at the very end of it all."'
