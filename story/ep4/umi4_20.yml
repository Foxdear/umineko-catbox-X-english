32315: 'BEATRICE@r@v27/90700607.Of endlessly...@v27/90700608.......being made into a witch''s plaything...@v27/90700609. ............I''ve...@v27/90700610....had enough......'
32316: 'BEATRICE@r@v27/90700611.No victory, and no conclusion with a draw.'
32317: 'BEATRICE@r@v27/90700612.......In that case, there is only one conclusion that can release me.'
32318: 'BEATRICE@r@v27/90700613.......Heh, ......hahahahahahaha......'
32319: 'BEATRICE@r@v27/90700614.Since the time I descended to the path of witches.@k@r@v27/90700615.Since the day I made that contract with demons.'
32320: 'BEATRICE@r@v27/90700616..........Was it not promised that tragedy would be my ultimate fate.........'
32321: 'Battler@r@v10/90100444."What''s wrong!!@k @v10/90100445.Golden Witch, BEATRICE!!@k @v10/90100446.If you are the ruler of Rokkenjima, face your end with appropriate majestyyyyyy!!!"'
32322: '@rLightning.'
32323: '@r......The world was smashed with white.@k@r.........Fitting last moments...for the ruler of Rokkenjima.'
32324: '@rHaha, .........hahhahahahahahahahaha.........'
32325: 'BEATRICE@r@v27/90700617."Hahhahahahahaha......wahhahhahhahahahahahahahahahahahahaha...!!!"'
32326: 'Battler@r@v10/90100447."..........................."'
32327: '@rStill pierced by the blue stakes, ......Beato faced the rainy sky, and let out a laugh.'
32328: '@rThen she slowly raised her face, ......and fixed her eyes on Battler.'
32329: 'BEATRICE@r@v27/90700618.".........Fool.@k@v27/90700619. ......I was considering handing you the victory in praise of your good fight...@k@v27/90700620. .........You shall regret your complacency......"'
32330: 'Battler@r@v10/90100448."Victory is not something for you to hand over.@k@v10/90100449. It''s something I''m gonna snatch from you!!@k @v10/90100450.And don''t pretend you''re any different!!"'
32331: 'Battler@r@v10/90100451."You couldn''t accept victory being handed to you on a silver platter when I started saying stuff like "Maybe it''s alright for witches to exist", and that''s exactly why you intentionally fell apart like that in the end last time...!!!@k @v10/90100452.That''s right, that one time last game, you showed mercy on me!!"'
32332: 'Battler@r@v10/90100453."So now I''m making us even! Stand!!!@k @v10/90100454.My enemy, my Golden Witch, BEATRICE!!!"'
32333: 'BEATRICE@r@v27/90700621."Hahhahaha......@k@v27/90700622. Idiot."'
32334: 'BEATRICE@r@v27/90700623.".........You idiooooooooooooot, hhahhahahahahahahahahahaha!!@k @v27/90700624.Ssssimpleton...!!@k @v27/90700625.Don''t think you''ll ever get another chance!!@k @v27/90700626.Uuuaaaaaaaaaaaaaaaaagh!!!"'
32335: '@rWhen Beato yelled, the blue stakes that had been piercing her chest blew to bits and disappeared.'
32336: '@r......However, the blue wedge that had pierced her foot in the very beginning did not disappear.'
32337: 'Battler@r@v10/90100455."You haven''t pulled it out yet.@k@v10/90100456. You haven''t pulled out the blue truth of the 18th person X...!!"'
32338: 'BEATRICE@r@v27/90700627."I will respond to one of your repetition requests.@k@v27/90700628. As you reasoned,@v27/90700629.@|@y@c900. @[Kinzo is already dead at the starting time for all games!@]@c."'
32339: 'BEATRICE@r@v27/90700630."However, in that case, all I need to do is take one person out!!@k @v27/90700631.@|@y@c900.@[Thus far, I have been declaring that no more than 18 humans exist on this island.@]@c.@k @v27/90700632.@|@y@c900.@[I will lower that by one for Kinzo!!@]@c."'
32340: 'BEATRICE@r@v27/90700633.@|@y"@c900.@[No more than 17 humans exist on this island!!@]@c.@k @v27/90700634.@|@y@c900.@[That excludes any 18th person.@]@c.@k @v27/90700635.@|@y@c900.@[In short, this 18th person X does not exist!!@]@c.@k @v27/90700636.@|@y@c900.@[This applies to all games!!!@]@c.@c."'
32341: 'Battler@r@v10/90100457."I goddamn knew it.@k@v10/90100458. You still had some crazy stuff up your sleeve after all......@k@v10/90100459. This island only had 17 humans on it, but all this time, it''s been made to look as if there were 18.@k@v10/90100460. And now that we''ve taken one off and brought it down to 17, we''ve finally reached the correct number."'
32342: 'Battler@r@v10/90100461."............Now the wedge I knocked into you has been removed.@k@v10/90100462. We''ll have to start the fight over, back from square one...!"'
32343: '@rThe blue wedge that had sewn Beato in place broke apart.@k@r.........There was no longer anything piercing Beato.'
32344: '@rThe scars on her body had disappeared completely.'
32345: '@rThere, just as Battler had hoped for, ......stood the imposing figure of the Golden Witch who ruled Rokkenjima.'
32346: 'BEATRICE@r@v27/90700637."......Now come, Battler.@k@v27/90700638. Once more from the beginning.@k@v27/90700639. Try to break through everything with the blue truth.@k@v27/90700640. I too will no longer play, run, or hide."'
32347: 'BEATRICE@r@v27/90700641."If you prove to be good for nothing, then I shall decide this match right here and now.@k@|@y@v27/90700642. I will make you forever regret not settling for the victory I handed you!!!@k @v27/90700643.Come, starting from the first game!"'
32348: 'Battler@r@v10/90100463."Right!!@k @v10/90100464.From the first twilight of the first game!!@k @v10/90100465.@|@y@c279.@[There is nothing strange about the murder of the six relatives that were found in the gardening shed in the beginning!@]@c.@k @v10/90100466.@|@y@c279.@[The crime was possible for any of those who didn''t have an alibi!!@c."'
32349: 'BEATRICE@r@v27/90700644."Valid.@k@v27/90700645. Continue—what about the next locked-room murder, with Eva and Hideyoshi?!@k@v27/90700646. Even the chain was set for that locked room!@k @v27/90700647.I shall add to the red truth."'
32350: 'BEATRICE@r@v27/90700648.@|@y"@c900.@[Both deaths were homicides!@]@c.@k @v27/90700649_1.@|@y@c900.@[It is not the case that, after the construction of the locked room, one of them committed suicide after murdering the other!@]@c.@k @v27/90700650.@|@y@c900.@[Furthermore, the murder was carried out with both the victim and the perpetrator in the same room!@]@c.@k @v27/90700651.@|@y@c900.@[No method exists for the perpetrator to commit murder from outside the room!@]@c."'
32351: 'Battler@r@v10/90100467.@|@y"@c279.@[Suppose that the culprit was a human without an alibi.@]@c.@k @v10/90100468.@|@y@c279.@[In other words, the dead!@]@c.@k @v10/90100469.@|@y@c279.@[Among the first six corpses, there were some made unidentifiable because their faces were smashed.@]@c."'
32352: 'Battler@r@v10/90100470.@|@y"@c279.@[One possible theory is that one was actually a fake corpse, and that some culprit X killed those two after pretending to be a victim and hiding away!@]@c.@k @v10/90100471.@|@y@c279.@[Then, after the locked-room murder was constructed, the culprit hid under the bed, and waited for all of us to leave!!@c."'
32353: 'BEATRICE@r@v27/90700652."Very well, next!@k @v27/90700653.Kanon, killed in the boiler room, correct?@k @v27/90700654.I shall add to the red truth.@k @v27/90700655.@|@y@c900.@[All of the survivors have alibis!@]@c.@k @v27/90700656.@|@y@c900.@[Let us include the dead as well!!@]@c.@k @v27/90700657.@|@y@c900.@[In short, no kind of human or dead person on the island could have killed Kanon!@]@c."'
32354: 'Battler@r@v10/90100472.@|@y"@c279.@[If no one could kill him, then he might have been the one to kill!!@]@c.@k @v10/90100473.@|@y@c279.@[Meaning Kanon-kun might have killed himself.@]@c."'
32355: 'Battler@r@v10/90100474."Repetition requested!@k @v10/90100475."Kanon-kun did not commit suicide"!"@|@y'
32356: 'BEATRICE@r@v27/90700658.@|@y"@c900.@[Kanon-kun did not commit suicide.@]@c."'
32357: 'Battler@r@v10/90100476."One more."'
32358: 'Battler@r@v10/90100477."Repetition requested, "Kanon-kun''s death was a homicide"."'
32359: 'BEATRICE@r@v27/90700659."I decline to repeat."'
32360: 'Battler@r@v10/90100478."That refusal still admits the possibility of a homicide, but you''ve already declared in red that no one could have killed him.@k@v10/90100479. In other words, it wasn''t a homicide.@k@v10/90100480. This is the same as the linked locked rooms from the third game."'
32361: 'Battler@r@v10/90100481.@|@y"@c279.@[Kanon-kun died for a reason that was neither suicide nor homicide.@]@c.@k @v10/90100482.@|@y@c279.@[Though the circumstances are unclear, he died from an accident.@]@c."'
32362: 'Battler@r@v10/90100483.@|@y"@c279.@[By the Devil''s Proof, I refuse to explain what kind of blunder could have led to an accidental death where a stake was driven into his chest!!@]@c."'
32363: 'BEATRICE@r@v27/90700660."Hohoh, now that you have borrowed the power of the devil, you are without peer!@k @v27/90700661.It is valid!"'
32364: 'BEATRICE@r@v27/90700662."In that case, what about the murders after that in the parlor, of Genji, Nanjo, and Kumasawa?!@k @v27/90700663.Naturally, @v27/90700664.@|@y@c900.@[Maria, who was in the same room, did not kill them!@]@c.@k @v27/90700665.@|@y@c900.@[And of course, their three deaths were homicides!@]@c."'
32365: 'Battler@r@v10/90100484.@|@y"@c279.@[We can explain it with the one who carried out the murder being a culprit X who used an unidentifiable corpse to disappear.@]@c.@k @v10/90100485.@|@y@c279.@[In the first place, their three faces were also pulverized.@]@c.@k @v10/90100486.@|@y@c279.@[It''s completely possible that one of them was a body-double corpse!@]@c."'
32366: 'BEATRICE@r@v27/90700666.@|@y"@c900.@[I guarantee the identities of all unidentified corpses.@]@c.@k @v27/90700667.@|@y@c900.@[Therefore, there were no body-double tricks!@]@c."'
32367: 'Battler@r@v10/90100487.@|@y"@c279.@[Then I can explain it with simultaneous murders.@]@c.@k @v10/90100488.@|@y@c279.@[Each of the three had a gun, pointed it at another in a clockwise pattern, and they blew each others'' faces off at the same time!@]@c.@k @v10/90100489.@|@y@c279.@[After that, Maria collected those guns and hid them!!@]@c.@k @v10/90100490.How about that?!!!"'
32368: 'BEATRICE@r@v27/90700668."Wha-......what a ridiculous argument!!!@k @|@y@v27/90700669.I, I like it...!!@k @v27/90700670.Then what about Natsuhi in the end?!"'
32369: 'BEATRICE@r@v27/90700671."I shall add to the red truth!@k @v27/90700672.@|@y@c900.@[Natsuhi''s death was a homicide!@]@c.@k @v27/90700673.@|@y@c900.@[There are no corpses of unknown identity, and all of the survivors have alibis!@]@c."'
32370: 'Battler@r@v10/90100491.@|@y"@c279.@[You can explain it with an indirect murder by trap X!@]@c.@k @v10/90100492.@|@y@c279.@[Something was done to Aunt Natsuhi''s gun.@]@c.@k@v10/90100493.@|@y@c279. @[You can explain it if that was a trap gun, built to send a bullet right into the forehead of anyone who tried to hold it up and shoot it!!@]@c."'
32371: 'BEATRICE@r@v27/90700674.@|@y"@c900.@[The bullet buried into Natsuhi''s forehead was not fired from Natsuhi''s gun!@]@c."'
32372: 'Battler@r@v10/90100494.@|@y"@c279.@[There is the possibility that Aunt Natsuhi was lured out by that letter of unknown contents!@]@c.@k @v10/90100495.@|@y@c279.@[And she was called out into the hall.@]@c.@k @v10/90100496.@|@y@c279.@[Then, she was forced into standing at a specified location at a specified time, and murdered by some trap X, which used a gun that had been installed there beforehand!!@]@c."'
32373: 'BEATRICE@r@v27/90700675."Splendid!!@k @v27/90700676.Your absurd arguments even feel pleasurable to me now!@k @v27/90700677.I shall surrender the first game to you out of respect...!!@k @v27/90700678.I am impressed!!"'
32374: 'BEATRICE@r@v27/90700679."............Gaahaagh!!!"'
32375: '@rThe instant Beato admitted defeat in the first game,@k the stakes of blue truth once again pierced her chest, letting out a terrible sound...'
32376: 'BEATRICE@r@v27/90700680."......g......g''g''h............gaaaaghaahhh!!!@k @v27/90700681.This much won''t...stop me...... It''s not over yet!!@k @v27/90700682.Come, the second game!!"'
32377: '@rBeato just barely pulled the stakes that had pierced her chest out,@k ......but even though there was no hole left behind, it seemed to be a deep wound which let out a massive amount of blood.'
32378: '@rAnd an intense pain of equal measure tormented her...'
32379: '@rBut Beato grinned, grinding her teeth, and pushed for the next game to start.'
32380: '@rBut I won''t feel any sympathy.'
32381: '@r......Just by her existing there, we will be killed and made to suffer over and over,@k .........and Ange will be burdened with a future of isolation...!!'
32382: 'BEATRICE@r@v27/90700683."That is correct, just by my being here and laughing, the eternal hell will continue...!!@k @|@y@v27/90700684.I will not give you back to your sister...!@k @v27/90700685.She can spend a thousand years crying over the family that is never to return...!!"'
32383: 'Battler@r@v10/90100497."Bastaaaaaard!!@k @v10/90100498.No pity, no mercy! Here goes the second game!!@k @v10/90100499.I''ll start with the first crime!"'
32384: 'Battler@r@v10/90100500."I already saw through the locked-room murder where the six were killed in the chapel at the time.@k @v10/90100501.@|@y@c279.@[Someone secretly borrowed Maria''s key, and secretly returned it to Maria''s bag after the crime was over!!@]@c."'
32385: 'BEATRICE@r@v27/90700686.@|@y"@c900.@[From the time Maria received her key to the instant Rosa unsealed the envelope the next day, the key did not pass into anyone''s hands!!@]@c."'
32386: 'Battler@r@v10/90100502.@|@y"@c279.@[There is the possibility that the door to the chapel had an auto-lock just like Gramps''s study.@]@c.@k @v10/90100503.@|@y@c279.@[In other words, it was unlocked before the crime, with a rock or something wedged in so that it couldn''t close completely.@]@c.@k @v10/90100504.@|@y@c279.@[Then they gave the key to Maria.@]@c.@k @v10/90100505.@|@y@c279.@[Because the lock was automatic, it is possible to make a theory where the key wasn''t needed!@]@c."'
32387: 'BEATRICE@r@v27/90700687.@|@y"@c900.@[No door with an auto-lock exists other than Kinzo''s study!@]@c."'
32388: 'Battler@r@v10/90100506.@|@y"@c279.@[The victims locked the door from the inside.@]@c.@k @v10/90100507.@|@y@c279.@[One of the six was the culprit, and this person killed the other five, then pretended to be dead!!@]@c."'
32389: 'BEATRICE@r@v27/90700688.@|@y"@c900.@[The six were all already dead by the time they were discovered!@]@c.@k @v27/90700689.@|@y@c900.@[All of their deaths were homicides!@]@c.@k @v27/90700690.@|@y@c900.@[All six were pure victims; they did not take part in a mutual murder!@]@c.@k @v27/90700691.@|@y@c900.@[There were no simultaneous mutual murders!!@]@c."'
32390: 'Battler@r@v10/90100508.@|@y"@c279.@[There existed humans with no alibi at the time, like Kumasawa-san.@]@c.@k @v10/90100509.@|@y@c279.@[If we assume that such a person killed the six, and was hiding inside, then there are no problems!@]@c."'
32391: 'BEATRICE@r@v27/90700692.@|@y"@c900.@[There was no one hiding in that chapel.@]@c.@k @v27/90700693.@|@y@c900.@[Therefore, your ''killer hiding in the building'' locked-room scenario does not hold!@]@c."'
32392: 'BEATRICE@r@v27/90700694."What''s wrong, Ushiromiya Battleer, is that all?!@k @v27/90700695.It''s not so easy once you get to the second game, riiiight?!"'
32393: '@rA tremendous exchange of red and blue truth.'
32394: '@rThe stakes and wedges of blue truth that I sent flying darted at Beato one after the other, and one after another, Beato cut them down with her red truth, her red treasured sword, knocking them out of the air.'
32395: '@rBut the blood she had lost from the first game was probably awful.@k This intense exercise was putting her under even greater strain.'
32396: '@rI could see her breath growing ragged.'
32397: '@rThat''s why I can''t hold back now!@k@r......I''ll corner that witch!'
32398: '@rAnd this time...I''ll break through her!'
32399: 'Battler@r@v10/90100510."I''m not done yet... Yeah, that''s no good, that''s no goddamn good at all!!@k @v10/90100511.My twisted logic isn''t finished yet!!@k @v10/90100512.Then what about this!!"'
32400: 'Battler@r@v10/90100513.@|@y"@c279.@[The food they were given had small bombs in it, which exploded from inside their stomachs.@]@c.@k @v10/90100514.@|@y@c279.@[In other words, the crime is possible through trap X!@]@c.@k @v10/90100515.@|@y@c279.@[The details of a bomb that they could swallow without noticing and that could blow open their stomachs is a Devil''s Proof!@]@c.@k @v10/90100516.@|@y@c279.@[I refuse to explain!!@]@c."'
32401: 'BEATRICE@r@v27/90700696."Bfft...hahhahahahaha-hahhaha-hahha!!@k @v27/90700697.What the hell is thaaaaaat?!@k @v27/90700698.Small bommmmmmmbs?!@k @v27/90700699.Waa-hahhahaha-hah-hah-hah!!"'
32402: '@rBut Beato failed to knock down the blue wedge as it flew at an angle like a curveball.'
32403: '@rIt let out a loud thunk, and gouged itself deeply into her left shoulder.'
32404: '@rHowever, despite being on the receiving end of it, it seemed she couldn''t stop laughing at how much of a curveball it was.'
32405: '@r......Yeah, no wonder, even I''m amazed at how screwed up this reasoning is...!!'
32406: 'Battler@r@v10/90100517."Ha, laugh as much as you want!!@k @v10/90100518.Is there a problem with it?!!"'
32407: 'BEATRICE@r@v27/90700700."None!!@k @v27/90700701.Your wild arguments are my pleasure!!!"'
32408: 'BEATRICE@r@v27/90700702."And the next, the locked room with Jessica and Kanon?!"'
32409: 'Battler@r@v10/90100519."No problems there!@k @v10/90100520.@|@y@c279.@[If the culprit was one of the servants, they could have used a master key.@]@c.@k @v10/90100521.@|@y@c279.@[It''s not even a locked room!@]@c."'
32410: 'BEATRICE@r@v27/90700703."After that, there was an attack in the servant room from a mystery person who seemed to be Kanon, and Nanjo and Kumasawa were killed, right?!@k @v27/90700704.I had already declared Kanon''s death in red before that time.@k@v27/90700705. Then who was that Kanon?!"'
32411: 'Battler@r@v10/90100522.@|@y"@c279.@[If Kanon-kun''s death was declared with the red, there''s no way he was alive.@]@c.@k @v10/90100523.@|@y@c279.@[Therefore, there is a chance that it was someone else in a disguise that would make the group that was attacked mistake this person for Kanon-kun!@]@c."'
32412: 'BEATRICE@r@v27/90700706.@|@y"@c900.@[They would never mistakenly think any other person was Kanon!@]@c."'
32413: 'Battler@r@v10/90100524.@|@y"@c279.@[Then, just like the heredity of Kinzo''s name, there is a possibility that Kanon''s name was inherited by someone.@]@c.@k @v10/90100525.@|@y@c279.@[You could suppose that Kanon-kun was killed, a different person succeeded his name, and this person attacked them!!@]@c."'
32414: '@rA sound like a watermelon being squashed rang out, and a blue wedge was buried deep into Beato''s left flank...'
32415: '@rIt looked like she felt that one—maybe it hit her in a bad spot.'
32416: '@rAfter leaning over and moaning for a while,@|@y@w500. ......she laughed it off as though trying to make it seem like no big deal.'
32417: '@rYeah, I can tell.@k That must have hurt like a bitch...!!'
32418: 'BEATRICE@r@v27/90700707."Hyahhaaaaaaaahhh!!@k @v27/90700708.Once again, you''ve set up some Human as the culprit as if it were nothing!!@k @v27/90700709.You truly are gabbing on about things you would never say on the game board in a million years!!"'
32419: 'BEATRICE@r@v27/90700710."But it is valid!@k @v27/90700711.Your verbal assault tickles me!!@k @v27/90700712.......Such pleasure.@k@v27/90700713. .........This is not pain, ......it is pleasuuuure!!"'
32420: '@rWhen Beato howled, the wedge that had pierced her was blasted away.@k@rBut the wound remained, and continued tormenting her with intense pain.'
32421: 'Battler@r@v10/90100526."You ready? I''ll keep going.@k @v10/90100527.The blue truth given for the final murders in the second game, the three who died in Aunt Natsuhi''s room, should still be valid even with the 18th person X denied!@k @v10/90100528.Do you have a counterargument for that in red?!@k @v10/90100529.If not, the second game is all mine too!"'
32422: 'BEATRICE@r@v27/90700714."No, nothing!!@k @v27/90700715.It would be no fun at all to fight over such trivial matters!!@k @v27/90700716.You may have it, you may have the second game!!"'
32423: 'BEATRICE@r@v27/90700717."Gwaaaaaaaaagghghh!!!!@k @v27/90700718..........*gasp*, ......gwooooooooooohhhh.........!!"'
32424: '@rThe instant she admitted defeat in the second game, this time two blue stakes gouged through Beato''s chest...!'
32425: '@rThe witch''s lungs were gouged, and her intestines.@k@rThe witch''s face twisted in anguish.@k@rHer body twisted as she gasped in pain.'
32426: 'Battler@r@v10/90100530."Does it hurt......?"'
32427: 'BEATRICE@r@v27/90700719."Huuuuurt?@k @v27/90700720.......No, no, this just tickles.@k@|@y@v27/90700721. Uhhyahhyahyahyahhyaaaaaaahhh!!"'
32428: 'BEATRICE@r@v27/90700722."Compared to having your entire body torn to bits and turned into a pile of scrap meat, like your sister, that iiiiiiiiiiis?!@k @v27/90700723.I''ll make you scrap meat too, then you two siblings can be all mixed together like ground beef and pork, aaakkyakkyakkyaaaaaaaahhh!!"'
32429: 'Battler@r@v10/90100531."U-......uuurrraaaaaaaaaaaagggh!!@k @v10/90100532.I''ll beat you to death, I''ll tear you to bits the same way!!@k @v10/90100533.Next!@k @v10/90100534.The third game!!@k @v10/90100535.Come on, where''s your energy?!!@k @v10/90100536.This is where I knock you down to hell!!"'
32430: 'BEATRICE@r@v27/90700724."......Guh......gah......ooooaagghhh!!@k @v27/90700725.Naturally, as if I could let this wear me out!"'
32431: 'BEATRICE@r@v27/90700726."Yes. It is still far from over!@|@y@k @v27/90700727.Come, let us begin the third game, starting with the first six linked locked rooms!"'
32432: 'BEATRICE@r@v27/90700728."You penetrated this locked room at the time, and by all rights it should have remained that way.@k@v27/90700729. But then you went and killed off Kinzo...!!"'
32433: '@rAt the time, I hypothesized that Gramps was the culprit,@k and that after killing the other five and stringing the keys across each room, he constructed his own locked room in the boiler room,@k where, in the middle of carrying out some kind of scheme, he had an accident which resulted in him burning to death in the boiler.'
