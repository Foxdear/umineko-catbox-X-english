31856: 'Jessica@r@v04/90200073."By the time you get here, I''ll be a corpse with half my head spilled out."'
31857: '@rYes, she definitely said that.'
31858: '@r.........From what I could tell by looking at Jessica''s corpse, there were no wounds on her other than the damage to her head.'
