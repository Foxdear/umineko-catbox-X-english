31931: '@rAnd in this situation, it was very hard to imagine that this stake was the murder weapon.'
31932: '@r......He was killed with a powerful gun like the six in the dining hall,@k and after death, he was stuck with a stake, like Kyrie-san.'
31933: '@rI wonder if the golden threads that Kyrie-san spoke of attacked Uncle Krauss too.'
31934: '@rDoes there exist some kind of tool, like an endoscope, which is very thin but can be moved about at will.........?'
31935: '@rAnd that can also attack people......?@k@rNo way. I''ve never even heard of anything like that.'
31936: '@rBut even so, ......if I voiced that suspicion to one of my relatives,@k perhaps they would say "I wouldn''t put it past Grandfather to make one"...'
31937: '@rSince I can''t refute the existence of a golden thread X that can be moved at will and attack people,@k my only options are either to accept this completely incomprehensible weapon, or else,@k ......to accept that these murders were committed with magic.'
31938: '@rTo find the next corpse, I had to go out through the back door and search around outside a bit.'
31939: '@rBehind the mansion, in the wild-grown bushes that were almost swallowed up by the forest, there was something like an old well,'
31940: '@r......and right next to it were the corpses of Doctor Nanjo and Shannon-chan.@|@y'
31941: '@rBoth corpses had their heads smashed.'
31942: '@r......And there was a stake lying right next to each of their destroyed heads, though they weren''t stuck in.'
31943: '@r......All of the corpses were atrocious, but having to look directly at Shannon-chan''s lovely face, half of which was blown off, was very painful......'
