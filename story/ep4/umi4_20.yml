31821: '@r......For some reason, the contrast really bugged me.'
31822: '@rThere are probably a lot of mysteries surrounding Maria''s death, starting with the cause...'
31823: '@rAnd more than anything else.'
31824: '@rThe biggest mystery of this dining hall......was the "pitfalls".@k@r......The "pitfalls" that both Uncle Krauss''s group and Gohda-san''s had mentioned.'
31825: '@rAfter the six had been killed, five more had fallen through "pitfalls" and been captured.'
