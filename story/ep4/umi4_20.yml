31924: '@r......However, after being left alone for a whole day, once my feeling of tension faded completely,@k I had a level enough head to think that this was way too stupid to possibly be true.'
31925: '@rIn that extraordinary situation where their lives were exposed to danger,@k did they just lose their heads a little, and mistakenly think that a witch was attacking them with magic?'
31926: '@r............But multiple people testified to the same effect, and on top of that, none of their opinions contradicted one another.'
31927: '@r......If it had been a single person''s statement, I''d be able to suspect that they just didn''t see what they thought they saw,@k ......but doing that now is pretty...difficult......'
31928: '@rThen, right next to the back door, I found Uncle Krauss with his head half destroyed.@|@y'
