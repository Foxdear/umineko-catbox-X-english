32435: 'Battler@r@v10/90100537."There''s no problem!@k @v10/90100538.@|@y@c279.@[There are plenty of people who could have committed the crime besides Gramps!@]@c.@k @v10/90100539.@|@y@c279.@[You could even claim that the adults who were in the middle of a family conference at the time were all in on it and committed the crime together!@]@c."'
32436: 'BEATRICE@r@v27/90700730.@|@y"@c900.@[All five master keys were discovered, each in the pocket of one of the servants!@]@c.@k @v27/90700731.@|@y@c900.@[The individual room keys were found inside envelopes alongside the corpses!@]@c."'
32437: 'BEATRICE@r@v27/90700732.@|@y"@c900.@[In short, all keys related to the linked locked rooms were locked inside the linked locked rooms!!@]@c.@k @v27/90700733.@|@y@c900.@[No key could have been returned from outside the room using a crack in a door, a crack in a window, a vent or any place of the sort!!@]@c."'
32438: 'Battler@r@v10/90100540.@|@y"@c279.@[Then they were killed with poison gas!@]@c.@k @v10/90100541.@|@y@c279.@[Even if a key couldn''t pass through, gas could, right?!@]@c.@k @v10/90100542.@|@y@c279.@[The murder was carried out from outside the locked room!!@]@c."'
32439: 'BEATRICE@r@v27/90700734.@|@y"@c900.@[All of them had fatal wounds that appeared to be gunshot wounds!@]@c.@k @v27/90700735.@|@y@c900.@[Murdering them from outside the room would have been impossible!!@]@c.@k @v27/90700736.@|@y@c900.@[I shall say more with the red!@]@c."'
32440: 'BEATRICE@r@v27/90700737.@|@y"@c900.@[When the five other than Kinzo were killed, the killer was always in the same room as them!@]@c.@k @v27/90700738.@|@y@c900.@[I already declared in red at the time that there were no suicides!!@]@c."'
32441: 'Battler@r@v10/90100543.@|@y"@c279.@[After the murder of each person in their respective rooms, the culprit constructed a linked locked room.@]@c.@k @v10/90100544.@|@y@c279.@[But there was no way for the culprit to return the key for the last room to the inside of the locked room.@]@c.@k @v10/90100545.@|@y@c279.@[But they did manage to return it.@]@c.@k @v10/90100546.@|@y@c279.@[The first person to discover a corpse just had to pretend to find the key and pull it from the corpse''s pocket!!@]@c."'
32442: '@rShe couldn''t fully block that blue stake''s retort...!@k Pushed back by the blue wedges unleashed one after another, Beato finally failed to block one, and once again took a severe wound.'
32443: 'BEATRICE@r@v27/90700739."Gi...ggi......gyaaaaaahhh!!"@|@y'
