31772: '@rThe mansion was wrapped in silence.@k And in a horrible stench.'
31773: '@rStill, it''s pretty amazing how good humans are at adapting.'
31774: '@rTechnically, that smell was still pervading the entire mansion.'
31775: '@rBut I''d grown completely used to it and stopped minding it by this point.'
31776: '@rIt didn''t feel like anything more than any old house where someone had burnt some meat.'
31777: '@rThe stench knocked me back on first entering, but I ignored it and decided to head to the dining hall...'
31778: '@r......where I found all those corpses that were in such a sorry state that Gohda-san and Kumasawa-san had hesitated to speak of them in any detail.@|@y'
31779: '@rThey were the remains of the very first victims: Aunt Natsuhi and the rest.'
