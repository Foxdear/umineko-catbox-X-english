22730: 'Beelzebub@r@v43/42800009."Ugugugugu!!@k @|@y@v43/42800010.No way, no way, I won''t give it to yo~u!!@k @v43/42800011.Even the croissant wants me to eat i~~t!!!"'
22731: 'BEATRICE@r@v27/40700034."Y-yaa~y, yoo-hooooooooo, g''moooooorning, Battleeee~r!!@k @v27/40700035.Get a load of this guy, first thing in the morning and he''s back to moping already~?!?!@k @v27/40700036.It''s the beginning of a new day, and a new game, you know, so get your spirits up and let''s get this party starteeeeeeeeeeeddd!!"'
