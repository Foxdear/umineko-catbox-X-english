22726: '@rEven though Beelzebub could have ended it by either giving it back already or else throwing it into her own mouth,@k she intentionally ran around in circles, making fun of Battler.'
22727: 'Battler@r@v10/40100008."Give me my breakfast back, damn iiiiiiit!!@k @v10/40100009.If you give it back now, I''ll let you off with a single flick to the forehead.@k@v10/40100010. But just you try eating it!!"'
22728: 'Beelzebub@r@v43/42800005."What, are you gonna eat me inste~ad?!@k @|@y@v43/42800006.Kyaha!@k @v43/42800007_b.Try it if you think you can! I''ll bet I''d be as sweet as honey pancakes.@k@|@y@v43/42800008. ...kya!"'
