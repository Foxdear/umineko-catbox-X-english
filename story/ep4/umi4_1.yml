22818: '@r......And in their depths, he saw a light that he had seen at some time before...'
22819: '@rBattler was struck by how strongly they resembled the eyes of a girl who definitely couldn''t be here,@k ......but that was completely impossible.'
22820: 'Battler@r@v10/40100080."...I know it''s stupid,@v10/40100081. ......but for some reason, I''m getting that feeling.@k@|@y@v10/40100082. But that can''t be right.@k@v10/40100083. ......She''s supposed to still be six years old.@k@v10/40100084. ............You couldn''t possibly be...@v10/40100085..........Ange, could you............?"'
22821: 'Ange@r@v11/42000046."........................@k@|@y@v11/42000047. If I said yes, ...would you believe me?"'
22822: 'Battler@r@v10/40100086."Nn..............."'
22823: 'Ange@r@v11/42000048."I''ll put it another way.@k@v11/42000049. If I said "I am on your side, so trust me",@k@v11/42000050. would you believe me?@k @v11/42000051.Would you unconditionally trust some unknown woman you''re meeting for the first time just because she looks a little like someone you know?"'
