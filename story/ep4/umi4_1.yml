22779: 'Battler@r@v10/40100054."......Her........."'
22780: 'BEATRICE@r@v27/40700084."She says that she wants to join our game, you see.@k@v27/40700085. I took the liberty of sending her an official invitation to join us.@k@|@y@v27/40700086. Ronove, call the guest."'
