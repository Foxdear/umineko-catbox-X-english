22736: 'Beelzebub@r@v43/42800012."Kya-...kyahahahaha!@k @v43/42800013.Good morning, BEATRICE-sama!@k @v43/42800014.Well, that''s all for me!@k @|@y@v43/42800015.Here, Battler-kun, say aa~h!"'
