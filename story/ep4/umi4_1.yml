22750: 'Battler@r@v10/40100028."Sh-shut up.@k@v10/40100029. That was, uh, you got me a bit with your crappy acting and crazy plot twist, that''s all.@k@v10/40100030. I made an ass of myself, but you''d better not think that same move is ever gonna work again."'
22751: 'BEATRICE@r@v27/40700049."Naturally.@k@v27/40700050. Don''t disappoint me by falling for the same move over and over again, alright?@k @v27/40700051.*cackle*cackle*!"'
