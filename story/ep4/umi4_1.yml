22768: '@rSo, to break that silence, Beato had no choice but to start laughing herself.'
22769: 'BEATRICE@r@v27/40700062."*cackle*cackle*, hahhahahahahahahahahahahahahaha...!!@k @v27/40700063.As things should be.@k@v27/40700064. You and I are worthy adversaries.@k@v27/40700065. No matter how favorable our relationship, we shall never cross that line defining us as enemies.@k@v27/40700066. If you have not mistaken this, that is enough for me."'
