22738: 'Battler@r@v10/40100017."Mmmffmmmff, *munch*munch*, ...*gulp*.@k@v10/40100018. .....................@k@|@y@v10/40100019. ......H-hey, morning, Beato...@k@v10/40100020. ......Glad to see you''re in perfect form this morning."'
22739: '@r....................................'
22740: '@rBeato and Battler looked at each other.@k@r...It seemed that neither had a clue what was going on with the other.'
22741: 'BEATRICE@r@v27/40700037."B-......Battlerr......?@k @v27/40700038.Wh-wh-what is this, Ronoveeeee,@|@y@v27/40700039. he looks like he''s in high spiriiiiiiits!!@|@y@k @v27/40700040.He isn''t clutching his knees!@|@y @v27/40700041.And he''s answering!@|@y @v27/40700042.And he was even in the middle of eating!!"@|@y'
22742: 'Ronove@r@v31/43100035."Pukkukukukuku!!@k @v31/43100036.No, no, he certainly was clutching his knees, under the blanket as he slept like a baby.@k@v31/43100037. I informed him that it was time for him to wake up, but he just wouldn''t get out of bed.@k@v31/43100038. As for his food, it seems that he was rather too preoccupied with the naughty cat that had wandered in.@k@v31/43100039. Pu ku ku, puu ku ku ku ku!"'
