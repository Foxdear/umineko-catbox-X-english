22805: 'Battler@r@v10/40100063."......I mean, sure, I wasn''t used to this witch''s game in the beginning, and I''ve had a hell of a rough time, I''ll admit.@k@v10/40100064. But now, I''m finally starting to see how to fight and the knack to doing it.@k@v10/40100065. ...If the pathetic way I''ve been acting makes it look to you like I haven''t been serious, you''re mistaken."'
22806: 'Ange@r@v11/42000038.".........Am I?"'
22807: 'Battler@r@v10/40100066."Of course, I know I''ve gotta close in a lot more before I can grab Beato by the collar."'
22808: 'Battler@r@v10/40100067."But no matter how long that distance is, it is finite.@k@v10/40100068. And with each passing game, I am steadily closing that distance step by step!"'
22809: 'Battler@r@v10/40100069."No matter how long it takes, I will close in on that witch, and I''ll definitely checkmate her.@k@v10/40100070. ......Borrowing one of her common phrases, it might even take me "a thousand years".@k@v10/40100071. ...But even so, eventually, I will definitely win."'
22810: 'Battler@r@v10/40100072."Why?@k @v10/40100073.Because I will never accept losing.@k@v10/40100074. I will never stand still, and I''ll keep closing in on her!@k @v10/40100075.So in other words, there''s just one thing I can say for sure."'
22811: 'Battler@r@v10/40100076."......I will definitely win against that witch someday!@|@y @v10/40100077.That''s how it is."'
22812: 'Ange@r@v11/42000039."You sure are patient.@k@v11/42000040. Are you even trying to win?@k @v11/42000041.Even the finite can become infinite if it''s treated the wrong way.@k@v11/42000042. You''ve already become Achilles, unable to even outstrip a tortoise."'
22813: 'Ange@r@v11/42000043.".........Now I get it. So this is why I''m needed.@k@v11/42000044. At this rate, there''s no way you could win against the Endless Witch even after a billion years."'
