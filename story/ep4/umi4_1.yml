22708: 'BEATRICE@r@v27/40700015."I also, umm, considering that the fourth game is finally getting underway,@k@v27/40700016. I thought that it would be such a pain if he was so disheartened that he wouldn''t join us at the table,@k@v27/40700017. and so, you see, I asked you first, thinking that it would be better to prepare a countermeasure beforehand...!"'
22709: 'Ronove@r@v31/43100016."Hmmmm...@k@v31/43100017. In that case, indeed, I do think you would be well served to prepare such a countermeasure.@k@|@y@v31/43100018. Most unfortunately, due to your "North Wind and the Sun Strategy", it appears that Battler-sama has received quite a shock."'
