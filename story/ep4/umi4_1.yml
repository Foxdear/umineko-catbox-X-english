22701: 'Ronove@r@v31/43100005."Indeed I do.@k@v31/43100006. Although one could call that his charm.@k@|@y@v31/43100007. Pu ku ku..."'
22702: 'BEATRICE@r@v27/40700010."*cackle*cackle*cackle*!@k @v27/40700011.You could, you certainly could!@k @|@y@v27/40700012.Well, speaking of that.@k@v27/40700013. You know how he completely fell for the thing I pulled the last time?"'
22703: 'Ronove@r@v31/43100008."Oh, yes, completely and splendidly.@k@v31/43100009. ...His pure, rosebud-like innocence, arising from never once having been tricked by another since birth, you unreservedly violated."'
22704: 'Ronove@r@v31/43100010."............Even the joy of running around a field covered with beautiful new snow on a winter morning and trampling it utterly wouldn''t even begin to compare."'
22705: 'Ronove@r@v31/43100011."You took Battler-sama''s innocent heart, Milady,@k@v31/43100012. and thrillingly, splendidly, atrociously, mercilessly, and in quite the uncultured manner, enough to make one think "maybe I went a teensy little bit overboard...?",@k @v31/43100013.you most assuredly perpetrated the very worst of atrocities against it."'
22706: 'Ronove@r@v31/43100014."I am quite sure most people would start to feel down.@k@|@y@v31/43100015. Pukkukukuku, so much so, that I doubt they would ever want to see your face again."'
