22775: 'BEATRICE@r@v27/40700075."Hmph.@k@v27/40700076. A good disposition.@k@v27/40700077. You truly are a man like a phoenix.@k@v27/40700078. You don''t betray my expectations!@k @v27/40700079.With that, let us raise the curtains on the fourth game."'
