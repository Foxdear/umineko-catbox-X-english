22771: 'BEATRICE@r@v27/40700067."...........................@k@|@y@v27/40700068. ...Heh!@k @v27/40700069.Hahhahahyahhahha!!@k @v27/40700070.It seems that I am not the only one who cannot wait for the fourth game.@k@v27/40700071. I am pleased, Battler.@k@v27/40700072. Come, take your seat."'
