22711: '@rBeato lowered her voice slightly, asking timidly.@k@rRonove went along with that, and lowered his voice in the same way.'
22712: 'Ronove@r@v31/43100019."......In truth, he has been curled into a ball clutching his knees for some time now.@k@v31/43100020. I called out to him several times, but he did not answer.@k@v31/43100021. I also carried him something to eat, but he does not appear to have touched it."'
22713: 'BEATRICE@r@v27/40700020."...Th-that is...troublesome......@k@v27/40700021. Is he really feeling that down......?"'
22714: 'Ronove@r@v31/43100022."Pukkukukuku.@k@v31/43100023. It is only natural.@k@v31/43100024. ...After all, you@v31/43100025. com-@|@y@v31/43100026.pre-@|@y@v31/43100027.hensively@|@y@v31/43100028. destroyed him, Milady.@k@v31/43100029. That would turn most anyone into a misanthrope."'
22715: 'BEATRICE@r@v27/40700022."Hoh, distrust of Humans? How convenient!@k @v27/40700023.Let him give up on Humans and trust witches, wahahaha...@k@|@y@v27/40700024. ...............O-...oh,@v27/40700025. *cough*.@k@v27/40700026. Sorry, I took it too far."'
22716: '@rBeato had tried to joke about it, but it seemed that the situation was quite serious, and after picking up on this, she hid her laughter.'
22717: 'BEATRICE@r@v27/40700027."......Is it really that serious...?@k @v27/40700028.Sh-should we wait just a little longer before beginning the fourth game...?"'
22718: 'Ronove@r@v31/43100030."Because Lady BERNKASTEL''s guest will be coming,@k@v31/43100031. it may be more appropriate to open the fourth game quickly.@k@|@y@v31/43100032. However, it might be useful if you were to show him a little consideration, Milady."'
22719: 'BEATRICE@r@v27/40700029."Consideration!@k @v27/40700030.Consideration, you say?!@k @v27/40700031.How should I show that...?!@k @|@y@v27/40700032.He is feeling down, so,@v27/40700033.@|@y ...h-how about...I cheer him up, or something?!"'
22720: 'Ronove@r@v31/43100033."When a person''s heart is closed off to the light, it is useless to interact with them in a gloomy fashion.@k@v31/43100034. You can do nothing but shine with a brightness stronger than the dark."'
