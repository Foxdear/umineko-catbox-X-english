22693: 'Ronove@r@v31/43100001."Good morning, Milady.@k@|@y@v31/43100002. My, my, you do appear to be in a good mood.@k@v31/43100003. What a pleasant awakening you seem to have had."'
22694: 'BEATRICE@r@v27/40700001."''Pleasant awakening''...!@k @v27/40700002.I was so excited, I couldn''t sleep a wink.@k@|@y@v27/40700003. After all, the curtain is rising on the oh-so-fun fourth game...!"'
22695: '@rIt seemed that she truly had been so excited that she hadn''t gotten any sleep.'
22696: '@rAnd yet she showed absolutely no signs of tiredness; was that due to her youth, or her low mental age?'
22697: '@rRonove chose not to say that aloud, and laughed with a "pu ku ku" instead.'
22698: 'BEATRICE@r@v27/40700004."I really ran that Battler into the ground last time!@k @v27/40700005.Ah, that look of "you tricked meee" all over his face!@k @v27/40700006.He looked so pathetic!@k @|@y@v27/40700007.In any case, I do hope he''s not still feeling down?"'
22699: 'Ronove@r@v31/43100004."Feeling down, you say...?"'
