22827: 'Battler@r@v10/40100089."...Sorry.@k@v10/40100090. Yeah, I am too trusting.@k@v10/40100091. The last game should have taught me that.@k@v10/40100092. ......Is this what you meant when you said I wasn''t serious?"'
22828: 'Ange@r@v11/42000057."Yes.@k@v11/42000058. You may think you''re fighting against the witch, but all you''re doing is making friends with her and having fun.@k@v11/42000059. ......You''re just competing in a friendly game of chess."'
22829: 'Ange@r@v11/42000060."That may be a serious contest for you two,@k@v11/42000061. but looking at it from far away, I only see you two playing around like you''re good friends, protected by the rules."'
22830: 'Battler@r@v10/40100018.".....................@k@|@y@v10/40100094. ......Ihihihi.@k@v10/40100095. That''s harsh."'
22831: 'Ange@r@v11/42000062."But as long as you can''t win this game, you won''t be released from this place.@k@v11/42000063. ......That''s why I came.@k@v11/42000064. To bring this game to its conclusion.@k@v11/42000065. ......You claim that you''re closing in on the witch, but you''re just like a hamster running around in a wheel."'
22832: 'BEATRICE@r@v27/40700095."*cackle*cackle*!@k @v27/40700096.Oh, those? Those things that run around and around in a wheel night after night?"'
22833: 'Ange@r@v11/42000066."At a glance, you might think that running around in a wheel is endless.@k@v11/42000067. ......Endless Witch, BEATRICE.@k@v11/42000068. You are just like that wheel.@k@v11/42000069. And he is the one running around in the wheel forever, thinking he''s fighting, but actually just making a fool of himself."'
22834: 'Ange@r@v11/42000070."......This isn''t a game.@k@v11/42000071. This is nothing more than a cage to keep him imprisoned for all eternity."'
22835: 'BEATRICE@r@v27/40700097."Hoh.@k@v27/40700098. ......You would liken my infinity to a mere wheel that a mouse plays in?@k@v27/40700099. Interesting, interesting, *cackle*..."'
22836: 'Ange@r@v11/42000072."Something that''s infinite in a certain dimension tends not to be infinite in a higher one.@k@v11/42000073. A Menger sponge may have infinite surface area, but that only applies in a world of less than three dimensions.@k@v11/42000074. In the three-dimensional world of reality, it has zero mass.@k@v11/42000075. Not only is it not infinite, it can''t even exist."'
22837: 'BEATRICE@r@v27/40700100."*cackle*cackle*cackle*...!@k @v27/40700101.What an assertive woman.@k@v27/40700102. It seems you are worthy of calling yourself my enemy."'
22838: 'Battler@r@v10/40100096."............Who...are you?"'
22839: 'Ange@r@v11/42000076."I am your ally.@k@v11/42000077. And an enemy of witches.@k@v11/42000078. .........Of course, you don''t have to believe it."'
22840: 'Ange@r@v11/42000079."No one can prove that I really am your ally.@k@v11/42000080. In fact, it would be preferable if you stayed on your guard strongly enough to find me very suspicious."'
22841: 'Battler@r@v10/40100097.".........You''re right.@k@v10/40100098. I got burned bad the last time.@k@v10/40100099. I''ve got to be at least that careful.@k@v10/40100100. ...I''m done with getting tricked."'
22842: 'BEATRICE@r@v27/40700103."*cackle*cackle*cackle*cackle*......!"'
22843: '@rBeato laughed with true satisfaction in a way that was insulting only to Battler.'
22844: 'Ange@r@v11/42000081."People don''t just get tricked out of the blue.@k@v11/42000082. They neglect to check things for themselves, and entrust that to other people—and that''s when they get tricked.@k@v11/42000083. ......Saying that you thought the light had turned green just because you saw other people start crossing is no excuse for getting into an accident.@k@v11/42000084. Get it...?"'
22845: 'Battler@r@v10/40100101."Yeah... I get it.@k@v10/40100102. ......You''re telling me not to swallow information given to me by others, but to think for myself.@k@v10/40100103. .........I''ve just been swallowing the magic that Beato showed me."'
22846: 'Battler@r@v10/40100104."I''d stopped thinking.@k@v10/40100105. That''s why it was no good."'
22847: '@rBattler grimaced as he remembered his many painful losses.@k ...Seeing that, the witch laughed audaciously once again.'
22848: 'Ange@r@v11/42000085."I will advise you in a way that will be to your advantage.@k@v11/42000086. Of course, you shouldn''t just swallow the things I say.@k@v11/42000087. Because no one can provide absolute proof that I''m on your side."'
22849: '@rIn the last game, VIRGILIA, who I''d thought was an ally, turned out to be on the witch''s side after all.'
22850: '@r......Battler couldn''t get that eerie smile worn by VIRGILIA, who he had even thought of as dependable, out of his head.'
22851: 'Ange@r@v11/42000088."So you don''t have to unconditionally trust me.@k@v11/42000089. Therefore, taking my advice as nothing more than an opinion to be considered is absolutely fine.@k@v11/42000090. After all, ......the player who''s fighting in a game against the witch is you."'
22852: 'Battler@r@v10/40100106."...Yeah, you''re right.@k@v10/40100107. Saying I lost because I followed the moves of an outsider would be just too pathetic of an excuse."'
22853: 'BEATRICE@r@v27/40700104."Indeed it would!@k @v27/40700105.My opponent is Battler.@k@v27/40700106. You are nothing more than an outsider.@k@v27/40700107. It is good that you understand that.@k@v27/40700108. *cackle*!"'
22854: 'Ange@r@v11/42000091."No, I''m not an outsider.@k@v11/42000092. BEATRICE, Ushiromiya Battler,@k@v11/42000093. ...and me with my bird''s-eye perspective over you...will fight in a formation almost like a triangle.@k@v11/42000094. At a glance it might not seem to be a united front, but fighting together is not the only way to form a united front."'
22855: 'BEATRICE@r@v27/40700109."Hoh.@k@v27/40700110. What an odd thing to say."'
22856: 'Ange@r@v11/42000095."Just now, he described fighting with you as closing the distance.@k@v11/42000096. But you can''t measure distance with a single eye.@k@v11/42000097. Only with two eyes are things visible in three dimensions, and only then can distance be measured."'
22857: 'Ange@r@v11/42000098."......And having two viewpoints is meaningless if they''re in the same place.@k@v11/42000099. You can gauge the witch more accurately if they''re far apart."'
22858: 'Battler@r@v10/40100108."......Shooting from different positions and different angles.@k@v10/40100109. ...So, like crossfire, then.@k@v10/40100110. Heheh, interesting."'
22859: 'Ange@r@v11/42000100."We will shoot from different positions...and different angles.@k@v11/42000101. ......So I won''t make friends with anybody.@k@v11/42000102. In order to separate my own position and catch the witch in a pincer attack."'
22860: 'BEATRICE@r@v27/40700111.".........Are you sure about this, Battlerr?@k @v27/40700112.This woman may actually be an ambush I set up, you know?@k @v27/40700113.She might just be saying something plausible to gain your trust, you know...?"'
22861: 'Battler@r@v10/40100111."......Maybe.@k@v10/40100112. She''s been saying that over and over again herself.@k@v10/40100113. ...So, of course, I can''t blindly accept her advice."'
22862: 'Battler@r@v10/40100114."But I can think for myself and decide whether it''s worthy of being trusted or not.@k@v10/40100115. As long as I don''t stop thinking for myself, I won''t be tricked by anyone again...!"'
22863: 'BEATRICE@r@v27/40700114."*cackle*cackle*cackle*!!@k @v27/40700115.Impressive confidence, Ushiromiya Battleerr!@k @v27/40700116.After you''ve said so much, it makes me want to...@k @v27/40700117.trick you all over again, you see...?@k @v27/40700118.And I want to see what kind of face you''ll make when you realize that you''ve been tricked yet again!@k @v27/40700119.I like it, kuhhahahahahahahaha!!"'
22864: 'Battler@r@v10/40100116."......So, it looks like you know my name, but I don''t know yours.@k@v10/40100117. ...Tell me your name."'
22865: '@rFor a while, the woman remained silent without the slightest change in her expression.'
22866: '@r...She looked as though she couldn''t decide whether to say her name or not, or possibly, as though she was deciding what to call herself on the spot.'
22867: 'Ange@r@v11/42000104."......Gretel."'
22868: 'Battler@r@v10/40100118."Girdle?@k @v10/40100119.You wear one?"'
22869: 'Ange@r@v11/42000105."That''s my name, dumbass.@k@v11/42000106. Call me Gretel."'
22870: 'Battler@r@v10/40100120."Then should I call myself Hansel?@k @|@y@v10/40100121.Ihihihi, just kidding, I''m Ushiromiya Battler!@k @v10/40100122.Just call me Battler."'
22871: 'Ange@r@v11/42000107."............Nice to meet you.@k@v11/42000108. ...I hate handshakes.@k@v11/42000109. Don''t take it personally."'
22872: 'Battler@r@v10/40100123."...Yeah, you''re right, sorry.@k@v10/40100124. I mean, it isn''t a sure thing that you''re on my side.@k@v10/40100125. ......And you only just told me to keep my guard up, too."'
22873: '@rBattler drew back the right hand he had stuck out.'
22874: '@rHis bitter smile disappeared, and was replaced with a strong expression of resolve for the new game, now in its fourth iteration.'
22875: 'Ange@r@v11/42000110."Battler.@k@v11/42000111. ......Think deeply about why you must win against this witch.@k@v11/42000112. ......You can''t stop with something abstract, like "She annoys me so she''s going down".@k@v11/42000113. ......Have a deep conviction that you''ll definitely defeat the witch and escape from this world."'
22876: 'Ange@r@v11/42000114.".........Because there is definitely...@v11/42000115.......someone waiting for you to come back.@k@v11/42000116. ......For her sake as well, you...@v11/42000117............................"'
22877: '@rMaybe she had something on her mind.@k Gretel clenched a fist in front of her chest and hung her head in silence, at a loss for words for a short while.'
22878: '@rBeato spoke up in a forceful voice, shattering that silence.'
22879: 'BEATRICE@r@v27/40700120."Good, that should be enough of an introduction for Gretel or whoever!@k @v27/40700121.Come, try to remember, what happened on October 4th!@k @v27/40700122.Kuhhihihihihihihi, the curtain opens on the fourth game!!"'
22880: '@rIn unison with her voice, the clock, which had been turned back to October 4th, 1986, ......started to move, as though blown by a suddenly raging storm.'
22881: '@rWhile we remained in the witch''s tea room, the blue-gray sea and the green Rokkenjima spread out beneath us,@k ......and we could see the boat heading there, trailing a wake behind it.'
