26011: '@r..........................................'
26012: 'Sakutarou@r@v33/44200304.''........................Uryu...@k@v33/44200305. .........Maria, ...answer me......'''
26013: 'Maria@r@v13/40400878."..........................."'
26014: 'Sakutarou@r@v33/44200306.''.........Uryu...@k@v33/44200307. ......So I really am...@v33/44200308....a stuffed animal...?@k @v33/44200309.......I''m made of cloth and cotton,@v33/44200310. ......so there''s no way I can...@v33/44200311.talk......?@k @v33/44200312.......Is that why...@v33/44200313....I can''t talk to you.........?'''
26015: '@rSakutaro looked up at Maria sadly.'
26016: '@rMaria''s face was covered with tears, and she looked as though she had even lost the emotion of sadness......'
26017: 'Maria@r@v13/40400879."............Uu.@k@v13/40400880. ......I can hear you, Sakutaro.@k@v13/40400881. ......You aren''t a stuffed animal made of cloth and cotton.@k@v13/40400882. .........You''re my...friend.@k@|@y@v13/40400883. ..................Hate Ange.@k@v13/40400884. ......Uuuuuuuuuuuu......"'
26018: 'Sakutarou@r@v33/44200314.''Uryu... I''m sorry Maria, I''m sorry Maria......!@k @v33/44200315.Uryu......!'''
26019: '@rSakutaro felt regret.@k By freezing her heart, Maria had finally been able to escape from her sadness.'
26020: '@r...By speaking up and calling her back, he had caused her to become overwhelmed with sadness again...'
26021: '@rSakutaro tried toddling up to Maria and hugging her, then letting go,@k gazing at her appearance uneasily and trying it again, lost as to how he could bring Maria''s spirits up.'
26022: '@r......He might have looked a little humorous doing that.'
26023: '@rAs a result, that was able to divert Maria''s feelings from sadness......'
26024: 'Maria@r@v13/40400885."Sorry.@k@v13/40400886. .........More crying won''t help anything."'
26025: 'Sakutarou@r@v33/44200316.''You got in a fight with Ange, but you still have a lot of friends, Maria...@k@v33/44200317. Not just me.@k@v33/44200318. .........You have everyone else too.@k@v33/44200319. Sakusuke and Sakukichi, the animal band, and many, many more......'''
26026: '@rMaria looked at the many stuffed animals around her pillow, which were gathered together as though they were having a conference.'
26027: 'Sakutarou@r@v33/44200320.''......They''re all...worried about you, Maria.@k @v33/44200321.They''ve all been discussing and discussing how to cheer you up, you know......?'''
26028: 'Maria@r@v13/40400887."....................................@k@v13/40400888. ......They won''t......go away...like Ange...?"'
26029: 'Sakutarou@r@v33/44200322.''They won''t.@k@v33/44200323. We''ll always be together.'''
26030: 'Maria@r@v13/40400889.".........Really?@k @v13/40400890.You''re all only with me at home.@k@v13/40400891. Can''t go out together when Mama''s with us, and can''t go together to school."'
26031: 'Sakutarou@r@v33/44200324.''We aren''t allowed to go to school, so you''ll get in trouble if the teacher finds out.@k@|@y@v33/44200325. But if no one finds out, we can be together at any time.'''
26032: 'Maria@r@v13/40400892."......Sakutaro, you''re big, so you''d be found."'
26033: 'Sakutarou@r@v33/44200326.''Then you can take some of the kids that are small enough to walk around with.@k@|@y@v33/44200327. ......For example...what about them?@k@v33/44200328. If you take the friends in the forest band,@v33/44200329. ......look, they''re small, so they can hide in your pocket and go to school with you.'''
26034: 'Maria@r@v13/40400893.".........There''s a lot of them in the band.@k@v13/40400894. Can''t fit them all in my pockets."'
26035: '@rShe gathered all of the forest band pieces that were scattered across her bed.'
26036: '@rThere were about as many of them as pieces in a chess set, so it would probably be impossible to fit them all in her pocket...'
26037: 'Sakutarou@r@v33/44200330.''In that case, you can just take friends that you''re especially close with.@k@v33/44200331. ......Why don''t you take the four rabbits, the ones you''re closest to in the forest band?'''
26038: 'Maria@r@v13/40400895."......Four could fit in my pocket.@k@|@y@v13/40400896. ......Yeah.@k@v13/40400897. This way, they won''t be found."'
26039: 'Sakutarou@r@v33/44200332.''So this way, you won''t be alone even at school, Maria.@k@v33/44200333. Those kids will be with you even where I can''t go.'''
26040: 'Maria@r@v13/40400898."...............Yeah.@k@v13/40400899. ......Maybe...won''t be lonely that way.@k@v13/40400900. ......Maybe I can hold out......until I get home from school..."'
26041: 'Sakutarou@r@v33/44200334.''As long as we aren''t found by the teacher or Mama, we can be with you at any time.@k@v33/44200335. So let''s be together forever, play together forever.@k@|@y@v33/44200336. We definitely won''t leave you all alone, Maria.@k@v33/44200337. Uryu!'''
26042: '@rMaria''s expression finally regained a little of its brightness.'
26043: '@r......That''s right.@k Thinking about it, my world didn''t start out with Ange in it.'
26044: '@rEven without Ange, everyone was together and it was fun.'
26045: '@rSo it''s weird to suddenly get sad just because Ange''s gone when she was the last to come in.'
26046: '@r...All that''s happened is that I''ve returned to the world right before Ange entered it.@k@r......So there''s nothing to be sad about.'
26047: 'Maria@r@v13/40400901."......Yeah.@k@v13/40400902. Not lonely.@k@v13/40400903. Sakutaro and everyone else is with me."'
26048: 'Sakutarou@r@v33/44200338.''Uryuu!@|@y@k @v33/44200339.Loooove you, Maria...!'''
26049: 'Maria@r@v13/40400904."I won''t let any more Humans come into my world.@k@v13/40400905. ......Mariage Sorciere is an alliance only between me and BEATRICE."'
26050: 'Maria@r@v13/40400906."......Even Beato opposed letting Ange join in the beginning.@k@v13/40400907. .........It''s alright this way.@k@v13/40400908. Ange was still too young."'
26051: 'Sakutarou@r@v33/44200340.''......Until you can be friends with Ange again, I think it''s okay to forget about her for now.@k@v33/44200341. Just wait until you''ve regained your high spirits, and then play with her again.@k@v33/44200342. Until then, all of us will be by your side.'''
26052: 'Maria@r@v13/40400909.".........Thanks.@k@v13/40400910. ......Sakutaro, ......everyone."'
26053: '@rThen, I once again regained my former world.@k@rI regained the world where I wasn''t lonely, and where I was surrounded by many friends.'
26054: '@rAs always, I didn''t have any Human friends at school, but my magic friends were always with me.'
26055: '@rEven during class, I could hear the rabbit band hiding in my pocket talking together and giggling, and they sounded like they were having a lot of fun.'
26056: '@rJust listening to that added a lot of color to those lonely school hours.'
26057: '@rI made sure that my other friends, too, were always with me, as long as Mama and the teacher wouldn''t find out.'
26058: '@rWhen Mama told me to go play outside, I would secretly pack Sakutaro and Sakusuke and the rest into my bag, and play together at the library or somewhere.'
26059: '@rAnd when Mama was late coming home and I went shopping for dinner, I always went with them.'
26060: '@rThe men working at the convenience store were always nice to Sakutaro.@k@rSometimes they even gave me two extra things for free, one for me and one for Sakutaro.'
26061: '@rWhenever Mama found out, I would get in trouble for bringing Sakutaro and the rest outside.'
26062: '@rWhenever the teacher found out, I would get in trouble for bringing toys to school.'
26063: '@rThe toxin must be strong in Mama and the teacher.@k That''s why Sakutaro and the others just look like normal stuffed animals to them.'
26064: '@rAfter all, the men at the convenience store say hello to Sakutaro.'
26065: '@r.........Not all Humans are worthless.@k There are a ton of people who, unlike Ange and Mama and my teacher, can say hello to magic friends like I can......'
26066: '@r@v99/ShopMA4005."Oh, Maria-chan.@k@v99/ShopMA4006. Welcome.@k@v99/ShopMA4007. Is your mama late coming home tonight too...?"'
26067: 'Maria@r@v13/40400911."Yeah.@k@v13/40400912. ......But Sakutaro''s with me, so I''m not lonely.@k@|@y@v13/40400913. Right, Sakutaro?"'
26068: 'Sakutarou@r@v33/44200343.''Uryuu.@k@v33/44200344_b. It''s not just me today.@k@v33/44200345. Other friends are also with us.'''
26069: '@r@v99/ShopMA4008."Oh, other friends?@k@v99/ShopMA4009. What kind of friends are with you today?"'
26070: 'Maria@r@v13/40400914."Today, the rabbits from the forest band are also with me.@k@v13/40400915. ......Look, they''re in my pocket."'
26071: '@rMaria began to line up four ceramic rabbit dolls on the register.'
26072: '@rAs the owner of the shop looked at them with a smile, he signaled a part-timer with his chin.'
26073: '@rThe sign on the other register that said "closed" was taken down, and the part-timer called out for everyone to move over there.'
26074: '@rAll of the people in line behind Maria formed a new line over there instead...'
26075: '@r@v99/ShopMA4010."Yes, I see.@k@v99/ShopMA4011. You sure have a lot of friends, Maria-chan.@k@v99/ShopMA4012. But I hope your mama comes home soon."'
26076: 'Maria@r@v13/40400916."Uu.@k@v13/40400917. Mama is busy with work again, so she''s staying at the company.@k@v13/40400918. She''s very busy lately.@k@v13/40400919. ......She hasn''t even been able to get much time to talk to me on the phone."'
26077: 'Maria@r@v13/40400920."But I''m not lonely!@k @v13/40400921.I have Sakutaro and all the rest!@k @v13/40400922.Right?"'
26078: 'Sakutarou@r@v33/44200346.''Uryuu!!'''
26079: 'Maria@r@v13/40400923."All of the rabbits in the band are with me too.@k@v13/40400924. Look.@k@v13/40400925. Kyuu-kyuu♪"'
26080: '@r@v99/ShopMA4013."Is kyuu-kyuu the sound a rabbit makes?@k @v99/ShopMA4014.Come to think of it, I''ve never heard one."'
26081: '@rAfter smiling at Sakutaro, who was poking his head out of her knapsack,@k she played around with the rabbit band on the register, making them frolic around.'
26082: '@rEven as he gazed at this heartwarming sight, the shop manager had a slightly pitying look on his face.'
26083: '@r......This was apparently a family without a father, and where the mother had to work hard and couldn''t come home very often.'
26084: '@rOn top of that, it looked like this girl didn''t even have any friends.'
26085: '@rAs he watched this girl play around happily with her dolls and claim that she wasn''t lonely despite everything,@k he couldn''t help but feel a kind of compassion.'
26086: '@rAnd actually, this wasn''t limited to him alone.@k Maria had become very famous in this shopping district...'
26087: '@r@v99/ShopMA4015."Maria-chan, you should eat some oden every once in a while.@k@v99/ShopMA4016. You won''t grow if you don''t eat your eggs and fish paste."'
26088: 'Maria@r@v13/40400926."Uu?@k @v13/40400927.Can''t get a cream roll...?"'
26089: 'Sakutarou@r@v33/44200347.''Uryu.@k@v33/44200348. You need variety or you won''t get big.@k@v33/44200349. How about oden for today?'''
26090: 'Maria@r@v13/40400928."Uu.@k@v13/40400929. ......Okay, I''ll have oden."'
26091: '@r@v99/ShopMA4017."Yep yep, that''s the ticket.@k@v99/ShopMA4018. Why don''t I stick a whole bunch in there.@k@v99/ShopMA4019. Want mustard?"'
26092: 'Sakutarou@r@v33/44200350.''Uryuu.@k@v33/44200351. I can''t handle spicy things......'''
26093: '@r@v99/ShopMA4020."Alright, I see.@k@v99/ShopMA4021. Then, you make sure you don''t let it spill on the way home.@k@v99/ShopMA4022. Best eat it while it''s hot."'
26094: 'Maria@r@v13/40400930."Uu.@k@v13/40400931. Thank you."'
26095: '@rShe had planned on getting some sweet pastries for dinner like usual, but since oden had been recommended to her, she would be having that tonight instead.'
26096: '@rLetting someone else determine the menu makes for an unexpected and interesting meal.'
26097: '@r......Very often, Maria had to decide on her own what to have for dinner, so it was easy for the menu to get a little one-sided.@k So it felt fun to look forward to a meal she hadn''t anticipated...'
26098: 'Sakutarou@r@v33/44200352.''Uryuu!@k @v33/44200353.Thanks for giving us extra, mister!'''
26099: '@r@v99/ShopMA4023."Send my regards to your other friends at home.@k@v99/ShopMA4024. No nibbling at it on the way home, now.@k@v99/ShopMA4025. Go straight home and eat it there."'
26100: 'Maria@r@v13/40400932."Uu!@k @v13/40400933.Thanks, mister!!"'
26101: '@rMaria held the bag with the oden container high for all to see......'
26102: 'Maria@r@v13/40400934.".................................@k@|@y@v13/40400935. .........Huh......?"'
26103: 'Sakutarou@r@v33/44200354.''......Uryu?@k @v33/44200355.What is it, Maria?'''
26104: 'Maria@r@v13/40400936.".........The key isn''t in my pocket."'
26105: '@rStanding in front of the door to her house, Maria searched and patted all over her body.@k@r......The key to the house wasn''t there.'
26106: '@rShe always methodically put it in the same pocket.@k So there was no way she had put it in another pocket, but she searched her whole body just in case.'
26107: '@r......It really wasn''t there.'
26108: 'Sakutarou@r@v33/44200356.''Did you drop it when you took your wallet out......?'''
26109: 'Maria@r@v13/40400937."No.@k@v13/40400938. Definitely felt it when I took my wallet out.@k@v13/40400939. Also definitely felt it when I checked my pocket on the way home."'
26110: 'Maria@r@v13/40400940."......It was there until partway.@k@v13/40400941. Didn''t drop it!@k @v13/40400942.Uu-uu-uu...!"@|@y'
26111: '@rThe late autumn wind had been made bearable by the thought of the heater that was waiting at home,@k but now that Maria had lost her key and had no idea what to do, she was really feeling it.'
26112: '@rBut no matter how hard she searched, she couldn''t find her key.@k She turned out all her pockets, and even tried taking off her jacket and hitting it, but to no avail.'
26113: '@r......Of course, she also turned the knapsack Sakutaro was in upside down, but no key came out.'
26114: 'Maria@r@v13/40400943.".........Uu.@k@v13/40400944. .........Uu-uu-uu!!!"'
26115: '@rSomething that should have been there...wasn''t where it was supposed to be.@k@rWhy isn''t the key there, when I didn''t do anything wrong?'
26116: '@r......Why isn''t it?!@k@rWhy?!@k Why...?!!!'
26117: '@rMaria stamped on the ground, cold and frustrated and angry...@k@rThe bottom of her foot throbbed, but even so, it didn''t lessen her frustration.'
26118: '@r......Before long, bitter tears were pouring down her face.'
26119: 'Maria@r@v13/40400945."......Uu.@k@v13/40400946. ......Uu!!@|@y@k @v13/40400947.Uuuu!!"@|@y'
26120: '@rIt wasn''t her fault.@k So it was someone else''s.'
26121: '@rBut Maria didn''t know who that someone was, and could do nothing but continue to let out a moan of anger.'
26122: 'Sakutarou@r@v33/44200357.''......Uryu......@k@v33/44200358. You must have dropped it partway...@k@v33/44200359. Let''s look for it, okay?@k @v33/44200360.Let''s go back the way we came and search, okay...?'''
26123: 'Maria@r@v13/40400948."......Uu...@k@v13/40400949. I was excited to buy oden, ......and I got eggs and stuff for free......@k@v13/40400950. Can''t eat it while it''s hot......@k@|@y@v13/40400951. .........Uuuuu!!!"'
26124: 'Sakutarou@r@v33/44200361.''...Maria......I know it''s frustrating, but let''s search, okay...?@k @v33/44200362.It''s no one''s fault... Let''s search...'''
26125: '@rMaria finally lent an ear to Sakutaro''s words, and began to plod back the way she came.'
26126: '@r......The wind was colder than it had been, and felt like it was blowing in through the gaps in her jacket to spite her...'
26127: 'Sakutarou@r@v33/44200363.''Uryu...@k@v33/44200364. Let''s watch our feet closely and search, okay...?@k @v33/44200365.And then let''s get home quickly, and eat oden while getting warm by the heater, okay?@k @v33/44200366.I''m sure it''ll taste good.'''
26128: 'Maria@r@v13/40400952.".........Uu.@k@v13/40400953. ......Not here.@k@v13/40400954. ......Uu.@k@v13/40400955. ......Not here..."'
26129: '@rAs Sakutaro encouraged her, Maria searched for the key...'
26130: '@rBut she made it all the way back to the convenience store where she''d bought the oden.@k@r......She hadn''t found it.'
26131: '@rJust in case, she asked the man at the convenience store whether they had found a dropped key,@k but they hadn''t found anything.'
26132: '@r......One more time, she returned home, paying close attention to the area around her feet.@k@rBut still - she didn''t find it.'
26133: '@rShe was no longer frustrated enough to stomp her feet.@k@r......But hot tears dripped down her face.'
26134: '@rThe oden was stone cold.'
26135: '@r...Even though the man at the shop had said to eat it while it was hot, she hadn''t been able to.'
26136: '@r......He had given her so much extra stuff for free......'
26137: 'Sakutarou@r@v33/44200367.''......Uryu......@k@v33/44200368. Don''t cry......@k@v33/44200369. ......Mama isn''t coming back tonight.@k@v33/44200370. ......Let''s do our best to search......'''
26138: 'Maria@r@v13/40400956.".........Why can''t I find it...@k@v13/40400957. ......Uuuu............uuuuuuuu!"'
26139: 'Sakutarou@r@v33/44200371.''Maria, don''t cry...!@k @v33/44200372.Let''s do our best to search...!@k @v33/44200373..........Maria......'''
26140: '@rMaria was no longer able to hold back her tears.'
26141: '@rSobbing, clutching Sakutaro, and with the oden bag in her hand, she returned once more down the road she had come by.'
26142: '@rPerhaps because it was now later at night, and more houses and stores had turned their lights off by now, it was even darker and harder to search than before.'
26143: '@r......And, once again without finding the key, she returned to the convenience store.'
26144: '@r@v99/ShopMA4026."Maria-chan,@v99/ShopMA4027. ......you still can''t find your key...?"'
26145: 'Maria@r@v13/40400958."...Uu...@k@v13/40400959. ......Key, ......gone..."'
26146: '@r@v99/ShopMA4028."Your mother was away for the night?@k @v99/ShopMA4029.You can''t get into your house without a key?"'
26147: 'Maria@r@v13/40400960."Uu......@k@v13/40400961. ......Can''t get in......"'
26148: '@r@v99/ShopMA4030."Well, that is a pretty pickle...@k@v99/ShopMA4031. Did you try going to the police?@k @v99/ShopMA4032.It might have been handed in."'
26149: 'Maria@r@v13/40400962."...............Mama said not to talk to policemen, even if they start talking to me."'
26150: '@r@v99/ShopMA4033."Hm? Now why on Earth is that?"'
26151: 'Maria@r@v13/40400963."................................."'
26152: '@rIt was probably because Rosa felt guilty for making such a young girl as Maria watch over the house by herself,@k and because she knew that this was not socially acceptable.'
26153: '@rSo she had indoctrinated Maria into changing the stores she bought things at so that she didn''t catch the eyes of adults,@k and saying no more than a greeting to policemen, even if they talked to her.'
26154: '@rMaria had obediently done as she was told.'
26155: '@rInstead of considering why she had to do that,@k honestly obeying because her mother had told her so was far more important to her.'
26156: '@rBut the manager of the convenience store probably didn''t think of it that way.'
26157: '@r......Naturally, seeing such a young girl being forced to watch over the house alone,@k and so frequently, would cause anyone to worry......'
26158: '@r......And then.@k After making the round trip between her home and the store once more, and arriving at the convenience store for a third time...@k...a policeman was there.'
26159: '@r@v99/ShopMA4034."That''s the girl.@k@v99/ShopMA4035. ......Maria-chan, did you find your key?"'
26160: 'Maria@r@v13/40400964.".........Uu...@k@v13/40400965. ......Can''t find it......"'
26161: '@r@v99/PoliMA4001."What''s your name, little girl?"'
26162: 'Maria@r@v13/40400966."........................"'
26163: '@rThe policeman asked her name, but Maria didn''t answer.'
26164: '@r@v99/PoliMA4002."Did your mother tell you not to talk with policemen?@k @v99/PoliMA4003.Hahah.@k @v99/PoliMA4004.Don''t worry, no need to be scared of me.@k@v99/PoliMA4005. Have you eaten dinner yet, little girl?"'
26165: 'Maria@r@v13/40400967.".........Bought it, but can''t get into the house, so I can''t eat it."'
26166: '@r@v99/PoliMA4006."What''s your mother doing?@k @v99/PoliMA4007.Is she not coming home today?@k @v99/PoliMA4008.Is she working?"'
26167: 'Maria@r@v13/40400968."..................Uu."'
26168: '@r@v99/PoliMA4009."Do you know how we can contact your mother''s work?"'
26169: 'Maria@r@v13/40400969."........................"'
26170: '@rMaria hung her head limply.'
26171: '@r......She didn''t understand why the policeman was getting mad at her.'
26172: '@rNo, he probably wasn''t getting mad at her, but if this reached her mother''s ears, she would definitely be in trouble.'
26173: '@rEven if she didn''t understand the reason why she would be in trouble, she at least understood that much.'
26174: '@rBut the policeman wouldn''t let Maria go.@k@rAnd her head was swimming from hunger.'
26175: '@rThe policeman noticed that, and it was decided that they could talk as they ate in the police box.'
26176: '@r......I was taken to the police box.@k I had my oden heated in a microwave oven, and there were even salty rice cakes and hot tea brought out for me.'
26177: '@rI''d been told not to talk to policemen,@k ......but as I answered questions about Sakutaro, I started to feel like he wasn''t a bad person, and...'
26178: '@r...I wouldn''t be able to return home anyway, so I didn''t know what to do, so...'
26179: '@r.........I told him Mama''s work phone number,@k ......which I wasn''t supposed to tell anyone, and was told to use only in a very, very serious situation.'
26180: '@rIn the tatami room inside the police box, as I ate the oden that was so hot it felt like it would burn me,@k I watched the policeman making the phone call, and lazily thought, "......aah, I''m probably going to get in trouble..."'
26181: 'Maria@r@v13/40400970."............Is Mama...going to be mad at me.........?"'
26182: 'Sakutarou@r@v33/44200374.''......Uryu.........'''
26183: '@rHe must have been listening to the phone ringing for a very long time.@k With the receiver up to his ear, the policeman looked up at the clock and grumbled.'
26184: '@r@v99/PoliMA4010."............Maybe they aren''t picking up because their business hours are over.@k@v99/PoliMA4011. ......Hmmmmmm.@k@v99/PoliMA4012. ......Ah.@k @v99/PoliMA4013.Hello?@k @v99/PoliMA4014.Hello?@k @v99/PoliMA4015.Is this Auntie Rosa Co., Ltd.?"'
26185: '@r@v99/PoliMA4016."This is the Komatsugawa Police Department police box in front of Senbonzakura Station.@k@v99/PoliMA4017. Is President...umm, Udaikan...no, sorry, President Ushiromiya-san available?@k @v99/PoliMA4018.............Yes.@k@v99/PoliMA4019. ......Whaat?@k @v99/PoliMA4020.Vacation?"'
26186: '@r@v99/StafFA4001."Yes.@k@v99/StafFA4002. The president''s off for three days starting yesterday.@k@v99/StafFA4003. Umm, perhaps I could be of assistance...?"'
