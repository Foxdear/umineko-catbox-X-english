24624: '@r@v23/44400001."Yes, I will never forget it.@k@v23/44400002. It happened in April of 1987.@k@v23/44400003. I received a certain strange request from a friend."'
24625: '@r@v23/44400004."......A large collection of books, the former possessions of a very rich man, were being sold at auction,@k@v23/44400005. and it was thought that some of them might have been extremely valuable from an archaeological and folkloristic perspective, as well as in an occult sense,@k@v23/44400006. so this friend wanted me to take a private look at their value."'
24626: 'Ange@r@v11/42000578."..................''87.@k@v11/42000579. Half a year after the crime on Rokkenjima."'
24627: '@r@v23/44400007."Correct.@k@v23/44400008. Those books were explained to have escaped the disaster on Rokkenjima.@k@v23/44400009. I was told that the owner of the island, Mrs. Ushiromiya Eva, had put them up for auction."'
24628: '@rThey appeared to be at a high-class restaurant.@k Ange and a middle-aged man were sitting across from one another in a pair of secluded and quiet seats.'
24629: '@rAmakusa could be seen by the restaurant''s entrance.@k@rHe was probably keeping a lookout for pursuers from the Sumadera family.'
24630: '@rThe scholarly seeming man across from Ange spoke politely, but with enthusiasm.'
24631: '@rHe hadn''t so much as touched the food in front of him, which communicated effectively the passion with which he was speaking.'
24632: '@rHe was a professor at a certain university, known in particular as an authority on Western folklore.'
24633: '@rHowever, among his life works, that was only the one with the most acceptable public face.'
24634: '@rHis true life work...@kwas the study of Western occultism, Western magic, alchemy, and all else falling under the umbrella of "the occult",@k as well as demonology.'
24635: '@rIn short, he was one of the people best positioned to understand the details of Kinzo''s research...@|@y'
24636: 'Ootsuki@r@v23/44400010."First, what I learned by appraising the books was that Mrs. Ushiromiya Eva had absolutely no education in folkloristics,@k@v23/44400011. and that the original owner of the books, Mr. Ushiromiya Kinzo, was without doubt one of the top five authorities on demonology in Japan."'
24637: '@rApril, 1987.'
24638: '@rA major city antique shop came into possession of a large quantity of ancient texts thought to have a high historical value.'
24639: '@rThe texts had been entrusted to them by Ushiromiya Eva, who had requested for them to be put up for auction on her behalf.'
24640: '@rAt the time, everyone thought that Eva had succeeded the Ushiromiya family and obtained all the wealth for herself as the only survivor.'
24641: '@rHowever, at that point, barely half a year had passed since the accident, which was not enough for the rest of the family to be legally declared dead in absentia, even given the extraordinary circumstances.'
24642: '@rBecause of that, Eva was thought to have been in a very tight spot financially, unable even to collect from her family''s life insurance.'
24643: '@rIt seems that she tried to sell everything of value,@k and even the books kept in Kuwadorian, her location when she escaped harm, became a target of this.'
24644: '@rAnd when the authorities in the field gathered at the request of the antique shop to appraise these documents - which were later called "the Ushiromiya Library" - they were given the shock of their lives.'
24645: 'Ootsuki@r@v23/44400012."At least speaking from the perspective of occultism,@k@v23/44400013. the shock waves that discovery sent throughout the world were comparable to the discovery of the Dead Sea Scrolls."'
24646: 'Ootsuki@r@v23/44400014."The reason for this is that the "Ushiromiya Library" even included some extremely important documents...@k@v23/44400015.which had been known to exist for more than a thousand years, but had never before been found."'
24647: '@rThe so-called "romantic" side of the occult, epitomized for example by alchemy, never ceases to stir an intense fascination in dilettantes.'
24648: '@rEven now, it is whispered that in various places around the world, a great number of "magic books" of historical value...@kmight be in the secret possession of very wealthy lovers of the occult, unannounced to the public.'
24649: '@rThe prime candidates for this are said to be items such as Leonardo da Vinci''s notebooks, which are particularly popular among dilettantes.'
24650: '@rIt is said that approximately five thousand pages of the notebooks currently exist, and over ten thousand have been lost,@k but some researchers believe that a large part of this lost portion may be being monopolized by certain dilettantes and millionaires.'
24651: '@rIt is said that because of this, even now,@k dilettantes who can''t help but seek these spare no expense to search around for quietly hoarded-away and unannounced notebooks...'
24652: '@rThere is probably no doubting that Ushiromiya Kinzo was himself one of those dilettantes.'
24653: '@rIt is unknown what Kinzo went through to obtain these,@k but undoubtedly he must have spent his vast wealth like water, to buy them off other rich people with the same hobby as him.'
24654: '@rThe discovery of that huge number of books at the end of the 20th century, books so valuable that dilettantes were filled with the desire to hoard them away,@k and their subsequent release to the public, gave the entire world a massive shock...'
24655: 'Ootsuki@r@v23/44400016."Due to this incident, the name Rokkenjima became known across the world.@k@v23/44400017. And at the same time, the world also received a shock at the very high probability that, due to the accident on Rokkenjima, a large amount of undiscovered books of even greater value had been lost."'
24656: 'Ootsuki@r@v23/44400018."...After that discovery, the names of Rokkenjima and the Ushiromiya Library were certain to remain in our memories for all time."'
24657: '@r......Our memories.@k That "our" probably meant the occult neck of the woods with the same hobby as Kinzo.'
24658: '@rThis incident caused the name of Rokkenjima to develop an important meaning within the world of the occult.'
24659: '@rCertainly, there had been a lot of reporting about the accident on Rokkenjima, but it hadn''t been on an international level.'
24660: '@rHowever, this incident circled the globe,@k taking the image of Rokkenjima as a small island in the Izu archipelago, and painting it over as a demonic island with a mixture of riddles, suspicion, mystery and the occult.'
24661: '@rIn other words, until Kinzo''s library was leaked to the public by Eva,@k Rokkenjima had been nothing more than a nameless island that no one thought twice about,@k ......and it definitely hadn''t been a witch''s island.'
24662: '@rHowever, when knowledge of the Ushiromiya Library spread across the world, Rokkenjima''s image immediately took on an occult twist.'
24663: 'Ootsuki@r@v23/44400019."And so, what happened next was that matter with the message bottle.@k@v23/44400020. It is what turned that island into a witch''s island.@k@v23/44400021. A nameless island in the Izu archipelago began to transition into an occult island, and then into the island of the mysterious witch, BEATRICE."'
24664: 'Ootsuki@r@v23/44400022."You could say that, lacking either the Ushiromiya Library or the message bottle, the Rokkenjima Witch Legend would never have been established."'
24665: 'Ange@r@v11/42000580."......A message bottle."'
24666: 'Ootsuki@r@v23/44400023."Yes.@k@v23/44400024. A form of communication to an unspecified target by throwing an empty bottle with a letter sealed inside into the sea."'
24667: 'Ootsuki@r@v23/44400025."It is famous as a way of sending an SOS from a deserted island, but because of the influence of famous foreign detective novels,@k@v23/44400026. it has also become known as a method of confessing the truth after one''s own death, like a time-delayed will.@k@v23/44400027. The Rokkenjima message bottle was certainly the latter."'
24668: 'Ange@r@v11/42000581."......This is the thing everyone says a fisherman on a nearby island picked up?"'
24669: 'Ootsuki@r@v23/44400028."Correct.@k@v23/44400029. We learned that a young fisherman on Shikinejima had picked up a wine bottle with a letter in it.@k@v23/44400030. This young fisherman happened to keep it out of curiosity.@k@v23/44400031. It was only later, when Rokkenjima fell under the global spotlight due to the Ushiromiya Library, that he announced his discovery."'
24670: 'Ange@r@v11/42000582."Is there any chance that it was a fabrication made by the fisherman?"'
24671: 'Ootsuki@r@v23/44400032."Of course, we weren''t able to deny that possibility.@k@v23/44400033. The notebook pages in the wine bottle had the signature of a certain member of the Ushiromiya family.@k@v23/44400034. A girl named Ushiromiya Maria.@k@v23/44400035. However, from the handwriting found on her former belongings, it was ascertained that the handwriting in the letter belonged to a different person."'
24672: 'Ange@r@v11/42000583.".........A different person''s handwriting......?"'
24673: 'Ootsuki@r@v23/44400036."Correct.@k@v23/44400037. At the very least, I believe there can be no doubt that it was written by a person more skilled at writing and of a greater age than her.@k@v23/44400038. There was a very high likelihood that it had been written by someone else using her name.@k@v23/44400039. Therefore, at that point in time, the contents of those notebook pages were thought to have very low credibility."'
24674: '@rHowever.'
24675: '@rLater on, a sensation was created when it came to light that on the day of the accident, a similar message bottle had been recovered from the surrounding ocean by the police in their search for evidence.'
24676: 'Ootsuki@r@v23/44400040."It seems that, due to evidence from the surrounding area and the intact state of the bottle''s seal, the police had decided that its likelihood of being a hoax was low,@k@v23/44400041. and that it had been cast out no earlier than a few days before the accident.@k@v23/44400042. And the handwriting for both matched.@k@v23/44400043. This caused the credibility of the notebook pages discovered by the fisherman to rise."'
24677: 'Ootsuki@r@v23/44400044."As for the message bottles'' contents, magazines and the like seem to have been reporting on that repeatedly, but do you require an explanation all the same?"'
24678: 'Ange@r@v11/42000584."......No.@k@v11/42000585. I know about it, more or less."'
24679: '@rSeveral sheets of notebook paper had been stuffed into each of the two wine bottles.'
24680: '@rThey were extensive accounts, written in a diary-like fashion by some unknown person calling themselves Ushiromiya Maria, of the events of the day of the accident and the day before.'
24681: '@rAnd it was these that prompted the beginning of the "Witch Legend Serial Murder Case",@k and "the mystery of the Golden Witch BEATRICE".'
24682: 'Ootsuki@r@v23/44400045."These bizarre diary-style accounts describe the Ushiromiya family members, pinned to the island by the typhoon,@k@v23/44400046. becoming caught up in a ritual for the resurrection of a witch, and being killed one after another in inexplicable ways."'
24683: 'Ootsuki@r@v23/44400047."And at the end, the Golden Witch BEATRICE revives, and swallows everything up into the Golden Land.@k@v23/44400048. ......They were written almost as though this was the complete picture of the events of that day."'
24684: 'Ootsuki@r@v23/44400049."Additionally, the state of things on the island at the time is also depicted in immense detail,@k@v23/44400050. and former servants who once worked for the Ushiromiya family have given testimony that the pages were definitely written by a person who knew the inside details of the island."'
24685: 'Ange@r@v11/42000586."......So, those strange fantasy novels, the occult boom that started with the Ushiromiya Library,@k@v11/42000587. and the fact that the truth remains shrouded in darkness - the combination of all three of these factors is what created the legend of the Rokkenjima witch...?"'
24686: 'Ootsuki@r@v23/44400051."Correct.@k@v23/44400052. Already more than ten years have passed since the incident, and it still attracts the interest of occult enthusiasts across the world."'
24687: 'Ootsuki@r@v23/44400053."No, in fact, you could say that it has become increasingly deified as time has passed.@k@v23/44400054. There are still many enthusiasts who try to land secretly on the shores of Rokkenjima even though that has been prohibited."'
24688: 'Ootsuki@r@v23/44400055."......Could there be another message bottle that has still not been discovered?@k@v23/44400056. And what really happened on that island that day?@k@v23/44400057. There is still much to discuss, oh yes."'
24689: '@rAs though he had finally remembered that he had been going on and on for some time, the man took a sip of water.'
24690: '@r......His potage was now cold, but it seemed that the man''s hunger had already been blown away.'
24691: 'Ange@r@v11/42000588."......If I remember correctly, I heard that the fisherman''s pages and the police''s pages had completely different contents."'
24692: 'Ootsuki@r@v23/44400058."Correct.@k@v23/44400059. Due to that, the appeal of the Rokkenjima mystery increased even further.@k@v23/44400060. Inside each of the two bottles was a diary-style account describing the events of the day of the accident and the day before.@k@v23/44400061. However, while they both cover the same two-day period, the contents are completely different."'
24693: 'Ootsuki@r@v23/44400062."As though one is true and one is untrue.@k@v23/44400063. Or perhaps both are untrue.@k@v23/44400064. ...However, the beginning and the end alone do match in both."'
24694: 'Ootsuki@r@v23/44400065."At the beginning, the 18 people including the relatives are sealed up on the island by the typhoon.@k@v23/44400066. And at the end, everyone dies, the Golden Witch revives, and everything is swallowed up into the Golden Land."'
24695: '@rThe contents of both message bottles described the events of the two days of the accident.'
24696: '@rBut the details were completely different.'
24697: '@rBoth diaries outline a serial murder following the epitaph of the witch, but the order of the sacrifices, the manners of their deaths, and even the "tale" of the two days are different.'
24698: '@rHowever, both depict the same ultimate conclusion: everyone dies and the witch revives.'
24699: 'Ootsuki@r@v23/44400067."Since the only survivor, Mrs. Ushiromiya Eva, remained silent about what happened on that island,@k@v23/44400068. the events of that entire two-day period are shrouded in darkness."'
24700: 'Ootsuki@r@v23/44400069."These two diaries presented not just one, but two theories to wipe away that darkness.@k@v23/44400070. You could explain those two days with either diary.@k@v23/44400071. However, we don''t know which is correct, or even if there is anything correct contained within them."'
24701: '@r -  - Schroedinger''s...cat box.'
24702: '@rIf it isn''t denied, even fiction can be truth.'
24703: '@rThrough the media, these notebook pages had of course been shown to Eva as well, but in the end, she never broke her silence......'
24704: 'Ange@r@v11/42000589."Who sent the message bottles...and why?"'
24705: 'Ootsuki@r@v23/44400072."Do you remember the magazine that put together a special issue for the crime''s tenth anniversary? They covered that question in extensive detail.@k@v23/44400073. It seems that their theory is the one that garners the most support today."'
24706: 'Ootsuki@r@v23/44400074."But it is rather dull.@k@v23/44400075. ......What happened on that island, on that day?@k@v23/44400076. Considering this question is the real thrill of the Witch Hunt."'
24707: 'Ange@r@v11/42000590."Witch Hunt...?"'
24708: 'Ootsuki@r@v23/44400077."Yes, the Rokkenjima Witch Hunt - it''s the name of a group of enthusiasts endeavoring to explain the truth of that crime from an occult perspective."'
24709: 'Ootsuki@r@v23/44400078."From the Ushiromiya Library to the mysterious two-day period, the legend of the Golden Witch and more, discussion of the mysteries that surround Rokkenjima is flourishing even today among enthusiasts."'
24710: 'Ootsuki@r@v23/44400079."For the ten-year anniversary, an international convention was held in New York.@k@v23/44400080. I was there participating as well, representing Japan!@k @v23/44400081.I was able to have a variety of interactions with zealous overseas Witch Hunters."'
24711: 'Ootsuki@r@v23/44400082."Witches are a very popular category overseas.@k@v23/44400083. The age span of the participants was truly vast, stretching from elementary schoolers at the bottom, all the way to famous cultural figures at the top!@k @v23/44400084.Even in Japan, in recent years, we''ve finally - "'
24712: '@r......You probably don''t need any more explanation, but he is one of the most famous Rokkenjima Witch Hunters in Japan.'
24713: '@rAfter that, he just kept continuing on excitedly all by himself, even though I''d never asked.'
24714: '@rAs I swirled the thin film on my potage with my spoon, I shrugged my shoulders and sighed.'
24715: '@r......Maybe it really had been a waste of time to research about the message bottle.'
24716: '@rNo, if there was one thing I''d gotten out of this, it was the knowledge that those pages, supposedly written by Maria onee-chan,@k had actually been written by a different person faking her name.'
24717: '@rAnd that person had taken it upon themselves to write an occult story, put it into a bottle as though it was the truth, and throw it into the sea.'
24718: '@r...This raised questions for me.'
24719: '@rWhy did they go to all the trouble of writing so much in order to prepare a suspicious letter like that?'
24720: '@rWith a message bottle, there would be no guarantee that it would ever pass into anyone''s hands.'
24721: '@rIf their luck had been bad, it could have sunk in the ocean and never been seen by anyone.'
24722: '@rAnd even if someone were to pick it up, they might have thrown it away without even thinking twice about it.'
24723: '@r......Why did they entrust their confession of the truth to the sea in such an uncertain method?'
24724: '@rAnd why did they write up multiple different tales?'
24725: '@rIf there had been one message bottle, claiming that its story was the truth would be reckless, but not impossible.'
24726: '@rHowever, because there were two, that made both of them doubtful.'
24727: '@rIf someone was plotting to make out those two mysterious days to be the work of a witch, that was really superfluous.'
24728: '@rAnd because there were two, it suggested that an undiscovered third one, or possibly even more, might exist.'
24729: '@r......In other words, the two having differing contents was making it even harder to take either of them at face value.'
24730: '@rBut despite their differences, the contents of the two matched in that both tales told of a witch.'
24731: '@rDoes that mean that this is what the writer wanted to tell us.........?'
24732: '@r......I can only imagine that this was a crime committed for pleasure, by someone who wanted to create an illusion of a witch.'
24733: '@rBut 17 people excluding Aunt Eva lost their lives, and a vast inheritance - and maybe even ten tons of gold - changed hands behind the scenes.'
24734: '@rIt just doesn''t make sense for the confession coming at the end of all that to be this fantasy about a witch.'
24735: '@rI don''t need to hear the magazines'' reasoning to find it extremely doubtful whether the message bottles really are "diaries".'
24736: '@r......After all, the amount of writing was massive.@k It''s hard to imagine that someone actually caught up in the middle of a serial murder like that would have been able to calmly write it down.'
24737: '@rIn that case, it''s probably more realistic to say that these diaries were written slowly over a long period of time before the day prior to the accident.'
24738: '@rIn which case, .........would that mean that everything on Rokkenjima was premeditated, and prepared for over a long stretch of time...?'
24739: '@r...The fact that Aunt Eva left this world without saying anything is...detestable.'
24740: '@rShe definitely told me on her deathbed.'
24741: '@rShe definitely said that her reason for not telling me the truth was because it was the best way of harassing me.'
24742: '@r......Ah, by now I''m painfully aware of it.'
24743: '@rOf all the things Aunt Eva did to harass me, this was probably the last and the greatest.'
24744: '@r...............But now that I start to think of it this way, it''s pretty doubtful that Aunt Eva is the true culprit.'
24745: '@rOf course, this isn''t because the handwriting in the message bottle differs from Aunt Eva''s, or anything like that.'
24746: '@r......It''s because in both discovered tales, Aunt Eva was included among the victims.'
24747: '@rIf the writer of these diaries was the culprit...'
24748: '@r......then maybe Aunt Eva had also been one of the targets to be killed.'
24749: '@rAunt Eva had survived because something had gone wrong.'
24750: '@r.........Because of my hate for Aunt Eva, I had believed until now that she had to be the culprit.'
24751: '@rBut the existence of the message bottles...@k......was making me suspect that the mastermind was a far more profound and unknown person than her...'
24752: '@rI looked at the clock.@k I''d asked everything I wanted to.@k@rTime to go.'
24753: '@rAs he continued to speak fervently, I volunteered that I wanted to bring this discussion to a close.'
24754: '@rHe seemed to be aware that he had gotten excited and talked too much, so he accepted this without resistance.'
24755: 'Ange@r@v11/42000591."Thank you very much for today.@k@v11/42000592. I''m glad to have had the opportunity to hear your valuable stories."'
24756: 'Ootsuki@r@v23/44400085."......No, no.@k@v23/44400086. It was truly a joy to be able to welcome a young lady as a new friend of the Witch Hunt.@k@v23/44400087. I have many precious documents that I couldn''t show you because of this change to a different venue.@k@v23/44400088. I should be glad to show you them at the next chance we get."'
24757: 'Ange@r@v11/42000593."Thank you, Professor.@k@|@y@v11/42000594. ............Could I ask you one more thing?"'
24758: 'Ootsuki@r@v23/44400089."Yes, what is it?"'
24759: 'Ange@r@v11/42000595."Professor, what made you interested in witches...no, in occultism and demonology?"'
24760: 'Ootsuki@r@v23/44400090."I must admit, being asked that is somewhat embarrassing.@k@v23/44400091. ......Simply put, I used to think that if only I could use magic, I wouldn''t be beaten by the big school bully,@k@v23/44400092. and this childhood fantasy of mine went straight on to become my life work.@k@v23/44400093. Because the primitive yearning for power unknown is as universal today as it ever was in the past."'
24761: 'Ange@r@v11/42000596."Professor, if you could, would you want to become a witch?@k @v11/42000597.Do you still dream of being able to use magic at will?"'
24762: 'Ootsuki@r@v23/44400094."But of course.@k@v23/44400095. Even though, at this age, I understand rationally that there is no such thing,@k@v23/44400096. I find myself unable to forget my child-like dreams of flying in the sky and turning scrap iron into gold.@k@v23/44400097. ......Hahaha, if you would, please keep this a secret from my students."'
24763: 'Ange@r@v11/42000598.".........If I told you that actually, I am a witch,@k@v11/42000599. would you believe it?"'
24764: 'Ootsuki@r@v23/44400098."Hahahaha.@k@v23/44400099. It''s my pet theory from my few experiences with women that they are all witches."'
24765: '@rAnge snorted at the old professor, who was undoubtedly an earnest scholar, and unlikely had any experiences with women at all.'
24766: 'Ange@r@v11/42000600."Oh, yes.@k@v11/42000601. And one final question.@k@v11/42000602. ......Professor, have you seen the original message bottle itself?"'
24767: 'Ootsuki@r@v23/44400100."I have indeed."'
24768: 'Ange@r@v11/42000603."In that case, are you also well acquainted with the handwriting?"'
24769: 'Ootsuki@r@v23/44400101."Of course.@k@v23/44400102. I am not a specialist in that area, but at least when it comes to the handwriting of the message bottle, I am proud to be the most knowledgeable in Japan."'
24770: '@rAt that point, Ange set a book on the table with a thud.'
24771: 'Ootsuki@r@v23/44400103."............And this is?@k @v23/44400104.I have never seen it before."'
24772: '@rHe prided himself on his thorough knowledge of all literature related to Rokkenjima, but he looked bewildered at this binding that he had never laid eyes on before...'
24773: '@rIgnoring him, Ange silently flipped through the pages, opened to one of them, and showed him.'
24774: '@rOn that page was a handwritten paragraph beginning with "To my dear witch apprentice".'
24775: '@r......And at the end, there was a signature in capitals that said "BEATRICE".'
24776: 'Ootsuki@r@v23/44400105."Wh-what is............"'
24777: '@rThe instant he glanced at it,@k his face went pale.@k ......She knew the answer before asking, but Ange asked it aloud anyway.'
24778: 'Ange@r@v11/42000604."Does the handwriting in the paragraph on this page match the handwriting in the message bottles...?"'
24779: 'Ootsuki@r@v23/44400106."W-well, uhh...... I wou - I would have to take this home and investigate it in detail to, to...@k@v23/44400107. ...P-pardon me for asking, but what in the world is this book?!@k @v23/44400108.Where did you...?!"'
24780: '@rThe man stretched out his hand, but Ange nimbly pulled it out of his reach.@k@r...As though telling him not to touch it with his filthy hands.'
24781: 'Ange@r@v11/42000605."Thank you.@k@v11/42000606. Just that reaction is all I need.@k@v11/42000607. Thank you very much for today.@k@v11/42000608. ......Here is the reward I promised."'
24782: '@rAs she stood up, clutching Maria''s diary,@k Ange casually tossed a wad of ten-thousand-yen notes wrapped with a band of paper onto the table.'
24783: '@rAs she turned her back to him and made to leave, the man raised his voice as though clinging to her.'
24784: '@rBut Ange never stopped walking.'
24785: 'Ootsuki@r@v23/44400109."I, I beg you...!!@k @v23/44400110.What in the world is that book?!@k @v23/44400111.I don''t need a reward, just, please, show me that book...!!"'
24786: 'Ange@r@v11/42000609."......Both you and I are fellow Witch Hunters, but it looks like we aren''t pursuing it at the same level.@k@v11/42000610. You''re entertaining yourself with the outside of the cat box.@k@v11/42000611. And what I want to know about is the inside of the cat box."'
24787: 'Ange@r@v11/42000612."......And this book is the key to opening it.@k@v11/42000613. It''s too good for you.@k@v11/42000614. Well then.@k@v11/42000615. <Goodbye, gentlemen>. <Have a nice day>."'
24788: 'Ootsuki@r@v23/44400112."P-please, wait...!!@k @v23/44400113.Sumadera-san...!!!"'
24789: '@rHis voice didn''t reach her.@k She had already joined up with Amakusa and gone into the car......'
24790: 'Amakusa@r@v20/43000039."Did you find anything?"'
24791: 'Ange@r@v11/42000616."......At the very end.@k@v11/42000617. I was right.@k@v11/42000618. The one who wrote the message bottles was BEATRICE herself."'
24792: 'Amakusa@r@v20/43000040."Now that''s <cool>.@k@v20/43000041. So it''s settled, is it, the witch exists?"'
24793: 'Ange@r@v11/42000619."Who knows.@k@v11/42000620. .........Mind if I sleep?@k @v11/42000621.I''ll bet that prattling professor gets lost in his own little world in lectures and has kids falling asleep left, right, and center."'
24794: 'Amakusa@r@v20/43000042."Sure, sure, take a rest."'
24795: 'Ange@r@v11/42000622.".........Still, that went really well.@k@v11/42000623. That guy believed I was Sumadera until the very end."'
24796: '@rThe Sumadera family had cast out a net beforehand over any people Ange might try to contact.'
24797: '@rThey had offered a reward for anyone who could detain Ushiromiya Ange if she appeared.'
24798: '@rAnge had foreseen that and snatched it away.'
24799: '@rShe had called herself Sumadera, and after skillfully tricking the man by saying her own subordinates would set up an ambush, she had taken him with her.'
24800: '@rSo when the Sumadera pursuers reached the professor''s house, there was no longer anyone there...'
24801: '@r@v99/MafMD4003."According to the family, a young man and woman calling themselves Sumadera visited this morning,@k@v99/MafMD4004. took the professor out with them, and still have not returned.@k@v99/MafMD4005. ......There is a chance we were outmaneuvered."'
24802: 'Kasumi@r@v22/44300040."..................What a bad child that Ange-chan is.@k@v22/44300041. ......I wonder if that craftiness is from Nee-san''s blood.@k@v22/44300042. ......To think that she would casually take on the name Sumadera after saying so often how she''d hate to call herself that..."'
24803: 'Kasumi@r@v22/44300043."............Hoh-hoh-hoh-hoh-ho.@k@v22/44300044. ...The professor should be returning soon.@k@v22/44300045. When he does, we must serve him some tea..."'
24804: '@r@v99/MafMB4007."...Ye-...yes.@k@v99/MafMB4008. Understood."'
24805: 'Kasumi@r@v22/44300046."..................I wonder if she thinks she''s leading me around by the nose.@k@v22/44300047. She is such a naughty child.@k@|@y@v22/44300048. ............*giggle*giggle*, ......hoh-hoh-hoh-hohohohohohoho!!"'
24806: '@rWith a demonic look on her face, Kasumi violently stamped her heel.'
24807: '@rI''ll teach you.@k@rAbout my Magic of Origins.'
24808: '@rNo, I taught you before, right?@k@rAnd you used to be able to use it.@k@rDid you forget......?'
24809: '@rYou were also a witch apprentice, Ange, with your name entered into Mariage Sorciere, weren''t you......?'
24810: 'Ange@r@v11/42000624.".........I also...joined in as one of the witches, didn''t I..."'
24811: '@rI closed Maria onee-chan''s diary and flopped down on a very high-class-looking bed.'
24812: '@rSince I had fallen into a pretty deep sleep in the car, it was taking longer than usual for drowsiness to set in, and I had been spending a long time reading the diary as I waited for that.'
24813: '@rThis was a super-expensive hotel in the city.@k ...Expensive hotels that are often used by the rich and famous have an abnormally strong duty of confidentiality, out of concern for their various circumstances.'
24814: '@rThis made it a very convenient place for Ange, on the run from her pursuers.'
24815: '@rThe idea that runaways spend their nights hiding in cheap hotels is a commoner''s way of thinking.'
24816: '@r......For Ange, who possessed all the wealth of the Ushiromiya family, the life of a runaway was truly comfortable.'
24817: '@rOf course, as a man, Amakusa was in a separate room despite being her guard.@k Ange was using the bedroom of the suite, while Amakusa was lying down on the living room sofa.'
24818: '@r...Amakusa said something about how the sofa here was more comfortable than his own bed recently.@k Poor guy.'
24819: '@rWhen I looked at the clock,@w500. ......I saw that it was almost 2 a.m.'
24820: '@rStill not getting sleepy.@k ............I sighed deeply.'
24821: '@rEven though there was no wind, I suddenly got the feeling that Maria onee-chan''s diary had fluttered open.'
24822: '@r......Then, Onee-chan appeared.@k@rHer form was no longer the normal one that I knew.'
24823: '@r...She was wearing the dress that BEATRICE had given her after acknowledging her status as a witch.'
24824: 'Maria@r@v13/40400605.".........If you don''t get some sleep, it''ll be tough tomorrow, you know?"'
24825: 'Ange@r@v11/42000625."If I were a witch too,@k@v11/42000626. ......I could use magic, right?"'
24826: 'Maria@r@v13/40400606."...Yep.@k@v13/40400607. Could.@k@v13/40400608. I taught you, didn''t I?@k @v13/40400609.How to use it.@k@v13/40400610. ......And you were able to, once."'
24827: 'Ange@r@v11/42000627."...............I remember.@k@v11/42000628. ......I''ve started wanting to."'
24828: 'Maria@r@v13/40400611."Did you get lonely...?"'
24829: 'Ange@r@v11/42000629."..................Not really.@k@v11/42000630. ......It''s not like having a different pillow every night is that tough."'
24830: 'Maria@r@v13/40400612.".........The first step to magic can be loneliness, or boredom,@k@v13/40400613. or any reason as small as that."'
24831: 'Ange@r@v11/42000631."Even killing time until you get tired?"'
24832: 'Maria@r@v13/40400614."Yep.@k@v13/40400615. I''m happy that you remembered about magic one more time."'
24833: '@r..............................'
24834: '@r......It''s been quite a long time since I last used magic.'
24835: '@rAt one point, with Maria onee-chan''s introduction, ......I touched a corner of it, and opened the door a tiny bit.'
24836: '@rSo, ......I should still remember that sensation.'
24837: 'Maria@r@v13/40400616."......Right now, your magical power has declined significantly, Ange.@k@v13/40400617. ...If you don''t stick to the basics, it''ll be hard, okay?"'
24838: 'Ange@r@v11/42000632."Sure.@k@v11/42000633. ...............Checking all directions.@k@v11/42000634. Quiet space secured."'
24839: 'Maria@r@v13/40400618."What about Amakusa-san?"'
24840: 'Ange@r@v11/42000635.".....................@k@v11/42000636. ............He''s sleeping."'
24841: '@rAfter opening the door to the living room a crack, I could see the blanket caterpillar on the sofa roll over in its sleep.'
24842: 'Maria@r@v13/40400619."......With your magical power as weak as it is now, the anti-magic power is affecting you too much.@k@v13/40400620. ......Not just the sight of people,@k@v13/40400621. but voices, sounds, and even the presence of people will get in the way of your magic."'
24843: 'Maria@r@v13/40400622."......Sever those completely.@k@v13/40400623. Like how ancient magicians shut themselves up in ateliers to preserve their isolation."'
24844: 'Ange@r@v11/42000637."I remember.@k@v11/42000638. ......The very existence of Humans blocks magic.@k@v11/42000639. ...Therefore, the very act of showing magic to humans is the sign of a high-level witch..."'
24845: '@rObtain a quiet space for yourself alone.@k@r......That should cover it for the preparation of a space to use magic.'
24846: 'Maria@r@v13/40400624.".........Next is the vessel.@k@v13/40400625. ...Right now, that''s as important for you as a bicycle having training wheels - no, a chain."'
24847: 'Ange@r@v11/42000640."...........................@k@v11/42000641. .........These would...@v11/42000642..........obviously...@v11/42000643.not be possible, right..."'
24848: '@rAnge rubbed her own head.'
24849: '@r...She was wearing hair accessories with pink beads attached.'
24850: '@rThey felt a little childish for Ange''s style, but she had never taken them off for a single day.'
24851: 'Maria@r@v13/40400626."..................Yeah.@k@v13/40400627. .........That really is impossible for you right now, Ange.@k@v13/40400628. ...If you had practiced every single day since then,@k@v13/40400629. you might have become able to summon him by now."'
24852: 'Ange@r@v11/42000644."........................@k@v11/42000645. If I were to start training now, how long would it take?"'
24853: 'Maria@r@v13/40400630.".........It''s said that a year of witch training as a child is worth ten in old age.@k@v13/40400631. You''ll need a strong resolution."'
24854: 'Ange@r@v11/42000646."You mean like Ushiromiya Kinzo?@k @v11/42000647.............So private tutoring from a young age is important for piano, violin and magic."'
24855: 'Maria@r@v13/40400632."Your power has weakened since the time you were first able to use magic, Ange.@k@|@y@v13/40400633. ...Don''t overdo it, and stick to the basics."'
24856: '@rAfter regretfully rubbing the things on my head one more time, I let it go.'
24857: '@rThen I started fishing through my knapsack.@k@r...Looking for anything that might make a good vessel.'
24858: 'Ange@r@v11/42000647_1."? ...Ah......"'
24859: 'Ange@r@v11/42000648."............Wouldn''t this be perfect for a vessel?"'
24860: 'Maria@r@v13/40400634."It''s been so long since I saw that.@k@v13/40400635. ......Yeah.@k@v13/40400636. I think even as you are now, you should be able to summon that one.@k@v13/40400637. ...And she has no master now.@k@v13/40400638. It should be possible for you to become her new master, Ange."'
24861: '@rAmong the things that looked like good vessels, I took the one I thought might possess the strongest magical power,@k and set it on the side table near the bed with a clunk.'
24862: '@rIt was......a shady-looking stake-shaped weapon embellished with an occult design.'
24863: '@rA stake of the "Seven Stakes of Purgatory", used by witches to offer sacrifices.'
24864: '@rIn the course of their search for evidence, the police had collected a large amount of junk.@k@rAfter the investigation had finished, this had been faithfully returned to the Ushiromiya family.'
24865: '@r......I found something there that I had seen in the illustrations in Maria''s diary, and took it home with me.'
24866: 'Maria@r@v13/40400639.".........Originally, the Seven Stakes of Purgatory were a seven-piece set.@k@v13/40400640. ......Poor girl.@k@v13/40400641. She''s the only one left now."'
24867: '@rOnee-chan smiled, looking lonely...'
24868: '@rI pulled another book out of the knapsack.'
24869: '@r......This was another old-fashioned, blatantly occult-related book.'
24870: '@rBut this, too, was a book to be written in.@k@rIt was one of Maria onee-chan''s elaborate notebooks.'
24871: '@rThis one was not a diary.@k@r......It was a grimoire, which she had written as a witch.'
24872: '@rThe Seven Stakes of Purgatory were BEATRICE''s furniture.@k@rCreated by her and employed only for her sake.'
24873: '@rBut since BEATRICE was a witch of Mariage Sorciere, they could also be employed by MARIA, who was a witch of the same alliance.'
24874: '@rFor that reason, the method of summoning the Seven Stakes of Purgatory and how to handle them was written about in great detail in Maria onee-chan''s grimoire...'
24875: '@rAnd...@kas another person with her name in the same alliance, I was also permitted to employ them.'
24876: 'Ange@r@v11/42000649.".........This stake is...@v11/42000650..........which of the Seven Sisters?"'
24877: 'Maria@r@v13/40400642."Their characteristics are well described in my grimoire.@k@v13/40400643. ...The Sisters of the Seven Stakes really hate it when you get their names wrong.@k@v13/40400644. Remember their names well before summoning them."'
24878: '@rA colossal number of pages telling of the Seven Stakes of Purgatory.@k@r...They described the seven sisters in great detail.'
24879: '@r......Yes.@k Quite a long time ago, I think I learned these pages almost by heart.'
24880: '@rThe more I read it, the more I start to remember...'
24881: '@rBy the illustrations and identifying characteristics written in the grimoire, I could tell that the stake in my hand was the "Stake of Mammon".'
24882: '@rIn the past, I had been summoning them without any vessel, because I never had any stakes.'
24883: '@r......So this was the first time I had gotten a good look at any of the seven stakes, not just Mammon.'
24884: 'Ange@r@v11/42000651."Mammon.@k@v11/42000652. The fifth sister.@k@v11/42000653. Presides over the deadly sin of greed.@k@v11/42000654. ......What an incredible kid."'
24885: 'Maria@r@v13/40400645."Greed also controls aspirations, the desire to improve oneself, and the strength to live.@k@v13/40400646. It definitely doesn''t mean only bad things.@k@v13/40400647. ......She''s rude, but she''s a girl who tries really hard."'
24886: 'Ange@r@v11/42000655."......Yes.@k@v11/42000656. You could say that without desire, there''s no reason to live."'
24887: '@rFor a while, I heightened my concentration and digested the information that was written about Mammon.'
24888: '@r......The more the summoner knows about the target that''s being summoned, the better...@k Knowledge brings about magical power.'
24889: '@r......I began to fill my head with knowledge about Mammon, and build the necessary amount of magic power for the summoning.'
24890: 'Ange@r@v11/42000657."......Grimoires are a little bit interesting, aren''t they.@k@v11/42000658. Maybe much more interesting than reading some crappy novel.@k@v11/42000659. ......And it really takes me back, somehow."'
24891: 'Maria@r@v13/40400648."For a grimoire, it is demanded not only that you understand the text, but that you expand the world from the gaps between the lines,@k@v13/40400649. and give birth to a world from the illustrations, creating things in various ways."'
24892: 'Maria@r@v13/40400650."......The power to create.@k@v13/40400651. For someone who has that, such as you, a grimoire should be more interesting than any book.@k@v13/40400652. ...I''ve always known that you''d be able to understand that."'
24893: 'Ange@r@v11/42000660."............I think that should be enough knowledge of Mammon for now.@k@v11/42000661. .........Yeah.@k@v11/42000662. It''s come back to me, more or less.@k@v11/42000663. ...I''ll give it a try."'
24894: 'Maria@r@v13/40400653."Take care.@k@v13/40400654. ......In preparation for the worst, use my talisman.@k@v13/40400655. ......You are not protected by the treaty of the alliance now.@k@v13/40400656. That Mammon can be a little aggressive at times.@k@v13/40400657. ...She may still bear a grudge.@k@v13/40400658. Be careful."'
24895: 'Ange@r@v11/42000664."Yeah.@k@v11/42000665. ...I think I''ll wear it."'
24896: '@rThe Seven Stakes of Purgatory, as furniture for sacrificial rituals, are treated as beings inferior even to weapons.'
24897: '@rBut that is only when it comes to demons.@k@rTo Humans, even furniture is something to be feared.'
24898: '@rI fished through the knapsack again,@k took out a bracelet charm with a scorpion medal that I had gotten from Maria onee-chan long ago, and put it on my arm.'
24899: '@r......I had no need for something like this in the past.@k@rBut I need insurance...'
24900: 'Maria@r@v13/40400659.".........It''s alright.@k@v13/40400660. That is still endowed with a sufficient amount of magic defense.@k@v13/40400661. As long as you have it on, I''m certain you''ll be fine."'
24901: '@rMaria onee-chan''s magical power, in particular the power she could put into charms, was enough to earn even BEATRICE''s admiration.'
24902: '@r......While it would only have looked like something cheap to a human who couldn''t understand magic,@k its magical worth was incalculable.'
24903: 'Ange@r@v11/42000666."..............................@k@|@y@v11/42000667. Come, arise.@k@v11/42000668. Forgive the sin.@k@v11/42000669. ...One of the Seven Stakes of Purgatory.@k@v11/42000670. Mammon of Greed."'
24904: '@r......................'
24905: '@rI concentrated my mind.@k@rI made the anti-magic toxin that filled my body zero.'
24906: '@rImagine a vast, untainted space.@k@r......Doubts and common sense all resist magic.'
24907: '@rMake the resistance zero, and erase the burden towards magical power......'
24908: '@r..............................@k@r......Inside my head was the image of a vast space.'
24909: '@rIt was a nighttime world where I floated in the air and the neon stars on the ground sparkled.'
24910: '@rA world where the stars that should have covered the heavens were drowned out by the light from below, and the stars covered the ground instead.'
24911: '@rIn the world of a vast night sky with no obstructions,@w583. ......I imagined the wind blowing through freely.'
24912: '@rJust then,@w333. ......in that room where no wind could blow,@w500. ......the free nighttime wind whirled around.'
24913: '@rThat long-forgotten sensation raced through my entire body.@k@r............The unique feeling of exultation felt when using magic.'
24914: '@rFrom Mammon''s stake, held out in my hand, I gradually began to feel a pale light.'
24915: '@rThe cyclone gyred around the stake.@k@r......The hefty stake floated a bit into the air.'
24916: 'Maria@r@v13/40400662."............Wonderful.@k@v13/40400663. ...Looks like the gap in your training hasn''t stolen your talent."'
24917: 'Ange@r@v11/42000671."......Come, arise.@k@v11/42000672. Forgive the sin.@k@v11/42000673. ...One of the Seven Stakes of Purgatory, Mammon of Greed.@k@v11/42000674. ......Show yourself to me......"'
24918: '@rI slowly raised my hand, and as I brought it higher than my head,@k almost as though it was being sucked upwards by it, the Stake of Mammon likewise floated high up into the air, ......and gradually began to shake.'
24919: '@rIts shaking grew faster and faster,@w583. .........and then it burst.'
24920: '@rWith a speed faster than the eye could follow, it flew around, violently rebounding off the walls of the room.@k@r......The terrible sound of it jumping from place to place bore down upon me, trying to make me flinch.'
24921: '@r......But I mustn''t lose my mental concentration.'
24922: '@rThen, the stake, which had been flying around at an incredible speed, finally restrained itself and faced me.'
24923: '@r......It was in the air, just a few centimeters away from my forehead...held back by the defensive barrier created by the scorpion charm.'
24924: '@rIt was trying to break the defensive barrier, eating into it with incredible power, but Maria onee-chan''s barrier wouldn''t be broken so easily.'
24925: '@r@v42/42700001."...............No good...@v42/42700002. I can''t bite through it......"'
24926: '@rThe stake muttered hatefully.'
24927: '@r......You could probably say that I had been saved thanks to the scorpion charm.'
24928: '@rWithout that, my way of killing time until I got sleepy would have become a way to kill time for all eternity.'
24929: '@rWhen Mammon''s stake realized that it was unable to gouge me, it gave up gracefully, and changed its form from that of a stake into that of a person.'
24930: '@rIn her usual shameless outfit which I would never be seen walking outside in.@k@rAlthough you could say it suited her, in a demonic sort of way.'
24931: 'Mammon@r@v42/42700003.".................Ange-sama, is that you?@k @v42/42700004.............That''s some pretty shabby magical power.@k@v42/42700005. ...Are you really Ange-sama?"'
24932: 'Ange@r@v11/42000675."It''s been a long time, Mammon.@k@v11/42000676. ......Have you been well?"'
24933: 'Mammon@r@v42/42700006."...........................@k@v42/42700007. ...And here I was convinced that furniture which has already fulfilled its function would just be left to rust away in a closet.@k@|@y@v42/42700008. ......So, what kind of sideshow is this?@k@v42/42700009. You aren''t going to say that you''re my owner, are you, Ange-sama...?"'
24934: 'Maria@r@v13/40400664.".........Yep.@k@v13/40400665. Ange is your master."'
24935: 'Mammon@r@v42/42700010."Lady MARIA...@k@v42/42700011. .........I am ashamed.@k@v42/42700012. Was that barrier just now yours?"'
24936: 'Maria@r@v13/40400666."Yeah.@k@v13/40400667. I thought that as Ange is now, she might just fall to you.@k@v13/40400668. I lent her a talisman."'
24937: 'Mammon@r@v42/42700013.".....................@k@v42/42700014. ......If I am told by Lady MARIA that Ange-sama is my master, I can hardly refuse.@k@|@y@v42/42700015. .........Ange-sama, I am yours to command.@k@v42/42700016. Given that my assistance is required...is it a new ritual?@k @v42/42700017.New sacrifices...?"'
24938: 'Mammon@r@v42/42700018."Of course, that''s only if you''re willing to handle me yourself and get your own hands dirty."'
24939: 'Ange@r@v11/42000677.".........That role isn''t one I''m looking for anymore.@k@v11/42000678. .........All you have to do is just talk with me, like you used to."'
24940: 'Mammon@r@v42/42700019."...................................."'
24941: 'Ange@r@v11/42000679."........................"'
24942: 'Mammon@r@v42/42700020.".........Heheh.@k@v42/42700021. ...Yes, if that is what you desire.@k@v42/42700022. Furniture is furniture because it is used.@k@v42/42700023. It is an honor just to be summoned.@k@v42/42700024. Ange-sama."'
24943: '@rMammon had a slightly complicated smile on her face.'
24944: '@r......She had accepted Ange as her new master because Maria had told her to,@k but it looked like she hadn''t gotten over her discontent at working for Ange with her frail magical power.'
24945: '@rOr perhaps she had some other reason for hating Ange,@k ......but for now, it seemed that she couldn''t disobey Ange despite her discontent.'
24946: 'Mammon@r@v42/42700025.".........So?@k @v42/42700026.What should I do?"'
24947: 'Ange@r@v11/42000680."I don''t know.@k@v11/42000681. .........Just be lively.@k@v11/42000682. Like old times."'
24948: 'Mammon@r@v42/42700027."With all due respect,@k@v42/42700028. I think this liveliness you speak of is probably the bustle from when we sisters are together.@k@v42/42700029. It may be difficult by myself.@k@v42/42700030. ......Perhaps it slipped your mind?"'
24949: 'Maria@r@v13/40400669."......Yeah.@k@v13/40400670. The Seven Sisters were really lively when they got together.@k@|@y@v13/40400671. ......But with your magical power now, I think summoning Mammon is the best we can hope for.@k@v13/40400672. The stakes for the other six have been lost."'
24950: 'Mammon@r@v42/42700031."My apologies, Lady MARIA,@k@v42/42700032. but I believe it may not be impossible to summon the Seven Sisters via my own stake.@k@|@y@v42/42700033. ......If Ange-sama is to employ me, I would hope that she has at least that much power......?"'
24951: '@rMammon giggled.'
24952: '@r......Apparently, she wanted me to summon the other sisters without a vessel.'
24953: '@rI see.@k Unable to be satisfied with being summoned alone, she asks for the other sisters to be summoned as well.'
24954: '@r...I get it - greed.@k Yes, she was like this back then, wasn''t she......'
24955: '@r.........Bliss for furniture is when it is used.@k Being used, no matter how roughly, is furniture''s joy.'
24956: '@rNot only that, but no matter how much care you might treat them with, if they are not given a job, that would give them the greatest anguish.'
24957: '@rMammon spoke as though to provoke me, but what she wanted was for me to summon the other sisters somehow and rescue them from the world of nothingness.'
24958: '@r.........Why not just be honest and ask me to, then?@k@rDemons really are difficult.'
24959: 'Maria@r@v13/40400673.".........Ange.@k@v13/40400674. Don''t overdo it.@k@v13/40400675. Just being able to summon Mammon is more than enough rehabilitation."'
24960: 'Ange@r@v11/42000683."Oh, I''m rehabilitated after just one?@k @v11/42000684.I''m just killing time anyway.@k@|@y@v11/42000685. .........Alright, Mammon.@k@v11/42000686. In for a penny, in for a pound.@k@v11/42000687. I''ll call as many as I can for you."'
24961: 'Mammon@r@v42/42700034."Really......?!@k @|@y@v42/42700035.Niiice, Ange-sama!@k @v42/42700036.Alright, go go go!"'
24962: '@rEven though she had said it, it seemed that Mammon hadn''t really expected to be able to ask this of Ange.'
24963: '@rShe hopped around, badgering Ange to summon the other sisters.'
24964: '@r......The consumption of physical and magical power used to call Mammon alone was considerable.@k@r...It will probably be pretty tough to do six more.'
24965: '@r......I''m in awe of the magical power of those who reach the level of being called witches, because those people can summon these sisters with no more than a snap of their fingers.'
24966: 'Maria@r@v13/40400676."Mammon, don''t make Ange overdo it.@k@v13/40400677. She still isn''t back to form yet..."'
24967: 'Mammon@r@v42/42700037."Whaaaa?!@k @v42/42700038.Ange-sama said that she''d summon everyone!"'
24968: '@rActually, I only said that I''d call as many as I could.@k@r......Guess this is greed.'
24969: 'Maria@r@v13/40400678."Don''t overdo it, Ange.@k@v13/40400679. You should rest for today.@k@v13/40400680. You''re tired enough."'
24970: 'Ange@r@v11/42000688."It''s alright.@k@v11/42000689. I''m just killing time anyway.@k@v11/42000690. Let me get tired enough so I can just keel over."'
24971: '@r......This time there''s no vessel.'
24972: '@rI''ll have to strengthen the image solely from the knowledge in the grimoire, and manifest them just with that.'
24973: '@rI held my hands out into the air, replaying in my head the sensation from when I had summoned Mammon......'
24974: '@rCome on, I know all of the Seven Sisters personally.@k ......Remember, in the past,@w500. ......the times I talked with them.........'
24975: '@rOnce again, ......the power of magic began to fill me up.@k It radiated as a faint, and yet distinct pale blue light from both of my hands......'
24976: 'Mammon@r@v42/42700039."Ange-sama...!@k @v42/42700040.Keep it up, keep it up, do your best...!@k @|@y@v42/42700041.Hey, Lady MARIA.@k@v42/42700042. Ange-sama will definitely summon everyone, right?@k @v42/42700043.The Seven Sisters will get to be reunited again, right?@k @v42/42700044.Right?!"'
24977: 'Maria@r@v13/40400681."Yeah, I''m sure of it.@k@|@y@v13/40400682. ......But there''s no guarantee that it will happen tonight."'
24978: 'Mammon@r@v42/42700045."No, Ange-sama can do it, I just know it...!@k @v42/42700046.Please, Ange-sama...!@k @v42/42700047.Start from the youngest sister, Asmo...!"'
24979: 'Ange@r@v11/42000691.".........Asmodeus.@k@v11/42000692. The seventh sister.@k@v11/42000693. ...............OK.@k@v11/42000694. I''ll call them in order starting from the youngest."'
24980: '@rA strand of hot sweat dripped down from my forehead.@k@r......This really does put one hell of a strain on you.'
24981: '@rThe pale light in this space......began to form into the vague outline of a girl...'
24982: 'Ange@r@v11/42000695.".........Come, arise.@k@v11/42000696. One of the Seven Stakes of Purgatory, Asmodeus of Lust..."'
24983: '@rThere was no vessel.@k ......However, with the strong core conviction that she definitely did exist there, ......I began to crystallize her form...'
24984: '@rHer outline became distinct, .........and the form of the youngest of the Seven Sisters, Asmodeus, was finally created.'
24985: 'Asmodeus@r@v44/42900001."Asmodeus of Lust, right here......@k@|@y@v44/42900002. .........Where is this?@k @v44/42900003.Am I alive......?"'
24986: 'Mammon@r@v42/42700048."Asmo...!!@k @v42/42700049.I''m so glad!!"'
24987: 'Asmodeus@r@v44/42900004."Mammon nee-san!@k @v44/42900005.......Where in the world is this?@k @v44/42900006.Who summoned me?"'
24988: 'Mammon@r@v42/42700050."Ange-sama did...!@k @v42/42700051.Ange-sama said she''d revive all of us...!"'
24989: '@r...No I didn''t.'
24990: 'Asmodeus@r@v44/42900007."Ange-sama, thank you!@k @v44/42900008.Next is Belzie...!!@k @v44/42900009.Do Belzie please...!"'
24991: 'Ange@r@v11/42000697."......Beelzebub.@k@v11/42000698. The sixth sister.@k@|@y@v11/42000699. ......Beelzebub of Gluttony.@k@v11/42000700. Come, arise..."'
24992: '@rIf I just keep on like this, ......I wonder how many I can summon.@k@rIf I lose my concentration,@w500. ...that''ll probably be it.'
24993: '@rThe pale light made an outline, .........and formed into Beelzebub.'
24994: 'Beelzebub@r@v43/42800016."Beelzebub of Gluttony, right here......"'
24995: 'Mammon@r@v42/42700052."Belzieee!!"'
24996: 'Asmodeus@r@v44/42900010."Ange-sama, awesome, awesome!!"@|@y'
24997: '@rMammon and Asmodeus jumped on Beelzebub, celebrating their reunion.'
24998: '@r......Summoning three people at once.@k ...My head was throbbing.'
24999: '@rWithout resting, I summoned the next one.'
25000: 'Ange@r@v11/42000701."......Come, arise.@k@v11/42000702. One of the Seven Stakes of Purgatory, Belphegor of Sloth..."'
25001: 'Belphegor@r@v41/42600001."Belphegor of Sloth, right here.@k@|@y@v41/42600002. .........My, ...to think that I would still be needed..."'
25002: 'Beelzebub@r@v43/42800017."Belphe-neeeeee!@|@y@k @v43/42800018.I''m huuungryyy!@k @|@y@v43/42800019.I mean - I''m so glad to see you again!!"'
25003: 'Asmodeus@r@v44/42900011."To think that the Seven Sisters would be able to meet again...@k@v44/42900012. Ange-sama, we are truly thankful!"'
25004: 'Mammon@r@v42/42700053."Keep it up and do Satan-nee next!@k @v42/42700054.And Levia-nee and Luci-nee...!!"'
25005: 'Ange@r@v11/42000703.".........Yes,@v11/42000704. ...I know.@k@v11/42000705. ......So please, try not to be so loud.@k@v11/42000706. ......Doing four people at the same time...@v11/42000707....is pretty...tough..."'
25006: 'Maria@r@v13/40400683."Ange, don''t push yourself any more than this.@k@v13/40400684. You did a great job summoning four of them after such a long time."'
25007: 'Belphegor@r@v41/42600003."...Stop it, Mammon.@k@v41/42600004. Our summoning is placing a heavy strain on Ange-sama right now.@k@v41/42600005. Ange-sama, I beg you not to push yourself too hard..."'
25008: 'Mammon@r@v42/42700055."No way!@|@y@k @v42/42700056.Ange-sama promised!@k @v42/42700057.She said she''d play with all of us again!"'
25009: '@r...No I d - ...'
25010: 'Mammon@r@v42/42700058."Didn''t you!@k @v42/42700059.Ange-sama!@k @v42/42700060.You said we''d all meet again!@k @v42/42700061.You promised we''d be able to see each other again soon!"'
25011: 'Ange@r@v11/42000708."........................"'
25012: 'Ange@r@v11/42000709.".........You''re right, .........I did.@k@v11/42000710. ......I didn''t promise anything about when "soon" would be, ......but I certainly did...promise."'
25013: 'Mammon@r@v42/42700062."So keep that promise!@k @v42/42700063.If you don''t, I''ll never forgive you for forgetting it until today...!"'
25014: 'Ange@r@v11/42000711."..................@k@v11/42000712. ......Come, arise.@k@v11/42000713. One of the Seven Stakes of Purgatory, Satan of Wrath..."'
25015: '@rMy mind was starting to get hazy...@k ......But...I''ll call.'
25016: '@rI may have forgotten those days.@k@rI may not have thought of them as anything but sadness and loneliness.'
25017: '@r......But certainly...the short time I spent with these girls...@k...was, without a doubt, fun.'
25018: 'Satan@r@v40/42500001."Satan of Wrath, right here.@k@|@y@v40/42500002. ............What the hell are you people doing!!@|@y@k @v40/42500003.Do you realize how much it''s burdening Ange-sama just for us to have an idle chat?!"'
25019: '@rSatan, who had apparently figured out the situation immediately after being summoned, yelled out in a loud voice, telling her sisters off.'
25020: '@r......That loud voice made my consciousness fade again.'
25021: 'Satan@r@v40/42500004."We are furniture that has been permitted rest by BEATRICE, furniture that has finished its duty!@k @v40/42500005.Not content to be graced with the opportunity to once again be of some use, you are putting a burden on your new master - this is a DISGRACE to furniture!!@k @v40/42500006.Erase yourselves RIGHT NOW!!"'
25022: 'Belphegor@r@v41/42600006."Yes, it''s like Satan-nee says.@k@v41/42600007. I''ll erase myself.@k@v41/42600008. And you all vanish too.@k@v41/42600009. In this moment, that is the best way for us to be of use to Ange-sama."'
25023: 'Mammon@r@v42/42700064."No way.@k@v42/42700065. Not until everyone gets summoned!"'
25024: 'Beelzebub@r@v43/42800020."No way for me too!@k @v43/42800021.I''m hungryyy!@k @|@y@v43/42800022.I mean - we only just met up again, I don''t wanna go back already!"'
25025: 'Satan@r@v40/42500007."Don''t be so selfish!!@|@y@k @v40/42500008.Come on, hurry up and vanish!!@k @v40/42500009.Come on, Asmo!@k @v40/42500010.Disappear right now!!"'
25026: 'Asmodeus@r@v44/42900013."Waaaah, Satan-nee''s bullying me...!@k @v44/42900014.It''s always me first because I''m the youngest, it''s not faaair!"'
25027: 'Ange@r@v11/42000714.".........Ahh, they really are lively.@k@v11/42000715. ......They never make you.........bored......"'
25028: 'Maria@r@v13/40400685."That''s enough.@k@v13/40400686. You''ve surpassed your limits for now, Ange."'
25029: 'Ange@r@v11/42000716."......You''re...@v11/42000717....right...@k@v11/42000718. ........................"'
25030: '@rThis situation where I had summoned five of them, and they were messing around as they pleased,@k was placing far too heavy a load on me currently, with my meager magic power......'
25031: '@r......This is...............it......'
25032: '@rAs my consciousness grew distant, I collapsed onto the bed.'
25033: '@r......Have beds always felt this soft......?@k@r........................'
25034: '@rIt seemed that the sisters were still squabbling together as much as they liked.'
25035: '@r......For a way to kill time until drowsiness comes to get me,@w583. ......this will do............'
25036: '@rFeeling something warm and nostalgic in the sisters'' liveliness, I sank into a world of deep sleep.........'
25037: '@rAt the entrance to my dream world, I felt Maria onee-chan,@w500. ......and Sakutarou, waiting to receive me.'
25038: 'Maria@r@v13/40400687."...............@k@|@y@v13/40400688. You worked hard.@k@v13/40400689. ......And...good job."'
25039: 'Sakutarou@r@v33/44200199.''Uryu.@k@v33/44200200. ...Welcome back, Ange...'''
25040: '@r......Welcome back, huh...@k Then I should respond like this.'
25041: '@r............Glad to be home.........'