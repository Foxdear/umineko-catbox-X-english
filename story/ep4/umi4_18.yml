31017: 'Kasumi@r@v22/44300166."What''s this one?@k @v22/44300167.What''s with this crappy scribble of a lion?@k@v22/44300168. ......Sakutarou?@k @|@y@v22/44300169.What a weird name!@k @v22/44300170.My best friend, it says.@k@v22/44300171. Really?@k@v22/44300172. This is your friend? Your close friend?@k@v22/44300173. This lion is? Is it, is it?"'
