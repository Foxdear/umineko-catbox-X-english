31075: '@r............With a shrill sound, a girl''s world of happiness...@w500.was...@w666.erased.'
31076: 'EVA@r@v34/43300118."Uu-uu-uu!@k @v34/43300119.Aaaa-hah-hah-hah-hah-hah, aaaaahah-hah-hah-hah!!@k @v34/43300120.Is this your magic of happiness?@k @v34/43300121.Hilarious, hilarious...!!"'
