30972: 'Kasumi@r@v22/44300135."But isn''t this taking it a bit too far?@k @v22/44300136.Oh god, it says "magic".@k@v22/44300137. ......You''re one of those, aren''t you.@k@v22/44300138. You know, that thing in cartoons where they say some "blabbity-blibbity-woo" spell and transform into a witch.@k@v22/44300139. You''re one of those people who like doing that, aren''t you?@k @v22/44300140..........This is just painful.@k@v22/44300141. *snicker*snicker*."'
