31257: 'EVA@r@v34/43300186."Heh, ......heheheheheh.@k@v34/43300187. ...If my form still looks like Ushiromiya Eva,@k@v34/43300188. that means you still haven''t been able to forgive "me" inside yourself."'
31258: 'EVA@r@v34/43300189."I understand, Ange.@k@v34/43300190. ............You also want to be released from your thorn-covered life more than anything."'
31259: 'Ange@r@v11/42001746."...................................."'
31260: 'EVA@r@v34/43300191."In that case, ......I''ve thought of something interesting.@k@v34/43300192. I''ll show you magic as well.@k@|@y@v34/43300193. .........I won''t be the one to kill you."'
31261: '@rWith the worst smile on her face,@k the black witch changed her form into something like a black mist,@k ...or else a vast swarm of black flying insects, which began to swirl around me.'
31262: '@rThen that black mist began to amass bit by bit, ......shaping itself into the form of a human.'
31263: 'Ange@r@v11/42001747.".....................What''s this supposed to be......"'
31264: 'EVA@r@v34/43300194.Ehheheheheh!@k @v34/43300195.I think you know very well what!@k@r@v34/43300196.That woman you hated and despised the most!@k@r@v34/43300197.And that woman hated and despised you the most as well...!'
31265: '@rWhen the black mist cleared,@w583. .........over there was...@w833..........Aunt Eva''s form,@w416. ......as she had been while alive.'
31266: '@r......In her hands...she was holding a gun.'
31267: 'Ange@r@v11/42001748."...............Aunt Eva...@v11/42001749....died."'
31268: 'Eva@r@v05/41000116."*giggle*, long time no see, Angeeee.@k@v05/41000117. ......I''ve returned from hell to kill youu!@k @v05/41000118.*cackle*cackle*!!"'
31269: '@rAunt Eva glared at me, laughing madly.'
31270: 'Ange@r@v11/42001750."But......I''m not that surprised.@k@v11/42001751. Aunt Eva was that kind of person."'
31271: 'Eva@r@v05/41000119."I imagine my funeral cleared your mood up quite a bit, didn''t it?@k @v05/41000120.It did for me too, because it meant that I never have to see your face again...!@k @v05/41000121.But I did have just one regret.@k@|@y@v05/41000122. And this is it!!"'
31272: 'Ange@r@v11/42001752.".........Killing me?@k @v11/42001753.............Was that your last request?"'
31273: '@rHow pitiful.@k ......Even after death,@k ......Aunt wasn''t released from her suffering......'
31274: 'Eva@r@v05/41000123."It was the black witch''s power that was the source of my magic.@k@|@y@v05/41000124. Anger and hatred taught me how to work hard and persist.@k@v05/41000125. Completely different from the escapist magic that you speak of!"'
31275: 'Ange@r@v11/42001754."......The magic you speak of is nothing more than stress reduction through outbursts of anger.@k@v11/42001755. ......Our magic is different.@k@v11/42001756. It can remake the entire world.@k@v11/42001757. .........It''s of a completely different class than your ill-natured magic."'
31276: 'Eva@r@v05/41000126."*snicker*!!@k @v05/41000127.In that case, I''ll settle it here, once and for all - which comes out on top, black or white...!!@k @|@y@v05/41000128.By my black magic, I have performed a miracle that has allowed me to revive and point a gun at you like this, even after death.@k@v05/41000129. With what kind of miracle will your white magic fight back?"'
31277: 'Eva@r@v05/41000130."I have taken you in amongst the anti-magic toxin.@k@v05/41000131. You won''t be able to call the Seven Sisters any more.@k@v05/41000132. That miracle just now won''t occur again...!!"'
31278: 'Ange@r@v11/42001758."...............But it will, regardless - that''s the reason it''s called magic.@k@|@y@v11/42001759. ......Alright.@k@v11/42001760. Mammon. Lend me your power."'
31279: '@r......But Mammon didn''t respond.@k She didn''t appear.'
31280: '@rCertainly, as she said,@k the anti-magic toxin had burned everything up like a wasteland parched by a blazing sun...'
31281: '@r.........This might be a little tough.'
31282: 'Eva@r@v05/41000133."It''s useless to call out.@k@v05/41000134. Never again...@k @v05/41000135.will the Seven Sisters of Purgatory answer you!"'
31283: 'Ange@r@v11/42001761."Like I said.@k@v11/42001762. I can call them anyway... That''s what makes it magic, right?"'
31284: 'Eva@r@v05/410001376."........................@k@v05/41000137. ......You''re a sad child, Ange.@k@v05/41000138. So long.@k@v05/41000139. The simple days we spent together were reasonably fun.@k@v05/41000140. This is goodbye.@k@|@y@v05/41000141. ......It must be nice for you that this was your final stop."'
31285: 'Ange@r@v11/42001763."Yeah, totally.@k@v11/42001764. That''s very thoughtful of you."'
31286: 'Eva@r@v05/41000142."Thanks.@k@v05/41000143. Then this is farewell."'
31287: '@rThe barrel of the gun rose slowly,@|@y@w500. ......so that you could see all the way down it.'
31288: '@rAnd,@w583. .........the trigger was slowly.........'
31289: '@rThen,@k ......there was a loud bang from the gun.'
31290: '@r...Not in the sense that it fired.@k ......It exploded.'
31291: '@r............You''re...kidding me......'
31292: '@r......In shock, inside frozen space,@w583. ......Eva looked at the exploded gun.'
31293: '@rWhen time unfroze, the fragments would probably smash into her face all at once...'
31294: 'Mammon@r@v42/42700391."......Mammon of Greed.@k@v42/42700392. Right here."'
31295: 'Eva@r@v05/41000144.".....................You''re...kidding me..."'
31296: '@rBehind Eva''s back, Mammon stood.@k .........She had already penetrated the target I had given her.@k ......Which was...the gun.'
31297: 'Ange@r@v11/42001765."Is this......enough magic for you?@k @v11/42001766.............Aunt Eva."'
31298: 'Eva@r@v05/41000145."......A-@v05/41000146..........Angeee........."'
31299: '@rThen, time unfroze.@k@rFragments of the ruptured gun and gunpowder gas burned her face.@k@rLetting out a shrill scream, she rolled around covering her face......'
31300: '@r......It was pitiful.'
31301: 'Ange@r@v11/42001767."......Unlucky.@k@v11/42001768. ......This is game over.@k@v11/42001769. Aunt Eva."'
31302: '@rI signaled to Mammon.@k ...To free Eva quickly from her pain as she writhed around with her burnt face.'
31303: 'Ange@r@v11/42001770."............Thank you, Mammon.@k@v11/42001771. ...I''d like to apologize again, now, from the bottom of my heart, for calling all of you powerless on that day in the classroom.@k@v11/42001772. You were excellent furniture for protecting witches."'
31304: 'Mammon@r@v42/42700393.".........It is I who should be grateful.@k@|@y@v42/42700394. ......I feel truly honored to have been able to meet a good witch and a good master in the end, and to have had the opportunity to fulfill my duty as furniture...!"'
31305: '@rMammon understood.@k@rThis would be the final job I would ever give her.'
31306: '@rMammon quietly walked close.@k@rThen, she looked down upon her.'
31307: 'Ange@r@v11/42001773."......Aunt Eva.@k@v11/42001774. Thank you for sticking with me until today.@k@v11/42001775. This is farewell.@k@v11/42001776. <Have a nice dream>.@k@v11/42001777. <See you in hell>."'
31308: 'Eva@r@v05/41000147."<Cool>."'
31309: '@rThen, ......the light sound of her forehead being perforated rang out.'
31310: '@r......The battle of gunpowder smoke, delirium, ......and white and black magic...was over.'
31311: '@rIt felt like it had been a long, .........truly long journey.@k@rAnd the world slowly...@k...sank into darkness.........'
31312: '@rThe stars that should be sparkling.........lay not in the sky, but were scattered beneath me.'
31313: '@r......When I recognized that the pearls and rubies were creating a river of white and red,@k I realized that it was a vast nighttime scene that was spread out below me...'
31314: '@rI was in the sky of that nighttime scene, neither standing nor flying,@k ......but simply floating in the air.'
31315: '@r......From nowhere in particular, I could hear the sound of one person clapping - @ka truly dull applause.'
31316: '@rI understood.@k ......It was the one who ordered me to go on this journey,@w583. ......BERNKASTEL.'
31317: 'BERNKASTEL@r@v28/42100103."...............Congratulations,@k@v28/42100104. Endless Witch, ANGE BEATRICE.@k@v28/42100105. At the end of your travels, you understood everything about magic."'
31318: 'Ange@r@v11/42001778."......Yes.@k@v11/42001779. .........I now...understand everything about magic.@k@|@y@v11/42001780. .........I am...a witch.@k@v11/42001781. ......The last witch who inherited the magical world created by Mariage Sorciere."'
31319: 'BERNKASTEL@r@v28/42100106.".........No one besides you...can tear BEATRICE''s world to pieces."'
31320: 'Ange@r@v11/42001782."And it was through coming to know magic.........that I learned also how to resist it."'
31321: 'BERNKASTEL@r@v28/42100107."................................."'
31322: 'Ange@r@v11/42001783."......Magic is made of love and sadness and anger.@k@v11/42001784. ......No matter how cruel a witch BEATRICE might have been,@k@v11/42001785. the source of her magic is exactly the same."'
31323: 'Ange@r@v11/42001786.".........And that''s why, honestly, I wish I could leave that world of hers alone.@k@v11/42001787. ......After all, in her eyes at least, that world is complete as it is."'
31324: 'BERNKASTEL@r@v28/42100108."............But then you''d have to give up on your family."'
31325: 'Ange@r@v11/42001788.".....................@k@v11/42001789. ......That''s right.@k@v11/42001790. So, although I feel bad about it, I have to fight.@k@v11/42001791. .........Because the very reason I left on this journey to become a witch...@k@v11/42001792....was so that I could bet on the small probability that I could take my family back."'
31326: 'BERNKASTEL@r@v28/42100109."Unless you kill BEATRICE, only worlds of isolation can exist for you.@k@v28/42100110. ......As one who has traveled through billions of fragments, I can guarantee it."'
31327: 'Ange@r@v11/42001793."............I understand.@k@v11/42001794. ......I don''t have room for compassion.@k@v11/42001795. ......I must make my heart a demon,@v11/42001796. .........and tear her heart to pieces."'
31328: 'BERNKASTEL@r@v28/42100111."......It is good that you are steady in your resolve.@k@v28/42100112. I was worried that, as another witch like her, you might grow attached and lose your will to continue."'
31329: '@rComing from a person like her, whose face was almost always expressionless, those words felt a bit hollow.'
31330: '@rBERNKASTEL.@k ......The enigmatic witch who invited me on this journey.@k@r....................................'
31331: 'Ange@r@v11/42001797."There were moments when I suspected that you might have been lying to me."'
31332: 'BERNKASTEL@r@v28/42100113.".....................Why?"'
31333: 'Ange@r@v11/42001798."......I am the Ange of 1998, so even if I save my family, that will only bring relief to the Ange of 1986.@k@v11/42001799. ......It won''t do anything for me.@k@v11/42001800. So I sometimes felt like I was being deceived."'
31334: 'BERNKASTEL@r@v28/42100114."........................@k@v28/42100115. ......That is correct.@k@v28/42100116. I deceived you."'
31335: 'Ange@r@v11/42001801."......But now I''m grateful.@k@|@y@v11/42001802. .........After all,@k@v11/42001803. in the end, you did teach me the way to take my family back."'
31336: 'BERNKASTEL@r@v28/42100117."............I didn''t teach you anything.@k@v28/42100118. ......If you have come to know that, it''s a state of understanding that you reached on your own as a witch.@k@v28/42100119. That place you have reached is different from mine.@k@v28/42100120. .........I myself cannot comprehend it, but if it is as you say, then congratulations."'
31337: 'Ange@r@v11/42001804."I am not a player in this game, but a piece.@k@v11/42001805. You said this to me, right?"'
31338: 'BERNKASTEL@r@v28/42100121."............Yes, I did."'
31339: 'Ange@r@v11/42001806."Now, I fully understand that role.@k@v11/42001807. ...............A piece doesn''t need emotions.@k@v11/42001808. It just has to give its all for the sake of victory."'
31340: 'BERNKASTEL@r@v28/42100122."............Yes.@k@v28/42100123. That''s exactly right.@k@v28/42100124. A game is where you each make the best possible move, right?@k @v28/42100125.If you allow your moves to get distorted by hesitation and indecision, your opponent will be confused as well."'
31341: '@r..................Sorry, BEATRICE.'
31342: '@rBut...don''t hold it against me.@k@r......"Ushiromiya Ange" still needs her family.'
31343: '@rSo I have the right to fight you...so that I can take them back.'
31344: '@rAnd you have the responsibility to accept my challenge.'
31345: '@r.........So please...don''t hold it against me.'
31346: '@rIn exchange...@kif you do win in this game,@k I''ll give you my blessing as well.'
31347: '@rNow, let''s go.@k .........As the piece I am, it''s finally time for my true turn.'
31348: '@rSorry, BEATRICE.'
