31037: 'Kasumi@r@v22/44300177."I really don''t get it.@k@v22/44300178. From this delusional diary, I''ve got to assume that something''s wrong with your head.@k@v22/44300179. ......It really is interesting to take a peek into your happy-go-lucky little mind.@k@v22/44300180. You creepy child."'
