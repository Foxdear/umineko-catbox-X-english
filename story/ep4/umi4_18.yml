30589: 'Ange@r@v11/42001533."Amakusa, could you turn that off?"'
30590: 'Amakusa@r@v20/43000097."Whoops, my bad.@k@v20/43000098. You don''t like M. Zakky?"'
30591: 'Ange@r@v11/42001534."I''m just not in the mood."'
30592: '@rAmakusa turned the radio off.'
30593: '@rThe world of cheery sounds was immediately swallowed up by the roar of the sea,@k and blotted out by the ocean''s gray......'
30594: 'Kawabata@r@v24/43800062.".........See it?@k@v24/43800063. Over there''s where the harbor was at the time."'
30595: 'Ange@r@v11/42001535.".............................."'
30596: '@rThe boat captain pointed, but I couldn''t really recall how it looked twelve years ago.'
30597: '@r......I had believed that my memories of back then would come flooding back into my mind,@k ...but no memories were coming back to me at all.'
30598: '@rAfter the incident, the island was sealed off and left to the wild.'
30599: '@r......Probably that''s understandable, I had to tell myself, to stop myself from feeling somehow...sad and hurt.'
30600: '@r.........Ah, but I at least remember one thing.'
30601: '@rYou could say that it would probably be the same anywhere on the sea, ......but at least this one thing, I do remember.'
30602: '@rThe cries...@kof the seagulls.@k I do remember those.'
30603: '@r......I almost never went to the ocean when I was young.'
30604: '@r...So, to me, everything that symbolized the ocean meant Rokkenjima, and my family getting together.'
30605: '@rIn short, ......it was a symbol for the happiness of going out with my family.'
30606: '@rHowever, at this point in time, it even seems doubtful whether that was happiness at all.'
30607: '@rIn my younger days, the trip had felt like a relaxed family vacation, but considering my parents'' situation at the time,@k it was surely a very difficult trip to handle, with the distribution of the inheritance filling the place with the smell of flaring tempers and fuses about to blow.'
30608: '@rI can remember giggling all over the place, completely ignorant of my parents'' feelings...'
30609: 'Amakusa@r@v20/43000099."Rokkenjima, ......is it.@k@v20/43000100. The beginning of everything, and the last stop for all journeys."'
30610: '@rAmakusa tried too hard in an attempt to speak for my innermost feelings.'
30611: '@rThe boat slowly rounded the island.@k ......As the angle changed, I hoped that my memories of the island''s silhouette at the time might come back just a little,@k but in the end, even as the inlet was completely hidden by the cliffs, I wasn''t able to remember anything...'
30612: 'Ange@r@v11/42001536."......Captain, that thing you mentioned...@k@v11/42001537.about the other harbor...please tell me about it."'
30613: 'Kawabata@r@v24/43800064."Mmhm.@k@v24/43800065. .........They say Rokkenjima''s only got one harbor.@k@v24/43800066. But that''s only its outward appearance."'
30614: 'Ange@r@v11/42001538."An extra hidden harbor on the back of the island.@k@v11/42001539. .........That''s Rokkenjima all over.@k@v11/42001540. It has a second face, which no one knows about..."'
30615: 'Kawabata@r@v24/43800067."............Rokkenjima is an island in the possession of the Ushiromiya family.@k@v24/43800068. But it has another face, as an island owned by Kinzo-san personally......"'
30616: 'Amakusa@r@v20/43000101."One island, two harbors, two mansions, ......is it.@k@v20/43000102. He sure spent a lot just so he could keep a mistress."'
30617: 'Ange@r@v11/42001541."Who knew about this other harbor...?"'
30618: 'Kawabata@r@v24/43800069."Not many.@k@|@y@v24/43800070. Kinzo-san, Genji-san the butler.@k@v24/43800071. Those of us involved with the boats,@k@v24/43800072. and a very small number of the oldest servants.@k@v24/43800073. ......The last owner of the Nanjo clinic and that Kumasawa baa-san knew as well.@k@v24/43800074. Naming ''em off like this makes it sound like there were a bunch of ''em, but I tell you now, it was only a very small number who knew."'
30619: 'Ange@r@v11/42001542."Please...tell me about that other mansion."'
30620: 'Kawabata@r@v24/43800075."......All''s I was told is there''s a mansion called Kuwadorian.@k@v24/43800076. Wasn''t allowed to leave the boat, so I never once saw the place, though."'
30621: 'Amakusa@r@v20/43000103."So it was far away enough that you couldn''t see it from the harbor?"'
30622: 'Kawabata@r@v24/43800077."Beats me.@k@v24/43800078. ......But it was a hidden mansion after all.@k@v24/43800079. Probably was built where you can''t see it from the outside.@k@v24/43800080. ...Anyway, Kuwadorian was that island''s biggest secret."'
30623: 'Ange@r@v11/42001543."There''s a theory that BEATRICE was being made to live in Kuwadorian,@k@v11/42001544. or else was being confined there... What do you think, Captain?"'
30624: 'Kawabata@r@v24/43800081."......I carried over sundries meant for Kuwadorian, too.@k@v24/43800082. Oftentimes that included stuff only women would use, and fancy stuff at that.@k@|@y@v24/43800083. ......No doubt in my mind, that theory is true."'
30625: 'Amakusa@r@v20/43000104."So does that mean you never saw this BEATRICE woman directly, Captain?"'
30626: 'Kawabata@r@v24/43800084."Never.@k@v24/43800085. Came and went for close to twenty years, and never saw her once."'
30627: 'Amakusa@r@v20/43000105."Twenty years...!@k @v20/43000106.Whew, so that''s at least plus twenty onto her age.@k@v20/43000107. Well, that shoots down my hopes for a mademoiselle."'
30628: 'Kawabata@r@v24/43800086."But one day, bang, all trips to and from Kuwadorian stopped.@k@v24/43800087. That was about thirty years ago,@v24/43800088. ......so around 1968, I think."'
30629: 'Ange@r@v11/42001545."Bang?@k @v11/42001546.You mean suddenly?"'
30630: 'Kawabata@r@v24/43800089."......We''d come by the back on a specified schedule to carry food and trash one way or the other.@k@|@y@v24/43800090. ......Uh, when I say the back, I mean the harbor on the Kuwadorian side."'
30631: 'Ange@r@v11/42001547."I get it.@k@v11/42001548. ...So then?"'
30632: 'Kawabata@r@v24/43800091."So one day, I get a sudden message from Genji-san.@k@v24/43800092. And he tells me, until you hear differently, we don''t need you to go to the back anymore."'
30633: 'Amakusa@r@v20/43000108."And did you hear differently?"'
30634: 'Kawabata@r@v24/43800093."Not in particular.@k@v24/43800094. To cut a long story short, one day, suddenly, I was told they didn''t need regular service at the back anymore, and not to bother taking food there either.@k@v24/43800095. ......Thought I''d been given the boot at first."'
30635: 'Kawabata@r@v24/43800096."But it wasn''t long before I realized.@k@v24/43800097. ......And I kind of got the picture from the reactions of the servants who knew of Kuwadorian, as well."'
30636: 'Ange@r@v11/42001549.".........BEATRICE died, and there was no longer any need to take food or people to care for her?"'
30637: 'Kawabata@r@v24/43800098."That''s what I think.@k@v24/43800099. I''ve never been told to take another boat to the back since.@k@v24/43800100. But after that, Genji-san came to see me face to face,@k@v24/43800101. and got real pushy, demanding me to take everything about "the back" with me to the grave."'
30638: 'Ange@r@v11/42001550."So, if that hidden mansion was abandoned for twenty whole years,@v11/42001551. .........why was Aunt Eva there?"'
30639: '@rOn that day twelve years ago...@k......Ushiromiya Eva somehow escaped harm alone in a hidden mansion two kilometers away from the regular mansion.'
30640: '@rWhy was she in a hidden mansion that had been forgotten for twenty years.........?'
30641: 'Kawabata@r@v24/43800102."I saw that on the talk shows.@k@v24/43800103. Even I can''t make heads or tails of that.@k@v24/43800104. Not once did I show Eva-san to the back.@k@v24/43800105. I don''t have the first damn clue how she knew about Kuwadorian or how she got there."'
30642: 'Ange@r@v11/42001552."I wonder if it was possible to go to the back where Kuwadorian is by land."'
30643: 'Amakusa@r@v20/43000109."......If, as we heard, the forest was dense and uncultivated,@k@v20/43000110. I seriously doubt a well-dressed lady person''d be able to push through it."'
30644: 'Ange@r@v11/42001553."So what about by sea?@k @v11/42001554.Maybe there was a motorboat or something."'
30645: 'Kawabata@r@v24/43800106."Are you kidding?@k@v24/43800107. That two-nighter typhoon was awful.@k@v24/43800108. No way you could''a used a boat."'
30646: 'Ange@r@v11/42001555."What if there was......an underground passage or something between the mansion and Kuwadorian.@k@v11/42001556. It would have been a pain to have to charter a boat each time he wanted to visit his mistress''s house, right...?"'
30647: 'Amakusa@r@v20/43000111."A tunnel long enough to connect mansions on opposite sides of a two-kilometer island like Rokkenjima...?"'
30648: 'Amakusa@r@v20/43000112."...Well, I''d like to laugh at the thought, but this is a guy so rich he made a whole hidden mansion for his mistress.@k@v20/43000113. Guess I can''t deny the possibility.@k@v20/43000114. ......What do you think, Captain?"'
30649: 'Kawabata@r@v24/43800109."I''m a man of the sea.@k@v24/43800110. No good asking me about holes.@k@|@y@v24/43800111. But the Japanese military dug a twenty-five-kilometer tunnel on Iwo Jima.@k@v24/43800112. Wouldn''t surprise me one bit if the Kinzo-san could dig at least two."'
30650: 'Ange@r@v11/42001557.".....................This really is a strange island.@k@v11/42001558. Even now, not one of us really knows a thing about it."'
30651: '@rThe boat reached the shore.@k There would be a short walk to reach the mansion.'
30652: 'Kawabata@r@v24/43800113."......I''ll wait here.@k@v24/43800114. The mansion''s that way.@k@v24/43800115. The path from back then''s probably still there, but I''ll bet it''s covered with plants.@k@v24/43800116. Make sure you don''t get yourself lost."'
30653: 'Amakusa@r@v20/43000115."Right, off we go, then?"'
30654: 'Ange@r@v11/42001559."Thanks, Amakusa.@k@v11/42001560. But you wait here too."'
30655: 'Amakusa@r@v20/43000116.".........Eh, I had a feeling you''d say that."'
30656: 'Ange@r@v11/42001561."I''m just delivering something.@k@v11/42001562. You''ll just be trouble for them if you''re with me.@k@v11/42001563. I imagine your toxin is strong."'
30657: 'Amakusa@r@v20/43000117."Toxin?@k @v20/43000118.Hmm."'
30658: 'Ange@r@v11/42001564."I''ll be back soon.@k@v11/42001565. Our main goal today is Kuwadorian.@k@v11/42001566. ......After I deliver this, I''ll come right back."'
30659: '@rAnge put on her knapsack and grabbed the flowers she was planning to offer.'
30660: 'Kawabata@r@v24/43800117."Take the hint, young''un.@k@|@y@v24/43800118. ......Go on, gal.@k@v24/43800119. Your family''s waiting for you."'
30661: '@rI had never been on a road like this, but I had no trouble finding my way.@k@rIf I walked straight ahead, it would probably guide me to the final destination for everything.'
30662: '@rThe vegetation certainly was incredible, and you would lose track of the path if you were careless enough to let your attention drift.'
30663: '@r......But the road that was left was much better than I had imagined.'
30664: '@rStill, that didn''t change the fact that it was a bad road.'
30665: '@r......Contrary to the distance shown on the map, I was forced to walk a long way......'
30666: '@r......The forest was deep and dark.'
30667: '@rAt the time, I had been threatened into staying away from the forest because a witch lived there.'
30668: '@rOf course, that fear is gone now, .........but I feel it.'
30669: '@rOther people may not be able to,@k ......but I can feel the presence, like an aura, of the Golden Witch BEATRICE...'
30670: '@rMassive, oddly shaped rocks scattered here and there. Overgrown trees and ivy.@k ......The voices of birds and bugs.'
30671: '@rYeah, I can feel it.@k .........I can feel...that the witch...is here......'
30672: '@rAhead, an ivy-covered construction site fence and warning sign stood.'
30673: '@r"NO ENTRY  -  TOKYO METROPOLIS".@k That was written on it.'
30674: '@rOh, right.@k When you think "Tokyo", you tend to think of a city,@k but address-wise, even Rokkenjima is a rightful part of Tokyo Metropolis.'
30675: '@r......Apologizing to the sign for my mistaken impression, I climbed over the fence.'
30676: '@rWhen I made it up the steep slope beyond that, ............my field of vision rapidly expanded,@k and a fresh sea breeze blew through my hair......'
30677: '@rIt was like the top of a little hill.'
30678: '@r......Below me was a vast view of the island.'
30679: '@rI could only see desolated forest and rocky crags spread out below me.@k ......But, somehow, I realized that the mansion was probably somewhere around there.'
30680: '@rThe steep downward slope beyond this hill had probably been caused by landslides from twelve years of wind and rain.'
30681: '@rIt had become a slant filled with crags that you might even call gentle cliffs,@k and though it would be easy to tumble down, it looked like climbing back would be pretty difficult.'
30682: '@r.........It seemed that proceeding any further would be impossible.'
30683: '@rIf I continued any further, I wouldn''t be able to return.@k@rIn other words, .........this is...the border.'
30684: '@rBetween 1986 and 1998.@k That day and today.@k@rAnd this world and the other.'
30685: 'Ange@r@v11/42001567."............This is...@v11/42001568....this journey''s...final destination, it seems."'
30686: '@rAs the strong wind blew Mammon and Sakutaro''s hair, they looked down from the hilltop...'
30687: 'Mammon@r@v42/42700349."......I can''t make out a thing from here.@k@v42/42700350. Where''s the mansion?@k @v42/42700351.Let''s get closer."'
30688: 'Sakutarou@r@v33/44200514.''Uryu, ...we can''t.@k@v33/44200515. We won''t be able to come back.'''
30689: '@r......We won''t be able to...come back...@khuh.'
30690: '@rHe''s right.@k ......This is 1998,@w666. ......and I am the Ushiromiya Ange who has been left all alone.'
30691: '@rAt first, it was a journey to die.@k But not anymore.@k@rIt has become a journey to accomplish something......'
30692: 'Ange@r@v11/42001569."Yeah.@k@v11/42001570. ......So, I''m sorry, you two.@k@v11/42001571. As I was back then, on that day, I would have gone down this cliff without any hesitation."'
30693: 'Mammon@r@v42/42700352."Come on, this is pretty lame for the skyscraper-jumping Ushiromiya Ange."'
30694: 'Ange@r@v11/42001572."Sorry."'
30695: 'Sakutarou@r@v33/44200516.''This place is just as good.@k@v33/44200517. .........Because you can feel the wind of that day.'''
30696: 'Mammon@r@v42/42700353."..................@k@v42/42700354. ......Was the wind...really like this?"'
30697: 'Sakutarou@r@v33/44200518.''Yeah.@k@v33/44200519. They will come any moment.@k@v33/44200520. ..................Everyone.'''
30698: '@rSakutaro said it as though it was completely natural.@k@r......And...I believed it.'
30699: '@rMom.@k Dad.@k Onii-chan.@k@rAll of my relatives, and those fun servants.@k@rAnd............Maria onee-chan.'
30700: 'Ange@r@v11/42001573."It''s me.@k@v11/42001574. ......It''s Ange.@k@v11/42001575. ...............I''ve...come back."'
30701: '@rWhen I started my final journey to expose the past of twelve years ago, its goal had been abstract, and I hadn''t understood.'
30702: '@rBut now, ......I have no doubts.'
30703: '@rThis journey............was induced by all kinds of thoughts and fates over twelve years.'
30704: '@rA journey to end things...for me, Ushiromiya Ange.'
30705: '@rAnd a journey to end things...as the final witch of Mariage Sorciere.'
30706: '@rI came here as the final daughter of the Ushiromiya family,@k and as the final witch......'
30707: 'Ange@r@v11/42001576."......Mom, Dad, Onii-chan.@k@v11/42001577. ...Sorry.@k@v11/42001578. Let me greet Maria onee-chan first."'
30708: '@rA strong gust of wind from behind urged me on.'
30709: '@rThat gust took just my soul out from inside my body, ......to the vast forest beneath me.'
30710: '@rAnd, though I couldn''t see it from where I stood, I believed that it would fly me to the mansion on that day,@k to where everyone was...to where Maria onee-chan was.'
30711: '@rAnd so,@k ......even though my body was on the top of the hill, a strong wind blowing against me,@k .........my soul was now certainly dancing through that sky......'
30712: '@rThe vast, vast sky of Rokkenjima.@k@r......Below me was the green of many trees.'
30713: '@rBut...I can tell.@k I can comprehend the presences of my family and relatives, and all the servants.@k .........And...Maria onee-chan too.'
30714: '@rI could even comprehend......Maria onee-chan as a witch.'
30715: '@rIt was vast, more vast than any space I had imagined up until now.'
30716: 'Ange@r@v11/42001579.".........Maria onee-chan.@k@v11/42001580. Can you hear me......?@k @v11/42001581.Listen......!!"'
30717: '@rAnge shouted to the Maria of that day.'
30718: '@rThat she had been through a long journey.'
30719: '@rAnd that she had learned just how much she had wounded Maria on that day when she was young.'
30720: '@rHaving understood magic, I now understand everything about the world Maria wanted to show me.'
30721: '@rIt is so warm, and overflowing with kindness and happiness.'
30722: '@r......She had wanted to become even happier by sharing that world,@k but I had trampled it.'
30723: 'Ange@r@v11/42001582."So now, I finally understand everything.@k@v11/42001583. ......I understand...magic...!@k @v11/42001584.Our magic is surely a very humble thing that exists all around us.@k@v11/42001585. ......But it isn''t something that just anyone can see with their eyes.@k@v11/42001586. ............Magic is...@k@v11/42001587....yes, I can say it clearly."'
30724: '@r -  - Without love, it cannot be ''seen''.'
30725: '@rI''m sorry, Onee-chan.'
30726: '@r......I''ve already been excommunicated from the witches'' alliance, but...@k@r...after all this time, I now understand how wonderful it is.'
30727: '@rAnd.........I know that after that day I wounded you, Mariage Sorciere was...@k...transfigured into something different from what you truly desired.'
30728: '@r.........Back in those days, even magic that allowed you to vent your anger by cursing people was probably important to you.'
30729: '@rYour environment was unhappy enough for you to be allowed that.'
30730: 'Ange@r@v11/42001588."But...@k@v11/42001589.......now, those unhappy days...are over.@k@v11/42001590. ......So,@v11/42001591. ......let''s return your witches'' alliance...@v11/42001592..........back to the original, gentle Mariage Sorciere."'
30731: '@rThe grimoire was in my hands without me realizing it.'
30732: '@r......The strong winds were rapidly blowing its pages one after another......'
30733: '@rIt had been a kind world at first.'
30734: '@rWhat to do to create magic so that candy rains from the sky.'
30735: '@rWhat to do to create magic so that tomorrow''s dinner becomes cream croquettes.'
30736: '@rWhat to do to create magic so that tomorrow''s weather is good when you go out, and you have a fun day.'
30737: '@rNew magics of happiness were created one after another, coloring her world with kindness...'
30738: '@rThose days were flipped through one after another,@k .........and the days and months began to flash by like memories...'
30739: '@rThe pages with drawings that were colorful...@kgradually changed into pages colored only with black ink......'
30740: '@r......Eerie magic circles, and demon summonings.@k@rEvil magic for harming people.'
30741: '@rWhat to do to create magic so that the class bully catches a cold.'
30742: '@rWhat to do to create magic so that you-know-who in class gets seriously injured and dies.'
30743: '@rWhat to do to create magic so that a bus with all the bullies on it falls off a cliff.'
30744: '@rMalicious magics were created one after another,@w500. ......filling the pages and her heart...'
30745: 'Ange@r@v11/42001593."It was because I hurt you, Onee-chan...@k@v11/42001594.that Mariage Sorciere ended up like this.@k@|@y@v11/42001595. .........You aren''t a black, evil witch.@k@v11/42001596. ......You were a white, ......pure, innocent,@v11/42001597. ......kind witch......"'
30746: 'Ange@r@v11/42001598."......I''ll...return you to how you were.@k@v11/42001599. Originally, when you were scattering magic to make people happy across the entire world.@v11/42001600. ......I''ll turn you back into that Maria onee-chan."'
30747: 'Ange@r@v11/42001601."......That is the reason I came here.@k@v11/42001602. I was guided by fate.@k@v11/42001603. ............Onee-chan, can you hear me......?@k @v11/42001604.Show yourself.........before me.........!!"'
30748: '@rThat voice rode an even stronger wind, and was sent twelve years into the past......'
30749: '@rThen,@w333. ......the wind gradually ceased,@w333. .........and silence fell......'
30750: '@rCrunch, crunch.@k ......I could hear the sound of gravel being stepped on.'
30751: '@rI heard those footsteps, and was surprised at that miracle.@k@r......Without a doubt, those footsteps were Maria onee-chan''s.'
30752: 'Ange@r@v11/42001605."............Ma-......Maria onee-chan........."'
30753: 'Kasumi@r@v22/44300054."Kasumi.@k@v22/44300055. ......Looks like I finally found you, eh, Ange-chan.........?"'
30754: 'Ange@r@v11/42001606."........................"'
30755: '@r......Before I knew it, Aunt Kasumi and her black-suits, a total of seven people who didn''t resemble Maria onee-chan in the slightest,@k were standing there, surrounding me.'
30756: '@rAnd it felt like my voice had been just about to reach Maria onee-chan, too......'
30757: '@r...Because of these guys'' toxin, .........the magic got interrupted...'
30758: '@rAnge clicked her tongue at that, but Kasumi probably didn''t hear it that way.'
30759: 'Kasumi@r@v22/44300056."............Oh?@k@v22/44300057. Are those flowers for your deceased family?@k @|@y@v22/44300058.......How admirable.@k@v22/44300059. You''re going to throw them, right?@k @v22/44300060.That''s alright, we''ll wait that long."'
30760: '@r......Before what.@k@r...Ange could more or less guess.'
30761: '@rThe way the black-suits had their hands unnaturally stuck into their pockets made me realize that they were obviously in possession of handguns.'
30762: '@r.........This is a deserted island.@k@rThere could be no more convenient place to dispose of someone.'
30763: '@rI have absolutely no interest in the family matters of the Sumadera family.'
30764: '@r...But if I die, all of that wealth will roll right into the Sumadera family coffers.'
30765: '@rUnlike me, they probably have a great deal of interest in it.'
30766: '@rOf course, the Ushiromiya Group has a stake in this, too - it seems that if the massive amounts of stock I own suddenly go to the Sumaderas,@k it''ll be pretty bad for the Ushiromiya Group as well,@k and so they''ve apparently gotten themselves embroiled in a secret feud over me.'
30767: '@r......That''s probably why President Okonogi gave me Amakusa as a guard.'
30768: '@r............Having Amakusa wait on the boat was a regretful mistake...'
30769: 'Ange@r@v11/42001607."How long have you been waiting here in ambush......?"'
30770: 'Kasumi@r@v22/44300060_1."Since early morning.@k@v22/44300060_2. And I was getting thoroughly tired of waiting for you.@k@v22/44300060_3. There are no cafes or powder rooms here, you see."'
30771: 'Ange@r@v11/42001608."No toilets either, so I guess you had to elegantly drop a load behind a tree.@k@|@y@v11/42001609. .........ack - "'
30772: 'Kasumi@r@v22/44300061."One who, in spite of herself, is a lady with half Sumadera blood flowing through her veins will not use such filthy words.@k@v22/44300062. .........You really are Sumadera Kyrie''s child, aren''t you?@k @v22/44300063.Not a trace of grace."'
30773: '@rShe grabbed me by the hair and forced my face up to hers.@k@rAnd then spat in it.'
30774: '@r......My words are filthy, but her spit''s not to be outdone.'
30775: 'Ange@r@v11/42001610.".........Every time you talk about me, it''s always with reference to Mom.@k@v11/42001611. ...Am I really that much like my mother?"'
30776: 'Kasumi@r@v22/44300064."Yes, you are.@k@|@y@v22/44300065. ...............That impertinent gaze.@k@v22/44300066. Your mouth and nose are the same too."'
30777: 'Kasumi@r@v22/44300067."......Unrestrained and irresponsible.@k@v22/44300068. ......She thought nothing of the long history and tradition of the Sumadera family, and selfishly flew out of the house.@k@v22/44300069. My entire life has been wiping up the messes she left behind...!"'
30778: 'Ange@r@v11/42001612."I guess that makes your life one giant pile of shit."'
30779: '@rI was slapped on the cheek, my ear took a heavy hit, and for an instant, my head rang...'
30780: '@r.........She pulled me around by the hair, and threw me onto the ground.'
30781: '@rAnd without a moment''s pause, she kicked the ground, covering me in sand.'
30782: 'Kasumi@r@v22/44300070."Yes, you truly have become so very like Nee-san.@k@v22/44300071. That gaze!@k @v22/44300072.That gaze like you''re somehow making fun of me.@k@v22/44300073. Yes, it''s all coming back, all of it!"'
30783: 'Ange@r@v11/42001613.".........You are pitiful.@k@v11/42001614. I imagine that since you were young, you were always compared against Mom and looked down upon.@k@|@y@v11/42001615. ......And for the entire rest of your life, you''ll never be released from that misery."'
30784: 'Kasumi@r@v22/44300074."A little brat like you couldn''t possibly understand.@k@v22/44300075. ......Your mother, you see, is a loser who threw away everything and ran away from the Sumadera family.@k @|@y@v22/44300076.Do you know how much...@v22/44300077.how much trouble I went through because of that loser?!!"'
30785: 'Ange@r@v11/42001616."Any trouble you went through has nothing to do with me.@k@v11/42001617. Can''t really do anything about what happened before I was born."'
30786: 'Ange@r@v11/42001618.".........When is your life going to begin?@k @v11/42001619.......It''s never going to happen.@k@v11/42001620. You will continue to be sneered at by my dead mother, for ever and ever for all eternity until you die.@k@v11/42001621. ......In fact, why don''t you die?@k @v11/42001622.Why are you alive?"'
30787: 'Kasumi@r@v22/44300078."You little insolent pissant...!!@k @v22/44300079.Men...!@k @v22/44300080.Make her some tea."'
30788: '@r@v99/MafMA4012."Heheheh...@k@v99/MafMA4013. Leave it to us..."'
30789: '@r@v99/MafMB4010."You big-mouthed shitty brat.@k@v99/MafMB4011. Let us teach you a little lesson."'
30790: '@rThe black-suits dashed up to me, violently grabbed me by the collar, and dragged me down.'
30791: 'Kasumi@r@v22/44300081."Do as you like until I finish this smoke.@k@v22/44300082. Teach my darling niece a little of her place."'
30792: '@rSumadera Kasumi.@k She was a pitiable person, to think of it.'
30793: '@rTo the outside world, the women of the Sumadera family were trained to be in a position to support and defer to the men in the prominent positions.'
30794: '@r......But in actuality, strong leadership was demanded of them so that they could manage all of the people under them.'
30795: '@rThe role demanded of them was that of a female commander.'
30796: '@rTaking charge of the Sumadera family with all its proud history required an extraordinary level of commanding presence.'
30797: '@rIt was an unimaginably heavy responsibility.'
30798: '@rNormally, this would have been demanded of Kyrie.'
30799: '@rKyrie had undergone that harsh training.@k@rAnd Kasumi, as the younger sister, should have been able to just take it easy.'
30800: '@rNo, in fact, she had lived like a lazy, selfish, and affluent princess, sneering at Kyrie, who had been given the heavy responsibility.'
30801: '@r......However,@k Kyrie was suddenly disinherited.'
30802: '@rShe had refused the fiance her parents had arranged, and had gotten pregnant by her lover, Ushiromiya Rudolf.'
30803: '@rFrom the Sumadera family''s perspective, even though the Ushiromiya family held a vast fortune, it was a family which had already collapsed, a family not in their league.'
30804: '@rAnd to become not even a legal wife, but a lover to the second son of that family...'
30805: '@rNormally, no one would be shown mercy for something so dishonorable, not even a daughter of the main family.'
30806: '@rThey would wrap her up in a mat, stand a pole on end,@k and throw her either into the Pacific Ocean if the pole fell to the right or the Sea of Japan if it fell to the left.'
30807: '@r.........But Kyrie''s punishment was nothing but disinheritance, an unbelievably lenient decision.'
30808: '@rAfter that, the Sumadera family began receiving preferential treatment from a section of the Ushiromiya Group.@k ......There must have been some kind of backroom deal.'
30809: '@rIn other words, Kyrie took advantage of the Ushiromiya family''s financial support to leave the Sumadera family openly.'
30810: '@rKasumi watched it happen in shock.@k@rNo, she even disparaged her dishonorable sister as a loser.'
30811: '@r......But eventually...@k...she learned that the heavy responsibilities Kyrie had borne would be passed on to her,@k and then, for the first time, she realized that she had been outwitted......'
30812: 'Kasumi@r@v22/44300083."Because of your mother, my life was turned into a mess.@k@v22/44300084. ......No, you could even say she killed me once.@k@v22/44300085. On that day, I was killed once and cast down into a hellish life..."'
30813: 'Ange@r@v11/42001623.".........Isn''t that just what you get for thinking you can breeze through life?@k @|@y@v11/42001624.......gyack!@k @v11/42001625..........*cough*, *cough*......"'
30814: '@r@v99/MafMA4014."This girl doesn''t know when to shut up!@k @v99/MafMA4015.Oorrrrah!"'
30815: '@rThe black-suit punched me in the gut, and I doubled over.@k@rBut I was quickly grabbed by the collar and made to stand up again.'
30816: '@rAs she continued to cold-heartedly look down upon Ange, Kasumi blew out smoke......@k@rThe hard days after Kyrie left were floating through her mind.'
30817: '@rUntil then, she had been allowed to be simply a rich young lady, unrestrained and unaffected.@k@r......Only Kyrie, the older sister, had been strictly trained, and she, the younger sister, had been able to live as nothing more than a princess.'
30818: '@rThen, suddenly, everything was turned over to such a degree that her life tumbled and crashed......'
30819: 'Kasumi@r@v22/44300086."My life, lifestyle, way of living, ......everything was stolen from me.@k@v22/44300087. .........Do you know how much I was maligned based on my sister''s dishonor by those relatives who didn''t know the details...?@k@v22/44300088. ......I detested her.@k@v22/44300089. I detested your mother enough to make me spit blood..."'
30820: 'Ange@r@v11/42001626."Glad to hear it.@k@v11/42001627. I hope it continues for many years to come.@k@|@y@v11/42001628. .........gagghh!!"@|@y'
30821: '@rA kick landed in Ange''s side as she lay prostrate on the ground.@k@rAnge didn''t stand up again.'
30822: '@r......So she continued to lie there like a caterpillar, getting kicked every time she spoke up.'
30823: 'Kasumi@r@v22/44300090."......I saw Nee-san at an Ushiromiya Group party once.@k@|@y@v22/44300091. ......She was with her husband,@v22/44300092. .........looking very happy,@v22/44300093. ......and laughing.@k@v22/44300094. ......She...@v22/44300095....pushed everything onto me,@v22/44300096. ......and found happiness...@v22/44300097.......only for herself........."'
30824: 'Ange@r@v11/42001629.".........So what?@k @v11/42001630.How is taking it out on me going to make you happy?@k @v11/42001631.Is taking it out on me going to turn back time and change history for you or something?"'
30825: 'Ange@r@v11/42001632.".........Ugugggh,@v11/42001633. .........gah,@v11/42001634. .........*cough*......!!"@|@y'
30826: 'Kasumi@r@v22/44300098."You said something a short while ago...@k@v22/44300099. When is my life going to begin?@k@v22/44300100. .........No matter how much I despise you or take it out on you, I cannot turn back time.@k@v22/44300101. ......So am I doomed to keep on hating Nee-san like this for the rest of my life, even though she''s dead?"'
30827: 'Kasumi@r@v22/44300102."Not if I can help it.@k@v22/44300103. ......How long must I be tormented by Nee-san''s ghost?@k@v22/44300104. And so I thought.@k@v22/44300105. .........If I could pull this off, I would be able to forget all of my hatred and start over."'
30828: '@rAnge was about to respond to this with another bitter comment, but stopped.@k@r...Because she would be kicked again if she responded.'
30829: '@r......Even if Kasumi didn''t say any more, it wasn''t difficult to imagine what she meant.@k@rKasumi was thinking of bringing an end to her hatred of Kyrie by taking revenge against her daughter, Ange.'
30830: '@r.........Talk about pushing your problems on other people.'
30831: 'Kasumi@r@v22/44300106."Come on, stand up.@k@v22/44300107. If you like this island that much, I''ll bury you here deep.@k@|@y@v22/44300108. .........You don''t want to die at your age, right?@k @v22/44300109.Don''t you want to say "Sorry my mother caused you so much trouble", or something?"'
30832: 'Ange@r@v11/42001635.".........You...@v11/42001636....wish.@k@|@y@v11/42001637. .........gkkhhh,@v11/42001638. .........glk, ......!!"'
30833: 'Sakutarou@r@v33/44200521.''Uryuu!!@k @v33/44200522.Ange, Angeeeeee...!!'''
30834: 'Mammon@r@v42/42700355."Ange-sama, no...!@k @v42/42700356.You mustn''t provoke these guys...!!@k @|@y@v42/42700357.You should at least make it seem like you''re going along with them, so you can buy some time...!"'
30835: 'Ange@r@v11/42001639.".........They do say...@v11/42001640.that you should throw your foolish pride...@v11/42001641.out with the garbage......"'
30836: 'Sakutarou@r@v33/44200523.''Wh-what about Amakusa-san...?!@k @v33/44200524.If Amakusa-san comes, I just know he''ll......!'''
30837: 'Mammon@r@v42/42700358."......No, it''s no good, I can''t see him...@k@|@y@v42/42700359. ......You idiot, Ange-sama...!@k @v42/42700360.Why did you come without Amakusa...!"'
30838: '@rI don''t need you to tell me that, Mammon.@k@r......I''m already right in the middle of regretting it.'
30839: '@rI walked a long way to get here.@k The forest was very thick.@k@r......There''s no way that the disturbance here will reach the boat......'
30840: '@rAs Kasumi took her sweet time smoking that single cigarette down to the filter,@k I was continuously laid into by the black-suits however they deemed fit.'
30841: '@rThe moment I grabbed my head to protect it, the top of my head was kicked by someone at a bad angle, and my head filled with stars......@kThis feeling of stars flickering in a world twisted with gray...@k...was one I knew well.'
30842: '@rMy life was very similar to the one Sumadera Kasumi led.'
30843: '@r...Because I was tormented constantly with all kinds of bullying under the guise of education and training, to make me a worthy "successor to the Ushiromiya family".'
30844: '@rYes.@k Having the inside of my head filled with stars like this...is a feeling I know well.'
30845: '@rWhen being reprimanded for some error in manners I seemed to have made,@k the lecture always turned to whether I was fitting to be the successor to the Ushiromiya family or not.'
30846: '@r......On and on about the honor of the Ushiromiya family, and how important it was.'
30847: '@r......By the time her rant reached that point,@k I would forget what mistake I was being blamed for in the first place.'
30848: '@rNo, actually, it was the same way for Aunt Eva too.'
30849: '@rAfter all, sometimes she would ask herself "Umm, what was I saying again?"'
30850: '@r...But in the end, she wouldn''t be able to remember, and would say something like:'
30851: 'Eva@r@v05/41000112."The fact that I''m angry must mean that you did something wrong.@k@v05/41000113. So whatever wrong thing you did is the problem, and it isn''t important that I can''t remember what it was any more."'
30852: '@r...There''d be some ridiculous reasoning like that, and then she would continue punishing me.'
30853: '@rYes.@k Aunt Eva''s punishments weren''t something that would continue until I learned something, or acknowledged my mistake, or apologized.'
30854: '@r.........They would continue until Aunt Eva wanted to stop.@k@rSo even this violence was a bit nostalgic, in a way that made me want to vomit.'
30855: '@r......I opened my eyes, ......and oh look, there''s Aunt Eva.'
30856: '@rRight next to Kasumi, who was smoking her cigarette,@k I could see Aunt Eva, the two of them looking almost as though they were laughing at me together.'
30857: '@rWhen I think about it, even Aunt Eva''s life might be worthy of sympathy.'
30858: '@r......The responsibilities and pressures of members of the Ushiromiya family, which she had so often mentioned to me,@k were all things that she herself had suffered.'
30859: '@rBecause people cannot voice insults that they have never been subjected to themselves......'
30860: '@rIt was probably the same way for Aunt Rosa as well.@k@r......As the youngest child of the glorious Ushiromiya family, she must have gone through many tough times.'
30861: '@rSo, just as Aunt Eva acted towards me...@k@rAnd just as Sumadera Kasumi is acting right now...@k@r......Aunt Rosa must also...have been the same.'
30862: '@rPeople push the suffering they have been made to bear onto other people.@k@rOtherwise, they can never escape from it.'
30863: '@r......So on and on, in eternity and perpetuity, the chain of suffering and sadness never ends.'
30864: '@rThat is the reason............Maria onee-chan''s magic was...@k...so incredible.'
30865: '@rWith her magic, ......she did not have to bear the suffering from Aunt Rosa.'
30866: '@rThat pain was probably pushed onto her.@k@rIts weight probably tormented her.'
30867: '@r......But Onee-chan did not carry that burden on her own shoulders.'
30868: '@r.........She exorcised it...and filled her world with happiness.'
30869: '@rSo, I''m sure...@k...that even if Maria onee-chan had had children in the future...'
30870: '@r...she would never have pushed the suffering forced down through the generations onto them.'
30871: '@r......The chain of suffering and sadness,@k which had been inherited by and forced upon each generation for who knows how long,@k .........was, by Maria onee-chan''s magic, broken.'
30872: 'Eva@r@v05/41000114."............What is it?@k @v05/41000115.Do you have something to complain to me about?"'
30873: '@rIn the past, I would have snapped back.@k@r......And cancelled out her hatred with hatred of my own.'
30874: '@r...No, I cancelled out nothing.@k The weight of that which had been forced onto her bears down hard on my shoulders as well.'
30875: '@rAfter all, even now, ......I hate her.'
30876: '@rSo,@w500. ............now that I knew of magic,@k ......I looked at the human called Ushiromiya Eva again.'
30877: '@r.........What I could see through to...@k...was the sad form of a human, no different from me, who had lost her family and who bore deep wounds in her heart.'
30878: '@rUnable to withstand the pain of that torn heart,@k she was doing nothing except howling with a sad voice - like a lion crying in pain - like a child.'
30879: '@r......It turns out...Ushiromiya Eva was also a person deserving of compassion.'
30880: '@rShe had needed someone to understand the difficulties and pain of her childhood days,@k .........and she, too, as the only survivor of the Rokkenjima incident,@k who was faced with the inquisitive eyes of all of society, who was publicly slandered, who had salt continually rubbed into her wounds,@k ......had needed someone''s compassion.'
30881: '@rIn order to let her forget her pain and sorrow for least a moment,@k ............the black witch, the very same that possessed Aunt Rosa, ......taught her magic.'
30882: '@rIt was the same magic of anger and sadness that BEATRICE had taught Maria onee-chan,@k when she was mourning for Sakutarou after he was torn apart.'
30883: '@r......That same magic, that witch, had surely dwelled inside Aunt Rosa too.'
30884: '@r............So I was wrong to hate Ushiromiya Eva.'
30885: '@r...Perhaps...@k......I alone was supposed to have become her ally,@k the only person in the world who could understand her.'
30886: '@r......What did I say to her when I was young, when she returned alive all alone...?'
30887: '@rCould it be...@w500.......that the way I acted towards her was...@k......as if she had come back by herself after killing all my family......?'
30888: '@r...........................@k ......I can''t believe it.'
30889: '@r...Aunt Eva, who throughout my life has never been more than an object of and synonym for hatred,@k .........is turning into a...human who I can understand......'
30890: '@rAnd so.@k .........I looked right next to Aunt Eva, ......at the form of the black witch who taught her the black magic......'
30891: '@rAunt Eva...was crying.'
30892: '@rIt was only natural.'
30893: '@r.........Not only did she have no one who would understand her pain of having lost her husband and son all at once,@k ......but even I, her only relative, insulted her, ......saying "Give me back my mom and dad".'
30894: '@r.........I can make the excuse that it was the mercilessness of youth.'
30895: '@r...But......to her at the time,@k that was probably cruel enough to sever her heart''s last thread.'
30896: '@r..................In the following days, the talk shows and magazines publicly slandered her.'
30897: '@rThe truths of her late husband''s business and character, and even those about her beloved son, were denied.'
30898: '@rShe no longer had anything left.'
30899: '@rShe could do nothing but cry and howl, ......trying to forget the pain and sadness for just a few moments.'
30900: '@rBecause only while howling could she feel the slightest bit of release.'
30901: '@rAnd so, .........the black witch taught her how to howl.'
30902: '@rThe one I hated...was the black witch.@k The black magic probably did release her from that suffering for just a short time.'
30903: '@r......However,@k it would never lift that weight from her shoulders.'
30904: '@rTo the contrary, it would force that weight on further victims,@k .........filling the world with the weight of hatred.'
30905: '@r...............If Aunt Eva was to have a true witch nearby, one who knew of white magic...'
30906: '@r......wasn''t that...@k.........supposed to be...@w333....me.........?'
30907: '@rI had learned the magic to create happiness from Maria onee-chan.'
30908: '@r.........If I could have saved her......with that magic,@k ...............might we not have...@w500.......built up a future with a completely different relationship?'
30909: '@rAll this time,@w583. .........I have hated Aunt Eva.@k@r...So I never noticed the black witch beside her.'
30910: '@r......Without love, it couldn''t be ''seen''.@k@rI didn''t have...@k...any love for her......'
30911: '@rSo now, finally...@k.........I''ll glare at the black witch,@w500. ......the one I truly should hate.'
30912: 'EVA@r@v34/43300001."......Oh?@k@v34/43300002. .........What''s thiiis?@k@v34/43300003. You can ''see'' me?@k @v34/43300004.Ehheheheheh...!"'
30913: 'Ange@r@v11/42001643."..................Yes, I can.@k@|@y@v11/42001644. ......The one I should''ve hated wasn''t Aunt Eva.@k@v11/42001645. ......It was you."'
30914: 'EVA@r@v34/43300005."Hey, you''re pretty good.@k@v34/43300006. To think that a lowly Human could ''see'' a witch like me.@k@|@y@v34/43300007. ......And so?@k @v34/43300008.Are you trying to say something with that glare?@k @v34/43300009.Do you hate me?"'
30915: 'Ange@r@v11/42001646."...............Hate?@k @v11/42001647.......Yes, I do.@k@|@y@v11/42001648. ......But...that''s not quite it.@k@v11/42001649. ......I just...find you a little sad."'
30916: 'EVA@r@v34/43300010."Sad?@k@|@y @v34/43300011.......*giggle*giggle*, ahhahahahahaha!@k @v34/43300012.What''re you saying, come on, you can get mad!@k @v34/43300013.Why don''t you just hate me with all your strength forever?!"'
30917: 'Ange@r@v11/42001650."......I won''t hate.@k@v11/42001651. ......Hating you...@v11/42001652.......means I''m doing nothing more than inheriting Aunt Eva''s hatred.@k@|@y@v11/42001653. ......I''ll break the hatred.@k@v11/42001654. ......I''ll accept Aunt Eva''s suffering, .........exorcise it, and throw it away."'
30918: 'EVA@r@v34/43300014."Ahhahahahahahahaha!!@k @v34/43300015.What kind of epiphany do you think you''ve had?@k @v34/43300016.Is your head alright?@k @v34/43300017.I mean, why don''t you just give up and die foreveeeer?!"'
30919: 'EVA@r@v34/43300018."Kyaahhahhahahahahahaha!@k @v34/43300019.You guys, kick her more and more, okay?@k @v34/43300020.Not her face, though.@k@v34/43300021. It wouldn''t do any good kicking her pitiful face only to make it better!"'
30920: 'Ange@r@v11/42001655."Guhhkk!@|@y@k @v11/42001656..........*cough*!!@k @v11/42001657................g''......"'
30921: '@rThe black-suits persistently kicked my stomach and back.@k@r......As though they had been ordered to by the black witch.'
30922: 'Kasumi@r@v22/44300110."......Dear me, still nothing to you, is it......?@k @v22/44300111.............You keep staring right at me.@k@|@y@v22/44300112. You hate me?@k @v22/44300113.I''ll bet you do.@k@v22/44300114. I hate you too.@k@v22/44300115. *snicker*snicker*snicker*......"'
30923: '@rKasumi sneered at me.@k ......But for some reason, I had the feeling that she was crying behind that expression.'
30924: '@rShe''s had a life just as unfair as mine forced upon her, and the pain of that never, ever heals.'
30925: '@r......The sad lion continues to howl, gasping in pain from the thorn he can''t get out...'
30926: 'EVA@r@v34/43300022."Hey, Sumadera Kasumi, take a look.@k @v34/43300023.That over there is what you used to be."'
30927: 'EVA@r@v34/43300024."......Doesn''t that make you feel so much better?@k @v34/43300025.You used to be standing there, but now you''re on this side, you know that?@k @|@y@v34/43300026.Eheheheh, isn''t it delightful?@k @v34/43300027.Now the shoe is on the other foot!"'
30928: 'Kasumi@r@v22/44300116."...............Yes, it truly does feel...@v22/44300117.......delightful.........@k@v22/44300118. Ahhahahahaha, how can you make that kind of face, Ange...?!@k @v22/44300119.Go on and cry, you want to, right?!"'
30929: 'EVA@r@v34/43300028."Kyahhahahahahahaha!!@k @v34/43300029.Yes, yes, of course she wants to cry!@k @v34/43300030.Go on, make her cry."'
30930: 'EVA@r@v34/43300031."You were made to cry back then, weren''t you?@k@v34/43300032. So make her cry too.@k@|@y@v34/43300033. *giggle*, and Ange, it''s alright, okay?@k @v34/43300034.Why not cry foreveeeeeeeer?!@k @v34/43300035.Kyaaaha-hah-hah-hah-hah-hah!!"'
30931: 'Kasumi@r@v22/44300120."...Aha, ...ahahahahahahaha!!@k @v22/44300121.Cry, Angeee!@k @v22/44300122.I want to see your crying face!@k @v22/44300123.Cry, and try saying "I''m sorry, Aunt Kasumi"...!!"'
30932: 'EVA@r@v34/43300036."Yes, make her say those words.@k@v34/43300037. ......Those words hurt, right?@k @v34/43300038.Being made to apologize for something that isn''t your fault......hurt a lot, didn''t it......?"'
30933: 'EVA@r@v34/43300039."Make her go through the same thing...@k@v34/43300040. By doing that, you can relieve your pain."'
30934: 'EVA@r@v34/43300041."......Ehheheheh, yes, that''s the way.@k@v34/43300042. Be more honest with yourself.@k @v34/43300043.Why not spit out your emotions more and more and more foreveeeeeeeer?!"'
30935: '@r......The black witch stirred Kasumi up.@k@rAnd Kasumi began to give herself over to that dark emotion.'
30936: '@r......She was doing nothing more than turning her deep sadness into cheap booze and forcing it down,@k trying to forget for just a brief moment.'
30937: '@rThe words Kasumi insulted me with...@w583.......were themselves...@w416....sad.'
30938: '@rAnd...I couldn''t forgive the black witch for taking advantage of Kasumi''s sadness.........'
30939: '@r.........I had gone limp on the ground, which seemed to have sapped the black-suits of their enthusiasm for kicking.'
30940: '@r...Or maybe the kickers had finally gotten tired too.'
30941: '@rKasumi hadn''t ordered them to stop, but at some point, the violence had halted.'
30942: '@rHowever, I was reflected in Kasumi''s eyes, and they were burning me with flames of hatred.'
30943: '@r......She had been tempted by the witch into doing that in order to relieve her own pain.'
30944: 'EVA@r@v34/43300044.".........Sumadera Kasumi.@k@v34/43300045. You aren''t done.@k@v34/43300046. You''ve got much more trampling to do.@k @v34/43300047.Can you forgive what happened to your entire life with just this little bit of violence?"'
