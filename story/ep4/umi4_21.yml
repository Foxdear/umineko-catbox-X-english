32565: '@rScattered over the big bed were cute jellybeans of various colors,@k and chocolate coins.'
32566: '@rA fork was stuck into the shortcake peeking out of a gift box,@k and there were decanters with drinks of various colors lined up on the side table.'
32567: '@rBut the venomous color of the drink poured into the glass matched none of the decanters.'
32568: '@rSomeone had probably been playing around, mixing them together.'
32569: '@rThe taste aside, that was a lot of fun to do.'
32570: '@rOn top of the fluffy bed were several colorful, big pillows stuffed with dreams.'
32571: '@rAnd on this big bed that looked like something out of a child''s dream world,@k BERNKASTEL lay face down,@k and LAMBDADELTA lay face up, hugging a pillow and relaxing......'
32572: 'LAMBDADELTA@r@v29/92200224."Ahahhahahhahhah, this one was a real rush, wasn''t it?@k@v29/92200225. I got re~ally anxious when Beato said she''d stop the game."'
32573: 'BERNKASTEL@r@v28/92100259.".....................What a rude witch, to start a game of this scale and try to end it by throwing it away."'
32574: 'LAMBDADELTA@r@v29/92200226."Wasn''t Ange a good piece?@k@v29/92200227. After Beato ran for it, Ange dragged her back and made her resume the game.@k@v29/92200228. It''s too bad that she gave Battler a bit too much enthusiasm, though."'
32575: 'BERNKASTEL@r@v28/92100260."..................Because she knew Battler is weak against emotions."'
32576: 'LAMBDADELTA@r@v29/92200229."No kidding.@k@v29/92200230. He looked like he might even go easy on his enemy Beato."'
32577: 'BERNKASTEL@r@v28/92100261."............Based on the previous game, I was uneasy that he might start to feel compassion for Beato, and take the game in an odd direction.@k@v28/92100262. .........Ange was a trump card to get Battler back on track if and when he mistook his goal."'
32578: 'BERNKASTEL@r@v28/92100263.".........In truth, I wanted to have her support him a bit more before playing her out.@k@v28/92100264. She really did play and discard herself straight away.@k@v28/92100265. What a waste for a piece that required so much preparation."'
32579: 'LAMBDADELTA@r@v29/92200231."Ehheheheh!@k @v29/92200232.I''m so~ glad I shackled her with the rule about not giving her name!@k @v29/92200233.If I hadn''t set that up, the brother-sister tag team would have swallowed Beato up and won in the blink of an eye."'
32580: 'BERNKASTEL@r@v28/92100266."............I thought it was my chance to apply a lot of pressure at once,@k@v28/92100267. but you were watching her so closely that I couldn''t make the best use of her.@k@v28/92100268. ......Aaah, what a waste that piece was."'
32581: 'LAMBDADELTA@r@v29/92200234."Well, yeah? That piece was super OP, I needed her out of there, like, yesterday.@k@v29/92200235. Well, in the end, she did a good job of preventing the game from being suspended, I guess, and that helps me out too.@k@v29/92200236. Her actions ended up matching both of our interests, so in that sense, she really was a wonderful piece."'
32582: 'BERNKASTEL@r@v28/92100269."..................She was an innocent kid like Battler, so it was easy to get her to do as I said.@k@v28/92100270. .........An idiot or an impulsive type, one of those two is always best for a piece.@k@v28/92100271. ......Aaah, that piece really could have been so much more."'
32583: 'LAMBDADELTA@r@v29/92200237."And now she''s mincemeat!@k @v29/92200238.Hey, let''s make hamburgers out of that later on☆@k @v29/92200239. Oh wait, didn''t you like gyoza more?@k @v29/92200240.I wonder what little sister tastes like, *giggle*, so funny!"'
32584: 'BERNKASTEL@r@v28/92100272."..................Is it really alright for you to be so relaxed?@k @v28/92100273.Battler got fired up thanks to Ange.@k@v28/92100274. He started going after Beato like a madman, and now, the game has taken a big turn to my advantage, I''d say...?@k @v28/92100275.In fact, didn''t Battler just solve almost all of the mysteries so far?"'
32585: 'LAMBDADELTA@r@v29/92200241."Huuh?@k @|@y@v29/92200242.Not even clo~se!@k @v29/92200243.Almost all of Battler''s blue truth is wrong!@k @v29/92200244.Beato''s wishy-washy red is full of holes.@k@v29/92200245. Anyone with half a brain could slip through it easily just by rattling off some random BS."'
32586: 'LAMBDADELTA@r@v29/92200246."......Ahhh, that really ticked me off.@k@v29/92200247. If that had been me, I''d have made sure to cut down every one of those things with the red."'
32587: 'BERNKASTEL@r@v28/92100276."............Oh, really?@k @v28/92100277.I was under the impression that those were all the correct answers.@k@v28/92100278. ......Well, of course, I did have my suspicions about all that stuff to do with swallowing small bombs."'
32588: 'LAMBDADELTA@r@v29/92200248."And Battler''s blue truths, not all of them were even valid.@k@v29/92200249. ......Beato stated clearly that, within the first game, she @v29/92200250.@|@y@c900.@[guarantees the identities of all unidentified corpses@]@c.!@k @v29/92200251.That breaks Battler''s reasoning about the culprit of the Eva/Hideyoshi locked-room murder being someone who used a fake corpse."'
32589: 'LAMBDADELTA@r@v29/92200252."Next, he said that Kanon''s death in the boiler room was probably an accident, but...*giggle*!@k @v29/92200253.What kind of accident could end up with him driving a stake into his own chest?@k @|@y@v29/92200254.How dumb is that?@k @v29/92200255.I''ll slice it with that red treasured sword or whatever."'
32590: 'LAMBDADELTA@r@v29/92200256.@|@y"@c900.@[Kanon did not die in an accident!@]@c.@k @v29/92200257.For the next one, the murders of the three including Genji in the parlor, the thought that it was a simultaneous murder where they shot each other in a clockwise pattern at the same time is laughable.@k@v29/92200258.@|@y@c900.@[Genji, Kumasawa, and Nanjo were not killers!@]@c."'
32591: 'LAMBDADELTA@r@v29/92200259."The final trap X for Natsuhi''s murder is really dumb, too.@k@v29/92200260.@|@y@c900.@[The thing that shot Natsuhi wasn''t a trap, it was a real shooting murder with a gun raised and trigger pulled!@]@c.@k @v29/92200261.*giggle*, my condolences...!"'
32592: 'BERNKASTEL@r@v28/92100279."......Stop that.@k@v28/92100280. You mustn''t say something like that in red.@k@v28/92100281. That kid''s trying to make it so that she killed Natsuhi by bouncing Natsuhi''s bullet back at her with magic."'
32593: 'LAMBDADELTA@r@v29/92200262."Oh-hoh-hoh-ho, oopsie, you''re right, I forgot...!@k @v29/92200263.Even his blue truths for the second game were too naive."'
32594: 'LAMBDADELTA@r@v29/92200264."@|@y@c900.@[When the six were murdered in the chapel, the culprit was inside the chapel!@]@c.@k @v29/92200265.That guy tries to explain every little thing with trap X.@k@v29/92200266. What the heck is trap X, some weird mystery novel cliche?"'
32595: 'LAMBDADELTA@r@v29/92200267."And in the incident where Nanjo and Kumasawa were killed in the servant room, it''s ludicrous to say that someone inherited Kanon''s name.@k@v29/92200268.@|@y@c900.@[The only one who can go by the name of Kanon is the person himself!@]@c.@k @v29/92200269.@|@y@c900.@[No other human can adopt that name!@]@c."'
32596: 'LAMBDADELTA@r@v29/92200270."And that theory about borrowing the master key from Rosa for Natsuhi''s room is also worthless!"'
32597: 'LAMBDADELTA@r@v29/92200271.@|@y"@c900.@[After the master keys came into Rosa''s control, never did any of them leave her hands!@]@c.@k @v29/92200272.@|@y@c900.@[Except for the time when she lent one to Battler to unlock Natsuhi''s room.@]@c.@k@v29/92200273. I could go on, but this is enough just for a quick look, I guess?"'
32598: 'BERNKASTEL@r@v28/92100281_1."............A quick look? You''ve just denied Battler''s blue truth for the first and second games across the board.@k@v28/92100281_2. .........My, my, what a thing.@k@v28/92100281_3. Battler would faint if he heard that."'
32599: 'LAMBDADELTA@r@v29/92200277."......See?@k @v29/92200278.Beato wasn''t cornered at all.@k@v29/92200279. .........I always thought she was a pretty good actress."'
32600: 'LAMBDADELTA@r@v29/92200280."I''m sure the plan is to make it look like she got cornered this game,@k@v29/92200281. and then sometime next game, swish!, she''ll slice it in half with a single red stroke and make Battler''s eyes pop out.'
32601: 'LAMBDADELTA@r@v29/92200282."*giggle*, and then I''m sure she''ll say it with a huge grin on her face.@k@v29/92200283. "A witch is never in trouble~"!@k @v29/92200284.Pff, *giggle*giggle*giggle*!!"'
32602: 'BERNKASTEL@r@v28/92100282."...............Then that whole tragic feeling as though Beato was getting cornered was all an act?"'
32603: 'LAMBDADELTA@r@v29/92200285."Obviously?!@k @v29/92200286.She really is a great actress!@k @v29/92200287.Even though she wasn''t cornered at all, it felt like a last-episode climax to put everyone else to shame!"'
32604: 'LAMBDADELTA@r@v29/92200288."She''s totally the winner for best supporting actress this year!!@k @v29/92200289.Oh, but of course I''m the sta~r!@k @v29/92200290.Or it could be you, Be~rn!"'
32605: 'BERNKASTEL@r@v28/92100283."............At the end, she said things like "kill me" and laid out a big riddle.@k@v28/92100284. Wasn''t that her last stand, with Beato to be finished for good if that riddle was solved?"'
32606: 'LAMBDADELTA@r@v29/92200291."*giggle*giggle*...!@k @v29/92200292.No way, you were tricked too, Bern?"'
32607: 'LAMBDADELTA@r@v29/92200293."That wasn''t even close to a last stand!@k @v29/92200294.Beato still has some hellishly brutal moves she''s keeping hidden.@k@v29/92200295. ......When she stuck out both arms to give the final riddle, did you notice how she brought her right arm back down?"'
32608: 'BERNKASTEL@r@v28/92100285."......Ah, now that you mention it.@k@v28/92100286. .........So that''s what that meant."'
32609: 'LAMBDADELTA@r@v29/92200296."Sure is!@k @v29/92200297.She still had plenty of hidden moves left!@k @v29/92200298.And none of the mysteries have been solved...!"'
32610: 'LAMBDADELTA@r@v29/92200299."That tension, as though she''d been completely seen through and it was like "Tune in next time for the final episode!"@k@v29/92200300. She truly is a genius at acting.@k@v29/92200301. Ahh, I can''t wait to see her knock Battler back down to rock bottom!"'
32611: 'LAMBDADELTA@r@v29/92200302."She''s really taken to that "North Wind and the Sun Strategy" from the last game, I think!@k @v29/92200303.I bet Battler will sympathize with Beato again and fall for it completely...!@k @v29/92200304.A woman''s single tear can trick a man, after all - now that''s value, don''t you think?!!"'
32612: 'BERNKASTEL@r@v28/92100287."...............I wonder if Battler will get caught by that move again.@k@v28/92100288. I must do my part too, and light a fire under Battler to never feel sympathy for her again.@k@v28/92100289. ......Although Ange''s mincemeat seems to have done that pretty well for the time being."'
32613: 'LAMBDADELTA@r@v29/92200305."A power-up from an Ange-flavored hamburger?@k @v29/92200306.Oh-hohohohohohoho!@k @v29/92200307.Of course, I won''t be beaten either.@k@v29/92200308. I''ll be giving Beato my full support so she can make enough of a comeback to compete with Battler."'
32614: 'LAMBDADELTA@r@v29/92200309."......She won''t lose. Beato.@k@v29/92200310. I mean, I''ve threatened her with a wonderful penalty if she does♪"'
32615: 'BERNKASTEL@r@v28/92100290."..................Your penalties are genuinely no joke, so you should go a little easy."'
32616: 'LAMBDADELTA@r@v29/92200311."I''ve decided what to do next time I get to give you a penalty, Bern.@k@v29/92200312. Wanna hear? Wanna hear?"'
32617: 'BERNKASTEL@r@v28/92100291."No."'
32618: 'LAMBDADELTA@r@v29/92200313."Come o~~n, listen☆@k @|@y@v29/92200314.Okay, here we go, here we go.@k @v29/92200315.I''ll lock you in a wonderful, wonderful castle."'
32619: 'LAMBDADELTA@r@v29/92200316."The castle will be surrounded by pure white castle walls, 12 km to a side.@k@v29/92200317. With a height of 10 m.@k@v29/92200318. No magic and no cheating allowed!@k @v29/92200319.That''s really not something you can jump over, right?"'
32620: 'BERNKASTEL@r@v28/92100292."1,440,000,000 m3?@k @|@y@v28/92100293..........You can stop there, I already know what you''re going to say."'
32621: 'LAMBDADELTA@r@v29/92200320."Eheheheheh!@k @v29/92200321.And that place will start getting buried with gems, one every day!@k @v29/92200322.And I''ll lock you in it until the castle walls are packed with them, and you''ve been buried to death with gems.@k@v29/92200323. Isn''t that a wonderful, romantic penalty?"'
32622: 'BERNKASTEL@r@v28/92100294."..................I''ll let you multiply the length of the walls by five if you make the height one-tenth its current height, and you can even shut me in it right now."'
32623: 'LAMBDADELTA@r@v29/92200324."Really?!@k @v29/92200325.That would make it 3,600,000,000 m3, you know?!@k @v29/92200326.The penalty would take more than twice as long!@k @|@y@v29/92200327.Aaahh, you''ll be my prisoner for such a long time?!@k @v29/92200328.I love you Bern, I really love yo~u♪"@|@y'
32624: '@rLAMBDADELTA playfully clung to BERNKASTEL, who yawned, looking bored, as she stroked LAMBDADELTA under the chin as though playing with a cat...'
32625: 'LAMBDADELTA@r@v29/92200329."So you''re betting on Battler to win.@k@v29/92200330. And I''m betting on the two of them getting draws forever.@k@v29/92200331. ............Isn''t anyone going to bet on Beato to win?"'
32626: 'BERNKASTEL@r@v28/92100295.".....................It won''t be me.@k@v28/92100296. Her chances of winning are zero."'
32627: 'LAMBDADELTA@r@v29/92200332."Oh-hoh-hoh-ho!@k @v29/92200333.It must hurt to be told by the Witch of Miracles that there''s zero chance of a miracle!@k @v29/92200334.I wouldn''t bet on her either, of course.@k @|@y@v29/92200335.For certain!"'
32628: 'BERNKASTEL@r@v28/92100297.".........It must hurt to be told by the Witch of Certainty that it''s certainly no good, as well."'
32629: '@rUnusually for them, they giggled together...'
32630: 'LAMBDADELTA@r@v29/92200336."I wonder what kind of conclusion this game''s gonna have...?"'
32631: 'BERNKASTEL@r@v28/92100298."...............Now that, at least, we can''t predict.@k@v28/92100299. ...That''s why it''s fun, after all."'
32632: 'LAMBDADELTA@r@v29/92200337."I won''t allow any more escaping or suspending the game.@k@v29/92200338. I''ll make them continue the game for certain, and I won''t let them run away...!@k @v29/92200339.I can''t even imagine how things are gonna unfold now,@k@v29/92200340. but I do know one way it''s certainly not going to end."'
32633: 'BERNKASTEL@r@v28/92100300."..................At the very least, we know it won''t end with Beato''s victory."'
32634: 'LAMBDADELTA@r@v29/92200341."I mean, think about it.@k@v29/92200342. Neither you nor I...@k@v29/92200343.are betting on Beato to come out the winner!@k @v29/92200344.Which means, if it looks like Beato is gonna win, she''ll be making enemies of both of us Great Witches...!"'
32635: 'BERNKASTEL@r@v28/92100301.".........Pretty much.@k@v28/92100302. Our powers are most in balance only when things are somewhere between a draw and Battler''s advantage.@k@v28/92100303. If it tips too much in Beato''s favor, both of us will align along the same vector, and drag Beato back."'
32636: 'LAMBDADELTA@r@v29/92200345."So the instant Beato finds herself on top, ......she''ll have both of us as enemies to deal with.@k@|@y@v29/92200346. .........Ehheheheheh!@k @v29/92200347.A common front with Bern, sounds fu~~n♪"'
32637: 'BERNKASTEL@r@v28/92100304.".........Thanks.@k@v28/92100305. ......But I''m not taking a konpeitou candy bath with you."'
32638: 'LAMBDADELTA@r@v29/92200348."Aaa~w, but I thought we could take a konpeitou shower together,@k@v29/92200349. while I cover you all over with melted marshmallows..."'
32639: 'BERNKASTEL@r@v28/92100306.".........That poor girl.@k@v28/92100307. She''s a living toy, a doll that you caught so that you could play with me."'
32640: 'LAMBDADELTA@r@v29/92200350."I''m good at playing with dolls.@k@v29/92200351. ......I really can play with them well, you know?@k @v29/92200352.I''m proud of being able to get hundreds of years of playtime out of a single toy without getting tired of it."'
32641: 'BERNKASTEL@r@v28/92100308."............You''re her ally at some times, and oppose her at others,@k@v28/92100309. toying with her forever.@k@v28/92100310. ......I feel sorry for her. That kid is our doll, now."'
32642: 'LAMBDADELTA@r@v29/92200353."Ehheheh, that''s right, that kid is our doll.@k@v29/92200354. No end is prepared for her except the ones the two of us wish for."'
32643: 'LAMBDADELTA@r@v29/92200355."So I can say for sure that this can only end with either an eternal draw because of me,@k@v29/92200356. or Beato being defeated and destroyed because of you.@k@v29/92200357. ............Heheh, ...as far as this game ending with Beato''s victory goes..."'
32644: 'BERNKASTEL@r@v28/92100311."...............I will proclaim it as the Witch of Miracles."'
32645: 'LAMBDADELTA@r@v29/92200358."Then I''ll proclaim it as the Witch of Certainty."'
32646: '@r@v99/awase0031.""Beato certainly cannot win.@k@v99/awase0032. And there will be absolutely no miracles.""'
32647: '@r@v99/awase0033.@e@s50.""Ahhahahahahahahahahahahaha......!!""@y'