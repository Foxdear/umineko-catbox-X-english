27552: 'BEATRICE@r@v27/40700410."Ugly.@k@v27/40700411. Aaaaaaaahh, how ugly is a woman drowning in lust...!!@k @|@y@v27/40700412.This is this woman''s true nature!!@k @v27/40700413.Even I, as a thousand-year-old witch who has explored the depths of evil, find this most difficult to watch!!"'
27553: 'BEATRICE@r@v27/40700414."Aaah, MARIA, now is the time for you and her to part ways!!@k @v27/40700415.Smash the ugly lump of meat that calls herself your mother...!!@k @v27/40700416.There is no meaning in your pure soul being bound any longer by the chains of parent and child!@k @v27/40700417.With your own hand,@k @v27/40700418.release your own soul now!!@k @v27/40700419.You have now gained the teeth and claws to protect yourself!!"'
27554: 'Maria@r@v13/40401135."Uuuuuuuuuuuuuuuuuuuu!!@k @v13/40401136.Now I''ll make you learn all the days of pain I went through...!@k @v13/40401137.I''ll get revenge for my days of suffering...!!!"'
27555: 'Rosa@r@v12/41400449."Ahhahahahahahahahaha!!@|@y@k @v12/41400450.Aren''t you the one who''s been making me suffer?!@k @v12/41400451.I''m the one who wants revenge...!!"'
27556: 'Rosa@r@v12/41400452."I should have done that before you were born!!@k @v12/41400453.I should never have given birth to you!!@k @v12/41400454.Get out of my liiiiiife, uaaaoooooooooooooaaaaaaaaaaaaaaaaaaaaahhhh!!"'
