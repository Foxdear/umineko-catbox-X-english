27640: 'BEATRICE@r@v27/40700447."That is the enlightened state that is only reached by witches who have gained the power to control life and death at will.@k@v27/40700448. ......You can kill her at any time.@k@v27/40700449. You can bring her back to life if needed.@k@v27/40700450. If she becomes a pain, then you can simply kill her once more...!"'
