27630: 'Maria@r@v13/40401173."Laugh, try and laugh, Mama...!!@k @|@y@v13/40401174.Kihhihihihihhahahahahahahahaha?!@k @v13/40401175.What''s wrong, Mama, wake up, read me a picture book, let''s go take a walk...!!@k @v13/40401176.Tell me you love me, make a promise for next Sunday, let''s go shopping, let''s go to the movies...!!@k @v13/40401177.And then of course break that promise anyway!!"'
27631: 'Maria@r@v13/40401178."Kihhihihihihihihihihihihihihi, isn''t it fun, Mama, isn''t it fun? I''m playing with you now!!@k @|@y@v13/40401179.Kihhihhahhahahahahahahahahahahahahahahahahahahahahahahahahahahahahahahahahahaha!!!"'
27632: 'BEATRICE@r@v27/40700443."That''s right, you are now playing with your mother, having fun with her...!!@k @v27/40700444.Tell me your emotions now!@k @v27/40700445.I believe they should not be of anger or sadness or pain...!"'
27633: 'Maria@r@v13/40401180."Yeah, you''re right, I can feel it, BEATRICE...!!@k @v13/40401181.I''m having so much fun now... I''m playing with Mama, so it''s tons of fun!!"'
27634: 'Maria@r@v13/40401182."And even though I''m killing Mama over and over again, I can bring her back to life with just a single bit of magic!!@k @v13/40401183.I took care of my toys because I couldn''t fix them if they broke...!!@k @v13/40401184.But if the toys could be fixed, I''d want to break them over and over again!!@k @v13/40401185.Kihhihihihihihihihihihihi!!@k @v13/40401186.Hihihihihihi, hihi........."'
27635: 'Maria@r@v13/40401187."......But, ............Sakutaro won''t be fixed.@k@v13/40401188. ...He can''t be fixed.........@k@v13/40401189. .........Because Mama, who made him,@v13/40401190. ......Mama, who gave birth to him,@v13/40401191. ......won''t accept him."'
27636: 'BEATRICE@r@v27/40700446.".............................."'
27637: 'Maria@r@v13/40401192."I''m not accepted by Mama either, am I...@k@v13/40401193. .........So the broken Maria can''t be fixed anymore either.@k@v13/40401194. .............................."'
27638: 'Maria@r@v13/40401195.".........Kihihihi.@k@|@y@v13/40401196. Kihhihihihihihihihihihihi!!@k @|@y@v13/40401197.Kyahhahahahahyahhyahhyahhyah!!@k @v13/40401198.Aaaaaaaaaaahhh, it''s fun, it''s so much fun, Mama...!!@k @v13/40401199.I''m having so much fun that somehow, I''m starting to feel like I could forgive you...!"'
