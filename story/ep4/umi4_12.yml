27326: 'Rosa@r@v12/41400279."..................Ah, ...............uug........."'
27327: '@rSilent.@k Black.@k Cold.@k Painful.'
27328: '@rRosa regained consciousness bit by bit......'
27329: '@rAnd the first thing she thought...was that it would have been better if she hadn''t.'
27330: '@rAfter all, her body was so cold and hurt so much, ......and it became worse the more her consciousness returned.'
27331: '@rIt felt like she had been sleeping in the darkness for a long time now, face-down on ice-cold marble.'
27332: '@r......Aaah, this is why I always tell myself.@k@rEven if it''s just a nap, at least get on the sofa.'
27333: '@rI always know that if I naively try and close my eyes for just a second,@k and end up sleeping on the floor or at my desk, it''ll hurt my body later and I''ll suffer for it......'
27334: '@rBecause she slept on such a cold and hard floor, she was chilled to the bone.'
27335: '@rBecause she slept on such a hard and cold floor, the side of her face that had been pressing down against it was very painful.'
27336: '@r......If she were to look in a mirror right now, she was sure she would see an embarrassing mark.'
27337: '@rShe didn''t think that just rubbing it would make that mark disappear,@k but she stroked the hurting side of her face for the time being, trying to smooth it over...'
27338: '@r......Where.........is this?'
27339: '@rShe thought it was pitch black, but that appeared not to be the case.@k@rAfter all, she could faintly see her own body.'
27340: '@r......Without a doubt, there was some source of light,@k but even when she looked up at the ceiling, ......or else the sky, there was only an expanse of blackness, and she couldn''t see any such thing.'
27341: '@rHer body alone was slightly lit,@k whereas everything else was sunk in darkness......that''s what this world was like.'
27342: '@rIt was almost as though Rosa alone had been abandoned in a forgotten world.'
27343: '@rAs her mind grew clearer,@k she started getting nervous about why she was all alone in a lonely place like this.'
27344: '@r......When she was about to call out, asking if anyone was there,@w666. ......patter,@w333. ...patter,@w333. she heard footsteps coming towards her.'
27345: '@rThey were light footsteps, so she thought it was probably a kid.@k@rThey didn''t feel creepy to her, so she wasn''t afraid.'
27346: '@rBut they also weren''t Maria''s footsteps,@k so, wondering who in the world would be in a darkness like this, she stared in the direction she could hear the footsteps from.'
27347: '@r.........As she did, ......a faint, approaching silhouette came into view.'
27348: '@rIt looked......like a child much younger than Maria.'
27349: '@r......Who is that?@k I didn''t know him.'
27350: '@rBut, the expression on his face was like a lost child separated from his parents.'
27351: '@r...As a parent with a daughter myself, I felt as though my chest was being torn apart...'
27352: 'Sakutarou@r@v33/44200444.''........................Uryu.'''
27353: 'Rosa@r@v12/41400280."......ah -  ............"'
27354: '@rThe instant the kid muttered that infantile word,@k ......I felt a sharp pain in the half of my face that was aching from the cold floor, as though it had been pierced by long, thin, hard needles.'
27355: '@rI reflexively pressed my hand against that side of my face.'
27356: 'Sakutarou@r@v33/44200445.''......Are you okay......?@k @v33/44200446.Does it still hurt......?'''
27357: 'Rosa@r@v12/41400281."...Thank you, little guy.@k@v12/41400282. .........Where is this...?@k @v12/41400283.It''s really......cold."'
27358: 'Sakutarou@r@v33/44200447.''......Come this way......@k@v33/44200448. You can''t be here......'''
27359: '@rHe took my other hand and pulled, with a grim expression on his face.'
27360: '@r......I don''t have a clue what''s going on.@k However, a single honest expression from a child...@kcan often tell the truth better than a hundred empty words from an adult.'
27361: '@rShe didn''t understand the situation, but even so, Rosa dashed along with him wherever she was pulled...'
27362: '@rHowever, this was a world where nothing could be seen in the darkness except for their own forms.@k@rShe couldn''t even really feel whether she was actually moving forwards as she ran.'
27363: '@r......Even though I''m running, I can''t even feel any wind.@k It''s as though I''m still inside a nightmare...that kind of unreal feeling...'
27364: '@rSo even though I was running, I couldn''t maintain my sense of balance, and my legs got tangled and I fell.'
27365: '@r......Even in a world that didn''t feel real, the pain of smashing my face against the cold, hard floor was reality itself.'
27366: 'Sakutarou@r@v33/44200449.''Uryu...... Are you okay......?'''
27367: 'Rosa@r@v12/41400284."Ug - .........hh...@k@v12/41400285. ......I''m sorry, my head hurts."'
27368: '@r......When he said that......infantile word "uryu", pain like being stuck with needles ran though my head again.'
27369: '@rEven though it had only happened twice,@k I was somehow able to understand that his word was the cause of my pain.'
27370: '@r......So I said so frankly.'
27371: 'Rosa@r@v12/41400286."I''m sorry.@k@v12/41400287. Could you stop saying that "uryu"...?"'
27372: 'Sakutarou@r@v33/44200450.''Uryu......'''
27373: 'Rosa@r@v12/41400288."Hhhk, ......excuse me, I asked you to stop..."'
27374: 'Sakutarou@r@v33/44200451.''U-...au, ...uu!@k @v33/44200452.Sorry......'''
27375: '@rThis time, I got the feeling that his words of apology made me feel a sharp pain in my forehead.'
27376: '@r.........What is...this child......?'
27377: '@rI know there''s no malice in him,@w500. ......but when I''m around him,@w500. ......my head hurts......'
27378: 'Sakutarou@r@v33/44200453.''......Are you okay......?@k @v33/44200454.Let''s hurry up and go......@k@v33/44200455. You mustn''t be here.......'''
27379: 'Rosa@r@v12/41400289."Why shouldn''t I be here...?@k @v12/41400290.Come on, where is this......?@k @v12/41400291.Who are you?@k @v12/41400292.Where is your mama...?"'
27380: 'Sakutarou@r@v33/44200456.''.........But the one who made me...@v33/44200457....is you, Mama...'''
27381: 'Rosa@r@v12/41400293."......Huh......?"'
27382: '@rHe stared at me with round eyes.'
27383: '@r......This kid''s mama.........is me......?@k@r......Who is he?@k Who is this kid?'
27384: '@rI don''t remember at all.'
27385: 'Sakutarou@r@v33/44200458.''Did you......forget about me......?@k @v33/44200459.You made me, you know......?'''
27386: 'Rosa@r@v12/41400294."......Wait a second, stop kidding around.@k@v12/41400295. ...Maria is my only child.@k@v12/41400296. .........That''s right, where is Maria?@k @v12/41400297.Where''s Maria?!@k @v12/41400298.Maria......?!"'
27387: '@rI suddenly grew uneasy about Maria not being there.@k@rWhy am I all alone in a place like this?'
27388: '@rWhere''s Maria?!@k@rMaria being there for me is the only thing that keeps me together...!'
27389: 'Sakutarou@r@v33/44200460.''...Maria is here, ......but she''s not Maria right now.@k@v33/44200461. It''s better if you don''t see her at the minute.@k@v33/44200462. That will be better for you, and Maria as well.@k@v33/44200463. .........For Maria''s sake as well, run away.'''
27390: 'Rosa@r@v12/41400299."Huh......?@k @v12/41400300.What are you talking about?@k @v12/41400301.Where''s Maria?@k @v12/41400302.Maria?!@k @v12/41400303.Answer meee!!"'
27391: 'Sakutarou@r@v33/44200464.''Maria will find you...!@k @v33/44200465.Come this way, quickly, Mama...!'''
27392: '@rHe pulled my hand again.@k ......He was probably pulling me in the opposite direction from Maria.@k So I stopped in my tracks.'
27393: 'Rosa@r@v12/41400304."Let go...!@|@y@k @v12/41400305.Just who are you...?!@k @v12/41400306.Who said you could call me Mama...?!"'
27394: 'Sakutarou@r@v33/44200466.''......You''re the one who made me, Mama...@k@v33/44200467. Did you forget......?@k @v33/44200468.So that I could be Maria''s birthday present,@v33/44200469. ......you made me with your own hands, ...did you forget......?'''
27395: 'Rosa@r@v12/41400307."........................You......couldn''t be......@k@v12/41400308..........Maria''s......Sakutarou............?!"'
27396: 'Sakutarou@r@v33/44200470.''Yeah.........@k@v33/44200471. The lion stuffed animal you made...!'''
27397: 'Rosa@r@v12/41400309."Gya - !!"'
27398: '@rA fierce, sharp pain struck me.@k@rIt came from the palm of the hand he was grasping.'
27399: '@rI instinctively knocked his hand away, and when I looked at my palm...'
27400: '@r.........a hole the size of a thumb had opened there, and thick, deep-red blood was gushing out.'
27401: '@r...It was a hole so big that I could see through to the other side......'
27402: 'Sakutarou@r@v33/44200472.''U-uryu......!@|@y @v33/44200473.Are you okay?!@k @v33/44200474.Are you okay?!@k @v33/44200475.What happened...?!'''
27403: '@rSakutarou also noticed my wound, and panicked.'
27404: '@r......Judging by his reaction, he couldn''t understand why my hand had sustained a serious injury.'
27405: '@rBut, to my eyes, it felt like I had sustained that injury because he had grabbed my hand.'
27406: '@rWhether there was malice in him or not,@w500. ......I understood that this child was something that would do harm to me, and he instantly became strange and frightening......'
27407: 'Rosa@r@v12/41400310."Go away......!!@k @v12/41400311.I don''t know you...!@k @v12/41400312.Sakutarou was just a disgusting, crappy stuffed animal, right...?!!"@|@y'
27408: 'Rosa@r@v12/41400313."I don''t know you, I''m not your mama...!!@k @v12/41400314.Go away...!@k @v12/41400315.Disappear!!"'
27409: 'Sakutarou@r@v33/44200476.''.........U..................yu.........'''
27410: '@rSlowly, ......the base of Sakutarou''s neck...@k...tore in a horizontal line.'
27411: '@rIt gaped open, and the pitch blackness inside him peeked out.@k@r......There was no gushing of blood.@k@rOnly an endlessly empty blackness.'
27412: '@rAnd then, .........from the inside of the gash...@kcotton snow poured out, ......and he slumped over, scattering bits of cotton about.'
27413: '@rAll that remained there......was crumpled yellow cloth,@k and bits of cotton that looked like sticky, crushed cotton candy.'
27414: '@r.........A lion...stuffed animal.'
27415: '@rWithout a doubt.@k They were the remains of the Sakutarou stuffed animal I had torn apart on that day, overcome by my emotions.'
27416: '@rThe instant I admitted that,@k ............a long, sharp shriek that could rupture an eardrum tore the world apart......'
27417: 'Maria@r@v13/40401066."WAAAAAAAaaAAaAAAAAAAAAaAaaAAAAHHHHhHHHHHhHH!!!@k @v13/40401067.Sakutaroooooooo, Sakutaroooooooooo, waaaaaahhaaaaaaaaaaaaaaaaaauuhhhh!!@k @v13/40401068.Waaaaaaaaaaaaaaaaaaaauuuuhhhh!!"'
27418: '@rLike a flood from a broken dam, or like a broken TV...@k@r......Maria wailed in a high-pitched voice.'
27419: '@r.........Maria''s voice, which made the ears throb, brought up two emotions...'
27420: '@rThe first was regret: "Aahh, I let my emotions get the better of me and committed a terrible mistake..."'
27421: '@rA mother''s desire to kneel down right away, hold Maria''s head, cry with her and apologize.'
27422: '@r......And in fact, I did that right away.@k@rI held Maria''s head and apologized in tears for what I had done.'
27423: '@rBut Maria didn''t stop crying.@k On the contrary, she rejected me, the one who had torn her closest friend apart, and pushed me away forcefully with both hands.'
27424: '@rSince I had been on my knees in an unnatural position, I fell backwards easily.'
27425: '@rMaria scraped together the yellow scraps of cloth and cotton bits, ......buried her face in them, and cried even more...'
27426: '@rWatching that, the other emotion welled up.@k@rIt welled up rapidly.@k ......And then burst.'
27427: '@rI mean, she won''t come around even when I apologize, and there''s nothing I can do now anyway, and it''s all Maria''s fault in the first place...!!'
27428: '@rI mean she can''t make any friends because since she''s forever taken up with this make-believe stuffed animal thing, and that''s why she''s treated like a weirdo, and, you know...!!'
27429: '@rThis is a good opportunity...for instructive guidance!@k It''s not like I was pampered all the time myself...!!'
27430: '@rThings eventually break, are stolen, are broken!'
27431: '@rEven I had lots of toys and treasures stolen, broken, made fun of,@k and thrown away by my brothers and sister and father and mother...!!'
27432: '@rBut though I might have cried about that, ......though I might have shed a few tears......@knot once did I sob like this and trouble my parents,@k throw a tantrum, get in a terrible mood,@k pound and kick the floor and make a horrible racket...!!'
27433: '@rI always wanted to, but I thought I''d get in more trouble if I did, so I always, always held it in.'
27434: '@r@a1666.It''s because I held it in@rThAT i wAS ablE TO beCoMe THe WOnDerFuL aDULT i aM NOw!!!'
27435: '@rSuddenly, I felt something strangely...missing.'
27436: '@rThe same feeling as when you use a tool recklessly, and it finally breaks, so that you''re left holding only the base.'
27437: '@rBut I hadn''t been using a tool.@k@rI had only been using my own two hands to hit Maria''s head repeatedly.'
27438: '@rSo, ......I looked at my hands.'
27439: '@r......From my wrists onwards, my hands had snapped off, cracked off, ......and were gone.'
27440: '@rAs though only those parts of my arms had become ceramic.'
27441: '@r......No, everything beyond my wrists literally had become ceramic at some point, and had broken and fallen.'
27442: '@rCracks had formed in them because I had hit Maria too much, and they had fallen off.'
27443: '@r......Look, see, ...aren''t those my hands there, lying smashed by my feet......?'
27444: 'Rosa@r@v12/41400316."h.........?@k @v12/41400317.hiiiiIiiIiIiiiiii...!!!"'
27445: '@rThere was no pain.@k But the shocking sight of both my hands breaking off at the wrists made me scream......'
27446: 'Rosa@r@v12/41400318."Wh-what?!@k @v12/41400319.What?!@k @|@y@v12/41400320.My hands, ......hands, hands...!!@k @v12/41400321.Eeeeeeeeeeeeeeeeeeeeeekkkk!!!"@|@y'
27447: 'Maria@r@v13/40401069."..............................@k@v13/40401070. .........This way, ......you won''t be able to hit me anymore."'
27448: '@rIgnoring my confusion, ......Maria said that with a very cold voice,@k ......as she slowly moved her hands away from her head, where they had been defending against my barrage......'
27449: 'Rosa@r@v12/41400322."......What is this?!@k @v12/41400323.My hands, my hands...!!@k @|@y@v12/41400324.What did you do, Maria, what is this, what is this what is this...?!"'
27450: '@rA black silhouette was suddenly standing behind Maria.@k@r......It was the silhouette of an adult.'
27451: '@r............Who?!'
27452: 'BEATRICE@r@v27/40700387.".........Since an arm can pat a daughter''s head, flip through a picture book, and make warm meals,@k@v27/40700388. ......I thought it might be alright to leave them."'
27453: 'Maria@r@v13/40401071."Mama hits my head more than she pats it.@k@v13/40401072. ......She doesn''t turn the pages of a picture book.@k@v13/40401073. She doesn''t even make food.@k@v13/40401074. ......I go to buy it myself."'
27454: 'Maria@r@v13/40401075."......But I''m not allowed to go to the same store over and over,@k@v13/40401076. not allowed to have my face remembered, not allowed to talk to policemen...@k@v13/40401077. .........Why?@k @v13/40401078.Why is that?@k @v13/40401079.Did I do something wrong?"'
27455: 'Maria@r@v13/40401080."Am I not allowed to have you pat my head, have picture books read to me,@k@v13/40401081. eat dinner together with you...?@k @v13/40401082.Why?@k @v13/40401083.Why?!"'
27456: 'Maria@r@v13/40401084."It''s NOT my fault!!@k @v13/40401085.Not my fault, yours!!@k @v13/40401086.YOUR fault!!"'
27457: 'Maria@r@v13/40401087."You don''t play with me, but Sakutaro did!"'
27458: 'Maria@r@v13/40401088."He read books with me, watched TV with me, ate meals with me!!@k @v13/40401089.He was a much, MUCH more important friend than YOU!!!"'
27459: 'Rosa@r@v12/41400325."...I, ......I''m not proud of it...!@k @v12/41400326.Bu-but it can''t be helped, can it?!@k @v12/41400327.Mama''s busy with work - work!!@k @v12/41400328.You know that Mama''s busy with work, right?!@k @v12/41400329.What am I supposed to do?!!@k @v12/41400330.There''s nothing I can do!!"'
27460: 'BEATRICE@r@v27/40700389."That is true.@k@v27/40700390. There is nothing to be done.@k@|@y@v27/40700391. Nothing to be done about injuring your daughter, tearing her heart apart, and making her tears run with blood...!@k @v27/40700392.Then there''s nothing to be done about the same thing happening again, right here, right now...!!"'
27461: 'BEATRICE@r@v27/40700393."Come, MARIA...!@k @v27/40700394.That is enough for the excuses of the woman who calls herself a mother.@k@v27/40700395. Can you forgive her, or not...?!@k @v27/40700396.Is she innocent, or else guilty?!?!"'
27462: 'Maria@r@v13/40401090."Can''t forgive her!!@k @v13/40401091.Mama is guilty!!@k @v13/40401092.I''ll make the same thing happen to Mama that she did to Sakutaro...!!@k @v13/40401093.Take Mama, ......and rip her from the seam at the neck,@v13/40401094. ......rip her apart, and throw the cotton inside her everywhere!!"'
27463: '@r......Maria''s eyes ominously flashed blue.'
27464: '@rIn that instant, invisible, massive arms stuck their fingernails out and grasped Rosa''s entire body tightly.'
27465: '@rThe bones all throughout her body made sounds like twigs being stepped on as they readily cracked and broke.'
27466: '@r.........Rosa vaguely understood.@k The massive arms are probably......my own arms, from the time I tore Sakutarou apart.'
27467: '@rFrom a stuffed animal''s perspective, my arms must certainly have been this massive.'
27468: '@rSo I could imagine what would happen next.'
27469: '@r......The sharp nails stuck strongly into the base of my neck, ......and I heard the skin tearing with my own ears.'
27470: '@rThen, watched over by the two witches, Rosa''s flesh was split in two, top and bottom.'
27471: '@rWhen Sakutarou had been torn apart, bits of cotton had flown about like snowflakes.'
27472: '@rBut in Rosa''s case, something like thick black tar came out, filthily flying all over the place.'
27473: '@rThere wasn''t even a trace of the red of blood.@k@r......It was something black, filthy and thick.'
27474: '@rIt was probably what a bloodless, tearless human kept inside their body instead.'
27475: 'BEATRICE@r@v27/40700397."This is incredible. Hideous!@k @v27/40700398.What filthy insides...!@k @|@y@v27/40700399.That was splendid, MARIA.@k@v27/40700400. Well then, is this enough for your revenge?@k @v27/40700401.Can you forgive your mother, or not?@k @v27/40700402.Innocent, or guilty...?!!"'
27476: 'Maria@r@v13/40401095."Can''t forgive!!@|@y@k @v13/40401096.Still can''t forgive, guilty...!!!"'
27477: '@rBEATRICE brandished her pipe wand,@k and a surge of gold butterflies regenerated Rosa''s broken body in an instant...'
27478: 'Rosa@r@v12/41400331.".........kh, ......gh!@|@y@k @v12/41400332.*cough*cough*......!"'
27479: 'BEATRICE@r@v27/40700403."Feel your great sin, which cannot be paid for by a single human life.@k@v27/40700404. And remember your own grievous sin...!@k @|@y@v27/40700405.Come, try to remember...!!@k @v27/40700406.Remember how great a sin you committed...!!"'
27480: 'Maria@r@v13/40401097..........Hello.@k@v13/40401098. ......Is that you, Mama?@k @v13/40401099.......What time will you be back?'
27481: 'Rosa@r@v12/41400333."I''m sorry.@k@v12/41400334. I''m busy with work again today, so I''m staying over."'
27482: 'Maria@r@v13/40401100.......Staying over at work again.........?@k @v13/40401101.......Your job''s being hard on you again today, huh...'
27483: 'Rosa@r@v12/41400335."Yeah, I''m sorry.@k@v12/41400336. I really am busy.@k@v12/41400337. I''ve been holed up at the company this whole time.@k@v12/41400338. I can''t even get a breath of outside air."'
27484: 'Rosa@r@v12/41400339."Mama''s job isn''t one I can just finish up quick.@k@v12/41400340. Unless I give them the best design I can, I won''t be given another job...that''s how tough this job is.@k@v12/41400341. So it always needs a lot of time."'
27485: 'Maria@r@v13/40401102....Yeah.@k@v13/40401103. Understand.@k@v13/40401104. .........I''ll be a good girl and watch over the house, so work really hard, finish it quickly, and come back home, okay......?'
27486: 'Rosa@r@v12/41400342."Thank you for understanding about Mama''s work......@k@v12/41400343. I promise that I''ll buy a delicious cake and bring it home with me tomorrow."'
27487: 'Maria@r@v13/40401105.Don''t need cake.@k@v13/40401106. ......Instead of taking time to go to the cake store, I''d be happier if you just came home that little bit sooner.'
27488: 'Rosa@r@v12/41400344."Don''t worry.@k@v12/41400345. I''ll come back quickly, I promise.@k@v12/41400346. So let''s eat delicious cake together.@k@v12/41400347. Let''s drink delicious tea together.@k@v12/41400348. Let''s read a new picture book together.@k@v12/41400349. Let''s play with that "Wolves and Sheep Puzzle" I bought recently.@k@v12/41400350. Both of us together.@k@v12/41400351. ......It''s a promise."'
27489: 'Maria@r@v13/40401107..........Yeah, promise.@k@v13/40401108. I''ll be waiting.@k@v13/40401109. ............Do your best at work, Mama......'
27490: 'BEATRICE@r@v27/40700407."Hohoh.@k@v27/40700408. It''s a lonely story, but this is good mother-daughter love, with each showing consideration for the other, is it not?@k@v27/40700409. Do you see any problem with it, Maria? Rosa?"'
27491: 'Rosa@r@v12/41400352."..............................@k@v12/41400353. ......Th-that promise, ......I believe I kept it.@k@v12/41400354. The next evening, didn''t I do as I promised and return earlier than usual with the cake I bought?"'
27492: 'Maria@r@v13/40401110."That''s not it, I knew......@k@v13/40401111. .........That evening.@k@v13/40401112. A pay-on-delivery package came for you, but there wasn''t enough money in my wallet,@k@v13/40401113. so I called your company to ask you what to do."'
27493: 'Maria@r@v13/40401114."......I''d been told only to call at special times,@v13/40401115. ......but thought it''d be bad if the package was something important for your work...@k@v13/40401116. So I called."'
27494: 'Rosa@r@v12/41400355."...................................."'
27495: 'Maria@r@v13/40401117.".........And when I did, they told me you had the day off.@k@v13/40401118. ...They told me that it had been decided long ago that you would have the day off, .........and that you had gone far away to play.@k@v13/40401119. ............I knew.@k@v13/40401120. The whole, whole time, .........I knew that you were lying...!"'
27496: 'Maria@r@v13/40401121.But you know what? ......Sakutaro scolded me, saying that wasn''t true.'
27497: 'Maria@r@v13/40401122.That Mama was very busy with her job every day.@k@r@v13/40401123.That there was no way she would abandon me and play.'
27498: 'Maria@r@v13/40401124.That the person who told me Mama had the day off must have made some kind of mistake...!'
27499: 'Maria@r@v13/40401125.That''s what Sakutaro said.@k@r@v13/40401126.So I believed him.@k@v13/40401127. ......I believed him!'
27500: 'Maria@r@v13/40401128.I love Mama, I love Mama...!'
27501: 'Maria@r@v13/40401129.And of course Mama loves me too, loves me too!!'
27502: 'Rosa@r@v12/41400356."...............Yes.@k@v12/41400357. Me too.@k@v12/41400358. I love you, Maria......"'
27503: '@rRosa let out a deep sigh.@k@r......Maybe she felt the weight of her words.'
27504: '@rThen, she set the receiver back on the bedside phone.'
27505: '@rThe dark room made the windowside view of the starry sky on the ground stand out even more beautifully.'
27506: '@rOn the table in front of that terrace was a very cold wine cooler,@k and the one she was enjoying a glass with was gazing at the scene below...'
27507: '@r@v99/ManMA4001.".........You didn''t tell your daughter that you were going on vacation?"'
27508: 'Rosa@r@v12/41400359."I told her once, but she made such a fuss about it that I decided not to tell her anymore.@k@v12/41400360. It''s less of a pain that way."'
27509: '@r@v99/ManMA4002."......If you''re worried about your daughter, surely you didn''t have to force this into your schedule?"'
27510: 'Rosa@r@v12/41400361."But that way, we''d never get our schedules to match...@k@v12/41400362. Didn''t I say not to worry about that?"'
27511: '@rThe slender, middle-aged man clad in a white robe gave a small sigh.'
27512: '@rRosa reacted sensitively to that slight action......'
27513: 'Rosa@r@v12/41400363."Come on!@k @v12/41400364.Let''s not talk about my daughter.@k@v12/41400365. It''d be a waste of this excellent wine."'
27514: '@r@v99/ManMA4003."............I find you fascinating as both a woman and a human being.@k@v99/ManMA4004. But for that very reason,@k@v99/ManMA4005. I feel bad about taking so much of your time that it strains your relationship with your daughter."'
27515: 'Rosa@r@v12/41400366."Aren''t I always asking you not to worry about my relationship with my daughter...?!@k @v12/41400367.I make sure not to talk about her when I''m alone with you, don''t I?@k @v12/41400368.I wouldn''t even have phoned from up here if it weren''t for the noisy drunks laughing stupidly in the lobby downstairs...!"'
27516: '@r@v99/ManMA4006."Rosa-san.@k@v99/ManMA4007. Couldn''t you reconsider sudden vacations like this in the future, for your daughter''s sake...?@k @v99/ManMA4008.Isn''t it alright if we only do it when our schedules match?"'
27517: 'Rosa@r@v12/41400369."But then our schedules won''t match at all......!@k @v12/41400370.Don''t you understand, I......want to be with you all the time......!"'
27518: '@r@v99/ManMA4009."That''s how a child behaves when they''re in love.@k@v99/ManMA4010. Love between adults should be a little more stoic.@k@v99/ManMA4011. ......Rosa-san, I feel sad too that I can never stay with you for very long.@k@v99/ManMA4012. But I think we''re enjoying a very full adult romance with the limited time and opportunities we have."'
27519: 'Rosa@r@v12/41400371."So you''re telling me to be with my daughter more.@k@v12/41400372. ......Don''t be a woman, be a mother?"'
27520: '@r@v99/ManMA4013."......That''s what you wish for too, isn''t it?@k @v99/ManMA4014.You must want to spend some relaxed time with your daughter.@k@v99/ManMA4015. I''m not going anywhere.@k@v99/ManMA4016. I''m trying to say that I think it''s sad for you to sacrifice your daughter so you can prioritize your time with me."'
27521: 'Rosa@r@v12/41400373."........................................@k@v12/41400374. ......Did you patch things up with your wife?@k@v12/41400375. .........You''ve started thinking you don''t want to split up, haven''t you."'
27522: '@r@v99/ManMA4017."I don''t want to talk about my wife.@k@v99/ManMA4018. Just like you don''t want to talk about your daughter."'
27523: 'Rosa@r@v12/41400376."......You''ve started thinking that women with children are a pain."'
27524: '@r@v99/ManMA4019."I have never said anything of the sort."'
27525: 'Rosa@r@v12/41400377.".........Whenever someone finds out I have a child, they desert me.@k@v12/41400378. ......Even when I tell them they don''t need to worry about the cost of raising her, they all desert me...@k@v12/41400379. ......I...thought you understood about my daughter,@k@v12/41400380. .........but it looks like you really don''t like women with children......"'
27526: '@r@v99/ManMA4020."That''s not what I''m saying.@k@v99/ManMA4021. Of course I like you, Rosa-san.@k@v99/ManMA4022. I''m just trying to say to take better care of your daughter - @k@v99/ManMA4023.you must want that yourself - so I don''t want you to hurt yourself by lying to your daughter.@k@v99/ManMA4024. That''s all I''m saying."'
27527: 'Rosa@r@v12/41400381."Liar!!!@|@y@k @v12/41400382.You just can''t be bothered to deal with me any more, can you?!"'
27528: '@r@v99/ManMA4025."I never said that...!"'
27529: 'Rosa@r@v12/41400383."No, I know, I can tell.@k@v12/41400384. After being abandoned so many times because of that child, I know,@k@v12/41400385. I can tell by your mood, yes, you''re the same, you''re just like the other men!!@k @v12/41400386.You don''t want a woman with a child, you don''t want a divorcee, you don''t want to deal with it!!"'
27530: 'Rosa@r@v12/41400387."You don''t want to become the parent of a child made with another man, right?@k @v12/41400388.No, of course you don''t, I know exactly how that feels!!"'
27531: 'Rosa@r@v12/41400389."I once went out with a man with children, and I absolutely understood that feeling...!!@k @v12/41400390.That''s why......I believed that I could be together with you, a person who understood about my daughter!!"'
27532: 'Rosa@r@v12/41400391."Ghagh!!@|@y@k @v12/41400392.*cough*, ......*cough*......@k@v12/41400393. ......That''s right......@k@v12/41400394. You were......always in the way......"'
27533: 'Maria@r@v13/40401130.".............................."'
27534: 'Rosa@r@v12/41400395."......If not for you, ......I would have been able to grasp my happiness as a woman long ago......@k@v12/41400396. Your existence......constantly gets in the way of my happiness......"'
27535: 'Maria@r@v13/40401131."............Ma...ma........."'
27536: 'Rosa@r@v12/41400397.".........Even I didn''t want to give birth to you...@k@v12/41400398. No, that''s wrong.@k@v12/41400399. ......I did think it''d be nice to build a happy family together with you...@k@v12/41400400. ......But he disappeared right before you were born.@k@|@y@v12/41400401. He said he''d build a warm family with me...he tricked me...and disappeared from my sight for all eternity...!!"'
27537: 'Rosa@r@v12/41400402."Only you were left.@k@|@y@v12/41400403. No love or memories or anything remained!!@k @v12/41400404.Where is that man now?@k @v12/41400405.He probably just turned my days with him into a warm memory, and found a new love.@k@|@y@v12/41400406. And maybe that time he managed to build up a happy family...!!@k @v12/41400407.And me?!@k @v12/41400408.I have you!!@k @v12/41400409.I can''t even look for love!!"'
27538: 'Rosa@r@v12/41400410."Men can go between women as they like and brag about it!@k @v12/41400411.But the woman, me!!@k @|@y@v12/41400412.I have you!!@k @|@y@v12/41400413.I have you as a stone weight,@k@v12/41400414. and because of you I can''t search for romance, I can''t have love, I have no choice but to live alone!!"@|@y'
27539: 'Rosa@r@v12/41400415."No, I''m not even allowed that, I''m not even allowed a night to myself to drown my sorrows!!@k @|@y@v12/41400416.Who are you?!@k @|@y@v12/41400417.Who?!@k @|@y@v12/41400418.You ruined my life, and won''t even let me have a new one... Just what are you to my life?!"@|@y'
27540: 'Rosa@r@v12/41400419."Die, disappear, I''ve hated you since the time you were born!!@k @|@y@v12/41400420.I''ve hated you since the time you were in my womb!!!@k @v12/41400421.But I tried to stay positive and accept you, I''ve been doing my best to play the part of a good mother."'
27541: 'Rosa@r@v12/41400422."Yes, I did my best!!@k @v12/41400423.As other women of my generation enjoyed being single, sometimes playing with passion, or even being joined with someone in love, I watched from the sidelines,@k@v12/41400424. stuck wearing the two hats of a mother and a woman...!!@k @v12/41400425.Who ever showed appreciation for my efforts?!@k @|@y@v12/41400426.No one admired me, no one praised me!!"'
27542: 'Rosa@r@v12/41400427."I got what I deserved?@k @|@y@v12/41400428.You don''t want a woman with a kid?@k @|@y@v12/41400429.Sour grapes?@k @|@y@v12/41400430.You''re looking for a girl who''s sweet and pure?!@k @v12/41400431.Well who the hell wants YOU, you goddamn inexperienced punks!!!"'
27543: 'Rosa@r@v12/41400432."I was so desperate, I probably looked like I''d fall for you easy... Yes, damn right I was desperate!!@|@y@k @v12/41400433.I''m still at the age where I want to know love,@k@v12/41400434. and I was being swamped with work and caring for my child, and when I realized that I would probably grow old and live out my life like this,@k@v12/41400435. you can''t even imagine how desperate I was!!"@|@y'
27544: 'Rosa@r@v12/41400436."Of course I hate your real father too!@k @v12/41400437.But he and I both share the blame for bringing about that breakup.@k@v12/41400438. I myself might have been enough of a pain in the ass to make him run away!"'
27545: 'Rosa@r@v12/41400439."But the breakups after that, all of them were your fault!@k @v12/41400440.When did I ever scold you for that?!@k @v12/41400441.Never, did I?!?!?!"'
27546: 'Rosa@r@v12/41400442."The day after one man left me, when I wanted to drink myself dead drunk, was Parent''s Day at your school!!@k @v12/41400443.I was there, my tear-stained eyes disguised with heavy makeup,@k@v12/41400444. and the way I felt when you said something off the mark and the whole class laughed at you...@k@v12/41400445.is something I expect you and everyone else on this planet couldn''t possibly understand!!"'
27547: 'Rosa@r@v12/41400446."I hate you, loathe you...!!!@|@y@k @v12/41400447.And up to this very moment, I''ve never really loved you even once!!!@|@y@k @|@y@v12/41400448.Whhaaaaaaaaaaaaaaaaaaaaaaaaaaaaaooooooaaaaaaaaaaaaaaaaaaaaaaahhhhh!!!"@|@y'
