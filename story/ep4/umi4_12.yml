27571: 'BEATRICE@r@v27/40700429."So, Maria.@k@v27/40700430. Are you now satisfied?@k @v27/40700431.Can you forgive your mother''s sin?@k @v27/40700432.Or not?@k @v27/40700433.Innocent?@k @v27/40700434.Or guilty?!"'
27572: 'Maria@r@v13/40401141."Can''t forgive!!@k @v13/40401142.Still can''t forgive, can''t forgive at all!!@k @v13/40401143.Mama is guilty, guilty guilty guilty, can''t forgive!!!"'
