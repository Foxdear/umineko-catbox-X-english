27575: '@rAnd once again, she spat out curses rejecting Maria.'
27576: 'Maria@r@v13/40401144.".........You aren''t Mama.@k@|@y@v13/40401145. You''re a witch, a witch tormenting me and Mama!!@k @v13/40401146.I won''t forgive you just because you look like Mama!@k @v13/40401147.Won''t forgive you!!"'
27577: 'Rosa@r@v12/41400460."......You''re the witch......@k@v12/41400461. Always reading creepy books and playing witches...!!@k @v12/41400462.You''re the one who should disappear!!!!!!!@k @v12/41400463.Because of you, even I get treated like a weirdo!@k @v12/41400464.Because of you, because of yooooooooooooouuuuuuu!!!"'
