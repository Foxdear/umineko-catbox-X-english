25476: 'LAMBDADELTA@r@v29/42200094."Isn''t this so lovely, cute and marvelous?@k @v29/42200095.Ohhh-hoh-hoh-hoh-hoh-ho!!@k @v29/42200096.Buuut!@k @v29/42200097.I do have one nice little proposal for you."'
