25502: 'LAMBDADELTA@r@v29/42200128."But we''re okay there, ''cause, she''s the Endless Witch.@k@v29/42200129. Beato''s stupid, so she optimistically thinks that even so, she''ll surely win eventually,@k@v29/42200130. and just has to repeat this game on and on endlessly until that happens."'
25503: 'LAMBDADELTA@r@v29/42200131_b."Blonde-haired girls are almost always stupid, *giggle*giggle*!"@|@y'
