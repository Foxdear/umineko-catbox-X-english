25042: '@rThat''s right.@k Just once in the past, I underwent training in order to step into the world of witches.'
25043: '@rI accepted that the only power which could save me from my sad, painful days at Saint Lucia Academy...@kwas the thing called magic, and I received Maria onee-chan''s introduction to the basics......'
25044: 'Ange@r@v11/42000719."...............Imagine...a vast space......@k@v11/42000720. ......The scenery when I looked down at the base of the mountain, from the rest stop at the peak......"'
25045: 'Ange@r@v11/42000721.".........Like this......?"'
25046: '@rI projected that scene from a memory into my mental world.'
25047: '@r......Normal little girls get over their admiration of magical girls during elementary school.'
25048: '@rTraining in absolute earnest to use magic at this age......I have to say, I''m embarrassed of myself.'
25049: '@rBut even that embarrassed emotion felt pleasant to me now.'
25050: '@rRight now, I was learning mental concentration from Maria onee-chan in order to use magic.'
25051: '@rBut it wasn''t going very well.@k ......It was about as hopeless as going to a person who can wiggle their ears,@k asking them how they do it, and expecting to learn anything at all from their demonstration...'
25052: '@rIt seems that you need to imagine a vast space to gain the mental concentration for using magic.'
25053: '@rSo I remembered the time from my younger days when my family had gone on a small vacation,@k and I had looked down towards the base of a mountain from a viewing platform at a rest stop on the peak—and I tried painting this scene in my mental world.'
25054: 'Maria@r@v13/40400690."No, still far too small.@k@v13/40400691. Imagine a much, much wider space.@k@v13/40400692. And create your very own mental world."'
25055: 'Maria@r@v13/40400693."Your image is still far too foggy.@k@v13/40400694. There''s no temperature in the air, and there''s no wind.@k@v13/40400695. No smells either.@k@v13/40400696. The world is still very thin.@k@v13/40400697. ......You can leave those for later, so for now, just imagine a wider space."'
25056: 'Sakutarou@r@v33/44200201.''Uryu.@k@v33/44200202. ......Why do you have to imagine a wide space?'''
25057: 'Maria@r@v13/40400698."From the time they''re born, Humans have inside them a toxin that blocks magic.@k@v13/40400699. If you don''t purge yourself of that toxin, you can''t use magic well.@k@|@y@v13/40400700. ...One effective method of achieving this is to imagine a vast space."'
25058: 'Ange@r@v11/42000722.".........Just now, I thought of the world as seen from the window of an airplane, but that didn''t work either.@k@v11/42000723. ......A world more vast than that,@v11/42000724. ......I can''t even imagine."'
25059: 'Sakutarou@r@v33/44200203.''In that case, Maria, why don''t you just tell Ange about the vast world you have...!@k @v33/44200204.Won''t that make it easy for Ange to imagine as well?@k @v33/44200205.Uryu!'''
25060: 'Ange@r@v11/42000725."......That''s right.@k@v11/42000726. And I''m interested in the kind of world you imagine when you use magic, too, Onee-chan.@k@v11/42000727. ...I''ll use it as a reference as well."'
25061: 'Maria@r@v13/40400701."Uu, won''t work.@k@v13/40400702. The mental world must be vast and isolated.@k@v13/40400703. A world with absolutely no obstructions other than yourself."'
25062: 'Maria@r@v13/40400704."......Which means, if you tell someone about that world, it won''t be isolated anymore.@k@v13/40400705. So you can''t reveal your mental world to anyone.@k@v13/40400706. So if you manage to draw up a good mental world, you have to keep it a secret only for yourself."'
25063: 'Sakutarou@r@v33/44200206.''Uryu...@k@v33/44200207. Maria''s a meanie-face...'''
25064: 'Ange@r@v11/42000728."Thanks, Sakutaro.@k@v11/42000729. I guess there are no shortcuts in training.@k@v11/42000730. ......I''ll make an effort.@k@v11/42000731. It''s alright, I''ve been given plenty of hints."'
25065: 'Sakutarou@r@v33/44200208.''Uryu...!@k @v33/44200209.Do your best, Ange...!'''
25066: '@rI had come to think that there was no way I could be saved by something like magic.@k@rAfter all, magic doesn''t exist in this world.@k@rThat kind of thing should be nothing more than a fantasy, a delusion, a daydream.'
25067: '@r......However, Maria onee-chan had shown that she could fill her own world with happiness using a power that was impossible for me.'
25068: '@rI had been looking down on that happiness as an empty happiness.'
25069: '@r......I had been denying it all, thinking that because I didn''t accept magic, I couldn''t accept the happiness that came from it either.'
25070: '@rBut Maria onee-chan''s world grew happier and happier.'
25071: '@rIn the past, I had disparaged it, calling it painful to look at.'
25072: '@rBut......that might have been nothing more than jealousy.@k@rIt was time for me to admit that.'
25073: '@rAnd doing so was my first step in my search for happiness...'
25074: '@rA vast space.@k A dry wind that can blow unobstructed by everything.@k@r......Let me feel that wind blowing through my hair.'
25075: '@r......Oh...yes, even the ground might block me as I am now.'
25076: '@rThen I don''t need it.'
25077: '@r............Push the ground away, downwards, downwards.'
25078: '@rIn other words, ......it was as though I had floated up, leaving the ground far behind.'
25079: '@rAfter pushing it further and further downwards,@k ...the ground grew foggy and faint, ......and for the first time, I began to feel the sky.'
25080: '@r.........Then, I understood its vastness.'
25081: '@rIn that instant, I felt the vivid wind pass straight through my body—in other words, blow through without any resistance.'
25082: 'Maria@r@v13/40400707."....................................@k@v13/40400708. ......Yes.@k@v13/40400709. Maintain that sensation."'
25083: 'Ange@r@v11/42000732."......Yes, I can feel it.@k@v11/42000733. ......I can tell that I''ve been......released from all hindrances."'
25084: 'Sakutarou@r@v33/44200210.''You did it, Ange, you did it, Ange...!@k @v33/44200211.You''ve taken your first step into the world of witches...!'''
25085: 'Ange@r@v11/42000734."..................This is...the world of witches......?"'
25086: 'Maria@r@v13/40400710."Yeah.@k@v13/40400711. So, let''s try practicing the magic that you''ve always wished for, Ange.@k@v13/40400712. .........Magic to summon friends.@k@v13/40400713. ......Magic to create allies who will save you from your loneliness, and thereby bring you happiness."'
25087: 'Sakutarou@r@v33/44200212.''Will Ange also be able to summon friends like me?!@k @v33/44200213.Uryu-uryu!'''
25088: 'Maria@r@v13/40400714."......As Ange is now, it''s still far too early for her to summon a friend of your caliber from the sea of zero.@k@v13/40400715. ......For now, let''s just start by practicing with friends that are easier to summon."'
25089: 'Ange@r@v11/42000735.".....................@k@v11/42000736. ...What will we begin with...?"'
25090: 'Maria@r@v13/40400716."Because you are a witch of Mariage Sorciere,@k@v13/40400717. you are also permitted to use those who are employed by other witches in the alliance."'
25091: 'Maria@r@v13/40400718."......For example, Sakutaro is my friend, but since you''re in the same alliance, Ange, he''s your friend too, and you can summon him.@k@v13/40400719. ......You wanna try summoning Sakutaro one of these days?@k @v13/40400720.When you''re feeling all alone and it''s really getting you down, I''m sure Sakutaro will cheer you up."'
25092: '@rOh, right.@k You could call Sakutaro a being employed by Onee-chan.'
25093: '@rSo as a witch in the same alliance as Onee-chan, it''s also possible for me to summon Sakutaro......'
25094: '@rI met Sakutaro''s gaze.'
25095: '@r......What a joy it would be to have him just be sitting there by my pillow,@k so he could talk to me a bit on lonely nights.'
25096: 'Ange@r@v11/42000737."......If I call out, will you appear,@v11/42000738. ......and talk to me......?"'
25097: 'Sakutarou@r@v33/44200214.''Uryuu!@k @v33/44200215.I''m looking forward to you summoning me!@k @v33/44200216.Uryu-uryu-uryu!'''
25098: '@rLooking happy, Sakutaro playfully pressed and rubbed his head against me like a cat.'
25099: '@rSuddenly getting this cute younger brother......left me feeling a bit confused, a bit embarrassed, and a bit happy.'
25100: '@r.........Unable to understand why I hadn''t been able to honestly accept this feeling, I felt tears well up in my eyes.'
25101: 'Ange@r@v11/42000739."Okay.@k@v11/42000740. ......I''ll give it all I''ve got, Onee-chan."'
25102: 'Maria@r@v13/40400721."Then let''s try and practice.@k@v13/40400722. .........Let''s try summoning the furniture of a witch from the same alliance—BEATRICE."'
25103: 'Ange@r@v11/42000741."............BEATRICE''s...furniture."'
25104: '@rHearing BEATRICE''s name mentioned gave me a slightly strange feeling.'
25105: '@rWhen it came to the crime on Rokkenjima, the public had made a lot of noise about it being a witch''s sacrificial ritual or something like that.'
25106: '@r......And that witch was BEATRICE.'
25107: '@rSo if the culprit of that crime was a witch,@k ......it would mean that this very woman was the culprit who took away my family.'
25108: '@rHowever, according to Maria onee-chan, BEATRICE was a good witch.'
25109: '@rIf I held negative emotions towards BEATRICE,@k she would get mad, argue with me and call me mean, and refuse to talk to me for a while.'
25110: '@r......Onee-chan was my only close friend right now.'
25111: '@r...So to avoid worsening the mood of my close friend,@k I had decided to think of BEATRICE as nothing more than Onee-chan''s magic master...'
25112: '@r......And anyway, my belief is that the crime was a murder plot hatched by Aunt Eva.'
25113: '@r......Someday I''m definitely gonna bring that all to light.........'
25114: 'Maria@r@v13/40400723."Ange.@k@v13/40400724. Obstructions are mingling inside your body again."'
25115: 'Ange@r@v11/42000742.".........Sorry, I lost my concentration.@k@v11/42000743. ...One more time..."'
25116: '@rOnee-chan is really something...@k@rShe instantly noticed that I was being overcome with idle thoughts.'
25117: '@rAfter shaking my head just once, I reimagined the wind blowing through the vast sky...'
25118: 'Ange@r@v11/42000744."............The Seven Sisters of Purgatory?@k @v11/42000745.That''s a pretty creepy name."'
25119: 'Maria@r@v13/40400725."But they''re very energetic and fun girls.@k@v13/40400726. They might become your new friends, Ange.@k@|@y@v13/40400727. ......I''ll summon them first.@k@v13/40400728. Watch."'
25120: '@rMaria onee-chan lifted both hands up to the level of her head, and quietly unified her mind.'
25121: '@r......The state that I could not attain without meditating for a long period of time, she reached in the span of a few quick breaths.'
25122: '@rThen, a pale blue light began to gather in her palms, .........and one by one, the girls began to show themselves.'
25123: '@rOne, two, three.@k Four, five, six, seven...'
25124: '@rThe way they were summoned one after another in a line was overwhelmingly impressive.'
25125: '@r......Incredible.@k The Seven Sisters of Purgatory, ......just like the illustrations in Onee-chan''s grimoire...'
25126: '@rThe younger sisters were behind the eldest, Lucifer, who saluted Onee-chan.'
25127: 'Lucifer@r@v38/42300001."The Seven Sisters of Purgatory, right here...!@k @v38/42300002.Lady MARIA, it has been quite some time."'
25128: 'Maria@r@v13/40400729."Yep.@k@v13/40400730. Long time no see.@k@v13/40400731. Are you all doing okay...?"'
25129: 'Lucifer@r@v38/42300003."We furniture are furniture because we are used.@k@v38/42300004. I consider it an honor from my very heart to have been summoned again for the first time in a long while!"'
25130: 'Asmodeus@r@v44/42900015."Kyaa♪ Sakutaroo!@k @v44/42900016.It''s been so looong!"'
25131: 'Beelzebub@r@v43/42800023."You look as deli—I mean—cute as ever~!!"'
25132: 'Mammon@r@v42/42700066."I''m fi~rst!!@k @|@y@v42/42700067.Kyaa, he''s so fluffy, squishy, and cuuu~te!"@|@y'
25133: 'Leviathan@r@v39/42400001."A~h!!@|@y@k @v39/42400002.Let me hug him too, let me hug him too~!"'
25134: 'Sakutarou@r@v33/44200217.''U-uryuu!@k @v33/44200218.Can''t brea~the!@k @v33/44200219.I won''t run away, so let me go, everyo~ne!'''
25135: 'Satan@r@v40/42500011."Hey!!@|@y@k @v40/42500012.Are you trying to break Lady MARIA''s furniture?!@k @v40/42500013.Just get away from him, hugging is prohibited!!"'
25136: 'Belphegor@r@v41/42600010."......And yet you''re the one who looks like you want to hug him the most.@k@v41/42600011. *snicker*."'
25137: 'Satan@r@v40/42500014."Wh—?!@k @v40/42500015.I, I don''t have any i-interest in something so...fluffy and...squishy and...cuddly, okay?!"'
25138: 'Lucifer@r@v38/42300005."Hey!!@|@y@k @v38/42300006.Be silent in the presence of Lady MARIA and Ange-sama, you cretinous sisters!!"'
25139: '@rThey were so energetic...@k@rThe sudden burst of activity as soon they appeared left me stunned.'
25140: '@rAnd even greater than that was my surprise that the innocent Sakutaro was on such good terms with the Seven Sisters.'
25141: 'Ange@r@v11/42000746."......That''s unexpected.@k@v11/42000747. To think that Sakutaro would be so loved by such a dangerous bunch of people."'
25142: 'Maria@r@v13/40400732."They''re fellow members of the same alliance.@k@v13/40400733. There''s nothing to be scared of, you know?"'
25143: 'Ange@r@v11/42000748."But if Sakutaro were to do something to upset them, it looks like they could finish him off in an instant..."'
25144: 'Maria@r@v13/40400734."It''s alright.@k@v13/40400735. The witches of the alliance and their furniture are all friendly with each other.@k@|@y@v13/40400736. So Sakutaro can play without worrying.@k@v13/40400737. ......Of course, that goes for you and me too, Ange."'
25145: '@rOne of the treaties of Mariage Sorciere.@k@r"Mutual nonaggression and noninterference".'
25146: '@rMember witches must respect each other''s magic and creations.'
25147: '@rEven the sisters, who were normally extremely combative and dangerous, interacted with fellow alliance members as friends.'
25148: '@rSo to the Seven Sisters, Sakutarou was a common friend.'
25149: '@rHe was loved by all of the Seven Sisters, and they were even trying to steal him away from each other.'
25150: '@rThis scene as they all surrounded him and loved him was actually a bit charming.'
25151: 'Ange@r@v11/42000749."......I see.@k@v11/42000750. They''re fellow members of Mariage Sorciere."'
25152: '@rAt a glance, you''d think that Sakutaro''s easygoing atmosphere and the Seven Sisters'' unsettling one would be like water and oil.@k They looked like they''d never be compatible.'
25153: '@rAnd yet, they were interacting in such a friendly way, as if it was completely natural......'
25154: '@rIf all the peoples of the world could be joined in this wonderful alliance,@k ......I wonder if the whole world could immediately become friends.'
25155: 'Maria@r@v13/40400738."All you Seven Sisters, listen.@k@v13/40400739. Right now, Ange is in the middle of magic training.@k@v13/40400740. So I want all of you to lend her your power."'
25156: 'Lucifer@r@v38/42300007."Certainly, Lady MARIA.@k@|@y@v38/42300008. ...But what specifically?"'
25157: 'Maria@r@v13/40400741."I will move the magical power manifesting you from me to Ange.@k@v13/40400742. I want you to stay close by her all the time in that state.@k@v13/40400743. All you have to do is talk with her and stuff like that."'
25158: 'Lucifer@r@v38/42300009.".........My apologies,@k@v38/42300010. but with Ange-sama''s magical power, I suspect that it will not be easy for her to continually summon all seven of us around the clock..."'
25159: '@rThe oldest sister, Lucifer, gauged my reaction as she advised this, speaking reservedly.'
25160: '@r...In short, she was saying that the burden might be too heavy for me at this point in time.'
25161: 'Maria@r@v13/40400744."That''s the kind of training it is.@k@v13/40400745. Ange has more talent and magical power than you all imagine.@k@v13/40400746. I think it''ll be a little bit tough, but I think it''s worth it for Ange to take this challenge as she is now."'
25162: 'Maria@r@v13/40400747."......Ange.@k@v13/40400748. I will now switch the magic power manifesting them over to you.@k@v13/40400749. ......Basically, you''ll be in the same state as if you''d summoned them yourself."'
25163: '@rSo what Maria onee-chan was trying to say was something like this.'
25164: '@rTo keep the Seven Sisters manifested, you are burdened continuously with a significant amount of magical power.'
25165: '@r......Maybe you could say it was like training while wearing weighted wristbands.'
25166: 'Sakutarou@r@v33/44200220.''Uryu......@k@v33/44200221. Doing all of the Seven Sisters will be pretty tough......@k@v33/44200222. Isn''t that asking a lot of Ange all of a sudden...?'''
25167: 'Ange@r@v11/42000751."Thanks, Sakutaro.@k@v11/42000752. But this is my training to become a witch.@k@v11/42000753. I want to give it my best."'
25168: '@r......The seven of them certainly do seem boisterous.@k But even if they''re doing it for the sake of my training,@k having them be with me will surely distract me from my loneliness, at least a little.'
25169: '@rI understood it would be an ordeal, but before anything else, I wanted to give it a shot.'
25170: 'Maria@r@v13/40400750."Don''t overdo it if it gets tough, alright?@k@|@y@v13/40400751. And everyone, if Ange looks like she''s having a hard time, tone it down for her."'
25171: 'Lucifer@r@v38/42300011."Certainly.@k@|@y@v38/42300012. You got that, people?!"'
25172: '@r@v99/awase0021.""""""Yeeees, Onee-samaa!""""""'
25173: 'Lucifer@r@v38/42300013."Well then, Ange-sama.@k@v38/42300014. We, the Seven Sisters of Purgatory, will now become your furniture.@k@v38/42300015. .........Lady MARIA, if you would."'
25174: 'Maria@r@v13/40400752."Yeah.@k@v13/40400753. ......Okay, Ange.@k@v13/40400754. Can we start?"'
25175: 'Ange@r@v11/42000754."......Sure.@k@v11/42000755. ...I''m a little nervous."'
25176: 'Sakutarou@r@v33/44200223.''Uryu...@k@v33/44200224. This might be tough all of a sudden...@k@v33/44200225. If you feel like you''re getting a headache, lower your magic power right away......'''
25177: 'Maria@r@v13/40400755."Okay, I''ll move the source of magic power over to you now, Ange............"'
25178: 'Maria@r@v13/40400756."....................."'
25179: 'Ange@r@v11/42000756."...............gh—"'
25180: '@rInstantly, the inside of my head felt very heavy.'
25181: '@r......This is......@w333.yes,@w500. .........it''s tough...'
25182: '@rUntil then, the inside of my head had been used only for myself.@k@rIt was almost like it was now also being used for seven other people.'
25183: '@r......Their mere presence there, blinking, or even letting out a single breath, was placing an enormous weight on the inside of my head...'
25184: 'Belphegor@r@v41/42600013."......Lady MARIA.@k@v41/42600014. My apologies, but I fear that the burden of all of the Seven Sisters at once might be too great after all."'
25185: 'Ange@r@v11/42000757."I, ......I''m alright.........@v11/42000758.......ack........."'
25186: 'Maria@r@v13/40400757."...Mmmm...@k@|@y@v13/40400758. Maybe it''s no good after all.@k@v13/40400759. You''re using all of your energy to manifest them.@k@v13/40400760. If it''s such a burden that you can''t balance it with your everyday life, there''s no point.@k@|@y@v13/40400761. I mean, this is a little...unrefined for a witch."'
25187: 'Sakutarou@r@v33/44200226.''Uryu...@k@v33/44200227. I said doing so many all of a sudden was impossible...@k@v33/44200228. Everyone, disappear a little bit and make it easier for her...'''
25188: 'Lucifer@r@v38/42300016."Yes.@k@v38/42300017. It seems it would be better to lower the number of people.@k@|@y@v38/42300018. ......Asmo, erase yourself."'
25189: 'Asmodeus@r@v44/42900018."Me agaaain?@k @|@y@v44/42900019.I''m opposed to youngest-sister-bullyi~ng!!@k @v44/42900020.Start from the top every once in a whi~le!"'
25190: 'Leviathan@r@v39/42400004."But that would mean I''d have to disappear second!@k @v39/42400005.No no noooo!"'
25191: 'Satan@r@v40/42500017."Don''t make a ruckus, Asmo and Levia-nee!!@k @v40/42500018.That kind of disturbance will put even more strain on Ange-sama!!"'
25192: 'Lucifer@r@v38/42300019."The noise you''re making is straining her as well, stupid Satan!!"'
25193: 'Satan@r@v40/42500019."Eek!"'
25194: 'Ange@r@v11/42000759.".........aah, .........ack......@k@v11/42000760.......gah........."'
25195: '@rThe Seven Sisters started arguing over who should vanish first.@k ......All the energy of that fight became a burden, imposing an even greater headache upon Ange...'
25196: '@rIn the end, they decided the order with rock-paper-scissors, and they began to disappear—one of them...two...three.'
25197: '@rBut even at that level, Ange was still far from comfortable.'
25198: '@rIn the end, I was finally able to calm my breathing once six of them had erased themselves.'
25199: '@rWith my magical power, forget the Seven Sisters, just one of them is my limit...'
25200: 'Mammon@r@v42/42700069."......Aaa~aah, this way it''s not the Seven Sisters, it''s just me.@k@v42/42700070. You''re not very dependable, Ange-sama."'
25201: '@rMammon, who had won her way through the rock-paper-scissors and received permission to remain until the end, complained.'
25202: 'Sakutarou@r@v33/44200229.''Uryu...@k@v33/44200230. Mammon, you mustn''t say such a thing...@k@|@y@v33/44200231. Ange is still just starting her training.@k@v33/44200232. ......Are you okay, Ange?@k @v33/44200233.Is your headache okay...?'''
25203: '@rSakutaro stretched on his tiptoes and did little hops trying to pat Ange''s head.'
25204: '@rWatching this, Maria scratched her head, acknowledging that this sudden training had been too difficult.'
25205: 'Maria@r@v13/40400762."Uu.@k@v13/40400763. Maybe that was a little too austere.@k@|@y@v13/40400764. This much is no problem at all for me, though.@k@v13/40400765. The more friends you have, the more fun it is, after all."'
25206: 'Ange@r@v11/42000761.".........Now I''m even more aware of how incredible you are, Onee-chan..."'
25207: '@rAccording to Maria onee-chan, when you reach her class, you can even summon enough people at once to make up an orchestra.'
25208: '@rAnd yet she calls herself a witch apprentice—that''s awe-inspiring...'
25209: 'Mammon@r@v42/42700071."Are you alright?@k @v42/42700072.Ange-samaa?"'
25210: 'Ange@r@v11/42000762."...............I''m sorry...@k@v11/42000763. It looks like summoning you is the most I can do."'
25211: 'Mammon@r@v42/42700073."Well, I guess I''m alright with that.@k@v42/42700074. After all, of all the Seven Sisters, I get the role of Ange-sama''s furniture all to myself.@k@|@y@v42/42700075. ......What do you think, Ange-sama?@k@v42/42700076. Will I be a burden by myself?"'
25212: 'Ange@r@v11/42000764."No, I can manage you alone somehow..."'
25213: 'Mammon@r@v42/42700077."Great!@k @v42/42700078.Then please train a lot and cultivate a lot of magic power.@k@v42/42700079. And someday, please let me serve you as one of the fully assembled Seven Sisters.@k@v42/42700080. Promise?"'
25214: '@rAfter checking that there was at least nothing wrong with her own manifestation,@k Mammon immediately returned to a good mood, and tried to make me promise to work even harder.'
25215: '@rYes, I can see the greed in her.@k@r...But maybe you could also call it positivity.'
25216: 'Ange@r@v11/42000765."......Yes.@k@v11/42000766. I promise.@k@v11/42000767. ...I have to be able to do at least that much someday."'
25217: 'Mammon@r@v42/42700081."Thank you, Ange-sama!@k @v42/42700082.Until that day, I, Mammon of Greed, will serve you without fail...!"'
25218: '@rMy headache finally abated, and I relaxed both hands, which had been clutching at my head.@k@rThen Mammon stuck out her hand, and helped me to stand back up...'
25219: 'Sakutarou@r@v33/44200234.''Uryu?@k @|@y@v33/44200235.......Ah.@k@v33/44200236. ......Maria, Ange, look at the time.@k@v33/44200237. You''ll get told off if you don''t go back to the room now.'''
25220: 'Ange@r@v11/42000768.".........Huh?@k @v11/42000769.............Oh..."'
25221: '@rI hadn''t expected Sakutaro to talk about the time.@k@r......I was brought back into reality.'
25222: '@rAs though the light had disappeared from it, the vast world sank into the darkness,@k .........and I was in a tiny, tiny bathroom stall, sitting on a toilet...'
25223: '@rOnee-chan''s grimoire was open on my lap.'
25224: '@rI looked at the clock.@k ......It was almost 8 p.m., time for lights out.'
25225: '@rIf I show up late for the roll call before lights out, not only do they make an annoying fuss about it, but it causes trouble for my roommates and floormates as well.'
25226: '@r......I couldn''t care less about causing them trouble, but I''d rather not have to deal with the annoying interference that would come as a result...'
25227: '@rHahh............@k That''s the end of my me-time for today.@k I''ll go to bed, wake up, tomorrow will begin, and another long, long, gray-colored day will repeat again.'
25228: '@rI closed the grimoire and rose from the toilet seat...'
25229: '@rOnee-chan appeared again and spoke.'
25230: 'Maria@r@v13/40400766."......Come on, Ange.@k@v13/40400767. You''re forgetting your training.@k@v13/40400768. ............Take Mammon with you."'
25231: '@rI''d forgotten.@k ...The moment I''d returned to reality, I''d stopped manifesting Mammon...'
25232: '@rOne more time, I created a strong image of the existence of Mammon in my mind...'
25233: 'Mammon@r@v42/42700083."Sheesh, you''re so mean, Ange-sama.@k@v42/42700084. Erasing me suddenly like that...!@k @v42/42700085.At this rate, you''re going to find it pretty hard to call all of the Seven Sisters, you know!"'
25234: 'Ange@r@v11/42000770."............I''m sorry.@k@v11/42000771. I got careless."'
25235: 'Mammon@r@v42/42700086."It''s been a super long time since I''ve manifested in the human world, so I''m interested in absolutely everything.@k@v42/42700087. I''m feeling a little bit excited.@k@v42/42700088. Where is this?"'
25236: 'Ange@r@v11/R42000772.".........The Saint Lucia Academy dormitory.@k@v11/42000773. This is a stall in the communal bathroom.@k@v11/42000774. ......Each room has its own bathroom, so no one comes here.@k@v11/42000775. It''s quiet, and perfect for reading books."'
25237: 'Mammon@r@v42/42700089."In this dorm, you have to hide in a toilet stall even to read a book?@k @v42/42700090.Do they burn them or something?"'
25238: '@r...................'
25239: '@rI have a double room, so my roommate is always there.@k@rOur relationship is strained, and it feels like I''m always being ignored.@k@r......The atmosphere''s bad, so it''s really not a place I can relax.'
25240: '@rAnd it''s good for her as well—as long as I''m not there, she can go all out, call her friends and have a chatting party.'
25241: '@rIt''s more convenient for her too if I don''t return until just before lights out.'
25242: '@rThere''s also the library, but the group that uses that as a meeting place is constantly whispering about me.'
25243: '@rSo I don''t like to go to the library either.'
25244: '@r......During lunch, it''s the bushes behind the school building.@k@rDuring the night, it''s the stall in the communal bathroom in the dorms.'
25245: '@rThose are the only hideaways where I can be given peace...'
25246: '@rI opened the door to the stall, ......and went out.'
25247: '@rI turned around, signaling with my eyes for Mammon to come with me.'
25248: 'Mammon@r@v42/42700091."............I''m not sure I really understand, but I get the point that you find it pretty hard to call this place comfortable.@k@v42/42700092. Let''s hurry up and get out.@k@v42/42700093. I hate the air here."'
25249: 'Ange@r@v11/42000776."Really?@k @v11/42000777..........You can''t breathe this easy anywhere else."'
25250: '@rWhen I left the bathroom and exited into the corridor,@k because it was near lights out, all the girls who had gone to play in other rooms were dashing back to their own.'
25251: '@rWhen it came time for lights out, we had to change into uniform pajamas that we hated and called prison clothes,@k line up in the hallway, and go through the dorm leader''s roll call.'
25252: '@r......If by some chance someone were to be late for this,@k we would be made to take collective responsibility, and all of us floormates would have to undergo a punishment that went by the name of volunteer work...'
25253: '@rAs long as I took care to avoid this, the girls would disregard me coldly, but they wouldn''t get in my way.'
25254: '@r......That alone was enough for me.'
25255: '@rMammon looked at the passing girls and the furnishings of the dorm with interest.'
25256: '@r......Without paying her any particular attention, I hurried back to my room.'
25257: '@rIn front of my room was my roommate, who had already changed into her prison clothes, chatting with some girls from the room next door.'
25258: '@rWhen they noticed me hurrying back, they blatantly changed the topic of their conversation.'
25259: '@rThey lowered their voices, stealing glances at me.'
25260: '@rI acted like I didn''t notice, went into my room, changed.@k@rAnd hurriedly went out into the corridor.'
25261: '@rEveryone was already lined up.'
25262: 'Mammon@r@v42/42700094.".........Hey, this is weird.@k@v42/42700095. Isn''t this a school for rich girls?@k @v42/42700096.It''s like a prison.@k@v42/42700097. This is dumb."'
25263: 'Ange@r@v11/42000778."It is, isn''t it?@k@v11/42000779. I think so too.@k@v11/42000780. And you could say the thing that makes it even harsher than a prison is that you don''t get out early for good behavior."'
25264: '@r......After bitching for a bit, I noticed.'
25265: '@rHaving someone to listen to your complaints...@w500....feels surprisingly good.'
25266: '@rFortunately, Mammon''s form can only be seen by the summoner, me.@k@rAnd of course, there''s no need to speak out loud for this conversation.'
25267: '@rAll I have to do is speak inside my mind, so no one can listen in.'
25268: '@r.........Magic, and the friends created by it,@w583. ......might actually not be so bad.'
25269: 'Mammon@r@v42/42700098."These guys, all of them look so scrawny.@k@|@y@v42/42700099. It''s like they''re not even alive.@k@v42/42700100. Kyahahaha."'
25270: 'Ange@r@v11/42000781."Stop it.@k@v11/42000782. If they happen to see you, it''ll be pretty bad..."'
25271: 'Mammon@r@v42/42700101."Humans without a fragment of hopes or dreams are like a lump of anti-magic.@k@v42/42700102. They''ll never be able to see me.@k@|@y@v42/42700103. They''re inferior life-forms who can''t even see.@k@v42/42700104. *giggle*giggle*!"'
25272: 'Ange@r@v11/42000783.".........Are you alright being around so many Humans with that anti-magic toxin?"'
25273: 'Mammon@r@v42/42700105."I''m fine as long as you continue to manifest me, Ange-sama."'
25274: 'Mammon@r@v42/42700106."......Although, you probably have to keep concentrating to do that, so there''s a chance you''ll neglect your daily life.@k@v42/42700107. ......Look, aren''t you being called by that girl you''re sharing a room with?"'
25275: 'Ange@r@v11/42000784."......Huh?@k @v11/42000785..........Ah—"'
25276: '@r@v99/StuFC4012."Ushiromiya-san, are you listening?@k @v99/StuFC4013.It''s us two on duty next week—I wanted to have a little talk..."'
25277: '@r......Probably about pushing a few more chores onto me.@k@rMy roommate, who normally would never even look me in the eye, was smiling at me unpleasantly.'
25278: '@rBut I''ll have a much easier time having the weekly duty pushed onto me and doing it alone, rather than being forced to do it with her.'
25279: '@rThat''s a small price to pay to have her continue to ignore me...'
25280: '@rYet after the shameless excuses,@k she transitioned into pushing a completely different point, insisting on flipping the issue on its head, as if I should have come forward and done it of my own initiative.'
25281: '@r......One of the special traits of this academy is that it''s full of girls who don''t know how to ask a favor.'
25282: 'Mammon@r@v42/42700108."......What''s her problem?@k@v42/42700109. She pisses me off.@k@v42/42700110. I''d love to just gouge her right in the forehead."'
25283: 'Ange@r@v11/42000786."Yes.@k@v11/42000787. I''ll take you up on that sometime."'
25284: '@r...........................@k ......Yeah.@k Having a friend nearby all the time to complain to......makes me happier than I thought it would.'
25285: '@rThe Seven Sisters really were lively when they were all gathered together.'
25286: '@r......I''m sure that just watching them mess around would be a lot of fun.'
25287: '@r......I''ve decided. I''ll do all I can to quickly gain the magical power to summon all of the Seven Sisters at once.'
25288: '@rAnd then I''ll keep training, more and more and more,@w583. ......and summon...@w666.......the thing that I really want to summon.'
25289: 'Mammon@r@v42/42700111.".........?@k @v42/42700112.What is it that you really want to summon, Ange-sama?"'
25290: '@rMammon noticed my conversation with myself inside my head, and asked about it blankly.'
25291: '@rI hesitated over whether to talk about it, but then thought that it wasn''t anything to hide, and told her.'
25292: 'Ange@r@v11/42000788."..................My family.@k@v11/42000789. .........Dad.@k@v11/42000790. Mom.@k@v11/42000791. Onii-chan."'
25293: 'Mammon@r@v42/42700113."So you mean, the souls of the dead...?@k @v42/42700114.Calling forth a resident of another world is called "summoning", but calling back the souls of the dead is "resurrection", and they''re completely different.@k@v42/42700115. ......Resurrection is supposed to be very high-level magic."'
25294: '@rI know.@k ......So much so that even Maria onee-chan can''t do it at all.@k But that''s the thing I most want to call with magic.'
25295: '@r......I''ve been warned that it''s a very difficult high-level magic.@k@r...So great that, in the worst case, I might not necessarily reach that point even after training for my whole life.'
25296: '@rFurthermore, I have no vessel.@k A vessel is something vital for making magic succeed, whether it be summoning or resurrection.'
25297: '@rBecause I don''t have one, .........what would already have been difficult magic instead became hopeless.'
25298: '@rThat''s right.@k I have nothing to remember Mom or Dad by.'
25299: '@rHowever, ......by an extraordinary coincidence...@k@rI do have something to help me remember Onii-chan.'
25300: '@rAnd that''s.........this.'
25301: 'Mammon@r@v42/42700116."......That hair accessory with the pink beads?@k @|@y@v42/42700117.What is that? Sorry to say it, but it looks a little cheap for you."'
25302: 'Ange@r@v11/42000792."Long ago, without telling Dad,@k@v11/42000793. I went with Mom to see Onii-chan, and we went to play at an amusement park.@k@v11/42000794. ......This is a prize from the crane game there."'
25303: '@rI know it''s something cheap, I realize that it doesn''t match my style, and I get that it''s too childish.'
25304: '@r......But this hair accessory is the only thing that makes me feel as though Battler onii-chan is by my side.'
25305: '@rThe inside of the glass case...@khad been filled with plastic capsules packed with fun-looking things.'
25306: '@rIt seemed that each of those capsules had some kind of cute little object inside.'
25307: '@rThe game was to grab those with the crane, ......but I was young, and it was too hard for me.'
25308: '@rNo matter how many times I tried, I didn''t even get close.'
25309: '@rMom told me that whatever was inside was probably cheap anyway, and we didn''t even know what it was,@k so there was no point in getting all upset over it.'
25310: '@rBut whether it was something cheap or not wasn''t the issue.@k ......The process of grabbing happiness with my own hands...@kfelt very important and sacred to me.'
25311: '@rSo I wanted that capsule with its unknown cheap little object more than anything.'
25312: '@rThen, Battler onii-chan came over after finishing with a game where you shoot soldiers with a gun,@w500. ......and had a go in my place.'
25313: '@r...The happiness that was beyond my reach, Onii-chan stretched out for with his longer arms, and he grasped it for me.'
25314: '@r......Onii-chan really was coordinated.@k@rApparently he often played at the arcade with his friends.'
25315: '@rAfter only one or two attempts with the crane, he grasped that thing on the other side of the glass that I hadn''t even been able to touch,@k .........and dumped it into the exit chute.'
25316: '@rWhen Onii-chan tossed me that capsule,@k I remember feeling like I could count on him for anything.'
25317: '@rFor the next several days, I felt like the capsule was too precious to open up.'
25318: '@rThen, one day, I finally opened it.'
25319: '@r......And when I did, what revealed itself from inside was this pink-bead hair accessory.'
25320: '@rSince that day...@kthis has been a symbol of Onii-chan.'
25321: '@rMy young mind thought that getting that four-person family together, with Battler onii-chan included,@k was a precondition for a happy family.'
25322: '@rSo I wanted Onii-chan and Dad to make up quickly.'
25323: '@r......In my own way, I had made this hair accessory a charm to bring my whole family together.@k That''s why I always used to wear it.'
25324: '@rBecause I wanted to feel my reliable, funny, and wonderful onii-chan by my side all the time,@k and give him a place in our house.'
25325: 'Ange@r@v11/42000795."But......my memories of Onii-chan...are so distant.@k@v11/42000796. ......I can''t do it as easily as Maria onee-chan created Sakutarou from a lion stuffed animal."'
25326: 'Ange@r@v11/42000797."......One day, I will learn the high-level magic to revive the souls of the dead.@k@v11/42000798. And the only key, the only vessel, that can make that successful...is this."'
25327: 'Mammon@r@v42/42700118."...........................@k@|@y@v42/42700119. ......I see.@k@v42/42700120. I did feel an incredible magical power from that hair accessory, and that explains it."'
25328: 'Ange@r@v11/42000799."Magical power...?@k @v11/42000800.Magical power resides in this thing of Onii-chan''s...?"'
25329: 'Mammon@r@v42/42700121."Maybe I should say that you are imbuing it with that power.@k@v42/42700122. ......Your strong desire to call your brother to you is giving you magical power."'
25330: 'Mammon@r@v42/42700123."......Resurrection certainly is a high-level magic,@k@v42/42700124. but there can be no mistake that you are steadily and unconsciously climbing the stairs towards that magic."'
25331: 'Ange@r@v11/42000801."............I''m glad.@k@v11/42000802. It''s nice to hear someone other than myself acknowledge that."'
25332: '@rYour own effort isn''t something that you can observe by yourself.'
25333: '@rIn that sense,@k ......even though these words came from a dangerous demon girl who governs one of the seven deadly sins,@k ......they made me very happy.'
25334: 'Mammon@r@v42/42700125."Well, I can''t guarantee that you will attain the magic of resurrection before your life is over.@k@v42/42700126. ......However, your power as a witch will be proportional to the height of the mountain you dare to climb."'
25335: 'Mammon@r@v42/42700127."If you don''t lose heart, I''m sure that one day you''ll be able to rival even our former master,@k@v42/42700128. BEATRICE-sama, as a Great Witch."'
25336: 'Ange@r@v11/42000803."......I wonder if I can.@k@v11/42000804. Become a Great Witch and revive Onii-chan,@v11/42000805. ......no, my family."'
25337: 'Mammon@r@v42/42700129."The Witch of Resurrection, Lady ANGE...!"'
25338: 'Mammon@r@v42/42700130."Kyaah, how wonderful!@k @v42/42700131.A Witch of Resurrection is a very rare kind of witch.@k@v42/42700132. Having a witch like that as my master would make me pretty proud.@k@v42/42700133. Actually, I''d love for that to happen.@k@v42/42700134. Because furniture''s worth is also proportional to the rank of its master!"'
25339: 'Mammon@r@v42/42700135."Please zip right on by BEATRICE-sama and become a Great Witch like the world has never seen!@k@v42/42700136. On behalf of the Seven Sisters of Purgatory, I support you from the bottom of my heart! Kyaha!"'
25340: '@r...............I''d thought that if a magical friend were to appear for me too, I''d like a cute kid like Sakutarou.'
25341: '@rBut even this fifth sister of the frightening Seven Sisters who govern the seven deadly sins was enough to calm my heart this much all by herself.'
25342: '@r......Maria onee-chan probably knew this long ago.@k That''s why she recommended the world of witches to me over and over and over again.'
25343: '@rAnd I kept on stubbornly rejecting it......'
25344: '@rI should have given in and started my training as a witch sooner.'
25345: '@rA year as a child compares with ten in old age...was it...?'
25346: '@rAt this point, I find my past self deplorable for wasting precious time doing nothing but complaining.'
25347: '@rLong after I turned off the lights and slipped into bed, Mammon continued to talk to me beside my pillow.'
25348: '@r......I promise.@k One day, for sure, I''ll develop a magical power that can summon the Seven Sisters.@k And I''ll let them have a lively and fun time.'
25349: '@rThe seven of them make a single whole.@k ......None can be left out.'
25350: '@rFamily must be together.@k@rI must......bring them together.........'
25351: 'Ange@r@v11/42000806."...................................."'
25352: '@rMy awareness began to return slowly.'
25353: '@rI hadn''t been able to stand watching Aunt Rosa and Maria onee-chan''s relationship,@k ......and had run away from Beato and Onii-chan''s game, hadn''t I...'
25354: '@r......I''ve got to go back.'
25355: '@rI''ve got to go back, support Onii-chan, and quickly bring him back from this world and its crazy witch games.'
25356: '@rBecause as long as I''m here, ......I''m not permitted to call myself Ange.'
25357: '@r......Suddenly, I felt someone''s presence.'
25358: '@rWhen I turned around, .........there stood Mammon.'
25359: 'Mammon@r@v42/42700137."Gretel-sama.@k@v42/42700138. BEATRICE-sama says that if you do not return soon, it will become a hindrance to the progression of the game.@k@v42/42700139. I beg that you return swiftly."'
25360: 'Ange@r@v11/42000807."............Thanks.@k@v11/42000808. ...I''ll go back now."'
25361: 'Mammon@r@v42/42700140."Isn''t it great?"'
25362: 'Ange@r@v11/42000809."What is...?"'
25363: 'Mammon@r@v42/42700141."You being able to meet Battler onii-chan."'
25364: 'Ange@r@v11/42000810."..................Sarcasm?"'
25365: 'Mammon@r@v42/42700142."If it sounds that way to you, you can take it that way if you want?"'
25366: 'Ange@r@v11/42000811.".........I''m sorry.@k@v11/42000812. I should accept it literally.@k@|@y@v11/42000813. ...Yes, it is.@k@v11/42000814. Even in this screwed-up world, being able to see Onii-chan makes me happy from the bottom of my heart."'
25367: 'Mammon@r@v42/42700143."And you''ll win against BEATRICE-sama, for your onii-chan''s sake...?"'
25368: 'Ange@r@v11/42000815."Yes.@k@v11/42000816. ......Can''t have him playing around in a world like this forever.@k@v11/42000817. ......It''s about time for him to return home.@k@v11/42000818. That''s why I came to call him."'
25369: 'Mammon@r@v42/42700144."...............Please do the best you can.@k@v42/42700145. Although I can''t support you, seeing as my current master is BEATRICE-sama."'
25370: 'Ange@r@v11/42000819."I know.@k@v11/42000820. Until October 5th, 1986, ...you are BEATRICE''s furniture.@k@v11/42000821. And eventually, you become my friend."'
25371: 'Mammon@r@v42/42700146."And eventually, you throw that friend away.@k@v42/42700147. After all, ......ng, .........ghkh..."@|@y'
25372: '@rMammon moaned as if she had bit her tongue, staggering as she clutched her chest.@k Apparently, the rule applies to people other than me as well.'
25373: 'Ange@r@v11/42000822."Are you alright?@k @v11/42000823.That''s pretty...painful."'
25374: 'Mammon@r@v42/42700148.".....................@k@v42/42700149. ......I do apologize.@k@v42/42700150. G-...Gretel-sama."'
25375: 'Ange@r@v11/42000824."That''s alright.@k@v11/42000825. Thanks."'
25376: 'Mammon@r@v42/42700151.".........?"'
25377: 'Ange@r@v11/42000826."I''m happy.@k@v11/42000827. That I was able to meet Onii-chan.@k@v11/42000828. That''s the answer to your original question.@k@|@y@v11/42000829. .........Well, let''s go back.@k@v11/42000830. If I grumble too much, you''ll get in trouble with your current master."'
25378: 'Mammon@r@v42/42700152."Yes.@k@v42/42700153. Thank you for understanding.@k@v42/42700154. Well then, th"'
25379: 'Ange@r@v11/42000831."..................Mammon?@k @v11/42000832.............Huh?"'
25380: '@rI''m sure Mammon had been about to say "Well then, this way..."'
25381: '@rBut......she stopped dead, as though the film had been torn off.'
25382: '@rIt looked like she had suddenly frozen.'
25383: '@r...Then I noticed.@k She wasn''t the only thing that had frozen.@k@r......Even the air and floating bits of dust had frozen in place.'
25384: '@rA world where it seemed like even time itself had frozen.'
25385: '@r......Yes.@k It resembled what would usually happen just before BERNKASTEL appeared.'
25386: '@rBut the atmosphere was different somehow.@k Then I understood.'
25387: '@r.........It wasn''t BERNKASTEL.@k@r...It was the other witch.'
25388: 'LAMBDADELTA@r@v29/42200001."How are you doing, Ange...?"'
25389: 'Ange@r@v11/42000833."...............LAMBDADELTA.@k@v11/42000834. ......The rule doesn''t apply to you, I see."'
25390: 'LAMBDADELTA@r@v29/42200002."Duh?@k @v29/42200003.Rules exist to bind others.@k@v29/42200004. What kind of idiot would bind themselves with them?"'
25391: '@rBERNKASTEL is a witch who supports me, ......but this girl is different.'
25392: '@rThis witch supports BEATRICE.@k@r...In other words, she''s on the side of the enemy.'
25393: '@rBut there''s some kind of difference between her and BEATRICE.'
25394: '@rThere''s something elusive about LAMBDADELTA''s existence, and BERNKASTEL''s as well.@k ......How should I put it... Maybe like they''re beings from a higher dimension...'
25395: '@rIn any event, I''m still unsure about how to deal with her.'
25396: '@r......The only thing that I''m certain about is that she is my enemy.@k ...No, just knowing that might be enough...'
25397: 'Ange@r@v11/42000835."So, ......do you have some business with me?"'
25398: 'LAMBDADELTA@r@v29/42200005."Kinda.@k@v29/42200006. I was listening in on your conversation and it started to get a bit interesting.@k@v29/42200007. I thought I''d let you hear something good."'
25399: 'Ange@r@v11/42000836."You''re supposed to be my enemy.@k@v11/42000837. I can''t think of any reason for you to tell me something that would benefit me.@k@v11/42000838. ......So the moment I start listening to you, I lose.@k@|@y@v11/42000839. Goodbye, <see you next time>."'
25400: 'LAMBDADELTA@r@v29/42200008."Don''t get the wrong idea.@k@v29/42200009. My opponent is Bern, not you.@k@v29/42200010. ......So it is possible for there to be a topic that benefits both you and me."'
25401: 'Ange@r@v11/42000840.".....................Sorry,@k@v11/42000841. but I don''t feel like listening."'
25402: '@r......That said,@k I probably won''t be released from this frozen time until LAMBDADELTA is happy.'
25403: '@r......That itself might be proof that she''s a higher-dimensional being than me.@k@rI haven''t been given the option of not listening to her.'
25404: '@rAbout the only thing I can do is strengthen my mental guard, and try not to be shaken by anything she says.'
25405: '@rShe''ll probably either try to make me believe something disadvantageous to me,@k or threaten me...'
25406: 'LAMBDADELTA@r@v29/42200011."*giggle*giggle*.@k@v29/42200012. Seriously, you don''t need to get so defensive.@k@v29/42200013. I just came to fix your misunderstanding.@k@|@y@v29/42200014. ......Well, actually, no.@k@v29/42200015. I came thinking I''d tell you about the lie BERNKASTEL told you."'
25407: 'Ange@r@v11/42000842.".........BERNKASTEL.........lied?"'
25408: 'LAMBDADELTA@r@v29/42200016."I''ll bet Bern made it sound like, if you defeated Beato, your big brother would come back?"'
