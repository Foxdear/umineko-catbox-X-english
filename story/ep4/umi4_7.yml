25462: 'LAMBDADELTA@r@v29/42200059."Yes, there''s no lie in that part.@k@v29/42200060. Beato''s game board is perfect.@k@v29/42200061. No matter what moves you make,@k@v29/42200062. the chances of Beato losing are so slim that it''s doubtful you could even dream of it happening once in your life."'
25463: 'LAMBDADELTA@r@v29/42200063."In other words, that chance of winning is so absolutely virtually zero that it could be regarded as infinitely close to zero.@k@v29/42200064. So it''s not really Bern''s fault that she had to say it in such an evasive manner."'
25464: 'LAMBDADELTA@r@v29/42200065."......But I can say for sure that she was tricking you when she let you get your hopes up.@k@v29/42200066. ''Cause, I mean, even if you managed to overcome the astronomical odds and win,@k@v29/42200067. the person your family would return to is not you."'
