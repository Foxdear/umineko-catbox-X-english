25968: '@rSo I continued.'
25969: 'Ange@r@v11/42001059."......That''s right.@k@v11/42001060. There was no point in my life continuing.@k@v11/42001061. ......I was meant to have been taken with them on that day in 1986.@k@v11/42001062. ......And yet, I was the only one who didn''t get to be taken."'
25970: 'Ange@r@v11/42001063."......Why am I here, I wonder?@k@v11/42001064. ...This isn''t the world I''m meant to be in.@k@v11/42001065. ............No one will save me here."'
25971: 'Ange@r@v11/42001066."...For a time, ......I felt as though the fictional friends I created inside myself would save me.@k@v11/42001067. But those friends were nothing more than a delusion, ......and they did no such thing.@k@v11/42001068. After all, this isn''t a fantasy world—it''s the real world."'
25972: 'Ange@r@v11/42001069.".........So, in short, ......up until today, ......I''ve been living in a daydream.@k@v11/42001070. ...Averse to my real classmates, I lived only by interacting with the friends in my delusion.@k@v11/42001071. .........Just now, I split up with those friends.@k@v11/42001072. And here I am."'
25973: 'Ange@r@v11/42001073."............I have no family.@k@v11/42001074. I''ve discarded my friends.@k@v11/42001075. ......There is no longer anything left for me."'
