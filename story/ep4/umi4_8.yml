25531: 'Leviathan@r@v39/42400006."Heyyyy!!@k @v39/42400007.That''s miiine!@k @v39/42400008.Give—it—back!!"'
25532: 'Beelzebub@r@v43/42800025."Nonono, I''m gonna eat i~t!@k @v43/42800026.Asmo, Asmo, pass!"'
25533: 'Asmodeus@r@v44/42900021."Kyaahahahaha!@k @v44/42900022.Levia onee-sama, over here, over here~!"'
25534: '@rI wonder where they swiped it from.@k@rThey were fighting over a donut or something, playing around really loudly.'
25535: 'Satan@r@v40/42500020."HEY!!!!!@|@y@k @v40/42500021.Ange-sama is reading, can''t you be the slightest bit quiet?!"'
25536: 'Lucifer@r@v38/42300020."And yet you''re the loudest one, Satan, silence yourself!!@k @v38/42300021.You cretinous sister!"'
25537: 'Satan@r@v40/42500022."Y-you''re louder than me, Lucifer onee-sama!!@k @v40/42500023.I-is there something you want to say to me?!"'
25538: '@rBy now, I was used to the fights between the eldest and the third-eldest sister.@k It''s a bit funny how they''re both a little hesitant even though they''re so quick to anger.'
25539: '@rThey might be surprisingly similar.'
25540: 'Belphegor@r@v41/42600015."Heh heh.@k@v41/42600016. You ordered us to be noisy, but this is surely too much.@k@|@y@v41/42600017. Should I make them lower the volume a little?"'
25541: 'Ange@r@v11/42000886."............You can all mess around all you want.@k@v11/42000887. It''s a hundred times more pleasant than the shrill laughter in the classroom."'
25542: 'Mammon@r@v42/42700155."Ange-samaa, hurry up, next paaage!@k @v42/42700156.You read really slooww!"'
25543: 'Ange@r@v11/42000888."You like to read, Mammon?@k @v11/42000889.You look like you''d be the most averse to such ordinary things."'
25544: 'Belphegor@r@v41/42600018."Mammon''s domain is greed.@k@v41/42600019. ......That also includes a thirst for knowledge.@k@|@y@v41/42600020. But she tends to want to keep that knowledge all for herself, so when someone gives her a book, she''ll sometimes burn it after reading it so that no one else can—please watch out for that."'
25545: 'Mammon@r@v42/42700157."I like knowing things that no one else knows.@k@v42/42700158. I like being able to do things that no one else can do.@k@v42/42700159. So I like studying and practicing.@k@v42/42700160. Because I want to keep wisdom that no one else knows about all to myself."'
25546: '@rAs Mammon said that, her eyes sparkling,@k she stared transfixed at the open page, reading through it again.'
25547: '@rYou could see the greed that made her even more intent than me on devouring that page.'
25548: '@rAs you can see, my magical power was now much stronger compared to the first day I summoned them.'
25549: '@rI was now at the point where I could summon all of the Seven Sisters of Purgatory at once and still calmly read a book like this.'
25550: '@rThis place, although I couldn''t recall where it was, was a quiet and calm street-side bench.'
25551: '@rThe reason that I couldn''t remember the location of this place was that at the time I visited it, I was very young.'
25552: '@r......Still, I remembered the day we''d walked here, and how much fun it was.'
25553: '@rMom, Dad, ...and even Onii-chan had been there—@kit was a memory of a very rare and very happy day when all the family had actually been together...'
25554: '@rThe people walking by every once in a while weren''t noticing me.@k@rThey were just pleasantly ignoring me and passing by as normal.'
25555: '@rI wasn''t even the slightest bit embarrassed by the Seven Sisters'' shameless outfits,@k because it wasn''t like they were actually being seen by anyone.'
25556: '@rIn fact, I''d gotten pretty used to them.@k Just so long as they didn''t make me wear one.'
25557: '@rI was sitting on a stylish bench, memorizing a timeline for world history.'
25558: '@r......In an academy system where everything is based on collective responsibility, there''s no tolerance for dunces.'
25559: '@rIt seemed that I was lowering the average grade for the class considerably.'
25560: '@rAccording to those extremely intellectual girls,@k if I alone improved my grade, the average would rise drastically.'
25561: '@r......They had been kind enough to show me with a graph drawn with colorful pens on a B4 sheet of drawing paper.'
25562: '@r...Just thinking of the effort it must have taken to draw that was nauseating.'
25563: '@rBut I''d already spat out all of those complaints.@k ......I''d already used those girls to vent all my furious anger and sadness.'
25564: '@rThe Seven Sisters...@k@|@ywere sometimes outraged,@k@|@y sometimes compassionate,@k@|@y and sometimes shared in my sorrows.'
25565: '@r......I was truly happy to have friends with whom I could share those emotions.'
25566: '@rIt''s said that they were originally furniture that existed to carry out BEATRICE''s cruel sacrificial ritual.'
25567: '@r......If that sickening occult message bottle was to be believed,@k ...it seemed that several among them even attacked my family.'
25568: '@rBut I didn''t believe that, and it would be pointless to question them about it.'
25569: '@rThey''re furniture, so all they do is respond to their master''s requests.'
25570: '@rEven if they really had attacked my family, I couldn''t hate them.'
25571: '@r......The one I really hated...@w500....was the Golden Witch BEATRICE.@k@r.........Or else the one at the very center of the Rokkenjima Suspicion,@w666. Aunt Eva.'
25572: 'Mammon@r@v42/42700161."......Ange-sama, hurry up, next page."'
25573: 'Ange@r@v11/42000890."Oh, sorry.@k@|@y@v11/42000891. .........I''m tired.@k@v11/42000892. Mind if I take a break?"'
25574: 'Asmodeus@r@v44/42900023."Kyahaha!@k @v44/42900024.Ange-sama says she''s having a break!"'
25575: 'Beelzebub@r@v43/42800027."Let''s play, let''s play!@k @v43/42800028.Ange-sama, let''s plaaaay!!"'
25576: '@rWhen they noticed that I had interrupted my studying, the most energetic youngest sisters gathered around me.'
25577: '@rThat wasn''t all.'
25578: '@rEven Maria onee-chan and Sakutaro showed themselves.'
25579: '@rThey had probably been very close by, but they must have hid themselves so that they didn''t interrupt my studying.'
25580: 'Sakutarou@r@v33/44200238.''Uryuu!@k @v33/44200239.Ange~!@k@v33/44200240. How''s studying? How''s studying?'''
25581: 'Mammon@r@v42/42700162."Kyaaah!!@k @v42/42700163.Sakutaroo!!@k @v42/42700164.How are yooooouu?!"'
25582: 'Leviathan@r@v39/42400009."Wait a second!@k @v39/42400010.Let me fluffle him tooooooooooo!!"'
25583: 'Lucifer@r@v38/42300022."You snooze you lose, aren''t we always telling you?!@|@y@k @|@y@v38/42300023.Kyaa, so cute, so cute!"@|@y'
25584: 'Sakutarou@r@v33/44200241.''Ukyuuu, you''re crushing meee!@k @v33/44200242.Uryuuu!'''
25585: 'Belphegor@r@v41/42600021."Your luck ran out when you showed up when all of the Seven Sisters were gathered.@k@|@y@v41/42600022. Now accept your fate and be fluffled."'
25586: 'Satan@r@v40/42500024."Come on!@k @v40/42500025.Do you always have to treat him like this?!@k @|@y@v40/42500026.I apologize on behalf of my stupid sisters...!"'
25587: 'Maria@r@v13/40400769."Ahahahahaha.@k@v13/40400770. Sakutaro''s happy to meet all of you too.@k@|@y@v13/40400771. ......Well, Ange?@k @v13/40400772.How''s your studying?"'
25588: 'Ange@r@v11/42000893."Thanks.@k@v11/42000894. Well, not bad."'
25589: 'Ange@r@v11/42000895."They were nice enough to pass me a printout of the test from another class who took it earlier.@k@v11/42000896. Their beautiful sense of solidarity is enough to bring tears to my eyes.@k@v11/42000897. ......Well, at least I''ll do a little better now for putting the timeline into my head."'
25590: 'Sakutarou@r@v33/44200243.''Uryu.@k@v33/44200244. You sure are good at studying, Ange.@k@v33/44200245. You''ll be able to get a lot of points, uryu~~.'''
25591: 'Maria@r@v13/40400773."Good work.@k@v13/40400774. I was completely useless at studying, so I''m jealous of you for being able to get a good score when you study hard."'
25592: 'Ange@r@v11/42000898."You''re joking.@k@v11/42000899. English, Latin, knowledge of the occult—@k@v11/42000900.you''re much more amazing for being able to learn all of that by heart."'
25593: 'Maria@r@v13/40400775."I can remember anything when studying magic, but can''t remember anything boring I have to study.@k@v13/40400776. So it doesn''t help at all for tests."'
25594: 'Ange@r@v11/42000901."Well, I''m sure your occult knowledge would have been a bit like that, but your English and such must have translated into good grades, right?"'
25595: 'Maria@r@v13/40400777."In the first year of elementary school, on a Japanese language test,@k@v13/40400778. there was a question where I was given a picture of a gun and four squares, and it said to write its name in the four squares.@k@v13/40400779. Wrote @brifle.@<ライフル@>—and got it marked wrong."'
25596: 'Ange@r@v11/42000902."Why?@k @v11/42000903.It fits."'
25597: 'Maria@r@v13/40400780."It was supposed to be @bteppou.@<てっぽう@>, the Japanese word for gun.@k@v13/40400781. Got told that it was wrong ''cause you don''t learn katakana in first grade."'
25598: 'Maria@r@v13/40400782."......I didn''t really get it,@k@v13/40400783. so from that day on, on tests, I wrote everything in hiragana.@k@v13/40400784. But got in trouble with Mama for some reason.@k@v13/40400785. Got in trouble with the teachers too."'
25599: 'Ange@r@v11/42000904.".....................@k@|@y@v11/42000905. ...You probably picked the wrong country to be born in, Onee-chan."'
25600: 'Maria@r@v13/40400786."Then I''d have liked to have been born in a country of witches and go to a school of witchcraft.@k@v13/40400787. Uu."'
25601: 'Sakutarou@r@v33/44200246.''And then you might have had a whole lot of even more wonderful magic friends!@k @v33/44200247.Uryuu!'''
25602: 'Maria@r@v13/40400788."Uu♪@k @v13/40400789.But it''s not like I mind it now.@k@v13/40400790. After all, I can use a lot of magic, and I have a lot of magic friends, too.@k@v13/40400791. All I need is Sakutaro."'
25603: 'Sakutarou@r@v33/44200248.''I''m not the only one!@k @v33/44200249.There''s also Sakusuke and Sakukichi, the animal band, Shimoda-kun the seal, Sanae-san the rabbit, Piguo-kun the pig, and plenty more!'''
25604: '@r......Incredible.@k Onee-chan''s friends just keep increasing in number.'
25605: '@rEvery time I ask, the list of her friends'' names grows longer.@k@rBut there''s no doubt that Sakutaro is her best friend.'
25606: '@r...I''m a little jealous of her for having such a close friend.'
25607: 'Maria@r@v13/40400792."......How are they?@k @v13/40400793.The Seven Sisters.@k@v13/40400794. Are you getting along with them?"'
25608: 'Ange@r@v11/42000906."Those sisters are really energetic.@k@v11/42000907. ......They sometimes say worrying stuff, but they aren''t bad.@k@v11/42000908. ...What I really wanted was to get a cute kid like Sakutaro, but now, I think being with these girls is more than enough."'
25609: 'Maria@r@v13/40400795."*giggle*.@k@v13/40400796. If you learned my Magic of Origins more, I''m sure you''d be able to create just the kind of friend you''d like, Ange.@k@v13/40400797. As it is, creation is still a little too hard for you."'
25610: 'Ange@r@v11/42000909."There''s a difference between creation and summoning.@k@v11/42000910. ......And...resurrection is different still."'
25611: 'Maria@r@v13/40400798."...............@k@v13/40400799. So your greatest wish really is to revive your family...?"'
25612: 'Ange@r@v11/42000911."Yeah.@k@v11/42000912. ............I have a vessel for it.@k@v11/42000913. This."'
25613: 'Maria@r@v13/40400800."Yes.@k@v13/40400801. ...I''m sure that hair accessory will become the key to summoning Battler someday.@k@v13/40400802. ......The rest is up to your training, Ange."'
25614: 'Ange@r@v11/42000914."Although not knowing how long that''s going to take makes me cry."'
25615: 'Sakutarou@r@v33/44200250.''Uryu...@k@v33/44200251. Stay strong, even if it''s tough...@k@v33/44200252. If you don''t give up, it will definitely definitely happen someday...'''
25616: 'Ange@r@v11/42000915."I''m sure I''d feel a lot more at ease if someone would just give me some proof of that."'
25617: 'Sakutarou@r@v33/44200253.''Uryu!@k @v33/44200254.Then I''ll guarantee it!@k @v33/44200255.No doubt about it, someday, you''ll be able to make your wish come true!'''
25618: 'Ange@r@v11/42000916."......Thanks.@k@v11/42000917. I''m happy even for consolation."'
25619: 'Sakutarou@r@v33/44200256.''It''s not consolation...uryuu.'''
25620: 'Maria@r@v13/40400803."Stop it, Ange.@k@v13/40400804. That kind of emotion will become the anti-magic toxin.@k@|@y@v13/40400805. The feeling that your dreams will definitely come true is the best seed that buds into magic power."'
25621: 'Ange@r@v11/42000918."............@k@v11/42000919. ......You''re right, sorry, Master."'
25622: 'Mammon@r@v42/42700165."You need to be a bit greedier, Ange-sama.@k@v42/42700166. Go however far for the thing that you desire!@k @v42/42700167.Never give up until you get it! That''s the willpower you''re lacking!"'
25623: 'Sakutarou@r@v33/44200257.''Uryuu!@k @v33/44200258.That isn''t true, Ange is doing her best...!'''
25624: 'Ange@r@v11/42000920."Thanks, Sakutaro, Mammon.@k@v11/42000921. Crying about it won''t help anything.@k@v11/42000922. There''s nothing I can do except hang in there.@k@v11/42000923. I''ll try hard.@k@v11/42000924. Grit my teeth.@k@v11/42000925. And I''ll definitely make my dreams come true.@k@v11/42000926. For certain."'
25625: 'Sakutarou@r@v33/44200259.''Uryu!@k @v33/44200260.You''re awesome, Ange, do your best!@k @v33/44200261.Mammon and I will support youuu!'''
25626: 'Mammon@r@v42/42700168."Yes, we will.@k@v42/42700169. The greedier our master is, the more our worth will increase."'
25627: 'Beelzebub@r@v43/42800029."More importantly, Ange-samaa!@k @v43/42800030.We have ten whole people here, sooo..."'
25628: 'Asmodeus@r@v44/42900025."We were thinking, maybe we could all play shiritori together or something!"'
25629: 'Beelzebub@r@v43/42800031."Penalty if you lose!@k @v43/42800032.Let me nibble your ea~rs!"'
25630: 'Satan@r@v40/42500027."Come on, is there anything inside your head other than food?!"'
25631: 'Lucifer@r@v38/42300024."Please forgive my cretinous sisters'' imbecilic proposals...@k@v38/42300025. Is it really alright for you not to return to your studying about now?"'
25632: 'Leviathan@r@v39/42400011."No, no, nooooooo!!@k @v39/42400012.I waited so long for you to finish studying, you gotta play with us, you gottaaaa!"'
25633: 'Belphegor@r@v41/42600023."I don''t think it''s a bad idea.@k@v41/42600024. I would suggest that playing every once in a while is a good way of exercising the mind."'
25634: 'Ange@r@v11/42000927."............Your domain was sloth, right, Belphe?@k @v11/42000928.What you''re saying sounds reasonable, but you''re actually being sneaky, aren''t you?"'
25635: 'Belphegor@r@v41/42600025."Heh.@k@v41/42600026. My apologies.@k@v41/42600027. ......You are a diligent one, Ange-sama."'
25636: 'Maria@r@v13/40400806."If it''s okay with you, Ange, I''d like to play with everyone, too.@k@v13/40400807. All noisy together.@k@v13/40400808. It''ll definitely be fun."'
25637: 'Sakutarou@r@v33/44200262.''Uryuu!@k @v33/44200263.Ange, Ange, let''s play, let''s play!@k @v33/44200264.Let''s all do shiritori!'''
25638: 'Lucifer@r@v38/42300026."In that case, let''s start from Sakutaro''s "uryu".@k@|@y@v38/42300027. .........What does the next word have to start with in this case?@k @v38/42300028."Ryu"?@k @v38/42300029."Yu"?"'
25639: 'Maria@r@v13/40400809."If it''s "uryu"?@k @v13/40400810................I wonder.@k@v13/40400811. Maybe it really would be "ryu"?"'
25640: 'Ange@r@v11/42000929."......It''s rare for a word that ends weirdly like that to come up."'
25641: 'Mammon@r@v42/42700170."Okay, I''m first then!!@k @v42/42700171.I''ll start from "ryu"!@k @v42/42700172.A "watch ste~m"!"'
25642: 'Leviathan@r@v39/42400013."I wanted to be the one to speak first!@k @v39/42400014."Lute" would have been so much more wonderful!"'
25643: 'Ange@r@v11/42000930."''Zu''?@k @v11/42000931.Feels like we keep getting tough ones.@k@v11/42000932. ...Wait a sec, what order are we going in?@k @v11/42000933.Who''s next?"'
25644: 'Sakutarou@r@v33/44200265.''Uryu.@k@v33/44200266. I don''t think it matters who.@k@v33/44200267. Whoever thinks of something first.'''
25645: 'Maria@r@v13/40400812."Huh, that sounds fun.@k@v13/40400813. The person who can say the most wins?@k @v13/40400814.It''s fast-talking shiritori!"'
25646: 'Beelzebub@r@v43/42800033."OK, I''ll go, then!@k @v43/42800034."Zucchini"!@|@y @v43/42800035."Garlic stir-fry"!@|@y @v43/42800036."Mekabu and pasta"~!@|@y@k @|@y@v43/42800037.All of them delicious!@k @v43/42800038.Kyaha, I said three!"'
25647: 'Belphegor@r@v41/42600028."Belzie takes three points.@k@v41/42600029. ......Can you use conjunctions?"'
25648: 'Satan@r@v40/42500028."If you could use "and" then anything would work!!@k @v40/42500029.That last one doesn''t count!@k @v40/42500030.Minus one point!!@k @v40/42500031.Start over at "me"."'
25649: 'Maria@r@v13/40400815."Okay, my turn.@k@v13/40400816. "Meringue"~!"'
25650: 'Sakutarou@r@v33/44200268.''''Ge''??@k @v33/44200269....U...u...@v33/44200270....uryuu!'''
25651: 'Lucifer@r@v38/42300030."''Drainage system'',@|@y@v38/42300031. "reclaimed land",@|@y@v38/42300032. "basement".@|@y@k@v38/42300033. Something like that?"'
25652: 'Leviathan@r@v39/42400015."Onee-sama, those are all pretty unrefined words, *giggle*!"'
25653: 'Lucifer@r@v38/42300034."S-so what, why don''t you try following up with something refined, then!!@k @v38/42300035.Anyway, that''s three points for me.@k@v38/42300036. The next one''s "tsu", alright, "tsu"!"'
25654: 'Maria@r@v13/40400817."Never played such a weird shiritori before.@k@|@y@v13/40400818. Uu-uu!@k @v13/40400819.Fun!"'
25655: 'Sakutarou@r@v33/44200271.''Uryuu!@k @v33/44200272.I don''t get it at all, but it''s fun.@k@v33/44200273. Uryuu!'''
25656: '@rI''d played normal shiritori before, but this kind of weird shiritori was a new experience for me.'
25657: '@rThe Seven Sisters, who would be lively enough just on their own; Maria onee-chan; Sakutaro; and me.'
25658: '@rI was now surrounded by friends that were just so fun.'
25659: '@r......The courage to accept a world of magic, a world of witches...'
25660: '@r...That alone wouldn''t change the fact that I was locked up in an academy,@k without a single friend in my class.'
25661: '@rBut I was having such a fun and merry time regardless.'
25662: '@r.........I''ll become a witch like Maria onee-chan.'
25663: '@rAnd someday, I''ll add my family to this happy circle.'
25664: '@rMom, Dad.@k And Onii-chan.'
25665: '@r......If possible, George onii-chan and Jessica onee-chan, too.@k And my other relatives.'
25666: '@rI''ll call everyone, everyone here, without a single person missing, ...and we''ll all be gathered together.'
25667: 'Ange@r@v11/42000934."......That is my...dream.@k@|@y@v11/42000935. ......Yes,@k@v11/42000936. and until I make it come true, I''m definitely not going to lose heart."'
25668: 'Mammon@r@v42/42700173."I''m sure you''ll become a Great Witch, Ange-sama.@k@v42/42700174. As long as you believe that.@k@v42/42700175. We Seven Stakes of Purgatory will always serve by your side until that day comes."'
25669: 'Ange@r@v11/42000937."You''ll be there...?@k @v11/42000938.No matter how long,@k@v11/42000939. ......you''ll lend me your strength?"'
25670: 'Mammon@r@v42/42700176."Of course.@k@v42/42700177. After all, I''m your friend, right, Ange-sama?"'
25671: 'Ange@r@v11/42000940."........................@k@v11/42000941. ......Yes, you are.@k@v11/42000942. Let''s always stick together and play together.@k@v11/42000943. Today, and in the future...forevermore."'
25672: 'Mammon@r@v42/42700178."Until the day you can make your dream come true."'
25673: '@rThe lively, ten-person game of shiritori,@k cut off from time alongside the street, under the forever bright warmth of the sun, continued without end......'
25674: '@r@v99/StuFB4005.".........What. The. Hell. Seriously, Ushiromiya-saan?"'
25675: 'Ange@r@v11/42000944.".............................."'
25676: '@r......In the end,@k I wasn''t able to make a very good grade on my test.'
25677: '@rI had thought I''d memorized things, in my own way,@k but if you could manage anything by cramming all night like that, no one would worry about tests.'
25678: '@r@v99/StuFB4006."Normally, when you know the questions beforehand, you''d ace it easily, right? Easily!"'
25679: '@r@v99/StuFC4014."It''s true that we didn''t go so far as to write the answers into the blanks for you.@k@v99/StuFC4015. We thought you''d have the sense to study at least that much."'
25680: '@r@v99/StuFD4028."Oh my God!@k @v99/StuFD4029.No frigging way. This is... God almighty...!@k @v99/StuFD4030.They''re almost all wrong, aren''t they?@k @v99/StuFD4031.Did you really actually study for this?!"'
25681: 'Ange@r@v11/42000945."..................More or less..."'
25682: '@r@v98/RStuFE4001."This isn''t what you call more or less, Ushiromiya-san.@k@v98/RStuFE4002. ......My mind is reeling from how horrible this is."'
25683: '@r@v99/StuFA4008."O Lord.@k@v99/StuFA4009. Please forgive her for getting a miserable grade on such an easy test,@k@v99/StuFA4010. and plummeting the average score for the entire class...!"'
25684: '@r@v98/RStuFE4003."*giggle*giggle*giggle*, *cackle*cackle*cackle*,@v98/RStuFE4004.@|@y ahahahahahahaha."'
25685: '@r......The same test had been given to another class first.@k@rThey had managed to get hold of that test paper, so the average score for this test was unusually high.'
25686: '@rEnough to obscure my slight improvement.'
25687: '@rHowever, ......there were some things that I couldn''t make an excuse for.'
25688: '@rIf I had spent that entire day studying like mad, I might have been able to get a slightly higher score.'
25689: '@r......But I hadn''t gone that far.'
25690: '@rAfter all, after that on that day,@k ......I had spent the time having fun playing shiritori with the Seven Sisters, Sakutaro, and Onee-chan.'
25691: '@rAs expected, the winner had been Maria onee-chan.@k@rShe had been a strong player because of her various bits of random knowledge.'
25692: '@rSakutaro had gotten the penalty.'
25693: '@rHe had spent the whole time cheering for everyone else''s answers,@k and had completely forgotten to think of any himself.'
25694: '@r......Because of that, he got dogpiled by the Seven Sisters and had his ears thoroughly nibbled, didn''t he?'
25695: '@r@v99/StuFB4007."Excuse me, are you listening, Ushiromiya-san?!"'
25696: 'Ange@r@v11/42000946."..........................."'
25697: '@rThey were surrounding me, twittering like small birds.@k@rAnnoying, smelly.'
25698: '@rOn the outside of that circle was Mammon, a weary expression on her face...'
25699: 'Mammon@r@v42/42700179."This school is as messed up as always.@k@v42/42700180. If their own grades are good, shouldn''t they be more than happy?"'
25700: 'Ange@r@v11/42000947.".........It''s probably because of that collective responsibility thing.@k@v11/42000948. Instead of worrying about their own grades,@k@v11/42000949. they''re more concerned about how embarrassing it is for the class average to be low."'
25701: 'Ange@r@v11/42000950."Or maybe it''s because they really really hate the volunteer work they''re forced to do as punishment."'
25702: 'Mammon@r@v42/42700181."So in other words, they aren''t studying because they want their grades to be good,@k@v42/42700182. but because of collective responsibility and because they hate volunteer work?"'
25703: 'Leviathan@r@v39/42400016."......They''re jealous and embarrassed.@k@v39/42400017. They don''t want to be inferior to anyone, and they don''t want to be humiliated.@k@v39/42400018. That''s the only feeling that drives them to study."'
25704: 'Lucifer@r@v38/42300037."What noisy people. If they want to study, why can''t they just do it themselves?"'
25705: 'Belphegor@r@v41/42600030."In the end,@k@v41/42600031. without collective responsibility and volunteer work, they''d have no desire to study.@k@|@y@v41/42600032. ......How foolish it is to study without knowing the meaning of studying."'
25706: 'Satan@r@v40/42500032."Wow, these guys are so annoying and stupid!@k @v40/42500033.Stop disturbing Ange-sama''s precious lunchtime!"'
25707: 'Asmodeus@r@v44/42900026."Waaah, I hate these guyyyys!!@k @v44/42900027.Just go awayyyyy!!"'
25708: 'Beelzebub@r@v43/42800039."I''m huuungryyyyyy!!@k @v43/42800040.Disappear already, waaaah!!"'
25709: 'Ange@r@v11/420009512."..................@k@v11/42000952. .........I''m sorry, everyone.@k@v11/42000953. I wonder why Humans are so despicable."'
25710: 'Mammon@r@v42/42700183."It''s probably because, instead of working hard themselves,@k@v42/42700184. forcing you to put the effort in is the easier way for them to greedily boost the class average.@k@v42/42700185. ......Humans are all greedy.@k@v42/42700186. And they''ll burden others with that to make things easier for themselves."'
25711: 'Mammon@r@v42/42700187."...We''ll eventually be reunited with them on the Mountain of Purgatory.@k@v42/42700188. When they get to the fifth terrace, they better watch their step..."'
25712: '@rMammon controls the fifth terrace of the mountain that reaches to Paradise: Mount Purgatory.'
25713: '@r......Given that she herself was promising them this, we can probably be sure that after those girls die, their journey to heaven will not be an easy one.'
25714: '@r...No, in fact, why don''t they just go to hell.'
25715: '@rThe class committee had applied to the student council to use a classroom during lunch and after school.'
25716: '@rThe purpose of use was for a class study group.@k A wonderful little gathering so that they can all collect around me and make me study. I''m overjoyed.'
25717: '@rWhich meant that every day, I would have all of my lunch and three hours of my afternoon stolen away from me.'
25718: '@rThe academy and its student council, with its motto of student self-government,@k instantly approved of this pleasant activity that the students were taking up of their own initiative...'
25719: '@rIn other words, I would no be longer able to escape after school by leaving the classroom...'
25720: '@rAfter school, the first class study group meeting started right away.'
25721: '@rWould they open a textbook, then kindly and carefully explain so that even I could understand it?@k Of course it was nothing like that naive fantasy.'
25722: '@rAfter school in the classroom, around a dozen of my classmates crowded around my desk.'
25723: '@rFirst, before we started studying...'
25724: '@rWhy were my grades so bad?@k What was the reason?@k@rIt was decided that we couldn''t start until I could clearly answer those questions, become aware of the problem, and show remorse for my actions.'
25725: '@r......Of course, there was no way I had an answer to a question like that.'
25726: '@rThey had avoided me like the plague up until now.@k And they had rejected me and kept me at a distance so as not to include me in their communities.'
25727: '@rSo I had been avoiding their communities myself.@k There shouldn''t have been any conflict between us that way.'
25728: '@rSo even when they formed this community intent on raising the class average,@k I obviously kept well away from it.'
25729: '@rEven if I had tried to join in,@k they would probably have ignored me, just like they had always done in the past.'
25730: '@r@v99/StuFA4011."If you''d just have asked, we''d have taught you as much you wanted.@k @v99/StuFA4012.Wouldn''t weeeee?!"'
25731: '@r@v99/awase0022."""We wouuuuuuuld!!!"""'
25732: '@rSuch enthusiasm.@k ......I''d had enough of their ex-post-facto pretenses of charity.'
25733: '@r@v99/StuFC4017."Ushiromiya-san, the thing that''s bad about you is you''re lacking a cooperative attitude.@k@v99/StuFC4018. You only think about yourself—it''s that selfish way of thinking that''s the problem."'
25734: '@r@v98/RStuFE4006."Those who gather in Saint Lucia''s place of learning shall have a cooperative heart.@k@v98/RStuFE4007. It is written right there in the student handbook, you know?"'
25735: '@r@v99/StuFD4033."I think if you have a cooperative attitude,@k@v99/StuFD4034. that''s what gives birth to the desire to study together and contribute to the entire class.@k@v99/StuFD4035. I think that''s the most fundamental thing that you''re lacking, how about you?!"'
25736: '@r@v99/StuFB4009."Heeey, have you been listening to us?!@k @v99/StuFB4010. We''ve gone to all the trouble of staying after school to have this talk for your sake, you know?!"'
25737: '@r.....................@kThe tears of gratitude are pouring down.'
25738: '@rOf course, they didn''t like that.'
25739: '@r"This way, it almost makes it look like we''re bullying you", they scolded me.'
25740: '@rFortunately, I''m normally all cried out anyway.@k@rIf I''m told not to cry, I can hold it back.'
25741: '@rFirst, I was to write a letter of remorse and read it out loud.'
25742: '@rOf course, they meant today.'
25743: '@rThe class president politely applied to the student council and the staff room for an extension on the use of the classroom.'
25744: '@r......Apparently it was accepted right away.'
25745: '@rWhich meant that, starting now, I would be forced into self-criticism here for at least a full five hours......'
25746: '@r——I, Ushiromiya Ange, caused trouble for my classmates by getting a low score on my test.'
25747: '@r@v98/RStuFE4008."That''s not iiiiiit!!"@|@y'
25748: '@r@v99/StuFB4011."You getting low grades and causing us trouble isn''t the root of the problem, right?!"'
25749: '@r@v99/StuFC4019."It''s a cooperative attitude, a cooperative attitude!!"'
25750: '@r@v99/StuFD4036."Come ooon!!@k @v99/StuFD4037.Why do we even have to guide you on how to write a letter of remorse?!"'
25751: '@rTheir abusive jeers flew about one after another.'
25752: '@rI followed their "guidance" and put the eraser to it.'
25753: '@r——I, Ushiromiya Ange, caused trouble for my classmates by not having a cooperative attitude.'
25754: '@r@v99/StuFB4012."Hey, wait a sec, it''s pointless if you just write whatever we say!"'
25755: '@r@v99/StuFD4038."Do you even frigging know what "remorse" means?!"'
25756: '@r@v99/StuFC4020."It''s pointless if you don''t write it in your own words, pointless!"'
25757: '@r@v98/RStuFE4009."I''ve always thought you were a bit strange, Ushiromiya-san, but you really are an odd one!@k @v98/RStuFE4010.*giggle*giggle*giggle*!"'
25758: '@rEven following their guidance didn''t change the jeers much; in fact, now it felt like they were mocking me more as well...'
25759: '@rIn this way, over the following several hours, without rest, without being allowed to go to the bathroom,@k of course without being permitted to have dinner, and while being continuously insulted...'
25760: '@r......I was coerced into writing a document which humiliated myself......'
25761: '@rAnd as it passed nine at night, ......I was told to stand up and read it aloud.'
25762: '@rThe contents...@w500....were smeared black with tears and eraser marks.'
25763: '@rIt certainly was my handwriting,@w583. ......but it was like a list of soulless letters,@w666. whose contents I couldn''t even remember.'
25764: '@rEverything had been copied down according to their guidance.'
25765: '@rSo while I had been the one to write the letters, they weren''t my words.'
25766: '@rI was being coerced into writing it down, and even coerced into reading it aloud.'
25767: '@r.........I was surprised to find that even after all this time, in addition to ignoring someone and hiding their things,@k there were still other ways, like this, to bully people......'
25768: '@r@v98/RStuFE4011."Come onnn!@k @v98/RStuFE4012.Hurry up and read it out!!"'
25769: '@r@v99/StuFD4039."Look how many people are staying this late just for you, Ushiromiya-san.@k @v99/StuFD4040.How about a little gratitude?"'
25770: '@r@v99/StuFB4013."Isn''t the fact that she doesn''t feel gratitude for that indicative of her not having a scrap of cooperative attitude?"'
25771: '@r@v99/StuFA4013."It''s alright, Ushiromiya-san.@k@v99/StuFA4014. We''ll always be with you from now on.@k@v99/StuFA4015. Why not study with us and remake yourself?@k @v99/StuFA4016.Okay?"'
25772: '@r@v99/awase0023."*giggle*giggle* "Ahahahahaha "Kyahhhyahyahyahya!!"""@|@y'
25773: '@rStill surrounded by them, I stood from my seat......and dropped my gaze towards the blackened page.'
25774: '@rAnd then......I began to speak those humiliating words,@k but right away, jeers flew at me saying that they couldn''t hear and to speak up.'
25775: '@r...............I can''t read this.'
25776: '@rI had no idea...@kthat being forced to read a paragraph humiliating me would be so painful.'
25777: '@rMy throat shook.@k My fingertips shook.@k ......The paragraph of humiliation written in my own handwriting made my eyes burn with a hot liquid.'
25778: '@rSo my world blurred and twisted.'
25779: '@rThe girls surrounding me all appeared warped.'
25780: '@r......I saw them warped into exactly the impression I had of them.'
25781: '@rIn other words, ......this was the correct view.'
25782: '@rBeyond that twisted crowd of people, ......I could see my friends.'
25783: '@rCompassion could be seen in all of their eyes.'
25784: 'Maria@r@v13/40400820.".........Ange, .........stay strong..."'
25785: 'Sakutarou@r@v33/44200274.''Uryuu.........'''
25786: '@rMaria onee-chan and Sakutaro were looking at me with sad eyes.@k@rPerhaps because they realized that even cheap words of compassion would hurt me.'
25787: '@r......They kept alternating between trying to say something, and hanging their heads.'
25788: 'Asmodeus@r@v44/42900028."What the hell''s wrong with these people...!!"'
25789: 'Beelzebub@r@v43/42800041."They''re such dirtbags!@k @v43/42800042.Really pisses me off!@k @v43/42800043.What''s so fun about ganging up on Ange-sama and tormenting her?!"'
25790: 'Leviathan@r@v39/42400019."The resentment of not being able to spit out their jealousy.@k@v39/42400020. Anyone would do, just as long as they can spit it out.@k@v39/42400021. They''re the worst."'
25791: 'Satan@r@v40/42500034."Ange-sama!@k @v40/42500035.In this kind of situation, going mad with rage for the sake of your own honor is perfectly acceptable!!@k @v40/42500036.Anger is an appropriate emotion and an appropriate reaction!@k @v40/42500037.If you don''t get mad now, when are you going to?!!"'
25792: 'Lucifer@r@v38/42300038."Stop it, don''t stir Ange-sama up with cheap anger!!@k @v38/42300039.If Ange-sama could do that, she would have done it already!!"'
25793: 'Belphegor@r@v41/42600033."...............If the situation could improve by you getting angry, then that is what you should do.@k@v41/42600034. However, objectively speaking, that would only serve to aggravate the situation further.@k@v41/42600035. ......It may be humiliating, but the wisest thing to do now is to withstand it."'
25794: 'Mammon@r@v42/42700189."Ahha!@k @v42/42700190.You really are a sloth, Belphe-nee!@k @|@y@v42/42700191.Screw that, I can''t stand this!!@k @v42/42700192.I can''t forgive them!!"'
25795: 'Sakutarou@r@v33/44200275.''...E-everyone, settle down...@k@v33/44200276. You''re putting a burden on Ange...'''
25796: 'Mammon@r@v42/42700193."A burden?!@k @v42/42700194.What are you talking about? Is this the time or place to be calm?!@k @v42/42700195.We furniture are not so cruel as to be able to coolly watch our master being humiliated!!"'
25797: 'Satan@r@v40/42500038."Ange-sama!!@k @v40/42500039.You have no obligation to read such a humiliating essay!@k @v40/42500040.If you can''t let out a cry of rage, then at least throw that insulting message onto the floor!!"'
25798: 'Mammon@r@v42/42700196."You don''t need to trash-talk them, you don''t need to yell so loud that they bend over backwards!@k @|@y@v42/42700197.Just throw that notebook on the floor with all your might...!!@k @v42/42700198.That''s all you need to do to show how strong-willed you are!!"'
25799: 'Lucifer@r@v38/42300040."Don''t be so irresponsible!!@k @v38/42300041.I told you already!@k @v38/42300042.If Ange-sama could do that, she would have done so long ago!!"'
25800: 'Belphegor@r@v41/42600036."Nothing will be resolved by the eruption of momentary emotions.@k@v41/42600037. Why don''t you understand that doing that will only worsen the criticism Ange-sama is receiving?!"'
25801: 'Asmodeus@r@v44/42900029."Waaaaaaaaaaaaahh!!@|@y@k @v44/42900030.Why is this happening to Ange-sama when she didn''t do anything wrong?!"'
25802: 'Beelzebub@r@v43/42800044."Not letting her eat dinner, and making her stay so long after school! I hate iiiiiiiiiiiiit!!"@|@y'
25803: 'Satan@r@v40/42500041."And it''s not just tonight, it''s tomorrow and the day after too!!@k @v40/42500042.Give me a break! I can''t bear this humiliation!!"'
25804: '@r@v99/StuFB4015."Excuse me!! Are you actually listening to us?!"'
25805: '@rSomeone tugged at my hair.@k@r......I was pulled back into miserable reality.'
25806: '@r...I was no longer even permitted to listen to the Seven Sisters expressing my inner thoughts on my behalf.'
25807: '@rMy hair was lifted upwards, one of my hair ornaments came off, and I heard it bounce and then roll on the ground.'
25808: '@r......No one picked it up.'
25809: '@rTo the contrary, they casually avoided it as though something filthy had come rolling towards them.'
25810: '@rI tried to follow it with my eyes, but my hair was tugged upwards again.'
25811: '@r@v99/StuFC4022."Why is it that you''re never listening, even though we''re trying to have a real serious talk with you?!"'
25812: '@r@v98/RStuFE4014."In one ear and out the other, is it?@k @v98/RStuFE4015.Or maybe we''re talking to a brick wall?!@k @v98/RStuFE4016.Get a grip, alright?!"'
25813: '@r@v99/StuFC4023."Are you really conscious of the trouble you''re causing all of us?@k @v99/StuFC4024.You better not be about to say you just wrote that grudgingly because we told you to!"'
25814: '@r@v99/StuFA4017."Until you can really feel remorse by yourself, this seriously isn''t gonna end, get it?!@k @v99/StuFA4018.It''s not just gonna be today.@k@v99/StuFA4019. This is seriously gonna keep on going tomorrow and the day after, you got that?!@k @v99/StuFA4020.I''m warning you, don''t push your luck with us!!"'
25815: '@r@v99/StuFD4042."Like, more to the point, what are you even still alive for?@k @v99/StuFD4043.Could you guys go on like this?@k @v99/StuFD4044.If it were me, I''d just die!"'
25816: '@r@v99/StuFC4025."Yeah, I could never live this way!@k @v99/StuFC4026.Think about it, just by being alive, you''d be getting in other people''s way all the time, right?@k @v99/StuFC4027.If it were me, I definitely couldn''t live on!"'
25817: '@r@v99/StuFB4016."Yeah, yeah, I''d die too.@k@v99/StuFB4017. If that''s better for the world, I''d die on the spot!@k Wouldn''t yooooou?!!"'
25818: 'Ange@r@v11/42000954.......Then die.'
25819: 'Mammon@r@v42/42700199."Ange-sama......"'
25820: 'Ange@r@v11/42000955."Kill them all, immediately!!@k @v11/42000956.Lucifer, did you hear me?!"'
25821: 'Lucifer@r@v38/42300043."Huh?! ......Ah..."'
25822: 'Ange@r@v11/42000957."You Seven Sisters of Purgatory are incredible furniture that can massacre mere Humans in a flash, right?!@k @v11/42000958.You''re always boasting about it to me!!"'
25823: 'Ange@r@v11/42000959."Then do it!@k @v11/42000960.Kill them all right now!!@k @v11/42000961.Right here, right now!!"'
25824: 'Lucifer@r@v38/42300044.".........But..............."'
25825: '@rFor some reason, Lucifer''s speech faltered.'
25826: 'Ange@r@v11/42000962."......Why?@k @v11/42000963.What''s wrong?!@k @v11/42000964.You''re certain-kill furniture that can fly around faster than the eye can see, and instantly strike through the hearts of the witch''s enemies, aren''t you?@k @v11/42000965.And I am giving you an order as your master!!"'
25827: 'Ange@r@v11/42000966."Carry it out right away!@k @v11/42000967.Kill them!!@k @v11/42000968.KILL THEM AAAAAAAAAAAAAAAAAALL!!"'
