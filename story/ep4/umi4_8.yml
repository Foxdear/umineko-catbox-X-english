25829: '@rIf they had immediately followed my brutal order, and left corpses strewn all around me...'
25830: '@r......I would have been ready to rue my own reckless actions of stealing human lives so readily—I was ready to regret and feel remorse, just as they had wanted me to.'
25831: '@rI was prepared to go through that.'
25832: '@rAnd yet, Lucifer just let an unsure expression rise to her face, and didn''t move to carry out my order.'
25833: '@r..................I was aware.'
25834: '@rOf course I was.@k ......Vaguely.@k@rNo, that''s not it.@k ......I knew it from the very beginning.'
25835: '@rI knew, didn''t I......that magic was all empty......'
25836: 'Ange@r@v11/42000969."......The Seven Sisters of Purgatory? Yeah, right...@k@v11/42000970. ......Worthless, worthless...@k@v11/42000971. ............I knew it from the very beginning......"'
25837: 'Lucifer@r@v38/42300047."............A-......Ange-sama...@k@|@y@v38/42300048. ............g—... ————......!!!"@|@y'
25838: '@rI glared into the worthless Lucifer''s eyes.'
25839: '@r...And it seemed that pain accompanied that stare.@k@rAs though she had been struck by a horrendous headache, Lucifer clutched her head with both hands.'
25840: '@rBut it looked like she couldn''t tear her eyes off my glare.@k@r......So the pain assaulting her grew more and more intense.'
25841: 'Ange@r@v11/42000972."......................................."'
25842: 'Lucifer@r@v38/42300049."Guhgggg, a......ghhhgaaa, agaa.........!!@|@y@k @v38/42300050.Ahghhk!!!"@|@y'
25843: 'Ange@r@v11/42000973.You are useless, useless......!!@k @v11/42000974.I HATE you!!@k @v11/42000975.Disappear...!!@k @v11/42000976.You''re nothing but a delusion inside my head...!!!'
25844: '@rHopelessness and disappointment.@k Resignation and a dream''s end.@k A cracking sound, like you''d hear from a frozen lake''s surface during a fierce winter, rang out just once.'
25845: '@rSimultaneously, Lucifer''s form, tormented by violent pain, stiffened in place and grew cloudy.'
25846: '@r......It was almost as though a beautifully polished glass window...@khad been heartlessly smashed and turned white from the countless cracks.'
25847: '@rAnd that was an accurate analogy.@k At some point, Lucifer''s form had turned into a glass ornament of the same shape.'
25848: '@rCountless fissures ran through it from the inside, and the head and arms fell to pieces as it crumbled to the floor.'
25849: 'Asmodeus@r@v44/42900031."Hiiyii?!!"'
25850: 'Beelzebub@r@v43/42800045."L-Luci-nee...!!"'
25851: 'Ange@r@v11/42000977."............Who''s the second sister...?@k @v11/42000978.Leviathan?@k @|@y@v11/42000979.Carry out my order.@k@v11/42000980. Kill them all right NOW!!"'
25852: 'Leviathan@r@v39/42400022."W-well, um!@k @v39/42400023.......Err, Ange-sama...@k@v39/42400024. ......Please calm your heart and listen...@k@v39/42400025. We, umm,@|@y@v39/42400026. ......... ———...@|@y@v39/42400027.mmgwaaGHHggggggah——@|@y@v39/42400028.GAHAGH!!"@|@y'
25853: '@rI''m not looking for excuses or back talk or a reply.@k@r......I want nothing more than a swift confirmation of my order to eradicate the girls who are humiliating me.'
25854: '@rIf you''re going to say anything else, there''s no need for me to listen until the end.'
25855: '@rAfter Leviathan turned white from the vast number of cracks throughout her whole body,@k frozen in a bent-backwards pose, she toppled over, and her fragile neck, hips and arms broke into separate parts.'
25856: '@rIt would have been less brutal if they had just smashed to smithereens instead of retaining their original form.'
25857: '@rSo the fact that I had left the two of them partially intact...@kmade the remaining younger sisters shake even harder...'
25858: 'Ange@r@v11/42000981."......Why won''t you listen to my orders...?@k @v11/42000982.Why?@k @v11/42000983.WHY?!!"'
25859: 'Satan@r@v40/42500043."M-my apologies...!!@k @v40/42500044.H-here, under the current conditions, the anti-magic power is...e-extremely strong...and—"'
25860: 'Ange@r@v11/42000984."What.@k@v11/42000985. You can''t do it because Humans are here? That''s your logic?@k @|@y@v11/42000986.Isn''t killing Humans what you do?!@k @v11/42000987.If you can''t do that, then WHAT USE are you as furniture?!!@k @v11/42000988.DIE!!!"'
25861: 'Satan@r@v40/42500045."Hiii—!!"'
25862: 'Satan@r@v40/42500046."P-please, spare me, Ange-samaaaaa......ah,@v40/42500047. nghk,@v40/42500048. ghhgaaaah, khack!!"@|@y'
25863: '@rAs she clutched her head with both arms, Satan also turned white and fell down face first.'
25864: '@rThe neck really did seem to be the most fragile part.@k@rHer head broke off weightily and rolled over to Belphegor''s feet.'
25865: 'Ange@r@v11/42000989."You can''t do it because there are too many Humans?@k @v11/42000990.Then if I were to call them into the shadows later one by one,@k@v11/42000991. you''re saying you guys could make a bloodbath of all of them?"'
25866: 'Belphegor@r@v41/42600038."......With your current magical power, it may be easy for you to converse with us.@k@v41/42600039. However, you still lack the training in magical power to manifest us in front of all of the Humans here...!"'
25867: 'Belphegor@r@v41/42600040."I deeply understand your anger, but even if you could use us to attack,@k@v41/42600041. murdering everyone here would only make the situation worse...!@k @v41/42600042.I do think it humiliating, but please, if you could control your anger for the time being—"'
25868: 'Belphegor@r@v41/42600043.".........ggg, gah,@|@y@v41/42600044. ......ghhhhh...ggg...gaHAGHHH!!"@|@y'
