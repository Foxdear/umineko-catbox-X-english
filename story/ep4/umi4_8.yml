25960: '@r.........I...slowly nodded.@k ...I admitted it.'
25961: '@rI admitted that I had been spending my time in a waking dreamland, trying to remain separate from the others in my class.'
25962: '@r......Those "friends" who had spoken to me with such kind and hopeful words,@k yet who couldn''t offer me any help at all now in the moment I truly wanted it—@kto move on from them and to sully them,@k ......I admitted it.'
25963: 'Ange@r@v11/42001055."...I, Ushiromiya Ange, caused trouble for my classmates by not having a cooperative attitude.@k@v11/42001056. The reason for it is nothing more or less than my excessive inferiority complex towards all of my classmates because of my inability to study.@k@v11/42001057. And.............................."'
