24110: '@rThe door was forcefully flung open, and Rosa flew in with Maria.'
24111: 'Rosa@r@v12/41400069."Is Genji-san or anyone here...?!@k @v12/41400070.It doesn''t matter who, someone bring us a bath towel...!!"'
24112: '@rIt was already a full-blown typhoon outside, and it was starting to pour down hard.@k@rThough she had at least been using an umbrella, Maria had been in the rose garden amid all that wind and rain the whole time.'
24113: '@rShe had grown ice-cold.'
24114: '@rMaria had gotten into a minor fight with Rosa in the rose garden, and had been told to stay there forever.'
24115: '@r......She had done as she was told, and had continued to remain in that spot even after the rain started.'
24116: '@rRosa certainly had gotten a little emotional and angry,@k but Maria''s stubborn demands were probably more at fault.'
24117: '@r......The cousins, who had unfortunately been witness to that exchange,@k were relieved to see the mother and child close to each other again.'
24118: '@rRosa towelled Maria''s head dry.@k She seemed overcome with worry that Maria might catch a cold, but Maria herself was nonchalant.'
24119: 'Rosa@r@v12/41400071."Are you alright?@k @v12/41400072.You didn''t catch a chill, did you?@k @v12/41400073.Maybe we really should go back quickly and get a change of clothes..."'
24120: 'Maria@r@v13/40400294."Uu, I''m fiiiine!@k @v13/40400295.And I''m hungry, so food is better than change of clothes, uu!"'
24121: 'Battler@r@v10/40100225."Hahahaha.@k@v10/40100226. She seems fine, Auntie Rosa.@k@v10/40100227. She''s gotta be alright if she''s got that much bounce."'
24122: 'George@r@v07/40300009."It''s a really good thing she had an umbrella.@k@v07/40300010. ......I was thinking she might be soaked to the bone.@k@|@y@v07/40300011. The fact that she was holding on to an umbrella is one consolation, at least."'
24123: 'Jessica@r@v04/40200003."But Maria!@k @v04/40200004.Even if you''ve got an umbrella, you have to get some shelter if it starts pelting down like this, got it?@k @v04/40200005.Little girls shouldn''t ever let themselves get cold."'
24124: 'Maria@r@v13/40400296.".........Uu."'
24125: 'Rosa@r@v12/41400074."It''s alright, Jessica-chan.@k@|@y@v12/41400075. ......It''s Mama''s fault for telling her to stay there.@k@v12/41400076. I''m really sorry, I''m really sorry...!!"'
24126: 'Maria@r@v13/40400297."Uu!@k @v13/40400298.I''m a good girl?@k @v13/40400299.Good girl for doing what Mama said?@k @v13/40400300.Stayed there even though it was cold, stayed there until Mama came!@k @v13/40400301.Uu-uu!"'
24127: 'Rosa@r@v12/41400077."Yes, you really are a good girl, Maria.@k@v12/41400078. You did exactly what Mama told you...@k@v12/41400079. You really did well.@k@|@y@v12/41400080. But next time, even if Mama tells you to do something, you find some shelter if it starts raining like that.@k@v12/41400081. Alright...?@k @v12/41400082.Promise Mama."'
24128: 'Maria@r@v13/40400302."Uu.@k@v13/40400303. Promise Mama.@k@v13/40400304. ......Uu☆"'
24129: '@rAs Rosa gently held Maria, they joined their pinkies together and promised.'
24130: '@rBattler and the others could tell that by this bonding between mother and child, expressed through a single little finger,@k the warmth was starting to return to Maria''s body.'
24131: 'Rosa@r@v12/41400083."Kanon-kun, thanks for the towel.@k@v12/41400084. That really helped."'
24132: 'Kanon@r@v16/40600001."......Then, if you would excuse me."'
24133: '@rKanon bowed with a blank expression, as though he had done nothing that required gratitude, then left the parlor.'
24134: 'Rosa@r@v12/41400085."......Alright, it''s already dinnertime.@k@v12/41400086. Let''s all go together.@k@v12/41400087. ......Maria, you can even have half of my dessert too for being so good."'
24135: 'Maria@r@v13/40400305."Uu!@k @v13/40400306.Really, Mama?!@k @|@y@v13/40400307.Uu-uu, get dessert, uu-uu-uu♪@k @v13/40400308.Love you Mama, love you Mama!"'
24136: 'Rosa@r@v12/41400088."Now now, Maria, don''t jump around.@k@|@y@v12/41400089. Mama loves you too, Maria.@k@v12/41400090. Love you Maria, love you Maria."'
24137: 'Maria@r@v13/40400309."Me too, love you Mama, love you Mama!@k @v13/40400310.Uu-uu-uu-uu!"'
24138: 'Rosa@r@v12/41400091."Uu-uu-uu-uu♪"'
24139: '@rRosa and Maria looked really happy together.@k Even the cousins watching started to feel a somehow familiar warmth filling up their chests.'
24140: 'Battler@r@v10/40100228."......You know, that might be the age when you''re on the best terms with your parents."'
24141: 'Jessica@r@v04/40200006."It wasn''t like that for me.@k@v04/40200007. Like Mom and stuff, always yelling at me to study, study, study."'
24142: 'George@r@v07/40300012."That''s because they love their children.@k@v07/40300013. A parent''s love isn''t always gentle and indulgent.@k@|@y@v07/40300014. My mother was strict with me too, but by now I realize that it was because she treasured me so."'
24143: 'Maria@r@v13/40400311."Uu-uu-uu!@k @v13/40400312.Love you Mama, love you Mama!"'
24144: 'Rosa@r@v12/41400092."Love you Maria, love you Maria♪ So, shall we get some food?@k @v12/41400093.Let''s be friends and hold hands."'
24145: 'Maria@r@v13/40400313."Uu!@k @v13/40400314.Be friends and hold hands!@k @v13/40400315.Mama and Maria, friendly friendly♪"'
24146: 'Rosa@r@v12/41400094."Yes, that''s right.@k@v12/41400095. Mama and Maria are friends.@k@v12/41400096. Forever and ever.@k@v12/41400097. I love you, Maria..."'
24147: 'Battler@r@v10/40100229."...............The hell was that?@k@v10/40100230. ...What happened?"'
24148: '@rThe sudden sound had come from the teacup Gretel had been holding, which had fallen and smashed.'
24149: 'Ange@r@v11/42000480.".........Sorry.@k@v11/42000481. I was out of it for a moment.@k@v11/42000482. Sorry for dropping it."'
24150: '@rThe cup on the floor was broken into tiny pieces.'
24151: '@r......Would it really have made such a sound and smashed into so many pieces just by being dropped from that height?'
24152: '@rEven someone as obtuse as Battler could realize that she was in a bad mood over something,@k but he couldn''t understand why she had suddenly grown so displeased.'
24153: '@rWhen she made to bend over and pick up the pieces of the cup, Ronove appeared out of nowhere and stopped her.'
24154: 'Ronove@r@v31/43100041."Please, you will injure yourself.@k@v31/43100042. Leave the cleaning-up to me.@k@v31/43100043. Shall I bring you another cup...?"'
24155: 'Ange@r@v11/42000483."......No thanks.@k@v11/42000484. .........I guess a demon''s black tea just doesn''t suit my tastes."'
24156: 'BEATRICE@r@v27/40700190."Hoh.@k@v27/40700191. To think that there is someone whose tastes aren''t satisfied even by Ronove''s tea.@k@v27/40700192. I must respect your discerning palate."'
24157: 'Ange@r@v11/42000485.".........I''m getting bored, so I''ll go out for a bit."'
24158: 'Battler@r@v10/40100231."Bored?@k @v10/40100232.Wait a sec, but things are just about to get started.@k@v10/40100233. At this point, Maria''s probably going to say that she got an umbrella and a letter from BEATRICE again, you know?@k @v10/40100234.This is the critical part—"'
24159: 'Ange@r@v11/42000486."You''ll have to excuse me.@k@v11/42000487. Sorry, someone clean up this mess."'
24160: 'Ronove@r@v31/43100044."Leave it to me."'
24161: '@rWithout saying anything else, Gretel disappeared of her own accord.@k Her form literally melted and disappeared into thin air...'
24162: '@rThere had definitely been a displeased expression on her face.'
24163: '@rBut neither Battler nor Ronove, nor of course Beato either, could understand why her mood had so suddenly worsened.'
24164: '@rAll that remained was the fragrance of the black tea she had spilled...'
24165: '@r.........It felt very unpleasant.'
24166: '@rNo, to be even more blunt, it made my skin crawl.'
24167: 'Maria@r@v13/40400316."Uu...?@k @v13/40400317.......Why are you so irritated, Ange......?"'
24168: 'Ange@r@v11/42000488."Why?!@k @v11/42000489.Isn''t it obvious...?"'
24169: 'Maria@r@v13/40400318."Uu.@k@v13/40400319. ...Not to me......"'
24170: '@rEven Maria onee-chan, with that blank expression on her face, ...irritated me.'
24171: '@rI held my hands palms-up in the empty air, and from out of nowhere, a single book landed upon them with a thump.'
24172: '@r.........It was Maria onee-chan''s diary.'
24173: '@rEven though there was no wind, the pages flipped and flipped without me turning them,@k and opened the door to Maria onee-chan''s world.'
24174: 'Maria@r@v13/40400320."......Why do you think that I''m not happy, Ange?"'
24175: 'Ange@r@v11/42000490."............By thinking about it objectively."'
24176: 'Maria@r@v13/40400321."Objectively from your perspective, right?"'
24177: 'Ange@r@v11/42000491.".....................@k@|@y@v11/42000492. ......Are you trying to say that the truth is different for me and you?"'
24178: 'Maria@r@v13/40400322."Truth changes its form depending on the observer.@k@v13/40400323. And observers from the future always overwrite that form.@k@v13/40400324. .........Ange, what do you want with my happiness...?"'
24179: 'Ange@r@v11/42000493.".............................."'
24180: '@rThe pages of the diary were flipped through at greater and greater speeds...@k@rThen a brilliant light poured out from the depths of the diary, ......swallowing everything up and painting over it all with white.'
24181: 'Rosa@r@v12/41400098.".........Sorry, Maria.@k@v12/41400099. Mama has a mountain of work that needs to be urgently taken care of, so I''m going to be confined to my workplace for a while.@k@v12/41400100. ......I probably won''t be able to come back home until late at night the day after tomorrow."'
24182: 'Maria@r@v13/40400325."......Uu.@k@v13/40400326. ......Then, what about the promise to go to the movies together on Sunday......?"'
24183: 'Rosa@r@v12/41400101."The movies...?@k @v12/41400102.Uhh—"'
24184: '@rJudging by Rosa''s tone, she had clearly forgotten that promise.'
24185: '@rBut Maria''s response to that was an apology for asking...'
24186: '@r............I''m sorry.'
24187: '@rMaria apologized for troubling her mother by asking that question......'
24188: 'Maria@r@v13/40400327.".........I''ll stay home.@k@v13/40400328. I''ll behave myself and wait.@k@v13/40400329. ......I''ll take a bath every day and change my underwear."'
24189: 'Maria@r@v13/40400330."...I know where the money is.@k@v13/40400331. ......I''ll go to a different store every day.@k@v13/40400332. I''ll make sure not to go out too late.@k@v13/40400333. If a policeman asks, I''ll say I''m running errands for Mama.@k@v13/40400334. ......I''ll say it just like you told me to."'
24190: 'Rosa@r@v12/41400103."...........................@k@v12/41400104. ......That''s right.@k@v12/41400105. You be a good girl.@k@v12/41400106. If you''re good, I''ll buy you a present.@k@v12/41400107. Listen now.@k @v12/41400108.Go to bed by nine o''clock.@k@v12/41400109. Make sure not to tell your teacher or any grown-ups that Mama hasn''t come home.@k@v12/41400110. Alright......?"'
24191: 'Maria@r@v13/40400335."..................''kay.@k@v13/40400336. ......I will, so, Mama, work hard, okay?@k@v13/40400337. ......Work hard, finish your work......and come back as fast as you can..."'
24192: 'Maria@r@v13/40400338."I......won''t cry during the night and annoy the neighbors anymore......@k@v13/40400339. ......So, come back soon........."'
24193: 'Rosa@r@v12/41400111."..................@k@v12/41400112. ......Well then, I''m busy, so I''ll hang up now.@k@v12/41400113. ...Be a good girl and wait patiently.@k@v12/41400114. Don''t do anything foolish.@k@v12/41400115. See you."'
24194: '@rClick.@k ......Using a tone that indicated she was wrapping up the call, Rosa hung up the phone without waiting for Maria''s answer.'
24195: '@rMaria neatly set down the receiver and returned to the sofa.@k@rThere sat the stuffed animal Sakutaro, who had been watching TV with her until a second ago.'
24196: '@rSakutaro was clutching the remote control to the TV.@k@r......She had turned off the TV temporarily because of the phone call.'
24197: '@rHe looked like he was asking her to turn the power on again because he wanted to quickly get back to watching TV.'
24198: 'Maria@r@v13/40400340."...............Sakutaro.@k@v13/40400341. ......Did you want to watch...TV?"'
24199: 'Sakutarou@r@v33/44200051.''......Uryu?@k @v33/44200052.You don''t want to watch anymore, Maria...?@k @v33/44200053.If the entertainers'' team gets all the questions right, they might turn everything around.@k@v33/44200054. Uryu~!'''
24200: 'Maria@r@v13/40400342.".........No.@k@v13/40400343. .........That''s enough...TV."'
24201: '@rAgain, ......Mama''s busy with her work and isn''t coming home.'
24202: '@rMama usually has a lot of overtime and doesn''t come home until late.'
24203: '@r......She has to socialize or something for work, so she comes home having drunk a lot of alcohol, even though she can''t handle it,@k and with a pale face, she goes straight into the shower and then to bed.'
24204: '@rAnd even on the weekends, she says she has overtime or has to stay over, and almost never comes home.'
24205: '@r......This has been happening often recently, saying she has a big job lined up or something...'
24206: '@r......The picture I did my best on during art class got laughed at by everyone,@k but I wanted Mama to look at it properly at least...but once again, I won''t be able to show her.'
24207: '@rAnd talk about the time when everyone pushed the cleanup onto me, but I did my best by myself and got praised by the teacher.'
24208: '@rAnd talk about when I went shopping, and the man at the shop said he''s always impressed by me and gave me a free can of coffee.'
24209: '@rAnd there''s the card I wrote and secretly hid under Mama''s pillow,@k because I wanted to encourage her when she comes home from working so hard.'
24210: 'Maria@r@v13/40400344."...............And there''s more, there''s...so much......I wanted to talk about."'
24211: 'Sakutarou@r@v33/44200055.''.........Mama is working really hard at her job.@k@v33/44200056. She''s working with all of her strength so we can eat every day.'''
24212: 'Maria@r@v13/40400345."......Hate jobs.@k@v13/40400346. ......Mama should just quit that stupid job."'
24213: 'Sakutarou@r@v33/44200057.''A job is an important thing for adults to do.@k@v33/44200058. ......It lets you eat food,@k@v33/44200059. buys clothes,@k@v33/44200060. pays for school lunches,@k@v33/44200061. and pays the deposit for summer camp.@k@v33/44200062. ......It''s all because Mama works and earns money for you.'''
24214: 'Maria@r@v13/40400347."..............................@k@v13/40400348. ...Don''t need food.@k@v13/40400349. Don''t need clothes.@k@v13/40400350. Don''t need school lunches and don''t want to go to summer camp.@k@v13/40400351. ...It''s not like any of the groups will let me join in."'
24215: 'Sakutarou@r@v33/44200063.''Uryu......@k@v33/44200064. ......Just now, on the phone, Mama promised that she''ll buy you a present for when she comes back from work, right?'''
24216: 'Sakutarou@r@v33/44200065.''I think Mama made that promise because you''re important to her, Maria,@k@v33/44200066. and she feels bad for making you lonely.'''
24217: 'Maria@r@v13/40400352.".........I don''t know."'
24218: 'Sakutarou@r@v33/44200067.''Uryu!@k @v33/44200068.She definitely wouldn''t do that if she thought you were a pain or annoying!@k @v33/44200069.......She wants to stay by your side all the time as well.'''
24219: 'Sakutarou@r@v33/44200070.''...She also finds it painful and sad that she can''t.@k@v33/44200071. ............I remember when Mama spent the whole night by your side, crying.'''
24220: 'Maria@r@v13/40400353.".........Yeah.@k@v13/40400354. ...Didn''t understand why Mama was crying, ......but seeing Mama like that was so sad,@k@v13/40400355. ...and I couldn''t do anything but stay silent by her side."'
24221: 'Sakutarou@r@v33/44200072.''I remember the last thing Mama said then.@k@v33/44200073. ......She said thank you.@k@v33/44200074. .........She said that just by being by her side, you were her only ally in the whole world.@k@v33/44200075. ......Uryu, do you remember?'''
24222: 'Maria@r@v13/40400356."Yeah...@k@v13/40400357. .........You''re my only ally in the whole wide world,@v13/40400358. ......she said."'
24223: '@rSakutaro set the remote on the table, crawled up onto the sofa,@k sat on my lap, ...and spoke to me while gazing into my eyes.'
24224: 'Sakutarou@r@v33/44200076.''......I''m sure Mama''s just like you, Maria.@k@v33/44200077. .........Where the designs Mama draws are the only ones laughed at by the clients.@k@v33/44200078. ......And her company is the only one that has annoying jobs pushed onto it by other companies.'''
24225: 'Sakutarou@r@v33/44200079.''Mama is the president, so she has to take care of everything all by herself.@k@v33/44200080. ......And her company is the only one that never gets to join in with the business of other companies.'''
24226: 'Sakutarou@r@v33/44200081.''.........You''re Mama''s only ally, remember.@k@v33/44200082. ......If even you tell Mama to quit her job, ......in the whole wide world, where would Mama''s ally be.........?'''
24227: 'Maria@r@v13/40400359."...............uu...@k@v13/40400360. .........Sakutaro......"'
24228: 'Sakutarou@r@v33/44200083.''The only person I have in the whole world is you.@k@v33/44200084. ......And the only person Mama has in the whole world is you.@k@v33/44200085. .........What about you, Maria?'''
24229: 'Maria@r@v13/40400361."......I have Mama...and I have you..."'
24230: 'Sakutarou@r@v33/44200086.''Then you aren''t lonely, at all!@k @v33/44200087.Uryu!'''
24231: 'Maria@r@v13/40400362.".........Uu."'
24232: 'Sakutarou@r@v33/44200088.''Mama is busy with her work, so she can''t be with you very often, but please, don''t blame her for that, Maria.@k@v33/44200089. ......In exchange, I''ll always be by your side, and I''ll be there forever and ever. ...............So don''t cry, okay...?'''
24233: 'Sakutarou@r@v33/44200090.''.........Uryu...@k@v33/44200091. Me being with you.........can''t stop you feeling sad......?'''
24234: 'Maria@r@v13/40400363."............uuu, ......uuuuuuuuuuu, Sakutaro...@k@v13/40400364. ......uuuuuuuuu!!@k @v13/40400365.UwaaAAaaAaahhh, waaAAahaaaAAahaaahhh..."'
24235: '@r.........From the holes in Maria''s heart, which she had been doing her best to seal up, ...drops of sadness finally dripped down.@k ......Drip, drip.@k Plop, plop.'
24236: '@r......Sniff, sniff, drip, drip, plop, plop.'
24237: '@rEven though weekends where Mama doesn''t come home aren''t that rare a thing.'
24238: '@r......Even though this night wasn''t especially more painful or sad than any other.'
24239: '@r......Maria''s tears poured down.'
24240: 'Sakutarou@r@v33/44200092.''Uryuu...!@k @v33/44200093.Don''t cry, Maria...@k@v33/44200094. I''ll always be with you...@k@v33/44200095. Even if you''re going to cry, I won''t.@k@v33/44200096. I''m a lion cub, I can''t cry just because I''m lonely.@k@v33/44200097. ......I want to cry too...but I''m not going to...!'''
24241: 'Maria@r@v13/40400366."Why won''t you cry, Sakutaro...?@k @v13/40400367.You still won''t cry, even when it''s this lonely and you can''t hold back the tears...?"'
24242: 'Sakutarou@r@v33/44200098.''Uryu.@k@v33/44200099. But if I cry, who will make you feel better...?@k @v33/44200100.So I''m not going to cry.@k@v33/44200101. Because I want to make you smile.'''
24243: 'Maria@r@v13/40400368."If I smile, ......will Mama come back......?"'
24244: 'Sakutarou@r@v33/44200102.''When she does come back and you greet her with a happy face, ......I''m sure she''ll feel the same.@k@v33/44200103. Uryu.'''
24245: 'Maria@r@v13/40400369."......Mama...will be happy......?"'
24246: 'Sakutarou@r@v33/44200104.''Uryu.@k@v33/44200105. And then, I''m sure, it''ll relieve her tiredness from work as well.@k@v33/44200106. And then, I''m sure, she''ll get in a good mood earlier than normal, and play with you a lot.'''
24247: 'Maria@r@v13/40400370.".............................."'
24248: 'Sakutarou@r@v33/44200107.''When you come home and Mama''s waiting for you there, and she''s in the kitchen in a good mood, don''t you feel really happy?@k @v33/44200108.It''s definitely the same for her.'''
24249: 'Maria@r@v13/40400371."......If I stay here, being happy......she''ll be happy too?"'
24250: 'Sakutarou@r@v33/44200109.''Uryu!'''
24251: '@rSakutaro nodded deeply with his big head.@k@rNo more tears could fall from Maria''s eyes.'
24252: '@r......Because if she greeted her mama with a tear-stained face, her mama would probably get sad too.'
24253: 'Sakutarou@r@v33/44200110.''You know this already, Maria.@k@v33/44200111. You can''t use the magic that creates smiles if you aren''t smiling too.'''
24254: 'Maria@r@v13/40400372."......Yeah.@k@v13/40400373. ......I know.@k@v13/40400374. So I won''t cry anymore."'
24255: 'Sakutarou@r@v33/44200112.''Hey, Maria.@k@v33/44200113. I have an idea for how we can have a fun time.@k@v33/44200114. ......Uryu, can I tell you?'''
24256: 'Maria@r@v13/40400375."......What is it?"'
24257: 'Sakutarou@r@v33/44200115.''Mama won''t be coming back until late night Sunday.@k@|@y@v33/44200116. Why don''t we have a pajama party in secret, without Mama ever knowing?'''
24258: 'Maria@r@v13/40400376."Pajama party...?"'
24259: 'Sakutarou@r@v33/44200117.''Until you get tired late tonight, you can play with me while eating candy and drinking soda in bed.'''
24260: 'Maria@r@v13/40400377."A pajama party.@k@v13/40400378. ......Yeah, that sounds fun.@k@v13/40400379. ...I don''t have to go to bed at nine?@k @v13/40400380.Mama won''t get mad at me for not going to bed?"'
24261: 'Sakutarou@r@v33/44200118.''This is a secret between you and me, only for when Mama isn''t around.@k@v33/44200119. So, until you get sleepy, let''s spend the whole night having fun together.'''
24262: 'Sakutarou@r@v33/44200120.''Let''s eat jellybeans and try to guess what color we''ll get next.@k@v33/44200121. Let''s split open peanuts and try to guess which half is the grandpa.'''
24263: 'Sakutarou@r@v33/44200122.''Let''s search for treasure in the closet.@k@v33/44200123. And more, so much more!@k @v33/44200124.I wonder what it''ll taste like if we mix orange juice and melon soda.'''
24264: 'Maria@r@v13/40400381."Uu.@k@v13/40400382. Wanted to try that once, but asked Mama if it was alright and she got mad."'
24265: 'Sakutarou@r@v33/44200125.''Uryuu!@k @v33/44200126.Let''s try it out in secret from Mama♪@k @v33/44200127.Tonight, let''s play a lot, laugh a lot, and blow away our tears with happiness.@k@v33/44200128. Don''t worry, with me here, it''ll definitely be fun!@k @v33/44200129.I''ll make you happy for sure, Maria.'''
24266: 'Maria@r@v13/40400383."Yeah... Yeah.@k@v13/40400384. I know it''ll be fun with you here.@k@v13/40400385. It''ll definitely make me happy.@k@v13/40400386. Thanks, Sakutaro.@k@v13/40400387. Won''t cry anymore.@k@v13/40400388. Let''s have a super fun time together, make ourselves super happy, and say welcome home with a smile on our faces when Mama gets back."'
24267: 'Sakutarou@r@v33/44200130.''Uryuu!@k @v33/44200131.Let''s play and play tonight and get in a really great mood♪@k @v33/44200132.Let''s play a lot in a secret party that we can only have when Mama isn''t here.'''
24268: 'Sakutarou@r@v33/44200133.''If we''re lively enough, I''m sure plenty of friends will come to play from Wonderland and Looking-Glass Land.@k@v33/44200134. We''ll have so many friends at that point that there simply won''t be time left to feel bored.@k@v33/44200135. Uryuu!'''
24269: 'Maria@r@v13/40400389."Uryuu!!"@|@y'
24270: '@r......And then I started my pajama party with Sakutaro, and had fun until late into the night.'
24271: '@rI played by sticking my hand into the bag of jellybeans without looking, and trying to guess which color I would pull out.'
24272: '@r......Sakutaro had good intuition and got it right a lot.@k@rPartway through, I also achieved the brilliant feat of guessing right four times in a row.'
24273: '@rThe game where I split peanuts open and tried to guess which half would be the grandpa...@kwas easier than guessing the color of the jellybeans, so I got it right a lot.'
24274: '@rSucking my salt-covered fingers was bad manners, but that was the yummiest part.'
24275: '@rI like both orange juice and melon soda on their own.'
24276: '@rI hoped that by mixing those two favorite drinks, there might be a flash of light like alchemy,@k and a new drink that no one had ever tasted before would be created.'
24277: '@rI got excited about how, if it turned out really delicious, I''d call it Sakutaro Soda and sell it.'
24278: '@rBut, unexpectedly, it had a weird and disappointing taste.@k@rAnd the color was somewhat dull and boring.'
24279: '@r...Maybe I shouldn''t have been surprised that orange and green mixed together would make this.@k ......Too bad. I imagined that it would become a sparkling pineapple color.'
24280: '@rBut, it was an awesome, awesome, fun night.'
24281: '@rIf I''m having this much fun, maybe Mama will start wanting to come home too, and unexpectedly appear at the front door.'
24282: '@r......So I got the feeling that Mama might suddenly come home,@k and went to the front door many times to check, but there was no way Mama would be able to come home when she was this busy with work.'
24283: '@rBut rather than a feeling of loneliness,@k I felt just a little disappointed that I couldn''t invite Mama to join in on such a fun late-night party.'
24284: '@rNext time, I''ll do this when Mama is around, and let her join in.'
24285: '@rEven some things that I don''t think are yummy, Mama says are delicious,@k so she might say that Sakutaro Soda is really yummy.'
24286: '@rWhen Mama comes back tired, I''ll serve her some.'
24287: '@rAnd more than anything.'
24288: '@r......I wanted to at least write about this fun night in a letter, and tell Mama about it.'
24289: '@rHoping that these strong feelings of happiness would reach Mama too.'
24290: '@rHoping that when Mama comes home exhausted from her job, which is always so tough for her, I could share this happiness with her.'
24291: '@rHoping that when Mama comes home late Sunday night, almost certainly tired,@k I could make her even just a little brighter by sharing this happiness......'
24292: '@rI softly placed that letter on Mama''s desk.'
24293: '@r@z70.To Mama.@k@rGood job with your work again today☆ Some of my happiness for you to share.'
24294: '@rThen, I decided to give a present to Sakutaro for proposing this wonderful night.'
24295: '@rA small red scarf that I had found when searching for treasure in my closet.'
24296: '@rWhen Maria was still very young, her mama had knitted this tiny, tiny, red scarf for her.'
24297: '@r"Maria" was embroidered on it with knitting wool.'
24298: '@r......She softly wrapped that scarf around Sakutaro.'
24299: '@rIt really suited him, accenting his yellow with red very well.'
24300: 'Sakutarou@r@v33/44200136.''.........Uryu.@k@v33/44200137. ...Does it suit me......?'''
24301: '@rSakutaro looked embarrassed as he wore his first present ever.'
24302: '@r......Yeah.@k It really suits him.'
24303: 'Maria@r@v13/40400390."Uu.@k@v13/40400391. Sakutaro, thank you so much for everything.@k@v13/40400392. It was so fun tonight.@k@v13/40400393. I can''t even remember why I was crying.@k@v13/40400394. ......Let''s always stick together, okay?@k@v13/40400395. And let''s always play and laugh together."'
24304: 'Sakutarou@r@v33/44200138.''Uryuu!@k @v33/44200139.Love you, Maria!'''
24305: 'Maria@r@v13/40400396."Me too.@k@v13/40400397. Love you, Sakutaro."'
24306: '@rAfter playing so wildly, my room was a mess.'
24307: '@rMaybe I played a little too much.'
24308: '@r......But I''m tired for today, so let''s sleep together now.@k And tomorrow, we''ll clean up together and welcome Mama with a clean room.@k ......Okay? Sakutaro?'
24309: '@rUryuu♪'
24310: 'Maria@r@v13/40400398."......See?@k @v13/40400399.See how happy I...no, see how happy me and Sakutaro are?"'
24311: 'Ange@r@v11/42000494."..................@k@v11/42000495. Is this your happiness, Maria onee-chan...?"'
24312: 'Maria@r@v13/40400400."Yep.@k@v13/40400401. I am happy."'
24313: 'Ange@r@v11/42000496."......Even though you were looking forward to that movie so much, and Aunt Rosa promised that she''d definitely take you, she completely forgot."'
24314: 'Maria@r@v13/40400402."She just happened to forget because she was so busy with work.@k@v13/40400403. ......Even if she had remembered, she couldn''t have done anything about it with her work."'
24315: 'Maria@r@v13/40400404."Whether she remembered or not, Mama would spend the night at work in either case.@k@v13/40400405. She couldn''t go to the movies.@k@v13/40400406. .........Whether she remembered the promise or not is insignificant."'
24316: '@r......There''s no way that''s insignificant.'
24317: '@rAfter all, ......when Aunt Rosa replied "The movies?" on the phone,@k it was obvious that she had completely forgotten her promise.'
24318: '@rAnd when she heard that, Maria onee-chan''s mood definitely darkened.'
24319: 'Ange@r@v11/42000497."Well, ......like you say,@k@v11/42000498. even if Aunt Rosa had remembered her promise, you wouldn''t have been able to go to the movies in the end."'
24320: 'Ange@r@v11/42000499."......But even so.@k@v11/42000500. ......To think that your mother just forgot her promise to spend one of her few days off with you, ...it''s sad.@k@v11/42000501. I''d be angry."'
24321: 'Maria@r@v13/40400407."..............................@k@v13/40400408. ...Yeah.@k@v13/40400409. It was sad.@k@v13/40400410. Because even if she had remembered, we wouldn''t have been able to go to the movies."'
24322: 'Maria@r@v13/40400411."......But after that, I had a very, very fun night with Sakutaro.@k@v13/40400412. You must''ve thought that pajama party looked really fun too, Ange."'
24323: 'Ange@r@v11/42000502."...........................@k@v11/42000503. There''s no way that would be fun."'
24324: 'Ange@r@v11/42000504."...I mean, all of that messing around you did that night,@k@v11/42000505. ......was just you intentionally making a frenzy out of nothing so you could forget that you were lonely and that your mother wasn''t coming home."'
24325: 'Maria@r@v13/40400413."That''s not true.@k@v13/40400414. Really did have a fun party with Sakutaro."'
24326: 'Ange@r@v11/42000506."No, you didn''t!@k @v11/42000507.You were just so sad, and you hated your mother so much for forgetting her promise, that you made a mess of your room...!!"'
24327: 'Maria@r@v13/40400415."...............Where was something like that ever written in my diary?"'
24328: 'Ange@r@v11/42000508."It isn''t written anywhere!@k @v11/42000509.But......by reading in the gaps between every line, I can tell how you felt!@k @v11/42000510.You didn''t have a good time at all that evening!"'
24329: 'Ange@r@v11/42000511."And you stayed up late when you were told not to, broke the strict rule about not eating sweets outside of snack time,@k@v11/42000512. ......and when even that didn''t bury your sadness, you went wild in your room, .........and made a mess of it, isn''t that all...?!!"'
24330: 'Ange@r@v11/42000513."And after you made a mess of your room and were all tired out,@k@v11/42000514. .........all you did was claw at the bed sheets and cry yourself to sleep...!"'
24331: 'Maria@r@v13/40400416.".........It is written in the diary that Mama probably forgot her promise about the movie,@k@v13/40400417. and that I stayed up late having a pajama party with Sakutaro, ......and made a mess of my room searching for treasure."'
24332: 'Ange@r@v11/42000515."Yes.@k@v11/42000516. And that.........can only mean one thing, can''t it?!@k @v11/42000517.You were starving for Auntie Rosa''s love...!@k @v11/42000518.And Aunt Rosa always put her work and her public image first, always keeping you on the back-burner...!"'
24333: 'Ange@r@v11/42000519."That''s why it makes my skin crawl!@k @v11/42000520.Because I know just how superficial Aunt Rosa''s words of love for you are!!@k @v11/42000521.You should realize this yourself!"'
24334: 'Ange@r@v11/42000522."So......how can you say that you''re happy?!@k @v11/42000523.I don''t understand that......that part of you, Maria onee-chan!!@k @v11/42000524.Even at this age, I can''t understand it at all...!!"'
24335: 'Ange@r@v11/42000525."How aren''t you sad?@k @v11/42000526.How is it that you can experience a reality filled with misfortune and call yourself happy?!@k @v11/42000527.I can''t do it, I can''t understand it...!!"'
24336: 'Maria@r@v13/40400418."...............You are a sad kid, Ange."'
24337: 'Ange@r@v11/42000528."I don''t get it!!@k @v11/42000529.Why are you pitying me?!"'
24338: 'Maria@r@v13/40400419.".........Even though a "fact" about a really fun pajama party is written in my diary,@k@v13/40400420. .........when it''s observed by a different person, it looks like that same "fact" takes a different form, huh."'
24339: '@rI remembered talking about this with BERNKASTEL.'
24340: '@rTruth is indeterminate and changes its form every time it''s observed.@k@rBy the way it is perceived, ...in other words, depending on the person who perceives it, a single truth becomes different truths.'
24341: '@rAnd truths of the past are painted over by truths of the future......'
24342: 'Maria@r@v13/40400421."In this diary, I wrote that what happened that night was very, very fun."'
24343: 'Ange@r@v11/42000530."......You described the events of that night as something very happy."'
24344: 'Maria@r@v13/40400422."And yet, when you read the diary, you read the events of that night as very, very sad."'
24345: 'Ange@r@v11/42000531."......Even though you described it as happiness, I read it as something different."'
24346: 'Maria@r@v13/40400423."Stop it."'
24347: 'Ange@r@v11/42000532."................................."'
24348: 'Maria@r@v13/40400424."This...tells of a happy night.@k@v13/40400425. .........This is...the "truth" of that night.@k@v13/40400426. Please, don''t take this happy truth,@v13/40400427. ............and paint over it with a new and different truth."'
24349: 'Ange@r@v11/42000533_b."............Does this make you......happy, Maria onee-chan?"'
24350: 'Maria@r@v13/40400428."Yep.@k@v13/40400429. Happy.@k@v13/40400430. .........That''s why I feel so sorry for you, because you can''t feel happiness in the same situation."'
24351: '@r.........Both she back then, and I now, have the same friendless and lonely situation.'
24352: '@rAnd Ange......accepted the lonely truth as the lonely truth.@k But she......painted over the lonely truth with a happy truth.'
24353: '@rUshiromiya Maria took the sad truth...@w666....and changed it into happiness.'
24354: '@rThat...@w500....is the only, and yet all too large, ...difference between me and Maria onee-chan.'
24355: '@rAnd at the same time as being unable to accept it,@w500. ......another part of me is jealous of that power.'
24356: 'Maria@r@v13/40400431."Yeah.@k@v13/40400432. ......That''s right.@k@v13/40400433. It is "power".@k@v13/40400434. ......With that power, I was able to become happy.@k@v13/40400435. And without it, you can''t."'
24357: 'Ange@r@v11/42000534."That.........power,@v11/42000535. ............what is it............?"'
24358: 'Maria@r@v13/40400436."I didn''t know what to call that power either.@k@v13/40400437. ......At this point in time, at least.@k@v13/40400438. ...Eventually, I would be taught its true form."'
24359: 'Maria@r@v13/40400439."......I''ll talk about it later.@k@v13/40400440. On a later page.@k@v13/40400441. .........So then, so then, late Sunday night.@k@v13/40400442. With a present, just like she''d promised, Mama came back......"'
24360: 'Rosa@r@v12/41400116.".........I''m back."'
24361: 'Maria@r@v13/40400443."Mamaaaa, welcome hoooooooome!!"'
24362: 'Sakutarou@r@v33/44200140.''Uryuu!!@k @v33/44200141.Mama came back, Mama came back!'''
24363: '@rWaiting to greet Rosa, as she returned home all tired out,@k was Maria, holding Sakutaro, in an unbelievably good mood.'
24364: '@rRosa''s worn out expression was surely due at least in part to actual fatigue,@k ......but also partially because she was sick and tired of having Maria cling to her and loudly whine and sob after being left alone in the house for a few days.'
24365: '@rHowever, when she was welcomed by an unbelievably happy Maria,@k ......and discovered unbelievably that her fears had been unfounded, Rosa couldn''t hide her surprise.'
24366: 'Rosa@r@v12/41400117."Wh-......what''s going on, Maria...?@k@v12/41400118. You''re in a great mood, aren''t you...?!@k @v12/41400119.Is someone here...?!"'
24367: '@rIt was strange enough to make Rosa think that a friend might have come over, and that she had come back home in the middle of them having a good time playing together.'
24368: '@rBut there were no other shoes by the entrance.'
24369: '@r......Even though Maria was in such high spirits, she was home alone.'
24370: '@rAt first, Rosa was suspicious that this unexpectedly good mood might have some kind of unwelcome underlying cause,@k but that really was a needless fear, ......and it really did seem to be that Maria had actually stayed at home in a good mood.'
24371: '@r.........Even if Rosa''s heart had been as cold and hard as a rock, ...after being welcomed with a smile like this...'
24372: '@r...Rosa started to honestly accept that smile, and a smile rose to her own face automatically.'
24373: '@r......In that smile, you could see none of the weariness caused by being unable to return home for several days.'
24374: '@rMaria kept talking about what a fun time she''d had playing with the stuffed animal Sakutaro.'
24375: '@rRosa really hadn''t imagined that the stuffed animal she''d gifted her would be liked so much, and she couldn''t hide her pleasant surprise.'
24376: 'Rosa@r@v12/41400120."I see.@k@v12/41400121. So you and Sakutarou were having fun watching the house together.@k@v12/41400122. Well done, Maria.@k@v12/41400123. I have presents for you and Sakutarou for being so good."'
24377: 'Sakutarou@r@v33/44200142.''Uryuu!@k@v33/44200143. Presents! @v33/44200144. Presents!'''
24378: 'Maria@r@v13/40400444."Uu!@k @v13/40400445.I wonder what they are, I wonder what they are!"'
24379: '@rMaria started jumping around with Sakutaro.'
24380: '@rThere were two presents.@k One was a Western cake assortment.'
24381: '@rIt contained different kinds of Scotch cakes.@k It looked to be of very high quality.'
24382: '@rBut Maria was more interested in the other one.@k@rThe other one was an even bigger box, and it was pretty heavy.'
24383: 'Rosa@r@v12/41400124."Open it and have a look.@k@v12/41400125. They might become new friends for you and Sakutarou, who knows?"'
24384: 'Maria@r@v13/40400446."Wowwwwwwwwww...!@k @v13/40400447.What''s this!@k @v13/40400448.What''s this?!"'
24385: '@rInside, laid there like chess pieces, were about twenty small ceramic animal figures.'
24386: '@rSquirrels, rabbits, small birds, dogs and cats.@k@rAnd they were all holding musical instruments.'
24387: '@rIn addition to them, there was also a panorama-style background.@k@rA forest scene was drawn on it.@k@rLittle woodland animals were all gathered around a forest clearing, and they looked like they were having a good time.'
24388: '@rRosa set it up on the table.'
24389: '@r......And when she then lined up the ceramic figures like chess pieces in front of it,@k .........it became a band of forest animals.'
24390: 'Rosa@r@v12/41400126."Isn''t it wonderful?@k @v12/41400127.I saw it in the store window, and I was taken with it at a glance.@k@v12/41400128. This is a present for you for being such a good girl home alone, Maria."'
24391: 'Maria@r@v13/40400449."Uuuu!!!@k @v13/40400450.Thank you, Mamaaa!!!"'
24392: 'Maria@r@v13/40400451."Isn''t this amazing, Sakutaro?!@k @v13/40400452.Look how many more friends we have...!@k @v13/40400453.It was just like you said, Sakutaro!@k @v13/40400454.It was true, we had a fun and lively time, and we did get more friends...!"'
24393: 'Sakutarou@r@v33/44200145.''See, didn''t I tell you?@k @v33/44200146.Look, we have more friends, look, we have more friends!@k @v33/44200147.Uryu~♪'''
24394: '@rRelieved that her gift had been appreciated,@k Rosa suddenly remembered that she was filled with several days of weariness...'
24395: 'Maria@r@v13/40400455."Mama, you really worked hard...!@k @v13/40400456.You should go take a shower.@k@v13/40400457. If you take a hot one, I''m sure your tiredness will go away.@k@v13/40400458. Want to take a bath?@k @v13/40400459.I''ll choose what to put in the bath today!"'
24396: 'Rosa@r@v12/41400129."Thank you.@k@v12/41400130. But it''s already late, so you get ready for bed.@k@|@y@v12/41400131. Mama''s tired, so I''ll just take a shower and go to bed right away.@k@v12/41400132. I have to get up early tomorrow."'
24397: 'Maria@r@v13/40400460."Yep, okay!@k @v13/40400461.Here, Mama, I''ll take your coat off for youuu."'
24398: 'Rosa@r@v12/41400133."No, really, I can do it myself...@k@|@y@v12/41400134. ...Ahh, thank you."'
24399: 'Maria@r@v13/40400462."Your coat is full of smells from outside.@k@|@y@v13/40400463. ......Uu?@k @v13/40400464.Oh, sorry, dropped something.@k@v13/40400465. I''ll pick it up, okay?"'
24400: '@rWhen she had taken Rosa''s coat, a receipt or ticket stub or something had fallen out.'
24401: '@r...It had been in her mama''s pocket, so it was probably important.'
24402: '@rMaria hurriedly picked it up...'
24403: '@rIt looked like a ticket for a Green Car or the Shinkansen or something.'
24404: '@r............Atami?@k Maybe it''s that place famous for its hot springs...?'
24405: '@rJust then.@k ...A razor-sharp sound shattered the warm atmosphere.'
24406: '@rInstead of the Rosa who had been there just a second ago, enjoying a gift with her daughter and full of weariness after returning home for the first time in several days,@k .........there stood a completely different person, who looked exactly the same, but had the most terrible of expressions on her face.'
24407: '@r...In her hand was the ticket stub that Maria had picked up.@k@r...She had stolen it from Maria''s hand in an instant.'
24408: '@rAfter a few seconds'' delay,@k ...by the pain of her hand that had been hit,@w500. and her mother''s expression,@w500. Maria realized that she must have done something wrong.'
24409: '@rBut she didn''t know what she had done that had gotten her in trouble.'
24410: '@r......It was probably because of that ticket-stub-like thing.'
24411: '@rWas she not supposed......to touch it.........?'
24412: '@rEven though she had tried so hard to welcome her mama with fun and happiness,@k ...she had touched something important to her without asking, and had ruined that pleasant atmosphere...'
24413: '@r......So Maria apologized immediately.'
24414: 'Maria@r@v13/40400466."S-......sorry........."'
24415: 'Rosa@r@v12/41400135."............nh.@k@v12/41400136. .................."'
24416: '@rEven though she must have heard those words of apology, Rosa''s expression actually darkened.'
24417: '@r...Maybe those words had been undesired?'
24418: '@rMaria didn''t know what to do, and cautiously watched to see how her mother would act...'
24419: '@rThen, even though it should have been such an important ticket stub,@w583. Rosa crushed it up and hurried off to her room...'
24420: '@rMaria......didn''t really understand what she had done wrong......'
24421: 'Maria@r@v13/40400467.".........Uu......@k@v13/40400468. ......I must have...@v13/40400469.......done something I shouldn''t have......@k@v13/40400470. ...That paper must have been something important for Mama''s work.@k@v13/40400471. And I touched it without asking..."'
24422: 'Sakutarou@r@v33/44200148.''Uryu......@k@v33/44200149. ...You didn''t do anything wrong, Maria.........@k@v33/44200150. ...So look how happy we are tonight as well.'''
24423: 'Maria@r@v13/40400472."Yeah.@k@v13/40400473. ...Happy."'
24424: 'Sakutarou@r@v33/44200151.''And when Mama takes a bath and clears her head, she''ll go back to being the normal, nice Mama.@k@v33/44200152. So you mustn''t worry about it.@k@v33/44200153. Uryu.'''
24425: 'Maria@r@v13/40400474."You''re right......@k@v13/40400475. Mama''s tired too, after all.@k@v13/40400476. ......Uu, mustn''t worry about it.@k@v13/40400477. We''re so very happy tonight."'
24426: 'Sakutarou@r@v33/44200154.''Uryu.'''
24427: 'Ange@r@v11/42000536."..................Please stop.@k@v11/42000537. ...I can''t bear to watch this."'
24428: 'Maria@r@v13/40400478."......Ange, I think you''re looking for happiness in the wrong way."'
24429: 'Ange@r@v11/42000538."You''re the one who''s wrong!!@k @v11/42000539.How can you call this happiness...?!!@k @v11/42000540.It''s too...painful for me even to watch it anymore!!"'
24430: 'Maria@r@v13/40400479."What is...?@k @v13/40400480.That Mama suddenly got mad?@k @v13/40400481..........That happens sometimes when people get tired.@k@v13/40400482. ......Condemning a person because of a momentary misplaced emotion isn''t very adult of you, Ange."'
24431: 'Ange@r@v11/42000541."......I can''t believe I''m hearing this from a nine-year-old...@k@|@y@v11/42000542. But that''s not the problem, is it?!@k @v11/42000543.That ticket stub you picked up was clearly strange!"'
24432: 'Maria@r@v13/40400483."How?@k @v13/40400484.There was nothing strange about it, and it has nothing to do with the happiness of that night..."'
24433: 'Ange@r@v11/42000544."Aunt Rosa called you saying she''d be staying over at work because of her job, right?!@k @v11/42000545.Why Atami?!@k @v11/42000546.Isn''t that what you call a vacation?!"'
24434: 'Ange@r@v11/42000547."It means she left you behind and went on a vacation, doesn''t it?!@k @v11/42000548.And you normally don''t go on a vacation by yourse—"'
24435: 'Maria@r@v13/40400485."Even if that was a ticket for Atami,@k@v13/40400486. that alone doesn''t make it proof that Mama lied and went on a vacation, does it...?"'
24436: 'Ange@r@v11/42000549."She lied on the phone, changed her expression like that and grabbed it from you!@k @v11/42000550.What more proof could you want...?!!"'
24437: 'Maria@r@v13/40400487.".........It might be from a business trip long ago, right?@k @v13/40400488.Or maybe she just happened to pick up some trash or something and put it in her pocket.@k@v13/40400489. It might even be a receipt from someone who works for her who went on a business trip."'
24438: 'Maria@r@v13/40400490."...In that case, it was important for her work.@k@v13/40400491. It wasn''t a toy, so I can understand why Mama took it away.@k@v13/40400492. ......This evidence you''re talking about is nothing more than circumstantial evidence.@k@v13/40400493. Imagination and delusions.@k@v13/40400494. ......I don''t know why you''re interpreting it so that my relationship with Mama is bad."'
24439: 'Ange@r@v11/42000551."I''m the one who doesn''t understand how you can interpret it in a way that''s so convenient for Aunt Rosa!!"'
24440: 'Maria@r@v13/40400495.".........You really are a poor child, Ange.@k@v13/40400496. .........There are fragments that could make you happy,@k@v13/40400497. so many of them, scattered all about your feet, and you can''t find them."'
24441: 'Maria@r@v13/40400498."......Instead, all you find are the unhappy fragments, and you keep getting hurt over and over.@k@v13/40400499. ......That''s why you get scared of being hurt,@k@v13/40400500. ......and you can''t start even looking for happiness until after you''ve finished making sure that there''s nothing around you that could hurt you."'
24442: 'Ange@r@v11/42000552."..................When I talk with you, Onee-chan, it gets hard to tell which one of us isn''t making sense."'
24443: 'Maria@r@v13/40400501."You know what?@k @v13/40400502.There are lots and lots of both happy and unhappy fragments, and the world is full to the brim with both kinds.@k@v13/40400503. So people who can''t find happiness right beside them won''t be able to find it no matter where they go looking.@k@v13/40400504. ......Like Tyltyl and Mytyl searching for the blue bird."'
24444: 'Ange@r@v11/42000553."............Yes.@k@v11/42000554. The story did have that moral."'
24445: 'Maria@r@v13/40400505."You''re the complete opposite, Ange.@k@v13/40400506. You''re searching for a world without a single unhappy fragment.@k@v13/40400507. But even that''s the same as the blue bird.@k@v13/40400508. So you''ll be unable to find your own happiness for all eternity."'
24446: 'Maria@r@v13/40400509."............Battler is Hansel, is he?@k @v13/40400510.Isn''t he the blue bird......?"'
24447: 'Ange@r@v11/42000555."......Give it a rest already.@k@v11/42000556. .........In any event, I got the point that a night of happiness was wasted because of a single scrap of paper that fell from a coat."'
24448: 'Maria@r@v13/40400511."It''s scary, isn''t it?@k@v13/40400512. That a single scrap of paper could do that.@k@v13/40400513. ......In that case, maybe the power to get happiness back can also lie in a single scrap of paper, don''t you think?"'
24449: '@rJust when she had finally been able to bond with Maria after so long......'
24450: '@rRosa''s face twisted with a mixture of anger, sadness, and a fierce self-hatred as she flew into her room and closed the door.'
24451: '@r.........Maria''s "sorry" had stuck into her chest more sharply than any knife.'
24452: '@rThen,@w666. ......she noticed a cute envelope placed on her study table.'
24453: '@rIt was probably something that had come with a girls'' magazine.'
24454: '@r.........To Mama.@k@|@y Some of my happiness for you to share, it said.'
24455: '@rShe took it, .........hesitated, opened it, ...and read what was inside.'
24456: '@r....................................'
24457: '@rThen, after dotting the surface of the paper...@w500.with two large tears...@k......she flew out of the room,@w500. hugged Maria from behind as she headed for the bathroom,@k@w666. .........buried her face into her daughter''s back,@w1000. ......and cried.'
24458: '@rAnd, realizing that she was the one who should truly be saying sorry,@w500. ...@w333....@w333....@w333....@w333.she apologized to her.'
24459: '@rAnd when Maria asked why,@k she gave no answer......'
24460: 'Maria@r@v13/40400514.".........See.@k@v13/40400515. Already made up.@k@v13/40400516. .........A little thing like that was absolutely nothing to worry about, because of the friendliness between Mama and me."'
24461: 'Ange@r@v11/42000557."........................@k@|@y@v11/42000558. .........Your happiness is...too painful for me."'
24462: 'Maria@r@v13/40400517."......I do understand your feelings more or less, Ange.@k@|@y@v13/40400518. ......Until I realized my "power",@k@v13/40400519. ...even I was just like you, a sorry child who could only find fragments filled with misfortune."'
24463: 'Ange@r@v11/42000559."............What is this "power"?@k @v11/42000560.This power that I don''t have, but you do.@k@v11/42000561. ...And are you saying that me not having it is the reason I have misery and you have joy?@k @v11/42000562..........Just what is this thing that you can''t describe except with an abstract word like "power"......?"'
24464: 'Maria@r@v13/40400520."Yeah.@k@v13/40400521. That is what you want to know, isn''t it, Ange?@k@v13/40400522. ......That''s why you''ve been reading my story all this time."'
24465: 'Maria@r@v13/40400523."............Of course I''ll teach you.@k@v13/40400524. The secret to that power.@k@v13/40400525. ......And I did teach you about it long ago, when you were little, you know...?@k @v13/40400526.Did you forget...?"'
24466: 'Maria@r@v13/40400527."Don''t worry, you''ll be able to remember.@k@v13/40400528. ......Now I...@v13/40400529.......no, she.@k@v13/40400530. She will teach you."'
24467: 'Ange@r@v11/42000563."............She......?@k @v11/42000564.Who''s that?"'
24468: 'BEATRICE@r@v27/40700193."I shall teach you in MARIA''s place."'
24469: 'Ange@r@v11/42000565.".........B-@v11/42000566.............BEATRICE..............."'
24470: 'BEATRICE@r@v27/40700194."The "power" that MARIA has, but you do not."'
24471: 'Maria@r@v13/40400531."Yep.@k@v13/40400532. The "power" I have, but you do not."'
24472: '@r——That...is magic.'
24473: '@rMaria and Beato said it together.@k And then they started giggling because they''d said it at the same time.'
24474: '@r......It was an innocent behavior, which seemed somehow unlike Beato.'
24475: '@rBlack tea was arranged on a table in a peaceful garden,@k and Beato, Maria, and Sakutarou, who was sitting on Maria''s lap, were having fun chatting...'
24476: 'BEATRICE@r@v27/40700195."............Hoh.@k@v27/40700196. I see, so he is called Sakutarou.@k@v27/40700197. And your best friend, you say!"'
24477: 'Sakutarou@r@v33/44200155.''Uryu...@k@v33/44200156. It''s nice to meet you, my name is Sakutarou...'''
24478: 'Maria@r@v13/40400533."Uu, Sakutaro is shy so he''s nervous right now.@k@v13/40400534. It''s okay, BEATRICE is my wonderful friend too...!"'
24479: 'Sakutarou@r@v33/44200157.''Uryu.@k@v33/44200158. Are your friends my friends...?'''
24480: 'Maria@r@v13/40400535."Yeah!"'
24481: 'Sakutarou@r@v33/44200159.''Uryu. ......Then I''m BEATRICE''s friend too?'''
24482: 'Maria@r@v13/40400536."Yeah!"'
24483: 'Sakutarou@r@v33/44200160.''Uryuu!'''
24484: 'BEATRICE@r@v27/40700198."......Maria, do things like this happen frequently for you in your everyday life?"'
24485: 'Maria@r@v13/40400537."Uu?@k @v13/40400538.Things?"'
24486: 'BEATRICE@r@v27/40700199."Is breathing a soul of magic into inorganic matter and giving it life in this way...@k@v27/40700200.a commonplace practice for you?"'
24487: 'Maria@r@v13/40400539."......Uu.@k@v13/40400540. Sakutaro isn''t inorganic matter, he''s a lion cub."'
24488: 'Sakutarou@r@v33/44200161.''Uryuu!'''
24489: 'BEATRICE@r@v27/40700201."Hmm......@k@v27/40700202. ......A stuffed animal makes for an excellent vessel.@k@v27/40700203. Therefore, when it is spoken to by an innocent child without toxin, it is not uncommon for a spirit to take up residence within, in an attempt to respond to them."'
24490: '@rAccording to BEATRICE, when a child "plays with dolls",@k the dolls sometimes gain an actual will and converse with them, in rare cases even moving on their own.'
24491: '@rHowever, the power that they can imbue into such a vessel is very weak due to their innocence.'
24492: '@rIf even a tiny bit of the toxin from a Human''s common sense gets involved, and tells them that there''s no way a doll can talk or move,@k it instantly reverts to being an ordinary non-speaking doll......'
24493: 'BEATRICE@r@v27/40700204."However, ......this...Sakutarou stuffed animal of yours is different."'
24494: 'Maria@r@v13/40400541."Uu!@k @v13/40400542.Sakutaro is a stuffed animal, but he''s not just a stuffed animal!"'
24495: 'Sakutarou@r@v33/44200162.''Uryuu!@k @v33/44200163.Lion cuuuub!@k @v33/44200164.Ga-...ga-......uryuu!'''
24496: 'Maria@r@v13/40400543."Sakutaro is a lion cub, but he''s still a kid, so he can''t say gaooo sometimes.@k@v13/40400544. Uryu-uryu-uryu♪"'
24497: 'Sakutarou@r@v33/44200165.''Uryu-uryu-uryuu!''@|@y'
24498: '@rBEATRICE let out a sigh of admiration as she gazed at Maria, playing around with Sakutaro at the table loaded with tea.'
24499: 'BEATRICE@r@v27/40700205.".........How incredible.@k@v27/40700206. This "Sakutarou", with a core of a cloth-and-cotton vessel, has completely manifested into the human world.@k@v27/40700207. He has his own character, talks with his summoner freely,@k@v27/40700208. and even moves by his own will."'
24500: 'BEATRICE@r@v27/40700209."......And what is most surprising is that you did not summon him by name as a being from another world,@k@v27/40700210. but created him out of the sea of zero."'
24501: '@rAfter that, Maria boasted to Beato that Sakutarou wasn''t her only friend, and that when she went home, there would be plenty more of them.'
24502: '@rShe claimed that there were other similar stuffed animals and dolls who, like Sakutarou, could talk and move of their own will.'
24503: '@rIt was something natural to Maria.@k It was natural for stuffed animals to talk, move, and become her friends of their own free will.'
24504: '@r......When she heard Maria speak of this in that way, BEATRICE, as a witch, felt a respect bordering on awe.'
24505: 'BEATRICE@r@v27/40700211."............Maria.@k@v27/40700212. Without a doubt, that power of yours is magic."'
24506: 'Maria@r@v13/40400545."It''s magic......?@k @v13/40400546.But I''m still a witch apprentice, I''m not able to use magic yet..."'
24507: 'BEATRICE@r@v27/40700213."Not so, it is magic indeed.@k@v27/40700214. .........You may be an apprentice since you are unable to use it in full awareness of that fact,@k@|@y@v27/40700215. ......but even so, what power this magic has!@k @v27/40700216.The manifestation of your friend Sakutarou is excellent proof of that."'
24508: 'Maria@r@v13/40400547."Many...festation...?"'
24509: 'BEATRICE@r@v27/40700217."Mm.@k@v27/40700218. In your case, it may even be fitting to call it creation.@k@v27/40700219. ......A piece of inorganic matter that would have no soul at all in another''s hands has had a soul imbued into it through your magic."'
24510: 'BEATRICE@r@v27/40700220."Furthermore, you are using strong power to keep it tethered to the human world.@k@v27/40700221. ......In this era so filled with the toxin that denies magic, maintaining the magical power necessary to manifest a being to the degree that it can exist as an independent life-form is not easy even for me."'
24511: '@rIt isn''t hard to create soulless beings in any number.@k@rHowever, creating a being with a soul is very difficult.@k@r...Beato declared this definitively.'
24512: 'Maria@r@v13/40400548.".........Don''t really understand what you''re saying, Beato.@k@v13/40400549. You''re saying Sakutaro is amazing...?"'
24513: 'BEATRICE@r@v27/40700222."I am saying that you and Sakutarou both are marvelous.@k@v27/40700223. ......You may feel proud.@k@v27/40700224. ...Yes, that which Kinzo desired above all else seems to dwell most strongly within you."'
24514: 'Maria@r@v13/40400550."Don''t have a clue why you''re praising me so much.@k@v13/40400551. Ri~ght, Sakutaro?"'
24515: 'Sakutarou@r@v33/44200166.''Uryu~!''@|@y'
24516: 'BEATRICE@r@v27/40700225."......What is truly admirable is not only that you have caused a soul to reside in a stuffed animal.@k@v27/40700226. It is the fact that by that act, you have changed your own worldview.@k@v27/40700227. ......Your power to create something from nothing is beyond exceptional."'
24517: 'BEATRICE@r@v27/40700228."......It is simple to make a hundred from one.@k@v27/40700229. However, creating one from zero is not easy.@k@v27/40700230. ...When you become a full witch, you may not only be a match for me, but might even grow into a Great Witch that I must acknowledge as superior."'
24518: 'BEATRICE@r@v27/40700231."The Witch of Origins, perhaps.@k@v27/40700232. .........I, too, am greatly looking forward to your future."'
24519: 'Maria@r@v13/40400552."Uu!@k @v13/40400553.Beato said I have talent as a wi~tch!"'
24520: 'Sakutarou@r@v33/44200167.''Isn''t that great, Maria?!@k @v33/44200168.Uryu, Beato...thank you for praising Maria.'''
24521: 'BEATRICE@r@v27/40700233."*cackle*cackle*!@k @v27/40700234.There is no need to thank me, Sakutarou.@k@v27/40700235. That red scarf truly suits you.@k@v27/40700236. And I am envious of the talent of your master that enabled her to create a friend like you."'
24522: 'Sakutarou@r@v33/44200169.''Uryu~!@k @v33/44200170.Thanks for complimenting my scarf.@k@v33/44200171. I got it as a present from Maria.@k@v33/44200172. I really like it.'''
24523: 'BEATRICE@r@v27/40700237."And its size is truly as if it was created just for you.@k@|@y@v27/40700238. ......Yes, in light of this, I see that I must also give my new friend some kind of present."'
24524: 'Maria@r@v13/40400554."Uu?@k @v13/40400555.Beato, you''re giving Sakutaro a present......?"'
24525: 'BEATRICE@r@v27/40700239."A gift from a witch must be something with magical power, of course.@k@v27/40700240. In that case, so that your friend can remain your friend for all time, and so that you can have even more fun playing with him..."'
24526: 'BEATRICE@r@v27/40700241."I shall give Sakutarou my magic power.@k@v27/40700242. It should allow him to achieve an even stronger manifestation."'
24527: 'Maria@r@v13/40400556."Uu?@k @v13/40400557.I''ll be able to have much more fun playing with Sakutaro...?@k @v13/40400558.How?"'
24528: 'Sakutarou@r@v33/44200173.''Uryu......?@k @v33/44200174.What could it be, Maria...@k@v33/44200175. Is it something scary......?'''
24529: 'Maria@r@v13/40400559."Don''t worry.@k@v13/40400560. Beato won''t do anything scary.@k@v13/40400561. Right, BEATRICEEE?!"'
24530: 'BEATRICE@r@v27/40700243."Mm.@k@v27/40700244. I am certain that he will like it.@k@|@y@v27/40700245. .........Let us see then...yes, in order to achieve a stronger manifestation, a stronger image will be necessary.@k@v27/40700246. .........Well, now, what to do.@k@v27/40700247. Hmmmmmmmmmm..."'
24531: '@rBeato folded her arms and thought about what she could do to please them the most.'
24532: '@rAnd at that moment, there appeared...@w500.......the form of yet another witch.@k@rIt was Beato''s master, VIRGILIA.'
24533: '@rVIRGILIA truly was a Great Witch.'
24534: '@r...Since Maria already thought of Beato as a Great Witch, this person Beato called a Great Witch must have been a Great Great Witch.'
24535: '@rAccording to Beato, not even she could hold a candle to this witch when it came to magical power.'
24536: 'VIRGILIA@r@v30/43200001."My, my.@k@v30/43200002. I thought I heard some cheery voices.@k@v30/43200003. What a fun tea party this seems to be..."'
24537: 'BEATRICE@r@v27/40700248."Oh, Master.@k@v27/40700249. Perfect timing.@k@v27/40700250. I want you to take a look at this lion cub.@k@v27/40700251. I hear he''s Maria''s new friend."'
24538: 'VIRGILIA@r@v30/43200004."Hoh-hoh-ho.@k@v30/43200005. What an adorable little lion.@k@v30/43200006. ......I wonder if he can greet me?@k @v30/43200007.Hello, nice to meet you...?"'
24539: 'Sakutarou@r@v33/44200176.''U-uryuu!@k @v33/44200177.I, I''m Sakutarou.'''
24540: '@rSakutaro got back down onto Maria''s lap, and greeted VIRGILIA with half of his face poking out over the edge of the table.'
24541: '@r...He seemed to be very nervous since this was a witch that even Beato called Master.'
24542: 'VIRGILIA@r@v30/43200008."Hoh-hoh-ho.@k@v30/43200009. What a lovely name.@k@v30/43200010. ......As a reward for giving such a good greeting, here''s a sweet for you."'
24543: '@rAfter waving her hands about, VIRGILIA held the palm of her hand upwards, and made a movement as though lightly grasping some of the air.'
24544: '@rThen, she held that closed fist out in front of Sakutaro.'
24545: '@r............And when she opened it, there lay one of those individually wrapped cough drops.'
24546: 'Sakutarou@r@v33/44200178.''Uryuu?!@k @v33/44200179.It''s candy, Maria, oh wow, oh wow...!!'''
24547: 'Maria@r@v13/40400562."Uu!@k @v13/40400563.Isn''t that nice, Sakutaro?!@k @v13/40400564.Make sure to thank her."'
24548: 'Sakutarou@r@v33/44200180.''Uryu.@k@v33/44200181. Thank you very much for the candy.@k@v33/44200182. ...*bow*.'''
24549: '@rEven though VIRGILIA was a Great Great Witch, she still treated a stuffed animal like Sakutarou to an elegant greeting.'
24550: 'BEATRICE@r@v27/40700252."Still, Master, cough drops? Are you someone''s granny or something...?!@k @v27/40700253.Can''t you at least pull out some strawberry-milk candy~?"'
24551: 'VIRGILIA@r@v30/43200011."How mean.@k@v30/43200012. Perhaps I won''t give you candy anymore?"'
24552: 'BEATRICE@r@v27/40700254."Kuhhyahhyahhya, sorry, sorry.@k@|@y@v27/40700255. .........Well then, Maria.@k@v27/40700256. Take out your grimoire.@k@v27/40700257. And, of course, your writing tools."'
24553: 'Maria@r@v13/40400565."Uu?@k @v13/40400566.Okay, taking it out.@k@v13/40400567. Are we writing something?"'
24554: 'VIRGILIA@r@v30/43200013."......Oh? What''s happening now?"'
24555: 'BEATRICE@r@v27/40700258."I will use a magic I learned from you, Master.@k@v27/40700259. .........Magic to make a resident of another world manifest into a vessel."'
24556: 'BEATRICE@r@v27/40700260."I think that by applying that, I may be able to further strengthen the power manifesting this friend of Maria''s.@k@v27/40700261. ......I want to give that as a gift to Maria and her friend."'
24557: 'VIRGILIA@r@v30/43200014."I see.@k@v30/43200015. ...It shouldn''t be that difficult for a being that has already manifested.@k@v30/43200016. That seems like it will turn out to be a wonderful gift.@k@v30/43200017. Well then, I shall offer what modest help I can."'
24558: 'BEATRICE@r@v27/40700262."If you shall be signing for this magic personally as a witness, Master, that is greatly encouraging...!@k @v27/40700263.Rejoice, Maria.@k@v27/40700264. This shall be a wonderful gift...!"'
24559: 'Sakutarou@r@v33/44200183.''Uryu...?@k @v33/44200184.What''s happening...?@k @v33/44200185.It isn''t scary, is it?@k @v33/44200186.Is it...?'''
24560: 'Maria@r@v13/40400568."Don''t know.@k@v13/40400569. But don''t think it''s scary.@k@v13/40400570. ......Wonder what it is. Exciting, huh?"'
24561: '@rBeato borrowed the grimoire from Maria''s handbag and majestically riffled through the pages.'
24562: '@r......Then, finding an empty page among those with magic circles drawn on them, she flattened the book out.'
24563: '@rAnd after staring at Sakutarou with a smirk, she suddenly started darting her pen across the page.'
24564: '@r......It was something like a written proclamation made by witches to a higher-order world.'
24565: '@rMagic, which would take effect by BEATRICE writing it and VIRGILIA giving her signature as a witness.'
24566: '@rMaria didn''t understand what Beato was doing at first, but partway through, she figured out the wonderful magic power of this document, and her eyes began to sparkle...'
24567: 'Sakutarou@r@v33/44200187.''Uryu?!@k @v33/44200188.Uryu?!@k @v33/44200189.What is it, Maria, what''s she drawing?!@k @v33/44200190.Uryu-uryu?!'''
24568: '@rSakutarou was on her lap, so he didn''t know what was being written up on the table.'
24569: '@r......But even if he had seen, Sakutarou probably wouldn''t have understood.'
24570: 'Maria@r@v13/40400571."It''s amazing, Sakutaro!!@k @v13/40400572.Wait a bit, almost done, almost done!@k @v13/40400573.Beato that''s awesome, Beato that''s awesome!!"'
24571: 'VIRGILIA@r@v30/43200018.".........When it comes to writing documents of power, this child''s talent is splendid.@k@v30/43200019. I expect you could even work as a secretary in the netherworld."'
24572: 'BEATRICE@r@v27/40700265."How is this...?!@k @v27/40700266.It should be passable...!"'
24573: '@rAfter she had completed the thing she had been so intensely concentrating on, Beato looked over the document again from a distance.'
24574: '@r......It seemed she was fairly satisfied with her work.'
24575: '@rAnd Maria, upon also peeking in at it, let out a cry of wonder.'
24576: 'Maria@r@v13/40400574."......It''s amazing, Beato!!@k @v13/40400575.So cuuute!!@k @v13/40400576.Uu-uu-uu!!"'
24577: 'BEATRICE@r@v27/40700267."By the name of the Golden Witch BEATRICE, I hereby acknowledge Sakutarou, MARIA''s child.@k@|@y@v27/40700268. .........Master, if you would sign as a witness!"'
24578: 'VIRGILIA@r@v30/43200020."Yes, yes.@k@v30/43200021. ......By my name, I stand witness to and acknowledge this oath.@k@v30/43200022. .........It is done."'
24579: '@rVIRGILIA signed, completing the proclamation.'
24580: '@rIt was a powerful document that proclaimed to the beings of a higher world that Sakutarou had most certainly manifested in the human world.'
24581: '@rSakutarou, created by Maria, had received the recommendation of the two witches BEATRICE and VIRGILIA,@k and in this very moment, the higher world had accepted his existence.'
24582: '@r......That was the great magic of manifestation.'
24583: '@rAccording to Beato, it was apparently an incredible stroke of luck that VIRGILIA had been here.'
24584: '@rBecause the power residing in the proclamation would change drastically depending on the number and the ranks of the witches signing it.'
24585: '@rVIRGILIA in particular had many friends in the higher world,@k so her signature gave the proclamation a power with which Beato''s couldn''t even compare.'
24586: 'BEATRICE@r@v27/40700269."By this proclamation, I accept thee, Sakutarou, as an individual with thine own sense of self.@k@v27/40700270. And I welcome thee as a friend in accordance with the treaty of Mariage Sorciere.@k@v27/40700271. Henceforth, Sakutarou, thou art our common friend."'
24587: 'BEATRICE@r@v27/40700272."And as a gift, I shall bestow upon you a form appropriate to that status.@k@v27/40700273. Accept it."'
24588: '@rWith the grimoire still opened to the page with the proclamation, she turned it around and handed it to Maria.'
24589: '@rMaria showed it to Sakutarou on her lap.'
24590: '@rWhen Sakutarou beheld that proclamation,@k ............in his body made of cloth and cotton,@w500. he felt something hot and bright begin to dwell.'
24591: '@rEven as he looked around, nervous at this sensation that he had never felt before, that power strengthened,@k ......and eventually, a bright light completely swallowed him up...'
24592: 'Sakutarou@r@v33/44200191.''Uryu......?@k @v33/44200192.Uryu-uryu-uryu-uryu......!'''
24593: '@rAnd when that light disappeared...'
24594: '@r............There, Maria''s friend Sakutarou held a new form, and existed.@|@y'
24595: 'Maria@r@v13/40400577."Uu-uu-uu!@k @v13/40400578.You''re cute, Sakutaro!@k @v13/40400579.Reeeeally cute!"'
24596: 'Sakutarou@r@v33/44200193.''Uryu...?@k @v33/44200194.Uryuu...@k@v33/44200195. Does it really suit me?@k @v33/44200196.It isn''t embarrassing......?'''
24597: 'VIRGILIA@r@v30/43200023."Hoh-hoh-hoh-ho.@k@v30/43200024. It is a very lovely form, Sakutarou-chan."'
24598: 'BEATRICE@r@v27/40700274."I felt that the scarf was his charm point, you see.@k@v27/40700275. And the ears!@k @|@y@v27/40700276.Animal ears are nice indeed, truly cute!@k @v27/40700277.Allow me to nibble at them later.@k@v27/40700278. *cackle*!"'
24599: 'Maria@r@v13/40400580."Thank you, BEATRICEEE!!@k @v13/40400581.Thank you so much for the wonderful present!!"'
24600: 'BEATRICE@r@v27/40700279."There is no need for thanks.@k@v27/40700280. This is merely an expression of my respect for your wonderful magic and your friend."'
24601: 'BEATRICE@r@v27/40700281.".........And now that you have reached this level, it would not be odd for you to graduate from an apprentice at any time.@k@v27/40700282. Starting today, I shall initiate you in even newer and more fun forms of magic."'
24602: 'BEATRICE@r@v27/40700283."......From this point forward, you may call yourself MARIA, the Apprentice Witch of Origins."'
24603: 'Maria@r@v13/40400582."What''s the Witch of Origins...?"'
24604: 'BEATRICE@r@v27/40700284."Mm.@k@v27/40700285. It is the title of a witch who seeks to become a Creator.@k@v27/40700286. Right now, you are just an Enchanter, possessing only enough strength to breathe magical power into the small objects around you."'
24605: 'BEATRICE@r@v27/40700287."......But after one thousand years of training, it is not unthinkable that you could create not just your own system of magic, but even a galaxy."'
24606: 'VIRGILIA@r@v30/43200025."......The talent of the Witch of Origins is very rare.@k@v30/43200026. Even though everyone has it when they are young, no one can continue to hold onto it.@k@v30/43200027. ......This title is also proof that you have not lost your untainted heart."'
24607: 'Maria@r@v13/40400583."Uu!!@k @v13/40400584.Witch of Origins, wow!@k @v13/40400585.I''ll become one!@k @v13/40400586.I''m the Apprentice Witch of Origiiins!"'
24608: 'Sakutarou@r@v33/44200197.''Maria, that''s so cool...!@k @v33/44200198.The Witch of Origins, wow, awesome, uryuu!'''
24609: 'BEATRICE@r@v27/40700288."Eventually, you will probably be able to call yourself by the title of a full witch—Lady MARIA, the Witch of Origins.@k@v27/40700289. ......It may be a good time now to give not only Sakutarou, but you as well, an appearance fitting for your rank."'
24610: 'BEATRICE@r@v27/40700290.".........There.@k@v27/40700291. I shall give a proper outfit for one who, while an apprentice, is worthy of calling herself a witch."'
24611: '@rWhen Beato waved the pipe that was her wand,@k many gold butterflies appeared out of nowhere, grouped around Maria, and granted her a wonderful dress.'
24612: '@rEndowed with both cuteness and majesty, it was indeed a fitting article of clothing for the girl who would eventually take the name of the Witch of Origins...'
24613: 'Maria@r@v13/40400587."Oh wow...!!@k @v13/40400588.Awesome awesome awesome awesome!!@k @v13/40400589.So cute, so cute!@k @v13/40400590.I want to show these clothes to Mama too...!!@k @v13/40400591.Can''t I?"'
24614: 'BEATRICE@r@v27/40700292."The full dress of a witch must not be shown indiscriminately.@k@v27/40700293. Such a thing is worth more if you reserve it for those most grandiose occasions.@k@v27/40700294. *cackle*!"'
24615: '@rAnd then, the Great Witch, the witch, the witch''s apprentice, and their new friend Sakutarou, had a lively time enjoying their tea together......'
24616: 'Maria@r@v13/40400592.".........See?@k @v13/40400593.Look how happy I am.@k@v13/40400594. And look how fun this is."'
24617: 'Ange@r@v11/42000567."..........................."'
24618: 'Maria@r@v13/40400595."Please, don''t be afraid of being happy.@k@v13/40400596. Becoming happy isn''t the same thing as accepting your current misfortune.@k@v13/40400597. It means creating a new happiness within your current misfortune.@k@v13/40400598. That is the Magic of Origins."'
24619: 'Ange@r@v11/42000568."......I...didn''t want to acknowledge my current world.@k@v11/42000569. ......I couldn''t abide accepting such an isolated and painful world.@k@v11/42000570. ...That''s why, even though I was entranced by your world, Maria onee-chan,@v11/42000571. ......I couldn''t cross the final line."'
24620: 'Maria@r@v13/40400599."............I''ll teach you.@k@v13/40400600. About my Magic of Origins.@k@v13/40400601. No, I taught you before, right?@k@v13/40400602. And you used to be able to use it.@k@v13/40400603. Did you forget......?"'
24621: 'Ange@r@v11/42000572."..........................."'
24622: 'Maria@r@v13/40400604."You were also a witch apprentice, Ange, with your name entered into Mariage Sorciere, weren''t you?"'
24623: 'Ange@r@v11/42000573."............Yes.@k@v11/42000574. So I was.@k@v11/42000575. .........Mariage Sorciere,@v11/42000576. ...that takes me back.@k@v11/42000577. ......I also had my name entered in there at one point, didn''t I..."'