27040: 'Kinzo@r@v01/41500207."What is it you don''t understand?@k@v01/41500208. I am speaking extremely simply.@k@v01/41500209. I have said that I shall choose thirteen people from among the humans on this island and offer them as sacrifices for my ritual to revive BEATRICE."'
