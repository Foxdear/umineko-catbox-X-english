27245: 'Ronove@r@v31/43100070."No, I cannot authorize that.@k@v31/43100071. They are precious sacrifices.@k@v31/43100072. Wait for the Master''s authorization."'
27246: 'Chiester45@r@v35/43400006."Great Lord GOLDSMITH...!@k @v35/43400007.We await your orders...!"'
27247: 'Kinzo@r@v01/41500293."It is still too soon for the coming of the second twilight, ......is what the source of my magical power is whispering to me.@k@v01/41500294. Not now.@k@|@y@v01/41500295. Let them do as they like.@k@v01/41500296. They cannot escape from this island in any case."'
27248: 'VIRGILIA@r@v30/43200039."The source of your magical power is noise and risk and tests of luck.@k@|@y@v30/43200040. ......Hoh-hoh-ho, your whims, in other words?"'
27249: 'Kinzo@r@v01/41500297."Hhhhehhehheh, perhaps you could also put it that way.@k@v01/41500298. Good work, Gaap.@k@v01/41500299. Let us proceed steadily with the ritual from here on."'
27250: 'Kinzo@r@v01/41500300.".........Well then, that is that.@k@v01/41500301. Next is my grandchildren.@k@v01/41500302. .........I will test them to see whether they are qualified to succeed me.@k@|@y@v01/41500303. Let me see, how best to check their qualifications.@k@v01/41500304. Kuheheheh...!!"'
