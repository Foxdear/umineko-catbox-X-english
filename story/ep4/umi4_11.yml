27047: 'Kinzo@r@v01/41500218."Sorry, my friend.@k@v01/41500219. That was not a joke nor anything of the sort.@k@v01/41500220. It is what I bet my life on, the final ritual, the final game that I will challenge."'
27048: 'Kinzo@r@v01/41500221."Yes, this is a game!@k @v01/41500222.If gaining my fortune and leaving the island is your goal, then there are only two ways to achieve it!"'
