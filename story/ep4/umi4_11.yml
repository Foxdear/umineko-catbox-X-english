27252: 'Kinzo@r@v01/41500305."Of course.@k@v01/41500306. Yet still I will test them.@k@v01/41500307. ......Hmph, I doubt a woman can understand that contradiction, or my madness.@k@v01/41500308. Khhhahahahah..."'
27253: 'Gaap@r@v32/43700021.".........There''s always something not quite right about men.@k@v32/43700022. The very concept of playing with risk is beyond me."'
27254: 'Ronove@r@v31/43100073."Oh, and here I thought you loved that sort of thing?"'
27255: 'Gaap@r@v32/43700023."Of course.@k@v32/43700024. If a man whispers intimacies in my ear along with dangerous risk, I go head over heels.@k@|@y@v32/43700025. ...But only if he''s a stud!"@|@y'
27256: 'Ronove@r@v31/43100074."Pu ku ku ku ku ku...!"'
27257: 'VIRGILIA@r@v30/43200043."Quiet, please.@k@v30/43200044. No talking among yourselves."'
27258: 'Kinzo@r@v01/41500309."Hmph, truly noisy women.@k@v01/41500310. But at least they don''t bore me.@k@v01/41500311. ......This is why summoning is so gratifying.@k@v01/41500312. All of you will bear one side of the scales of noise and risk in my ritual.@k@v01/41500313. I am anticipating great results...!"'
27259: '@rSix brutally murdered corpses lay in the dining hall, which was tarnished by a red and gruesome decoration......'
27260: '@rBy now, it was impossible to imagine that thirteen people had been sitting here in an orderly manner just moments ago.'
27261: '@rKinzo lined up the demons of renown and their subordinates, loudly declared the beginning of an overwhelming night of mass murder,@k and swore to himself that he would certainly revive BEATRICE, and open the door to the Golden Land......'
27262: 'BEATRICE@r@v27/40700343."The wait is over!!@k @v27/40700344.At last the curtain rises on the first twilight!!@k @|@y@v27/40700345.*cackle*!@k @v27/40700346.That Kinzo, as usual, he loves being flashy.@k@v27/40700347. Who knew that this man, who can be more persistent than anything when he follows you around, could shine so when placed on the stage."'
27263: 'Battler@r@v10/40100265."Dammit......@k@v10/40100266. Always killing them in a gory way......@k@|@y@v10/40100267. Destroying half of their heads?!@k @v10/40100268.The sick shit you witches and demons pull never fails to piss me off...!"'
27264: 'Ange@r@v11/42001322."Destroying half of their heads...... I see.@k@v11/42001323. So she noticed that the most ideal method of killing, in all the games up until now, was this one."'
27265: 'Battler@r@v10/40100269."Ideal?@k @v10/40100270.How the crap is this grotesque way of killing ideal?!"'
27266: 'Gaap@r@v32/43700026."......It''s very much ideal.@k@v32/43700027. Try and remember the very first game."'
27267: 'Battler@r@v10/40100271."You......!@k @v10/40100272.So you''re that new demon or whatever that just appeared...@k@|@y@v10/40100273. Goddammit, so the witch''s corrosion advanced, and now there are even more unsavory characters...?!"'
27268: '@r......The more the witch''s corrosion progresses, the more Rokkenjima tilts towards the other world.'
27269: '@rThat''s why strange people keep appearing one by one.'
27270: '@rThis island is closed off by the typhoon, and not only can no Humans leave it, but new Humans can''t appear either.'
27271: '@rBut the more the corrosion progresses, the more witches and demons can appear, without limit.@k Increasing one by one.'
27272: '@rBy now, perhaps there are more demons than Humans among the characters appearing in this insane tale.@k ......Their numbers might be precisely the figure representing this mad corrosion.'
27273: '@rYeah, I''m sure that''s true.@k And not only are their numbers being affected by the corrosion, their fashion sense apparently is as well.'
27274: '@rIf the corrosion advances any further and even more weird people appear, just what in the world will they be wearing?@k .........It''s too scary for me to imagine...'
27275: '@r......Aaaah, seriously, give me a break...@k@rPlease, no more of these weird-ass people...!!'
27276: 'BEATRICE@r@v27/40700348."*cackle*cackle*cackle*! I can''t oblige—they''ll keep on coming, more and more!!@k @v27/40700349.I''ll defile the foolish "closed circle" rule Humans speak of, over and over again...!"'
27277: 'BEATRICE@r@v27/40700350."Welcome to my elegant game!@k @v27/40700351.Gaap!"'
27278: 'Gaap@r@v32/43700028.".........It''s been a long time, Riiche.@k@v32/43700029. Been well?@k @|@y@v32/43700030....In fact, you look pretty great.@k@v32/43700031. Have you gotten younger?@k @v32/43700032.You look two, maybe three hundred years younger than when I last saw you.@k@v32/43700033. ............Ah, I see."'
27279: '@rThe demon Grandfather had summoned and introduced as Gaap...@ktook a glance at me, and then grinned as though she''d figured something out on her own.'
27280: '@r......Honestly, I felt that smile was repulsive.'
27281: 'Battler@r@v10/40100274."Looks like she''s Beato''s friend.@k@v10/40100275. ......Which means she must be an extremely unsavory character.@k@|@y@v10/40100276. Anyway, they were saying something or other about a closed circle, but what does that mean?"'
27282: 'Ange@r@v11/42001324."Serial murder mystery novels that occur in places isolated from the outside world, like Rokkenjima is now, are sometimes called closed circles.@k@v11/42001325. Since it''s isolated from the outside, it''s like a circle that''s closed.@k@v11/42001326. ......Therefore, in general, the characters and suspects are limited."'
27283: 'Ange@r@v11/42001327."Having new possible suspects added on one after another from outside the circle goes against the etiquette of mystery novels.@k@v11/42001328. ......Basically, the witch is probably trying to desecrate Humans and the mystery genre."'
27284: 'Gaap@r@v32/43700034.".........So you are Gretel?@k @|@y@v32/43700035.I see, you look like a wise kid, ......*giggle*.@k@v32/43700036. I like that kind of kid.@k@v32/43700037. ......Their tongues just melt in the mouth."'
27285: 'Ange@r@v11/42001329."Gross.@k@v11/42001330. ......Keep the jokes to just your clothing."'
27286: 'Gaap@r@v32/43700038."It''s Devilish Pretty''s newest, "Jack the Ripper: Christmas Blood".@k@v32/43700039. ......Sorry for having a style that a country bumpkin from the Human world can''t understand."'
27287: 'Ange@r@v11/42001331."......Well, I can at least tell it''s breathable.@k@v11/42001332. Why don''t you add a gap down your head while you''re at it?@k @v11/42001333.Might help your brain cells breathe a bit as well."'
27288: 'BEATRICE@r@v27/40700352."Gaap is always sensitive to the fashions of the netherworld!@k @v27/40700353.But this year''s fads truly are bold.@k@v27/40700354. I think I''ll order something sometime...!"'
27289: 'Gaap@r@v32/43700040."For you, Riiche, I''d recommend Ali-Gray—Alice and the Graveyard.@k@v32/43700041. Let''s go to 666 sometime soon to look at the clothes.@k@v32/43700042. You should come over to the netherworld every now and then."'
27290: 'BEATRICE@r@v27/40700355."When this game is over, I''ll be sure to do that.@k@v27/40700356. *cackle*cackle*!"'
27291: 'Gaap@r@v32/43700043.".........Still, your two opponents are pretty cute, Riiche.@k@|@y@v32/43700044. I''ll bet this kid has figured out the meaning of the corpses with their heads half smashed.@k@v32/43700045. .........Do you get it, girl......?"'
27292: 'Battler@r@v10/40100277."......Just now, she told me to remember the first game.@k@v10/40100278. ......What did that mean...?"'
27293: 'Ange@r@v11/42001334."Just what it sounds like.@k@v11/42001335. ......Remember the first twilight of the very first game.@k@v11/42001336. ......When the adults'' corpses were found in the gardening shed with the magic circle drawn on it.@k@v11/42001337. Remember?"'
27294: '@rEpisode 1.@k The first twilight.'
27295: '@rSix people—Krauss, Rudolf, Kyrie, Rosa, Shannon, and Gohda—had died, and each of them had had their head pulverized.........'
27296: 'Ange@r@v11/42001338."At that time, there were two types of corpses.@k@v11/42001339. The ones with their faces pulverized, and the ones with half of their faces pulverized."'
27297: 'BEATRICE@r@v27/40700357."That''s right.@k@v27/40700358. Four with their faces smashed—Rudolf, Kyrie, Rosa, and Gohda.@k@v27/40700359. Two with the sides of their heads smashed—Krauss and Shannon."'
27298: 'BEATRICE@r@v27/40700360."......At the time, I had fickly created two types of corpses,@k@v27/40700361. but I realized that the former, more atrocious type was actually disadvantageous for me."'
27299: 'Battler@r@v10/40100279."......Disadvantageous for you......?@k @|@y@v10/40100280.............Right.@k@v10/40100281. I get it."'
27300: '@rThat''s right.@k The smashed faces might look atrocious.@k@r......But they made it hard to confirm the identity of the person.'
27301: '@rFor example, at that time, Uncle Krauss and Shannon-chan had had their heads only half-smashed.'
27302: '@rThat itself was of course atrocious, but because half of their faces remained, it was easy to confirm their identity.'
27303: '@rBut Dad and the other three were different.'
27304: '@rBecause his face had been completely destroyed, even I, his son, could only guess that it had to have been Dad because of his clothes and the like.'
27305: '@r......In short, it remained unclear until the end whether that really was Dad''s corpse.'
27306: 'Battler@r@v10/40100282."If this reasoning battle had taken place during the first game as well,@k@v10/40100283. I would probably have claimed that, since it was impossible to confirm that those corpses were indeed Dad and the others, there was a possibility that one was a fake corpse.@k@v10/40100284. ......After all, Beato didn''t state anything in red during that game whatsoever."'
27307: 'Gaap@r@v32/43700046."Well done. Correct.@k@v32/43700047. .........A faked death is one of the basics of the mystery genre.@k@v32/43700048. Even if you make a doctor examine the corpse, you can''t trust the results if you suspect him of being in league with the culprit.@k@v32/43700049. So, corpses that can''t guarantee a death for certain always put the witch side at a disadvantage."'
27308: 'Ange@r@v11/42001340."You can suspect faked deaths for all corpses, and hypothesize that they are the culprit for the incidents that follow.@k@|@y@v11/42001341. ......It''s a move Battler doesn''t like, but it''s the most elementary move to use against a witch."'
27309: 'Battler@r@v10/40100285."Yeah, that''s right.@k@v10/40100286. That''s why Beato started using the red.@k@v10/40100287. ......With the red truth, she can carry out a perfect autopsy."'
27310: 'BEATRICE@r@v27/40700362."*cackle*cackle*!@k @v27/40700363.That''s how it is.@k@v27/40700364. Normally, for the tragedy of the first twilight,@k@v27/40700365. I would use the red truth right away, confirming the deaths of these six."'
27311: 'BEATRICE@r@v27/40700366."However, as you know, my battle strategy this time is the complete opposite of previous games, and I have switched to using red truth starvation tactics...!"'
27312: 'BEATRICE@r@v27/40700367."I will not use the red easily given that you use it as a grounding from which to counterattack.@k@v27/40700368. I can just make you come apart at the seams by using the minimum necessary amount of red in just a single place!"'
27313: 'BEATRICE@r@v27/40700369."What this means is that no matter how I permit you to rant about your theories for each of the locked rooms, ultimately,@k@v27/40700370. I need only smash one of those with a single red truth."'
27314: 'Battler@r@v10/40100288."Ihihi!@k @v10/40100289.You''ve been knocking me about with that thing all this goddamn time, and now I''ve started using it to counterattack, you''ve gone and put it away again.@k@v10/40100290. What a joke."'
27315: 'BEATRICE@r@v27/40700371."Anyways, I don''t wanna use the red, I wanna be stingy!@k @v27/40700372.I wanna bully Battleeer!!"'
27316: 'BEATRICE@r@v27/40700373."But how could I guarantee a death for certain without using red?@k@v27/40700374. I racked and racked my brains over it.@k@v27/40700375. ......It was Gaap that gave me the idea!@k @v27/40700376.It truly was a simple method.@k@v27/40700377. *cackle*cackle*!"'
27317: 'Gaap@r@v32/43700050."......I just said something obvious and you hit upon the idea.@k@v32/43700051. I simply said that you just have to create corpses whose identity and total death can be easily appreciated by anyone who looks at them."'
27318: 'BEATRICE@r@v27/40700378."Kuhhihihihi!@k @v27/40700379.In short, I combined the two!@k @v27/40700380.The face, which is necessary to distinguish their identity; and the symbol of total death, the pulverization of the head, which is the vessel for the soul!"'
27319: 'BEATRICE@r@v27/40700381."When I put those two parts neatly together, oh, hey presto!@k @v27/40700382.Out came the <perfect> answer of corpses with their heads half destroyed!"'
27320: 'Battler@r@v10/40100291."I''ll bet you love two-flavor bread and two-flavor ice cream.@k@v10/40100292. Your greedy childish tastes are so obvious..."'
27321: 'Ange@r@v11/42001342.".........In any event,@k@v11/42001343. even if their heads are half destroyed, we shouldn''t assume that they''re dead at this point in time."'
27322: 'Battler@r@v10/40100293."I know.@k@v10/40100294. ......Since Beato is holding out on me and refusing to say anything in red, I should suspect everything.@k@|@y@v10/40100295. ......Of course, there''s no way in hell I''m gonna swallow the magic mass-murder by the sexy-assed Chiester babes."'
27323: 'Gaap@r@v32/43700052."*giggle*.@k@v32/43700053. You certainly have become shrewd.@k@v32/43700054. ......If this were the first game, you would have swallowed everything."'
27324: 'BEATRICE@r@v27/40700383."*cackle*cackle*!@k @v27/40700384.An adversary must be like that, or he wouldn''t be interesting."'
27325: 'BEATRICE@r@v27/40700385."There is no red for now—I suggest you capitalize on that to let your imagination run wild and build up theory upon theory.@k@v27/40700386. At the very end, at the very sweetest spot, I''ll cut them all down at once with the red truth...!"'