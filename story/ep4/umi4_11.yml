27031: 'Kinzo@r@v01/41500202."......Hehheheheheh!@k @v01/41500203.It is not easy to gather thirteen sacrifices.@k@v01/41500204. But tonight is the family conference!@k @v01/41500205.Look how many have gathered on Rokkenjima.@k@v01/41500206. There could be no other day on which to carry out this ritual."'
