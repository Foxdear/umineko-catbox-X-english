27065: 'Kinzo@r@v01/41500235."Good-bye, my bungling sons and daughters.@k@v01/41500236. And for the final and only time in your lives, be of use to me, for my ritual...!!@k @|@y@v01/41500237.Arise, Pendragon Memorial Troops...!!"'
