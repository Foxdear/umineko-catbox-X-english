27054: 'Rudolf@r@v08/41200096."Sorry, Dad,@k@v08/41200097. but I don''t have a clue what you''ve started going on about......"'
27055: 'Rudolf@r@v08/41200098."You''re free to start up whatever weird ritual you want to revive the witch you love.@k@v08/41200099. That''s your hobby, after all.@k@v08/41200100. But dragging me into all that, and making me into......hahaha, a sacrifice, is just not gonna happen."'
27056: 'Eva@r@v05/41000105."Rudolf, who asked you to chip in?!"'
27057: 'Rudolf@r@v08/41200101."What are you talking about, Aneki?!@k @v08/41200102.You think I''m gonna sit here nodding my head at this, are you nuts?!"'
27058: '@rWas the "ritual" Kinzo had mentioned literally the frightening thing it seemed to be,@k or was it some kind of test to choose his successor?'
