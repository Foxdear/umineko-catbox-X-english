27196: 'Ronove@r@v31/43100056."......Even though it is only in the area of summoning, to think that he far surpasses Milady is......frightening.@k@v31/43100057. The Ushiromiya blood makes my own run cold."'
27197: 'Kinzo@r@v01/41500277."I will be putting all I have as a summoner into the execution of BEATRICE''s resurrection ritual.@k@v01/41500278. It''s still not enough.@k@v01/41500279. In order to perfectly succeed in the ritual this time, I shall summon more."'
27198: 'Kinzo@r@v01/41500280."The Pendragon Memorial Troops, Ronove, and VIRGILIA...@k@v01/41500281. ......I can still call more... With my magical power, I can still call many more......!!"'
