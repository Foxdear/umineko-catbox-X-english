27060: '@rBut Kinzo''s response to this was clear.'
27061: 'Kinzo@r@v01/41500227."Well, that is all I have to say.@k@v01/41500228. Nooo objections or viewpoints are necessary...!!"'
27062: 'Kinzo@r@v01/41500229."I will simply awaken from my dream in which I have four failures for children.@k@v01/41500230. To all of you, what will occur now before your very eyes will no doubt seem like a dream, an illusion, an unearthly world that defies understanding."'
