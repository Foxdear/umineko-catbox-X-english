27178: 'Kinzo@r@v01/41500262."Hahhahahahahaha, wahhahahahahahahahahahahaha!!@k @v01/41500263.The curtain has finally risen!@k @v01/41500264.It''s the beginning of the ritual to revive BEATRICE...!!"'
27179: 'Kinzo@r@v01/41500265."You lucky ones who have managed to escape the first twilight, allow me to introduce you to my friends.@k@|@y@v01/41500266. Arise, my friend!@k @v01/41500267.Ronove...!!"'
