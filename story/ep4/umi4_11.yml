26727: '@rIt was already approaching ten at night.@k@rThe typhoon had already engulfed Rokkenjima.'
26728: '@rEven the rose garden that had looked so beautiful during the day...@kwas now being beaten down upon by the fierce winds and resisting with all its might, undulating and trying to keep the flowers from blowing away...'
26729: '@rHeading for the guesthouse through that rose garden, led by Shannon, were Battler, who was holding up an umbrella; Jessica; and Maria, who was sleeping on George''s shoulder.'
26730: 'Battler@r@v10/40100235."It''s just to the guesthouse, we could make it there on our own...@k@v10/40100236. Shannon-chan, it''s OK, go back and rest."'
26731: 'Shannon@r@v15/40500001."Oh, no, accompanying you is also my duty..."'
26732: 'Jessica@r@v04/40200008."The family conference is going on inside, and my mom and Genji-san are on edge, that''s the thing.@k@v04/40200009. If we''re too considerate to her, they''ll get the wrong idea and think she''s slacking off."'
26733: 'George@r@v07/40300015."That''s right.@k@v07/40300016. Just graciously accepting her offer will actually cause her less trouble.@k@|@y@v07/40300017. ...Thanks, Shannon."'
26734: 'Shannon@r@v15/40500002."Not at all.@k@v15/40500003. ......Certainly, as Milady says, it is very tense inside the mansion today.@k@|@y@v15/40500004. Coming with all of you has allowed me a breath of fresh air, and taken some of the stress off me."'
26735: 'Battler@r@v10/40100237."The family conference, huh.@k@v10/40100238. .........They went to all the trouble of chasing us kids out, so they''re probably having a pretty damn nasty discussion."'
26736: 'George@r@v07/40300018."Probably.@k@v07/40300019. I''m sure there''s nothing we can do to help out.@k@v07/40300020. Just making sure to stay out of their way is the best way for us to be useful, I think."'
26737: 'Jessica@r@v04/40200010."Feh......!@k@v04/40200011. You can bet your ass they''re just going on about money money money again."'
26738: 'Jessica@r@v04/40200012."...They act like they''re so rich most of the time, but when it comes down to handing out cash, they start hemming and hawing.@k@v04/40200013. Why can''t they just be generous and split it evenly between everyone?"'
26739: 'Battler@r@v10/40100239."Ihihi.@k@v10/40100240. That''d be awesome.@k@v10/40100241. It''d be great if I got a share too.@k@|@y@v10/40100242. ''Cause if I got some as well, I''d split it with Shannon-chan right away."'
26740: 'Shannon@r@v15/40500005."Th-thank you very much...@k@v15/40500006. That''s alright, but I appreciate the offer."'
26741: 'George@r@v07/40300021."You aren''t materialistic at all, are you, Shannon?@k@v07/40300022. Normally, girls of your age have plenty of things they want to buy."'
26742: 'Shannon@r@v15/40500007."Yes.@k@v15/40500008. But none of the things I want can be bought with money."'
26743: 'Battler@r@v10/40100243."Ooh!@k @v10/40100244.So ungreedy!@k @|@y@v10/40100245.If you lined up all the things I wanted, all the gold in the world wouldn''t be enough."'
26744: 'Jessica@r@v04/40200014."Nothing you can buy, she said.@k@|@y@v04/40200015. I wonder what these "things that can''t be bought" that Shannon wants a~re.@k@v04/40200016. Any idea, George nii-san?"'
26745: 'George@r@v07/40300023."W-well, I wonder.@k @v07/40300024.I guess only Shannon would know."'
26746: 'Shannon@r@v15/40500009."I, ...I don''t know either."'
26747: '@rGeorge and Shannon looked down with their faces red.'
26748: '@rBattler had also heard the details, so he knew what Jessica was teasing them about.'
26749: 'Battler@r@v10/40100246."George-aniki is someone even I can respect.@k@v10/40100247. I think you''ve met a really great person, Shannon-chan."'
26750: 'Jessica@r@v04/40200017."Yeah.@k@v04/40200018. I can rest easy knowing Shannon is in good hands."'
26751: 'George@r@v07/40300025."St-stop teasing.@k@v07/40300026. It''s a serious issue for us.@k@|@y@v07/40300027. More importantly, what about you, Jessica-chan?@k @v07/40300028.Have you been able to get a little closer to Kanon-kun?"'
26752: 'Battler@r@v10/40100248."Whaaaaaaaaat?!@k @v10/40100249.So, you and Kanon-kun are like that?!"'
26753: 'Jessica@r@v04/40200019."Ah, um, mgh!!@k @v04/40200020.Th-that''s dirty, George nii-san, twisting the conversation around like that is just mean!"'
26754: '@rAs they had an animated discussion with ups and downs,@k the four kids headed for the guesthouse.......'
26755: '@rThe annual family conference was extremely important to the Ushiromiya family,@k and this year in particular seemed like it was going to be especially so.'
26756: '@rApparently, the family head, Kinzo, was personally going to be making a very serious announcement,@k and everyone other than the adults had been strictly ordered to leave the mansion.'
26757: '@rBattler hadn''t attended the family conference in six years, so he hadn''t really noticed,@k but according to Jessica, there seemed to be a very tense atmosphere tonight,@k completely different from a normal year.'
26758: '@r......Common sense made it clear that Kinzo, whose remaining life was short,@k was going to make some big announcement about the succession of the head and the distribution of his fortune......'
26759: 'Battler@r@v10/40100250."I''m surprised.@k@v10/40100251. .........To think that Grandfather is actually going to make an appearance......"'
26760: 'Ange@r@v11/42001316."......I see.@k@v11/42001317. So this is the witch''s counterattack."'
26761: 'BEATRICE@r@v27/40700325."*cackle*cackle*cackle*!@k @|@y@v27/40700326.I wanted to leave the Joker called Kinzo face-down a little longer, but it is probably about time to turn it over.@k@v27/40700327. Trump cards exist to be used.@k@v27/40700328. *cackle*cackle*!"'
26762: 'Battler@r@v10/40100252."Damn.@k@v10/40100253. So my theory that Grandfather was dead since the beginning, and a mysterious 18th person had snuck in in his place...@k@v10/40100254....is now suddenly torn apart."'
26763: 'BEATRICE@r@v27/40700329."I had foreseen that you would begin to doubt Kinzo eventually...!@k @v27/40700330.Come on, come on, your reasoning is back to square one once again, you know?"'
26764: 'BEATRICE@r@v27/40700331."With this, your theory that Kinzo was dead at the very beginning and I was hiding as the 18th person goes poof!@k @v27/40700332.*cackle*cackle*cackle*!!"'
26765: 'Battler@r@v10/40100255.".........Goddammit...@k@v10/40100256. But no way I''ll lose heart.@k@|@y@v10/40100257. That''s only one theory gone.@k@v10/40100258. I''ll attack you like a storm, like a tornado......"'
26766: 'BEATRICE@r@v27/40700333."*cackle*cackle*!@k @v27/40700334.I would have it no other way!@k @|@y@v27/40700335.Even the first twilight has not yet begun.@k@v27/40700336. It is far too early to give up."'
26767: 'Ange@r@v11/42001318."That''s right.@k@v11/42001319_b. And it''s not like it was denied with the red truth.@k@v11/42001320. .........At this point in time, Battler''s theory hasn''t been defeated.@k@v11/42001321. It''s too early to say that you''ve won."'
26768: 'Battler@r@v10/40100259."Hmm, you''re right.@k@v10/40100260. ......It is still too early for me to simply swallow her story.@k@v10/40100261. ...Grandfather is supposed to be finally appearing,@k@v10/40100262. but there''s also a chance that there''ll be a lot of talk about how his health has gotten worse and he won''t appear after all."'
26769: 'Battler@r@v10/40100263."......Uncle Krauss might simply be trying desperately...@k@v10/40100264.to hide the fact that Grandfather really is dead until the last second."'
26770: 'BEATRICE@r@v27/40700337."Ha...!@k @v27/40700338.I see, I see, you could also think of it that way.@k@|@y@v27/40700339. Do as you please.@k@v27/40700340. It will be resolved soon.@k@v27/40700341. Very soon...@k@v27/40700342. *cackle*cackle*......!"'
26771: '@rAll of the relatives and Nanjo could be seen in the dining hall.'
26772: '@rNanjo sat alone, quietly watching the wind and rain outside.'
26773: '@rKrauss was sitting in the seat of his own rank, with Natsuhi standing motionlessly at his side.'
26774: '@rAll the other siblings and their partners were gathered at the opposite end of the long table, whispering to each other......'
26775: 'Rudolf@r@v08/41200057."......Is that true?"'
26776: 'Rosa@r@v12/41400246."Yes.@k@v12/41400247. ......Maria said...the person who gave her the umbrella...@|@y@v12/41400248....was Father."'
26777: 'Hideyoshi@r@v06/41100032."Son of a gun...@k@v06/41100033. Then that means the foundation of our strategy has collapsed...!"'
26778: 'Eva@r@v05/41000044."Not just our strategy.@k@v05/41000045. Since Father is healthy and has said that he will make an announcement himself, our trivial bargaining with Nii-san was completely pointless."'
26779: 'Rudolf@r@v08/41200058."Yup.@k@|@y@v08/41200059. ......That old bastard.@k@v08/41200060. Why couldn''t he have just shown himself right away instead of dragging it out?@k@v08/41200061. Thanks to that, we''ve just been quarreling with Aniki uselessly."'
26780: 'Kyrie@r@v09/41300120."............Maybe that''s what he wanted to test?@k @|@y@v09/41300121.Maybe it''s not my place to say it, since we aren''t related by blood, but your father is very intelligent, you realize?"'
26781: 'Eva@r@v05/41000046."Our exchange during the day was probably being listened in on by one of the servants, and reported to Father.@k@v05/41000047. .........Incredible.@k@v05/41000048. The fact that we''re clamoring after Father''s inheritance is now clear as day to him...@k@v05/41000049. .........Ah, just incredible..."'
26782: '@rEva held her head, uncharacteristically dejected.'
26783: '@rIf, as Kyrie had said, this had been Kinzo''s design from the beginning—@ka huge setup spread over more than a year in a bid to find the siblings'' true natures—@kthen they had fallen for it completely...'
26784: 'Hideyoshi@r@v06/41100034."......We still don''t know for sure that it''s reached Father''s ears."'
26785: 'Eva@r@v05/41000050."No, it definitely has!@k @v05/41000051.......And everyone but Nii-san claimed that he was dead, and none of us believed in his good health...!"'
26786: 'Eva@r@v05/41000052."Aaah, we''re done for.......@k@v05/41000053. ......He''ll make an announcement.@k@v05/41000054. He''ll say that Nii-san will become the successor, and that we aren''t even qualified to wear the One-winged Eagle......@k@|@y@v05/41000055. ......Ahhh, I............"'
26787: 'Rosa@r@v12/41400249."Nee-san...... Don''t give up......"'
26788: 'Kyrie@r@v09/41300122."......Rosa-san.@k@v09/41300123. I wonder whether Maria-chan really did receive that umbrella from Father?"'
26789: 'Rosa@r@v12/41400250."Huh?@k @v12/41400251.What do you mean......?"'
26790: 'Kyrie@r@v09/41300124."......Maria-chan might have met Father.@k@v09/41300125. But we haven''t.@k@|@y@v09/41300126. Maria-chan only claims to have met him."'
26791: 'Rosa@r@v12/41400252."What......?@k@v12/41400253. ......Are you saying that Maria is telling a lie?!"'
26792: 'Rudolf@r@v08/41200062."Calm down, Rosa.@k@v08/41200063. ......We''re not calling Maria-chan a liar.@k@v08/41200064. But she''s the kind of kid who accepts what people tell her, right?"'
26793: 'Rudolf@r@v08/41200065."......For example, if, say, Genji-san came up to her and said something like "I was told by your grandfather to hand this to you, Maria-sama",@k@v08/41200066. then even if Maria-chan hadn''t met Dad, she still might say that she got an umbrella from him, right?"'
26794: 'Eva@r@v05/41000056."Th-......that''s right.@k@v05/41000057. That could be the trick...!"'
26795: 'Hideyoshi@r@v06/41100035."But what Maria-chan said was this, right?@k @v06/41100036."Grandfather came and handed me an umbrella"."'
26796: 'Rosa@r@v12/41400254."Yes, it was.@k@v12/41400255. She was clear that she received the umbrella directly from her grandfather."'
26797: 'Rudolf@r@v08/41200067."......Directly, huh?@k@v08/41200068. Well, that''s that, then."'
26798: 'Kyrie@r@v09/41300127."...........................@k@|@y@v09/41300128. Whoever said that the thinking of the incompetent can pass for sleeping was absolutely right.@k@v09/41300129. If you think about it a bit, all this about the umbrella is irrelevant."'
26799: 'Eva@r@v05/41000058."Why?@k @v05/41000059.Maria-chan could have been bribed by Nii-san to lie and say something that made it seem like Father was in good health, couldn''t she?!@k @v05/41000060.There is no evidence that Father actually handed the umbrella to her...!"'
26800: 'Kyrie@r@v09/41300130."No matter who Maria-chan received the umbrella from,@k@v09/41300131. or even if she never was given an umbrella in the first place,@k@v09/41300132. Father will appear very soon.@k@v09/41300133. With Father in front of us, the question of the umbrella will be completely irrelevant."'
26801: 'Kyrie@r@v09/41300134.".........In other words, the only time that the umbrella question comes into play is the other case."'
26802: 'Rudolf@r@v08/41200069."What do you mean, the other case?"'
26803: 'Hideyoshi@r@v06/41100037."............Ah, ...I got it.@k@v06/41100038. ......This is probably what Kyrie-san''s sayin''."'
26804: 'Hideyoshi@r@v06/41100039.".........We''re bein'' told that Father is comin'' here any moment,@k@v06/41100040. but there''s still a chance of some excuse why he won''t turn up in the end, right......?"'
26805: 'Eva@r@v05/41000061."I, .........I see.@k@v05/41000062. That''s true..."'
26806: 'Eva@r@v05/41000063."Maybe Nii-san just said Father was going to appear off the top of his head, in a desperate bid to buy time against our investigation.@k@v05/41000064. Father really has passed away already,@k@v05/41000065. and Nii-san is still lying and saying he''s in good health...!"'
26807: 'Kyrie@r@v09/41300135."In short, if Father appears, then no schemes will be effective.@k@v09/41300136. There''s no need to even think about it.@k@v09/41300137. We''re fish on the chopping board.@k@v09/41300138. We''d have no choice but to leave fate to the heavens and face direct negotiations with Father.@k@v09/41300139. No choice but to beg for money, in the expectation that we''ll need to prostrate ourselves and be subjected to his fists."'
26808: 'Kyrie@r@v09/41300140."......But on the other hand, if Father doesn''t appear, then our original strategy isn''t hampered in the least."'
26809: 'Rosa@r@v12/41400256.".........I see.@k@v12/41400257. Then, no matter which way it goes, there''s absolutely no need to get flustered now."'
26810: 'Kyrie@r@v09/41300141."That''s it.@k@v09/41300142. If Father shows up, it simply means that the family conference will be carried out as normal.@k@v09/41300143. .........If he doesn''t, we just have to continue to press Krauss nii-san."'
26811: 'Hideyoshi@r@v06/41100041."He might start off sayin'', Father''s mood has suddenly gotten worse and...@k@v06/41100042. We gotta make absolutely sure not to let Krauss-san talk his way out of it."'
26812: 'Eva@r@v05/41000066."......It seems what we should really be trying to figure out...@k@v05/41000067.is what scheme Nii-san is going to try to use to buy himself some time.@k@v05/41000068. I know better than anyone just how far he''ll go to refuse to admit defeat."'
26813: 'Rosa@r@v12/41400258."If Father is well, ......then we prostrate ourselves and beg for money.@k@v12/41400259. ......If it''s Krauss nii-san''s farce, then we continue our ugly sibling fight.@k@|@y@v12/41400260. .........Seems like this year''s family conference is going to be as wonderful as ever."'
26814: 'Rudolf@r@v08/41200070."Yep.@k@v08/41200071. The thinking of the incompetent can pass for sleeping, then.@k@|@y@v08/41200072. It''s almost ten.@k@v08/41200073. ......Should we press Aniki?"'
26815: '@rRudolf and the rest looked at Krauss.'
26816: '@rFirmly seated, he looked like he was awaiting Kinzo''s arrival with an air of composure.'
26817: '@r......They couldn''t tell whether that really was composure, or whether he was scheming about how to tie together his lie.'
26818: 'Natsuhi@r@v03/40900040."............Dear......"'
26819: 'Krauss@r@v02/40800083."......Calm yourself.@k@v02/40800084. Making a fuss here won''t achieve anything.@k@v02/40800085. .........Let''s leave it to Genji-san."'
26820: 'Natsuhi@r@v03/40900041."It''s almost......ten o''clock, isn''t it."'
26821: '@rThat was the time that had been set for tonight''s family conference to open.'
26822: '@rAnd in addition, it was also the time that the Ushiromiya family head needed to appear......'
26823: '@rRight then, they heard the sound of footsteps approaching from the hall.@k@rThere were multiple sets.'
26824: '@rNatsuhi jerked her head up with a start......'
26825: '@rBut there came the sound of a knock, and her expression filled with disappointment.'
26826: '@rBecause Kinzo probably wouldn''t have knocked.'
26827: 'Gohda@r@v17/41700001."......Please excuse us.@k@v17/41700002. We have finished closing up the mansion for the night."'
26828: '@rIt was Gohda and Kumasawa.'
26829: '@rUnlike the physically fit Gohda,@k it was rare for Kumasawa with her old body to still be tasked with work this late.'
26830: '@rOf course, Krauss also seemed to know that.'
26831: 'Krauss@r@v02/40800086."Mmhm.@k@v02/40800087. Good work.@k@v02/40800088. .........My apologies for making you work at such a time, Kumasawa-san."'
26832: 'Kumasawa@r@v18/41800001."Oh, not at all.@k@v18/41800002. I may not look it, but staying up late is still one of my specialties.@k@v18/41800003. Hoh-hoh-hoh-ho...!"'
26833: 'Natsuhi@r@v03/40900042."......Could we not at least relieve Kumasawa of the duty of being an observer?@k@v03/40900043. It really will be difficult on her body, I imagine."'
26834: 'Krauss@r@v02/40800089."............The order was to gather all of the servants as well.@k@v02/40800090. I cannot disobey."'
26835: '@rTonight''s family conference was clearly different from a normal one.'
26836: '@rOn a normal year, no one was able to attend the family conference except relatives.@k@rIt would have been inconceivable for any servants to be present.'
26837: '@rBut this year was different.'
26838: '@rThey had been told to have all of the servants in attendance for the family conference.@k@rOf course, they would not be allowed to speak.@k .........They were there as observers.'
26839: '@rJust what in the world was going to happen that needed five servants to observe?'
26840: '@r......Even Krauss didn''t know.'
26841: 'Kumasawa@r@v18/41800004."Hoh-hoh-ho.@k@v18/41800005. Believe it or not, I''m good at pulling all-nighters.@k@|@y@v18/41800006. If you stuff yourself with mackerel too, Krauss-sama, you''ll be able to keep going all night as well."'
26842: 'Krauss@r@v02/40800091."Hahahaha.@k@v02/40800092. I see, so there''s energy in you yet.@k@v02/40800093. No doubt you''ll still be working with such energy when you''re past a hundred."'
26843: 'Gohda@r@v17/41700003."Madam.@k@v17/41700004. Forgive my presumption, but I have prepared a light snack.@k@v17/41700005. It is ready to be served at any time—just give the word."'
26844: 'Natsuhi@r@v03/40900044."Thank you.@k@v03/40900045. You really are considerate.@k@v03/40900046. ......Please ask our guests whether they would care for some more coffee."'
26845: 'Gohda@r@v17/41700006."Certainly."'
26846: '@rAfter bowing slightly, Gohda took the pot towards the relatives gathered at the other end of the table.'
26847: '@rAs he did, more footsteps approached from the hallway.'
26848: '@r......A single set.@k They were light.'
26849: '@rEven before the knock, they could imagine who it was.'
26850: 'Shannon@r@v15/40500010."Excuse me......@k@|@y@v15/40500011. I have taken the children to the guesthouse."'
26851: 'Natsuhi@r@v03/40900047."Good work.@k@v03/40900048. Tonight is a special evening.@k@v03/40900049. Make sure you stay alert."'
26852: 'Shannon@r@v15/40500012."Ye-yes.@k@v15/40500013. Certainly, Madam......"'
26853: '@rGenji, accompanied by Kanon, had gone to meet Kinzo.@k@r......There was still no sign of their return.'
26854: '@rThe hands of the clock were creeping past ten.@k@rOnce sure of that, Eva spoke to Krauss.'
26855: 'Eva@r@v05/41000069."......Nii-saaan?@k @v05/41000070.It''s time.@k@v05/41000071. Is the family conference still not going to start?"'
26856: 'Krauss@r@v02/40800094."............The arrival of the guest of honor has been delayed.@k@v02/40800095. Wait a short while."'
26857: 'Eva@r@v05/41000072."How long?@k @v05/41000073.Sorry, but I''m setting a time limit on this.@k@v05/41000074. I won''t have you saying "Father hasn''t quite shown up yet" over and over until dawn."'
26858: 'Krauss@r@v02/40800096."How can I make a promise about the time Father will show up?@k@v02/40800097. Why are you in such a rush?@k@v02/40800098. Why not drink some coffee and calm down for now...?"'
26859: 'Rudolf@r@v08/41200074."Aniki, we''re gathered here for a family conference.@k@v08/41200075. Not a farce.@k@|@y@v08/41200076. We''ll wait thirty more minutes.@k@v08/41200077. But if that gets us nothing, we''re barging into the study."'
26860: 'Natsuhi@r@v03/40900050."B-barging into......@k@v03/40900051. That would be an action quite lacking in respect for the head!"'
26861: 'Eva@r@v05/41000075."It would, wouldn''t it? Sorry about that.@k @v05/41000076.We''ll sit tight for thirty more minutes.@k@v05/41000077. Hehheheheh......"'
26862: 'Krauss@r@v02/40800099.".....................Heh."'
26863: 'Eva@r@v05/41000078."...........................@k@v05/41000079. I look forward to seeing whether you can keep that same smile thirty minutes from now."'
26864: 'Krauss@r@v02/40800100."......You honestly believe that Father is dead?"'
26865: 'Eva@r@v05/41000080."I have no desire to discuss that at this point.@k@v05/41000081. We just have to wait until Father comes here.@k@|@y@v05/41000082. There''s absolutely no need for me to argue you down, Nii-san."'
26866: 'Krauss@r@v02/40800101."The Ushiromiya headship will be passed on to the proper person in the proper manner.@k@|@y@v02/40800102. ......No matter what you may scheme, you cannot go against this.@k@v02/40800103. Of course, the same goes for me."'
26867: 'Eva@r@v05/41000083."What are you on about?@k@v05/41000084. ......You''ve been bragging all these years about being the successor to the head yourself...!"'
26868: 'Krauss@r@v02/40800104."Allow me to turn your words straight back on you.@k@v02/40800105. I have no desire to discuss that at this point.@k@v02/40800106. Father merely has to come here and proclaim it with his own mouth.@k@v02/40800107. It is completely unnecessary for me to argue you down.@k@v02/40800108. ......Right?@k @v02/40800109.Heheheh!"'
26869: '@rKrauss casually turned Eva''s words back on her.@k@rOf course, that poured fuel on Eva''s anger.@k@rBut it didn''t ignite.'
26870: '@rBecause in that instant, the sound of a very loud knock rang out.'
26871: '@rBoth Genji and Kanon were usually very reserved when they knocked.@k@rThey wouldn''t hit the door with such a violent strength.'
26872: '@r......It was like a judge''s gavel slamming down in a call to order.'
26873: '@rSo everyone fell quiet......'
26874: '@rThe door opened slightly, ......and Genji showed himself.'
26875: '@rThen, he spoke with a solemn tone different from his usual one.@k@rIt wasn''t the tone he used when carrying out his duties.@k@r......It was the tone he used when speaking for Kinzo himself.'
26876: '@rSo just by hearing Genji speak like that, the siblings were struck with a sudden tension.'
26877: 'Genji@r@v14/41600001."Take your seats, everyone."'
26878: '@rAt those words, the dining hall fell into complete silence, and everyone rushed back to their designated seats.'
26879: '@rThey were like students who had been making a lot of noise just before homeroom, hurriedly returning to their seats when the teacher came;@k it might even have felt humorous.'
26880: '@r......But there was no way anyone would joke about it.'
26881: '@rEveryone sat in order, and Shannon, Gohda, and Kumasawa stood up straight in a row by the wall.'
26882: 'Genji@r@v14/41600002."......The head of the glorious Ushiromiya family, and lord of Rokkenjima, the island that sparkles gold.@k@v14/41600003. Lord Ushiromiya Kinzo is present."'
26883: '@rOf the double doors into the dining hall, Genji opened the right door from the inside, and Kanon opened the left door from the outside.'
26884: '@r......And, welcomed by the deepest of bows from the two servants, with his cape fluttering majestically, ............Kinzo appeared......'
26885: '@rKinzo''s gait had a dignified weight to it, and it was very hard to believe that he had been diagnosed as having not much time left to live.'
26886: '@rGenji pulled back Kinzo''s seat, and motioned for him to sit.'
26887: '@rBut Kinzo remained standing, signaling with his chin for Genji to move back.'
26888: 'Kinzo@r@v01/41500032."Hhheheheheheheheh, fuhhahahahahahahahahaha...!!@k @v01/41500033.Welcome, ladies and gentlemen, to Rokkenjima.@k@v01/41500034. Why the frightened face, Evaa?"'
26889: 'Eva@r@v05/41000085."N-no, why would I be frightened...!@k @v05/41000086.I, I''m just relieved to find you in excellent spirits, Father......"'
26890: 'Kinzo@r@v01/41500035."Wahahahaha...!!@k @v01/41500036.Evaa, you''re as interesting as ever, aren''t yoou?@k @v01/41500037.You might try honestly saying how frustrated you are at losing your bet with Krauss.@k@v01/41500038. ......Hehehhahahah, you can''t say it, can youuu?@k@v01/41500039. Hehuhuhahahahah!!"'
26891: '@rEva realized that their conversation during the day had indeed been an open book to Kinzo, and she turned red as she hung her head.'
26892: 'Kinzo@r@v01/41500040."Well then, my sons, daughters, and their companions!@k @v01/41500041.Tonight, I shall make an important announcement regarding those things that you all have your hearts set upon: my fortune and the succession of the headship."'
26893: 'Kinzo@r@v01/41500042."But first!@|@y@k @v01/41500043.I think I will mention how incredibly disappointed I am.@k@v01/41500044. I refer to the fact that, to this very day, not a single one of you has been able to solve the riddle of the epitaph."'
26894: '@rEven though Kinzo said he was disappointed,@k a condescending smile, as though there was no way the likes of them could have solved it, rose to his face as he cast an eye over each and every one of them.'
26895: 'Kinzo@r@v01/41500045.".........I had been planning on handing over everything to the person who could solve it.@k@v01/41500046. But here we stand today, not a single person having been capable, and not a single person having succeeded to all that is mine."'
26896: 'Kinzo@r@v01/41500047."Shameful...!!@k @v01/41500048.The fact that not one among you has come forward with the qualifications to succeed me,@k@v01/41500049. I find truly disappointing, and shameful, and pathetic!!@k @v01/41500050.Wah-hah-hah-hah-hah-hah!!"'
26897: '@rThe siblings hung their heads in silence.'
26898: '@rOf course, they would have solved it if they could.@k They had blown their chance, and none of them could deny that, but even so, it was just so hard a riddle...'
26899: 'Kinzo@r@v01/41500051."Therefore.@k@v01/41500052. I am proclaiming here and now that I will suspend the use of the epitaph''s riddle as a method of choosing my successor."'
26900: 'Kinzo@r@v01/41500053."In short, time''s up!@|@y@k @v01/41500054.This is game over.@k@v01/41500055. ......What a shame for all of you.@k@v01/41500056. You all had an equal and fair chance, and that has now collapsed!@k @v01/41500057..........Mwwhhuhuhahah!!"'
26901: '@rIt truly sounded like Kinzo was making a victory proclamation.'
26902: 'Kinzo@r@v01/41500058."In that case, will the headship be succeeded by my oldest son, Krauss...?@k @v01/41500059.*cackle*cackle*!@k @v01/41500060.The answer is <no>!!"'
26903: 'Eva@r@v05/41000087."Wha...?!"'
26904: 'Krauss@r@v02/40800110."....................."'
26905: 'Kinzo@r@v01/41500061."......I am sure you understand why, Krauss?@k @v01/41500062.I certainly did give you the title of successor.@k@v01/41500063. But you did nothing with it but get drunk on it...@k@v01/41500064. Do you know what it means to be the successor......?"'
26906: 'Krauss@r@v02/40800111.".........It means...to be the one who will succeed you, Father..."'
26907: 'Kinzo@r@v01/41500065."WROOOOOOONNNNNNGGGGG!!@|@y@k @v01/41500066.The successor isn''t something that''s guaranteed by the current head at aaaaaall!"@|@y'
26908: 'Kinzo@r@v01/41500067.".........Listen up, Krauss.@k@v01/41500068. I''ll only teach you this once, so unplug your ears and listen.@k@v01/41500069. The "successor", see,@k @v01/41500070.is what you call someone who finds everyone else who''s after the headship,@k@v01/41500071. thoroughly breaks their noses, and makes it so that they can never disobey him again."'
26909: 'Kinzo@r@v01/41500072."This is not only something that can be said of the headship.@k@v01/41500073. It can also be said of money!@k @v01/41500074.A "rich person" doesn''t mean someone who has money.@k@v01/41500075. It means someone who crushes everyone who has more money than himself,@k@v01/41500076. and who scrabbles together more money than anyone else."'
26910: 'Kinzo@r@v01/41500077."It''s the same with talent.@k@v01/41500078. A "genius" is not what you call a person blessed with talent!@k @v01/41500079.It means a person who crushes everyone with more talent than themselves!@k @v01/41500080.A person who can coerce all other people to call them that by using their strength and charisma!!"'
26911: 'Kinzo@r@v01/41500081."You have a mistaken impression when it comes to all of these things.@k@v01/41500082. ......So you aren''t of the right caliber to be my successor.@k@v01/41500083. *cackle*cackle*cackle*cackle*cackle*!!"'
26912: 'Krauss@r@v02/40800112."...............N-now I have learned..."'
26913: '@rPerhaps that was precisely Kinzo''s philosophy.'
26914: '@rThough it could also be taken for a rant, it was as a result of faithfully carrying out that philosophy of his...@kthat Kinzo had raised the Ushiromiya family to such prosperous heights......'
26915: '@rIt may be hard to imagine after his immersion in the occult in recent years,@k but it was that brutal aggressiveness that was Ushiromiya Kinzo''s charisma and aura...'
26916: 'Kinzo@r@v01/41500084."Such a weak-minded person has no qualification to inherit everything of the Ushiromiya family.@k@v01/41500085. In that case, is Eva, Rudolf, or Rosa qualified?"'
26917: 'Kinzo@r@v01/41500086."That is also <no>!!@|@y@k@v01/41500087. You were not able to solve the riddle, and neither were you able to scheme to drag Krauss down from his throne!@k @v01/41500088.All the three of you could manage to do was put together a united front to try to extort money from Krauss."'
26918: 'Kinzo@r@v01/41500089."And even that scheme was thoughtless!@k @v01/41500090.You can''t even corner Krauss all by himself!@k @v01/41500091..........There could be nothing more shameful!"'
26919: 'Kinzo@r@v01/41500092."You lack the avarice to steal away the position of successor by any means necessary!!@k @v01/41500093.In order to get what you want, you should pay all sacrifices, be covetous, avaricious to the last...!!@k @v01/41500094.Fortune smiles upon the greedy!!"'
26920: 'Kinzo@r@v01/41500095."You three, who lack that wild spirit, are as unfit for the succession as Krauss!!"'
26921: '@rEva and the rest had no words to respond with.@k And they couldn''t figure out what it was that Kinzo was about to say...'
26922: '@rWas Kinzo actually planning to proclaim that no one would succeed the head?'
26923: '@rIf so, that would work to Eva, Rosa, and Rudolf''s advantage.'
26924: '@rBecause the only thing the siblings would ultimately need to do is coordinate everything between them after Kinzo''s death, and split the inheritance evenly.'
26925: '@rOn the contrary, if a specific person''s name was raised and proclaimed to be the one to succeed the head, that would surely be more troublesome.'
26926: '@r......But would Kinzo really say something that would benefit any of the four siblings after lambasting them so much?'
26927: 'Eva@r@v05/41000088."......You don''t think...he''s going to say that because no one will succeed him,@k@v05/41000089. he''ll donate all of his fortune to charity or something, right......?"'
26928: 'Rosa@r@v12/41400261.".........I''m afraid I wouldn''t put it past Father."'
26929: 'Rudolf@r@v08/41200078."The blood''s just risen to his head......@k@v08/41200079. For the time being, we''re just gonna have to hear him out."'
26930: 'Krauss@r@v02/40800113."W-...well then, Father.@k@v02/40800114. What thoughts do you have regarding the next head?"'
26931: 'Kinzo@r@v01/41500096."Hmph.........@k@v01/41500097. Since I am so completely disappointed in all of you, I''ve lost the desire to hand it over to anyone.@k@|@y@v01/41500098. Therefore, the Ushiromiya family will end here.@k@v01/41500099. It ends with my generation."'
26932: 'Krauss@r@v02/40800115."......S-surely we must......"'
26933: 'Kinzo@r@v01/41500100."The Ushiromiya family was ruined long ago in that earthquake.@k@v01/41500101. The current Ushiromiya family is nothing but my own short-lived vision of gold.@k@v01/41500102. ......The likes of which will end when I awaken from my slumber."'
26934: 'Kinzo@r@v01/41500103."Hehheheh!@k @v01/41500104.This world is naught but a dream, an illusion.@k@v01/41500105. ...Life is but a daydream before the awakening called death."'
26935: 'Kinzo@r@v01/41500106."Aaah, yes, and so it has been since the beginning!!@k @v01/41500107.That I should lose everything when I die was BEATRICE''s contract, and her curse!@k @v01/41500108.Fuhhahhahha!!@k @v01/41500109.You think that will work, BEATRICE?!"'
26936: 'Kinzo@r@v01/41500110."I will be the one to capture you!!@k @v01/41500111.Tonight, that shall become reality.@k@v01/41500112. *cackle*cackle*cackle*!@k @v01/41500113.Wahhahahahahahahahaha!!"'
26937: '@rFor a while, Kinzo was overcome with cackling, and his eyes bulged.'
26938: '@rWhenever he talked about BEATRICE, he was always eloquent, and filled with obsession......'
26939: 'Kinzo@r@v01/41500114."Foolish sons and daughters such as yourselves were truly a daydream!!@k @v01/41500115.It is as though you were never there from the beginning!!"'
26940: 'Kinzo@r@v01/41500116."Disappear! Wake up!!@k @v01/41500117.Fade away along with the doze of my true self...!!@k @v01/41500118.You failures that have not built up anything that makes you worthy to succeed me!!"'
26941: 'Nanjo@r@v19/41900004."K-Kinzo-san.@k@v19/41900005. If I may......"'
26942: 'Kinzo@r@v01/41500119."What is it?@k@v01/41500120. My friend."'
26943: '@rNanjo nervously raised his hand, asking to speak.@k@rKinzo permitted it.'
26944: 'Nanjo@r@v19/41900006."I understand how you feel, Kinzo-san.@k@v19/41900007. Because you love your children,@k@v19/41900008. you expect a lot of them, and as a parent and grandparent myself,@k@v19/41900009. I understand the parental affection that can make you feel as though these expectations were betrayed."'
26945: 'Nanjo@r@v19/41900010."......However, you are extraordinary, Kinzo-san.@k@v19/41900011. A genius.@k@v19/41900012. Isn''t it a little too harsh to say that it''s only natural for them to catch up to you...?"'
26946: 'Nanjo@r@v19/41900013."And even so, that has not stopped them from trying—@k@v19/41900014.Krauss-san, Eva-san, Rudolf-san, Rosa-san, and all of their partners, are doing their very best to catch up..."'
26947: 'Kinzo@r@v01/41500121."Hohoooooooooohhh???@k @v01/41500122.And just how much money have they built up with this "doing their very best"?@k@v01/41500123. These half-wits, who fail in each and every one of their enterprises and become burdened with debt,@k@v01/41500124. and still try to sponge off me, are "doing their very best" exactly howwww...?!?!"'
26948: 'Kinzo@r@v01/41500125."Money is the crystallization of everything in this world.@k@v01/41500126. If you cannot grasp that, then you cannot grasp the world!@k @v01/41500127.If a soul cannot keep a tight grasp on this world, it doesn''t deserve to live!!@k @v01/41500128.Disappear!!@k @v01/41500129.Begone from my life and reality!!"'
26949: 'Nanjo@r@v19/41900015."......That argument is unreasonable.@k@v19/41900016. With that logic, even I would not be allowed to live."'
26950: 'Nanjo@r@v19/41900017."......And yet I believe the time I spent playing chess with you was worthwhile for both of us...@k@v19/41900018. ......You should know better than anyone else that there are many things in this world that money cannot buy."'
26951: 'Kinzo@r@v01/41500130.".........mgh.@k@v01/41500131. ......Hmm."'
26952: '@rAs the siblings motionlessly hung their heads, they cheered Nanjo on inside their hearts.'
26953: '@rNot one of the siblings could offer their opinion to Kinzo in a rage, but Nanjo alone was allowed to, as Kinzo''s close friend...'
26954: '@rEven though Kinzo had raged so fiercely, after being admonished by Nanjo, he nodded several times as though in agreement.'
26955: '@r......His surprisingly docile side might have seemed cute, but there was no one who could laugh.'
26956: 'Nanjo@r@v19/41900019."It may be true that your children weren''t able to build up as great a fortune as yourself.@k@v19/41900020. ......Well, even so, from my point of view, they''re rich enough to make me jealous."'
26957: 'Nanjo@r@v19/41900021."But besides money, they have also built up a great many things that money can''t buy.@k@v19/41900022. When it comes to that, they are in no way inferior to you."'
26958: 'Kinzo@r@v01/41500132."Hoh.@k@v01/41500133. And what are you saying they have built up that money cannot buy?"'
26959: 'Nanjo@r@v19/41900023."Happiness.@k@v19/41900024. Family.@k@v19/41900025. ......They have found wonderful partners, had children, and built up their own happy homes.@k@v19/41900026. Your family is thriving thanks to them, and they have brought back grandchildren for you."'
26960: 'Nanjo@r@v19/41900027."Grandchildren are good.@k@v19/41900028. We older people can look at those young grandchildren, who will live on into a new era that we will not be given a chance to see, and we can imagine endless futures for them.@k@v19/41900029. ......Isn''t that the sole entertainment for old age?"'
26961: 'Nanjo@r@v19/41900030."Remember, Kinzo-san.@k@v19/41900031. Remember your joy when they first came back to you with grandchildren...!@k @v19/41900032.Your children, and your grandchildren, will relate your great works to future generations, and they will model themselves after you.@k@v19/41900033. That is something that a single person cannot accomplish no matter how much money they have."'
26962: '@rThe siblings all nodded in agreement...'
26963: '@rCertainly, there had been a time when Kinzo had looked at his newly born grandchildren with happiness in his eyes.'
26964: '@r......Back when he still had some sanity in his heart.'
26965: '@r......However, was there any Human warmth still left inside Kinzo''s heart......?'
26966: 'Kinzo@r@v01/41500134."You mean to say.@k@v01/41500135. That in exchange for the vast riches I created!@k @v01/41500136.Instead of gaining money, I have gained my grandchildren."'
26967: 'Nanjo@r@v19/41900034."N-no, no, that''s not what I—"'
26968: 'Kinzo@r@v01/41500137."So, in exchange for the several tens of billions in wealth that I have amassed, I have gained a single grandchild from each of my children!!"'
26969: 'Kinzo@r@v01/41500138."Hahhahahahahahahahahaha!!@k @v01/41500139.This is wonderful!@k @v01/41500140.So, I have created a single life at a cost of ten billion yen!@k @v01/41500141.That''s how it is!@k @v01/41500142.Interesting, thinking of it from the perspective of alchemy truly makes for an interesting analogy, don''t you agree...?!"'
26970: 'Kinzo@r@v01/41500143."Hohhh, what valuable grandchildren!@k @v01/41500144.Wonderful, ......wonderful!!@k @v01/41500145.Wah-hah-hah-hah-hah-hah!!@k @v01/41500146.Is that right, Krauss?@k @v01/41500147.......Is your daughter worth ten billion......?"'
26971: 'Krauss@r@v02/40800116."..........................."'
26972: '@rKrauss couldn''t answer instantly.@k ......It wasn''t that he didn''t have confidence in his daughter; it was because he didn''t have a clue what Kinzo was trying to test with this question.'
26973: '@rBut when Natsuhi was then pressed for an answer, she responded, breaking Krauss''s silence with an answer of her own interpretation.'
26974: 'Natsuhi@r@v03/40900052."......Y-yes.@k@v03/40900053. Jessica is a daughter who I wouldn''t let go of even for ten billion yen.@k@v03/40900054. In that sense, I believe she has a value that can''t be counted with money."'
26975: 'Kinzo@r@v01/41500148."Hoh.@k@v01/41500149. So you can state for certain that she is worth ten billion.@k@v01/41500150. Hohoh!@k @|@y@v01/41500151.What about you, Eva?@k @v01/41500152.What do you say about your George......?"'
26976: '@rGiven the way Natsuhi had chosen to answer, there was naturally no doubt as to what Eva''s answer would be.'
26977: '@r......Even though Eva should have known better than to respond to this kind of provocative question, she did so as well.'
26978: 'Eva@r@v05/41000090."Yes, Father.@k@v05/41000091. George is worth ten billion, ......no, even more than that."'
26979: 'Eva@r@v05/41000092."And that''s not in the abstract sense of things money can''t buy.@k@v05/41000093. George will certainly build up a fortune equal to his worth.@k@v05/41000094. I am sure he will become a grandson worthy of carrying on your great works...!"'
26980: '@rEva sent a glance at Hideyoshi and Natsuhi that said "Like a fiddle".'
26981: '@r......After hearing Eva''s answer, Natsuhi was about to add more praise for her daughter, but stopped at a glare from Krauss.'
26982: 'Kinzo@r@v01/41500153."Hmm, I see.@k@|@y@v01/41500154. .........Then what about you, Rudolf?@k @v01/41500155.What about your Battler?"'
26983: 'Rudolf@r@v08/41200080."Compared to George-kun, ......there''s nothing about Battler I can brag about.@k@|@y@v08/41200081. If he was kidnapped and we were threatened with a ransom of ten billion, I''d feel like sticking a bow on the guy and letting them have him."'
26984: 'Kyrie@r@v09/41300144."*giggle*giggle*......"'
26985: 'Rudolf@r@v08/41200082."On top of that, he''s an idiot and reckless.@k@v08/41200083. He dreams way too big and talks about things he hasn''t got a snowball''s hope in hell of doing.@k@v08/41200084. ......I guess in that respect, he''s a super idiot worth the equivalent of ten billion normal idiots."'
26986: 'Rudolf@r@v08/41200085."But you look at the average person who hasn''t even got the balls to be an idiot, and I''ll bet that guy is gonna try things that ten billion of them couldn''t do put together.@k@v08/41200086. Well, I''m pretty sure he''ll fall flat on his face.@k@v08/41200087. The world isn''t easy."'
26987: 'Rudolf@r@v08/41200088."......But at the very least,@k@v08/41200089. there''s no doubt in my mind that watching over his life will be more entertaining than looking at ten billion average people."'
26988: '@rEva clicked her tongue at the clever style of speech that would probably match Kinzo''s tastes.'
26989: '@rApparently Rudolf had been after this himself—he grinned back at her.'
26990: 'Kinzo@r@v01/41500156."......What of Maria?"'
26991: 'Rosa@r@v12/41400262."M-......Maria is my darling only daughter.@k@v12/41400263. Her value cannot be measured with money.@k@v12/41400264. ......That is all."'
26992: 'Kinzo@r@v01/41500157."Hmm.@k@v01/41500158. ............I see.@k@v01/41500159. Dreams and the future, miracles and possibilities are the source of my magical power.@k@v01/41500160. No magic holds power without hope."'
26993: 'Kinzo@r@v01/41500161."......Hmph, I cannot expect anything more from you people who have proven yourselves to be average, but...@k@v01/41500162.yes, my grandchildren do have future possibilities, and it is possible that they may be worth hoping for a magical miracle from."'
26994: 'Kinzo@r@v01/41500163."If you say that this makes them worth more than ten billion, hmm, I could understand that.@k@v01/41500164. ......Hmmm, hmmmm......"'
26995: '@rWhen Kinzo got in a rage, he wouldn''t let anyone talk back,@k but even so, while yelling by himself, he would sometimes convince himself of something all of his own accord, and change his own opinion.'
26996: '@r......That''s what this felt like to the siblings.'
26997: '@rApparently, even though Kinzo had become absolutely fed up with his shoddy children and had cast them away as being unfit for the inheritance of his title or his fortune,@k he wasn''t so sure about his grandchildren.'
26998: '@r......At this rate, he might soon say that the inheritance would go to his grandchildren instead of the siblings.'
26999: '@rAs the siblings sat in fear of what their fickle and short-tempered father would suddenly think of next,@k they carefully watched his every move...'
27000: 'Kinzo@r@v01/41500165."......Hmm.@k@v01/41500166. ......Let me change my thinking a little.@k@v01/41500167. I have absolutely no desire to see you people inherit all that is mine."'
27001: 'Kinzo@r@v01/41500168."However, it would be quite interesting to question the grandchildren to see whether one of them is qualified......@k@v01/41500169. I''ve been thinking of them as kids who never grow up,@k@v01/41500170. but there is a chance they will show me a glimmer of unpolished brilliance that will surprise me."'
27002: 'Kinzo@r@v01/41500171."And testing them for that would be...@v01/41500172....yes, that would be hard to pass over as a final diversion for my last remaining days.@k@v01/41500173. ......Hmmmmm,@v01/41500174. ......well then, what shall I do..."'
27003: 'Eva@r@v05/41000095."I, ...I can recommend George with confidence as a fitting successor for you, Father!"'
27004: '@rEva claimed that right away.'
27005: '@rNatsuhi looked like she was about to follow along, but Krauss gave her a look telling her to restrain herself, so she swallowed her words.'
27006: 'Kinzo@r@v01/41500175."Hehheheheheheh!@k @v01/41500176.How bold.@k@|@y@v01/41500177. ......Then, let us do this.@k@|@y@v01/41500178. I will individually question the grandchildren to see whether they are qualified to inherit the Ushiromiya family headship and all of its wealth."'
27007: 'Eva@r@v05/41000096."...Father—"'
27008: 'Kinzo@r@v01/41500179."Howeeever!!@|@y@k @v01/41500180..........I do not mean by this that one of you will receive the headship indirectly.@k@v01/41500181. I have already lost hope in every one of you."'
27009: 'Kinzo@r@v01/41500182."I have nothing to give you now.@k@v01/41500183. Nothing!@k @v01/41500184.The ones I will question are the grandchildren.@k@v01/41500185. And the ones who might succeed me are the grandchildren.@k@v01/41500186. ......Make absolutely sure that you do not mistake this, are we clear......?"'
27010: 'Krauss@r@v02/40800117.".........I''ll follow your decision, Father."'
27011: 'Rudolf@r@v08/41200090."Same here.@k@v08/41200091. I''ll go along with what you determine.@k@v08/41200092. ......And you, Aneki?"'
27012: 'Eva@r@v05/41000097."O-of course.@k@v05/41000098. ......I believe that you will make a wise judgment, Father."'
27013: 'Rosa@r@v12/41400265."I, I will also abide by your decision......"'
27014: 'Kinzo@r@v01/41500187."I shall think of how I will test the grandchildren.@k@v01/41500188. And that no longer has anything to do with any of you.@k@v01/41500189. Because you no longer have anything to do with the succession of the head."'
27015: 'Kinzo@r@v01/41500190."......So why don''t I use this opportunity to talk about something else that does have something to do with you."'
27016: 'Krauss@r@v02/40800118."Something else......?"'
27017: 'Kinzo@r@v01/41500191."Mm.@k@v01/41500192. That is the true reason for tonight''s...final Ushiromiya family conference."'
