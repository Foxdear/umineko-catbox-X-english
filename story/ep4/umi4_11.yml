27042: 'Kinzo@r@v01/41500212."......Hear this!!@k @v01/41500213.This is not a joke nor anything of the sort.@k@v01/41500214_b. This is my final bet, my final ritual, the last I will desire in my life!"'
27043: 'Kinzo@r@v01/41500215."There are now more than thirteen humans on this island.@k@v01/41500216. In short, that''s a head count which can easily satisfy this massive number of sacrifices!@k @v01/41500217.Become the sacrifices for my ritual!!"'
27044: 'Nanjo@r@v19/41900035."......Kinzo-san, ......you weren''t...possibly......@k@v19/41900036.serious about what you said back then...?!@k @v19/41900037.It wasn''t a joke......?!!"'
