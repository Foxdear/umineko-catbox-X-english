31526: '@r......She would no longer be able to escape from this seat.'
31527: 'LAMBDADELTA@r@v29/42200221."Oh-hoh-hoh-ho!@k @v29/42200222.You won''t be able to escape anymore, got it?@k @v29/42200223.I''m more persistent than I look. Surprising, huh?"'
