31507: '@rThere was no door to exit by, and while there were windows,@w500. ......they let no light into this place - BEATRICE''s smoking room.'
31508: '@rEven as Beato moaned from the pain of being slammed against that cold hard floor,@k she shakily rose to her feet......'
31509: '@rA seat was there.'
31510: '@r......And the game table, ......still just as it had been when she had left it.'
