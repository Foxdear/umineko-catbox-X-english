31515: 'Ange@r@v11/42001890."Win, or lose.@k@v11/42001891. That is all you are given.@k@v11/42001892. A tie during the process of reaching that point will probably be permitted."'
31516: 'Ange@r@v11/42001893.".........But the one thing I will not allow is for you to suspend the game and throw it away!@k @v11/42001894.Either win and survive, or lose and disappear!@k@v11/42001895. Until one of those two things happens, you will not be permitted to rise from that chair!!"'
