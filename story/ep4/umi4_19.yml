31585: 'Ange@r@v11/42001955."In that case, hurry up and finish off this game and go back home!!@k @v11/42001956.Ushiromiya Battler, how long are you going to play around in a place like this?!@k @v11/42001957.Your little sister is waiting for you to come home!!!"'
31586: '@r.........That''s right.'
