31518: '@rLaughing weakly, Beato...@w416....sat down.'
31519: '@r......Then she rested her elbows on the table, covered her face with both hands,@w583. .........and managed to put together a smile with just her mouth.'
31520: 'BEATRICE@r@v27/40700972.".........Not permitted to escape an unwinnable game.@k@v27/40700973. .........Very well, then.@k@v27/40700974. ......Why don''t I repeat this......until I lose......"'
31521: 'Ange@r@v11/42001897."Spare me the pity show!@k @v11/42001898.Win.@k@v11/42001899. Use the very best moves you have...!!@k @v11/42001900.You started this game!@k @v11/42001901.You have a duty to make the best moves possible!!@k @v11/42001902.Enough with all this indecisive fooling around!"'
