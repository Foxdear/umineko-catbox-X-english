31530: 'LAMBDADELTA@r@v29/42200228."Don''t worry...@k@v29/42200229. You can win... Until you do, I, the great Lady LAMBDADELTA, will stick right by you and look after you for all eternity...!!"'
31531: 'BEATRICE@r@v27/40700978.".................................@k@v27/40700979. ......Hmph, ......hahahahaha.@k@v27/40700980. .........But even if I wish to fight, I have no opponent across from me, correct......?"'
