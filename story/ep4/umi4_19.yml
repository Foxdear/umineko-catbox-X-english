31543: 'Ange@r@v11/42001903."Battler...!@|@y@k @v11/42001904.Get ahold of yourself!@k @v11/42001905.You are here.@k@v11/42001906. And the enemy is before your eyes...!@k @v11/42001907.Fight!@k @v11/42001908.Fight to win!!"'
