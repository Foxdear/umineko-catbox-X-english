29815: 'Jessica@r@v04/40200277."...U-...nff, .........*cough*, *cough*......@|@y@k@|@y@v04/40200278.......what in the.........world......@k@v04/40200279. ......A dream......?"'
29816: 'Ronove@r@v31/43100259."No, that is wrong.@k@v31/43100260. ......You certainly did pass away, Jessica-sama.@k@v31/43100261. You should be well aware of the memory of your final moments."'
