29193: 'Ronove@r@v31/43100200."I am, after all, a demon.@k@v31/43100201. I am at least capable of this level of magic.@k@v31/43100202. .........I must say, though, you are quite good.@k@v31/43100203. If I were a Human, I am sure that this is where I would have admitted defeat.@k@v31/43100204. It is because I am a demon that I can still continue to fight."'
