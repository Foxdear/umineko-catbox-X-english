28805: '@rIt goes without saying, but since the time she was born, ......Jessica was raised in this mansion.'
28806: '@rThe Western-style house that the cousins simply called "the mansion" was her home.'
28807: '@rAnd yet, she had never understood her cousins'' feelings as much as she did today.'
28808: '@r......And at the same time, her own home, which she knew well, had never felt so different a place as it did now......'
28809: '@rHer own.........room.'
28810: '@rThis had once been her personal hideaway, the only place in this vast mansion where she could feel at peace.'
28811: '@rHowever, ......that door had never felt as intimidating as it did now.'
28812: 'Jessica@r@v04/40200115.".........A test, he says...?@k @v04/40200116.Tch, what the hell has he got waiting in there......@k@v04/40200117. He better not have ransacked my desk and stuff......"'
28813: '@rShe acted tough, trying to deceive herself.@k@r......Trying to make herself believe that she wasn''t scared of anything.'
28814: '@rShe readied herself, and opened the door to her room.'
28815: 'Jessica@r@v04/40200118."...................................."'
28816: '@r......When she saw that, fortunately, the room didn''t appear to have been messed with, she relaxed.'
28817: '@rNo one......was there.@k ......Of course.@k@rThere was nowhere for anyone to hide here.'
28818: '@rRight away, Jessica locked the door behind her.@k@r......Now the room was safe.'
28819: '@rShe peeked under the bed and in the closet, but of course, no one was hiding.'
28820: 'Jessica@r@v04/40200119."......Wh-......what the hell.@k@v04/40200120. ...Haha, ...haha...!"'
28821: '@rShe looked at the clock.@k ......Ten past eleven, or just a little past that.'
28822: '@rAs her tension lessened and fatigue came back to her entire body, she realized how messed up this whole day had been.'
28823: '@rIt was still only eleven.'
28824: '@r......The plan had been for all the cousins to get together, have fun playing around, and talk animatedly about all kinds of things together into the night.'
28825: '@rNormally, we would have been doing that kind of thing at this very moment.@k@rWhy has that......turned into this......?'
28826: 'Jessica@r@v04/40200121.".........It''s all that old bastard''s fault......@k@v04/40200122. ......How could he do that...to Mom......@k@v04/40200123.to everyone........."'
28827: '@rHer head was swimming with anger and sadness......@k But there was no one here to direct those emotions at.'
28828: '@r......Because of the lock, this room''s security was guaranteed.@k@rRemembering that one more time, Jessica somehow regained her calm......'
28829: '@rIf it keeps up like this and nothing happens...@k@rJessica thought that she would like to go to the dining hall and see her mother''s last face.'
28830: '@r......Even though Gohda had emphasized so strongly that it was gruesome and that she definitely shouldn''t look at it,@k even so, she wanted to see her mother''s face one final time...'
28831: '@rBut they had been warned repeatedly that doing anything stupid would put the hostages in danger.'
28832: '@r......Could it be that locking the door was also against the rules......?'
28833: '@rIf I close myself up in here, I alone might be saved.'
28834: '@r......But if I don''t open it, it will surely be against the rules, and Dad, Kanon-kun, Shannon, Auntie Kyrie, and Doctor Nanjo...@kwill be killed.'
28835: '@r............There''s no way the scales balance between five lives and my own one life.'
28836: '@rJessica tightly shut her eyes, resisting the other part of herself which said "Isn''t it alright as long as I survive?",@k ......headed to the door, and made to unlock it.'
28837: '@r......Just then.'
28838: '@rClap, clap, clap......'
28839: '@rA crisp applause rang out, making Jessica''s heart leap...'
28840: 'Ronove@r@v31/43100094."If the door had remained locked, it might have been in violation of the rules, and harm could have come to the hostages.@k@v31/43100095. ......But even so, your own life might be saved."'
28841: 'Ronove@r@v31/43100096."However, you resisted that temptation and were about to unlock the door yourself.@k@v31/43100097. That bravery of yours is worthy of admiration."'
28842: 'Jessica@r@v04/40200124."Wh-who..............."'
28843: '@rI, the owner of this room,@w583. ......had searched to make sure there was nowhere any human could have been hiding...@w666. .........Where had this...man...'
28844: '@r.........There was nowhere for a Human to hide,@k ......but could something that wasn''t Human have managed it.........?'
28845: '@rI was pretty sure this was my first meeting with this largely built, middle-aged man.@k ......I did not recognize this guy, who looked like a butler and bore the seal of the One-winged Eagle.'
28846: 'Ronove@r@v31/43100098."A pleasure to meet you, Jessica-sama.@k@v31/43100099. .........I serve as head furniture for the Master, the 27th of the 72.@k@v31/43100100. I am called Ronove."'
28847: 'Jessica@r@v04/40200125."......Rono...ue......?@k @v04/40200126.............Genji...san............?"'
28848: 'Ronove@r@v31/43100101."......Ah, yes, ...Genji is like my little brother.@k@v31/43100102. Or perhaps he was my true form in this world.@k@v31/43100103. ......Perhaps you could even say he was a vessel."'
28849: 'Jessica@r@v04/40200127.".........What''s...this guy...saying.........?"'
28850: 'Ronove@r@v31/43100104."Oh, my apologies.@k@v31/43100105. This is not something that can be explained to a Human.@k@v31/43100106. .........Well then, let us move on to the main event."'
28851: 'Jessica@r@v04/40200128."So this is that old crackpot''s...@v04/40200129....test or whatever........."'
28852: 'Ronove@r@v31/43100107."Correct.@k@v31/43100108. This is the test that the Master has granted you."'
28853: '@rAt Ronove''s elegant gesture, like that of a butler ordering for the meal to be set out,@k many gold butterflies flew up out of nowhere......'
28854: 'Jessica@r@v04/40200130."Gwah?!@k @v04/40200131.What the...hell......?!"'
28855: '@rThe swarm of gold butterflies spun around, forming a small swirl as they gathered in one place.'
28856: '@r......Then, that golden mound disappeared like a pile of leaves blown away by a cold wintry wind,@k ......and there lay a Western envelope with the One-winged Eagle crest done on it in gold leaf......'
28857: '@rRonove gestured to her to pick it up.@k@rJessica timidly picked it up, and opened the letter inside......'
28858: 'Jessica@r@v04/40200132.".....................What is...this......?"'
28859: 'Ronove@r@v31/43100109."It is an exceedingly simple test that looks for the qualifications for becoming the next head.@k@v31/43100110. ......Please attend to the question written there with the readiness of the next head who will bear responsibility for the Ushiromiya family,@k@v31/43100111. and tell me your answer, as well as the thoughts that led you to it."'
28860: 'Jessica@r@v04/40200133."......Wh-............what the...utter hell..............."'
28861: '@rShaking, Jessica looked back and forth between the paper and Ronove''s face several times......'
28862: '@r......At that time, George, who had been called out after Jessica, could be seen in the arbor of the rose garden.'
28863: '@rHe had been planning to give Shannon the ring that would be proof of their engagement...here, tonight, at this time...if things had gone normally.'
28864: '@r...But the woman in front of George now was not Shannon.'
28865: 'Gaap@r@v32/43700095."......Read it.@k@v32/43700096. That is GOLDSMITH''s test for you."'
28866: 'George@r@v07/40300116.".............................."'
28867: '@rGeorge picked up the Western envelope on the table where he had once drunk tea with Shannon,@k and read its contents......'
28868: '@rPerhaps its message was short.@k After a single glance at it, George''s eyes grew sharp.'
28869: 'George@r@v07/40300117."............What is this...@k@v07/40300118.supposed to be?"'
28870: 'Gaap@r@v32/43700097."Ehheheheheh.@k@v32/43700098. ......It''s what it looks like.@k@v32/43700099. This is the test given to you, to find if you have the qualifications to be the successor to the head.@k@v32/43700100. ......Ask yourself what makes you qualified to be the successor, as you answer the question."'
28871: 'George@r@v07/40300119.".........What a...stupid question."'
28872: 'Gaap@r@v32/43700101."I agree.@k@v32/43700102. It really is a stupid question.@k@v32/43700103. .........In that case, isn''t the Ushiromiya family headship something just as trivial in GOLDSMITH''s eyes?@k @v32/43700104.......Heheheh."'
28873: '@rGeorge lowered his eyes to the surface of the letter once again, and examined its contents......'
28874: '@rGeorge and Jessica.@k ......While the tests given to them were slightly different, they were almost exactly the same.'
28875: 'George@r@v07/40300120."......''Among the three mentioned below.@k@v07/40300121. In order to gain two, sacrifice one.''"'
28876: 'Gaap@r@v32/43700105."It''s a simple three-choice test.@k@v32/43700106. .........Decide for yourself which one you will choose not to save."'
28877: 'Gaap@r@v32/43700107."If you refuse to choose, the test is suspended.@k@v32/43700108. I have been given permission to kill you right here by my own hands.@k@v32/43700109. .........If you would include even that as a choice, then there are four choices."'
28878: 'Gaap@r@v32/43700110."It''s been an awful long time since I''ve gotten to play with a kid like you, so I can''t say I''d be disappointed."'
28879: 'George@r@v07/40300122.".........Are these three choices only a test?@k@v07/40300123. Or will the choice be accompanied by its result?"'
28880: 'Gaap@r@v32/43700111."Don''t be naive.@k@v32/43700112. ......The one you choose will definitely lose their life."'
28881: 'George@r@v07/40300124."......................................."'
28882: '@r@z70.Among the three mentioned below.@k@rIn order to gain two, sacrifice one.@k@r@r1. Your life@k     @r2. Shannon''s life@k     @r3. Everyone else''s lives@k@r@rIf you do not choose one, all of the above will be lost.'
28883: 'George@r@v07/40300125."...............Why is Shannon''s name here?"'
28884: 'Gaap@r@v32/43700113."The second choice has the name of the one most needed by that person, and most loved.@k@|@y@v32/43700114. ......I believe Kanon''s name is written second on Jessica''s test."'
28885: 'George@r@v07/40300126.".........You gave this stupid question to Jessica too...?"'
28886: 'Gaap@r@v32/43700115."*giggle*giggle*.@k@v32/43700116. ......What does Jessica matter?@k@v32/43700117. Right now, you are the one being tested."'
28887: 'Gaap@r@v32/43700118."It really is a simple three-choice test.@k@v32/43700119. Which can you throw away for the sake of the other two?@k@v32/43700120. ......Isn''t that simple?@k @v32/43700121.If you still can''t decide, would you like me to lend you a coin......?"'
28888: 'George@r@v07/40300127."......A coin?@k @v07/40300128.How would you choose between three options with something that only has two sides?"'
28889: 'Gaap@r@v32/43700122."There''s no one who would throw away their own life.@k@|@y@v32/43700123. ......So naturally only two options remain.@k@v32/43700124. Will you give up on everyone for the sake of the one you love?@k@v32/43700125. Or will you give up on the one person you love so that you can save as many people as possible?"'
28890: 'Gaap@r@v32/43700126."Either way, you can fit it with an appropriate just cause.@k@v32/43700127. After all, this Rokkenjima is now a demon island.@k@|@y@v32/43700128. ......The sickly sweet buddy-buddy pretense of the Human world is not necessary.@k@v32/43700129. No one will blame you.@k@v32/43700130. Do as your heart desires."'
28891: 'Gaap@r@v32/43700131."......While asking yourself whether you possess the fitting qualifications to succeed the headship of the Ushiromiya family...@k@|@y@v32/43700132. No, make your decision as though you yourself are the Ushiromiya family head.@k @v32/43700133.Ehheheheheh......"'
28892: 'George@r@v07/40300129.".........................................."'
28893: 'Jessica@r@v04/40200134.".........What.........the hell do you take me for............"'
28894: '@rJessica crumpled the letter up and threw it on the floor.'
28895: 'Ronove@r@v31/43100112."I believe your anger is quite appropriate.@k@v31/43100113. ......I also find it an exceedingly pitiful, and truly ludicrous question.@k@|@y@v31/43100114. ......Pu ku ku ku."'
28896: 'Jessica@r@v04/40200135."Like hell there''s anyone who could wish for their own death.@k@v04/40200136. And...like hell there''s anyone who could want to remain alive after abandoning the life of the person they l-...love.@k@v04/40200137. ......And......like hell there''s anyone who could massacre everyone else......as long as it''s good for the two of them......!"'
28897: 'Ronove@r@v31/43100115."No, Jessica-sama.@k@v31/43100116. Such a person could exist."'
28898: 'Ronove@r@v31/43100117."This is Rokkenjima, the demon island!@k @v31/43100118.It is now completely cut off from the Human world and dunked fully into the netherworld like cheese fondue.@k@v31/43100119. The values of the human world will be taken out with the trash."'
28899: 'Ronove@r@v31/43100120."Pu ku ku!@k @v31/43100121.So please.@k@v31/43100122. Choose the things you desire from the bottom of your heart, in the order you desire them.@k@v31/43100123. Whatever remains will be your answer, and one most fitting for this insane night."'
28900: 'Jessica@r@v04/40200138."Screw you!!@|@y@k @v04/40200139.How could I......choose any of these?!!"'
28901: 'Ronove@r@v31/43100124."''If you do not choose one, all of the above will be lost''...@k@v31/43100125.also makes for a fine fourth choice.@k@v31/43100126. It may also be interesting if that one is chosen."'
28902: 'Ronove@r@v31/43100127."But since choosing that will result in the loss of your own life in the end, I believe it would be more wise to do the honorable thing and select number one, "your life",@k@v31/43100128. so that the other two will be saved.@k@v31/43100129. ......All is entrusted to your decision, Jessica-sama."'
28903: 'Ronove@r@v31/43100130."Please, let me hear an answer and conviction fitting for the successor to the Ushiromiya family......!!@k @v31/43100131.I am sincerely hoping for a wonderful answer, fitting for the Master''s descendant who shares his blood!!"'
28904: 'Jessica@r@v04/40200140."Da-......damn iiiiiiiiiiiiiiiiittt......"'
28905: '@rThat scene was being observed through a magic crystal ball being held by Kinzo.'
28906: '@rKinzo finally couldn''t hold it back; spreading his arms and facing the heavens, he began laughing in an explosive voice......'
28907: 'Kinzo@r@v01/41500430."Fuhahahahahahaha, waahhahhahahahahahahahahaha!!@k @v01/41500431.Why do you hesitate, foolish grandchildren and descendants of mine!!"'
28908: 'Kinzo@r@v01/41500432."This is a simple problem that can be answered immediately!@k@v01/41500433. It should cause less vacillation than whether to put butter or jam on your morning toast!!@k @|@y@v01/41500434.......Do you people know the correct answer?"'
28909: '@rHe turned and stared wide-eyed at the Chiester Sisters, who had been faithfully standing in wait behind him.'
28910: 'Chiester45@r@v35/43400014."N-no, no, my apologies, I don''t know, Lord GOLDSMITH!"'
28911: 'Kinzo@r@v01/41500435."Fool, not choosing at all means GAME OVEEEEEEEEEEEER!!!@k @v01/41500436.You foolish rabbit, who cannot even choose a reason or a goal for her own life...!!"'
28912: 'Kinzo@r@v01/41500437."You have not the value of a single ant that anyone might step upon without even noticing!!@k@v01/41500438. Die! Be crushed!! Disappear faster than I can blink!!@k @|@y@v01/41500439.......And what of you?"'
28913: 'Chiester00@r@v37/43600027."......I would sacrifice the first one, "my life", sir.@k@v37/43600028. Weapons exist to fight and die in battle.@k@v37/43600029. And weapons exist to destroy enemies and protect allies.@k@v37/43600030. If we can die protecting those we love, we can die satisfied, sir."'
28914: 'Kinzo@r@v01/41500440."Hoh.@k@v01/41500441. A truly splendid model answer for a weapon.@k@v01/41500442. The immediate reply is very nice.@k@v01/41500443. ......Have you been taught that you''ll be given an extra carrot for answering that way?@k @v01/41500444.Heheheheh, that''s not it, is it noowwwwww?@k @v01/41500445.Even that isn''t it, is it nowwwwwwwwwww...?"'
28915: 'Kinzo@r@v01/41500446."You are merely answering the way you have been told to answer, repeating the answer you have been indoctrinated with!!@k @v01/41500447.You are the same as that other rabbit a second ago.@k@v01/41500448. You still live without having chosen a purpose or a goal to live for...!!@k @v01/41500449.Filth whose life has no value...!@k @v01/41500450.It would fit you well to crush you down and use you as fodder for the other livestock!!"'
28916: 'Chiester00@r@v37/43600031."...............@k@|@y@v37/43600032. ...Yes sir!@k @v37/43600033.A-animal fodder...would be an honor......!"'
28917: 'Kinzo@r@v01/41500451."I don''t think sooooo!@|@y@k @v01/41500452.You don''t want to see anyone else die anymore, doooo youuuu?@k @v01/41500453.Why can''t you accept that?@k@v01/41500454. Accept that your old wounds are still festering and rotting deep, deep inside...!"'
28918: 'Kinzo@r@v01/41500455."Yes, the rotting stench almost makes the nose wrinkle, you foolish rotten rabbit!!@k @v01/41500456.These are words of praise for you!!"'
28919: 'Chiester00@r@v37/43600034.".........Th-thank you very much...sir......"'
28920: 'Kinzo@r@v01/41500457."Well then, what about you, the last one.@k@v01/41500458. Which of the three choices would you choose...?"'
28921: 'Chiester410@r@v36/43500021."Nihi.@k@v36/43500022. Number two without hesitation."'
28922: 'Kinzo@r@v01/41500459."Hoh...@k@v01/41500460. Number two.@k@v01/41500461. There are not many who could proudly choose to offer "the one you love" as a sacrifice.@k@v01/41500462. Tell me your reason."'
28923: 'Chiester410@r@v36/43500023."Because the one you love will be lost eventually.@k@v36/43500024. If you don''t have anyone to love, you won''t be hurt, and even then, you still might be able to love someone again someday.@k@|@y@v36/43500025. So,@k@v36/43500026. the person you love right now isn''t worth that much at all nyeh.@k@v36/43500027. ......Nihi!"'
28924: 'Kinzo@r@v01/41500463."*cackle*cackle*cackle*.@k@v01/41500464. I see, so that is why you reach such an answer, you rabbit who has become cowardly because you have been hurt by love......@k@v01/41500465. I have heard that rabbits die of loneliness, but just when was it that your heart was killed...?"'
28925: 'Kinzo@r@v01/41500466."Then, rabbit, I shall alter the question.@k@v01/41500467. Why don''t I change the second option to, not "the one you love", but "the memories of the one you loved"."'
28926: 'Kinzo@r@v01/41500468."......How is that?@k@v01/41500469. Can you still select that one?@k @v01/41500470.What''s this about the one you love not being worth much at all, foolish rabbit...!"'
28927: 'Kinzo@r@v01/41500471."Filth who cannot even face up to the depths of her own love!!@|@y@k @v01/41500472.Try and choose it, try and choose to have the one you loved forgotten!!!!!!"'
28928: 'Kinzo@r@v01/41500473."You can, right?@k @v01/41500474.I''ll bet you can, riiiiiiiight?@k @v01/41500475.Cooooome onnnnn, try saying that you caaaaaaaaaaan!!!!"'
28929: 'Chiester410@r@v36/43500028."I, ...I, I can...@k@v36/43500029. I can...!!@k @v36/43500030.Nihi, .........nihihihihihihihihihiiihii......"'
28930: 'Chiester00@r@v37/43600035."L-Lord GOLDSMITH...!@k @v37/43600036.Please, have mercy on her......!!"'
28931: 'Chiester410@r@v36/43500031."Hihiiihiii...@k@v36/43500032. ......Hiiiiiiiiiiiiiiiiiiinn...!!"'
28932: 'Kinzo@r@v01/41500476."That is enough, rabbit filth!!@k @v01/41500477.Go to VIRGILIA and help keep watch on the dungeon.@k@v01/41500478. Begone!!"'
28933: '@rThe Chiester Sisters, their old emotional wounds gouged,@k disappeared as though running away.'
28934: '@rAfter that, even though there was no one left to hear him, Kinzo continued talking as though continuing a play...'
28935: 'Kinzo@r@v01/41500479."......And there you have it, my pleasant test.@k@v01/41500480. To be truthful, there is no choice that can be said to be correct."'
28936: 'Kinzo@r@v01/41500481."Whichever answer they choose, it is about whether they can choose...@v01/41500482.without hesitation,@v01/41500483. quickly,@v01/41500484. and with a resolute conviction and their own strong, unshakable will!!"@|@y'
28937: 'Kinzo@r@v01/41500485."The reason and their willpower are more important.@k@v01/41500486. .........That is what I want to know about.@k@v01/41500487. Ahhh, descendants of mine, I am truly looking forward to what kind of answers you will show me!!"'
28938: 'Kinzo@r@v01/41500488."............Hmmmm?@k @v01/41500489.Me?@k @v01/41500490.*cackle*cackle*cackle*!@k @v01/41500491.Yes, of course I once had the same question thrust upon me.@k@v01/41500492. Because I splendidly answered that devil''s question, I was able to claim gold, honor, and that witch herself as my own."'
28939: 'Kinzo@r@v01/41500493."Which answer did I chooooose?@k @v01/41500494..........Do I really need to say it out loud?@k@v01/41500495. Wahhahhahahahahahahahahahahahahahaha...!!!"'
28940: 'Ronove@r@v31/43100132."So.@k@v31/43100133. Have you decided on your answer......?"'
28941: 'Jessica@r@v04/40200141."................................."'
28942: '@rAs Jessica stared at the crushed letter which lay on the floor,@k ......she hung her head in constant silence.'
28943: '@rAll that filled the room was the sound of the wind and the rain, and the rustling of treetops.@k@rRegardless of how noisy that was, it simply made the silence more apparent.'
28944: '@rRonove waited for Jessica''s answer.@k@r......However, Jessica didn''t speak.'
28945: '@rWhether she was deep in thought, or had stopped thinking, Ronove couldn''t tell.'
28946: '@r......No, ...he might actually have known.'
