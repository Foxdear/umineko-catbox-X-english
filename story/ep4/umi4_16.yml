29936: 'Kyrie@r@v09/41300411."You might think that there should be some trick, or that there''s some true identity behind it.@k@v09/41300412. ......If you have the time to think of something like that,@v09/41300413. ......it would be much more constructive to think of how not to damage the mood of whatever you''re facing."'
29937: 'Kyrie@r@v09/41300414."......Even mistakenly, ...you must not say "Prove it then, show me some magic"...@k@v09/41300415. ......They will probably use a method of utmost cruelty...@v09/41300416....to show you the proof."'
29938: 'Battler@r@v10/40100414."......I can''t...@v10/40100415....believe it......@k@v10/40100416. ......I never thought...@v10/40100417....I''d hear something like that coming from your mouth...@v10/40100418. ......I can''t believe it........."'
29939: 'Kyrie@r@v09/41300417."I understand.@k@v09/41300418. That it''s unbelievable.@k@v09/41300419. ......That''s why...that''s the only advice I can give to you.@k@v09/41300420. ......Believe."'
