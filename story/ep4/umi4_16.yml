29916: '@r......About how she had escaped somehow, and made it to where she was now,@k and how everyone had finally been killed - all spoken dispassionately, as she had seen it, with no dramatization.'
29917: '@r......She even spoke about how everyone except her had been killed, and how she had observed the moments of all their deaths,@k ......and how, even this very moment, someone was trying to kill her.'
29918: 'Kyrie@r@v09/41300376."............Actually,@k@|@y@v09/41300377. even while we''ve been talking, ...I''ve been attacked three times.@k@v09/41300378. Something like a strange gold thread keeps flying in through the keyhole, spinning around and aiming for me."'
29919: 'Kyrie@r@v09/41300379."First it was by my feet.@k@v09/41300380. ......Next, it was close to my shoulders.@k@v09/41300381. ......Just now, it grazed my ear.@k@v09/41300382. ......Its aim is getting more and more accurate.@k@v09/41300383. Looks like it''ll go right between my eyes pretty soon......"'
