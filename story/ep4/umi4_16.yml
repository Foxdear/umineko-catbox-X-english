29337: 'Jessica@r@v04/40200246."That''s right...!@k @v04/40200247.If you give up saying something''s useless, that''s when your life is frigging over...!@k @v04/40200248.I''ll get through to him.@k@v04/40200249. ......Definitely...!!"'
