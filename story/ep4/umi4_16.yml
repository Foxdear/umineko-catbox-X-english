29331: 'Jessica@r@v04/40200239."Sounds dumb as hell, huh?@k @v04/40200240.I''ll bet it makes no sense to a guy like you, does it?@k @v04/40200241.See, a girl in love...doesn''t even think about "giving up because it''s useless"!!"'
