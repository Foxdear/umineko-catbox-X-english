29288: 'George@r@v07/40300240."I learned the power of kicks from karate,@k@v07/40300241. speed from tae kwon do,@|@y@k@v07/40300242. and freedom of range from capoeira."@|@y'
29289: 'George@r@v07/40300243."......Mother was always trying something new.@k@v07/40300244. But it was very educational being able to study their various merits."'
