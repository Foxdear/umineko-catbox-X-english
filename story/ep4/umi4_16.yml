29296: '@r...And any one of them would probably have crushed Gaap in a single hit, if George had wished it.'
29297: '@rHe was - deliberately - not doing that.'
29298: 'George@r@v07/40300249."You said it yourself, right?@k @v07/40300250.Force is the power to rule.@k@v07/40300251. .........If you destroy your opponent with force, you won''t be able to rule them, right?"'
29299: 'George@r@v07/40300252."A monarch''s force is something that is only shown.@k@v07/40300253. He does not destroy.@k@v07/40300254. ......He makes others submit, and adds them to his own fortune.@k@|@y@v07/40300255. If you black out on me, I won''t be able to make you guide me to where everyone is being held."'
