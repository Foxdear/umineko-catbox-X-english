29466: 'Kanon@r@v16/40600133."Nee-san, concentrate on the spirit wave jamming!@k @v16/40600134.The gap in those bars is too narrow for those goats.@k@v16/40600135. It should hold them back for a while...!"'
29467: 'Krauss@r@v02/40800336."I don''t have a clue what you''re saying, but - "'
29468: 'Kyrie@r@v09/41300321."We at least got the point that it''s something pretty bad."'
29469: '@rKyrie picked up a metal bar that Kanon had just cut.@k@rKrauss had no weapon, but he rubbed his fist, and the two of them glared into the depths of the underground passage where the shaking was coming from.'
29470: 'Nanjo@r@v19/41900121."......I believe this set of bars is the final thing blocking the way."'
29471: 'Krauss@r@v02/40800337."How far is it to the mansion from here?"'
29472: 'Nanjo@r@v19/41900122."Quite a walk...@k@v19/41900123. The path is even, but I seem to remember walking for thirty minutes......"'
29473: 'Kyrie@r@v09/41300322."So if we run flat out, it''ll be half that time."'
29474: '@rThey couldn''t tell for sure since they didn''t have the three-sided mirror,@k but there was no guarantee that George and Jessica could hold out against demon opponents for all that time.'
29475: 'Kyrie@r@v09/41300323."......If we run at twice walking speed, it''ll be fifteen minutes.@k@v09/41300324. And running at twice that speed again would make it eight minutes."'
29476: 'Krauss@r@v02/40800338."And if we sprint flat out at double that speed again, it won''t even take five.@k@v02/40800339. No sweat."'
29477: 'Nanjo@r@v19/41900124."Wh-what an unreasonable calculation...@k@v19/41900125. But calculations in dire emergencies do tend to be that way...!"'
29478: 'Kanon@r@v16/40600136."......My sincere apologies, everyone.@k@v16/40600137. The rest will be up to you...!"'
29479: 'Krauss@r@v02/40800340."Leave it to us.@k@v02/40800341. Kanon, you cut the bars as fast as you can.@k@v02/40800342. Shannon, you concentrate on jamming this witch called VIRGILIA or whatever.@k@|@y@v02/40800343. Kyrie-san and I will defend against the pursuers...!"'
29480: '@rThen, the roars of beasts rang out from the darkness, and numerous fiery, glowing, bright-red eyes appeared.'
29481: '@rThe goats rushing towards them, with thunderous force, were several levels more massive than the guards had been.'
29482: '@rThe tremors they created were almost like an earthquake.@k@rThe power and terror was tremendous, but Kyrie instead laughed with relief.@k@r......Those massive bodies wouldn''t be able to go through the gap in the bars!'
29483: '@rThe group of goats crashed into the metal bars with a terrific sound like that of a train colliding with a dead end.'
29484: '@rClumps of dirt fell here and there from the ceiling, and you could tell that the metal bars had buckled inwards.'
29485: '@r.....The force of their charge must have been no different from a train.@k@rIf the metal bars hadn''t been there, they would undoubtedly have swallowed the five of them up and crushed them in an instant.'
29486: '@rWhen the group of goats, pressed up against the metal bars, realized that the five were right in front of them,@k they let out a terrible howl, trying to intimidate the five.'
29487: '@r......Although it was hard to tell whether that was really intimidation, or because of the pain from being pushed and shoved.'
29488: '@rOne calm goat among them figured out that it just needed to do something about the metal bars,@k and grabbed two of them with its massive arms, and began bending them as though opening double doors.'
29489: '@rKyrie sharply jabbed her metal pole at that goat''s vitals...!@|@y@k@|@y The goat let out a roar of anguish.@|@y'
29490: '@rIt probably hurt a lot, but that was all.@k@rIt wasn''t enough to bring it down...'
29491: 'Kyrie@r@v09/41300325."Krauss-san...!!"'
29492: 'Krauss@r@v02/40800344."Rrroooaaaaaaaaaaaaahhh!!"@|@y'
29493: '@rStill holding the stuck-in metal pole, Kyrie relinquished the opposite tip to Krauss.'
29494: '@rKrauss ran there with all his might, leapt into the air and kicked it in with all his weight and kicking power combined...!'
29495: '@rAll of that destructive power was focused on that single pole, drilling it in!!'
29496: 'Nanjo@r@v19/41900126."......A-are you alright?@k@v19/41900127. Please don''t rub the affected area.@k@v19/41900128. I shall prescribe some medicine later. Take care..."'
29497: '@rAs the goat who had taken a pile bunker to its vitals writhed with teary eyes,@k it nodded its head.'
29498: 'Kyrie@r@v09/41300326."Looks like our link isn''t that bad either.@k@v09/41300327. We can''t let Shannon-chan and Kanon-kun beat us."'
29499: 'Krauss@r@v02/40800345."Naturally. We are a loving family, after all."'
29500: 'Kyrie@r@v09/41300328."We can take them if it''s two-on-one!@k @v09/41300329.Next, that one on the right!"'
29501: 'Krauss@r@v02/40800346."Roger...!@k @|@y@v02/40800347.You seem like a great wife. That Rudolf, I''m starting to think he grumbled a little too much."'
29502: 'Kyrie@r@v09/41300330."Oh? You''ll have to tell me about that later.@k@v09/41300331. Rudolf-san, it''s no use you turning white in heaven, it''s too late for excuses."'
29503: '@rThe goat''s massive body sank into the rose bush.@k Even taking into account that a leg''s power is three times that of an arm''s, this strength surpassed common sense.'
29504: '@rThat massive body, flying up and through the air from being kicked in the chin...it was too epic!'
29505: '@rEven George seemed a little surprised.'
29506: 'George@r@v07/40300266."......To think that my kick works on monsters too.@k@v07/40300267. I''m astonished."'
29507: 'Gaap@r@v32/43700300."...............It''s because of your counterattacking-type barrier.@k@v32/43700301. ......The attack power that grazes you is added on to your own.@k@v32/43700302. ......The superhuman power of those monsters has been added to your kicks..."'
29508: 'George@r@v07/40300268."Hmm......@k@v07/40300269. ...I don''t really get it, but isn''t that just perfect for me?@k@|@y@v07/40300270. ......If you''re going to attack me, then no matter who you are, you should be prepared for a counterattack of equal measure.@k@v07/40300271. Nonaggressive defense.@k@v07/40300272. That''s exactly my policy."'
29509: '@rThat''s why Gaap couldn''t easily touch him.'
29510: '@rThe counterattacking-type barrier had no defensive power.@k However, because of its counterattacking characteristic, it could be useful in defense by making the opponent hesitate to attack.'
29511: '@rThe goats were foolish, so they attacked without worrying,@k but the effect was being realized to the full against Gaap.'
29512: 'George@r@v07/40300273."These guys really are dull.@k@v07/40300274. When your power is even, it''s better to be of a smaller build."'
29513: '@rHe lightly dodged the log-like arm.'
29514: '@rWhen that arm touched the barrier that protected George, it let off a strong, red light.'
29515: '@r......And the tip of the foot that was counterattacking gained the same shine, and the superhuman power of the goat was added to George''s own.'
29516: '@rThe second goat fell forwards and floated in the air for a second.@k@rThen, George''s next roundhouse kick missed right over the falling goat''s head.'
29517: '@r......For an instant, the goat hoped to get away with its life.'
29518: '@rBut no!!@k A heel was dropped onto the back of its head, and it was forced to kiss the ground.'
29519: 'George@r@v07/40300275."......Going from a high roundhouse kick into a neri chagi is pretty basic, right?@k @v07/40300276.It connects pretty often if you don''t overuse it."'
29520: 'Gaap@r@v32/43700303."This guy''s......a problem,@v32/43700304. ...seriously a problem......!!"'
29521: 'George@r@v07/40300277."Demons? Witches? Get real.@k@v07/40300278. .........The rulers of Rokkenjima are this Ushiromiya family.@k@|@y@v07/40300279. I will teach that to you with every ounce of strength in my body."'
29522: 'Gaap@r@v32/43700305.".........Yoooouuuu.........!!"'
29523: '@rThe only way to finish off George now that his body was wrapped up in the counterattacking-type barrier...was to not allow him a counterattack.'
29524: '@r......Next time she sucked him into the Abyss, she would have to kick and drop him, kick and drop him, kick and drop him,@k until she kicked him to death!!!'
29525: '@rBut George had already perfected reading the faint warning signs that told of the appearance of Gaap''s pitfalls.'
29526: '@r......If he managed to jump over that next pit,@k ......then this time, he would probably pulverize Gaap''s head with his whirlwind-like kick, without holding back in the slightest,@k ......just as had been done to his parents.'
29527: '@rShe was able to envision that scene vividly.'
29528: '@rIt was far too late now, but Gaap cursed Kinzo all the same for calling her out to this ridiculous island...!'
29529: '@rRonove finally started using both of his hands to form his shield.'
29530: '@rWithout a more powerful shield, he wouldn''t be able to completely block Jessica''s fists anymore.'
29531: '@rThe enchantment on Jessica''s fists grew the more she fought.'
29532: '@rThe permeation upgrade had already stacked several times,@k and those fists had also been given an impact upgrade, a piercing upgrade, and a speed upgrade, making them fists worthy to fight on par with a demon...'
29533: 'Jessica@r@v04/40200250.".........What''s wrong?!@k @v04/40200251.Starting to get tired?!@k@|@y @v04/40200252.You''re getting all slow!!"'
29534: 'Ronove@r@v31/43100222."No.@k@v31/43100223. Your movements, thoughts, and kinetic vision have been exponentially enchanted.@k@v31/43100224. .........My movements have not changed from the beginning.@k@v31/43100225. ......Your movements are beginning to capture me."'
29535: 'Jessica@r@v04/40200253."And you still won''t fight back...?!!"'
29536: 'Ronove@r@v31/43100226."This is the style which I insist upon.@k@v31/43100227. ......However, I cannot allow things to continue as they are.@k@|@y@v31/43100228. It''s about time for me to get serious and end this......!!"'
29537: '@rRonove''s face turned into an expression he had never shown before.@k@rIt was truly demonic, and to Jessica''s eyes, full of respect.'
29538: '@rBecause it was an expression only shown to enemies strong enough to make him get serious.'
29539: 'Jessica@r@v04/40200254."Whooaa?!?!@k @v04/40200255.What the heck?!"'
29540: '@rWith a whole-body gesture that you couldn''t call elegant, Ronove set up a shield with all his strength, the size and thickness of a wall.'
29541: '@rIts sturdiness was nothing like a shield.@k It was literally a wall.'
29542: '@rAnd on top of that, with all of Ronove''s magical power, it pushed Jessica back bit by bit.'
29543: '@r......Did he plan on pushing her back against the wall and crushing her to death?'
29544: '@rJessica tried to break through the wall with both fists, but it was solid.@k ......Without any exaggeration, it was solid!'
29545: 'Jessica@r@v04/40200256."You call this serious...?!!@k @|@y@v04/40200257.No problem... I''ll break right through iiiiiiiiiiitt!!"'
29546: 'Ronove@r@v31/43100229."I will not let you this time.@k@v31/43100230. This wall is somewhat different.@k@v31/43100231. ......Here, allow me to enchant it as well."'
29547: '@rRonove made magic signs with his fingers almost like a ninja;@k the wall glowed red for just an instant, and became imbued with some kind of ominous power.'
29548: '@rAlmost immediately, Jessica also gained a firsthand understanding of this.'
29549: '@rEvery time she pounded her fists against the wall, pain rebounded upon her as though glass fragments had scattered and hit all over her body.'
29550: 'Ronove@r@v31/43100232."I upgraded it with attack-reactive armor.@k@v31/43100233. An exceptional item which will decrease the force of your attacks by counterbalancing them,@k@v31/43100234. and can even counterattack with reactive fragments."'
29551: 'Ronove@r@v31/43100235."......You are perfectly welcome to keep punching it, but doing so will affect you as well."'
29552: 'Jessica@r@v04/40200258."Heh, ...heheh!!@k @v04/40200259.So it''s an endurance test between me and your wall?!!@k @|@y@v04/40200260.Fine by me!!"'
29553: 'Ronove@r@v31/43100236."Will you fall to your knees first, or be pushed into the wall first?@k@v31/43100237. ......Allow me to observe."'
29554: 'Jessica@r@v04/40200261."Or, I might break through it and smash that whole wall along with your face, ever think about that?!@k @v04/40200262.Just watch meeeeeeeeeee!!"'
29555: '@rWithout hesitation, Jessica slammed both fists into the wall.@k@rEach time she did, a large amount of shards scattered, tormenting her body all over.'
29556: '@rCountless red cuts soon appeared all over her body...'
29557: '@rShe grimaced at the intense pain, but her eyes were burning with fighting spirit, and her lips curved in a grin exactly the opposite of the pain...!'
29558: 'Krauss@r@v02/40800348."Kanon, are you done yet?!@k @v02/40800349.We are alright,@v02/40800350. ......but I can''t say the same for the bars holding those guys in check...!"'
29559: 'Kanon@r@v16/40600138."Just......a little more......!"'
29560: 'Kyrie@r@v09/41300332."There''s no end to these guys...@k@v09/41300333. The bars might break just from them shoving each other!"'
29561: '@rThe metal bars creaked under the strain of the group of goats.@k@rSeveral arms grabbed the bars, twisting them with superhuman strength.'
29562: '@r......However, some bars were being pulled in opposite directions by different hands.@k Apparently they really were stupid.'
29563: '@rThe way those countless hands were grabbing the metal bars......happened to match up by chance.'
29564: '@rSeveral hands grasping two metal bars neatly put their power together and pulled the bars to the left and right, creating an opening.'
29565: '@rThe incredible sound of metal bending could be heard, and that gap was getting larger bit by bit...!'
29566: '@rThey attacked the arms of those goats one by one, but they weren''t getting anywhere.@k@rThey couldn''t stop the gap from expanding left and right...!'
29567: '@rA loud metallic sound came from behind them.@k@rKanon had finally finished cutting.'
29568: 'Kanon@r@v16/40600139."Quickly!!"'
29569: 'Krauss@r@v02/40800351."Kyrie-san, ladies first.@k@v02/40800352. You next, Doctor Nanjo!"'
29570: 'Kanon@r@v16/40600140."Krauss-sama, please leave this place to me...!@k @|@y@v16/40600141.Ngh, ......what?!"'
29571: '@rKanon''s red sword, with which he had cut the metal bars, disappeared.'
29572: 'Shannon@r@v15/40500176."......Sorry!@k @v15/40500177.We''ve entered VIRGILIA-sama''s spirit particle combat area of influence!!@k @v15/40500178.Our magic power is being neutralized!"'
29573: 'VIRGILIA@r@v30/43200115."Hoh-hoh-ho.@k@v30/43200116. I am impressed that you put up such a fight against a Great Witch like me...@k@v30/43200117. You can no longer use your magic in that underground passage."'
29574: '@rA magic circle column drew complex magical formulae around VIRGILIA.'
29575: '@r......With such full-fledged magic being used, Shannon''s power couldn''t even compete.'
29576: '@rOn the contrary, it was surprising that she had withstood as much as she had.'
29577: 'VIRGILIA@r@v30/43200118."Spirit particle superiority ensured.@k@v30/43200119. Come, Chiester Sisters. Now it''s your turn."'
29578: 'VIRGILIA@r@v30/43200120."Wait, are you still rebooting?!@k @v30/43200121.Why are kids so bad at waking up these days...?!"'
29579: 'Chiester00@r@v37/43600064."M-my apologies, ma''am...!!@k @v37/43600065.We''re all different versions..."'
29580: 'Chiester410@r@v36/43500046."Why is it that the shortcuts and pulldown menus get all screwed up every time you change versions nyeh...!@|@y@k @v36/43500047.Did not shut down successfully last time?@k @v36/43500048.Administrator privileges??@|@y@k @v36/43500049.What is all this nonsense!!"@|@y'
29581: 'Chiester45@r@v35/43400038."Ukyu~~!!@|@y@k @v35/43400039.Ukyu~~!!@|@y@k @|@y@v35/43400040. (Fix me quickly~!! Waaaah!)"'
29582: 'Chiester00@r@v37/43600066."Calling Imperial Guards troubleshooting!@k @v37/43600067.What?@k @|@y@v37/43600068.You won''t tell us without a user code?!"'
29583: 'Chiester410@r@v36/43500050."45 is in control of the user code nyeh."'
29584: 'Chiester45@r@v35/43400041."Ukyuu!!@k @v35/43400042.U,@|@y@v35/43400043. kyu,@|@y@v35/43400044. kyu,@|@y@v35/43400045. kyo,@|@y@v35/43400046. ukyu,@|@y@v35/43400047. kyuu!!!"@|@y'
29585: 'Chiester00@r@v37/43600069."A-all I can hear is @b9999.@<kyu-kyu-kyu-kyu@>......@k@v37/43600070. Have her write it on some paper."'
29586: 'Chiester410@r@v36/43500051."Her language support system hasn''t come back up, so she can''t even write nyeh."'
29587: 'VIRGILIA@r@v30/43200122."...........................@k@|@y@v30/43200123. Y-you take your time fixing yourselves...@k@v30/43200124. I''ll go myself..."'
29588: '@r@o75.@v37/43600071|36/43500052.""Sorryyyyyyyyy~!!""@|@y'
29589: '@rThe narrow underground passage was packed with goats, truly like a commuter train in the morning.'
29590: '@rVIRGILIA was again in disbelief at this congestion.'
29591: 'VIRGILIA@r@v30/43200125."What are you doing...?!!"@|@y'
29592: 'VIRGILIA@r@v30/43200125_1."Huh?@k @v30/43200126.You want to be first because you want the prize?@k @v30/43200127.You''re getting in each other''s way because you don''t want the others to steal the prize from you?"'
29593: 'VIRGILIA@r@v30/43200128."You stupid goooooooooooooaaaaaaats!!!@k @v30/43200129.I''m going myself, so open the way!!"'
29594: 'VIRGILIA@r@v30/43200130."What?!@k @v30/43200131.You don''t want to?!@k @v30/43200132.VIRGILIA-sama is trying to steal the prize?!"'
29595: 'VIRGILIA@r@v30/43200133."Why are you forming a scrum?!!"'
29596: 'VIRGILIA@r@v30/43200134."Aaah, it''s so crammed and tight!!@k @v30/43200135.When did this become a goats-only car?!@|@y@k @v30/43200136.Ugyu~~!!@|@y@k @v30/43200137.Whoever just touched my butt, get off at the next statioo~~n!!!"'
29597: 'VIRGILIA@r@v30/43200138.".........Hm? What do you want?@k@v30/43200139. Come this way, you say??"'
29598: '@rThe five people in Krauss''s group dashed through the passageway with all their strength!@k@rThey couldn''t afford to dawdle around underground.'
29599: '@rThey had to quickly join up with the children on the surface!@k@rOnce everyone was together, there would no longer be anything to fear!'
29600: '@rJust then, a terrible rumble started closing in from behind.@k@rHad the pursuers finally made it through the metal bars?!'
29601: '@rBut they couldn''t see anyone when they turned around.'
29602: '@rBut that rumble and the dirt falling here and there from the ceiling grew closer and closer,@k finally catching up with them and even going past them.'
29603: '@rIt felt almost like they had been passed by ghosts.'
29604: '@rThe instant after they thought that nothing had happened, the ceiling in front of them fell in, and a single goat stood in their path.'
29605: '@r......VIRGILIA was sitting on its shoulder.'
29606: 'VIRGILIA@r@v30/43200140."This wise child knew a shortcut.@k@v30/43200141. What a good kid, you get first prize.@k@v30/43200142. Later, I''ll treat you to some homemade mackerel curry."'
29607: '@rMaybe it really was happy even to receive such a dubious prize.@k The massive goat showed its joy by putting its hands together and wiggling.'
29608: '@rVIRGILIA leapt down, laughing that now it was finally checkmate.'
29609: 'Kanon@r@v16/40600142."......Damn...... It''s no good...@k@v16/40600143. ......Our magic has been completely killed..."'
29610: 'Shannon@r@v15/40500179."...It''s too early to give up...@k@v15/40500180. ......Even without magic, we still have our bodies..."'
29611: 'Nanjo@r@v19/41900129."D-don''t be ridiculous...!@k @v19/41900130.There''s no way you could fight a monster like that without that strange power...!"'
29612: 'Krauss@r@v02/40800353."......S-stay back, children..."'
29613: 'Krauss@r@v02/40800354."I''ll handle them somehow, so you escape past that monster while I''m keeping him busy...!"'
29614: 'VIRGILIA@r@v30/43200143."I won''t let you.@k@v30/43200144. Hohhohohohohoho!"'
29615: '@rVIRGILIA clapped her hands, and a purple magic barrier appeared behind her,@k stealing even the faint hope that Krauss had been betting on.'
29616: 'Krauss@r@v02/40800355."Is there...nothing more to be done......?@k@|@y@v02/40800356. ...N-no, there''s still a chance.@k@v02/40800357. ......Even Jessica fought.@k@v02/40800358. I must do the same..."'
29617: 'Kyrie@r@v09/41300334."A-are you serious?!@k @v09/41300335.It''s not possible, not against that massive monster...!"'
29618: 'Nanjo@r@v19/41900131."Don''t be absurd...!@k @v19/41900132.Krauss-san, let us think of another way......"'
29619: 'Krauss@r@v02/40800359."If you think of something, I''m open to suggestions.@k@v02/40800360. Until then, it looks like I''ll have to manage something...@k@|@y@v02/40800361. ......Come on, get back."'
29620: 'Kyrie@r@v09/41300336."......Be careful."'
29621: 'VIRGILIA@r@v30/43200145."Hohohoho...hohhohohohohohohoho!@k @|@y@v30/43200146.My, my, Krauss.@k@v30/43200147. You intend to fight this child alone?"'
29622: 'Krauss@r@v02/40800362."........................khh...@k@|@y@v02/40800363. Y-you never know.@k@v02/40800364. In a fight, it''s always possible to get in a lucky shot..."'
29623: 'VIRGILIA@r@v30/43200148."Hohhohohoho.@k@v30/43200149. You think you can win even with a fluke...?@k @|@y@v30/43200150.Allow me to explain the situation for you, since you clearly don''t know your place."'
29624: 'Krauss@r@v02/40800365."Whaat......?"'
29625: 'VIRGILIA@r@v30/43200151."Hohohoho...@k@v30/43200152. Assuming you were to wield 100% of your strength, your power level is at most 6.@k@v30/43200153. In comparison, this child has a power level of 1000.@k@v30/43200154. In short, even if there were 100 of you, you could never win."@|@y'
29626: 'VIRGILIA@r@v30/43200155."Well, it''s true that there are uncertain elements in a fight.@k@v30/43200156. I will admit that your power level has a slight scaling factor to it."'
29627: 'VIRGILIA@r@v30/43200157."But even so, your chances of defeating him are around perhaps 0.00001%.@|@y@k@v30/43200158. Do you understand?@k @v30/43200159.You don''t even have a one in ten thousand chance of victory.@|@y@k@v30/43200160. Hoh-hoh-hoh-ho...!"'
29628: '@rVIRGILIA and the goat guffawed together.'
29629: 'Krauss@r@v02/40800366."D-...damn it......@k@v02/40800367. If it''s a one in ten thousand chance, then the payoff will be ten thousand times more, will it not?@k@|@y@v02/40800368. ......A good dark horse.@k@v02/40800369. I like betting tickets like that, makes me want to buy them..."'
29630: 'VIRGILIA@r@v30/43200161."Hoh-hoh-hoh-ho!@k @v30/43200162.But the coin to buy that is your life, and there''s only one of those, you know.@k @v30/43200163.Nevertheless, I can understand the feeling of wanting to entrust your fate to that miracle."'
29631: 'VIRGILIA@r@v30/43200164."......Which is why, in praise of your courage for standing against us without fear, I shall give you a bit of a handicap.@|@y@k@v30/43200165. This child will fight with only his left arm.@|@y@k@v30/43200166. Well, even so, I can''t imagine for a moment that he''ll lose to you."@|@y'
