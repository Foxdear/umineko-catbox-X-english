28948: 'Ronove@r@v31/43100134.".........If you cannot choose any,@k@v31/43100135. ......I can at least take your life painlessly, ...if you would like......?"'
28949: 'Jessica@r@v04/40200142.".................................@k@v04/40200143. .........ll m."'
28950: 'Ronove@r@v31/43100136."......What?@k @v31/43100137.I''m afraid I had trouble hearing.@k@v31/43100138. May I ask you to repeat......?"'
28951: '@rJessica lifted her face, ......and looked straight into Ronove''s eyes.'
28952: '@r......It seemed that she had decided on her answer.'
28953: 'Jessica@r@v04/40200144."............Kill me."'
28954: '@rJessica said it one more time, ......clearly.'
28955: '@rPerhaps Ronove had imagined from the very beginning that this would be the answer.'
28956: '@r......Without any surprise, he smiled lightly and nodded.'
28957: 'Ronove@r@v31/43100139."......I thought that you would choose that answer, Jessica-sama.@k@v31/43100140. ......Now then, there is no right or wrong answer to this test.@k@v31/43100141. The important part is what thoughts led you to that answer."'
28958: 'Ronove@r@v31/43100142."Come now.@k@v31/43100143. Please answer that with your readiness as the next head."'
28959: 'Jessica@r@v04/40200145."............It''s not like I chose the first one ''cause I wanted to die.@k@v04/40200146. ......The second one was letting Kanon-kun die.@k@v04/40200147. That''s obviously out of the question.@k@v04/40200148. So forget that one.@k@v04/40200149. ......The third one was everyone else''s lives.@k@v04/40200150. That''s also obviously out of the question.@k@v04/40200151. So forget that one.@k@v04/40200152. ......After that, only the first choice remained."'
28960: 'Ronove@r@v31/43100144."Process of elimination, ......is it.@k@v31/43100145. So it was not something you chose proactively, you say......"'
28961: '@rAfter chuckling slightly, Ronove dropped his gaze.'
28962: '@r......A Human couldn''t even imagine what kind of answer a demon would have been hoping for.'
28963: '@r......All she could understand was that this was apparently slightly below Ronove''s expectations.'
28964: 'Ronove@r@v31/43100146."......It''s not a bad answer, but I must say, it''s not a good one either.@k@v31/43100147. ......I suppose I would call it a 60.@k@v31/43100148. ......I''m a little disappointed."'
28965: 'Jessica@r@v04/40200153."You''re a pretty selfish bastard, telling me to answer with self-confidence and then being disappointed when I do."'
28966: 'Ronove@r@v31/43100149.".........Apparently it was not only process of elimination.@k@v31/43100150. ...Either way, it is a failing grade, ......but it seems that there is a little more to your thoughts.@k@v31/43100151. Allow me to ask."'
28967: 'Jessica@r@v04/40200154."I don''t want to die.@k@v04/40200155. ......So I didn''t want to choose the first one - no one would.@k@v04/40200156. ......People struggle as much as life will let them, ''cause they want to live in happiness.@k@v04/40200157. So normally, the first choice should be impossible from the beginning."'
28968: 'Ronove@r@v31/43100152.".........However, you took that first choice.@k@v31/43100153. You chose to throw away your own life.@k@v31/43100154. Only that choice remained."'
28969: 'Jessica@r@v04/40200158."I tried......thinking of the future that would come after choosing each one."'
28970: 'Ronove@r@v31/43100155."......Hoh.@k@v31/43100156. And what did you find...?"'
28971: 'Jessica@r@v04/40200159."First, .........I tried letting Kanon-kun die.@k@v04/40200160. .........I tried to imagine the rest of my life after having abandoned the one I love."'
28972: 'Ronove@r@v31/43100157."What kind of life was it...?"'
28973: 'Jessica@r@v04/40200161."She was a horrible woman, who didn''t deserve to live.@k@v04/40200162. A shabby woman who forever lamented her own decision, and lived only to regret.@k@v04/40200163. ......A horrible woman who would choose to live and abandon the person she loved... I could never forgive a woman like that.@k@v04/40200164. ......I''d put an end to her myself."'
28974: 'Ronove@r@v31/43100158."Heheh, how spirited.@k@v31/43100159. .........In that case, could you not also have considered the third choice?"'
28975: 'Jessica@r@v04/40200165."......Yeah.@k@v04/40200166. I tried letting everyone but me and Kanon-kun die.@k@v04/40200167. ......There''s no way Kanon-kun would like me if I did that."'
28976: 'Jessica@r@v04/40200168."And it was no good for me either... Although I had Kanon-kun, all the lives I abandoned for that became a cross that I had to bear for my entire life.@k@v04/40200169. ......And even Kanon-kun was forced to bear that cross."'
28977: 'Jessica@r@v04/40200170.".........I''m not going to make a foolish choice just to force a cross on Kanon-kun.@k@v04/40200171. If there''s a future me out there who would do something like that, .........she''s unforgivable to me.@k@v04/40200172. ...I''d put an end to that woman myself too."'
28978: '@rJessica had pictured it in her mind.@k@rThe future her, beyond each of the three choices.'
28979: '@rThere were three Jessicas.@k@r......Of the three, two had regrets.@k@rOnly one could hold her head high and smile at Kanon.'
28980: 'Jessica@r@v04/40200173."......You know,@k@v04/40200174. I once had the nerve to preach something to Kanon-kun.@k@v04/40200175. ......Something about trying to live life to the fullest."'
28981: 'Ronove@r@v31/43100160."Live your life to the fullest.@k@|@y@v31/43100161. ......Meaningful words.@k@v31/43100162. That is a surprisingly difficult thing to do."'
28982: 'Jessica@r@v04/40200176."So yeah.@k@v04/40200177. I''ve got to hold my head high and show Kanon-kun.@k@|@y@v04/40200178. .........Show him a way of living where you can hold your head high, and look anyone in the eye with a full and guiltless smile."'
28983: 'Ronove@r@v31/43100163."......Will Kanon be able to receive your self-sacrifice?@k @v31/43100164.Haven''t you considered that your self-centered decision might hurt him even more...?"'
28984: 'Jessica@r@v04/40200179."That''s why...I want to leave a message..."'
28985: 'Ronove@r@v31/43100165."Hoh.@k@v31/43100166. ......I will listen, but I am after all a demon.@k@v31/43100167. ...I may not keep my promises..."'
28986: 'Jessica@r@v04/40200180.".........Keep it.@k @v04/40200181.Your promise."'
28987: '@rJessica spoke that looking quite unconcerned.'
28988: '@rShe had asked the demon who was about to take her life to pass on a message, and she wasn''t thinking for a moment that she would be betrayed.'
28989: '@r......At that extremely innocent smile, Ronove closed his eyes lightly, and shrugged his shoulders.'
28990: 'Ronove@r@v31/43100168."Hmph......@k@v31/43100169. ......Very well.@k@v31/43100170. So?@k @v31/43100171.What shall I tell him...?"'
28991: 'Jessica@r@v04/40200182.''......Tell Kanon-kun...to live his life to the fullest.@k@v04/40200183. ......No, that''s not quite it.@k@v04/40200184. Not his life...not Kanon-kun''s life.@k@v04/40200185. ......Even now I can''t get him to tell me his real name,@k@v04/40200186. but tell him to live the real Kanon-kun''s life to the fullest.@k@v04/40200187. .........Tell him that.'''
28992: 'Kanon@r@v16/40600098."...............Mi...lady......"'
28993: 'Krauss@r@v02/40800310."......Jessica......@v02/40800311. ......You are unbelievable............"'
28994: 'VIRGILIA@r@v30/43200073."Ronove is fickle, so he might not have passed the message on.@k@v30/43200074. ......Aren''t you lucky?@k@v30/43200075. To have me here showing you this scene."'
28995: '@rA musty three-sided mirror was set beyond the bars, ......and the scene with Jessica was reflected on it.'
28996: '@rOn the next mirror...the scene with George was reflected in the same way.'
28997: '@rNone of them questioned how a three-sided mirror had appeared from a group of butterflies,@k or why Jessica and George were reflected on it.'
28998: '@r......Because the reflected sights themselves were more important.'
28999: 'Krauss@r@v02/40800312."............You are that prepared...@k@v02/40800313.......to throw your life away,@v02/40800314. ......for his sake........."'
29000: 'Kanon@r@v16/40600099.".................................@k@v16/40600100. ......My......deepest apologies..."'
29001: '@rKrauss looked at Kanon with a complicated expression that had an awkward smile mixed in.@k@r......Kanon couldn''t meet his eyes.'
29002: 'Kanon@r@v16/40600101."......VIRGILIA-sama.@k@v16/40600102. ......There is no reason for Milady to lose her life.@k@v16/40600103. ......Please kill me.@k@v16/40600104. Please change it to the second choice.@k@v16/40600105. ......That way, everything should resolve itself."'
29003: 'VIRGILIA@r@v30/43200076."Hohhohohohohoho...@k@v30/43200077. I am not capable of granting that wish.@k@v30/43200078. ......After all, this is Jessica''s own decision, which she chose."'
29004: '@rSuddenly, the air split, and the Chiester Sisters appeared, flying into VIRGILIA''s chest.'
29005: 'Chiester410@r@v36/43500033."VIRGILIA-samaaaaaaaaaaaa!@|@y@k @v36/43500034.Hiieeehheiiiiih!!"'
29006: 'Chiester45@r@v35/43400015."So mean, so mean, Lord GOLDSMITH is so meeeeeaan, wahhhnhaaaanhaahaahhhn!"'
29007: 'Chiester00@r@v37/43600037."I''m......doing the best I can......@k@v37/43600038. Crushing me for animal fodder...that''s just too much.@k@v37/43600039. ......Uuuuuuuughhuhhuu!!"'
29008: '@rStill without a clue what was going on, VIRGILIA was smothered by the sobbing Chiester Sisters.'
29009: 'VIRGILIA@r@v30/43200079."Th-there, there. Everything''s alright, it''s alright. Don''t cry, don''t cry......@k@v30/43200080. I''ll make you some delicious tea......"'
29010: 'VIRGILIA@r@v30/43200081."......I''m leaving it up to all of you to guard this place.@k@v30/43200082. If they do anything suspicious, inform me immediately...!"'
29011: '@rThe goat attendants all looked at each other, and nodded their heads.'
29012: '@rVIRGILIA took the Chiester Sisters and left.'
29013: '@rThe sound of people going up a set of stairs could be heard, so they had probably gone to an upper floor.'
29014: 'Kyrie@r@v09/41300298.".........This is our chance.@k@v09/41300299. ......These goat-heads seem to be stupid.@k@v09/41300300. ......I wonder if we can trick them..."'
29015: '@rKyrie realized that an opportunity had arrived, but she still hadn''t thought of a way to break the metal bars......'
29016: '@rThe Jessica reflected on the three-sided mirror closed her eyes, as though she had given up.'
29017: '@r......The way she had both hands stuck into her pockets, wanting to be defiant until the very end, might have been her own kind of aesthetics.'
29018: 'Jessica@r@v04/40200188."............That''s all I want to say.@k@v04/40200189. .........Kill me."'
29019: 'Ronove@r@v31/43100172."......Very well.@k@v31/43100173. ............Here we go, then.@k@v31/43100174. ......Do not worry, for I shall make your death more gentle and merciful than any sleep."'
29020: '@rRonove raised his palm......as he slowly approached Jessica......'
29021: 'Krauss@r@v02/40800315."Dammiiiiiiiiiiittt!!@k @v02/40800316.Wrooggh!!@k @v02/40800317.Graaah!!"'
29022: '@rRealizing that his daughter would be killed, Krauss repeatedly body-slammed the metal bars, going half-mad.'
29023: '@rThe goats looked like they were sneering at how a mere Human didn''t stand a chance at breaking those bars.'
29024: '@rAnd, true, Krauss''s pointless effort might have been comical.'
29025: '@r......But Krauss was giving it everything he had.@k As Jessica''s father, he was living in that moment with everything he had, so that he could save her.'
29026: '@r.........Kanon made tight fists with both hands.'
29027: '@rIf he used his cursed power, he might be able to cut through even metal bars.'
29028: '@r......But there were a full three goats.@k ...There was no way he could defeat three of them in an instant.@k It would instantly be reported, and then VIRGILIA and even the Chiester Sisters would dash in.'
29029: '@rThough he may be able to break the bars, ......he could do nothing more.@k@r......It was useless.'
29030: '@r......Kanon knew already that the witch was sneering at that kind of useless effort,@k ......so he could do nothing but stare at Krauss''s repeated body-slams...'
29031: 'Shannon@r@v15/40500130."......Ah, ............George-sama......"'
29032: '@rShannon, who had been looking at the three-sided mirror, let out a voice.'
29033: '@r...They looked to see that George, who had been silent this whole time, had raised his head.@k@r......It seemed that George had also decided on an answer...'
29034: 'Gaap@r@v32/43700134."............Have you decided?@k @v32/43700135.Your answer?"'
29035: 'George@r@v07/40300130."Yeah.@k@v07/40300131. .........I''ve decided."'
29036: 'Gaap@r@v32/43700136."Is that an unwavering answer...?"'
29037: 'George@r@v07/40300132."Yeah. It''s unwavering."'
29038: 'Gaap@r@v32/43700137."Then let''s hear it.@k@|@y@v32/43700138. .........Oh, by the way,@k@v32/43700139. it seems Jessica decided to take the "your life" option.@k@v32/43700140. I hope that an indecisive person like you won''t simply say you chose the same answer......?"'
29039: 'George@r@v07/40300133."......Jessica gave her own answer.@k@v07/40300134. ......No matter which choice that was, it was Jessica''s answer.@k@v07/40300135. It does not influence my answer in any way."'
29040: 'Gaap@r@v32/43700141."I see.@k@v32/43700142. Then let me ask again.@k@|@y@v32/43700143. ............Among the three mentioned below.@k@v32/43700144. In order to gain two, sacrifice one."'
29041: 'Gaap@r@v32/43700145."1. Your life.@k@v32/43700146. 2. Shannon''s life.@k@v32/43700147. 3. Everyone else''s lives.@k@v32/43700148. .........Which have you chosen?@k @v32/43700149.Could it be the first one, like Jessica?"'
29042: 'George@r@v07/40300136.".........No."'
29043: 'Gaap@r@v32/43700150."Oh......?"'
29044: '@rGaap looked a little surprised.@k ......Because she had thought that a timid-looking man like this would never choose any other option.'
29045: 'Gaap@r@v32/43700151.".....................@k@v32/43700152. ......That''s nice to hear.@k@v32/43700153. I''m glad the most boring option for me has been removed.@k@|@y@v32/43700154. ......Then, it seems unlikely, but......is it the second?@k @v32/43700155.Can you abandon Shannon''s life......?"'
29046: 'George@r@v07/40300137.".........You must be joking.@k@v07/40300138. Why would I do that to the person I''m going to give an engagement ring to tonight?"'
29047: 'Gaap@r@v32/43700156."........................@k@v32/43700157. .........Now this is bold.@k@v32/43700158. Is that your answer......?"'
29048: 'George@r@v07/40300139.".........Yes.@k@|@y@v07/40300140. ......My answer...@v07/40300142.@|@y...is the third choice."'
29049: '@rGeorge had chosen.........the third choice.@k@r......"Everyone else''s lives".'
29050: '@rEven Gaap hadn''t been able to imagine that answer.'
29051: '@r......She had been sure that he''d choose number one, just like Jessica......@k@rSo, she became interested in how he had reached that answer.'
29052: '@r......How he had reached an answer that had defied the imagination of the 33rd ranked demon of the 72.'
29053: 'Gaap@r@v32/43700159."I want you to tell me.@k@v32/43700160. .........Tell me the perspective that makes you able to sacrifice the lives of everyone else so that you and the fiancee you love will be safe.@k@v32/43700161. ......Process of elimination, like Jessica?"'
29054: 'George@r@v07/40300143."No.@k@v07/40300144. This is the clear and only choice for me."'
29055: 'Gaap@r@v32/43700162."...............So it''s "I''m alright, Jack"?@k @v32/43700163.You can sacrifice the world for the woman you love...?"'
29056: 'George@r@v07/40300145."Just what are you talking about?"'
29057: 'Gaap@r@v32/43700164."............What.........?"'
29058: '@rGeorge faced the demon as he spoke, looking at her almost in disbelief.'
29059: 'George@r@v07/40300146."......Tonight,@k@v07/40300147. I planned on calling Shannon to this very spot, and giving her this ring as proof of our engagement."'
29060: 'George@r@v07/40300148.".........There probably are quite a few people who wouldn''t celebrate an engagement between me and Shannon.@k@v07/40300149. I was prepared to make enemies of the entire family by announcing my engagement to her."'
29061: 'George@r@v07/40300150."I have been prepared.@k@v07/40300151. Since the time I came to this island, .........no, that''s not it.@k@v07/40300152. .........Since the time I confessed to her that I wanted us to get engaged."'
29062: 'Gaap@r@v32/43700165."............So, you can sacrifice everything else as long as you can get married......?"'
29063: 'George@r@v07/40300153."Marriage...@k@v07/40300154....means remaining an ally to your wife for your entire life.@k@v07/40300155. .........As of that moment,@k@v07/40300156. ......I was prepared to make the entire world my enemy for her sake."'
29064: '@rThose words, through the three-sided mirror, ......also reached Shannon''s ears.@k@rAnd his determination reached her eyes.'
29065: '@r......Shannon certainly had arranged with George that tonight, she would be given an engagement ring.'
29066: '@rThen this incident had occurred, and she hadn''t been able to receive the ring.'
29067: '@rBut now,@k .........even though it wasn''t in the form of a ring,@w500. ......Shannon had received something even greater.'
29068: '@r......And as proof of that,@w500. ......a single tear with the same sparkle as a diamond...@w583.dripped down.'
29069: 'Gaap@r@v32/43700166."Heh, ......heheheheheheh......!@k @v32/43700167.What a gutsy answer.@k@v32/43700168. .........Yes, if I really think about it, this was an easy decision for you."'
29070: 'Gaap@r@v32/43700169."After all, your parents were already killed on the first twilight, right?@k @v32/43700170.By now, there''s no one whose death would bother you.@k@|@y@v32/43700171. Hahhahahahahahaha, I see, this was an easy choice.@k@v32/43700172. Ahahahahahahahaha......"'
29071: 'George@r@v07/40300157."You can say whatever you want.@k@|@y@v07/40300158. This is my determination and my choice, ......personally, and as the next family head."'
29072: '@rThe sparkle in George''s eyes was brilliant and sharp.'
29073: '@r...For just an instant, Gaap felt the same sense of intimidation that Kinzo exuded, and was slightly overpowered.'
29074: 'Gaap@r@v32/43700173.".........I see.@k@v32/43700174. ......So, the same answer as GOLDSMITH......@k@|@y@v32/43700175. ......Despite your innocent face, ......you''re going to become a terrible demon in the future.@k@v32/43700176. ......What do you know, we might get along pretty well."'
29075: 'Gaap@r@v32/43700177."You will succeed GOLDSMITH.@k@v32/43700178. And maybe one day, I may even be summoned eventually and serve you.@k@v32/43700179. ......That might be surprisingly interesting.@k@v32/43700180. .........Heheh."'
29076: '@rGaap needed to change her opinion of George.'
29077: '@r......This man bore a determination and resolve unimaginable from his outward appearance, and had not adopted that just now,@w583. ......but had possessed it since the very beginning.'
29078: 'George@r@v07/40300159."I am prepared to inherit the headship right away.@k@|@y@v07/40300160. .........No, that''s not it.@k@v07/40300161. You told me to think as the head in this test.@k@v07/40300162. So I answered based on the premise that I am the head."'
29079: 'George@r@v07/40300163.".........No, even that''s not it.@k@v07/40300164. I thought as the head himself.@k@v07/40300165. ......Right now...I am the head of the Ushiromiya family."'
29080: 'Gaap@r@v32/43700181.".......................................@k@v32/43700182. Ehheheheheh......@k@v32/43700183. I''m impressed... I didn''t expect you to be able to say so much."'
29081: 'Gaap@r@v32/43700184."It seems you really are one to be reckoned with.@k@v32/43700185. ......Battler''s and Maria''s tests haven''t been done yet, but if you ask me, I think you should be the one to pass.@k@|@y@v32/43700186. ............But only if that is your true, unexaggerated answer, of course?"'
29082: 'George@r@v07/40300166."............Do you doubt my resolve?"'
29083: 'Gaap@r@v32/43700187."Can you carry out the choice you chose?@k @v32/43700188.Can you, right now, with your own hands, offer all the lives that exist on this island as sacrifices......?@k @v32/43700189.With your own hands, I remind you...?"'
29084: 'George@r@v07/40300167."I can.@k@v07/40300168. I''ve said several times that I have that resolve."'
29085: 'Gaap@r@v32/43700190."Ha, ............hahahahahaha!@k @v32/43700191.Then return to the guesthouse right away, and kill Battler and Maria!@k @v32/43700192.When that is done, I will bring you the other hostages.@k@v32/43700193. Execute each of them except Shannon before her eyes!@k @v32/43700194.You can do it, right?!"'
29086: 'George@r@v07/40300169."I can.@k@v07/40300170. My resolve is on a whole different level from yours."'
29087: 'Gaap@r@v32/43700195."...........................mngh.@k@v32/43700196. Then carry it out!@k @v32/43700197.Death for them all!@k @v32/43700198.Carry out this blood-stained ritual as the new head of the Ushiromiya family...!!"'
29088: 'George@r@v07/40300171."......Understood.@k@v07/40300172. I''ll carry it out.@k@v07/40300173. I am already the head of the Ushiromiya family."'
29089: 'Gaap@r@v32/43700199."Yes, that''s right!@k @v32/43700200.Stain that throne red by your own hands...!@k @v32/43700201.You will become king of the netherworld, ruler of all demons...!!"'
29090: '@rGaap was now sure.@k@rThis man was truly fitting to succeed Kinzo''s madness...!'
29091: 'Gaap@r@v32/43700202."Rage on, storm! Cry out, thunder!!@k @v32/43700203.Celebrate the birth of the new demon king!!@k @v32/43700204.The island of demons has now welcomed a new ruler...!!"'
29092: '@rIn response to the demon''s call, the tempest raged more and more.'
29093: '@rThen a massive lightning bolt fell, its tearing thunder and brilliant light creating the feeling of just a moment of silence......'
29094: 'George@r@v07/40300174."So,@k@v07/40300175. ............about the order of the murders.@k@v07/40300176. I get to choose, right?"'
29095: 'Gaap@r@v32/43700205."Please, as you wish, Your Majesty, the new demon king of Rokkenjima.@k@v32/43700206. As your heart desires...!"'
29096: 'George@r@v07/40300177.".........Well, for lack of a better option...@k@|@y@v07/40300178.the first one will be you, then - I hope that won''t be a problem?"'
29097: 'Gaap@r@v32/43700207."..............................Huh?"'
29098: '@rA gust of wind blew, ......stirring up George''s jacket as though it was a cloak.'
29099: '@rIt was very much like the cloak worn by the head.@k@rIt definitely gave the same impression of grandeur......'
29100: '@r......At that time, ......Gaap certainly saw the storm wiped away, and the sky covered with a pure-white and vast full moon.'
29101: '@rBearing the full moon on his back,@w333. the man who called himself the new head...@w500.sneered at the demon.'
29102: 'George@r@v07/40300179."Even the lives of the Ushiromiya family, all of them......are now my fortune.@k@v07/40300180. There will be reparations to be made for the damage that has been done to that fortune.@k@v07/40300181. It won''t be cheap."'
29103: 'George@r@v07/40300182."......You didn''t seriously think you could take the lives of my parents, Aunt Natsuhi, Uncle Rudolf, Auntie Rosa,@k@v07/40300183. and Genji-san, and hope I''d overlook it, right?"'
29104: 'Gaap@r@v32/43700208."Ho...@v32/43700209.......hohoh...@v32/43700210.............you little wise guy......"'
29105: '@rRonove had been intending to press his palm against Jessica''s chest and stop her heart.'
29106: '@rBut a short distance away, his hand had stopped......'
29107: '@r......On the carpet at their feet,@w500. ......plop, plop...small red flowers bloomed one after another.'
29108: '@rThe seeds of those flowers...@w333....had fallen down from high, high above,@w416. .........all the way from Jessica''s fist,@w500. ...held up as though to strike the heavens.'
29109: '@rRonove''s nose was stained red with spurting blood,@k ......and those drops were dripping onto the carpet.'
29110: 'Jessica@r@v04/40200190.".........By the way, that just now was my answer as a maiden.@k@v04/40200191. ......My answer as the next head is different."'
29111: 'Ronove@r@v31/43100175."Allow me to ask......"'
29112: 'Jessica@r@v04/40200192."......The person I love, my family and my relatives, everyone, everyone!!@k @v04/40200193.I''ll protect them.@k@v04/40200194. If I''m the head, then that''s my duty!"'
29113: 'Jessica@r@v04/40200195."Dad wasn''t just acting self-important.@k@v04/40200196. He was protecting me and Mom!!@k @v04/40200197.......Fighting the pressure of succeeding the Ushiromiya family......for several decades!!"'
29114: 'Jessica@r@v04/40200198."So I know.@k@v04/40200199. ......Being the successor is nothing trivial.@k@v04/40200200. ......So you know what?@k@v04/40200201. This is easy as hell.@k@v04/40200202. ......It''s easy as hell for me to risk my own life!!"'
29115: '@rJessica knew.'
29116: '@rShe knew that her father, in order to protect his family, was even now bluffing and fighting a solitary fight.'
29117: '@rJessica understood something that his back had been telling her!'
29118: '@rAnother left straight was buried into Ronove''s face.@k@r......That mighty strike wasn''t due just to the brass knuckles she was using.'
29119: '@rIt was a strike...@w500.of a person, a family head, who could throw away everything in order to protect.'
