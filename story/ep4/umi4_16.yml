29246: '@rAfter several moments'' delay, Gaap jumped back.@k Of course, it was too late.'
29247: '@rIf George hadn''t stopped, he probably would have caused exactly the damage he had announced.'
29248: 'George@r@v07/40300218."And what I got from Father...@v07/40300219....is patience."'
29249: '@rAnger with a low boiling point isn''t something to be truly feared.@k@r......True anger is cultivated through patience.'
29250: 'George@r@v07/40300220.".........I understand your declaration of violent intent.@k@v07/40300221. ......I also understand your defamation of my fiancee and my parents.@k@v07/40300222. And you have no intention of retracting any of these......?"'
29251: 'Gaap@r@v32/43700272."......Y-you......"'
