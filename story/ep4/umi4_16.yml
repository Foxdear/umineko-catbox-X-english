29942: 'Kyrie@r@v09/41300424."......I''m like that even now.@k@v09/41300425. ......The true form of this thing that keeps attacking me, trying to shoot through my forehead,@v09/41300426. ......is something I can''t understand,@v09/41300427. .........and I can''t believe."'
29943: 'Kyrie@r@v09/41300428."So,@v09/41300429. ......I want you at least to believe, to understand,@v09/41300430. .........and to accept that being which...@v09/41300431....we couldn''t fully accept.@k@v09/41300432. If you do that for me, our deaths won''t have been in vain.@k@v09/41300433. .........It''ll also have been worth it for me to make this phone call...@k@v09/41300434. ......Ah...!"'
29944: 'Battler@r@v10/40100420."K-Kyrie-san?!?!"'
29945: 'Kyrie@r@v09/41300435."......I''m still okay.@k@v09/41300436. It grazed me, but it missed again.@k@v09/41300437. ......I very much doubt...@v09/41300438..........that I''ll survive the next one.@k@v09/41300439. .........Thank you.@k@v09/41300440. And goodbye, Battler-kun.@k@v09/41300441. ......I was once cold towards you because you were Asumu-san''s son.@k@v09/41300442. ......Forgive me...for those days."'
