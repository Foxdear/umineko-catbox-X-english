29231: 'Gaap@r@v32/43700256."..................This guy... ......"'
29232: 'George@r@v07/40300207_1.''Shannon.@k@v07/40300208. You are not furniture.@k@v07/40300209. ......Even if you were, you would be mine alone, the only furniture for me in the world.@k@v07/40300210. I want you to be close to me all my life.@k@v07/40300211. ......I need you...always and forever.'''
29233: 'Shannon@r@v15/40500139.".........G-......George-sama..............."'
29234: 'Kyrie@r@v09/41300301."......I''m jealous.@k@v09/41300302. He''s surpassed my husband in smooth talking."'
29235: 'Nanjo@r@v19/41900110."Th-......this is youth."'
29236: 'Gaap@r@v32/43700257."Ahhahahahahahahahahaha...!!@k @v32/43700258.Love is strength?@k @v32/43700259.Then why are you so weak, boy?@k @v32/43700260.It must mean your love is also that weak, then, I guess?"'
29237: 'Gaap@r@v32/43700261."*snicker*snicker*!@k @v32/43700262.Your love for your fiancee is weak.@k@v32/43700263. Your parents'' disappointingly quick deaths were weak.@k@v32/43700264. Everything about your life is weak."'
29238: 'George@r@v07/40300212."...............Shannon taught me about love and strength.@k@|@y@v07/40300213. If you insist upon measuring my love for Shannon by my strength alone,@v07/40300214. ......then let me teach you about my love."'
29239: 'Gaap@r@v32/43700265."*chuckle*, nice words.@k@v32/43700266. ......Nowww I get it.@k@v32/43700267. So you say that the way you can still stand up after being kicked down so many times is the strength you received from Shannon.@k@|@y@v32/43700268. In that case, what did you receive from your mother and father, who were killed without a fight?@k @v32/43700269..........?"'
