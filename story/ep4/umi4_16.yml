29292: 'George@r@v07/40300246."It looks like you''re still mistaking the meaning of that force.@k@v07/40300247. ......In this situation, force doesn''t mean hastily wielded violence.@k@v07/40300248. .........It refers to a deterrent - the knowledge that if someone opposes the monarch, that person won''t get away unharmed."'
