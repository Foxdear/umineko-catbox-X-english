29253: 'Gaap@r@v32/43700273."E-enough of your slick talk, bucko......!!"'
29254: '@rA pitch-black hole opened its mouth at George''s feet.'
29255: '@rBut George rapidly opened his legs, straddling the hole.@k The same move wouldn''t work again...!'
29256: '@rIt was an extremely light dodge, and the upper part of his body didn''t even quiver.'
29257: 'George@r@v07/40300225."Patience means not losing your cool, and instead composedly researching your opponent''s moves.@k@v07/40300226. .........For what purpose?@k @v07/40300227.Isn''t it obvious?@k@v07/40300228. Do you know?"'
29258: 'Gaap@r@v32/43700274."N-n-no I don''t......"'
29259: 'George@r@v07/40300229."It''s to counter, to give back exactly what you got, to make them never want to mess with you again,@k@v07/40300230. to make them cover their face in tears and snot and forget to wipe it off,@k@v07/40300231. to make them want to rub their forehead on the ground and apologize over and over - to completely, perfectly, thoroughly...!!!@k @v07/40300232.......Pulverize them until they can''t get up."'
29260: '@rGeorge dashed.'
