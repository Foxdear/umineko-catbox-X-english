29912: 'Kyrie@r@v09/41300370.".........Today,@k@v09/41300371. after you all returned to the guesthouse, the family conference began in the dining hall,@v09/41300372. ......and I''ll tell you everything that happened next."'
29913: 'Kyrie@r@v09/41300373."Listen until the end without butting in.@k@v09/41300374. ............The call might suddenly be cut off partway through.@k@v09/41300375. If it is, that''s the moment I was killed."'
