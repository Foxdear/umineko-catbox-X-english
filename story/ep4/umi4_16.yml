29900: 'Battler@r@v10/40100395."H-hello!!!@k @|@y@v10/40100396................Huh?@k @|@y@v10/40100397.Kyrie-san?!"'
29901: 'Kyrie@r@v09/41300359."......Yes, Battler-kun.@k@v09/41300360. ......I got lucky.@k@v09/41300361. I managed to escape the dungeon somehow.@k@v09/41300362. I really was fortunate."'
