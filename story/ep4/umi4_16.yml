29921: 'Kyrie@r@v09/41300384."Where to?@k@v09/41300385. ......You realize,@v09/41300386. ...I''ve managed to run all the way here,@v09/41300387. ......shut myself into a room, and even locked the door......?@k @v09/41300388..........And I''m still being targeted.@v09/41300389. .........Just where am I meant to hide...?@v09/41300390. ......Seriously......"'
29922: 'Battler@r@v10/40100404."Ky......@v10/40100405.ri...@v10/40100406.e...@v10/40100407....san........."'
29923: 'Kyrie@r@v09/41300391."Battler-kun...@k@v09/41300392. Are Jessica-chan and George-kun......still alive?"'
29924: 'Battler@r@v10/40100408.".....................@k@v10/40100409. ......Just now, ...there was a phone call from Jessica...@k@v10/40100410. .........It kinda......sounded like they were...done for......"'
29925: 'Kyrie@r@v09/41300393.".........Thought so.@k@v09/41300394. ......Yeah, when we five were being killed one after another, I had a kind of premonition.@k@v09/41300395. ......I thought that perhaps the second twilight had been finished in the thirteen-person murder ritual, and that our twilights had been reached."'
29926: 'Kyrie@r@v09/41300396.".........In other words, when I die, that''s thirteen.@k@v09/41300397. Then the ritual will be complete.@k@v09/41300398. ......The Golden Witch, BEATRICE, will be resurrected."'
29927: 'Kyrie@r@v09/41300399.".........I wonder what will happen.@k@v09/41300400. ......On this island filled with demons and witches, and swarming with goat monsters,@v09/41300401. ......when even the boss of them all, the Golden Witch, appears,@v09/41300402. .........I wonder just what in the world will happen...@k@v09/41300403. ......At this point,@v09/41300404. I can''t...@v09/41300405.......make any sense of anything anymore."'
