29149: 'Gaap@r@v32/43700215.".........I''ll admit it.@k@v32/43700216. Your attitude at least is mature.@k@v32/43700217. But that''s no good if it doesn''t come along with power."'
29150: 'Gaap@r@v32/43700218."......Did you know?@k @v32/43700219.They say you need three kinds of power to rule this world.@k@v32/43700220. The first is influence.@k@v32/43700221. The second is wealth.@k@v32/43700222. Do you know what the last one is?"'
