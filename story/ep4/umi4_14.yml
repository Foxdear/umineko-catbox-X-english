28200: '@rThe clinic that Nanjo had opened and later passed on to his son still existed on Niijima.'
28201: '@rThe aged doctor was Nanjo''s son, but the atmosphere about him was very different.'
28202: 'Masayuki@r@v25/43900001."I am truly sorry to say this after you have come all this way, but I have nothing in particular to tell you."'
28203: '@rNanjo''s son spoke very indifferently.'
28204: 'Masayuki@r@v25/43900002."......After the accident on that island was taken up by the talk shows in a most indiscreet manner,@k@v25/43900003. there was a great deal of deeply offensive probing into my father, who was Mr. Ushiromiya''s doctor and friend."'
28205: 'Masayuki@r@v25/43900004."All of it was without proof, and also, defiled all of my father''s previous achievements.@k@v25/43900005. I still feel a great deal of resentment towards all of that."'
28206: 'Ange@r@v11/42001344."............I think that''s understandable.@k@v11/42001345. It''s been pretty much the same for me.@k@v11/42001346. Constantly since I was six."'
28207: 'Masayuki@r@v25/43900006."True.@k@v25/43900007. My apologies."'
28208: '@rThe doctor finally remembered that Ange was also a victim, exposed to the same curious eyes as he had been.'
28209: 'Masayuki@r@v25/43900008."In that case, you can probably understand why I want nothing more to do with that incident.@k@v25/43900009. ......That was an unfortunate accident.@k@v25/43900010. The only ones who want to make a fuss about it being a crime are the irresponsible TV shows and magazines.@k@v25/43900011. I am more than fed up with their attitude."'
28210: '@r.........Nanjo had been placed in the spotlight for being one of Ushiromiya Kinzo''s few friends.'
28211: '@rBecause of that, there had probably been a persistent offensive from the Witch Hunters and the press to use the late Nanjo''s son as well as a source of information.'
28212: '@r......The doctor went on and on, criticizing the press indignantly.'
28213: 'Ange@r@v11/42001347."I really understand how you feel.@k@v11/42001348. My personal life was put under surveillance,@k@v11/42001349. and I had no privacy, no portrait rights, heck, I don''t know if I was even afforded human rights.@k@v11/42001350. So I deeply empathize with your pent-up anger."'
28214: 'Ange@r@v11/42001351.".........And for that very reason, I want to know, more than anything else, what in the world was that incident that so thoroughly ruined my life.@k@v11/42001352. That''s why I came here."'
28215: 'Ange@r@v11/42001353.".........I''m a related party just like you.@k@v11/42001354. Not a magazine columnist or an interviewer.@k@v11/42001355. Please, don''t get the wrong idea."'
28216: 'Ange@r@v11/42001356."I didn''t come to do this for fun.@k@v11/42001357. ......And I''d very much appreciate it if you stopped looking down on me.@k@v11/42001358. If we''re going to do a comparison of whose life was most screwed up by that incident, you won''t even come close."'
28217: 'Masayuki@r@v25/43900012."............mgh......"'
28218: '@rAnge spoke sharply.'
28219: '@rNever having imagined that he would be talked back to in such a forceful manner, the doctor couldn''t help but fall silent.'
28220: '@r......From Ange''s perspective, the doctor was whining about absolutely nothing.'
28221: '@rShe really wanted him to pack in his patronizing attitude.@k It was about time to make him understand how many days had passed for her before arriving on this island.'
28222: '@rThe doctor realized that he had misspoken, and remained silent for a while, looking uncomfortable.'
28223: 'Ange@r@v11/42001359."I know it''s probably painful to remember what happened at the time, but if there''s anything you do know, please tell me, no matter what it is.@k@v11/42001360. Of course, I''ll tell no one."'
28224: 'Ange@r@v11/42001361."I visited here today to bring some closure to my life.@k@v11/42001362. ......I''m eighteen.@k@v11/42001363. That incident took away twelve years of my life.@k@v11/42001364. And it''ll probably keep on taking."'
28225: 'Ange@r@v11/42001365."......I was thrown into darkness when I was six years old and I''ve never gotten out.@k@v11/42001366. Are you still going to tell me I have no right to know...?"'
28226: 'Masayuki@r@v25/43900013.".........No, ...I''m sorry.@k@v25/43900014. It seems that since all the others who came were ill-natured folk, I instinctively put up my guard.@k@v25/43900015. I apologize for my rudeness."'
28227: 'Masayuki@r@v25/43900016."......Alright.@k@v25/43900017. If you''ll swear not to breathe a word of this to anyone, I''ll tell you everything."'
28228: 'Ange@r@v11/42001367."Thank you, Doctor.@k@v11/42001368. ......Then, if you would.@k@v11/42001369. Please tell me anything you can."'
28229: 'Masayuki@r@v25/43900018."......As you know, my father was not only Mr. Ushiromiya''s personal physician, but his friend through the game of chess.@k@v25/43900019. That relationship was very long, stretching back to the time Mr. Ushiromiya moved to Rokkenjima."'
28230: 'Ange@r@v11/42001370."Just how close were they?"'
28231: 'Masayuki@r@v25/43900020."Considerably, it seems.@k@v25/43900021. It seems that their connection through chess led my father to stay at Mr. Ushiromiya''s mansion quite often."'
28232: 'Masayuki@r@v25/43900022."......I am not sure it is right of me to say this, but Mr. Ushiromiya was extremely moody.@k@v25/43900023. And my father was an exceedingly magnanimous man, who excelled at interacting with people like him.@k@v25/43900024. It''s not hard to imagine that he was a rare friend for the isolated Mr. Ushiromiya."'
28233: 'Ange@r@v11/42001371."That day was the day of the family conference.@k@v11/42001372. ......The Ushiromiya family conferences are said to have involved harsh questioning from Ushiromiya Kinzo over how his fortune would be put to use,@k@v11/42001373. almost like a financial conference.@k@v11/42001374. So Doctor Nanjo had gained a trust so great that he was asked to attend even that...?"'
28234: 'Masayuki@r@v25/43900025."My father was a simple doctor,@k@v25/43900026. so I cannot imagine that he was in a position to advise on asset management for a millionaire family like the Ushiromiyas."'
28235: 'Masayuki@r@v25/43900027."He was most likely called there to assist, because Mr. Ushiromiya''s health was not at its best at the time.@k@v25/43900028. ......As Mr. Ushiromiya''s close friend, I''m sure that my father would have kept his mouth shut, and been trusted not to leak the secrets of the family conference."'
28236: 'Ange@r@v11/42001375."......Was Ushiromiya Kinzo in very bad health at the time?@k @v11/42001376.Are there any medical charts left?"'
28237: 'Masayuki@r@v25/43900029."My father probably took the medical charts with him on the day of the accident.@k@v25/43900030. I''m afraid to say that the entire folder of Mr. Ushiromiya''s medical charts has been lost.@k@v25/43900031. He was my father''s patient, so I don''t know the details either."'
28238: 'Ange@r@v11/42001377."Around the time of the incident.@k@v11/42001378. Was there anything you thought was strange?"'
28239: 'Masayuki@r@v25/43900032.".....................@k@v25/43900033. ......Well, there was...@k@v25/43900034. ......However, it seems exceedingly likely to result in a misunderstanding, so I don''t particularly want to talk about it."'
28240: 'Ange@r@v11/42001379."......What is it?@k @v11/42001380.Please tell me."'
28241: '@rFor a while, the doctor beat around the bush,@k but after he''d said that much, Ange would not allow the subject to be dodged.'
28242: '@rEventually, he was worn down, and after making Ange swear herself to secrecy again, he opened up......'
28243: 'Masayuki@r@v25/43900035."The truth is, several days after that accident, I received something by mail at my home."'
28244: 'Ange@r@v11/42001381.".........Mail?"'
28245: 'Masayuki@r@v25/43900036."It was very curious.@k@v25/43900037. The sender was made out to be me, but I had no memory of it.@k@v25/43900038. Someone had sent it in my name."'
28246: 'Masayuki@r@v25/43900039."The destination was Rebun Island in Hokkaido.@k@v25/43900040. ......It''s at the northernmost tip of Japan, excluding the Northern Territories.@k@v25/43900041. The recipient''s address was on Rebun Island, but.........@k@|@y@v25/43900042.the name was my father''s."'
28247: 'Masayuki@r@v25/43900043."......However, it seems there was a problem with the destination address, so it had received an "Address Unknown" label,@k@v25/43900044. and been returned to the sender, "me"."'
28248: '@rIt was...truly a strange tale.'
28249: '@rNanjo''s son''s name was written as the sender.@k@r......However, he said that he hadn''t mailed the letter.'
28250: '@rIn short, that meant someone had sent it using his name.'
28251: '@rThe destination was "Nanjo Terumasa", on Hokkaido''s Rebun Island.'
28252: '@rBut the lot number written on it didn''t exist,@k so the local post office had been unable to deliver it, and instead sent it back to "the sender, Nanjo''s son"......'
28253: 'Ange@r@v11/42001382."......What was inside?"'
28254: 'Masayuki@r@v25/43900045."...........................@k@v25/43900046. ......I truly ask that you keep silent about this.@k@v25/43900047. I am by no means pleased to have received this.@k@v25/43900048. Even so, I can hardly throw it away......"'
28255: '@rThe doctor stood up and headed for the bookshelf.'
28256: '@rThere, dozens of dictionaries that could only have been ornamental were lined up one after another,@k asserting in the strongest way imaginable that the owner was an intellectual.'
28257: '@rWhen he pulled several volumes out from there, a large, brown envelope was hidden behind them.'
28258: '@rHe took it out and tossed it onto the desk.'
28259: '@rIt had been been carefully sealed with adhesive tape,@k and its faded color and dryness told that it had remained sealed for twelve whole years......'
28260: 'Masayuki@r@v25/43900049."Most sincerely, .........I ask for your silence."'
28261: '@rWhile emphasizing it so much it was annoying, the doctor removed the seal with a quality paper knife.'
28262: '@r......Then, when he tilted the envelope, an already opened mail envelope spilled out.'
28263: '@rThe envelope had weight to it, hinting that there was something other than a letter inside.'
28264: '@r.........The recipient...was certainly Nanjo Terumasa.@k@rEven seeing that......was a huge shock.'
28265: '@rAfter that incident, Nanjo''s corpse had not been found, and he was being treated as dead in absentia under extraordinary circumstances.'
28266: '@r......And despite that, this letter addressed to a Nanjo in Hokkaido existed.@k@rOne could almost take this as a sign that he had faked his own death and escaped to Hokkaido.'
28267: 'Ange@r@v11/42001383."......Was Doctor Nanjo really in Hokkaido?@k @v11/42001384.Or was there another person there with the same first and last names?"'
28268: 'Masayuki@r@v25/43900050."If my father had somehow escaped from the accident and was living on in Hokkaido,@k@v25/43900051. that would have made our family very happy, regardless of the situation."'
28269: 'Masayuki@r@v25/43900052."I also thought of that possibility at first.@k@v25/43900053. ......However, the destination address of this envelope does not exist.@k@v25/43900054. In short, this envelope was mail that had no way of reaching him."'
28270: 'Ange@r@v11/42001385."............Is there a possibility that the sender miswrote the correct address?"'
28271: 'Masayuki@r@v25/43900055."Of course, I cannot disprove that.@k@v25/43900056. However, judging from the residence''s house number, I find that hard to believe."'
28272: 'Ange@r@v11/42001386.".........@v11/42001387.Hokkaido,@v11/42001388. Rebun Island,@v11/42001389. Rebun County,@v11/42001390. Rebun City,@v11/42001391. 1-2-34-567.@k@v11/42001392. ....................."'
28273: '@rUp until Rebun City, it''s alright.'
28274: '@r...But I just couldn''t wipe away the feeling that following sequential number, 1234567, was a little insincere.'
28275: '@rIt felt like a fake address that some kid had made up.'
28276: 'Masayuki@r@v25/43900057."They probably just randomly wrote some clearly nonexistent address.@k@v25/43900058. I think it''s natural to assume that, from the very beginning, this envelope was sent to a nonexistent address to which it had no chance of being delivered."'
28277: '@rIf the destination address doesn''t exist, mail is generally returned to the sender.'
28278: '@rBut even in the case of a faulty address, the local post office will often courteously,@k and to the best of its ability, research to find whether the sender''s intended destination exists.'
28279: '@rWhen they still can''t find it, the mail is sometimes returned after an investigation of several days.'
28280: '@rIt seemed that this was what had happened with this envelope, and the stamp was postmarked October 3rd.'
28281: '@rIt was postmarked on Niijima.@k@rNiijima is a long way away from Rebun Island.'
28282: '@rOn top of that, the destination was also nonsensical.@k@r......It had taken more than a week for the mail to be returned.'
28283: '@r......In other words, there was an extremely high chance that having this envelope returned to the sender after an indeterminate amount of time...@khad been the goal from the very beginning.'
28284: '@rWhy do something like that.........?'
28285: '@rEven before asking what it was that had been sent, this envelope was already veiled in mystery......'
28286: 'Ange@r@v11/42001393."..................And inside it?"'
28287: 'Masayuki@r@v25/43900059."Go ahead."'
28288: '@rAfter getting the doctor''s permission, I tilted the already opened envelope.'
28289: '@rFrom the inside came a small, folded letter, and a small key with a number tag attached.@k A swipe card slid out in addition.'
28290: '@rA112 was engraved on the key''s number tag.@k@r......I didn''t know what it meant.'
28291: '@rThe swipe card was pitch black and had gold letters engraved on it.'
28292: '@r"MEMBERS" was written there in English.@k The jet-black, gold-lettered card design made it feel like something very high-class.'
28293: '@r......But of course, I didn''t have a clue what kind of card it was just from that.'
28294: '@r......I unfolded the letter.@k@rIts contents were extremely brief, and only the following was written:'
28295: '@r07151129.'
28296: '@rAnd the name of a certain massive bank known throughout Japan, as well as the words "Central Branch".'
28297: '@r......That was all.'
28298: 'Ange@r@v11/42001394."What''s this.........?"'
28299: 'Masayuki@r@v25/43900060."...............@k@v25/43900061. .........It''s a card, a key, and a PIN for a safe-deposit box.@k@v25/43900062. And it wasn''t a normal safe-deposit box either.@k@v25/43900063. It was an unsettling one, which was apparently reserved only for special clients."'
28300: '@rAfter he had finished putting his affairs in order following his father''s funeral, he visited the bank.'
28301: '@r......PIN and key and card.@k There was no doubt that something of great importance was stored there,@k and it was natural that he was curious about what that could be.'
28302: '@rAt first, he didn''t know what to do.@k@r......The card wasn''t properly his possession.'
28303: '@rWhen he mustered up his courage and showed the card to a bank clerk, he was then switched to a clerk of clearly high status, and was guided to a large vault on the fourth basement floor.'
28304: '@rThe security on the way there was strict.'
28305: '@rThe doctor had himself stored valuable items such as real estate transcripts in safe-deposit boxes before,@k but this was something on a whole different level......'
28306: 'Masayuki@r@v25/43900064."......Unlike the procedure at the deposit box I use,@k@v25/43900065. their system didn''t carry out any identity checks so long as you had a card, a PIN, and a key."'
28307: 'Masayuki@r@v25/43900066."......But, in any case, it was a very secure vault, and I was frightened by how imposing it was.@k@v25/43900067. ......I wondered what kind of shady objects might await me that had to be stored in a place like this."'
28308: 'Ange@r@v11/42001395."............And so?"'
28309: 'Masayuki@r@v25/43900068."When I passed the card through the reader, I was asked to input the PIN.@k@v25/43900069. And after that eight digit number was input and authenticated, I was permitted access to the vault."'
28310: 'Masayuki@r@v25/43900070."......It was an incredible scene.@k@v25/43900071. A world like something from a sci-fi movie.@k@v25/43900072. That massive, dimly lit silver room was covered with doors to safes."'
28311: '@rHe entered that room along with the clerk.'
28312: '@rAs soon as the card was read, the vaults he had a right to were apparently determined,@k so that safes he could open were lit with a green light, while those he couldn''t open were lit with a red one.'
28313: 'Masayuki@r@v25/43900073."A112 indicated one of those safes.@k@v25/43900074. ......By the way, there was a long line of other safes marked with a green lamp besides that one.@k@v25/43900075. I think there were at least twenty."'
28314: 'Masayuki@r@v25/43900076."There might even have been more in other corners of the room.@k@v25/43900077. ......In any event, I only had the key to A112.@k@v25/43900078. I had no way of checking the contents of the other safes."'
28315: '@rAs the clerk watched, the doctor unlocked and opened the safe.'
28316: '@rWhen he did, a safe drawer like a large cabinet opened,@k ......and an expensive-looking duralumin case showed itself...'
28317: '@rThat was carried into a separate room, where for the first time, the clerk left, and he was introduced to the contents......'
28318: 'Ange@r@v11/42001396."And the contents were.........?"'
28319: 'Masayuki@r@v25/43900079."........................@k@|@y@v25/43900080. ............Cash."'
28320: 'Ange@r@v11/42001397."Cash?@k @v11/42001398.How much?"'
28321: 'Masayuki@r@v25/43900081."I have heard that a pack of one million yen in fresh banknotes is precisely one centimeter thick.@k@v25/43900082. Since those were.........packed tightly into a duralumin case of such a size..."'
28322: 'Masayuki@r@v25/43900083."......There was probably a hundred million total.@k@v25/43900084. I don''t know, because I didn''t count.@k@v25/43900085. I didn''t even touch it with my hands.@k@v25/43900086. I realized at once.@k@v25/43900087. This was dangerous money."'
28323: '@rIt isn''t normal to store a whole hundred million yen in cash in a safe like that, case and all.'
28324: '@r......It''s much easier to deal with if you deposit it into a bank account and turn it into a number.'
28325: '@rThe very fact that they were unable to do that made it clear that there was something wrong with that cash......'
28326: 'Masayuki@r@v25/43900088."......My mind went blank, and I instantly realized that I must not get involved."'
28327: 'Ange@r@v11/42001399."And you didn''t use it at all?"'
28328: 'Masayuki@r@v25/43900089."Yes.@k@v25/43900090. I locked it straight back up, returned it to the original safe, and left.@k@v25/43900091. ......I have thought about throwing away that key and card, but I have no idea what might happen.@k@v25/43900092. For that reason, I''ve been hiding it in the back of the bookcase, a secret from everyone, for a full twelve years.@k@v25/43900093. .........I still don''t know what kind of money that was."'
28329: 'Ange@r@v11/42001400."......Could I borrow this envelope?"'
28330: 'Masayuki@r@v25/43900094."No.@k@v25/43900095. Please just view it here."'
28331: 'Ange@r@v11/42001401.".....................@k@v11/42001402. ......Alright.@k@v11/42001403. Then if I may.@k@v11/42001404. There''s something I want to investigate."'
28332: '@rI took Onee-chan''s grimoire from the knapsack I had set down.'
28333: '@r......Then I opened to the page with the paragraph BEATRICE had written to Onee-chan, and compared the handwriting on both......'
28334: 'Ange@r@v11/42001405."..................................................."'
28335: '@r............The characteristic handwriting was unmistakable.@k@|@y The one who had sent this hundred million yen in cash............was BEATRICE herself......'
28336: '@rBut, .........what is it...@k Something''s bugging me......@k@rWhat is it.........@k What is it.........'
28337: '@r@v26/44000001.".........Y-......yeah.@k@v26/44000002. I''m pretty sure I got something like that in the mail.@k@v26/44000003. Hey Ma, where''d I put that again?!"'
28338: '@rThe same envelope and contents had been sent to Kumasawa''s son, who had once lived with her.@|@y'
28339: '@rBut he had been very busy in the days since, and seemed to have forgotten about it among the hustle and bustle of everyday life.'
28340: '@rBut apparently, its strange contents had stayed in his memory, and he remembered as soon as Ange told him......'
28341: '@rAfter a bit of a wait,@k his thin-lipped wife came with the envelope, complaining that he always forgets where he puts things......'
28342: '@rThe modus operandi for the sender and recipient was exactly the same as for Nanjo''s son.@k@rThe sender was made out to be Kumasawa''s son, and the recipient was Kumasawa Chiyo.'
28343: '@rAnd the destination address was in the Okinawa Prefecture.@k@rOkinawa Prefecture, Yaeyama County, Yonaguni City, 1-2-341-5167.'
28344: '@rYonaguni Island is at the westernmost tip of Japan.@k@rAnd the lot number was exactly like before: a sequential number that had apparently been chosen at random.'
28345: '@r......Now it was certain.@k This envelope was definitely sent with the goal of having it be returned to the sender.'
28346: '@rIts contents were exactly the same.'
28347: '@rA letter with the PIN and the bank''s central branch written on it.@k@rA swipe card.@k A key with attached number tag.'
28348: '@rThe inscription on the number tag was A113.@k@r......The number right after the one on the key that had been sent to Nanjo''s son.'
28349: '@rMost likely, inside the vault was the same kind of duralumin case, packed with a hundred million yen in cash......'
28350: 'Sabakichi@r@v26/44000004."......Got the feeling my mom had sent it to me from beyond the grave.@k@v26/44000005. Don''t really get what''s inside, and it''s creepy, so I just left it alone all this time, and totally forgot about it until today."'
28351: 'Sabakichi@r@v26/44000006."......So, you know what this is, girl?@k @|@y@v26/44000007.Could it be that the same thing came to your place...?"'
28352: 'Ange@r@v11/42001406.".......................................ah."'
28353: 'Mammon@r@v42/42700323."......What is it, Ange-sama?"'
28354: 'Sakutarou@r@v33/44200477.''Uryu...headache? Headache...?!'''
28355: 'Ange@r@v11/42001407."............Sorry, my head hurts......@k@|@y@v11/42001408. ......Stabbing pain... .........I know this......"'
28356: 'Sakutarou@r@v33/44200478.''What do you mean, you know this......?'''
28357: 'Mammon@r@v42/42700324."You don''t mean,@v42/42700325. ......this envelope......came to your place too, Ange-sama...?"'
28358: '@r.........I remember......@k@|@y ......I remember......!!'
28359: '@rA strange envelope was also sent to me...twelve years ago...!!'
28360: '@rI had fallen into depression after losing my entire family.@k ...But it was a really strange thing to come in the mail, so a faint memory of it remained.'
28361: '@rIt was a strange letter, which I had no memory of sending, but which had me as the sender.'
28362: '@rI forget the destination address, but the person it had been sent to was Ushiromiya Rudolf.@k@rMy father.'
28363: '@rI remember that I got this letter I thought was from my father who had died, I opened it up,@k and I found a key and a card that I didn''t really understand... I remember being really confused.'
28364: '@rI felt let down, and threw it away somewhere, I think...'
28365: '@rWhere did I put that envelope?@k@rI probably lost it somewhere in the chaos that followed.'
28366: '@rBy now, I have no way of checking its contents.'
28367: '@rBut somehow I think I can guess.'
28368: '@r......I''m sure the contents were the same.@k Without a doubt, there must have been a key, a card, and a note with a PIN inside the envelope......'
28369: 'Ange@r@v11/42001409."......BEATRICE......@k@v11/42001410. ......What was she trying to do here...?@k @v11/42001411.So did she hand out this stupid money to all surviving relatives?@k @v11/42001412..........I won''t forgive her......for mocking them even after their deaths........."'
28370: 'Sakutarou@r@v33/44200479.''Uryu...uryu......Ange.........'''
28371: '@rSakutarou acted nervously.@k ......As I looked at his worrying face, my agitation began to cool off bit by bit...'
28372: 'Ange@r@v11/42001413."I''m sorry...@k@v11/42001414. My hatred of BEATRICE isn''t anything new.@k@v11/42001415. ......I''m just surprised and angry to find out that I had a connection with the witch already on that day, at the age of six..."'
28373: 'Mammon@r@v42/42700326.".........For the past twelve years,@k@v42/42700327. you have been enslaved by BEATRICE-sama''s curse.@k@v42/42700328. ...This might be proof that this really was a curse.@k@|@y@v42/42700329. But please, don''t fall apart.@k@v42/42700330. Part of this journey should be to break through that."'
28374: 'Ange@r@v11/42001416."That''s right......@k@v11/42001417. Just letting the blood rise to my head won''t get me anywhere.@k@v11/42001418. Got to think calmly.@k@v11/42001419. .........What''s going on?@k @v11/42001420.What''s the meaning of handing out a hundred million yen to each of the relatives?@k @v11/42001421.Was she trying to provoke us......?@k @v11/42001422.Damn that BEATRICE........."'
28375: 'Sakutarou@r@v33/44200480.''Ange......calm down......@k@v33/44200481. ......Uryu......'''
28376: '@rAs Sakutaro buried his head in my stomach, he urged me to stay calm.'
28377: '@r......I took another deep breath, and started thinking.'
28378: 'Ange@r@v11/42001423.".........I wonder if the sending of these envelopes was to demonstrate that this was a premeditated crime by BEATRICE."'
28379: 'Mammon@r@v42/42700331."They were postmarked right before the family conference.@k@v42/42700332. And they were intentionally set up so that they would be sent back after some time."'
28380: 'Sakutarou@r@v33/44200482.''......They wanted them to arrive after the incident, is that it......?'''
28381: 'Ange@r@v11/42001424."Yeah.@k@v11/42001425. That''s what it implies.@k@|@y@v11/42001426. .........But it still leaves me wondering a little.@k@v11/42001427. Why such an uncertain method?"'
28382: 'Mammon@r@v42/42700333."Uncertain?"'
28383: 'Ange@r@v11/42001428."Yes.@k@v11/42001429. After all, you can''t even guess in advance at how many days it would take for the mail to return.@k@v11/42001430. ......Normally, you can''t even guess at the amount of time it will take for the receiving post office to do the research, make a determination of unknown recipient, and send it back."'
28384: 'Sakutarou@r@v33/44200483.''Yeah, now that you mention it......@k@v33/44200484. It''d be more certain if they just set an arrival date and mailed it that way......@k@v33/44200485. Uryu...'''
28385: 'Mammon@r@v42/42700334."......Maybe, but still,@k@v42/42700335. if they mailed it the day before, then no matter how quickly it returned, it would probably have arrived no earlier than Monday.@k@v42/42700336. I wonder if they wanted to make it seem like a letter from the dead."'
28386: 'Ange@r@v11/42001431."......A letter from the dead, you say."'
28387: 'Ange@r@v11/42001432."......You''re right.@k@v11/42001433. That surprises you, and makes you feel horrible.@k@v11/42001434. ......Some mail with your dead family''s names written on the outside in large letters...@k@v11/42001435.gets thrown into your mailbox with an ominous label attached."'
28388: 'Ange@r@v11/42001436."......However, it doesn''t really make sense to me.@k@v11/42001437. I would have mailed it to arrive on a specified day.@k@v11/42001438. I just can''t understand why someone would allow the insecurity of it possibly arriving on a day they weren''t anticipating."'
28389: 'Sakutarou@r@v33/44200486.''.....................Uryu.@k@v33/44200487. ......But that really does sound like Beato to me.'''
28390: 'Ange@r@v11/42001439."Huh?@k @v11/42001440.You...know about Beato?"'
28391: 'Sakutarou@r@v33/44200488.''......Well, I only talked with her a little.@k@v33/44200489. ......But somehow I can tell that Beato would do something like this.'''
28392: 'Sakutarou@r@v33/44200490.''.........Can''t you imagine that too, Mammon?@k @v33/44200491.Beato likes pranks like this, right?'''
28393: 'Mammon@r@v42/42700337."..................@k@|@y@v42/42700338. .........Yeah, that might be true.@k@v42/42700339. ......I wouldn''t put it past BEATRICE-sama to try a vicious prank like a letter from the dead."'
28394: 'Sakutarou@r@v33/44200492.''No, not just that part.@k@v33/44200493. .........BEATRICE would find it more fun to do it in a way that was a little bit uncertain, instead of one that was absolutely certain.'''
28395: 'Ange@r@v11/42001441.".........She would find an uncertain method...more fun...?"'
28396: '@rI remembered Maria onee-chan''s diary...@k@r......It had quite a lot of descriptions of playing with BEATRICE.'
28397: '@rOccasionally, some of these involved Beato playing pranks on the adult relatives with Maria.'
28398: '@rBut those pranks always followed a certain little aesthetic principle of witches.'
28399: '@rWhich was.........that things are more fun if they are uncertain.'
28400: '@rOne day, Maria onee-chan had brought a wind-up minicar, and she and Beato decided to use it for a prank.'
28401: '@rIt was a popular toy at the time - if you made the minicar back up, it would wind up the spring in the tires, and when you let go, it would race forwards.'
28402: '@rThey had wound up that minicar and set it in the shadow of a milk jug.'
28403: '@r......In other words, the prank was that, if you lifted the milk jug, the minicar would jump forwards and surprise whoever did it.'
28404: '@rHoping that someone would get caught in this prank, Onee-chan and Beato had watched the adults from the shadows for their whole teatime.'
28405: '@rThey were looking forward to seeing who would get caught by it, but ultimately, no one moved the trap milk jug, and the trap never went off......'
28406: '@rWhen Onee-chan had then muttered "We should have put it somewhere where they''d definitely get caught by it",@k Beato apparently said this.'
28407: '@rShe said,@k "Traps where you don''t know who will get caught, or even whether anyone will get caught at all, are more thrilling and fun".'
28408: '@r......It''s probably true that you wouldn''t get that kind of excitement from a trap that would definitely catch someone.'
28409: '@r......This kind of description occurred in multiple places,@k making it possible to guess that the witch called BEATRICE had quite a fickle character and loved a random thrill......'
28410: '@rA fickle person is very hard to deal with.@k I can''t flip over the chessboard......to find out what that witch from twelve years ago was planning.'
28411: '@rAs Ange thought these things over, her gaze wandered from place to place.'
28412: '@rThen, she suddenly showed interest in the wall.@k@rThere, a number of framed photographs were hung.'
28413: '@rMany were commemorative photos from when the Kumasawas got together as a family or went somewhere to play, and Kumasawa herself was in many of them.'
28414: '@r...Still with a smile that made it so you could almost hear her lighthearted hoh-hoh-ho laugh.'
28415: '@r......It''s a distant memory, but I do remember that she was definitely this sort of cheerful old lady...'
28416: 'Ange@r@v11/42001442."Did you notice anything different about Kumasawa-san in the days leading up to the incident...?"'
28417: 'Sabakichi@r@v26/44000008."Nope.@k@v26/44000009. She looked the same as ever.@k@v26/44000010. .....Grumbling about how tough the family conference was and how it put her on edge, same as always."'
28418: 'Ange@r@v11/42001443."............?@k @v11/42001444.......What''s this?"'
28419: '@rAmong the numerous frames, there was one that had something other than a picture of people in it.'
28420: '@rIt was a photograph of an enlarged relief of a door from a Western-style house or something.'
28421: '@r......I couldn''t see any interesting subject in particular, which actually bugged me a bit as I wondered why anyone had gone to all the trouble of taking it.'
28422: '@rAs I got closer, I realized that some text had been written in pen.'
28423: 'Sabakichi@r@v26/44000011."......Oh yeah, that''s a photo I got when Mom''s belongings were distributed.@k@v26/44000012. I think it probably has something to do with that "Legend of the Gold" thing."'
28424: 'Ange@r@v11/42001445."The witch''s epitaph, you mean?@k @v11/42001446.Rumored to point to the location of the hidden ten tons of gold...@k@v11/42001447. ......So Kumasawa-san tried to solve it too, I see.@k@v11/42001448. But this isn''t the epitaph.@k@v11/42001449. ......It''s the first time I''ve seen it."'
28425: '@rThere was an arch above the Western-style door, and that arch had a relief.@k It was an inscription in English, and that seemed to be the focus of the photograph.'
28426: '@rThe pen writing appeared to be a translation into Japanese.'
28427: 'Ange@r@v11/42001450.".....................@k@v11/42001451. "This door will only open with a probability of 1/1,000,000,000,000,000.@k@v11/42001452. You will only be blessed with a probability of 1/1,000,000,000,000,000."@k@v11/42001453. .........I don''t know it.@k@v11/42001454. Nothing like this ever showed up in the epitaph or Onee-chan''s diary."'
28428: 'Sabakichi@r@v26/44000013."In Mom''s belongings, there were quite a few photos and notebooks that looked like they were from her trying to solve the epitaph''s riddle."'
28429: 'Sabakichi@r@v26/44000014."Turns out she was actually surprisingly fond of that kind of thing.@k@v26/44000015. And there was that rumor that ten tons of gold bars were hidden somewhere.@k@v26/44000016. No wonder she was so besotted by it."'
28430: '@rIn both Maria onee-chan''s diary and in her grimoire, there was a description of the witch''s epitaph.'
28431: '@rIt mentioned about how it was a ritual to open the door to the Golden Land, and BEATRICE''s resurrection ritual, and BEATRICE''s succession ceremony.@k And so on.'
28432: '@rMaybe the most interesting one was the last line, the succession ceremony.'
28433: '@rAccording to BEATRICE,@k if you were able to solve the witch''s epitaph,@k you would receive not only the ten tons of gold and the Ushiromiya family inheritance,@k but her own magical power and name, as well as the title of Golden Witch.'
28434: '@rAmong the Ushiromiya family at the time, the witch''s epitaph was thought of as a difficult quiz, which the head, Kinzo, had prepared to select his successor.'
28435: '@rBut in the Mariage Sorciere interpretation, the questioner was BEATRICE herself,@k and she had posed the question in part to choose her successor.'
28436: '@r......There were slight discrepancies in the details of the two interpretations.'
28437: '@rEither way, its disturbing contents brought to mind a bloody serial murder,@k and both of the message bottles depicted a crime that followed that pattern.'
28438: '@rIf I could solve the witch''s epitaph now, twelve years later, I wonder if I could expose some plot made back then......'
28439: '@rI tried to solve it many times myself, but I never did have a clue what it meant.@k@rIt seems that many Witch Hunters have been trying as well.'
28440: '@rI also found theories like the La Plata theory and the Enoura theory in certain books.'
28441: '@rHowever, none of these theories were conclusive......'
28442: 'Ange@r@v11/42001455."Are there any other materials?"'
28443: 'Sabakichi@r@v26/44000017."I think so, but they were all split up between my siblings.@k@v26/44000018. I don''t have a clue who has what.@k@v26/44000019. Sorry."'
28444: 'Ange@r@v11/42001456.".........Just reading this English text that Kumasawa-san took a picture of, it gives the impression that this was a forbidden door that was rarely opened."'
28445: 'Ange@r@v11/42001457."......But where in the mansion is it, I wonder.@k@v11/42001458. Judging by the lighting, it looks like it''s outside.@k@v11/42001459. ......I wonder if Kumasawa-san suspected that the gold was hidden in there."'
28446: 'Sabakichi@r@v26/44000020."Who knows.@k@v26/44000021. In any case, it''s probably somewhere in the Rokkenjima mansion.@k@v26/44000022. ......It''s a pity, but there wasn''t the kind of money in Mom''s bank account to make me think she found the gold.@k@v26/44000023. Uhahahaha, she probably didn''t find it after all."'
28447: '@r......The Golden Witch, BEATRICE, gave ten tons of gold to Kinzo.'
28448: '@rWhich meant that the witch was the true owner of the gold.'
28449: '@rBEATRICE was the owner of all the vast fortune of the Ushiromiya family.'
28450: '@rThe witch holding this vast wealth had massacred the humans on Rokkenjima on that day,@k ...and sent large amounts of money to the surviving relatives like it was a game.'
28451: '@r......Like hell it''s a letter from the dead.@k This is desecration of the dead.'
28452: '@rI was once again convinced.@k ......My family, who died on the island that day, didn''t die and go to heaven.'
28453: '@rThey''re being trapped by the witch even now, and are being desecrated and tormented for all eternity......'
28454: '@rThe last place Ange visited...@kwas a store in a region where residential and commercial areas intermingled, with a signboard saying "Marufuku Sleep Shop"......'
28455: '@rThere lived the man who had been the captain of the ferryboat to Rokkenjima at the time.'
28456: '@r......Even he, who had once lived as a man of the sea, had retired after contracting a serious illness,@k and was now being taken care of at the house of his son and his son''s wife...'
28457: 'Kawabata@r@v24/43800001."I remember you well...!@k @v24/43800002.You were only about yea high.@k@v24/43800003. Look at you now...!@k @|@y@v24/43800004.You must have been absolutely devastated.@k@v24/43800005. I understand how you feel, believe me...!"'
28458: '@rThe former boat captain was so full of energy that you couldn''t really tell why he had retired in the first place.'
28459: '@rHis memory seemed clear too; he had a good memory of things that had happened more than a decade prior, and it seemed that he could even remember how Ange had been at the time.'
28460: '@rThe lively conversation was very helpful for Ange,@k ......but at the same time, the captain also remembered the final family conference very well,@k and the fact that he had detailed memories of even Battler''s "gonna fall gonna fall uproar" on the boat was instead painful for Ange.'
28461: '@rIt had been so back then as well, but even now, there was no public way to cross to Rokkenjima.'
28462: '@rIt was necessary to make an individual request to an owner of a boat to make the voyage.'
28463: '@rI still hadn''t managed to arrange for a boat to Rokkenjima,@k so if he refused me, the voyage to Rokkenjima would probably become hopeless......'
28464: 'Kawabata@r@v24/43800006."No need to explain.@k@v24/43800007. It''d be no easy job finding a boat willing to go to that island at this point.@k@|@y@v24/43800008. ......Nowadays, some of ''em don''t even call it Rokkenjima any more, they call it by its old name, Akujikijima.@k@v24/43800009. Can''t see you getting any sailor round here to help you out."'
28465: '@rOriginally, Rokkenjima had been feared as an island of disaster by the fishermen.'
28466: '@rAnd when that incident happened twelve years ago, that fear reached its peak......'
28467: '@rThey respected the sea, feared it, and revered it.@k There were almost no sailors who would try to take a boat to the cursed island.'
28468: '@rBecause of that, most of the Witch Hunters were unable to cross over to Rokkenjima,@k and were limited to taking a trip around the island.'
28469: '@r......Ironically, this caused the mystique surrounding Rokkenjima to increase even more,@k and resulted in the proliferation of the bizarre witch stories they loved so much...'
28470: 'Ange@r@v11/42001460.".........Would you take me in your boat?"'
28471: 'Kawabata@r@v24/43800010."Mm.@k@|@y@v24/43800011. They''re sposed to give her back to me just for tomorrow.@k@v24/43800012. I hear the engine''s been acting up lately, though.@k@v24/43800013. We''ll crank it up to full throttle!"'
28472: '@rThe former boat captain promised that tomorrow, he would go back to his previous job and take his boat out to Rokkenjima.'
28473: '@rWith this, I''d managed to secure a method of transport to Rokkenjima.@k@rThis is probably all I can do on Niijima.'
28474: '@rAll that''s left is...tomorrow.@k On Rokkenjima, ......I''ll reach the final destination of a journey that stretches back twelve years.'
28475: 'Sakutarou@r@v33/44200494.''That''s great news...@k@v33/44200495. You''ll be able to go to the island now...'''
28476: 'Ange@r@v11/42001461."Yes.@k@v11/42001462. ......I''d heard that it would be hard to find a boat, so the boat captain''s cooperation really helped me out."'
28477: 'Mammon@r@v42/42700340.".........Although he may not have been as badly affected as you, Ange-sama,@k@v42/42700341. I''m sure that the incident twelve years ago has been a thorn for the boat captain as well, one that he still hasn''t been able to pull out."'
28478: 'Sakutarou@r@v33/44200496.''......Uryu.@k@v33/44200497. ......Even the captain wasn''t able to find closure.@k@v33/44200498. This whole time.'''
28479: 'Mammon@r@v42/42700342."Well, yeah.@k@v42/42700343. ......If that guy had taken his boat out on October 5th as promised, there''s a chance that he could''ve saved a great many people.@k@v42/42700344. If he hadn''t been hesitant with his boat just because of a little wind..."'
28480: 'Sakutarou@r@v33/44200499.''Uryu... You shouldn''t say things like that...@k@v33/44200500. I''m sure that''s pained the captain constantly until today......'''
28481: '@rI heard that it had truly been right in the middle of a typhoon on October 5th.'
28482: '@rAccording to the boat captain, he had known for certain that they would be trapped by the typhoon if they headed to Rokkenjima on October 4th.'
28483: '@rBut the family had been very insistent upon that date, which had been determined beforehand as the date of the conference.'
28484: '@r......It was only natural.@k All of the adults had their own packed schedules, and had come to the family conference having arranged those schedules in advance.'
28485: '@rThey probably had their own circumstances preventing them from easily pushing it back to next week just because the typhoon was approaching.'
28486: '@r......It wasn''t the boat captain''s fault.'
28487: '@rBut perhaps you could say that he didn''t feel so guiltless that he could place the blame wholly on the typhoon.'
28488: '@rCertainly, just as these two said, there''s no doubt that the boat captain has been dragging the events of twelve years ago along with him this whole time.'
28489: '@r......And, by taking me, the last member of the Ushiromiya line, to the island,@k and bringing me back safely, he might be trying to find some resolution for the past...'
28490: 'Kawabata@r@v24/43800014."The boat''s meant to be coming back just after noon.@k@v24/43800015. I''ll take you to Rokkenjima after that, so we should get there before evening.@k@|@y@v24/43800016. It''s an island without electricity or lights.@k@v24/43800017. You won''t be able to stay long.@k@v24/43800018. ......Is a short trip like that gonna satisfy you?"'
28491: 'Ange@r@v11/42001463.".....................@k@|@y@v11/42001464. It''s not the kind of thing where staying longer will satisfy me more.@k@v11/42001465. I''m grateful just to have you take me there."'
28492: 'Kawabata@r@v24/43800019."Mm, don''t mention it.@k@v24/43800020. If I hadn''t parted with my boat, I wouldn''t have to be so stingy, and I''d be able to take you to the island as much as you like..."'
28493: '@rIt''s not like I have a goal of doing something in particular on Rokkenjima.@k@rSo, the time of day I''ll be staying there is evening...'
28494: '@r......The evening, which straddles the two different worlds of day and night, seemed almost like a borderline between this world and the next - @kor possibly, between 1998 and 1986 - and felt like the most fitting time to visit Rokkenjima.'
28495: '@r......It''s not like I''ll be doing anything on the island.@k Staying there for just a few hours will be just fine if I can feel some closure.'
28496: '@rAt that time, there was a small knock on the paper sliding door, and Amakusa stuck his head in, tapping his watch.'
28497: '@rI nodded back and told him I''d gotten hold of a boat for tomorrow.'
28498: 'Amakusa@r@v20/43000087."That''s great.@k@v20/43000088. ......It''s about time for us to go.@k@|@y@v20/43000089. We''ll be counting on you tomorrow, Captain."'
28499: 'Kawabata@r@v24/43800021."You betcha!@k @v24/43800022.I know all about the troubles you''ve had.@k@v24/43800023. I was watching the talk shows at the time, and I was disgusted by all the people stirring up that incident just for fun.@k@v24/43800024. I''ll help you out any way I can."'
28500: 'Ange@r@v11/42001466."Thank you very much.@k@v11/42001467. ......Then we''ll see you noon tomorrow.@k@|@y@v11/42001468. Umm, here.@k@v11/42001469. The fare for the boat."'
28501: '@rAnge took a wrapped wad of ten-thousand yen bills from her pocket.'
28502: '@rThe boat captain must have seen its thickness as well.@k But he paid it absolutely no interest, and shook his head.'
28503: 'Kawabata@r@v24/43800025."......I''m grateful to you.@k@v24/43800026. This is guidance from heaven.@k@v24/43800027. I''m being given a final chance to take you to Rokkenjima and bring you back safely."'
28504: 'Kawabata@r@v24/43800028."Now, I''ll finally be able to finish the final job Kinzo-san entrusted me with.@k@v24/43800029. So I''m grateful to you.@k@v24/43800030. I got more than enough money from Kinzo-san back then.@k@v24/43800031. Can''t take it from you."'
28505: 'Ange@r@v11/42001470.".....................Thank you very much."'
28506: 'Kawabata@r@v24/43800032."Watch your step on the stairs.@k@v24/43800033. They''re a doozy."'
28507: '@r......I went down the steep staircase that was the exact opposite of "accessible".'
28508: '@rIt was getting hard to believe that there had actually been a chest of drawers and a TV in the room upstairs.'
28509: '@rMost of the first floor was a bedding store, with many futons piled up on each other.'
28510: '@rThe captain followed behind us as we weaved our way through the cramped futon shop.'
28511: '@rAfter cautiously checking around outside, Amakusa dashed out first and started up the car.'
28512: 'Kawabata@r@v24/43800034."My grandkid''s room is empty.@k@v24/43800035. I really wouldn''t mind if you stayed there.@k@v24/43800036. As you can tell, I''m up to my eyes in futons."'
28513: 'Ange@r@v11/42001471."Thanks a lot for the offer.@k@|@y@v11/42001472. ......But I can''t cause you trouble if worst comes to worst."'
28514: 'Kawabata@r@v24/43800037.".........Dunno your circumstances, but seems to me like you''re caught up in a lot of trouble.@k@v24/43800038. There''s rumors some shady people are on the lookout for someone.@k@v24/43800039. Wouldn''t happen to be you, would it?"'
28515: 'Ange@r@v11/42001473.".....................@k@v11/42001474. ......How should I know?"'
28516: '@rAnge played dumb, but it looked as though the boat captain had guessed.'
28517: 'Kawabata@r@v24/43800040."My job was to take visitors to Rokkenjima over to the island, ......and bring them back again."'
28518: 'Kawabata@r@v24/43800041."......That job was interrupted twelve years ago, and it still hasn''t been finished.@k@v24/43800042. So, thanks to you, I''m finally gonna be able to finish that job."'
28519: 'Ange@r@v11/42001475."....................."'
28520: 'Kawabata@r@v24/43800043."So what I''m saying is.@k@v24/43800044. .........Please let me finish the job.@k @v24/43800045.Do you understand?"'
28521: 'Ange@r@v11/42001476."..................@k@|@y@v11/42001477. ......Yes.@k@v11/42001478. It''s not like I''m going there to die."'
28522: '@rBut part of me does feel that, if I could die on that island, I would surely be able to go to where my family is......'
28523: '@rI had finally become aware of it.@k ......I might have been planning......to die on that island.'
28524: '@rI might have come all this way, heading for Rokkenjima, in search of a place to die.'
28525: '@rThe boat captain had guessed that as well.@k@rAnd so, for emphasis, he told me again: Don''t.'
28526: 'Ange@r@v11/42001479.".........I won''t.@k@v11/42001480. I promise.@k@|@y@v11/42001481. .........In the first place,@k@v11/42001482. I''m still unclear about why I even have to go to Rokkenjima, what the purpose is at all."'
28527: 'Kawabata@r@v24/43800046."No, I''m sure there''s gotta be one.@k@v24/43800047. If there isn''t one for you, ...then there is one for them.@k@|@y@v24/43800048. The island called you.@k@v24/43800049. That''s why you came here."'
28528: 'Ange@r@v11/42001483.".........You might...be right.@k@v11/42001484. ...I might......have been called."'
28529: '@rI was called.@k For what reason?@k For them.@k@rMom.@k Dad.@k Battler onii-chan.@k@r......And...Maria onee-chan.'
28530: '@r.........Or maybe, the Golden Witch.@k BEATRICE.'
28531: '@rWhat does Rokkenjima have for me?@k@rAnd what will I achieve?'
28532: '@rEven though tomorrow was almost upon me at last, I still wasn''t able to understand my own mission......'
28533: '@rThere was the sound of a car stopping in front of the store, and a short honk could be heard.'
