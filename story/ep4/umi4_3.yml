23402: '@r@v21/44100001."Rumor has it, Ange-chan,@k@v21/44100002. that you jumped off the top of a building?"'
23403: 'Ange@r@v11/42000227."The groupies were getting annoying, so I thought I''d give them the slip."'
23404: '@rAnge and an old gentleman wearing an expensive suit were alone in a massive, modern conference room.'
23405: '@rThe conference room was equipped with all the latest equipment for presentations,@k while keeping intact a refined and composed atmosphere;@k that alone was enough to make abundantly clear the worth of the corporation that was its owner.'
23406: '@rHowever, Ange couldn''t have cared less.'
23407: '@rLooking aloof from the world, she sat slovenly in one of the high-class chairs for executives with salaries probably north of twenty million yen.'
23408: 'Ange@r@v11/42000228."And anyway, I knew they were remodeling on the lower floors and had a safety net, so."'
23409: '@rAnge dismissed it with an offhand comment, but in reality, it had been a miracle among miracles.'
23410: '@rShe had shot through several layers of safety netting for the remodeling project,@k been caught by a multi-colored banner adorning the atrium, slid down and off it,@k ...been softly caught by a final banner, landed on the ground without a scratch,@k and then left that place at a brisk walk... It put Hong Kong movies to shame.'
23411: '@r@v21/44100003."So you knew there was a net—it was still a 200-meter-tall skyscraper, y''know.@k @v21/44100004.If things hadn''t gone according to plan, there''d be a real mess to deal with right now."'
23412: 'Ange@r@v11/42000229."......I figured that if I died, then that would be the end of that, more or less.@k@|@y@v11/42000230. Well, let''s just say, I was testing my luck a bit.@k@v11/42000231. Put it down to the rashness of youth."'
23413: '@rAnge shrugged coldly, as though saying that she''d had enough of that topic.'
23414: '@rAt this, the old gentleman, who was looking at the world below through the window, burst into laughter.'
23415: '@r@v21/44100005."So you were testing your luck...!@k @|@y@v21/44100006.My, my, you truly are Kinzo-san''s grandchild.@k@v21/44100007. The nerve to entrust yourself to chance, to put your life in the hands of the gods and think nothing of it.@k@v21/44100008. ...The Chairman was also a person who could stake her life on a bet like it was nothing—wonder if this is all part of the Ushiromiya blood."'
23416: '@r@v21/44100009."......You really are going to be something big in the future.@k@v21/44100010. Take my advice.@k@v21/44100011. Why not put this running away from home act behind you and return to the Sumadera family?"'
23417: 'Ange@r@v11/42000232."I heard that Mom had a bad relationship with her family.@k@v11/42000233. I don''t want to go to the house of people I first met at a funeral."'
23418: '@rThe @bSumadera.@<須磨寺@> family is my mom''s family.'
23419: '@rIt''s a bit of an old family from Kyoto, and unbelievably strict in a way you could never have imagined from the frank way Mom acted.'
23420: '@rThe only person in the Sumadera family I had been on good terms with was Grandpa, who was living separately under the guise of retirement.'
23421: '@rMom, too, kept up contact only with Grandpa,@k and had nothing to do with the rest of the family at all, nor they with her, to an ugly degree.'
23422: '@rEven for me, Grandpa''s house was the only part of the Sumadera family I ever went to visit.'
23423: '@rBeing young, I hadn''t really understood it at the time,@k but I hear that Grandpa, as a man who married into his wife''s family, was in an extremely weak position, and his relationship with Grandma was also bad.'
23424: '@r...In fact, maybe you could even have said that he was hated by Grandma, and confined to the house.'
23425: '@rIt isn''t hard to imagine that because she had a soft spot for Grandpa alone,@k Mom was probably also hated by the Sumadera family.'
23426: '@rAs her daughter, I was probably also hated quite a bit.'
23427: '@rAnd yet, they had appeared for the first time at my parents'' funeral,@k shamelessly going on about how I''d grown, like they could actually act like family after all this time...'
23428: '@rAfter Aunt Eva died, all the wealth of the Ushiromiya family was inherited by me.'
23429: '@rIf they weren''t after that, there''s no way they''d have been able to say such disgusting words.'
23430: '@r@v21/44100012."......Well, look, you''re all alone now, it''s not like I don''t get why you''d just quit caring."'
23431: 'Ange@r@v11/42000234."It''s not not caring.@k@v11/42000235. Annoying Aunt Eva has kicked the bucket at last, and I''m finally stretching my legs and taking a relaxing stroll, that''s all.@k@v11/42000236. ......Everyone else is just making too big a deal out of it."'
23432: '@rThey''re all just after the vast Ushiromiya wealth I''m shouldered with, anyway.'
23433: '@rThey must think if they become my guardians, they''ll be able to do whatever they please with that wealth.'
23434: '@rJust how many people have tried to act like a substitute parent and get close to me?'
23435: '@r@v21/44100013."Ange-chan, you know, if life''s treating you rough, you can come talk to me anytime if you want some advice.@k @v21/44100014.I think of you as my true grandchild."'
23436: 'Ange@r@v11/42000237."...........................haah.@k@v11/42000238. ...Let''s make that a no-thank-you for now.@k@|@y@v11/42000239. ...More importantly, let''s get back on topic."'
23437: '@r@v21/44100015."Ange-chan.@k@v21/44100016. Ask me as much as you want, but I''m hiding nothing.@k@v21/44100017. The Chairman was the only one to survive Rokkenjima that day.@k@v21/44100018. And she gave up the ghost without saying a thing."'
23438: '@r@v21/44100019."I myself understand nothing.@k@v21/44100020. We''re all in the dark, as they say."'
23439: '@rThe old gentleman was one of a number of corporate heavyweights who, after Eva had passed away, had been entrusted with the business group she had built up.'
23440: '@rThe one he referred to as "the Chairman", technically the former chairwoman, was Ushiromiya Eva.'
23441: '@rHis company had once had a friendly relationship with Hideyoshi''s company,@k and he had been a close friend of both Hideyoshi and Eva.'
23442: '@rFor that reason, after Eva lost Hideyoshi, he had become the only person to whom she could reveal her true thoughts.'
23443: '@rWhen Eva''s heart had been torn by the loss of her family, and she had taken it out on Ange,@k he had also acted as a buffer between the two, so although Ange didn''t trust him, she too found him an easy person to pay a visit...'
23444: '@r@v21/44100021."That crime,@v21/44100022. ...no, accident, I guess.@k@v21/44100023. If I call it a crime, I''ll get in trouble.@k@v21/44100024. ...Sure, I had my questions, just like the rest of the public and the talk shows."'
23445: 'Ange@r@v11/42000240."......At the time of the accident, why was Aunt Eva in a place two kilometers away from the mansion, all alone?@k @v11/42000241.And on the night of a storm."'
23446: '@r@v21/44100025."At the time, Kinzo-san was unsure as to who he would choose to be the next successor.@k@v21/44100026. ......Publicly it was to be the eldest son, Krauss-san, but he wasn''t well trusted by Kinzo-san."'
23447: 'Ange@r@v11/42000242."......So, to fairly determine a successor from among the four siblings, he made this game-like test called the riddle of the epitaph...?"'
23448: '@r@v21/44100027."Only officially speaking.@k@v21/44100028. ......Kinzo-san probably planned to make Eva-san the successor to the head from the beginning."'
23449: '@r@v21/44100029."He wanted to leave the family to Eva-san, who unlike Krauss-san was extremely diligent and brilliant, even at the cost of taking back his own rule that the eldest son would be the successor."'
23450: '@r@v21/44100030."...The new rule about giving the family headship to the one who solved the epitaph...@k@v21/44100031.was probably nothing more than a farce so that he could snatch the position of successor away from Krauss-san."'
23451: 'Ange@r@v11/42000243."What do you mean by...farce?"'
23452: '@r@v21/44100032."There was no need for anyone to solve that epitaph.@k@v21/44100033. Once it had been displayed for an appropriate amount of time, Kinzo-san would just call Eva-san, who he truly wanted to succeed him,@k@v21/44100034. and give her the answer.@k@v21/44100035. In other words, that itself was the proof of the succession to the headship."'
23453: 'Ange@r@v11/42000244."..................There hasn''t been any mention of this on the talk shows, has there?"'
23454: '@r@v21/44100036."Well, that''s because if you start going on about the succession of the head, it''s gonna strengthen the murder theory.@k@v21/44100037. I''m no fool myself.@k@v21/44100038. I''m not gonna go out of my way to say things that could invite misunderstandings."'
23455: '@rThe way he told it went like this:'
23456: '@rAt the time, the head of the Ushiromiya family, Kinzo, diagnosed with little time left to live, was troubled over the problem of who was to succeed him.'
23457: '@rNormally, the successor would be fixed as the oldest son, Krauss, as laid out by Kinzo himself.'
23458: '@r...But in his later years, Kinzo began to think that Eva was more fitting to be head.'
23459: '@rHowever, Kinzo, stubborn even to himself and obstructed by the title of successor that he had given to Krauss,@k searched for an official stance by which he could skip over Krauss and select Eva as his successor.'
23460: '@rThat official stance was the riddle of the epitaph.'
23461: '@rThe primary successor was still Krauss,@k but there was a new rule, saying that if someone appeared who could solve the riddle, they would be chosen as the successor to the head.'
23462: '@rAnd on the day of what would probably be his final family conference, Kinzo had told Eva the answer to that riddle himself.'
23463: '@r......In short, it was the same as proclaiming that Eva was the successor.'
23464: '@r@v21/44100039."On that day, Eva-san was summoned by Kinzo-san, and that was revealed to her.@k@v21/44100040. And so that she could succeed the head, he called Eva-san to the hidden mansion Kuwadorian, known only to the head."'
23465: 'Ange@r@v11/42000245.".........And the claim is that she escaped harm in that accident because she was waiting at the hidden mansion just beforehand?@k @v11/42000246.Maybe Aunt Eva just killed everyone and made it look like an accident so that she could steal all of the wealth,@k@v11/42000247. and that''s why she''s the only one who escaped unharmed."'
23466: '@r@v21/44100041."Well, that''s what the papers are shouting about.@k@|@y@v21/44100042. However, I believe Eva-san.@k@v21/44100043. ......I think there are several points that make her worthy of trust."'
23467: 'Ange@r@v11/42000248."For example...?"'
23468: '@r@v21/44100044."That ring of the Ushiromiya family head, which is on your finger as we speak.@k@v21/44100045. That ring is the only one of its kind in the world, which Kinzo-san had specially made.@k@v21/44100046. And even the artisan who made it acknowledges that the object on your finger is, without a doubt, that ring."'
23469: '@rThe Ushiromiya family...Head''s Ring.'
23470: '@rThat ring, with the heft of gold and the one-winged crest on it,@k had diamonds adorning the pedestal, and possessed both stateliness and a sense of gaudy extravagance.'
23471: '@rKinzo had worn that on his finger, never removing it even for a moment.'
23472: '@rThe fact that Eva had it was apparently proof that Kinzo had acknowledged her as the successor to the head.'
23473: '@r@v21/44100047."Because Eva-san did indeed have that ring,@k@v21/44100048. and, if you take into consideration that Eva-san was indeed more capable, and that Krauss-san was known to have made a fool of himself numerous times in the business setting,@k@v21/44100049. I cannot imagine that Eva-san''s story is completely made up."'
23474: 'Ange@r@v11/42000249."............Although there''s also the possibility that she murdered Grandfather in order to steal that ring.@k@v11/42000250. And then, using some kind of trick, she massacred everyone and made it look like an accident."'
23475: '@r@v21/44100050."Ah, yes.@k@v21/44100051. It seems the papers are accusing her of massacring her entire family with the aim of keeping all the wealth to herself."'
23476: '@r@v21/44100052."It is true that Eva-san was the kind of person to take drastic action when it came to the crunch.@k@v21/44100053. It could be possible......that she committed the only murders she planned on committing in her life to grab this chance to make the Ushiromiya wealth all her own.@k@v21/44100054. ............But you know, I don''t think that''s true."'
23477: 'Ange@r@v11/42000251."What''s the second point making her worthy of that trust?"'
23478: '@r@v21/44100055."Eva-san''s family.@k@v21/44100056. Hideyoshi-san and George-kun.@k@v21/44100057. ......You might find this difficult to believe, Ange-chan, but Eva-san was a person who treasured her family greatly."'
23479: '@r......He was right; I found it very hard to believe that, or admit it.@k@rBut deep inside I knew.'
23480: '@rAunt Eva really had been a person who treasured her family greatly.'
23481: '@rThe root of her twisted personality had been nothing more than the sadness of losing her beloved husband and son.'
23482: '@rHaving been used as an outlet for all that emotion, I had no feelings of sympathy for her at all,@k ......but even so, it''s not like I couldn''t imagine that losing her entire family had dealt her an incredible shock sufficient to transform her personality.'
23483: 'Ange@r@v11/42000252."......You''re saying that there''s no way Aunt Eva, who loved her family, would have abandoned her husband and her son?"'
23484: '@r@v21/44100058."That''s right.@k@v21/44100059. If Eva-san really had been the culprit and massacred her entire family, making it look like an accident,@k@v21/44100060. ......her husband and her son would definitely be alive right now."'
23485: '@r@v21/44100061."She''d have tried to wriggle out of it by saying her family was the only one in the hidden mansion by coincidence.@k@v21/44100062. If Hideyoshi-san and George-kun had both been alright, even I would have probably suspected Eva-san."'
23486: '@r@v21/44100063."......It''s impossible for me to believe that all that wailing Eva-san did at Hideyoshi-san''s funeral was an act."'
23487: 'Ange@r@v11/42000253.".........Both of those are circumstantial evidence.@k@v11/42000254. That isn''t the same as physically showing Aunt Eva''s innocence."'
23488: '@r@v21/44100064."Hahahaha.@k@v21/44100065. That''s just unconstructive.@k@v21/44100066. Eva-san was the only one left alive.@k@v21/44100067. And she says that is the truth."'
23489: 'Ange@r@v11/42000255."But no one can prove her innocence."'
23490: '@r@v21/44100068."Yes, that''s right.@k@v21/44100069. And no one can prove that she committed a crime, either."'
23491: 'Ange@r@v11/42000256.".............................."'
23492: '@r@v21/44100070."And the final point making her worthy of trust—is the police.@k@|@y@v21/44100071. After all, it was one hell of an incident.@k@v21/44100072. Pushed forward by a public in an uproar over the murder theory, the police must have investigated her thoroughly."'
23493: '@rIt''s easy to feel something unnatural about the claim that Eva had escaped the accident by coincidence,@k because she and she alone had escaped to a hidden mansion.'
23494: '@rFurthermore, at the time, Hideyoshi''s company had been right in the middle of a takeover struggle, and had wanted a large sum of cash in order to buy off the big stockholders.'
23495: '@rIt shouldn''t be too hard to find a motive there.'
23496: '@rBut as a matter of fact, en route to the family conference, Eva''s person had been perfectly clean.'
23497: '@rNothing unnatural was found on her that could have been used to brutally murder her family and make it look like an accident.'
23498: '@rThe servants who escaped harm by being off-duty on that day also stated that they hadn''t seen anything strange regarding anyone related to the event, Eva included.'
23499: '@rPutting all of that together,@k it could only be concluded that Ushiromiya Eva had headed to Rokkenjima for a normal family conference, no different from usual,@k and became involved in an accident...'
23500: '@r@v21/44100073."The police placed her under all that scrutiny, and they still couldn''t find evidence that it was a crime.@k@|@y@v21/44100074. ......That was the police''s conclusion.@k@v21/44100075. Doesn''t that put an end to the Rokkenjima Suspicion?"'
23501: 'Ange@r@v11/42000257."......That just means that the police@v11/42000258. couldn''t find the evidence of her crimes, doesn''t it?"'
23502: '@r@v21/44100076."Oh, come on, you could go on forever that way.@k@v21/44100077. It becomes a Devil''s Proof.@k@v21/44100078. To expose a crime, you just need to find the evidence.@k@v21/44100079. But what can you find to show someone''s innocence?@k @v21/44100080.It''s impossible to prove a negative fact."'
23503: 'Ange@r@v11/42000259."......Did Aunt Eva commit a crime, or did she not...@k@v11/42000260. Because we can''t find the data to decide that, the truth will remain a mystery, in other words."'
23504: '@r@v21/44100081.".........Well,@k@v21/44100082. to put it in the words you''re hoping for, that''s how it is.@k@v21/44100083. Even Eva-san couldn''t conclusively prove her own innocence."'
23505: '@r@v21/44100084."An unfortunate accident occurred on that island.@k@v21/44100085. And Eva-san survived by chance.@k@v21/44100086. And that''s literally all we know!"'
23506: '@r@v21/44100087."In short, as Eva-san is the only survivor, it all comes down to whether you can believe her story or not."'
23507: '@r@v21/44100088."......I believed.@k@v21/44100089. What she told me about the ring, and her admirable love for her family.@k@v21/44100090. And the tears she showed at the funeral.@k@v21/44100091. Taking all of that into consideration, I decided I would believe her story."'
23508: 'Ange@r@v11/42000261."......But I don''t believe it.@k@v11/42000262. If she wanted to steal the ring, there were probably many ways for her to do so, and no one knows whether her relationship with her family really was good.@k@v11/42000263. It''s impossible to prove that the tears at the funeral were the real thing."'
23509: 'Ange@r@v11/42000264."......Anyway, in the first place, I hate Aunt Eva.@k@v11/42000265. So that doesn''t exactly inspire me to believe her story."'
23510: '@r@v21/44100092."Hahahaha...@k@v21/44100093. How does one view the truth of the incident?@k@v21/44100094. You and I are at loggerheads on the issue.@k@v21/44100095. Even though the information we''re given is exactly the same, we develop completely different opinions."'
23511: '@r@v21/44100096.".........This kind of thing happens all the time in politics and economics.@k@v21/44100097. No matter the enterprise, it will always result in a division of opinions.@k@v21/44100098. Do you know why?"'
23512: 'Ange@r@v11/42000266.".........No?"'
23513: '@r@v21/44100099."It''s about whether you have love.@k@v21/44100100. ......Depending on whether you feel love for the other side, the way you see things is completely different."'
23514: '@r@v21/44100101."If a person you like gives to the poor, you can respect them, right?@k @v21/44100102.But if someone you hate starts donating, you fiercely protest that it''s a publicity stunt or they''re handing out favors."'
23515: '@r@v21/44100103."No matter what they do or don''t do, you thank them if you have love and criticize them if you don''t.@k@v21/44100104. That''s how the world works."'
23516: 'Ange@r@v11/42000267."Can you believe Aunt Eva or not...@k@v11/42000268. ......You''re saying that''s the only difference?"'
23517: '@r@v21/44100105."Those who suspect her will probably take anything she does or doesn''t do and view it as truly unnatural.@k@v21/44100106. And it works in reverse.@k@v21/44100107. ......As for me,@k@v21/44100108. I think that perhaps, except in extreme cases, truth in this world doesn''t exist."'
23518: '@r@v21/44100109."No, even if...@k@v21/44100110.even if truth does exist, whether you believe it or not is determined by whether or not you have love."'
23519: '@r@v21/44100111."......Can you really call truth "truth" if it isn''t absolute?@k @v21/44100112.Even if Eva-san had been able to demonstrate a physical alibi, would you have been able to believe it?"'
23520: 'Ange@r@v11/42000269."..........................."'
23521: '@rHe has a point.'
23522: '@r...I hate Aunt Eva, so I''ll probably deny all information beneficial to her,@k and maliciously interpret all neutral information.'
23523: '@r......In other words, inside myself, the truth is already decided.@k And yet I''m still unsatisfied, still searching for the "truth"—so what exactly is this "truth" I''m searching for...?'
23524: '@r@v21/44100113."That''s how it is.@k@v21/44100114. So no matter what you hear from me, as long as you still suspect Eva-san,@k@v21/44100115. it won''t change anything for you, not after all this time."'
23525: '@r@v21/44100116."Even if you got your hands on a piece of hitherto unknown information, I still don''t think you''d be able to reach the truth, not the way you are now, at least."'
23526: 'Ange@r@v11/42000270.".........So I''m incapable...@v11/42000271.of reaching the truth?"'
23527: '@r@v21/44100117."Well, yeah.@k@v21/44100118. No matter what kind of new information or proof you find, Ange-chan, you aren''t gonna change your stance that Eva-san is the culprit, right?"'
23528: '@r@v21/44100119."Then it doesn''t matter what else you look into, it isn''t gonna mean anything, is it?@k@v21/44100120. The truth inside of you is already decided."'
23529: 'Ange@r@v11/42000272."..........................."'
23530: '@r@v21/44100121."But if...@k@v21/44100122.if you don''t think of that as truth, and earnestly desire to arrive at the deeper, real truth, there is a single way."'
23531: '@r@v21/44100123."I believe I already mentioned that once, though.@k@v21/44100124. Know what it is?"'
23532: 'Ange@r@v11/42000273."......You mean...love?@k @v11/42000274.I don''t really know what you mean by that."'
23533: '@r@v21/44100125."Right now, you are thinking about this while supposing that Eva-san is the culprit.@k@v21/44100126. But that is like looking at things with one eye."'
23534: '@r@v21/44100127."With one eye, no matter how much you squint, you can''t see an object in three dimensions, right?@k @v21/44100128.That''s why you need another eye.@k@v21/44100129. Of course, in a different position from the eye you have right now."'
23535: 'Ange@r@v11/42000275."............You''re telling me to look at things based on the supposition that Aunt Eva isn''t the culprit,@k@v11/42000276. ...or else, that it actually was a real accident...?"'
23536: '@r@v21/44100130."Yes, yes, exactly.@k@v21/44100131. When you think about something, try to look at it from different perspectives.@k@v21/44100132. If you don''t, you won''t understand anything about how it really is."'
23537: '@r@v21/44100133."It''s the same with newspapers.@k@v21/44100134. With only a single newspaper, you can only see things from the single viewpoint of the writer who wrote the article.@k@v21/44100135. Sometimes it takes reading multiple papers before you can process the information rationally and in three dimensions."'
23538: '@r@v21/44100136."......Without love, the truth cannot be ''seen''.@k@|@y@v21/44100137. .........Mmm, that''s got a nice ring to it, wahahaha."'
23539: '@rMaybe he found it amusing that a cheesy phrase like that had popped out of his mouth.@k@rFor a while, he laughed, looking pleased.'
23540: '@r......By that, he was simultaneously declaring that he had told everything that he knew,@k and that it was about time for me to leave.@k Understanding that, I got to my feet.'
23541: '@r@v21/44100138."I understand your feelings now, Ange-chan.@k@v21/44100139. You should do as you like for a while, until you''re satisfied.@k@|@y@v21/44100140. ......You were six years old at the time.@k@v21/44100141. You lost your family before you could even make sense of it, and I fully understand you feeling like you still don''t have closure."'
23542: 'Ange@r@v11/42000277."..........................."'
23543: '@r@v21/44100142."You may learn the truth, and you may not.@k@v21/44100143. Eva-san may be the culprit, and she may be a victim."'
23544: '@r@v21/44100144."......I pray that you find the "truth" you believe in, Ange-chan.@k@v21/44100145. A journey at such a young age may be a valuable experience."'
23545: 'Ange@r@v11/42000278."Thank you very much...@k@v11/42000279. ......I am truly sorry to be such a bother when you are so busy, Okonogi-san."@|@y'
23546: 'Okonogi@r@v21/44100146."No trouble, no trouble.@k@v21/44100147. What are you going to do now?"'
23547: 'Ange@r@v11/42000280."Well, whatever works.@k@v11/42000281. ......I''ve made appointments with several specialists and people related to the crime, so I plan to pay them a visit."'
23548: 'Okonogi@r@v21/44100148."I see.@k@v21/44100149. I hope you can find an answer you can accept."'
23549: '@rAt that moment, company president Okonogi''s secretary came in, and handed him a memo over his shoulder.'
23550: '@rHe read it and looked between it and my face.'
23551: 'Okonogi@r@v21/44100150."......Ange-chan.@k@v21/44100151. My apologies that this comes right after telling you to try going on a journey, but I have some information you should lend an ear to.@k@v21/44100152. ......It looks like you''re in a bit of a nasty fix right now."'
23552: 'Ange@r@v11/42000282."People after my money?@k @v11/42000283.This is why money is stupid."'
23553: 'Okonogi@r@v21/44100153."Yes, but if you try to sell off the whole shebang and donate the entire sum to social welfare,@k@v21/44100154. those people already making plans for your fortune, you''re gonna make their eyes pop out."'
23554: 'Ange@r@v11/42000284."Oh, so it''s the Sumadera family.@k@v11/42000285. The arrogance of them trying to act like my guardians."'
23555: '@rI have the precedent of Aunt Eva.@k@rWho would ever go under the care of the Sumadera family?'
23556: '@rThey probably want, as Aunt Eva had so often threatened in the past,@k to cut off my arms and legs, throw me in a warehouse, and suck the Ushiromiya family''s wealth dry.'
23557: 'Okonogi@r@v21/44100155."A representative from the Sumadera family is coming here.@k@|@y@v21/44100156. They''re saying to hand you over...no no, that they want to protect you."'
23558: 'Ange@r@v11/42000286."Representative, you say?"'
23559: 'Okonogi@r@v21/44100157."It''s your aunt.@k@v21/44100158. Kyrie-san''s younger sister.@k@v21/44100159. She has said before that she thinks of you as a little sister."'
23560: 'Ange@r@v11/42000287."She must be kidding.@k@v11/42000288. At least call me a grandchild, you old granny."'
23561: 'Okonogi@r@v21/44100160."Judging from the context, it seems they''re not planning on taking your wishes into consideration.@k@v21/44100161. I have a car waiting in the parking lot two stories underground.@k@v21/44100162. Go."'
23562: 'Ange@r@v11/42000289."......The Sumadera family is telling you to hand me over, right?@k@v11/42000290. Is it really alright to let me go?"'
23563: 'Okonogi@r@v21/44100163."You will definitely be someone big in the future, Ange-chan.@k@v21/44100164. Let''s call this a favor to be repaid upon your success.@k@|@y@v21/44100165. ...Go, quickly...!"'
23564: '@rAfter bowing silently and deeply, Ange left that place at a dash.'
23565: '@rAfter watching her leave, the secretary straightened her glasses and whispered.'
23566: '@r@v99/SecFA4001."The Sumadera family told us to stall her...@k@v99/SecFA4002. Is it alright to let her go?"'
23567: 'Okonogi@r@v21/44100166."We did stall her, more than enough.@k@v21/44100167. If they still don''t make it in time, that''s the Sumaderas'' error.@k@v21/44100168. ......I told Ange-chan to run for it.@k@v21/44100169. And I informed the Sumaderas that Ange-chan was here.@k@v21/44100170. Whether she''s caught or not, neither one of them will blame me."'
23568: 'Okonogi@r@v21/44100171."......Everything in this world is...love, you see...@k@v21/44100172. It''s alright, she''ll escape.@k@v21/44100173. After all, she''s the kind of kid who can jump off a building to lose her pursuers."'
23569: '@r......Okonogi again looked down at the world below,@k and muttered "yeah, that''d be beyond me..."'
23570: '@rAnge was no fool herself.'
23571: '@rShe got off the elevator, and stepped out onto the third floor.'
23572: '@rA taxi in the second level of the basement?'
23573: '@rThat''s so overly courteous that it feels wrong.@k It''s probably better to decline that.'
23574: '@rBut my enemies aren''t fools either.@k They probably have control of not just the underground parking lot, but the first-floor lobby as well.'
23575: '@rThis is such a massive building.@k@rInstead of getting anxious and escaping outside, maybe it''s better to stay on the inside and wait it out?'
23576: '@rNo, that''s no good.@k If they gain control of the security room in a modern building like this, I''ll have nowhere to run to.'
23577: '@rThis entire building is like a massive dead end.'
23578: '@rThe third floor is the business floor.@k A girl like me clearly sticks out.'
23579: '@rTrying not to stand out any more than I had to, I walked at a quick pace, searching for an emergency staircase.@k ......One running down the outside of the building would be ideal.'
23580: '@rI found the door to the emergency staircase.'
23581: '@rAfter opening that heavy door, I found the outside stairs I was hoping to see.'
23582: '@rOnce outside, I immediately encountered a man smoking a cigarette, who looked like an employee skipping work.@k@rAfter glaring at me, he quickly crushed up his cigarette and went away.'
23583: '@rIt looks like there''s no one below.@k@r...If I''m going to escape, now is my only chance...!'
23584: '@rJust when I thought that, with an incredible squealing of the tires, a black car slid directly below me and came to a sudden stop.'
23585: '@r......It felt from the tire sounds like there were several more of them, and this one had come here to block this path.'
23586: 'Ange@r@v11/42000291."......Not bad, Aunt Kasumi.@k@v11/42000292_b. Even your niece leaving by an emergency exit gets a car sent to pick her up."'
23587: '@rBam-bam! The car doors opened forcefully, three men in black suits jumped out, and they looked up at the emergency staircase.'
23588: '@r......Ahhh shoot, our eyes met.'
23589: '@r@v99/MafMA4001."12, target found.@k@v99/MafMA4002. Northwest side emergency stairs, third floor, send support."'
23590: '@r@v99/MafMB4001."Ange-sama!@k @v99/MafMB4002.Please do not move from there!@k @v99/MafMB4003.Forgive our roughness...!!"'
23591: '@rThe three of them began to clamor up the emergency staircase.'
23592: '@r......They already announced that they''re planning to be rough.@k This is pretty bad.'
23593: '@rThey''ve probably been ordered to bring me back by any means, with one of my arms yanked off if necessary, just so long as I''m still breathing.'
23594: '@rClankclankclankclank!!@k Their heavy, wild footsteps became a helix and began to rise from the lower floors, getting closer...!'
23595: '@rIn the entrance lobby of the building, a woman was walking forwards at a leisurely pace, with seven black-suited guards in tow.'
23596: '@rSeeing this ostentatious entrance, the security guards for the building ran up to them, asking if they had an appointment.'
23597: '@r@v22/44300001.".........How typical of Tokyo people.@k@v22/44300002. You require a name to even understand the status of the person you are talking to...?"'
23598: '@r@v99/GuarMA4001."M-my apologies...@k@v99/GuarMA4002. The policy at our company is for guests to take a securi—"'
23599: '@r@v22/44300003."......Back down, plebeian.@k@v22/44300004. I came because I was called by your president.@k@v22/44300005. Call Okonogi Tetsuro here.@k@v22/44300006. To think that he would call me here and then not welcome me... How typical of Tokyo people..."'
23600: 'Okonogi@r@v21/44100174."My apologies.@k@v21/44100175. Welcome to the Ushiromiya Group, Sumadera @bKasumi.@<霞@>-san."@|@y'
23601: '@rWith his secretary behind him, Okonogi dashingly appeared from the elevator.'
23602: '@rEven though both of them wore bold smiles, they were caught in a tension reminiscent of the smell of gunpowder...'
23603: 'Kasumi@r@v22/44300007.".........Where is Ange?@k @v22/44300008.I came to collect my sister''s darling, darling daughter."'
23604: 'Okonogi@r@v21/44100176."Strict observance of time is our motto here at the Ushiromiya Group.@k@v21/44100177. The former Chairman herself said that those who can''t keep time can''t keep contracts."'
23605: 'Kasumi@r@v22/44300009."......You call me all the way to Tokyo to be greeted by this mess?@k @v22/44300010.You let her go, didn''t you."'
23606: 'Okonogi@r@v21/44100178."She got away...is the wording I would have preferred.@k@v21/44100179. We did stall her for quite some time, believe it or not.@k@v21/44100180. I''m not surprised she smelled a rat.@k@v21/44100181. There wouldn''t have been a problem if you had come on time, Sumadera-san."'
23607: 'Okonogi@r@v21/44100182."This is why you provincials are such a hassle, you''re never ever punctual.@k@|@y@v21/44100183. Wahhahahahahahahaha!"'
23608: 'Kasumi@r@v22/44300011."............What did you say just now......?@k @v22/44300012.What did you say to me...?"'
23609: '@rYou couldn''t sense any of Kyrie''s sociability in the face of her younger sister Kasumi.'
23610: '@rShe wore on her face the arrogance of the ancient Sumadera family towards the ruined Ushiromiya family,@k ......as well as pride, because she didn''t want anyone to notice that her family was declining so much that they couldn''t ignore the Ushiromiya family''s wealth.'
23611: '@rEven at a glance, it was easy to understand why Ange hated everything about her aunt...'
23612: '@rKasumi couldn''t stand even a slight insult, and while she still smiled, her eyebrows twitched.'
23613: '@rAt that time, one of the men in black suits behind Kasumi whispered to her.'
23614: '@r@v99/MafMC4001."Ange-sama has been found.@k@v99/MafMC4002. We are dealing with her as I speak."'
23615: 'Kasumi@r@v22/44300013."......Oh, I''m glad we made it in time.@k@v22/44300014. ......Thank you, Okonogi.@k@v22/44300015. It seems I can finally take my naughty niece home.@k@v22/44300016. ......I''ve been so eager to have a nice long talk with that girl in my tea room that I already have the tools ready and waiting, you know.@k@v22/44300017. Ehheheheheheheh...!"'
23616: '@rClankclankclankclank......!!'
23617: '@rAs the violence of the sound drew a helix, it rushed up at me from below, threatening to swallow me up.'
23618: '@rOf course, even if I fight them, I stand no chance of winning.@k Even so, if I run into the building, it''ll be like jumping into a dead end of my own accord.'
23619: '@rThe enemies will increase in number with time.@k If I can''t do anything here, I won''t have any more chances to escape.'
23620: '@rThen, three muscular black-suits came into view below me.'
23621: '@rOne, two, three.@k Three people.@k In other words, everyone who had gotten out of the car.'
23622: '@rIf there had been just one of them, I might have been able to wait for the moment of arrival to dropkick him as hard as I could, which might have worked out.@k ......But it really is impossible with three of them.'
23623: '@rWait... Three, huh...@k ......Three...might be just about doable...@k@r......I can do it......!'
23624: 'Ange@r@v11/42000293."Whew.........@k@|@y@v11/42000294. ............haaaaAAAAHHH!!"'
23625: '@r@v99/MafMA4003."Wh—?!@k @v99/MafMA4004.Y-you idiot, stop!!@k @v99/MafMA4005.Look ooooout!!@k @v99/MafMA4006.Uwaaaaaaaaaahhh...!!"'
23626: '@r@v99/MafMC4003."01 calling 12, do you have her, please respond.@k@v99/MafMC4004. ......What''s wrong?!@k @v99/MafMC4005.Respond!"'
23627: '@r@v99/MafMB4004."Wh-......what kind of person... Damn it......"'
23628: '@r.........Nggghh...@k ......Ouchhh...@k@rLook, see... That worked out, didn''t it? It''s just three.'
23629: '@rI''ve already experienced much higher places, after all.@k@rI knew I could jump down just three floors...!'
23630: '@rIt''s a good thing that the car they came in was right beneath me.@k@rEven if it wasn''t as pleasant as a trampoline, it broke my fall, a little gently, a little roughly.'
23631: 'Ange@r@v11/42000295."......Well, that makes me feel wonderful.@k@v11/42000296. No one asked you to go and dent that badly."'
23632: '@rHaving broken my fall, the roof of the car now had a massive dent around my body.'
23633: '@rI guess car roofs are more delicate than I thought.@k@rI don''t think it''s because of my weight.'
23634: '@rApparently, the three men on the stairs hadn''t anticipated me jumping down.'
23635: '@rHaving realized that they had been outwitted, they were hurriedly rushing back down.'
23636: '@rI have to run and escape while I have the chance.@k@rAs I moved my body, the car roof made buckling and popping sounds.'
23637: '@rBut I had been naive.@k There was no way they''d have all rushed up the stairs without leaving one person behind.'
23638: '@rThere was one black-suit left in the driver''s seat of the car that had broken my fall.@k@rHe stuck his head out of the window, and when he realized that the thing that had fallen on him was me, he jumped out.'
23639: '@rIn a rush, I jumped off the roof, but his reaction was really fast.@k ......Either there was a massive reward for capturing me, or a harsh punishment for letting me get away.'
23640: '@r@v99/MafMA4007."15, secured, secured...!"@|@y'
23641: 'Ange@r@v11/42000297."Owowowow......!!@k @v11/42000298.Ghhhh, get your hands off me, let GO!!"'
23642: '@rI was mercilessly held down against the asphalt.@k I was being crushed face-down, covered and pressed down on from above.'
23643: '@rIt was a hold without a trace of elegance, but it really was logical and left me absolutely no room for resistance.'
23644: '@rI tried to push back with both hands, searching for a way to resist,@k but I was being pushed down solidly, and I couldn''t even tear myself off the asphalt.'
23645: '@rThen another car came, squealing its tires as it slid to a sudden stop.'
23646: '@rGuess it''s all over.'
23647: '@r@v99/MafMA4007_1."Gyah!!!"@|@y'
23648: '@rThe man that had been crushing me let out a sharp cry.@k ......He had yelled close to my left ear, making it ring.@k What in the world?!'
23649: '@rThe black-suit and I were unceremoniously rolled over.'
23650: '@rAfter being turned face up, the first thing I saw was...an arm stuck out right in front of my eyes.'
23651: 'Ange@r@v11/42000299.".........Amakusa...?@k @v11/42000300.Why are you here...?"'
23652: 'Amakusa@r@v20/43000001."Let''s talk about that after we''ve lost them.@k@v20/43000002. To the car, quickly, missy...!"'
23653: '@rAmakusa grabbed my arm and easily pulled me up, spinning me around with himself as the center of gravity.'
23654: '@rThe thought that it was a little like a dance lasted only the few brief moments before he flung me through the open door into the driver''s seat.'
23655: '@rI climbed over the hand brake and slid into the passenger''s seat.@k@rPushing me through, Amakusa also got in and took up the driver''s seat.'
23656: '@rSince we had suddenly taken off while I was still on all fours, I had to kick and struggle around on the seat for a while, like a turtle flipped onto its back...'
23657: '@rAmakusa checked the rear-view mirror for cars in pursuit, but flew into the artery of the big city without lowering his speed in the slightest.'
23658: '@rWe sewed our way between cars one after another.@k@rJust like a chase scene in some action movie.'
23659: '@r......Tossed about by his horrible driving, I had trouble getting myself reseated.'
23660: 'Amakusa@r@v20/43000003."Any injuries, missy?"'
23661: 'Ange@r@v11/42000301."All good.@k@v11/42000302. Humans are surprisingly durable.@k@|@y@v11/42000303. From now on, whenever I miss a down elevator, I''ll just jump out a window instead."'
23662: 'Amakusa@r@v20/43000004."Hyahhahaha, looks like air dives are your hobby, missy.@k@v20/43000005. Still, I recommend that you bring a parachute next time."'
23663: 'Ange@r@v11/42000304."I''ll do that, if I remember after jumping."'
23664: 'Amakusa@r@v20/43000006."Hyahhahahahaha, <cool>!"'
23665: '@rHe smacked the steering wheel, guffawing.'
23666: '@rNeed an explanation for this flippantly spoken man?'
23667: '@rHis name is @bAmakusa.@<天草@> @bJuuza.@<十三@>.@|@y'
23668: '@rHe was originally one of Aunt Eva''s guards.@k If I remember correctly, she hated him for being too jokey and too chatty.'
23669: '@rHe was especially young amongst the guards, but contrary to his outward flippancy, he had hopped from the 1st Airborne of the JSDF to the French Foreign Legion,@k placing himself in overseas private military companies and high-class security companies one after another, making for a pretty incredible and unique career.'
23670: '@r......But I heard that he ran off from both the JSDF and the French Foreign Legion, and that he''ll be arrested if he enters France again.@k@rBoth of these flippant episodes were very typical of him.'
23671: '@rApparently, the guards had been sternly told not to chat with me unnecessarily,@k but I recall that didn''t stop him coming to take a pass at me.'
23672: '@rAunt Eva had particularly disliked that, and I believe she dismissed him right before she died.'
23673: 'Ange@r@v11/42000305."It''s nice to hear that casual tone again.@k@v11/42000306. What have you been up to since getting fired?"'
23674: 'Amakusa@r@v20/43000007."Coaching people at Blackwater.@k@v20/43000008. I came back to this country for some time off, and President Okonogi offered me a high wage."'
23675: 'Ange@r@v11/42000307."......And you ran off again?@k @v11/42000308.What use is a man like that, I wonder."'
23676: 'Amakusa@r@v20/43000009."It doesn''t count as running off as long as I come back by next week.@k@v20/43000010. I talked with him yesterday.@k@v20/43000011. I was told that you might attract some troublesome people."'
23677: 'Ange@r@v11/42000309."Sorry that it turned out to be exactly right."'
23678: 'Amakusa@r@v20/43000012."My name probably came up since I know you, and I''ve got plenty of experience when things get crazy.@k@v20/43000013. Thanks to you, it looks like this''ll make for a happy break along with some pocket money."'
23679: 'Ange@r@v11/42000310."......Okonogi-san employed you as my guard?"'
23680: 'Amakusa@r@v20/43000014."He probably wants you to owe him one, missy.@k@v20/43000015. ......After I got the axe, President Okonogi helped me out a bunch, you see.@k@v20/43000016. He''s got me right where he wants me, can''t say no to him.@k@v20/43000017. Hyahha!"'
23681: 'Ange@r@v11/42000311."......Seems that if you let Okonogi-san help you out, it''ll be pretty costly in the future.@k@|@y@v11/42000312. ......So, where are you planning on taking me?"'
23682: 'Amakusa@r@v20/43000018."Wherever.@k@v20/43000019. I''m employed until the weekend.@k@v20/43000020. Anything after that''ll cost you extra."'
23683: 'Ange@r@v11/42000313."How much a day?"'
23684: 'Amakusa@r@v20/43000021."I''ll cut you a deal for 50K.@k@v20/43000022. Plus expenses."'
23685: 'Ange@r@v11/42000314."If you stop cracking jokes, I''ll double it.@k@v11/42000315. The period of employment is undetermined.@k@v11/42000316. It might be several weeks."'
23686: 'Amakusa@r@v20/43000023."...That''ll be tough.@k@v20/43000024. I''ll have to call the boss to get an extension on my vacation."'
23687: 'Ange@r@v11/42000317."I just want to investigate that day, more than anything."'
23688: 'Amakusa@r@v20/43000025."......Oh, you''re talking about Rokkenjima?"'
23689: 'Ange@r@v11/42000318."Yes.@k@v11/42000319. What happened on that island twelve years ago?@k@v11/42000320. ......I want to investigate it with my own hands, and find a satisfying explanation."'
23690: 'Amakusa@r@v20/43000026."Will you really make any new discoveries at this point, investigating something that happened so long ago...?"'
23691: 'Ange@r@v11/42000321."You''re right.@k@v11/42000322. Which is why this is a journey for my own self-satisfaction.@k@v11/42000323. ......Once I''m done, I''ll just throw my hands up and go to the Sumadera family."'
23692: 'Ange@r@v11/42000324."......Didn''t Aunt Kasumi say something about wanting to treat me to some @bgreen tea.@<matcha@>?@k@v11/42000325. Maybe I''ll be made to kneel on some sharp wooden blocks and clutch stones or something while we drink."'
23693: 'Amakusa@r@v20/43000027."Damn that sounds freaky, hyahhahahaha...!"'
23694: '@r@v99/MafMD4020."My apologies, we lost sight of her...@k@v99/MafMD4001. A single man thought to be an associate assisted in her escape.@k@v99/MafMD4002. Judging by his possession of a stun gun and his driving skills, he is no amateur."'
23695: 'Kasumi@r@v22/44300018."............I see. Thank you.@k@|@y@v22/44300019. .........I''m disappointed, Okonogi.@k@v22/44300020. Shall I take this as your answer...?"'
23696: 'Okonogi@r@v21/44100184."Letting her get away was your screwup.@k@v21/44100185. Not my problem, I''m afraid."'
23697: 'Kasumi@r@v22/44300021."............I''d dearly like to treat you to some matcha in the near future as well.@k@v22/44300022. The next time you are in Kyoto, please do stop by.@k@v22/44300023. .........Let''s go."'
23698: 'Okonogi@r@v21/44100186."Huh, leaving already?@k@v21/44100187. You could have some chazuke before you go."'
23699: 'Kasumi@r@v22/44300024."..................*cackle*cackle*.@k@v22/44300025. ...Hoh-hoh-hoh-hoh-ho...!!"'
23700: '@rHer back to Okonogi, she laughed at first lightly, but with an increasingly shrill and hateful tone, using that as a substitute for a sharp parting remark.'
23701: '@rAt the exact moment she stopped laughing, the look on her face changed dramatically to that of a demon,@k but because her back was facing him, Okonogi never saw that expression.'
23702: '@rOkonogi watched her go, laughing coolly.@k@rHis secretary whispered over his shoulder.'
23703: '@r@v99/SecFA4003."......Is that alright?@k @v99/SecFA4004.Milady Ange is our company''s primary stockholder.@k@v99/SecFA4005. If the Sumadera family becomes her guardian..."'
23704: 'Okonogi@r@v21/44100188."I get it.@k@v21/44100189. But you know, we''re the one-and-only Ushiromiyas.@k@v21/44100190. We can''t let them take us lightly."'
23705: 'Okonogi@r@v21/44100191."......Still, looks like he outmanuevered them pretty well.@k@v21/44100192. ......Now we''ll just let Ange-chan do as she pleases.@k@v21/44100193. I''m counting on you, Amakusa."'
23706: '@r@v99/MafMC4006."......Kasumi-sama.@k@v99/MafMC4007. The getaway vehicle was a rental.@k@v99/MafMC4008. The license plate on display was a fake.@k@v99/MafMC4009. He''s clearly a pro.@k@v99/MafMC4010. They will probably abandon the car.@k@v99/MafMC4011. Pursuit will be difficult.@k@v99/MafMC4012. ......Should we have the police chase them?"'
23707: 'Kasumi@r@v22/44300026."............Let me see.@k@v22/44300027. Shall we have them search for a runaway daughter?@k @v22/44300028.They are getting paid with our taxes, so we must have them be of some use every once in a while.@k@v22/44300029. Hoh-hoh-hoh-ho............"'
23708: 'Kasumi@r@v22/44300030."You do realize I left the mansion defiantly insisting to Mother that she should leave it to me?@k @v22/44300031.Do you intend to embarrass me further still......?"'
23709: 'Kasumi@r@v22/44300032."It looks like I need to serve some matcha to every single one of you, doesn''t it?@k @v22/44300033.......Our underground tea room is cramped, so you''ll have to wait in line, won''t you......?"'
23710: '@r@v99/MafMB4005."N-no...@k@v99/MafMB4006. We will search with everything we have."'
23711: 'Kasumi@r@v22/44300034."......Ahh, she really is a cute kid, just like Nee-san.@k@v22/44300035. ......Especially that unrestrained, self-centered side of her.@k@v22/44300036. ......Ahh, now I can''t see her as anyone but Nee-san."'
23712: 'Kasumi@r@v22/44300037."Ahh, I''m truly looking forward to it.@k@v22/44300038. To think I''ll be able to invite Nee-san''s daughter to my tea room......@k @v22/44300039.Hoh-hoh-hoh-hoh-ho......!!"'
23713: 'Ange@r@v11/42000326."......The Sumadera family sure moved quickly.@k@v11/42000327. Did Okonogi-san sell me out...?"'
23714: 'Amakusa@r@v20/43000028."You''re joking.@k@v20/43000029. He''s my client.@k@v20/43000030. If he''d sold you out, he wouldn''t have hired me, right...?"'
23715: 'Ange@r@v11/42000328."...........................@k@v11/42000329. ...I guess that''s true."'
23716: 'Amakusa@r@v20/43000031."......Ah, so that''s why you got off the elevator at the third floor?"'
23717: 'Ange@r@v11/42000330."Having a car waiting in the underground parking lot was suspiciously well-organized of him, you see.@k@v11/42000331. I thought that he might have sold me out.@k@v11/42000332. ......Although at this point, it''s impossible to prove whether there was an ambush set up in the parking lot or not."'
23718: 'Amakusa@r@v20/43000032."Riiight... Damn, the poor guy.@k@v20/43000033. Looks like he didn''t have your trust, missy.@k@|@y@v20/43000034. That car in the basement was mine."'
23719: 'Ange@r@v11/42000333."Huh......?@k @v11/42000334.He was talking about you...?"'
23720: 'Amakusa@r@v20/43000035."I freaked out when the elevator was empty.@k@v20/43000036. If I hadn''t been able to listen in on their radio, who knows what would have happened by now."'
23721: 'Ange@r@v11/42000335."..................So...what?@k @v11/42000336.If I had obediently believed Okonogi-san and gone to the parking lot,@k@v11/42000337. there would have been no need for me to do that jump off the third floor...?"'
23722: 'Amakusa@r@v20/43000037."Pretty much.@k@v20/43000038. Well, it turned out alright in the end."'
23723: 'Ange@r@v11/42000338."........................"'
23724: '@r.........Well that''s something.'
23725: '@rIf I hadn''t suspected President Okonogi,@k ......I could have easily escaped without getting caught in a tough spot.'
23726: '@r"President Okonogi might have sold me out."'
23727: '@rNo, because paranoia told me that it was better to suppose that he sold me out, I assumed and decided that he did.'
23728: '@rBecause I wasn''t able to believe him,@k my truth, regardless of his truth, became "he sold me out"......'
23729: '@rI thought back on President Okonogi''s words.'
23730: '@rCan you really call truth "truth" if it isn''t absolute...?'
23731: '@rTruth can change completely depending on whether you have love or not.'
23732: '@rIn the end, ......perhaps this thing called "truth" doesn''t exist.'
23733: '@rFor each person who speaks of it, another truth is born from their interpretations—that''s all there is to it.'
23734: '@rIf I can''t accept something that indeterminate as truth,@k ......then where does the truth that I really want to find exist?@k ......And is that something that can be seen with the eyes?'
23735: '@rI might be surprised to discover...that even if the truth is thrust in front of me,@k ......it may be something that I cannot ''see''...'
23736: 'Ange@r@v11/42000339."......Without love, it cannot be ''seen'', is it..."'
23737: 'BERNKASTEL@r@v28/42100018.".........This fragment of yours is very lively.@k@v28/42100019. It doesn''t bore me."'
23738: 'Ange@r@v11/42000340."You said to me.@k@v11/42000341. You told me to search for the truth of twelve years ago.@k@v11/42000342. ......But I feel like it''s not really clear to me anymore."'
23739: 'BERNKASTEL@r@v28/42100020."What isn''t?"'
23740: 'Ange@r@v11/42000343."......What is truth?@k @v11/42000344.There are as many truths as there are people.@k@v11/42000345. There are as many interpretations as there are people.@k@v11/42000346. And those can be twisted by opinions and changed indefinitely.@k@v11/42000347. ......Is truth really that indeterminate and vague?"'
23741: 'BERNKASTEL@r@v28/42100021."It is.@k@v28/42100022. ......Truth is indeterminate.@k@v28/42100023. It can be like a particle, or like a wave, and it can hold conflicting forms at the same time."'
23742: 'BERNKASTEL@r@v28/42100024."You are free to believe that the cat in the box is alive, or that it is dead.@k@v28/42100025. ......But the truth is very delicate.@k@v28/42100026. It changes its appearance just by being observed."'
23743: 'Ange@r@v11/42000348."You''re talking about that Schroedinger''s cat box?@k @v11/42000349..........Nonsense.@k@v11/42000350. If you open the box, you learn the truth.@k@v11/42000351. Debating what happens before you open it is armchair theorizing at best."'
23744: 'BERNKASTEL@r@v28/42100027."Yes.@k@v28/42100028. And yet, in order to deny those armchair theories, you need to open the box.@k@v28/42100029. ......If a box cannot be opened, any and all ideas about its contents are impossible to disprove.@k@v28/42100030. In other words, truth."'
23745: 'Ange@r@v11/42000352.".........As long as truth can''t be denied, it keeps its form."'
23746: 'BERNKASTEL@r@v28/42100031."That''s right.@k@v28/42100032. As long as truth can''t be observed, it keeps its form."'
23747: 'Ange@r@v11/42000353."So, any reckless statement can suffice as truth if it can''t be exposed as a lie."'
23748: 'BERNKASTEL@r@v28/42100033."Yes.@k@v28/42100034. ......Even if they contradict each other, endless ideas can exist as truth at the same time without being negated."'
23749: 'Ange@r@v11/42000354.".........So even something as screwed up as my family being captured by the Rokkenjima witch and imprisoned twelve years in the past for all eternity...@k@v11/42000355.can exist as truth as long as we don''t know what happened twelve years ago..."'
23750: 'BERNKASTEL@r@v28/42100035."Twelve years ago, on Rokkenjima, the witch called BEATRICE wrenched open a space for "endless" imagination, and swallowed everything up into it, using it as a cat box.@k@v28/42100036. ......Everything in the unopening box is truth."'
23751: '@rThat''s right.@k We don''t know what happened on that island, so it becomes endless.'
23752: 'Ange@r@v11/42000356."......So long as it remains closed, that is.@k@v11/42000357. All I have to do is wrench it open."'
23753: 'Ange@r@v11/42000358.".........But that box was closed up twelve years ago, and I don''t even know where it is.@k@v11/42000359. ......Even if I were to visit Rokkenjima, just what would I be able to learn, there on that desolated island, about what happened twelve years ago?"'
23754: 'BERNKASTEL@r@v28/42100037."Who knows?@k@v28/42100038. What could you learn, I wonder.@k@v28/42100039. .........In any event, that is something that can only be done by the person who is able to walk around freely in the world of 1998, twelve years in the future—@k@v28/42100040.the final witch, ANGE BEATRICE."'
23755: 'Ange@r@v11/42000360."........................"'
23756: 'BERNKASTEL@r@v28/42100041."BEATRICE''s game board spans the two days from October 4th to the 5th, 1986.@k@v28/42100042. In other words, this means that you are a piece who can move freely outside her game board.@k@v28/42100043. ......And even BEATRICE cannot influence this future that lies outside the game board."'
23757: 'Ange@r@v11/42000361."......When you put it like that, it sounds like I''m a pretty overpowered piece."'
23758: 'BERNKASTEL@r@v28/42100044."The future of twelve years later in which you are placed certainly is distant.@k@v28/42100045. However, the further in the future a piece is placed, the stronger the power it holds.@k@v28/42100046. ......I told you, didn''t I?@k @v28/42100047.Truth changes form when it''s observed."'
23759: 'Ange@r@v11/42000362."Come to think of it, I''ve heard something related to that.@k@v11/42000363. ......Even if one day, all of a sudden, a star in Centaurus were to explode,@k@v11/42000364. the light from that explosion would have to travel 4.4 light years, so it would take four and a half years to reach the Earth."'
23760: 'BERNKASTEL@r@v28/42100048."It would.@k@v28/42100049. In other words, even if the sun in Centaurus has already died, people on Earth wouldn''t be able to perceive that fact for four and a half years.@k@v28/42100050. ......Because no method of perception exists that is faster than the speed of light."'
23761: '@rAt the time we learn that the sun in Centaurus exploded...'
23762: '@r...we Earth people will paint over our past four and a half years of history with a new truth.@k@rWe will revise history with a new fact: that it exploded four and a half years ago.'
23763: '@rHowever, for the four-and-a-half-year period until we learn that, despite the fact that it has already died,@k the mistaken truth that the sun of Centaurus still exists will be able to exist as truth.'
23764: '@rThe truth of the future wins out over the truth of the past.'
23765: 'Ange@r@v11/42000365.".........That''s right.@k@v11/42000366. By itself, the Rokkenjima accident...@k@v11/42000367.would have given rise to nothing but suspicion of a murder plot revolving around Aunt Eva and the Ushiromiya estate."'
23766: 'Ange@r@v11/42000368."......But in the years that followed...@k@v11/42000369.it was dramatized through the occult, and the plot was painted over as the Legend of the Witch."'
23767: '@rEven though it was clamored over as a murder plot at the time of the incident,@k in later years, strange occult theories which claimed that it had been the work of a witch ran rampant, and began to paint over the truth of October 5th, 1986...'
23768: '@rThe murder theory will probably be forgotten over time.'
23769: '@r......And only the more bizarre, impressive witch theory will continue to remain as superstition, and eventually, paint over the murder theory entirely.'
23770: 'Ange@r@v11/42000370."Yes,@k@v11/42000371. the false truth that exists before the light from an exploding star reaches Earth is a lot like the human murder theory."'
23771: 'Ange@r@v11/42000372.".........The wine bottle with a letter inside that drifted ashore several years later, the "message bottle", began to retroactively paint over that theory with the occult witch theory."'
23772: 'Ange@r@v11/42000373."......That''s right.@k@v11/42000374. No witch existed during 1986.@k@v11/42000375. The witch took control of Rokkenjima because she was "observed" several years later by us humans of the future, thanks to that message bottle...!"'
23773: 'BERNKASTEL@r@v28/42100051."......A small revision is necessary.@k@v28/42100052. The witch could have existed even during 1986.@k@v28/42100053. As one of many endless possibilities."'
23774: 'Ange@r@v11/42000376."Certainly.@k@v11/42000377. Curled up in the cat box, which would disappear if observed.@k@v11/42000378. ......That''s why the message bottle is so pernicious."'
23775: 'Ange@r@v11/42000379."...The witch tried to get out of the box.@k@v11/42000380. She made it so that she would be observed, weeding out all possibilities other than the witch theory.@k@v11/42000381. ......In other words, to make it impossible for herself to be negated, she negated all possibilities other than the witch theory."'
23776: 'Ange@r@v11/42000382.".........Well, I''ll be damned.@k@v11/42000383. So in other words, BEATRICE satisfied the Devil''s Proof with a frontal attack.@k@v11/42000384. And that was part of the witch''s plan from the beginning."'
23777: 'BERNKASTEL@r@v28/42100054."The message bottle is information observed in the future after 1986.@k@v28/42100055. .........It cannot be observed by BEATRICE or Battler.@k@v28/42100056. ...It can only be observed by ANGE BEATRICE."'
23778: 'Ange@r@v11/42000385."......In truth, I didn''t want to investigate the message bottle.@k@v11/42000386. ...After all, reading it would be like listening to the witch''s side of the story.@k@v11/42000387. Since I''ve been ignoring all that mad raving about a witch theory, I thought of it as nothing more than a waste of time."'
23779: 'Ange@r@v11/42000388."......But Okonogi-san told me.@k@v11/42000389. You can''t see things in three dimensions with only one eye."'
23780: 'BERNKASTEL@r@v28/42100057."You mean that at the same time as looking at it from the viewpoint of denying witches, you must also look at it from the viewpoint of accepting witches?@k @v28/42100058.......That is the correct way to think.@k@v28/42100059. The number of viewpoints is like a denominator.@k@v28/42100060. If the number of viewpoints is 1, the mystery in the numerator doesn''t decrease in the slightest.@k@v28/42100061. However, the more your number of viewpoints increases, the more the mystery begins to be divided."'
23781: 'Ange@r@v11/42000390."I know that.@k@v11/42000391. ......The message bottle that washed up on a neighboring island several years after the crime.@k@v11/42000392. It passed into the hands of a dilettante.@k@v11/42000393. I''ve made an appointment, just in case."'
23782: '@r...I was able to hear Aunt Eva''s side from Okonogi-san.'
23783: '@rNext...would be the witch.@k Why not, I''ll listen.@k@rTo what BEATRICE has to say...!'