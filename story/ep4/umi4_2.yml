22903: '@r@v99/StuFA4001."Good day to you."'
22904: 'Ange@r@v11/42000118.".........G-...good day to you."'
22905: '@r"Good day to you" is the standard greeting used here.'
22906: '@rNo matter how many years pass by, this style of greeting still feels very awkward...'
22907: '@rI had responded to the greeting in order to stifle that awkward feeling,@k but the classmate who had spoken looked at me blankly.'
22908: '@r@v99/StuFA4002."......Oh?@k @v99/StuFA4003.*giggle*giggle*giggle*."'
22909: '@r@v99/StuFB4001."Ohhh? What''s this?@k @v99/StuFB4002.I think you must be mistaken, *giggle*giggle*..."'
22910: '@rTheir choice of words and manner were certainly what you would expect of a school for rich girls,@k but at their core, they were as innocent and cruel as any children of that age.'
22911: '@r......It seems they found it funny that I''d mistakenly thought the greeting had been directed at me.@k No, it might be the opposite.'
22912: '@r...Maybe I should say that they didn''t know what to do after being greeted by an introverted kid like me.'
22913: '@rNo, judging by the looks of my classmates, glancing this way over their shoulders and whispering to each other,@k there were even some who seemed to consider their refreshing morning ruined.'
22914: '@r......I am...depressing.@k Because no one likes me.'
22915: '@rSo, trying not to get in the way of everyone''s refreshing morning any more, I entered the classroom in a low crouch.'
22916: '@r......Almost like I was cutting across the aisle in a movie theater while the movie was running.'
22917: '@rThis is an all-dorm academy called Saint Lucia Academy.'
22918: '@rIt''s not a school that just anyone can get into simply by passing a test.@k@r...It''s a hidden rich-girls'' school, known only to a select group of celebrities from various circles.'
22919: '@rFor lofty nobles who truly wish their daughters to be brought up like saints,@k this is probably the ideal academy in which to protect them from the impurities of the common world.'
22920: '@r......But at the same time, it was probably also a convenient place for nobles to confine daughters who they didn''t want the public to know about.'
22921: '@rAs well as an academy isolated from the impurities of the common world, it also held excellent potential as a prison school.'
22922: '@rI was truly among the latter, and spent my days confined in Saint Lucia Academy,@k .........as the weeks, months, and years dragged on at a mind-numbing pace.'
22923: '@rOf course, there weren''t that many students like me, and you couldn''t tell us apart at a glance.'
22924: '@rHowever, even if they didn''t come forward, you could usually guess from their appearance.'
22925: '@r...Because they were always hanging their heads all the time, with an expression on their faces as though the whole world had abandoned them.'
22926: '@rAnd every class had one or two kids like that, so even if they didn''t speak up about it, you could guess who they were.'
22927: '@rSo.'
22928: '@rEven though I never confessed that I was one of those kids, at some point, everyone in the class knew......'
22929: '@rJust like how the seriousness of your injury grants you status in a hospital room, here, status is granted by the nobility of your birth.'
22930: '@rThose who aren''t permitted to go out in public are probably nothing more than filth to them.'
22931: '@rThey must think that getting involved with students like that would dirty them as well.'
22932: '@rWhenever such a rumor sprang up about a particular student,@k those fastidious girls would about-face and grow cold and distant, chasing that student out of all possible social groups.'
22933: '@rI have that to thank for this quiet and solitary school life of mine...'
22934: '@rWell, that''s only if hearing people whisper behind my back, finding my things lost or broken all the time,@k and having everyone pretend like they don''t know anything about it can be called a quiet school life.'
22935: '@rI must be wearing a weary expression already this morning.'
22936: '@r......I can understand completely why my other classmates, who had been enjoying a refreshing morning, would want to click their tongues upon seeing it.'
22937: '@rConsciously trying to do my best to avoid tainting my classmates'' morning, I quietly took my seat.'
22938: '@r......Then, unusually, someone came to talk to me.@k@rIt was the class leader.'
22939: '@r@v99/StuFC4001."Good day to you, Ushiromiya-san.@k@v99/StuFC4002. ......You seem to be in a bad mood this morning.@k@v99/StuFC4003. Are you certain you''re getting enough sleep?"'
22940: 'Ange@r@v11/42000119."............Is there some business you have with me?"'
22941: '@r@v99/StuFC4004."You do know you''re the only one who hasn''t submitted her questionnaire for the class presentation?@k @v99/StuFC4005.Did you forget that the deadline was yesterday?"'
22942: '@r...I''m pretty sure I heard something about that sometime last week.'
22943: '@rBut I think the questionnaire hadn''t been passed out yet.@k@rAll the necessary information would be written on that, so it should have been no problem to forget about it until it was handed out...'
22944: 'Ange@r@v11/42000120."......I wasn''t given a questionnaire..."'
22945: '@r@v99/StuFC4006."You must have been.@k@v99/StuFC4007. The dormitory leader distributed a copy to everyone.@k@v99/StuFC4008. If you lost it, all you have to do is honestly say so."'
22946: 'Ange@r@v11/42000121."............I lost it.@k@v11/42000122. I''ll fill it in right now, so could you give me a paper?"'
22947: '@rAgain.@k ......Either someone lost my paper, or they intentionally didn''t tell me about it.'
22948: '@rBut I have no way of knowing who was behind that.'
22949: '@rIn the end, treating it as though it was my own carelessness would settle everything more quickly and without any drama...'
22950: '@r@v99/StuFC4009."Once you''ve filled it out, drop it in the questionnaire box in the student council room yourself.@k@v99/StuFC4010. Our class is the only one, you know, that didn''t get everyone''s in by last night."'
22951: '@rAs I hung my head at the class leader''s scolding,@k I could hear the giggles and whispers of people watching, coming from no direction in particular...'
22952: '@rUshiromiya-san did it again.@k@rBecause she never concentrates.@k@rShe is unsuitable for this school.@k@rShe has neither class nor manners.'
22953: '@r......Sorry, girls, but I''ve dealt with much worse when it comes to unfair personal attacks.'
22954: '@rI froze my heart and let those arrows of ridicule pass by as I quickly filled out the questionnaire...'
22955: '@rWhen I heard the news that Mom, Dad, Onii-chan,@k and all the rest of my family had died, I was in the house of my grandpa on my mom''s side.'
22956: '@rThe only survivor of the accident was...Ushiromiya Eva.@k@r......Only Aunt Eva.'
22957: '@rEven at the time, I hadn''t really liked Aunt Eva.'
22958: '@rAt a glance, she seemed to act kindly to me,@k but even as young as I was, I could see clearly that she was somehow belittling Dad and the rest, and I didn''t like it.'
22959: '@rSo when it was decided that Aunt Eva would take care of me, I was pretty miserable.'
22960: '@rIt wouldn''t have mattered if my nice Uncle Hideyoshi and George onii-chan could have been there too,@k but I hated the thought of living all alone with Aunt Eva.'
22961: '@rI had an honest talk with Grandpa about that, hoping that I could live with him.'
22962: '@rHowever, Aunt Eva was very insistent that she should be the one to look after me.'
22963: '@rAunt Eva had no desire to remarry, so she said I was essential for the succession of the Ushiromiya family.'
22964: '@rAunt Eva felt very strongly about the House of Ushiromiya.'
22965: '@rShe firmly demanded to take charge of me right away, so that she could give me an education and lifestyle fitting for the successor.'
22966: '@rComplicated negotiations with lawyers apparently took place.@k@r...But in the end, I was forced to go live with Aunt Eva.'
22967: '@rAfter she took me in, Aunt Eva told me something.'
22968: '@rYou must bear all of the glory and history of the Ushiromiya family.'
22969: '@rAnd in order to make you a fitting successor to bear that, your life from now on will be dedicated to studying like hell.@k Sacrifice the rest of your life for the Ushiromiya family.'
22970: '@r......She was definitive about it.'
22971: '@rAt first, I thought she meant exactly what she said.'
22972: '@rBut I quickly realized that wasn''t the case.'
22973: '@rBecause even then, in Aunt Eva''s eyes,@k the one most fitting to be successor was George onii-chan, who had passed away.'
22974: '@rAt my first meal, I was strictly instructed and interrogated about my table manners,@k and was forced to listen to her disparage Mom and Dad as though they had been neglectful in my upbringing.'
22975: '@rI also received the same strict instructions regarding manners at my first party,@k and I was insulted in public for my clumsiness, and forced to endure insults to Mom and Dad as well.'
22976: '@rAfter that happened enough times, I finally came to understand.'
22977: '@rAunt Eva didn''t really want to make me the successor.'
22978: '@rShe thought that the one who was truly fitting to be the successor was George onii-chan,@k ......and she couldn''t forgive the fact that it was going to be me.'
22979: '@rSo I was disparaged in front of a lot of people.@k Humiliated.'
22980: '@rAnd she made it known far and wide exactly how inferior I was to George onii-chan,@k ......surely in memory of her dead son—@kno, ...she must still have been mourning his death.'
22981: '@r......However, that wasn''t something I could endure.@k@rI couldn''t possibly live together with Aunt Eva.'
22982: '@r......I would be eternally suffocated, continually compared with her dead son.'
22983: '@rEven as an elementary schooler, I understood that.'
22984: '@rI ran away from the House of Ushiromiya, and tried to go to my grandpa''s house.'
22985: '@rHowever, Aunt Eva had already foreseen that.'
22986: '@r...No, thinking back on it, she might have been luring me into escaping.'
22987: '@rI was caught by the guards and brought back,@k .........and for being a coward who had disgraced the Ushiromiya family crest and attempted to abandon the Ushiromiya name,@k .........I was punished,@w666. .........in a way that makes my whole body shake and shiver just remembering it.'
22988: '@rHow should I describe what Aunt Eva was like when she punished me?'
22989: '@rFrenzied?@k Gleeful?'
22990: '@r......The anger and sadness of losing her beloved son, and well as her hatred and pain towards the fact that I was going to steal the headship her son was meant to inherit.@k And the dark pleasure of being able to let those feelings out on me.'
22991: '@r......I was pummeled with all of those negative emotions at once.'
22992: '@rThen, all of my free time and freedom was taken away, and I was put under round-the-clock surveillance.'
22993: '@rI may have lived in a gorgeous mansion, and been dressed in expensive clothes,@k ...but my heart and my dignity were being trampled upon, and I was the Ushiromiya family''s slave,@w500. ...its cattle.'
22994: '@rCompared to that lifestyle, the derisive laughter of my classmates here even felt refreshing.@k ......It was no match for my heart...'
22995: '@rAfter filling in almost all of the fields of the questionnaire with "nothing in particular", I folded it up and put it in my pocket.'
22996: '@r......Because if I left it in the desk, I might "lose it" again.'
22997: '@rAfter dropping it off in the box in the student council room during lunch break,@k I finished lunch by myself, as usual, and headed behind the school building, where no one was around.'
22998: '@r......Only the time I spent by myself could protect me from the derisive laughter and whispered comments.'
22999: '@rSince I was hated and didn''t have a single friend, my time alone was the most kind to me.'
23000: '@rAfter checking the surrounding bushes to see whether some malicious classmates were hiding and threatening my time of quiet,@k I finally relaxed the tension from my entire body, knowing that I had gained some true peace.'
23001: '@rThen...I let out a sigh.@k ...It lingered, heavy, as though it was the first time I had breathed out today.'
23002: '@rMy previous favorite place behind the vegetable garden storehouse...@khad been found out by my classmates, and now they would mess with me there, so this was my new lunchtime hideaway...'
23003: '@rThere was nowhere to sit behind the school building.'
23004: '@rI crouched down against a wall in the shadow of the bushes, opened my bag, and took out a book with an elaborate, old-fashioned binding...'
23005: '@rJust glancing at it, you would probably think it was a religious book written in the Middle Ages or something.'
23006: '@rBut this isn''t a book.@k It''s a diary.'
23007: '@rOf course, it''s not my diary.@k@r.........There aren''t any special things worth writing about in my daily life.'
23008: '@rEvery single day is just gray, ...cold, and dry.@k@rWhen nothing changes from day to day, there aren''t any notable changes worth writing down.'
23009: '@rThis is......the diary of Maria onee-chan, who I had been very good friends with.'
23010: '@rShe was three years older than me and a bit of a funny person, but Onee-chan was always a warm, wonderful cousin.'
23011: '@rShe would always grab me by the hand and invite me to play some fun game.'
23012: '@r......I remember that getting to see her was the most enjoyable thing about family gatherings...'
23013: '@rThough I preface this with "for an elementary schooler", the handwriting that greeted me when I opened the diary was fairly accomplished,@k and while admittedly it had been written using every other line, the pages were dense with text.'
23014: '@rWas she just hopelessly obsessed with jotting everything down in her diary?@k@r......Probably...not.'
23015: '@rTo her, writing her daily life down in a diary was probably like having a conversation with another part of herself.'
23016: '@rSo rather than a journal in which the events of her day were simply listed,@k Maria onee-chan''s diary was written like a letter to another Maria, telling her of the events of that day.'
23017: '@rI had found this diary among her belongings after her death, and had secretly taken it home.'
23018: '@rAt first, I had felt that reading someone else''s diary might be boorish, and had been satisfied to just keep it by my side,@k ......but I was unable to resist turning over a page or two, and slowly but surely I found myself reading through it.'
23019: '@rAnd now, .........she had become my only friend.'
23020: '@rI gently opened to the page with the bookmark.'
23021: 'Ange@r@v11/42000123."......Sorry to keep you waiting, Maria onee-chan.@k@v11/42000124. ......Could you tell me more about your life...?"'
23022: '@rAt the same time,@w500. ......a very, very soft breeze blew, tickling the pages.'
23023: '@rAnd I thought the open diary might have sparkled faintly.'
23024: '@r......The weather is good today.@k@rMaria onee-chan loves wonderful rays of sunlight.'
23025: '@rSo I''m sure she''s in a good mood.'
23026: '@rOn the open diary, ...no, in the world of the diary, Maria onee-chan showed herself...'
23027: '@rShe had been nine, I believe, when she died.@k ......So her appearance was already younger than mine.'
23028: '@rBut I call her Onee-chan, and in turn, she fondly calls me just Ange.'
23029: 'Maria@r@v13/40400014."Uu.@k@v13/40400015. Ange, you were slow getting here today.@k@v13/40400016. Was it packed at lunch......?"'
23030: 'Ange@r@v11/42000125."......Yes.@k@v11/42000126. It''s always packed.@k@v11/42000127. Because groups of friends install themselves in the seats and stay there even after they''ve finished eating.@k@v11/42000128. It''s pretty fatal if you go to the dining hall late.@k@v11/42000129. ......I was on cleanup duty today."'
23031: 'Maria@r@v13/40400017."......Uu!@k @v13/40400018.I''m fast at eating!@k @v13/40400019.The faster you eat, the more you can play!@k @v13/40400020.Uu!"'
23032: '@rMaybe she noticed that I was still bitter about how that duty had been forced upon me, shortening my lunch break by a bit.'
23033: '@rMaria onee-chan brightly changed the subject.'
23034: '@rGrateful for that consideration, I responded that I eat slowly.'
23035: '@rMaria said something about how she''d teach me the trick to eating fast, and cheered me up.'
23036: '@rI read it in the diary.@k No, I heard it from Maria onee-chan.'
23037: '@rShe was once ranked number 1 among the girls on the speed-eating leaderboard in her grade''s newspaper.'
23038: '@rShe had been very proud of that, but had apparently been a little disappointed that her mother, Auntie Rosa, hadn''t praised her very much for it.'
23039: 'Maria@r@v13/40400021."Uu!@k @v13/40400022.Okay, so I''ll start today''s story.@k@v13/40400023. How far did we get yesterday?@k @v13/40400024.Uu?"'
23040: 'Ange@r@v11/42000130."Umm......@k@v11/42000131. This far.@k@v11/42000132. Up to when you got Sakutaro as a present.@k@v11/42000133. ......You promised that you would tell me about Sakutaro."'
23041: 'Maria@r@v13/40400025."Uu!@k @v13/40400026.Talk about Sakutaro!@k @v13/40400027.Sakutaro is...a reeeeally cute stuffed animal!@k @v13/40400028.I''m sure you''d like him too, Ange!@k@v13/40400029. Uu!"'
23042: 'Ange@r@v11/42000134."Yes.@k@v11/42000135. Tell me about that.@k@v11/42000136. ......The lunchtimes I spend listening to your stories are the only times I can feel relaxed at school."'
23043: 'Maria@r@v13/40400030."Uu!@k @v13/40400031.I''ll talk!@k @v13/40400032.So about Sakutaro, umm, umm!"'
23044: '@rWatching Maria onee-chan, who''s always in a good mood, makes my heart feel warm as well.'
23045: '@rAs I listened to her tale, I began to get absorbed into her world......'
23046: 'Rosa@r@v12/41400008."Happy birthday, Maria.@k@v12/41400009. Sorry I got back so late."'
23047: 'Maria@r@v13/40400033."Uu!@k @v13/40400034.Good job with your work, Mama!@k @v13/40400035.I know you''re busy, so, waited without crying even when you were late.@k@v13/40400036. Was good and waited, watching TV!"'
23048: 'Rosa@r@v12/41400010."Yes, you''re such a good girl, Maria.@k@v12/41400011. As a reward for waiting politely, you can order anything you want today.@k@v12/41400012. Of course, only as much as you can eat, okay?"'
23049: 'Maria@r@v13/40400037."Uu-uu!@k @v13/40400038.Can I change my corn soup to onion gratin soup today?!"'
23050: 'Rosa@r@v12/41400013."Yes, you can."'
23051: 'Maria@r@v13/40400039."Uu-uu!@k @v13/40400040.It''s 200 yen more, but can I even change it to prosciutto pizza?!"'
23052: 'Rosa@r@v12/41400014."Yes, you can.@k@v12/41400015. If you really can eat it.@k@v12/41400016. ......But what the hey.@k@v12/41400017. It is your birthday, after all.@k@v12/41400018. I have to reward you for being a good girl and waiting so patiently."'
23053: 'Maria@r@v13/40400041."Uu-uu-uu!@k @v13/40400042.Then, then, can I have enchilada cheesecake for dessert?!@k @v13/40400043.And, and, the chef''s choice fruit salad and kids'' french fries!@k @v13/40400044.Want to have a melon soda too!"'
23054: 'Maria@r@v13/40400045."Uu-uu-uu!@k @v13/40400046.I''m a good girl, I''m a good girl!@k @v13/40400047.Praised by Mama, uu-uu-uu♪"'
23055: 'Rosa@r@v12/41400019."*giggle*.@k@v12/41400020. You''re getting a little too excited.@k@v12/41400021. If you don''t quiet down a bit, you''ll disturb the other customers."'
23056: '@rWhen Rosa gently admonished her, Maria stuck her tongue out and eased up a little.@k ...But it seemed that she was having a hard time repressing her excitement at being able to eat out with her mother again after such a long time.'
23057: '@rToday was Maria''s birthday.'
23058: '@rRosa always spent Maria''s birthday at a wonderful restaurant.'
23059: '@rWhen Maria had still been in kindergarten, they had sometimes invited other kids from the neighborhood over and had a party at home.'
23060: '@rRosa would make a wonderful cake, and homemade sweets, and decorate the house herself, making it a huge celebration.'
23061: '@rBut after they moved and Maria no longer had any friends in the neighborhood, Rosa had started splurging at expensive restaurants instead.'
23062: '@rHowever, today, they were instead in a normal family restaurant.'
23063: '@rIt was also a little late in the day for a kid like Maria to eat there, even with a parent.'
23064: '@rRosa had actually gotten reservations at a fantastical place that Maria would absolutely have loved.@k Of course, she had also prepared a wonderful cake with Maria''s name written on it.'
23065: '@r......But Rosa just hadn''t been able to finish up her work, and had been forced to cancel.'
23066: '@rSince that had turned into a local family restaurant, Rosa felt a little indebted to Maria.'
23067: '@rSo she was prepared to spoil Maria a bit and let her have whatever she wanted tonight...'
23068: 'Ange@r@v11/42000137."......I thought you weren''t a very big eater, Maria onee-chan?@k @v11/42000138.Are you sure you''re going to be OK asking for this much?"'
23069: 'Maria@r@v13/40400048."Uu.@k@v13/40400049. I can''t eat very much, but I like it when there''s a lot lined up.@k@v13/40400050. You know, when you have a birthday table,@k @v13/40400051.and it''s all multicolored with red and blue and green and yellow, it makes you really happy!"'
23070: 'Ange@r@v11/42000139."...You''re right.@k@v11/42000140. When a birthday table is colorful, it does make you feel happy, doesn''t it?@k@v11/42000141. ......Birthdays at my place were no match for yours, Maria onee-chan, but I remember the cakes we bought at the cake shop in front of the station were always gorgeous..."'
23071: '@rAnge thought back to her own birthdays nostalgically.'
23072: '@rEven though Dad was busy, he sometimes came home just to show up at my birthday party, and then went right back to his company.'
23073: '@rI was sad at the time, but now I understand how important I was to Dad.'
23074: '@rOf course, Mom also took very good care of me.'
23075: '@rIn particular, she always had a really good sense in birthday presents,@k and sometimes arranged for them several months in advance.'
23076: '@rEven though we always sent an invitation to Battler onii-chan, he didn''t get along with Dad or something, so he didn''t always come.'
23077: '@r......So when he did come, I was really happy.'
23078: '@r...The birthday parties when the whole four-person family was together made for fun memories that I will never forget...'
23079: 'Maria@r@v13/40400052."Uu~.@k@v13/40400053. Your birthday looks like a lot of fun too.@k@v13/40400054. Battler and Uncle Rudolf are the life of the party.@k@|@y@v13/40400055. Noisy and laughing!@k@|@y@v13/40400056_b. Ah, Battler got covered in soda, ahahahaha."'
23080: '@rMaria onee-chan peeked into my happy memory.'
23081: '@rIt''s kind of embarrassing looking at myself, sitting quietly there, wearing the origami helmet that Dad had made as a party trick.'
23082: '@rIn my hand was a paper gun that Battler onii-chan had folded for me.@k@r...And Mom was taking a commemorative photo.@k@rIt was the happiest moment of my life.'
23083: 'Ange@r@v11/42000142."But your birthday''s just as good, Maria onee-chan.@k@v11/42000143. So, you get him today, right?@k @v11/42000144.Sakutaro."'
23084: 'Maria@r@v13/40400057."Uu!@k @v13/40400058.Was reeeally looking forward to it.@k@v13/40400059. Was so excited the whole time, wondering when Mama would show me the wrapped present in the side of her bag."'
23085: '@r"Sakutaro" is the name of the stuffed animal that Maria onee-chan was to receive as a present today.'
23086: '@rFor quite a long time, Auntie Rosa had been making a stuffed animal to give to her as a birthday present today.'
23087: '@rIt was apparently to be a cute lion stuffed animal,@k and Maria onee-chan had already given it the name Sakutaro even though she hadn''t received it yet.'
23088: '@rToday, she was looking forward to meeting Sakutaro even more than celebrating her own birthday.'
23089: '@rAuntie Rosa ran a clothing design company.'
23090: '@rIt did actually seem to have a brand name, too, for what that''s worth.@k@r......I think it was just called <Auntie Rosa>, in English...?'
23091: '@rThe slogan was supposedly "I can''t forgive the way I was before today".'
23092: '@r...Unfortunately, I''ve never met anyone who knew of that brand name.'
23093: '@rMaybe it wasn''t that famous.'
23094: '@rSo, in any case, Auntie was pretty skilled with her hands.@k@rI heard that some of the clothing she wears she made herself.'
23095: '@rSo making a stuffed animal had to be well within her capabilities.'
23096: 'Ange@r@v11/42000145."......A hand-made stuffed animal... That sounds kind of wonderful.@k@v11/42000146. By the way, why did you call it Sakutaro?"'
23097: 'Maria@r@v13/40400060."Uu.@k@v13/40400061. Actually wanted to call it "Sakura".@k@v13/40400062. But it''s a male lion, so I was told to give it a boy''s name."'
23098: 'Maria@r@v13/40400063."So I added a boy-like "tarou" and called him "Sakutarou".@k@v13/40400064. And I forget when the "u" at the end went away!"'
23099: 'Ange@r@v11/42000147."Why "Sakura"?"'
23100: 'Maria@r@v13/40400065."Uu!@k @v13/40400066.Main character in an anime on TV~!"'
23101: '@rThere was apparently a popular anime at the time whose main character was a girl called "Sakura".'
23102: '@r......The fact that she''d simply borrowed the name of a character she liked was, how should I say it, as innocent and cute as you''d expect from her age.'
23103: 'Maria@r@v13/40400067."Uu!@k @v13/40400068.Mama, Mama!@k @v13/40400069.Still no Sakutaro?@k @v13/40400070.Want to let Sakutaro join in my birthday too."'
23104: 'Rosa@r@v12/41400022."Presents always come at the end, remember?@k @v12/41400023.If you open it now, it''ll get dirty.@k@v12/41400024. Hold on until the meal is over."'
23105: 'Maria@r@v13/40400071."Then I''ll finish eating quickly!@k @v13/40400072.Uu-uu-uu!"'
23106: '@rAs soon as she proclaimed that, she started tearing into her meal.'
23107: '@rAuntie Rosa scolded her, telling her not to make a scene.@k@rIt seemed that she had seen it coming immediately.'
23108: '@rI had been thinking that, if I were as straightforward as Maria onee-chan, that would probably be exactly what I would do as well,@k so it brought a kind of warm smile to my face when my expectations weren''t betrayed.'
23109: '@rIn the end, Auntie Rosa succumbed to her daughter''s eyes sparkling with anticipation,@k cleaned up the table, and took out the long-awaited wrapped present.'
23110: 'Rosa@r@v12/41400025."Happy birthday, Maria.@k@v12/41400026. ......I couldn''t spend much time on it, so I couldn''t make it very well..."'
23111: 'Maria@r@v13/40400073."Uu!@k @v13/40400074.If you made it, Mama, I''m happy with anything!@k @v13/40400045.Uu-uu-uu!@k @v13/40400076.Sakutaro~, Sakutaro~, uu-uu!"'
23112: '@rAuntie Rosa spoke slightly humbly, but Maria onee-chan was ecstatic even before opening the wrapping.'
23113: '@r......I could really understand that feeling.@k It''s not a matter of quality.@k@rJust the fact that it was a handmade present was more pleasing than anything.'
23114: 'Maria@r@v13/40400077."Can I open it?@k @v13/40400078.Can I open it?!"'
23115: 'Rosa@r@v12/41400027."I''d really prefer you to leave it until we get back home,@v12/41400028. ......but, just for a bit, okay?@k @v12/41400029.We''ll just take a look and say hello, then put it back, alright?@k @v12/41400030.You can give him a proper greeting once we get home.@k @v12/41400031.We''re in public, so you can''t fool around, understand?@k @v12/41400032.Can you promise?"'
23116: 'Maria@r@v13/40400079."Uu!@k @v13/40400080.Promise promise!"@|@y'
23117: 'Maria@r@v13/40400081."So can I open it?@k @v13/40400083.Can I open ii~t?@k @v13/40400082.Mamaaa."'
23118: 'Rosa@r@v12/41400033."Yes, yes, but just for a bit, okay?"'
23119: 'Maria@r@v13/40400084."Yaaaaaaaaayyyy...☆"@|@y'
23120: '@rBefore Auntie Rosa finished her sentence, Maria onee-chan started unwrapping the present.'
23121: '@rAnd straight away, ......yellow and orange peeked out.'
23122: '@rWhat appeared was a slightly blank-looking stuffed lion,@k with cute round eyes and a cute white chest.'
23123: '@rIt was about the size of a small pillow.@k It looked pretty big held by a short person like Maria onee-chan, but it probably wasn''t that large.'
23124: '@rFrom the perspective of someone who didn''t know better, it would probably look like something cheap bought from a department store or something.'
23125: '@rBut to Maria onee-chan, it was her mother''s handmade stuffed animal, the only one of its kind in the world, and irreplaceable.'
23126: 'Maria@r@v13/40400085."Sakutaro~, Sakutaro~!!@k @v13/40400086.*giggle*giggle*!!@k @v13/40400087.Cute cute, reeeeally cute...!@k @v13/40400088.Thank you Mama, thank you Mama, thank you so much for making such a cute stuffed animal for me even though you''re so busy with your work...!!"'
23127: 'Rosa@r@v12/41400034."...Please don''t praise me so much, it makes me feel embarrassed.@k@v12/41400035. I couldn''t take much time, so I couldn''t make anything that good.@k@v12/41400036. I actually wanted to make one so big that you couldn''t wrap your arms around it..."'
23128: 'Maria@r@v13/40400089."No, this is good!@k @v13/40400090.With this size, we can always be together.@k@v13/40400091. We can go out together.@k@v13/40400092. Sakutaro~, I''m your onee-cha~n, uryu~☆"'
23129: 'Ange@r@v11/42000148."It really is a cute stuffed animal.@k@v11/42000149. So this kid is your best friend Sakutaro."'
23130: 'Maria@r@v13/40400093."Uu!@k @v13/40400094.Can''t go to school together, but we''re always, always together at home and he''s my best friend."'
23131: 'Maria@r@v13/40400095."You know, Sakutaro is verrry innocent and cute, and he''s always nice to me.@k@v13/40400096. Cheers me up when I''m feeling down, and plays a lot with me when I''m feeling good!"'
23132: 'Maria@r@v13/40400097."So I''m not lonely anymore.@k@v13/40400098. Not lonely when Mama is busy with work and I''m all alone, and even if no one plays with me at school, not lonely at all.@k@v13/40400099. Riiight, Sakutaro~, uryu~☆"'
23133: '@r......At school, Maria onee-chan was in similar circumstances to me.'
23134: '@rCompared to the other kids in her class, Maria onee-chan''s tempo was always a beat too slow.'
23135: '@rHer impressionability and way of thinking about things were a little peculiar, ......and she was a little too idiosyncratic to blend in with them.'
23136: '@rHer grades were low as well, and yet she was talkative when it came to her specialist field of the occult, which led to her being treated like a weirdo by everyone else in the class.'
23137: '@rIf she touches you, you''ll be cursed... Stuff like that.'
23138: '@rEveryone in the class acted like she was gross, made fun of her, and avoided her, it seems.'
23139: '@rBoys who bumped into Maria onee-chan...@k would start wiping that part of them off against the other boys, as if they''d gotten something dirty on them.'
23140: '@rThey would pick up her stuff between pinched fingers like it was something filthy and chase the other boys around with it.'
23141: '@rAs for the girls, they appeared to find even speaking to her unpleasant;@k they ignored her completely, giggling and sneering at her whenever she made a mistake.'
23142: 'Ange@r@v11/42000150."............It looks like bullying is the same in all eras.@k@v11/42000151. Humans really don''t advance.@k@v11/42000152. Go extinct already."'
23143: 'Maria@r@v13/40400100."......I''m sad to be bullied, but I think it can''t be helped."'
23144: 'Ange@r@v11/42000153."It can''t be helped...?@k @v11/42000154.Why...?"'
23145: 'Maria@r@v13/40400101."''Cause, there''s a rule that says, every class has to have one kid who gets picked on."'
23146: 'Ange@r@v11/42000155."......That''s a horrible rule.@k@v11/42000156. I want to find whoever made that and hit them over the head with a brick.@k@v11/42000157. The corner of it, obviously."'
23147: 'Maria@r@v13/40400102."If I wasn''t there anymore, I''m sure a new bullied kid would be chosen in my place.@k@|@y@v13/40400103. By staying strong, I can protect them."'
23148: '@rAs she said that, she smiled faintly.'
23149: '@r.........Maria onee-chan''s way of thinking really is unusual.'
23150: '@rAccording to her, there is always a witch residing in the place called school.'
23151: '@rNo, she says that anywhere that a lot of people gather will most certainly have a witch residing there.'
23152: '@rThe witch tries to make the students perish by disease or accidents, so that she can steal their souls.@k She sometimes also corrupts the souls, leading them down a path of evil.'
23153: '@rMaria onee-chan told me that an angel came, not content to let that happen.'
23154: 'Maria@r@v13/40400104."......And the angel, she tried to defeat that witch.@k@v13/40400105. But the witch was powerful, and the fight continued for seven days and seven nights, but even then, it still wasn''t over.@k@v13/40400106. The tired-out witch asked for a truce, and proposed this."'
23155: 'Ange@r@v11/42000158."I''ve heard this before.@k@v11/42000159. ......''Thus far, I have made half of the students in the class become sick or injured.@k@v11/42000160. But in exchange, I have protected the remaining half of the students from sickness and injury."'
23156: 'Ange@r@v11/42000161."Therefore, if you will make just one member of the class a sacrifice to me, if you will make them "the bullied kid",@k@v11/42000162. I shall protect all of the other students from sickness and injury'',@v11/42000163. .........wasn''t it?"'
23157: 'Maria@r@v13/40400107."Uu.@k@v13/40400108. The angel thought about it.@k@v13/40400109. Compared to half the class suffering misfortune, having only one person be the unlucky one would be much better.@k@v13/40400110. Plus, the witch was saying that she would protect the safety of all the other students, using her powerful magic."'
23158: 'Ange@r@v11/42000164."If there are forty students in a class,@k@v11/42000165. ......and the twenty victims are shrunk down to one, then nineteen people are saved.@k@v11/42000166. ......A truly logical proposal."'
23159: '@rI wonder if this fairy tale has some kind of motif.@k@rIf it''s a creation of Maria onee-chan, a nine year old girl, that would be pretty impressive.'
23160: 'Maria@r@v13/40400111."The angel decided to accept that proposal.@k@v13/40400112. So, through the single sacrifice, nineteen people were saved.@k@|@y@v13/40400113. ......So my role is important.@k@v13/40400114. The witch is protecting nineteen people."'
23161: 'Ange@r@v11/42000167."......Because of us becoming sacrifices?@k @v11/42000168..........Well, I don''t remember ever being thanked by those nineteen people."'
23162: '@r...Maria onee-chan''s thinking is too compassionate.'
23163: '@rThe miserableness of our situations is very similar.@k ......And yet, there''s a difference in our inner peace, just because of a small difference in our way of thinking?'
23164: 'Ange@r@v11/42000169."So then, aren''t you sad, Maria onee-chan...?"'
23165: 'Maria@r@v13/40400115."Uu.@k@v13/40400116. Not sad at all.@k@|@y@v13/40400117. ''Cause I''ll be together with Sakutaro from now on.@k@v13/40400118. Right?@k @v13/40400119.Sakutaro?"'
23166: 'Sakutarou@r@v33/44200001.''Uryuu! If I can be with Maria, I''m happy too~!'''
23167: 'Maria@r@v13/40400120."Look, Sakutaro is saying he''s happy too.@k@v13/40400121. Uu."'
23168: '@rMaria onee-chan held up the Sakutaro stuffed animal, playing both sides of the conversation herself.'
23169: '@rI don''t understand.@k ......But that''s exactly why I want to reach Maria onee-chan''s level.'
23170: '@r...It''s what makes me so strongly interested in her tale and her words.'
23171: 'Maria@r@v13/40400122."Ange, is it tough because you''re all alone......?"'
23172: 'Ange@r@v11/42000170."......It is tough.@k@v11/42000171. But, just the time when I can be with you like this is different.@k@v11/42000172. Because I''m not...all alone."'
23173: 'Maria@r@v13/40400123."Then if Sakutaro becomes your friend too, it''ll be even more fun.@k@v13/40400124. Uu!@k @v13/40400125.Okay, starting today, Sakutaro is your new friend!@k @v13/40400126.Right, Sakutaro~?"'
23174: 'Sakutarou@r@v33/44200002.''Uryu?@k @v33/44200003.I am...Ange''s friend...?@k @v33/44200004.Uryuu, Ange~!'''
23175: '@rSkillfully moving the stuffed animal like it was a puppet, Maria onee-chan made Sakutaro emote.'
23176: '@rShe was controlling him, but the charming way he waved his short hand and cocked his head to the side...@kmade it feel like he really was a new friend called Sakutaro.'
23177: '@rOf course, if you were to look at it with cold eyes,@k you would only see Maria onee-chan comforting mopey old me with a stuffed animal.'
23178: '@r......But that stuffed animal had definitely been imbued with a soul.'
23179: '@rThe soul of Maria onee-chan''s love.'
23180: '@rSo I accepted the existence of a being called Sakutaro inside that stuffed animal.'
23181: 'Maria@r@v13/40400127."Come on, say hi to Sakutaro, Ange.@k@v13/40400128. Come on, you say hi too, Sakutaro~☆"'
23182: 'Sakutarou@r@v33/44200005.''Uryu......?@k @v33/44200006.Is Ange...@v33/44200007....a scary person......?'''
23183: '@rAs Sakutaro timidly looked at me,@k he unexpectedly met my gaze, and hid behind Maria onee-chan''s back in surprise.'
23184: '@r......Maria onee-chan really is good at playing with stuffed animals.'
23185: 'Maria@r@v13/40400129."It''s okay, Sakutaro.@k@v13/40400130. Ange isn''t scary, she''s a very nice girl.@k@v13/40400131. Uu☆"'
23186: 'Sakutarou@r@v33/44200008.''...H-hello.@k@v33/44200009. I''m Sakutarou...@k@v33/44200010. ......Uryu......'''
23187: 'Ange@r@v11/42000173."*giggle*.@k@v11/42000174. ......Pleased to meet you, Sakutarou.@k@v11/42000175. I''m Ange.@k@v11/42000176. I''m glad to be your new friend."'
23188: '@rI held out my right hand as though asking for a handshake,@k and Sakutaro''s short hand was stuck out towards me, and lightly touched my index finger.'
23189: '@rAfter all, the size is all wrong for a handshake between a human and a stuffed animal.@k@rThis greeting by touching each other''s fingers was our handshake.'
23190: 'Maria@r@v13/40400132."Uu☆@k@v13/40400133. See, now you two are friends!@k @v13/40400134.Two people''s funner than one, and three people''s funner than two.@k@v13/40400135. Uu!"'
23191: 'Sakutarou@r@v33/44200011.''Uryu~!'''
23192: '@rMaria onee-chan had given the name "Sakutarou" to the stuffed animal she was going to receive on her birthday,@k and had warmed and expanded his existence in her heart for a long, long time.'
23193: '@rTherefore, even before she had met him, his existence had been sublimated into a personality.'
23194: '@rFrom the very first moment they met, the two of them were already friends.'
23195: '@rOf course, I don''t think anything could be as personified and loved as Sakutarou was,@k but that wasn''t anything extraordinary in Maria onee-chan''s eyes.'
23196: '@rShe loved the things she owned very much, treating them just like friends or beloved pets.'
23197: '@rMaybe it was partly that Auntie Rosa hadn''t let her keep a pet,@k or maybe just her innate desire to treat things as though they were precious.'
23198: '@r......Maybe it was that she was so isolated, she had been forced to find friends closer to home.'
23199: '@rBecause of all those various circumstances, this wasn''t anything extraordinary from her perspective.'
23200: '@rYet even so, Sakutarou, ......no, maybe I should call him Sakutaro like Maria onee-chan.'
23201: '@rIt was certain that Sakutaro was a stuffed animal,@k ...no, a friend, who was more loved than anything, or anyone.'
23202: 'Rosa@r@v12/41400037."Hello... It''s Mama.@k@v12/41400038. You''re in a good mood, do you have a friend over?"'
23203: 'Maria@r@v13/40400136."Uu!@k @v13/40400137.Playing with Sakutaro!@k @v13/40400138.Listen what he said, *giggle*giggle*!"'
23204: '@rIt was already past nine at night.'
23205: '@rRosa had asked out of surprise since this wasn''t an appropriate time for a friend to be over,@k but when she thought about it, Maria didn''t have any friends who would come over to play, did she...'
23206: '@rEven so, to think that she would have so much fun playing with that stuffed animal.'
23207: '@rRosa was very pleased that Maria had liked her birthday present so much.'
23208: 'Rosa@r@v12/41400039."I''m sorry.@k@v12/41400040. Mama just can''t get her work finished...@k@v12/41400041. We''re having a tough time with next season''s lineup.@k@v12/41400042. It looks like we''re finally starting to get noticed bit by bit, and I really want to somehow make an impact here that can meet their expectations..."'
23209: 'Maria@r@v13/40400139."Staying over again?@k @v13/40400140.Yep, that''s okay.@k@v13/40400141. Do your best, Mama!"'
23210: 'Rosa@r@v12/41400043."R-really?@k @v12/41400044.Thank you, Maria...@k@v12/41400045. Thanks for understanding about Mama''s work..."'
23211: '@rRosa was very surprised that Maria had accepted with such indifference that she couldn''t come home.'
23212: '@rTelling Maria that she would be coming home late or staying overnight had been a heavy burden for Rosa.'
23213: '@rMaria would start crying about how lonely she was on the other end of the phone, and it took a lot of time and effort to calm her down.'
23214: '@rTo think that Maria would accept it in such high spirits...'
23215: '@rIs this also thanks to Sakutarou?'
23216: '@r...Rosa was once again pleased that she had given such a good present.'
23217: 'Rosa@r@v12/41400046."I''ll make sure I can come back by this time tomorrow.@k@v12/41400047. Let''s eat dinner together tomorrow.@k@v12/41400048. You haven''t eaten dinner yet, have you, Maria?@k @v12/41400049.Buy a bento at the convenience store and eat that.@k@v12/41400050. No sweets, and no soda.@k@v12/41400051. Make sure you get a receipt with your change, understand?"'
23218: 'Maria@r@v13/40400142."Uu!@k @v13/40400143.Shopping with Sakutaro, shopping with Sakutaro...!"'
23219: 'Rosa@r@v12/41400052."H-hey!@k @v12/41400053.Not Sakutaro, have him watch over the house!"'
23220: '@rFrom Maria''s manner of speech, Rosa got the feeling that Maria had been going shopping with that stuffed animal without her knowing about it.'
23221: '@rRosa''s forehead creased, and after sourly telling Maria that she was absolutely not to, she hung up.'
23222: 'Maria@r@v13/40400144."Uu...@k@v13/40400145. Mama said I can''t go shopping with you..."'
23223: 'Sakutarou@r@v33/44200012.''Uryuu...@k@v33/44200013. Can''t go shopping with Maria...@k@v33/44200014. Staying home alone...will be lonely...'''
23224: 'Maria@r@v13/40400146."Why did Mama say not to go shopping with you...@k@v13/40400147. Uu..."'
23225: 'Sakutarou@r@v33/44200015.''Uryu...@k@v33/44200016. ......She must be...embarrassed for people to see you and me together...'''
23226: 'Maria@r@v13/40400148."......Embarrassed?@k @v13/40400149.Why?"'
23227: 'Sakutarou@r@v33/44200017.''Mama often says not to take me outside.@k@v33/44200018. And she usually words it like, no, you''re too old for that now...'''
23228: 'Maria@r@v13/40400150."Uu?@k @v13/40400151.But I''m not embarrassed at all to be with you."'
23229: 'Sakutarou@r@v33/44200019.''I am a lion, ...but I''m a stuffed animal.'''
23230: 'Maria@r@v13/40400152."You''re a lion and a stuffed animal, but you''re my friend.@k@v13/40400153. So let''s go out together☆@k @v13/40400154.Just when Mama isn''t around, as a secret.@k@v13/40400155. Uu?@k @v13/40400156.Are you embarrassed too?"'
23231: 'Sakutarou@r@v33/44200020.''I''m not embarrassed, but......@k@v33/44200021....uryu, ...the people outside are a little scary...'''
23232: 'Maria@r@v13/40400157."So that''s it!@k @v13/40400158.Okay, I''ll make it so you don''t have to be scared about going outside!@k @v13/40400159.Leave it to me, I''ve got something useful...!"'
23233: '@rMaria started fishing around her messy room.'
23234: '@rRosa often told her to clean it up, but she was just bad at cleaning up her room.'
23235: '@rHowever, she knew more or less where everything was.'
23236: '@rSo much so that whenever Rosa would take it upon herself to tidy up, Maria would have trouble finding things.'
23237: 'Maria@r@v13/40400160."Found it!@|@y@k @v13/40400161.Look, look, Sakutaro.@k@|@y@v13/40400162. A knapsa~ck!"'
23238: '@rMaria proudly held it up high.'
23239: '@rSakutaro looked at the gaping-open knapsack and shifted uneasily...'
23240: 'Sakutarou@r@v33/44200022.''Uryu...... Maria, you aren''t saying......'''
23241: 'Maria@r@v13/40400163."Uu!@k @v13/40400164.This way, we can go shopping together, and you won''t be scared!"'
23242: '@rMaria held Sakutaro up, and started stuffing him into the knapsack.'
23243: '@rAt first, she tried to stick him in head-first, but then he''d be upside-down and suffocate.@k So she pulled him out and tried pushing him in again, feet-first.'
23244: 'Sakutarou@r@v33/44200023.''Uryuu...!@k @v33/44200024.It''s tiiight and craaamped and daaark.@k@v33/44200025. Uryuu!@k @v33/44200026.Mmggh.'''
23245: 'Maria@r@v13/40400165."See, it''s alright.@k@v13/40400166. If you stick your head out, it isn''t cramped and it isn''t dark, so it won''t be scary.@k@v13/40400167. And it''s a good view.@k @v13/40400168.Uu!"'
23246: 'Sakutarou@r@v33/44200027.''Uryu, you''re right.@k@v33/44200028. ......Will it be okay for me to go shopping with you now...?'''
23247: 'Maria@r@v13/40400169."Yep, it''s okay now!@k @v13/40400170.What should we get for dinner tonight?!@k @v13/40400171.Come on, let''s go out, Sakutaro!@k @v13/40400172.Uu!"'
23248: 'Ange@r@v11/42000177."*giggle*.@k@v11/42000178. Looks like you''re having fun, Maria onee-chan."'
23249: 'Maria@r@v13/40400173."Yep, it''s reeeally fun.@k@v13/40400174. Even things that would be lonely and boring alone all become fun with Sakutaro.@k@v13/40400175. Any Human friend would have to go home when it gets late."'
23250: 'Maria@r@v13/40400176."But Sakutaro doesn''t go home, so he can be with me all the time.@k@v13/40400177. He''ll watch TV with me,@k@v13/40400178. be together even in the futon,@k@v13/40400179. and even hold my hand on scary nights with thunder."'
23251: 'Maria@r@v13/40400180."He''ll even chase away the monsters in the closet and under the bed.@k@v13/40400181. Sakutaro is reliable!"'
23252: 'Sakutarou@r@v33/44200029.''Uryu.@k@v33/44200030. I''m a lion, so if there''s any monsters that scare Maria, I''ll show my courage and chase them away.@k@v33/44200031. Uryuu, @b roar .@<gaooo@>.'''
23253: '@rThey were so close that it made me a little envious.'
23254: '@rI''m supposedly older than Maria onee-chan.'
23255: '@rBut I can call her nothing else; even now she stands above me like an older sister, and I am yet to reach her level.'
23256: '@r...If only I had a friend close by like Sakutaro.'
23257: 'Maria@r@v13/40400182."But both me and Sakutaro are friends close by!@k @v13/40400183.We''re aaallways right by your side.@k@|@y@v13/40400184. It''s just that your magic is weak, so you can''t perceive us unless you open my diary like this."'
23258: 'Ange@r@v11/42000179."......Perceive?@k @v11/42000180.You know some pretty difficult words, Maria onee-chan."'
23259: '@rAccording to her, this world is full of magic and spirits.'
23260: '@rAs natural and nearby as a light breeze.'
23261: 'Maria@r@v13/40400185."You don''t normally notice or see the wind,@k@v13/40400186. but when incense or something trails smoke, you can see it, right?"'
23262: 'Ange@r@v11/42000181."......Right.@k@v11/42000182. And even if you can''t see it, it is always nearby."'
23263: 'Maria@r@v13/40400187."That''s it.@k@v13/40400188. Me and Sakutaro are always really close by you, Ange.@k@v13/40400189. Gods and spirits and guardians, they''re always right next to us."'
23264: 'Maria@r@v13/40400190."But if you aren''t conscious of them, you can''t feel their existence.@k@v13/40400191. Like wind that can''t be seen with the eyes.@k@v13/40400192. But they are certainly near us, and if the smoke called magic draws trails, anyone can see them."'
23265: '@rI had thought that I could only meet Maria onee-chan when I opened this diary.'
23266: '@rBut from what she said, she was always with me, and I could meet her at any time if I truly desired to.'
23267: 'Maria@r@v13/40400193."Along with the records of my life, I left a fragment of my own soul in my diary.@k@v13/40400194. So the power of my magic resides in this diary.@k@v13/40400195. But it''s very faint, so no one other than you can detect it."'
23268: 'Ange@r@v11/42000183."......Only I...can tell?"'
23269: 'Maria@r@v13/40400196."Yep.@k@v13/40400197. After all, the power of a witch resides in you, just like it does in me!@k @v13/40400198.If you study hard, even you can definitely become a great witch in the future."'
23270: 'Ange@r@v11/42000184.".........A witch.@k@v11/42000185. I wonder if that''s fun."'
23271: 'Maria@r@v13/40400199."Uu!@k @v13/40400200.It is fun.@k@v13/40400201. If you do that, you''ll be able to tell that me and Sakutaro are always by your side, even without opening the diary."'
23272: 'Maria@r@v13/40400202."And then every day will be so much fun!@k @v13/40400203.And then I can introduce you to all my other friends.@k@v13/40400204. And then every day you''ll have a lot to do, and it''ll be very lively."'
23273: 'Ange@r@v11/42000186."That might be fun.@k@v11/42000187. ......I do have the grimoire you left behind, Maria onee-chan.@k@v11/42000188. I''ll try reading it seriously sometime soon.@k@v11/42000189. ......And then I won''t be all alone anymore,@v11/42000190. ...will I...?"'
23274: '@r@o75.@v13/40400205|33/44200032."Uu!"@r@t''Uryuu!'''
23275: '@rMaria onee-chan and Sakutaro said that at the same time, happy that I had developed an interest in the world of witches.'
23276: '@rWith half of Sakutaro''s face peeking out of the knapsack on her back,@k Maria walked through the late-night shopping district in high spirits.'
23277: '@rIt was only to be expected given the time.@k Everyone in the shopping district was either a shop owner lowering the shutters on their shop, or an employee rushing, or else staggering, back home.'
23278: '@rAmidst all that, Maria, in the best of moods as though she was hiking, probably stood out a great deal.'
23279: '@rThe occasionally passing employees glanced backwards over their shoulders at her with the eyes of someone seeing something out of place.'
23280: '@rOffice ladies giggled at the cute stuffed animal poking its head out of the knapsack.'
23281: '@rThe supermarket had been closed for a while by this time.@k However, the recently popular convenience stores stayed open until late into the night.'
23282: '@rIt was very convenient for Maria, whose mother''s return was often later still.'
23283: '@rMaria took the knapsack off her back, and hugging it close to her chest, she headed over to the sweet buns corner.'
23284: '@rShe pointed to each of the sweet buns she had eaten before, explaining to Sakutaro that this one was delicious,@k and that one was pretty good too.@k Sakutaro seemed to be enjoying it a lot.'
23285: 'Maria@r@v13/40400206."I''m going to haaave...the three-flavor bun!@k @v13/40400207.With just this one thing, you get to eat red bean jam and cream and strawberry jam!@k @v13/40400208.But sometimes it''s green pea jam or white bean jam.@k@v13/40400209. There should be one kind of bean jam."'
23286: 'Sakutarou@r@v33/44200033.''Uryuu!@k @v33/44200034.It sounds fun with all the different things inside.@k@v33/44200035. Uryu~!'''
23287: 'Maria@r@v13/40400210."And I''ll also have a...fruit yogurt!@k @v13/40400211.There''s fruit in it, but it isn''t a sweet, right?@k @v13/40400212.Yep, I''m sure Mama will be fine with it.@k@v13/40400213. Do you want one too, Sakutaro?"'
23288: 'Sakutarou@r@v33/44200036.''Uryu?@k @v33/44200037.Can I......?@k @v33/44200038.What about the money?'''
23289: 'Maria@r@v13/40400214."Uu, no proble~m!@k @v13/40400215.Look, it''s @b (5000 yen) .@<Shotoku Taishi@>, uu!@k @v13/40400216.So I can buy you whatever you want too, Sakutaro.@k@v13/40400217. Let''s eat together!@k @v13/40400218.Do you want a yogurt too?"'
23290: '@rWhen Maria made to grab another one of the same fruit yogurt, Sakutaro tilted his head as if he was a little worried.'
23291: 'Sakutarou@r@v33/44200039.''Uryu...@k@v33/44200040. But I can''t eat a big one, so a little one is fine.'''
23292: 'Maria@r@v13/40400219."Uu.@k@v13/40400220. Then what about this small yogurt?@k @v13/40400221.It''s 30 yen.@k@v13/40400222. That''s cheap."'
23293: 'Sakutarou@r@v33/44200041.''Uryu!@k @v33/44200042.That''s good enough for me.@k@v33/44200043. Yogurt with Maria!'''
23294: 'Maria@r@v13/40400223."Yogurt with Sakutaro!@k@v13/40400224. Uu!"'
23295: '@rMaria put the three-flavor bun and the two yogurts into a shopping basket, and brought them to the register.'
23296: '@rThe man working the register, previously in charge of the tobacco shop that had been in this spot until last year, rang her up.'
23297: '@r@v99/ShopMA4001."I seem to be seeing you a lot at this time of day, little lady.@k @v99/ShopMA4002.You''re a good girl, but next time come with your mother when you go shopping this late, alright?"'
23298: 'Maria@r@v13/40400225."Mama said it''s okay, so it''s alright!@k @v13/40400226.Mama always comes home late because of her work, but we aren''t lonely.@k@v13/40400227. Are we, Sakutaro?"'
23299: 'Sakutarou@r@v33/44200044.''Uryuu!'''
23300: '@r@v99/ShopMA4003."Really? That sounds tough.@k@v99/ShopMA4004. Here you go, I''ll throw in a free soda."'
23301: '@rThe man working at the store took a can of leftover soda or something from behind the register and packed it into the bag with everything else.'
23302: 'Maria@r@v13/40400228."Thank you, mister!@k @v13/40400229.Uu!@k @v13/40400230.Isn''t that great, Sakutaro?!"'
23303: 'Sakutarou@r@v33/44200045.''Uryuu!'''
23304: '@rSince she had been told not to buy soda, she couldn''t take it back home.'
23305: '@rSo she decided to drink it on her way back, and not bring the empty can back home.'
23306: '@rWith the plastic bag with the sweet bun in it hanging from her elbow,@k and hugging the knapsack with Sakutaro in it with that same arm, the two of them walked home drinking the soda...'
23307: 'Maria@r@v13/40400231."......Uu.@k@v13/40400232. Lemon and chili pepper soda tastes pretty weird...@k@v13/40400233. You want to try too, Sakutaro...?"'
23308: 'Sakutarou@r@v33/44200046.''Uryu?@k @v33/44200047..........Uryu-uryu-uryu, uryuu!!@k @v33/44200048.Pwhaaah.@k@v33/44200049. ...Uryuuuu, that was mean, Maria...@k@v33/44200050. Nasssty......'''
23309: 'Maria@r@v13/40400234."It sure is, uu-uu."'
23310: '@rOf course, it''s not like she could actually make a stuffed animal drink soda.'
23311: '@rShe just put the can to Sakutaro''s mouth and pretended to tilt it.'
23312: '@rBut it was great fun for Maria to share the taste of this weird drink that she had gotten for free with Sakutaro...'
23313: '@rThere was a huge moon in the sky.'
23314: '@rAt times, that moon had been clouded by tears when Rosa had stayed over at work,@k and Maria had thrown a tantrum and been scolded by her mother.'
23315: '@rBut this moon was very warm, and it seemed to watch over the two of them as they enjoyed their trip home by themselves...'
23316: '@rMaria and Sakutaro.@k ......Ange watched the two of them go from behind.'
23317: 'Ange@r@v11/42000191."........................"'
23318: '@rWhat a...heartwarming sight.'
23319: '@rThe sight of Maria onee-chan and Sakutaro walking away together...@kmade it very difficult to remember the several occasions on which she had spent long nights crying because her mother hadn''t come home...'
23320: '@r......I couldn''t admit this to Maria onee-chan,@k ...but if I had been in the same position, even if I had given that stuffed animal the name Sakutarou,@k ...it wouldn''t have been anything more or less than a stuffed animal.'
23321: '@rAnyone can make a relationship which only distracts you from your loneliness.'
23322: '@rBut Maria onee-chan was different.@k@rSakutaro wasn''t a stuffed animal or a toy.'
23323: '@r......He was a real friend, and far from just distracting Maria from her loneliness,@k he changed the nights without her mother into a fun time where they could play all by themselves...'
23324: '@rWas it because Sakutarou was a special stuffed animal?@k@rBecause her mother had made it herself?@k@rBecause it was very, very cute?'
23325: '@r......Probably...not.'
23326: '@rIf there is a secret here, it doesn''t lie within Sakutarou.@k@r...I think it probably lies within Maria onee-chan.'
23327: 'Ange@r@v11/42000192.".........Is this the power of magic you were talking about, Maria onee-chan...?"'
23328: 'Maria@r@v13/40400235."Uu.@k@v13/40400236. To know magic is to notice a lot of friends right beside you who you never noticed before.@k@v13/40400237. It''s as fun as having a bunch of new toy shops pop up all over the neighborhood!"'
23329: '@r......If I, too, locked up in an academy without a single friend,@k ...had the same kind of power as Maria onee-chan, I wonder if I could make my days just a bit richer.'
23330: '@rI wonder if I would become able to honestly shed tears on the nights I feel like crying—and crack a smile when the nights are gray.'
23331: 'Maria@r@v13/40400238."Yep.@k@v13/40400239. You could.@k@v13/40400240. You can, Ange.@k@v13/40400241. After all, you also have the qualifications to become a witch."'
23332: 'Ange@r@v11/42000193.".........The qualifications...to become a witch."'
23333: 'Maria@r@v13/40400242."I also have the qualifications to become a witch.@k@v13/40400243. So I still have a lot more studying and training to do."'
23334: 'Maria@r@v13/40400244."I know we''ll become wonderful witches, flying in the sky on our brooms, and drawing rainbows with our wands, making candy fall from the sky.@k@v13/40400245. I know I can do it.@k@v13/40400246. And when I do, I''ll show you too.@k@v13/40400247. It''ll be like a scene from a wonderful dream."'
23335: '@rMaria onee-chan said that, making an absolute promise with her smile.'
23336: '@r......There''s no way we can become witches.@k But when I listen to her speak, I can believe that maybe...we really could.'
23337: '@rBecause the fact is......that on this troubled night, when not a single flower of a smile could bloom, her magic had certainly given birth to a smile.'
23338: 'Ange@r@v11/42000194."......I wonder if I can...@v11/42000195..........become a witch."'
23339: 'Maria@r@v13/40400248."You can.@k@v13/40400249. ......You got a little bit older, so your soul is slightly bound by gravity.@k@v13/40400250. So training might be tougher than for me."'
23340: 'Maria@r@v13/40400251."But you definitely can.@k@v13/40400252. After all, you''ve already experienced a glimpse of magic."'
23341: 'Ange@r@v11/42000196."I have?@k @v11/42000197.......Magic...?"'
23342: 'Maria@r@v13/40400253."Yep.@k@v13/40400254. Come on, look, I''m not in this world anymore, but you''ve summoned me, and you''re talking with me."'
23343: 'Ange@r@v11/42000198.".........This is...magic...?"'
23344: 'Maria@r@v13/40400255."Yep.@k@v13/40400256. You''ve filled the fragment of my soul that I left in the diary with magic, keeping me revived."'
23345: 'Maria@r@v13/40400257."Didn''t I just say it?@k @v13/40400258.You''re able to reunite with me, and have a conversation, and show a smile every once in a while, so you must have some magical talent, Ange.@k@v13/40400259. Maria onee-chan guarantees it.@k@v13/40400260. Uu!"'
23346: 'Ange@r@v11/42000199."...You told me just now, Onee-chan.@k@v11/42000200. That you''re actually nearby all the time, even though I''ve been thinking that I can only see you when I open the diary."'
23347: 'Ange@r@v11/42000201."......If I had more of the power of magic, I could see that,@k@v11/42000202. ...and, just like now, ......I could have a conversation with you...?@k @v11/42000203.Any time...?"'
23348: 'Maria@r@v13/40400261."Yep.@k@v13/40400262. We can talk any time.@k@v13/40400263. I''m always by your side to say good morning, and I''m even there during class.@k@v13/40400264. Let''s talk together during boring classes to take your mind off things."'
23349: 'Maria@r@v13/40400265."I can also be someone to talk to during meals, so let''s always be together like this during lunch break."'
23350: 'Maria@r@v13/40400266."I''m with you after school too, and of course, I''m always by your side even when you return to the dormitory.@k@v13/40400267. ...It''s just that you never look at me except when you open the diary."'
23351: 'Ange@r@v11/42000204."............Even if I close the diary,@v11/42000205. ...you''ll be...@v11/42000206.by my side, right?"'
23352: 'Maria@r@v13/40400268."Yep.@k@v13/40400269. I''ll be there.@k@v13/40400270. So if you try to ''see'' me and try to talk to me, I can definitely answer.@k@v13/40400271. ......If you look hard and try to talk."'
23353: 'Ange@r@v11/42000207."............I''ll...@v11/42000208.......give it a try."'
23354: 'Maria@r@v13/40400272."It won''t be easy, you know?@k @v13/40400273.It''s not going to go great right from the start, okay?"'
23355: 'Ange@r@v11/42000209.".........I understand.@k@v11/42000210. I''m sure it won''t be easy.@k@|@y@v11/42000211. ......But I...@v11/42000212.......want to be like you, Maria onee-chan........."'
23356: 'Maria@r@v13/40400274."Uu.@k@v13/40400275. Okay.@k@v13/40400276. .........Then look at me closely.@k@v13/40400277. Look hard."'
23357: 'Ange@r@v11/42000213."......Yeah."'
23358: 'Maria@r@v13/40400278."Practice slowly closing your eyes and opening them again.@k@v13/40400279. ...Don''t start shutting them for a long time right away.@k@v13/40400280. Burn me into your eyes, then try to blend that onto the inside of your eyelids..."'
23359: 'Ange@r@v11/42000214.".........Yeah,@v11/42000215. ......I''m doing it."'
23360: 'Maria@r@v13/40400281."Once you can visualize me even with your eyes closed,@k@v13/40400282. .........without changing anything, slowly and softly close your eyes.@k@v13/40400283. .........Well?@k @v13/40400284.Still ''see'' me?"'
23361: 'Ange@r@v11/42000216."Y-......yes.@k@v11/42000217. ...I think...I can probably ''see'' you..."'
23362: 'Maria@r@v13/40400285."Okay, open your eyes again for a second.@k@|@y@v13/40400286. .........Time for the real thing.@k@v13/40400287. Calm your heart, and close the diary.@k@v13/40400288. ......When you do, I might disappear for a little while."'
23363: 'Maria@r@v13/40400289."But calm your heart and don''t rush.@k@v13/40400290. ......Then, try to blend me back from the inside of your eyelids, back into your eyes again.@k@v13/40400291. ...Slowly visualize me in the empty air.@k@v13/40400292. ......In the empty air...''see'' me."'
23364: 'Ange@r@v11/42000218.".....................@k@v11/42000219. ......Okay, I can do this.@k@|@y@v11/42000220. ............Right,@v11/42000221. .........I''m closing it,@v11/42000222. the diary."'
23365: 'Maria@r@v13/40400293."Uu."'
23366: '@rSlowly.........@w500....I closed the diary.'
23367: '@rWhen I closed the diary, ......a gray reality filled with dull air unfolded.'
23368: '@rOf course, Maria onee-chan''s form disappeared.'
23369: '@r......Give it all you''ve got, have courage.@k@r...Take the first step into the world of witches.'
23370: '@rI felt like Maria onee-chan was cheering me on inside my heart.'
23371: '@rCheering me on?@k Really?@k@rIsn''t that just what I''d like to imagine...?'
23372: '@rNo, that''s not it.@k@rI just convince myself that it is...and that''s why I cannot ''see'' her.'
23373: '@rMaria onee-chan is always by my side.@k And even now, she''s definitely there, cheering me on to do my best...'
23374: '@rAnd I...can hear it.@k So I mustn''t ignore it like it''s my imagination or the inner voice of my own heart......'
23375: '@r......Believe...@w500.that Maria onee-chan is there.'
23376: '@rI mustn''t doubt.@k ...I believe.@k@rOnee-chan said she''s always by my side.@k@rI must not doubt that...'
23377: '@rBut as I faced that empty space, that empty back wall of the school building,@k amidst those almost heartlessly boring rays of sunlight, calling out her name was so much easier said than done...'
23378: '@rThe chains of common sense which had clung to me until today sneered at me, telling me that calling out to the empty air was ridiculous...'
23379: '@rIt was almost like being told to take a step forward off the roof of a skyscraper overlooking a sea of lights.'
23380: '@r......Maria onee-chan was telling me.@k@r......That it''s alright, that I can do it.'
23381: '@rStop thinking that you might fall, or that it would be foolish to take a step off a roof,@k ......and free yourself from those chains of common sense...............'
23382: 'Ange@r@v11/42000223."...............whew.........@k@v11/42000224. .........haaah, ............@k@v11/42000225. .....................Yeah..."'
23383: '@rI steadied my breathing.@k@rI concentrated my mind.'
23384: '@rMake the form of Maria onee-chan you can see vividly on the inside of your eyelids...rise to the surface in the empty space before you.'
23385: '@r.........Understand magic,@w500. ......and ''see''...Onee-chan......'
23386: 'Ange@r@v11/42000226."............Maria...onee-chan.........!"'
23387: '@r@v99/StuFA4004."Huh?! @v99/StuFA4005. Is someone there?!"'
23388: '@rSuddenly answered by the sound of rustling bushes and a wild cry, I came to my senses.'
23389: '@rApparently I hadn''t been the only one behind the school building.@k@rNo, I''d been so immersed in the world of the diary that I hadn''t noticed that someone else had come afterwards.'
23390: '@rI recognized a group of three beyond the bushes.@k@r...They were girls from my class.'
23391: '@rIt felt as though they had come behind the school building to gossip about someone or talk in secret.'
23392: '@rI hurried out of that place.'
23393: '@rBecause if it became known that I had been alone in a place like this, mumbling to myself, it would probably create more things for me to deal with...'
23394: '@r@v99/StuFB4003."......She said that, right? She did say that?@k @v99/StuFB4004."Maria onee-chan" or something?!"'
23395: '@r@v99/StuFC4011."Messed up... I think the nutcase is seeing ghosts or something."'
23396: '@r@v99/StuFA4006."Pfff...*giggle*giggle*giggle*giggle*!@k @v99/StuFA4007.Ushiromiya-san is so~ funny...!"'
23397: '@rI could hear the shrill, loud laughter from behind.'
23398: '@rIrritated and feeling that Maria onee-chan had been made fun of,@k I left that place at a quick pace, and then a half-run once I turned the corner.'
23399: '@r......And I might have made it to Onee-chan''s world with just a little more time......'
23400: '@rFrustrating, aggravating... Why does everyone get in my way...@k@rI''ve never gotten in their way, not even once......!'
23401: '@rI ran and ran, but it still felt as though I could hear their shrill laughs......'