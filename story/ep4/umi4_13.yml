27700: '@r......It was......a pitch-black room.'
27701: '@rThere were no windows, and by the light from the weak bulb, one could only just barely make out the state of things around them.'
27702: '@rIt appeared to be an old, forgotten, dusty underground storehouse, with some kind of furniture haphazardly thrown into it......'
27703: '@rHowever, even with just a little light, one could at least tell that it probably wasn''t a storehouse.'
27704: '@r......Because that room was sealed off with iron bars.'
27705: 'Kyrie@r@v09/41300149."......Where...is this.........?"'
27706: 'Krauss@r@v02/40800137."Not a clue...@k@v02/40800138. ......Is this place underneath the mansion......?@k @v02/40800139.Was there this kind of room......directly underneath the dining hall......?"'
27707: '@rThey had been dropped into what had appeared to be a pit, and fallen into this room.'
27708: '@rTherefore, it would be appropriate to think that this room was directly below the dining hall.'
27709: '@r......However, not even Krauss could bring himself to believe that there were pitfalls rigged in the beloved dining hall, where he had enjoyed his meals for years,@k ...and that directly below it was this dungeon-like room.'
27710: '@rBut the ceiling, when they looked up, was made of rugged stone, ......and they could not understand from where in that ceiling they could have fallen.'
27711: '@rNo, all five people who had been dropped here thought the same thing.'
27712: '@rAlthough they had felt a sensation of being dropped into a pit,@k ......there was no way there could be pitfalls in the dining hall, nor could this dungeon-like place be directly underneath it.'
27713: '@r......But, in point of fact, they had fallen into this place, and were locked in.@k@r......And so, ...they were confused.'
27714: 'Nanjo@r@v19/41900043."......It is lucky that no one was hurt after falling from such a height..."'
27715: 'Krauss@r@v02/40800140.".........Shannon, Kanon.@k@v02/40800141. Did either of you two know about this room...?"'
27716: 'Kanon@r@v16/40600004."......No.@k@v16/40600005. We also have no knowledge of any room like this."'
27717: 'Kyrie@r@v09/41300150."..................Really...?"'
27718: 'Shannon@r@v15/40500015."R-really......@k@v15/40500016. We really......don''t know any room like this......"'
27719: '@rIt seemed that Kyrie thought that there was a good chance that, despite their age,@k they might know of the mansion''s secret tricks as servants permitted the One-winged Eagle.'
27720: '@rThere was a long silence, as if evaluating their answer...'
27721: 'Krauss@r@v02/40800142."......No, it''s probably true that they don''t know.@k@v02/40800143. Shannon is a very tidy person, after all."'
27722: 'Krauss@r@v02/40800144."If she had known about this room, it would probably have been scrubbed until it was sparkling.@k@v02/40800145. The filth of this room is proof that you two don''t know of it.@k@v02/40800146. ......More importantly than that, I think we should worry about what to do now, don''t you?"'
27723: 'Nanjo@r@v19/41900044."E-exactly......@k@v19/41900045. We need to call the police...o-or rather, call for medical assistance as soon as possible......"'
27724: '@rNanjo''s words rang hollow.'
27725: '@r...Obviously.'
27726: '@rSix people had been killed in the dining hall.@k@rThey had all witnessed the exact moments when the six had been killed.'
27727: '@rAnd what''s more, it had been done by half-destroying their heads—@kanyone could tell with just a single glance that they had been dealt a fatal injury.'
27728: '@rEveryone understood that calling for an ambulance now would be completely meaningless......'
27729: 'Kyrie@r@v09/41300151."Thank you, Doctor Nanjo.@k@v09/41300152. ......We already understand that our partners are no longer alive.@k@v09/41300153. .........Thanks for trying to console us by mentioning medical assistance."'
27730: 'Krauss@r@v02/40800147.".........Natsuhi......@k@v02/40800148. .............................."'
27731: '@rOnce again, an oppressive silence took control of them.'
27732: '@rBut Krauss shook his head harshly over and over, and decided just for now to forget the pain of losing his wife,@k and dedicate himself to figuring out where they were.'
27733: 'Krauss@r@v02/40800149."Everyone, listen to me.@k@v02/40800150. ...............Dad is...@v02/40800151..........beyond hope now.@k@v02/40800152. ...The time for words, and seeking comprehension or an explanation...@v02/40800153.is long past."'
27734: '@rNobody answered.'
27735: '@r......Without any kind of discussion or mercy, six people had been killed in an instant.'
27736: '@rAnd Kinzo had so boldly proclaimed for them to become sacrifices in a thirteen-person murder ritual.'
27737: '@r......Since they had been locked up in this place,@k they too would probably become the ritual''s next sacrifices before long.'
27738: '@rAround this time, their eyes were becoming used to the darkness,@k and, bit by bit, they were starting to be able to make out the dungeon''s interior.'
27739: '@r......What they thought was furniture haphazardly left in the dungeon turned out not to be furniture at all.'
27740: '@rThey were......small cages that could be used to imprison a single person, restraining tables, ......or were those torture racks?'
27741: '@r.....At any rate, it was obviously more ghastly than a mere jail cell.'
27742: '@rSince those objects were rusted and covered in thick layers of dust, there was no doubt that they had been long-forgotten.'
27743: '@r......Maybe you could even have called those things Kinzo''s sealed and forgotten madness.'
27744: '@rHowever, it was this room in which they had now been locked away.'
27745: '@r.........Those objects weren''t exactly comforting to people who were locked up,@k hoping to be released without harm...'
27746: 'Krauss@r@v02/40800154."......Anyway, let''s get out of here.@k@v02/40800155. We''ve lost loved ones and friends and would like to spend some time shedding tears,@k@v02/40800156. but more than that, ......I''m worried about the children."'
27747: 'Shannon@r@v15/40500017.".........I, ...I wonder if the children are safe......"'
27748: 'Krauss@r@v02/40800157."All we can do is pray...@k@|@y@v02/40800158. ......Come to think of it, Kumasawa-san and Gohda-san aren''t here."'
27749: 'Shannon@r@v15/40500018."Perhaps they were able to...get away safely..."'
27750: 'Nanjo@r@v19/41900046."You never know.@k@v19/41900047. It''d be a relief if they were able to meet up with the children..."'
27751: 'Shannon@r@v15/40500019."Gohda-san can be relied upon in times of crisis, and Kumasawa-san is knowledgeable and calm...@k@v15/40500020. I''m sure they would be helpful to the children..."'
27752: 'Krauss@r@v02/40800159."......Hahaha.@k@v02/40800160. I hope so."'
27753: '@rShannon and Krauss smiled bitterly a little.@k But they quickly realized how improper that was, and stopped, clearing their throats.'
27754: 'Kanon@r@v16/40600006.".........We can''t be too optimistic, Nee-san.@k@v16/40600007. There''s a chance that they have already been attacked, after we were."'
27755: 'Kyrie@r@v09/41300154."I agree.@k@v09/41300155. What Father carried out in the dining hall was...@v09/41300156....the six murders of the first twilight from the witch''s epitaph, right?@k @|@y@v09/41300157.Then, the second twilight is to "tear apart the two who are close"."'
27756: 'Kyrie@r@v09/41300158."......We can''t deny the possibility that Gohda-san and Kumasawa-san may have already been killed, having run away to hide together in close company.@k@v09/41300159. .........We can''t cling to the optimistic idea that they definitely got to the guesthouse and are protecting the children."'
27757: '@rKyrie coldly analyzed the worst-case scenario.'
27758: '@rEven for her, it was heartbreaking to have lost her beloved husband.@k@r......But right now, the most important thing was protecting that husband''s son,@k along with the other children, from becoming sacrifices to the insane family head.'
27759: '@rShe overcame her sadness with the parental urge to protect the children.'
27760: '@r......It seemed that both Kyrie and Krauss were strong enough to forget their grief, if only for the time being...'
27761: '@rThey could let their tears flow later.'
27762: '@r......For now, in order to protect the children, they had to act.'
27763: 'Krauss@r@v02/40800161."Anyway, let''s get out of here...@k@v02/40800162. It seems to be a rather old cell.@k@v02/40800163. Couldn''t we break the bars somehow?@k @v02/40800164.Let''s try searching the entire room for some way to escape."'
27764: 'Kyrie@r@v09/41300160."There''s all kinds of junk around here. I wonder if there are any tools lying around that we could use.@k@v09/41300161. There might be something that we could use as a weapon, or something that we could use to break the bars."'
27765: '@rKyrie pulled a lighter from her pocket.'
27766: '@rShe herself didn''t smoke, but she kept one tucked away in her pocket to light Rudolf''s cigarettes.'
27767: '@r......It was an extremely valuable source of light for searching through this dim dungeon.'
27768: 'Krauss@r@v02/40800165."Shannon, help Kyrie-san search the room.@k@v02/40800166. Kanon, you''ll help me check out the bars.@k@v02/40800167. This is a very old cell.@k@v02/40800168. The bars could be loose."'
27769: 'Nanjo@r@v19/41900048."Wh-what should I help with......?"'
27770: 'Krauss@r@v02/40800169."Please just keep up your strength.@k@v02/40800170. ......Father will probably come here before long.@k@v02/40800171. You''re the only one whose words will reach him.@k@v02/40800172. In a way, you might be holding our lives in your hands."'
27771: 'Nanjo@r@v19/41900049."......My words...will no longer reach him, I think.@k@v19/41900050. I''m sorry, but I don''t believe I will be of any use......"'
27772: 'Kyrie@r@v09/41300162."Then lend us your expertise as a doctor.@k@v09/41300163. .........I wonder if there is a drug that makes people instantly faint?"'
27773: 'Shannon@r@v15/40500021."......A drug that makes people instantly faint......?@k @v15/40500022.What are you talking about......?"'
27774: 'Kyrie@r@v09/41300164."We believe we fell through a pit, and landed in this dungeon.@k@v09/41300165. ......In that panic-stricken place, that''s what we believed happened."'
27775: 'Kyrie@r@v09/41300166."......But looking at how large this room is, I came to a realization.@k@v09/41300167. This dungeon cannot be underneath the dining hall."'
27776: 'Shannon@r@v15/40500023."How can you tell that it can''t...?"'
27777: 'Kanon@r@v16/40600008."............You''re an idiot, Nee-san.@k@v16/40600009. This dungeon is too narrow compared to the dining hall."'
27778: 'Kyrie@r@v09/41300168."Exactly.@k@v09/41300169. The first person to fall was Krauss nii-san.@k@v09/41300170. The second was myself.@k@v09/41300171. When you fell into this room, did you move from that spot, Krauss nii-san?"'
27779: 'Krauss@r@v02/40800173."......It''s embarrassing to say, but I lay there groaning in pain from the landing.@k@v02/40800174. Immediately after that, you came crashing down next to me."'
27780: 'Kyrie@r@v09/41300172."The distance between us as we stood in the dining hall, compared to where we landed, is clearly strange."'
27781: 'Nanjo@r@v19/41900051."C-...certainly, when you put it that way.@k@v19/41900052. ......I was the next to fall, so I remember fairly well where you two were standing.@k@v19/41900053. ......The distance between you two in the dining hall might have been greater than this entire room."'
27782: 'Kyrie@r@v09/41300173."We fell into a pit, and directly dropped down here.@k@v09/41300174. ......It''s not like we fell into multiple intersecting pipes, and were all collected together before falling down here."'
27783: 'Kyrie@r@v09/41300175."The fall was instant, wasn''t it?@k @v09/41300176.I don''t remember rolling around in some sort of elaborate water pipe system."'
27784: 'Krauss@r@v02/40800175."............Indeed, we can''t explain that with a pitfall.@k@v02/40800176. ...How strange."'
27785: 'Shannon@r@v15/40500024."What does that have to do with......the drug that makes people instantly faint that Kyrie-sama was talking about...?"'
27786: 'Kanon@r@v16/40600010."...........................@k@|@y@v16/40600011. ......Kyrie-sama is probably thinking that there were no pitfalls in the dining hall, I would guess."'
27787: 'Krauss@r@v02/40800177."But we did actually fall."'
27788: 'Kyrie@r@v09/41300177."To put it accurately, we had the feeling that we fell into a pit.@k@v09/41300178. ......It''s only natural.@k@v09/41300179. That''s the only way we could describe such an experience."'
27789: 'Nanjo@r@v19/41900054."I, I see......@k@v19/41900055. In other words, this is what you''re getting at..."'
27790: 'Nanjo@r@v19/41900056."......We were not dropped into a pit,@k@v19/41900057. ......but shot, for example, with something like a blowdart, lost consciousness instantly, and the instant we fell to the floor,@k@v19/41900058. it could be that we just remember that as though we fell into a pit......"'
27791: 'Krauss@r@v02/40800178."............I see.@k@v02/40800179. That''s a much more persuasive explanation than there being numerous pitfall traps in the dining hall that we''ve never noticed, even after decades eating there."'
27792: 'Kanon@r@v16/40600012."......Nee-san.@k@v16/40600013. Do you have a watch?"'
27793: 'Shannon@r@v15/40500025."Huh?@k @v15/40500026..........Y-...yes.@k@|@y@v15/40500027. I have a pocket watch.@k@v15/40500028. .........Umm, it''s about twenty to eleven."'
27794: 'Kanon@r@v16/40600014.".........Yes.@k@v16/40600015. My watch says the same.@k@|@y@v16/40600016. ...In short, it hasn''t been more than ten minutes since that chaos in the dining hall."'
27795: 'Krauss@r@v02/40800180."My watch likewise.@k@v02/40800181. ............That''s much too short a time to knock us out and carry us somewhere.@k@v02/40800182. .........Judging only from the time, it''s reasonable to think that we did fall through a hole leading directly underneath the dining hall."'
27796: 'Kyrie@r@v09/41300180."Watch hands are easily tampered with.@k@v09/41300181. ......While we were passed out, they may have wound everyone''s watch back.@k@v09/41300182. We are incapable of proving that this possibility doesn''t exist."'
27797: 'Nanjo@r@v19/41900059."...........................@k@v19/41900060. Whether a pitfall, or else a drug that induces fainting,@v19/41900061. ......it does not change the fact that we need to be on our guard..."'
27798: 'Kyrie@r@v09/41300183."......So, Doctor Nanjo?@k @v09/41300184.Is there a drug that can do that?"'
27799: 'Nanjo@r@v19/41900062."Well, ............@k@v19/41900063. ......It''s the same as your logic, Kyrie-san.@k@v19/41900064. ...I cannot prove that there is not a drug with that effect of which I do not know."'
27800: 'Kyrie@r@v09/41300185."......As they say, you can never be too careful.@k@v09/41300186. ...Sorry, it was a pointless question.@k@|@y@v09/41300187. Except, I think that with my hypothesis, I was able to suggest that this dungeon is not necessarily directly underneath the dining hall."'
27801: 'Krauss@r@v02/40800183."I see...@k@v02/40800184. .......There''s always the possibility that we were carried off to a dungeon in Father''s hidden mansion,@k@v02/40800185. which is rumored to be hidden somewhere in the middle of the vast forest.@k@v02/40800186. ......If we can escape from here and get outside, then we''ll know.@k@v02/40800187. We can save worrying about that until after we get out."'
27802: 'Kyrie@r@v09/41300188."Exactly.@k@v09/41300189. I''m truly sorry.@k@v09/41300190. I''ve only been asking and inquiring into useless things."'
27803: 'Krauss@r@v02/40800188."No, it''s quite reassuring.@k@v02/40800189. Please continue to tell us if you notice anything else.@k@v02/40800190. It might become a hint to escaping from here."'
27804: 'Krauss@r@v02/40800191.".........I always heard from Rudolf.@k@v02/40800192. He was always surprised by your ideas, and they would sometimes serve as valuable hints.@k@v02/40800193. ......The fact that you''re here is a blessing within a tragedy."'
27805: 'Kyrie@r@v09/41300191."......Thank you.@k@v09/41300192. Rudolf-san told me something about you, as well.@k@v09/41300193. He said that you usually act big, but when things get serious, you overflow with a sense of responsibility, and are a very dependable older brother."'
27806: 'Krauss@r@v02/40800194."Hahaha... That''s too kind.@k@|@y@v02/40800195. .........Dammit, these iron bars won''t even budge.@k@v02/40800196. How are things on your end, Kanon?"'
27807: 'Kanon@r@v16/40600017.".........No luck here either, I''m afraid."'
27808: '@rKrauss and Kanon tried wiggling each of the bars in various ways.'
27809: '@r......There were a few bars that could be twisted,@k and a few felt like they had enough room to rattle around a little bit,@k but even so, they could not be broken with human strength alone.'
27810: '@r......However, there was still hope if they could use some kind of lever-like tool.'
27811: '@rIt was still far too early to give up yet.'
27812: '@rThe children''s lives were hanging in the balance.@k ......Even if there was no hope, they couldn''t stop their struggle.'
27813: '@rAnd it was better even for them to act this way.'
27814: '@r......If they were to stop...there was no doubt that they would once again be overcome by the grief of losing their loved ones, and crouch down, clutching their knees......'
27815: 'Krauss@r@v02/40800197."How are you doing, Kyrie-san?@k@v02/40800198. Found anything?"'
27816: 'Kyrie@r@v09/41300194."......I''ve found some stones small enough to hide in a clenched fist.@k@v09/41300195. Even this might work as a weapon.@k@v09/41300196. Though, I''m sure it''d be impossible to whittle down those iron bars.@k@v09/41300197. How about you, Shannon-chan...?"'
27817: 'Shannon@r@v15/40500029."No, nothing."'
27818: 'Shannon@r@v15/40500030.".........Ah, this is...@v15/40500031.............a phone."'
27819: 'Kyrie@r@v09/41300198."There''s no way it''s connected.@k@|@y@v09/41300199. ......But, we might be able to use the cord for tying something up or as some form of weapon.@k@v09/41300200. If we break it and take it apart, we could take out the metal parts.@k@v09/41300201. Krauss nii-san, there is a keyhole for opening the cell, right?"'
27820: 'Krauss@r@v02/40800199."Yeah.@k@v02/40800200. It''s a pretty large hole, quite old fashioned.@k@v02/40800201. ......If we twist some wire into it, we just might be able to pick it."'
27821: 'Kyrie@r@v09/41300202."We might be able to use the metal parts of the phone as a substitute for something.@k@v09/41300203. ......This phone will become our weapon."'
27822: 'Krauss@r@v02/40800202."It''s the same as investing.@k@v02/40800203. Information is our weapon."'
27823: '@rKrauss and Kyrie laughed together at this way of putting the phone to use, which didn''t remotely look at it as a means of communication.'
27824: 'Kanon@r@v16/40600018."............What are you doing, Nee-san."'
27825: 'Shannon@r@v15/40500032."Ah, ......um, ...I just wondered if maybe...the phone was w-working......"'
27826: 'Kanon@r@v16/40600019."............(whisper) You dummy, Nee-san."'
27827: 'Shannon@r@v15/40500033."Huh...?@k @v15/40500034..........What?"'
27828: '@rSuddenly, Shannon let out a small surprised cry.'
27829: 'Shannon@r@v15/40500035."K-Kyrie-sama...!@k @v15/40500036......This phone, it''s connected."'
27830: 'Kyrie@r@v09/41300204."What did you say...?"'
27831: '@rIt was like when people move out of an office, taking everything with them, leaving only the telephone behind—@kthat''s the feeling the phone gave off, having been left in the corner of the cell.'
27832: '@rThe cord was wound into a coil, one end of it being swallowed by the wall,@k and at a glance, it looked as if it could plausibly be connected.'
27833: '@r......But, to think that it actually was...'
27834: '@rKyrie took the receiver from Shannon and pressed it to her ear.@k@rThe electric hum was certainly the one with which she was familiar.@k@r......This phone was indeed live.'
27835: 'Nanjo@r@v19/41900065."Wh-...what good luck...!@k @v19/41900066.Let''s contact the police...!"'
27836: 'Krauss@r@v02/40800204."Hold on...!@k @v02/40800205.This is too good to be true.@k@v02/40800206. Should we not suspect that it''s bugged...?!"'
27837: 'Kyrie@r@v09/41300205."If they were planning a trick like that, normally they would cut the telephone line.@k@v09/41300206. ......There''s a good possibility that they actually overlooked this."'
27838: 'Kyrie@r@v09/41300207."If they notice, the line might actually be cut for real.@k@v09/41300208. There''s nothing that we could tell the police that would be problematic for us if they overheard."'
27839: '@r......That did make sense.@k The point of a wiretap was to overhear some important piece of information,@k but the way things were now, they could not think of a single thing that would come up in a conversation to the outside world that could be troublesome to have heard.'
27840: '@rKyrie instantly concluded that it was more likely to be a mistake on Kinzo''s part than a trap......'
27841: 'Nanjo@r@v19/41900067."Y-...you do have a point......@k@|@y@v19/41900068. I believe that you start with 0 to make calls to the outside......"'
27842: 'Kyrie@r@v09/41300209."Kanon-kun, I''m going to make a phone call, so will you watch how things are out there for me?@k @v09/41300210.If you sense somebody coming, let me know."'
27843: 'Kanon@r@v16/40600021."Y-yes......!"'
27844: '@rKanon raced off towards the iron bars, silenced his breathing, and strained his ears......@k@rAs everyone present watched her, Kyrie dialed 110...'
27845: '@rHowever, she pushed the hook down repeatedly and redialed.'
27846: '@r......It didn''t seem to be working very well.'
27847: 'Kyrie@r@v09/41300211.".........The outside line begins with 0?@k @|@y@v09/41300212.110 would be 0110 then, right?@k @v09/41300213.It doesn''t seem to want to go through..."'
27848: 'Krauss@r@v02/40800207."Hand it over here, I''ll try to call......@k@v02/40800208. ..........................."'
27849: '@rKrauss took the receiver in Kyrie''s place, and tested various things......'
27850: '@rBut in the end, they were unable to notify the police......'
27851: '@rThe phone itself was definitely live, but the circuit was apparently cut somewhere.'
27852: '@r......Did this mean that "they" were not so naive?'
27853: 'Shannon@r@v15/40500037."......So it''s useless after all......"'
27854: 'Kyrie@r@v09/41300214."So our enemy is no pushover...@k@v09/41300215. ........................"'
27855: '@rKyrie let out a deep sigh, leaned against the wall, and hung her head for a while.'
27856: '@rAs tough a girl as she was, for a brief moment, she might actually have had the naive hope that the phone could actually work.'
27857: '@r......She sneered at herself mockingly for holding onto that naive hope for even one moment.'
27858: '@rAnd then, ......she thought back upon just what was happening here.'
27859: '@r......Honestly...despite having been shown such a thing right before her eyes, ......or rather, exactly because of that...'
27860: '@r......she still could not think of that gruesome mass murder as something real...@k@rIt was less that she couldn''t believe it, and more that she didn''t want to.'
27861: '@rUshiromiya Kinzo had killed six members of his family.'
27862: '@rHe had summoned strange, witch-like, demon-like people,@w500. ......right out of thin air, ......@k.........and with something like magic,@w500. ......he had begun to kill people one after another..........'
27863: '@r............................'
27864: '@rToo much to handle.@k ......Even though she definitely saw it, there was no way she could accept that spectacle......'
27865: 'Kyrie@r@v09/41300216.".........There''s no way that''s what happened.@k@v09/41300217. .........Those were obviously Grandfather''s friends, or something.@k@v09/41300218. ......They were just hiding somewhere in the dining hall beforehand, and used some trick to appear suddenly and surprise us.@k@v09/41300219. .........There''s no other way to explain something as screwed up as that."'
27866: '@rBut when those six had had their heads blown apart, a golden arrow had flown around and around the room.'
27867: '@r......That had truly looked like...@w500....magic.'
27868: '@rWas that another thing we just saw wrong?@k@rThere''s no way it was magic.@k There must be some kind of trick to it.'
27869: '@r......Since it was capable of smashing heads, there''s no doubt it was some explosive.'
27870: '@rFor example, a styrene toy plane like they sell at candy stores, painted gold,@k and with a powerful explosive loaded onto the end of it.'
27871: '@r.......That said, at a glance, it had seemed to be flying at random;@k Kyrie couldn''t imagine that such a thing could be fired six times, and each time perfectly hit the victim square in the head, one after the other.'
27872: '@rSurely its flight wasn''t computer-controlled to seek out and deliver precise hits on its targets,@k which would make it a high-tech styrene plane on the same level as a guided missile...?'
27873: 'Kyrie@r@v09/41300220.".........Would he invest such a large amount of money into developing some stupid trick like that?@k @v09/41300221.......For that insane entertainment......?@k @v09/41300222.Does this come back to the old "I wouldn''t put it past Father"......?"'
27874: '@rA number of mysterious people had appeared suddenly out of thin air,@k ......six people had had their heads demolished by a mysterious golden flying object,@k ......and the five of us were locked away in a mysterious dungeon by a mysterious set of pitfalls, or else put to sleep by some fainting poison dart......'
27875: '@rThe family conference started a bit after 10 p.m.@k@r......It''s only been about thirty minutes since then.'
27876: '@rProbably,@k those events, which took place in such a short amount of time,@k ......none of us are able to understand, nor come to grips with, even though we witnessed them ourselves.'
27877: '@rEven if we did get ahold of the police,@k it would probably be impossible for any of us to accurately explain what we saw......'
27878: '@rI may only just have witnessed it,@k ......but my brain''s fried, and I have no confidence even in what I myself saw...'
27879: '@rKyrie had to try her hardest to rouse herself from her overwhelming confusion, just to hold onto her sanity......'
27880: 'Krauss@r@v02/40800209."Dammit......what''s going on here,@v02/40800210. ......damn, ...dammit...!"'
27881: '@rKrauss started to become desperate, hitting the hook multiple times, and redialing over and over.'
27882: '@r......He too was feigning composure, but was unable to hide his panic.'
27883: '@rThe more he redialed, the more the pretense of serenity peeled away...'
27884: '@rNone of this makes any sense......'
27885: '@rKyrie couldn''t help but pray that the events that had just occurred were no more than a dream...'
27886: '@r.........Suddenly, the look on Krauss''s face changed.'
27887: 'Krauss@r@v02/40800211."Uh, o......oh...!@k @|@y@v02/40800212.I got through, I got through...!@k @v02/40800213.It''s ringing...!"'
27888: 'Nanjo@r@v19/41900069."R-really, Krauss-san...?!"'
27889: 'Krauss@r@v02/40800214."Yes, I see it now, the old man was shortsighted...!@k @v02/40800215.It seems that he cut the external line in an effort to prevent us from contacting the police, but he missed out on severing the internal line...!"'
27890: 'Kyrie@r@v09/41300223."Internal line?@k @v09/41300224.Krauss-san, where did you call...?!"'
27891: 'Krauss@r@v02/40800216."The guesthouse.@k@v02/40800217. I''m calling the room where Jessica and the rest are staying...!"'
27892: 'Krauss@r@v02/40800218."......Ah?!@k @v02/40800219.Hello!@k @v02/40800220.Hello?!@k @v02/40800221.It''s me...!@k @v02/40800222.Who is this...?!@k @v02/40800223.Gohda?!@k @v02/40800224.Is Jessica there, is she safe...?!!"'
27893: 'Gohda@r@v17/41700015."K-Krauss-sama......!!@k @|@y@v17/41700016.I''m so glad you''re safe...!!@k @v17/41700017.Yes!@k @v17/41700018.Milady Jessica and the other children are here as well, safe and unharmed...!"'
27894: 'Jessica@r@v04/40200032."Dad!!@k @v04/40200033.Is that you, Dad?!@k @v04/40200034.I''m so glad you''re okay......!!@k @v04/40200035.Is Mom okay?!@k @v04/40200036.Is she there?!"'
27895: 'Krauss@r@v02/40800225.".........M-......"'
27896: '@rKrauss choked on his words.'
27897: '@r......Krauss had clearly seen Natsuhi''s head crushed, had seen her killed right before his eyes......'
27898: '@rEventually, he was going to have to tell that to Jessica.'
27899: '@r......However, Krauss began to fret over whether he should tell her this very moment, and lost his words.'
27900: '@r......But even that was an answer under these circumstances......'
27901: 'Krauss@r@v02/40800226."......I don''t know about her......@k@v02/40800227. ......Let''s pray she''s safe.@k@v02/40800228. ...For now, I''m just glad you''re safe."'
27902: 'Jessica@r@v04/40200037."...........................Yeah.@k@v04/40200038. ......I understand.@k@v04/40200039. .........I''m sorry for......asking."'
27903: '@rJessica''s voice was filled with tears...@k ......There was no doubt for Krauss anymore.@k@rJessica and the others had been told everything, start to finish, by Gohda and Kumasawa when they had met up at the guesthouse...'
27904: '@rAfter they learned that six whole people had been killed,@k Jessica and the others must have been in a frenzy about wanting to go to the dining hall.'
27905: '@r.........Luckily he had been able to call before they stormed off towards the mansion.@k@rKrauss was relieved at his good timing during such tragedy...'
27906: 'Krauss@r@v02/40800229."We have Kyrie-san and Doctor Nanjo, as well as Shannon and Kanon here.@k@v02/40800230. We''re locked in a place that''s like a dungeon, but don''t worry.@k@v02/40800231. We''ll figure something out."'
27907: 'Jessica@r@v04/40200040."Dungeon?@k @v04/40200041.Where?!@k @v04/40200042.We''ll come save you...!!"'
27908: 'Krauss@r@v02/40800232."Unfortunately, we haven''t the slightest idea where this is either.@k@v02/40800233. We think it might be under the dining hall, but that might not be true.@k@v02/40800234. .........But anyway, Jessica.@k@v02/40800235. You must not leave there.@k@v02/40800236. You''ve heard from Gohda what happened?"'
27909: 'Jessica@r@v04/40200043."Yeah......@k@v04/40200044. ......Grandfather,@v04/40200045. .........he...@v04/40200046....... ———ed everyone......"'
27910: 'Krauss@r@v02/40800237."Grandfather isn''t in a sane state of mind right now.@k@v02/40800238. If you run into him, you''ll be in danger.@k@v02/40800239. You might be killed...!@k @v02/40800240.You mustn''t even think about trying to come and save us...!@k @v02/40800241.We''ll take care of ourselves."'
27911: 'Jessica@r@v04/40200047."Th-then what should we do?!@k @v04/40200048.Grandfather, you piece of shit, how dare you do that to Mom and the rest......!@k @v04/40200049.I''m gonna kill that worthless old bastard...!!"'
27912: 'Krauss@r@v02/40800242."Jessica, if you talk like that, you''ll sadden your mother.@k@v02/40800243. A lady doesn''t use those kinds of words."'
27913: 'Jessica@r@v04/40200050."Uuuuughhu......uuuuuhughhu......!!"'
27914: 'Krauss@r@v02/40800244."Anyway, you all put your own safety first.@k@v02/40800245. Lock up the guesthouse.@k@v02/40800246. ......But you mustn''t get complacent.@k@v02/40800247. The large window in the downstairs lounge might get broken."'
27915: 'Krauss@r@v02/40800248."Stay in the room you''re in, and use a bed to make a barricade.@k@v02/40800249. There''s a toilet and fridge in there too, right?@k @v02/40800250.You should be able to stay holed up until tomorrow morning."'
27916: 'Krauss@r@v02/40800251."......Alright, I''ll say it again... Don''t think of anything dangerous.@k@v02/40800252. And definitely don''t think about trying to take revenge for Mom!@k @v02/40800253.Think only of hiding and making it through this, and don''t provoke the enemy."'
27917: 'Jessica@r@v04/40200051."Yeah......mm....!!@k @v04/40200052.Okay, ......Dad......!@k @v04/40200053.Uuuuhhughuuuu!!"'
27918: '@rAfter that, Gohda took the phone,@k and was told again to watch over the children as a responsible adult.'
27919: '@r......Gohda repeatedly replied "Yes, sir!" in an overstrained voice, his face covered in cold sweat.'
27920: '@rFrom there, Kyrie received the phone and spoke with Battler, and when Shannon and Kanon got their turn, George and Jessica answered.@k And following that, Nanjo and Kumasawa picked up as well, so that all members of both sides had their turn on the phone,@k each encouraging the other and confirming that they were at least safe for now, even if their location was unknown,@k and coming to a complete understanding of the current situation for both sides.'
27921: '@rThey wanted to talk forever, but now was not the time to chat.'
27922: '@rKrauss told them that they would be hanging up for now, and those in the guesthouse agreed.'
27923: 'Krauss@r@v02/40800254."If anything else happens, we''ll call.@k@v02/40800255. Wait by the phone so you can pick it up quickly.@k@v02/40800256. Again, be careful.@k@v02/40800257. You mustn''t do anything rash...!"'
27924: 'Jessica@r@v04/40200054."Y-......yeah, I understand......@k@v04/40200055. Just knowing that you and......Kanon-kun and the rest are safe, ......that''s a win in my book......@k@v04/40200056. ...We''ll do our best.@k@v04/40200057. Please stay safe...!"'
27925: 'Krauss@r@v02/40800258."Yeah, of course.@k@v02/40800259. Well then, I''m hanging up for now.@k@v02/40800260. Be on your guard."'
27926: '@rWith that, the phone call ended.'
27927: '@rGohda and the rest of the men quickly descended the stairs, closed the shutters, and secured the strong locks on the doors.'
27928: '@rHowever, just as Krauss had worried, there was nothing that could be done about the beautiful wide window in the downstairs lounge.'
27929: '@rIf this were to be broken, it would be easy for them to get inside.'
27930: '@rIt wouldn''t be hard for someone like Kinzo, who hadn''t hesitated at committing murder, to invade the first floor.'
27931: 'George@r@v07/40300048."......It''s likely that Grandfather and his followers will be armed.@k@v07/40300049. Locking ourselves in this room is our best bet, and moreover our only method of staying locked down.@k@v07/40300050.......It''s painful that we have no choice but to stuff ourselves in a locked room, but if our enemies are carrying guns, then that''s the only method we have left to us."'
27932: 'Gohda@r@v17/41700019."Th-the Master is said to have a collection of working guns.@k@v17/41700020. .........That''s right, guns, that was a gun...@k@|@y@v17/41700021. If so, ......it''s a horribly powerful gun...!@k @v17/41700022.W-we can''t contend with that at all...!"'
27933: 'Battler@r@v10/40100309."............Smashing someone''s head, that takes a hell of a lot of force, right?@k @v10/40100310.It might be a magnum bullet, or something along those lines.@k@v10/40100311. That might go through a flimsy door like it''s nothing."'
27934: 'George@r@v07/40300051."If so, then that''s even more of a reason to barricade ourselves in the room...@k@v07/40300052. Let''s put up a bed and block the window too.@k@v07/40300053. ......If we do that much, then it doesn''t matter how many guns they''ve got, they shouldn''t be able to break in."'
27935: 'Battler@r@v10/40100312."Shit, ......is this passive, one-sided defense all we can do?@k@v10/40100313. ...Goddamn him, knocking off my dad, and even capturing Kyrie-san...@v10/40100314. ......You''re gonna pay for this, you old goat...!"'
27936: 'Gohda@r@v17/41700023."I-i-i-impossible, there''s no way we can go against them...!!@k @v17/41700024.Besides, it''s not just the Master, he has several underlings too!@k @v17/41700025.Th-there might even be more of them...!@k @v17/41700026..........Just what......are they......?"'
27937: '@rBattler was filled to the brim with the urge to get revenge for Rudolf,@k and to rush out of here to save Kyrie.'
27938: '@r......But just by looking at how terrified Gohda was, there was no doubt in him that this would be reckless...'
27939: 'Battler@r@v10/40100315."......It''s gotta be hard on you too, ......right, Aniki?@k@|@y@v10/40100316. And yet we''ve gotta stay holed up here, ......goddammit......"'
27940: 'George@r@v07/40300054."Of course, I''m torn up about it too.@k@v07/40300055. ......There''s no way I could remain calm with both of my parents murdered."'
27941: 'George@r@v07/40300056."But specifically because of that, I have to remain calm!@k @v07/40300057.Do you think that our murdered parents would want us to die in vain?@k @v07/40300058.There''s no way they would!@k @v07/40300059.They''d want for at least the children to escape."'
27942: 'George@r@v07/40300060."That''s why I''m going to survive.@k@v07/40300061. And I will report this to the police, and uncover everything.@k@v07/40300062. The courts will avenge my parents.@k@v07/40300063. That will be my revenge.@k@v07/40300064. ......There''s no way our parents would want us to die taking revenge for them.@k@v07/40300065. Right...?"'
27943: 'Battler@r@v10/40100317."...........................@k@v10/40100318. ......You''re right...@k@v10/40100319. You''re damn right...@k@|@y@v10/40100320. ......That old bastard, fuck your stupid ritual...!@k @v10/40100321.If you''re saying we''re gonna be sacrifices for that, then we''ll run away just to spite you, and fuck up the whole goddamn thing......"'
27944: 'George@r@v07/40300066."That''s the way.@k@v07/40300067. ......Besides, you still have Kyrie-san, Battler-kun.@k@v07/40300068. And I still have Shannon.@k@v07/40300069. Let''s just act cautiously and wait for our chance.@k@v07/40300070. Carelessness on our part might even work against the others who are captured."'
27945: 'Battler@r@v10/40100322."......Hostages, ......huh.@k@v10/40100323. .........But Grandfather captured them so he could use them as sacrifices, right?!@k @v10/40100324.If we don''t go and save them, then they''re just waiting to be killed, aren''t they?!"'
27946: 'George@r@v07/40300071."We don''t even know where the dungeon they''re being held in is...!@k @v07/40300072.Neither did Shannon or Kanon-kun, or of course Gohda-san or Kumasawa-san."'
27947: 'George@r@v07/40300073."The probability that they''re in a secret location that only Grandfather knows of is incredibly high.@k@v07/40300074. ...Under these circumstances, aimlessly wandering about is suicide!"'
27948: 'Battler@r@v10/40100325."......I, ......I know that...@k@v10/40100326. .........But still......goddammit......are you saying the only thing we can do is stay confined here until something happens......?"'
27949: 'Gohda@r@v17/41700027."Ba-......Battler-sama, I understand your feelings, but...@k@v17/41700028.......let''s put safety first...@k@|@y@v17/41700029. ......From what Krauss-sama said, they seem to be in a fairly old cell,@k@v17/41700030. and they may be able to break the bars somehow.@k@v17/41700031. ......The wise choice of action now is to believe in them and wait."'
27950: 'George@r@v07/40300075."Grandfather has a number of subordinates, and they''re all armed, correct...?"'
27951: 'Gohda@r@v17/41700032."Y-......yes, that is correct.@k@v17/41700033. .........And they''re probably...@v17/41700034.yes, all armed......"'
27952: '@rGohda had been able to say that Kinzo had others on his side,@k ......but he had not been able to mention that they were mostly all young women, like witches, ......and committed their murders using strange magic.'
27953: '@rIf he had said that, it would only have caused the others to doubt his sanity.'
27954: '@r...No, in fact, he himself still couldn''t understand what he had seen, and was doubting his own sanity.'
27955: '@r......But, regardless of sex or appearance, ......regardless of whether it was done with magic or a gun.'
27956: '@rThe fact that those girls had followed Kinzo''s orders,@k and killed six people in an instant...was an unshakable truth......'
27957: '@rIf those people came to attack the guesthouse as well, ......what would happen?'
27958: '@rJust closing the doors and windows like this was surely meaningless......'
27959: '@rGohda, ......as well as Kumasawa.'
27960: '@rThe only thing left for those two, who had witnessed that massacre in the dining hall,@k was to cradle their heads, not even knowing how to interpret what they had seen...'
27961: 'Maria@r@v13/40401238.".........Kumasawa-san, are you okay......?@k @v13/40401239.Want some tea......?"'
27962: 'Kumasawa@r@v18/41800011."H-hohohohoho...@k@v18/41800012. Thank you very much, yes, thank you...@k@v18/41800013. ...I''m sorry, but may I be left with my thoughts for a little while.........?"'
27963: '@rMaria tried to be nice, but it seemed that Kumasawa still wasn''t able to clear away her confusion.'
27964: 'Jessica@r@v04/40200058."......Maria, thanks for being considerate.@k@v04/40200059. Let''s let Kumasawa-san rest for now."'
27965: 'Maria@r@v13/40401240."......Uu."'
27966: '@rJessica too showed consideration for Kumasawa, certain of the shock she must have received after witnessing such a tragedy,@k ......but her imagination couldn''t even come close to the impossible scene Kumasawa had witnessed...'
27967: '@rNevertheless, with her mother having been killed, and her father having been captured,@k there was no way that Jessica could stay calm either.'
27968: '@rShe sealed her anxiety and sadness using her anger towards Kinzo, and walked irritatedly around the room.'
27969: 'Jessica@r@v04/40200060."............Kumasawa-san.@k@v04/40200061. Is Mom really.........dead?"'
27970: 'Kumasawa@r@v18/41800014."......Y-yes......@k@v18/41800015. ......I''ve never seen such a...horrible way to die before......"'
27971: 'Jessica@r@v04/40200062."It''s...not possible that she''s still alive,@v04/40200063. .........and with treatment, we could save her,@v04/40200064. ......is it......?"'
27972: 'Kumasawa@r@v18/41800016."...........................@k@v18/41800017. ......A-.........after such a thing happened to her head, it''s unimaginable that she could still be.........alive......"'
27973: 'Jessica@r@v04/40200065.".................................@k@v04/40200066. ......Well, yeah...@k@v04/40200067. ......If the head gets smashed,@v04/40200068. ......there''s normally no need for treatment, is there......"'
27974: '@rWhen Gohda had come flying into the guesthouse, overcome with agitation,@k he had told about the massacre in the dining hall without concealing anything.'
27975: '@r......Except for the part about the witches and magic, which they themselves still could not believe.'
27976: '@rIn other words, they hadn''t even sugarcoated the cold-blooded way in which Natsuhi and the others had died.'
27977: '@r......It was too late now, but Kumasawa regretted having obviously said too much......'
27978: '@rHowever, while lightly shaking her head and with a slightly painful laugh, Jessica spoke.'
27979: 'Jessica@r@v04/40200069."......No, if anything, I was able to stay level-headed thanks to what you told us."'
27980: 'Jessica@r@v04/40200070.".........If you''d avoided mentioning the part about her head being smashed,@k@v04/40200071. ...maybe I''d have said that she could still be alive,@k@v04/40200072. then ran off towards the mansion, straight into Grandfather, ......and I might have been killed."'
27981: 'Jessica@r@v04/40200073."......There''s a chance that sliver of hope would''ve been fatal.@k@v04/40200074. .........With that in mind, I''m grateful."'
27982: 'Kumasawa@r@v18/41800018."......I am deeply sorry.....@k@v18/41800019. I apologize for not choosing my words carefully..."'
27983: 'Jessica@r@v04/40200075."Don''t worry about it now.@k@v04/40200076. There''s nothing we can do about Mom now......but Dad''s still alive.@k@v04/40200077. Kanon-kun and Shannon, and Auntie Kyrie and Doctor Nanjo too."'
27984: 'Jessica@r@v04/40200078."......I want to save them somehow, so we shouldn''t do anything unnecessary that might be a burden to them.@k@v04/40200079. ......The most helpful thing we can do right now might be to wait by the phone."'
27985: '@rThere could be a phone call asking them to create a diversion to facilitate their escape.'
27986: '@rOr perhaps the others might learn their location, and call for rescue.'
27987: '@r......Jessica understood that in order to act promptly when that time came, the only thing they could do for the time being was to wait in this room...'
27988: '@rGeorge, Battler, and Gohda returned, having finished checking all of the locks downstairs.'
27989: '@rEach of the three was holding a bunch of different objects.'
27990: '@rGeorge had things like drinks, canned food, crackers, and other types of snacks that he had found in the lounge and pantry, as well as a first-aid kit.'
27991: '@rAll consumables that would be indispensable while they were locked down.'
27992: '@rGohda had a large folding ladder and carpentry tools.'
27993: '@rThose were so that, in the case of an emergency, they could nail over the door from the inside to seal it.@k@rIf it came to that, the ladder was for escaping out the window.'
27994: '@rBattler had brought up objects which could be used as weapons, such as blades and poles.'
27995: '@rThe kitchen knives went without saying; the disassembled table legs could be used as clubs;@k and the pole roughly the size of a person, which had been made by taking apart a hat stand,@k could surely be used as a spear, even though it had no point.'
27996: '@r......There was a good possibility that the enemies were carrying guns, so it was dubious whether these would be of any use.'
27997: '@rBut it was still better than not having them, and if those things could provide at least a little peace of mind, then they could also expect some kind of calming effect from them.'
27998: '@rThen, they placed beds and sofas from around the room up against the door, barricading it.'
27999: '@rThey didn''t go so far as to seal it up with nails.@k ......There was still the chance that Krauss and the others would escape, and come to meet up.'
28000: '@rThey had apparently set up a barricade at the top of the stairs as well.@k@rIt had been designed to create a racket, so it would work in place of a warning alarm as well.'
28001: '@rIt was apparently Battler''s idea.'
28002: '@rFor that reason, they turned the TV off.@k@r.........So that if the first-floor window were to be broken, they would know by the sound.'
28003: '@rOnce the switch had been turned off, all that was left was an eerie silence.'
28004: '@r......The sound of the violent wind and rain.@k Were they going to have to spend the whole night in such crushing suspense?'
28005: '@rThe boat was meant to be coming tomorrow morning.'
28006: '@rHowever, judging by the weather report, the typhoon was expected to continue all day tomorrow, and the boat probably wouldn''t come.'
28007: '@r......The typhoon would pass in the morning of the day after tomorrow.'
28008: '@rIn other words, the boat would be coming the morning of the day after tomorrow, ......as in, the morning of October 6th.'
28009: '@rAnd right now, it was late at night, October 4th.'
28010: '@r.........They would have to spend more than thirty hours on this island,@k with Kinzo turned cold-blooded murderer and his weird companions prowling about......'
28011: '@rEven with the shutters closed, there would definitely be a little bit of light seeping out.'
28012: '@rIt might let the enemy know that they were hiding here.'
28013: '@r......Battler suggested that it might be best to turn off the lights.'
28014: '@rBut they had already been taken over by such a ghastly feeling just from turning the TV off.'
28015: '@r.......There wasn''t anyone who directly challenged his proposal, but then again, there wasn''t a single other person who agreed to it.........'
28016: 'Maria@r@v13/40401241."......Uu.@k@v13/40401242. Can''t watch TV?"'
28017: 'Battler@r@v10/40100327."Yeah, sorry, but you''ll have to bear with it.@k@v10/40100328. ......We can''t afford to miss the sound of the enemy breaking in."'
28018: 'Maria@r@v13/40401243."........................@k@v13/40401244. ......Boring."'
28019: '@rEven though she had been told that her mother had died, Maria alone somehow didn''t seem to feel an approaching sense of danger.'
28020: '@rIt seemed she was quite displeased with having the TV turned off.'
28021: '@r.........Even with this bizarre situation in front of her, she can''t share our sense of danger?'
28022: '@r......Because she''s so young?'
28023: '@rTo Battler right now, seeing that young girl act in a way that was even slightly out of place...@kmade him feel that there was something very eerie about Maria......'
28024: 'Kyrie@r@v09/41300225."All that said.@k@v09/41300226. .........There''s nothing more to try.@k@v09/41300227. Do you think you''ll be able to do anything about the bars?"'
28025: 'Krauss@r@v02/40800261."......Unfortunately, they''re tougher than I imagined.@k@|@y@v02/40800262. I don''t know when these were made, but their durability is certainly up to snuff.@k@v02/40800263. These are truly made rather well."'
28026: '@rKyrie chuckled softly.@k@r......They had no moves they could make, but the mood had calmed just a little.'
28027: 'Nanjo@r@v19/41900070."......This place is just like where you place chess pieces once you''ve captured them.@k@v19/41900071. ......There is nothing left we can do, then......?"'
28028: 'Kyrie@r@v09/41300228."Not so fast.@k@v09/41300229. It''s still too early to give in.@k@v09/41300230. If we stop thinking, we might as well stop breathing, right?"'
28029: 'Krauss@r@v02/40800264."Exactly.@k@v02/40800265. ......Chess pieces taken aside may have no purpose, but there''s a great purpose for them in shogi.@k@|@y@v02/40800266. Just one captured pawn should be able to put pressure on the opponent."'
28030: 'Nanjo@r@v19/41900072."I see...@k@v19/41900073. But still, there''s nothing that can be done about these bars......"'
28031: 'Kyrie@r@v09/41300231."For us, maybe.@k@v09/41300232. .........But, if we can pinpoint where this is and contact Gohda-san, we might be able to get him to come and save us."'
28032: 'Nanjo@r@v19/41900074."I see...@k@v19/41900075. But that would mean forcing danger on Gohda-san......@k@|@y@v19/41900076. And I would also be worried for the children in the guesthouse, without a full-grown adult male..."'
28033: 'Krauss@r@v02/40800267."If you''re risk-averse, biding your time until the situation improves again is not a bad idea.@k@|@y@v02/40800268. ......However, if you don''t know when to cut your losses, what you have might become worthless scraps of paper.@k@v02/40800269. ......And what we have is our lives."'
28034: 'Kyrie@r@v09/41300233."Our dignity as parents, too, right?@k@v09/41300234. After talking big like that during the telephone call, and telling them that we''d handle it and they should stay put, we can''t just start asking for help right away.@k@v09/41300235. That would be very uncool.@k@v09/41300236. *giggle*."'
28035: 'Krauss@r@v02/40800270."At this point, pride is already worth less than nothing.@k@|@y@v02/40800271. .........Why don''t we put our heads together?@k@v02/40800272. Where is this?@k @v02/40800273.Is it really underneath the dining hall?@k @v02/40800274.Or else, is it a different place, separate from the mansion...?"'
28036: '@rKrauss, Kyrie, and Nanjo began to discuss their plans.'
28037: '@rKanon was squatting by the bars, silently trying to sense anyone''s presence.@k ......Just as he had been ordered.'
28038: '@rShannon came close to him, and they both squatted down together.'
28039: 'Shannon@r@v15/40500038."............Do you sense someone?"'
28040: 'Kanon@r@v16/40600022.".........Yes.@k@v16/40600023. ......They aren''t paying any attention in this direction, but there''s somebody relatively close by."'
28041: 'Shannon@r@v15/40500039."Is it Human...?"'
28042: 'Kanon@r@v16/40600024."............I think it''s the goats.@k@v16/40600025. Their breathing is really noisy."'
28043: '@rKanon''s ability to sense the presence of others was several levels above that of a Human.'
28044: '@rHe described their breathing as noisy, but Krauss and the rest couldn''t even pick up the slightest hint of it.'
28045: '@r......Therefore, even if he had simply reported it, they would merely have doubted his ears.'
28046: 'Shannon@r@v15/40500040."...............They got us, didn''t they."'
28047: 'Kanon@r@v16/40600026.".....................@k@v16/40600027. ......It''s unusual.@k@v16/40600028. For us to be captured without being killed."'
28048: 'Shannon@r@v15/40500041."This time, BEATRICE-sama didn''t make her appearance.@k@v15/40500042. And the Master left his study.@k@v15/40500043. ......I don''t have a clue what''s going on..."'
28049: 'Kanon@r@v16/40600029."I do.@k@v16/40600030. .........Whatever happens or changes, it''s all for that witch''s fickle entertainment.@k@v16/40600031. The result will be no different."'
28050: 'Shannon@r@v15/40500044."I wonder if this time we''ll be able to.........go to the Golden Land."'
28051: 'Kanon@r@v16/40600032."Who knows.@k@v16/40600033. We have a high rate of losing."'
28052: 'Shannon@r@v15/40500045."............Come to think of it, it''s a rare thing that both of us survived the first twilight, isn''t it?@k@v15/40500046. ......I get the feeling that it''s incredibly unusual for us to be able to talk together like this even though the ritual has already begun."'
28053: 'Kanon@r@v16/40600034."Maybe.@k@v16/40600035. ......But that''s still just for the witch''s entertainment.@k@v16/40600036. I''m not thinking of it as anything other than her letting us live just a little longer to ridicule us, since we usually drop out right in the beginning."'
28054: 'Shannon@r@v15/40500047."I wonder if........we''ll be unable to reach the Golden Land again."'
28055: 'Kanon@r@v16/40600037."I''m sure we won''t.@k@v16/40600038. ......If we hold onto any foolish hope, we''ll get taken advantage of again."'
28056: 'Shannon@r@v15/40500048."*giggle*.@k@v15/40500049. That''s right.@k@v15/40500050. Last time you got taken advantage of."'
28057: 'Kanon@r@v16/40600039."......I''m an idiot."'
28058: '@rKanon made a sour look, and turned his head.@k@r@|@yShannon laughed softly, and apologetically leaned towards his shoulder.'
28059: 'Shannon@r@v15/40500051."But......it''s nice to hear that Milady is safe, isn''t it?"'
28060: 'Kanon@r@v16/40600040."......She''s escaped the first twilight, that''s all.@k@v16/40600041. ......She might just be being made to wait for an even crueler death in a later twilight."'
28061: 'Kanon@r@v16/40600042."What about you, Nee-san?@k@v16/40600043. ......Aren''t you glad George-sama''s safe?@k@v16/40600044. It''d be nice if you two could reach the Golden Land together."'
28062: 'Shannon@r@v15/40500052.".........Thanks.@k@v15/40500053. I wish the same for you and Milady as well."'
28063: 'Kanon@r@v16/40600045."I, I don''t have my hopes up.@k@|@y@v16/40600046. .........It''s just as you say.@k@v16/40600047. All that witch is doing is having fun dangling prizes in front of people, and watching them flounder."'
28064: 'Kanon@r@v16/40600048.".........I''m sure no one will be able to go to the Golden Land.@k@v16/40600049. ......If I was foolish enough to wish to reach the Golden Land with Milady,@k@v16/40600050. .........that witch would find that very fun to toy with, and would certainly never let us reach there."'
28065: 'Shannon@r@v15/40500054."......You''re right.@k@v15/40500055. .........BEATRICE-sama is thinking about which order of sacrifices will be the most interesting."'
28066: 'Kanon@r@v16/40600051."The whole thing about them being chosen at random is just a blatant lie.@k@v16/40600052. That swindling witch...@k@v16/40600053. ......All that about having any wish you want granted in the Golden Land is probably just a lie."'
28067: 'Shannon@r@v15/40500056."..................That''s not true.@k@v15/40500057. The Golden Land is......a wonderful place."'
28068: 'Kanon@r@v16/40600054."Have you been there?"'
28069: 'Shannon@r@v15/40500058.".........Only for a little bit.@k@v15/40500059. Though, even that was probably just BEATRICE-sama''s joke."'
28070: 'Kanon@r@v16/40600055."...............What''s it like there?"'
28071: 'Shannon@r@v15/40500060."Well.@k@v15/40500061. .........It''s a wonderful place.@k@v15/40500062. ...I can''t really explain it well.@k@v15/40500063. It''s a world like a pleasant dream."'
28072: 'Kanon@r@v16/40600056."A paradise-like place, with roses blooming all over and beautiful butterflies dancing, or something like that?"'
28073: 'Shannon@r@v15/40500064."......It''s not a place with a tangible image like that.@k@v15/40500065. It really is like being in a dream.@k@v15/40500066. When you''re there, it''s very gentle, very peaceful,@k@v15/40500067. ......and you''re allowed to sleep as long as you want, like when you wake up early on your day off, lying under the covers."'
28074: 'Shannon@r@v15/40500068."......Sunlight comes in through the cracks in the curtains, and you think "I have to get up",@k@v15/40500069. but then you realize it''s your day off, and you can go back under the covers again...it''s a place where you can feel like that."'
28075: 'Kanon@r@v16/40600057."I''d feel annoyed that I got up at all.@k@v16/40600058. Getting up by accident even though it''s your day off is something only you would do, Nee-san.@k@v16/40600059. .........Go on?"'
28076: 'Shannon@r@v15/40500070."Well.@k@v15/40500071. While I was there, I felt very contented, and very calm.@k@v15/40500072. But once you return to this world, you can''t remember it well, even though you''ve only just been there."'
28077: 'Shannon@r@v15/40500073."It''s a lot like when you can''t remember a dream you were just having.@k@v15/40500074. ......But I still remember that it was a very calm and quiet world."'
28078: 'Kanon@r@v16/40600060.".........That''s it?@k @v16/40600061.Wow, that Golden Land she''s always bragging about isn''t much special at all.@k@v16/40600062. ......I thought it was a place where all your wishes come true."'
28079: 'Shannon@r@v15/40500075."It is.@k@v15/40500076. It''s a place where all your wishes will be granted.@k@v15/40500077. .........Well, maybe that''s not quite it.@k@v15/40500078. It might be better to say it''s a place where you don''t have to wish for anything."'
28080: 'Shannon@r@v15/40500079."......For example, if you were cold, Kanon-kun, and wished you had a jacket, you''d be happy to be given one,@k@v15/40500080. but if you were in a warm room to begin with, there wouldn''t even be a reason to want a jacket, right?"'
28081: 'Shannon@r@v15/40500081."......That''s what the Golden Land is like.@k@v15/40500082. There''s no need to even wish for most wishes.@k@v15/40500083. It''s a world released from everything, where everything is calm."'
28082: 'Shannon@r@v15/40500084."You could even say it''s a place that transcends the concept that having your wishes granted will bring happiness...a world released from everything."'
28083: 'Kanon@r@v16/40600063."........................@k@v16/40600064. ......It sounds kind of religious."'
28084: 'Shannon@r@v15/40500085."And there, everything is equal.@k@v15/40500086. All things with minds are equal.@k@v15/40500087. ......There are no Humans, nor furniture, nor witches.@k@v15/40500088. ......There, I was equal to everyone.@k@v15/40500089. There was no longer any need to feel ashamed of myself because I was furniture."'
28085: 'Shannon@r@v15/40500090.".........It was honestly a happy world where I was equal to all Humans, and even witches.@k@v15/40500091. I can''t really remember it well,@k@v15/40500092. but I have the feeling that when I was there, I was equal even to BEATRICE-sama, and we were good friends."'
28086: 'Kanon@r@v16/40600065."............If that witch is there, then it''s not a much of a paradise."'
28087: 'Kanon@r@v16/40600066.".........So, you want to go to that blissful Golden Land with George-sama.@k@v16/40600067. That''s strange.@k@v16/40600068. The Golden Land is a utopia where you want for nothing, right?@k @v16/40600069.Wouldn''t you be content even if George-sama wasn''t there?"'
28088: 'Shannon@r@v15/40500093.".....................@k@v15/40500094. ...The Golden Land is very calm, peaceful, and everything is fair and equal.@k@v15/40500095. ......But actually, happiness alone is left out."'
28089: 'Kanon@r@v16/40600070."It isn''t a happy world?"'
28090: 'Shannon@r@v15/40500096."Of course, just by being peaceful, calm, and fair, it''s an incredibly happy world.@k@v15/40500097. ......But I guess you could say that it''s a world of zero, where you''re released from all negative worries."'
28091: 'Shannon@r@v15/40500098."The human world is filled with negatives, so of course a zero world is incredibly happy, ......but it''s still zero.@k@v15/40500099. *giggle*, that''s asking for a lot, isn''t it?"'
28092: 'Shannon@r@v15/40500100."......It''s something like this.@k@v15/40500101. When you''re nodding off on your quiet holiday morning,@k@v15/40500102. ......if the person you love the most is next to you, and they''re holding your hand, then it can become an even greater, more wonderful happiness, .........something like that.@k@v15/40500103. ...Sorry, Nee-san is horrible with analogies, I''m too stupid."'
28093: 'Kanon@r@v16/40600071."......So,@k@v16/40600072. to you, the greatest happiness would be reaching that world together with George-sama."'
28094: 'Shannon@r@v15/40500104."Yes.@k@v15/40500105. And I''m sure that for you, it would be reaching that world together with Milady."'
28095: 'Kanon@r@v16/40600073."The two will be released from their worries in a fair world...?@k @v16/40600074..........It feels like I''m being indoctrinated into some kind of strange religion.@k@|@y@v16/40600075. I imagined something more...worldly.@k@v16/40600076. A world where we would be given magic medicine, and that would make us be born again as Humans, or something more like that."'
28096: 'Shannon@r@v15/40500106.".........If you go, you''ll understand.@k@v15/40500107. If BEATRICE-sama really is a fickle person, then surely some day, she''ll let you get a glimpse of it too.@k@v15/40500108. ......Then you''ll be able to understand my example."'
28097: 'Kanon@r@v16/40600077."....................................@k@v16/40600078. Well, I''m not holding my breath.@k@v16/40600079. ......At any rate, it seems like game over for us this time already.@k@v16/40600080. Maybe we can do better some other time."'
28098: 'Shannon@r@v15/40500109."......You''re right.@k@v15/40500110. If we have some strange hope, BEATRICE-sama will take advantage of us again.@k@v15/40500111. .........It might be best for us just to stop thinking, and entrust ourselves to fate."'
28099: 'Kanon@r@v16/40600081.".........We just need to be simple chess pieces.@k@v16/40600082. ......No matter what we think or don''t think, we can''t escape from the witch''s chessboard.@k@v16/40600083. Our role is now just to wait and see how we''ll be tortured to death.@k@v16/40600084. ......For us, the dream of the Golden Land is too unavailing."'
28100: 'Shannon@r@v15/40500112."..................You''re...right.@k@v15/40500113. ......Sorry......"'
28101: '@rKanon shrugged his shoulders, then told Shannon to leave him alone because she was interfering with his duty, distancing himself from her.'
28102: '@rRealizing her thoughtlessness in bringing up such an inappropriate topic and instead hurting Kanon,@k Shannon bit her lower lip and stared at the ground...'
28103: '@rShe wouldn''t bother him any more.@k@rShe went off and squatted in a corner by herself.'
28104: 'Kanon@r@v16/40600085.".....................nn—"'
28105: '@rAt that moment, Kanon twitched.@k@rIt was like the ears of a cat when it reacts to a faint sound.'
28106: 'Shannon@r@v15/40500114."What''s wrong?"'
28107: 'Kanon@r@v16/40600086."......Shh.@k@|@y@v16/40600087. .........Krauss-sama, somebody is coming."'
28108: 'Krauss@r@v02/40800275."What?!"'
28109: '@rThey ended their conversation and strained their ears.'
28110: '@r......For a while, they couldn''t hear anything,@k but before long, they were able to hear the sounds of a large group of people walking...'
28111: 'Kyrie@r@v09/41300237."......So they''ve come."'
28112: 'Krauss@r@v02/40800276."The time of reckoning is upon us—or else, our first and final chance."'
28113: 'Nanjo@r@v19/41900077.".........I shall talk to Kinzo-san.@k@v19/41900078. ...I will try to find out where this place is somehow."'
28114: 'Kyrie@r@v09/41300238."We''re counting on you.@k@|@y@v09/41300239. ..........................."'
28115: '@rDuring the last phone call, Kyrie had asked what the time over at the guesthouse was.'
28116: '@r......It had been the same as her watch, and by this she had learned that their watches hadn''t been set back.'
28117: '@rIt wasn''t just the clocks on the walls in the guesthouse.@k@rSeveral people''s watches, including George''s and Gohda''s, had matched.'
28118: '@r......If that was the case,@k then after the massacre in the dining hall, they had been transported to the dungeon in only a few minutes.'
28119: '@rNot enough time had passed for them to be knocked out and carried away.'
28120: '@rThen were those really pitfalls, meaning that this was the area directly under the dining hall......?'
28121: '@rAll they could do was pray that Nanjo could find out where this was...'
28122: 'Kanon@r@v16/40600088."......They''re coming.@k@v16/40600089. There''s probably...four people.@k@v16/40600090. ......The Master, and three of those who appeared in the dining hall."'
28123: 'Krauss@r@v02/40800277."OK, good.@k@v02/40800278. You come back here as well now.@k@v02/40800279. We''ll deal with the rest."'
28124: 'Kyrie@r@v09/41300240."Shannon-chan, sorry, but can I have you sit by the phone?@k @v09/41300241.Hide it with your skirt."'
28125: 'Shannon@r@v15/40500115."Ah......yes...!"'
28126: '@rThe presence came closer, ......and there was the sound of a heavy door being opened at the other end of the corridor.'
28127: '@rThe light they were apparently carrying illuminated the dimly lit corridor, stroking the walls with razor-sharp shadows.'
28128: '@rAnd then, the light from the lantern they held lit up the prisoners through the bars.'
28129: '@r......The bars'' sharp shadows divided them up lengthwise.'
28130: '@rThere were four figures there.@k .........It was Kinzo, ............Ronove, VIRGILIA, and Gaap.'
28131: 'Ronove@r@v31/43100075."The head of the Ushiromiya family, Lord GOLDSMITH.@k@v31/43100076. Everyone, your silence, please."'
28132: 'Kyrie@r@v09/41300242."...............GOLDSMITH?"'
28133: 'Krauss@r@v02/40800280."It''s Father''s pen name.@k@v02/40800281. It seems he always signs with it when writing those bizarre grimoires."'
28134: 'Kyrie@r@v09/41300243."''Kinzo'' made English-style?@k @v09/41300244.Shouldn''t that be GOLDWAREHOUSE?"'
28135: 'Kinzo@r@v01/41500314.".........Hahhahahahahahahahahaha.@k@v01/41500315. A warehouse is a place to keep things in and nothing more.@k@v01/41500316. Whereas I create gold, and use my craftsmanship to further increase its worth.@k@v01/41500317. Don''t you think "smith" is much more fitting?"'
28136: 'Kyrie@r@v09/41300245."...............Certainly.@k@v09/41300246. I apologize for blathering."'
28137: 'Nanjo@r@v19/41900079."Kinzo-san......@k@v19/41900080. ......Just what is going on?@k @v19/41900081.Where in the world is this...?"'
28138: 'Kinzo@r@v01/41500318."Oh, my friend.@k@v01/41500319. Can''t you remember?@k @|@y@v01/41500320.Certainly, you may never have entered the prison, but you should remember walking through this corridor."'
28139: 'Nanjo@r@v19/41900082.".........Huh,@v19/41900083. ............huh?@k @v19/41900084................Y-you don''t mean........."'
28140: 'Kyrie@r@v09/41300247."......Do you have an idea?"'
28141: 'Nanjo@r@v19/41900085."But, no, .........that is inconceivable.@k@|@y@v19/41900086. ......Firstly, we fell through a pitfall, and furthermore, we were locked up in here after only a few minutes...@k@v19/41900087. ......Not only is the distance too great, that''s physically impossible......"'
28142: 'Gaap@r@v32/43700055."For a Human, right?@k @v32/43700056.*giggle*."'
28143: 'Krauss@r@v02/40800282."Father... Is this the mansion?@k @v02/40800283.To think that the mansion had an underground area like this......"'
28144: 'Kinzo@r@v01/41500321."Kraussss.@k@v01/41500322. Wasn''t there a place whose existence you all whispered of, and which you followed after me on numerous occasions trying to find?@k@|@y@v01/41500323. .........This is that place.@k@v01/41500324. No, to be correct, this is under that place.@k@v01/41500325. *cackle*cackle*...!"'
28145: 'Nanjo@r@v19/41900088."This place couldn''t be............Kuwadorian''s...@v19/41900089....basement...?!"'
28146: 'Ronove@r@v31/43100077."......It is as you surmise.@k@v31/43100078. This is the basement of Kuwadorian."'
28147: 'Krauss@r@v02/40800284."Kuwadorian......@k@v02/40800285. ......You don''t mean...Father''s rumored hidden mansion......?@k@v02/40800286. It really exists......?"'
28148: 'Kinzo@r@v01/41500326_b."This mansion was constructed for the sole use of my beloved witch, BEATRICE.@k@v01/41500327. It is truly a shame that I cannot show you around the above-ground section, as it is such a beautiful and elegant mansion."'
28149: 'Kyrie@r@v09/41300248.".........How lovely, just the two of you alone in a mansion with this kind of room.@k@|@y@v09/41300249. It seems that you and I are differently inclined."'
28150: 'VIRGILIA@r@v30/43200045."......Kyrie-san.@k@v30/43200046. ......It would be wise to refrain from such rude comments."'
28151: 'Gaap@r@v32/43700057."*giggle*.@k@v32/43700058. But I agree.@k@v32/43700059. ......If a mansion I was given had this kind of dungeon in it,@k@v32/43700060. even a hundred-year love would turn cold, and I''d take anything of value and run for the hills."'
28152: 'Ronove@r@v31/43100079."Pu ku ku.@k@v31/43100080. Oh? You have no interest in this sort of thing?@k@|@y@v31/43100081. And here I was thinking that you would go head over heels."'
28153: 'Gaap@r@v32/43700061."Heheh.@k@v32/43700062. .........Of course I go head over heels.@k@v32/43700063. If I get a collar or something for a birthday present.@k@|@y@v32/43700064. ......But only if he''s a stud."@|@y'
28154: 'Ronove@r@v31/43100082."Puu ku ku ku ku!"'
28155: 'VIRGILIA@r@v30/43200047."Quiet!@k @v30/43200048.......Don''t you need a gag more than a collar?"'
28156: 'Gaap@r@v32/43700065."Oh, even that''s not off-limits for you?@k @v32/43700066.You sure aren''t picky, Lia.@k@v32/43700067. *giggle*......"'
28157: 'VIRGILIA@r@v30/43200049."Wh-who gave you permission to shorten my name...?!"'
28158: 'Kinzo@r@v01/41500328."Enough, you noisy women!@k @v01/41500329.Are you telling me you''d like to be locked up in the same cell?"'
28159: 'VIRGILIA@r@v30/43200050."I, I apologize, my lord...@k@v30/43200051. This old body of mine would not be able to stand such a cold prison..."'
28160: '@rVIRGILIA quickly apologized, but Gaap merely laughed together with Ronove.'
28161: '@rIt was like she was saying that she wouldn''t be captured,@k or else, that even if she were to be captured, it would be meaningless......'
28162: 'Kinzo@r@v01/41500330."A prison is a place where the captured cannot escape from.@k@v01/41500331. That implies the strong will and love to not let go for a lifetime.@k@v01/41500332. A woman who you could give up on if she ran away is not worth the word "love"."'
28163: 'Kinzo@r@v01/41500333."A woman who makes you fall so madly in love that you don''t want to let her escape, to the point of binding her in chains...@k@v01/41500334. It is only upon reaching that level that it becomes a love worth sacrificing my life for.@k@v01/41500335. .........I will not ask you to understand."'
28164: 'Gaap@r@v32/43700068.".........I cannot be bound by anyone, and will not be bound.@k@v32/43700069. I don''t want to be loved, I want to love.@k@|@y@v32/43700070. I feel the same as you, GOLDSMITH.@k@v32/43700071. That''s why I understand the madness of your love."'
28165: 'Krauss@r@v02/40800287."Love and madness are two sides of the same coin, or so they say.@k@v02/40800288. How bothersome."'
28166: 'Kyrie@r@v09/41300250.".........But learning where we are so easily was a big step.@k@|@y@v09/41300251. We''ll ask the details later, but it seems that you know about this place, right, Doctor Nanjo?"'
28167: 'Nanjo@r@v19/41900090."Y-yes......@k@v19/41900091. ......If that corridor is the underground passage beneath Kuwadorian,@k@v19/41900092. .........then if we go straight there, it will become a long tunnel,@v19/41900093. ......and if we stay on that, we should be able to return to the mansion."'
28168: 'Kyrie@r@v09/41300252."......Then if we could just do something about these bars, we could go home."'
28169: 'Krauss@r@v02/40800289."Father...@k@v02/40800290. What are you planning to do with us?"'
28170: 'Kinzo@r@v01/41500336."As I have already declared, you are the sacrifices for the later twilights.@k@v01/41500337. There are conveniently five of you here.@k@v01/41500338. You will be perfect as hostages for the five gougings."'
28171: 'Krauss@r@v02/40800291."......I see.@k@v02/40800292. ...Then it''s the time of reckoning for us, then?"'
28172: 'Kinzo@r@v01/41500339."Eventually.@k@v01/41500340. That''s not why I''m here this time, so relax.@k@|@y@v01/41500341. Besides, I believe I said it already.@k@v01/41500342. ......If one of my grandchildren is deemed suitable to inherit everything from me, then the ritual will be called off.@k@v01/41500343. In other words, your lives will be spared."'
28173: 'Nanjo@r@v19/41900094."......Wh-what are you planning to do to the children?"'
28174: 'Kinzo@r@v01/41500344."To see if they are suitable to be my successor or not,@k@v01/41500345. I shall give them a test.@k@v01/41500346. If even one of them can impress me, I''ll call the ritual off."'
28175: 'Krauss@r@v02/40800293.".........And if there isn''t anyone suitable,@v02/40800294. ......what are you planning on doing with the children?"'
28176: 'Kinzo@r@v01/41500347."*cackle*cackle*cackle*!@k @v01/41500348.There''s no need to worry about that.@k@v01/41500349. After all, you are the ones who will be made into sacrifices first.@k@v01/41500350. Anything after that should be of no concern to you."'
28177: 'Kinzo@r@v01/41500351."You simply need to place your fates in the hands of your own children.@k@v01/41500352. ......Your children, the fruit of what you''ve birthed, taught and raised.@k@v01/41500353. They should truly be the most suitable to entrust with your fate...!"'
28178: 'Kinzo@r@v01/41500354."*cackle*cackle*!@k @v01/41500355.Don''t make such a worried face, Kraaauss...@k@v01/41500356. Believe in the daughter that you brag is worth ten billion yen.@k@v01/41500357. Hehheheh, hehhahahahahaha...!!"'
28179: 'Kyrie@r@v09/41300253.".........Exactly.@k@|@y@v09/41300254. Children are the fruit of their parents.@k@v09/41300255. Worthy of entrusting with the parent''s fate.@k@v09/41300256. And Father, that applies even to you."'
28180: 'Kinzo@r@v01/41500358."......Heheh, hahhahahaha!@k @v01/41500359.This woman has guts, what a waste on Rudolf!@k @v01/41500360.Wahhahahahaha...!!"'
28181: 'Nanjo@r@v19/41900095."...Kyrie-san, ......it would be best not to aggravate him too much."'
28182: 'Krauss@r@v02/40800295."I agree.@k@v02/40800296. Let''s bear with it for now......"'
28183: 'Kyrie@r@v09/41300257."That''s right...@k@v09/41300258. ......After all, we''re simply fish on a chopping board.@k@v09/41300259. There''s nothing we can do now."'
28184: 'Kinzo@r@v01/41500361."Except insult me with such vigor.@k@v01/41500362. I don''t dislike that kind of woman, you know?@k @v01/41500363.BEATRICE was that kind of woman too, in the beginning.@k@v01/41500364. *cackle*cackle*cackle*!!"'
28185: 'Ronove@r@v31/43100083."............My lord.@k@v31/43100084. Let us get to the main topic.@k@v31/43100085. We''ve been getting derailed for a while now."'
28186: 'Kinzo@r@v01/41500365."Ah yes, there was that. Sorry, sorry, my friend.@k@v01/41500366. Well then, let''s get to the main topic.@k@v01/41500367. For that, I''ve prepared a phone.@k@|@y@v01/41500368. .......Shannon, very shrewd of you.@k@v01/41500369. You don''t have to hide it any longer.@k@v01/41500370. I had that put there.@k@v01/41500371. *cackle*cackle*...!"'
28187: 'Shannon@r@v15/40500116."M-my apologies......"'
28188: 'Kanon@r@v16/40600091."........................"'
28189: '@rShannon quickly withdrew, and the telephone was revealed...'
28190: 'Kinzo@r@v01/41500372."Krauss.@k@v01/41500373. Call the grandchildren in the guesthouse.@k@v01/41500374. And tell them of the test—of the start of my trial."'
28191: '@rWith a gesture that seemed to be saying "go ahead", Ronove urged Krauss to pick up the receiver.'
28192: 'Krauss@r@v02/40800297."...............And if I say no?"'
28193: 'Kinzo@r@v01/41500375."Hohoh, and why do you think you''re in a position where you can make a deal?@k@v01/41500376. If you don''t call, then the grandchildren won''t even be given a chance.@k@v01/41500377. The Ushiromiya family will end here.@k@v01/41500378. And I''ll turn you all into sacrifices right away!!"'
28194: 'Gaap@r@v32/43700072."You''d be lucky to become sacrifices right away.@k@|@y@v32/43700073. ......Don''t you think it''d be more painful to watch the children be made into sacrifices first, before your very eyes...?"'
28195: 'VIRGILIA@r@v30/43200052."......Ga...ap.@k@v30/43200053. The Master is the one who decides the order of the sacrifices.@k@v30/43200054. Keep your opinions to yourself."'
