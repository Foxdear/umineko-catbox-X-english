28564: 'Jessica@r@v04/40200080.".........A test......?"'
28565: 'Krauss@r@v02/40800298."......M-mm.@k@v02/40800299. Listen well..."'
28566: '@rOnce again, there was a call from Krauss to the guesthouse.'
28567: '@r......And the message was......that Kinzo wanted to hold a test to see if the grandchildren had the qualifications to be the next head.'
28568: 'Krauss@r@v02/40800300.".........The head has said that his successor will not be one of us siblings,@k@v02/40800301. that he wants to......pick from you grandchildren..."'
28569: '@rFrom Krauss''s restrained style of speech, Jessica realized as his daughter that he was being forced to speak.'
28570: '@rAnd she was forced into the realization that the hostages were being exposed to danger even now,@k and that if they refused this test, there was a possibility that the hostages would be harmed.'
28571: 'Jessica@r@v04/40200081."S-......so......@k@v04/40200082.what should we do?"'
28572: 'Krauss@r@v02/40800302."......M-...mm.@k@v02/40800303. Hold on..."'
28573: '@rKrauss held the receiver away from his ear, then looked at the grinning Kinzo on the other side of the bars.'
28574: '@rKinzo gave his next order.'
28575: 'Kinzo@r@v01/41500380."Before the test, those unrelated must be removed.@k@|@y@v01/41500381. .........Gohda and Kumasawa are there, I believe?@k @v01/41500382.It will be a problem if they interfere with the test.@k@v01/41500383. Banish them from the guesthouse."'
28576: 'Krauss@r@v02/40800304.".........Banish, ...you say......?"'
28577: 'Kinzo@r@v01/41500384."There should be a gardening storehouse in the rose garden.@k@v01/41500385. Lock Gohda and Kumasawa in there.@k@v01/41500386. Hmm, we''ll begin from there.@k@v01/41500387. Tell them to do it immediately."'
28578: 'Kinzo@r@v01/41500388.".........My weapons will be watching.@k@v01/41500389. Should they do anything questionable, I''ll instantly stop the test and execute all of you as sacrifices!"'
28579: 'Krauss@r@v02/40800305."......I, ......I understand......@k@v02/40800306. ......Hello, Jessica...@k@v02/40800307. Listen closely to what I''m going to tell you......"'
28580: '@rKrauss relayed to Jessica the orders to lock up Gohda and Kumasawa......'
28581: 'Kyrie@r@v09/41300260."......What kind of test are you planning?"'
28582: 'Kinzo@r@v01/41500390."Hmm?@k @v01/41500391.Aah, it truly is a simple test.@k@v01/41500392. I will simply have my grandchildren show me their resolve.@k@v01/41500393. Well now, I wonder what kind of results they''ll show me.@k@v01/41500394. ......Hehehahahah."'
28583: '@rWith displeasure, Kyrie watched Krauss, who was talking with the children...'
28584: '@r......It''s regrettable, but for now we can''t refuse orders.'
28585: '@rIn this dungeon, a feeble resistance won''t amount to anything.'
28586: '@rIf we provoke him too much and drive him into a position where he might kill us,@k there will no longer be any way to stop this murderer.'
28587: '@r......For now, the only choice left is to obey his rules without agitating him,@k all the while waiting for a chance......'
28588: '@rHowever, if we continue to obediently follow his commands,@k the children might be attacked in this so-called test, and they might even lose their lives.'
28589: '@r.........Whether we feign obedience or try to resist, ......nothing will cause the situation to improve.'
28590: '@rAnyway, keeping our eyes peeled so that we don''t let a single chance escape until the very end...is the only resistance possible now.'
28591: '@r......While telling herself this, Kyrie watched over Krauss as he delivered Kinzo''s orders......'
28592: 'Nanjo@r@v19/41900096.".........Kyrie-san.@k@v19/41900097. Let us be patient......"'
28593: 'Kyrie@r@v09/41300261."I know.@k@v09/41300262. ......It''s unfortunate, but all we can do right now is wait.@k@|@y@v09/41300263. If we can just do something about these bars, we''ll be able to get back to the mansion......"'
28594: 'Nanjo@r@v19/41900098."......If only we could somehow get out of here...@k@v19/41900099. ......I-I''ll try something.@k@|@y@v19/41900100. ...............Kinzo-san, I have a request."'
28595: 'Kinzo@r@v01/41500395."Hm, what is it, my friend?"'
28596: 'Nanjo@r@v19/41900101."We understand well that you want to test the children...@k@v19/41900102. ......It is fine for you to do things as you desire."'
28597: 'Nanjo@r@v19/41900103."Without your power, the Ushiromiya family might have collapsed long ago.@k@v19/41900104. We truly understand why you want to carefully select the person who will take charge.@k@v19/41900105. Besides, that is what the family conference is about.@k@v19/41900106. We won''t get in your way..."'
28598: 'Kinzo@r@v01/41500396."Hmm.@k@v01/41500397. I am glad to have your understanding.@k@v01/41500398. That''s right, this is the family conference.@k@v01/41500399. The final family conference, where I will select and finalize the next head.@k@v01/41500400. Fuhahahahahaha...!"'
28599: 'Nanjo@r@v19/41900107."So, the thing is, Kinzo-san...@k@v19/41900108. ......It is far too cold here.@k@v19/41900109. We won''t interfere with your test, so couldn''t you take us to a slightly warmer place......?"'
28600: 'Kinzo@r@v01/41500401.".................."'
28601: '@rAt Nanjo''s words, the slight signs that Kinzo''s mood had been improving were blown away.'
28602: '@rA moment of silence struck Nanjo as Kinzo glared at him with dangerous eyes, as though evaluating him......'
28603: 'VIRGILIA@r@v30/43200057."......Certainly, this place is cold.@k@v30/43200058. It''s tough on an old body.@k@|@y@v30/43200059. ......My lord.@k@v30/43200060. Wouldn''t it be alright if we moved them upstairs......?"'
28604: 'Kinzo@r@v01/41500402."That is not happening!!@k @v01/41500403.I don''t think so, Nanjoooooo...@k @v01/41500404.I know how truly elegantly you lay the foundations for future moves as you appear to give me a turn''s breathing room.@k@v01/41500405. I''m not falling for that, ohhhhhh noooo...@k @v01/41500406.If you insist you''re freezing, then I will line the floor with red-hot coals!!"'
28605: 'VIRGILIA@r@v30/43200061."M-my apologies......"'
28606: '@rVIRGILIA had tried to help out too, but in the end, Kinzo was having none of it...'
28607: 'Gaap@r@v32/43700075."...............You two sure are obedient.@k@v32/43700076. ...If you felt like it, you could easily break these bars."'
28608: 'Kanon@r@v16/40600092."..........................."'
28609: 'Shannon@r@v15/40500117."......Even if we break these, nothing will come of it."'
28610: 'Gaap@r@v32/43700077."True.@k@v32/43700078. ......If you were to break these, it would mean the end of GOLDSMITH''s game.@k@v32/43700079. ......All of you, as well as those humans in the guesthouse, would immediately become sacrifices for Kinzo''s ritual."'
28611: 'Gaap@r@v32/43700080."......But, you know, you two might be the only ones.@k @v32/43700081.Who hold the power to break through this situation......right?"'
28612: 'Gaap@r@v32/43700082.".........You want to reach the Golden Land, don''t you?@k @v32/43700083.You must have many dreams you want granted, right...?@k @v32/43700084.*chuckle*......"'
28613: 'Kanon@r@v16/40600093.".............................."'
28614: 'Ronove@r@v31/43100087."Gaap.@k@v31/43100088. You mustn''t provoke them.@k@v31/43100089. ......This is not your game.@k@v31/43100090. It is the Master''s game, and Milady''s."'
28615: 'Kinzo@r@v01/41500407.".........What is it, Ronove?"'
28616: 'Gaap@r@v32/43700085."Oh, no, nothing.@k@|@y@v32/43700086. ......We were chatting with the prisoners.@k@v32/43700087. Forgive us."'
28617: '@rGaap sent one final sneering smile at Kanon, then turned away.'
28618: '@rKanon could only bite his lower lip and shake his fists......'
28619: 'Kanon@r@v16/40600094.".....................@k@v16/40600095. ......Dammit........."'
28620: 'Shannon@r@v15/40500118."......Well done......@k@v15/40500119. Good job holding it in......"'
28621: 'Kanon@r@v16/40600096."We''re powerless......@k@v16/40600097. Because we''re furniture......"'
28622: 'Shannon@r@v15/40500120."That''s right, ......we''re powerless.@k@v15/40500121. ......But there are times when furniture is needed, and even loved."'
28623: 'Shannon@r@v15/40500122."......We''re stored away in the basement right now, that''s all.@k@v15/40500123. ......I''m sure that one day, somebody will love us.@k@v15/40500124. Need us.@k@v15/40500125. ......So, for now, let''s ignore their provocations and bear with it...@k@v15/40500126. ......Okay?"'
28624: 'Krauss@r@v02/40800308."......Father.@k@v02/40800309. I''ve ordered them to lock up Gohda and Kumasawa in the storehouse."'
28625: 'Kinzo@r@v01/41500408."Good.@k@v01/41500409. You may hang up now.@k@|@y@v01/41500410. ......Chiester Sisters.@k@v01/41500411. Observe the grandchildren as they lock Gohda and Kumasawa away.@k@v01/41500412. If they do anything suspicious, ......then in that moment, the selection test for my successor will be over."'
28626: '@rWhen Kinzo made his order, the Chiester Sisters appeared behind him in a line.'
28627: 'Chiester00@r@v37/43600011."Understood, sir.@k@v37/43600012. ......I will scout.@k@v37/43600013. 556 and 410, cover both flanks.@k@v37/43600014. 45, wide-area surveillance."'
28628: 'Chiester45@r@v35/43400008."00...@k@v35/43400009. 556 is......"'
28629: 'Chiester00@r@v37/43600015."Ah, ............that''s right.@k@v37/43600016. Sorry."'
28630: 'Chiester45@r@v35/43400010."She was a good kid......"'
28631: 'Chiester410@r@v36/43500014."......That''s why I don''t like them nyeh.@k@v36/43500015. ...Good people."'
28632: 'Kinzo@r@v01/41500413."What are you doing, Chiester Sisters?!@k @v01/41500414.Carry out my orders!"'
28633: 'Chiester00@r@v37/43600017."...............My apologies, sir.@k@v37/43600018. Then, let us go observe.@k@v37/43600019. ......Move out!"'
28634: '@rThe Chiester Sisters erased their forms simultaneously.'
28635: '@rNanjo and Kyrie witnessed the instants they appeared and disappeared as if by teleportation,@k but they interpreted this as if they had probably moved in and out of the darkness in a way that only looked like teleportation,@k and the two could do nothing but rub their eyes...'
28636: 'Kinzo@r@v01/41500415."......Well then.@k@v01/41500416. I shall begin preparing for the test.@k@v01/41500417. Ronove, Gaap.@k@v01/41500418. I''m asking you to be the examiners.@k@|@y@v01/41500419. VIRGILIA, you watch these rats.@k@v01/41500420. .........After all, two of my furniture are here.@k@v01/41500421. Just in case, be on your guard."'
28637: '@rHe glanced sharply at Shannon and Kanon.@k Tightly closing her eyes, Shannon gave a silent bow, answering wordlessly that she would not cause any trouble......'
28638: 'VIRGILIA@r@v30/43200062."......Certainly.@k@v30/43200063. I''ll be careful."'
28639: 'Gaap@r@v32/43700088."Isn''t this cold hard on your old body, Lia?@k @v32/43700089.Should I bring you a hot water bottle...?"'
28640: 'VIRGILIA@r@v30/43200064."Shut up.@k@v30/43200065. Hurry up and go.@k@v30/43200066. Gap."@|@y'
28641: 'Ronove@r@v31/43100091."Pu ku ku ku...!@k @v31/43100092.Well, well, tests and examiners, what a strange experience we have this game.@k@v31/43100093. .........I do hope this development entertains Milady."'
28642: 'VIRGILIA@r@v30/43200067."......Come, arise, goat attendants."'
28643: '@rVIRGILIA called out into the dark, and from that spot, three massive goat-headed attendants slowly melted into vision.'
28644: 'Gaap@r@v32/43700090."Ah, Riiche''s minions.@k@v32/43700091. How useful.@k@v32/43700092. And they look so warm.@k@v32/43700093. I see, so this is instead of a hot water bottle.@k@v32/43700094. In that case, wouldn''t sheep have been better than goats?"'
28645: 'VIRGILIA@r@v30/43200068."Shut up about it, you cashmere mop.@k@v30/43200069. ......They aren''t very bright, but they faithfully follow orders and are quite dependable."'
28646: 'Kinzo@r@v01/41500422."Mm, I leave it to you.@k@v01/41500423. My friend, VIRGILIA.@k@|@y@v01/41500424. ......The rest of you, follow me."'
28647: '@rKinzo turned with a grand swish of his cloak.'
28648: '@rFollowing him were Ronove and Gaap,@k@|@y ......as well as the three recently summoned goat attendants.'
28649: 'VIRGILIA@r@v30/43200070."......You three are supposed to wait here with me.@k@v30/43200071. Don''t follow them."'
28650: '@rThe goats jumped in surprise and then came plodding back.'
28651: '@rKyrie, who had been watching in disbelief as all of this played out, couldn''t help but snort.'
28652: 'Kyrie@r@v09/41300264."Heheh......@k@v09/41300265. What entertaining underlings."'
28653: 'VIRGILIA@r@v30/43200072."L-Lord GOLDSMITH did not give you permission to speak freely."'
28654: '@r...She was probably a little embarrassed.'
28655: '@rVIRGILIA had spoken coldly, but Kyrie could see right through that, and for a little while, she couldn''t restrain her muffled laughter.'
28656: '@rHowever, on the inside, Kyrie was surprised at the number of people Kinzo had with him.'
28657: '@rBecause, including Kinzo himself, at least ten enemies had already been spotted...'
28658: '@r......The dungeon they were currently locked in was supposedly underneath the hidden mansion called Kuwadorian.'
28659: '@rAlthough this mansion''s existence had been whispered of, not even Krauss had known it for a fact until today.'
28660: '@rWere there actually several facilities like this on Rokkenjima, unknown to all but Kinzo,@k hiding untold numbers of henchmen that only Kinzo knew of...?'
28661: '@rJust how many humans are on Rokkenjima, locked away by the typhoon...?'
28662: '@rNo, actually...@kAre we the only ones under the impression that there are only 18 people on this island......?'
28663: '@rAs we bickered over whether BEATRICE existed or not, and racked our brains over something as minor as a 19th person,@k were we on this island the perfect example of frogs in a well...?'
28664: '@rNo, wait, in fact...@k At this point, are there actually more people on the enemy''s side than on ours...?'
28665: 'Kyrie@r@v09/41300266."............Just what the hell is going on......@k@v09/41300267. Witches? Demons? Magic?@k @v09/41300268.......Am I supposed to believe in those?@k @v09/41300269. Are my eyes screwed up? Or is my head?@k @v09/41300270....I think I''m losing it........."'
28666: '@rA mass murder by magic.@k@rDemons forming and disappearing in thin air.'
28667: '@rMore importantly than the enemy''s numbers,@k how should we interpret the various things thrust before our eyes that cannot be explained with the common sense of this world?'
28668: '@r......Kyrie started to feel like she didn''t know what was going on anymore,@k and while desperately battling the urge to abandon everything and give up, she clenched her teeth in an attempt to hold onto her sanity...'
28669: '@rObviously, Gohda and Kumasawa were quite unwilling to be locked in the rose garden shed.'
28670: '@r......But they had been threatened that, if they resisted, the hostages'' safety could not be guaranteed...'
28671: '@rIt was fairly hard to get them to agree,@k but once the idea was raised that their safety might actually be guaranteed if the key to the gardening storehouse was to be handed to them through a cracked-open window after they were shut inside,@k ......and it was suggested that blankets and food could be carried in for them, they were finally convinced.'
28672: 'Kumasawa@r@v18/41800020.".........This place is pretty chilly...@k@v18/41800021. I wonder how long we''ll have to stay locked in here......"'
28673: 'George@r@v07/40300076."......In the worst case, it''ll be until Monday morning, so a full day and night.@k@v07/40300077. ......I really feel bad about doing this to you two..."'
28674: '@rGeorge and Battler cleared a space on the floor, then spread the blankets there.@k@rThey also left the canned food, crackers, and other light snacks they had brought.'
28675: 'Battler@r@v10/40100329."It''ll be hard for you guys to go until Monday morning with just this...@k@v10/40100330. If only we could have stopped by the kitchen..."'
28676: 'Jessica@r@v04/40200083."We were told not to go to any unnecessary places.@k@|@y@v04/40200084. ......They do apparently have us under surveillance, after all.@k@v04/40200085. .........Dammit."'
28677: 'Gohda@r@v17/41700035."......I am honestly sorry that we cannot be of any use......@k@v17/41700036. And these are the times that we are truly supposed to be at your sides........."'
28678: 'George@r@v07/40300078."It can''t be helped.@k@v07/40300079. ......More importantly, we''re trusting you to take care of Kumasawa-san.@k@v07/40300080. ...We don''t know what''s going to happen.@k@|@y@v07/40300081. When it comes down to it, I want you to do what you can to help her.@k@v07/40300082. And more than anything, I want you to be safe..."'
28679: 'Gohda@r@v17/41700037."...Yes, I understand.@k@v17/41700038. ......Please, be careful, everyone.@k@v17/41700039. Right now, the Master is......taking human lives like they''re pieces on a chessboard.@k@v17/41700040. ...Please be careful."'
28680: '@rGohda stared at the floor, remembering that atrocity in the dining hall, even now unable to believe what had happened,@k and he hung his head in shame at his inability to fully describe that terror.'
28681: 'George@r@v07/40300083."Thank you.@k@v07/40300084. .........Please make sure you stay on your guard.@k@v07/40300085. You too, Kumasawa-san."'
28682: 'Kumasawa@r@v18/41800022."......And you all please take care as well......@k@v18/41800023. I don''t have any idea what''s going on anymore......"'
28683: 'George@r@v07/40300086."Well then, ......we''ll be off.@k@v07/40300087. Let''s go, Battler-kun. Jessica-chan.@k@v07/40300088. ......Come on, Maria-chan, you too."'
28684: 'Maria@r@v13/40401245."............Uu."'
28685: '@rLooking at the painful expression on the faces of the pair to be imprisoned, it became hard to close the shutter.'
28686: '@rBut we can''t disobey.@k@r......We''re being watched.'
28687: '@rWe brought the shutter down and locked it.@k@rThen George headed to the small window on the side of the storehouse.'
28688: '@rIt was a small latticed window which could only be used for light and ventilation.'
28689: '@rIt looked like something from a jail, making the two of them seem even more pitiable,@k ......but on the other hand, it would protect them from Kinzo and his subordinates, or so one would hope...'
28690: '@rHe opened the window and called out.'
28691: 'George@r@v07/40300089."......Are you alright? You''re not cold, are you?"'
28692: 'Kumasawa@r@v18/41800024."We''re alright.@k@v18/41800025. We''ve been given all these blankets, after all.@k@v18/41800026. ......If we wrap ourselves up, we''ll be just fine."'
28693: 'Battler@r@v10/40100331."I wish we could have brought them a kerosene stove or something......"'
28694: 'George@r@v07/40300090."......But it wouldn''t have ventilation here.@k@v07/40300091. It''s tough, but there''s nothing we can do now.@k@v07/40300092. ......Hostages are being held against us.@k@v07/40300093. We can''t disobey..."'
28695: 'Battler@r@v10/40100332.".........Dammit...@k@v10/40100333. ......If we could just save Kyrie-san and the rest somehow......"'
28696: 'George@r@v07/40300094."Shh.@k@v07/40300095. ......They might be able to hear you.@k@v07/40300096. .........Gohda-san, here.@k@v07/40300097. The key to the shutter."'
28697: '@rGeorge threw the key in through the tiny window.'
28698: 'Gohda@r@v17/41700041."......Thank you.@k@v17/41700042. I''ll hold on to it."'
28699: '@rGohda took the key, and after showing it to Kumasawa, placed it in his own pocket.'
28700: '@rThere was only one key to the gardening shed''s shutter.@k@rThat was being held by those who were locked up inside it.'
28701: '@rIf the children had held onto it, then if it was stolen from them by some chance, that would risk exposing the lives of those in the shed to danger.'
28702: '@rAnd even with the key, the shutter could not be opened from the inside.@k It satisfied Kinzo''s demand.'
28703: '@rHowever, there was now no longer any way to open the shed from the outside either.@k This would protect them.'
28704: '@rKinzo had ordered that they be confined, ......and we could do nothing but trust that this cold locked room would protect them.'
28705: '@rHolding Maria''s hand, Jessica watched George hand over the key, then looked over the thickets in the pitch-black rose garden.'
28706: '@r......Somewhere in this darkness, somebody was hiding, watching to see whether they obeyed orders or not.'
28707: '@rOf course, merely pointing their flashlights out there did nothing to make any suspicious silhouettes appear.'
28708: '@rBut somebody was surely out there...hiding and watching.'
28709: '@rThey were hit many times with an urge to scream at them.@k@r......But they held that back through reason.'
28710: '@rThe four children left the area behind, repeatedly looking back over their shoulders.'
28711: '@rThe feeble light from the lightbulb in the gardening storehouse was seeping out slightly.'
28712: '@r......Was it at all possible that this insane incident would somehow come to an end, ......so that they could see those two again?'
28713: '@r......To George, who had closed the shutter himself,@k ...the resistance of the lock made it feel as though he had killed them with his own hands.'
28714: 'Battler@r@v10/40100334.".........But even so......we can''t disobey......"'
28715: 'Jessica@r@v04/40200086."A test...?@k@v04/40200087. ......What the hell, old man......!@k @v04/40200088.Killing Mom, capturing Dad for that......@k@v04/40200089. I don''t get it, I''ll kill him...!"'
28716: 'Maria@r@v13/40401246."......It''s alright, Jessica onee-chan.@k@v13/40401247. There''s nothing to be sad about......"'
28717: 'Jessica@r@v04/40200090.".........Maria......"'
28718: 'Maria@r@v13/40401248."The witch will be revived very soon.@k@v13/40401249. .........It won''t be long before you can see her in the Golden Land.@k@v13/40401250. ...Kihihihihihihihihi............@k@|@y@v13/40401251. Ouch."'
28719: 'Battler@r@v10/40100335."Don''t laugh at inappropriate times.@k@v10/40100336. ......Seriously, a resurrection ritual for a witch?@k@|@y@v10/40100337. He should just keep his fantasies to the inside of his head.@v10/40100338. Getting all these people involved...@k@v10/40100339. ........That''s gonna cost you, ...bastard..."'
28720: 'George@r@v07/40300098.".........Let''s return to the guesthouse.@k@v07/40300099. ...It''ll be bad if we aren''t there when Grandfather calls."'
28721: '@rUrged on by George, everyone began walking towards the guesthouse......'
28722: '@rAt that moment, Jessica spun around, and roared towards the darkness of the rose garden.'
28723: 'Jessica@r@v04/40200091."..................HEY!!@k @v04/40200092.Someone''s watching, right?!@k @v04/40200093.Tell the old man...!!@k @v04/40200094.Tell him I''m gonna friggin'' kill him!!@k @|@y@v04/40200095.Let''s go...!!"'
28724: '@rOf course, there was no reply, only the howl of the wind and rain......'
28725: '@rThe children returned to the guesthouse...@k@r...In fear of what would be waiting for them when they got back.'
28726: '@rAfter they departed,@k .........from the exact point in the darkness that Jessica had yelled at,@k two rabbit ears sprung up...'
28727: 'Chiester45@r@v35/43400011."......S-sorsorsorryyyy...!@k @|@y@v35/43400012.They found me ouuuut...!!"'
28728: 'Chiester410@r@v36/43500016."It''s ''cause you''re too slow, 45, nye~h.@k@v36/43500017. Ni~hihihi~, Pendragon-sama''s going to scold youu~♪"'
28729: 'Chiester45@r@v35/43400013."I''m sorry I''m sorry, please don''t tell Pendragon-sama on meeeee!"'
28730: 'Chiester00@r@v37/43600020."Shut up be quiet.@k@v37/43600021. It was obviously just a bluff.@k@|@y@v37/43600022. ...Gohda and Kumasawa''s imprisonment confirmed.@k@v37/43600023. Mission accomplished.@k@v37/43600024. Time to report back."'
