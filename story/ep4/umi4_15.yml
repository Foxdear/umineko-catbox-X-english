28773: '@r......But she buried those feelings and strengthened her resolve.'
28774: 'George@r@v07/40300100."Be careful, ......okay?"'
28775: 'Jessica@r@v04/40200101."......We''re being watched, right?@k@v04/40200102. We can''t do anything.@k@v04/40200103. All we can do is exactly as we''re told."'
28776: 'Battler@r@v10/40100367.".........They say that old geezer killed those six in the dining hall in an instant, with no hesitation.@k@v10/40100368. ......It might be the same for us."'
28777: 'Jessica@r@v04/40200104."I get it.@k@v04/40200105. ............I''ll pay him back."'
28778: 'George@r@v07/40300101."Don''t do anything reckless.@k@v07/40300102. .........If you think you''re in any danger, you put yourself first.@k@v07/40300103. ......If Uncle Krauss finds out that his daughter sacrificed herself for him,@k@v07/40300104. there''s no doubt it would tear his heart apart."'
28779: 'Jessica@r@v04/40200106."It goes the other way too.@k@v04/40200107. .........If Mom and Dad were both killed, and I was the only one left,@k@v04/40200108. my heart would rip itself to pieces."'
28780: 'George@r@v07/40300105."..............................@k@v07/40300106. ......Battler-kun.@k@v07/40300107. Is what you said earlier true......?"'
