28786: 'Battler@r@v10/40100372."......Are you sure, Aniki?@k@v10/40100373. ......Shannon-chan''s there too."'
28787: 'George@r@v07/40300112."........................@k@|@y@v07/40300113. ......That doesn''t mean I''ll sit around and wait for my fiancee to be killed.@k@v07/40300114. .........What scares me is not that Shannon might be killed by Grandfather."'
28788: 'George@r@v07/40300115."I''m just worried you guys will be first to find that doddering old bastard who gave my fiancee a taste of terror, and literally beat me to the punch."'
28789: 'Jessica@r@v04/40200113."Now I get it...@k@v04/40200114_b. ......Yeah, this really is a test to settle who the next head''s gonna be."'
