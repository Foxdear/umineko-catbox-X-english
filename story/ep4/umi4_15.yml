28733: '@rIt certainly seemed to be a fact that they were being watched.'
28734: '@rBecause once they returned to the cousins'' room, turned the lights on, and lay down on their beds, the phone rang again.'
28735: '@rUp until now, Jessica had been answering the phone, seeing as it was her house,@k but now it was George, as the eldest, who picked it up.'
28736: '@rThis time, Kyrie-san was on the other end of the phone.@k@rGeorge handed it to Battler out of consideration...'
28737: 'Battler@r@v10/40100340.".........Hello.@k@v10/40100341. Kyrie-san?@k @v10/40100342.Is everything alright over there...?!"'
28738: 'Kyrie@r@v09/41300271."Thanks for worrying.@k@v09/41300272. ...It''s agreeable for now.@k@v09/41300273. .....................Sorry, I''ve been ordered to refrain from speaking freely.@k@v09/41300274. Listen closely to what I''m about to tell you."'
28739: '@rThe fact that they were hostages still hadn''t changed.@k@rAnd Kinzo or one of his subordinates was probably listening to this conversation.'
28740: '@rBattler restrained the urge to talk about other things, and focused on what Kyrie had to say.'
28741: 'Kyrie@r@v09/41300275."The tests will be given to Jessica-chan, George-kun, Battler-kun,@k@v09/41300276. and Maria-chan, in that order.@k@v09/41300277. .........You''ll be called out in turn, so until then, do not leave the room.@k@v09/41300278. The person who is called out will head to their designated location, alone."'
28742: '@rBattler repeated it out loud so that his cousins would also understand.'
28743: 'Battler@r@v10/40100343."......Jessica, Aniki, me, and Maria in that order, stay in the room until we''re called, right.@k@v10/40100344. ......Got it...@k@|@y@v10/40100345. ......Maria too?@k @v10/40100346.Even a nine year old girl... What''s that old fart going to force her to do, goddammit..."'
28744: 'Kyrie@r@v09/41300279."...............The future of the Ushiromiya family rests in all of your hands.@k@v09/41300280. ......Do your best."'
28745: 'Battler@r@v10/40100347."......Hm.@k@v10/40100348. ...............Sure."'
28746: '@rBattler noticed the strange nuance in Kyrie''s words.@k@rEven without any blood connection, he could still understand thanks to the long-lasting bond they shared.'
28747: '@rNow was not the time to worry about the future of the Ushiromiya family.@k@r......That wasn''t the message that Kyrie wanted to send.'
28748: '@rShe probably meant "there is no way for us to escape from this dungeon, and we can only wait to be rescued.@k Our lives are in your hands".'
28749: '@r......Something like that.'
28750: 'Battler@r@v10/40100349."Yeah, leave it to us.@k@v10/40100350. No idea what kind of test it is, but bring it on.@k@v10/40100351. I''m not backing down from that challenge.@k@|@y@v10/40100352. .........It''s a serious test, right?@k @v10/40100353....It''s OK for us to...@v10/40100354....go all out?"'
28751: 'Kyrie@r@v09/41300281."......Yes.@k@v09/41300282. It''s a serious test.@k@v09/41300283. He plans to seriously test you all."'
28752: 'Battler@r@v10/40100355."That''s no good, no goddamn good at all.@k@v10/40100356. ......Some old fart on death''s door thinks he can take me when I''m serious?"'
28753: 'Battler@r@v10/40100357."Let''s see him spew that shit from beyond the grave.@k@v10/40100358. He''s there, so tell him this for me:@k@v10/40100359. The next head is me.@k@v10/40100360. And my first action will be to implant my fist into your face...!"'
28754: '@rEven without Kyrie having to repeat it, Battler''s powerful declaration of war reached Kinzo''s ears...'
28755: 'Kinzo@r@v01/41500425."Fuhahahahahahahaha!!@k @v01/41500426.Battleeeeer, I will truly be looking forward to it!"'
28756: 'Kinzo@r@v01/41500427."I can''t wait to see just what a man who once discarded the Ushiromiya name has attained,@k@v01/41500428. to just what state of mind he has ascended as he stands before me!!@k @v01/41500429.Tell him that...!"'
28757: '@rUnfortunately, Kinzo''s voice was not picked up by the receiver.@k So Kyrie spoke for him.'
28758: 'Kyrie@r@v09/41300284."He says he''s more than up for the challenge.@k@v09/41300285. .....Alright, Battler-kun.@k@v09/41300286. There''s no need to hold back.@k@|@y@v09/41300287. .........You are Rudolf-san''s son."'
28759: 'Kyrie@r@v09/41300288."......No, you are my son.@k@v09/41300289. Show me something I won''t be embarrassed to brag about.@k@v09/41300290. .........I entrust everything to you......"'
28760: 'Battler@r@v10/40100361."Roger that, Mom.@k@v10/40100362. .........Leave the rest to us...!"'
28761: 'Kyrie@r@v09/41300291.".........All of us here have lost the right to inherit the position of head.@k@v09/41300292. ......Now we''re just the same as pieces taken off the chessboard, looking on from the outside.@k@v09/41300293. So you''ll have to fight by yourselves."'
28762: 'Battler@r@v10/40100362_1."...............Kyrie-san........."'
28763: '@rThe nuance of those words was.........'
28764: '@r"We''ve already given up.@k ...You can forget about us."'
28765: '@r......But.........for that very reason, I won''t give up......@k@rI''m going to wreck this test or whatever, and save everyone...!'
28766: 'Kyrie@r@v09/41300295."Well then, ......here are the instructions for the first test, Jessica-chan''s.@k@v09/41300296. ......Head to your own room, he says."'
