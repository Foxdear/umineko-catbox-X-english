22643: 'Kyrie@r@v09/41300001."Oh, from Asumu-san?"'
22644: 'Rudolf@r@v08/41200003."......For some reason, she just couldn''t handle vehicles.@k@v08/41200004. Pretty much anything other than a bicycle or a car.@k@|@y@v08/41200005. Whenever we tried to take a trip somewhere far away, that woman was so annoying with the "no not this, no not that,@k@v08/41200006. I''m scared I''m scared, I''m going to fall I''m going to fall, scream scream"."'
22645: 'George@r@v07/40300003."Children tend to learn that things which their parents can''t seem to handle are dangerous.@k@|@y@v07/40300004. Battler-kun must have seen Asumu-san doing something like that and learned that vehicles are scary."'
22646: 'Kyrie@r@v09/41300002."*giggle*giggle*.@k@v09/41300003. Could it be Asumu-san''s genes, I wonder?"'
22647: 'Rudolf@r@v08/41200007."Beats me.@k@v08/41200008. Those''d be some damned annoying genes.@k@|@y@v08/41200009. .........Stop talking about Asumu.@k@v08/41200010. Right now, the one who''s here is you.@k@v08/41200011. Right?"'
