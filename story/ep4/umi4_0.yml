22656: '@rThe tone of Auntie Rosa''s voice became a little frightening.'
22657: '@rBattler, too, had started to think that perhaps he really was fooling around too much...when, just as expected, he bumped into someone.'
22658: 'Battler@r@v10/40100006."Oh, sorry..."'
22659: 'George@r@v07/40300005."Battler-kun, your family is going in the car over there.@k@v07/40300006. You''re keeping them waiting."'
22660: '@rRushed on by George, Battler made an apologetic gesture to the person he had bumped into and ran up to his parents, who were telling him to come quickly.'
22661: '@rWith clunking sounds, the doors on the three taxis were shut one after another, and they departed, heading for the harbor......'
22662: '@r......As their taxis dashed away...'
22663: '@r...the entire world grew suddenly dull,@w583. ......and slowed to a halt.'
22664: '@rVoices, the wind, and even sound - @kabsolutely everything ceased, and as if they had been frozen in the instant a photo was taken, everything moving or about to move...@k...stopped.'
22665: '@rPeople, machines, clock hands, even the dust dancing in the wind - frozen.@k@rPeople who were in the middle of walking - frozen, with one foot still raised.@k@rScraps of paper dancing in the wind - frozen, pinned in midair.'
22666: '@r......And among these stationary figures in this world that had come to a standstill, a single one...moved.'
22667: '@rIt was a woman.@k The very woman that Battler had just bumped into...'
22668: '@rIt was truly the slightest of movements.'
22669: '@rHer gaze dropped, her shoulders lowered a minuscule amount, and she sighed.@k@r...That was all.'
22670: '@rIn a normal world, that probably wouldn''t even count as movement,@k but in this still world, it looked very out of place.'
22671: '@r...Then something else moved.@k@rIt was a black cat that had been dozing in the shadows near the taxi rank.'
22672: '@rIt came up right behind the woman,@k ......and leisurely...changed its form into that of a Human.'
22673: '@rIt wasn''t a cat.@k It was a witch.@k@rOf course, the woman was also a witch.'
22674: '@rAs the witch stood there, her gaze still downwards, she muttered...'
22675: 'Ange@r@v11/42000001.".........I can''t stop them...@v11/42000002....from going to Rokkenjima, can I..."'
22676: 'BERNKASTEL@r@v28/42100001."You cannot.@k@v28/42100002. On October 4th, 1986, you are not here."'
22677: 'Ange@r@v11/42000003."......So if I had been here, it might even have been possible to stop them all from going...?"'
22678: 'BERNKASTEL@r@v28/42100003."What verbal acrobatics a six-year-old girl could possibly perform to persuade them to turn back,@k@v28/42100004. I can''t even imagine.@k@v28/42100005. ......But yes.@k@v28/42100006. If you had been in this place, the probability wouldn''t have been zero.@k@v28/42100007. If there is a probability other than zero, I can find a miracle."'
22679: 'Ange@r@v11/42000004."......If I hadn''t been sick,@v11/42000005. ...and they hadn''t left me behind......"'
22680: '@rWith her head facing downwards, the witch tightened her fists...@k@r...They were trembling very slightly.'
22681: 'BERNKASTEL@r@v28/42100008."You were sick in bed starting October 3rd, 1986.@k@v28/42100009. And Beato''s game board is a snippet of time beginning on October 4th.@k@v28/42100010. ......You are not given the possibility of not getting sick.@k@v28/42100011. ...In other words, you are fundamentally an existence which can never step up onto the game board."'
22682: 'Ange@r@v11/42000006."Thanks for being so patronizing.@k@v11/42000007. ......I''m aware of that.@k@v11/42000008. ......I know that just seeing Mom, Dad,@v11/42000009. .........and Onii-chan healthy and happy like this,@v11/42000010. ......that alone...@k@v11/42000011....is a very wonderful miracle...@v11/42000012. .........I know that all too well..."'
22683: '@rAnge had been trying to stand in the way of her family, and prevent them from going outside the airport, ......towards Rokkenjima.'
22684: '@r...But that was impossible for Ange, who could not exist there on October 4th, 1986.'
22685: '@rJust receiving a shoulder-bump and words of apology from her older brother...'
22686: '@r...Even though he hadn''t known that she was his sister,@w583. ...that was still such a miracle,@w500. ......it could have moved her to tears......'
22687: 'Ange@r@v11/42000013."............I''m sorry for the sarcasm.@k@v11/42000014. I won''t waste the miracle you''ve given me."'
22688: 'BERNKASTEL@r@v28/42100012."I''m glad to hear it.@k@v28/42100013. ......Now, let''s go with them.@k@v28/42100014. To Rokkenjima.@k@v28/42100015. Soon, all of the pieces will be gathered.@k@v28/42100016. ......The curtain will open on the fourth game.@k@v28/42100017. Beato and Battler will already be seated by now."'
22689: 'Ange@r@v11/42000015."......To Rokkenjima......@k@v11/42000016. ............To the day my...@v11/42000017.no,@v11/42000018. ......the day everyone''s fates changed...October 4th, 1986,@v11/42000019. ...on Rokkenjima........."'
22690: '@r...What happened on that day?@k@rI will expose that.@k Learn that.@k And I''ll take them back...!'
22691: '@rAs she stood there with her fists still clenched, she surely turned her face to the heavens.@k@rA single teardrop from the depths of her eyes dripped down into the air.'
22692: '@rAnd when time started moving again, the two witches'' figures were sucked into a blowing gale, and erased in an instant.'