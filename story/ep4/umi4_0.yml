22652: 'Eva@r@v05/41000005."Ehheheheheh.@k@v05/41000006. It''s good that they''re in high spirits.@k@v05/41000007. If Battler-kun and Maria-chan weren''t there, the atmosphere in that plane would have been very stiff."'
