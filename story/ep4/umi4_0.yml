22641: 'Eva@r@v05/41000001."Battler-kun, why don''t you come with your aunt on an overseas trip sometime soon?@k@v05/41000002. What about Europe?@k @v05/41000003.I''m sure you''d conquer your fears after the half-day plane trip.@k@v05/41000004. *giggle*giggle*giggle*!"'
