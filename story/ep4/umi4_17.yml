30032: 'BEATRICE@r@v27/40700511."Ohhh, so you want to meeeet me?@k @v27/40700512.Uhhihihihi, sure is tough being a popular woman!@k @v27/40700513.But please, don''t try to chat me up when Kinzo''s around, okaay?@k @v27/40700514.The guy''s a bad egg, he gets seriously jealous, see?"'
