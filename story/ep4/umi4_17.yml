30113: '@rBut the thought of doing what they wanted me to do was somehow irritating.@k@r......However, it didn''t look like we''d get anywhere if I didn''t open it.'
30114: '@rCould it be that it''s set up with some trap to make it explode when opened......?'
30115: '@rWhile thinking things like that, and forgetting even to go under the overhang,@k I continued to glare at the box as the rain beat down upon me.'
30116: '@rThen, .........mixed in with the thunder, was some kind of......music?@k ...It sounded like something like that.'
30117: '@r......It was the tone of the big clock in the hall announcing midnight.'
30118: '@rIt was also the sound that announced that the crazy day of October 4th had finally ended,@k ......and that the much more incredibly crazy day of October 5th had begun.'
30119: '@rThat sound quietened, ............and I could hear an eerie laugh coming out of nowhere......'
30120: '@rI got the feeling that the voice was coming from the heavens, ......and I looked up at the sky.'
30121: '@r......And there.........was a woman I had never seen before.@k@rNo, it''s not true that I''ve never seen her before.@k@r......I saw her once today.'
30122: '@rYes, in the portrait inside the mansion......'
30123: '@rThe clothes were different, ......but that face was just like the witch of the portrait......'
30124: '@rAaah, who am I kidding... I already know who this person is...!!'
30125: 'Battler@r@v10/40100510."......S-......so you are BEATRICE!!!"'
30126: 'BEATRICE@r@v27/40700537."Yooohooooooooo, Battleeeeeeeeeeeeer...!!"'
30127: '@rLeaning over the second floor balcony, ......and waving cheerily from under her umbrella,@k ......was, without a doubt, ......the witch of the portrait, ...BEATRICE.........!!'
30128: '@rWas the plan for the boss to watch on from above as her goat underlings torture me to death...?!'
30129: '@rI adjusted my grip on the spear,@k and, imagining goats creeping out of the surrounding shadows and the entrance and surrounding me, I raised my guard in all directions...'
30130: 'BEATRICE@r@v27/40700538."Ahhaha, be at ease, there''s no one here but you and me, see?@k @v27/40700539.There is no goat furniture, there are no demon butlers; Master is not here, nor my close demon friend."'
30131: 'BEATRICE@r@v27/40700540."And there are none of the gold butterflies that help compose my physical form, there are no magic circles, and no summoners in attendance!!@k @v27/40700541.......Do you know what this means?"'
30132: 'Battler@r@v10/40100511."Not a clue.@k@v10/40100512. Quit babbling..."'
30133: 'BEATRICE@r@v27/40700542."I have in fact met you several times even in this world.@k@v27/40700543. Almost as though brushing past one another, meeting only for a moment.@k@v27/40700544. ......As you know, this world of Humans is filled with a toxin just by your existence and your doubting of me."'
30134: 'BEATRICE@r@v27/40700545."Almost like solid ramparts strengthening the defense around you, the king!@k @v27/40700546.And through multiple games,@k@v27/40700547. I advanced my pieces one by one, splitting you apart, and cornering you, undermining your ramparts bit by bit."'
30135: 'BEATRICE@r@v27/40700548."Then, finally, once I opened a tiny crack, I sent a bishop in, so that it could approach right up next to you.@k@v27/40700549. .........But as you know, bishops are pieces with blind spots."'
30136: 'BEATRICE@r@v27/40700550."As long as you stay on the black squares, a black bishop can exert massive influence upon you,@k@v27/40700551. but if you escape just one step to a white square, then even if I close in right next to you, I will not be able to touch you."'
30137: 'BEATRICE@r@v27/40700552."That is why I have progressed through these games by sending in various pieces so that you cannot stay on a white square,@k@v27/40700553. forcing you out in front of me, the one who controls the black squares next to you."'
30138: 'BEATRICE@r@v27/40700554."Howeeever!!"'
30139: 'BEATRICE@r@v27/40700555."There are now holes opened all over your ramparts,@k@v27/40700556. and I was at last able to send in, not a bishop, but a full queen!!@k @v27/40700557.Do you know what kind of piece a queen is?"'
30140: 'Battler@r@v10/40100513."A rook plus a bishop.@k@v10/40100514. ......Is this what you''re trying to say?@v10/40100515. ...Now, you not only control the black squares that are the witch illusions, but have also become able to encroach upon the white squares of the human world at will...?!"'
30141: 'BEATRICE@r@v27/40700558."That is correct!!@k @v27/40700559.Where there exist the gold butterflies that are my minions, you have been labeling those squares as witch illusions,@k@v27/40700560. denying them under the hypothesis that they are observerless nonreality, am I right...?@k @v27/40700561.*cackle*cackle*, I am well aware......!!"'
30142: 'BEATRICE@r@v27/40700562."For that very reason, I have at last descended thus upon the squares of white!!@k @v27/40700563.Worry not, I''ll call plenty of gold butterflies, goats, demons, and witches later on!@k @v27/40700564.If you wish, I will invite you to my Golden Land!!"'
30143: 'BEATRICE@r@v27/40700565."There, I will grant you any wish that you desire...!!@k @v27/40700566.Wahhahahahahahahahahahahahaha...!!"'
30144: 'Battler@r@v10/40100516."......It''s starting to look like someone knocked an ink bottle over the chessboard of this island."'
30145: 'BEATRICE@r@v27/40700567."I see, that too is a pleasant description...!@k @v27/40700568.*cackle*cackle*, soon, you will be covered in that ink as well.@k@v27/40700569. Before long, you will become dyed pitch-black, and surely become a black king...!@k @v27/40700570.At this point, you are a pitiful existence drowning in a sea of ink, are you not?"'
30146: 'Battler@r@v10/40100517."No, I''m not.@k@v10/40100518. I''ll admit that the island has been stained completely black from your ink bottle,@k@v10/40100519. ......but there''s still a white square left."'
30147: 'BEATRICE@r@v27/40700571."Hoh, and where...?!!"'
30148: 'Battler@r@v10/40100520."Right under my feet.@k@v10/40100521. .........Your magic ink may try to cover the entire island, but it can''t cover the ground my feet are standing on.@k@v10/40100522. ...Even if this island seems to be stained pitch-black at a glance, I am me.@k@v10/40100523. I am here, with my feet firmly planted on a white square!!"'
30149: '@rIt''s strange...@k Until a second ago, I was trembling all over.'
30150: '@r......But now that she''s appeared openly right before my eyes like this, my terror has actually lessened.'
30151: '@rIt''s funny.@k Ghosts are most terrifying when you can only sense them.'
30152: '@rWhen you can see them, and they have a face you can plant your fist into, there''s nothing scary about it...!!'
30153: '@r......However, she is definitely not a funny or a friendly person.'
30154: '@r......She can kill me instantly while rolling around giggling, just by snapping a finger.'
30155: '@rWhether we interpret the result of her snapping her fingers as magic flying at me or underlings showing up to shoot me, it doesn''t matter.'
30156: '@r......In any case, whether this is fantasy or mystery,@k that queen is in a position where she can kill me just by snapping her fingers......!'
30157: '@r...I see, ......so this is the meaning...@w500.......of the queen of this island,@k ...who reigns over both the white and black squares......?!'
30158: 'BEATRICE@r@v27/40700572."Now then.@k@v27/40700573. It might be interesting to wait until you catch a cold in all that rain, but it''s about time to move to the matter at hand.@k@v27/40700574. .........I am sure that you can tell there is a box there?@k @v27/40700575.Your test is inside of it."'
30159: 'Battler@r@v10/40100524."Hold it.@k@v10/40100525. ......After all that''s happened, I''m not interested in some stupid game about who''ll be the next head."'
30160: 'Battler@r@v10/40100526."My game is to take you and the old man, ......and all the rest of you guys who killed everyone, and give every one of you a full-on punch to the face."'
30161: 'BEATRICE@r@v27/40700576."Hoh.@k@v27/40700577. So you will fly through the sky up to my balcony?@k@v27/40700578. Very good, very good, *cackle*!@k @v27/40700579.Come on then, up you come already, come on come on, up up!"'
30162: 'Battler@r@v10/40100528."......Damn you, acting like you''re hot shit just ''cause you''re in a completely safe place...@k@|@y@v10/40100529. I''m coming up there right now, so you better be prepared!!"'
30163: 'BEATRICE@r@v27/40700580."Aah, no, no, no.@k@v27/40700581. It''s all locked up.@k@v27/40700582. Of course, the shutters are down for all the windows as well.@k@v27/40700583. My castle isn''t so fragile that a single knight like you could break in!"'
30164: '@rI tried the front door anyway just in case, ......but, yup, it really was locked.@k@rWhen I looked around, I noticed that indeed the shutters were closed on the windows.'
30165: '@r......Normally, they wouldn''t be.'
30166: 'Battler@r@v10/40100530."......Tch.@k@v10/40100531. Looks like you prepare for everything.@k@v10/40100532. ......Where''s the key?!"'
30167: '@rGohda-san and Kumasawa-san probably have master keys, but they''re in the locked room of the gardening storehouse.'
30168: '@r......I can only give up for now...!'
30169: 'Battler@r@v10/40100533."Damn......@k@v10/40100534. ......Guess she''s no fool herself."'
30170: 'BEATRICE@r@v27/40700584."Are you really so dying to be right by my siiiide?@k @v27/40700585.Alright, if you pass your test with flying colors, why don''t I grant you an audience?@k@v27/40700586. If you pass, then you will be the successor, and my new master after Kinzo."'
30171: 'BEATRICE@r@v27/40700587."......My body and soul will be yours to do with as you will.@k@v27/40700588. Because I am ultimately the Ushiromiya family''s furniture!@k @v27/40700589.Ah-hah-hah-hah-hah-hah!!"'
30172: 'Battler@r@v10/40100535."............Well,@k@v10/40100536. it looks like you want to make me take this test no matter what.@k@v10/40100537. ......Alright.@k@v10/40100538. I''m game.@k@v10/40100539. ...If I pass, my first prize will be a punch to your face."'
30173: 'BEATRICE@r@v27/40700590."Scary, scaary...@k@v27/40700591. But it''s not like I mind being controlled by violence, you see?@k @v27/40700592.Grab...onto my head!@k@v27/40700593. Make my face twist in pain, violate me in the same way a hawk tears apart and scratches at its prey with its talons...!!"'
30174: 'BEATRICE@r@v27/40700594."Aaah, remind me of Kinzo in his younger days once more...!!@k @v27/40700595.That single time in my thousand-year life!@k @v27/40700596.Remind me of that day I was taught the joy of being controlled, of submitting and being reduced to furnituuuuuuuure!!@k @|@y@v27/40700597.Uhyaaahhyahhyahhyahhya!!"'
30175: 'Battler@r@v10/40100540."......You damn drunk, we aren''t getting anywhere."'
30176: '@rIgnoring the stupidly smiling witch, I picked up the box.'
30177: 'BEATRICE@r@v27/40700598."Yes.@k@v27/40700599. Open it.@k@v27/40700600. Inside is a letter.@k@v27/40700601. Read it."'
30178: 'Battler@r@v10/40100541."........................"'
30179: '@rI opened it.@k ......There was a faint smell of cigarettes.@k@rApparently, it really had originally been a cigar case.@k@rBut there were no cigarettes or cigars inside.'
30180: '@rInstead, there was a Western envelope with the One-winged Eagle crest.@k@rAnd when I opened that too, ......there was a letter inside.'
30181: '@rI looked up at the witch.@k She was grinning down at me.'
30182: '@r......It seemed she was waiting in anticipation to see what kind of reaction I''d have to the contents.'
30183: '@r......Dammit, I''ll show her.@k Its contents were like this...'
30184: '@r@z70.Among the three mentioned below.@k@rIn order to gain two, sacrifice one.@k@r@r1. Your life@k     @r2. __''s life@k     @r3. Everyone else''s lives@k@r@rIf you do not choose one, all of the above will be lost.'
30185: 'Battler@r@v10/40100542.".........The heck is this?@k@v10/40100543. Some pretty creepy stuff''s written here.@k@v10/40100544. And most importantly, the second one is blank, so I don''t even know whose life."'
30186: 'BEATRICE@r@v27/40700602."Mm.@k@v27/40700603. That second one is where you put the name of the one that person loves the most.@k@v27/40700604. For Jessica''s test, it was Kanon''s name, and for George''s test it was Shannon''s name."'
30187: 'BEATRICE@r@v27/40700605."......Since they had obvious feelings for certain people, I was able to write those names in beforehand,@k@v27/40700606. but I don''t know who you have feelings for.@k@v27/40700607. So I didn''t know whose name to write, and left it blank."'
30188: 'Battler@r@v10/40100545."That''s perfect.@k@v10/40100546. I love you, BEATRICE.@k@v10/40100547. I''ll stick your name in here.@k@v10/40100548. So my choice is going to be number two.@k@v10/40100549. Is that alright?"'
30189: 'BEATRICE@r@v27/40700608."Hey, hey, quit joking, quit joking.@k@v27/40700609. Come onnn, please, Battler.@k@v27/40700610. Tell me the name of the person you have feelings for.@k@v27/40700611. If you don''t, then this won''t be a test, right?"'
30190: 'Battler@r@v10/40100550."Too bad.@k@v10/40100551. I don''t have any woman in particular.@k@v10/40100552. Even if I did, why the hell would I tell you?"'
30191: 'BEATRICE@r@v27/40700612."In that case, this test will not work for you.@k@v27/40700613. Hmmm, what a shame, what a shame.@k@v27/40700614. And I was really wondering what kind of woman was your cup of tea!@k @v27/40700615.*cackle*cackle*!"'
30192: 'Battler@r@v10/40100553.".........What if I said I like young, flat-chested girls with long, black hair.@k@v10/40100554. You don''t match in a single area, do you?"'
30193: 'BEATRICE@r@v27/40700616."Lies, you breast sommelier!@k @v27/40700617.You prefer a blonde bombshell with a <dynamite body>, don''t you?!@k @v27/40700618.I am precisely the embodiment of your ideal, *cackle*cackle*!"'
30194: 'Battler@r@v10/40100555."If guessing your three sizes is the test to become the successor, I''ll take it gladly."'
30195: 'BEATRICE@r@v27/40700619."Ah, yes.@k@v27/40700620. This was the test to choose the successor.@k@v27/40700621. Chatting with you is so much fun that I''ve been getting a bit off topic."'
30196: 'BEATRICE@r@v27/40700622."......Then let us begin the headship test.@k@v27/40700623. I will question you to see whether you are qualified to be the next Ushiromiya family head.@k@v27/40700624. Answer with care."'
30197: '@rThe witch, who had been joking around like she was drunk until a second ago, suddenly regained her gravitas.'
30198: '@r......She looked as though she truly had stepped out of that imposing portrait...'
30199: 'BEATRICE@r@v27/40700625.".........I am the Ushiromiya family alchemist, the Golden Witch and the Endless Witch, BEATRICE."'
30200: 'BEATRICE@r@v27/40700626."......Do you have the qualifications to inherit the Ushiromiya family headship and all of my gold - @k@v27/40700627.that is what I will test.@k@v27/40700628. .........State your name."'
30201: 'Battler@r@v10/40100556."............Ushiromiya...Battler."'
30202: '@rUnder that majestic gaze, unimaginable from her manner a short while ago,@k I answered without any hesitation.'
30203: '@r......She truly was......yes, indeed,@k ......in the truest sense, she was that worthy of calling herself the queen of this island.'
30204: 'BEATRICE@r@v27/40700629."Very good, Ushiromiya Battler.@k@v27/40700630. .........However, you have thrown away that Ushiromiya name for the past six years, have you not...?@k @v27/40700631.Why is that...?"'
30205: 'Battler@r@v10/40100557.".........mgh............@k@v10/40100558. ......Because I''d had enough of my dad, the old bastard."'
30206: 'BEATRICE@r@v27/40700632."I know.@k@v27/40700633. It was because you felt your father''s remarriage disgraced the death of your mother, whom you loved and respected, yes...?"'
30207: 'BEATRICE@r@v27/40700634."I see, you have no blood relation to your new mother whatsoever.@k@v27/40700635. It is not as though I cannot understand why you would feel unable to accept that mother.@k@v27/40700636. ......However, no matter who your father remarries with, that does not change the fact that his blood runs in your veins, correct?"'
30208: 'Battler@r@v10/40100559.".........What''s your point?"'
30209: 'BEATRICE@r@v27/40700637."I can, to an extent, understand the childishness which led you to oppose your father''s remarriage out of a desire to have him all to yourself."'
30210: 'BEATRICE@r@v27/40700638."However, was throwing away the Ushiromiya name as a means of resistance not a disgrace to your family and blood?"'
30211: 'BEATRICE@r@v27/40700639.".........You were born and raised Ushiromiya, were you not?@k@v27/40700640. Do you think you were qualified to forget that debt and throw away the Ushiromiya name?"'
30212: 'Battler@r@v10/40100560."......It has nothing to do with you.@k@v10/40100561. This is between me and Dad...!"'
30213: 'BEATRICE@r@v27/40700641."The Ushiromiya name does not belong to you and your father alone.@k@v27/40700642. You are a child who simply rebelled, unable to forgive the fact that your father was to be stolen away by an unknown woman.@k@v27/40700643. ......Those six years during which you forsook the Ushiromiya register were a significantly long period where you dragged the Ushiromiya name through the mud.@k@v27/40700644. Know the depths of your sinfulness."'
30214: 'Battler@r@v10/40100562."..................Well, sorry I''m so childish..."'
30215: 'BEATRICE@r@v27/40700645."However.@k@v27/40700646. Even though it was prompted by the deaths of your grandparents, I do commend you for returning to the Ushiromiya register.@k@v27/40700647. Accordingly, I shall give you a chance to purify yourself of that sin.@k@v27/40700648. Now is the time to atone for your sin of six years ago."'
30216: 'BEATRICE@r@v27/40700649."Come, try to remember, remember your own sin.@k@v27/40700650. Remember it, confess, and repent.@k@v27/40700651. ............That shall be my test for you."'
30217: '@r......At that moment, a massive thunderclap rang out, making my mind go blank.'
30218: 'Battler@r@v10/40100563."..............................@k@v10/40100564. ......Repent? ...What?@k@v10/40100565. .........Are you trying to tell me to apologize?"'
30219: 'BEATRICE@r@v27/40700652.".........The test has already begun.@k@v27/40700653. You may think as you wish."'
30220: '@rThere were no signs from the witch''s expression that she was sneering at a person unable to answer the tough question thrust upon them.@k@r......She was earnestly asking something of him, and he could even feel a quiet determination.'
30221: '@rEven as the rain beat upon him, Battler could not shift his eyes from her gaze.'
30222: '@r......The witch threw her umbrella away.@k@rShe abandoned herself to the falling rain.'
30223: '@rSo that the rain would fall on her until Battler answered that question.'
30224: '@r......She had chosen to join him, allowing the rain to beat down on her as well, until he reached an answer.'
30225: '@rFor some reason, Battler could tell that.@k@r......But, even so, ......he didn''t understand.'
30226: 'Battler@r@v10/40100566."W-......well, ...uh.@k@v10/40100567. ......I mean, you''re right, I do think I was being childish...@k@v10/40100568. All things considered, just ''cause Dad got remarried, that doesn''t wipe out what I owe him for raising me."'
30227: 'Battler@r@v10/40100569."......I hear Dad always kept on sending money over for my living expenses,@k@v10/40100570. ......and he even said he wanted to be involved in my school events.@k@v10/40100571. .........The only reason he couldn''t come is......I told Grandma and Grandpa not to let him come no matter what......"'
30228: 'BEATRICE@r@v27/40700654."......................................."'
30229: 'Battler@r@v10/40100572."......A-and yeah, ......if you want to just be blunt and say I was being childish and rebellious, I can''t argue with that.@k@v10/40100573. .........But you know, ...in that case,@k@v10/40100574. ......Mom, ......Ushiromiya Asumu, who''s gonna set things right for her...?!@k @v10/40100575.Mom was so devoted to our family, and did the very best she could...!"'
30230: 'Battler@r@v10/40100576."But Dad was cheating with Kyrie-san.@k@v10/40100577. He even got her pregnant with Ange...!@k @v10/40100578.And then the moment she was born, he rushed them both into his register."'
30231: 'Battler@r@v10/40100579."......What is that if not a betrayal of Mom?!@k @v10/40100580.Who''s gonna set things...@k @v10/40100581.right...@k @v10/40100582.for her?!!"'
30232: 'Battler@r@v10/40100583."......But what you''re saying is also right.@k@v10/40100584. Even though the cheating was a fact, I still owed him for raising me."'
30233: 'Battler@r@v10/40100585."So I thought I''d cancel those two things out and leave the family, what''s the problem with that?!!@k @v10/40100586.That''s right, I had the right, ......no, the duty to wallop Dad in Mom''s place, didn''t I?!"'
30234: 'Battler@r@v10/40100587."I let him get away without that!@k @v10/40100588.I left without saying anything, as though I hadn''t been there in the first place!!@k @v10/40100589.And Dad forgot about me and started a new family with Kyrie-san and Ange!@k @v10/40100590.That settles everything, doesn''t it?!!"'
30235: '@rBut six years passed after that.@k ......Time healed the anger.'
30236: '@rKyrie-san understood my anger as well,@k and she tried hard to interact with me despite that, and soften my heart.'
30237: '@rAnge didn''t know anything about the situation,@k and she adored me, believing that I was her real big brother who just lived in a separate house.'
30238: '@r......As for Dad, he was acting like nothing had happened, and told me I could come home any time I wanted.'
30239: 'Battler@r@v10/40100591."It started to feel more and more stupid keeping it all going!!@k @v10/40100592.I thought it was about time for me to cool my head as well.@k@v10/40100593. So I said to Dad that if he apologized, I''d call it water under the bridge.@k@v10/40100594. On the day of Grandpa''s funeral."'
30240: 'Battler@r@v10/40100595."And that guy, he actually put both his hands on the floor and apologized...!!@k @v10/40100596.I couldn''t believe how pathetic he looked...!"'
30241: 'Battler@r@v10/40100597."My dad, who was all about looking cool, actually bowed his goddamn head to me...!@k @v10/40100598.......When I saw that, it felt like it''d be stupid to keep it up any longer."'
30242: 'Battler@r@v10/40100599."I''m sure Mom would''ve thought the same thing!@k @v10/40100600.Every time Dad and I fought, Mom would always laugh and mediate for us.@k@v10/40100601. "Oh, that silly thing is what you were fighting over?"@k @v10/40100602.she''d say.@k@v10/40100603. ......I could feel Mom saying that and laughing...!!"'
30243: 'Battler@r@v10/40100604."That''s why,@v10/40100605. ......while I couldn''t bring myself to say "I forgive you",@v10/40100606. .........I thought it might be alright to start over again from zero.@k@v10/40100607. So I decided to wind everything back to how it was six years ago.@k@v10/40100608. .........And I returned to the Ushiromiya family register...!!@k @v10/40100609.I''d cried, raged, and stressed over it for a whole six years!"'
30244: 'Battler@r@v10/40100610."It might have been the same for Dad, and maybe even for my dead mom.@k@v10/40100611. Maybe Kyrie-san and Ange too.@k@v10/40100612. ......So we went back to zero, and I returned to being Ushiromiya Battler!!!@k @v10/40100613.That''s my immediate family''s problem,@v10/40100614. ......and has nothing the hell to do with the Ushiromiya family!!"'
30245: 'Battler@r@v10/40100615."You aren''t qualified to judge that to be a sin, and I have no duty to show repentance to you!@k @v10/40100616.If there was anyone I should have done that for, you''ve already killed them!!"'
30246: 'Battler@r@v10/40100617."So I won''t apologize for anything!@k @v10/40100618.I won''t repent!!!@k @v10/40100619.That is my answer for this test!!!"'
30247: 'BEATRICE@r@v27/40700655."..........................................@k@v27/40700656. ......Is that all...?"'
30248: 'Battler@r@v10/40100620."What.........?@k @v10/40100621..................."'
30249: '@rI had pretty much fully responded to her provocation,@k and I was sure that I''d vented out all the stuff that I''d been keeping inside my chest, stuff I hadn''t wanted to show anyone.'
30250: '@rThat was what the witch had supposedly been hoping for, too.@k ......And yet, the witch''s blank expression didn''t change in the slightest.'
30251: '@rI had been sure she would start cackling and guffawing,@k sneering at my childish, foolish, and shameful past.'
30252: '@rBut to the contrary, I could feel a sense of shock about her,@k ......something you could almost call disappointment.'
30253: 'Battler@r@v10/40100622.".........What do you mean "is that all", ......I''ve confessed everything inside me!@k @v10/40100623.What aren''t you happy about?"'
30254: 'BEATRICE@r@v27/40700657."The atonement for your sins is still insufficient."'
30255: 'Battler@r@v10/40100624."Atonement?@k @v10/40100625.......What the hell, are you asking me to prostrate myself right here and apologize like Dad did...?!"'
30256: 'BEATRICE@r@v27/40700658."............No.@k@v27/40700659. I have no interest in the home affairs of your immediate family.@k@v27/40700660. Where are we?@k @v27/40700661.Rokkenjima.@k@v27/40700662. The main residence of the Ushiromiya head family.@k@v27/40700663. ......Isn''t there a sin you should remember, fitting for this place......?"'
30257: 'Battler@r@v10/40100626."............Are you......saying that I have...another sin......?"'
30258: 'BEATRICE@r@v27/40700664."......Remember, Ushiromiya Battler.@k@v27/40700665. .........And it is your inability to remember which is your sin.@k@v27/40700666. For that reason, I shall forgive you.@k@v27/40700667. If you can remember, I shall forgive you.@k@v27/40700668. .........Remembering that is my test of atonement for you."'
30259: 'Battler@r@v10/40100627.".........That''s......a lot easier said than done......"'
30260: 'BEATRICE@r@v27/40700669."............Remember.@k@v27/40700670. ......That is why it is a sin."'
30261: 'Battler@r@v10/40100628."...Sorry, Beato.@k@v10/40100629. ......I have absolutely no memory of it."'
30262: 'Battler@r@v10/40100630."......You make it seem like I caused you trouble six years ago or something,@k@v10/40100631. but unless I''m mistaken, this family conference is the first time we met.@k@v10/40100632. It''s true that your legend did exist six years ago,@k@v10/40100633. but I''m pretty confident that we didn''t know each other back then."'
30263: 'BEATRICE@r@v27/40700671."......Naturally.@k@v27/40700672. On the Rokkenjima of six years ago, I was not yet manifested."'
30264: 'Battler@r@v10/40100634."Then what kind of sin are you saying I have?@k@v10/40100635. ......Are you saying......I''ve sinned against you somehow...?"'
30265: 'BEATRICE@r@v27/40700673."Do not make me repeat myself.@k@v27/40700674. I was not manifested six years ago.@k@v27/40700675. For us to have been acquainted would be an impossibility.@k@v27/40700676. In the world you represent, it was as though I did not even exist."'
30266: '@r......Beato''s cold eyes......felt as though they were accusing me of some kind of sin.'
30267: '@rIt felt, on the face of it, as though she was still holding a grudge for some way I''d treated her, and was criticizing me for it.'
30268: '@rHowever, ......I obviously couldn''t remember doing anything like that to her, and Beato had said so herself.'
30269: '@rThere was no link between us six years ago.'
30270: '@r@c900.@[Six years ago, no person called BEATRICE existed for me.@]@c.'
30271: 'Battler@r@v10/40100636.".........At least give me a hint.@k@v10/40100637. ......Does this sin or whatever...have something to do with...@v10/40100638....you and me......?"'
30272: 'BEATRICE@r@v27/40700677."I had no connection to you six years ago.@k@v27/40700678. Remove me from your thoughts already.@k@|@y@v27/40700679. ......Why...do you think it is a sin against me?"'
30273: 'Battler@r@v10/40100639.".........Your......eyes."'
30274: 'BEATRICE@r@v27/40700680."Eyes...?@k @v27/40700681.............Hoh."'
30275: 'Battler@r@v10/40100640."Your eyes, they''re......whispering at me to apologize.@k@v10/40100641. ......But I had no connection with you six years ago, and even you admitted that."'
30276: 'Battler@r@v10/40100642."............Is it true?@k @v10/40100643.......Is it really not a problem between me and you......?"'
30277: 'BEATRICE@r@v27/40700682.".........I already said it wasn''t.@k@v27/40700683. No problem between me and you has anything to do with this."'
30278: 'Battler@r@v10/40100644."But still, ......your eyes are telling me differently.@k@v10/40100645. ............So I don''t even have a clue.@k@|@y@v10/40100646. .........Can you say it in red?@k @v10/40100647.Can you declare that the sin you''re telling me to remember isn''t something between you and me?"'
30279: 'BEATRICE@r@v27/40700684."...........................@k@v27/40700685. ......Very well."'
30280: '@r@c900.@[The sin I am now demanding that you remember is not between Ushiromiya Battler and BEATRICE.@]@c.'
30281: 'Battler@r@v10/40100648.".........Then why are you looking at me with those eyes......?"'
30282: 'BEATRICE@r@v27/40700686."I do not know.@k@v27/40700687. .........I am simply gazing at you blankly.@k@v27/40700688. If it feels that way to you,@v27/40700689. ......perhaps that is because there is something that makes you feel that way."'
30283: 'Battler@r@v10/40100649."........................@k@v10/40100650. .........What the hell kind of sin have I got?"'
30284: 'BEATRICE@r@v27/40700690.@|@y"@c900.@[Ushiromiya Battler has a sin.@]@c."'
30285: 'Battler@r@v10/40100651."......I said what kind, dammit.@k@v10/40100652. It''s probably just some stupid sin, like hitting someone or tricking someone."'
30286: 'BEATRICE@r@v27/40700691.@|@y"@c900.@[Because of your sin, people die.@]@c."'
30287: 'Battler@r@v10/40100653."L-liar...!@k @v10/40100654.I''ve never killed anyone...!!@k @|@y@v10/40100655.Say it, then!@k @v10/40100656.Who did I kill?!@k@v10/40100657. When? Who? How?!"'
30288: 'BEATRICE@r@v27/40700692.@|@y"@c900.@[Due to your sin, a great many humans on this island die.@]@c.@k @v27/40700693.@|@y@c900.@[None will escape, all will die.@]@c."'
30289: 'Battler@r@v10/40100658."Wh-.........whaaaaat?!?!@k @v10/40100659.Wh-what the hell are you going on about?!@k @v10/40100660.Are you saying I killed everyone?!@k @v10/40100661.I''m a killer?!"'
30290: 'BEATRICE@r@v27/40700694."You do not carry it out directly.@k@v27/40700695. .........However, because you committed a sin, the cogs of fate were sent astray, spun a full six years, and due to the deviation that resulted,@k@v27/40700696. ......tonight, this many lives are lost."'
30291: 'BEATRICE@r@v27/40700697."You are one of the causes of this tragedy."'
30292: 'Battler@r@v10/40100662."......Oh, ......come the fuck on!!@k @v10/40100663.I''m the cause?!@k @v10/40100664.Then what?!@k @v10/40100665.Are you saying thirteen people died because I abandoned the Ushiromiya register six years ago?!@k @v10/40100666.Are you saying thirteen people died because I came back to the Ushiromiya family after six years?!"'
30293: 'Battler@r@v10/40100667."Give me a fucking break!!!@k @v10/40100668.For these six years, I''ve been the man furthest from the Ushiromiya family!@k @v10/40100669.What influence could I have had on anything and how?!"'
30294: 'Battler@r@v10/40100670."It''s not like I came to the family conference because I wanted to!@k @v10/40100671.I''d patched things up with the family after six years, so to like, draw a line under that whole period,@k@v10/40100672. I came to Rokkenjima reluctantly...!!@k @v10/40100673.It''s not like I had some duty to come here today!"'
30295: 'Battler@r@v10/40100674."I came back, and because of that a tragedy occurred?@k @v10/40100675.Then what?!@k @v10/40100676.You''re saying that if I hadn''t come back, no one would''ve had to die?!"'
30296: 'Battler@r@v10/40100677."Say it in red!!@k @v10/40100678.Can you say in red that if I hadn''t come back, this screwed-up murder case wouldn''t have occurred?!@k @v10/40100679.......There''s no way you can, because you''re the culprit behind everything!!"'
30297: 'Battler@r@v10/40100680."Repetition requested!!@k @v10/40100681."If Ushiromiya Battler hadn''t returned to Rokkenjima, the crime wouldn''t have occurred".@k@v10/40100682. Go on, say it if you think you can...!!"'
30298: 'Battler@r@v10/40100683."......Can''t do it, can you?@k @v10/40100684.There''s no way in hell you can, the culprit is you, not me!!@k @v10/40100685.Don''t you dare try to push the blame for this onto meeeeeeee!!!"'
30299: 'BEATRICE@r@v27/40700698."......................................."'
30300: 'Battler@r@v10/40100686."......Answer, in red!!@k @v10/40100687.I said repeat it...!!@k @v10/40100688.You can''t!@k @v10/40100689.My existence has nothing to do with the crime.@k@|@y@v10/40100690. Stop messing with my heeeaaaad!!!"'
30301: '@rI began to remember that the raindrops pounding down were cold.'
30302: '@r......The rain earlier had just hurt,@k ......but now I felt a tormenting cold from those raindrops......'
30303: 'BEATRICE@r@v27/40700699.".................................@k@v27/40700700. ......Is there nothing that you remember?"'
30304: 'Battler@r@v10/40100691.".........Sorry,@k@v10/40100692. but I don''t have a goddamn clue."'
30305: 'BEATRICE@r@v27/40700701.".............................."'
30306: 'Battler@r@v10/40100693."......Look.@k@v10/40100694. ......I''m starting to get a little pissed off.@k@v10/40100695. ......If there''s something you wanna say, then say it.@k@v10/40100696. If you have a grudge against me, you just have to come out and say it.@k@v10/40100697. ......Don''t be nasty about it and demand for me to remember."'
30307: 'BEATRICE@r@v27/40700702."............I''ll ask one more time.@k@v27/40700703. ......Can you not remember any sin?"'
30308: 'Battler@r@v10/40100698."No!!@k @v10/40100699.I can''t remember a goddamn thing...!!"'
30309: 'BEATRICE@r@v27/40700704.".........So...@v27/40700705....he says that he can remember...nothing."'
30310: 'BEATRICE@r@v27/40700706.With this, are your regrets at an end......?'
30311: 'BEATRICE@r@v27/40700707."...........................@k@v27/40700708. ...............m...m..."'
30312: 'BEATRICE@r@v27/40700709.Even a hopelessly long shot will be a source of regret if not attempted.@k@r@v27/40700710.......That will do.@k@r@v27/40700711.The attempt itself has meaning.'
30313: 'BEATRICE@r@v27/40700712.".........That may be true.@k@v27/40700713. ...In that case, this is...@k@v27/40700714.the end of my regrets, and my game."'
30314: 'BEATRICE@r@v27/40700715.What will you do...?'
30315: 'BEATRICE@r@v27/40700716."...Who knows.@k@v27/40700717. .........I''m not interested at all anymore.@k@v27/40700718. ......Sorry, but I wish to leave the game board now."'
30316: 'BEATRICE@r@v27/40700719...............................@k@r@v27/40700720. ......I see.@k@v27/40700720_1. ......I understand.'
30317: 'BEATRICE@r@v27/40700721."I will take over for the rest of the game.@k@v27/40700722. .........You may rest."'
30318: 'BEATRICE@r@v27/40700723."......Mm.@k@v27/40700724. ..............."'
30319: 'BEATRICE@r@v27/40700725."All that remains, I will finish.@k@v27/40700726. .........You may forget everything and bury your head in your pillow.@k@v27/40700727. A feather futon should gently protect you from everything."'
30320: 'BEATRICE@r@v27/40700728.".........Finish up the rest for me, ......please."'
30321: 'BEATRICE@r@v27/40700729."Leave it to me.@k@v27/40700730. ......Leave everything else to me, and sleep."'
30322: '@rThe witch who had questioned Battler hid herself,@k and the other witch, who had appeared from behind, remained.'
30323: '@rShe was certainly identical, the same witch,@k .........but her expression was somehow indifferent and ice-cold,@k ......a far cry from the one before, who, though apparently drunk, had at least been in high spirits.'
30324: 'Battler@r@v10/40100700."...............Hey!!@k @v10/40100701.Are you listening?!@k @v10/40100702.That''s enough for that test thing, right?!@k @v10/40100703.I don''t give a crap whether I passed or failed!@k @v10/40100704.The only thing that''s gonna help the way I''m feeling is bashing you in the face!!@k @v10/40100705.Get the hell down here!!@k @v10/40100706.Or else open up this door...!!"'
30325: '@rThe witch said nothing back.'
30326: '@rHer eyes were as ice-cold as Battler''s shoulders.'
30327: '@r......She was clearly a different person from the one who had first appeared on that balcony.'
30328: '@rThe witch looked hard into my eyes, ......and gave two small shakes of the head.'
30329: '@rEven without words, I was able to gather that she was expressing some kind of disappointment...'
30330: '@rWithout saying anything, the witch turned on her heels.'
30331: '@rAfter that, only Battler remained, the cold rain still beating down on him.........'
30332: '@rThe study was in the middle of a lively party.'
30333: '@rIt seemed that Gaap was making fun of VIRGILIA, teasing her over some stupid triviality.'
30334: '@r...They were spitting "Lialialia", "Gapgapgap" at each other.'
30335: '@rKinzo and Ronove had opened a new bottle and were enjoying the show.'
30336: 'Kinzo@r@v01/41500503."Oh, you''re back.@k@v01/41500504. How were the results of Battler''s test?!"'
30337: 'Kinzo@r@v01/41500505."Maria''s test got passing marks with no complaints, I''ll have you know?@k @v01/41500506.I''ve long held her in contempt as a worthless little urchin,@k@v01/41500507. but lo and behold, surprise surprise, my oh my oh my oh my, not bad, not bad, not bad indeed!@k @v01/41500508.Wa-hah-hah-hah-hah-hah!!"'
30338: '@rIt seemed like Kinzo was dead drunk.@k@rHe laughed towards Beato with the same level of excitation as the time they''d left for the tests.'
30339: '@r...However, Ronove and VIRGILIA instantly noticed the change in her enthusiasm.'
30340: '@rGaap also froze her expression and went silent.'
30341: 'Kinzo@r@v01/41500509."Wahhahahahahahhahha, what is it, BEATRICE, my beloved witch?@k@v01/41500510. Not enough to drink? Not enough on the side?@k @v01/41500511.Let''s go out in the pouring rain and roast a cow whole, oohhh, not a bad idea!"'
30342: 'Kinzo@r@v01/41500512."Ronove, make the preparations right away!@k @v01/41500513.BEATRICE, let''s leave the results of Battler''s test for later.@k@v01/41500514. Why don''t we have a toast with spare ribs first, uwa-hah-hah-hah-hah-hah!!"'
30343: 'BEATRICE@r@v27/40700731."..................Roast yourself whole."'
30344: 'Kinzo@r@v01/41500515."-ha-hah-hah-hah,@v01/41500516. ......what?"'
30345: '@rAs Kinzo doubled over laughing in a great mood, the witch who had spoken bluntly passed him coldly by.'
30346: '@r......Then, behind the witch''s back,@w500. .........the old summoner''s body suddenly went up in flames...'
30347: 'Kinzo@r@v01/41500517."Gyuoaaaaooaahhh!!!!@k @v01/41500518.Gwohh, gah, ......gyah.........w...h...y............?!"'
30348: '@rWhile spitting crimson flames from his eyes, mouth, nose...every hole on his body, Kinzo rolled around.'
30349: '@r......Even though it was a terrible hellfire, it didn''t burn anything except Kinzo.'
30350: '@rKinzo didn''t have a clue what was going on.'
30351: '@r......He rolled around, unable to understand why BEATRICE, who had been in such a good mood,@k had suddenly turned so cold......'
30352: '@rThe dancing silhouettes of witches and demons created by that massive rolling torch...@klooked like a group of excited spectators around a burning at the stake.'
30353: '@rHowever, the eyes of the demons watching over it were indifferent......'
30354: '@rWhen Kinzo finally stopped moving, the fire disappeared, leaving a pitch-black corpse.'
30355: '@rThe inside of the room was commanded by the stillness of the sound of the rain......'
30356: 'Ronove@r@v31/43100272."......What has happened, Milady?"'
30357: 'BEATRICE@r@v27/40700732."It has lost its thrill.@k@v27/40700733. .........Clean up those bothersome cinders."'
30358: '@rBEATRICE''s expression......was unbelievably apathetic.'
30359: '@r...There was an iciness there that told the others that they risked the same fate as Kinzo if they annoyed her.'
30360: 'Gaap@r@v32/43700346."............Y-yes.@k@v32/43700347. I will do it..."'
30361: '@rGaap made a jet-black pitfall swallow up Kinzo''s cinders.'
30362: '@r...If she hadn''t carried that out quickly, Gaap might also have been burned.@k You could feel that thirst for blood.'
30363: '@rNo, a thirst for blood probably isn''t the best way to describe it.'
30364: '@r......Just like humans don''t have any particular emotion when they step on an ant while walking.'
30365: '@r......That was how much, unconsciously and mercilessly, Beato was now filled with a brutal emptiness that wouldn''t hesitate to bury a passerby...'
30366: 'VIRGILIA@r@v30/43200201."......Wh-what is it, Beato?"'
30367: 'BEATRICE@r@v27/40700734."I don''t want to answer.@k@v27/40700735. ...............No, I can''t even be bothered to answer any more."'
30368: 'Gaap@r@v32/43700348.".........What is it? This isn''t like you.@k@v32/43700349. ......Did something happen?@k @v32/43700350.Did Battler say someth - "'
30369: 'Gaap@r@v32/43700351.".........k...g...gyhh - "'
30370: '@rBEATRICE hadn''t even responded.@k It seemed that she had even ignored it.'
30371: '@rBut there was a change in Gaap.'
30372: '@rFrom her feet, a crackling, cracking sound rose, like thin ice breaking,@k ......and in an instant, turned Gaap into a glass sculpture.'
30373: 'VIRGILIA@r@v30/43200202."G-......Gaap..."'
30374: 'BEATRICE@r@v27/40700736."............Disappear for a while.@k@v27/40700737. I''m in a very bad mood."'
30375: '@rBEATRICE spoke in a truly cold voice,@k ......which froze the heart just to hear it.'
30376: 'Ronove@r@v31/43100273."......Certainly.@k@v31/43100274. In that case, please allow us to retire.@k@v31/43100275. .........If you need anything, call at any time."'
30377: '@rAfter a single bow, Ronove turned into a cloud of gold butterflies, and hid himself.'
30378: '@rVIRGILIA turned Gaap from a sculpture into a group of gold butterflies,@k and then turned into a cloud of them herself, which mixed in with the others and disappeared.'
30379: '@r............In the study made untidy by drinking,@k ......BEATRICE stood still, alone.'
30380: '@rSince the time she had returned, her expression hadn''t changed in the slightest...'
30381: '@r......However, when she saw the fallen empty wine bottles and scattered cheese plates,@k her brow furrowed, and she looked a bit displeased.'
30382: '@rAnd when she whispered "disappear", in that instant, the room flashed, and was tidy again, as though nothing had ever happened.'
30383: '@rThe reception chairs were neatly arranged, and there was no wine or cheese.@k@rThere were no stains where things had been spilled, nor was there any scattered trash.'
30384: '@r......To the contrary, even the air had frozen over,@k and, enough to make one doubt whether so many noisy people really had been in this room until just moments ago,@k .........the study had returned to total silence.'
30385: '@r.........In that silent, ......frigid study where even the air had frozen,@k BEATRICE stood still...'
30386: '@rThen, she called him in a mutter.'
30387: 'BEATRICE@r@v27/40700738."..................Battler.@k@v27/40700739. Are you there?"'
30388: 'Battler@r@v10/40100707."......I''ve been here for a while.@k@v10/40100708. .........What the hell''s going on with you?@k@v10/40100709. You''ve been acting strange."'
30389: 'BEATRICE@r@v27/40700740."Do I seem strange?@k@v27/40700741. My apologies."'
30390: 'Battler@r@v10/40100710."............Even though you were having such a good time drinking with that damn old fart, you suddenly burned him up,@k@v10/40100711. and your demoness friend is a glass sculpture.@k@v10/40100712. ......Even your demon butler and your master got a "disappear and get the hell out".@k@v10/40100713. ......Just how fickle and selfish are you?"'
30391: 'BEATRICE@r@v27/40700742."Battler. I''m done."'
30392: 'Battler@r@v10/40100714."With what?"'
30393: 'BEATRICE@r@v27/40700743."............I''ve had enough, now."'
30394: 'Battler@r@v10/40100715."Wha?@k @v10/40100716..........Well, uh, you were the one who cooked up this game.@k@|@y@v10/40100717. Heh, if you''ve had enough, that''s great for me.@k@v10/40100718. So basically, you''re resigning?"'
30395: 'BEATRICE@r@v27/40700744."I am not resigning.@k@v27/40700745. I am just ending it.@k@v27/40700746. No, I won''t even end it.@k@v27/40700747. The game will simply be abandoned for all eternity."'
30396: 'Battler@r@v10/40100719."Pretty sure they call that resigning.@k@v10/40100720. ......Man, the words "got tired of it and threw it away" fit you perfectly."'
30397: 'BEATRICE@r@v27/40700748."Precisely.@k@v27/40700749. I am tired of it and am throwing it away.@k@|@y@v27/40700750. I don''t care about the rest.@k@v27/40700751. It can remain abandoned and gather dust as much as it likes."'
30398: 'Battler@r@v10/40100721."........................@k@v10/40100722. ......What''s up with you?@k@v10/40100723. You''ve been kinda hard to deal with since a short while ago."'
30399: 'Battler@r@v10/40100724."......Are you still sour over that baffling test?@k @v10/40100725.If you''ve got something against me, all you have to do is say it clearly."'
30400: 'Battler@r@v10/40100726."You said in red that it has nothing to do with you, but that''s got to be a play on words, right?@k @v10/40100727.It''s written all over your face.@k@v10/40100728. You have a grudge against me."'
30401: 'BEATRICE@r@v27/40700752."How many times will I have to say I have no grudge against you before you''ll understand?@k@v27/40700753. At the time you left your sin behind, I did not exist."'
30402: '@rAs Beato spoke with an irritated expression, her face twisted to look even more displeased.'
30403: '@rFickle.@k Inconsistent.@k Moody.@k Temperamental.@k ......Selfish and simple-minded and cruel.'
30404: '@rBut even so, she had never shown an expression as strange as this even once before now...'
30405: 'Battler@r@v10/40100729."............Well, you were the one who instigated this game.@k@v10/40100730. I''m a bit let down that it won''t get resolved, but feel free to invite me again sometime if you feel like it.@k@|@y@v10/40100731. But when that time comes, allow me to politely decline, alright?@k @v10/40100732.Heheheh."'
30406: '@rHe intentionally spoke in a teasing kind of tone, but Beato showed no reaction.'
30407: '@r......Battler hung his head and clicked his tongue...'
30408: 'Battler@r@v10/40100733."I''ve circled around October 4th and 5th over and over again, but it looks like I''m finally going to be free of all that now.@k@v10/40100734. ......This way, the boat will come tomorrow."'
30409: 'Battler@r@v10/40100735."...That''s right, then the seagulls will return to the harbor.@k@v10/40100736. ......I''ll finally be able to hear Rokkenjima''s signature "nyaa nyaa" cries.@k@v10/40100737. After all, when I came to the island, they weren''t there at all, maybe because of the weather."'
30410: 'Battler@r@v10/40100738.".........''When the seagulls cry, everything will end'', basically.@k@v10/40100739. ......Done and done, all over, the end.@k@v10/40100740. Man, what a relief."'
30411: 'BEATRICE@r@v27/40700754.".........Exactly what is it that you''re misunderstanding?"'
30412: 'Battler@r@v10/40100741."Hm?@k @v10/40100742.What do you mean what?"'
30413: 'BEATRICE@r@v27/40700755.".........I said that nothing would end.@k@v27/40700756. With this, everything will be abandoned.@k@v27/40700757. The game will be forgotten, and the pieces on the board will be left where they lie.@k@v27/40700758. There will be no advancing, no retreating, no taking or being taken.@k@v27/40700759. No victory, no defeat, not even a tie.@k@v27/40700760. Just abandoned."'
30414: 'Battler@r@v10/40100743."............Doesn''t that mean it''s over?"'
30415: 'BEATRICE@r@v27/40700761."Wrong.@k@v27/40700762. On my turn, the game will stop for all eternity.@k@v27/40700763. Your turn will not come.@k@v27/40700764. So there will be no victory, nor defeat, nor a tie."'
30416: 'BEATRICE@r@v27/40700765.".........In the past, I could not allow you to do that to me.@k@v27/40700766. That was because I had the goal of victory against you.@k@v27/40700767. However, I have lost interest in that.@k@v27/40700768. So there is no longer any point in me making any further moves."'
30417: 'Battler@r@v10/40100744."............What do you mean by...my turn won''t come...?"'
30418: '@rI''d thought that Beato getting tired of the game meant I''d be released, and I''d be able to escape Rokkenjima.'
30419: '@rBut for some reason, the meaning of Beato''s repeated words about the difference between abandoning the game and settling it...@k...was starting to bother me...'
30420: '@r.........Just what has she been saying, ...and why the bad mood......?'
30421: '@rSuddenly, I heard a voice from behind me.'
30422: '@rWhen I turned around, ......there was someone I thought I might, or might not, remember from somewhere...'
30423: '@r......A mysterious girl, with no light in her eyes, was standing there.'
30424: 'BERNKASTEL@r@v28/42100063.".........What she means is something like this.@k@v28/42100064. ......Putting the lid back on this game, leaving the pieces as they are.@k@v28/42100065. Without ending, the game will be locked away for all eternity."'
30425: 'LAMBDADELTA@r@v29/42200181."The only way for you to return to your original world is to win against Beato.@k@v29/42200182. .........So Beato abandoning the game would mean...@k@v29/42200183. ......Get it?"'
30426: '@rSuddenly, in another place, there was a girl wearing a bright pink dress.'
30427: '@r......I had a feeling I''d met her somewhere too, but I couldn''t remember.'
30428: '@rMore important was the meaning of the words she said.@k@r......The game being abandoned means......huh?'
30429: 'BERNKASTEL@r@v28/42100066.".........That''s all there is to it.@k@v28/42100067. No match can reach its conclusion without two opposing sides.@k@v28/42100068. .........It means that you''ll never be able to win and escape this world for all eternity."'
30430: 'LAMBDADELTA@r@v29/42200184."In the end, ......it''s kinda like taking the key to the cage that you''re locked in,@k@v29/42200185. fastening it to the collar of a pigeon or something and letting it fly, I guess."'
30431: 'LAMBDADELTA@r@v29/42200186."............This isn''t funny, Beato.@k@v29/42200187. We didn''t come all the way here to watch a boring game like this.@k@v29/42200188. Just wrapping it up here? You have to be kidding me."'
30432: 'BERNKASTEL@r@v28/42100069.".........I''m with Lambda.@k@v28/42100070. I came here to make Battler win, and to make you thrash about in defeat.@k@v28/42100071. I still haven''t achieved that goal.@k@v28/42100072. ......I couldn''t bear for the game to be abandoned here, for you to just run away on me."'
30433: 'BEATRICE@r@v27/40700769."I acknowledge that the way the curtain has fallen on this game has made for a disappointing end for you ladies.@k@|@y@v27/40700770. ......However, I, the host of this tea party, am after all fickle.@k@v27/40700771. Once the fun is gone, I know no way of entertaining.@k@v27/40700772. ......I believe that to be what makes me the witch I am in the first place.@k@v27/40700773. There should be no problems with this...?"'
30434: 'BERNKASTEL@r@v28/42100073."..............................@k@v28/42100074. ......True.@k@v28/42100075. I won''t go against your creed."'
30435: 'LAMBDADELTA@r@v29/42200189."I won''t stand for this...@k@v29/42200190. ......Don''t you dare, how much do you think I''ve supported you...@k@|@y@v29/42200191. All that preparation, and you want me just to pack it all in now?@k @v29/42200192.I don''t think so...!!"'
30436: 'BEATRICE@r@v27/40700773_b."I am saying that I have tired of it.@k@v27/40700773_c. Nothing more, nothing less."'
30437: 'LAMBDADELTA@r@v29/42200193."That''s not happening...@k@v29/42200194. You''re going to continue this game.@k@v29/42200195. You want to win against Battler, right?@k @|@y@v29/42200196.You want to win and make him submit, right?!@k @v29/42200197.You''re almost there!@k @v29/42200198.Isn''t she~?!"'
30438: 'Battler@r@v10/40100745.".........D-don''t turn to me for agreement.@k@|@y@v10/40100746. ......That said, I do have an opinion too.@k@v10/40100747. If you''ll let me say it."'
30439: 'BEATRICE@r@v27/40700774."............What."'
30440: 'Battler@r@v10/40100748."You brought this fight to my door.@k@v10/40100749. I''m prepared to settle this fight one way or the other.@k@v10/40100750. ......I''ve come close to surrendering many times,@k@v10/40100751. but I''ve never had any intention of escaping part-way through, leaving the match undecided."'
30441: 'Battler@r@v10/40100752."......As long as I''m here, showing the will to fight,@k@v10/40100753. ......don''t you go running away, BEATRICE."'
30442: 'Ange@r@v11/42001511."............I agree.@k@v11/42001512. Getting Battler involved and then leaving without giving him victory or defeat is just beyond irresponsible."'
30443: '@rSuddenly, even Gretel was there.@k@r......And everyone was criticizing Beato for being irresponsible.'
30444: 'BEATRICE@r@v27/40700775."Hoh.@k@v27/40700776. .........It seems that the greatest reason I am being called irresponsible is that Battler will be stuck as an opponent."'
30445: 'BEATRICE@r@v27/40700777.".........In that case, Battler.@k@v27/40700778. Will you step down from being an opponent, as I shall?@k @v27/40700779.That way, there will be nothing to criticize me for."'
30446: 'Battler@r@v10/40100754."If I step down, will I be able to leave Rokkenjima...?"'
30447: 'BEATRICE@r@v27/40700780."Of course not.@k@v27/40700781. Just be covered in dust and let it pile up on your shoulders."'
30448: 'Ange@r@v11/42001513.".........Stop being so stupid.@k@v11/42001514. Just how irresponsible are you?@k@v11/42001515. You''ve killed all this many people.@k@v11/42001516. On top of that, using your witch''s power, you''ve done it over and over.@k@v11/42001517. In gruesome ways!@k @v11/42001518..........There''s no way I can allow you to escape without taking responsibility...!"'
30449: 'BEATRICE@r@v27/40700782."Responsibility.@k@v27/40700783. ......Hoh, what is it I should do to take this so-called responsibility?"'
30450: 'Ange@r@v11/42001519."Fight until a resolution is reached.@k@v11/42001520. Battler will sit in the chair across from you, never giving up, and fighting until he beats you.@k@v11/42001521. So you too fight until you''re defeated.@k@v11/42001522. If you don''t want that to happen, then try and defeat him...!!"'
30451: 'Ange@r@v11/42001523."I won''t let you...leave everything unresolved and abandon Battler in this chair,@v11/42001524. ......lock him up forevermore and never let him return...@v11/42001525. .........I won''t let you......!!"'
30452: 'Battler@r@v10/40100755."......Gretel."'
30453: '@rTo be perfectly honest,@k I didn''t really understand from what standpoint Gretel was trying to save me.'
30454: '@r......But in her words,@k I could feel a strong determination to save me from this crazy game world no matter what.'
30455: '@rSo, I also responded to that.'
