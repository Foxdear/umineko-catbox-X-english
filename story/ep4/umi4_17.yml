30458: 'Battler@r@v10/40100758."I am here.@k@v10/40100759. Across from you, in the rival''s seat.@k@v10/40100760. ......Get it?@k @v10/40100761.As long as I continue to sit here,@k@v10/40100762. I won''t permit you to escape.@k@v10/40100763. ......So don''t run away. Fight."'
30459: 'Battler@r@v10/40100764."You started this fight, dammit.@k@v10/40100765. All the crap you''ve pulled, again and again and again, the total shitshow you''ve turned this whole thing into!@k @v10/40100766.And now after all this time you think I can let you end it because you''re tired of it?!!"'
