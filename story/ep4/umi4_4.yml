23784: 'Eva@r@v05/41000008."Three months left to live.@k@v05/41000009. It was last year when you said that, Doctor Nanjo..."'
23785: 'Nanjo@r@v19/41900001."......I, I only spoke of what I had determined from his overall physical condition at the time.@k@v19/41900002. As a result, it has just worked out that this year, he has—"'
23786: 'Rudolf@r@v08/41200017."Despite the doubt being cast on whether Father can make it to the end of the year, the fact is that even now, he''s still enthusiastically immersed in his occult research.@k@v08/41200018. And still you would say he has only three months left, Doctor?"'
23787: 'Nanjo@r@v19/41900003."A-as I''ve been saying, Kinzo-san''s—"'
23788: 'Krauss@r@v02/40800001."Is it not a wonderful thing that our respected father still has his vitality?@k@v02/40800002. Out of parental respect, all of you desire to greet Father so badly that you scarcely know what to do with yourselves.@k@v02/40800003. So you cannot accept the fact that he will not see you."'
23789: 'Natsuhi@r@v03/40900001."...Given that you have all begun to prematurely divide up the inheritance while the sun is still in the sky,@k@v03/40900002. I completely understand why it is that Father does not wish to see you."'
23790: 'Rosa@r@v12/41400054."Y-you''ve got it wrong, Natsuhi nee-san.@k@v12/41400055. ......We just, umm—"'
23791: 'Rudolf@r@v08/41200019."Not even Dad is immortal—he''s gonna die someday.@k@v08/41200020. We aren''t telling him to die. We''re just saying that he will die someday.@k@v08/41200021. We''re just talking together about how to prepare for that."'
23792: 'Natsuhi@r@v03/40900003."And that is precisely what is so disrespectful!!"'
23793: 'Krauss@r@v02/40800004."Stop it.@k@v02/40800005. You''ll make your headache worse."'
23794: '@rKrauss told Natsuhi, who had risen from her chair in agitation, to sit down.'
23795: '@rTrying to smooth over the atmosphere, which had suddenly started crackling with hostility,@k Hideyoshi put on a cordial smile and motioned for everyone to calm down.'
23796: 'Hideyoshi@r@v06/41100006."......Natsuhi-san, don''t get us all wrong.@k@v06/41100007. Doesn''t this country have a proverb, "a departing bird leaves the nest unsoiled"?@k @v06/41100008.So we''re just talkin'' about seein'' that bird off.@k@v06/41100009. We''re discussin'' this so we can see Father off cleanly when he eventually leaves on that inevitable journey."'
23797: 'Krauss@r@v02/40800006."Hahaha...@k@v02/40800007. That''s just like you, Hideyoshi-san.@k@v02/40800008. Even though you''re saying the same thing, you make it sound so intellectual."'
23798: 'Eva@r@v05/41000010."Yes, that''s right.@k@v05/41000011. Unlike you, Nii-san."'
23799: 'Rudolf@r@v08/41200022."Stop it.@k@v08/41200023. That won''t get us anywhere.@k@|@y@v08/41200024. .........So like we''re saying, Aniki.@k@v08/41200025. We can just forget all of this about the inheritance.@k@v08/41200026. It doesn''t even matter if Dad hits us."'
23800: 'Rudolf@r@v08/41200027."To make a long story short, all we want is to meet Dad directly and say hello.@k@v08/41200028. Even if Dad says he doesn''t want to.@k@v08/41200029. If he''s locked up in his study, we''ll borrow a key from Genji-san if we have to.@k@|@y@v08/41200030. Right, Rosa?"'
23801: 'Rosa@r@v12/41400056."...Oh, ...well, umm...it''s not like we''re forcing you...@k@v12/41400057. ......It''s just...we haven''t said hello to Father in such a long time."'
23802: 'Rosa@r@v12/41400058."If his remaining life really is short, then there''s even a chance we might never be able to see him again...@k@v12/41400059. ......Today might be our final opportunity to exchange words with Father..."'
23803: 'Eva@r@v05/41000012."Yes, just like Rosa says.@k@v05/41000013. You do realize that if he only has three months left, it wouldn''t be odd for him to pass away any time now?"'
23804: 'Eva@r@v05/41000014."And you''re telling us we don''t even have the right to talk with him one last time?@k @v05/41000015.......I think that is a bit much, don''t you...?"'
23805: 'Natsuhi@r@v03/40900004."......If the conversation you all intended to have with Father really was a greeting, I am sure he would see you gladly."'
23806: 'Natsuhi@r@v03/40900005."But Father has already heard exactly what kind of disrespectful topic you have lowered yourselves to!@k @v03/40900006.Father would not be the only one who would prefer not to see you under such conditions.@k@v03/40900007. If you wish to blame anyone for Father not seeing you, you need look no further than yourselves, wouldn''t you say?"'
23807: 'Krauss@r@v02/40800009."Heheheh.@k@v02/40800010. Exactly.@k@v02/40800011. I should think you would be able to understand why Father doesn''t wish to see your faces without racking your brains over it.@k @v02/40800012.Father has seen through all of your stringent financial situations."'
23808: 'Eva@r@v05/41000016.".........What are you talking about?@k@v05/41000017. ...I don''t have a clue what you''re going on about, Nii-san."'
23809: 'Krauss@r@v02/40800013."Heheheheh!@k @v02/40800014.Do you think I don''t know about all of your circumstances...?"'
23810: '@rEva and the rest realized that he had seen through to the dire straits they were in,@k and they entered into a back-and-forth argument, at first putting on a bold front and denying it,@k and then ultimately returning to the original point, and objecting by repeatedly demanding to be allowed to see Kinzo.'
23811: '@r...The sweet smell of the black tea Rosa had gone out of her way to buy had been completely wasted.'
23812: '@rThe only good thing she could take away from this was that the children weren''t here to see it.'
23813: '@r......The fact that they had gone to play at the beach right after lunch was the sole redeeming aspect.'
23814: '@rEva was attempting to get violent with Krauss, and Hideyoshi and Kyrie had cut in between them, trying to calm both sides.'
23815: '@r......Then, Kyrie sighed deeply and spoke.'
23816: 'Kyrie@r@v09/41300005."............I''m sorry, Krauss nii-san.@k@v09/41300006. I know I''m an outsider, but I wonder if you would let me speak for a moment.@k@v09/41300007. I have a proposition."'
23817: 'Krauss@r@v02/40800015."What is it, Kyrie-san?"'
23818: 'Kyrie@r@v09/41300008."......First, and this includes my husband as well,@k@v09/41300009. for many years, we have made light of the efforts you have made by living with Father and taking care of him.@v09/41300010. ...Don''t you think so?"'
23819: 'Rudolf@r@v08/41200031.".........Well, I guess so.@k@v08/41200032. ...We''ve got it easy since we get to go out into the world, but Aniki''s been babysitting Father for decades now, and sure, that must have taken a lot of effort.@k@|@y@v08/41200033. ......I''ll accept that, but what''s your point, Kyrie?"'
23820: 'Kyrie@r@v09/41300011."We must acknowledge that Krauss nii-san is Father''s caregiver.@k@v09/41300012. ......Isn''t that true?@k @v09/41300013.We have always feared Father, and have been pushing the task of taking care of him onto Krauss nii-san.@k@v09/41300014. I believe everyone here would acknowledge his efforts."'
23821: 'Kyrie@r@v09/41300015."Wouldn''t you?@k @v09/41300016.Eva nee-san?"'
23822: 'Eva@r@v05/41000018.".....................@k@v05/41000019. ......And so what?@k @v05/41000020.Nii-san is Father''s caregiver?@k @v05/41000021.Who is an outsider like you to decide things?!"'
23823: 'Hideyoshi@r@v06/41100010."O-...OK, calm, calm.@k@v06/41100011. ......Kyrie-san, what are you talking about?"'
23824: 'Rudolf@r@v08/41200034.".................................@k@v08/41200035. ......Kyrie, please continue."'
23825: 'Kyrie@r@v09/41300017."We should be more grateful towards Krauss nii-san and Natsuhi nee-san.@k@v09/41300018. ......We should say thank you for always taking care of Father."'
23826: 'Kyrie@r@v09/41300019."It''s because we have no feelings of gratitude that we have these unproductive clashes.@k@v09/41300020. ......Isn''t that right, Krauss nii-san?"'
23827: 'Krauss@r@v02/40800016."Hoh.........now this is a surprise.@k@v02/40800017. I did not think you would be able to understand our efforts,@k@v02/40800018. which even my true siblings have not stopped to consider."'
23828: 'Natsuhi@r@v03/40900008."......It is a natural duty for the successor to the Ushiromiya family head."'
23829: 'Kyrie@r@v09/41300021."Yes.@k@v09/41300022. It is a responsibility of the successor to the head, isn''t it?@k@v09/41300023. ......And it''s precisely because you take care of Father that we must acknowledge you as the successor."'
23830: 'Eva@r@v05/41000022."Excuse me!!@k @v05/41000023.Am I going to be consulted on this at any point?!!@k @v05/41000024.You outsider, what gives you the—"'
23831: 'Rudolf@r@v08/41200036."Wait, Aneki!!@k @|@y@v08/41200037..........She''s right.@k@v08/41200038. It''s just like Kyrie says.@k@v08/41200039. You are the successor, Aniki, because you''re taking care of Dad.@k@v08/41200040. It''s just like you said."'
23832: 'Rosa@r@v12/41400060."..................ah—"'
23833: 'Eva@r@v05/41000025."...............nn—"'
23834: '@rRosa noticed, and then Eva too.'
23835: '@rEva''s barking demeanor towards Kyrie for advancing the discussion on her own disappeared in a flash,@k and she instead stared at Krauss and Natsuhi.'
23836: '@r......Natsuhi couldn''t understand that sudden change, and was slightly flustered.'
23837: 'Kyrie@r@v09/41300024."Krauss nii-san.@k@v09/41300025. ......If you would accept just a few conditions,@k@v09/41300026. we won''t ask you to let us meet Father again until he dies."'
23838: 'Kyrie@r@v09/41300027."Of course, we won''t tell you to let us see him at the moment of death, either.@k@v09/41300028. ......We could even be absent at the funeral."'
23839: 'Krauss@r@v02/40800019."......Oh?@k @v02/40800020..........I haven''t a clue what this is about.@k@v02/40800021. But very well, I will humor you.@k@v02/40800022. Tell me the conditions."'
23840: 'Kyrie@r@v09/41300029."First.@k@v09/41300030. ......The term successor to the head refers to the caregiver of the current head, Ushiromiya Kinzo."'
23841: 'Krauss@r@v02/40800023.".........Mhmm.@k@v02/40800024. Go on?"'
23842: 'Kyrie@r@v09/41300031."Second.@k@v09/41300032. The duty of the caregiver is to look after Ushiromiya Kinzo for the rest of his life.@k@v09/41300033. ......To make things simple, the caregiver''s job is to care for him until his final moments.@k@v09/41300034. You were prepared to do that from the beginning, Krauss nii-san, so there are no problems."'
23843: 'Krauss@r@v02/40800025."Naturally.@k@v02/40800026. I have no objections whatsoever to either of those conditions.@k@v02/40800027. I am already carrying them out."'
23844: 'Kyrie@r@v09/41300035."Third.@k@v09/41300036. In the remote chance that the caregiver is neglectful in his responsibilities of supervision, he will be stripped of his rights as a caregiver."'
23845: '@rWith that sentence, all slack disappeared from Krauss''s face.@k@r...Natsuhi alone was still having trouble understanding what it meant.'
23846: 'Krauss@r@v02/40800028."......Hoh.@k@v02/40800029. And these "responsibilities of supervision" that the caregiver bears,@v02/40800030. ......just what exactly are they?"'
23847: 'Kyrie@r@v09/41300037."It means supervising so that Father can live in good health until the end of his natural lifespan.@k@v09/41300038. ......I''ll go into more detail.@k@v09/41300039. In the case that Father dies anything other than a natural death, the caregiver will be stripped of his rights as a caregiver, and will lose his rights as successor to the head.@k@v09/41300040. In that situation, the next highest ranked, Eva nee-san, is to be selected as the successor."'
23848: 'Natsuhi@r@v03/40900009.".........What...did you say......@k@v03/40900010. H-how dare you speak such nonsense!!"'
23849: 'Krauss@r@v02/40800031."Hohoh.@k@v02/40800032. My, my, a caregiver''s responsibility is grave indeed..."'
23850: 'Krauss@r@v02/40800033."However, people can die in many ways.@k@v02/40800034. For example, the old and infirm sometimes die by getting food caught in their throats.@k@v02/40800035. I have no doubt that this would ordinarily fall under the broad definition of death by old age."'
23851: 'Krauss@r@v02/40800036."But with your argument, that would become a "death by accident", and I would be made to bear the responsibility as supervisor.@k@v02/40800037. ......This is unjustly disadvantageous to me."'
23852: 'Kyrie@r@v09/41300041."I don''t have the slightest intention of splitting hairs in such a way.@k@v09/41300042. The kinds of things that I''m imagining are just things the caregiver could have prevented beforehand by taking good care of Father and keeping their eyes on him."'
23853: 'Kyrie@r@v09/41300043."It may be the caregiver''s job to carry food to Father''s mouth, but whether he swallows it down or not is clearly outside the caregiver''s responsibility.@k@v09/41300044. I have absolutely no problems with the case you raise, Krauss nii-san."'
23854: 'Krauss@r@v02/40800038.".........Hoh.@k@v02/40800039. Then what kind of case do you imagine would cause the caregiver to be blamed for making a blunder?"'
23855: 'Kyrie@r@v09/41300045."For example,@k@v09/41300046. ......if he disappeared."'
23856: 'Krauss@r@v02/40800040.".....................@k@|@y@v02/40800041. ...............Hoh?"'
23857: 'Kyrie@r@v09/41300047."Father seems to be of sound mind right now,@k@v09/41300048. but he could lose the ability for rational thought and decision-making at any moment, and it would come as no surprise."'
23858: 'Kyrie@r@v09/41300049."......He could wander around when you aren''t looking and get into some kind of accident,@k@v09/41300050. ......or he could get lost in the forest and go missing, never to be found again."'
23859: 'Kyrie@r@v09/41300051."......Isn''t this type of case clearly the responsibility of the caregiver...?"'
23860: 'Natsuhi@r@v03/40900011."Father''s mind is perfectly healthy!@k @v03/40900012.Of all things, what an outrageous...!"'
23861: 'Kyrie@r@v09/41300052."You might say that one day, suddenly, you saw Father go into the forest.@k@v09/41300053. You chased after him, but you couldn''t find him.@k@v09/41300054. Despite calling the police and searching, seven years pass, unable to find him, and after that time a court declares him legally dead.@k@v09/41300055. I am trying to say that we won''t accept that kind of series of events."'
23862: 'Krauss@r@v02/40800042."......................................."'
23863: 'Kyrie@r@v09/41300056."When Father passes away, an autopsy must be carried out,@k@v09/41300057. and it must be verified that he died of old age in the most general meaning, within the bounds of common sense.@k@v09/41300058. ......A death for any other reason will be held as the caregiver''s responsibility."'
23864: 'Kyrie@r@v09/41300059.".........See?@k @v09/41300060.They''re nothing more or less than the things you have already been toiling at up to today.@k@v09/41300061. They aren''t strange conditions or anything of the sort, right...?"'
23865: 'Natsuhi@r@v03/40900013."Y-you are mocking us, insulting us!!@k @v03/40900014.I find it difficult to imagine why my husband must be coerced into a rule that disgraces him in this way!!"'
23866: 'Kyrie@r@v09/41300062.".........Actually, I''ve been suspecting it since last year.@k@v09/41300063. No, everyone here probably suspects it.@k@v09/41300064. Eva nee-san, Hideyoshi nii-san.@k@v09/41300065. Rudolf-san, and Rosa-san too.@k@v09/41300066. Everyone has suspected it the whole time, but it was so dreadful to imagine that no one actually said it."'
23867: 'Krauss@r@v02/40800043."Heh.@k@v02/40800044. ......Heheheheh, hahahahaha...!!@k @v02/40800045.I see, so this is what you''re trying to say?@k @|@y@v02/40800046.......That Father is already dead, and that I have been hiding it!"'
23868: 'Battler@r@v10/40100129."......Yeah, that''s right.@k@v10/40100130. This is one of the theories I thought of as the key to solving the final mystery in the previous game."'
23869: 'Ange@r@v11/42000394.".........You mean the last one in the previous game,@k@v11/42000395. the mystery of who killed Doctor Nanjo?"'
23870: 'Battler@r@v10/40100131."Yeah.@k@v10/40100132. ......The witch definitely did say a lot in red.@k@v10/40100133. ...She mentioned the names of all 18 people and announced whether they were alive or dead, and stated definitively that there are no more humans than that.@k@v10/40100134. ......But with this theory, I can weave my way through that gap...!"'
23871: 'Ange@r@v11/42000396.".....................@k@v11/42000397. ......I see.@k@v11/42000398. So this is one of the answers that don''t cause those two to contradict.@k@v11/42000399. .........I see."'
23872: 'Battler@r@v10/40100135."You understand what I''m getting at?@k @v10/40100136....You catch on pretty quick, don''t you.@k@v10/40100137. It''s nice that I don''t have to explain."'
23873: 'Ange@r@v11/42000400."No 19th person exists on this island.@k@v11/42000401. But this gimmick lets us mix in an unknown new person X despite that.@k@|@y@v11/42000402. ......Basically, "the names of all 18 people" just have to not match "the 18 people on the island"."'
23874: 'Battler@r@v10/40100138."Exactly...!@k @v10/40100139.In red, the witch mentioned the names of 18 people one after another, and announced whether they were alive or dead.@k@v10/40100140. And on top of that, she declared that the number of humans on the island doesn''t exceed 18.@k@v10/40100141. ......There was a single illusion in there."'
23875: '@rIt was never guaranteed that the 18 names = the 18 people on the island.@|@y'
23876: 'Battler@r@v10/40100142."When she named off all 18 people and announced who was alive and who was dead,@k@v10/40100143. she kept the name of the culprit X hidden, and instead mixed in someone who isn''t on this island...!"'
23877: 'Battler@r@v10/40100144_b."By doing that, even though the culprit is on the island, she was able to leave them out of the list of the 18 alive or dead people!@k @v10/40100145.The person who was mixed in isn''t on the island, so he doesn''t count towards the total number of people on the island."'
23878: 'Battler@r@v10/40100146."Therefore, even though the culprit counts towards the total of 18 people on the island, it was possible for their name to not be listed!@k @v10/40100147.The two statements in red are completely independent, so this theory has no contradictions......!"'
23879: 'Ange@r@v11/42000403."The name which is used to hide the name of the culprit has several conditions to fulfill.@k@v11/42000404. ......First of all, it has to be someone who isn''t on the island, and yet whom we believe to be on the island.@k@v11/42000405. ......Otherwise, she wouldn''t be able to trick us."'
23880: 'Ange@r@v11/42000406."And it would be preferable for that person to be dead.@k@v11/42000407. ......After all, no alibi exists that is more perfect than death.@k@v11/42000408. Because the mystery at that point was based on the crime being impossible for all 18 people.@k@|@y@v11/42000409. ............Something like that?"'
23881: 'Battler@r@v10/40100148."Yeah, that''s it...!@k @v10/40100149.And that person...@v10/40100150.......was Grandfather.@|@y@k@v10/40100151. ......What Kyrie-san is trying to say right now is just one simple thing."'
23882: 'Battler@r@v10/40100152."......We''re being told that Grandfather is locked up in his study, saying that he doesn''t want to meet anyone,@k@v10/40100153. ......but there is the possibility that he''s actually already dead,@k@v10/40100154. and that Uncle Krauss is lying when he claims that he''s alive...!"'
23883: '@rThat''s right.@k Grandfather has been closed up in his room this whole time, and no one''s seen his face!'
23884: '@rMaybe he''s already dead,@k and Uncle Krauss and the rest are conspiring together to trick everyone into believing he''s alive...!!'
23885: 'Ange@r@v11/42000410."............If Kinzo dies, the distribution of the inheritance occurs.@k@v11/42000411. ...However, if Kinzo doesn''t die,@k@v11/42000412. ......no,@k@v11/42000413.@|@y if he dies, but it isn''t announced, the distribution of the inheritance doesn''t occur."'
23886: 'Battler@r@v10/40100155."In other words, Uncle Krauss could have all of Grandfather''s wealth to himself...!@k @v10/40100156.That''s right, he''s got plenty of motive!"'
23887: '@rSure, maybe a 19th person X really doesn''t exist on this island.'
23888: '@rBut the person X did exist.@k@r......And that person was the 18th person!'
23889: 'Battler@r@v10/40100157."In other words, there were originally 17 people on this island, not 18.@k@v10/40100158. Then an unknown person X snuck in and committed the crime."'
23890: 'Battler@r@v10/40100159."......How''s that, Beato?!@k @v10/40100160.Get your ass out here, I''ve just solved the final, biggest mystery from the last game!!"'
23891: '@rAs Battler declared that forcefully, the crisp sound of clapping came out of nowhere, and their surroundings turned bright,@k becoming the usual witch''s tea room.'
23892: 'BEATRICE@r@v27/40700123."*cackle*, hahahahahahaha...!@k @v27/40700124.<Bravo, bravo>.@k@v27/40700125. I cannot deny the sense of it being long overdue, but in any event, despite your incompetence, you have managed to produce a single answer."'
23893: 'BEATRICE@r@v27/40700126."Cessation of thought is possible even for a lump of concrete!@k @v27/40700127.So you have now finally evolved into a being with intelligence."'
23894: 'BEATRICE@r@v27/40700128."......You could say that you''ve finally taken a step forward from the crying creature that you were before, just licking my shoes and grinding your teeth.@k@v27/40700129. *cackle*cackle*!"'
23895: 'Battler@r@v10/40100161."......I can''t believe I let this stupid wordplay make a fool of me in the last game.@k@v10/40100162. My lameness pisses even me off!"'
23896: 'Battler@r@v10/40100163."Alright, Beato, time for a repetition request!!@k @v10/40100164.Declare that Grandfather''s included in the 18 people on the island, if you caaaaaan!!"'
23897: 'Battler@r@v10/40100165."Yeah, never in a million years.@k@v10/40100166. Because he''s already dead.@k@v10/40100167. This is the end of your deceptiooooooooooon!!"'
23898: 'BEATRICE@r@v27/40700130."*cackle*cackle*cackle*cackle*, ahhahahahahahahahahaha...!!@k @v27/40700131.Well now, what to do here.@k@v27/40700132. .........Shall I slice that in twain with the red truth?"'
23899: 'BEATRICE@r@v27/40700133."No, no, it might also be good to hold back for now and let you get all excited.@k@v27/40700134. If I''m going to push you off a cliff anyway, it would be much more interesting to lure you to a higher place first.@k@v27/40700135. *cackle*!"'
23900: '@rAs Beato sneered obnoxiously, it even looked to me as if she was still searching for the perfect expression to tick me off even more.'
23901: '@rAs though she was saying that the answer I had finally reached was entirely too ridiculous.'
23902: '@rIn contrast to my visible annoyance with the witch''s attitude, Gretel had a blank and composed expression on her face.'
23903: '@r...Almost as though she had expected the witch would act that way.'
23904: 'Ange@r@v11/42000414."........................@k@v11/42000415. I see.@k@v11/42000416. ...So just like Battler learns and grows, so does the witch."'
23905: 'Battler@r@v10/40100168."What''s wrong, Beato!@k @v10/40100169.Quit stalling!!@k @v10/40100170.Can you repeat it or not?!@k @v10/40100171.Answer!!"'
23906: 'BEATRICE@r@v27/40700136."*cackle*cackle*cackle*..."'
23907: 'Ange@r@v11/42000417."......Stop it, Battler.@k@v11/42000418. The witch won''t answer so easily.@k@v11/42000419. ......As long as she doesn''t think it will benefit her."'
23908: 'Battler@r@v10/40100172."What?!@k @v10/40100173.What do you mean......?"'
23909: 'Ange@r@v11/42000420."Because you''ve been at the mercy of this "red truth" in the games so far, the witch has used it over and over again."'
23910: 'Ange@r@v11/42000421."But now, the situation is different.@k@v11/42000422. You are luring the red truth out, and are instead using it as your weapon.@k@v11/42000423. In a situation like that, there''s no way the witch will keep firing off the red without reason.@k@v11/42000424. .........Right?"'
23911: 'BEATRICE@r@v27/40700137."Gretel, or whoever you are.@k@v27/40700138. ...It seems that you are quite sharp, unlike Battler.@k@v27/40700139. I have welcomed in a fearsome enemy."'
23912: 'BEATRICE@r@v27/40700140."That is correct!@k @v27/40700141.When Battler is expecting me to use the red truth, why do I have a responsibility to answer to his expectations?!"'
23913: 'BEATRICE@r@v27/40700142."I have no such thing!@k @v27/40700143.I don''t even have a crumb from that croissant you ate this morning''s worth of responsibility to please yooooou!!"'
23914: 'Battler@r@v10/40100174."Y-you bitch.........!!"'
23915: 'BEATRICE@r@v27/40700144."Yes, yes, oh yes, that''s the faaaaace!@k @v27/40700145.I started playing with the red truth just because I wanted to see that face!@k @v27/40700146.If I cannot witness that expression of yours, then I have no reason whatsoever to play around...!"'
23916: 'Battler@r@v10/40100175."......Heheh.@k@v10/40100176. You''re just being a sore loser, aren''t you?@k @|@y@v10/40100177.If you think you can just say a bunch of crap to trick me because you can''t respond to my repetition request, it''s not gonna work!!"'
23917: 'BEATRICE@r@v27/40700147."Don''t be so full of yourself!!@k @v27/40700148.An answer like that, I could cut into pieces with no trouble at all!!@k @|@y@v27/40700149.But I will deliberately refuse to speak in red.@k@v27/40700150. I will refuse to speak because that is what you want.@k@v27/40700151. Do you understand why?"'
23918: 'Ange@r@v11/42000425."............You just said it.@k@v11/42000426. You want to push him off at the sweetest spot.@k@v11/42000427. This ill-natured witch is saying that she won''t use the red anywhere you ask for it any more."'
23919: 'Ange@r@v11/42000428."In other words, she won''t play along with your game of repetition requests any more."'
23920: 'BEATRICE@r@v27/40700152."*cackle*cackle*!@k @v27/40700153.Exactly, exactly!@k @v27/40700154.Unlike Battler, everything goes quickly with this woman, there''s never a need to explain!@k @v27/40700155.I will speak as I like with the red truth, at the time that I desire!"'
23921: 'Ange@r@v11/42000429."Yes.@k@v11/42000430. The use of the red truth is basically a right the witch has, to exercise as she pleases.@k@v11/42000431. It''s not a responsibility that she has to fulfill at whatever time the human side desires.@k@|@y@v11/42000432. ...............But that depends on the details."@|@y'
23922: 'Battler@r@v10/40100178."......The details......?@k @v10/40100179.What do you mean...?"'
23923: 'Ange@r@v11/42000433."The witch has no responsibility to respond to your repetition requests.@k@v11/42000434. But when and only when your claim would destroy the witch theory, it does become her responsibility.@k@v11/42000435. Because in this court without a judge, that which is not refuted becomes the "truth"."'
23924: 'Ange@r@v11/42000436."......In just the same way that whenever you''ve stopped thinking,@k@v11/42000437. and been unable to make a counterargument against the witch theory asserted by the witch, it has immediately become truth."'
23925: 'Battler@r@v10/40100180."Then, ...since she doesn''t have a counterargument to my reasoning, that means it''s right?!@k @v10/40100181.I''m correct in my deduction that the culprit is the mysterious 18th person X, and Grandfather is already dead?!"'
23926: 'Ange@r@v11/42000438."......At least, until the witch argues back.@k@v11/42000439. Truth loses to new truths farther in the future.@k@v11/42000440. ......The tricky part is that even the timing of the counterargument is up to the witch."'
23927: 'Ange@r@v11/42000441."...In other words, maybe your reasoning just now is correct,@k@v11/42000442. or maybe the witch is holding off on arguing back even though you''re mistaken."'
23928: 'Ange@r@v11/42000443."......Or else, the witch may be ignoring it because it doesn''t shake the basis of the witch theory in the first place.@k@v11/42000444. The point is, we can''t tell the difference at the current time.@k@v11/42000445. .........Is that more or less it?"'
23929: 'BEATRICE@r@v27/40700156."*cackle*cackle*, *cackle*cackle*cackle*!@k @v27/40700157.Damn you, Lady BERNKASTEL, for throwing in such a troublesome piece.@k@v27/40700158. Thanks to that, I''m losing all my lines!"'
23930: 'Ange@r@v11/42000446."The witch has learned to respond to your repetition requests at a separate time.@k@v11/42000447. ......Maybe you could also call it a <delay>."'
23931: 'Battler@r@v10/40100182."......G-goddamn her......@k@v10/40100183. ...So even if I offer some mistaken reasoning, there''s a possibility that Beato will intentionally let me flounder about without disproving it,@k@v10/40100184. and at the very end, after I''ve built it up even more into some grand expansive theory, she can chop it off at the base,@k@v10/40100185. and turn everything over......?!"'
23932: '@rA single piece of reasoning becomes a bridge to the next piece.@k@rThrough my repetition requests, I''ve been able to strengthen my position and advance bit by bit.'
23933: '@rBut thanks to that damned Beato learning this strange delay tactic,@k ......I can no longer confirm or deny my reasoning.'
23934: '@rIt''s like I finally got myself a cane to help me search around in the pitch-black darkness, and now I''ve had it taken away from me.@k ......Now I''m just...stuck, aren''t I......?!!'
23935: 'BEATRICE@r@v27/40700159."Now, now, Battler, if you make a despairing face like that, I won''t be able to stop drooling, you knowwww♪@k @v27/40700160.From the beginning, that cane was nothing more than something I gave you because you were so ineffectual."'
23936: 'BEATRICE@r@v27/40700161."This just means that you can finally challenge me without a handicap, right?@k @v27/40700162.Kuhhihihihihihihihi!"'
23937: 'Ange@r@v11/42000448."......But that doesn''t change the fact that repetition requests are one of Battler''s methods for fighting back.@k@v11/42000449. As I already said, as long as it''s something fatal that would destroy the witch theory,@k@v11/42000450. the witch is obligated to argue back, and therefore, to speak with the red truth."'
23938: 'Ange@r@v11/42000451."......While the timing of that counterargument is up to the witch, it must be performed eventually.@k@v11/42000452. .........Right?"'
23939: 'BEATRICE@r@v27/40700163."Hmm, that would seem to follow.@k@v27/40700164. If I cannot deny the "tricks done by humans" theory Battler lays out by the time the game ends,@k@v27/40700165. Battler will use that as a reason to deny me, and it will be possible for him to proclaim his victory."'
23940: 'Ange@r@v11/42000453.".........So, then, the "trick theory" laid out by the human side,@k@v11/42000454. in other words, his repetition requests, must be countered during the game, i.e., during the Episode—we can view this as a restriction on the witch side to that effect?"'
23941: 'BEATRICE@r@v27/40700166."That is so.@k@v27/40700167. ......Battler''s goal is to show that he can explain with humans the entire pleasant game I have laid out on this island and deny me.@k@v27/40700168. If Battler succeeds in that, at that time, Battler shall become the victor of this game."'
23942: 'Ange@r@v11/42000455."Let me confirm the rules.@k@v11/42000456. ......Am I OK to interpret "the time the game ends" as referring to 24:00 on October 5th, 1986, going by the time of the Rokkenjima in the game?"'
23943: 'BEATRICE@r@v27/40700169."There are no problems with that."'
23944: 'Ange@r@v11/42000457."If, at the time the game ends, the human side can assert a trick theory for all of the mysteries,@k@v11/42000458. and there is no counterargument from the witch side, then the human side can declare victory.@k@v11/42000459. ......Any problems?"'
23945: 'BEATRICE@r@v27/40700170.".........Let us be a little more rigorous.@k@v27/40700171. At the time the game ends, the witch side shall be given the opportunity to argue back."'
23946: 'Ange@r@v11/42000460."I''ll set a time limit on that.@k@v11/42000461. One minute.@k@v11/42000462. If the counterargument is not carried out within one minute, victory will be declared."'
23947: 'BEATRICE@r@v27/40700172."Then allow me to impose the same rule on you.@k@v27/40700173. At the time the game ends, the human side will be given one minute to counter the mysteries it has been given.@k@v27/40700174. If there is even a single mystery that has not been countered within that time, it becomes a victory for the witch side, and that game is over."'
23948: 'BEATRICE@r@v27/40700175."......It would spoil things terribly to have the game stopped for lengthy consideration, you see."'
23949: 'Battler@r@v10/40100186."............Goddamn you both.@k@v10/40100187. Moving things along without me...@k@|@y@v10/40100188. But I more or less get what''s going on.@k@v10/40100189. So even if my repetition requests aren''t countered instantly, they must be countered eventually."'
23950: 'Ange@r@v11/42000463."Yes, that''s right.@k@v11/42000464. ......And that must happen before 00:01 on October 6th."'
23951: 'Ange@r@v11/42000465."......But be careful.@k@v11/42000466. The witch only has to cut up a single one of your repetition requests.@k@v11/42000467. You can''t declare victory unless you can solve all of the mysteries."'
23952: 'BEATRICE@r@v27/40700176."Just as I can use the red,@k@v27/40700177. Battler, from now on, I will permit you to use the blue."'
23953: 'BEATRICE@r@v27/40700178."When explaining my magical murders with human tricks, you can make declarations in blue.@k@v27/40700179. I will be under obligation to counter your blue with the red by the end of the game."'
23954: 'Battler@r@v10/40100190."Blue......@k@v10/40100191. ......So basically, I''ll speak my repetition requests in blue...?"'
23955: 'BEATRICE@r@v27/40700180."Not exactly.@k@v27/40700181. It was possible to use repetition requests for anything, no matter how trivial.@k@|@y@v27/40700182. But the blue is a little more restrictive.@k@v27/40700183. It is only valid if it denies witches on its own."'
23956: 'Battler@r@v10/40100192."..........................."'
23957: '@rIt''s starting to get confusing, ...but it''s more or less something like this.'
23958: '@rLet''s take one of the repetition requests I made during a past mystery as an example.@k@r"The number of master keys is five".'
23959: '@rIt had been claimed that there were only five master keys, so I made this request to confirm that the number really was five.'
23960: '@rBut since that by itself doesn''t deny the witch, I can''t say it in blue.@k So, in order to speak in blue, I would need to say something like this.'
23961: '@r"The actual number of master keys was greater than five.@k The culprit used one of those extra keys to get in and out of the room!"'
23962: '@r......And only then would the witch, who claims that it was a locked-room murder with magic, be responsible for making a counterargument.@k In other words, I can''t use it to demand that she repeats things in order to check the premises of my reasoning.'
23963: '@r.........That will probably put me at a significant disadvantage.'
23964: '@rCrap...@k It''s enough to make me think that all those red declarations that Beato''s been making to toy with me were extremely merciful......'
23965: 'Battler@r@v10/40100193."...Damn it.@k@v10/40100194. That means, even if I create a theory for a particular locked room and speak it in blue,@k@v10/40100195. if Beato denies it at the very, very end, I won''t even have time to create my next theory...!@k @v10/40100196.This rule is awful... It''s all disadvantage for me and me alone..."'
23966: 'Ange@r@v11/42000468.".........Are you going to surrender before the fight begins again?@k @|@y@v11/42000469.Calm down.@k@v11/42000470. No one''s said that you can only use the blue once for each mystery.@k@v11/42000471. Do you understand what that means?"'
23967: 'Battler@r@v10/40100197."N-no.@k@v10/40100198. ......What does it mean...?"'
23968: 'Ange@r@v11/42000472."In the pitiful way you''ve been fighting up until now, you''ve made a single theory, gauged the witch''s reaction,@k@v11/42000473. and if that one didn''t work, you''d then start making another theory.@k@v11/42000474. You won''t corner a witch like that."'
23969: 'Battler@r@v10/40100199."Then how am I meant to fight......@k@|@y@v10/40100200. .........You don''t mean—"'
23970: 'Ange@r@v11/42000475."Yes, that''s right.@k@|@y@v11/42000476. ......You don''t challenge the mysteries with an individual point.@k@|@y@v11/42000477. You assault them with a wall.@k@v11/42000478. You said yourself in an earlier game that that''s what the attitude behind reasoning should be like."'
23971: '@rAssault...with a wall.@k That''s right, I said so myself before.'
23972: '@rThe act of trying to uncover the mystery by reasoning is like trying to shoot a distant target with an arrow.'
23973: '@rUntil now, I''ve been shooting off a single flimsy arrow every time,@k asking the witch if I scored a hit,@k and then, once told that I missed, preparing my bow again, and shooting off another flimsy arrow.'
23974: '@rThere''s no way I''ll hit at that rate...@k@rBullets might be a better example than arrows.'
23975: '@rIf you take one shot after another at a distant target with a handgun, you probably won''t hit it easily.'
23976: '@r......So how can you hit it?'
23977: '@rIf a handgun doesn''t work,@k ......use a shotgun!@k Instead of a single bullet, blast her with "shot" filled with countless projectiles at once...!'
23978: '@rShot scatters, so it impacts a wide area.@k So it''s very well suited for shooting small, fast targets like birds.'
23979: '@rThat''s right, there''s no rule that says reasoning has to be like a pistol, shooting one shot off at a time.'
23980: '@r......Making a single theory and just hoping that it hits is like stopping your own thinking.'
23981: '@rBlast away with a massive number of bullets, of pieces of reasoning, and make them impact like a wall, so you only need just one of them to find its mark.'
23982: 'Battler@r@v10/40100201."............Blue, huh...@k@v10/40100202. ......I get it.@k@v10/40100203. If your red truth is a razor-sharp katana, then it looks like my blue is a shotgun.@k@v10/40100204. No, ......a machine-gun with firepower enough to honeycomb witches."'
23983: 'BEATRICE@r@v27/40700184."He that is always shooting must something something.@k@v27/40700185. *cackle*cackle*!@k @v27/40700186.That sort of crude analogy is just like you."'
23984: 'Battler@r@v10/40100205."The climax of a detective novel is always the same.@k@v10/40100206. ......The great and famous detective gathers all the suspects in one place, and unveils a single trail of logic which is proven correct in spectacular fashion."'
23985: 'Battler@r@v10/40100207."Almost like William Tell expertly shooting through an apple with a single arrow.@k@v10/40100208. That''s why I mistakenly thought of it like a virtue."'
23986: '@r......Sure, that probably would be magnificent.@k@rIf I could shoot through the truth with a single guess.'
23987: '@rBut that isn''t realistic.'
23988: '@rJust look at real wars.@k Do I really think everyone pulls long guns out of the trench, aims reeeeeally well, and takes a single shot at a time at the other side?'
23989: '@rThey don''t, right?!@k They fire rapidly, they fire all over the place, they pin down the enemy with a barrage!'
23990: '@rReasoning was the same way.'
23991: '@rBecause of that weird virtue, I had been stuck thinking that I could only take one line of reasoning at a time.'
23992: '@rWe humans can fire off countless guesses and possibilities!'
23993: '@rImagination is ammunition.@k Suspension of thought is a clogged barrel...!@k@rThe pathetic way I''ve been reasoning up until now is like a peashooter.'
23994: '@rIncredibly awkward, like I''ve been weakly firing off a shot, getting it denied in red, and then receiving the next bullet and reloading.'
23995: '@rMy "blue truth" that claims that human tricks are the truth...@k...will overwhelm its target, the fantasy told by the witch, with all the firepower of my imagination...!'
23996: '@rThis is my...@w666.@|@yUshiromiya Battler-style way of fighting...!'
23997: 'Battler@r@v10/40100209.".........Thanks to you, I''ve figured out the real way to fight.@k@v10/40100210. Thanks, Gretel!!"'
23998: 'Ange@r@v11/42000479."You''re welcome."'
23999: 'Battler@r@v10/40100211."It''s enough to make me think how pathetic I was before.@k@|@y@v10/40100212. ......Yeah, it''s like Beato said.@k@v10/40100213. I''ve had the benefit of a handicap up until now.@k@v10/40100214. I''ll acknowledge that...!!@k @v10/40100215.New rule, understood!!@k @v10/40100216.I have my own way to fight!@k @v10/40100217.And I''ll show it to you!!"'
24000: 'BEATRICE@r@v27/40700187."*cackle*cackle*cackle*cackle*!!@k @|@y@v27/40700188.Excellent spirit, I like it!@k @v27/40700189.Then try using it right away, this blue truth of yours...!!"'
24001: 'Battler@r@v10/40100218."......I''ll use it, all right.@k@v10/40100219. With this blue truth, I can break apart your witch theory, which states that only a witch culprit was possible because everyone had alibis!!"'
24002: 'Battler@r@v10/40100220."This is my truth!@k @v10/40100221.@c279.@[Ushiromiya Kinzo is already dead.@]@c. @|@y@k@v10/40100222.@c279.@[Therefore, the true number of people on the island is 17!@]@c.@|@y@k @v10/40100223.@c279.@[By adding an unknown person X to that, it becomes 18 people.@]@c. @|@y@k@v10/40100224.@c279.@[By supposing that this person X exists, the crime is possible even if all 17 people have alibis!!@]@c."@|@y'
24003: 'Kyrie@r@v09/41300067."......In short, if you keep preventing us from meeting with Father, we will have to form the following theory.@k@|@y@v09/41300068. Simply: Father is already dead.@k@v09/41300069. But you are hiding that because you don''t want the inheritance to be distributed. See?"'
24004: 'Krauss@r@v02/40800047."....................................@k@|@y@v02/40800048. ...Ridiculous."'
24005: 'Natsuhi@r@v03/40900015."Th-that is correct, this is worse than ridiculous!!@k @v03/40900016.I have never been so insulted!!"'
24006: 'Kyrie@r@v09/41300070."It''s even possible for us to force you to allow us to check whether he''s alive or dead in the presence of the police.@k@|@y@v09/41300071. Isn''t it, Eva nee-san...?"'
24007: 'Eva@r@v05/41000026."......Y-......yes...@k@|@y@v05/41000027. That''s right, Nii-san.@k@v05/41000028. We could come up with any number of excuses for it.@k@v05/41000029. We could easily set it up so that you have to arrange a meeting with Father under the supervision of a third party...!"'
24008: 'Kyrie@r@v09/41300072."Still.@k@v09/41300073. I think that would be very shameful for the Ushiromiya family."'
24009: 'Kyrie@r@v09/41300074."That''s why I''m making this proposal.@k@v09/41300075. The responsibilities and duties of the caregiver.@k@v09/41300076. A penalty in the worst-case scenario.@k@v09/41300077. If you consent to that, we will be able to refrain from doing something like dragging Father outside."'
24010: 'Rudolf@r@v08/41200041."...Yeah, that''s right, Aniki...@k@v08/41200042. Didn''t you just say it...?@k@v08/41200043. You are carrying out your natural duties as Father''s caregiver.@k@v08/41200044. Kyrie''s conditions shouldn''t be anything to worry about, right?@k @v08/41200045.Why the overreaction?"'
24011: 'Rudolf@r@v08/41200046."......Are you really that worried about having your position of successor dragged out from under you if Dad dies something other than a natural death?"'
24012: 'Eva@r@v05/41000030."Or whaaaat?@k @v05/41000031.Do you have an idea of some way Father could die other than a natural death...?"'
24013: 'Krauss@r@v02/40800049."Of course I don''t.@k@|@y@v02/40800050. ......I see, now I too understand how Father feels.@k@v02/40800051. What pitiful final years, unable to even die as he pleases."'
24014: 'Kyrie@r@v09/41300078."Yes, truly pitiful final years.@k@v09/41300079. ......And what we suspect is that those "final years" are already in the past."'
24015: 'Kyrie@r@v09/41300080."......You could completely clear this suspicion just by letting us meet with Father.@k@v09/41300081. ...So even after all this humiliation, you still won''t allow us to meet with him, Krauss nii-san.........?"'
24016: 'Krauss@r@v02/40800052."................................."'
24017: 'Kyrie@r@v09/41300082."Father is probably already dead.@k@v09/41300083. You disposed of the body in absolute secrecy, most likely.@k@v09/41300084. ......And after taking all of the wealth for yourself as Father''s agent,@k@v09/41300085. you will make it so that he "disappeared" and spend seven years making Father a corpseless member of the deceased."'
24018: 'Kyrie@r@v09/41300086."............I''m sorry, please don''t take it badly, alright?@k @v09/41300087.I''m just playing detective here."'
24019: 'Natsuhi@r@v03/40900017."H-......how rude can one be!!@|@y@k @v03/40900018.You have no right to stay in this mansion!!@k @v03/40900019.Leave immediately!!@k @v03/40900020.I will never again permit you to cross the threshold of this house!!"'
24020: 'Kyrie@r@v09/41300088."It worked last year, but you''ve used up your luck if you thought it would work this year too.@k@|@y@v09/41300089. ......Father is in a bad mood, so he can''t meet with us?@k @v09/41300090.That was plenty suspicious last year, and yet you do it again this year."'
24021: 'Kyrie@r@v09/41300091."If you wanted to fake being Father''s agent and grab up all his assets, you should have done it a little more speedily,@k@v09/41300092. and made him disappear without waiting for today''s family conference.@k@v09/41300093. You really are naive, Krauss onii-sama......"'
24022: 'Krauss@r@v02/40800053."............I have no idea what you are—"'
24023: 'Kyrie@r@v09/41300094."However!@k @v09/41300095.......If it is a fact that Father is in a bad mood,@k@v09/41300096. and you are preventing us from meeting him as part of your responsibilities as his caregiver, that is a very virtuous thing to do.@k@v09/41300097. In that case, if you just accept the conditions I''ve provided, everything will be settled here and now."'
24024: 'Kyrie@r@v09/41300098.".........After all, you care so greatly for Father, Krauss nii-san.@k@v09/41300099. There''s no way that Father will die in a manner that leads to trouble during the autopsy."'
24025: 'Kyrie@r@v09/41300100."Father hates hospitals in any case, so he''ll pass away in his study, right?@k @v09/41300101.An autopsy will certainly be carried out in any event.@k@|@y@v09/41300102. ......The only way to kill him without an autopsy would be for him to disappear."'
24026: 'Eva@r@v05/41000032.".........Kyrie-san. I wonder if you would mind not bullying Nii-san so much...?"'
24027: '@rEva rebuked Kyrie in an sickeningly kind voice.'
24028: '@r...Considering the situation, that was impossible.@k@rWhich is why it was so sickening...'
24029: 'Eva@r@v05/41000033."Nii-san must have all kinds of situations of his own to deal with, as well as his pride.@k@v05/41000034. Even though it may be an obvious duty to Nii-san,@k@v05/41000035. if we put it down on paper and even assign penalties,@v05/41000036. ...that''s bound to be unpleasant for him.@k@|@y@v05/41000037. Don''t you agree, Rosa......?"'
24030: 'Rosa@r@v12/41400061."......Yes, that''s right.@k@v12/41400062. .........We might have made light of Krauss nii-san''s pride as the eldest son too much.@k@v12/41400063. ......It might be a bit cruel to make him sign a memorandum regarding the duties of the caregiver as Kyrie-san suggests."'
24031: 'Rudolf@r@v08/41200047."Yeah, I agree.@k@v08/41200048. You''re doing a good job, Aniki.@k@v08/41200049. Taking that into account, all that stuff about signing strange papers and worst-case penalties,@k@v08/41200050. it might be possible for us to consider skipping all that and just leaving everything to you."'
24032: 'Krauss@r@v02/40800054."Y-............you people............"'
24033: '@rNot just Eva, but Rudolf and Rosa as well began closing in on Krauss, with unnerving smiles on their faces as though they had planned this beforehand.'
24034: '@rThey now understood perfectly how Kyrie had cornered Krauss, and exactly where she was prepared to compromise...'
24035: 'Kyrie@r@v09/41300103."......The memorandum regarding the responsibilities of the caregiver.@k@v09/41300104. You can make it so that you don''t need to sign, and we will never demand a meeting with Father again.@k@v09/41300105. ......If you can guarantee that you are fit to be the caregiver even without the document, that is."'
24036: 'Krauss@r@v02/40800055."Are you telling me.........to pay security money?@k @|@y@v02/40800056.Hehheheheh, hahhahahahahaha...!@k @v02/40800057.This is ludicrous!@k @v02/40800058.Wahhahahahahahahahaha!"'
24037: 'Kyrie@r@v09/41300106."The security money, paid to Eva-san, Rudolf-san, and Rosa-san, will be 3 billion yen each.@k@v09/41300107. As a deposit, you will transfer ten percent of that, 300 million yen each, before the year is out."'
24038: 'Krauss@r@v02/40800059."9 billion?!@k @v02/40800060.I don''t have that kind of money!!!"@|@y'
24039: 'Kyrie@r@v09/41300108."After Father passes away, you should be able to work it out.@k@v09/41300109. Our investigations have told us at least that much.@k@v09/41300110. And even the deposit of 900 million yen, you should be able to manage in your current financial situation."'
24040: 'Kyrie@r@v09/41300111."And it should even be possible for you to borrow it from Father, right?@k @v09/41300112....There''s no need for this obvious charade."'
24041: 'Krauss@r@v02/40800061."............H-how unpleasant.@k@v02/40800062. Truly unpleasant...!!"'
24042: 'Natsuhi@r@v03/40900021."I-it is at that!!@k @v03/40900022.And it was disrespectful enough just with the discussion of Father''s inheritance!@k @v03/40900023.Father is already dead?@k @v03/40900024.My husband is hiding that and keeping all the money to himself?!"'
24043: 'Natsuhi@r@v03/40900025."I have had enough of this!!@k @v03/40900026.None of you are qualified to bear the name Ushiromiya any longer!!"'
24044: 'Hideyoshi@r@v06/41100012."Calm down, Natsuhi-san...!@k @v06/41100013.And the rest of you, that''s enough talk for now!@k @|@y@v06/41100014.Why don''t we just leave it at that for the time bein'', huh...?!@k @v06/41100015.This is a big ol'' topic, and sudden, too.@k@v06/41100016. We might be gettin'' a little worked up ourselves!"'
24045: 'Hideyoshi@r@v06/41100017."Why don''t we take a break for a while and cool our heads?@k @v06/41100018.Krauss nii-san probably needs a little time himself.@k@v06/41100019. Right, Krauss-san?"'
24046: 'Krauss@r@v02/40800063."......Time...?@k @v02/40800064.And why would I need something like that?"'
24047: 'Hideyoshi@r@v06/41100020."OK, OK, OK!@k @v06/41100021.Look, deep down, none of us are actually thinkin'' anythin'' serious like that!@k @v06/41100022.It just seemed like you weren''t goin'' to let us see Father no matter what, so we felt like makin'' a few bitter comments, that''s all...!"'
24048: 'Hideyoshi@r@v06/41100023."And Krauss-san, the things we said made you angry and you argued back on instinct, I know reeeeal well what that''s like...!@k @v06/41100024.That''s not how you really feel either, you''re actually thinkin'' fine, I''ll let you see him if you''re goin'' to be that pig-headed about it!"'
24049: 'Hideyoshi@r@v06/41100025."Right?@k @v06/41100026.Isn''t that right?@k @v06/41100027.But after all we''ve said, you just couldn''t help gettin'' stubborn, and now you''re havin'' trouble sayin'' it''s alright to see him, that''s all.@k@v06/41100026. Isn''t that it?@k@v06/41100029. Right? Right?"'
24050: 'Natsuhi@r@v03/40900027."......I-...it certainly does seem that, like the rest of you, my husband has slightly lost his composure.@k@|@y@v03/40900028. ......We are firmly refusing only out of respect for Father''s desire not to meet with you all."'
24051: 'Krauss@r@v02/40800065.".....................@k@v02/40800066. ......Hmm, that''s right.@k@v02/40800067. It just started turning into another sibling fight like the old days, and I grew stubborn as well.@k@v02/40800068. .........Let us cool our heads."'
24052: 'Krauss@r@v02/40800069."...I understand now how strongly you all desire to meet with Father.@k@v02/40800070. ...I will pass that on to him.@k@v02/40800071. .........I will find some way of convincing him so that he will see you.@k@v02/40800072. .........How is that?"'
24053: 'Rosa@r@v12/41400064."......Right.@k@v12/41400065. I think it''s alright to give Krauss nii-san some time to persuade Father."'
24054: 'Rudolf@r@v08/41200051."Yeah.@k@v08/41200052. ......We''re counting on you, Aniki.@k@v08/41200053. Please do a good job of persuading him so that he''ll meet with us.@k@v08/41200054. After all, you''re Dad''s caregiver."'
24055: 'Eva@r@v05/41000038."About persuading him...let''s set a limit on it to sometime tonight, alright?@k @v05/41000039.When tomorrow comes, we''ll confirm Father''s well-being, even if we have to break down the door to his study.@k@|@y@v05/41000040. .........You have no problems with that, right?@k @v05/41000041.Nii-san...?"'
24056: 'Krauss@r@v02/40800073."......Do as you like.@k@v02/40800074. I see, it seems that I am not even given much time to persuade him.@k@|@y@v02/40800075. ......Come on, Natsuhi.@k@v02/40800076. We shall ask him to at least be with us for dinner."'
24057: 'Natsuhi@r@v03/40900029."Y-yes...!"'
24058: '@rKrauss left the parlor accompanied by Natsuhi.'
24059: '@rOnce their footsteps disappeared,@k Hideyoshi breathed out heavily, and flopped onto a sofa, smirking...'
24060: 'Hideyoshi@r@v06/41100030."............Kyrie-san.@k@v06/41100031. ...You are...a frightening person."'
24061: 'Kyrie@r@v09/41300113."Sorry for speaking out of turn.@k@v09/41300114. I apologize."'
24062: 'Rudolf@r@v08/41200055."......No, no, you cornered him in a different way from the original plan, but in the end, this was even better.@k@v08/41200056. ...Just like always, I have to bow my head to you..."'
24063: 'Rosa@r@v12/41400066."But...can he really prepare 900 million yen......?@k @v12/41400067.We estimated that 750 million would be the most Krauss nii-san could afford with his current financial situation...@k@v12/41400068. ......Isn''t 900 million gouging him too much...?"'
24064: 'Kyrie@r@v09/41300115."It''s alright if it''s impossible for him.@k@v09/41300116. If we do something like lowering it to 750 million so Krauss nii-san can save face, it will look like we''re compromising and it''ll be easier to settle, right?@k @v09/41300117.And if he really does come out with 900 million, that''s even better."'
24065: 'Eva@r@v05/41000042."Nii-san is probably having a strategy meeting with Natsuhi-san about now.@k@v05/41000043. ......It will be truly interesting to see what kind of twisted logic our proud Nii-san comes up with as an excuse."'
24066: 'Kyrie@r@v09/41300118."Convince Father......?@k @v09/41300119.There''s no way he can."'
24067: '@rThere''s no way to convince someone who doesn''t even exist...!'
24068: 'Krauss@r@v02/40800077."..................All my siblings have taken time out of their schedules to come here to this annual family conference."'
24069: '@rKrauss and Natsuhi could be seen in Kinzo''s dimly lit study.'
24070: '@rEvery once in a while, thunder could be heard, and the dimly lit room flickered with light.@k ......It seemed that the island would be closed off by the storm very soon.'
24071: 'Natsuhi@r@v03/40900030."......Father...!@k @v03/40900031.Please, just this once, show those disrespectful people the majesty of the head...!"'
24072: 'Kinzo@r@v01/41500001."It''s no good........."'
24073: '@rThe large figure standing by the window, his majestic back facing them,@k quietly yet forcefully...gave his answer.'
24074: '@rHis head was hung slightly, and he appeared to be trembling.@k ...Eventually, a mumbling laugh reached them from over his shoulder.'
24075: 'Kinzo@r@v01/41500002."Heh-heh-heh-heh-heh-heh, hah-hah-hah-hah-hah-hah!!@|@y@k @v01/41500003.It''s no good, it''s no goddamn good at all...!!@|@y@k @v01/41500004.Wahhahahahahahahahahaha!!"'
24076: '@r.........Three months left to live...?@k A senile old man not long for this world...?@k@rJust who are you referring to?'
24077: 'Kinzo@r@v01/41500005."Brain-dead fooool!!@|@y@k @v01/41500006.Your siblings intimidated you, so you come crawling over here, is that it?@k@v01/41500007. You are a disgrace!!"'
24078: '@rAs Kinzo spun around and brandished his cloak, a blast of wind shook up the stale air inside the room.'
24079: '@rThat air pressure expressed clearly the majesty and willpower of Ushiromiya Kinzo.@|@y'
24080: '@rIt was no wonder at all that Krauss landed on his backside, as if that pressure had literally blown him to the ground.'
24081: '@rAs though showing consideration for Krauss, who looked as though his legs had been swept out from under him, Natsuhi also crouched down.'
24082: '@rThen,@w500. ......with a thunk,@w666. ......and another thunk,@w666. Kinzo''s footsteps approached with a heft that signified his majesty.'
24083: 'Krauss@r@v02/40800078."F-......Father........."'
24084: 'Kinzo@r@v01/41500008."Yoou fooooooooool......!!@k @v01/41500009.I heard it all from Kanon, just how pathetically your siblings made you dance like a puppet!!!!"'
24085: 'Natsuhi@r@v03/40900032."F-Father...!@k @v03/40900033.My husband is doing his best to protect your honor—"'
24086: '@rWithout lending an ear to Natsuhi''s words, Kinzo extended his palm to Krauss''s collar, as the latter sat on the floor.'
24087: '@r...No, he curled up his fingers, leaving only his index finger out, and then, with that one remaining finger.........@khe pressed hard into Krauss''s collar,@w500. ......twisted it,@w583. ..................and slowly,@w500. with just one finger,@w583. ......he raised Krauss high into the air.'
24088: 'Kinzo@r@v01/41500010."...Truly, what a pathetic creature you aaaare.@k@v01/41500011. ......You even need your wife to speak in your defense?@k @v01/41500012.If you have an excuse, man up and show me you can give it yourself!!"'
24089: 'Krauss@r@v02/40800079."Ggggg, .....................gahahhk......!!"'
24090: '@rKrauss''s feet scrabbled at the air.'
24091: '@rKinzo''s brawny finger was choking him.@k@rHe couldn''t even open his mouth, much less talk.'
24092: '@rHowever, even if he had been allowed to open his mouth,@k as he was now, there was no way he would be able to think up an excuse that Kinzo would accept...'
24093: '@rStill, ......what incredible power he possessed...@k@rNo one would call Kinzo an old man after seeing this superhuman strength...'
24094: 'Natsuhi@r@v03/40900034."......Father...!!@k @v03/40900035.My husband, he has his own way of fighting...!!@k @v03/40900036.I beg you to forgive him...!!"'
24095: 'Kinzo@r@v01/41500013."............Natsuhii.@k@v01/41500014. ......Fighting is the process you undergo before you achieve victory.@k@v01/41500015. ......You cannot call it fighting if it ends in a loss."'
24096: 'Kinzo@r@v01/41500016."Just one word, we call that humiliation!!@k @v01/41500017.Wahhahahahahahahaha, and this is my successor?@k@v01/41500018. Wahhahahahahahaha, wahhahhahhahahahahahahahhaaaaaaah!!"'
24097: '@rAs thunder roared, Kinzo laughed heartily as though there could be nothing more amusing.'
24098: '@rAnd at the end of his laugh, he threw his feckless son away like he was scrap paper,@k slamming him against the wall...'
24099: 'Krauss@r@v02/40800080."Ghaghh, ......uuuuuuuuunnghh......"'
24100: 'Natsuhi@r@v03/40900037."My love, my love...!! Just breathe......"'
24101: '@rKrauss slid down the wall, rubbing his throat in pain...@k@rNatsuhi ran up to him and cared for him...'
24102: '@rBut Kinzo showed no interest in the two of them,@k and he returned to the space near the window, as though he had been there the whole time, and looked up at the ominous thunderclouds.'
24103: 'Kinzo@r@v01/41500019."............I thought that as long as I could meet BEATRICE, I would have no regrets in my life,@k@v01/41500020. but it seems that things won''t go so smoothly."'
24104: 'Kinzo@r@v01/41500021."......It was promised from the beginning that nothing received from the witch would remain.@k@v01/41500022. However, the Ushiromiya name is not the property of the witch."'
24105: 'Kinzo@r@v01/41500023."......Who is fit to succeed that name?@k@v01/41500024. It seems that this alone must be resolved by my own hand.@k@v01/41500025. ......Rejoice, Krauss!!@k @v01/41500026.I have changed my mind."'
24106: 'Krauss@r@v02/40800081.".........F-Father...@k@v02/40800082. .........Then you''ll......?"'
24107: 'Kinzo@r@v01/41500027."I have no desire to have dinner with you cowards.@k@v01/41500028. However, I will attend the family conference afterwards!"@|@y'
24108: 'Natsuhi@r@v03/40900038."F-Father...@k@v03/40900039. Thank you very much......!"'
24109: 'Kinzo@r@v01/41500029."There, I shall make an important announcement regarding the succession of the headship.@k@v01/41500030. I will resolve your foolish quarrel myself!!@k @v01/41500031.Uuhhahahahahahaha, waaahah-hah-hah-hah-hah-hah-hah-hah-hah-hah-hah!!!"@|@y'