43506: '@rErika had returned to the room that had been given to her on the second floor of the guesthouse.'
43507: '@rThe next room over was empty.@k It was very quiet there...'
43508: '@rEven pressing her ear against the wall wouldn''t enable her to listen in on the voices in the cousins'' room.'
43509: '@rEven with hearing power boosted by the detective''s authority, it would probably be impossible to make out anything.'
43510: '@rThis room was the farthest down the hall, a long ways away from the cousins'' room......'
43511: 'Erika@r@v46/64500407."Last time, my room was right next to theirs.@k@v46/64500408. ......I see...so he''s placed my room farther away this time."'
43512: 'Dlanor@r@v47/64600031."The powers of authority given to the Game Master permit this level of modification to the initial ARRANGEMENT.@k@v47/64600032. It is, perhaps, a quite reasonable first MOVE."'
43513: 'Erika@r@v46/64500409."Well, that suits me too.@k@|@y@v46/64500410. I have no desire to listen to those brats'' squeaky voices as they play cards."'
43514: 'Dlanor@r@v47/64600033.".................."'
43515: '@rThis whole time, Erika had been sitting at the desk working at something.@k@r......She was preparing some of those duct tape seals from before.'
43516: '@rShe had asked Kumasawa for the stickiest tape available.'
43517: '@rShe drew a complicated, unforgeable signature on it with a permanent marker, then added slits through it.'
43518: '@rBy sticking this over a place that she wanted to prove had remained closed,@k she could create a powerful seal equal in strength to the red truth.'
43519: '@rThose menacing seals had cornered Natsuhi so thoroughly in the previous game...'
43520: 'Erika@r@v46/64500411.".........nn......@k@v46/64500412. ......Great..."'
43521: 'Dlanor@r@v47/64600034."Is something WRONG?"'
43522: 'Erika@r@v46/64500413."......He got me.@k@v46/64500414. ......That Battler doesn''t let anything get by him, does he?"'
43523: '@rErika shrugged and showed the piece of duct tape she had cut off to Dlanor.'
43524: '@rBy sight alone, Dlanor couldn''t tell what had annoyed Erika.@k@rHowever, as soon as she held the tape, she realized the difference right away.'
43525: 'Dlanor@r@v47/64600035."......This won''t be any GOOD."'
43526: 'Erika@r@v46/64500415."Yes.@k@v46/64500416. It''s barely sticky at all.@k@v46/64500417. This won''t reach even close to the red truth."'
43527: '@rEven duct tape can be of low quality, and it sometimes gets weaker with age.'
43528: '@rThe tape Kumasawa had found was a bit too weak even for normal use.@k It wasn''t nearly sticky enough to be used as a detective''s seal.'
43529: 'Dlanor@r@v47/64600036."It is possible to tear it off CLEANLY.@k@v47/64600037. This cannot serve as proof of a SEAL."'
43530: 'Erika@r@v46/64500418."......I guess Battler isn''t as totally incompetent as I thought.@k@v46/64500419. He probably tampered with all the duct tape on the island using the authority of the Game Master."'
43531: '@rLetting Erika get her hands on duct tape gave her a fatal weapon to use against witches.@k The previous game had proven this fact.'
43532: '@rAnd so, Battler had removed that weapon from the entire mansion......'
43533: 'Dlanor@r@v47/64600038."Most likely,@k@v47/64600039. all possible substitutes for duct tape have also been tampered WITH."'
43534: 'Erika@r@v46/64500420."......Probably.@k@v46/64500421. Well, it isn''t really so bad.@k@v46/64500422. At least this way, I won''t have to look like a fool crawling all over the outer wall in the cold rain."'
43535: '@rErika tossed the duct tape aside and flopped spread-eagled onto the bed...'
43536: 'Erika@r@v46/64500423."Well, detectives do have a penchant for puffing on a pipe while waiting calmly for a crime to occur.@k@v46/64500424. ......I doubt there''ll be any part for you to play until the first twilight begins,@k@v46/64500425. so why not vanish off somewhere and take a smoking break?@k@v46/64500426. .........I imagine that looking at my face will do nothing more than tire you out."'
43537: 'Dlanor@r@v47/64600040."......I do not SMOKE.@k@v47/64600041. I am just a KID."'
43538: 'Erika@r@v46/64500427."Oh, really?@k@v46/64500428. ......I wish I could.@k@v46/64500429. ...Well, only if it really is as refreshing as smokers claim."'
43539: 'Dlanor@r@v47/64600042."......It seems...that you are not in high SPIRITS."'
43540: 'Erika@r@v46/64500430.".........Does it look that way?"'
43541: '@rErika answered lazily, still looking up at the ceiling.@k@rThat in itself was half an answer...'
43542: '@rThe silence between the two was filled by the sound of the wind and rain.'
43543: '@rIt was so quiet...@w500....that it was hard not to listen to the ticking of the clock.'
43544: 'Dlanor@r@v47/64600043.".........Lady ERIKA.@k@v47/64600044. May I ask a QUESTION?"'
43545: 'Erika@r@v46/64500431."Depends on what it is.@k@v46/64500432. Answer''s probably <no> though."'
43546: 'Dlanor@r@v47/64600045."..........................."'
43547: 'Erika@r@v46/64500433."...............@k@v46/64500434. Well, we''re just killing time anyway.@k@v46/64500435. What is it?"'
43548: '@rErika was probably bored as well.@k@r......Or maybe the sound of the rain was making her sentimental.'
43549: '@rShe assented, which was very unlike her.'
43550: 'Dlanor@r@v47/64600046."Why is it...@k@v47/64600047....that you hate MAGIC?"'
43551: 'Erika@r@v46/64500436."......Oh,@k@v46/64500437. ......you mean that thing downstairs with Maria?"'
43552: 'Dlanor@r@v47/64600048."That was nothing more than a foolish trick to deceive CHILDREN.@k@v47/64600049. Everyone knew THAT.@k@v47/64600050. ......Was it really necessary to go so far to destroy that ILLUSION?@k@v47/64600051. ...I cannot UNDERSTAND."'
43553: '@rIt had been a childish fight.@k ......Erika didn''t need Dlanor to tell her that.'
43554: 'Erika@r@v46/64500438."......Well, I am a self-proclaimed intellectual rapist.@k@v46/64500439. I can''t stand having magic confuse the truth."'
43555: 'Dlanor@r@v47/64600052."And so, you feel pleasure from exposing THAT?@k@v47/64600053. ......I sense a different EMOTION."'
43556: 'Erika@r@v46/64500440."A different emotion?@k @v46/64500441..........What''s that?"'
43557: 'Dlanor@r@v47/64600054."To me, it feels less like pleasure,@k@v47/64600055. ......and more like a different, negative EMOTION."'
43558: 'Erika@r@v46/64500442."Hah, ......you really are a murder doll, aren''t you?@k@v46/64500443. Even your eyes are like knotholes."'
43559: 'Dlanor@r@v47/64600056.".........My APOLOGIES.@k@v47/64600057. Please forgive ME."'
43560: '@rErika rolled over grumpily, turning her back to Dlanor.'
43561: '@rBecause of this, Dlanor couldn''t see her expression.'
43562: '@r......Even so...'
43563: '@r...for some reason, she could guess that this completely unobserved expression was one of pain...'
43564: '@rInterpreting this to mean that Erika wanted her to go away,@k Dlanor gave a bow and made to leave.'
43565: '@rThen, Erika suddenly spoke.'
43566: '@rThe words came so far out of the blue that Dlanor doubted her ears,@k and she had to ask Erika to say it again.'
43567: 'Dlanor@r@v47/64600058."......What did you just SAY?"'
43568: 'Erika@r@v46/64500444."I love you."'
43569: '@rIt really was......out of the blue.'
43570: '@rDlanor wanted to ascertain what Erika really meant,@k but the latter still had her back turned, and her face was out of sight...'
43571: 'Dlanor@r@v47/64600059."............Thank you very MUCH."'
43572: 'Erika@r@v46/64500445."I was going out with another girl before, but I''ve completely broken up with her.@k@v46/64500446. Others are gonna be jealous of us and say things that aren''t true, but don''t pay them any attention."'
43573: 'Dlanor@r@v47/64600060."................................."'
43574: 'Erika@r@v46/64500447."I''m gonna devote my whole life to you, so I want you to do the same for me.@k@v46/64500448. Let''s find happiness together."'
43575: '@rDlanor avoided asking what she was talking about and stood there in silence.'
43576: '@rFor a while, Erika kept on speaking in that dull and emotionless tone,@k repeating soppy phrases that might have popped up in some shoujo manga...'
43577: '@rThen, unexpectedly, she once again followed up with a complete non sequitur.'
43578: 'Erika@r@v46/64500449.".........A new wallet."'
43579: 'Dlanor@r@v47/64600061."..................?"'
43580: '@rOf course, she had no idea what Erika was saying.'
43581: '@rHowever, with her back still to Dlanor, ......Erika kept on saying disconnected words.'
43582: 'Erika@r@v46/64500450."A strange cat keychain.@k@v46/64500451. A different style of cologne.@k@v46/64500452. A music tape that''s not his style...which he said he borrowed from an acting colleague.@k@v46/64500453. .........A colleague asked him to come and he couldn''t turn him down.@k@v46/64500454. Work suddenly called him in.@k@v46/64500455. His buddy called him up and he couldn''t get off the phone."'
43583: '@r@z90.He made too much curry.@k@rHe started going to theater practice more often.@k@rHe started folding paper towels differently.@k@r''Thanks, I''ve already eaten.''@k@rHe knew more than before about cosmetics.@k@r''Sorry, I was sleeping.''@k@rThe toilet seat was left down.@k@rHe spent the night over at his stage friends'' place.@k@r''Me and my acting friends had a party here.@k Someone just left it behind.''@k@rThe drain and sink were cleaned out.@k@rThere were receipts and point cards from places he didn''t usually go.'
43584: '@r@z90.The muddy soles are evidence that you went out on Monday when it was raining.@k@rIt matches the strange symbol on the calendar.@k@rNone of your theater friends have hair this long.@k@rLeading questions.@k@rHow do you know the plot of a movie you haven''t seen yet?'
43585: '@r@z90.Evidence,@w250. evidence,@w250. circumstantial evidence. Observation,@w250. surveillance,@w166. tracking,@w166. tailing. Information gathering,@w166. wiretapping,@w166. asking around,@w166. questioning.'
43586: '@r@z90.I found plenty of evidence that I loved you.@k@rI found plenty of evidence that you loved me.@k@rBut I can''t find any evidence that you haven''t been cheating on me.'
43587: '@r@z90.Give it a rest.@w250. If you love me, then trust me.@k@w250. If you can''t do that, then you don''t love me anymore.@k@w166. How could I love someone like that?@k@w166. I''ll treasure you for all my life, but I want to do well in theater just as much.@k@w166. You said you liked seeing me act, right?@k@w166. So why are you telling me to stop acting now?@k@w166. Why do I have to choose between you and acting?@k@w166. What''s wrong with you? I''m seriously tired of this, alright?@k@w166. Look, if all we do is fight when we see each other, maybe we both need some time to cool off, okay?@k @w83.I need to concentrate for my next performance anyway.@k@w83. One of my colleagues,@w83. she''s suddenly told us she won''t be able to perform.@k@w83. I need to rewrite the script by tomorrow.@k I don''t have the time for this.'
43588: '@r@z90.You know what, if you really find it that hard to trust me, we''re through.@k Don''t bother coming over again,@w333. just go home,@w333. I don''t love you anymore.@k Stop crying, God you''re obnoxious,@|@y@w500. go kill yourself, you creep.@k@|@y Stop shouting, dammit, I''ve got neighbors.@k Just get the hell away from me and never come back.'
43589: 'Erika@r@v46/64500456."......Without love, it cannot be ''seen''?@k@v46/64500457. ............Hah.@k@v46/64500458. That''s backwards."'
43590: 'Dlanor@r@v47/64600062."...................................."'
43591: 'Erika@r@v46/64500459."Because of love,@k@v46/64500460. you end up ''seeing'' things that don''t even exist."'
43592: '@r......It''s nothing more than an illusion, one that no one except you can ''see'', and one that even you can never touch.'
43593: '@rWithout love, Humans would never need to ''see'' that fiction.'
43594: '@rBecause we can ''see'' it, ......we doubt.@k We suffer.@k We cry out loud.'
43595: 'Erika@r@v46/64500461.".........Right now, I am happy.@k@v46/64500462. .........Though it may be temporary, I have become the Witch of Truth.@k@|@y@v46/64500463. ......As I am now,@v46/64500464. ......I no longer need to worry about being tormented by non-red words."'
43596: 'Dlanor@r@v47/64600063."..........................."'
43597: 'Erika@r@v46/64500465."..............................@k@|@y@v46/64500466. ......What about you? How would you have countered my endgame?"'
43598: 'Dlanor@r@v47/64600064."How would...I?"'
43599: 'Erika@r@v46/64500467."That useless man wasn''t fit to be my opponent.@k@v46/64500468. ......I was wondering how you would have countered it?"'
43600: 'Dlanor@r@v47/64600065."...................................."'
43601: '@rDlanor was suddenly thrust into the position of Erika''s opponent in the witch''s game she had once challenged that man with.'
43602: '@rDlanor shared in the fragments of Erika''s past, allowing her to grasp the full situation.'
43603: '@rThe board was reproduced in full inside their heads...'
43604: '@rThe situation...was one-sided.'
43605: '@rErika''s side had constructed a blue truth based on countless bits of circumstantial evidence, had turned all of those into pieces,@k and was already cornering the opponent.'
43606: '@rFor some time, Dlanor thought in silence...@k...and announced her by-the-book response.'
43607: 'Dlanor@r@v47/64600066."First MOVE.@k@v47/64600068. ......@|@yI request that you submit evidence that I have been CHEATING."'
43608: 'Erika@r@v46/64500469."Counter with the blue truth.@k@|@y@v46/64500470. I present eighty-four points of circumstantial and physical evidence."'
43609: 'Dlanor@r@v47/64600069."Counter with the blue TRUTH.@k@|@y@v47/64600070. I present six points of circumstantial and physical evidence that I still love YOU."'
43610: 'Erika@r@v46/64500471."<Good>.@k@v46/64500472. Blue and blue cancel each other out, but the number of pieces used to construct each is overwhelmingly unbalanced."'
43611: '@rWhen both opponents meet with the blue truth,@k the decision is almost always based on which side has more pieces of evidence, regardless of the actual circumstances.@k ......This is especially true in the Human world.'
43612: '@rSo, by the standard rules, Erika would win...'
43613: 'Erika@r@v46/64500473."First point to me.@k@v46/64500474. Your next move?"'
43614: 'Dlanor@r@v47/64600071."............I will attempt to switch offense and DEFENSE.@k@|@y@v47/64600072. I ask that you, Lady ERIKA, provide proof that you are not CHEATING."'
43615: 'Erika@r@v46/64500475."Perpetual check.@k@v46/64500476. That''s a forbidden move, since it''d result in an endless repetition of the same question going both ways."'
43616: 'Dlanor@r@v47/64600073."Then I frankly declare that, despite a lack of proof, I still love you even NOW."'
43617: 'Erika@r@v46/64500477."Not red truth and therefore invalid.@k@|@y@v46/64500478. Even if it was red, that''d be a stalemate.@k@v46/64500479. After all, I''d have no move to counter with."'
43618: 'Dlanor@r@v47/64600074.".............................."'
43619: '@rDlanor remained silent for a while.'
43620: '@rShe responded quietly to Erika''s moves...@k...as Erika drew closer and closer to checkmate.'
43621: '@rA stalemate is a forbidden move in the game of witches, since it means the ruin of the game.'
43622: '@rHowever, in chess, it also represents a draw.'
43623: '@rBecause of this, it is a splendid final move that the weaker player can pull off if they are already unable to win outright.'
43624: '@rIn this situation, Erika clearly had the advantage.'
43625: '@r......It was natural that Dlanor, her opponent, would seek a stalemate to obtain a draw.'
43626: '@rHowever, that only worked in chess.@k@r......In the game where witches fought over the truth, it was a forbidden move.'
43627: '@rSo, it was already checkmate from the very beginning.@k@rDlanor had no way to turn the game around...'
43628: '@rBut that meant that regardless of what the real truth had been,@w583. ............this game would...@w500.................'
43629: 'Erika@r@v46/64500480."......Any other moves?@k @v46/64500481.O witch-hunting archbishop, protector of the truth?"'
43630: 'Dlanor@r@v47/64600075.".........NO.@k@v47/64600076. ......I RESIGN."'
43631: 'Erika@r@v46/64500482."See? There you go.@k@v46/64500483. ..................Hmph..."'
43632: '@rErika had succeeded in crushing her opponent with the truth she espoused...@k...that her former boyfriend no longer loved her and was cheating on her.'
43633: '@rHer opponent had no way to argue back.'
43634: '@r.........After all, Humans are not allowed to use ————.'
43635: '@rA splendid game, a splendid finish from a superior position.@k@rRegardless of the truth of her opponent, Erika could win.@k@rA splendid......victory.'
43636: '@rDlanor could only respond with silence.'
43637: '@rAnd with that, Erika spoke no more.@k@r......She was probably done talking and wanted Dlanor to leave.'
43638: '@rDlanor understood this, but even so,@k@r.........she wanted to tell Erika just one thing before leaving.'
43639: 'Dlanor@r@v47/64600077."A splendid game, Lady ERIKA."'
43640: 'Erika@r@v46/64500484."It''s only natural that the detective wins."'
43641: 'Dlanor@r@v47/64600078."Even before you became Lady BERNKASTEL''s piece, you truly were a splendid wielder of the blue TRUTH.@k@|@y@v47/64600079. .........However, Lady ERIKA.@k@v47/64600080. Humans are only allowed to use the blue TRUTH.@k@v47/64600081. And the only thing that can counter blue truth is red TRUTH.@k@v47/64600082. And Humans are not allowed to use the red TRUTH."'
43642: 'Dlanor@r@v47/64600083."............In that case,@k@v47/64600084. ...how should your opponent have shown his TRUTH?"'
43643: 'Erika@r@v46/64500485.".........Who knows.@k@v46/64500486. ......Maybe he should have used that gold truth or whatever, which is supposed to be stronger than the red truth at times."'
43644: 'Dlanor@r@v47/64600085."...........................@k@v47/64600086. ......You certainly were the victor in that GAME.@k@v47/64600087. However, allow me to say this as a protector of the TRUTH."'
43645: 'Erika@r@v46/64500487."What?@k@v46/64500488. ......I imagine it''s something unpleasant, so say it and go away."'
43646: 'Dlanor@r@v47/64600088."......YES.@k@v47/64600089. .........Our game did end with your VICTORY.@k@v47/64600090. However,@k@v47/64600091. ......you still have not denied the six points of blue truth evidence that I showed to claim that I still loved YOU.@k@|@y@v47/64600092. ......Even you are HUMAN.@k@v47/64600093. You are unable to use the red truth that would disprove those POINTS."'
43647: 'Erika@r@v46/64500489."Later on, I used the detective''s authority to have all eighty-four points transformed into red truth.@k@v46/64500490. By the power of my master...!@k @|@y@v46/64500491.I am Human, yet superior to Humans.@k@v46/64500492. A detective and a witch.@k@v46/64500493. I am the Witch of Truth, Furudo ERIKA.@k@v46/64500494. Any other questions? Parting remarks?"'
43648: 'Dlanor@r@v47/64600094.".........I have NONE.@k@v47/64600095. ......In that case, please excuse ME."'
43649: '@rDlanor bowed and disappeared.'
43650: '@r......After that, all that remained was a single Witch of Truth laughing off a bitter past...@kwith an equally bitter smile...'
43651: '@rErika glanced at the bedside clock and saw that it was almost exactly midnight.'
43652: 'Erika@r@v46/64500495."......Well, I suppose I should get a little sleep.@k@v46/64500496. The curtain has finally risen on the second day, October 5th.@k@v46/64500497. ......I wonder if the first of this game''s murders is happening somewhere about now.@k@v46/64500498. I hope our victims leave us some interesting dying messages this time.@k@v46/64500499. Ehheheheheheeheheheheheheheheheh...!"'
43653: 'Eva@r@v05/61000005."Why didn''t you discuss this with your mother?!!@|@y@k @v05/61000006.This is about the partner who''s supposed to support you throughout the rest of your life!!"'
43654: 'George@r@v07/60300254."That''s right.@k@v07/60300255. She''s the woman I want to spend the rest of my life with."'
43655: 'Eva@r@v05/61000007."And that''s why you need to choose very carefully, right?!@k @v05/61000008.How can you be so rash?!!"'
43656: '@rEva and George could be seen beneath the eaves of the guesthouse.'
43657: '@rGeorge had revealed his engagement with Shannon.'
43658: '@r......Eva''s anger had exploded almost instantly.'
43659: '@rThis had been no more than George had expected, so he had responded with an ice-cold calm...'
43660: 'Eva@r@v05/61000009.".........Don''t tell me you consummated your relationship already.@k @v05/61000010.She told you she was pregnant to force you into a marriage, didn''t she?!"'
43661: 'George@r@v07/60300256."How rude.@k@v07/60300257. I''m a strong believer that chastity is to be preserved before marriage."'
43662: 'Eva@r@v05/61000011."Then why an engagement?!"'
43663: 'George@r@v07/60300258."I asked her.@k@v07/60300259. She accepted.@k@v07/60300260. What more could be needed?"'
43664: 'Eva@r@v05/61000012."No, it''s all wrong!!@k @v05/61000013.Marriage isn''t as easy as it looks in manga or whatever you''re thinking of!!"'
43665: 'Eva@r@v05/61000014."What about her parents?@k @v05/61000015.Relationships between the two families?@k@v05/61000016. You''re not some stray alley cat! You are Ushiromiya George!!@k @v05/61000017.How could you be so rash now, when you might even be selected as Grandfather''s successor?!!@k @v05/61000018.Why didn''t you consult me...?!!"'
43666: 'George@r@v07/60300261."I''m consulting you right now.@k@v07/60300262. No, not consulting, I suppose.@k@v07/60300263. I''m just informing you.@k@|@y@v07/60300264. ......I''ve never pinned my hopes on being selected as Grandfather''s successor.@k@v07/60300265. In fact, I''d rather refuse if it did come to that.@k@v07/60300266. I want to build up my own country and castle from scratch, just like Father did."'
43667: 'Eva@r@v05/61000019."L-look...!!@k @v05/61000020.Do you realize how hard your father worked to get where he is?!@k @v05/61000021.That''s not something you could duplicate just by imitating him!!@k @v05/61000022.Do you have any idea how often he was saved by luck and coincidence?!!"'
43668: 'George@r@v07/60300267."And he got through it because he had you, his wonderful life partner, by his side.@k@v07/60300268. Sayo is the kind of person who''ll support me and transform me into an even stronger man.@k@v07/60300269. ......You''ve praised me for becoming the adult that I am, but that could never have happened without her."'
43669: 'Eva@r@v05/61000023."Huh...?!!!@k@v05/61000024. Listen, George!@k @v05/61000025.Just let your mother handle this for now.@k@v05/61000026. Cool your head and think very carefully!@k @v05/61000027.Shannon-chan isn''t the only person interested in you, you know...?!@k @v05/61000028.The girl you had that marriage meeting with, Ayumi-san, really took a liking to you!!"'
43670: 'George@r@v07/60300270."That''s the first I''ve heard of it."'
43671: 'Eva@r@v05/61000029."I thought you knew...!!@k @v05/61000030.Her parents were also very impressed by you!!@k @v05/61000031.If you really dream to build your own castle like your father, Ayumi-san is the one who''d really be able to help you, right?!@k @v05/61000032.Do you intend to betray her feelings?!"'
43672: 'George@r@v07/60300271."......There''s nothing to betray.@k@v07/60300272. There was never any special relationship between Ayumi-san and me.@k@v07/60300273. We just had a marriage meeting and our parents got all fired up afterwards.@k@v07/60300274. You made us go out together several times, but we never even looked each other in the eye."'
43673: 'Eva@r@v05/61000033."Ayumi-san is a well-bred, modest woman!!@k @v05/61000034.She just couldn''t look at you because you''re a man and it would be embarrassing and ill-mannered...!!@k @v05/61000035.If you can''t feel anything from her unless she looks at you when she talks, I''ll advise her of that.@k@v05/61000036. I''m sure she''ll look at you from now on...!!"'
43674: 'George@r@v07/60300275."You want me to marry Ayumi-san because it will benefit you.@k@v07/60300276. ......You aren''t pushing that engagement for the sake of anyone but yourself...!"'
43675: 'Eva@r@v05/61000037."George!!@k @v05/61000038.How can you say that?!!@k @v05/61000039.Have I ever failed to think about what''s best for you?!"'
43676: 'Eva@r@v05/61000040."I haven''t, have I?!@k @v05/61000041.How is the @bparent.@<親@> kanji written?!@k @v05/61000042.It''s @bstand.@<立@> on top of a @btree.@<木@> and @blook.@<見@>!"'
43677: 'Eva@r@v05/61000043."That''s what we''ve been doing, surveying your entire future from a height far greater than you have access to!!@k @v05/61000044.And from our vantage point, we can see that you''re letting your momentary youthful emotions lead you down the wrong path!!@k @v05/61000045.That''s why I''m saying what I am even though I know you''ll hate me for it!!"'
43678: 'Eva@r@v05/61000046."If I didn''t care for you, we wouldn''t be having this fight!@k @v05/61000047.I''d just tell you to marry whatever strange girl you like and leave you be...!"'
43679: 'Eva@r@v05/61000048."You hear me, George?@k @v05/61000049.Leave this to your mother.@k@v05/61000050. There''s no need for you to meet with Shannon-chan anymore.@k@v05/61000051. We''ll take care of everything for you."'
43680: 'Eva@r@v05/61000052."......Don''t worry, we won''t have Shannon-chan mistreated.@k@v05/61000053. After all, it''s thanks to her that you''ve grown so much, right...?@k @v05/61000054.We''ll take that into account.@k@v05/61000055. So leave the rest to us......@k@v05/61000056. George............"'
43681: 'George@r@v07/60300277."......................................."'
43682: '@rSometime during Eva''s rage, tears had started to drip from her eyes.'
43683: '@rAs though those tears had caused him to hesitate, ......George turned his back and sagged his shoulders...'
43684: '@rGeorge was, after all, only a child of man...'
43685: '@r......Though he understood that marriage required nothing more than the consent of both people,@k .........he couldn''t get over his desire for his parents'' acceptance...'
43686: '@rAnd so, he was torn between the tears of the mother who had always helped him and the fiancee he had chosen.........@k...@|@yor was he...?'
43687: 'George@r@v07/60300278.".........I think it''s......time.@k@v07/60300279. It''s time, now."'
43688: 'Eva@r@v05/61000057."Huh............?"'
43689: 'George@r@v07/60300280."All my life,@k@v07/60300281. you''ve done a great job raising me, and I''m truly grateful for that.@k@v07/60300282. When I have children and become a parent,@k@v07/60300283. ......I''ll become a parent like you.@k@v07/60300284. I''ll be the kind of parent most worthy of respect in the entire world, one who can truly fight for his children''s sake."'
43690: 'Eva@r@v05/61000058."George............"'
43691: '@rWith his back still towards her,@w500. ......George threw away his umbrella,@w500. ......and slowly stepped out from beneath the eaves into the rain.'
43692: '@rThen, ......he slowly turned around.'
43693: '@rIt was, without a doubt, the familiar face of Eva''s beloved son.'
43694: '@r......However, he stood there now as his own man,@k self-controlled and independent enough that the blood connection between them might even be forgotten.'
43695: 'George@r@v07/60300285."I think it''s about time, now."'
43696: 'Eva@r@v05/61000059."......For......what...?"'
43697: 'George@r@v07/60300286."For you to let go......@k@v07/60300287.of your son, Mother."'
43698: 'Eva@r@v05/61000060.".........Geo—"'
43699: 'George@r@v07/60300288."Let''s talk the rest of this out as people, not as mother and son.@k@|@y@v07/60300289. I am George.@k@v07/60300290. You are Eva.@k@v07/60300291. Let''s drop the "because I''m your parent" routine, speak for ourselves, and say what we really mean."'
43700: 'George@r@v07/60300292.".........The reason you want to choose the person I marry......is for financial reasons, public appearances,@k@v07/60300293. ......and so that you can posture in that still continuing quarrel between you and your siblings.@k@v07/60300294. ......You have no other reason."'
43701: 'Eva@r@v05/61000061."..........................."'
43702: 'George@r@v07/60300295."You''d do well to just come clean and admit it now.@k@v07/60300296. ......I''m going to start speaking on my own behalf.@k@v07/60300297. I suggest you do the same.@k@|@y@v07/60300298. ...............You''ll lose, I''m warning you."'
43703: '@rGeorge''s eyes...@w500....no longer contained any trace of his love and respect for his mother.'
43704: '@rThere was only a frigid glare as he gazed ruthlessly down at the witch who was trying to bind his future.'
43705: 'Eva@r@v05/61000062."......George,@v05/61000063. ......why...@v05/61000064....are you looking at your mother like that......?"'
43706: 'George@r@v07/60300299."Because I''m not looking at my mother right now.@k@|@y@v07/60300300. ......All I see is a wall, a trial standing in the way of the future I''m trying to grasp.@k@v07/60300301. ......You''re your own person too.@k@v07/60300302. I know that you have dreams and ambitions, and that you''re still chasing after those.@k@v07/60300303. And I think that''s a wonderful thing.@k@v07/60300304. ......We also know how hard it is for a person to chase their dreams without giving up."'
43707: '@rI need to inherit your wonderful strength.'
43708: '@rI''ve learned a lot from my parents, my friends, and Sayo...and I''ve grown.'
43709: 'George@r@v07/60300305."And that final, finished product,@v07/60300306. after everything I learned and acquired,@v07/60300307. ......is the real Ushiromiya George!@k @v07/60300308.Now I''ll overcome the final barrier—you!!"'
43710: 'Eva@r@v05/61000065."..................!!!"'
43711: 'George@r@v07/60300309.".........What...?"'
43712: '@rEva had disappeared.@k@rThe pouring rain landed evenly across the ground everywhere.'
43713: '@rNo, ......it was blocked very slightly in one place.@k@rHowever, there was no one there.'
43714: '@r......Standing on the ground isn''t the only way to block the path of the rain.'
43715: '@rThen,@w666. ...........could it be.........'
43716: 'George@r@v07/60300310."............!!"'
43717: 'EVA@r@v34/63300001."Alright then... Sometimes it''s good to be brutally honest!@k @|@y@v34/63300002.I''ll speak my mind.@k@v34/63300003. So why don''t you just lay it out there forever?!@k @|@y@v34/63300004.Ahhahahahahaahahah!!"'
43718: '@rIn the rain-filled sky, with the moon that shouldn''t have been visible behind her,@k ......was the Golden Witch of the future who had finally obtained everything of the Ushiromiya family.'
43719: '@rEven the drastic change in his mother''s appearance didn''t faze George.'
43720: '@rOn the contrary, he seemed to be moved by her boldness.'
43721: '@rBecause his mother had honestly and truly displayed...@w500....her true nature.'
43722: '@rNow, ......I can confidently show her...@kmy true self...'
43723: 'George@r@v07/60300311."Here we go, Mother.@k@v07/60300312. Here we go......Eva.@k@v07/60300313. This is my first step......towards escaping from your shackles...!"'
43724: 'EVA@r@v34/63300005."First steeeeeeep...?!?!"'
43725: '@rWith that first step, he felt something odd beneath his feet.'
43726: '@rHe knew that this sticky sensation, which didn''t quite feel like mud, represented his mother''s arrogance trying to prevent him from making that first step.'
43727: 'EVA@r@v34/63300006."I used to read to you all the time when you were little, didn''t I?@k @|@y@v34/63300007.Do you remember your favorite story, "Journey to the West"?"'
43728: 'George@r@v07/60300314.".........That takes me back.@k@v07/60300315. That''s probably the first fantasy I really loved."'
43729: '@rSun Wukong, the Monkey King, wanted to become a god and was tested by the Buddha.'
43730: '@rThe Buddha told him, "If you can jump free from the palm of my hand, I will grant you your wish."'
43731: '@rThen, Sun Wukong managed to reach what he thought was the end of the world, and found five pillars standing there......@konly to discover that they were the Buddha''s fingers, and that he still hadn''t left the Buddha''s hand.'
43732: 'George@r@v07/60300316."......Are you saying that''s what my first step is like...?"'
43733: 'EVA@r@v34/63300008."Ehhehehhahahahahaahahaha!!@|@y@k @v34/63300009.Your resistance, your conflict, your anguish and self-restraint and everything else!!@k @v34/63300010.All of it is a road I once traveled down...!@k @|@y@v34/63300011.This first step of yours would be overwhelmed by my life!!@k @v34/63300012.How long are you gonna turn a blind eye to it?@k @v34/63300013.Why not look?!@k @v34/63300014.At what you''re standing on!!!"@|@y'
43734: '@rOn the pitch-black earth soaked by the pounding rain...'
43735: '@r...there were what appeared to be...@w333.@|@y...ominously glowing bands of faint red, ......and George had placed his first step directly on top of one.'
43736: '@rIt was deep and viscous, and it held George''s foot in place.'
43737: '@rFrom Eva''s perspective as she looked down from the sky,@k ......it looked like a vast red spiderweb that radiated out with George at the center.'
43738: 'George@r@v07/60300317.".........That''s right.@k@v07/60300318. This is me.@k@v07/60300319. This is me, tied down by a life of constant instruction...@k@v07/60300320....and raised solely for the sake of your ambitions."'
43739: 'EVA@r@v34/63300015."No, you''re wrong about that.@k@v34/63300016. Let me make it so that you can understand.@k@v34/63300017. I''ll show you.@k@|@y@v34/63300018. And then, you''ll realize the truth forever!!@k @|@y@v34/63300019.Ahahahahahahyahhaaah!!!"'
43740: '@rThe vast, red spiderweb on the ground scooped up George as easily as scooping scum out of a pot.'
43741: '@rThen, it lifted him into the air like a deer caught in a net and swung him about.'
43742: '@rEVA''s insane laugh was as innocent as a grade schooler happily swinging about a bag filled with her gym clothes...@k...and cruel in equal measure.'
43743: 'George@r@v07/60300321."...Gah...............gwooh.........kkhh...!!"'
43744: 'EVA@r@v34/63300020."*giggle*giggle*!!@|@y@k @|@y@v34/63300021.Come on, try to remember, okay?@k @v34/63300022.What happened on Tuesdays...?!!"'
43745: 'George@r@v07/60300322."Gyahh!!@k @v07/60300323.Guh, ......gggh............@k@|@y@v07/60300324. ......Of course I remember.@k@v07/60300325. ......That was piano lessons.@k@v07/60300326. I still cringe whenever I hear "I Stepped on the Cat"."'
43746: 'EVA@r@v34/63300023."You did violin in kindergarten.@k@v34/63300024. That''s the sort of instrument you''d expect smart kids to play, right?@k @|@y@v34/63300025.But you didn''t seem to have the talent.@k@v34/63300026. So we switched you over to piano!!"'
43747: 'EVA@r@v34/63300027."Then, do you remember Wednesdays?!"'
43748: 'George@r@v07/60300327."I, .........I remember.@k@v07/60300328. That was the day for cram school.@k@v07/60300329. It was so far away, and a real pain to have to travel to..."'
43749: 'EVA@r@v34/63300028."And Thursdays?@k @|@y@v34/63300029.Ahhahahahahaahahahha!!!"'
43750: 'EVA@r@v34/63300030."Supplemental lessons.@k@|@y@v34/63300031. You were just terrible at subjects with memorization, weren''t you?@k @v34/63300032.You could apply your knowledge but were horrible at learning by rote, a classic "he can do it if he tries" kid!"'
43751: 'George@r@v07/60300330.".........That one stung.@k@v07/60300331. Those are the most annoying words a kid can hear at a parent-teacher conference."'
43752: 'EVA@r@v34/63300033."''You can lead a horse to water, but you can''t make it drink.''"'
43753: 'George@r@v07/60300332."That''s a British proverb, isn''t it?"'
43754: 'EVA@r@v34/63300034."Making you motivated and keeping you that way...@k@v34/63300035.was the hardest thing to doooooooooooooooooooooo!!!"'
43755: 'George@r@v07/60300333."Gah,@v07/60300334. ............gwah,@v07/60300335. gghhh...!!"'
43756: '@rGeorge was bound hand and foot by the bright red spiderweb, reduced to the witch''s plaything...'
43757: '@rShe would innocently swing him around, then smash him about, all with an insane laugh.@k Again and again.'
43758: 'EVA@r@v34/63300036."Do you remember Friday?!"@|@y'
43759: 'George@r@v07/60300336.".........Of course.@k@|@y@v07/60300337. As far as after-school lessons go, that one was pretty unique.@k@v07/60300338. Having a parent present while I studied was a trying experience in multiple ways."'
43760: 'EVA@r@v34/63300037."''Don''t buy your child a fishing rod; go fishing with him.''"'
43761: 'George@r@v07/60300339."You do like a British education, don''t you, Mother?@k@|@y@v07/60300340. .........Agh!!!"'
43762: 'EVA@r@v34/63300038."Those lessons were a pain for us parents too!!@v34/63300039. But for you, that was the most effective one!@|@y@v34/63300040. The monthly fee was high, and it was a pain to have to spend Friday nights there every week!!@v34/63300041. But it was the most effective!@|@y@v34/63300042. That''s when I realized!!@v34/63300043. Kids don''t grow unless their parents watch over them!!@|@y@v34/63300044. If children are sprouts, then parents are the sun!@v34/63300045. No plants will bud, and no flowers will bloom without the sun!!"@|@y'
43763: '@rStill bound hand and foot, George was thrown, slammed, and smashed.'
43764: '@rHe could do nothing...@k@rHe was still like Sun Wukong, unable to leave the palm of his mother''s hand.'
43765: '@rHowever, since he wouldn''t surrender, he could still show resistance at any time...'
43766: 'EVA@r@v34/63300046."Then what about Saturday?! What about Saturday?!"'
43767: 'George@r@v07/60300341."......That''s when the tutor came."'
43768: 'EVA@r@v34/63300047."He came to our house, which made it much easier, right?!"'
43769: 'George@r@v07/60300342."......It was painful to have to invite some other person into my own room, my sacred space, every single week.@k@v07/60300343. ......I hated the sweaty smell he left behind so much that I can still remember it."'
43770: 'EVA@r@v34/63300048."He was a wonderful teacher who drilled a scholarly attitude into you!@k @v34/63300049.His monthly fees were on par with a lawyer''s consultation fee, and it was well worth it!!"'
43771: 'George@r@v07/60300344.".........And then came Sunday, followed by Monday when I didn''t have any extra school—the only two days when I could have some rest.@k@|@y@v07/60300345. .........How ironic.@k@v07/60300346. So it was those extra classes from Tuesday until Saturday that were holding me down all this time.@k@v07/60300347. ......I really was just like Sun Wukong."'
43772: 'EVA@r@v34/63300050."*cackle*cackle*!!@|@y@k @v34/63300051.Yeah, if you think you can escape from the palm of my hand, you can have that arrogance crushed by the Buddha''s five mountains!!"'
43773: '@rSun Wukong, who wanted to become a god,@k was crushed by the five mountains of fire, water, wood, metal, and earth, and sealed away. These are the five elements that the days of the week, Tuesday through Saturday, are named after in Japanese.'
43774: '@rOnly now did George, who had always admired Sun Wukong, recognize this greatest of ironies.'
43775: 'EVA@r@v34/63300052."Just like Sun Wukong, you need some reflection and punishment for your arrogance.@k@v34/63300053. If you show that you''re willing to reform yourself, I''ll release you."'
43776: 'George@r@v07/60300348."That''s not being released, it''s brainwashing.@k@|@y@v07/60300349. ..................Ugh!!"'
43777: 'EVA@r@v34/63300054."There''s no need to think about anything!@k @v34/63300055.Why not just leave everything to Mama forever?!@k @v34/63300056.I''ll decide everything for you.@k@v34/63300057. That''s the best kind of life for you!!"'
43778: 'EVA@r@v34/63300058."I''ll arrange the most intellectual and selfless woman in the world for you!!@k @v34/63300059.I''ll prepare your every success and even pave the way there!!@k @|@y@v34/63300060.And eventually, you will be chosen for the highest honor in the Ushiromiya family, the position as successor to the head!!@k @v34/63300061.That''s when you can think about beginning life for yourself...!"'
43779: 'EVA@r@v34/63300062."A first step?@k @v34/63300063.Don''t make me laugh. You still haven''t even been born yet!!@k @v34/63300064.This isn''t my web that you''re caught in.@k@|@y@v34/63300065. ......You''re inside my caring, nurturing wooooomb!!!"'
43780: '@rGeorge was slammed against the ground over and over.'
43781: '@r......It was heartless cruelty unlike anything one would expect a blood-related son to receive.'
43782: '@rHowever, ......in Eva''s eyes,@k ......perhaps even this was a sign of love for her precious son...'
43783: '@rThe human-shaped lump of flesh ensnared in the red net was slammed over and over, then thrown high into the air,@k ......where it was caught by a massive spiderweb suspended in the sky.'
43784: '@rGeorge hung there pitifully as though crucified, still covered in fresh blood and not even twitching...'
43785: '@rEven if there had been some power to resist remaining to him,@k ......the red web holding him there would have held even that in check...'
43786: '@rThe rain, which had been falling non-stop since the beginning, quietly tormented and pitied him...'
43787: 'EVA@r@v34/63300067.".........Cool your head while you''re sealed by the five mountains.@k@v34/63300068. ......I''m not telling you to stop because I think Shannon-chan''s a bad kid, okay...?@k @v34/63300069.She''s a great girl, the one who gave you the chance you needed to grow up."'
43788: 'EVA@r@v34/63300070."......But an ill-considered engagement is a whole different matter.@k@v34/63300071. It isn''t because there''s a problem with her.@k@v34/63300072. Understand that..."'
43789: 'George@r@v07/60300350."......''Don''t criticize the friend.@k@v07/60300351. Criticize the behavior''...@v07/60300352.......right?@k@v07/60300353. ......That''s another piece of British advice."'
43790: 'EVA@r@v34/63300073.".........I really did raise you to be a smart kid.@k@v34/63300074. ......No, I still am raising you.@k@v34/63300075. .........Inside my belly, that is...@k @v34/63300076.You just need to be nurtured a little longer.@k@|@y@v34/63300077. Okay, that''s enough punishment, so apologize to your mother."'
43791: '@rThe spiderweb released George reluctantly.'
43792: '@rThen, it threw him to the ground beneath the cloudy sky...'
43793: 'George@r@v07/60300354."Thank you, .........Mother."'
43794: 'EVA@r@v34/63300078."........................"'
43795: '@rIt was all George could do to get up on his hands and knees.'
43796: '@r......Though he wiped the mud away and stood his ground, he still couldn''t raise his head...'
43797: 'George@r@v07/60300355.".........Everything you''ve done so far,@v07/60300356. ......you''ve done...@v07/60300357....for me, haven''t you......?@k@v07/60300358. ......Thank you...@v07/60300359. .........Thanks for everything......"'
43798: 'EVA@r@v34/63300079."That''s right.@k@v34/63300080. ......You must hate me right now.@k@v34/63300081. But one day, you''ll be grateful.@k@v34/63300082. I''m sure you''ll understand how much I loved you."'
43799: 'George@r@v07/60300360."All those restrictive extra classes from Tuesday to Saturday...@k@v07/60300361.......were your sincere efforts to raise me to be a great man......"'
43800: 'EVA@r@v34/63300083.".........That''s another British phrase.@k@v34/63300084. "To wrap a child in blessings is the greatest education of all.""'
43801: 'George@r@v07/60300362."...Thank you.@k@v07/60300363. ......I''ll give you a British saying in return."'
43802: 'EVA@r@v34/63300085."What''s that...?"'
43803: 'George@r@v07/60300364."''Take one chop at every tree,@k@v07/60300365. and none of them will fall.''"'
43804: 'EVA@r@v34/63300086.".........Hmm?@k@v34/63300087. ...And.........what does that mean......?"'
43805: 'George@r@v07/60300366."Maybe this one is clearer.@k@|@y@v07/60300367. ......''To spend too much time in studies is sloth.''@k@v07/60300368. .........Francis Bacon."'
43806: '@rThe man drenched in mud and fresh blood...@w500....straightened his crooked glasses,@w583. ......and slowly stood up.'
43807: '@rThough he was covered in filth, his appearance had a divine quality to it,@k ......something that could only appear on a self-controlled man, not one who had merely been dozing in his mother''s amniotic fluid.'
43808: 'George@r@v07/60300369."I cannot count the number of things I''ve learned from Sayo.@k@v07/60300370. ......She taught me...@k@v07/60300371.courage and chivalry, how to be ambitious and witty and humorous, and just a little stylish.@k@|@y@v07/60300372. It''s ironic.@k@v07/60300373. ......Almost all of the things you say are so wonderful about me...@k@v07/60300374....didn''t come from you at all."'
43809: 'EVA@r@v34/63300088."G-@v34/63300089..........George......@v34/63300090.......you''re.........still...@v34/63300091....going on about...?!!@k @v34/63300092.Time to get back in Mother''s womb!!@k @v34/63300093.I''ll nurture you in a sea of warmth once more!!!"'
43810: '@rAs EVA howled, another bright red spiderweb appeared at George''s feet and tried to scoop him up into the air again.'
43811: '@rHowever, that instant...'
43812: '@r...a powerful magic circle could be seen in the area surrounding George for just a moment.'
43813: '@rFaster than he could be scooped up by the spiderweb, George jumped,@k and with a sharp kick of the heel and a magnificent forward flip, ......he cut the shackles of that spiderweb apart.'
43814: 'EVA@r@v34/63300096."............Wha......?!?!"'
43815: '@rThat smooth movement proved that he had possessed the power to escape from those shackles all along.'
43816: '@rHe had willingly allowed himself to be bound by that web.'
43817: 'George@r@v07/60300375."......Everything I owe you for what you''ve done,@k@v07/60300376. ......I''ve paid back now with pain.@k@v07/60300377. ......Now I can finally leave the nest for good.@k@v07/60300378. It really is necessary, isn''t it?@k@v07/60300379. .........To have the occasional argument with one''s parents."'
43818: 'EVA@r@v34/63300097."George, ......wh-why would you disobey me so completely......for that stupid girl?!?!"'
43819: 'George@r@v07/60300380."It looks like it really is you...@k@v07/60300381.who needs to let go, Mother.@k@|@y@v07/60300382. ............So, if you''re ready...?"'
43820: 'EVA@r@v34/63300098."R-ready for what?!"'
43821: 'George@r@v07/60300383."''If you''re ready...@k@|@y@v07/60300384.may I fight back?''"'
43822: '@rThe curtain of spiderwebs that EVA shot out in defense were all too slow.'
43823: '@rGeorge weaved through them in that instant, and the next, he was right before her eyes...'
43824: 'EVA@r@v34/63300099.".........Ahh, aaaaaaaarrggghhh!!"'
43825: '@rEVA jumped out of the way of a kick that would have knocked her feet out from under her,@w666. ......then blocked the second half of George''s double roundhouse with a high kick of her own.'
43826: 'George@r@v07/60300385."I guess there is one extracurricular activity I can thank you for."'
43827: 'EVA@r@v34/63300100."O-...oh, and what day of the week was that......?!"'
43828: 'George@r@v07/60300386."It''s all the martial arts classes you made me attend whenever I had a long break from school...!"'
