42310: 'George@r@v07/60300043."......Erika-chan, huh.@k@v07/60300044. She''s an odd kid.@k@v07/60300045. ...Somehow, I just can''t seem to get along well with the young kids these days."'
42311: 'Shannon@r@v15/60500145."*giggle*.@k@v15/60500146. You''re still pretty young yourself, George-san."'
42312: 'George@r@v07/60300046."Hahaha...@k@v07/60300047. I guess it''s because I''ve always been the oldest of the cousins...@k@v07/60300048. It''s always made me feel like I''m not one of the young ones anymore."'
42313: '@rGeorge and Shannon could be seen surrounded by the rainy rose garden.@k@rThough the rain was still pouring down, there was hardly any wind at all.'
42314: '@rThe scant protection provided by the arbor was more than enough to house this secret meeting between lovers.'
42315: '@rFollowing that fight with Erika, the group had decided to play some cards for a change of pace.'
42316: '@rWhen that was over, Shannon returned to the servant room,@k .....and shortly after that, George left the room as well to meet Shannon here at the time they had arranged.'
42317: 'Shannon@r@v15/60500147."I think kids around Erika-san''s age have a really hard time accepting themselves."'
42318: 'George@r@v07/60300049."......Yeah, that''s true.@k@v07/60300050. Around that age, most kids are so determined to break out of the shell of childhood that they lash out in all directions with their beaks.@k@v07/60300051. Only once they manage to break through can they finally stretch their wings and fly high.@k@|@y@v07/60300052. ......I was like that too.@k@v07/60300053. When I was still inside that shell, I was a weak, deplorable man who didn''t deserve any respect."'
42319: 'Shannon@r@v15/60500148."Th-that''s not true..."'
42320: 'George@r@v07/60300054."No, it''s okay.@k@v07/60300055. I realize it myself.@k@v07/60300056. Back then, I might have been the oldest of the cousins, but I was still a lazy, hopeless man.@k@|@y@v07/60300057. ......And it wasn''t just with the cousins.@k@v07/60300058. At home, at school—I was like that everywhere."'
42321: '@r......I hated being like that.'
42322: '@rI wanted to break that shell and become a splendid adult like Mother and Father.'
42323: 'Shannon@r@v15/60500149."But in the end, ......you did break out of that shell, George-sama.@k@v15/60500150. ......Every time I''ve met you these past few years, you''ve grown beyond recognition."'
42324: 'George@r@v07/60300059."Thank you."'
42325: 'Shannon@r@v15/60500151."......Did something cause you to make up your mind?"'
42326: 'George@r@v07/60300060."To break out of my shell?"'
42327: 'Shannon@r@v15/60500152."Yes.@k@v15/60500153. ......I can''t imagine that you grew so rapidly, like a butterfly breaking out of its cocoon,@k@v15/60500154. by just wandering around aimlessly.@k@v15/60500155. ......I thought there must have been some turning point which made you become so determined."'
42328: 'George@r@v07/60300061."......I fell in love with you, and grew thanks to the power of love...is what I''ve told you so far.@k@v07/60300062. Haha, ......but the truth is, the turning point was a much more negative emotion."'
42329: 'Shannon@r@v15/60500156."No way......@k@v15/60500157. It''s hard to believe that someone who''s always as bright and cheerful as you could have negative emotions."'
42330: 'George@r@v07/60300063."Well,@k@v07/60300064. ......my parents taught me to treat girls well.@k@v07/60300065. And I thought that I had succeeded in living that way."'
42331: 'Shannon@r@v15/60500158."Yes.@k@v15/60500159. I think you''re a really wonderful gentleman..."'
42332: 'George@r@v07/60300066."But that was wrong."'
42333: 'Shannon@r@v15/60500160.".........?"'
42334: 'George@r@v07/60300067."I didn''t know how to interact with the opposite sex.@k@v07/60300068. I deified them excessively......and though I always behaved in a gentlemanly, ladies first kind of way,@k@v07/60300069. I was probably outright afraid of interacting with girls."'
42335: '@rOf course, George had wanted to be around girls as much as any boy might.'
42336: '@rHowever, he didn''t know how to interact with them.@k He wanted to act like a gentleman, avoid being disliked by them, and treat them with care.'
42337: '@rOf those feelings, only the words "treat girls well" took precedence,@k blossoming into a subconscious fear of women...'
42338: 'George@r@v07/60300070."You might call a man like that "gentlemanly" or "a late bloomer".@k@v07/60300071. .........Ridiculous.@k@v07/60300072. I was just a coward.@k@|@y@v07/60300073. Because of that, I started to wonder why I couldn''t get a lover if I was so gentlemanly,@k@v07/60300074. and I eventually came to the conclusion that all the women in the world had no taste, and started to hate all of them...stupidly.@k@v07/60300075. .........That''s what a truly pathetic man looks like."'
42339: '@rHow many years ago was it when I noticed?@k It started when I was in middle school.'
42340: '@rAt the time, I assumed that I was obviously the most gentlemanly of the cousins, so I would obviously be popular with women.'
42341: '@rHowever, reality was completely different.'
42342: '@rAt school, I was pretty much completely hopeless.'
42343: '@r......Far from being a leader, I was the bullied kid who got pushed around by everyone.'
42344: '@rAt the time, I figured I was just a capable and adaptable man, who could keep in perfect tune with his surroundings.@k ......How stupid.'
42345: '@rSure, I might have gained some measure of trust from girls.'
42346: '@r......However, not only was there no one who would become my girlfriend, I didn''t even know any girls I could call a friend.'
42347: 'George@r@v07/60300076."Of course.@k@v07/60300077. ......I was a man who always took a step back from girls, under the pretense of ladies first.@k@v07/60300078. Who would ever want to stand behind such a negative, unmotivated man?@k@v07/60300079. ...It''s funny.@k@v07/60300080. I didn''t even realize this, and thought I was a pretty attractive guy."'
42348: 'Shannon@r@v15/60500161.".........I can sort of understand how you felt.@k@v15/60500162. ...Just because someone puts in a lot of hard work to look attractive to the opposite sex,@k@v15/60500163. it doesn''t mean it will necessarily work out as they planned."'
42349: 'George@r@v07/60300081."Oh?@k@v07/60300082. ......Has that happened to you too, Shannon?"'
42350: 'Shannon@r@v15/60500164."Of course.@k@v15/60500165. ......One time, I wanted to catch a boy''s eye so much, I tried to put on makeup even though I didn''t know how and embarrassed myself...@k@|@y@v15/60500166. ......Eheheh, I remember a lot of embarrassing failures."'
42351: 'George@r@v07/60300083."The person that made me finally get over my conceit and open my eyes......was you, Shannon.@k@v07/60300084. ......No, it was all of you."'
42352: 'Shannon@r@v15/60500167.".........What was the turning point for you, George-san?"'
42353: 'George@r@v07/60300085."Haha,@v07/60300086. ......envy, probably."'
42354: 'Shannon@r@v15/60500168."That''s unexpected.@k@v15/60500169. ......But envy for what?"'
42355: 'George@r@v07/60300087."I saw you and Battler-kun having a really good time talking.@k@v07/60300088. ......That made me envious."'
42356: 'Shannon@r@v15/60500170."............Me and...Battler-sama?"'
42357: '@rShannon raced through her memories, trying to find a conversation that might have made George envious.'
42358: 'George@r@v07/60300089."Haha, it probably seemed trivial to you two.@k@v07/60300090. However, it still made me envious.@k@v07/60300091. ......I don''t want Battler-kun to hear what I say next, no matter what.@k@v07/60300092. Can you promise me?"'
42359: 'Shannon@r@v15/60500171."O-of course..."'
42360: 'George@r@v07/60300093.".....................@k@v07/60300094. ......It''s going to be a shameful confession.@k@v07/60300095. ...Still, I want you to hear it.@k@v07/60300096. I want to hear your answer tonight...only after I''ve told you about my bad sides as well."'
42361: 'Shannon@r@v15/60500172."............Okay.@k@v15/60500173. ......Let me hear it."'
42362: '@rWith a smile but a serious look in her eyes, Shannon nodded.'
42363: '@rTonight.@k ......She knew what he was going to ask her tonight.'
42364: '@rGeorge had the right to confess before asking that sacred question, and Shannon had the obligation to listen.'
42365: '@rShannon understood this, ......so she listened quietly.'
42366: 'Ange@r@v11/62000273."So this is what a Witch of Theatergoing peeps in on during her spare time?"'
42367: 'FEATHERINE@r@v50/65000207."......Stories of love are truly timeless.@k@v50/65000208. I never tire of them.@k@|@y@v50/65000209. ......However, I do find that maidenly expression of disgust on your face even more charming..."'
42368: '@rFEATHERINE laughed quietly.'
42369: '@rAnge huffed and looked away,@k but she quickly realized that this would only entertain FEATHERINE even more, so she tried to act unconcerned...'
42370: 'George@r@v07/60300097."Both Battler-kun and Jessica-chan have always been spirited.@k@|@y@v07/60300098. ......No, phrasing it that way is just dodging the point.@k@v07/60300099. ......Let me be frank."'
42371: '@rGeorge looked up at where the moon should be, high above the rain clouds...and spoke.'
42372: '@rThey were honest words, spoken from George''s meek heart...'
42373: 'George@r@v07/60300100."......For a long time back then,@k@v07/60300101. I thought of Battler-kun and Jessica-chan...@k@v07/60300102.as bad-mannered kids.@k@v07/60300103. ......No, let me be more direct.@k@v07/60300104. ......I thought that even the way they talked was vulgar.@k@v07/60300105. .........It''s true.@k@v07/60300106. I don''t mind if you hold me in contempt for that."'
42374: 'Shannon@r@v15/60500174."I don''t.@k@v15/60500175. ......People are allowed to think anything they want inside their hearts.@k@v15/60500176. In fact, I think you were all the more commendable for not letting it show on the outside."'
42375: 'George@r@v07/60300107."Thanks.@k@v07/60300108. .........I secretly looked down on those two.@k@v07/60300109. I was so conceited that I truly thought I was just overflowing with gentlemanly charm compared to them."'
42376: '@rI was at that age where having a girlfriend felt like a necessary condition for becoming a real man.'
42377: '@rI truly believed that no girl could fail to admire a gentleman who treated girls as well as I did.'
42378: '@rSo, I really did assume that the girls I knew were attracted to me.'
42379: 'George@r@v07/60300110."I thought that Battler-kun and Jessica-chan, who always joked around and spoke in a rude, vulgar fashion,@k@v07/60300111. would never be able to get a boyfriend or girlfriend.@k@v07/60300112. ......I might have used that argument to distract myself when I still couldn''t get a girlfriend."'
42380: 'George@r@v07/60300113."......I was a fool.@k@v07/60300114. They weren''t inferior to me at all.@k@v07/60300115. I was the inferior one, with my deification of the opposite sex and my fear, which I hid under the guise of "ladies first"."'
42381: 'FEATHERINE@r@v50/65000210."That''s been Battler''s and Jessica''s personality from the beginning.@k@v50/65000211. True, they were rude, and one couldn''t have called them gentlemanly or ladylike.@k@|@y@v50/65000212. ......However, they did have the power to interact without worrying about their sexes.@k@v50/65000213. ...In fact, you might even call that their charm."'
42382: 'Ange@r@v11/62000274.".........I sort of understand.@k@v11/62000275. People like Onii-chan and Jessica onee-chan can get along with anyone whether that person''s a boy or a girl.@k@|@y@v11/62000276. ......Apologies to George onii-chan, but...guys who try too hard to act like a "gentleman"...I find them a bit creepy.@k@v11/62000277. ......It''s like they have delusions about women or something..."'
42383: 'FEATHERINE@r@v50/65000214."People respect it when someone they are distant from is boring and harmless.@k@v50/65000215. However, they only like that person because he or she doesn''t get in their way.@k@v50/65000216. ......No human being would want to deepen their connection with a boring person."'
42384: 'Ange@r@v11/62000278."......Of course.@k@v11/62000279. No idiot would want to be friends with an unmoving, unspeaking telephone pole.@k@v11/62000280. ......However, unmoving and unspeaking is exactly what you''d want from a telephone pole."'
42385: 'FEATHERINE@r@v50/65000217."That''s it.@k@v50/65000218. It seems as though George finally discovered that he wouldn''t be viewed as an attractive man no matter how superior he was,@k@v50/65000219. and that he had been treated like a telephone pole the whole time..."'
42386: 'George@r@v07/60300116."Back then, my conceit was at its peak.@k@v07/60300117. ......So, when everyone gathered at the family conferences,@k@v07/60300118. I believed that I was the most attractive, and that all the servant girls who played with us were in love with me.@k@|@y@v07/60300119. .........And then the day came when I finally realized how pathetic I was."'
42387: 'Shannon@r@v15/60500177.".........Did I...say something inconsiderate then......?"'
42388: 'George@r@v07/60300120."No, it''s the opposite.@k@v07/60300121. .........You didn''t say anything at all.@k@v07/60300122. My conceited delusion that I was the only one ever reflected in your eyes...was crushed."'
42389: '@rJust when did it start?@k@r......No, it must have started long before then.'
42390: '@rI only failed to notice because my eyes were clouded with conceit.'
42391: 'George@r@v07/60300123."......One day, I suddenly realized it.@k@v07/60300124. ......You guys were getting along with Battler-kun and Jessica-chan far better than with me,@k@v07/60300125. ......playing around and having a good time."'
42392: '@r......Yes.@k Those two, whom I had looked down upon so much, were radiating far more charm than I was.'
42393: '@rYou really looked like you were enjoying yourself that day.'
42394: '@rThe look on your face was far brighter than any you ever showed me.'
42395: 'George@r@v07/60300126."Hahaha, sickening, isn''t it?@k@v07/60300127. ......I just assumed that you liked me,@k@v07/60300128. and even had some childish fantasy that we might end up dating."'
42396: 'George@r@v07/60300129."Based on nothing at all, I felt as though my girlfriend had been stolen from me and let myself feel hurt.@k@v07/60300130. .........Just how pathetic was I at that moment...@k@v07/60300131. ......When that happened, I finally realized how foolish I had been."'
42397: 'Shannon@r@v15/60500178.".........George-sama......"'
42398: 'George@r@v07/60300132."After that, stuff happened and Battler-kun stopped coming to the family conferences, but I heard about him from time to time from Uncle Rudolf.@k@|@y@v07/60300133. ......Uncle Rudolf cares more than he shows.@k@v07/60300134. Even though he gets in fights with Battler-kun all the time, ...he''s always paid close attention to his son''s goings-on."'
42399: 'Shannon@r@v15/60500179."......Yes.@k@v15/60500180. I''ve heard similar things.@k@|@y@v15/60500181. ......Even Asumu-sama despaired at how alike they were.@k@v15/60500182. ......She was sure that Rudolf-sama''s blood was to blame for all the trouble caused by Battler-sama''s popularity with the girls at school."'
42400: 'George@r@v07/60300135."And Jessica-chan too.@k@v07/60300136. I''d heard that she''d built up a huge number of friends, both boys and girls, and that she was always the center of attention.@k@v07/60300137. ......When I actually talked with her, I realized that this was no exaggeration."'
42401: '@rThat experience had......shown that the two I had looked down upon...@k...were much more attractive human beings than I was...'
42402: 'George@r@v07/60300138."At first, I tried to imitate those two.@k@v07/60300139. ......It was pretty ridiculous.@k@v07/60300140. I thought that by joking around and speaking rudely, I could get that same charm they had."'
42403: 'Shannon@r@v15/60500183."*giggle*.@k@v15/60500184. ......You did that?@k @v15/60500185.It''s a bit hard to picture."'
42404: 'George@r@v07/60300141."It was pathetic...@k@v07/60300142. I wish I could forget that time for the rest of my life.@k@v07/60300143. In any event, I quickly realized that I would never gain any true charm by imitating them like that."'
42405: 'George@r@v07/60300144.......I called it "respecting people",@k@v07/60300145. I called it "acting to fit in with the general atmosphere",@k@v07/60300146. .........but actually I was always just running away, and this cowardice was the reason for my lack of charm.'
42406: 'George@r@v07/60300147.I resolved myself to overcome that flaw and be reborn.@k@r@v07/60300148.......I finally understood the shell I was in, and I swore to break out of it.'
42407: 'George@r@v07/60300149.Every time my resilience began to waver, ......I would remember that day.@k@v07/60300150. ......That day I saw you all forget about me entirely and play around happily.@k@v07/60300151. And the fact that those eyes of yours, which I always assumed were attracted to me, never noticed me at all.'
42408: 'George@r@v07/60300152..........I made an oath.@k@v07/60300153. This time, I would really make you take notice of me, and I would be reflected in your eyes.@k@v07/60300154. ......The truth is...that was the very first emotion, the start of me falling in love with you.'
42409: 'Shannon@r@v15/60500186."...............It must have been...complicated."'
42410: 'George@r@v07/60300155."That day, I felt a desire for revenge against you all—no, against you specifically—for playing as a group and ignoring me.@k@v07/60300156. And before I knew it, that emotion had transformed into true love."'
42411: 'George@r@v07/60300157."......However, I swear this to God.@k@v07/60300158. Even though that was the reason I first started to take you seriously,@k@v07/60300159. ......there are no lies in the way I feel about you now."'
42412: 'George@r@v07/60300160."......I swear to love you for all my life.@k@v07/60300161. I will not lie about that for anyone or anything.@k@v07/60300162. And I am prepared to take you as my wife, even if it means having the entire world as my enemy."'
42413: 'Shannon@r@v15/60500187."......George...san......"'
42414: 'George@r@v07/60300163."That is the confession I wanted to make to you beforehand.@k@v07/60300164. ......Before now, I''ve called you my first love, love at first sight.@k@v07/60300165. ......That was a lie.@k@v07/60300166. ...It was only my selfish, twisted—"'
42415: 'Shannon@r@v15/60500188."That doesn''t matter."'
42416: '@rShannon smiled,@k ......but she spoke forcefully enough to interrupt George''s words.'
42417: 'Shannon@r@v15/60500189."Is there some rule saying that people can''t get together just because they weren''t each other''s first love...?@k @v15/60500190.Is it betrayal to forget the first person you fell in love with...?@k @v15/60500191.Love......isn''t that simple.@k@v15/60500192. Well, ......it might be simple.@k@v15/60500193. ......After all, love is easy.@k@v15/60500194. ......Always, whatever you feel now...@k@v15/60500195....only the honest feelings you feel now can tell you the right answer.@k@v15/60500196. So, things of the past or how our relationship started aren''t important at all."'
42418: 'George@r@v07/60300167."......Then, ...I confessed for nothing...?"'
42419: 'Shannon@r@v15/60500197."*giggle*, no.@k@v15/60500198. ......I''m a bit glad to learn that even George-san, who''s always perfect at everything, has a human side to him.@k@|@y@v15/60500199. ......And it makes me happy to know that I''m the only person you''ve told this to."'
42420: 'George@r@v07/60300168.".........Thank you.@k@v07/60300169. ...I was only able to become who I am because of you."'
42421: 'Shannon@r@v15/60500200."Me too.@k@v15/60500201. I am as I am because of you, George-san.@k@v15/60500202. ......So please, tell me without holding back.@k@v15/60500203. ......What kind of husband and wife will we be,@k@v15/60500204. ......and what kind of future will we build together?"'
42422: 'George@r@v07/60300170."When I have you as my wife,@k@v07/60300171. I will become an even more accomplished businessman than my father.@k@v07/60300172. ......And through all kinds of challenges and adventures, I hope to explore the limits of my potential.@k@v07/60300173. I want to reach that peak together with you.@k@v07/60300174. ......The view from there will be something no one can show you but me."'
42423: 'Shannon@r@v15/60500205."It sounds fun.@k@v15/60500206. ......I''ll be with you wherever you go."'
42424: 'George@r@v07/60300175."Of course, it won''t only be an adventure as a businessman.@k@v07/60300176. ...I''d like to create many things that only a couple can make."'
42425: 'Shannon@r@v15/60500207."*giggle*.@k@v15/60500208. ......And what could that be?"'
42426: 'George@r@v07/60300177."Let''s have some kids."'
42427: 'Shannon@r@v15/60500209."*giggle*.@k@v15/60500210. .........Yes, my husband."'
42428: 'George@r@v07/60300178."I''d like three of them at the least.@k@v07/60300179. At least one boy and one girl."'
42429: 'Shannon@r@v15/60500211."And what if all three are boys...?"'
42430: 'George@r@v07/60300180."Then the next one might be a girl.@k@v07/60300181. We can make a fourth one.@k@v07/60300182. ......It doesn''t matter how many.@k@v07/60300183. Let''s enjoy the adventure of bringing them up together.@k@v07/60300184. And when those children eventually leave their nest, they''ll make us some grandchildren.@k@v07/60300185. Before we know it, we''ll reach a boisterous old age surrounded by many children and grandchildren."'
42431: 'Shannon@r@v15/60500212."It sounds like fun.@k@v15/60500213. I wonder......what kind of a grandpa you''ll be."'
42432: 'George@r@v07/60300186."And I wonder what kind of a grandma you''ll be.@k@v07/60300187. However, I will always keep loving you.@k@v07/60300188. ......And when we eventually pass away, surrounded by our vast family, our lives will stretch behind us, unmatched by anyone else''s."'
42433: '@rGeorge didn''t just talk about his love in the present.'
42434: '@rHe swore to love her soul until the final moment...@kwhen the lids of their coffins would be shut.'
42435: '@rThen, George took a small box out of his pocket.@k@r......Even without opening it, she knew what was inside.'
42436: '@rHe took it out with a motion that was more natural even than the one he had practiced in the bathroom at the airport,@k and it was overflowing with charm.'
42437: 'George@r@v07/60300189."Sayo."'
42438: 'Shannon@r@v15/60500214."Yes."'
42439: 'George@r@v07/60300190."Let''s get married."'
42440: 'Shannon@r@v15/60500215."Yes."'
42441: 'George@r@v07/60300191."Please, take this ring and put it on your finger."'
42442: 'Shannon@r@v15/60500216.".........Yes, George-san."'
42443: '@rThat ring, which glistened divinely even in the dim light of the arbor,@k ......passed from George''s hand to Shannon''s finger.'
42444: '@rOf course, Shannon had already decided which finger to put it on.'
42445: 'George@r@v07/60300192."I swear to resolutely stand against any fate which may attempt to get in the way of our future."'
42446: '@rGeorge proclaimed that he would reveal their engagement to the entire family on the next day.'
42447: 'George@r@v07/60300193."My parents might criticize this marriage.@k@v07/60300194. ......However, I will not let them stop us.@k@v07/60300195. I am going to inform them of our engagement, not ask for their permission.@k@v07/60300196. If Mother says that she will not allow our marriage,@k@v07/60300197. I plan to have myself disinherited, and we will leave this family together."'
42448: 'George@r@v07/60300198."I have been prepared for that since long ago.@k@v07/60300199. ......I swear once again to resolutely stand against all fates that get in the way of our future."'
42449: '@r......George had said it aloud.'
42450: '@rSo, Shannon said the same thing.'
42451: 'Shannon@r@v15/60500200."Me too.@k@|@y@v15/60500218. ......I swear to stand against all fates that get in the way of our future."'
42452: 'Erika@r@v46/64500325."*giggle*giggle*.@k@v46/64500326. ......Battler-saaan, when will the crimes start?@k @v46/64500327.I''ve just about had enough of this love show."'
42453: 'Battler@r@v10/60100252.".....................@k@v10/60100253. ......Be quiet and watch."'
42454: 'Erika@r@v46/64500328."......Sure, fine.@k@v46/64500329. I''d hate to yawn and let some spectacular bit of foreshadowing slip by."'
42455: 'Battler@r@v10/60100254."............Do you have no love?"'
42456: 'Erika@r@v46/64500330."Are there any mysteries which accept love as proof?@k @v46/64500331.No, there aren''t."'
42457: '@rErika laughed coldly and stared down at the two on the game board.'
42458: '@rBattler watched her quietly.'
42459: '@r......Erika thought she felt a touch of pity in his gaze, and she averted her eyes uncomfortably.'
42460: 'Erika@r@v46/64500332."........................@k@v46/64500333. ...I do understand, more or less.@k@v46/64500334. Love can at least become a motive for murder.@k@v46/64500335. ......I can interpret this scene beneath the arbor to represent a possible motive for the crime if their engagement is somehow impeded."'
42461: 'Erika@r@v46/64500336.".........Then again, no matter how much people talk of love with words that aren''t red, it''s all just an illusion.@k@v46/64500337. *cackle*cackle*cackle*!"'
42462: 'Battler@r@v10/60100255.".........That''s very sad.@k@v10/60100256. ......You can''t even love anyone without proof given to you by a witch."'
42463: 'Erika@r@v46/64500338."Please put an end to this frivolous romance talk.@k@v46/64500339. I am your enemy, not some eccentric friend of yours content to engage with your ramblings about love."'
42464: 'Battler@r@v10/60100257."..........................."'
42465: 'Erika@r@v46/64500340."I can''t understand you at all anymore.@k@|@y@v46/64500341. ......What on Earth did you figure out?@k @v46/64500342.Weren''t you and Beato always insulting and trying to kill each other?"'
42466: 'Erika@r@v46/64500343."......What kind of truth could you have reached to make you change your emotions regarding her?@k@v46/64500344. ......Please don''t tell me that feelings of true love have sprouted from your murderous rivalry or something ridiculous like that."'
42467: 'Dlanor@r@v47/64600028."......Lady ERIKA.@k@v47/64600029. Let us have him continue the game''s PROGRESSION.@k@v47/64600030. Boring love scenes such as this are best finished QUICKLY."'
42468: 'Erika@r@v46/64500345."Ah, you''ve got a point there.@k@|@y@v46/64500346. Sorry for butting in.@k@v46/64500347. Come on, let''s move on."'
42469: 'Battler@r".............................."'
42470: 'Shannon@r@v15/60500219."......It''s Shannon.@k@v15/60500220. I''ve come back."'
42471: 'Genji@r@v14/61600029."Mm.@k@v14/61600030. ......The log for today hasn''t been filled out yet."'
42472: 'Shannon@r@v15/60500221."Yes.@k@v15/60500222. I''ll do that right away.@k@|@y@v15/60500223. ......Kanon-kun, thanks for keeping an eye out while I was gone."'
42473: 'Kanon@r@v16/60600148."........................@k@|@y@v16/60600149. ......That was a pretty long break."'
42474: '@rKanon had already noticed.@k ......There was a silvery glint coming from the ring finger on Shannon''s left hand.'
42475: 'Genji@r@v14/61600031."Then I will retire.@k@v14/61600032. ......Please do not hesitate to wake me if anything occurs."'
42476: '@r@v00/awase6005.""Goodnight, Genji-sama.""'
42477: '@rGenji disappeared off to the waiting room.'
42478: '@r......After that, only Shannon and Kanon remained.'
42479: 'Shannon@r@v15/60500225."......Thanks for giving me some time.@k@v15/60500226. I''ll be staying here, so you can take a break now if you want."'
42480: 'Kanon@r@v16/60600151."..............................@k@|@y@v16/60600152. ......In other words, it''s my turn now."'
42481: 'Shannon@r@v15/60500227.".........Yeah.@k@v15/60500228. ......Sorry, ......but we aren''t going to lose."'
42482: 'Kanon@r@v16/60600153."And I......won''t lose either......"'
42483: 'Shannon@r@v15/60500229."Even though you''ve always been a coward and let Milady take the lead until now...?"'
42484: 'Kanon@r@v16/60600154."............Wasn''t it you who taught me, Nee-san?"'
42485: 'Shannon@r@v15/60500230."What did I teach you...?"'
42486: 'Kanon@r@v16/60600155."The past is immaterial when it comes to love.@k@v16/60600156. The present is all that''s important.@k@v16/60600157. If that is true, then I think my present is in no way inferior to yours, Nee-san."'
42487: '@rShannon and Kanon glared at each other with serious eyes.@k@rThat period of tension vanished when Shannon chuckled.'
42488: 'Shannon@r@v15/60500231."......Yeah, that''s good.@k@v15/60500232. ......You and Milady have to give it your all.@k@v15/60500233. ......If you do end up together,@k@v15/60500234. ......make sure you build up a relationship wonderful enough that we can cheer you on with all our hearts."'
42489: 'Kanon@r@v16/60600158."Well, you do have a huge lead on me."'
42490: 'Shannon@r@v15/60500235."......Nothing to be done about that.@k@v15/60500236. That''s what you get for your cowardice before now."'
42491: 'Kanon@r@v16/60600159."I know.@k@v16/60600160. ......That is my...sin."'
42492: '@rShannon and Kanon fished around in their pockets, ......and drew out two small things that glittered gold.'
42493: '@rThey looked like......the left and right wings of a gold butterfly.'
42494: 'Shannon@r@v15/60500237."We are furniture.@k@v15/60500238. ......In order to become Human and receive the miracle that allows us to love, ......we must rely on a miracle of magic once again."'
42495: 'Kanon@r@v16/60600161."......To think that her brooch would prove useful."'
42496: 'Shannon@r@v15/60500239."It''s the only magic within our reach."'
42497: '@rIt was the golden butterfly brooch,@k which BEATRICE had once given to Shannon in the hopes of creating love between her and George.'
42498: '@rShannon had given it to Kanon, but he had let his emotions get ahold of him and had crushed it into pieces.'
42499: '@rSo, when the two wings they held were brought together, ......it would regain the form of a beautiful butterfly.'
42500: 'Kanon@r@v16/60600162."......Then I''ll be back soon.@k@v16/60600163. ......After all, they have asked me to play cards with them."'
42501: 'Shannon@r@v15/60500240."Yeah.@k@v15/60500241. Good luck.@k@v15/60500242. ......I''m sure Milady will be happy."'
42502: 'Kanon@r@v16/60600164."......It''s a bit embarrassing."'
42503: 'Shannon@r@v15/60500243."Enjoy it.@k@v15/60500244. That feeling."'
42504: '@rKanon left the servant room.@k ......He went to go see Jessica and tell her what he had determined to do.'
42505: '@rShannon quietly watched him go.'
42506: '@rThe fragment of the brooch and the engagement ring let off a gold and silver glint......'
42507: 'Elder BEATRICE@r@v60/60700253."That takes me back.@k@v60/60700254. That''s something I gave Shannon, if I recall.@k@v60/60700255. ......I always wondered where that disappeared to after Kanon stepped on it, but it seems they still had it all the time."'
42508: 'BEATRICE@r@v27/60700256."......That''s the golden butterfly brooch, isn''t it?@k@v27/60700257. ......I read about the magical brooch that can save a love relationship in FEATHERINE-san''s book."'
42509: '@rAnd that had been the first moment that BEATRICE, witch of the forest,@k had met with a human and given them her power.'
42510: '@rBit by bit, she had ascended from a mere ghost to the ruler of the mansion at night,@k ......and by making the servants believe in her, she had wiped away the anti-magic power.'
42511: '@rAnd then, ......it eventually became possible for her to appear openly in front of Shannon,@k whose magic resistance had grown particularly low and who had begun to believe in the existence of BEATRICE...'
42512: '@rTo Beato, who had been unable to interact with anyone for many years, this conversation with Shannon must have been especially fun...'
42513: 'Elder BEATRICE@r@v60/60700258."That''s why I generously gave her the butterfly brooch.@k@v60/60700259. ......*cackle*cackle*, I was in quite a good mood.@k@v60/60700260. ...It is no common thing for a heartless witch such as myself to be so gracious."'
42514: 'BEATRICE@r@v27/60700261."But it''s wonderful.@k@v27/60700262. You brought a pair of future lovers together."'
42515: 'Elder BEATRICE@r@v60/60700263."Of course, I did not do it to pamper them.@k@v60/60700264. ......It was in exchange for smashing that hateful spirit mirror that had repressed my magical powers.@k@v60/60700265. Thanks to that, I was able to regain much of my power all in one go."'
42516: 'Kumasawa@r@v18/61800048."But then, one night, purple lightning smashed the shrine.@k@v18/61800049. Those of the surrounding islands called it an evil omen.@k@|@y@v18/61800050. Oooh, now that I think of it, that must have been a prelude to BEATRICE-sama''s resurrection."'
42517: '@rKumasawa had the rest of the night off.'
42518: '@rSo, she had let Erika talk her into drinking a bit,@k and was chatting about the legend of Akujikijima and BEATRICE in a happy, tipsy mood.'
42519: '@rErika would nod from time to time, but she listened very closely.'
42520: '@rShe wasn''t actually taking notes, but she was gathering the information on the whiteboard inside her head.'
42521: '@r......Then, she frowned as though noticing something out of place and held up her hand.'
42522: 'Erika@r@v46/64500348."Wait a second."'
42523: 'Kumasawa@r@v18/61800051."Yes?"'
42524: 'Erika@r@v46/64500349."......That shrine was built by a traveling mountaineering ascetic to seal up the evil spirits of Akujikijima.@k@v46/64500350. Isn''t that right?"'
42525: 'Kumasawa@r@v18/61800052."Yes, that is correct.@k@v18/61800053. It was one who possessed a vast supernatural power, and who placed that power within the mirror—"'
42526: 'Erika@r@v46/64500351."And placed it within the shrine as a sacred mirror to seal the evil spirits.@k@|@y@v46/64500352. ......Something feels off about that.@k@v46/64500353. ......Why would a shrine to seal the evil spirits of Akujikijima also seal BEATRICE?"'
42527: 'Kumasawa@r@v18/61800054."W-......well...@k@v18/61800055. That''s, uh, because the power of the sacred mirror..."'
42528: 'Erika@r@v46/64500354."......I see.@k@v46/64500355. So it''s this really convenient sacred mirror that works on both evil spirits from the East and witches from the West.@k@|@y@v46/64500356. ......Got it.@k@v46/64500357. I''m still not satisfied, but I''ll back off there for now.@k@v46/64500358. What I don''t understand is why BEATRICE can''t stand spiderwebs."'
42529: '@rAccording to the legend, the evil spirits of Akujikijima despised spiderwebs,@k so they were apparently used as wards against evil on the islands around here.'
42530: '@rActually, spiders are a useful bug.@k@rThe farmers of the islands may well have treasured them.'
42531: '@rIt''s very possible that the farmers called them wards against evil, tying them to the stories about evil spirits,@k in order to create a tradition of people treating this useful bug with care through the generations...'
42532: 'Erika@r@v46/64500359."But that''s just the legend of Akujikijima.@k@v46/64500360. The origins for the legend of the witch BEATRICE came after Ushiromiya Kinzo moved to this island,@k@v46/64500361. when rumors sprouted about the mysterious legend of the gold and his mistress who gave it to him as a witch."'
42533: 'Erika@r@v46/64500362."In other words, the evil spirits of Akujikijima and the Golden Witch BEATRICE are completely different things.@k@v46/64500363. And yet, the same things are said about them."'
42534: 'Kumasawa@r@v18/61800056."W-......well now......"'
42535: '@rThe evil spirits of Akujikijima couldn''t stand spiderwebs.@k So neither could BEATRICE.@k@rThat sort of reasoning has been applied all over the place.'
42536: '@r......When it was pointed out that this was strange, Kumasawa was lost for an answer...'
42537: 'Erika@r@v46/64500364."The doorknob to Kinzo-san''s study has a scorpion magic circle drawn on it, which represents a charm against magic in Western sorcery.@k@v46/64500365. That''s why the Western witch BEATRICE can''t touch it.@k@v46/64500366. ......I can understand that part."'
42538: 'Erika@r@v46/64500367."But there''s no reason for BEATRICE to dislike spiderwebs.@k@v46/64500368. I don''t remember spiderwebs ever being included among things Western witches can''t stand.@k@v46/64500369. On the contrary, wouldn''t spiders be the friends and minions of a witch?"'
42539: 'Kumasawa@r@v18/61800057."W-......well......"'
42540: 'Erika@r@v46/64500370."In my opinion,@k@v46/64500371. ......these two legends about the evil spirits of Akujikijima and the witch BEATRICE...@k@v46/64500372.have become a little mixed together.@k@|@y@v46/64500373. In fact, maybe they''ve been fully joined together as one."'
42541: 'Erika@r@v46/64500374."......The legend of Akujikijima is a fairy tale created by fishermen fearful of reefs in the Rokkenjima area.@k@v46/64500375. However, there was no visual image to go along with those evil spirits.@k@v46/64500376. Were they people, or monsters, or ghosts without legs?@k@v46/64500377. There''s no mental picture of them.@k@v46/64500378. People are bad at imagining things without visuals.@k@v46/64500379. ......And then the legend of the witch called BEATRICE came in."'
42542: 'Erika@r@v46/64500380."A witch is a lot easier to picture than evil spirits.@k@v46/64500381. And on top of that, Kinzo-san had a portrait of BEATRICE drawn and displayed.@k@v46/64500382. In other words, the lack of a visual image, which was the one weak point in the legend of Akujikijima, was finally completed.@k@v46/64500383. Perhaps the two legends became mixed together at some point after that."'
42543: 'Kumasawa@r@v18/61800058."W-well, I wonder......@k@v18/61800059. ...H-......hohoho...@k@v18/61800060. It is a bit confusing for an old lady such as myself..."'
42544: '@rKumasawa laughed to smooth it over, wiping away a cold sweat...'
42545: '@rShe might have seemed confused, but she actually did understand what Erika was saying.'
42546: '@r......In truth, she did have a rough understanding of how the legend of Akujikijima, which had been around before Ushiromiya Kinzo had come to Rokkenjima,@k and the legend of the Golden Witch, the story of the woman who had given Kinzo a vast quantity of gold,@k ......had changed over time.'
42547: '@rShe didn''t want to admit it, ......but she knew.'
42548: '@rBEATRICE''s "backstory", that she hated the spirit mirror and spiderwebs...'
42549: '@r...had actually been based on the ancient legend of Akujikijima.'
42550: '@rThe "evil spirits" part of that legend had just been replaced by the witch of the portrait......'
42551: 'Erika@r@v46/64500384."......So,@k@v46/64500385. if there really was someone claiming to be the Golden Witch BEATRICE,@k@v46/64500386. I''d really like to ask her...@k@v46/64500387.whether she actually does hate spiderwebs or not.@k@v46/64500388. ......What happens when she touches them?"'
42552: 'Kumasawa@r@v18/61800061."I-it is said that witches and their minions...@v18/61800062.......receive burns when they touch spiderwebs...@v18/61800063....so that is probably what would happen, I would say..."'
42553: 'Erika@r@v46/64500389."Hmph, that''s not bad.@k@v46/64500390. A splendid witch trial.@k@v46/64500391. ......If the spiderweb touches her and she gets burned,@k@v46/64500392. then she''s an evil spirit, not a witch.@k@v46/64500393. ......And if nothing happens, then it proves she''s just a Human."'
42554: 'Erika@r@v46/64500394."In other words, .........whether she''s burned or not,@k@v46/64500395. it will prove that the Golden Witch doesn''t exist.@k@v46/64500396. ......The legend of the witch is nothing more than the legend of Akujikijima re-boiled with a new face on it."'
42555: 'Kumasawa@r@v18/61800064.".........W-.........well........."'
42556: 'Erika@r@v46/64500397."All it takes is the presence of a legend, and a deduction like this becomes trivial for Furudo Erika.@k@v46/64500398. Your thoughts, ladies and gentlemen......?"'
42557: '@rThough only the two of them were in the lounge,@k Erika faced in the direction an invisible audience would have been if there was one,@k and shrugged...'
42558: '@rAnd, to match Erika''s imagination,@k .........the two of them actually were there, listening in...'
42559: 'BEATRICE@r@v27/60700266.".........Spiderwebs...?@k @v27/60700267.They burn if you touch them......?"'
42560: 'Elder BEATRICE@r@v60/60700268."..........................."'
42561: '@rWhen Beato the Elder snapped her fingers,@k ......a graceful silver spider slipped down from the ceiling, hanging by a transparent thread.'
42562: '@rAfterwards, only a single silver strand remained.'
42563: 'BEATRICE@r@v27/60700269."..................Umm........."'
42564: '@rTimidly,@w500. ......Beato stretched her finger out towards the spider''s string...'
42565: '@rAnd she............touched it......'
42566: 'BEATRICE@r@v27/60700270.".....................@k@v27/60700271. ......I''m fine."'
42567: 'Elder BEATRICE@r@v60/60700272.".........You are?"'
42568: 'BEATRICE@r@v27/60700273."Huh......?"'
42569: '@rBeato the Elder lifted up a white, pale finger, and after showing it to her little sister,@k ......she traced the silver string with it.'
42570: '@r...There was a stench like a single hair being burnt.'
42571: '@rOnce again, she held her finger up in front of Beato, who was dumbfounded.'
42572: '@rThere was a thin burn line, as though someone had traced across it with a razor......'
42573: 'BEATRICE@r@v27/60700274."What......does this mean...?"'
42574: 'Elder BEATRICE@r@v60/60700275."That''s what I would like to know.@k@v60/60700276. Why are you unharmed?"'
42575: 'BEATRICE@r@v27/60700277."I, I don''t know.@k@v27/60700278. ......What I don''t understand is why you do get burnt by touching a spiderweb..."'
42576: 'Elder BEATRICE@r@v60/60700279."......I do not know.@k@v60/60700280. It has always been like that since I first gained consciousness."'
42577: 'BEATRICE@r@v27/60700281."Then, .........are you........."'
42578: '@rBeato hesitated.'
42579: '@r......However, her question was clear.'
42580: 'Elder BEATRICE@r@v60/60700282."No.@k@v60/60700283. I am not one of the evil spirits of Akujikijima.@k@v60/60700284. I am BEATRICE, ruler of Rokkenjima''s night.@k@|@y@v60/60700285. ......Even I do not know why I have the same weakness as this island''s evil spirits of old..."'
42581: 'BEATRICE@r@v27/60700286."Are spiderwebs the only things you can''t handle...?"'
42582: 'Elder BEATRICE@r@v60/60700287."As this Erika said, I can''t touch the doorknob to Kinzo''s study.@k@v60/60700288. That scorpion magic circle burns me.@k@v60/60700289. ......For me, trying to open the door to that study is like trying to pick a red-hot horseshoe out of a fire.@k@v60/60700290. .........What about you?"'
42583: 'BEATRICE@r@v27/60700291."Huh?@k @v27/60700292.Scorpion magic circles, you mean......?"'
42584: '@rThe older sister snapped her fingers again.'
42585: '@rWhen she did, the surrounding scene bent and twisted, and they had suddenly moved to the place in front of Kinzo''s study.'
42586: '@rAnd there......was the doorknob engraved with the scorpion magic circle.'
42587: 'Elder BEATRICE@r@v60/60700293."Those who research sorcery must have a refuge sealed off from both human and spiritual disturbances.@k@v60/60700294. ......It is no surprise that Kinzo chose to seal off his study and place a charm such as this here.@k@|@y@v60/60700295. ......And, unfortunately, that affects me as well, as I will show you..."'
42588: '@rShe gently grasped the doorknob.'
42589: '@rAs she did, a violent burning sound, unbelievably stronger than the one caused by the spiderweb, rang out.'
42590: 'BEATRICE@r@v27/60700296."O-Onee-sama, are you okay...?!@k @|@y@v27/60700297.Your hand......aaaaaaahhh...!!"'
42591: '@rHer hand......had been horribly burnt, and Beato couldn''t help but avert her eyes...'
42592: 'Elder BEATRICE@r@v60/60700298."Fear not.@k@v60/60700299. This scratch will heal quickly."'
42593: '@rApparently, it would heal by itself if left alone.@k@r......The older sister seemed to heal at an inhuman rate.'
42594: 'Elder BEATRICE@r@v60/60700300."However,@k@v60/60700301. ......it seems that you can handle it just fine."'
42595: 'BEATRICE@r@v27/60700302."..................G-@v27/60700303.......go."'
42596: '@rShe timidly poked the doorknob.@k ......Nothing happened.'
42597: '@rSlowly, ......she touched it with her entire palm, but she felt nothing but a pleasantly cool sensation.'
42598: 'Elder BEATRICE@r@v60/60700304."......Strange.@k@v60/60700305. ......Though you are my double, you are different from me in several ways."'
42599: 'BEATRICE@r@v27/60700306."While I might be able to touch the doorknob,@k@v27/60700307. ......if I ever get burnt like you did, I don''t think I would heal that easily..."'
42600: 'Elder BEATRICE@r@v60/60700308.".........It''s as though you''re a normal Human."'
42601: 'BEATRICE@r@v27/60700309."Y-yes.@k@v27/60700310. ......Even I find it a little hard to believe that I''m a witch...@k@v27/60700311. ......I can''t use magic like you, and I can''t get strange burns or heal from them later..."'
42602: 'BEATRICE@r@v27/60700312.".........Father believed...@v27/60700313....that I was a great witch reborn...@v27/60700314....but...@v27/60700315....I cannot believe that......"'
42603: 'Elder BEATRICE@r@v60/60700316."......Who are you?"'
42604: 'BEATRICE@r@v27/60700317."I, I am BEATRICE.@k@v27/60700318. ......I was born for Father''s sake.@k@v27/60700319. ......And you, Onee-sama?"'
42605: 'Elder BEATRICE@r@v60/60700320."I am also BEATRICE.@k@v60/60700321. I used magic to give Kinzo gold, and later became a soul and the formless witch that haunts this island."'
42606: 'BEATRICE@r@v27/60700322."..................Just who on Earth...@v27/60700323....are we......?"'
42607: 'Elder BEATRICE@r@v60/60700324."......Unlike me, it seems that you possess a body."'
42608: 'BEATRICE@r@v27/60700325."Huh?@k @v27/60700326.Really......?"'
42609: 'Elder BEATRICE@r@v60/60700327."Yes.@k@v60/60700328. ......It occurred to me while listening to that Erika person.@k@v60/60700329. ......I am a witch who can use magic but has no body,@k@v60/60700330. ......and you are a witch who has a body but can use no magic.@k@|@y@v60/60700331. .........Eventually, perhaps we will become one, each filling in what the other lacks, and become the true, complete BEATRICE."'
42610: 'BEATRICE@r@v27/60700332."................................."'
42611: '@rIt did seem plausible.'
42612: '@rBoth of the BEATRICEs were missing something.'
42613: '@rIf they were to become one, then surely they would be very close to the BEATRICE that Battler desired...'
42614: 'Elder BEATRICE@r@v60/60700333."......Do you want...to try?"'
42615: 'BEATRICE@r@v27/60700334."............Huh...?"'
42616: 'Elder BEATRICE@r@v60/60700335."Hold out your hand."'
42617: '@rThe older sister slowly raised her palm and held it out before Beato.'
42618: '@rThe large burn from a second ago really had started to heal already...'
42619: 'Elder BEATRICE@r@v60/60700336."It may be possible for us to become one.@k@v60/60700337. I want to know as well.@k@v60/60700338. By becoming one with you, ......I want to learn about my future self."'
42620: 'BEATRICE@r@v27/60700339.".............................."'
42621: '@rBeato also raised her hand slowly,@k .........and the two hands...@w583....touched......'
42622: '@r..............................'
42623: '@r......But nothing happened.'
