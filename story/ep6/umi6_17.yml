47506: '@rThe bullets......promised certain death no matter where on the body they hit.'
47507: '@rThis duel would not end...@w583....until one of them died......'
47508: 'George@r@v07/60300490.".............................."'
47509: 'Jessica@r@v04/60200035_o."..........................."'
47510: '@rGeorge and Jessica......just quietly watched the ones they loved...'
47511: '@rThey had already entrusted all of their thoughts to them...and their fates.'
47512: '@rJust watching over their partners...was now the only way they could show their trust.'
47513: 'Shannon@r@v15/60500336."..........................."'
47514: 'Kanon@r@v16/60600363."..........................."'
47515: '@rShannon and Kanon......stood quietly, with their backs turned.'
47516: '@rThey had already put the emotions of the many days they had spent together behind them.'
47517: '@rThe next time they laid eyes on each other,@k@r......nothing would be asked of them except pulling that trigger.'
47518: '@rThe only one who still had no determination or resolution with regard to this duel...@k...was Beato.'
47519: '@rThe closer that moment came, ......the less she understood.'
47520: '@rThe love between George and Shannon wasn''t standing in the way of the love between Jessica and Kanon or vice versa.'
47521: '@r......Why, when both sides could find happiness, ......were they forced to kill each other...?'
47522: 'BEATRICE@r@v27/60700969."......I don''t understand.@k@v27/60700970. ......I just can''t.........understand...!"'
47523: 'Elder BEATRICE@r@v60/60700971.".........Little sister...@k@v60/60700972. We are not permitted to do anything but watch..."'
47524: 'BEATRICE@r@v27/60700973."Zepar-san, Furfur-san...!@k @v27/60700974.Why......why this duel?!@k @v27/60700975.This is no trial of love!@k @v27/60700976.You really are demons!@k @v27/60700977.You just want to enjoy watching one of the pairs fall apart...!!"'
47525: 'Zepar@r@v51/65100207."Quiet."'
47526: 'Furfur@r@v52/65200195."You''ll get in the way of the lovers."'
47527: 'BEATRICE@r@v27/60700978."You''re the ones getting in their way!!@k @v27/60700979.One will fall!@k @v27/60700980.The one who loves that person will grieve!!@k @v27/60700981.If only you two weren''t around, no one would be sad!!"'
47528: '@r@v00/awase6068.""That is not true.""'
47529: 'Zepar@r@v51/65100209."If we hadn''t set up this duel—"'
47530: 'Furfur@r@v52/65200197."Then both pairs would have fallen apart.@k@v52/65200198. This duel is necessary."'
47531: 'BEATRICE@r@v27/60700982."I......haven''t been able to accept that since the beginning...!!@k @v27/60700983.Do you think love can''t succeed without a miracle of magic?!@k @v27/60700984.The only thing needed for love......is two who love each other, isn''t it?!@k @v27/60700985.This duel is meaningless!!"'
47532: 'BEATRICE@r@v27/60700986."So stop it, you two!!@k @v27/60700987.Shannon and Kanon both!!@k @v27/60700988.Why do you have to fight each other to the death, when you were once as close as true siblings?!@k @v27/60700989.I just can''t.........understand!!!"'
47533: '@rEveryone should have been able to hear Beato''s yell.@k@r......However, no one''s expression changed.'
47534: 'Zepar@r@v51/65100210."......That''s right.@k@v51/65100211. I''m impressed that you noticed."'
47535: 'Furfur@r@v52/65200199."That is the truth of love."'
47536: 'BEATRICE@r@v27/60700990.".........What is...?!!"'
47537: 'Zepar@r@v51/65100212."Love needs nothing more than two people who love one another."'
47538: 'Furfur@r@v52/65200200."Therefore, when there are not "two people",@k@v52/65200201. ......we must use a duel to make that number become "two"."'
47539: 'BEATRICE@r@v27/60700991."I could understand if it were a duel between two people fighting over one woman!@k @v27/60700992.If it were a duel to reduce the awkward shape of a love triangle down to a pair...!!@k @|@y@v27/60700993.But they are two and two!!@k @v27/60700994.The world formed by each pair is complete, isn''t it?!!@k @v27/60700995.There''s nothing compelling them to fight!!"'
47540: 'Zepar@r@v51/65100213."The minimum number of people that can create a world is two."'
47541: 'Furfur@r@v52/65200202."Only when two people are together can a world be born and love fulfilled."'
47542: 'Zepar@r@v51/65100214."That is why this duel is necessary."'
47543: 'Furfur@r@v52/65200203."So that they can reach that number of people."'
47544: 'BEATRICE@r@v27/60700996."A-......are you saying that furniture is less than Human, and doesn''t count as a whole person...?!"'
47545: '@r@v00/awase6069.""Correct.@k@v00/awase6070. Furniture is less than Human.@k@v00/awase6071_o. So furniture and Human cannot add up to two.""'
47546: 'BEATRICE@r@v27/60700997."That''s insane!@k @v27/60700998.If two people love each other, their circumstances don''t matter!!"'
47547: '@r@v00/awase6072.""Oh, yes they do!!""'
47548: 'Zepar@r@v51/65100219."Do you really think that the circumstances of two in love don''t matter?!"'
47549: 'Furfur@r@v52/65200208."Is it permissible to fall in love with a man who has a wife?@k @v52/65200209.Is it permissible to fall in love with a woman who has a husband?"'
47550: 'Zepar@r@v51/65100220."Is it permissible to fall in love with your parents?@k @v51/65100221.Is it permissible to fall in love with your children?@k @v51/65100222.There are many situations where circumstances forbid romantic love!!"'
47551: 'BEATRICE@r@v27/60700999."Th-then just what is furniture?!!@k @v27/60701000.Why mustn''t furniture fall in love?!!!"'
47552: '@r@v00/awase6073.""Because their soul amounts to less than a full person!""'
47553: 'Zepar@r@v51/65100224."Shannon, Kanon, and the piece that you are as well!!"'
47554: 'Furfur@r@v52/65200211."All of you are furniture!@k @v52/65200212.Subhuman beings who do not possess a full person''s soul!!"'
47555: 'Zepar@r@v51/65100225."There is only one thing necessary to love a human!@k @v51/65100226.That is the possession of a full person''s soul!!@k @v51/65100227.That''s why a pair in love can create a world!!"'
47556: 'Furfur@r@v52/65200213."For example, do you think a man with a wife has the right to love another woman?"'
47557: 'Elder BEATRICE@r@v60/60701001.".........Of course not.@k@v60/60701002. If he loved two women, neither would get a full person''s worth of love.@k@v60/60701003. ......A man such as that would not be qualified to love."'
47558: 'Furfur@r@v52/65200214."See?@k @v52/65200215.There are plenty of people in plenty of circumstances who have no right to love another!!@k @|@y@v52/65200216.As long as both people feel love, nothing else matters?@k @v52/65200217.That is a comforting lie of naive love!!"'
47559: 'Zepar@r@v51/65100228."We cannot forgive humans who falsely pretend that they have the right to love!!@k @v51/65100229.We cannot permit the love of sub-Human beings, of those who do not make up the minimum number of people to create a world!!"'
47560: '@r@v00/awase6074_o.""That is the purpose of our trial...!!@k @v00/awase6075.To allow sinful souls to regain the soul of a whole person and become capable of true love!!""'
47561: 'Shannon@r@v15/60500337."......Zepar-sama, Furfur-sama."'
47562: 'Kanon@r@v16/60600364."Our hearts......are ready."'
47563: '@r@v00/awase6076.""Please, give the signal to start the duel.""'
47564: '@rThe pair bidding farewell quietly asked for the signal to be given.'
