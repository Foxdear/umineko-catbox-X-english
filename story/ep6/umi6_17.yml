47584: 'George@r@v07/60300494."That''s not it.@k@v07/60300495. ......If one side misses, the other can corner them at their leisure and shoot.@k@v07/60300496. ......Miss with that first bullet, ......and there''s almost no chance of winning."'
47585: 'Kanon@r@v16/60600367."However, if you take too long, you''ll lose before you can even pull the trigger."'
