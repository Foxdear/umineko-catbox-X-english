47502: '@rA desolate wind blew through the golden rose garden......'
47503: '@rShannon and Kanon had already finished walking 19 steps, and their backs still faced each other.'
47504: '@r......At the signal of the demons responsible for this trial, they would both turn.........and settle this.'
