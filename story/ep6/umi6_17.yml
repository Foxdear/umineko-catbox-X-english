47587: 'Zepar@r@v51/65100240."That is a good mindset, you two.@k@|@y@v51/65100241. .........Now, ............here we go."'
47588: 'Zepar@r@v51/65100242."One."'
47589: 'Furfur@r@v52/65200227."Two."'
