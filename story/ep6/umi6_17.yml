47569: 'Furfur@r@v52/65200221."No, this isn''t a duel to see who falls apart.@k@v52/65200222. ......This is a duel to make true love succeed."'
47570: 'BEATRICE@r@v27/60701005."......I......don''t understand......what you two are saying...!"'
47571: 'Furfur@r@v52/65200223."No, you must understand.@k@v52/65200224. This moment.........marks the birth of a Human who is truly capable of loving another person."'
47572: 'BEATRICE@r@v27/60701006."I don''t......understand.........!!!"'
47573: 'Furfur@r@v52/65200225."No matter which of them wins, ......please congratulate them.@k@v52/65200226. ......This is the moment......when their days as furniture......come to an end."'
47574: 'Zepar@r@v51/65100232."The signal is simple.@k@v51/65100233. ......I will count to three.@k@v51/65100234. When I reach three, the duel will commence."'
47575: 'Kanon@r@v16/60600366."Understood."'
47576: 'Shannon@r@v15/60500339."......Same here."'
47577: 'Zepar@r@v51/65100235."If both of you miss, the duel will be temporarily suspended.@k@v51/65100236. You will be given bullets again and will start over from the beginning, with your backs to each other."'
47578: 'Jessica@r@v04/60200406.".........I guess it''ll repeat until it''s all settled..."'
47579: 'George@r@v07/60300491."Zepar.@k@v07/60300492. Have you seen this sort of duel......many times before?"'
