40838: '@rAt one time, only Beato and her fellow witches had gathered in this smoking room to chat.'
40839: '@rNow, however, an unusually large number of people were present.'
40840: 'LAMBDADELTA@r@v29/62200003."Ehheheheheh.@k@v29/62200004. I wonder what kind of game Battler''s going to show us."'
40841: 'BERNKASTEL@r@v28/62100016."......I don''t care what...@k@v28/62100017.as long as it''s fun enough to relieve my boredom as I crush it."'
40842: 'Erika@r@v46/64500028."Leave everything to me, my master!@k @v46/64500029.I will perform to my fullest and give you the results you desire!"'
40843: 'BERNKASTEL@r@v28/62100018."Yeah, you''d better.@k@v28/62100019. ......I kept making strange faces all the time last game thanks to you...@k@|@y@v28/62100020. Thought I might start getting wrinkles."'
40844: 'Erika@r@v46/64500030."Th-there''s no need to worry.@k@v46/64500031. The beauty of your face is without peer, no matter how wrinkly it may get."'
40845: 'BERNKASTEL@r@v28/62100021."........................!!!"'
40846: 'LAMBDADELTA@r@v29/62200005."Eheheheh!@k @v29/62200006.It''s rare to see Bern in such high spirits.@k@v29/62200007. Beato''s game board really is something else."'
40847: 'Dlanor@r@v47/64600001."......How sad it is that the master of this game board is no longer with US."'
40848: 'LAMBDADELTA@r@v29/62200008."A tiger dies and leaves behind its hide.@k@v29/62200009. Looks like Beato has died and left behind her game."'
40849: 'BERNKASTEL@r@v28/62100022."Even though chess still exists, no one knows the name of the person who invented it."'
40850: 'LAMBDADELTA@r@v29/62200010."Oh, you''re right!@k @|@y@v29/62200011.Kyahahaha, poor game creato~rs!"'
40851: 'Erika@r@v46/64500032."Come to think of it, Battler-san is really keeping us waiting, isn''t he?@k@v46/64500033. Is he still setting up the sixth game?"'
40852: 'Dlanor@r@v47/64600002."......Gertrude.@k@v47/64600003. How are Lord BATTLER''s preparations PROGRESSING?"'
40853: 'Gertrude@r@v48/64800001."For your attention: I beg to inform you of the following.@k@v48/64800002. ......Know that he will be finished very soon."'
40854: 'Erika@r@v46/64500034."He must have a lot of confidence in what he''s creating to keep us waiting this long.@k@v46/64500035. ......He really humiliated me in front of my master last time.@k@v46/64500036. I''ll defeat him no matter what it takes...!@k @|@y@v46/64500037.And you in particular! Make sure you don''t screw up again...!"'
40855: 'Cornelia@r@v49/64700001."......I will meet the challenge with all of my strength."'
40856: '@rThe previous Game Master, LAMBDADELTA,@k had confirmed that Battler understood everything about Beato''s game.'
40857: '@rHowever, in order to prove it,@k Battler would have to run this game by himself and carry it through to completion.'
40858: '@rIn other words, if Erika could crush this game of Battler''s,@k she would, in effect, wipe away the dishonor of that last game.'
40859: '@rThough Erika was chomping at the bit to get started,@k it was taking Battler quite some time to show himself.'
40860: '@rThen, a swarm of gold butterflies swelled out of nothing and formed a human shape.'
40861: '@rFrom the shape of that familiar dress, everyone immediately realized who it was.'
40862: 'Erika@r@v46/64500038."Ah, look, it''s BEATRICE-san.@k@v46/64500039. And I thought you''d died and disappeared last time."'
40863: 'BERNKASTEL@r@v28/62100023."......Beato the player is the one who disappeared.@k@v28/62100024. This is probably just a piece...Battler''s piece."'
40864: 'Dlanor@r@v47/64600004."Even if she is a piece, it does not change the fact that it is HER."'
40865: '@rBEATRICE gave an elegant curtsy as she appeared.'
40866: '@rThis humble entrance was so vastly different from her usual high-pitched laugh...@kthat it created a sense of tension as they waited for the start of the sixth game to be announced at last...'
40867: 'BEATRICE@r@v27/60700001."Father will be here very soon.@k@v27/60700002. I ask that you wait for just a short while longer......"'
40868: 'LAMBDADELTA@r"...............@k@v29/62200013. ...Aha.@k@|@y@v29/62200014. Father? What''s that?@k@v29/62200015. This game''s new twist on things?"'
40869: '@rNot only had Beato started talking in an unusually polite manner,@k she had also used the word "Father"...probably referring to Battler.'
40870: '@rFor an instant, everyone was stunned into silence,@k but they quickly realized that this was part of something bigger, and they grinned.'
40871: '@rBeato wasn''t the type who could keep up this kind of act for long.'
40872: '@rIt would probably fall apart in a few seconds, leaving her laughing and cackling rudely at everyone.'
40873: '@rErika, who was itching for a fight, went for Beato almost at once.'
40874: 'Erika@r@v46/64500040."I never expected that incompetent Battler-san...@k@v46/64500041.to reach the truth of your game."'
40875: 'BEATRICE@r@v27/60700003."......It must be Father''s talent that led him to his profound understanding.@k@v27/60700004. He really is clever."'
40876: 'Erika@r@v46/64500042."...............@k@|@y@v46/64500043. You''re pretty lucky, aren''t you?@k@v46/64500044. If Battler hadn''t become the Game Master, you would never have revived again.@k@v46/64500045. You certainly have the luck of the devil."'
40877: 'BEATRICE@r@v27/60700005."......The devil?"'
40878: 'Erika@r@v46/64500046."In any case,@k@v46/64500047. I''m going to pay you back in full for last time.@k@|@y@v46/64500048. You''re just one of Battler''s delusions, fantasies... I''ll erase every part of you and knock you down into the abyss of oblivion."'
40879: 'BEATRICE@r@v27/60700006."Well, I also intend to hold my own.@k@|@y@v27/60700007. ......I, um, look forward to having a good, clean fight."'
40880: 'Erika@r@v46/64500049."...........................???"'
40881: '@rBy this point, everyone realized that something weird was going on.'
40882: '@rThere was no doubt that the face, the dress, and the hair were all BEATRICE''s.'
40883: '@r......However, ......her expression was different.'
40884: '@rEven though she had Beato''s face, Beato would never show anyone an expression like that.'
40885: 'BERNKASTEL@r@v28/62100025."....................."'
40886: 'LAMBDADELTA@r@v29/62200016."......Just who...are you?"'
40887: '@rThere was a heavy silence.'
40888: '@r......LAMBDADELTA spoke for everyone there.'
40889: '@rAt first, Beato wore a smiling yet confused expression.@k ......However, when she realized that the mood had gone suddenly stiff, her expression finally darkened, and she hung her head.'
40890: 'Erika@r@v46/64500050."Who......are you?"'
40891: 'Dlanor@r@v47/64600005."......You appear to be Lady BEATRICE...@v47/64600006....but is that TRUE...?"'
40892: '@rEven Dlanor was forced to ask despite the rudeness of the question.'
40893: '@rThat was how much...@w416.this woman...@w333.who appeared to be Beato...@w500.was not.'
40894: 'BEATRICE@r@v27/60700008.".........Am I somehow different from the BEATRICE...@k@v27/60700009....that all of you were expecting?"'
40895: 'LAMBDADELTA@r@v29/62200017."What......are you talking about?"'
40896: 'Erika@r@v46/64500051."Wait a second,@k@v46/64500052. don''t tell me you have amnesia or something...?"'
40897: 'BEATRICE@r@v27/60700010."I, ...I was only born recently, so I have no memories at all.@k@v27/60700011. ......B-but I...!@k@v27/60700012. I''m studying hard...in order to become the BEATRICE you all expect—"'
40898: 'Battler@r@v10/60100008."Beato.@k@v10/60100009. ......I thought I told you to stay in your room."'
40899: '@rBattler''s voice came out of nowhere.'
40900: '@r......His tone was very slightly cold.@k@rBeato''s expression looked like that of a young girl being scolded.'
40901: '@rWith a swirl of gold butterflies,@k ......Battler appeared.'
40902: '@rHis dignified bearing and appearance were fitting for the ruler of this game.'
40903: '@r......However, his expression was gloomy...@kand his gaze was directed at Beato.'
40904: 'Battler@r@v10/60100010."......Go back to your room.@k@v10/60100011. You aren''t supposed to be here."'
40905: 'BEATRICE@r@v27/60700013."I, ...I just wanted to help you however I could, Father......"'
40906: 'Battler@r@v10/60100012."Go. To your room."'
40907: '@rHe spoke both softly and forcefully.@k Battler didn''t leave her any room for debate.'
40908: '@rBeato hung her head and curtsied as she prepared to leave the room...'
40909: 'Battler@r@v10/60100013."Also."'
40910: 'BEATRICE@r@v27/60700014."Y-yes, what is it, Father?"'
40911: 'Battler@r@v10/60100014."......My name is Battler.@k@v10/60100015. ...Never call me by another name again."'
40912: 'BEATRICE@r@v27/60700015."...Y-@v27/60700016..........yes."'
40913: '@rBeato melted into a swarm of butterflies and disappeared.'
40914: '@rThis was the first part of the tale with Battler as the Game Master.'
40915: '@rThe witches had all expected him to come forward with some flashy, big developments, ...so they were all fairly confused.'
40916: '@r......Their mouths were still hanging open.'
40917: 'BERNKASTEL@r@v28/62100026."......This is an unusual approach."'
40918: 'Battler@r@v10/60100016."Pardon me.@k@v10/60100017. ......Please forget what you saw just now."'
40919: 'Erika@r@v46/64500053."Hmph, so, are you trying to trick us with this?@k @v46/64500054.You''re scheming to give us the wrong impression, like another North Wind and the Sun strategy, aren''t you?"'
40920: 'Dlanor@r@v47/64600007."......Is there something WRONG?"'
40921: 'Battler@r@v10/60100018."Don''t worry about it.@k@v10/60100019. It has nothing to do with you people."'
40922: 'LAMBDADELTA@r@v29/62200018."I see.@k@v29/62200019. Then it doesn''t matter.@k@|@y@v29/62200020. Alright, Battler! Please start up the new game right away!@k @v29/62200021.You''ve kept us waiting so long, it''s gotten totally boring!"'
40923: 'Battler@r@v10/60100020."......Sure.@k@v10/60100021. Let''s start the sixth game.@k@|@y@v10/60100022. ......Erika, and you too, BERNKASTEL.@k@v10/60100023. This will be my tale, proof that I''ve reached the truth about Beato.@k@v10/60100024. ...LAMBDADELTA.@k@v10/60100025. Please oversee this game, as a former Game Master."'
40924: 'LAMBDADELTA@r@v29/62200022."Sure, looking forward to it. What''s the title?"'
40925: 'Battler@r@v10/60100026."......''Dawn''.@k@v10/60100027. ...As in, the Dawn of the Golden Witch."'
40926: 'BERNKASTEL@r@v28/62100027."Of course, the winter sun is quick to sink back below the horizon."'
40927: 'Erika@r@v46/64500055."Of course, my master.@k@v46/64500056. I''ll drag it back down for you right away.@k@|@y@v46/64500057. At least your title is <good>, Battler-san. I''ll give you that much."'
40928: 'Battler@r@v10/60100028."I''m glad you like it.@k@v10/60100029. ...Then let''s get started.@k@v10/60100030. The sixth game will now begin."'
40929: '@rBattler solemnly announced the start of the game.'
40930: '@r......Compared to his fired-up attitude at the end of the last game, where he and Erika had sworn to settle everything next time,@k he was extremely quiet now......'
40931: 'FEATHERINE@r@v50/65000062."......Ange.@k@v50/65000063. Beato seems very different from the way she was before."'
40932: 'Ange@r@v11/62000096."I''m surprised too.@k@v11/62000097. ......I don''t have a clue what''s going on.@k@v11/62000098. In fact, I don''t even get why Beato''s revived in the first place.@k@v11/62000099. I just finished reading it a little while ago, ......but at the end of the previous tale,@k@v11/62000100. didn''t she die just before Onii-chan reached the truth?"'
40933: 'FEATHERINE@r@v50/65000064."There are two kinds of death in this world.@k@v50/65000065. ......One of them is when a piece is taken from the game board.@k@v50/65000066. This is only a death within the bounds of the game, and these lives can revive over and over again each time you start a new game."'
40934: 'Ange@r@v11/62000101."......And that''s why the witches are so merciless when it comes to taking those lives..."'
40935: '@rTo the witch players,@k the lives of those characters who appear on the game board are no different from pieces on a chess board that take other pieces and get taken.'
40936: '@rAfter all, these pieces will be set up again when the next game starts.'
40937: 'FEATHERINE@r@v50/65000067."Maria''s Sakutarou is a prime example of these."'
40938: 'Ange@r@v11/62000102."......Sakutarou is Onee-chan''s piece...?"'
40939: '@rYes, ......that does make sense.'
40940: '@rOn the game board that represents the inside of Onee-chan''s head, Sakutarou certainly does exist,@k and is a piece which always stays by her side.'
40941: '@rThough he''s nothing more than a stuffed animal in the real world,@k on Onee-chan''s game board, he is a full piece, no different from any other piece.'
40942: 'Ange@r@v11/62000103."But, ......I wonder.@k@v11/62000104. ...On the witches'' game board, it''s easy to revive a piece, right?@k@v11/62000105. ......But Onee-chan was unable to revive Sakutarou in her world."'
40943: 'FEATHERINE@r@v50/65000068."......That''s because she lost that completely unique stuffed animal that was his vessel.@k@v50/65000069. Because of this, the conditions for that piece''s existence were violated, and it became impossible to revive him on Maria''s game board.@k@v50/65000070. ......The only reason you were able to revive Sakutarou on the game board was because you once again satisfied the conditions for his existence, correct?"'
40944: 'Ange@r@v11/62000106.".........True."'
40945: '@rMaria onee-chan...@kwas only unable to revive him because she had lost the stuffed animal that was his vessel.'
40946: '@r......If, like my family on Beato''s game board,@k she hadn''t needed a "vessel" for him, she would have been able to revive him as often as she wanted.'
40947: 'Ange@r@v11/62000107."Got it.@k@v11/62000108. ......I see that Sakutarou might be considered Onee-chan''s piece.@k@v11/62000109. At least, as long as his vessel was okay, he could have been revived over and over again."'
40948: 'FEATHERINE@r@v50/65000071."Correct.@k@v50/65000072. As long as the vessel is safe, it can be revived over and over again.@k@v50/65000073. That''s what the life of a piece is like..."'
40949: 'Ange@r@v11/62000110."......That''s the first kind of death in this world.@k@|@y@v11/62000111. ......What''s the second?"'
40950: 'FEATHERINE@r@v50/65000074."That''s the death of beings outside the game board.@k@v50/65000075. To continue with the Sakutarou example, this would be like Maria''s death."'
40951: 'Ange@r@v11/62000112."Not the piece,@k@v11/62000113. ......but the real Onee-chan''s death, right?"'
40952: 'FEATHERINE@r@v50/65000076."It doesn''t have to be her death.@k@v50/65000077. Loss of interest or concern would have the same effect.@k@v50/65000078. ......When Maria grows up from playing with stuffed animals, then "Maria the game player" will die.@k@v50/65000079. It''s as quick and easy as turning off the switch on a TV when you get bored of it."'
40953: 'Ange@r@v11/62000114.".........I see.@k@v11/62000115. In that case, "Beato the player" completely gave up on winning during the last game,@k@v11/62000116. ......so she died and vanished.@k@v11/62000117. ...Which means that if Beato thinks she has a chance of defeating Onii-chan again, she''ll come back to life, right?"'
40954: 'FEATHERINE@r@v50/65000080."Logically, that is true.@k@v50/65000081. It''s the same for people, witches, and even gods.@k@v50/65000082. If they lose interest and concern, they can die at any time.@k@v50/65000083. And if they regain that interest, they can revive at any time.@k@|@y@v50/65000084. ......However, though the concept of time does not exist in the world of gods, who can revive whenever they want,@k@v50/65000085. time shoots by like an arrow in the human world, and it is not so easy there..."'
40955: 'Ange@r@v11/62000118."That''s true.@k@v11/62000119. Skipping school for one day might not be a problem, but if you skip for three days in a row, it''d be really hard to convince yourself to go back."'
40956: 'FEATHERINE@r@v50/65000086."And what if that stretched out for a month, a year, a decade?@k@v50/65000087. What if it lasted for a thousand years, like the world of witches?"'
40957: 'Ange@r@v11/62000120."......I see.@k@v11/62000121. If you skipped for that long, it would mean your "death" as far as society is concerned.@k@v11/62000122. ......If you remained dead for that long,@k@v11/62000123. not only would you be unable to catch up on all you missed in the world at large, you''d also lose any motivation you might''ve had when you left."'
40958: 'Ange@r@v11/62000124."......So, even though you''d be alive, you could say that you''d died once.@k@v11/62000125. You would never again......be able to regain the self that you once were. It would never revive."'
40959: 'FEATHERINE@r@v50/65000088."Beato lost any chance or hope of winning.@k@v50/65000089. ......Even though she knew this, she pretended not to and kept on fighting for many, many games.@k@v50/65000090. So, Beato will not return.@k@v50/65000091. Her hopes were crushed.@k@v50/65000092. She''s spent all of the willpower that she might have used to regain the will to fight.@k@v50/65000093. Therefore,@k@v50/65000095. ......@|@y@c900.@[that BEATRICE will never revive again.@]@c."'
40960: '@rThat Beato, who just sat around the whole time with empty eyes in the fifth game...@k...must have been her corpse.'
40961: '@rShe had managed to remain on the game board despite it all,@k ......but then even that corpse was wiped away...'
40962: '@rIf Beato had been the Game Master at that time instead of LAMBDADELTA,@k the game board itself would have vanished at that moment, and everything would have ended.'
40963: '@rCome to think of it, Beato started to lose the will to fight back near the end of the fourth game.'
40964: '@rWhen Beato loses her will to fight, ......the world of this game disappears.'
40965: '@rHowever, the witches wanted to keep playing in this game board world,@k so LAMBDADELTA bound Beato in place with the curse of that shackle.'
40966: '@rShe used that shackle to make sure that the game board wouldn''t disappear,@k even if Beato did lose the will to fight.'
40967: '@rIn chess, this would be the equivalent of removing the set time limit for each turn,@k making it endless.'
40968: '@rHowever, simply having the game endlessly paused on Beato''s turn would cause the witches to die from their illness of boredom.'
40969: '@rThat''s why LAMBDADELTA took the position of Game Master.'
40970: '@r......Starting then, Beato''s existence was no longer one of the conditions necessary for the game to exist.'
40971: '@rThat''s probably why the shackles binding her to the game board were released.'
40972: '@rAnd that explains why she disappeared in the fifth game...'
40973: 'Ange@r@v11/62000126."......So,@k@v11/62000127. when Onii-chan managed to reach the truth,@v11/62000128. ...it was one game too late for him to tell Beato about it."'
40974: 'FEATHERINE@r@v50/65000096."The fifth game was a form of charity on LAMBDADELTA''s part.@k@v50/65000097. ......She merely showed Battler some mercy as the Witch of Certainty, acknowledging his strong desire to reach the truth no matter what..."'
40975: 'Ange@r@v11/62000129.".........How can you call that charity?@k@v11/62000130. It''s just those fickle witches killing time.@k@|@y@v11/62000131. ......Let''s get back to the point.@k@v11/62000132. So, that means this weird Beato isn''t the player Beato.@k@v11/62000133. She''s just a piece Beato."'
40976: 'FEATHERINE@r@v50/65000098."Yes.@k@v50/65000099. ......And if that is so, you would expect her to turn out as the Beato everyone knows well.@k@v50/65000100. ......That should also be the kind of Beato that Battler wants..."'
40977: 'Ange@r".....................@k@v11/62000135. ......You mean,@v11/62000136. ...he wasn''t satisfied with just a doll?"'
40978: '@rWhen playing with dolls,@k one can project the personality they most desire onto the doll.'
40979: '@r......However, since you are acting out their part, nothing unexpected can ever happen.'
40980: '@rYou cannot hope for any unanticipated happiness.'
40981: '@rIn the human world, there is nothing so boring as predictability.'
40982: '@rThat''s why, though a doll can become a person''s best friend in the world,@k ......people eventually get bored and outgrow them...'
40983: '@rOnii-chan only wants the real Beato.'
40984: '@rHe couldn''t bear having a doll that he could only make act like Beato...'
40985: 'FEATHERINE@r@v50/65000101.".........A Beato born as Battler''s piece...@k@v50/65000102.would probably move exactly according to Battler''s wishes."'
40986: 'Ange@r@v11/62000137."She is a piece, so that''s only natural.@k@v11/62000138. Pieces move according to their player''s directions.@k@v11/62000139. ......And they are incapable of moving in any other way.@k@|@y@v11/62000140. ......I see what it is Onii-chan wants.@k@v11/62000141. Then, just who is this weird Beato?"'
40987: 'FEATHERINE@r@v50/65000103."......Battler might be trying to revive Beato in the truest sense.@k@v50/65000104. ......It is the never-dying dream held by the children of man."'
40988: 'Ange@r@v11/62000142."You just used the red to say that wasn''t possible."'
40989: 'FEATHERINE@r@v50/65000105."......That Beato has no chance of reviving.@k@v50/65000106. However, that doesn''t mean that it is impossible to create "Beato" again...@k@|@y@v50/65000107. Have you forgotten?@k @v50/65000108.I believe that BERNKASTEL herself revealed Beato''s true form at the end of the first game..."'
40990: 'Ange@r@v11/62000143."........................@k@v11/62000144. ......Now I remember.@k@|@y@v11/62000145. ...She said something about how Beato exists as the incarnation of the rules."'
40991: 'FEATHERINE@r@v50/65000109."Rules and information, brought together,@k@v50/65000110. ultimately took the form of the witch known as BEATRICE.@k@|@y@v50/65000111. If that pattern is followed once more, the same BEATRICE will be born again,@k@v50/65000112. and perhaps one could call that a resurrection..."'
40992: 'Ange@r@v11/62000146.".........In other words, that weird Beato...@k@v11/62000147....is like an egg of Beato, ...or else a chick."'
40993: 'FEATHERINE@r@v50/65000113."That interpretation is probably accurate...@k@v50/65000114. ......In short, this Beato is a chick that might become that Beato."'
40994: 'Ange@r@v11/62000148."And that means,@k@|@y@v11/62000149. .........this pure and lovable kid will eventually grow into that screwed up, crazy witch."'
40995: '@rIn other words, that Beato is a baby version of the Beato we all know.'
40996: '@rSo, just like how no person is born evil,@k ......the newborn Beato isn''t evil either.'
40997: '@rEven though she really is a different person, .........if you measure her by her basis...her soul...@k...then maybe you really could call this a resurrection.'
40998: '@r......However, ......this reality can''t possibly be easy to accept.'
40999: '@rThough she may technically be Beato herself,@k ......she is also, without a doubt, ......a different person.'
41000: '@rAnd that way she acts...would make anyone feel as though something''s out of place......'
41001: 'FEATHERINE@r@v50/65000115."How entertaining...@k@v50/65000116. ......Hearing you read aloud is far from boring."'
41002: 'Ange@r@v11/62000150."......I wonder if you even really need someone to read aloud for you.@k@v11/62000151. ...It looks like you already know everything."'
41003: 'FEATHERINE@r@v50/65000117."I only reached that thought because I am engaged in a conversation with you.@k@v50/65000118. ......My thoughts are more numerous than the stars in the sky.@k@v50/65000119. I only appear to know everything to a child of man like you.@k@|@y@v50/65000120. ......However, without you here, I am nothing but a weak, sickly person without even the power to think..."'
41004: 'Ange@r@v11/62000152."If you''d just said that in the first place, I''d have agreed to read for you a lot more easily."'
41005: 'FEATHERINE@r@v50/65000121."......My mood just happened to improve.@k@v50/65000122. ...Don''t get an over-swelled impression of yourself.@k@v50/65000123. I think of your life as nothing more than a leaf one may lose after using it as a bookmark..."'
41006: 'Ange@r@v11/62000153."''Please continue reading'',@k@v11/62000154. is how I choose to interpret that.@k@v11/62000155. OK?"'
41007: 'FEATHERINE@r@v50/65000124."Heh......@k@v50/65000125. Far from boring.@k@v50/65000126. ...You really do make an excellent miko."'
41008: '@rFEATHERINE rocked back in her rocking chair and looked up at the ceiling,@k laughing as though the conversation itself was pleasant for her.'
41009: '@rAnge was slowly figuring out how to deal with this strange witch.'
41010: '@r......This person was also...bored.'
41011: '@rWhen a sick person has been in bed for a long time and gets too bored, they sometimes act in a rebellious way.@k@rOn the other hand, they also get a little bored of being treated kindly all the time.'
41012: '@rShe may want to be respected for her superiority,@k but it''s probably more interesting for her when she''s spoken to a little rudely.'
41013: '@r......What a coincidence.@k That''s exactly how I used to be.'
41014: 'Ange@r@v11/62000156."Anyway.@k@v11/62000157. ......From what we learned in the fourth game, there''s no doubt that there was some kind of bad blood between Beato and Onii-chan in the past.@k@v11/62000158. Learning about this Beato might give us a key towards finding the truth."'
41015: 'FEATHERINE@r@v50/65000127."It does seem so.@k@|@y@v50/65000128. ......It has caught my interest as well.@k@v50/65000129. ...Let us read her tale too."'
41016: 'Ange@r@v11/62000159."Oh, sure, as you wish, my master."'
41017: '@rAnge raised her hands like a conductor, and the bookshelves in this bizarre study responded.'
41018: '@r......Once again, several books floated out and began to swirl around Ange......'
41019: '@rKinzo''s study is the room belonging to the master in the Human world.'
41020: '@rSo, this study in the world of nonhumans belonged to the master of the game board...@k...and was a place where he could look down upon the Humans...'
41021: '@rTherefore, it was understandable that one might mistake the imposing, robe-clad man in the center of the study for Kinzo,@k if only for a second.'
41022: '@rIt wasn''t Kinzo.'
41023: '@r......It was Battler, the one who had taken up the position of Game Master,@k and who had become the new territory lord of this world.'
41024: 'Battler@r@v10/60100031."................................."'
41025: '@rAround Battler was a swirl of glowing fragments, sparkling like the night sky,@k ......and on the floor was what appeared to be a red magic circle.'
41026: '@rTo an outsider, it would have appeared to be nothing more than an incomprehensible geometric shape.'
41027: '@rBut to Battler, who stood at its center,@k it was the outline for a new tale...'
41028: '@rA new line grew across the magic circle, following Battler''s gaze.'
41029: '@rThen, at the instant it connected with a complicated symbol, the entire magic circle flashed brightly.'
41030: 'Battler@r@v10/60100032."......So,@v10/60100033. ......how does it look?"'
41031: 'Genji@r@v14/61600001."It is splendid, my lord.@k@v14/61600002. ......The sixth game is complete."'
41032: '@rAs Battler wiped his forehead and finally relaxed,@k Genji, who was standing behind him and watching over his every move, nodded deeply in response.'
41033: 'Battler@r@v10/60100034."......I always thought being a Game Master meant you could make the tale however you want,@k@|@y@v10/60100035. ......but this is seriously harder than I thought it''d be."'
41034: 'Genji@r@v14/61600003."You must write up multiple tales and make the inner and outer sides of the story match.@k@|@y@v14/61600004. ......And yet, you have displayed such skill, it is hard to believe that this is your first time.@k@v14/61600005. ......I believe even Erika-sama will be satisfied with this game."'
41035: 'Battler@r@v10/60100036."Well, hopefully it matches that great detective''s tastes.@k@|@y@v10/60100037. ......Still, ...I''ve got to honestly respect Beato now.@k@v10/60100038. ...I can hardly believe that she managed to create such complicated stories so easily."'
41036: 'Genji@r@v14/61600006."......It was not easy.@k@v14/61600007. ......BEATRICE-sama spent a long, long time deliberating, and each time she created a tale, she would worry over various contradictions.@k@v14/61600008. She was constantly battling with logic errors."'
41037: 'Battler@r@v10/60100039."Logic errors?"'
41038: 'Genji@r@v14/61600009."That is when the two sides of the tale do not meet, creating a contradiction.@k@v14/61600010. ......When this happens, it becomes a fatal violation of the rules known as a logic error, and the game board will immediately collapse and be destroyed.@k@v14/61600011. It is the greatest and worst form of error that the witch side can make, and one which must always be avoided."'
41039: 'Battler@r@v10/60100040."And Beato...@k@v10/60100041.got close to bumping into those several times in her games...?"'
41040: 'Genji@r@v14/61600012."......She fought with them every time she created a game.@k@v14/61600013. ...I believe it grew even more difficult for her as you became a more effective opponent."'
41041: 'Battler@r@v10/60100042."............So,@k@v10/60100043. ......do you think this game I''ve made...@v10/60100044....is good enough to show Beato?"'
41042: 'Genji@r@v14/61600014."......Yes.@k@v14/61600015. ......Of course."'
41043: 'Battler@r@v10/60100045."...............@k@v10/60100046. ......Has Beato...@k@v10/60100047.still not woken up?"'
41044: 'Genji@r"..........................."'
41045: 'Battler@r@v10/60100048."It''s been a while since her body was formed as a personification of the rules.@k@v10/60100049. Is she still not awake...?"'
41046: '@rAfter remaining silent for a while longer, Genji answered.'
41047: 'Genji@r@v14/61600017."......She woke up three days ago.@k@|@y@v14/61600018. You were concentrating on the construction of the sixth game, so I decided to wait before telling you...@k@v14/61600019. My sincere apologies..."'
41048: 'Battler@r@v10/60100050."Oh, really?@k@v10/60100051. Yeah, I''ll bet she''s still all drowsy after sleeping so long.@k@|@y@v10/60100052. I''ve really wanted to show her my game!@k @v10/60100053.No, it''s more than that, I have to show her my game.@k@v10/60100054. I need to tell her that I''ve understood everything."'
41049: '@rBattler''s face broke into a smile.'
41050: '@rThere was no trace in his expression of the hatred he had once felt towards Beato for murdering his family...'
41051: 'Ange@r@v11/62000160."......In a way,@k@v11/62000161. ...that was the final mystery of the fifth game."'
41052: 'FEATHERINE@r@v50/65000130."Yes.@k@v50/65000131. ......When Battler reached the truth, there was a great change in his impression of Beato."'
41053: 'Ange@r@v11/62000162."Does that mean it''s fair to assume that there really was some kind of connection between Onii-chan and Beato,@k@v11/62000163. and that he forgot all about it...?"'
41054: '@rHowever, Battler suspected this in the fourth game and asked Beato about it.'
41055: '@rAnd within the story,@k this was denied by the red truth:@k "Six years ago, no person called BEATRICE existed for Battler"...'
41056: 'FEATHERINE@r@v50/65000132."......We can read this as saying that Beato did not exist six years before,@k@v50/65000133. or it could simply mean that she had no connection to Battler at that time.@k@v50/65000134. However, either way, Battler did not visit Rokkenjima at all for the next six years..."'
41057: 'Ange@r@v11/62000164."October 4th, 1986 should have been the first time BEATRICE and Onii-chan met.@k@|@y@v11/62000165. ......If so, why was there already some kind of bad blood between them?@k @v11/62000166.I don''t have a clue what it means."'
41058: 'FEATHERINE@r@v50/65000135."......That "Ushiromiya Battler''s sin", which Beato questioned Battler about in the fourth game,@k@v50/65000136. might give us a clue.@k@v50/65000137. ...The result of that might have been BEATRICE herself."'
41059: 'Ange@r@v11/62000167."The result?@k @v11/62000168.The result of Onii-chan''s sin was...Beato...?"'
41060: '@rThat almost sounds as though...@kOnii-chan created the witch called BEATRICE himself...'
41061: 'FEATHERINE@r@v50/65000138."Almost as though...@k@v50/65000139....BEATRICE was Battler''s piece."'
41062: 'Ange@r@v11/62000169."......Huh...?"'
41063: 'FEATHERINE@r@v50/65000140."Six years earlier, Battler committed a sin.@k@v50/65000141. Because of that sin, people died.@k@v50/65000142. The killer was BEATRICE.@k@v50/65000143. ......If you consider the possibility that everything is connected to Battler''s sin six years before,@k@v50/65000144. ......then the one who created BEATRICE was Battler himself.@k@v50/65000145. I thought it sounded almost as though she was Battler''s piece..."'
41064: 'Ange@r@v11/62000170."I don''t get it.@k@v11/62000171. If Onii-chan sinned in some way, it must have been something much lighter than murder, at the very least.@k@v11/62000172. If someone caused this huge massacre in retaliation for that,@k@v11/62000173. that''s totally out of proportion."'
41065: 'Ange@r@v11/62000174."Beato killed our family.@k@v11/62000175. Dad, Mom, Onii-chan, everyone.@k@v11/62000176. ......I can''t believe that Onii-chan''s sin was anything deserving of that."'
41066: 'FEATHERINE@r@v50/65000146."The weight of a sin depends on the person measuring it.@k@v50/65000147. Even a sin so light that Battler might have forgotten...@k@v50/65000148.could have been so serious to Beato that she hated him enough to massacre his whole family a full six years after the fact."'
41067: 'FEATHERINE@r@v50/65000149."......Well, even I think that a bit excessive, and more importantly, if she were a person like that,@k@v50/65000150. I would find it hard to accept that Battler would act so friendly towards her after discovering the truth..."'
41068: 'Ange@r@v11/62000177.".............................."'
41069: '@rFEATHERINE''s observation was extremely interesting.'
41070: '@rIn a past game,@k Beato said clearly that Onii-chan''s sin six years before was the cause of this two-day tragedy.'
41071: '@rI still don''t know what kind of sin that was.'
41072: '@rHowever, he figured it out at the end of the fifth game,@k ......and he even apologized to Beato.'
41073: '@rEven though she was the witch who had massacred his entire family in retaliation for his sin of six years before,@k ......Battler apologized to her.'
41074: '@r......Of course, it was the player Battler who apologized,@k not the piece Battler whose family had been murdered over and over again.'
41075: '@rBut even so, ......Battler must have remembered something at the end of the last game...@kthat made him feel like apologizing...'
41076: 'Ange@r@v11/62000178."......This sin from six years before.@k@v11/62000179. ......Does this mean that it''s hidden somewhere in the tale so far...?"'
41077: 'FEATHERINE@r@v50/65000151."...I have already formed a theory about it."'
41078: 'Ange@r@v11/62000180."Oh?@k @v11/62000181.Let me hear it."'
41079: 'FEATHERINE@r@v50/65000152."Heheheheheh, I can''t tell you yet.@k@v50/65000153. I want to enjoy being the only one who knows the answer for a little while longer..."'
41080: 'Ange@r@v11/62000182."......Well then, I guess I''m done reading for you."'
41081: 'FEATHERINE@r@v50/65000154."Hahaha, well, we can''t have that, can we?@k@v50/65000155. ......Have some patience and read a bit further.@k@v50/65000156. My theory is still nothing more than a guess.@k@v50/65000157. ......Once I''m certain of it, I''ll tell you."'
41082: 'Ange@r@v11/62000183."Okay, okay, my master.@k@v11/62000184. I actually do want to hear what comes next, after all."'
41083: '@rOnii-chan and BEATRICE...@k Just what kind of connection is there between them?'
41084: '@r......Learning that will probably be the ultimate key to the truth of this world.'
41085: '@rAfter all, remembering that...@kwas what enabled him to reach the truth.'
41086: 'Battler@r@v10/60100055."BEATRICE...!!"'
41087: 'Kumasawa@r@v18/61800001."Welcome, my lord...@k@v18/61800002. BEATRICE-sama is waiting for you.@k@v18/61800003. This way, please......"'
41088: '@rThis place was a villa set aside for BEATRICE''s use.'
41089: '@rIt was a sacred site for her only, built so that she could spend her days without being affected by the outside world.'
41090: '@rMy heart began to race.@k ......I''m so glad that she was able to revive...and that everything''s okay...'
41091: '@rBeato is a personification of the rules.'
41092: '@rSo, even though she was destroyed once, it is possible for her to be reborn again...'
41093: '@rBattler had quickly succeeded in reviving Beato''s body, but he had had trouble summoning her soul back.'
41094: '@rHowever, during the time he had spent immersed in the creation of the sixth game, she had woken up.@k And this had happened three days ago.'
41095: '@rBattler let himself be led into the dining hall.'
41096: '@rThe dining hall had been set up for his and Beato''s use.'
41097: '@r......It existed so that they could enjoy some black tea while discussing the truth, now that he had finally reached it in its entirety.'
41098: '@rI want to tell her.'
41099: '@rI want to tell Beato that I''ve found the truth.'
41100: '@rBattler couldn''t hold back his excitement over this miracle he had been granted, that Beato was waiting for him in the dining hall to hear what he had to say...'
41101: 'Battler@r@v10/60100056."How is BEATRICE?@k@v10/60100057. Same as usual?@k@v10/60100058. Is she in high spirits?"'
41102: 'Kumasawa@r@v18/61800004."Oh yes, she is in very high spirits now.@k@|@y@v18/61800005. She has been waiting for you all this time, my lord. Oh yes."'
41103: 'Battler@r@v10/60100059."Is she in the dining hall? Is she eating or something?@k@v10/60100060. Ah, that''s alright, it doesn''t matter either way...!"'
41104: 'Kumasawa@r@v18/61800006."Hoh-hoh-ho, you''ll be surprised..."'
41105: 'Battler@r@v10/60100061."BEATRICE...!!"'
41106: '@rWhen he swung open the doors to the dining hall,@k ......Battler was greeted by a wonderful sight.'
41107: '@rThough the food laid out on the table wasn''t particularly sensational,@k it was arranged beautifully, and a champagne bottle stood there waiting.'
41108: '@r......Then, ......the person clad in that familiar dress with the beautiful golden hair bowed deeply in greeting.'
41109: 'Battler@r@v10/60100062."......B-......BEATRICE..."'
41110: 'BEATRICE@r@v27/60700017."You have my sincerest gratitude for giving me this form."@|@y'
41111: 'Battler@r@v10/60100063."Ha...hahahaha...@k@v10/60100064. Come on, don''t worry about that......@k@v10/60100065. ...I''m so glad...@k@v10/60100066. Beato........."'
41112: '@rBattler rushed up to Beato and hugged her tightly.'
41113: '@rJust to make sure her body wasn''t just mist or an illusion...'
41114: 'Battler@r@v10/60100067."......I...@v10/60100068....solved...@v10/60100069.your riddle for you......@k@v10/60100070. But then,@v10/60100071. before I could tell you about it,@v10/60100072. you went and disappeared......"'
41115: 'BEATRICE@r@v27/60700018."......I am right here...@k@v27/60700019. I will not disappear..."'
41116: 'Battler@r@v10/60100073."It''s okay, you can stop talking like that.@k@v10/60100074. I''m not going to ask you for anything in return.@k@v10/60100075. ......Anyway, I want to apologize.@k@v10/60100076. And I want to talk with you.@k@v10/60100077. ......I don''t even know where I should start."'
41117: 'BEATRICE@r@v27/60700020."You have done nothing that you need to apologize for, Father.@k@v27/60700021. ...I''m glad just to be of service to you."'
41118: 'Battler@r@v10/60100078.".........Beato......?"'
41119: 'BEATRICE@r@v27/60700022."I was born for your sake, Father.@k@v27/60700023. Please, let me support you.@k@v27/60700024. And Father,@k@v27/60700025. congratulations on completing the sixth game."'
41120: 'Battler@r@v10/60100079."I told you, stop talking like that.@k@v10/60100080. It''s totally creepy."'
41121: 'BEATRICE@r@v27/60700026."......Do you find this style of speech displeasing?@k @v27/60700027.Please forgive my rudeness..."'
41122: 'Battler@r@v10/60100081."Well, I don''t "find it displeasing", but it''s not like you.@k@v10/60100082. I guess I like the way you usually talk best."'
41123: 'BEATRICE@r@v27/60700028."....................."'
41124: '@rBeato smiled vaguely.'
41125: '@rTo Battler, it probably looked as though they were both smiling over the same joke.'
41126: '@r......However, Beato''s smile was literally vague and uncertain.'
41127: '@rAfter all...she didn''t know how she was supposed to talk...'
41128: 'Battler@r@v10/60100083."Anyway, Beato.@k@v10/60100084. Just what kind of joke is this?@k @v10/60100085.Don''t tell me that the great BEATRICE-sama decided to cook for me...?"'
41129: 'BEATRICE@r@v27/60700029."When I heard that you had completed the sixth game,@k@v27/60700030. I wanted to see if I could prepare a modest reward to congratulate you......"'
41130: 'Kumasawa@r@v18/61800007."...Hoh-hoh-ho.@k@v18/61800008. BEATRICE-sama really worked hard to make this.@k@v18/61800009. I didn''t even need to lend a hand at all, no I didn''t!"'
41131: '@rThe food set on the table really was modest and inexpertly made.'
41132: '@rYou could tell by looking at it that Beato, who wasn''t particularly skilled with cooking, had given it her all when making it...'
41133: '@rHowever, signs of discomfort and irritation were beginning to appear on Battler''s face......'
41134: 'Battler@r@v10/60100086."......What...@v10/60100087.......is this all about...?"'
41135: 'Kumasawa@r@v18/61800010."Well, as she said, BEATRICE-sama decided that she would like to congratulate......"'
41136: '@rSweat was starting to show up on Kumasawa''s forehead...'
41137: '@r......She was also feeling uneasy.'
41138: '@rWhen he noticed, Battler realized that it wasn''t just his imagination.'
41139: '@rBeato turned her back to Battler and stuck a corkscrew into the champagne bottle.'
41140: '@rThen, she showed it to Battler.'
41141: 'BEATRICE@r@v27/60700031."Father, congratulations on the completion of the sixth game.@k@v27/60700032. In the hopes that you will prove victorious over your longtime rival, Furudo Erika..."'
41142: '@rPop.'
41143: '@rWhen presented with a champagne bottle and a sound like that, anyone would think that the cork had been pulled out.'
41144: '@rHowever, it wasn''t the cork......it was the bottom of the bottle.'
41145: '@rThe high-quality champagne that Beato had procured splashed out all over the floor and her dress.'
41146: '@rThen, the same sound repeated several more times.'
41147: '@r......Each time, one of the plates of food on the table was knocked into the air.'
41148: 'BEATRICE@r@v27/60700033."F-@v27/60700034.......Father,@v27/60700035. ......did you find the food displeasing...?"'
41149: 'Battler@r@v10/60100088."Who......are you...?"'
41150: 'BEATRICE@r@v27/60700036."...I, ......I am BEATRICE.@k@v27/60700037. ...I was born for your sake, Father..."'
41151: 'Battler@r@v10/60100089."No..."'
41152: 'BEATRICE@r@v27/60700038."Huh...?"'
41153: 'Battler@r@v10/60100090."Who is this?!@k@v10/60100091. This isn''t Beato...!!@k @v10/60100092.And don''t call me Father...!!@k @|@y@v10/60100093.What''s going on here?!@k @v10/60100094.What is this?!@k @v10/60100095.Didn''t I revive Beato?!@k @v10/60100096.Genji, what''s this all about?!!"'
41154: 'Genji@r@v14/61600020."......My apologies,@k@v14/61600021. but that is indeed BEATRICE-sama."'
41155: 'Battler@r@v10/60100097."Like hell it is!@|@y@k @v10/60100098.How is this supposed to be Beato?!@k @v10/60100099.She''s totally wrong, a fake!!"'
41156: 'Genji@r@v14/61600022."No, that is BEATRICE-sama.@k@v14/61600023. It is, without a doubt, BEATRICE-sama, who was born in accordance with the rules of the game board."'
41157: 'Battler@r@v10/60100100."No, this isn''t anything like Beato...!!@k @v10/60100101.Beato would always talk in this weird way, she''d laugh rudely, and more, and more...!!"'
41158: 'Genji@r@v14/61600024."No, this is unquestionably BEATRICE-sama herself."'
41159: 'Battler@r@v10/60100102."Then why is she talking like that?@k @v10/60100103.Why is she calling me Father?!"'
41160: 'Kumasawa@r@v18/61800011."B-BEATRICE-sama was only born a short while ago...@k@v18/61800012. It would be far too cruel to expect her to act as she once did so soon..."'
41161: 'Battler@r@v10/60100104."Are you saying that her memory hasn''t returned yet?"'
41162: 'Genji@r@v14/61600025.".........My lord.@k@v14/61600026. This person is most certainly BEATRICE-sama herself.@k@v14/61600027. However, she is not the BEATRICE-sama you know so well."'
41163: 'Battler@r@v10/60100105."What are you talking about...?!@k @v10/60100106.I''m the Game Master, right?!@k @v10/60100107.Why can''t I revive Beato...?!"'
41164: 'Kumasawa@r@v18/61800013."Oh yes, she most certainly has revived.@k@v18/61800014. However, the old BEATRICE-sama had lived for a thousand years.@k@v18/61800015. ......This BEATRICE-sama, on the other hand, was only born a short while ago...!@k @v18/61800016.If she appears to be a different person, well, that just can''t be helped...!"'
41165: 'Battler@r@v10/60100108."Then, ...how can I revive that Beato?!@k @v10/60100109.Her body is right here!@k @v10/60100110.How can I revive her soul?!"'
41166: 'Genji@r@v14/61600028."......If she lives the same thousand-year life again, she should become the same BEATRICE-sama she was before."'
41167: 'Battler@r@v10/60100111."So I''m supposed to wait a thousand years...?!"'
41168: 'Kumasawa@r@v18/61800017."A, a person''s personality isn''t decided solely by their birth.@k@v18/61800018. It can change drastically based on how they live and what they experience..."'
41169: 'Tohya@r@v56/64900066."......Do you understand?@k @v56/64900067.Even though she is the same Beato, she is not the same."'
41170: 'Ange@r@v11/62000185."I get it.@k@v11/62000186. ......Even if you had two of the exact same person, they could change enormously depending on their upbringing."'
41171: 'Tohya@r@v56/64900068."Even though they might both be the same human to start with, their upbringing could change them so much that they effectively become two completely different people.@k@v56/64900069. ......Usually, we use the term "person" to refer to a person, not their personality.@k@v56/64900070. However, since Humans recognize a person by their personality, they might as well be two different people, from a Human perspective..."'
41172: 'Amakusa@r@v20/63000019."......That''s so true.@k@|@y@v20/63000020. If that tragedy twelve years ago hadn''t happened, missy here might have been a cute girl who could smile without looking weird."'
41173: 'Ange@r@v11/62000187."That''s rude.@k@v11/62000188. I''m cute enough right now, thank you very much."'
41174: '@r......I understand.'
41175: '@rIf a personality is what makes a person a person in our eyes,@k@ryou could say that a second personality is a different person entirely, even if it inhabits the same flesh body.'
41176: '@rAt the very least,@k@rI''m a completely different person than I used to be twelve years ago.'
41177: '@rAnd if my family had come home twelve years ago,@k ......then the Ange that resulted would surely be a completely different person from me.'
41178: '@rEven the same human can become different people.@k@rIn fact, depending on their upbringing and endless possibilities, they can become an endless number of different people.'
41179: '@r......So, just because this is the same Beato,@w583. ......that''s no guarantee at all that she''ll be the Beato that Onii-chan knows so well.'
41180: 'Ange@r@v11/62000189."And on top of that, BEATRICE is a witch who lived a thousand years.@k@v11/62000190. ......A person can die and be reborn in the span of just three days.@k@v11/62000191. A thousand years.........is just too long."'
41181: 'Tohya@r@v56/64900071.".........It seems you''re quite a skilled reader.@k@v56/64900072. ...For most of my readers, it would be necessary to devote several hundred pages to explaining how a single human...@k@v56/64900073.can become different people depending on their upbringing and the passage of time."'
41182: 'Ange@r@v11/62000192."Don''t underestimate your readers.@k@v11/62000193. We aren''t just reading.@k@v11/62000194. We read...and we think."'
41183: 'Tohya@r@v56/64900074."......If I give my work to a hundred people to read, ninety will actually be able to.@k@v56/64900075. However, only fifty will actually understand what it means.@k@v56/64900076. And not even twenty will be capable of thinking beyond that.@k@v56/64900077. ......Yet all I am asking is that they chew before they swallow.@k@v56/64900078. ...Nothing more than that. *giggle*"'
41184: 'Tohya@r@v56/64900079."However, it seems that "you" are one of those precious twenty readers...@k@v56/64900080. That''s why I invited you here, child of man..."'
41185: '@rIt was hard to actually like this Hachijo Tohya person.'
41186: '@r......However, though this forgery she had written was still in its first stages,@k ......it definitely felt as though it had something very similar to the tales in those message bottles.'
41187: '@rSpeaking metaphorically, ......one might call it a scent.'
41188: '@rAn indescribable stern atmosphere, ......like a stuffy library.'
41189: '@rThe "BEATRICE" who wrote the message bottles and Hachijo Tohya are different people.'
41190: '@r......And yet, this has the same scent as that tale...'
41191: '@r......I see.@k This is why some of those curious Witch Hunters are so intensely devoted to her...'
41192: '@rTheir keen sense of smell was able to sniff out that familiar scent......'
41193: 'Tohya@r@v56/64900081."Very well then.@k@v56/64900082. ......Please continue reading.@k@v56/64900083. There could be nothing more entertaining than watching your face as you glance over the words.@k@v56/64900084. That, and speaking with you..."'
41194: 'Ange@r@v11/62000195."I guess it''s true that writers are always starving for opinions on their works.@k@v11/62000196. ......Sorry to disappoint you, but I don''t have time to read all the way through this thick manuscript.@k@v11/62000197. More importantly, I came here to............"'
41195: 'Tohya@r@v56/64900085."......But you have all the time in the world......"'
41196: '@rBoth the second hand and the pendulum on the ornate clock behind Hachijo had been moving the whole time.'
41197: '@rHowever, ......absolutely no time had passed for a while now.'
41198: '@rOnly about three minutes had gone by since the time she had entered the room...'
41199: 'Tohya@r@v56/64900086."See?@k @v56/64900087.Time isn''t something you have to worry about.@k@v56/64900088. ......Time everywhere will leave you alone until you''ve finished reading..."'
