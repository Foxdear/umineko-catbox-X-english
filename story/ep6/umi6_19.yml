48729: '@r@v00/awase6096_o.""Then let the pair exchange their rings!!""'
48730: '@r......Beato took Battler''s hand.........and put a ring with the seal of the One-winged Eagle on his finger.'
48731: 'Battler@r@v10/60101051.".........Are you sure...?"'
48732: 'BEATRICE@r@v27/60701223."You are already the territory lord.@k@v27/60701224. ......So, this ring belongs to you, Battler-san."'
48733: 'Battler@r@v10/60101052."......You''re certain?@k@v10/60101053. ......This is the world you created...... Your tale."'
48734: 'BEATRICE@r@v27/60701225."Yes.@k@v27/60701226. .........I created this tale because I wanted to be with you.@k@v27/60701227. ......That means the purpose of this world has been fulfilled.@k@v27/60701228. ......So, from now on, ......I want you to write it.@k@v27/60701229. ......The rest of the tale...about you and me."'
48735: 'Battler@r@v10/60101054."................................."'
48736: 'BEATRICE@r@v27/60701230."......Heh, or am I dragging you out of your comfort zone?!@k @v27/60701231.*cackle*cackle*, I am merely pushing the tiresome task of territory lord onto you.@k@v27/60701232. It''s much easier being the wife, where you only have to brag...!"'
48737: 'BEATRICE@r@v27/60701233."I just need to play around and wait for you to write a new tale.@k@v27/60701234. And, for each new tale you write, I will play any role you devise for me.@k@v27/60701235. .........A wicked witch, or an adversary.@k@|@y@v27/60701236. ......A lover, ......or a wife."'
48738: 'Battler@r@v10/60101055."My tales are pretty intense.@k@v10/60101056. You''ll be busy from dawn until dusk."'
48739: 'BEATRICE@r@v27/60701237."Hmm...... Sounds perfect..."'
48740: '@rBeato''s hand relinquished the ring of the territory lord......'
48741: '@rFrom Battler, she received a silver ring with a crest that could only be worn by the wife of the territory lord.'
48742: '@rThen, they exchanged their rings, ......and their wedding was complete.'
48743: '@rThen, the pair turned around, ......faced the packed crowd of guests, and raised their rings high.'
48744: '@rA thunderous applause rang out for them......'
48745: 'Zepar@r@v51/65100277."In commemoration of the night''s events, the great territory lord will now recognize the accomplishments of certain people."'
48746: 'Furfur@r@v52/65200259."Let those called come forward."'
48747: '@rAt Battler''s nod, Beato read the name of the first guest to be recognized.'
48748: 'BEATRICE@r@v27/60701238."......Kanon.@k@v27/60701239. Come forward."'
48749: 'Jessica@r@v04/60200423."K-Kanon-kun...?!"'
48750: '@rA girl goat pushed her way through the crowd, took off her mask, and yelled.'
48751: '@rA cloud of gold butterflies gathered before Battler and Beato...@k...and took the form of Kanon, kneeling in front of these two nobles.'
48752: '@rKanon had already died and vanished.@k@r......However, all of the dead revive in the Golden Land.'
48753: 'Kanon@r@v16/60600495."Kanon, right here......"'
48754: 'BEATRICE@r@v27/60701240."When my husband was locked up and in danger,@k@v27/60701241. you rescued him and displayed your self-sacrifice by choosing to remain in the eternal prison in his place.@k@v27/60701242. Your devotion is deserving of commendation.@k@v27/60701243. Therefore, we will allow for your resurrection, as well as your continued service."'
48755: 'Kanon@r@v16/60600496."......My lady,@k@v16/60600497. I am deeply thankful!"'
48756: 'Jessica@r@v04/60200424."Kanon-kun, ......Y-...Yoshiya-kun!!@k @|@y@v04/60200425. Yoshiya-kunnnn!! Waaaaaaaaaaaaaaaaaaaahhh!!"'
48757: '@rJessica raced forward and landed sobbing in Kanon''s chest.@k@rKanon patted her head gently and held her......'
48758: 'Battler@r@v10/60101057."You won''t be serving as furniture.@k@v10/60101058. You''ll be serving as a human.@k@v10/60101059. ......Do you understand what that means?"'
48759: 'Kanon@r@v16/60600498."............I do!"'
48760: '@rAfter looking at Jessica sobbing, ......he looked at Battler again and nodded forcefully.'
48761: 'BEATRICE@r@v27/60701244."Now for the next pair.@k@v27/60701245. Ushiromiya George and Shannon!@k @v27/60701246.Come forward!!"'
48762: '@r@v00/awase6097.""Yes.""'
48763: '@rGeorge and Shannon were the next to be called.'
48764: '@rPerhaps they had already readied themselves.@k They walked forward boldly and kneeled.'
48765: 'George@r@v07/60300502."Ushiromiya George, right here."'
48766: 'Shannon@r@v15/60500364."Shannon, right here......"'
48767: 'BEATRICE@r@v27/60701247."You two withstood Zepar and Furfur''s trials until the very end.@k@v27/60701248. Your great achievements and affection, determination and nobility are exemplary and deserving of commendation.@k@v27/60701249. Therefore, I issue you a marriage certificate signed by his lordship!"'
48768: '@r@v00/awase6098.""We are deeply thankful.""'
48769: 'BEATRICE@r@v27/60701250."This certificate overrides objections from one and all!@k @v27/60701251.Let the families of those recognized bless this union with all their hearts!!"'
48770: 'Battler@r@v10/60101060."You heard her.@k@v10/60101061. No more squabbling, let''s all just throw rice at them and celebrate.@k@|@y@v10/60101062. Congrats, you two!"'
48771: '@rWhen the territory lord clapped his hands in celebration, it spread throughout the entire cathedral.'
48772: '@rThen, a group of goats in the front line of the crowd took their masks off one by one...'
48773: 'Eva@r@v05/61000066."......N-now listen here!@k @v05/61000067.I won''t stand for you making too much salty miso soup, understand?!@k @v05/61000068.And George is getting a little overweight, so go easy on the sugar—"'
48774: 'Hideyoshi@r@v06/61100091."George! When a man gets married,@k@v06/61100092. he''s got to treasure his wife even more than his parents!@k @v06/61100093.No matter what your mother says, you make sure you protect Shannon-chan!"'
48775: 'George@r@v07/60300504."Yes, of course!!"'
48776: 'Shannon@r@v15/60500366."George-san...!!"'
48777: 'Eva@r@v05/61000069."G-George needs a solid seven hours of sleep each night!@k @v05/61000070.I''ll never forgive you if you let him stay up late!!@k @v05/61000071.And don''t forget that washing his back and cleaning his ears are also a wife''s responsibilities!!"'
48778: 'Natsuhi@r@v03/60900045."I-is that true...? Wh-what have I done..."'
48779: 'Krauss@r@v02/60800071."...Th-that varies depending on the family......"'
48780: 'Kyrie@r@v09/61300274."Rudolf-san, have you been properly caring for your wife?"'
48781: 'Rudolf@r@v08/61200098."Y-you should know...@k@v08/61200099. Why are you suspicious...?!"'
48782: 'Rosa@r@v12/61400095."Find happiness, you two.@k@v12/61400096. Marriage isn''t the goal.@k@|@y@v12/61400097. It''s just the starting line, okay?"'
48783: 'Maria@r@v13/60400161."Uu-uu-uu!@k @v13/60400162.Congratulations, congratulations!!"'
48784: 'Sakutarou@r@v33/64200029."Uryuu!! Congratulaaaaaaatioons!!!"'
48785: 'Kanon@r@v16/60600499."We can''t let them beat us, can we?"'
48786: 'Jessica@r@v04/60200426."Heh, heheheheheheh...!!@k @v04/60200427.Y-yeah, no way we''re losing, dammiiiiiiiiiiit!!"'
48787: '@rAll of the Ushiromiya family, all of the servants, and all of the spirits and demons in attendance...@k...celebrated the honorees with even greater applause...'
48788: '@r@v27/60701251_b.Thus, .........the tale woven by the Golden Witch comes to an end.'
48789: '@r@v27/60701251_c.It seems proper to conclude the tale with the epitaph.'
48790: '@r@v27/60701251_d.The following is the passage on the Golden Land from the Golden Witch''s epitaph.@k@r@v27/60701251_e.@z70.The witch shall praise the wise, and bestow four treasures.@k@r@v27/60701251_f.One shall be all of the Golden Land''s gold.@k@r@v27/60701251_g.One resurrects all the dead people''s souls.@k@r@v27/60701251_h.One even revives all the love they possessed.@k@r@v27/60701251_i.And one for the witch to eternally rest.@k@r@r@v00/awase6099.Rest in peace, my beloved witch, BEATRICE......'
48791: 'Ange@r"........................@k@v11/62000576. ......So, this means Beato now rests fulfilled...?"'
48792: 'FEATHERINE@r@v50/65000371."That interpretation is probably appropriate..."'
48793: 'Ange@r@v11/62000577."And?@k @v11/62000578.Now that the game is over, Onii-chan will be released, right?@k @v11/62000579.......What will happen to him?"'
48794: 'FEATHERINE@r@v50/65000372."......Well, I wonder.@k@v50/65000373. .........The book of this fragment tells no more of the story."'
48795: 'Ange@r@v11/62000580."............So, in the end, we don''t even find out what happens to Onii-chan.@k@v11/62000581. .................."'
48796: '@r......It''s not as though anything will come out of it anyway.'
48797: '@rIn the end, Onii-chan and the others never came back.@k@rThey reached the Golden Land and enjoyed themselves there.'
48798: '@r......So says the tale, ......but in reality,@k .........everyone died......in that horrific accident......'
48799: 'Ange@r@v11/62000582."Still, .........I''ve learned a lot of very interesting things.@k@v11/62000583. ......That island really is.........a crazy place of illusions."'
48800: 'FEATHERINE@r@v50/65000374."Indeed.@k@v50/65000375. ......And your reading was truly wonderful..."'
48801: 'Ange@r@v11/62000584."......I feel worn out, like watching a six-hour movie all at once.@k@v11/62000585. ......I''m tired."'
48802: 'FEATHERINE@r@v50/65000376."Ushiromiya Ange.@k@v50/65000377. You really have worked hard.@k@v50/65000378. .........My boredom was eased by your reading.@k@v50/65000379. The gratitude I feel towards you is one I have not felt since long before I stopped counting the years..."'
48803: 'Ange@r@v11/62000586."If you''re grateful, why can''t I have some kind of "commendation" too?"'
48804: 'FEATHERINE@r@v50/65000380."Hmm, what would be good...@k@v50/65000381. ......Give me some time.@k@v50/65000382. I will think."'
48805: '@rFEATHERINE sat down in her rocking chair and rocked it gently, apparently trying to think of something...'
48806: 'FEATHERINE@r@v50/65000383."......Ushiromiya Ange.@k@v50/65000384. You really have worked hard.@k@v50/65000385. ......You have done well to keep reading for me until the end.@k@v50/65000386. ......With this, your responsibilities as my miko are lifted.@k@v50/65000387. You may return to your original world and be reunited with the fate that you have been given."'
48807: 'Ange@r@v11/62000587."Sheesh.@k@v11/62000588. ......Feels like this was one hell of a side-trip."'
48808: 'FEATHERINE@r@v50/65000388."Do not pout.@k@v50/65000389. I am thinking of a reward now......@k@v50/65000390. ......Yes, why not, every once in a while...@k@v50/65000391. .........That said, it has been quite some time.@k@v50/65000392. ......I imagine the ink from the bottle has dried up by now......"'
48809: '@rEven after the tale ended, Ange and Hachijo''s debate over it continued for quite some time.'
48810: '@rIt was very serious......and fiery.'
48811: '@rAnge had acknowledged that this tale was no crazy literary work,@k ......but a new message bottle, which had drifted here once more from the Rokkenjima of twelve years previous to tell her of a single possible truth...'
48812: '@rAnd.........it seemed as though she had found her own interpretation...@kof the truth she thought the tale was trying to tell.'
48813: '@r......Of course, that was only one truth,@k and it did not mean an end to her journey.'
48814: '@rStill, ......this interpretation had its place.'
48815: '@rIt wasn''t sufficient to fill the twelve-year gap in her heart.'
48816: '@r......However, for now, ......she was content just to enjoy the feeling the tale had created...@kalong with the bitter coffee Hachijo had made.'
48817: 'Tohya@r@v56/64900138."......Thank you for reading until the end.@k@v56/64900139. ......And thank you for your thoughts and opinions.@k@v56/64900140. ......I''m sure the very first Endless Witch is happy..."'
48818: 'Ange@r@v11/62000589.".........Wow, so you can say stuff like that.@k@v11/62000590. ......If you''d just talk like that from the beginning, I''ll bet you''d have tons more fans."'
48819: 'Tohya@r@v56/64900141."......I am merely praising the wonderful reader that you most certainly are.@k@v56/64900142. ......I just wanted to say that rather than write for a silent readership of unthinking swine,@k@v56/64900143. I would find it a much more productive use of my limited time on this earth to write a manuscript for you alone......@k@v56/64900144. *giggle*."'
48820: 'Ange@r@v11/62000591."That''s the kind of thing you don''t have to say.@k@v11/62000592. ......Well, I''ll take it as a compliment.@k@v11/62000593. .........Okay."'
48821: '@rI get the feeling......that I''ve spent a really, really long time here.'
48822: '@rIt feels......as though I''ve spent a major fraction of my life here.'
48823: '@r......It should feel uncomfortable, sitting here on a sofa in someone else''s house,@k ......but for some strange reason, it feels as familiar as my own home.'
48824: '@rHowever, the clock shows that it''s been only about two or three hours since I met her.@k ......My sense of time feels very strange...'
48825: 'Tohya@r@v56/64900145."......Your friend seems to be taking his time......"'
48826: 'Ange@r@v11/62000594."It must be a long phone call.@k@v11/62000595. It''s creepy for a guy to talk that long on the phone."'
48827: '@rHe said he was going to make a scheduled report to Okonogi-san, didn''t he?'
48828: '@rEven though he was told that he could use the phone here, he declined, and went to look for a public phone somewhere.'
48829: '@r......Something about how he didn''t want to risk being bugged.@k It was too ridiculous a point to argue, so I just left him to it.'
48830: 'Ange@r@v11/62000596."Is the public phone far?"'
48831: 'Tohya@r@v56/64900146."If you go out onto the street, there''s a store on the corner a short way down."'
48832: 'Ange@r@v11/62000597."Then I''ll be on my way.@k@v11/62000598. ......Here, consider this payment for the snacks or whatever."'
48833: 'Tohya@r@v56/64900147."......If I let you keep that money,@k@v56/64900148. will you come again, read my next manuscript, and tell me your opinions...?"'
48834: 'Ange@r@v11/62000599."......You''re willing to pay rolls of money to get an uncouth girl like me to read your manuscript?"'
48835: 'Tohya@r@v56/64900149."On the contrary,@k@v56/64900150. you were a good reader and a good thinker.@k@v56/64900151. ......It is in search of a person like you that we weave these tales and set them loose into the world."'
48836: 'Ange@r@v11/62000600.".........You praise me too much.@k@v11/62000601. I just take books a little too seriously."'
48837: 'Tohya@r@v56/64900152."As thanks for the considerable time you have given to me,@k@v56/64900153. .........I will someday write your tale."'
48838: 'Ange@r@v11/62000602."Am I going to appear in another of your Forgeries?@k @v11/62000603.......I hope you kill me in a slightly better way this time."'
48839: 'Tohya@r@v56/64900154."......Do you...like miracles?"'
48840: 'Ange@r@v11/62000604."You mean story contrivances?@k @v11/62000605.......I used to hate them, but recently I''ve become a big fan.@k@v11/62000606. I''ve been spoiled, though, so you''ll have to one-up jumping off a skyscraper and ending up unharmed, because I don''t even count that as a miracle anymore."'
48841: 'Tohya@r@v56/64900155.".........Then, one day, perhaps, I will write you a tale that you will consider a miracle......"'
48842: 'Ange@r@v11/62000607."I''m......really sorry for barging in all of a sudden and saying all kinds of mean things."'
48843: 'Tohya@r@v56/64900156."......Not at all. It was a worthwhile conversation.@k@v56/64900157. ...Perhaps I will have my head editor arrange another meeting between the two of us......"'
48844: 'Ange@r@v11/62000608."If the opportunity presents itself.@k@v11/62000609. <See you again, have a nice day>."'
48845: 'Tohya@r@v56/64900158."Yes, it may happen again sometime.@k@v56/64900159. ......I pray that you find your truth."'
48846: 'Ange@r@v11/62000610."Thank you."'
48847: 'Tohya@r@v56/64900160."If you ever do reach your truth,@k@v56/64900161. .........please try making your truth a tale as well someday..."'
48848: 'Ange@r@v11/62000611.".........You want me to become one of you witches?@k @v11/62000612.I''m not sure about that.@k@v11/62000613. I''m bad at writing.@k@v11/62000614. A good reader isn''t necessarily a good writer, you know?"'
48849: 'Tohya@r@v56/64900162."Ah, quite true.@k@v56/64900163. I myself can never read anything written by anyone else."'
48850: 'Ange@r@v11/62000615."......Sheesh.@k@v11/62000616. Then, I''m off."'
48851: 'Tohya@r@v56/64900164."After this, I will probably never see you again,@k@v56/64900165. ......but I pray I will be fortunate enough to meet another you somewhere...someday."'
48852: 'Ange@r@v11/62000617."...........................@k@v11/62000618. Can I ask one last question?"'
48853: 'Tohya@r@v56/64900166."Go ahead..."'
48854: 'Ange@r@v11/62000619.".........That FEATHERINE witch, who appeared within the tale.@k@v11/62000620. ......That''s...you, right?"'
48855: 'Tohya@r@v56/64900167."It may be presumptuous to say it, but that was my intention."'
48856: 'Ange@r@v11/62000621."...........................@k@v11/62000622. ......This might be a strange question, but......umm...@k@v11/62000623. ...............Are you FEATHERINE?@k @v11/62000624.Or is FEATHERINE you?"'
48857: 'Tohya@r@v56/64900168."......Why,@k@v56/64900169. ......I haven''t the foggiest idea what you mean..."'
48858: '@rThe mysterious woman remained mysterious to the end.'
48859: '@r.........And so I made it through a day I had no memory of, and the following day, I took a boat to Niijima.'
48860: '@rI''ll probably never see her again.'
48861: '@rHowever, that just means that "I" won''t see her—the other "me"s might, somewhere down the road.'
48862: '@r......Just as "I" was able to reach several truths, I pray that they too......can reach their destinations.'
48863: '@rSo long, FEATHERINE.'
48864: '@r......If you ever write a better story, please call me again.@k@rIf I''m free, I might drop by......'
48865: 'Amakusa@r@v20/63000040."No problem.@k@v20/63000041. It''s the cushiest escort job I''ve ever had.@k@v20/63000042. ......I''d almost like to invite you along, sir."'
48866: '@r@v21/64100001."......I''ll take a pass on that.@k@v21/64100002. You know how old I am.@k@v21/64100003. I''m done running around all over the place..."'
48867: '@rThe person on the other end of the line was Okonogi.'
48868: '@r......Okonogi was also one who tended to move from place to place, so it hadn''t been easy to catch him even on the phone.'
48869: 'Amakusa@r@v20/63000043."Our trip''s been pretty <cool>, so right now, there''s no need to run around."'
48870: 'Okonogi@r@v21/64100004."Sumadera Kasumi''s searching like a madwoman for her.@k@v21/64100005. ......According to my source, she''s fixed herself a ride to Rokkenjima already.@k@v21/64100006. You''ll bump into her there."'
48871: 'Amakusa@r@v20/63000044."So, just as planned."'
48872: 'Okonogi@r@v21/64100007."...............It''ll likely be just five or six people at most.@k@v21/64100008. And they''ll probably be armed with nothing more than handguns.@k@v21/64100009. They''re no match for you.@k@v21/64100010. Feel free to run wild.@k@v21/64100011. But make sure you kill them.@k@v21/64100012. ......Have you received that favorite toy of yours?"'
48873: 'Amakusa@r@v20/63000045."Of course.@k@v20/63000046. I''m surprised you managed to get this into the country."'
48874: '@rBehind Amakusa was the rental car that they had borrowed under a false name,@k ......inside of which was now a black golf bag.'
48875: 'Okonogi@r@v21/64100013."The Sumadera head family has already given the okay, but make sure you get out of Japan as soon as you''re done.@k@v21/64100014. Don''t forget to buy your cup ramen by the box in Narita before your flight out."'
48876: 'Amakusa@r@v20/63000047."Heheheh, I''ll take care this time.@k@v20/63000048. .........It''s an easy job."'
48877: 'Okonogi@r@v21/64100015."There''s also............the other matter...... You understand me, right?"'
48878: 'Amakusa@r@v20/63000049."Other matter...@k@v20/63000050. .........Well, now you''ve lost me."'
48879: 'Okonogi@r@v21/64100016."......Playing dumb, huh?@k@v21/64100017. ......Well, whatever.@k@v21/64100018. At the end of the day, you''re a man who''s never betrayed my expectations.@k@v21/64100019. ......If you''re clever about it, you won''t even have to get your hands dirty.@k@v21/64100020. ......There should be plenty of ways to handle it."'
48880: 'Amakusa@r@v20/63000051.".......................................@k@v20/63000052. ......Heheh, I''m not sure what you''re talking about."'
48881: 'Okonogi@r@v21/64100021."......I know Ange-chan''s an unfortunate kid.@k@v21/64100022. ......Still, all she had to do was play the part of a secluded, wealthy young lady.@k@v21/64100023. ......Since Eva-san''s death, we''ve all been in agreement on uniting together going forward.@k@v21/64100024. ......This little portable shrine of ours is important, ......but she''s also a liability.@k@v21/64100025. We''re talking about world peace here, right?"'
48882: 'Amakusa@r@v20/63000053."............Well, let''s see how it goes.@k@v20/63000054. I hope those Sumadera black-suits know how to shoot a gun right."'
48883: 'Okonogi@r@v21/64100026.".............................."'
48884: 'Amakusa@r@v20/63000055."Hmm?@k @v20/63000056.What is it, sir?"'
48885: 'Okonogi@r@v21/64100027."......Don''t tell me that, after a few days on the run,@k@v21/64100028. you and Ange-chan have already hooked up...?"'
48886: 'Amakusa@r@v20/63000057."Ha.@k@v20/63000058. .........Me and that bratty little girl? ...Please."'
48887: 'Okonogi@r@v21/64100029."Hey, it''s not like I care.@k @v21/64100030.It''d mean you''ve finally managed to move on, enough that you can take passes at women, at least.@k@v21/64100031. ......Half the world is women, you know.@k@v21/64100032. You''ll never last if just one or two give you the jitters."'
48888: 'Amakusa@r@v20/63000059."..............................@k@|@y@v20/63000060. ......Oh, speak of the devil.@k@v20/63000061. She''s here.@k@v20/63000062. ............Guess that''s all for today.@k@v20/63000063. I''ll contact you after I reach our lodgings on Niijima.@k@v20/63000064. Later."'
48889: '@rAnge walked down the street towards me.'
48890: '@rWhy''d she have to do that when I told her to wait for me to come back?'
48891: '@r......If only she wasn''t like this, she might have lived a long life.'
48892: 'Ange@r@v11/62000625."......That was a pretty long call.@k@v11/62000626. I was so tired of waiting that I left."'
48893: 'Amakusa@r@v20/63000065."Heheh. Sorry about that.@k@v20/63000066. ......How was it for you, missy?@k @v20/63000067.Did you learn anything interesting...?"'
48894: 'Ange@r@v11/62000627."It was interesting.@k@v11/62000628. .........That''s all I got out of it."'
48895: 'Amakusa@r@v20/63000068."Hyahha...!@k @v20/63000069.Sounds <cool>."'
