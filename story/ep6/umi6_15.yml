46065: 'Dlanor@r@v47/64600193.".........Are you ready, Lord BATTLER?"'
46066: 'Battler@r@v10/60100731."Yeah.@k@v10/60100732. ......Or as you would say it,@k@v10/60100733. ............come, step forward."'
46067: 'Erika@r@v46/64500975."<Good>!@k @v46/64500976.Then allow me to examine your response.@k@|@y@v46/64500977. So, let''s see, ......are the seals broken or are they not?@k@v46/64500978. Has the locked room been preserved, ......or has it not...?!"'
46068: '@rThe piece Erika held high in the air......was the white queen, which represented herself.'
46069: '@rHer target......was Battler''s territory.@k She cut straight in...!'
46070: '@rErika dashed down the hallway with a sickening smile and clung to the guest room door like a spider.'
46071: '@rThen, she closely examined the seals she had placed retroactively.'
46072: 'Erika@r@v46/64500979."............Heh...@v46/64500980....heheheheheheheheeheheheheheehheh!@k @v46/64500981.......Are you sure...?@k @v46/64500982..........Are you sure,@v46/64500983. ...Battler-saaaaaaan...?!"'
46073: 'BEATRICE@r@v27/60700775."I-......is this alright, Battler-san...?"'
46074: 'Battler@r@v10/60100734."......Yeah, I can''t back down here.@k@v10/60100735. ......After all, even if I''m sealed in here, ......there are ways of placing the letter."'
46075: 'BEATRICE@r@v27/60700776."But Erika is probably about to enter the guest room.@k@v27/60700777. And then, she will observe your dead body.@k@v27/60700778. ......What are you going to do?!@k @v27/60700779.If the body is there, then there''s no problem.@k@v27/60700780. ......The letter''s prediction will have missed, but it''s not as though there''s a penalty for that.@k@v27/60700781. ......But you......intend to fight this head on...!"'
46076: 'Battler@r@v10/60100736."There are times...@v10/60100737....when a man is challenged head on...that he has to respond, no matter what it is he''s up against."'
46077: 'Battler@r@v10/60100738."......I must not...pull back here.@k@v10/60100739. .........I''ll take this challenge.@k@v10/60100740. I can search for a way out all I want to later...!@k @v10/60100741.I managed to do that with Kinzo''s study last time...!@k@v10/60100742. .........It''ll be fine... I can do this...! I can do it!!@k @v10/60100743.Do your worst, Erikaaaaaaaaaaaa!!!"'
46078: 'Dlanor@r@v47/64600194.@|@y"@c900.@[We have confirmed that the seals to the guest room are UNDAMAGED.@k@v47/64600195.@|@y Since the time Lady ERIKA confirmed Battler''s presence, this locked room has been PRESERVED.@]@c."'
46079: 'Erika@r@v46/64500984."<Good>!!@|@y@k @|@y@v46/64500985.I''m breaking the seals!!@k @v46/64500986.Rip and tear!!@|@y@k @|@y@v46/64500987.Heh, hehihihihihihihihihihihi!!!"'
46080: '@rErika destroyed the duct tape seal on the door in ecstasy...'
46081: '@rIt looked as though the intellectual rapist had finally laid her true nature bare.'
46082: 'Erika@r@v46/64500988."......Okay,@v46/64500989. ......I''m opening it......@k @v46/64500990.Show me,@v46/64500991. ......Battler-san,@v46/64500992. ......your naked scenario...!!@k @|@y@v46/64500993.Hehihihahahaahaaaaaaaaahhh!!!"'
46083: '@rLike a ruffian pushing down a weak girl,@k ......Erika mercilessly and greedily threw the door open.'
46084: '@rThen, finally, ......the inside of Battler''s guest room was observed by Erika.'
46085: '@rBattler had to show it.'
46086: '@r.........Was there a corpse, or wasn''t there?'
46087: 'Erika@r@v46/64500994."<Come ooooooooooooooon>, Battleeeeeeeeerrrrrrrr!!"'
46088: 'Battler@r@v10/60100744."Aaaaaaaaaaahhh, here''s my respooooooonse!!"'
46089: '@rBattler grabbed a black piece from the board and raised it high.'
46090: '@r......Aah, ......that piece.........'
46091: '@rBeato had no memories of the time she had been an expert at this game.'
46092: '@rAnd yet, ......for some reason, she realized that this was a move from which there would be no coming back.'
46093: '@rOnce a piece was moved, it couldn''t be taken back...!!'
46094: '@rUwaaaaaaaaaaaaaaaaaaahhhhh!!'
46095: '@r......The guest room was covered by a silent darkness.'
46096: '@rIt was pitch black, and nothing could be seen.@k ......However, there was a light switch just off to the side of the entrance.'
46097: '@rIf that was pressed, the room would be lit up, and everyone would see whether or not there was a corpse on the bed.'
46098: 'Dlanor@r@v47/64600196.".........Should I turn on the LIGHTS?"'
46099: 'Erika@r@v46/64500995."No, ......wait a second, please.@k@v46/64500996. .........Battler-san, I have a proposal."'
46100: 'Battler@r@v10/60100745."............Let me hear it."'
46101: 'Erika@r@v46/64500997."I think you already know,@k@v46/64500998. ......but this time around, I am not after the classic sort of victory of identifying the culprit.@k@v46/64500999. ......My enemy is not the lowly culprit killing the pieces, .........but my opponent, you yourself."'
46102: 'Battler@r@v10/60100746.".........I know.@k@v10/60100747. ......So, ......you''re after a logic error."'
46103: 'Erika@r@v46/64501000."Heheh......"'
46104: 'Battler@r@v10/60100748."......I''m seriously regretting it now.@k@v10/60100749. ......You were acting so miserable that I fell for it completely, ......and I gave you a ridiculous privilege."'
46105: 'Dlanor@r@v47/64600197.".........It was your ARROGANCE.@k@v47/64600198. ......It will cost you DEARLY."'
46106: 'Battler@r@v10/60100750."..................Damn......it......"'
46107: 'BEATRICE@r@v27/60700782."......So, ...what is your proposal?"'
46108: '@rWith a firm voice, Beato urged her to continue.@k@rUntil just a second ago, she had remained behind Battler''s back, a bit flustered.'
46109: '@r......However, she was steady now.'
46110: '@r......She saw that Battler had let his emotions take control and had been lured into making a bad move...@k...and realized that it was time for her to stay cool and support him.'
46111: '@rErika''s proposal couldn''t be anything good.@k@rAnd on top of that, Erika was sly.'
46112: '@rShe probably wouldn''t make a proposal that would be easily rejected...'
46113: 'Erika@r@v46/64501001."In a moment, I will turn on the light.@k@v46/64501002. The top of the bed will be lit up, and it will be decided whether or not Battler-san has disappeared as the letter predicted."'
46114: 'Erika@r@v46/64501003."......If he''s there, great.@k@v46/64501004. There''s nothing strange at all.@k@v46/64501005. The letter''s prediction would just be wrong.@k@v46/64501006. ......Of course, the argument would probably switch over to "then who put the letter there?",@k@v46/64501007. but for the time being, the location of the fight would move outside this locked room."'
46115: 'BEATRICE@r@v27/60700783."........................And...if he''s missing...?"'
46116: '@rBeato already knew.@k@rShe knew the move that Battler had made a second ago.'
46117: '@r......Battler had......already disappeared from this room......'
46118: '@rTherefore, they would need to prepare a different disappearing trick,@k one other than "he was actually alive and left through the door".'
46119: '@rThe situation is simple.'
46120: '@rFirst, this room is a locked room.@k@rAlso, Battler''s life or death status has not been confirmed.'
46121: '@rIn other words, it would pose no problem if he was alive.'
46122: '@rUnder these conditions, they had to make Erika think that Battler disappeared.'
46123: '@rHe could escape from the room,@k ......or if that''s impossible, he could hide somehow and wait for her to leave, making her think that he disappeared.'
46124: 'Erika@r@v46/64501008."Inside this tiny room,@v46/64501009. ......I will begin our endgame,@v46/64501010. ......the chase after the king.@k@v46/64501011. It will be over in just a few moves.@k@v46/64501012. You''ll be unable to construct the logic needed to allow Battler to escape from this room,@k@v46/64501013. .........and the tale will be destroyed—game over."'
46125: 'BEATRICE@r@v27/60700784.".........Fighting to keep that from happening is our job.@k@v27/60700785. ......What is this proposal of yours?"'
46126: 'Erika@r@v46/64501014."An endgame fought over a logic error should be a bit more precise.@k@|@y@v46/64501015. ......Once again, we will fight with the red and blue truths,@k@v46/64501016. but we need a judge on the same level as the Game Master to observe and see that he doesn''t create any logic errors with the red truth."'
46127: 'BEATRICE@r@v27/60700786."......Th-that seems reasonable."'
46128: 'Erika@r@v46/64501017."There''s nothing special about this.@k@v46/64501018. ......Back when the old you was the Game Master,@k@v46/64501019. you were under the observation of your guardian, Lady LAMBDADELTA.@k@v46/64501020. She judged all your red truths to be valid."'
46129: 'Battler@r@v10/60100751.".........So, you''re telling us to show LAMBDADELTA our cards?"'
46130: 'LAMBDADELTA@r@v29/62200133."I''ve been looking at them since the beginning.@k@|@y@v29/62200134. ......It''s okay, don''t worry.@k@v29/62200135. I''m impartial in my judgments."'
46131: 'BEATRICE@r@v27/60700787."C-can you say that with the red truth...?"'
46132: 'LAMBDADELTA@r@v29/62200136."Yep.@k@v29/62200137.@|@y@c900.@[I swear that I am impartial in my judgments.@]@c.@k@v29/62200138. .........I was very impartial in the last game, wasn''t I?"'
46133: 'BERNKASTEL@r@v28/62100181."......That goes double for trials where things will be interesting either way, doesn''t it?@k @v28/62100182..........Accept her challenge, Battler.@k@v28/62100183. Erika is going to corner you.@k@v28/62100184. Understand?@k @|@y@v28/62100185..........She will duel with you and kill you in this room.@k@v28/62100186. ......If you''re a man, accept the duel......!"'
46134: 'Battler@r@v10/60100752."S-......sure, fine.@k@v10/60100753. .........We won''t get anywhere if every single impossible murder I present is accused of being a logic error.@k@v10/60100754. ......It''s true that we need an impartial observer to guarantee that the game is legitimate."'
46135: 'LAMBDADELTA@r@v29/62200139."Then I''ll come around to your side.@k@v29/62200140. ......Let me take a look at your hand.@k@|@y@v29/62200141. ...............Hmmmmm......?"'
46136: '@rLAMBDADELTA understood what Battler had up his sleeve.'
46137: '@r......And she confirmed that Erika''s first move had indeed gone straight through his heart.'
46138: '@rJust as Erika had guessed,@k Battler was alive, and after Erika had examined his "corpse", he had slipped out of the room,@k ......placed the letter by the guesthouse, and hid himself somewhere.'
46139: '@rOnce the duct tape seals were retroactively placed on the guest room,@k ......he suddenly became required to show that they had been torn.'
46140: '@rHowever, if he had done that, it would have been the same as admitting that he had been seen through and that he had lost.'
46141: '@rUnwilling to admit that, Battler had claimed that the seals had been preserved, with false courage,@k and was now rushing to revise his logic.'
46142: '@rTrue, he could still escape for a few more moves.'
46143: '@r......However, Erika was planning to corner and kill him here...'
46144: 'LAMBDADELTA@r@v29/62200142."......Battler.@k@v29/62200143. ......You''re fighting with some pretty incredible cards here."'
46145: 'Battler@r@v10/60100755."Cards...?@k @v10/60100756.......Does this game of chess look like a card game to you?"'
46146: 'LAMBDADELTA@r@v29/62200144."......To me, it''s always looked like you were playing a game of poker.@k@v29/62200145. So, by moving to this side and looking at the cards you hold, I understand everything."'
46147: 'LAMBDADELTA@r@v29/62200146."...............This is an awful hand.@k@v29/62200147. It''s basically the lowest-ranking hand there is...@k@v29/62200148. And Erika knows that''s exactly what you have."'
46148: 'Battler@r@v10/60100757."............Heheh...@k@v10/60100758. What would you do?"'
46149: 'LAMBDADELTA@r@v29/62200149."I''m the judge. I can''t give you advice.@k@v29/62200150. ......But let me tell you my impressions."'
46150: 'Battler@r@v10/60100759."No, that''s okay."'
46151: 'LAMBDADELTA@r@v29/62200151."......This hand gives me the tingles.@k@v29/62200152. ......You''re...intending to use this "nothing" hand...@v29/62200153....and a big wager...@v29/62200154....to bluff Erika into folding, aren''t you...?@k@v29/62200155. ......She''s not going to fold, you know.@k@v29/62200156. ......If anyone should be surrendering their chips and folding now,@v29/62200157. ......it''s you..."'
46152: 'BEATRICE@r@v27/60700788."......Thanks for the advice.@k@v27/60700789. .........Battler-san.@k@v27/60700790. I agree with her.@k@|@y@v27/60700791. ......Let''s back down from the fight in this room.@k@v27/60700792. We don''t have any winning cards..."'
46153: 'LAMBDADELTA@r@v29/62200158."Are you hoping for a card change to turn this hand into something half decent...?@k @v29/62200159.......But you''re playing chess, aren''t you...?@k @|@y@v29/62200160.In the world of chess, ......if you rely on luck, ......you die......"'
46154: '@rBy "hoping for a card change",@k .........she meant relying on luck and hoping that, even though he couldn''t think of anything now,@k he might later be able to think of a good plan for how to make this locked-room trick hold up.'
46155: '@rBattler, if you start this battle...@w333....without a trick up your sleeve,@w583. .........you''re marching to your death...!'
46156: '@rIf you ever plan to back down, it has to be now.'
