46158: '@r......That''s......all there is to it!'
46159: 'BERNKASTEL@r@v28/62100187."......Lambda.@k@v28/62100188. I don''t know what you''re talking about, but you''re chatting too much.@k@v28/62100189. A judge needs to be impartial."'
46160: 'LAMBDADELTA@r@v29/62200161."True......@k@v29/62200162. ......Then, good luck, Battler.@k@v29/62200163. ......I''m hoping for a precise, chess-like battle.@k@|@y@v29/62200164. ......You aren''t......playing poker, remember......"'
46161: 'Erika@r@v46/64501021."Are you ready, Battler-san?"'
46162: 'Battler@r@v10/60100760."Yeah, I am......@k@v10/60100761. ......Turn the lights on whenever you want."'
46163: 'Erika@r@v46/64501022."For the rest of the fight in this room, the progression of time will be stopped.@k@v46/64501023. This way, all the moves for both players will be made at the same time,@k@v46/64501024. and the first move made will be treated no differently than the last move.@k@v46/64501025. ......It might be difficult to understand what I mean, but this is a rule to protect the logic,@k@v46/64501026. and it will protect you as well."'
46164: 'BERNKASTEL@r@v28/62100190."......From here on out, you will be rebuilding the trick in this room using all the twisted logic you want.@k@v28/62100191. ......And that means it''s possible that you might think of a good idea partway through the fight."'
46165: 'BERNKASTEL@r@v28/62100192.".........Normally, it''s unfair to revise your plot partway through.@k@v28/62100193. In order for that to be acceptable, ......you need a world where logic thought up "after the fact" does not come "too late"—@k@v28/62100194.a world stopped in time, where everything happens at once."'
46166: 'LAMBDADELTA@r@v29/62200165."Of course, Erika can take advantage of this rule as well.@k@v29/62200166. ......If you revise your trick to be a new one, she can deal with that in a different way."'
46167: 'BEATRICE@r@v27/60700793.".........This is pretty complicated..."'
46168: 'Battler@r@v10/60100762."It''s simple.@k@v10/60100763. ......It''s like a corrupt politician''s war of twisted logic.@k@v10/60100764. ......You lie shamelessly.@k@v10/60100765. When evidence is shown revealing your lie, you retract it,@k@v10/60100766. say that you just remembered wrong, then change to a new lie that doesn''t have any contradictions."'
46169: 'Battler@r@v10/60100767."......The fight goes between a lie, then evidence exposing it, then another lie,@k@v10/60100768. ......like a fight between two snakes spinning around trying to eat each other''s tails."'
46170: 'Erika@r@v46/64501027."<Good>!@k @v46/64501028.......Just think of it as a world in which you''re allowed to use twisted logic based off of your opponents moves as often as you want.@k@|@y@v46/64501029. ......I used that myself when sealing this room.@k@v46/64501030. So, I thought it was only fair to let you do the same."'
46171: 'BEATRICE@r@v27/60700794.".........You have no shame, do you...?"'
46172: 'LAMBDADELTA@r@v29/62200167."OK!!@k @v29/62200168.Then, both players, begin!@k @|@y@v29/62200169.Erika goes first, right?@k @v29/62200170.No, maybe we start by checking the bed—see what Battler''s staking on this?!"'
46173: 'BERNKASTEL@r@v28/62100195."Yeah, let''s start by checking the bed for Battler.@k@v28/62100196. ......Erika, begin."'
46174: 'Erika@r@v46/64501031."Leave it to me, my master!@k @v46/64501032.<Light>...<on>!"'
