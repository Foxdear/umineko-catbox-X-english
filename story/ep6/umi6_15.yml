46056: '@rThe entrance to the mansion was locked, but Erika had a master key, so she opened it without any trouble.'
46057: '@rShe had gotten Krauss and the others to take the master keys from the servants,@k and at that time, she had used a little sleight of hand to pilfer one of them...'
46058: 'Dlanor@r@v47/64600191."Well THEN.@k@v47/64600192. Where shall we go FIRST?"'
46059: 'Erika@r@v46/64500973."Why ask?@k@v46/64500974. ......Let''s go and hear Battler-san''s answer."'
46060: '@rGrinning, Erika cut across the entrance hall, passed by the dining hall, and headed deeper and deeper into the mansion.'
46061: '@r......She headed for the guest room Battler had lain dead in.'
