46185: '@rAt Dlanor''s nod, Cornelia, who was hanging back, started taking a record.'
46186: '@rShe wrote down that Battler''s corpse, which should have been on the bed, was not,@k ......and also that Battler hadn''t backed down from this locked-room game...'
46187: 'LAMBDADELTA@r@v29/62200171."As previously announced, Battler''s first move is to have the corpse vanish.@k@v29/62200172. ......Now it''s Erika''s turn.@k@v29/62200173. Go ahead."'
