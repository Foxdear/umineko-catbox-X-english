46190: 'BERNKASTEL@r@v28/62100199."......Pfft.@k@v28/62100200. ......In the last game, Beato did that in Kinzo''s study,@k@v28/62100201. and Dlanor made Swiss cheese of her, right...?@k @v28/62100202.I guess this is revenge...*giggle*..."'
46191: 'Erika@r@v46/64501041."Before I start searching, I have one blue truth I can use without a search.@k@v46/64501042.@|@y@c279.@[There is a possibility of a hidden door X that is impossible to discover.@k@v46/64501043.@|@y He''s hidden behind that, so it is impossible for me to find him.@]@c."'
46192: 'Battler@r@v10/60100776.@|@y"@c900.@[Knox''s 3rd:@k@v10/60100777.@|@y It is forbidden for hidden passages to exist.@]@c.@k@v10/60100778. ......That right?"'
