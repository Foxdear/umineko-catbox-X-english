46567: 'BERNKASTEL@r@v28/62100237."The manner in which they were each killed differed,@k@v28/62100238. .........but afterwards,@v28/62100239.@|@y@c900.@[she completely severed the heads of all those she killed.@]@c.@k@v28/62100240. ......That method of killing is solid enough to be called a red truth, right...? Lambda......?'
