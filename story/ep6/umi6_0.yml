40485: '@rA beautiful glow shone in from the skylight over the grand cathedral.'
40486: '@rThe place was somehow different from the way it had been during the witches'' trial.@k@rThe decorations had changed.'
40487: '@rThe several pleasantly sparkling white ribbons were paper-thin, but they hung beautifully in the air.'
40488: '@rFlowers were arranged all over in a way that would make any place look cheerful.'
40489: '@rIt was like how a single drop of impure water could spoil an entire cask of wine.'
40490: '@rJust the presence of the flowers, the ribbons, and the red carpet that ran down the center of the room...@kmade it hard to believe that this was the same place Ushiromiya Natsuhi had been falsely accused of a crime...'
40491: '@rIt had truly become......a wedding chapel.'
40492: '@r@v51/65100001."Love is generous, love is merciful!"'
40493: '@r@v52/65200001."Love does not envy, it does not boast!"'
40494: '@rThese words, spoken by two demons who seemed to be in charge of this gathering, were part of a ceremony for making an oath of love before the eyes of God.'
40495: '@rOf course, in this wedding celebrated by demons, there was no priest in sight.@k@rInstead, there stood the witch who controls miracles.'
40496: 'BERNKASTEL@r@v28/62100001."In sickness and in health.@k@v28/62100002. ......Yeah, a wife''s true job is to be supportive in times of sickness.@k@|@y@v28/62100003. Isn''t that right, Erika?"'
40497: 'Erika@r@v46/64500001."......Yes.@k@v46/64500002. My master......"'
40498: 'BERNKASTEL@r@v28/62100004."That looks good on you.@k@v28/62100005. What a fitting outfit for the one who has conquered the bridegroom.@k@v28/62100006. *giggle*giggle*giggle*."'
40499: 'Erika@r@v46/64500003."Ehehehehehehehehehe.@k@v46/64500004. I''m honored, my master."'
40500: '@rThe bride standing on the carpeted path...was Furudo Erika.@k@r......The groom''s face couldn''t be seen.'
40501: '@rThe bride''s outfit was, without a doubt, a pure-white wedding dress.'
40502: '@rThe bride''s veil represented both the white of God''s blessings...and the white of the demons'' cruelty.'
40503: '@rA great many goat nobles, witches, and demons were gathered for this wedding.'
40504: '@rIf only their heads hadn''t been those of goats,@k it would probably have seemed to be a very refined crowd worthy of this great cathedral...'
40505: 'LAMBDADELTA@r@v29/62200001."......I''d expect no less of you, Bern.@k@v29/62200002. Every single thing you come up with is always so screwed up."'
40506: 'BERNKASTEL@r@v28/62100007."A wife to support her ailing husband.@k@v28/62100008. ......Isn''t that wonderful?@k@v28/62100009. It suits you, Erika."'
40507: 'BERNKASTEL@r@v28/62100010."......And......congratulations to you too,@v28/62100011. ......Mr. Groom."'
40508: '@rAt that point, ......BERNKASTEL stared straight into the groom''s eyes.'
40509: '@rThe groom...@w500....didn''t answer.'
40510: '@rHis eyes were gray.'
40511: '@r......His lips would mutter something from time to time, but no one could tell if the words meant anything.'
40512: 'BERNKASTEL@r@v28/62100012."Hey, ......are you listening?@k @v28/62100013.All of you?"'
40513: '@rShe spoke to the groom in the plural.@k@r......Of course, there was only one groom.'
40514: '@rAnd, of course, the gray-eyed groom didn''t answer...'
40515: 'Erika@r@v46/64500005."*giggle*giggle*giggle*.@k@v46/64500006. You can hear, but you can''t answer, right?@k @|@y@v46/64500007.......Don''t worry, okay,@v46/64500008. Battler-san?"'
40516: 'Battler@r@v10/60100001."...............nn..................gah......"'
40517: 'Erika@r@v46/64500009."I''ll take everything of yours,@k@v46/64500010. ......and trample all over it......@k@|@y@v46/64500011. *giggle*giggle*giggle*!!"'
40518: 'Erika@r@v46/64500012."Ehhahahahahahahaahahahahahaahahahahaha...!!"'
40519: '@rThe Witch of Miracles sneered with an evil smile that would make even demons want to avert their gaze.'
40520: '@rEven that sneer...@w500....provoked no response...@w500....from Battler''s dim eyes.'
40521: '@r@v51/65100002."People live for the sake of love!@k @v51/65100003.Therefore, today, you have fulfilled the purpose of your lives."'
40522: '@r@v52/65200002."Oh, how great is the power to live, the power of love...!@k @v52/65200003.I pray that the brightness of this day blesses these two for all time!"'
40523: 'BERNKASTEL@r@v28/62100014."......Just give it a rest already, you demons.@k@v28/62100015. What comes next?"'
40524: '@r@v51/65100004."The couple will now make an oath of eternal love."'
40525: '@r@v52/65200004."After that, they will exchange rings...!"'
40526: '@rOn Battler''s hand......was a ring bearing the seal of the One-winged Eagle, proof that he was the territory lord of this world.'
40527: '@rAnd on Erika''s finger was a diamond ring that could not be shattered by any miracle.'
40528: '@rDiamonds signify an "eternal bond".@k@rHowever, in Greek, the word for "diamond" simply means "unbreakable".'
40529: '@rErika wasn''t vowing to love Battler forever.@k@rShe just wanted to take Battler as her property for all eternity.'
40530: '@rThis wedding was being performed......for the sole purpose of humiliating Battler.'
40531: 'Erika@r@v46/64500013."......Don''t worry.@k@v46/64500014. I won''t love you forever.@k@v46/64500015. After all, the point of this ceremony is to make you submit to me.@k@v46/64500016. ...Your heart will be shut inside an inescapable locked room forever......where I, Furudo ERIKA, the detective and the Witch of Truth, will command it.@k@v46/64500017. Your position as territory lord and your ring will become mine..."'
40532: 'Battler@r@v10/60100002."...........................Can''t...@v10/60100003....get..."'
40533: 'Erika@r@v46/64500018."......Hmm?@k @v46/64500019.What was that?"'
40534: 'Battler@r@v10/60100004."........Nn......gah.........@k@v10/60100005. ......Can''t......get out......"'
40535: 'Erika@r@v46/64500020."Heh, ...ha, ......hahahahahahahahaha...!@k @v46/64500021.Yes, I''ll bet you can''t get out of that locked room.@k@v46/64500022. After all, you made that locked room yourself.@k@|@y@v46/64500023. You will suffer in that room for all eternity.@k@v46/64500024. I''ll remain by your side as your wife for eternity......and get to enjoy that look of anguish on your face all by myself."'
40536: 'Erika@r@v46/64500025."*giggle*giggle*, ahhahahahahahahaha...!!@k @v46/64500026.I''ll defile you forever.@k@v46/64500027. ......Ushiromiya Battleeeeeeeeeeeeeeeeer!!!"'