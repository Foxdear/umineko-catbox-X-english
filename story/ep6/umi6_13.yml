45223: 'BEATRICE@r@v27/60700682."......How does it feel?@k@v27/60700683. To play on the witch side."'
45224: 'Battler@r@v10/60100461."It feels strange.@k@v10/60100462. .........I used to think that the witch side had such a huge advantage.@k@v10/60100463. But now that I''m on that side, I see that that''s ridiculous.@k@v10/60100464. It''s almost like that party game where you stick knives in a barrel."'
45225: '@rFrom the perspective of the human side, it feels like trying to shoot at a target hidden by mist.'
45226: '@rBut from the witch side, a random shot might become fatal.'
45227: 'BEATRICE@r@v27/60700684."......And the old me played several games just like that."'
45228: 'Battler@r@v10/60100465."Yeah, it''s almost like Russian roulette.@k@v10/60100466. ......Even so, you stretched those games out to the limit, believing that I would eventually figure it out."'
45229: 'BEATRICE@r@v27/60700685."......It may be impudent of me to ask,@k@v27/60700686. ......but just what is it that you figured out, Battler-san?@k @v27/60700687.At the very end of your games with the old me..."'
45230: '@rIt was a strange question.'
45231: '@rIn the past, Beato had always been the one posing it to Battler.@k@rBut now that Battler had figured it out, Beato was the one asking him about it...'
45232: 'Battler@r@v10/60100467."......It''s the exact opposite.@k@v10/60100468. ......In the past, only you remembered, ......and only I forgot.@k@v10/60100469. But now, it''s the other way around.@k@v10/60100470. Only I remember, ......and only you have forgotten."'
45233: 'BEATRICE@r@v27/60700688."Would you mind telling me what it is...?"'
45234: 'Battler@r@v10/60100471.".........Telling you would be...easy.@k@v10/60100472. ......But I don''t want to tell you.@k@v10/60100473. I''m not trying to be mean.@k@v10/60100474. ......I just want...to believe in a miracle myself, just a little bit."'
45235: 'BEATRICE@r@v27/60700689.".....................A miracle...?"'
45236: '@rYes, this was the single miracle seed that Battler had preserved.'
45237: '@r......If Beato could remember a certain something without being told,@k ......that would prove that Beato had revived in the truest sense.'
45238: '@rSo he wouldn''t tell her.'
45239: '@r......It was Battler''s final seed...@kwhich existed because he still couldn''t abandon his hope that Beato might revive.'
45240: 'BEATRICE@r@v27/60700690."If you can''t tell me, then I won''t ask.@k@v27/60700691. ......If I have upset you, please forgive me..."'
45241: 'Battler@r@v10/60100475."Don''t worry about it.@k@v10/60100476. I''m just clinging to the past.@k@v10/60100477. ....................."'
45242: '@rAs she watched that sad smile, Beato''s chest tightened.'
45243: '@r......He was looking at her...and seeing the old her.'
45244: '@rYes......I must become my former self...for his sake.'
45245: '@rMy older sister who gets burned by spiderwebs, and I who don''t, must become one.'
45246: '@r......Surely, it''s more useful to him if I go on a journey to find myself now...@k...than if I simply watch over his game.'
45247: 'BEATRICE@r@v27/60700692."How do you feel about this game?@k@v27/60700693. ......Do you think you can win?"'
45248: 'Battler@r@v10/60100478."Yes, I believe I can.@k@v10/60100479. I''ll win......and end this eternal torture, just like Beato wanted."'
45249: 'BEATRICE@r@v27/60700694."When it ends.........what will happen to the world...?"'
45250: 'Battler@r@v10/60100480."Who knows.@k@v10/60100481. ......I''m really not sure.@k@v10/60100482. ...But that''s what we wished for.@k@v10/60100483. ......So, no matter what the result is, I intend to accept it."'
45251: 'BEATRICE@r@v27/60700695.".........I wonder what will happen to me..."'
45252: '@rBeato was...uncertain.'
45253: '@rEven she was probably no more than a piece in this game.'
45254: '@r......If the game ended,@k then would she, one who had been born out of that game''s rules, ......disappear...?'
45255: 'Battler@r@v10/60100484."The game will probably disappear.@k@v10/60100485. ......But now, I completely understand magic.@k@v10/60100486. ......So, I''ll be able to carry you off the game board.@k@v10/60100487. ......I think that was your wish."'
45256: 'BEATRICE@r@v27/60700696."My......wish...?"'
45257: 'Battler@r@v10/60100488."..................@k@v10/60100489. ......The rest is a secret.@k@|@y@v10/60100490. ......I''ll be waiting for the miracle......for you to remember all of that by yourself."'
45258: '@rAfter smiling bitterly for just a second, Battler laughed and told her not to worry.'
45259: '@rApparently, it was best if she avoided talking to Battler about her previous self...'
45260: 'Battler@r@v10/60100491."......Well then, I''ll go check on my opponent for a bit.@k@v10/60100492. ...I can''t wait to see what kind of twisted logic that idiot thinks up next."'
45261: 'BEATRICE@r@v27/60700697."The old Battler-san did a lot of that too.@k@v27/60700698. ......My favorite was the one from the first twilight of the second game, when you said the culprit killed everyone by feeding them small bombs."'
45262: 'Battler@r@v10/60100493."Aaaaahhh, the highlights of my dark past...@k@v10/60100494. Please forget that ever happened..."'
45263: 'BEATRICE@r@v27/60700699."Yes, I will try."'
45264: '@rBattler became a cloud of gold butterflies and disappeared into the darkness.'
45265: '@rBeato remained bowed until he had disappeared completely......'
45266: '@rTo fill in his place, a single gold butterfly appeared......and became Beato the Elder.'
45267: 'Elder BEATRICE@r@v60/60700700."......Did you call me, little sister?"'
45268: 'BEATRICE@r@v27/60700701."Yes.@k@v27/60700702. .........I want to know more about you.@k@v27/60700703. And......I want to know what the real me is like.@k@v27/60700704. I want to become like that."'
45269: 'Elder BEATRICE@r@v60/60700705."Of course, I also want to know about my future self.@k@v60/60700706. ......We revealed everything about ourselves to each other for that purpose.@k@v60/60700707. ......However, we did not become one.@k@v60/60700708. I cannot understand what we must do to become our single self."'
45270: 'BEATRICE@r@v27/60700709.".....................What can we do to become one......?"'
45271: 'Elder BEATRICE@r@v60/60700710."I have high hopes for the trials of Zepar and Furfur."'
45272: 'BEATRICE@r@v27/60700711."You mean the miracle of magic given to the victors?"'
45273: 'Elder BEATRICE@r@v60/60700712."I wonder if that magical miracle means becoming one''s full self.@k@v60/60700713. ......I will be able to attain my true form.@k@v60/60700714. You will be able to fulfill Battler''s wishes.@k@v60/60700715. Battler will also be happy, and all of us will suddenly have what we want."'
45274: 'BEATRICE@r@v27/60700716.".........I...can''t get away from this trial, can I..."'
45275: 'Elder BEATRICE@r@v60/60700717."Which means you cannot afford to lose to the other two pairs."'
45276: 'BEATRICE@r@v27/60700718."......George-san and Shannon-san, Jessica-san and Kanon-san.@k@v27/60700719. ......I can only grasp happiness......by trampling over them..."'
45277: 'Elder BEATRICE@r@v60/60700720."The conditions apply equally to all.@k@v60/60700721. ......If one of the others succeeds in love, the other two pairs, including you, will be trampled over."'
45278: 'BEATRICE@r@v27/60700722."......Why must the scales be so unbalanced, I wonder?"'
45279: 'Elder BEATRICE@r@v60/60700723."Unbalanced?"'
45280: 'BEATRICE@r@v27/60700724."Some people will find love, others won''t.@k@v27/60700725. ......So I can understand placing those two groups on the two plates of a set of scales.@k@v27/60700726. But the scales for our trial have three plates, and two must lose for one to win... It seems horribly unbalanced..."'
45281: 'Elder BEATRICE@r@v60/60700727."Who knows?@k@v60/60700728. It might mean that successful love is worth two destroyed loves.@k@|@y@v60/60700729. ......Your words do not inspire confidence, little sister.@k@v60/60700730. If you cannot put your desire to answer to Battler''s expectations before your concern for the losers, victory will slip through your fingers."'
45282: 'BEATRICE@r@v27/60700731.".........You''re right.@k@v27/60700732. ......I won''t give up our victory.@k@v27/60700733. ......I don''t like doing this to the others, ......but there will be no hard feelings between us."'
45283: '@rIf I do lose...'
45284: '@r......I''ll give my strongest blessings to whichever couple wins.'
45285: '@rSo, I''ll fight with all my heart and soul,@w500. ......so that I have no lingering regrets,@k ......and I''ll win that miracle of magic.'
45286: 'BERNKASTEL@r@v28/62100091."How was it?@k@v28/62100092. How did the red and blue shootout over the first twilight go?"'
45287: 'Erika@r@v46/64500700."I was just gathering information to start.@k@v46/64500701. Battler seemed pretty fired up."'
45288: '@rShe had just returned from a fierce fight with Battler, fought using the information gained through repetition requests.'
45289: '@rIt was the old, familiar kind of fight, reminiscent of the time when the red text had first appeared,@k or when the blue text had first been permitted...'
45290: 'BERNKASTEL@r@v28/62100093."And the result...?"'
45291: 'Erika@r@v46/64500702."First, in all cases, it was the victims themselves that constructed the locked rooms.@k@v46/64500703. Also, those locked rooms were perfectly preserved until Krauss''s group broke them open.@k@v46/64500704. Also, I confirmed that during that period, all forms of interference from the outside were impossible."'
45292: '@rErika reported this proudly as though it had been a great battle, but BERNKASTEL looked bored as she listened.'
45293: '@rAfter looking at her blankly for a second, LAMBDADELTA spoke her opinions frankly.'
45294: 'LAMBDADELTA@r@v29/62200080.".........Wait a second.@k@v29/62200081. Doesn''t that mean this locked-room murder was perfect?"'
45295: 'Erika@r@v46/64500705."Wha......uh......"'
45296: '@rThe victims had sealed the locked rooms themselves.'
45297: '@rAnd that state had been preserved until Krauss and the others had broken the locked rooms open.@k@rAnd no one had been inside the locked rooms except for the victims.@k@rAnd Krauss''s group, the ones who had broken the room open, were not the culprits......'
45298: '@r......Erika''s battle had proceeeded in this way, with her detailed repetition requests winning her several other little red truths just like these.'
45299: '@rNormally, simply collecting such vital information would have been enough.'
45300: '@rHowever, the witch who was her master was tired of boredom,@k ......and she had been expecting a much more flashy, argument-winning victory instead of this bland result.'
45301: 'Erika@r@v46/64500706."H-however, ......this time, I don''t have the detective''s authority, so there''s a chance that my examination of the corpses could have been in error.@k@v46/64500707. S-so, if we suppose that a drug which mimics death was used to fool my examination, umm..."'
45302: 'LAMBDADELTA@r@v29/62200082."You mean Purupurupikopuyo?"'
45303: 'Erika@r@v46/64500708."N-no, not that...!@k @v46/64500709.It''s not impossible for certain well-known drugs, such as insulin, to bring about a temporary state that mimics death.@k@|@y@v46/64500712. ......Battler did not counter that with the red truth.@k@v46/64500713. In other words, my blue truth worked...!@k @v46/64500714.I...I''d say we''ve started with a victory."'
45304: '@rTo sum up Erika''s report,@k all she had done was listen to the red truths Battler had wanted her to hear.'
45305: '@rOnly the information Battler had wanted to provide had been presented, and she hadn''t been able to strike at any weak points.'
45306: '@rShe was like a kid who had gone out shopping, then forgotten her job and only bought candy...'
45307: '@r.........However, this was all the players on the Human side could do.'
45308: '@rWithout the detective proclamation, she could only fight by collecting dull bits of information like that.'
45309: '@r......All the same, her master had been expecting more than that sort of dull fight...'
45310: '@rSo, ......she had tried to give her report energetically, ......to make it seem as though they were in a superior position...'
45311: '@rBut no matter how much she tried, the cold expression of her master remained merciless...'
45312: 'BERNKASTEL@r@v28/62100094."......Your blue truth worked...?@k @v28/62100095.You mean it was too ridiculous for him to bother cutting down.@k@v28/62100096. ......Impressive powers of deduction, Great Detective..."'
45313: 'Erika@r@v46/64500715."I...I did try to examine the corpses with care, to the best of my abilities...@k@v46/64500716. ......However, I don''t have the detective''s authority, .........so we can''t be certain..."'
45314: 'LAMBDADELTA@r@v29/62200083."Wait a second, weren''t you the one who decided not to make the detective proclamation?@k @v29/62200084.Didn''t you say you wanted to raise the stakes to make up for your disgrace last time?"'
45315: 'Erika@r@v46/64500717."............W-......well..............."'
45316: 'BERNKASTEL@r@v28/62100097."What''s wrong?@k @v28/62100098.......Are you saying you can''t win against Battler without the detective''s authority......?"'
45317: 'Erika@r@v46/64500718."N-......not at all, my master.@k@v46/64500719. ...I...I can easily defeat an incompetent buffoon like that, even without the detective''s authority...@k@v46/64500720. ......It''s just......this style of fighting is a little different from what I''m used to, and I haven''t gotten the hang of it yet......"'
45318: '@rCompared to other human beings, Erika would rank as extremely talented.'
45319: '@rHer knowledge and powers of memory and insight were ahead of the pack, and most likely, no human could be more suitable for the role of detective than her.'
45320: '@rHowever, no matter how superior she might be to other humans,@k@r......that didn''t matter in a game of witches.'
45321: '@rIn a witch''s game, it''s either 0 or 100.@k@rIn other words, everything is either the red truth, or it isn''t.'
45322: '@rIf a normal human''s abilities were worth a 10, her exceptional power would probably rate a 99.@k ......However, it could never be 100.'
45323: '@rSince it was less than 100, it wasn''t absolutely certain.@k@rSo it didn''t count as red truth.'
45324: '@rFor example, ......the examination of the corpses that Erika had worried over in the fight just now.'
45325: '@rIf she had performed it with the detective''s authority, she could have said with 100% certainty whether they were alive or dead.'
45326: '@rHowever, without the detective proclamation, it was 99%.@k ......There was a 1% chance that she made a mistake, and that overturned the foundation of the examination.'
45327: '@rThe reason Erika had gained the detective''s authority and become the Witch of Truth...@k...was that BERNKASTEL had supplemented her talent of 99 with an additional 1...'
45328: '@rJust because BERNKASTEL wouldn''t give her that 1,@k ......in the world of witches, Erika''s 99 was treated exactly the same as zero...'
45329: '@rEven her talented assistant Dlanor couldn''t be put to proper use without a power of 100.'
45330: '@rWhen working under an Erika who had lost the detective''s authority, Dlanor''s red longsword lost its power.'
45331: '@rDlanor also found it vexing that she couldn''t provide adequate assistance...'
45332: '@r......She had tried several times to convince Erika to use the detective proclamation, but Erika had stubbornly refused each time...'
45333: 'LAMBDADELTA@r@v29/62200085."Why not just do it? Make that detective proclamation.@k@v29/62200086. If you do, you''ll be unstoppable.@k@v29/62200087. Dlanor could even use her red longsword and the Knox Decalogue."'
45334: 'BERNKASTEL@r@v28/62100099."............Why not do it...if you want......?"'
45335: 'Erika@r@v46/64500721."N-......no."'
45336: '@rThere was no need for anyone to explain...'
45337: '@rBy now, it was clear that Erika hadn''t abandoned the detective proclamation by her own will.'
45338: 'BERNKASTEL@r@v28/62100100."......When Battler reached the truth in the previous game,@k@v28/62100101. ......this game was already finished.@k@v28/62100102. This isn''t really the sixth game.@k@v28/62100103. ......It''s a finale game so that Battler can have a chance to serve as Game Master at the end.@k@v28/62100104. Everything was already decided last game."'
45339: 'LAMBDADELTA@r@v29/62200088."Yeah, pretty much.@k@v29/62200089. The games won''t continue forever, and I''ve lost my bet with Bern.@k@|@y@v29/62200090. .........In this game, Battler will prove that he''s reached the game''s truth,@k@v29/62200091. and then Beato''s game will be destroyed in a big victory for the Human side.@k@v29/62200092. And a big victory for Bern too.@k@v29/62200093. ......Well, supposedly, but you look unsatisfied for some reason."'
45340: 'BERNKASTEL@r@v28/62100105.".....................Because I am.@k@v28/62100106. I didn''t want such a boring victory."'
45341: 'LAMBDADELTA@r@v29/62200094."The victory you wanted was for Beato''s game board to be torn to bits,@k@v29/62200095. and for Beato''s true, pathetic form to be exposed, humiliated, and trampled on.@k@v29/62200096. ......But this victory of Battler''s isn''t quite like that, is it...?"'
45342: 'BERNKASTEL@r@v28/62100107."......All this about love......and promises.@k@v28/62100108. ......To end the game quietly and let her rest in peace?@k @v28/62100109.......That sort of ending would make anyone vomit."'
45343: 'BERNKASTEL@r@v28/62100110."I didn''t give Battler all that advice so that he could end things like that.@k@v28/62100111. ......I had his little sister turned to scrap meat behind his back.@k@v28/62100112. I had his parents and family killed horribly over and over again.@k@v28/62100113. That was all to spark a desire for revenge against Beato."'
45344: 'BERNKASTEL@r@v28/62100114."And now............what kind of an ending is this...?@k @v28/62100115.Have I won?@k @v28/62100116.Of course not! ......Battler''s gotten his hands on a victory that neither you nor I can stand."'
45345: 'BERNKASTEL@r@v28/62100117."...I came all the way out here to see BEATRICE lamely and pathetically torn to bits,@k@v28/62100118. and I endured a staggering period of boredom just for that one purpose.@k@v28/62100119. I didn''t come here to sip from a.........rotten yogurt fragment like this!"'
45346: 'LAMBDADELTA@r@v29/62200097."Ahh, your angry face is wonderful too, Bern.@k@v29/62200098. ......I get it, so you wanted at least one final something to get the bad taste out of your mouth."'
45347: 'BERNKASTEL@r@v28/62100120."It''s all the fault of this moron piece screwing up last game!@k@v28/62100121. Because of you, the first game board in centuries that looked like it might be a bit of fun for me...@v28/62100122.is all...@|@y@v28/62100123.wasted...!!@|@y@k @v28/62100124.Filth,@|@y@v28/62100125. trash,@|@y@v28/62100126. scum!!"@|@y'
45348: 'Erika@r@v46/64500722."...M-......my apologies, ...my master......@k@v46/64500723. ......I will definitely...bring you a victory, ......so please forgive me......"'
45349: 'BERNKASTEL@r@v28/62100127."If you couldn''t win with the detective''s authority in the last game,@k@v28/62100128. how do you expect to defeat Battler now that he''s the Game Master...?@k @v28/62100129.You don''t have a chance at winning even with the detective''s authority.@k@v28/62100130. ......So why bother with it?"'
45350: 'Erika@r@v46/64500724."I......uh............"'
45351: 'LAMBDADELTA@r@v29/62200099."Yeah, if you can''t win anyway, then who needs the detective''s authority?@k@v29/62200100. A certain loss becomes even more certain, big whoop."'
45352: 'BERNKASTEL@r@v28/62100131."And therefore, if you manage to win in this even worse situation,@k@v28/62100132. ......that would be a miracle worthy of me.@k@v28/62100133. If and only if you can do that, I''ll be able to forgive you."'
45353: 'Erika@r@v46/64500725."Y-yes.@k@v46/64500726. ......I will surely...show you that miracle...!"'
45354: 'BERNKASTEL@r@v28/62100134."You@|@y@v28/62100135.@|@y wish you could, disgusting pukespittle."'
45355: 'BERNKASTEL@r@v28/62100136."The best you can do is take part in the worst punishment game ever for the worst game ever,@k@v28/62100137. with your only weapon, the detective proclamation, taken away from you, humiliating yourself until you have no dignity left,@k@v28/62100138. and through it all, you''ll roll onto your back like a dog and beg for my affection.@k@v28/62100139. Your purpose, pukespittle, is to make me laugh."'
45356: 'Erika@r@v46/64500727.".........uugh..."'
45357: '@r@v10/60100495."......Sounds like you''re having a great time in here.@k@v10/60100496.Am I interrupting?"'
45358: '@rGold butterflies gathered in the darkness and took the shape of Battler.'
45359: '@rThough he had just arrived, he seemed to realize immediately that the mood was dark.'
45360: 'BERNKASTEL@r@v28/62100140.".........Ah, Battler.@k@v28/62100141. I had a look at your first twilight.@k@v28/62100142. Quite impressive locked rooms.@k@v28/62100143. I''m sure you''re more talented than Beato."'
45361: 'Battler@r@v10/60100497."It''s just a rehash of the locked rooms Beato made in the past.@k@v10/60100498. I''ll take that to be a compliment for Beato."'
45362: 'LAMBDADELTA@r@v29/62200101."It seems your fight with Erika wasn''t bad either.@k@v29/62200102. Think your serial murders will move along smoothly?"'
45363: 'Battler@r@v10/60100499."......Who knows?@k@v10/60100500. My role isn''t to carry out serial murders.@k@v10/60100501. It''s to use that process to demonstrate locked rooms that are impossible without magic,@k@v10/60100502. and thereby achieve victory for the witch side and prove that I have fully understood this game.@k@v10/60100503. ......No, there''s one more thing."'
45364: 'BERNKASTEL@r@v28/62100144."What......?"'
45365: 'Battler@r@v10/60100504."To settle the score with Erika, since our previous duel ended in an even tie."'
45366: 'Erika@r@v46/64500728.".........Battler......"'
45367: 'BERNKASTEL@r@v28/62100145."Ev...en......tie...?"'
45368: '@rBERNKASTEL noticeably grimaced.@k@rErika averted her eyes and hung her head, timidly...'
45369: 'Battler@r@v10/60100505."I know what you''re thinking.@k@v10/60100506. That wasn''t a draw,@k@v10/60100507. you should have won easily so it counts as a loss."'
45370: 'LAMBDADELTA@r@v29/62200103."Hey,@k@v29/62200104. it''s not polite to eavesdrop."'
45371: 'Battler@r@v10/60100508."......Look in a mirror.@k@v10/60100509. It''s written all over your faces."'
45372: 'LAMBDADELTA@r@v29/62200105."No way...!@k @v29/62200106.Where?!@k@v29/62200107. Hey, what''s going on?!@k @v29/62200108.If you tell me it''s written in ink only morons can''t see, then death, death, super death for you!!"'
45373: '@rLAMBDADELTA pulled a mirror out of thin air, peered into it, and made a comical fuss.@k She was apparently playing the fool in her own, special way.'
45374: 'Battler@r@v10/60100510.".........Erika."'
45375: 'Erika@r@v46/64500729."Wh-......what is it?"'
45376: 'Battler@r@v10/60100511."That storm of red and blue from you and Dlanor in the last game...was spectacular."'
45377: 'Erika@r@v46/64500730."......Th-.........thanks."'
45378: 'Battler@r@v10/60100512."What happened to Dlanor this time?@k@v10/60100513. Are you by yourself?"'
45379: 'Dlanor@r@v47/64600129.".........NO.@k@v47/64600130. ......I have been waiting HERE."'
45380: '@rDlanor had been just standing around in reserve,@k hiding her presence in the dark shadows...'
45381: 'Erika@r@v46/64500731."Well, when she can''t use her red longsword, Dlanor is just useless pukespittle.@k@v46/64500732. There''s no point having her around, so I''ve dropped her from the action."'
45382: 'Dlanor@r@v47/64600131."............All I can do now is keep records of Lady ERIKA''s REASONING."'
45383: 'Battler@r@v10/60100514."Why won''t you fight with her?@k@v10/60100515. Why can''t you use that red longsword?@k@v10/60100516. ......Erika''s reasoning...and your longsword.@k@v10/60100517. They were strong because they worked together."'
45384: 'Dlanor@r".............................."'
45385: '@rDlanor didn''t answer.@k She just glanced slightly at BERNKASTEL''s expression.'
45386: '@r......However, that glance was the same as a clear answer for Battler now.'
45387: '@rBattler fully realized the situation......'
45388: 'Battler@r@v10/60100518."You.@k@v10/60100519. You''re the one who told Erika not to use the detective proclamation."'
45389: 'BERNKASTEL@r@v28/62100146."......Oh? Whatever do you mean?"'
45390: 'Battler@r@v10/60100520."This fight is between me and Erika.@k@v10/60100521. .........We''re going to fight with all we''ve got.@k@v10/60100522. That way, we''ll be able to accept it whether we win or lose.@k@v10/60100523. There''s no need for a puppeteer behind the scenes like you."'
45391: 'BERNKASTEL@r@v28/62100147."......Come now, I''m no puppeteer.@k@v28/62100148. I''m just a theatergoer trying to relieve her boredom."'
45392: 'Battler@r@v10/60100524."A theatergoer is someone who sits quietly in the stands and watches.@k@v10/60100525. That''s not what we call someone who jeers at the stage and threatens or manipulates the performers."'
45393: 'BERNKASTEL@r@v28/62100149."Sorry for being an ill-mannered patron.@k@v28/62100150. ......You might not know it, but I''ve already paid a huge admission fee to watch this play.@k @v28/62100151.Sorry, but I intend to enjoy it until I get my money''s worth."'
45394: 'Battler@r@v10/60100526."If you get in the way of the game''s progression, I can use my authority as the Game Master to boot you out of this game."'
45395: 'BERNKASTEL@r@v28/62100152."If you want to, go ahead.@k @v28/62100153.If you chase me out, then I''ll head back with my piece, Erika.@k@v28/62100154. This game will be cancelled, and you won''t be able to prove that you''ve reached the truth.@k@v28/62100155. ......Theatergoers are observers.@k@v28/62100156. A truth with no observers might as well be fantasy.@k@v28/62100157. ......If you want to end Beato''s game, you need a theatergoer as an impartial witness."'
45396: 'Battler@r@v10/60100527."......Our truth is between us, and that''s all it needs to be!@k @v10/60100528.If you''re going to interfere any further, I will boot you out by force.@k@v10/60100529. ......Then you can writhe around in boredom for a few centuries until you find another way to kill time."'
45397: 'BERNKASTEL@r@v28/62100158."Then go right ahead!@k@v28/62100159. Erika, this game is over! Good work.@k@v28/62100160. ......You were completely useless.@k@v28/62100161. You weren''t able to overturn the dishonor of your loss, so as promised, I''ll throw you into the worst fragment...@k@v28/62100162.and cast you into the depths of oblivion with the empty popcorn buckets!!"'
45398: 'Erika@r@v46/64500733."M-......my master...!@k @v46/64500734.I promise...I promise I will win...I promise I can win...!!@k @v46/64500735.So please, ......let me fight Battler to the finish...!!@k @v46/64500736.I don''t......want to lose and......g-get thrown in the d-...depths of......oblivion......@k@v46/64500737.......*hic*.........*hic*......"'
45399: 'BERNKASTEL@r@v28/62100163."......Well, I''d like to watch your battle until the end.@k @v28/62100164.......But Battler says he''ll toss me out.@k@v28/62100165. Well, any ideas, Lambda?!"'
45400: 'LAMBDADELTA@r@v29/62200109."Okay, okay......I realize you''ve been irritated ever since the last game, Bern, but calm down a bit.@k@v29/62200110. ......And Battler, don''t provoke Bern so much.@k@v29/62200111. This kid can''t control her emotions sometimes."'
45401: 'BERNKASTEL@r@v28/62100166."Shut up...@k@v28/62100167. Who can''t control her emotions...?!"'
45402: '@rBERNKASTEL, who, at one point in time, had never showed any expressions at all,@k was now twisting her face into all kinds of displeased and ugly shapes.'
45403: '@rWhen LAMBDADELTA made fun of that,@k BERNKASTEL clicked her tongue and looked away.'
45404: '@rAs they say, nothing can stop poison but poison.@k ......Apparently, LAMBDADELTA was the only one who could rein BERNKASTEL in.'
45405: 'LAMBDADELTA@r@v29/62200112."......Erika, you want to fight Battler, clear your name, and get Bern back into a good mood, right?"'
45406: 'Erika@r@v46/64500738."Y-......yes..."'
45407: 'LAMBDADELTA@r@v29/62200113."Battler, you want this "final game" that''ll prove you''ve found the truth...@k@v29/62200114.to have a proper, tidy conclusion, right?"'
45408: 'Battler@r@v10/60100530."......Yeah.@k@v10/60100531. This is a face-off between me and Erika.@k@v10/60100532. I won''t let anyone get in my way,@k@v10/60100533. and I won''t let anyone get in Erika''s way either."'
45409: 'Erika@r@v46/64500739."...B-.........Battler............"'
45410: 'LAMBDADELTA@r@v29/62200115."If both of you wish to fight, then that should be respected.@k@v29/62200116. ......Leave Bern to me.@k@v29/62200117. I''m the only one in the world who can calm that kid when she gets into a bad mood."'
45411: 'Battler@r@v10/60100534."......You''re the same sort as her, ......but at least you can be reasoned with."'
45412: 'LAMBDADELTA@r@v29/62200118."...........................@k@v29/62200119. ......You shouldn''t underestimate me.@k@v29/62200120. I just like seeing Bern grimace.@k@v29/62200121. That''s the only reason I''ve taken a liking to this game of yours.@k@v29/62200122. .........If you go on thinking I''m easy to handle, you''ll get worse than burned."'
45413: 'Battler@r@v10/60100535.".........Hmph."'
45414: 'LAMBDADELTA@r@v29/62200123."Dlanor can''t use her red longsword because the detective proclamation hasn''t been made.@k@v29/62200124. If Erika makes that, she''ll regain her power right away. Right?"'
45415: 'Dlanor@r@v47/64600133."......YES.@k@v47/64600134. When that time comes, forgive ME."'
45416: 'Battler@r@v10/60100536."Erika."'
45417: 'Erika@r@v46/64500740."What...?"'
45418: 'Battler@r@v10/60100537."Make the detective proclamation."'
45419: 'Erika@r@v46/64500741.".....................@k@v46/64500742. ......No."'
45420: 'Battler@r@v10/60100538."Do you really think you can beat me as I am now without the detective''s authority?"'
45421: 'Erika@r@v46/64500743.".........I...I can win......"'
45422: 'Dlanor@r@v47/64600135."......Lord BATTLER.@k@v47/64600136. ...Lady ERIKA is herself a PIECE.@k@v47/64600137. She cannot disobey her master''s ORDERS.@k@v47/64600138. All she can do is gather the power permitted to her......and fight for SURVIVAL."'
45423: 'Battler@r@v10/60100539."And Dlanor, your power can''t be used at all without the detective proclamation?"'
45424: 'Dlanor@r@v47/64600139.".........In order to unsheathe the Red Key, authorization is REQUIRED.@k@v47/64600140. One of the preconditions for applying for that authorization is the detective PROCLAMATION."'
45425: 'Battler@r@v10/60100540."Is there any other way to obtain that authorization besides the detective proclamation?"'
45426: 'Erika@r@v46/64500744."Wh-......what are you saying...?!@k @|@y@v46/64500745.I-if you''re doing this out of pity for me, I don''t need your help!"'
45427: 'Battler@r@v10/60100541."Quiet.@k@v10/60100542. You''re no challenge on your own and it''s boring me stiff.@k@v10/60100543. So zip it, you non-detective detective."'
45428: 'Erika@r@v46/64500746."......Ghh.................."'
45429: 'Dlanor@r@v47/64600141."The Red Key has an extremely close relationship with the red TRUTH.@k@v47/64600142. ......If and only if a "truth" is provided, I am permitted to draw the Red Key for items that pertain to IT."'
45430: 'Battler@r@v10/60100544."What do you mean by a "truth"...?"'
45431: 'Dlanor@r@v47/64600143."...........................@k@v47/64600144. ......For example, ......there are Lady ERIKA''s duct tape SEALS."'
45432: 'Battler@r@v10/60100545."Ah, ......those."'
45433: 'Dlanor@r@v47/64600145."Lady BERNKASTEL has already acknowledged that those seals are equivalent in value to the red TRUTH.@k@v47/64600146. Therefore, I am authorized to draw the Red Key for truths pertaining to those SEALS."'
45434: 'Battler@r@v10/60100546."Those caused me a lot of trouble last time,@k@v10/60100547. so I had all the sticky duct tape removed from the game board this time around."'
45435: 'Dlanor@r@v47/64600147."......A splendid MOVE."'
45436: 'Battler@r@v10/60100548."............Erika was proud to be able to call herself the detective, wasn''t she?"'
45437: 'Dlanor@r@v47/64600148."YES...@k@v47/64600149. ......Though her only goal was to irresponsibly reveal mysteries, ......it was a matter of pride for HER."'
45438: 'Battler@r@v10/60100549."Then, she must really be suffering now that she can''t make that proclamation."'
45439: 'Dlanor@r@v47/64600150."...............Only she could tell you THAT."'
45440: 'Battler@r@v10/60100550."................................."'
45441: '@rBattler took a deep breath, then hung his head in thought for a time.'
45442: '@r......Erika was his enemy,@k but she was the player on the Human side, and without her, there would be no game.'
45443: '@rIt had been the same way with the old Beato.'
