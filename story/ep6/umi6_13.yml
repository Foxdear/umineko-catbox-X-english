45468: 'LAMBDADELTA@r@v29/62200125."Whew, what a man!@k @v29/62200126.Aren''t you lucky, Erika?!@k @v29/62200127.Now you can use a bit of red without making the detective proclamation and irritating your master."'
45469: 'Erika@r@v46/64500754.".........Y-...you''ll regret this...@k@v46/64500755. ......These three seals......will be your death......!"'
45470: 'Battler@r@v10/60100571."Sounds like fun.@k@v10/60100572. Come and kill me."'
45471: 'Erika@r@v46/64500756."......Gah.........khhhh..."'
45472: '@rThough it was only for three rooms, it was the red truth that Erika had been dying to use.'
45473: '@rNow, she finally had enough leeway to fight as she pleased.'
45474: '@r......She ground her teeth at being pitied by Battler, but her tears were not those of shame.'
45475: 'Dlanor@r@v47/64600156."......UNDERSTOOD.@k@v47/64600157. Three rooms'' worth of duct tape seals, ACCEPTED.@k@v47/64600158. ......Regarding this matter, should we consider them as being accepted retroactively, back when Lady ERIKA received the non-sticky duct tape from Mrs. Kumasawa?"'
45476: '@rErika had borrowed duct tape from Kumasawa to make seals with.'
45477: '@rHowever, Battler had made it so that those were not sticky...'
45478: '@rIf he made it so that there never was any problem with the stickiness of that duct tape, the transition could be made smoothly.'
45479: 'Battler@r@v10/60100573."Sure, that''s fine.@k@v10/60100574. ......I''ll rewrite the tale.@k@v10/60100575. ......The duct tape that Erika received from Kumasawa-san late at night on the first day was sticky enough to work as a seal,@k@v10/60100576. but there was only enough left to use on three rooms.@k@v10/60100577. ......I''ll apply that from here on out."'
45480: 'Dlanor@r@v47/64600159."UNDERSTOOD.@k@v47/64600160. ......Lady Erika will also retroactively adjust her movements, starting before the discovery of the first twilight and taking into account that the application of this privilege is now possible.@k@v47/64600161. ......As soon as these changes affect the progression of the game, they will be reported to the Game MASTER."'
45481: 'Battler@r@v10/60100578.".........Letting you do it retroactively, even though you know which rooms the crime will occur in...@k@v10/60100579. ...That gives you a pretty big advantage.@k@v10/60100580. You won''t have to waste tape on other rooms."'
45482: 'BERNKASTEL@r@v28/62100168."It seems you''ve grown quite arrogant since becoming Game Master.@k@v28/62100169. You''re having fun, aren''t you?@k @v28/62100170.Giving out charity to your pathetic opponent."'
45483: 'Battler@r@v10/60100581."Quiet.@k@v10/60100582. And don''t misunderstand.@k@v10/60100583. ......I''m not being arrogant or going easy on her.@k@v10/60100584. .........Erika, use this weapon and fight me with all your strength.@k@v10/60100585. And I will crush you with all of mine.@k@v10/60100586. So hold your head high as you use those three.@k@v10/60100587. That is all."'
45484: '@rBattler made to leave the room with a flick of his cape.'
45485: '@rAs he did, he thought he heard Erika let out a strained voice calling him to a stop.'
45486: 'Battler@r@v10/60100588.".....................@k@v10/60100589. ......What is it?"'
45487: 'Erika@r@v46/64500757.".............................."'
45488: 'Battler@r@v10/60100590."If you have no business with me, I''m going.@k@v10/60100591. Make sure you talk with Dlanor.@k@v10/60100592. Don''t listen to those obnoxious witches, whatever they tell you.@k@v10/60100593. As long as they''re on this game board, they''ll obey my rules."'
45489: 'Erika@r@v46/64500758.".........Tha-.........thank you........."'
45490: 'Battler@r@v10/60100594."..........................."'
45491: 'Erika@r@v46/64500759."...Thank you......@k@v46/64500760. ......I''ll...fight with all I''ve got...@k@v46/64500761. I''ll come at you with all my strength, .........so, ...I''ll defeat you no matter what, so,@k@v46/64500762. ......so, ......if you do win against me, .........please...@k@v46/64500763.......crush me with all your strength...@k@v46/64500764. *hic*......@k@v46/64500765. ......Please......don''t leave......a speck of me behind.........@k@v46/64500766. ......*hic*......!"'
45492: 'Battler@r@v10/60100595.".....................@k@v10/60100596. .........You got it.@k@|@y@v10/60100597. ...And don''t you go easy on me, either.@k@v10/60100598. ......This is the final game.@k@v10/60100599. I''m playing to prove to Beato that I''ve reached the truth.@k@v10/60100600. ......At this point, who wins and who loses has no effect on that."'
45493: 'Battler@r@v10/60100601."I''ve accepted you as a worthy adversary, and now I simply want to settle the score.@k@v10/60100602. .........In the game, let us suspect each other over everything as enemies.@k@v10/60100603. But as fellow players, let''s trust each other.@k@v10/60100604. ......That''s how this game is supposed to be played."'
45494: 'Erika@r@v46/64500767."......Yes......@k@v46/64500768. ......Thank you......@k@v46/64500769. .........Thank you............uuughhu......"'
45495: '@rBattler departed into the darkness, became a cloud of gold butterflies, and vanished...@k@rErika remained behind, sobbing......'
45496: 'Erika@r@v46/64500770.......uuughhu......*hic*......@k@v46/64500771. Just@v46/64500772.@|@y kidding'
45497: 'Erika@r@v46/64500773."You''re easy pickings, you stupid man.@k@v46/64500774. ......You fell right for it and gave me the tape...!@k @v46/64500775.......You gave...the great Furudo Erika...@k@v46/64500776.......duct tape...!!"@|@y'
45498: '@rIt was hard to imagine that the person who had been sobbing pathetically and this person now were the same individual.@k ......That''s how vile her face contorted to be...'
45499: '@rThe two witches were also cackling with ugly smiles...'
45500: 'LAMBDADELTA@r@v29/62200128."I totally feel him.@k@v29/62200129. When you become Game Master, it feels like you''ve become God and you get all sure of yourself, you kno~w?"'
45501: 'BERNKASTEL@r@v28/62100171.".........It was the same for you, wasn''t it, Lambda?@k@v28/62100172. ......You lost because you made a bonehead mistake involving walking corpses.@k@v28/62100173. .........Bonehead Game Masters, bonehead blunders, bonehead arrogance, bonehead beatings, bonehead Battler, billions of boneheads.@k@|@y@v28/62100174. *giggle*giggle*giggle*giggle*!!"'
45502: 'Erika@r@v46/64500777."Bonehead beatings, bonehead Battler, billions of boneheads.@k@v46/64500778. Ahahahahaha, I like the way it rolls off the tongue.@k@v46/64500779. Nice one, my master.@k@v46/64500780. *giggle*giggle*!@k @v46/64500781.Bonehead Battler, billions of boneheads, bonehead Battler, billions of boneheads."'
45503: 'BERNKASTEL@r@v28/62100175."If that bonehead Battler honestly thinks that Erika''s at a disadvantage, then it was nice knowing him.@k@v28/62100176. ......A detective proclamation isn''t what you need to kill an idiot."'
45504: 'LAMBDADELTA@r@v29/62200130."Just a corner of tofu for them to hit their head on?"'
45505: 'Erika@r@v46/64500782."Make that soft tofu."'
45506: 'BERNKASTEL@r@v28/62100177."Add some gochujang chili paste and you''ve got a snack that''d go great with some wine.@k@|@y@v28/62100178. *giggle*giggle*giggle*!"'
45507: '@rThe three giggled together...'
45508: '@rIt had all been an act to get the duct tape for the seals from Battler...'
45509: '@rEven though he had taken pains to ensure that the duct tape that had tormented him so much in the last game was rendered unusable in this one,@k ......he had fallen for Erika''s act,@k ......and she had gotten what she wanted, even if it was only three rooms'' worth.'
45510: '@rThe illusion that Erika was at an overwhelming disadvantage was just an act.'
45511: '@r......A trap to trick Battler and make him hand over the duct tape.'
45512: 'Erika@r@v46/64500783."With this, I can kill Battler perfectly...!@k @v46/64500784.I figured out his moronic locked rooms long ago...!@k @v46/64500785.A perfect locked room?@k @v46/64500786.Dumbaaaaaaaaaaaaass!!"'
45513: 'Erika@r@v46/64500787."I''ll show you a real perfect locked room!@k @v46/64500788.And I could cry for joy at the fact that you gave me the weapon that will finish you...!@k @v46/64500789.My master! And Lady LAMBDADELTA...!@k @v46/64500790.Thank you so much for assisting with my performance!"'
