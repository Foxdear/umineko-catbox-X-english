45536: 'George@r@v07/60300435."Yeah.@k@v07/60300436. ......And of course, the same goes for Battler-kun''s group."'
45537: 'Battler@r@v10/60100605.".........Of course.@k@v10/60100606. I doubt anyone here is so naive that they hope to win by having the others relinquish victory."'
45538: 'BEATRICE@r@v27/60700734."Right...@k@v27/60700735. ......Anyone weak enough to drop out wouldn''t be qualified to be here right now."'
45539: '@rEven Beato, who seemed to be the shakiest one of the six, was strongly determined.'
45540: '@rThe two demons nodded, taking note of the six''s continued resolve.'
45541: 'George@r@v07/60300437."So, what''s the next trial?@k @v07/60300438.Don''t tell me you still haven''t decided..."'
45542: 'Zepar@r@v51/65100100."Well, we thought at least some of you would drop out."'
45543: 'Furfur@r@v52/65200096."We didn''t think that you all would remain.@k@v52/65200097. This is a happy miraculous miscalculation due to love!"'
45544: 'Jessica@r@v04/60200370."Cram it.@k@v04/60200371. ......So?@k @v04/60200372.Are we going to play musical chairs or something to make sure someone drops out this time?"'
45545: '@r@v00/awase6034_o.""Yes, precisely that!""'
45546: 'Zepar@r@v51/65100102."We''ve decided to have this trial eliminate one group no matter what!"'
45547: 'Furfur@r@v52/65200099."For this trial, we will borrow from the second twilight of the epitaph—"'
45548: '@r@v00/awase6035.""''Tear apart the two who are close!!''@k@v00/awase6036_o. Ahahahahahahahahahahahahaha!""'
45549: 'Kanon@r@v16/60600320."......I don''t understand."'
45550: 'Shannon@r@v15/60500288."Zepar-sama, Furfur-sama......what sort of trial is this?@k@v15/60500289. ......Do you mean we''re going to kill each other...?"'
45551: 'Battler@r@v10/60100607."That''d settle things quickly."'
45552: 'George@r@v07/60300439."Though it''s not exactly civilized."'
45553: 'Jessica@r@v04/60200373."Love is carnivorous."'
45554: 'BEATRICE@r@v27/60700736."......We can''t all just find happiness together......can we..."'
45555: 'George@r@v07/60300440."This is what they call a zero-sum game.@k@v07/60300441. It''s an economic term, but maybe you''ve heard of it...?"'
45556: 'BEATRICE@r@v27/60700737."N-...no, my apologies......"'
45557: 'Battler@r@v10/60100608."In a zero-sum game...all the wins and losses cancel out to zero.@k@v10/60100609. ......In order for someone to win, someone else must be forced to lose.@k@v10/60100610. ......It''s the ruthless way of this world."'
45558: 'Jessica@r@v04/60200374.".........Heh.@k@v04/60200375. ......If only everyone...@k@v04/60200376.could be happy.@k@v04/60200377. .........But I guess......there''s no way an ideal world like that could exist."'
45559: 'Furfur@r@v52/65200102."No, there is!"'
45560: 'Zepar@r@v51/65100105."That is the Golden Land!"'
45561: 'Jessica@r@v04/60200378."......The Golden Land...?@k @v04/60200379.What are you talking about......?"'
45562: 'Battler@r@v10/60100611.".........That''s right.@k@v10/60100612. If you reach the Golden Land, ......all love will be satisfied.@k@v10/60100613. ......However, like heaven and hell, that''s not a place in this world."'
45563: 'George@r@v07/60300442."That''s an offer I would have to refuse.@k@v07/60300443. ......Love has meaning because we find it in this world.@k@v07/60300444. I could never support a sad lovers'' double suicide where we are only united after death.@k@v07/60300445. ......I will see my love through, alive.@k@v07/60300446. I won''t lose to anyone."'
45564: 'Shannon@r@v15/60500290."......George-san..."'
45565: '@rThe door to the Golden Land is opened by solving the epitaph''s riddle......'
45566: '@rIt is said to be a place where love and lives are all whole and can be revived......'
45567: 'Kanon@r@v16/60600321."We''re straying from the point.@k@v16/60600322. ......Tell us about the second trial already."'
45568: 'Jessica@r@v04/60200380."Right.@k@v04/60200381. ......What''re you trying to make us do with this "tear apart the two who are close" thing...?"'
45569: 'Zepar@r@v51/65100106."It is quite simple!"'
45570: 'Furfur@r@v52/65200103."The only possible way to tear apart two lovers is by the sad farewell of death!"'
45571: 'Zepar@r@v51/65100107."The second trial is to kill one of the six!"'
45572: 'Furfur@r@v52/65200104."Of course, any lover with their partner killed is disqualified."'
45573: 'Zepar@r@v51/65100108."In short, one pair of lovers must drop out during this trial!"'
45574: 'Battler@r@v10/60100614."......You say "kill" so simply.@k@v10/60100615. ......What are we supposed to do?"'
45575: 'Zepar@r@v51/65100109."You can fight to the death—"'
45576: 'Furfur@r@v52/65200105."Or you can decide by a lottery of some sort."'
45577: 'Jessica@r@v04/60200382."Like hell we''re gonna choose by drawing lots.@k@|@y@v04/60200383. Let''s have a duel, fair and square."'
45578: 'George@r@v07/60300447."......Though if we do that, I imagine that Battler-kun, who is the Game Master,@k@v07/60300448. and BEATRICE, who is still the Golden Witch despite having no memory, ......will have a substantial advantage."'
45579: 'BEATRICE@r@v27/60700738."Ah, ......w-......well, I wonder about that..."'
45580: 'Zepar@r@v51/65100110."Don''t worry!@k @v51/65100111.For this trial, we have made everyone''s powers completely equal."'
45581: 'Furfur@r@v52/65200106."Even the Game Master, Lord BATTLER, is taking this trial on an even footing with everyone else."'
45582: 'BEATRICE@r@v27/60700739."In that case, ......it''s fair......"'
45583: 'George@r@v07/60300449."Is it completely and purely even?"'
45584: '@r@v00/awase6037_o.""Yes, perfectly even!@k @v00/awase6038.In a one-on-one fight, the luck of the moment would determine the outcome!""'
45585: 'Zepar@r@v51/65100114."As all is perfectly equal—"'
45586: 'Furfur@r@v52/65200109."It''ll probably take a while to finish a fight."'
45587: 'Zepar@r@v51/65100115."So perhaps the trick would be to attack in advantageous circumstances?"'
45588: 'Furfur@r@v52/65200110."Duels that take time are, of course, wonderful too!"'
45589: 'Jessica@r@v04/60200384."Why would anyone leave it up to luck?@k@v04/60200385. .........Of course we want the fight to be in our favor."'
45590: 'BEATRICE@r@v27/60700740.".........In that case, ......a three-way struggle...?@k @v27/60700741.......Wouldn''t that mean we''d all be stuck...?"'
45591: '@rBeato was the first to notice.'
45592: '@rIf all six of them were truly on an even footing, and they wanted to fight so that they could win, they would have to fight as pairs and concentrate their attacks on a single person.'
45593: '@rHowever, if they did so, that person''s partner would naturally join in to fight back as a pair.'
45594: '@rIn other words, it would never end up as two against one.'
45595: '@rIt would be two against two, and a battle like that could go either way.'
45596: '@rHowever, if that were to happen, the third pair watching all this...@kcould team up with whichever pair they liked with no risk to themselves, defeating the opposing pair with certainty...'
45597: 'George@r@v07/60300450."Sounds troublesome.@k@v07/60300451. ......It means that it isn''t to your advantage to move first."'
45598: '@rIf you take the initiative to fight, it''s a matter of luck.@k@rIf you sit and wait for the others to start fighting, it''s certain victory.'
45599: '@r......The fight would never begin in circumstances like this...'
45600: 'Kanon@r@v16/60600323."......Maybe we could just have everyone fight the person next to them one on one.@k@v16/60600324. ......Then, as soon as one fight is settled, the trial will be over."'
45601: '@rUnless everyone could abandon any naive hopes for a two-on-one fight,@k this trial would never begin and never end.'
45602: '@rIn that case, they could make a gentlemen''s agreement and have everyone duel at once,@k which would be no different from drawing lots, ......but at least it would be fair...'
45603: 'Shannon@r@v15/60500291."That won''t work.@k@v15/60500292. If we do that, everyone will just defend instead of fighting proactively.@k@v15/60500293. All they need to do is wait for someone to lose before they do."'
45604: '@rShannon''s point was a sound one.'
45605: '@rIf both fighters just glared at each other without attacking,@k then neither would lose.'
45606: '@rThey would only have to wait for someone other than themselves to lose first.'
45607: '@rThis brought them back to the starting point.@k ......No one would fight proactively.'
45608: 'BEATRICE@r@v27/60700742."In the end, no one will move, and nothing will be resolved..."'
45609: 'Battler@r@v10/60100616.".........Since we''re in this mathematical situation where we all have the same strength, ......it''s almost like a puzzle."'
45610: 'George@r@v07/60300452."True.@k@v07/60300453. ......Dueling would have been an interesting proposition if our strengths were unknown.@k@v07/60300454. ......However, since we''ve been told that we''re perfectly even, a duel would be no different than rock-paper-scissors."'
45611: 'Shannon@r@v15/60500294."......In that case, ......why not use rock-paper-scissors to decide it......?"'
45612: 'Jessica@r@v04/60200386."Are you crazy...?! I''m not gonna do that!@k @|@y@v04/60200387.Even if someone does lose, there''s no way they''d accept their loss!"'
45613: 'Kanon@r@v16/60600325.".........If they don''t accept it, then they will be attacked by the four winners.@k@v16/60600326. ......In a world where all are equal, the losers will have no chance of surviving..."'
45614: 'Battler@r@v10/60100617."True.@k@v10/60100618. ......Huh.@k@v10/60100619. Is rock-paper-scissors actually the most reasonable way to settle this?"'
45615: 'George@r@v07/60300455."It is extremely reasonable.@k@v07/60300456. However, if you were to ask me whether I''d be reckless enough to entrust my fate to a random number generator, the answer would be no."'
45616: 'Zepar@r@v51/65100116."Please do consider that problem...!"'
45617: 'Furfur@r@v52/65200111."This is the second trial we have set for you!"'
45618: '@r@v00/awase6039.""Think, and fight to the death!@k @|@y@v00/awase6040_o.Please decide who the sacrifice will be!!""'