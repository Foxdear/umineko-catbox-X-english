45451: 'Battler@r@v10/60100554."However, you have talented people on your side.@k@v10/60100555. ......Dlanor, ......Gertrude, and Cornelia.@k@v10/60100556. You aren''t alone.@k@v10/60100557. You have allies."'
45452: 'Erika@r@v46/64500748."Except that they''re unreliable, powerless, and useless pukespittle."'
45453: 'Battler@r@v10/60100558."Dlanor.@k@v10/60100559. ......Just like I was supported by VIRGILIA and Ronove in the past, Erika needs support as well.@k@v10/60100560. I know from repeated experience that playing for the Human side is tough."'
