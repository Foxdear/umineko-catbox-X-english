45457: 'Erika@r@v46/64500749."Hmph.@k@v46/64500750. You can''t even use the red truth!"'
45458: 'Battler@r@v10/60100561."Erika.@k@v10/60100562. ......I will give power, not to you, but to your allies."'
45459: 'Erika@r@v46/64500751."Huh?!@k @v46/64500752.Wh-what do you think you''re doing...?!@k @v46/64500753.I''d rather die than receive your pity!!"'
45460: 'Battler@r@v10/60100563."For the trio of Dlanor, Gertrude, and Cornelia,@k@v10/60100564. ......Erika,@k@v10/60100565. I will allow you to use three rooms'' worth of those duct tape seals."'
45461: '@rTo fully seal one room, multiple seals are needed to cover all the doors and windows.'
45462: '@rIf he had just said "three seals", she would only be able to fully seal up one room at best.'
