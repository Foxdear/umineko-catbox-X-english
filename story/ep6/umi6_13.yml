45519: 'Erika@r@v46/64500791."Alright!@k @v46/64500792.Let''s use these seals at our leisure...!@k @v46/64500793.You were a great help too, Dlanor.@k@v46/64500794. It seems that Battler trusts you, so he believes every word you say."'
