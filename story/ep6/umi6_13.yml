45464: 'Dlanor@r@v47/64600153."......Lord BATTLER......"'
45465: 'Battler@r@v10/60100566."As the Game Master, I will also acknowledge that these seals have the same effect as the red truth.@k@v10/60100567. ......This way, you''ll also be able to wield that red longsword in battles based around those seals.@k@v10/60100568. Right...?"'
