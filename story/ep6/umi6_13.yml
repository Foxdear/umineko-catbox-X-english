45525: 'Dlanor@r@v47/64600164.".........You knew that this was a no-holds-barred FIGHT...@k@v47/64600165. .........Foolish, Lord BATTLER.@k@v47/64600166. This is, without a doubt, the result of your ARROGANCE."'
