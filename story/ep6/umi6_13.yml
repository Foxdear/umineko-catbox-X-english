45447: '@r....................................'
45448: '@r......I will not misplay Beato''s game.'
45449: 'Battler@r@v10/60100551."Erika.@k@v10/60100552. You''re free not to make the detective proclamation.@k@v10/60100553. So do what you want and fight me with just your Human powers."'
