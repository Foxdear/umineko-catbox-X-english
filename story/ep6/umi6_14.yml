45619: 'Krauss@r@v02/60800043.".........Tr-...true, it isn''t unthinkable...@k@v02/60800044. The servants are the most suspicious..."'
45620: 'Erika@r@v46/64500797."It isn''t as though we have any physical evidence, so we can''t tie them up and throw them in a closet.@k@v46/64500798. So, we need to make sure that they are always within sight of those with guns, and that we keep an eye on them all the time."'
45621: 'Rudolf@r@v08/61200071."Aniki, we should also gather the master keys.@k@v08/61200072. ......Only the servants could have created those locked rooms.@k@v08/61200073. They must have done something with the chain locks using some tool or setup that only the servants know about."'
45622: 'Krauss@r@v02/60800045."......They have all served us for a long time.@k@v02/60800046. I can hardly imagine that they would commit murder..."'
45623: 'Erika@r@v46/64500799."I hear that Kinzo-san is not long for this world, and the inheritance problem is still very shaky.@k@v46/64500800. ......In addition, there''s that story about ten tons of gold being hidden somewhere.@k@v46/64500801. A possible payoff like that might be enough to convince certain people to commit a crime..."'
45624: 'Rudolf@r@v08/61200074."I don''t want to think about it, .........but there''s also a chance that the old bastard is running some bizarre occult ritual.@k@v08/61200075. The servants of the One Wing are his pawns, and they might have been the ones to carry out the murders.@k@v08/61200076. ......How about Dad, anyway?@k@v08/61200077. Have you been able to contact him yet?"'
45625: 'Krauss@r@v02/60800047."N-no...@k@v02/60800048. We aren''t getting through on the extension line either...@k@v02/60800049. The culprits might have broken it.@k@v02/60800050. ......And Father does often leave the receiver off the hook when he''s in a bad mood...@k@v02/60800051. When I knocked, umm......I only received a grumpy reply...@k@v02/60800052. ......We can''t contact him, but that study is well protected.@k@v02/60800053. It''s probably safer there, so it might be best to have him stay there..."'
45626: '@rFlustered, Krauss tried to explain away Kinzo''s silence.'
45627: '@rBattler, the Game Master, hadn''t made "Kinzo''s death" a major theme for this game, so the conversation didn''t go any further.'
45628: '@rThey stopped talking about Kinzo without Rudolf thinking anything was particularly suspicious.'
45629: 'Rudolf@r@v08/61200078."Anyway, we can''t let the servants out of our sights.@k@v08/61200079. I just had a talk with Hideyoshi nii-san about this, and we decided to split everyone into two rooms upstairs and hole up in there."'
45630: 'Krauss@r@v02/60800054."Why two rooms?@k@v02/60800055. Just one would be more secure."'
45631: 'Erika@r@v46/64500802."Well, if we tried to stick 12 people in one room, we''d suffocate.@k@v46/64500803. Plus, I want to isolate the people we need to keep the closest eye on.@k@v46/64500804. There''s Genji-san, the head of the servants. There''s Gohda-san, who is larger than any of us.@k@v46/64500805. And though he may be young, Kanon-san is male too."'
45632: 'Rudolf@r@v08/61200080."I think we need to pay those three special attention, Aniki.@k@v08/61200081. This way, we can isolate that group, and you and I can keep a close eye on them.@k@v08/61200082. With two guns, the pair of us could cooperate on a moment''s notice.@k@v08/61200083. If they make even a single suspicious move......boom!"'
45633: 'Krauss@r@v02/60800056."......Alright. Let''s do that.@k@v02/60800057. ......But Rudolf.@k@v02/60800058. We can''t be certain that they are the culprits.@k@v02/60800059. Don''t be too pushy."'
45634: 'Rudolf@r@v08/61200084."..................You''re telling me not to be pushy?@k@v08/61200085. ...We must be getting old."'
45635: 'Erika@r@v46/64500806."Right now, Hideyoshi-san is upstairs, dividing everyone into the two rooms.@k@v46/64500807. The ones being isolated, we''ll collect into the cousins'' room, and the others will go into the next room over."'
45636: 'Rudolf@r@v08/61200086."Ah, right, Aniki, what about Jessica-chan...?@k@v08/61200087. She insists on being in the same room as you."'
45637: 'Krauss@r@v02/60800060.".........Jessica..."'
45638: 'Erika@r@v46/64500808."We were planning to have five people in the cousins'' room and seven in the adjacent room.@k@v46/64500809. If Jessica-san wants to go to the cousins'' room, it''ll be split clean down the middle.@k@v46/64500810. If this was a wolves and sheep puzzle, there are currently three servant wolves and you two sheep in that room.@k@v46/64500811. I think adding in Jessica-san would be a good idea to balance things out."'
45639: '@rFor a while, Krauss crossed his arms and thought.'
45640: '@rThe cousins'' room would surely be more dangerous, so he wanted his daughter to go into the next room over.'
45641: '@r......However, in an emergency situation like this, he also wanted to keep his daughter where he could see her.'
45642: 'Rudolf@r@v08/61200088."Let''s let her stay with us.@k@v08/61200089. ......We might need her there to make sure we remain good dads and uncles."'
45643: 'Krauss@r@v02/60800061.".........Yes.@k@v02/60800062. I am keeping up a pretense of rationality right now.@k@v02/60800063. ......But I can''t guarantee that my sadness at losing my wife won''t change to anger..."'
45644: '@rEven without any physical evidence, the servants were certainly the most suspicious.'
45645: '@rDuring the long haul ahead of these two men, their weariness and anger and sadness...@k...could make them lose their reason and act out in anger...'
45646: '@rAfter thinking deeply, Krauss decided to accept Jessica''s request,@k in part to prevent this from happening...'
45647: 'Erika@r@v46/64500812."......I think that''s a good idea.@k@v46/64500813. I''m in favor."'
45648: 'Rudolf@r@v08/61200090."I agree.@k@v08/61200091. ......It''s enough that only Rosa and I lose children..."'
45649: 'Krauss@r@v02/60800064.".........Rudolf......"'
45650: '@rIn this way,@k all of the survivors excepting Kinzo split into two groups and holed up in two rooms on the guesthouse''s second floor.'
45651: '@rOne group was in the cousins'' room.@k@rKrauss, Rudolf, Jessica, Genji, Kanon, Gohda.@k@rSix people.'
45652: '@rOne group was in the next room over.@k@rHideyoshi, George, Shannon, Kumasawa, Nanjo, Erika.@k@rSix people here too.'
45653: '@rPerhaps as the result of the killer''s doing, the external phone line had been cut off,@k and they would have to wait for the ferryboat coming the next day before they could contact the police.'
45654: '@rHowever, the weather report had said that the sea would be stormy throughout the next day because of the typhoon.'
45655: '@r......When that happens, the ferryboat takes the day off.@k@rSo, it would probably be two days before the boat came.'
45656: '@rIn other words, they were going to have to spend a full two nights holed up in here...'
45657: '@rWhile Erika and the others held their planning meeting in the lounge, food and blankets had been brought in to prepare for the long road ahead.'
45658: '@rThe sudden tragedy had everyone on edge, but it was already well after 2 a.m.'
45659: '@rIf they really suspected the servants, then the observers couldn''t afford to fall asleep at the same time.'
45660: '@rEither Krauss or Rudolf should probably take a nap right away...'
45661: 'Battler@r@v10/60100620."......Not bad.@k@v10/60100621. Even without the detective''s authority, you''ve managed to control things very skillfully."'
45662: 'Erika@r@v46/64500814."A man who''s lost his cool is no different from an agitated dog.@k@v46/64500815. If you treat them properly, it''s easy to control them."'
45663: '@rOne of the benefits of the detective''s authority was being able to take charge of the situation.'
45664: '@rThis ability was the reason that Erika had been able to order a large number of adults around at will,@k in spite of being both an uninvited guest and a young girl.'
45665: '@rHowever, she didn''t have that power this time.'
45666: '@r......So, Erika had taken charge by making good use of her natural conversation skills and techniques for controlling men...'
45667: 'Battler@r@v10/60100622."The detective''s authority is the same as magic.@k@v10/60100623. ......It can''t do what you can''t do.@k@v10/60100624. So, Erika''s authority was only recognized because she already had that much talent."'
45668: 'BEATRICE@r@v27/60700743.".........Magic is not something that is given to lazy or powerless humans."'
45669: 'Battler@r@v10/60100625."Right.@k@v10/60100626. On the contrary, people who can hide their great efforts are the ones we call witches."'
45670: '@rThe absolute nature of the detective''s authority could even act as magic.'
45671: '@rHowever, it didn''t seem as though Erika had done nothing to earn that convenient power.'
45672: '@r......I probably need to accept it.'
45673: '@rEven when she isn''t given any special powers by the witch she serves,@k ......she''s very competent on her own.'
45674: 'Battler@r@v10/60100627."But Erika, why did you split them into two rooms?@k@v10/60100628. I was thinking you were going to gather everyone into one room."'
45675: 'Erika@r@v46/64500816."......I would have if I had the detective''s authority.@k@v46/64500817. This is a move to preserve my right to investigate at will."'
45676: 'Battler@r@v10/60100629."Ah, ......so that''s it.@k@|@y@v10/60100630. ...I see. Not bad."'
45677: '@rSince Erika was being "protected" as a guest, it was hard for her to move about freely.'
45678: '@rIn truth, she wanted to take some time to reinvestigate the crime scenes at her leisure,@k without being interrupted by anyone.'
45679: '@rShe had already inspected the scenes once as she ran through the mansion, but that probably wasn''t perfect.'
45680: '@rHowever, they wouldn''t have let a guest into the crime scenes, so that had been her only option back then.'
45681: '@r......She wanted some time to herself and freedom to investigate more,@k in part so that she could check the locked rooms and causes of death more closely.'
45682: 'BEATRICE@r@v27/60700744."......How is that related to splitting everyone into two rooms and having them stay there...?"'
45683: 'Battler@r@v10/60100631."That''s where her silver tongue will come into play.@k@v10/60100632. Watch."'
45684: 'Erika@r@v46/64500818."Yes. That''s the only reason I split them into two rooms."'
45685: '@rThe cousins'' room was filled with a quiet tension.'
45686: '@rThis room had six people.'
45687: '@rKrauss, Jessica, and Rudolf.'
45688: '@r......And then the most suspicious ones, the male servants Genji, Kanon, and Gohda, who had been forced to hole up in here.'
45689: '@rJessica leaned against Krauss''s shoulder, wrapped up in a blanket.'
45690: '@rShe was drowsy, but apparently couldn''t get to sleep.'
45691: '@rIt was no surprise.@k In this bizarre situation, it would probably take a lot longer before she could accept her mother''s death...'
45692: '@r......Kanon thought that this was the sort of time he should stay by Jessica''s side,@k but that looked like it would be hard to do in front of Rudolf''s intimidating glare.'
45693: '@rRudolf stayed completely silent,@k but his inner emotions showed clearly in his eyes.'
45694: '@rSo, without even asking,@k Genji, Kanon, and Gohda all understood that they were under suspicion.'
45695: '@rSometimes, Gohda would ask if he could help in an attempt to correct this misunderstanding,@k but that seemed to have the opposite effect.'
45696: '@rThe only good option available to him...@k...was to stay quiet so that he didn''t aggravate Rudolf...and sit still at the end of the sofa...'
45697: '@rIn the next room over, there were also six people: Erika, Hideyoshi, George, Shannon, Nanjo, and Kumasawa.'
45698: '@rThe format of the room and the suffocating atmosphere were the same as the cousins'' room,@k ......but even so, it was relatively calm there.'
45699: '@rGeorge sat holding Shannon, who was hanging her head despondently the whole time.'
45700: '@rKumasawa and Nanjo sat nervously as they listened to Hideyoshi explain the situation...'
45701: 'Hideyoshi@r@v06/61100065."We don''t know how many enemies there are...@k@v06/61100066. ......However, we''ve got a gun right here.@k@v06/61100067. And of course, I''ve shot one before!@k @v06/61100068.I''m not talkin'' about the Hawaii Shooting Center here!@k @v06/61100069.It''s been long enough that I can confess, but I once defiantly fired off one of them occupyin'' forces pistols...!@k @v06/61100070.You see, back then, the black market was controlled by foreign gangsters—"'
45702: '@rHe probably wanted to make everyone feel secure by convincing them that he could be relied upon.'
45703: '@rHideyoshi went into one of his old stories that everyone had heard many times, and that had gotten more extravagant each time they heard it.'
45704: '@rIt didn''t make them any more confident in Hideyoshi''s abilities,@k ......but it did seem to calm things down a little by bringing in a sense of normality.'
45705: 'Kumasawa@r@v18/61800090."......Why has a crime like this happened...?@k@v18/61800091. I hope the boat can come tomorrow..."'
45706: 'Nanjo@r@v19/61900005."That seems unlikely...@k@v19/61900006. ......It looks as though we''ll be staying here for two nights.@k@v19/61900007. ......Now is a good time to get some sleep..."'
45707: 'George@r@v07/60300457."Haha...@k@v07/60300458. I don''t have the nerves to sleep soundly in a situation like this..."'
45708: 'Shannon@r@v15/60500295."......George-sama......"'
45709: '@rThe pain and anger of losing his mother quietly tormented George.@k ......Sleepiness probably wouldn''t be coming to him for a while...'
45710: '@rErika suddenly clapped her hands as though she had just remembered something,@k then whispered in Hideyoshi''s ear, interrupting the old story, which he had grown very engrossed with.'
45711: 'Erika@r@v46/64500819.".........Sorry, I''m just going to the cousins'' room for a second.@k@v46/64500820. ......There''s one little thing I just need to check on with the servants over there."'
45712: 'Hideyoshi@r@v06/61100071."Can''t you use the phone?@k@v06/61100072. You just need to dial the room number."'
45713: 'Erika@r@v46/64500821."Oh, have you forgotten?@k@v46/64500822. It seems the culprit has broken the telephone lines."'
45714: 'Hideyoshi@r@v06/61100073."What''s this? Are you sayin''...@k@v06/61100074....you''ve found some kind of contradiction in their statements?"'
45715: '@rErika had created a strong impression with her detective-like behavior up to this point.@k So, Hideyoshi immediately assumed that this was something vital to do with the crime.'
45716: 'Erika@r@v46/64500823."It''ll be easy to check, ......but it might open up a much larger seam.@k@v46/64500824. ......I''ll be quick about it.@k@v46/64500825. Please don''t let anyone leave this room."'
45717: 'Hideyoshi@r@v06/61100075."Even if you''re only goin'' next door, it''s dangerous to go alone.@k@v06/61100076. You sure you don''t want to take someone with you?"'
45718: 'Erika@r@v46/64500826."We cannot fully trust the servants or Nanjo-san.@k@v46/64500827. ......You''re in charge of this room,@k@v46/64500828. and George-san is needed to support you.@k@v46/64500829. We cannot spare anyone.@k@v46/64500830. ......Don''t worry, the detective never gets attacked."'
45719: '@rErika had already worked hard to look like a sharp, clearheaded person.'
45720: '@rHideyoshi relaxed and agreed, thinking that it was just next door and wouldn''t be a problem...'
45721: 'Erika@r@v46/64500831."If I''m not back in about an hour—no......@k@v46/64500832. It''s probably better if I don''t wander around too much.@k@v46/64500833. I''ll stay over there until morning.@k@v46/64500834. It''ll be better if I wait until it gets light before I come back."'
45722: 'Hideyoshi@r@v06/61100077."Good thinkin''.@k@v06/61100078. Be careful."'
45723: 'Erika@r@v46/64500835."*giggle*@k@v46/64500836. I''m just going to the next room over.@k@|@y@v46/64500837. ......Take good care of this room.@k@v46/64500838. ......Please don''t let anyone go outside.@k@v46/64500839. ......We''ve already brought everything we might need into this room to ensure there''s no reason to leave."'
45724: '@rFood, drinks, blankets, medicine, towels, tissue paper, everything.'
45725: '@rThe women also had their cosmetic pouches.'
45726: '@rThey could spend 48 hours without being short of any physical goods.'
45727: 'Hideyoshi@r@v06/61100079."I know.@k@v06/61100080. ......We aren''t just here to protect ourselves.@k@v06/61100081. ......We''re also on the lookout for the culprit, if he''s among us.@k@v06/61100082. I understand..."'
45728: 'Erika@r@v46/64500840."......<Good>.@k@v46/64500841. Goodbye, then."'
45729: 'George@r@v07/60300459."Where are you going, Erika-chan...?@k @v07/60300460.We promised that no one would go outside."'
45730: 'Hideyoshi@r@v06/61100083."Oh, Erika-chan remembered somethin'' important she had to do.@k@v06/61100084. She''s goin'' next door.@k@v06/61100085. Don''t worry, she''ll be fine."'
45731: '@rHideyoshi suspected that Shannon might be one of the culprits.'
45732: '@rSince he also knew that Shannon and George had a special relationship,@k he apparently thought it would be prudent to mislead George about Erika''s actions and motives.'
45733: '@rHideyoshi slowly opened the door and checked both ways down the corridor, his gun raised.'
45734: 'Hideyoshi@r@v06/61100086."It''s okay.@k@v06/61100087. No one''s there."'
45735: 'Erika@r@v46/64500842."That''s far enough.@k@v46/64500843. For all we know, Shannon-san might take George-san hostage as soon as you leave the room, right...?@k @v46/64500844.It''s careless even just to show your back to them, as you''re doing now."'
45736: 'Hideyoshi@r@v06/61100088."Y-you''re right...@k@v06/61100089. Then be careful.@k@v06/61100090. ......Tell me all about it later."'
45737: 'Erika@r@v46/64500845."Sure.@k@v46/64500846. Bye then."'
45738: '@rPushing Hideyoshi back inside, Erika closed the door.'
45739: '@rShe then waited for the sound of the lock on the inside......and her smiling eyes slowly opened wide.'
45740: '@rHer expression had become ruthless and intelligent.'
45741: '@rWith this, Erika had managed to obtain a period of several hours...@k...during which all of the suspects were sealed up and she alone was free...'
45742: 'Erika@r@v46/64500847."Fiiiiinally, I can investigate to my heart''s content...!@k @|@y@v46/64500848.But first!@k @v46/64500849.Ushiromiya Battler!!"'
45743: 'Battler@r@v10/60100633."Don''t use my full name."'
45744: 'Erika@r@v46/64500850."Allow me to confirm the location of all characters present.@k@v46/64500851. Repetition requested!"'
45745: 'Battler@r@v10/60100634."Of course, I''m not obliged to respond, remember...?"'
45746: 'Erika@r@v46/64500852."If you don''t, I''ll just say that someone sneaked out while I wasn''t looking, and that this person was responsible for the bizarre crimes that are sure to follow.@k@v46/64500853. If you want to show me an impossible murder, you should first confirm their locations...!"'
45747: 'Battler@r@v10/60100635.".........Sure, why not.@k@v10/60100636. I''ll listen, at least. Let me hear it."'
45748: 'Erika@r@v46/64500854."From now on, let''s refer to the room next to the cousins'' room as "the next room over".@k@v46/64500855. Does that work for you?!"'
45749: 'Battler@r@v10/60100637."That''s easy to remember. Got it.@k@v10/60100638. ......And?"'
45750: 'Erika@r@v46/64500856."When I check the characters'' locations as I am about to, I am not concerned with whether they are alive or dead.@k@v46/64500857. Think of it as the location of their body.@k@v46/64500858. And of course, I''m referring to the current point in time.@k@v46/64500859. Here we go."'
45751: 'Erika@r@v46/64500860."''The six first twilight victims are located at the places where they were discovered.@k@v46/64500861. Natsuhi is in her room, Eva is in the VIP room, Kyrie is in Krauss''s study, Rosa and Maria are in the parlor, and you are in the guest room!''"'
45752: 'Battler@r@v10/60100639."........................"'
45753: 'Erika@r@v46/64500862."Don''t tell me you''re already going to decline?!"'
45754: 'Battler@r@v10/60100640.".......Don''t worry.@k @v10/60100641.@|@y@c900.@[I acknowledge it.@]@c."'
45755: '@rFirst off, it was acknowledged that the victims'' locations were the same as the rooms that had been shown by the witch side''s illusion.'
45756: 'Erika@r@v46/64500863."<Good>.@k@v46/64500864. I''ll continue.@k@v46/64500865.@|@y "Hideyoshi, George, Shannon, Kumasawa, and Nanjo are in the next room over!""'
45757: 'Battler@r@v10/60100435.@|@y"@c900.@[Acknowledged.@]@c."'
45758: '@rThe people in the room Erika had just left had been specified.'
45759: '@rIt was the role of the Human side to check every one of these seemingly obvious little details.'
45760: 'Erika@r@v46/64500866."<Good>.@k@v46/64500867. I''ll continue.@k@|@y@v46/64500868. "Everyone else is in the cousins'' room!""'
45761: '@rThe word "everyone" drew a slight reaction from Battler.'
45762: '@r......The intuition he had built up from all of his previous games told him not to answer this one instantly...'
45763: 'Battler@r@v10/60100643."......I decline.@k@v10/60100644. Acknowledging that would mean that Kinzo''s body would also have to be in the cousins'' room."'
45764: 'Erika@r@v46/64500869."Ah, pardon me.@k@v46/64500870. It has already been shown that Kinzo no longer exists, so please remove him from the word "everyone"."'
45765: 'Battler@r@v10/60100645.".........Why are you using the word "everyone" for the cousins'' room alone...?@k @v10/60100646.You could just mention the names of Krauss and the other five individually,@k@v10/60100647. ......so why are you being so vague?"'
45766: 'Erika@r@v46/64500871."It''d just be too much of a pain to read out all of their names.@k@v46/64500872. .........Or is there something wrong?@k @v46/64500873.Does using the word "everyone" create a problem with some trick of yours...?"'
45767: 'Battler@r@v10/60100648."................................."'
45768: '@rIf Battler had been told to repeat "Krauss, Rudolf, Jessica, Genji, Gohda, and Kanon are in the cousins'' room",@k he would probably have responded with the red without thinking too much about it.'
45769: '@rYes—normally, Erika would have mentioned the name of each person inside and had him repeat it precisely.'
45770: '@rBattler hesitated to repeat, feeling some kind of unease because of the use of the word "everyone"...'
45771: 'Erika@r@v46/64500874."Excluding Kinzo and me, there are 17 people on this island.@k@v46/64500875. Six were killed and are lying in the mansion, and five are in the next room over.@k@v46/64500876. Which means the remaining six are in the cousins'' room.@k@v46/64500877. This would be the normal way of thinking of things."'
45772: 'Erika@r@v46/64500878.".........However!@k@v46/64500879. It is extremely dangerous to assume that because there are 17 people on the island, if we subtract six, then five, then six again, that means we''re left with zero humans whose location has not been checked.@k@v46/64500880. I''m pretty sure that this sort of trick involving names and numbers of people caused you a lot of trouble with Nanjo''s murder in the third game."'
45773: 'Battler@r@v10/60100649."............Good point.@k@v10/60100650. ......That trick worked because the 18 names given didn''t match up with the 18 people who actually existed,@k@v10/60100651. leaving room to add in an unknown person."'
45774: 'Erika@r@v46/64500881."Exactly.@k@v46/64500882. And so, I can''t feel secure just by checking their locations by name.@k@v46/64500883. ......That''s why I used the word "everyone".@k@v46/64500884. That word can prevent you from using a new trick that I haven''t even thought of."'
45775: 'Battler@r@v10/60100652."........................I see.@k@v10/60100653. ......Pretty crafty of you..."'
45776: '@rIf Battler was planning a new trick like the one used for the murder of Nanjo in the third game,@k where the names and number of people would be used to create false alibis...'
45777: '@r...then even naming off all 17 people and checking their positions left a trace of uncertainty behind.'
45778: '@rAnd if he skillfully managed to slip somebody past the names and numbers of people...'
45779: 'Erika@r@v46/64500885."For example,@k@v46/64500886. let''s say that an unknown assassin X is hiding on this island.@k@v46/64500887. ......Let''s call him Purupurupiko-Man."'
45780: 'Battler@r@v10/60100654."......I see.@k@v10/60100655. Even if you list everyone''s names and check their locations, this Purupurupiko-Man guy would fall outside the net."'
45781: 'Erika@r@v46/64500888."Precisely.@k@v46/64500889. Even hearing "there are only 17 people on this island, and here are the locations of 17 people"...@k@v46/64500890.is insufficient.@k@v46/64500891. There''s already a precedent for this."'
45782: 'BEATRICE@r@v27/60700745.".........However, the word "everyone" is just too broad.@k@v27/60700746. Can''t you word it a little differently...?"'
45783: 'Battler@r@v10/60100656."......No, ...if we run away from the word "everyone" here,@k@v10/60100657. there''s a chance that Erika will be able to use that as a basis for making Purupurupiko-Man the culprit for everything.@k@v10/60100658. ......In my old fights with you, I also nailed several riddles with no basis other than the unknown person X."'
45784: 'Erika@r@v46/64500892."The word "everyone" carries heavy significance.@k@v46/64500893. ......Make sure you think ve~ry carefully first."'
45785: '@rErika wore a full but evil smile, confident that she had made a powerful move.'
45786: '@r......Players on the witch side must eradicate all possibilities that would be possible for humans.'
45787: '@rIf I don''t crush any chances for this ridiculously-named Purupurupiko-Man right now,@k ......he''ll be used to explain everything the witch does.'
45788: '@rThat was a move I liked to use in my old games with Beato.'
45789: '@rBack at the very beginning of the fight, my counterattacks were all based on an unknown 19th person X.'
45790: '@rBecause of that, it had been necessary for Beato to restrict the number of people on the island and eliminate any unknown person hiding somewhere.'
45791: '@r......In that case, this time is the same.'
45792: '@rSo, just like Beato did, I need to get rid of any leeway in which that X can exist.'
45793: '@rThe number of people on the island has already been declared, but since she''s suspecting tricks involving the names and number of people,@k saying the same thing again won''t satisfy her.'
45794: '@r............In that case, I have no choice but to respond to her repetition request and use the word "everyone".'
45795: '@rThat word has a disturbing ring to it...@k...and though I haven''t figured it out yet, ......it feels like there''s some kind of demonic killer move hidden within it...'
45796: '@rDamn. After insulting Beato so much and saying that the witch side had a huge advantage,@k ......I''m feeling this much pressure from just a single repetition request...'
45797: 'BEATRICE@r@v27/60700747."......<Destruction>, right?"'
45798: 'Battler@r@v10/60100659."You mean the chess term?"'
45799: 'BEATRICE@r@v27/60700748."Yes.@k@v27/60700749. ......It''s a technique of putting pressure on an enemy piece, forcing it to move and making them weaken their own position."'
45800: 'Erika@r@v46/64500894."......I''m threatening you with the broad and powerful piece called "everyone", pressuring you to move.@k@v46/64500895. ......With this, you will be able to perfectly guarantee the alibis for all of the survivors,@k@v46/64500896. and it''ll probably make it possible for you to trap me in the later impossible crimes.@k@v46/64500897. ......What are you so afraid of? Shouldn''t this be a powerful move for you?"'
45801: 'Battler@r@v10/60100660."But it''s a move that you''re pressuring me to make.@k@v10/60100661. ......You''re trying to make me weaken my own position in some way."'
45802: 'BEATRICE@r@v27/60700750."No matter how good a move seems, it is a bad move when it is what the opponent wants...@k@v27/60700751. ......However, it will be hard to avoid the word "everyone" here......"'
45803: '@rThe red truth can cut the weak reasoning of the Human side apart over and over.'
45804: '@r......In the past, I feared its ruthlessness.'
45805: '@rHowever, I quickly learned that it could be used as a basis for a counterattack.'
45806: 'Battler@r@v10/60100662."......The red truth is a secret weapon, a treasured sword.@k@v10/60100663. ......Now I''m painfully aware of how Beato felt."'
45807: '@rIt can kill with ease, ...but it''s not something to be used with abandon.'
45808: '@rUsing it carelessly can corner the witch side instead......'
45809: 'Erika@r@v46/64500898."......What will you do?@k @v46/64500899.You can defer the decision if you want?"'
45810: 'Battler@r@v10/60100664."No, .........@k@v10/60100665. .....................@k@v10/60100666. ......Okay, I acknowledge it.@k@v10/60100667.@|@y@c900.@[I acknowledge that everyone else is in the cousins'' room.@]@c."'
45811: 'Erika@r@v46/64500900."<Good>!@k @v46/64500901.Thank you very much, Battler-san.@k@v46/64500902. What a beautiful, decisive move.@k@|@y@v46/64500903. ......Oh, I''m in trouble.@k@v46/64500904. If a letter from the witch were to appear in this situation, why, whomever could I suspect?"'
45812: '@rShe said she was in trouble, but her face didn''t look troubled at all.'
45813: '@r......On the contrary, she looked as though she had just succeeded in making a very important foundational move.'
45814: '@rIn the witch''s game, even a single mistaken move is fatal......'
45815: '@rIn both chess and shogi, you can''t take back a move once you''ve made it.'
45816: '@r......That last exchange had left a bad aftertaste, as though flesh had been torn and bones broken......'
45817: 'Battler@r@v10/60100668."That should be enough of confirming everyone''s position.@k@v10/60100669. ......Shall we continue the game?"'
45818: 'Erika@r@v46/64500905."Yes, we shall.@k@|@y@v46/64500906. Dlanooooooooooor!!"'
45819: 'Dlanor@r@v47/64600168."Yes, Lady ERIKA."'
45820: 'Erika@r@v46/64500907."Let''s get started right away.@k@v46/64500908. Let''s use the privilege our merciful Game Master has given us...!"'
45821: 'Dlanor@r@v47/64600169."Yes, UNDERSTOOD.@k@v47/64600170. ......Gertrude, Cornelia.@k@v47/64600171. We will use two rooms'' worth of the three sets of seals we were GIVEN...!"'
45822: 'Gertrude@r@v48/64800014."For your attention—"'
45823: 'Cornelia@r@v49/64700011."We hear and obey...!"'
45824: 'Erika@r@v46/64500909."Seal the cousins'' room and the next room over.@k@v46/64500910. This means that everyone other than the victims has been sealed.@k@v46/64500911. No matter what happens after this, the humans within the seals won''t be a problem!"'
45825: 'Dlanor@r@v47/64600172."By the seals on the doors and windows, @v47/64600173.@|@y@c900.@[the complete sealing of both the cousins'' room and the next room over has been GUARANTEED.@]@c."'
45826: '@rFor just an instant, that red longsword had returned to Dlanor''s hand.'
45827: '@rShe had been given permission to draw it,@k thanks to the red truth that she had finally gained.'
45828: '@r......When the fight concerned these two sealed rooms from now on,@k Dlanor would be able to use that merciless blade, the Red Key...'
45829: '@rThis overwhelming power could slice even the Game Master in half.'
45830: '@rFor a while, Erika and Dlanor grinned at each other,@k entranced by the ruthless red light that was burned into their eyes...'
45831: 'Cornelia@r@v49/64700012."......Senior Aide,@k@v49/64700013. allow me to ask a question."'
45832: 'Gertrude@r@v48/64800015."What is it......?"'
45833: 'Cornelia@r@v49/64700014."It is my understanding that the players on the human side are to interpret the problems posed by the witch as the work of humans."'
45834: 'Gertrude@r@v48/64800016."......You are not mistaken."'
45835: 'Cornelia@r@v49/64700015."Then why are Lady ERIKA and Supervisor Dlanor...@k@v49/64700016.fighting to lower the number of "humans who can commit crimes"...?"'
45836: '@r......Cornelia''s question was very simple.'
45837: '@rThose two had made this move boldly and treated it like a powerful one,@k so it almost made it seem as though this move would greatly damage the witch.'
45838: '@rHowever, if you thought about it, ......Erika was just strangling her own neck...'
45839: 'Cornelia@r@v49/64700017."We still do not know what sort of crime will occur in the future.@k@v49/64700018. Would it not be more advantageous to the Humans if there are more people whose locations are not specified...?"'
45840: 'Gertrude@r@v48/64800017.".........Be advised that now is not yet the time.........for the Lady or the Commander to reveal their thoughts."'
45841: 'Cornelia@r@v49/64700019."I apologize for my idle chatter...@k@v49/64700020. ....................."'
45842: '@rCornelia looked like she wasn''t satisfied.'
45843: '@rIn the previous game, in order to help Kinzo escape from his study, Battler had made desperate efforts to crush his locked room using a variety of methods.'
45844: '@rAs a result, Kinzo had escaped into the darkness of the night,@k and it had later been possible to treat him like an elusive phantom.'
45845: '@rIn other words, locked rooms were advantageous to witches and disadvantageous to humans.@k@rWitches proposed locked rooms, and humans destroyed and denied them.@k@rThose were meant to be the standard tactics of this game...'
45846: '@rAnd yet, Erika had created locked rooms herself......and sealed a full 11 people in them.'
45847: '@rIn other words, ......this was the same as abandoning the right to use those 11 people...@k...when explaining all of the later tricks......'
45848: '@rBattler had also once sought to confirm the locations of certain people,@k but that had been to check whether certain pieces existed with which he could break locked rooms, a completely different situation.'
45849: '@r...Why had Erika taken these 11 people, who were supposed to be her pieces, ......and sealed them in a locked room?'
45850: '@rCornelia didn''t have enough experience out on the field to understand this move,@k which only looked as though they were trapping themselves......'
45851: 'BEATRICE@r@v27/60700752."A disturbing move...@k@v27/60700753. What on Earth is Erika planning..."'
45852: 'Battler@r@v10/60100670."......It isn''t necessarily an attack.@k@v10/60100671. It''s the same in chess and shogi.@k@v10/60100672. Strengthening the guard around your king is a valid strategy."'
45853: 'BEATRICE@r@v27/60700754."In other words, the seals around those two rooms aren''t an attack...but a defense...?"'
45854: 'Battler@r@v10/60100673."That seems likely.@k@v10/60100674. Thanks to that, it''s hard to lay a hand on the survivors.@k@v10/60100675. It''ll be tough to carry out the second twilight."'
45855: 'BEATRICE@r@v27/60700755."......Ah, ...I see.@k@v27/60700756. The witch side has an advantage when more mysteries are presented......"'
45856: 'Battler@r@v10/60100676."Yeah.@k@v10/60100677. After all, if even one mystery goes unsolved, the witch wins.@k@v10/60100678. Each new locked room we present increases our advantage."'
45857: '@rThe mysteries that the witch side sets up are equivalent to attacks.'
45858: '@rThe human side must perfectly intercept all of those.'
45859: '@r......It''s almost like a penalty kick face-off where conceding a single goal means defeat.'
45860: '@rSo, the witch side wants to increase its number of attacks.'
45861: '@rThe human side wants to lower the number of attacks......'
45862: '@rWhen Battler had fought on the human side, he hadn''t thought of the survivors holing up in a room as being particularly useful.'
45863: '@rHowever, from the witch side''s perspective,@k this strategy was simple but effective.'
45864: '@rWhat made Beato incredible...@k...was the way she had bluffed and sneered at that as though it was useless.'
45865: '@r......On the inside,@k she must have been very worried about how to break down all of those barricades in each game.@k Right now, I''m sure of that......'
45866: 'BEATRICE@r@v27/60700757."I see, so strengthening your guard to make it hard for a crime to occur is one way for the human side to fight..."'
45867: 'Battler@r@v10/60100679.".........However, that''s a simple move.@k@v10/60100680. ......That "great detective" Furudo Erika wouldn''t have looked so proud of herself after playing a move like that."'
45868: '@rWould Erika be happy after playing a defensive move...?'
45869: '@rThough this move looks as though she''s restraining herself, ......it''s also extremely unlikely that Erika, of all people, played a defensive move......'
45870: 'Battler@r@v10/60100681."I''m sure......that this is an attack, not a move made for defense.@k@v10/60100682. ......Though I don''t know what kind of attack it is."'
45871: 'BEATRICE@r@v27/60700758."Next is our move...... What shall we do?"'
45872: 'Battler@r@v10/60100683.".........For the moment, she has, at least apparently, spent her turn on strengthening her guard to stop the second twilight, instead of reasoning about the first twilight.@k@v10/60100684. ......If they push, pull back; if they pull back, push.@k@v10/60100685. In that case, it''s time for us to attack."'
45873: 'BEATRICE@r@v27/60700759."But how should we attack...?@k@v27/60700760. The guesthouse is well guarded."'
45874: 'Battler@r@v10/60100686."Yes, it appears as though the entire area of the guesthouse is now under Erika''s control.@k@v10/60100687. ......However, there are certain pieces, like bishops and knights, whose specialty is cutting behind enemy lines."'
45875: '@rBattler snapped his fingers, ......and a single gold butterfly appeared from the darkness,@k ......then flew up to the chessboard, trailing gold dust behind it.'
45876: '@rIt landed without a sound,@k ......then transformed into a black piece representing the witch''s darkness.'
45877: 'Battler@r@v10/60100688."X-ray.@k@v10/60100689. ......That''s also a chess term."'
45878: 'BEATRICE@r@v27/60700761."Yes.@k@v27/60700762. ......It''s when a square seems to be under an enemy''s control,@k@v27/60700763. but you observe that your own pieces do actually exert enough influence, so you attack—it''s a high level technique."'
45879: 'Battler@r@v10/60100690."......Erika.@k@v10/60100691. If you really believe that you can defend against my next attack just by sealing up all the survivors...@k@v10/60100692....that''s a naive idea."'
45880: '@rBattler raised his new black piece high.'
45881: '@r.........His target was a single open space deep behind enemy lines.'
45882: 'Battler@r@v10/60100693."How will you handle it...?@k @v10/60100694.This is my.........response."'
45883: 'Erika@r@v46/64500912."Haah.@k@v46/64500913. Now I can finally stretch my wings.@k@v46/64500914. First off, let''s take a midnight stroll to the mansion."'
45884: 'Dlanor@r@v47/64600174."You would take a stroll in the middle of the night to an eerie mansion where a killer might be HIDING?@k@v47/64600175. ......You must be very ECCENTRIC."'
45885: 'Erika@r@v46/64500915."By no means.@k@v46/64500916. I had to wait a long time to be free like this.@k@v46/64500917. I feel like it''s free time after a swimming lesson."'
45886: '@r......Now that BERNKASTEL was nowhere in sight, Erika was regaining her high spirits.'
45887: '@rShe wasn''t exaggerating when she said she could spread her wings.'
45888: '@rDlanor knew that she was staking her own destruction on this game.'
45889: '@r......And she was not in a favorable position by any means.'
45890: '@rDlanor could do nothing but assist Erika so that she could fight to the best of her abilities...'
45891: 'Erika@r@v46/64500918."Alright.@k@v46/64500919. ......The locks on the first floor of the guesthouse are perfect.@k@v46/64500920. The entrance is sealed up with a chain lock."'
45892: '@rBefore leaving the guesthouse, Erika did a check of the first floor,@k making sure that nothing was out of place.'
45893: '@rThen she found a flashlight and umbrella in the servant room next to the entrance.'
45894: 'Dlanor@r@v47/64600176."Then let us GO."'
45895: 'Erika@r@v46/64500921."Yes.@k@v46/64500922. We at least have to check the cause of death for all six."'
45896: '@rShe unset the chain, unlocked the door, and opened it.@k@rThe freezing outside air poured in......'
45897: 'Dlanor@r@v47/64600177."......It appears to be quite windy STILL."'
45898: 'Erika@r@v46/64500923."Well, this body is just a cage of flesh to me.@k@v46/64500924. I don''t care if it gets wet or cold.@k@v46/64500925. ......Let''s go."'
45899: '@rWhen Erika dropped her gaze to open her umbrella, ......she noticed something lying at her feet.'
45900: 'Erika@r@v46/64500926."...............!"'
45901: 'Dlanor@r@v47/64600178."It''s............one of the usual LETTERS."'
45902: '@rIt was one of those letters sent by the witch......with the seal of the One-winged Eagle on it.'
45903: '@rIt had been wedged under the outside mat in front of the entrance,@k ......as though someone had predicted that Erika would eventually come this way while heading for the mansion.'
45904: '@rDue to the guesthouse''s large eaves, the envelope had avoided the rain entirely.'
45905: 'Erika@r@v46/64500927."......So, it''s here already.@k@v46/64500928. ......Almost as though it was waiting for me."'
45906: '@rShe bent over and picked it up.@k ......She then tore it open recklessly and pulled the letter inside out of it.'
45907: '@rA message had been written in neat handwriting...'
45908: 'Erika@r@v46/64500929."Welcome, Furudo Erika-sama......it says.@k@v46/64500930. ......Oh, so it''s calling me by name?@k@v46/64500931. They totally saw this coming."'
45909: 'Dlanor@r@v47/64600179."What does it SAY......?"'
45910: 'Erika@r@v46/64500932."It''s an advance notice of a crime.@k@v46/64500933. Well, a post-factum notice, technically.@k@v46/64500934. ......Apparently, they have taken Ushiromiya Battler''s corpse.@k@v46/64500935. They''re asking me to try looking for it."'
45911: 'Dlanor@r@v47/64600180."......So this isn''t the "tear apart the two who are close" of the second TWILIGHT?"'
45912: 'Erika@r@v46/64500936."Well, disappearing corpses happened a few times in Beato''s games too.@k@v46/64500937. There''s nothing really new about this."'
45913: '@rErika shrugged and scorned the letter.'
45914: '@rHowever, ......this letter was a real attack.'
45915: '@rAll of the survivors were sealed in the rooms on the second floor.'
45916: '@rAnd, after Krauss and the others had gone around checking doors and windows,@k Erika had personally made sure that there was nothing at this spot.'
45917: '@rSo, this was an attack saying that someone who shouldn''t exist had placed the letter, and that this "someone" was a witch.'
45918: '@r......That was also an attack that the old Beato had often used.'
45919: 'Erika@r@v46/64500938."Haah, sheesh.@k@v46/64500939. If the way you show it is the same, please tell me that the actual trick isn''t the same too.@k@v46/64500940. .........Dlanor.@k@v46/64500941. Please call Battler here."'
45920: 'Dlanor@r@v47/64600181."UNDERSTOOD.@k@|@y@v47/64600182. ......Lord BATTLER, we wish to take our TURN...!"'
45921: 'Battler@r@v10/60100695."Got it.@k@v10/60100696. Let''s have it."'
45922: 'Erika@r@v46/64500942."I''m ever so sorry.@k@v46/64500943. I actually don''t have a new move to announce."'
45923: 'BEATRICE@r@v27/60700764."............?"'
45924: 'Erika@r@v46/64500944."The truth is......this is an apology.@k@v46/64500945. There''s something I need to apologize for."'
45925: '@rApologize......?'
45926: '@rBattler and Beato''s eyes went wide.'
45927: '@rHowever, though Erika said that she wanted to apologize,@k she had a confident look on her face, as though even that apology would be a new move.'
45928: '@r......So, Battler glared at her dubiously, without letting his guard down.'
45929: 'Erika@r@v46/64500946."It''s about those retroactive seals.@k@v46/64500947. ......I had actually already sealed one place.@k@v46/64500948. I apologize for taking so long to report this to you."'
45930: 'Battler@r@v10/60100697."......You already sealed something?@k @v10/60100698.In other words, you''ve already used up all three rooms'' worth?"'
45931: 'Erika@r@v46/64500949."Yes.@k@v46/64500950. I promised that I''d report on it right away, but I completely forgot until just now.@k@v46/64500951. You have my sincere apologies."'
45932: 'Battler@r@v10/60100699."You don''t look like someone who''s sincerely apologizing...@k@v10/60100700. ......Well, that''s fine.@k@v10/60100701. I''m the one who gave you that privilege.@k@v10/60100702. ......So?@k @v10/60100703.Where and when did you place the seals?"'
45933: 'Erika@r@v46/64500952."Dlanor."'
45934: 'Dlanor@r@v47/64600183."Allow me to REPORT.@k@v47/64600184. ......Battler''s guest room was sealed at the time of Lady ERIKA''s inspection of the CORPSE."'
45935: 'BEATRICE@r@v27/60700765.".....................!"'
45936: '@rBeato tried not to let it show on her face,@k but Erika didn''t miss her eyebrows twitching slightly and her gaze flicking over to Battler.'
45937: 'Erika@r@v46/64500953."Normally, I would have liked to seal all five of the locked rooms, but I didn''t have enough duct tape.@k@v46/64500954. ......Out of respect for the Game Master, I sealed only the room with Battler-san''s corpse."'
45938: 'Battler@r@v10/60100704.".........So you were kind enough to close the lid on my coffin."'
45939: 'Erika@r@v46/64500955."I remembered a short while ago,@k@v46/64500956. and I was planning to tell you when we reached the mansion and investigated the guest room with your corpse in it.@k@v46/64500957. ......However, when this letter appeared, I figured I should report it right away."'
45940: 'BEATRICE@r@v27/60700766."Wh-why did you think that...?"'
45941: 'Erika@r@v46/64500958."Well,@k@v46/64500959. .........after all, Battler-san has been playing this game not knowing that his corpse was sealed in the guest room.@k@v46/64500960. ......Because of that, .........I thought, possibly......@k@v46/64500961.that it might......change things regarding the appearance of this letter."'
45942: 'Dlanor@r@v47/64600185.".........The cousins'' room and the next room over are currently SEALED.@k@v47/64600186. Sorry for the late report, but the guest room with your corpse in it is also SEALED.@k@v47/64600187. And there are 17 people on the island excluding Lady ERIKA.@k@v47/64600188. The existence of an 18th person has already been denied in a previous GAME."'
45943: 'Erika@r@v46/64500962."So when I thought about......the person who could have placed the letter.........and erased your corpse,@k@v46/64500963. .........I thought that maybe, .........heheheheheheheheheh,@k@v46/64500964. ......just maybe, ......things might be......different......"'
45944: '@rErika laughed nastily while staring into Battler''s eyes to see if he was panicked or disturbed...'
45945: 'BEATRICE@r@v27/60700767."...............Battler-san......"'
45946: 'Battler@r@v10/60100705.".....................@k@|@y@v10/60100706. ......Stay calm.@k@v10/60100707. Erika has just made her report a bit late.@k@v10/60100708. There''s nothing to be nervous about."'
45947: '@rErika had suspected it since the beginning.'
45948: '@rIt was possible that Battler actually hadn''t been killed and was still alive.'
45949: '@rAnd, if he was alive,@k ......then the letter that had suddenly appeared was easy to explain, ......even though all of the "survivors" were sealed up.'
45950: '@rJudging by Beato''s faint agitation, ..........maybe.........Erika''s guess had been right on the mark.'
45951: '@rBattler had played dead and somehow misled Erika''s examination.'
45952: '@rAnd then, when everyone had holed up in the guesthouse, he had snuck out of the guest room.'
45953: '@r......He had placed the letter about the disappearance of his own corpse at the entrance to the guesthouse,@k and then he had gone into hiding......'
45954: '@rIf this was the truth, then the seals that had been placed on Battler''s guest room at the time of Erika''s examination...@kwere now very significant.'
45955: '@rIn short, if he had used this trick,@k then Battler would have "broken the seals" when he left his guest room.'
45956: '@rThe trick would not be workable without breaking the seals.'
45957: '@rSince the survivors were all sealed in the guesthouse,@k breaking the seal on the guest room would mean acknowledging that at least one of the victims was actually alive.'
45958: '@rIf Battler had known about the seals earlier, it was likely that he would have advanced the game in a very different way to avoid this.'
45959: '@rIn other words,@k it was very likely that an announcement about the seals would have had a large effect on the rest of Battler''s game.'
45960: '@rErika was saying: "if Battler, playing the part of a corpse, had remained inside the guest room to avoid breaking the seals,@k then perhaps the plot would not have included this letter"...'
45961: '@r......If the truth was that Battler was actually alive and had placed the letter there,@k then, now that Erika''s seals had come into play,@k .........there was a chance that he would find a contradiction in his trick somewhere down the line.'
45962: '@rThat sort of contradiction is called a logic error.'
45963: 'Ange@r@v11/62000495."A logic error......?@k @v11/62000496.I think we heard about that really early on in this story."'
45964: 'FEATHERINE@r@v50/65000298_b."......It''s an illegal move, the greatest and worst form of error—and one that the witch side must never commit."'
45965: 'Ange@r@v11/62000497."Ah, I remember.@k@v11/62000498. It was something about the two sides of the tale not matching and creating a contradiction."'
45966: 'FEATHERINE@r@v50/65000299."Do you remember the part about magic for making candy appear inside an overturned cup...?"'
45967: 'Ange@r@v11/62000499."Yeah.@k@v11/62000500. Maria onee-chan and Erika were fighting about that.@k@v11/62000501. ......It was just a sleight of hand where someone slipped the candy into the cup while Onee-chan had her eyes closed."'
45968: 'FEATHERINE@r@v50/65000300."That''s right.@k@v50/65000301. Since Maria did not observe the process of the trick and was only given the result,@k@v50/65000302. she accepted the "magical fantasy"—that the candy had appeared by magic inside the cup—and magic was established..."'
45969: 'Ange@r@v11/62000502."............Okay, so a logic error would be...@k@v11/62000503....''a trick that has become impossible''."'
45970: '@rThinking back, the time when Erika and MARIA fought fiercely about this magic with the red and blue truth...@kwas really the opening battle of this tale.'
45971: '@rLet''s try to remember that exchange.'
45972: '@r......The heartless conclusion was...that it had all been a trick.@k@rMaking the candy appear in the cup by magic had been nothing more than Beato''s claim.'
45973: '@r"Magic can only do things that one can accomplish."'
45974: '@rIn other words, the only results that magic can leave behind are those that can be accomplished without magic.'
45975: '@rAllow me to say it straight out.@k There are two general types of magic.'
45976: '@rIf you summon giants...@k@|@yand make towers grow from the ground...'
45977: '@r......but, when the lid is taken off, nothing has happened in the rose garden, that''s one type of magic.'
45978: '@rThat is just "fantasy", an "illusion".'
45979: '@rIt''s a "lie" with no observers, taking place only where there is "absolutely no anti-magic toxin", to use the words of a witch.'
45980: '@rMagic that doesn''t have to produce a result is the easiest kind, and it is a "lie".@k It is the same as a worthless delusion, a fantasy, a daydream.'
45981: '@rEven Battler saw through it partway through the third game.'
45982: '@rThen, there is another kind, which we might call true magic: "magic with results".'
45983: '@rThe cup trick is an example of "magic with results", because the observer checks and actually confirms the cup is empty, a candy does appear inside the cup,@k and the observer is actually able to obtain that candy.'
45984: '@rI have noticed that, unlike the magic of illusions, magic with results must follow one big rule.'
45985: '@rThe rule is...that only the unobserved process of what you accomplished can be transformed into magic.'
45986: '@rI''ll say it even more plainly and ruthlessly.@k@rIn short, all forms of magic are tricks.'
45987: '@r"The only results of magic are things that can be accomplished without magic."'
45988: '@r......Ironically, this also proves that magic doesn''t exist,@k ......but out of respect for the witch''s game, let''s call it "making the game solvable and fair for the human player".'
45989: 'Ange@r@v11/62000504."......So, this time around, "the candy in the cup" is "a mysterious letter that appeared in front of Erika".@k@v11/62000505. ......In other words, it has to be a trick, a sleight of hand.@k@v11/62000506. By claiming that the witch set the letter there by magic, Onii-chan is trying to create "magic with results"."'
45990: 'FEATHERINE@r@v50/65000303."Correct.@k@v50/65000304. Since all of the survivors are sealed within the locked room of the guesthouse,@k@v50/65000305. ......it is possible to embellish this suddenly appearing letter and say that it was "strange magic", and "only a witch could have placed it there".@k@v50/65000306. ......But even so, it must be a "possible trick" in the end."'
45991: '@rIn order to break through the trick with the candy and the cup,@k Erika had countered with the blue truth saying that the candy had been snuck in there while Maria''s eyes were closed.'
45992: '@rThat was the correct answer, so Maria hadn''t had any red that she could use.'
45993: '@r......But what if she had used it?'
45994: '@rFor example, what if Maria had used the red truth at that time to say...@k"until Maria lifted the cup up, the locked room of the overturned cup was preserved"...?'
45995: 'Ange@r@v11/62000507."The red truth can only be used for the truth, right?@k @v11/62000508.If you could lie with it, it''d be a massive violation of the rules."'
45996: 'FEATHERINE@r@v50/65000307."True.@k@v50/65000308. Denying your own trick with the red truth is a large violation of the rules.@k@v50/65000309. However, if you instantly switch over to another trick that doesn''t violate that red truth,@k@v50/65000310. although slightly unfair, that red truth is admissible."'
45997: 'Ange@r@v11/62000509."......So in that case, in order to avoid contradicting the red truth that "the locked room inside the cup was preserved",@k@v11/62000510. the witch side would need to immediately propose a different trick compatible with that red truth.@k@v11/62000511. ......Like the excuses of a politician when he keeps backtracking as new evidence is shown to him."'
45998: 'FEATHERINE@r@v50/65000311."Yes.@k@v50/65000312. ......Well, for a red like this, she might be able to get away with some painful excuse.@k@v50/65000313. ......Maybe there was some device in the table, or maybe it was a trick cup with a fake bottom...@k@v50/65000314. .........But if those possibilities had been denied in red beforehand, they would not work either.@k@v50/65000315. .........The more red truths there are, the harder it is to talk your way out."'
45999: '@rIn actuality, the candy had been put in the cup while Maria''s eyes were closed.'
46000: '@rHowever, if, when Erika saw through that, Maria had used the red truth to say that the locked room of the cup had been preserved...'
46001: '@r......the witch would have to rush and revise the scenario to a new trick that "still worked logically" after that new red.'
46002: '@rRevising the scenario is an unfair move that would never be allowed in mysteries.'
46003: '@rHowever, the very act of revising the scenario takes place inside the witch''s head, which is an unobservable world.'
46004: '@rSo, she could claim that she''d been using the trick with the fake-bottomed cup from the beginning, and no one could deny that.'
46005: '@r......So, ......even if it really was a trick done while Onee-chan''s eyes were closed...'
46006: '@r...as long as the witch leaves herself a way out, she can even switch between truths (i.e., tricks).'
46007: '@rRather than calling this an action allowed to witches,@k it would probably be better to say that it is only allowed for the Game Master, the one who creates and writes.'
46008: '@rBut even still,@k@|@y the new trick must not contradict any of the previously stated red truths.'
46009: '@rIf the red truth makes it so that "the trick no longer makes logical sense",@k then there will be a mismatch between the two sides of the story: the illusory result that the Game Master claims was done by magic, and the true result that was brought about by a trick.'
46010: '@rThere will be a contradiction, and things will no longer make logical sense.'
46011: '@rWe call this a logic error...'
46012: '@rAnd that means......the destruction of the witch''s game.'
46013: 'Ange@r@v11/62000512."This world is a game that is possible to explain with humans.@k@v11/62000513. ......In other words, it must be possible for all the magic to have been done by tricks instead.@k@v11/62000514. ......If it''s impossible to do with tricks, then the human side has no move and we get a stalemate."'
46014: 'FEATHERINE@r@v50/65000316."No, that''s wrong.@k@v50/65000317_b. That is precisely the fatal and worst possible illegal move known as a logic error.@k@v50/65000318. ......If the witch side commits such an error, the game is instantly destroyed and they suffer a fatal defeat..."'
46015: 'Ange@r@v11/62000515."Erika has probably seen through to Onii-chan''s trick.@k@v11/62000516. ......Without the detective''s authority, Erika can''t perform a proper examination of the corpses.@k@v11/62000517. Because of that, he continued to play dead, ......snuck out of the guest room, and placed the letter at the entrance to the guesthouse."'
46016: 'FEATHERINE@r@v50/65000319."However, because Battler was so overly gracious in giving out those retroactive seals, things went wrong."'
46017: 'Ange@r@v11/62000518.".........Stupid Onii-chan."'
46018: 'FEATHERINE@r@v50/65000320."Panic is unwarranted at present...@k@v50/65000321. ......It is yet to be specified with red truth that the seals around the guest room are intact.@k@v50/65000322. ......He is free to break the seals.@k@v50/65000323. If he does not, then he can probably have it so that someone other than Battler was alive, and swap them in as the person who placed the letter..."'
46019: 'Ange@r@v11/62000519."That''s right......@k@v11/62000520. It''s not just Onii-chan—the other corpses haven''t been confirmed dead with the red truth either.@k@v11/62000521. ......So far, there wouldn''t be any problem if they were all faking."'
46020: 'FEATHERINE@r@v50/65000324."Exactly.@k@v50/65000325. It is not yet the stage to get flustered.@k@v50/65000326. ......He merely has to change his move so that Erika''s seals and the placement of the letter don''t contradict each other."'
46021: 'Ange@r@v11/62000522.".........And revising the plot without contradictions is one of the moves available to the Game Master."'
46022: 'FEATHERINE@r@v50/65000327."However, ............taking a scenario one has imagined and revising it partway through can sometimes create flaws in the tale.@k@v50/65000328. It would be a very painful move to make when the first twilight has only just ended."'
46023: 'FEATHERINE@r@v50/65000329."......It would seem that Battler was the one with an enemy piece deep behind his lines...@k@v50/65000330. This hidden piece will probably cause him pain and discomfort with each step from now on, like a pebble caught in one''s shoe......@k@v50/65000331. ......This single pebble.........might kill Battler........."'
46024: 'Ange@r@v11/62000523."...................................."'
46025: 'Erika@r@v46/64500965."This still isn''t quite a logic error.@k@v46/64500966. And we are at fault for the delay in reporting that we had sealed the room retroactively.@k@v46/64500967. So, I have no problem with letting Battler-san retroactively rewrite the plot concerning this letter.'
46026: 'BEATRICE@r@v27/60700768."......Retroactively rewrite the plot...?"'
46027: 'Battler@r@v10/60100709."Hmph, I see.@k@v10/60100710. ......If "I" placed the letter there, then that would be impossible as soon as "I" was sealed in that locked room.@k@v10/60100711. In which case, this letter shouldn''t have appeared here."'
46028: 'Erika@r@v46/64500968."Correct.@k@v46/64500969. So, I thought you should have the chance to revise that small contradiction."'
46029: 'Dlanor@r@v47/64600189."......We have discovered this letter HERE.@k@v47/64600190. ......We are saying that we do not mind if you want to undo that, or if you want to use a revised SCENARIO."'
46030: 'Erika@r@v46/64500970."All it takes is the presence of a letter and some duct tape,@k@v46/64500971. ......and a move like this becomes trivial for Furudo Erika.@k@v46/64500972. ............Your thoughts, ladies and gentlemen...?"'
46031: '@r.........Damn, what a dirty move......@k@rWell, ......what else should I expect from Erika...?'
46032: '@rAnd I also made a promise with Dlanor......to play an all-out, merciless game......'
46033: '@r..............................'
46034: '@rYeah, it''s true.@k I had been planning to make Battler actually be alive,@k and then to have him slip out of the guest room, resulting in his disappearance and the placement of the letter.'
46035: '@rHowever, if I revise the scenario now that my move''s been spotted,@k it''ll be the same as admitting that it was spotted.'
46036: '@rEven if I have to be stubborn about it, I don''t want to admit that I was seen through here.'
46037: '@rI don''t want to acknowledge a pathetic plot change where I try to sneak out of the guest room and end up breaking the seal.'
46038: '@rI want......to change over to a different trick, so that the letter will be placed and my corpse will be hidden...@kwhile still preserving the seals on the guest room...'
46039: '@r......It doesn''t really have to be me who places that letter.'
46040: '@rI can still revise the logic without contradictions...'
46041: 'BEATRICE@r@v27/60700769."But Battler-san, even if you can place the letter somehow,@k@v27/60700770. how are you going to make your corpse vanish afterwards?@k@v27/60700771. ......The guest room is sealed.@k@v27/60700772. If you don''t find a trick to erase the corpse from the locked room right now, a logic error will occur."'
46042: 'Battler@r@v10/60100712."...............I still have time.@k@v10/60100713. ......Let me think until the last second.@k@v10/60100714. ......Dammit........."'
46043: '@rWith a painful laugh, Battler unconsciously scratched at his head...'
46044: 'Battler@r@v10/60100715."Anyway, ......we''ll leave the letter like this.@k@v10/60100716. ......I can''t say "oh, sorry about that, having the guest room sealed makes a big contradiction so I''d like to revise my move"...!@k @v10/60100717.It would be an admission that she caught me."'
46045: 'Battler@r@v10/60100718.".........Heheh, I feel like a ninja hiding above the ceiling.@k@v10/60100719. Even though I was noticed and stabbed by a spear, I just withstand the pain, wipe up the blood, and act as though nothing happened.@k@v10/60100720. .........False courage works well enough.@k@v10/60100721. ......I can''t let her know that this one hurt..."'
46046: 'BEATRICE@r@v27/60700773.".........Battler-san........."'
46047: 'Battler@r@v10/60100722."Heh, heheheh.@k@v10/60100723. Hey, Beato.@k@v10/60100724. What does my face look like right now......?@k @v10/60100725.I''m sure it''s the same expression you had when I managed to hit you where it hurts in the past...@k@v10/60100726. ......Heh......heheheh...@k@v10/60100727. ...Dammit..."'
46048: '@rBeato couldn''t think of anything to say...'
46049: '@r......Useless words of comfort would only get in the way of Battler''s thinking now.'
46050: 'Battler@r@v10/60100728."......What would the old you do...?@k @v10/60100729.The old you, who created all of the locked rooms that tormented me so much in the past...@k@v10/60100730. .........What kind of trick would she use to erase my corpse from a locked room...?"'
46051: 'BEATRICE@r@v27/60700774."Nn...............nn..............."'
46052: '@rBeato trembled and groaned.'
46053: '@r......The old her had been an expert at locked room tricks.@k@rIf only that memory, that power, could revive, ......she would be able to help Battler......'
46054: '@r.........There''s still time to think......@k@r............There''s still time...'
46055: '@rNice going, Erika......@k That was......a dirty move......'