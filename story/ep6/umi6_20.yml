48911: 'BERNKASTEL@r@v28/62100363."............Lambda, ......where are you......?"'
48912: '@rJust having to say that felt like admitting defeat......and I didn''t like it.'
48913: '@rWhy is it that she''s always so obnoxious and clingy when I don''t need her,@k ......and then won''t answer when I call her name?'
48914: '@rWhere.........am I......?'
48915: '@rAnnoyed by the completely predictable ending, I had left the cathedral.'
48916: '@r......I had planned on finding some terrace with a cool night''s breeze...@kwhere I could kill time until the end of that farcical reception.'
48917: 'BERNKASTEL@r@v28/62100364."......It''s true that I tried to find somewhere desolate so that I didn''t have to look at people,@k@v28/62100365. .........but this is a bit ridiculous."'
48918: '@rI, the great BERNKASTEL, ......am lost?'
48919: '@rA miracle like that certainly couldn''t happen.'
48920: '@rYes...miracles don''t exist in this world.'
48921: '@rTo create a miracle, you need "an amount of time that can never be reached", a period that is no different from infinity.'
48922: '@rSo, when something that appears to be a miracle happens in a shorter span of time than that,@k .....it is not a miracle...@kbut due to someone''s......design.'
48923: '@rIn other words, ......the reason I''m walking down this bizarre corridor...@k...is because someone''s design has forced me here......'
48924: 'BERNKASTEL@r@v28/62100366.".........Who did this?@k @v28/62100367.Who pulled this elaborate prank on me?@k@v28/62100368. .........You must be quite the shy one,@k@v28/62100369. ......calling me out to a desolate place like this."'
48925: '@r......Then, ......from the other end of the dark corridor, ......I heard a sound.'
48926: '@r*patter*, *patter*patter*patter*.........'
48927: '@rIt sounded as though some small animal, like a dog or a cat, was walking at a quick pace.'
48928: '@rNo miracle could cause a dog or cat to be in a place like this.@k@rSuch a miracle would not be "allowed".'
48929: '@rSince it isn''t a miracle,@k that means I am being guided in that direction.'
48930: '@r.........Alright then.@k This might be some new idea to keep me entertained.'
48931: '@rIf this is some new joke of Lambda''s, I''ll cover her whole body with honey using my tongue as a reward.'
48932: '@r...And then, I''ll stick parasol chocolates into her eyes and tell her to never do it again.'
48933: '@rIn the direction that the noise had come from, ......it was not only dim, but shrouded in complete darkness.'
48934: '@rHowever, ......I could sense something in that darkness.'
48935: '@r.........There were two emerald-green glints, ......probably cat eyes.@k The eyes of a black cat that blended well into the darkness.'
48936: 'BERNKASTEL@r@v28/62100370."Are you the one who called me here...?@k@v28/62100371. .........Or......are you just the messenger...? ..............."'
48937: '@rWhen I looked at my feet, ......I saw red cat footprints leading towards those cat eyes.'
48938: '@r......It was unsettling, ...as though it had run through a puddle of blood on its way there.'
48939: '@rAfter my eyes adjusted to the darkness, .........even with the lack of light, I was vaguely able to make out the red footprints ahead of me.'
48940: '@r......They weren''t actually glowing or anything,@k ......but they served perfectly well as a signpost leading me onwards.'
48941: '@r*patter*patter*patter*patter*......'
48942: '@rAs though it was telling me to follow,@k ......the cat turned around and dashed off into the darkness.'
48943: '@r..................What is it?@k ......Something feels...very strange.'
48944: '@rIt''s a feeling I haven''t felt since I began calling myself the cruelest witch in the world.'
48945: '@r......I can''t quite remember what this feeling is.'
48946: '@rStill, ......for one as tired of boredom as me, it''s surely more fun this way.'
48947: '@rI followed the bloody footprints of the cat, which would sometimes stop and look back at me,@k ............and walked on and on through the dark corridor......'
48948: '@rIt headed forward, .........turned corners,@k .........and descended what appeared to be stairs from time to time.'
48949: '@rAnd then, ......though I couldn''t really tell because of the darkness, .........it slipped through the crack of a door.'
48950: 'BERNKASTEL@r@v28/62100372."........................Here......?"'
48951: '@rI pushed the door open slowly, ......but it was dark on the inside, just like the corridor.'
48952: '@rHowever, the air and the slight change in the echoes made by the footsteps...@ktold me that this was a room, not a corridor.'
48953: '@rThe sounds of the cat''s footsteps were gone.'
48954: '@r......However, the bloody footprints remained.'
48955: '@rOn the other side of some sort of wooden screen, ......under what looked like a small spotlight...'
48956: '@r......that same black cat...@kwas noisily gobbling down a bowl of pet food.'
48957: '@r.........I see.@k So, this is its reward for bringing me here...'
48958: 'BERNKASTEL@r@v28/62100373."Cat......@k@v28/62100374. Sorry to bother you during your meal,@k@v28/62100375. ......but I''d like you to summon your master.@k@v28/62100376. .........That is, unless you''re actually the one who summoned me...?"'
48959: '@rTalking to it didn''t cause it to turn around.'
48960: '@r......Well, I guess it is an animal eating its food.@k ......If I kick it away, it''ll probably run off to its owner.'
48961: 'BERNKASTEL@r@v28/62100377.".........Hmph."'
48962: '@rWhen I did kick the cat,@k ......it sailed away like a stuffed animal,@k hit the wall, and fell to the ground.'
48963: '@rThen, it vanished, as though it had melted into the darkness......'
48964: '@r......What''s with this cat?@k ......Is it just an illusion...?'
48965: 'BERNKASTEL@r@v28/62100378."........................!"'
48966: '@rWhen I looked at its food bowl, ......it was piled up with what appeared to be blood-drenched raw meat.'
48967: '@r......It was as though someone had torn apart living flesh on the spot...@k...and piled it into there.'
48968: 'BERNKASTEL@r@v28/62100379.".........Come on, what''s with the creepy reception?"'
48969: '@r@v50/65000393."That was a mean thing to do, kicking it."'
48970: '@rThe instant I heard that voice, the hairs on the back of my neck stood on end.'
48971: '@rThen, ......the surrounding area finally brightened.....'
48972: '@rHowever, BERNKASTEL had already guessed where this was before it grew bright...'
48973: 'FEATHERINE@r@v50/65000394.".........That was you.@k@v50/65000395. ......That cat."'
48974: 'BERNKASTEL@r@v28/62100380."......................................."'
48975: 'FEATHERINE@r@v50/65000396."......My dear flesh-eating cat who has learned to choose its own path,@k@v50/65000397. ......it has been long since we last met......"'
48976: 'BERNKASTEL@r@v28/62100381."It''s a path I''d never have to have noticed if you hadn''t told me.@k@v28/62100382. ......You''re the monster who taught me the taste of flesh.@k@v28/62100383. .........So, you''ve come back to life.@k@v28/62100384. .........FEATHERINE AUAURORA..."'
48977: 'FEATHERINE@r@v50/65000398."......It is AUGUSTUS AURORA......@k@v50/65000399. You never learn no matter how often I tell you that...@k@|@y@v50/65000400. ...Very well.@k@v50/65000401. Even that brings back fond memories......@k@v50/65000402. I have heard the rumors...@k @v50/65000403..........It seems you have taken the name BERNKASTEL, Witch of Miracles, .........and have been traveling around playing some far from praiseworthy fragment games......"'
48978: 'BERNKASTEL@r@v28/62100385."I''m just imitating you.@k@v28/62100386. Though I could hardly match up to your level.@k@v28/62100387. ......If the rumors you''ve heard about me are bad, that applies a hundredfold to you."'
48979: '@rBERNKASTEL sat unreservedly in an antique chair,@k ......as though she was already familiar with the place.'
48980: 'FEATHERINE@r@v50/65000404."............What are you afraid of?@k@v50/65000405. I am merely celebrating my reunion with my longest-serving miko so far...@k@v50/65000406. Did you really find my messenger cat so displeasing?"'
48981: '@rBy all appearances, BERNKASTEL''s manner seemed relaxed...'
48982: '@rHowever, FEATHERINE admonished her, telling her not to be afraid.'
48983: '@r......And, judging by the expression that rose to Bern''s face,@k ......FEATHERINE had been right on the mark...'
48984: 'BERNKASTEL@r@v28/62100388."Did you really have to make such blunt insinuations against me?@k@v28/62100389. ......A cat leaving behind bloody footprints and stuffing its face with blood-stained meat..."'
48985: 'FEATHERINE@r@v50/65000407."...........................@k@v50/65000408. ......Have no fear.@k@v50/65000409. ......Look closely.@k@v50/65000410. ......Where do you see a cat stuffing its face with blood-stained meat......?@k @v50/65000411.I just gave it a plate of biscuits as a reward for going to get you..."'
48986: 'BERNKASTEL@r@v28/62100390."..........................."'
48987: '@r............Despite there being no wind, the bowl at her feet seemed to blow away as though it was made of soot.'
48988: '@r...In its place lay a lovely......and perfectly normal......cat dish,@k .........with a pile of small biscuits on top of it...'
48989: 'BERNKASTEL@r@v28/62100391.".....................Tch......"'
48990: '@rBERNKASTEL didn''t even hide her displeased grimace.'
48991: '@rFEATHERINE shrugged and muttered "you haven''t changed, child of man" as she rocked her rocking chair.'
48992: 'BERNKASTEL@r@v28/62100392.".........I see you''re as unpleasant as ever.@k@v28/62100393. ......But nowadays I find you pleasing.@k@v28/62100394. Imitating you really has been far from boring."'
48993: 'FEATHERINE@r@v50/65000412."......Scold me as you please.@k@v50/65000413. It is the parting gift I gave you when we last met."'
48994: 'BERNKASTEL@r@v28/62100395."You liked abusive mikos because they kept you entertained, right......?@k @v28/62100396.Tch, ridiculous.@k@v28/62100397. ......If talking will only please you, I''ll shut up.@k@v28/62100398. .........So, ......what do you want with me...?"'
48995: 'FEATHERINE@r@v50/65000414."It seems BEATRICE''s game has ended with Battler''s victory.@k@v50/65000415. ......I observed it.@k@v50/65000416. It was quite entertaining."'
48996: 'BERNKASTEL@r@v28/62100399.".........I''m sure you enjoyed seeing me fail miserably."'
48997: 'FEATHERINE@r@v50/65000417."Nonsense, it was a splendid performance...@k@v50/65000418. ............I''m sure Beato is very grateful to you."'
48998: 'BERNKASTEL@r@v28/62100400."............Hmph.@k@v28/62100401. ......And?@k @v28/62100402.If you want me to read the fragments of Beato''s game aloud for you, I refuse.@k@v28/62100403. I''m not your miko anymore."'
48999: 'FEATHERINE@r@v50/65000419."I have observed all of Beato''s games.@k@v50/65000420. ......I also watched LAMBDADELTA''s game and Battler''s game with great interest.@k@v50/65000421. ......I believe I have fashioned my own particular answers to all the mysteries.@k@v50/65000422. .........The culprit.@k@v50/65000423. The motive.@k@v50/65000424. The individual tricks.@k@v50/65000425. ......I am not yet clear about the very last part of the epitaph''s riddle,@k@v50/65000426. but I have enough of a theory that if I actually went to Rokkenjima and investigated, I should be able to resolve that part as well."'
49000: 'BERNKASTEL@r@v28/62100404."...............And...?"'
49001: 'FEATHERINE@r@v50/65000427."Of course, since there is no single truth, my theory is probably only one of many possibilities.@k@v50/65000428. ......However, it is one of those possibilities, so that problem is a trivial one."'
49002: 'BERNKASTEL@r@v28/62100405."......What are you up to?@k@v28/62100406. .........Do you want to debate Beato''s game with me?"'
49003: 'FEATHERINE@r@v50/65000429."Wrong.@k@|@y@v50/65000430. .........What I want is to look at the answers, child of man."'
49004: '@rThose words of FEATHERINE''s made BERNKASTEL straighten up.'
49005: '@r......Her old master did not fail to notice that small reaction.'
49006: 'FEATHERINE@r@v50/65000431."So far, you have spiced up this tale as an actor.@k@v50/65000432. In doing that, you have probably come to know many truths.@k@v50/65000433. ......However, even you are unaware of the truth behind several mysteries that Beato has skillfully kept hidden, correct......?"'
49007: 'BERNKASTEL@r@v28/62100407."...........................@k@|@y@v28/62100408. .........I see...@k@v28/62100409. .........You want to use me......to chew apart......and string out the guts of something again."'
49008: 'FEATHERINE@r@v50/65000434."After watching a play, the experience of reading the pamphlet and learning what goes on behind the scenes...@k@v50/65000435....is similar to, as you would say it, enjoying some black tea after a meal.@k@v50/65000436. ......It is ceremony, but essential nonetheless."'
49009: 'BERNKASTEL@r@v28/62100410."You play with them and love them while they''re alive, then eat their flesh when they die.@k@v28/62100411. ......So, cats are doubly useful to you.@k@v28/62100412. .........Just die, monster."'
49010: 'FEATHERINE@r@v50/65000437."I want...to look at the answers.@k@v50/65000438. .........I''m sure you want to know them."'
49011: 'BERNKASTEL@r@v28/62100413."...................................."'
49012: 'FEATHERINE@r@v50/65000439."Think of it as a burial for Beato''s corpse, where you are in charge of the service.@k@v50/65000440. ......What do you say about that, child of man?"'
49013: 'BERNKASTEL@r@v28/62100414.".........Now, you''re starting to speak my language."'
49014: '@rWhen FEATHERINE snapped her fingers,@k a thin spotlight shone on a table cluttered with books.'
49015: '@rThere.........lay a folded version of the game board for Beato''s game.'
49016: '@rThe Witch of Theatergoing spun her finger in a circle, and the game board opened up by itself,@k revealing the rows of black and white pieces that were packed away inside it.'
49017: 'FEATHERINE@r@v50/65000441.".........It is a complete set, containing the game board and all the pieces.@k@v50/65000442. ......The records of the previous games are all there as well."'
49018: '@rWith a rustling sound, the books flipped through all their pages of their own accord, shut themselves,@k and flew to the side of the game board, where they waited.@k Inside them, all of the movements of the pieces during previous games were recorded...'
49019: 'BERNKASTEL@r@v28/62100415.".........I see.@k@v28/62100416. So you were short a player and a commentator..."'
49020: 'FEATHERINE@r@v50/65000443."We are also short on black tea.@k@v50/65000444. ......And, I suppose, dried plums.@k@v50/65000445. Of course, I will find some."'
49021: 'BERNKASTEL@r@v28/62100417."..............................@k@v28/62100418. ......Okay.@k@v28/62100419. If you add on some mustard rice cakes, then we have a deal."'
49022: 'FEATHERINE@r@v50/65000446."The negotiations are concluded."'
49023: 'BERNKASTEL@r@v28/62100420."I have one condition."'
49024: 'FEATHERINE@r@v50/65000447."Oh, and what is that?"'
49025: 'BERNKASTEL@r@v28/62100421."I''m going to be the Reader, right...?@k @v28/62100422..........I have no love, so I might interpret all kinds of things in strange ways.@k@v28/62100423. ......However, the Reader is free to read things in a manner and with an intonation of her choosing."'
49026: 'FEATHERINE@r@v50/65000448."I only want to check the answers.@k@v50/65000449. ......I have no interest in the tale itself.@k@v50/65000450. .........The particular kind of tale you choose to create is of no interest to me whatsoever.@k@v50/65000451. ............Ah, yes.@k@v50/65000452. Now I see what you''re after."'
49027: 'BERNKASTEL@r@v28/62100424."..................Will you accept that condition?"'
49028: 'FEATHERINE@r@v50/65000453."Very well...@k@v50/65000454. I want to know the answers. You want an outlet for your grievances.@k@v50/65000455. The negotiations are concluded."'
49029: '@rWhen FEATHERINE snapped her fingers once more,@k ......a large chair appeared, as though beckoning BERNKASTEL to sit there.'
49030: '@rThe chair, its design horribly mismatched with the furnishings of this room, ......was a throne.'
49031: '@rWait, I''ve seen this before.@k .........This is—'
49032: 'FEATHERINE@r@v50/65000456."I acknowledge it. You may sit.@k@v50/65000457. You are the Game Master."'
49033: 'BERNKASTEL@r@v28/62100425.".........Are you sure?@k @v28/62100426.......Are you really sure...?"'
49034: 'FEATHERINE@r@v50/65000458."You may create whatever sort of tale you like to ease your inner hatred.@k@v50/65000459. I am not interested.@k@|@y@v50/65000460. However, I have one condition as well.@k@v50/65000461. ......Provide all of the answers I seek.@k@v50/65000462. No hiding, concealment, or tricks."'
49035: 'BERNKASTEL@r@v28/62100427."Heh, ......heheheheheheheheheh...!@k @v28/62100428.Leave it to me.@k@v28/62100429. Tearing apart the chest and ripping out the guts is my specialty.@k@v28/62100430. .........After all, you trained me."'
49036: 'FEATHERINE@r@v50/65000463."I shall make you some black tea.@k@v50/65000464. ......With my own hands, not magic.@k@v50/65000465. ......Let the master treat her miko to some tea..."'
49037: 'BERNKASTEL@r@v28/62100431.@e@s50."Beato once told me that tea is best drunk in the company of a witch."@|@y'
49038: 'FEATHERINE@r@v50/65000466.@e@s50."It seems we differ in that regard......@|@y@v50/65000467. ......Heh, ...heheheheheheheheheheheheheheheh."@|@y'
49039: '@r@e@s50.......At some point, that dish piled with biscuits...@|@y...had reverted to a mountain of torn-apart meat and a splatter of red.@|@y No, not just meat, ...even intestines...@|@y'
49040: 'FEATHERINE@r@v50/65000468.@e@s50."......Tea is best enjoyed—"@|@y'
49041: '@r@v00/awase6100_o.@e@s50.""With your fellow monsters.""@|@y'
49042: 'BERNKASTEL@r@v28/62100433.@e@s50.".........In that case, let''s get the pieces ready.@|@y@v28/62100434. If we keep counting, this''ll be game number seven, right?"@|@y'
49043: 'FEATHERINE@r@v50/65000470.@e@s50."Correct.@|@y@v50/65000471. An auspicious number."@|@y'
49044: 'BERNKASTEL@r@v28/62100435.@e@s50."It won''t be for Beato."@|@y'
49045: '@r@e@s50.BERNKASTEL slowly picked up a black piece.@|@y'
49046: '@r@e@s50.It was the piece that represented BEATRICE.@|@y'
49047: '@r@e@s50.It was sometimes a king, sometimes a queen, and could even become a knight.@|@y'
49048: '@r@e@s50.However, that was only if it got promoted.@|@y@rUntil then, it was only a trash piece, like a pawn.@|@y'
49049: '@r@e@s50.First came piece positioning.@|@y Even this early, the witch''s game had already begun.@|@y'
49050: '@r@e@s50.BERNKASTEL took Beato''s piece and slowly raised it high.@|@y'
49051: 'BERNKASTEL@r@v28/62100436.@e@s50."First move, placement.@|@y@v28/62100437. BEATRICE on d8."@|@y'