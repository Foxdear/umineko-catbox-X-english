44807: '@rErika was dozing off on the bed, so when a knock sounded on the door,@k it took some time before she noticed.'
44808: '@rShe looked at the clock and saw that not much time had passed since she had lain down.'
44809: 'Erika@r@v46/64500505.".........Yes, who is it?@k@v46/64500506. I hope you have a good reason for knocking on the detective''s door at an hour like this..."'
44810: 'Erika@r@v46/64500507."That''s right.@k@v46/64500508. ......I have one thing to say before we begin this game."'
44811: 'Battler@r@v10/60100397."Oh, that detective proclamation thing?@k@v10/60100398. Knock yourself out."'
44812: 'Erika@r@v46/64500509."No, just the opposite.@k@v46/64500510. ......I say we raise the stakes."'
44813: 'BEATRICE@r@v27/60700668.".........Raise...the stakes......?"'
44814: 'LAMBDADELTA@r@v29/62200023."What''s this?@k @v29/62200024.Now that sounds interesting.@k@v29/62200025. What do you mean?"'
44815: 'BERNKASTEL@r@v28/62100036."......It''s simple.@k@v28/62100037. Battler got a shot off at us in the last game.@k@v28/62100038. So, if Erika does the same in this game, we''re only even."'
44816: 'BEATRICE@r@v27/60700669."Wasn''t the last game a tie...?"'
44817: 'BERNKASTEL@r@v28/62100039."We threw a game we should have won easily.@k @v28/62100040.If that isn''t a loss, I don''t know what is.@k@v28/62100041. Right, Erika...?"'
44818: 'Erika@r@v46/64500511."Y-yes, my master.@k@v46/64500512. We were expected to win that game if I hadn''t failed so miserably..."'
44819: 'LAMBDADELTA@r@v29/62200026."......Ooooh, I get it.@k @v29/62200027.So this time, you''ll intentionally fight at a disadvantage by not making a detective proclamation...and win despite that...!@k @v29/62200028.You''re aiming to not only wipe out your loss from the previous game, but to totally flip the score upside down, right?"'
44820: 'BEATRICE@r@v27/60700670."Y-......you intend to challenge the game Battler-san poured his heart and soul into with a foolish handicap like that...?@k@v27/60700671. That is not only presumptuous, it''s quite rude...!"'
44821: 'Battler@r@v10/60100399."......Sure is.@k@v10/60100400. It sounds more like an excuse just in case they lose."'
44822: 'LAMBDADELTA@r@v29/62200029."True, you could look at it that way.@k@v29/62200030. If they win, it''s a great victory,@k@v29/62200031. but if they lose, Erika''s side has a nice little excuse... Isn''t that a bit unsporting?"'
44823: 'BERNKASTEL@r@v28/62100042."Don''t worry, the bet will be evenly balanced.@k@v28/62100043. ......If Erika can win this game as a Human without the detective proclamation, it will be impossible for Battler and the others to pick up the pieces of the witch illusion."'
44824: 'BERNKASTEL@r@v28/62100044."......But on the other hand, should Erika lose, I''m going to hurl that garbage detective into the depths of oblivion along with the worst possible fragment."'
44825: 'Erika@r@v46/64500513.".............................."'
44826: 'BERNKASTEL@r@v28/62100045."......See?@k @v28/62100046.Balanced, right?@k @v28/62100047.The ultimate victory of destroying the witch illusion as a mere Human, not a superhuman "detective".@k@v28/62100048. ......In exchange for that, she wagers her own destruction."'
44827: 'BERNKASTEL@r@v28/62100049."I''ve gotten tired of the never-ending stream of bland and boring games that you and the former Beato played.@k@v28/62100050. ......So we''re raising the stakes and settling it all at once."'
44828: 'LAMBDADELTA@r@v29/62200032."......Well, that is true.@k@v29/62200033. ......If Battler can sell this game,@k@v29/62200034. it will mean that Battler has "won" Beato''s game, and the game will come to an end.@k@v29/62200035. ......In a sense, this is the kind of finale you can''t pass up, right...?"'
44829: 'Battler@r@v10/60100401.".....................@k@|@y@v10/60100402. ......I understand your position.@k@v10/60100403. ......Are you fine with that, Erika?"'
44830: 'Erika@r@v46/64500514.".........Y-......yes, of course.@k@v46/64500515. ......In order to regain my master''s trust in me, which I lost with my previous defeat, ...I...I will risk even my own destruction..."'
44831: 'Battler@r@v10/60100404."Is that of your own will...?"'
44832: 'Erika@r@v46/64500516.".................."'
44833: 'LAMBDADELTA@r@v29/62200036."........................"'
44834: 'BERNKASTEL@r@v28/62100051."............What''s wrong, Erika?@k @v28/62100052.Answer him..."'
44835: 'Erika@r@v46/64500517."O-.........obviously.@k@v46/64500518. This is my own will.@k@v46/64500519. ......I will not lose...@k@v46/64500520. ......Even without the detective proclamation, ...I...I will defeat you no matter what...!!"'
44836: 'BEATRICE@r@v27/60700672."............Battler-san........."'
44837: 'Battler@r@v10/60100405."...........................@k@|@y@v10/60100406. ......Alright.@k@v10/60100407. If that''s what you want, I''ll accept your challenge."'
44838: 'Erika@r@v46/64500521."..................@k@|@y@v46/64500522. ......Th-thank you very much.@k@v46/64500523. I''ll make sure you regret it."'
44839: 'LAMBDADELTA@r@v29/62200037."Come to think about it, when Battler played for the Human side, he never had anything as convenient as the detective''s authority.@k@v29/62200038. He was only allowed blue truth and repetition requests."'
44840: 'BERNKASTEL@r@v28/62100053."Exactly.@k@v28/62100054. In a way, it was the previous game that was truly unfair.@k@v28/62100055. .........We failed to win despite that, which is why it was no different from a loss."'
44841: 'Erika@r@v46/64500524."..........................."'
44842: 'Battler@r@v10/60100408."Do what you want.@k@v10/60100409. If you feel like making a detective proclamation, just do it whenever you like.@k@v10/60100410. ......I''ll consider it to be an option you''re keeping available."'
44843: 'Erika@r@v46/64500525."......Why would I ever need to do that......@k@v46/64500526.against an opponent as weak as you......"'
44844: 'Battler@r@v10/60100411."........................"'
44845: 'BERNKASTEL@r@v28/62100056."Then get started, you two.@k@v28/62100057. I''m already starting to get bored."'
44846: 'Erika@r@v46/64500527."......Leave it to me, my master...!!@k @v46/64500528.I will destroy the witch illusion for you without fail...!"'
44847: '@rGeorge and Jessica had been the ones knocking on Erika''s door.'
44848: '@rThey were asking whether Battler and Maria had come to this room.@k ......Of course, they hadn''t.'
44849: 'George@r@v07/60300430."A good while ago, they went downstairs, saying they wanted to get something to drink.@k@v07/60300431. We thought they might have come to your room..."'
44850: 'Erika@r@v46/64500529."Of course they didn''t.@k@v46/64500530. ......Are you sure they didn''t go to the mansion?"'
44851: 'Jessica@r@v04/60200364."We called the servant room and dining hall of the mansion, but no one picked up..."'
44852: 'Erika@r@v46/64500531."......Please stay here, you two.@k@v46/64500532. I''m going to go check the mansion."'
44853: 'George@r@v07/60300432."H-hey, it''s dangerous to go out this late."'
44854: 'Erika@r@v46/64500533."How could a stranger sneak onto this sealed-off island?@k@v46/64500534. Stay in that cousins'' room of yours.@k@v46/64500535. I''ll contact you if anything happens.@k@v46/64500536. Also, tell the servants in the guesthouse servant room not to leave the building.@k@v46/64500537. Bye."'
44855: 'Jessica@r@v04/60200365."W-wait a second, Erika-san...?!!"'
44856: 'George@r@v07/60300433."............She is a strange kid."'
44857: '@rAfter speaking her mind and not listening to anything else, Erika dashed down the stairs and rushed outside.'
44858: 'Erika@r@v46/64500538."......The first twilight usually starts in the morning, but it looks like we''ve got an early fight this time.@k@v46/64500539. ......No crime has occurred in the guesthouse.@k@v46/64500540. So, that means the stage of the tragedy is in the mansion..."'
44859: '@rThough she had an umbrella up, Erika got drenched as she sprinted.'
44860: '@rShe brashly licked the raindrops that dripped down her face......'
44861: '@r......Erika was now at her most energetic...'
44862: '@rAccording to her memory of the previous game, the entrance to the mansion would be locked at the same time the family conference started.'
44863: '@rHowever, the lock was undone this time.'
44864: '@r......Had someone unlocked it, or had the lock not been set, or had it not been possible to set the lock?'
44865: 'Erika@r@v46/64500541."Well, no point thinking about it now.@k@v46/64500542. After all, that might just be a whim of the Game Master''s."'
44866: '@rAs soon as she entered the entrance hall, the door to the parlor opened violently.@k@rOut of it flew Gohda''s large body.'
44867: 'Erika@r@v46/64500543."Ah, good evening, Gohda-san.@k@v46/64500544. Is something the matter?"'
44868: 'Gohda@r@v17/61700006."A-...awawawa....awawawa!!@k @v17/61700007.P-police...ambulance...!!@k @v17/61700008.Awawawawawa!!"'
44869: '@rThat expression really is wonderfully pathetic.@k@rJust fitting for the first one to discover the crime.'
44870: 'Erika@r@v46/64500545."Please calm down.@k@v46/64500546. How could the police or an ambulance get to an isolated island in the middle of a typhoon?@k @v46/64500547.I''m sure the phones are out anyway, so please calm yourself."'
44871: '@rKrauss and Rudolf''s yells could be heard from the parlor.'
44872: '@rTheir shaken appearance perfectly signified the arrival of the first twilight......'
44873: 'Erika@r@v46/64500548."Well then, give me the victims, the locations, and a reconstruction of the situation."'
44874: 'Battler@r@v10/60100412."......Those who left to take a break didn''t come back, so the adults went to the parlor.@k@v10/60100413. When they did, the door was sealed from the inside, and they couldn''t open it.@k@v10/60100414. As they would learn later, the hat stand in the parlor had been used to bar the double doors from the inside."'
44875: 'Erika@r@v46/64500549."So you''re trying to say that the door was blocked from the inside, and the windows were also locked from the inside...?"'
44876: 'Battler@r@v10/60100415."That''s it.@k@v10/60100416. ......When they went around and looked into the parlor through the window, they saw Rosa lying on the sofa in an unnatural position, with blood pouring from her forehead.@k@v10/60100417. ......They then smashed the glass, entered the parlor, and discovered that Maria was also there, lying by the wall and covered in blood."'
44877: 'Erika@r@v46/64500550."......I see.@k@v46/64500551. I''m sure there was quite an uproar.@k@v46/64500552. And the other crime scenes?"'
44878: 'Battler@r@v10/60100418."The entrance wasn''t locked when you came into the mansion...because they had gone out through it to check the parlor from the outside.@k@v10/60100419. ......Since the entrance was locked before the adults went through it, they thought that the other people who had gone missing might be somewhere within the mansion in a similar condition,@k@v10/60100420. so they''re now searching the entire building..."'
44879: 'Erika@r@v46/64500553."Are the locations of the dead the same as in that long-winded, putrid delusion of yours that you showed earlier?"'
44880: 'Battler@r@v10/60100421."......They''re the same."'
44881: 'Erika@r@v46/64500554."Rosa and Maria were in the parlor.@k@v46/64500555. As for the others, ......Natsuhi was in her own room, and Kyrie was in Krauss''s study.@k@v46/64500556. Eva was in the rose garden......no, wait, she was moved to the VIP room, wasn''t she?"'
44882: 'Battler@r@v10/60100422."Yes.@k@v10/60100423. They discover Eva''s body in the VIP room."'
44883: 'Erika@r@v46/64500557."That makes five victims.@k@v46/64500558. Ah, that''s one short for the first twilight.@k@v46/64500559. Who''s the sixth, and where are they?"'
44884: 'Gohda@r@v17/61700009."......?!@k@v17/61700010. Krauss-sama! The chain on this room is also set...!"'
44885: 'Rudolf@r@v08/61200010."Cut it!!@k @v08/61200011.The culprit might be hiding in there!!"'
44886: 'Krauss@r@v02/60800013."Gohda, do it!"'
44887: '@rRudolf and Krauss had brought rifles from Kinzo''s prized collection.'
44888: '@rThey yelled at Gohda, who was carrying the bolt cutter, to cut the chain.'
44889: '@rVictims had been found one after another at several locations inside the mansion.'
44890: '@rThe men who had lost their wives searched through the mansion in a rage, looking for the culprit.'
44891: '@rThis was...a guest room.'
44892: '@rIt had previously been a room where the relatives would stay,@k but it hadn''t been used much since the construction of the guesthouse.'
44893: '@rThis forgotten room was locked from the inside by the chain...'
44894: 'Gohda@r@v17/61700011."......Nnnnn, .........hyaahh!!"'
44895: '@rAs soon as the chain was cut, Rudolf pushed Gohda aside and flew into the room.'
44896: 'Rudolf@r@v08/61200012."Who''s in there?! Show yourself...!!"'
44897: 'Krauss@r@v02/60800014."There''s someone on the bed...!"'
44898: 'Rudolf@r@v08/61200013."Let''s get some light, Aniki...!"'
44899: '@rKrauss pushed the switch on the wall, ......the guest room lit up,@k and the figure lying on the bed came into view...'
44900: 'Rudolf@r@v08/61200014."B-......Battler......!!@|@y@k @v08/61200015.D-......dammit, ......what are you even......doing in here......?!"'
44901: '@rRudolf crumpled to his knees and fell onto Battler''s body.'
44902: '@rNo words could console him as he cried with a mad sorrow...'
44903: '@r......In a single night, ...he had lost both his wife and his son.'
44904: '@rDuring this time, Krauss checked the window locks and the bathroom and searched the closet to find if anyone was hiding there, but he found no one...'
44905: 'Rudolf@r@v08/61200016."Battleeer...! Battleeeeeeer......! Dammiiiiit......! Aaaaaaaaaahhh......"'
44906: 'Gohda@r@v17/61700012."H-......how sad......"'
44907: 'Krauss@r@v02/60800015."......It''s hard to believe, ......but just like the others, ......this is a locked room."'
44908: 'Gohda@r@v17/61700013."Wh-......what, again...?!"'
44909: 'Krauss@r@v02/60800016."Yes......@k@v02/60800017. My study where Kyrie-san was, Natsuhi''s room, the VIP room with Eva, the parlor with Rosa and her daughter...@k@v02/60800018. ...And now Battler-kun in this guest room.@k@v02/60800019. ......They''re all locked rooms...@k@v02/60800020. ...I don''t......understand...@k@v02/60800021. Are we to believe this is suicide...?!"'
44910: 'Rudolf@r@v08/61200017."Like hell it is...!!@k @v08/61200018.How could this be suicide?!@k @v08/61200019.Aaaaggggghhh......Battleeeeeeer......"'
44911: 'Erika@r@v46/64500560."Oh,@k@v46/64500561. ......there''s a surprise.@k@v46/64500562. To think that you yourself would be the sixth person."'
44912: 'Battler@r@v10/60100424."It''s more interesting to kill yourself off every now and then."'
44913: 'BEATRICE@r@v27/60700673."And all of the crime scenes are locked rooms.@k@v27/60700674. ......They''re murders that couldn''t have been performed without magic."'
44914: 'Erika@r@v46/64500563."Hmph, isn''t seeing through that the point of this game?@k@v46/64500564. ...By which I mean, the murders must be possible to commit without magic.@k@v46/64500565. ......After all, if they really could be done only with magic, this wouldn''t be a game."'
44915: 'Battler@r@v10/60100425."......That''s an interesting way of thinking about it.@k@v10/60100426. ......Yeah, that is the sort of game we''ve been playing."'
44916: '@rThis game is fair.'
44917: '@rThe goal is to explain, without magic, the strange crimes that the opposing side claims to have carried out using magic.'
44918: '@rIf that couldn''t be done, it wouldn''t be a game.'
44919: '@rIn other words, just as Erika said, it has to be possible to perform the murders without magic...'
44920: '@r......To view it from the opposite angle, the witch side has a certain responsibility.'
44921: '@rThey have to make a crime that can be reproduced with tricks and not magic.'
44922: '@rAs long as the Human side can''t figure out those tricks, the witch side can use all kinds of magic and illusions.'
44923: '@r......In other words, in order to carry out a locked-room murder with magic,@k@rit is necessary to create a crime that is possible to carry out by Human hands.'
44924: 'Ange@r@v11/62000486.".........By now, I understand.@k@v11/R62000487. I see why, when I ordered the Seven Sisters to kill my classmates back at Saint Lucia,@k@v11/62000488. ......they couldn''t do what I told them.@k@v11/62000489. ......And I understand the meaning of Mammon''s words."'
44925: 'FEATHERINE@r@v50/65000291."Do you mean that "magic is only capable of that which you can accomplish by your own hands"...?"'
44926: '@rAt that time,@k if I had possessed the determination to kill my classmates,@k......No, that''s not it either.'
44927: '@rAt that time,@k if I had been capable of killing my classmates,@k capable of going through with it...'
44928: '@r......then the Seven Sisters of Purgatory would probably have pulled it off for me.'
44929: '@rThey could only accomplish what I could do myself.'
44930: '@r......no, that''s not it.@k@rThey could take what I had accomplished and turn it into "magic".'
44931: '@rOf course, there were a great number of witnesses in that classroom, so that would probably have been impossible.@k ......Maria onee-chan would call it "being burned by the anti-magic toxin".'
44932: '@rHowever, ......if I had called those classmates out somewhere without witnesses, ......and carried out murder myself...'
44933: '@r...that would be when "the Seven Sisters of Purgatory" could "carry out a magical murder".'
44934: 'Ange@r@v11/62000490."......Even with magic, witches cannot do things that they cannot accomplish by themselves.@k@v11/62000491. ......They can only use magic to "embellish" the things that are possible for them."'
44935: 'FEATHERINE@r@v50/65000292."......How interesting it is.@k@v50/65000293. ......That those who accomplish something without using magic nevertheless speak of magic and call themselves witches."'
44936: 'FEATHERINE@r@v50/65000294."This Erika person has understood that since the beginning.@k@v50/65000295. ......That''s why she will never surrender to witches.@k@v50/65000296. ...She is confident that it must be explainable with tricks.@k@v50/65000297. The old Battler was toyed with so frequently because he did not possess that confidence..."'
44937: 'Ange@r@v11/62000492."......Once this rule is seen through, the witch loses any chance of victory.@k@v11/62000493. ......That''s why they have to make their opponent surrender before they see the truth of this rule.@k@v11/62000494. ......The longer the match is drawn out, ......and the more hints are given, ......the more overwhelming the witch''s disadvantage becomes..."'
44938: '@rOnce again, my thoughts are spinning in circles.'
44939: '@r......Why did Beato prolong this game until she lost?'
44940: '@r....................................'
44941: '@rMany victims had been found, and the mansion was still wrapped in chaos.'
44942: '@rHideyoshi''s group seemed to have gone to the guesthouse, worrying about the safety of the kids there.'
44943: '@rKrauss and Rudolf were in the hall, talking about what should be done next...'
44944: '@rDuring a short gap in this chaos,@k .........Erika dashed all about the mansion.'
44945: '@rShe was checking the crime scenes.'
44946: '@rNormally, with the detective''s authority, Erika had the right to openly investigate the crime scenes to her heart''s content.'
44947: '@rHowever, this time, she hadn''t yet invoked that authority.@k ......Because of that, and with her being a guest and an outsider, there was little to no chance that she would be allowed to investigate.'
44948: '@rSo, she was forced to quickly check all of the crime scenes now,@k while she could still run about as she pleased.'
44949: '@rIn the servant room, there had been a clear folder containing a plan of the mansion''s interior.'
44950: '@rBecause she had borrowed that, she knew the location of every room in the mansion...'
44951: '@rErika efficiently made her way through the mansion, dashing into each crime scene in turn...'
44952: 'Dlanor@r@v47/64600096."Lady ERIKA, ......I believe you know, but allow me to warn you just in CASE."'
44953: 'Erika@r@v46/64500566."Yes? What is it?"'
44954: 'Dlanor@r@v47/64600097."It is true that you have an incredible photographic MEMORY.@k@v47/64600098. ......When you combine that with the detective''s proclamation, it becomes impossible for you to be fooled by ANYTHING."'
44955: 'Erika@r@v46/64500567."Oh, I know what you''re going to say.@k@v46/64500568. ......Since I haven''t made the detective proclamation, even my photographic memory could potentially be fooled.@k@v46/64500569. Of course, I understand that.@k@v46/64500570. ......Still, that doesn''t mean I can afford to go without viewing the crime scenes directly."'
44956: 'Erika@r@v46/64500571."......After all, in the last game, my pride in that regard led me to commit a truly agonizing blunder."'
44957: 'Dlanor@r@v47/64600099."To take an extreme case, no matter how well you examine a person''s corpse right now,@k@v47/64600100. the possibility will always remain that they were faking their DEATH.@k@v47/64600101. It will probably be necessary to give Battler repetition requests to confirm the details of each situation INDIVIDUALLY."'
44958: 'Erika@r@v46/64500572."And I''ll need to use the blue truth liberally in order to draw those out of him.@k@v46/64500573. ......I know that.@k@v46/64500574. Let''s start with the basics.@k@v46/64500575. ......The lack of the detective''s authority is no handicap.@k@v46/64500576. It simply means that I''m fighting under the same conditions Battler once was."'
44959: '@rYes.@k This fight......is retracing the old days when Battler and Beato fought so fiercely.'
44960: '@rI have no conveniences such as the detective''s authority.'
44961: '@r......I truly do just have to fight the same way the old Battler fought.'
44962: '@rThinking of it this way,@k it may be true that I was in a very blessed, unfair position last game, just as my master said...'
44963: '@rIt may be difficult without the detective''s authority, which also holds my honor as a detective.'
44964: '@rBut I won''t let that be a handicap.'
44965: '@rI know what magic is, and I''m fully aware of how to fight with the red and blue truths.'
44966: '@rI know the way to fight in this game many times better than the old Battler did......'
44967: '@rI quickly visited the VIP room, Krauss''s study, and Natsuhi''s room on the second floor, as well as the parlor and the guest room on the first floor,@k this time checking with my own eyes, as I had neglected to do in the last game...@|@y'
44968: '@rFirst off, all of the scenes were made to look like locked rooms.'
44969: '@rProbably of special note is the fact that the master keys have no relation to the tricks this time.'
44970: '@rThe locked rooms were all constructed...@k...without relying on any elements that could be locked or unlocked from the outside by a master key or something else.'
44971: '@rThe windows were locked from the inside, and the doors were all locked and chained.'
44972: '@rThe master key can get around all of the locks on the doors, but the window locks and the chain locks are more trouble than they might appear.'
44973: '@rI haven''t yet used a repetition request to get confirmation that it''s impossible to manipulate them from the outside, ......but I''m sure he''ll be able to say it in red.@k It''d be stupid otherwise.'
44974: 'Erika@r@v46/64500577."......I understand.@k@v46/64500578. Right now, I am a mere Human.@k@v46/64500579. ......I can''t even properly confirm the deaths of the corpses."'
44975: '@r......Last time I neglected to check the bodies, ......and let a massive piece of "magic" get by me.'
44976: '@rI won''t fail like that again......'
44977: '@rIf I let that happen even once more,@k ......I won''t be able to face the master I''m so indebted to......'
44978: 'Dlanor@r@v47/64600102."We have checked all of the crime scenes and finished gathering INFORMATION.@k@v47/64600103. Here is our REPORT."'
44979: 'Erika@r@v46/64500580."Go ahead."'
44980: 'Dlanor@r@v47/64600104."First, all of the rooms employ window locks and chain locks...@k@v47/64600105.to form locked rooms in a way that would be "difficult to interfere with from the OUTSIDE".@k@v47/64600106. The only exception is the parlor, where Rosa and Maria lay DEAD."'
44981: 'Gertrude@r@v48/64800007."For your attention: I beg to inform you of the following.@k@v48/64800008. Let it be known that the door was barred with a hat stand."'
44982: 'Cornelia@r@v49/64700004."It is thought to be substantially the same as a chain lock, in that it can only be set from the inside."'
44983: 'Dlanor@r@v47/64600107."It is probably his goal to construct locked rooms where explanations using master keys are made completely INEFFECTIVE.@k@v47/64600108. The parlor has no chain lock due to its very nature, so it is natural that something else would be used in place of a CHAIN."'
44984: 'Erika@r@v46/64500581."......In that case, the interesting question becomes why he didn''t choose one of the other rooms that do have a chain lock.@k@v46/64500582. There are several other guest rooms besides the one Battler lay dead in, all with a similar construction, correct?"'
44985: 'Dlanor@r@v47/64600109."Yes, that is CORRECT."'
44986: 'Erika@r@v46/64500583."In that case, it would have been more aesthetically pleasing to lock them in there, so that everyone would be inside a room locked by a chain, yet he did not do that.@k@v46/64500584. ......This hat stand door bar in the parlor seems very suspicious.@k@v46/64500585. I should probably investigate it thoroughly with repetition requests.@k@v46/64500586. Also, regarding the bodies, ......in the last game, their throats were sliced wide open...@k @v46/64500587.to the point that the deaths could be confirmed with certainty even without the detective''s authority, but was there anything like that this time around?"'
44987: '@rOf course, she had checked all of the corpses in all of the crime scenes this time.'
44988: '@r......However, without the detective''s authority, she had no guarantee that she would be able to see through any faked deaths "with certainty"...'
44989: '@rThe old Battler had also started fighting by doubting whether the victims were truly dead.'
44990: '@rIt was the same for Erika......'
44991: 'Gertrude@r@v48/64800009."For your attention: I beg to inform you of the following.@k@v48/64800010. Know that there were no corpses that could have been confirmed dead with certainty by physical means."'
44992: 'Cornelia@r@v49/64700005."For your attention: I beg to inform you of the following.@k@v49/64700006. We cannot eliminate the possibility that any one of these corpses might be a faked death."'
44993: 'Erika@r@v46/64500588."......Well, even if I make a repetition request to confirm their deaths, I doubt Battler will be so quick to answer.@k@v46/64500589. ......Sheesh......"'
44994: 'LAMBDADELTA@r@v29/62200039."I liked Beato''s chain of six locked rooms better.@k@v29/62200040. ......But these locked rooms are more complete, considering that master keys are of no help at all."'
44995: 'BERNKASTEL@r@v28/62100058."......There are two general ways of breaking locked rooms that Battler might be after.@k@v28/62100059. ......An illusion of a locked room, or an illusion of a crime.@k@v28/62100060. It''ll be one of those."'
44996: 'LAMBDADELTA@r@v29/62200041."I get the first one.@k@v29/62200042. That''s when something looks like a locked room, but it actually isn''t, right?@k@v29/62200043. What do you mean by an illusion of a crime?"'
44997: 'BERNKASTEL@r@v28/62100061.".........An illusion that makes it seem as though a crime has occurred.@k@v28/62100062. In other words, are they really dead?"'
44998: 'LAMBDADELTA@r@v29/62200044."Come on, are you kidding me?@k@v29/62200045. If the person inside a locked room is alive, it''s no different than if they were just taking a pee.@k@v29/62200046. ......Still, with this locked room,@k@v29/62200047. it''s pretty hard to think of any other answer."'
44999: 'BERNKASTEL@r@v28/62100063."What about the endless possibilities of manipulating the chain lock from the outside?@k @v28/62100064.We don''t know if there are secret doors, ways to kill from a distance, chances of suicide,@k@v28/62100065. or even whether these are complete locked rooms in the first place."'
45000: 'LAMBDADELTA@r@v29/62200048."......I have a behind-the-scenes view of Battler''s game board, so I can tell you this:@k@v29/62200049. these are perfect locked rooms.@k@v29/62200050. They can only be constructed from the inside, and there''s no way to construct, deconstruct, or interfere with them from the outside."'
45001: 'BERNKASTEL@r@v28/62100066."Can you say that in red?"'
45002: 'LAMBDADELTA@r@v29/62200051."That''d be a little too rude to Battler, so no.@k@v29/62200052. If you do love me, you must see my words as red truth, right...?"'
45003: 'BERNKASTEL@r@v28/62100067.".........Then the locked rooms are perfect.@k@v28/62100068. In other words, this is an illusion of a crime."'
45004: 'LAMBDADELTA@r@v29/62200053."It does seem that way.@k@v29/62200054. If so, these locked rooms are all a ruse.@k@v29/62200055. ......I guess the whole Ushiromiya family got so fed up with Erika prattling on about being a detective and not knowing when to shut up...@k@v29/62200056....that they all joined together and set up a fake murder to make fun of her, or something?@k @v29/62200057.Wait, is that the right answer?@k @v29/62200058.I''m, like, a super great detective☆"'
45005: 'BERNKASTEL@r@v28/62100069."Unfortunately, ......this isn''t a ruse.@k@v28/62100070. The victims have been thoroughly killed."'
45006: 'LAMBDADELTA@r@v29/62200059."Huh?!@k @v29/62200060.And you''re not talking about "at midnight on the second day"?"'
45007: 'BERNKASTEL@r@v28/62100071."No detective proclamation has been made, but she is very accurate when examining corpses.@k@v28/62100072. I could almost even give her examinations the red truth."'
45008: 'LAMBDADELTA@r@v29/62200061."So what does that mean?@k @v29/62200062.That they were definitely dead when Erika examined their corpses?"'
45009: 'BERNKASTEL@r@v28/62100073."Yes, that''s right.@k@v28/62100074. Well and truly."'
45010: 'LAMBDADELTA@r@v29/62200063."But you won''t say it in red for her, riiight?@k@v29/62200064. *giggle*, and that poor Erika must want it so baaad."'
45011: 'BERNKASTEL@r@v28/62100075."Well, she isn''t even a detective this time around.@k@v28/62100076. I won''t give her any red. *giggle*giggle*."'
45012: 'LAMBDADELTA@r@v29/62200065."But then, .......if that''s all true, that''s amazing!@k@|@y@v29/62200066. This time, ......Battler''s really made a perfect locked-room murder!"'
45013: 'BERNKASTEL@r@v28/62100077."......Oh, perhaps he has."'
45014: 'LAMBDADELTA@r@v29/62200067."Will Erika be alright?@k @v29/62200068.It looks like an ordinary locked-room murder at a glance,@k@v29/62200069. ......but this one is secretly pretty nasty.@k@v29/62200070. Won''t this be a bit too much for Erika without her detective''s authority...?"'
45015: 'BERNKASTEL@r@v28/62100078."She is a self-proclaimed "great detective".@k@v28/62100079. I''m sure she''ll pull through.@k@v28/62100080. .........If Battler and Beato are defeated by a mere Human who isn''t even a detective, they''ll fall apart in the most exquisite way, don''t you think?"'
45016: 'LAMBDADELTA@r@v29/62200071."......And even if Erika loses, we get to play by throwing her into the worst fragment and casting her into the depths of oblivion, right?"'
45017: 'BERNKASTEL@r@v28/62100081."Exactly.@k@v28/62100082. No matter how the chips fall, it won''t be boring for us."'
45018: 'LAMBDADELTA@r@v29/62200072."You really don''t have one tear to shed or a drop of blood in your veins, do you?@k@v29/62200073. ...Still, wringing that black cat out like a towel and licking up the single drop that comes out is what brings me joy!"'
45019: 'BERNKASTEL@r@v28/62100083."Beato''s game board did entertain me for quite some time,@k@v28/62100084. ......but we''ve already wrung everything we can from it."'
45020: 'BERNKASTEL@r@v28/62100085."......It''ll be over with this game.@k@v28/62100086. So if we''re going to cap it off properly, we really must let Erika and Battler bet everything in one final face-off."'
45021: 'LAMBDADELTA@r@v29/62200074."......Booo.@k@v29/62200075. I wanted to play this game with you forever.@k@v29/62200076. ......What a shame."'
45022: 'BERNKASTEL@r@v28/62100087."Come now.@k@v28/62100088. I''ve spent plenty of time with you already.@k@v28/62100089. ......Go find me another interesting game board.@k@v28/62100090. If you do, I''ll play with you again..."'
45023: 'LAMBDADELTA@r@v29/62200077."Ahhhh..................you really don''t ever let me get bored.@k@v29/62200078. ......Be like this forever, BERNKASTEL.@k@v29/62200079. Seeing your face twist with anguish is the one forbidden honey I''ve found for myself."'
45024: '@rLAMBDADELTA had guaranteed that it was a perfect locked room.@k@rBERNKASTEL had guaranteed that it was a perfect murder.'
45025: '@rA perfect@w166. "locked-room"@w166. "murder".'
45026: '@rThe witches hated to be a killjoy, so they wouldn''t yet say anything with the red truth.'
45027: '@r......Pursuing that would be the role of Battler and Erika......'
45028: 'Battler@r@v10/60100427."It seems like you had a pretty mad dash around the crime scenes.@k@v10/60100428. ......Satisfied? Is your inspection complete?"'
45029: 'Erika@r@v46/64500590."Yes, I''m satisfied.@k@v46/64500591. So, about our war of red and blue, what are your thoughts?@k @v46/64500592.Shall we start right away?@k @v46/64500593.Or do it all at the end?"'
45030: 'Battler@r@v10/60100429."I don''t like putting things off.@k@v10/60100430. I think the same goes for you."'
45031: 'Erika@r@v46/64500594."Then allow me to get started with the locked rooms of the first twilight.@k@|@y@v46/64500595. ......First, I''d like to check.@k@v46/64500596. Do you intend to respond to my repetition requests?"'
45032: 'Battler@r@v10/60100431."That depends on what they are.@k@v10/60100432. I have no obligation to respond to all of them, and I won''t reveal my reasons when I refuse."'
45033: 'Erika@r@v46/64500597."<Good>.@k@v46/64500598. ......Then let''s start simple and confirm the definition of a locked room.@k@v46/64500599. Dlanor!@k @v46/64500600.Please read it aloud."'
45034: 'Dlanor@r@v47/64600110."UNDERSTOOD.@k@v47/64600111. ......We request that the following be REPEATED."'
45035: '@rDlanor unfurled the kind of scroll often depicted in Western fairy tales when an official reads a royal decree,@k and she read the contents aloud.'
45036: 'Dlanor@r@v47/64600112."First.@k@v47/64600113. "The rooms with the six people in them are all locked ROOMS"."'
45037: 'Battler@r@v10/60100433.@|@y"@c900.@[Acknowledged.@]@c.@k@v10/60100434. Of course, that''s only until Gohda and the others severed the chains and destroyed the locked rooms."'
45038: '@rAt a nod from Dlanor, Cornelia, who stood behind her, started taking notes.'
45039: 'Dlanor@r@v47/64600114."Second.@k@v47/64600115. "The definition of locked room implies that it is impossible to construct from the OUTSIDE"."'
45040: 'Battler@r@v10/60100435.@|@y"@c900.@[Acknowledged.@]@c."'
45041: 'BEATRICE@r@v27/60700675."......In other words, no trickery done from the outside can construct a locked room.@k@v27/60700676. It isn''t permitted for a chain lock to be reset from the outside by a skillfully used wire, for example."'
45042: 'Erika@r@v46/64500601."I didn''t need you to tell me that.@k@v46/64500602. Dlanor, please continue."'
45043: 'Dlanor@r@v47/64600116."Third.@k@v47/64600117. "The definition of a locked room implies that all forms of interference between the inside and outside of the room are PREVENTED"."'
45044: 'Battler@r@v10/60100436.@|@y"@c900.@[Acknowledged.@]@c.@k@v10/60100437. However, I won''t rule out the kinds of interference that you''d expect from a normal room, such as knocks, voices, and the extension telephone line."'
45045: 'Dlanor@r@v47/64600118."Fourth.@k@v47/64600119. "At the time of the breaking of the locked rooms, none existed within the rooms except the VICTIMS (Natsuhi, Eva, Kyrie, Rosa, Maria, Battler)"."'
45046: 'Battler@r@v10/60100438.@|@y"@c900.@[Acknowledged.@]@c."'
45047: '@rThis was to check that the murderer hadn''t been hiding inside a locked room.'
45048: '@rBecause if the discoverers departed the scene after becoming aware of the locked-room murder,@k and then the culprit slipped out of the room after that, it would have been possible to construct an illusion of a locked room.'
45049: '@rBecause Battler had acknowledged their statement with the red truth,@k this possibility—that the culprit and the victim had both been inside the locked room at the time of the crime, following which the culprit had hid under the bed and snuck out after the discovery of the crime—@khad now been eliminated.'
45050: 'Dlanor@r@v47/64600120."Fifth.@k@v47/64600121. "No murder was committed after the breaking of the locked ROOMS"."'
45051: 'Battler@r@v10/60100439."I decline."'
45052: 'Erika@r@v46/64500603."......Why?@k @v46/64500604.Because the victims really were alive at the point when the locked rooms were destroyed?@k @v46/64500605.And the culprits were actually Krauss and the others who crowded in, who committed the murders then and there.@k@v46/64500606. In other words, because it was a murder after the locked room was destroyed. Is that the truth behind this...?!"'
45053: 'BEATRICE@r@v27/60700677."No, that''s not it.@k@v27/60700678. The murders will continue to occur, so he can''t declare in red that no murders will happen after this."'
45054: 'Erika@r@v46/64500607."......Tch, a stupid technicality.@k@v46/64500608. You must understand what we''re getting at.@k@v46/64500609. @|@y@c279.@[Krauss''s group cut the chains and destroyed the locked rooms, then killed the people inside.@]@c.@k@v46/64500610. I just want you to argue against this."'
45055: 'Dlanor@r@v47/64600122."Lady ERIKA, ......the undefined plurality of "Krauss''s group" is INSUFFICIENT.@k@v47/64600123. You should first check to see which humans entered the rooms after the locked rooms were BROKEN."'
45056: 'Gertrude@r@v48/64800011."For your attention:@k@v48/64800012. ......excepting the victims, the only ones to enter the locked rooms were these four: Krauss, Rudolf, Hideyoshi, and Gohda."'
45057: 'Cornelia@r@v49/64700007."For your attention:@k@v49/64700008. this is based on hearsay.@k@v49/64700009. Be advised that there is no proof that others did not enter."'
45058: 'Erika@r@v46/64500611."I know that already.@k@v46/64500612. Let''s have him repeat that.@k@v46/64500613. ......''After the breaking of the locked rooms, the only ones to enter the rooms apart from me were these four: Krauss, Rudolf, Hideyoshi, and Gohda''."'
45059: 'Battler@r@v10/60100440."Sure.@k@v10/60100441. @|@y@c900.@[Acknowledged.@]@c.@k@v10/60100442. However, this only applies to the current point in time.@k@v10/60100443. It''s possible that some later development in the game will cause more people to enter."'
45060: 'Erika@r@v46/64500614."Repetition requested.@k@v46/64500615. "Krauss, Rudolf, Hideyoshi, and Gohda are not culprits"."@|@y'
45061: 'Battler@r@v10/60100444."........................"'
45062: '@rBattler put his finger on his chin, deep in thought.'
45063: '@rThis word "culprit" was fairly broad.@k And it might serve to greatly restrict the darkness of the witch.'
45064: 'BEATRICE@r@v27/60700679.".........Why not answer?@k@v27/60700680. If we decline, they''ll leave behind a blue truth saying that Krauss and the others were the culprits."'
45065: 'Battler@r@v10/60100445."........................@k@|@y@v10/60100446. ......You''re right.@k@v10/60100447. ......I''ll acknowledge it, but I''ll make the language more strict.@k@v10/60100448. @|@y@c900.@[Krauss, Rudolf, Hideyoshi, and Gohda—@k@v10/60100449.@|@ythese four had no involvement in murdering these six: Natsuhi, Eva, Kyrie, Rosa, Maria, and Battler.@]@c."'
45066: 'Erika@r@v46/64500616."And that means it was also impossible for any of the other humans, who didn''t even enter the locked room,@k@v46/64500617. to have been involved in those murders either, doesn''t it?"'
45067: 'Battler@r@v10/60100450."Who knows. Think about it yourself.@k@v10/60100451. If you think you can build up some blue truth for how a locked-room murder can be committed without entering the room, then I''ll respond with the red truth."'
45068: 'Battler@r@v10/60100452."......However, I only need to destroy one of the blue truths you''ll be presenting from here on out.@k@v10/60100453. In other words, even if you do manage to use the blue truth and explain this away with some long-distance locked-room murder trick X,@k@v10/60100454. I don''t necessarily have to counter that with the red truth."'
45069: '@rThese are the rules of the witch''s game.'
45070: '@rAnge checked these details with Beato in the fourth game.'
45071: '@rThe witch side lays out mystery after mystery and claims them all to be impossible to carry out except by magic.'
45072: '@rThe human side must use the blue truth to argue that they are explainable with tricks.'
45073: '@rAnd if they cannot make a counterargument with the blue truth for even one of these mysteries,@k that mystery will be considered to have been "done by magic",@k and it will be impossible to deny the existence of a witch...'
45074: '@rIn other words, the witch side only needs to protect any one of its mysteries.'
45075: '@rIn contrast, the human side has to fully explain all mysteries with the blue truth.'
45076: '@rAnd even if the human side manages to explain all of the mysteries with the blue truth,@k if any one of those is successfully countered by the red truth, the witch will win.'
45077: '@rTherefore, just like the strategy that the old Beato adopted in her final game,@k it is sufficient for the witch side to put off their red text counterarguments until the very last moment,@k then make a single strike at their opponent''s most fragile spot......'
45078: 'Erika@r@v46/64500618."In any event, ......you''ve declined to repeat that last one, right?"'
45079: 'Battler@r@v10/60100455."Don''t kid yourself.@k@v10/60100456. You''re not entitled to have your repetition requests answered."'
45080: 'Erika@r@v46/64500619.".........Ggh......"'
45081: '@rFrom the perspective of the witch side, repetition requests are just a supplement to make sure that the human side hasn''t misunderstood the question.'
45082: '@rTherefore, they have neither a technical nor a moral obligation to respond to requests that are extremely broad...'
45083: 'Erika@r@v46/64500620."......Not bad. ......Looks like you can handle being a player on the witch side pretty well too."'
45084: 'Battler@r@v10/60100457."Your experience is no match for mine."'
45085: 'Erika@r@v46/64500621."Tch...! Dlanor!"'
45086: 'Dlanor@r@v47/64600124."Let us CONTINUE.@k@v47/64600125. Sixth, "the victims did not die by any method other than HOMICIDE"."'
45087: 'Battler@r@v10/60100458.@|@y"@c900.@[Acknowledged.@]@c."'
45088: 'BEATRICE@r@v27/60700681."Of course, there were no suicides or accidental deaths."'
45089: 'Dlanor@r@v47/64600126."Seventh, ''the victims—"'
45090: 'Erika@r@v46/64500622."That''s enough, Dlanor."'
45091: 'Dlanor@r@v47/64600127."......Are you SURE?@k @v47/64600128.There are still items..."'
45092: 'Erika@r@v46/64500623."Yes, that will do fine.@k@v46/64500624. I''ve confirmed the status of the crime scenes.@k@v46/64500625. From here on, it''s time for me to argue back with the blue truth."'
45093: 'Battler@r@v10/60100459."Fine by me.@k@v10/60100460. Let me hear your masterful theories."'
45094: '@rThough Battler and Erika were enemies,@k ......it looked to Beato as though they were having a little fun doing it.'
45095: '@r......She was probably slightly jealous of Erika.'
45096: '@rBeato thought back on the books she had read in FEATHERINE''s archives, in which the old her and Battler had fought.@k ......That must have been fun as well.'
45097: '@rDuring a short break in the family conference, a horrible, brutal mass murder had occurred...'
45098: '@rExcluding Battler, the six people killed had all been women......'
45099: '@rThe men who had been left behind went mad with rage at the cowardice of it, broke down sobbing at the sadness of losing their wives, ......and went back and forth between the two many times......'
45100: 'Hideyoshi@r@v06/61100012."Why were they all girls......?@k@v06/61100013. How cowardly can a person be...?"'
45101: 'Rudolf@r@v08/61200020."What''s wrong with us?!@k @v08/61200021.Here we are, under the same roof, and we''re just smoking away, not noticing that members of our own family are being killed...dammit!!"'
45102: 'Krauss@r@v02/60800022."......But...who......how...?@k@v02/60800023. They were not unprotected...@k@v02/60800024. The chain was set for all of them..."'
45103: 'Rudolf@r@v08/61200022."Who gives a damn about that?!@k @v08/61200023.I don''t care how they killed them, I just want to know who!!"'
45104: 'Hideyoshi@r@v06/61100014."Hey, Genji-san, Gohda-san.@k@v06/61100015. Were the doors and windows to the mansion all locked during the family conference...?"'
45105: 'Gohda@r@v17/61700014."Y-yes.@k@v17/61700015. There can be no doubt...!"'
45106: 'Genji@r@v14/61600040."......In accordance with Madam''s instructions, everything is always locked at the time of the night patrol.@k@v14/61600041. Tonight was a special case, but everything was locked up shortly after seeing the children off to the guesthouse..."'
45107: 'Rudolf@r@v08/61200024."That doesn''t make any sense...!@k @v08/61200025.If that''s true, how were Battler and Maria-chan inside the mansion?!@k @v08/61200026.They shouldn''t have been able to get in, right?!"'
45108: 'Hideyoshi@r@v06/61100016."If everythin'' really was locked up properly, that couldn''t have happened...!@k @v06/61100017.Doesn''t the two of them bein'' inside the mansion prove that the building wasn''t completely locked up...? Right? Right?!"'
45109: '@rHe was arguing that Gohda''s failure to lock up properly might have allowed a stranger to sneak in.'
45110: '@rAt the very least, none of them had known that Battler and Maria had visited the mansion.'
45111: '@rIf those two had come and found everything locked tight, they wouldn''t have been able to get inside.'
45112: '@rIf they had rung the doorbell, Gohda would probably have heard them from the servant room, but Gohda said that nothing of the sort had happened.@k How they had entered the locked mansion was a complete mystery...'
45113: 'Gohda@r@v17/61700016."Y-you don''t think......@k@v17/61700017. For example, what if Madam or someone happened to be close by the entrance...@k@v17/61700018.and noticed Battler-sama and Maria-sama knocking or heard the bell......?"'
45114: 'Rudolf@r@v08/61200027."That couldn''t have happened!@k @v08/61200028.You were in the servant room then, right, Gohda-san?!@k @v08/61200029.There''s a chime that goes off in the servant room when the front door opens!@k @v08/61200030.There''s no way you''d have missed anyone!"'
45115: 'Gohda@r@v17/61700019."Y-yes, but, you see......"'
45116: 'Genji@r@v14/61600042."......At that time, Gohda was serving drinks as you requested,@k@v14/61600043. so he was not in the servant room."'
45117: 'Rudolf@r@v08/61200031."Why was there only one servant in the mansion on such an important day?!@k @v08/61200032.Why was someone as important as Genji-san on duty in the guesthouse?!@k @v08/61200033.Does that make any sense?!@k @v08/61200034.Why was the servant room left empty...?!!"'
45118: 'Krauss@r@v02/60800025."......My wife was the one who put those shifts together.@k@v02/60800026. ......She probably hoped that Gohda would serve some fashionable drinks during the family conference as well, since he often thinks to do such things..."'
45119: 'Hideyoshi@r@v06/61100018."But Krauss nii-san...!@k @v06/61100019.This is the family conference, right?!@k @v06/61100020.The most important day of the year, right?!@k @v06/61100021.Why was Gohda-san left as the only person on shift in the mansion...?!@k @v06/61100022.If there''d been just one more person, everythin'' would be different, don''tcha think?!@k@v06/61100023. Well? Well?!"'
45120: '@rWith a half-crying, half-enraged jumbled up expression,@k Hideyoshi yelled at Gohda.'
45121: '@rOf course, the culprit who killed everyone was the most to blame and the most despicable.'
45122: '@r......However, even if he understood that,@k he needed to let off some of his emotions by hating someone he could see.'
45123: 'Erika@r@v46/64500626."............I understand how distressing this must be for all of you.@k@v46/64500627. ......However, please calm down."'
45124: 'Erika@r@v46/64500628."......I don''t know whether Gohda-san wasn''t thorough enough when locking up,@k@v46/64500629. ......or whether someone let Battler-san and Maria-san in after they came back from the guesthouse, and then forgot to lock up afterwards.@k@v46/64500630. ......But whatever the case, it doesn''t necessarily have anything to do with how the mysterious culprit snuck in."'
45125: 'Erika@r@v46/64500631."......After all, the mansion is massive.@k@v46/64500632. They might have come in much earlier and hid until late at night for all we know.@k@v46/64500633. ......I can understand the desire to suspect someone, but please calm down."'
45126: 'Krauss@r@v02/60800027."......Our guest is right.@k@|@y@v02/60800028. ......The culprit is the one we should hate, ......not Gohda, who just happened to be on duty...@k@v02/60800029. ......At any rate, let''s calm down.@k@v02/60800030. ......I feel as terrible as the rest of you.@k@v02/60800031. However, we must take the initiative now and regain our composure."'
45127: 'Rudolf@r@v08/61200035."Aniki......"'
45128: 'Krauss@r@v02/60800032."We all feel sad and devastated.@k@v02/60800033. And none of us will ever forgive the one who did this.@k@v02/60800034. That is why we all need to regain our composure..."'
45129: 'Hideyoshi@r@v06/61100024."......H-......he''s right.@k@v06/61100025. ......I still have George.@k@v06/61100026. Krauss nii-san still has Jessica-chan.@k@v06/61100027. And Rudolf-kun, ...you still have Ange-chan waitin'' for you to return, right?@k@v06/61100028. It''s still......too soon...to go riskin'' everything to take down the killer......"'
45130: 'Erika@r@v46/64500634."......The culprit is still on this island.@k@v46/64500635. And we can''t be sure that this tragic crime is over.@k@v46/64500636. We need to stay calm and prevent any further tragedies."'
45131: '@rErika''s words softly consoled them...and gently admonished them.'
45132: '@r......If a servant had said the same thing, Rudolf would probably have jumped on him.'
45133: '@rHowever, since it had come from the lips of the guest, a neutral party, ......it seemed to reach their ears.'
45134: 'Erika@r@v46/64500637."Let''s stay cool.@k@v46/64500638. ......We have three grown men with us, and guns as well.@k@v46/64500639. Judging by the pattern of the murders, the chances that the culprit has a gun are low.@k@v46/64500640. ......In other words, as long as we keep our heads, the culprit will no longer have any way to touch us."'
45135: 'Krauss@r@v02/60800035."......She''s right.@k@v02/60800036. We can''t let that murderer have his way on our island any longer."'
45136: 'Rudolf@r@v08/61200036."Let''s find the killer!@k @v08/61200037.We''re in the middle of a typhoon.@k@v08/61200038. They can''t escape from the island, and there''s only so many places where they can take shelter from the rain...!"'
45137: 'Erika@r@v46/64500641."This island is larger than you''d think.@k@v46/64500642. Unfortunately, it would be difficult to search the island with so few people.@k@v46/64500643. ......After all, you all look ready to shoot the culprit dead on the spot if you were to find them now.@k@v46/64500644. If the culprit has fled into that dense forest fearing for their life, you won''t find them easily."'
45138: 'Hideyoshi@r@v06/61100029."...........................@k@v06/61100030. ......Right.@k@v06/61100031. ...We should just wait patiently for the typhoon to pass,@k@v06/61100032. have the boat call the police for us, and let them thoroughly search the island...@k@v06/61100033. The police are incredible, y''know.@k@v06/61100034. They''ll bring hundreds of people and pick through it with a fine-toothed comb.@k@v06/61100035. ......That forest may be deep, but they''ll definitely smoke the killer out..."'
45139: 'Krauss@r@v02/60800037."The most important thing now...@k@v02/60800038....is to make sure no more of our beloved family members are taken from us.@k@v02/60800039. .........Rudolf.@k@v02/60800040. If something happens to you, what will happen to Ange-chan back home?"'
45140: 'Rudolf@r@v08/61200039."......Kyrie............Battler.........@k@v08/61200040. .........Dammit, ......dammiiiiiiit......@k@v08/61200041. ......I never......had a chance.........to tell you the truth........."'
45141: 'Erika@r@v46/64500645."........................@k@v46/64500646. ......Krauss-san.@k@v46/64500647. I''m sure that everyone in the cousins'' room is extremely agitated right now.@k@v46/64500648. ......If you show them that you''ve regained your composure, I''m sure that will help them relax a lot.@k@v46/64500649. ......Would you mind heading up there?"'
45142: 'Krauss@r@v02/60800041.".........Good point.@k@v02/60800042. We have to talk with everyone about what we''re going to do next."'
45143: 'Erika@r@v46/64500650."Please go up with him, Genji-san and Gohda-san.@k@v46/64500651. ......I''m sure that Shannon-san, Kanon-san, and Kumasawa-san are all very agitated as well."'
45144: 'Gohda@r@v17/61700020."Y-......yes...!@k @v17/61700021.Yes, I''m sure everyone is quite agitated......!"'
45145: 'Genji@r@v14/61600044.".........Are you certain?@k@v14/61600045. ......Is there nothing more we can help with?"'
45146: 'Erika@r@v46/64500652."That''s the very reason I want you to go with Krauss-san.@k@v46/64500653. I want you there to help him if something happens.@k@v46/64500654. ......I''d like for the rest of us to check that everything''s locked up here.@k@v46/64500655. We''ll head up soon, so please go on ahead."'
45147: 'Genji@r@v14/61600046."Understood......@k@v14/61600047. ......If you need anything, please call us."'
45148: '@rGenji bowed and nodded to Krauss.'
45149: '@rKrauss nodded to Erika, then headed upstairs with Genji and Gohda.'
45150: '@r.........When only men are around in a time of confusion, it is easy for a composed member of the opposite sex to control the initiative.'
45151: '@rEven without the detective''s authority, she was able to control them quite naturally.'
45152: '@rErika had wanted to get rid of the servants for the time being......'
45153: 'Rudolf@r@v08/61200042."Okay.@k@v08/61200043. In that case, let''s get to checking the locks."'
45154: 'Hideyoshi@r@v06/61100036."The problem is the big window in the lounge.@k@v06/61100037. It looks like it doesn''t even have shutters.@k@v06/61100038. If they smash this, we won''t be able to stop them from comin'' in."'
45155: 'Rudolf@r@v08/61200044."Don''t worry, the sound of the glass smashing will be more than enough warning.@k@v08/61200045. We''ll turn them to Swiss cheese!"'
45156: 'Erika@r@v46/64500656."......Quiet, please.@k@|@y@v46/64500657. I didn''t have you stay down here to check the doors and windows.@k@v46/64500658. ......Please listen calmly to what I''m about to say."'
45157: '@rWhen Erika lowered her voice, Rudolf and Hideyoshi realized that she had something secret to talk about,@k so they brought their ears closer as soon as they regained their composure...'
45158: 'Erika@r@v46/64500659."Are you ready?@k @v46/64500660.This crime happened during a short break in the family conference.@k@v46/64500661. ......In that tiny span of time, six people were killed without anyone noticing—I can''t imagine that was the result of any haphazard crime.@k@v46/64500662. This crime was committed by someone who knew the layout of this mansion well, inside and out."'
45159: 'Rudolf@r@v08/61200046."......W-......well..............."'
45160: 'Hideyoshi@r@v06/61100039.".........S-sure, if they didn''t know the inside well, then......@k@v06/61100040. B-but still......"'
45161: '@rA short while ago, they had lambasted Gohda, suspecting the servants of having made a blunder.'
45162: '@rHowever, they had only thought that he had forgotten to lock up, and were attacking him for letting the mysterious culprit sneak in.@k .........They hadn''t considered that one of the servants they knew so well might have taken those lives with their own hands.'
45163: '@r...No, they hadn''t wanted to think that.'
45164: '@rPeople can''t easily suspect someone they know well...@k...of being a killer......'
45165: 'Erika@r@v46/64500663."At the time of the crime,@k@v46/64500664. the mansion was locked from the inside, and only those involved with the family conference existed there."'
45166: 'Rudolf@r@v08/61200047."So, what, you''re saying Aniki killed Kyrie and the others?!@k @v08/61200048.Or am I supposed to suspect Hideyoshi nii-san?!@k @v08/61200049.It''s impossible, unthinkable!!"'
45167: 'Hideyoshi@r@v06/61100041."I''ve never even considered suspectin'' Krauss nii-san or Rudolf-kun...!!@k @v06/61100042.All of us siblings were happily married!@k @v06/61100043.True, the Ushiromiya family may be strict with discipline and money.@k@v06/61100044. But that doesn''t mean we treasure our own families less than any other family would...!"'
45168: 'Erika@r@v46/64500665."Yes, of course I believe that.@k@v46/64500666. I wouldn''t dream that any of you would kill your own wives."'
45169: '@rErika had already received red truth proof from Battler that they were not the murderers.@k So, there was no need to argue that point...'
45170: '@rKrauss, Rudolf, Hideyoshi...and Gohda.@k .........None of those four was the killer.'
45171: '@r.........And yet, .........Erika said this......'
45172: 'Erika@r@v46/64500667."However, ......what about Gohda-san?@k@v46/64500668. He was in the servants'' quarters the whole time during the family conference, in a position to act without anyone else''s knowledge."'
45173: 'Hideyoshi@r@v06/61100045."Hold up, let''s not jump the gun on suspectin'' Gohda-san!@k @v06/61100046.He came to bring us drinks in the dining hall during the break.@k@v06/61100047. ......He was with us for a good long while.@k@v06/61100048. I can''t imagine he had the time to kill six people...!"'
45174: 'Rudolf@r@v08/61200050."......But he might have been able to let the actual killer into the mansion."'
45175: 'Erika@r@v46/64500669."Precisely.@k@v46/64500670. ......Gohda-san probably didn''t kill them himself.@k@v46/64500671. However, it''s very possible that he secretly welcomed the actual murderer into the mansion."'
45176: '@rRudolf and Hideyoshi, stunned, looked at each other.'
45177: '@rThey were all family.@k Even the wife of a sibling was still family.@k ......The siblings may have harbored hatred for each other, but they could never have hated each other''s wives enough to kill them.'
45178: '@rAlthough Eva and Rosa were part of the sibling circle of hate,@k there could be no reason for a sibling to kill any of the others who had died—Natsuhi, Kyrie, Battler, or the young Maria...'
45179: '@rBut......to a servant like Gohda......perhaps everyone was little more than a complete stranger.........'
45180: 'Erika@r@v46/64500672."I suspect the servants on two counts.@k@v46/64500673. First, the victims are familiar with them, and there were no signs of a struggle at any of the crime scenes.@k@v46/64500674. I''m sure you''re all well aware that none of the rooms were the least bit disturbed."'
45181: 'Rudolf@r@v08/61200051."......I thought that too.@k@v08/61200052. ......Kyrie''s used to fighting, like hell she''d get killed that easily without resisting.@k@v08/61200053. That woman wouldn''t hesitate to bite your finger off...@k@v08/61200054. It does make more sense if the culprit was someone she knew, who suddenly attacked when her guard was down..."'
45182: 'Hideyoshi@r@v06/61100049."C-come to think of it, same goes for my Eva...@k@v06/61100050. She knows a dozen kinds of martial arts.@k@v06/61100051. She spends every day practically wishin'' for some ruffian to attack her.@k@v06/61100052. She wouldn''t have been killed off in a snap like that...!"'
45183: 'Erika@r@v46/64500675.".........Then what about Rosa-san, in the parlor?@k @v46/64500676.Do you think she would allow herself to be easily killed by a stranger, without resisting, while she had her only daughter with her?@k @v46/64500677.And this tells us something else that''s important."'
45184: 'Hideyoshi@r@v06/61100053."Somethin'' important...?"'
45185: 'Rudolf@r@v08/61200055.".........There''s more than one culprit..."'
45186: 'Hideyoshi@r@v06/61100054."Y-......you''re right...@k@v06/61100055. Both Rosa-san and Maria-chan were in the parlor.@k@v06/61100056. The culprit must have killed them both at the same time, or they''d have made a hell of a racket.@k@v06/61100057. And if they were able to do that, there can''t have been just one of them..."'
45187: 'Rudolf@r@v08/61200056."When it came to Maria-chan, Rosa was like a quick-to-anger mother bear.@k@v08/61200057. ......She wouldn''t cower in fear, not even if someone pointed a gun at her.@k@v08/61200058. .........I see, so it had to have been people who wouldn''t rouse Rosa''s suspicion until the last second..."'
45188: 'Erika@r@v46/64500678."......I believe you can see already that the idea of an unknown outsider sneaking onto the island is actually the less realistic.@k@v46/64500679. Whoever they are, they''re familiar with this island.@k@v46/64500680. And there''s more than one of them."'
45189: '@rThere is more than one culprit...and they know the island.'
45190: '@rErika''s reasoning......pointed clearly at the ones they should suspect and guard themselves against.'
45191: 'Rudolf@r@v08/61200059.".........So, ......you suspect the servants......"'
45192: 'Erika@r@v46/64500681."Yes.@k@v46/64500682. Under the current circumstances, they are the most suspicious.@k@v46/64500683. ......The second reason I have for suspecting them is the fact that the locked rooms were formed with chain locks."'
45193: 'Rudolf@r@v08/61200060."Why do the chain locks make them suspicious?"'
45194: 'Erika@r@v46/64500684."......What if there was no chain lock on the locked rooms?"'
45195: 'Hideyoshi@r@v06/61100058."That''s not much of a locked room.@k@v06/61100059. Anyone could make a room like that with nothin'' more than a master key."'
45196: 'Rudolf@r@v08/61200061."......Yes, ...I see...@k@v08/61200062. .........The servants had to seal them with the chains so that they wouldn''t be suspected..."'
45197: 'Erika@r@v46/64500685."Exactly.@k@v46/64500686. ......By setting the chain, they don''t have to worry about being suspected.@k@v46/64500687. ...To turn it around, if the chains weren''t set, they wouldn''t be able to avoid suspicion since they hold the master keys."'
45198: 'Hideyoshi@r@v06/61100060."So, ......the only ones with somethin'' to gain from settin'' the chains......are the servants......"'
45199: 'Rudolf@r@v08/61200063."I''m not trying to protect them or anything, ......but if so, how did they actually set the chains?!@k @v08/61200064.Is it possible to set them from the outside?!"'
45200: 'Erika@r@v46/64500688."Considering how they are built, I don''t think that would be impossible.@k@v46/64500689. ......Have you ever heard this story?@k @v46/64500690.Apparently, some mailmen who deliver to apartment mailboxes are known to carry loops of wire with them."'
45201: 'Hideyoshi@r@v06/61100061."Yeah, ......I''ve heard of that.@k@v06/61100062. Apartment mailboxes often have similar adjoinin'' boxes around them for the nearby room numbers.@k@v06/61100063. I hear that sometimes, when the mailmen aren''t bein'' careful enough, they accidentally deliver letters to the next room over."'
45202: 'Erika@r@v46/64500691."Those mailboxes are almost always locked.@k@v46/64500692. If you put the mail into the wrong one, you''d have no way of getting it out..."'
45203: '@r......In that situation, they are supposed to tell the owner of that mailbox about their mistake,@k have that person unlock the mailbox for them, and retrieve the improperly delivered mail.'
45204: '@rHowever, the resident of that apartment would often be out.@k And going through that process would be a real pain.'
45205: '@rBecause of that, some mailmen would make a little tool out of wire with a hook at the end,@k and use that to fish the mistakenly delivered postcard out through the crack of the mailbox...'
45206: 'Rudolf@r@v08/61200065."......I''ve heard something similar from a friend of mine at a building management company.@k@v08/61200066. ......They sometimes get drunks who lock themselves in a toilet stall and fall asleep,@k@v08/61200067. so to get them out of there, they stick a thin, metal tool through the crack in the door and undo the latch..."'
45207: 'Erika@r@v46/64500693."Exactly.@k@v46/64500694. All industries have little tools that can easily open things that normally can''t be opened.@k@v46/64500695. .........It wouldn''t be particularly surprising if the servants of a mansion had something of the sort."'
45208: 'Hideyoshi@r@v06/61100064."...........................G-......good point..."'
45209: 'Rudolf@r@v08/61200068."......Once you figured out the knack of it,@k@v08/61200069. you could probably set the chain from the outside by using a wire as well.@k@v08/61200070. .........Yes, ......we can''t be sure that it''s impossible..."'
45210: '@r......True, physically speaking,@k one couldn''t say for sure that there existed absolutely no way to set and unset chain locks from the outside.'
45211: '@rChain locks allow for the door to be opened a crack.'
45212: '@rIf a person were to stick something through that crack, ......they should be able to manage it easily...@k ......It was very natural for Rudolf and Hideyoshi to think that way.'
45213: '@rHowever, Erika knew better.'
45214: '@rThough it might be possible in reality, ......it had already been declared with the red truth that these locked rooms could not have been constructed from the outside.@k In other words, it was impossible to manipulate the chain lock from the outside.'
45215: '@rAnd yet.@k ......Erika was guiding their thoughts to put them under the illusion that only the servants could have constructed the locked rooms...'
45216: '@rWith an air of solemnly revealing some vital point,@k ......she steadily steered the situation in the direction she wanted.'
45217: '@rEverything about her serious face for the last few minutes......was an act.@k No, to put it in her words, it was a detective technique for tricking suspects......'
45218: 'Erika@r@v46/64500696."I plan to tell Krauss-san what I''ve told you.@k@v46/64500697. ......I''m not saying that all the servants are culprits.@k@v46/64500698. However, it is very likely that one of them is a culprit or has been assisting the culprit.@k@v46/64500699. ......We should split them apart and have people with guns keep an eye on them."'
45219: '@rRudolf and Hideyoshi looked at each other again.'
45220: '@r......What she was saying made sense, and it sounded as though she was calmly smoking out the most suspicious people at this point in time.'
45221: '@rWith her accomplished conversation techniques, Erika was skillfully grasping the initiative.@k ......Even without the presence of the detective''s authority, controlling human nature like this is trivial.'
45222: '@rYour thoughts, ladies and gentlemen......?'