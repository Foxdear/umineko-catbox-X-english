41596: '@rThe news about the drifter, Furudo Erika, quickly spread across Rokkenjima.@|@y'
41597: '@rErika was politely entertained, and it was decided that she would be treated as a guest until the typhoon passed.'
41598: '@rIn the dining hall, Gohda''s wonderful dinner had ended, and everyone was relaxing and enjoying some after-dinner coffee and cheese......'
41599: '@rApparently, Battler was a bit relieved that Erika had come and turned into a good scapegoat.@k It drove away some of the attention he''d been getting piled on him for finally coming back after six years.'
41600: '@rIn fact, she turned out to be very talkative.'
41601: '@rWhen the conversation turned to a sophisticated discussion of the mystery genre, even the adults were drawn in.'
41602: '@rShe was apparently so well versed that even Nanjo, who had a vast knowledge of the subject, was impressed.'
41603: 'Battler@r@v10/60100149."Wahahaha, good point.@k@|@y@v10/60100150. A strange family in a Western mansion on an isolated island during a storm.@k@v10/60100151. Now that we have a detective stopping by to take shelter from the rain, we''ve got all the major factors lined up."'
41604: 'Erika@r@v46/64500066."Have no fear.@k@v46/64500067. No matter how difficult the crime, I will solve it.@k@v46/64500068. That''s a detective''s job."'
41605: 'Krauss@r@v02/60800001."How reassuring.@k@v02/60800002. In fact, I would quite enjoy it if some kind of bizarre incident were to occur now.@k@v02/60800003. I just hope I don''t have to play the part of the victim."'
41606: 'Natsuhi@r@v03/60900001."Don''t be imprudent, dear."'
41607: 'Erika@r@v46/64500069."Well,@k@v46/64500070. the history of the Human mystery genre is only about a century old.@k@v46/64500071. Its tricks and ideas are limited to a few recycled patterns, so there''s nothing left to show.@k@v46/64500072. No matter what kind of impossible crimes or locked-room murders might occur,@k@v46/64500073. it''ll be nothing more than one of the same classes of tricks dressed up to look like something new."'
41608: 'Erika@r@v46/64500074."......The only reason mysteries still make for popular books today...@k@v46/64500075.is because self-proclaimed "fans", who work off pieced-together knowledge and who have hardly read any of the classics,@k@v46/64500076. mistake classic tricks they didn''t know about for something new and surprising through lack of proper study."'
41609: '@rEveryone couldn''t help but gape at this imposing claim...'
41610: '@rIf an aged critic had said it, that would have been one thing.@k ......But it showed incredible boldness for a young person like her to state that so strongly...'
41611: 'Erika@r@v46/64500077."Mystery...@k@v46/64500078.is a genre that ended a half-century ago.@k@v46/64500079. At least as far as I''m concerned.@k@|@y@v46/64500080. ......However, thanks to the countless ignorant fools, I get to play my part as detective.@k@v46/64500081. *giggle*giggle*giggle*giggle*...!"'
41612: 'Battler@r@v10/60100152."By that argument,@k@v10/60100153. romance was perfected back in Shakespeare''s time and anything after that isn''t worth reading."'
41613: 'Erika@r@v46/64500082."That''s a good point.@k@v46/64500083. Then I suppose that so long as you read Romeo and Juliet, you essentially understand all of romance, wouldn''t you say?"'
41614: 'Battler@r@v10/60100154."Nah, that''s ridiculous.@k@v10/60100155. .........Books aren''t a competition—it''s not about who''s read the most—@k@v10/60100156.but boasting that you''ve read all you ever need to read is just as wrong-headed.@k@|@y@v10/60100157. ......Just reading classics of the past and never anything new is being overly nostalgic, don''t you think?@k @v10/60100158.That sounds to me like the excuse of an old person who''s too lazy to read anything."'
41615: 'Erika@r@v46/64500084.".....................@k@v46/64500085. ......That''s fair.@k@|@y@v46/64500086. It seems I need to read at least as much as you before I''ll be able to beat you in an argument."'
41616: 'Battler@r@v10/60100159."Me?@k @v10/60100160.Haha, I don''t read."'
41617: 'Erika@r@v46/64500087."..........................."'
41618: '@rBattler chuckled, ......but Erika knew from the previous game that "Battler" was actually quite an avid reader.'
41619: '@rSo, his words felt like more of a challenge.'
41620: 'George@r@v07/60300002."If you''re so confident in your reasoning abilities, you must be really good at quizzes and puzzles, right?"'
41621: 'Jessica@r@v04/60200062."Oh, right. Maria, didn''t you bring a quiz book or something?"'
41622: 'Maria@r@v13/60400004."Uu!@k @v13/60400005.Brought it!!"'
41623: '@rPicking up that Erika''s arrogant statement had made the atmosphere a little tense,@k George smoothly changed the subject.'
41624: '@rBy now, it was more than clear that she wasn''t the charming guest she had appeared to be.'
41625: '@rMaria pulled a book out of her bag that had quizzes and puzzles written in it and started posing them to everyone.'
41626: '@rIt might have looked as though it would become a peaceful quiz party,@w666. .........but of course, that wasn''t what happened.'
41627: '@rIn credit to all her big talking, Erika managed an impressive ratio of correct and immediate answers...'
41628: '@rErika took complete control.@k ......Her bragging began to escalate more and more.'
41629: '@rGeorge slightly regretted the choice he had made when changing the subject.'
41630: 'Erika@r@v46/64500088."106 matches.@k@v46/64500089. No need to even write a tournament chart for it."'
41631: '@rThe question "How many matches would you need for a tournament with 107 teams?" was answered instantly by Erika.'
41632: 'Erika@r@v46/64500090."This is less of a puzzle than it is a test of knowledge.@k@v46/64500091. There''s a formula which shows that the number of matches is always the number of teams minus one.@k@v46/64500092. ......Well, if you just look at the examples showing three matches for four teams and seven matches for eight teams, it should be easy to figure out the pattern."'
41633: 'Maria@r@v13/60400006."Uu!@k @v13/60400007.Erika, that''s awesome!"'
41634: 'Rosa@r@v12/61400006."Erika onee-chan, right?!@k @v12/61400007.Say it."'
41635: 'Maria@r@v13/60400008."Uu, Erika onee-chan, that''s awesome."'
41636: 'Battler@r@v10/60100161."Really impressive.@k@v10/60100162. .........So, you don''t call yourself a detective for nothing."'
41637: 'Erika@r@v46/64500093."I couldn''t very well act the part of the detective if I was incapable of handling puzzles of this sort."'
41638: 'George@r@v07/60300003."Incredible.@k@v07/60300004. I''m sure you''ll be able to become a real detective in the future."'
41639: 'Erika@r@v46/64500094."Well, I''m pretty sure I already am one."'
41640: '@rThe cousins all thought about the answers to the questions, but Erika always answered first.'
41641: '@rRosa thought that it was a bit rude for Erika to say the answers out loud while people were thinking, instead of keeping them to herself,@k but since Erika was a guest, Rosa decided against mentioning it.'
41642: '@r......In truth, Erika was perfectly aware of this when she answered the questions instantly.'
41643: '@rEach time, she would grin broadly,@k as though saying "is it really taking you all this long to solve such an easy problem?"...'
41644: 'Kyrie@r@v09/61300003."......Since you''re a great detective, you don''t really need to take this so seriously, right?"'
41645: 'Erika@r@v46/64500095."You''re right.@k@v46/64500096. Even though these are just childish questions, I''ve been taking them a bit too seriously.@k@v46/64500097. ......I''ll take more care, so let''s hear the next question please."'
41646: 'Battler@r@v10/60100163."Alright, I won''t lose this time.@k@v10/60100164. Maria, next question please!"'
41647: 'Maria@r@v13/60400009."Umm, ......you have one large piece of cheese.@k@v13/60400010. A single slice with a knife can split it into two parts.@k@|@y@v13/60400011. So, what is the lowest number of slices you can make to cut it into eight parts?@k@v13/60400012. Uu!"'
41648: 'George@r@v07/60300005."Oh, I know this one.@k@v07/60300006. So I guess I''ll stay quiet this time."'
41649: '@rGeorge, acting like the adult he was, set up a mood that would prevent people from answering right away even if they knew the answer, in effect sending a warning to Erika.'
41650: '@rIt seemed that Erika understood, and she averted her gaze, snorting derisively.'
41651: 'Natsuhi@r@v03/60900002."......To make eight pieces, four slices would be enough, right?"'
41652: 'Eva@r@v05/61000003."Don''t be so foolish.@k@v05/61000004. It would hardly be a puzzle if that was the answer."'
41653: 'Krauss@r@v02/60800004."Hahaha.@k@v02/60800005. That''s right.@k@|@y@v02/60800006. These are usually set up so that a smaller number than you''d expect is the answer.@k@v02/60800007. But still, how exactly could it be done?"'
41654: 'Rudolf@r@v08/61200005."......Oh, got it, got it.@k@v08/61200006. You can only do this because it''s cheese."'
41655: 'Kyrie@r@v09/61300004."True.@k@v09/61300005. If you tried to do it with a birthday cake, there''d be a huge fight."'
41656: 'Hideyoshi@r@v06/61100004."Wahahaha!@k @v06/61100005.That''s right.@k@v06/61100006. You might be able to do this with cheese, but you''d never cut a cake like this."'
41657: 'Battler@r@v10/60100165."Huh? Huh?@k @v10/60100166.All of you know the answer?!@k @v10/60100167.Dammit, am I the only one who doesn''t?!"'
41658: 'Jessica@r@v04/60200063."Oh, I''ve got it!@k @v04/60200064.I see, so you have to think three-dimensionally."'
41659: 'Battler@r@v10/60100168."Wait, even Jessica?!@k @v10/60100169.I don''t get it! What do you have to dooooooo?!"'
41660: 'Maria@r@v13/60400013."Kihihihihihi, I know the answer.@k@v13/60400014. It''s written right here.@k@v13/60400015. Kihihihihi."'
41661: 'Rosa@r@v12/61400008."You didn''t know the answer until you looked, right?@k@|@y@v12/61400009. *giggle*, can you work it out? Battler-kun?"'
41662: 'Nanjo@r@v19/61900001."Aha, I''ve figured it out as well.@k@v19/61900002. This is something you can do because it is cheese."'
41663: 'Battler@r@v10/60100170."Gyah?!@k @v10/60100171.Even Doctor Nanjo gets it?!@k @v10/60100172.Could it be?@k @v10/60100173.Am I the only one who doesn''t get it?!"'
41664: 'Erika@r@v46/64500098."......If we tried cooking your brain a bit, it''d probably become as flexible as cheese.@k @v46/64500099.*giggle*giggle*......"'
41665: 'Battler@r@v10/60100174."It isn''t something like "use zero slices with the knife and break it apart with your hands", right?"'
41666: 'Jessica@r@v04/60200065."No way.@k@v04/60200066. It''s special cheese that can only be cut with a knife."'
41667: 'George@r@v07/60300007."Think of the cheese in three dimensions.@k@v07/60300008. If that''s hard, it might help to draw a picture on a paper napkin."'
41668: 'Battler@r@v10/60100175."S-so, we have one large piece of cheese, right...?@k @v10/60100176.Then we use a knife to make eight pieces......@k@|@y@v10/60100177. ......Can the knife only cut in a straight line?"'
41669: 'Rosa@r@v12/61400010."Yes, that''s right.@k@v12/61400011. The knife only cuts in straight lines.@k@|@y@v12/61400012. ......Oh, but here''s a hint.@k@v12/61400013. You can only cut in a straight line, but you''re free to cut it wherever you want."'
41670: 'Rudolf@r@v08/61200007."Try thinking of various ways to stick the knife in."'
41671: 'Krauss@r@v02/60800008."You should probably try to think out of the box a bit.@k@v02/60800009. Show us what you''ve got, Battler-kun."'
41672: '@rYou have a large piece of cheese.'
41673: '@rHow many times must you cut it with a knife to make eight pieces?'
41674: '@rIt''s obvious that you could do it in four cuts.'
41675: '@rCan it be done in even fewer cuts than that?'
41676: '@rThe hints said that it was something that could be done because it was cheese.@k@rIf it was a birthday cake, you really wouldn''t be allowed to do this.'
41677: 'Battler@r@v10/60100178.".........Cheese.@k@v10/60100179. ...Cheese.@k@v10/60100180. ......Something you can do because it''s cheese?@k @v10/60100181.......Oh,@v10/60100182. ...oooooooooooohh!!@k @v10/60100183.I''ve got it, I''ve got it!!@k @v10/60100184.I was totally tricked! This isn''t something you can think up with a stiff head...!"'
41678: 'Erika@r@v46/64500100."Seems like you''ve finally hit on it.@k@v46/64500101. Hopefully it is the right answer."'
41679: 'Battler@r@v10/60100185."It''s impossible to cut the cheese with anything except the knife, right?@k @v10/60100186.The knife can only cut in a straight line, right?@k@v10/60100187. There aren''t any other rules, right? Right?!"'
41680: 'Maria@r@v13/60400016."Uu.@k@v13/60400017. Not really."'
41681: 'Battler@r@v10/60100188."Alright, then that''s got to be it!@k @|@y@v10/60100189.Wheeew, that was a tough one... Almost like a riddle!"'
41682: 'Jessica@r@v04/60200067."Hahahaha, it''s just that you won''t get anywhere if you always cut down from the top.@k@v04/60200068. You make two cuts from the top to get four pieces.@k@v04/60200069. If you keep it like that and cut across the side, splitting it into an upper half and a lower half, you get four times two equals eight pieces!"'
41683: 'George@r@v07/60300009."It''s an answer you can''t reach unless you think three-dimensionally.@k@v07/60300010. In other words, the correct answer is three."'
41684: 'Battler@r@v10/60100190."......Huh?@k @v10/60100191.Really?@k @|@y@v10/60100192.I......thought the correct answer was one."'
41685: 'Hideyoshi@r@v06/61100007."Wahahahaha!@k @v06/61100008.What kind of magic did you use?!@k @v06/61100009.There''s no way in the world you could manage it with one."'
41686: 'Rosa@r@v12/61400014."*giggle*.@k@v12/61400015. This isn''t a riddle, it''s just a normal math problem."'
41687: 'Battler@r@v10/60100193.".........Huh?@v10/60100194. Oh,@v10/60100195. ......really...?@k @v10/60100196.Nnnnn, I thought of the three-cut method right away,@v10/60100197. ......but I figured that was too easy, so I guess I tried to twist it too far......"'
41688: 'Maria@r@v13/60400018."......Battler''s answer is smaller than the one in the book.@k@v13/60400019. Is Battler right?"'
41689: 'Erika@r@v46/64500102."Yes, he is.@k@|@y@v46/64500103. .........Battler-san is right.@k@v46/64500104. The right answer is "one slice"."'
41690: '@rBattler was happy that someone had confirmed his answer.@k ......However, at some point, Erika''s face had lost its cheeriness.'
41691: 'Erika@r@v46/64500105.".........To think that a Human other than myself would answer "one"...and that it''d be you, of all people."'
41692: 'Battler@r@v10/60100198."Your answer was "one" too, Erika?@k@v10/60100199. ......I guess you were also thinking pretty far out of the box."'
41693: 'Erika@r@v46/64500106."It would be truly foolish to arbitrarily decide the shape just because you heard it was a piece of cheese."'
41694: 'Ange@r@v11/62000239."That''s impossible.@k@v11/62000240. Onii-chan got it wrong, didn''t he?@k@v11/62000241. How could you cut it into eight pieces with less than three slices?"'
41695: 'FEATHERINE@r@v50/65000185."How foolish, child of man.@k@v50/65000186. *giggle*giggle*......@k@v50/65000187. It says to cut it into eight pieces, but nowhere does it say that they have to be of equal size..."'
41696: 'Ange@r@v11/62000242."It''s still impossible.@k@v11/62000243. Do you cut it with something other than a knife?"'
41697: 'FEATHERINE@r@v50/65000188."The rules say that only the knife can cut it, and that the knife can only cut in a straight line.@k@v50/65000189. However, to turn it around, the rules do not say anything besides that......@k@v50/65000190. In fact, the shape of the cheese is never specified."'
41698: 'Battler@r@v10/60100200."I get it...@k@v10/60100201. When you all heard "a large piece of cheese", you thought of a flat cylinder, like Camembert.@k@|@y@v10/60100202. ......I was thinking about sliced cheese, like the kind you might put on your toast for breakfast.@k@v10/60100203. ......After all, I don''t usually have anything to do with full blocks of cheese that you''d cut with a knife."'
41699: 'Erika@r@v46/64500107."......The shape of the cheese isn''t specified in the rules.@k@v46/64500108. A mistake by the ones who made the book.@k@v46/64500109. I imagine that there''s a picture of a flat cylinder of cheese there in Maria-san''s book."'
41700: 'Maria@r@v13/60400020."Uu.@k@v13/60400021. There is.@k@v13/60400022. Right here."'
41701: '@rAs Erika had guessed, the book Maria held had an illustration of a piece of cheese just as Erika had described it.'
41702: '@r......With cheese of this shape, three slices really would be the correct answer.'
41703: '@rYou cut it in a + pattern from the top to make four pieces.@k@rThen cut it from the side to double that and make eight pieces.'
41704: '@rHowever, since this illustration hadn''t been shown, the interpretation of the cheese had been left to the answerer.'
41705: 'Kyrie@r@v09/61300006."......That is right.@k@v09/61300007. When the problem was stated, it never said anything about what the cheese''s shape was or how flexible it was."'
41706: 'Erika@r@v46/64500110."Exactly.@k@v46/64500111. It seems that Battler-san was the more flexible one,@k@v46/64500112. when it comes to both brains and cheese."'
41707: 'Jessica@r@v04/60200070."I, ......I don''t get it.@k@v04/60200071. How does making it sliced cheese let you cut it into eight parts with a single knife slice?"'
41708: 'Erika@r@v46/64500113."Why not try it with that paper napkin.@k@v46/64500114. Pretend it''s sliced cheese."'
41709: 'Battler@r@v10/60100204."......It''s like this.@k@v10/60100205. You fold it accordion-style.@k@|@y@v10/60100206. ......How many times do you need to fold it to make eight sections...?"'
41710: 'Erika@r@v46/64500115."Six times."'
41711: '@rTo fold it accordion-style, you alternate between upward and downward folds.'
41712: '@rOnce you''ve done this six times, it looks like the side of an accordion.'
41713: 'Battler@r@v10/60100207."With normal cheese, it''d break if you tried to fold it like this,@k@v10/60100208. ......but the rules say that this cheese can''t break unless you use a knife, right...?"'
41714: 'Erika@r@v46/64500116."Yes, no problems there.@k@v46/64500117. After all, this is magic cheese that can only be cut by the knife."'
41715: 'Battler@r@v10/60100209."After folding it,@v10/60100210. ......if you start at the top and make a cut right down the middle..."'
41716: 'George@r@v07/60300011."......Y-......you''re right.@k@v07/60300012. ...There are eight parts."'
41717: 'Jessica@r@v04/60200072."W-wait a second.@k@v04/60200073. The parts aren''t all equal this way, right...?!"'
41718: 'Erika@r@v46/64500118."......All the questioner said was to cut it into eight pieces.@k@v46/64500119. They didn''t say anything about them being equal.@k@|@y@v46/64500120. ......Well, if you change the way you fold it, it is possible to make them all equal sizes, but I wouldn''t want to confuse you stiff-headed people with the explanation.@k@v46/64500121. Eheheheheheheheheheh......"'
41719: 'Nanjo@r@v19/61900003."Oh......ooooooohhh............"'
41720: '@rFor a while, everyone was stunned......'
41721: '@rBattler had reached a far better answer than "three" by thinking of the problem as a riddle.'
41722: '@rErika had already known both answers and had even spotted a mistake made by the book.'
41723: '@r......The others could do nothing but stare at those two in surprise.'
41724: 'Rosa@r@v12/61400016."I-......incredible.@k@v12/61400017. ...So we were the stiff-headed ones...?"'
41725: 'Nanjo@r@v19/61900004."What a......failure."'
41726: 'Kyrie@r@v09/61300008."We were thinking in three dimensions,@k@v09/61300009. ......but it looks like Battler-kun and Erika-chan were thinking in one dimension higher."'
41727: 'Erika@r@v46/64500122."......It seems the game with the witch has toughened you up quite a lot.@k@|@y@v46/64500123. ......Puzzles without specified rules—in other words, all things not covered by the red truth—are left to the observer''s interpretation.@k@v46/64500124. ......It''s the most basic of methods for constructing gaps in the witch''s locked rooms."'
41728: 'Battler@r@v10/60100211."What are you talking about...?@k @v10/60100212.Is that a quote from some novel...?"'
41729: 'Erika@r@v46/64500125."........................@k@v46/64500126. Well, let''s call it that for now, shall we?@k@|@y@v46/64500127. Anyway, I guess this means that all your brains are as stiff as rock-hard cheese.@k@v46/64500128. *giggle*giggle*giggle*...!"'
41730: '@rWithout any signs of restraint, Erika looked at everyone and laughed sarcastically...'
41731: '@rOnly Maria didn''t notice the venom in that laugh as she happily turned to the next page.'
41732: 'Maria@r@v13/60400023."Uu!!@k @v13/60400024.Then on to the next problem.@k@v13/60400025. You have three cups and six coins.@k@v13/60400026. Split up the coins so that there''s one coin in one cup, two coins in another cup, and three coins in the third cup.@k@v13/60400027. Uu!"'
41733: 'Jessica@r@v04/60200074."Wait a sec, that''s easy."'
41734: 'Jessica@r@v04/60200075."Just stick one coin in the first cup, two in the next one, and three in the last one and you''re done."'
41735: 'Maria@r@v13/60400028."However, can you do the same thing with only five coins?!@k @v13/60400029.Uu!!"'
41736: 'Erika@r@v46/64500129."Here''s another cliched problem.@k@v46/64500130. Don''t tell me that you all need to waste several precious seconds on a problem like this......?"'
41737: '@rBy now, Erika was gazing around with an unpleasant look,@k acting in a manner that was completely inappropriate both for a guest and for someone of her age...'
41738: '@rShe was no longer a guest who would be staying until the storm passed.'
41739: '@rShe had transformed into an annoying guest who wouldn''t leave until the storm passed...'
41740: '@rEveryone thought this, but they were unable to say it aloud...'
41741: 'George@r@v07/60300013."Uh, ......oh, right, speaking of problems with coins,@k@v07/60300014. I''ve heard that you can tell whether someone''s good with chopsticks or not by seeing if they can pick up coins with them..."'
41742: 'Erika@r@v46/64500131."Chopsticks!@|@y@k @|@y@v46/64500132.Yes, chopsticks, that''s right.@k@v46/64500133. Chopsticks are the most elegant utensil on the planet.@k@v46/64500134. Poking things and chopping them up with forks and knives is so barbaric!@k @v46/64500135.Chopsticks are the best.@k@v46/64500136. For me, using chopsticks is truly an art."'
41743: '@rJessica was about to say "isn''t a chopstick just a stick?"...but stopped herself just in time.'
41744: '@rShe realized that it was best to let George take control for now...'
41745: 'George@r@v07/60300015."I have some change here, so would you like to challenge me?@k @v07/60300016.I''m pretty good with chopsticks."'
41746: 'Hideyoshi@r@v06/61100010."Th-that''s right...@k@v06/61100011. We trained George very well with chopsticks."'
41747: 'Krauss@r@v02/60800010."True.@k@v02/60800011. One''s upbringing shows in their table manners.@k@v02/60800012. Erika-san was very impressive herself."'
41748: 'Rudolf@r@v08/61200008."I''ll lend you some coins too.@k@v08/61200009. It''ll probably be more fun with more of them."'
41749: 'Natsuhi@r@v03/60900003."Jessica.@k@v03/60900004. Watch closely and learn."'
41750: 'Jessica@r@v04/60200076."C-cram it already...!"'
41751: 'George@r@v07/60300017."Alright, let''s go.@k@v07/60300018. Let''s see who can move the most coins over to their plate."'
