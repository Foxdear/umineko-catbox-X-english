41958: '@rCracks appeared in the darkness......and a brilliant light enveloped the world...'
41959: '@rAnd so, .........BEATRICE......was born.'
41960: 'BEATRICE@r@v27/60700116."...............Huh...?"'
41961: '@r@v60/60700117."..................?"'
41962: '@rThere I stood.........along with another me.'
41963: '@rFor a second, I thought that the me in front of me was the real BEATRICE, the one I wanted to be more like.'
41964: '@rHowever, she was looking back at me with the same bewildered eyes, ......so I realized that wasn''t quite it.'
41965: '@r......That''s right.@k ...I wasn''t the only one born from the egg.'
41966: '@rShe was also born.'
41967: '@r......My twin?@k No, it feels a bit different.'
41968: '@rHow can I put it?@k@r......Both of us are lacking something and immature.'
41969: '@rYes.@k Both of us are chicks, ......but we are also...fragments of the true BEATRICE.'
41970: '@rIt felt as though the two of us together could become the real BEATRICE.'
41971: '@r......No one explained this to us.@k@rHowever, we naturally understood...'
41972: '@rI decided to talk to this other me.'
41973: '@rUnless I get to know her and become one with her, I won''t be able to become the BEATRICE Father desires......'
41974: '@rIn other words, the thing that Father wants from me...and was so heartbroken to find missing...must be something that she has...'
41975: 'BEATRICE@r@v27/60700118.".........H-......hello......?"'
41976: '@r@v60/60700119.".............................."'
41977: '@rThe BEATRICE with her hair down looked at me dubiously several times, then finally spoke.'
41978: '@r@v60/60700120.".........Why...do you have the same face as me......?"'
41979: '@rShe used the word "warawa" to refer to herself, just like the true BEATRICE.@k@r......It looks like she really does have something that I lack.'
41980: 'BEATRICE@r@v27/60700121."W-......well...@k@v27/60700122. I don''t know why either."'
41981: '@r@v60/60700123."I am the Golden Witch, BEATRICE.@|@y@k@v60/60700124. And you are?"'
41982: 'BEATRICE@r@v27/60700125."I, I am also...BEATRICE.@k@v27/60700126. I was born for the purpose of serving Ushiromiya Battler."'
41983: 'Elder BEATRICE@r@v60/60700127."......I am the Golden Witch and the ruler of Rokkenjima''s night.@k@v60/60700128. ......I know Ushiromiya Battler, but I have trouble imagining why I would have to serve a brat like him."'
41984: '@rI realized that the thought I''d had a second ago,@k ......that together, we could become the true BEATRICE...must really have been true.'
41985: '@r......Though the person in front of me does have the part that makes her a witch, which I lack,@k she does not possess the mission to live for Ushiromiya Battler''s sake.'
41986: '@rShe has what I do not,@k ......and I''m sure I have something she does not.'
41987: 'BEATRICE@r@v27/60700129."We must be one person in two.@k@v27/60700130. ......I think we''re something like twins."'
41988: 'Elder BEATRICE@r@v60/60700131."......No, that is not so.@k@v60/60700132. You are my little sister.@k@v60/60700133. I have been here since long before you were born."'
41989: 'BEATRICE@r@v27/60700134."Huh?@k @v27/60700135.I, ......I had no idea..."'
41990: '@rI was born later...'
41991: '@r......So, does that mean the mission to live for Ushiromiya Battler''s sake was born later on...?'
41992: '@rHowever, I don''t think my existence is something quite as faint and intangible as a mission.'
41993: '@r......I have enough of a personality to think and act as I am doing now.'
41994: '@rSo, the witch Beato and I are separate people, both of us possessing something the other lacks.'
41995: '@rIn that sense, ......maybe it''s fitting for us to call ourselves sisters, as she says.'
41996: 'BEATRICE@r@v27/60700136."I, ......I want to know about you."'
41997: 'Elder BEATRICE@r@v60/60700137."I also wish to know.@k@v60/60700138. I understand that you are also "me".@k@v60/60700139. ......Why is it that you speak that way, and why must you serve Battler?@k@v60/60700140. As long as we cannot understand that, it seems both of us will remain immature."'
41998: 'BEATRICE@r@v27/60700141."......I...want to become a complete BEATRICE."'
41999: 'Elder BEATRICE@r@v60/60700142."Until you were born, I was complete.@k@v60/60700143. ......However, now that you have appeared,@k@v60/60700144. I believe that accepting you is my obligation.@k@v60/60700145. ......I also wish to know about you."'
42000: '@rThe witch Beato''s tone was very slightly arrogant, matching with her self-proclaimed status as the older sister.'
42001: '@rHowever, since we both realized that we were the same person, there was no need to be unkind.'
42002: '@r......This was probably because she understood, after meeting me, that her current form was not her real self.'
42003: 'BEATRICE@r@v27/60700146."Where......are we?@k @v27/60700147.Is this...the hall of the mansion...?@k @v27/60700148.......Oh—"'
42004: '@rBeato gasped.@k@rHer portrait wasn''t there.'
42005: '@r......Did that mean that this was at least two years in the past...?'
42006: 'Elder BEATRICE@r@v60/60700149."Precisely. This is the hall of the Ushiromiya mansion.@k@v60/60700150. ......The night is my time.@k@v60/60700151. And the nighttime mansion is mine as well.@k@|@y@v60/60700152. That fool Kinzo is still so desperate to catch me or revive me.@k@v60/60700153. How truly ironic.@k@v60/60700154. For here I am, openly controlling the mansion each and every night.@k@v60/60700155. *cackle*cackle*!"'
42007: 'BEATRICE@r@v27/60700156."So,@v27/60700157. ......what do you do here...?"'
42008: 'Elder BEATRICE@r@v60/60700158."......I have lost my body, and due to the effects of that hateful shrine, I have no magical power.@k@v60/60700159. However, I am reviving that magical power bit by bit every day.@k@|@y@v60/60700160. ......My ultimate goal is to undergo a spectacular resurrection and gloat to Kinzo.@k@v60/60700161. I cannot wait to tell him that I have succeeded in escaping his cage...!@k @v60/60700162.For now, I have become something of a ghost, wandering about and killing time every night, all in anticipation of that gloating grin."'
42009: 'BEATRICE@r@v27/60700163."C-can I come with you......?"'
42010: 'Elder BEATRICE@r@v60/60700164."Of course!@k @v60/60700165.After all, you are a part of me.@k@v60/60700166. How could a left arm refuse the company of the right?@k @v60/60700167.It would be senseless to refuse.@k@|@y@v60/60700168. I shall be pleased to have you, my little sister, the new BEATRICE."'
42011: 'BEATRICE@r@v27/60700169."Th-thank you very much,@v27/60700170. O-@v27/60700171.......Onee-sama."'
42012: 'Elder BEATRICE@r@v60/60700172."A somewhat embarrassing name.@k@v60/60700173. But it is not bad.@k@|@y@v60/60700174. Come, let us go.@k@v60/60700175. Let us take a walk through the nighttime mansion.@k@v60/60700176. *cackle*cackle*, let me introduce you to my boring everyday life."'
42013: '@rThe two BEATRICEs changed their forms into two gold butterflies...@kand fluttered silently into the depths of the shadowy mansion......'