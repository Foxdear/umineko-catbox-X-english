41901: 'Erika@r@v46/64500156."......True.@k@v46/64500157. Given that people have been spending time in an old, gloomy mansion like this with the sound of wind and rain constantly present in the background,@k@v46/64500158. it doesn''t surprise me that a few ghost stories have arisen.@k@v46/64500159. ......Well, it''s nothing more than a ghost story, a fantasy, a fairy tale.@k@v46/64500160. Worth less than the useless drivel of a half-sleeping nitwit."'
