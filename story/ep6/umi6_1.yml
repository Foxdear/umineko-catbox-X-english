40537: '@r......All that could be heard was the sound of the wind.'
40538: '@rA sound of misfortune, strong enough to bring sadness and unease to those who heard it.'
40539: '@rSlowly, ......I came back to my senses.'
40540: '@rI finally regained consciousness on top of a bed with a firm mattress...'
40541: '@rWhere......was this, again...?'
40542: '@rI couldn''t remember where this was,@k ......but I could vaguely recall......that it was very bad for me to be here.'
40543: '@rThe room was dimly lit.'
40544: '@rThere was a light on, but that just made the darkness and eeriness of the room more apparent.'
40545: '@rThere were no curtains over the window, but it was too dark outside to see anything beyond it.'
40546: '@rIf I squinted into that pitch-blackness,@k ......it felt as though I would see the witch of the forest peeking back at me through the darkness,@k ...and I averted my gaze from the window in fear.'
40547: '@r......I couldn''t see or hear it,@k ......but I got the feeling that if I left this room, it would be bright and warm, and someone would be there for me.'
40548: '@rI have to get to where everyone else is right now......'
40549: '@rA bad memory from when I was very young began to well up.'
40550: '@rI was having trouble staying awake during a family gathering, and the next thing I knew, I was lying on a bed in a room I''d never seen before.@k I have the horrible, painful memory of waking up there feeling incredibly lonely and crying my eyes out...'
40551: '@rThis room—I''m not supposed to be here.'
40552: '@rI just want out.'
40553: '@rOnce I started to think that way, I didn''t want to stay in this room a second longer than I had to.'
40554: '@rThis room scares me.@k It''s creepy.@k ......Where is everyone?@k@rI want to get out of here right now...'
40555: '@rI opened the door, trying to leave the room.'
40556: '@rA pleasant glow snuck in through the crack of the door.@k@r......As I''d thought, the corridor was filled with a comforting light.'
40557: '@rI couldn''t actually hear them, but I could sense that far away, people were enjoying themselves.'
40558: '@r......Everyone else must be gathered in the room across from this one.'
40559: '@r......I''ve been shut up in this lonely, creepy room......all alone...'
40560: '@rI should go, quickly.'
40561: '@rAs soon as I thought this, a merciless metallic sound rang out, and the door refused to open any further.'
40562: '@r.........The chain had been set.'
40563: '@rI''ve always hated chain locks.'
40564: '@rYou can open a normal lock just by twisting.'
40565: '@r......But chain locks are built in a kind of annoying way where it''s difficult to undo them easily.'
40566: '@r...So I''ve hated them since I was very young.'
40567: '@r.........See?@w583. ......Even this chain...@w500.is causing me trouble...and I just can''t get it undone.'
40568: '@rWhy is this happening? I just want to leave this creepy room right away...'
40569: '@rJust on the other side of this thin door, everything is bathed in a warm light...'
40570: '@rI can''t undo it...... I just can''t undo this chain.'
40571: '@rThe more desperate I grew,@k the more the unsettling darkness of this room seemed to close in on me from behind, and the more frightened I became...'
40572: '@r......Then, I finally noticed.'
40573: '@rThere was something......wrong with this chain.'
40574: '@r......Yes, there is a chain,@w500. ...but this isn''t a chain lock.'
40575: '@rThis is just a chain staked into the door so that it can''t open any further...'
40576: '@rIn other words, it isn''t made to be opened.'
40577: '@r"Wh-......what the hell''s going on......?@k Who''d do something like this, dammit..."'
40578: '@rNo matter what I did, no matter how much I struggled, I couldn''t pull out the stake or undo the chain or break the mechanism.'
40579: '@rThis door was just a demon''s mouth...made to trick me into thinking it would open before crushing my hopes a moment later.'
40580: '@rEven so, if only I could just open this door somehow, I could get out into that pleasant corridor......@k This desire forced me to keep my hand glued to the doorknob.'
40581: '@rBut it was useless.'
40582: '@rBoth the chain and the stake were firm, and though they clattered about, there was no chance of them letting the door open any further.'
40583: '@rEven though I could see the pleasant hallway through the crack, I had no chance of opening the door any further.'
40584: '@rMaybe someone will come if I yell...'
40585: '@rMaybe the door can be opened easily from the outside...'
40586: '@rWhen I thought this,@w500. ......I tried to call out to someone,@w583. ......but it was as though the wind had been knocked out of me.'
40587: '@rI could mouth the words "someone, come here",@k but no voice left my lips.'
40588: '@rWhat''s...going on...?!@k@rSomeone, come...@k Why can''t I cry out...?!'
40589: '@rHelp me help me help me.'
40590: '@rNot even being able to say "help me" out loud scared me more than anything.'
40591: '@rAnd if I turned around,@k ......the witch gazing into the room from the darkness outside...@k...might now be inside the room, standing right behind me......@k I''m frightened... I''m scared I''m scared I''m scared...'
40592: '@rSomeone help me, someone help me...'
40593: '@rI can''t get out... I can''t get out...'
40594: '@rLet me out......of this room......@k Help me,@w166. I''m scared@w166. I''m scared@w166. I''m scared,@w500. let me out@w166. let me out@w166. let me out,@w250. help me@w166. help me@w166. help me......'
40595: '@r@v20/63000001."Missy, it sounds like they''ve arrived."'
40596: '@r@v11/62000001."Huh?@k @v11/62000002..........Oh, ........."'
40597: '@rAmakusa ran his finger down my cheek.'
40598: '@rI awoke in an instant from the doze I had just been in.'
40599: '@rI glared at Amakusa for waking me up in such a creepy way, but he just played dumb.'
40600: '@rWhere......is this?'
40601: '@rIt feels like a parlor in the house of some well-off person,@k ......but I have no memory of this place at all.'
40602: 'Ange@r@v11/62000003."....................."'
40603: '@rWhere......is this......?@k ...And......why am I......?'
40604: 'Amakusa@r@v20/63000002."Are you still half-asleep, missy?"'
40605: 'Ange@r@v11/62000004."......Yeah, sorry.@k@v11/62000005. Where are we......?"'
40606: 'Amakusa@r@v20/63000003."Huh?"'
40607: '@rApparently, he hadn''t expected me to forget something like that just because I wasn''t fully awake yet.@k ......Oddly enough, I agreed.'
40608: '@rWhy am I in this parlor that I don''t recognize?'
40609: '@rThe sound of the footsteps of the person—or people—that Amakusa had mentioned...@khad come right up to the opposite side of the door.'
40610: '@rI could hear the sound of a conversation.@k They were probably women...'
40611: '@rJudging by the coffee and snacks laid in front of me, I was the guest here.'
40612: '@rIn that case, I''d better remember why I came here...@k...or at least who it was I came to visit...'
40613: '@rWho am I?@k Ushiromiya Ange.'
40614: '@rWho is the man standing behind me?'
40615: '@rAmakusa Juuza.@k The man who used to be my guard long ago.@k@rHe''s now the bodyguard Okonogi assigned to me.'
40616: '@r......In that case, ......after Aunt Eva died...@k...I must have thrown off my pursuers...@k......and gone on a journey to find out what happened on that day twelve years ago......'
40617: '@r......Is that...what happened...?@k ...Did I have...a memory of this......?'
40618: '@rAfter a knock, the door opened,@k and the person I must have come here to meet entered along with a maid.'
40619: '@r......Oh, wonderful.@k ...Even after seeing her face, I can''t remember who she is.'
40620: '@r@v99/SHIYOH6001."Sorry to have kept you waiting.@k@v99/SHIYOH6002. This is Hachijo Tohya."'
40621: '@rThat''s a relief.@k The maid introduced her to me first.'
40622: '@r...And, I finally remembered who she was...'
40623: '@r"She"?@k I was sure it was a "he"......'
40624: 'Amakusa@r@v20/63000004."Excuse me, ...but are you...?"'
40625: '@r@v56/64900001."Yes.@k@v56/64900002. ......I am @bHachijo Tohya.@<八城十八@>."@|@y'
40626: 'Amakusa@r@v20/63000005."The magazines talked about your book signing event.@k@v20/63000006. Supposedly, a mysterious male author showed up wearing sunglasses and a mask...@k@v20/63000007. Never thought you''d be a woman...... What''s the deal?"'
40627: 'Tohya@r@v56/64900003."......That was just a double set up by the editing department.@k@|@y@v56/64900004. I was the assistant standing behind him at the book signing."'
40628: 'Amakusa@r@v20/63000008."Heh, now there''s a shock...@k@v20/63000009. ......I haven''t read your works,@k@v20/63000010. but I''ll bet you''re even more of a mystery than your books are."'
40629: 'Tohya@r@v56/64900005."My readers only pretend to read my books.@k@|@y@v56/64900006. ......They buy them just based on the name of the author and the brand and think that they''ve actually read them."'
40630: 'Tohya@r@v56/64900007."......No matter what I write in my books, they don''t truly read anything.@k@v56/64900008. They just pretend to read so they can look smart and knowledgeable and keep up with the current fad.@k@v56/64900009. ......Am I supposed to expose myself to these people?@k@v56/64900010. Why indulge such trash?"'
40631: 'Ange@r@v11/62000006."......I see.@k@v11/62000007. Looks like......you really are the great Hachijo."'
40632: '@rThis person really is eccentric...@k@rThere''s no doubt about it... This is Hachijo Tohya herself...'
40633: '@rHachijo Tohya is a mystery novelist who''s become the center of discussion lately.'
40634: '@rAlthough her actual books are also apparently highly praised, it''s her mysterious debut that''s attracted so much attention towards her lately.'
40635: '@rLast year, she somehow managed to win several different awards for exceptional mystery novels offered by multiple large publishing companies,@k submitting each of her works under a different pen name.'
40636: '@rAnd after that, several highly regarded anonymous works were discovered, one after another, to have been stories she had written in the past under false names,@k and her popularity soared as she herself became more mysterious than her books.'
40637: '@rDespite all of this, the author herself never appeared in public, and everything about her was wrapped in a veil of secrecy.@k However, just a few days ago, this author had finally made a public appearance for a book signing, showing up with a mask that covered "his" face and drawing even more public attention...'
40638: '@r......And yet, apparently even that had been a fake.'
40639: '@rGiven this person''s radically unconventional track record,@k it was hardly a surprise to hear her casually insult her fans like this.'
40640: 'Tohya@r@v56/64900011."I know quite a lot about you, too, Ushiromiya Ange-san.@k@v56/64900012. The talk shows have been discussing you for some time now..."'
40641: 'Ange@r@v11/62000008."I''m sure you''ve heard nothing good."'
40642: 'Tohya@r@v56/64900013."Yes.@k@v56/64900014. Nothing good at all.@k@v56/64900015. Apparently, you employ and then fire people on a whim,@k@v56/64900016. think anything can be resolved with money, and are an outlaw and a thug."'
40643: 'Amakusa@r@v20/63000011."Yep, sounds about right.@k@v20/63000012. Heheheh!"'
40644: 'Tohya@r@v56/64900017."However.@k@v56/64900018. ......I happen to like intelligent people like you."'
40645: 'Ange@r@v11/62000009."......Is that why you agreed to meet with me?"'
40646: 'Tohya@r@v56/64900019."Exactly.@k@v56/64900020. You''re the only person who''s managed to spot that Itouikukuro0576 is another pen name used by Hachijo Tohya.@k@v56/64900021. That''s actually pretty impressive..."'
40647: 'Ange@r@v11/62000010."Itouikukuro0576.@k@v11/62000011. It was a pretty strange username.@k@v11/62000012. However, if you match the Japanese syllables to numbers, you can read it as 1-10-1-9-9-6-0576."'
40648: '@r11,019,960,576.@k@rThis massive number is equal to 18^8.'
40649: '@rEighteen to the eighth power.@k In Japanese, "tohya no hachijo".'
40650: '@r......That''s how you reach Hachijo Tohya...'
40651: 'Tohya@r@v56/64900022."Heheh, ......very well done.@k@v56/64900023. I was quite impressed.@k@v56/64900024. In fact, I was so impressed, I decided to let you meet me in person.@k@v56/64900025. ......Welcome to my mansion, child of man."'
40652: '@rHer manner of speaking was extremely condescending,@k but, perhaps because of her elegant manner, it didn''t feel particularly irritating.'
40653: '@rThis person had a sort of majestic grandeur about her which made that style of speech seem almost natural.@k@r......At least, that''s how it felt to me.'
40654: '@r.........In fact, it felt almost as though this was the manifestation of some noble being,@k who would have no need to show herself before mere Humans under normal circumstances.'
40655: '@rSince I''m not particularly a fan of hers,@k I guess this is proof that her mysterious charisma really is nothing to be laughed at......'
40656: '@rHowever, I didn''t come here to talk to Hachijo Tohya, the mystery novelist.'
40657: '@r......I''m interested in Itouikukuro0576,@k the mysterious web author who only releases her works over the Internet...'
40658: '@rAround the Japanese parts of the Internet, Itouikukuro is an extremely famous Witch Hunter.'
40659: '@rHowever, she isn''t a big opinion leader like Professor Ootsuki.'
40660: '@rShe''s one of those "message bottle Forgers" who are always the center of vigorous debate...'
40661: '@rMessage bottle Forgers are, as the name suggests,@k people who forge and post the contents of riddle-filled message bottles which purport to tell the story of the Rokkenjima incident.'
40662: '@rClaiming to have discovered a new message bottle,@k they post either a very similar counterfeit or a new theory with their own interpretation of the truth, claiming that it was written by Ushiromiya Maria.'
40663: '@rThey openly call themselves "Ushiromiya Maria",@k write up a new bizarre tale as if they had been there themselves and knew the truth,@k and send their stories out into the newest sea that Humans have discovered—the Internet—calling them the third or fourth message bottles...'
40664: '@rAll of the first Forgers were either simple pranksters...@kor crooks trying to swindle collectors.'
40665: '@rHowever, eventually, people who claimed to have solved the riddles of the message bottles'' tales and reached the "truth" started to appear,@k and they started work creating third and fourth message bottles from Ushiromiya Maria, as though they had moved over to the riddle-teller''s side.'
40666: '@rThese people rewrote the tale of the witch with whatever interpretation they wanted, and every once in a while, certain theories would gather an enormous amount of support on the web.@k Because of this, some of these "creations" began to be so widely trusted that they were believed to contain some grain of truth.'
40667: '@rThe more rigid Witch Hunters openly despised these people, calling them "Forgers", "Counterfeiters", or just "Witches".'
40668: '@rThough they claimed to have reached the truth, they refused to tell it, and created fake message bottles as though testing everyone else.'
40669: '@rIt''s no surprise that the serious Witch Hunters were very annoyed by these Forgers...'
40670: '@rHowever, there were many people who simply liked to entertain themselves with the occult fantasy of Rokkenjima,@k and a small number of those accepted these creations as literary works,@k glad of this expansion to the mysterious tale...'
40671: '@rOf all the Forgers, Itouikukuro was the one most highly regarded.'
40672: 'Ange@r@v11/62000013."......End of the Golden Witch.@k@v11/62000014. I read that one of yours.@k@|@y@v11/62000015. ......It''s nice to know you have no qualms about killing off other people''s families."'
40673: 'Tohya@r@v56/64900026."Is that why you came all this way? Just to say that...?@k @v56/64900027.I think not, final descendant of the Ushiromiya family."'
40674: '@rIn her latest forgery, "End", she killed off at least seven of my relatives during the story.'
40675: '@rNo, if you count "Alliance" and "Banquet", the other forgeries she''s made before now,@k then she''s killed off most of my family in horrible ways, over and over again...'
40676: '@rOf course I''d want to complain.'
40677: '@rHowever, all of her works are known for being, in both form and level of completion,@k the closest tales to those written by "Ushiromiya Maria" herself.'
40678: '@rIn particular, Itouikukuro''s first forgery, "Banquet of the Golden Witch",@k was a depiction so complete that it even included Ushiromiya Eva''s escape to Kuwadorian.@k People wondered whether this might be the true story of Rokkenjima, and it even made it onto the talk shows...'
40679: '@rSo far, all of these tales have been nothing more than electronic text on the web.'
40680: '@r......However, people will eventually realize that Itouikukuro is actually Hachijo Tohya.'
40681: '@rWhen that happens, these tales will become associated with "that bizarre Hachijo", and no one will think of them as mere fan creations.@k ...People will probably start wondering if this might actually be a third message bottle she found and released under the guise of a story she herself wrote.@k When that happens, these stories will probably seem even more bizarre and credible...'
40682: 'Ange@r@v11/62000016."......You are cunning, aren''t you?"'
40683: 'Tohya@r@v56/64900028."Why do you say that?"'
40684: 'Ange@r@v11/62000017."You''re doing this to make your forgeries more mysterious and more credible."'
40685: 'Tohya@r@v56/64900029."And what do you mean by credible?"'
40686: 'Ange@r@v11/62000018."Once you''ve gained credibility, your forgeries will rise to the level of truth."'
40687: 'Tohya@r@v56/64900030."Rise to the level of truth?@k @v56/64900031.Hmph, how foolish.@k@|@y@v56/64900032. Such a thing is unnecessary for my works."'
40688: 'Ange@r@v11/62000019."......Is that because your works are the truth, and not mere forgeries...?"'
40689: 'Tohya@r@v56/64900033."Correct.@k@v56/64900034. They are the truth, so there''s no need for them to rise into anything."'
40690: 'Ange@r@v11/62000020."You aren''t Maria onee-chan.@k@v11/62000021. And you weren''t on Rokkenjima on that day.@k@v11/62000022. So how can you be so absurd as to call this the truth?"'
40691: 'Amakusa@r@v20/63000013."Missy, you''re getting a bit too stirred up."'
40692: 'Ange@r@v11/62000023."Shut up. How can you call this stirred up?"'
40693: 'Tohya@r@v56/64900035."*giggle*......"'
40694: '@rAnge realized that she''d let her emotions get control over her.'
40695: '@rShe let out a sigh and shrugged...'
40696: 'Tohya@r@v56/64900036."Your reason for coming here.@k@v56/64900037. It wasn''t to yell at me for murdering your family several times within my forgeries, correct...?"'
40697: '@rHachijo had been smiling at Ange kindly, ......but in a condescending manner,@k or else, like a mother might watch over a very small child.'
40698: '@rAnge realized this and was unable to suppress her irritation.'
40699: '@rApparently, Amakusa could tell that Ange was getting worked up.'
40700: '@rHe joked around with her for a bit so that they could start the conversation over again from the beginning.'
40701: 'Tohya@r@v56/64900038."The thing you came here to hear...@k@v56/64900039. ...It''s the "truth" that I''ve reached, is it not?"'
40702: 'Ange@r@v11/62000024."............Why are you so sure that you''ve reached the truth...?"'
40703: 'Tohya@r@v56/64900040."Because I''ve understood all of the tales."'
40704: 'Ange@r@v11/62000025."And I''m asking you why you''re so sure about that."'
40705: 'Tohya@r@v56/64900041."......Do you think the Sun ever revolved around the Earth?"'
40706: '@rHachijo suddenly started talking about the geocentric model.'
40707: '@r......Ange was about to tell her not to answer questions with more questions, but she quickly realized what Hachijo meant.'
40708: 'Tohya@r@v56/64900042."......Humans used to support geocentrism.@k@v56/64900043. However, that theory has been disproved in the modern age.@k@|@y@v56/64900044. ......Does this mean that, at the instant the theory was denied, the sun stopped moving and the Earth started revolving around the Sun?"'
40709: 'Ange@r@v11/62000026."......Of course not.@k@v11/62000027. The truth doesn''t change based on what Humans believe."'
40710: 'Tohya@r@v56/64900045."It''s the same with this case.@k@v56/64900046. Your denying my truth amounts to the same thing."'
40711: '@rSeveral scholars before Galileo proposed the heliocentric model.@k@r......However, it was hard to objectively prove it using the scientific techniques available at the time.'
40712: '@rHowever, that didn''t change the fact that it was the truth.@k@r"And yet it moves".'
40713: 'Ange@r@v11/62000028.".........So, you''re saying the truth is still the truth whether you can prove it or not...?"'
40714: 'Tohya@r@v56/64900047."Correct.@k@v56/64900048. In the future,@k@v56/64900049. when the full truth finally becomes known,@k@v56/64900050. people will look back and realize that I had already discovered it."'
40715: '@rApparently, Ange just couldn''t stand Hachijo''s attitude.@k@rShe kept getting irritated, and every time, Amakusa would joke around until she settled down again.'
40716: '@rHowever, there could be no mistake that Hachijo was a genius...@kand had used her extraordinary intuition to form a most interesting perspective on the events that had occurred on that island...'
40717: '@rThat was why Ange had wanted to contact Itouikukuro and hear about her viewpoint.'
40718: '@rStill, she really was lucky to have been granted this meeting.'
40719: '@rAnge hadn''t been absolutely sure that Itouikukuro was Hachijo Tohya,@k she hadn''t thought that the publishing company would really contact the author,@k ......and most of all, she hadn''t dreamed that the mysterious masked author would grant her an interview under such short notice.'
40720: '@rThe more she thought about it, the more she realized that the sum of the events leading to this meeting made for nothing short of a miracle.'
40721: '@r......Yes.@k A miracle.'
40722: '@r......After all, in most cases, I don''t get contacted by the publishing company at all and leave for Niijima the next day.'
40723: '@r..................?'
40724: '@r.........I left for Niijima, then I went on to Rokkenjima.'
40725: '@r......Then I gave Onee-chan...Sakutarou.'
40726: '@r......Huh?'
40727: '@r.........Why would I have Sakutarou.........?'
40728: '@r..............................'
40729: '@rMy memory of the future...is all muddled...@k My head......hurts...'
40730: '@rHachijo said something about showing Ange something good, rose from the sofa, and headed for the study desk.'
40731: '@rWhen she turned her back, Amakusa asked Ange, who seemed to be troubled about something, if she was okay.'
40732: 'Ange@r@v11/62000029."......Hey, Amakusa.@k@v11/62000030. ......How...long have I been here...?"'
40733: 'Amakusa@r@v20/63000014."Wha?@k @v20/63000015.You''ve been acting weird for a while now.@k@v20/63000016. What''s going on?"'
40734: 'Ange@r@v11/62000031.".........I can''t remember how long I''ve been sitting here."'
40735: 'Amakusa@r@v20/63000017."Are you still sleepy?"'
40736: 'Ange@r@v11/62000032."That''s not it.@k@v11/62000033. ......I mean, I managed to get an appointment with Professor Ootsuki, but the publishing company never got back to me about Itouikukuro,@k@v11/62000034. ......and in the end, I spent the whole of today unable to accomplish anything, I thought..."'
40737: 'Amakusa@r@v20/63000018."Huh?"'
40738: 'Ange@r@v11/62000035."Amakusa, ......I thought you went to go get that large black bag..."'
40739: '@rThat''s right.@k Just before we left for Niijima, Amakusa and I briefly parted ways.@k ......He said something about getting a weapon from an acquaintance of his, and he went to go get that large black bag.'
40740: '@rWasn''t that...@w500....today.........?'
40741: '@rWhat......am I talking about......?'
40742: '@rI mean,@w500. ......didn''t I go to Niijima,@w333. ......meet Captain Kawabata,@w333. ...and, inside the bed shop,@w583..........Huh?@k ............What...?'
40743: 'Tohya@r@v56/64900051."......Is something wrong...?"'
40744: '@rDid my confusion and uncertainty make me sigh out loud...?'
40745: '@rEven though Hachijo''s back was to me,@k ......she slowly turned around......and smiled as though she had peered into my heart.'
40746: 'Ange@r@v11/62000036."N-@v11/62000037.......no, it''s nothing."'
40747: '@rStrange memories...ones that even I can''t understand.'
40748: '@rI tried to hide my confusion,@k .........but for some reason, Hachijo had a strange glint in her eyes, ......as though she could read my mind.'
40749: 'Tohya@r@v56/64900052."I have revived and killed your family several times within various forgeries.@k@v56/64900053. ......Almost as a witch might."'
40750: 'Ange@r@v11/62000038."Reviving and killing them whenever you like.@k@v11/62000039. .........Endlessly.@k@v11/62000040. ...Sounds almost like BEATRICE, doesn''t it..."'
40751: 'Tohya@r@v56/64900054."Yes, it does.@k@v56/64900055. ......So, please follow the lead of all those people on the web,@k@|@y@v56/64900056. and consider the possibility that I might be a witch."'
40752: '@rShe took a thickly-packed, brown envelope out of a locked drawer.'
40753: '@rIt appeared to be filled to bursting with pages of printed-out text.'
40754: '@r......Perhaps this was a manuscript for one of her works.'
40755: '@rAnd, the neat letters written with a fountain pen on the envelope...@k...spelled out the word "Dawn".'
40756: '@rThere is no forgery by the name of Dawn.@k@r......Which...must mean......'
40757: '@r......Ange could tell.@k This was a new one.@k@rHachijo''s newest, unreleased forgery......'
40758: 'Ange@r@v11/62000041."Dawn of the Golden Witch"...'
40759: 'Tohya@r@v56/64900057."For one such as I, who knows everything, everything is boring.@k@v56/64900058. ......However, I don''t dislike letting the ignorant read my works to see what kind of reaction they have.@k@v56/64900059. ......And so, I want you to read it."'
40760: 'Ange@r@v11/62000042."......You want me to read your newest work, which you''ve created as the new Endless Witch?"'
40761: 'Tohya@r@v56/64900060."Correct, child of man.@k@v56/64900061. Whether you resent it or admire it, you can help me forget my illness for a time."'
40762: 'Ange@r@v11/62000043.".....................@k@v11/62000044. ......Let''s put an end to this farce, shall we?@k@|@y@v11/62000045. ...Who are you?@k@v11/62000046. ......I don''t remember ever meeting you like this."'
40763: '@rYes, I did try to contact Hachijo Tohya.@k@rHowever, in the end, I never got a chance to meet her.'
40764: '@rIn other words, all of this is a falsehood.'
40765: 'Ange@r@v11/62000047."Whose piece am I this time?@k @v11/62000048.......Sorry, but if you think you can tame Ushiromiya Ange so easily,@k@v11/62000049. you''re making a big mistake."'
40766: 'Tohya@r@v56/64900062.".........Pfft.@k@v56/64900063. ......*giggle*giggle*.........@k@v56/64900064. Yes, ...I hoped you''d be this interesting.@k@v56/64900065. Eheheheheheheheheheheh..."'
40767: '@rShe finally couldn''t hold it back and burst out laughing...'
40768: '@rGradually, the space around them seemed to fill with a strange purple mist...'
40769: '@rThe room itself seemed to twist and bend...'
40770: '@rHer figure also twisted,@k ......and, after transforming through something that couldn''t be described, she took the form of just what she had called herself:@k ......a witch.'
40771: '@r@v50/65000001."Splendid.@k@v50/65000002. You did well to see through my trick..."'
40772: 'Ange@r@v11/62000050.".........It seems I''m the type that witches just love to cling to.@k@v11/62000051. .........All of you have that same condescending tone towards other people.@k@v11/62000052. I figured you were a witch right away."'
40773: '@rThe novelist sitting on the sofa was nowhere to be seen.@k@rEven Ange''s bodyguard, who was supposed to be around at times like this, was gone.'
40774: '@rThere was only a nonhuman figure relaxing in a large, ornate rocking chair.'
40775: '@r@v50/65000003."I find you to be truly interesting, child of man.@k@v50/65000004. ......Your charming nature is the perfect thing to alleviate my boredom."'
40776: 'Ange@r@v11/62000053."Yeah, well, I don''t see anything charming about this.@k@v11/62000054. ......Why am I alive?@k @v11/62000055.......Wasn''t I killed in a pretty nasty way for breaking the rule about revealing my name...?"'
40777: '@rWell, ......I did doubt that those people would just let me go so easily.'
40778: '@r......What kind of farce will I be forced to go along with this time?'
40779: '@rI really don''t care.@k I''ll just do whatever I can within the bounds of the role they give me...whatever I can to help Onii-chan.'
40780: '@rOf course, I understand.'
40781: '@r......Even if he wins, he''ll never come back to "me".'
40782: 'Ange@r@v11/62000056."Even so, ......I''ll struggle on.@k@v11/62000057. I''ll make sure Onii-chan comes back to the "me" of that day."'
40783: '@r@v50/65000005."No need to lose your temper.@k@v50/65000006. I am not asking you to be a piece..."'
40784: 'Ange@r@v11/62000058."Then why did you summon me here?@k@v11/62000059. Don''t tell me you want me to read this new story or whatever it is you''ve written."'
40785: '@r@v50/65000007."That''s it exactly.@k@v50/65000008. ......I do not want you to be my piece.@k@v50/65000009. I have always been a mere observer,@k@v50/65000010. and I have no intention of sticking my neck into their game..."'
40786: 'Ange@r@v11/62000060.".........I don''t get it.@k@v11/62000061. What is it you want from me?"'
40787: '@r@v50/65000011."Be an observer for me, an observer of the fragments BEATRICE has woven."'
40788: 'Ange@r@v11/62000062."An observer...?@k @v11/62000063.I don''t really know what you mean, but no deal."'
40789: '@r@v50/65000012."In the past,@k@v50/65000013. I observed the fragments through Battler''s eyes.@k@v50/65000014. ......However, now that he has succeeded the position of Game Master, he is not a suitable observer.@k@v50/65000015. I am following this tale with true and earnest intentions.@k@v50/65000016. It would be such a waste to observe it through the eyes of Battler as he is now, like reading a detective novel backwards..."'
40790: 'Ange@r@v11/62000064."......Onii-chan is the Game Master??@k @v11/62000065.What on Earth are you talking about?"'
40791: '@r@v50/65000017."Of course you don''t know.@k@v50/65000018. You want to know, don''t you?@k@v50/65000019. ......I too wish to know something.@k@v50/65000020. What kind of tale will Battler weave now that he has taken the position of Game Master?@k@v50/65000021. ...Furthermore, I wish to search for the truth Battler reached as part of my own mental journey.@k@v50/65000022. .........My illness affects me gravely.@k@v50/65000023. If I do not think, I cannot even keep my heart beating..."'
40792: 'Ange@r@v11/62000066.".........So,@k@v11/62000067. ...you want me to read your new picture book aloud to you...?"'
40793: '@r@v50/65000024."You might as well interpret it that way.@k@v50/65000025. In exchange, you will also be able to take part in your own journey of the mind.@k@v50/65000026. I do believe that even you have yet to reach the truth.@k@v50/65000027. .........I think you want to continue,@k@v50/65000028. ...on the journey to find that truth."'
40794: 'Ange@r@v11/62000068."I don''t owe you anything."'
40795: '@r@v50/65000029."Don''t push your luck.@k@v50/65000030. I can be lenient at times, but that is not usually the case..."'
40796: 'Ange@r@v11/62000069."........................"'
40797: '@rAnge hadn''t yet reached the truth either.'
40798: '@rThough she knew that the game was little more than a toy for the witches to play with, she wanted it to resume...so that she could follow the tale and close in on the "king" called truth......'
40799: 'Ange@r@v11/62000070."......I might follow the tale so that I can find the truth myself,@k@v11/62000071. ......but I have no obligation to read it aloud until the end for your sake.@k@v11/62000072. ...Understand?"'
40800: '@rAnge was willing to read the story aloud, but she could quit any time if this witch made her mad.'
40801: '@rShe was, in effect, warning the witch not to annoy her...'
40802: '@r@v50/65000031."Of course.@k@v50/65000032. ......You call it a picture book, but to me, it is the only medicine for a fatal illness.@k@v50/65000033. I cannot take that medicine without you to assist me.@k@v50/65000034. ......In other words, this is a mutually beneficial arrangement."'
40803: 'Ange@r@v11/62000073."......So, you''re telling me to read you a book until you fall asleep.@k@v11/62000074. And in exchange, you''ll let me read it too.@k@v11/62000075. ......Is that right?"'
40804: '@r@v50/65000035."Precisely.@k@|@y@v50/65000036. ......If you are willing to accept,@k@v50/65000037. I shall ask that you become my Reader for a time."'
40805: 'Ange@r@v11/62000076."Well, it''s nice to get my own title, but all you really want me to do is read books, right?"'
40806: '@r@v50/65000038."Becoming my Reader means the same as becoming my familiar.@k@v50/65000039. ......In other words, what is done against you will be done against me.@k@v50/65000040. I will not permit anyone to disrupt my only interest, that being to read the rest of BEATRICE''s tale.@k@v50/65000041. ......I will not let BERNKASTEL, LAMBDADELTA,@k@v50/65000042. or even BEATRICE force anything upon you..."'
40807: '@rThis witch, who seemed to have an almost divine quality to her, spoke both quietly and forcefully...'
40808: '@rThere was no threat in her words.'
40809: '@r......However, even so,@k it was clear that she was on a different level than BERNKASTEL and the other witches, and not at all to be taken lightly.'
40810: 'Ange@r@v11/62000077."So, you''ll offer me protection if I agree to read your book...?"'
40811: '@r@v50/65000043."Of course.@k@v50/65000044. What I want is for you to read aloud to me.@k@v50/65000045. ......I will not spare any who attempt to stand in the way of that."'
40812: 'Ange@r"..........................."'
40813: '@r@v50/65000046."......If my attitude seems arrogant to you, allow me to apologize, child of man.@k@v50/65000047. It may not seem so, but I am speaking to you with the utmost respect."'
40814: 'Ange@r@v11/62000079."Yeah, probably.@k@v11/62000080. ......I get the feeling that even that witch-like style of speech...@v11/62000081.is the most respect you''ve shown anyone in the last few centuries."'
40815: '@r@v50/65000048."When you''re reading a book, do you tell it "thank you very much" before flipping through the pages...?"'
40816: 'Ange@r@v11/62000082."......I guess it is like that.@k@v11/62000083. I understand."'
40817: '@rJust by agreeing to have a conversation with Ange, she was showing an incredible amount of respect and willingness to compromise.'
40818: '@rAnge shrugged, but she also nodded to show her consent.'
40819: 'Ange@r@v11/62000084."Sure.@k@v11/62000085. ......I''ll be your Reader.@k@v11/62000086. I see that you showed a ton of respect just by asking for my consent first."'
40820: '@r@v50/65000049."You understand well, child of man."'
40821: 'Ange@r@v11/62000087."......My name''s Ange.@k@v11/62000088. Not child of man or whatever."'
40822: '@r@v50/65000050."Heheheheheh.@k@v50/65000051. ......Very well.@k@v50/65000052. As proof of my respect for you, I will acknowledge your name."'
40823: '@rFor her, acknowledging a human''s name was like acknowledging the names of all the leaves scattered across the ground.'
40824: '@rSo, .........her acknowledging Ange''s name was a miracle.@k@rNo, it was immensely good fortune.'
40825: '@r@v50/65000053."...From this point forth, Ushiromiya Ange...@k@|@y@v50/65000054.will serve as Reader and miko to the Witch of Theatergoing, FEATHERINE AUGUSTUS AURORA.@k@v50/65000055. Until you finish reading,@k@v50/65000056. I shall bring calamity to all who attempt to hinder your task."'
40826: '@rWhen the Witch of Theatergoing, FEATHERINE, spoke this, ......Ange was wrapped in a bright light.'
40827: '@rAnge didn''t feel any particular change herself,@k ......but she definitely had been given something that only nonhumans could sense.'
40828: '@rIt signified that from this point forward, Ange would be attached to the Witch of Theatergoing.'
40829: '@rThat didn''t mean that Ange would gain some sort of special power,@k ......but at the very least, it probably meant that anyone wanting to cause her harm would first have to take on FEATHERINE herself...'
40830: 'Ange@r@v11/62000089."......Your name is pretty long.@k@v11/62000090. Sounds like some ancient Roman person.@k@v11/62000091. ......What should I call you?"'
40831: 'FEATHERINE@r@v50/65000057."Those not familiar with me call me AUGUSTUS AURORA."'
40832: 'Ange@r@v11/62000092.".........After all the respect you''ve shown me, it''s only fitting that I respond in kind.@k@v11/62000093. I''ll call you FEATHERINE.@k@v11/62000094. Any problems?"'
40833: 'FEATHERINE@r@v50/65000058."None at all.@k@v50/65000059. ......For an ailing witch such as myself, even being called by my first name will be an experience to be treasured and pondered over. Child of man."'
40834: 'Ange@r@v11/62000095."I have a name. It''s Ange."'
40835: 'FEATHERINE@r@v50/65000060."......Heheh. Even conversations like this are nice every once in a while.@k@v50/65000061. ......Ange, my miko."'
40836: '@rAnge accepted her role.@k@rShe would observe this tale with the Witch of Theatergoing.'
40837: '@rThe curtain was rising on the sixth tale......'