43920: '@rAs usual, this year''s family conference was getting bogged down.'
43921: '@rEveryone had decided to cool their heads for a moment, and a short break had been agreed upon...'
43922: '@rThe four siblings could say whatever they wanted,@k but Natsuhi and Kyrie, for example, were outsiders and found it difficult to speak freely in this sort of atmosphere.'
43923: '@rA conference where you aren''t allowed to say what you want can be tiring even as you just sit there quietly.'
43924: '@rEven Kyrie couldn''t help letting out a deep sigh...'
43925: 'Kyrie@r@v09/61300010.".............................."'
43926: '@rThis was the second floor hallway of the mansion.'
43927: '@rRudolf had wanted to be alone during the break, so she had felt like doing the same...@k...and had drifted up the stairs to reach this place.'
43928: '@rHer expression was less tightly controlled than it was when her husband was around.@k@r......Kyrie wore a tired look that she didn''t often show.'
43929: '@rShe pressed her forehead against the cool window glass.'
43930: '@rI need to regain my spirit and support my husband.@k Even if I''m not allowed to speak.'
43931: '@r......That''s the duty I''ve won.'
43932: 'Kyrie@r@v09/61300011.".....................Who is it?"'
43933: '@rShe suddenly sensed another person, turned around,@k and saw Jessica standing at the other end of the hallway.'
43934: 'Jessica@r@v04/60200225."..........................."'
43935: 'Kyrie@r@v09/61300012."Oh, it''s you, Jessica-chan.@k@v09/61300013. ......Didn''t you go to the guesthouse?"'
43936: 'Jessica@r@v04/60200226."......Well,@v04/60200227. ......I just decided to head back to my own room for a bit to get a book."'
43937: 'Kyrie@r@v09/61300014."I see.@k@v09/61300015. And now you''re on your way back to the guesthouse?"'
43938: 'Jessica@r@v04/60200228."Y-yes.@k@v04/60200229. That''s right......"'
43939: 'Kyrie@r@v09/61300016."What horrible rain.@k@v09/61300017. Is the wind really strong...?"'
43940: 'Jessica@r@v04/60200230."It''s weak right now, relatively speaking......"'
43941: '@rAs Kyrie looked out the window, ......Jessica watched her back, looking agitated...'
43942: 'Jessica@r@v04/60200231."......Auntie Kyrie...@k@v04/60200232. ......I''m sorry, you just had bad luck..."'
43943: 'Furfur@r@v52/65200047."Ah, Zepar!@k @v52/65200048.Jessica''s roulette of fate has chosen Kyrie!"'
43944: 'Zepar@r@v51/65100053."What will you do, Jessica?!@k @v51/65100054.The roulette has chosen Kyrie, but you may reject that choice and spin the roulette again if you wish!"'
43945: '@r@v00/awase6015.""It doesn''t matter whose life is sacrificed for this trial...!!""'
43946: '@rJessica wasn''t like George.'
43947: '@rGeorge had willingly chosen Eva to be his sacrifice,@k to signify his separation from his old life so that he could step into a new life married to Shannon.'
43948: '@rHowever, Jessica hadn''t thought of any particular target.'
43949: '@r......So, she had left it up to the roulette of fate.'
43950: '@rThat "roulette" was nothing very grandiose.'
43951: '@r......She had simply walked around at random, imposing a rule on herself saying that the first person she met would be chosen as the sacrifice.'
43952: '@rAnd so, ......the roulette of fate had brought her to Kyrie...'
43953: '@rOf course, there was nothing forcing her to keep to that rule.'
43954: '@rHowever, it was the rule that she had decided upon, and she didn''t want to break it now.'
43955: '@r......Now that she was participating in this demons'' game, this was the one bit of justice that she could cling to...'
43956: '@rRight now, she could attack that unprotected back...@k@rBut Jessica still wasn''t able to fully resolve herself.'
43957: 'Kyrie@r@v09/61300018."........................@k@v09/61300019. ......What is it?@k @v09/61300020.Do you have something to say to me...?"'
43958: '@rNoticing Jessica''s strange silence, Kyrie turned around.@k@r......That unprotected back was already gone.'
43959: '@rJessica realized that her hesitation had cost her her own first chance...'
43960: '@r......She had taken on this demons'' game to prove her love for Kanon.'
43961: '@rHowever,@w500. ......would it really be alright to sell her soul to demons...@w500....for the sake of love...?'
43962: '@rNot wanting to let George, who had already come to terms with the situation, get any more of a lead on her, she had energetically consented to this demons'' game, but...'
43963: '@r......her heart still wasn''t ready......'
43964: 'Jessica@r@v04/60200233."Umm, ..................@k@v04/60200234. ......M-maybe I shouldn''t be asking you this, Auntie Kyrie........."'
43965: 'Kyrie@r@v09/61300021."......What is it?@k @v09/61300022.It''s rare for you to ask me questions, Jessica-chan.@k@v09/61300023. ......I hope I''m capable of answering it for you."'
43966: 'Jessica@r@v04/60200235."Actually, umm, ............I...@v04/60200236.have someone @|@yI like."'
43967: 'Kyrie@r@v09/61300024."Oh, really?@k @v09/61300025.That''s wonderful, *giggle*.@k@v09/61300026. Then is it love you wanted to talk about...?"'
43968: 'Jessica@r@v04/60200237."E-......eheheh...@k@v04/60200238. ...Yeah, ......pretty much."'
43969: 'Kyrie@r@v09/61300027.".........Alright.@k@v09/61300028. I''ll help out if I can."'
43970: 'Jessica@r@v04/60200239."Th-thank you very much...@k@v04/60200240. ......Actually, umm......"'
43971: 'Kyrie@r@v09/61300029."Is it still one-sided?"'
43972: 'Jessica@r@v04/60200241."No, ......I guess you could say that it''s just become mutual...@k@v04/60200242. But, well, .........there''s this trial......for us to be joined together......"'
43973: 'Kyrie@r@v09/61300030."A trial?@k @v09/61300031.What are you talking about?"'
43974: 'Jessica@r@v04/60200243."......There''s the two of us and another pair of lovers......and we have to fight each other."'
43975: 'Kyrie@r@v09/61300032."A love triangle?@k @v09/61300033.Or a love rectangle...?@k @v09/61300034.Sounds complicated.@k@v09/61300035. ......And?"'
43976: 'Jessica@r@v04/60200244."Only the pair who wins can be together...@k@v04/60200245. ......It''s something complicated like that.@k@v04/60200246. So it''s like, um—"'
43977: 'Kyrie@r@v09/61300036.".........Sounds nasty.@k@v09/61300037. ......Love that can only succeed at another couple''s expense."'
43978: 'Jessica@r@v04/60200247."Yes...@k@v04/60200248. ......If we join up, ......then they''ll fall apart.@k@v04/60200249. ......And the same the other way around."'
43979: 'Kyrie@r@v09/61300038."......I think I see where you''re going with this.@k@v09/61300039. ......Something like this, right?@k @v09/61300040."To what extent is a person allowed to climb over others in their own pursuit of happiness", ......right?"'
43980: 'Jessica@r@v04/60200250.".............................."'
43981: '@rIt was once again apparent......just how smart Kyrie was.'
43982: '@rShe immediately figured out the question that Jessica wanted to ask most...'
43983: 'Kyrie@r@v09/61300041."If you don''t fight, it automatically means that they win and you lose.@k@v09/61300042. ......However, if you do fight and win, you cause the other pair to break apart.@k@|@y@v09/61300043. ......It''s nasty either way.@k@v09/61300044. But the answer is obvious."'
43984: 'Jessica@r@v04/60200251."............Yes......"'
43985: '@rKyrie giggled.'
43986: '@r......If she wasn''t willing to commit to her love, then that would show the measure of their relationship.@k@rIf that was the case, she should just let the other pair of lovers win.'
43987: '@rHowever, if this was a love she couldn''t abandon,@k ......she couldn''t abandon the victory either.'
43988: '@rSo, ......she had no option but to fight.'
43989: '@rIn the end, Jessica''s hesitation was caused by guilt...@kover forcing the others to split apart as the result of her inevitable decision......'
43990: 'Jessica@r@v04/60200252."......I guess...@v04/60200253.......I''m just...@v04/60200254....being soft after all......"'
43991: 'Kyrie@r@v09/61300045."Yep.@k@v09/61300046. ......That you are."'
43992: 'Jessica@r@v04/60200255."...........................@k@v04/60200256. ......But stepping over someone else for the sake of my own love,@k@v04/60200257. ......it feels......horrible..."'
43993: 'Kyrie@r@v09/61300047."In that case, what about the one you love?@v09/61300048. ......Will you give up on them?"'
43994: 'Jessica@r@v04/60200258."......That''s......"'
43995: 'Kyrie@r@v09/61300049."I can tell you one thing for certain.@k@v09/61300050. Doing that would feel even worse.@k@v09/61300051. You''ll be forced to crawl through hell.@k@v09/61300052. ......For the rest of your life."'
43996: '@rA hardness had entered Kyrie''s gaze...'
43997: 'Ange@r@v11/62000404."......I was just six, so I didn''t understand much about it at the time,@k@v11/62000405. ......but I found Mom''s notebook among her belongings after she died."'
43998: 'FEATHERINE@r@v50/65000274."Was it a diary...?"'
43999: 'Ange@r@v11/62000406."It was more a collection of her thoughts.@k@v11/62000407. It was much less organized than a diary would''ve been.@k@|@y@v11/62000408. ......I found it and read it right after she passed away,@k@v11/62000409. ...but I needed to wait a long time, until I''d grown for several years, before I could understand it."'
44000: 'FEATHERINE@r@v50/65000275.".........I see.@k@v50/65000276. ...So, did it speak of Kyrie''s worries about her marriage?"'
44001: 'Ange@r@v11/62000410."It was......practically a book of curses.@k@v11/62000411. ......It cleared up several things that six-year-old me had always vaguely sensed."'
44002: '@rWhen I was six, it seemed as though my parents were very close and had no problems.'
44003: '@r......And though I did think it odd that Onii-chan lived separately when he was meant to be part of our family,@k and I did wonder why he only came home every once in a while,@k I accepted it as the way things were.'
44004: 'FEATHERINE@r@v50/65000277."Did you not know about Asumu?"'
44005: 'Ange@r@v11/62000412."......I think Onii-chan talked to me about her when no one was around, but there was no way an elementary schooler like I was could understand.@k@v11/62000413. ......After all, I never even saw a picture of her.@k@v11/62000414. ......Mom had sent all of the pictures with Asumu-san in them to Onii-chan, leaving none behind in the house."'
44006: '@rIn front of Ange, and even in front of Battler who only rarely came home,@k ......Kyrie''s smile never faltered.'
44007: '@rIf she hadn''t written her thoughts in that notebook, Ange would probably never have known them.'
44008: '@rRudolf had been particularly popular with the opposite sex since his school days—a typical playboy.'
44009: '@rAudacious, over the top, and yet not lacking a little gentleness towards women,@k he had probably built up a formula for getting women to like him.'
44010: '@rPlenty of women approached him, using various seductive tricks to try to win his favor.'
44011: '@rRudolf probably enjoyed that more than anyone.'
44012: '@rSince the beginning, love had been a game to Rudolf.'
44013: '@rHe never thought of it as a trial and error process to find a single life partner.'
44014: '@rHe would intentionally spark jealousy between women and revel in the harem, lapping up their flirting.'
44015: '@r......He may be my father, ......but he was an awful man.'
44016: 'Ange@r@v11/62000415."But at the same time, Dad must have looked down on those toadying girls.@k@v11/62000416. ......Mom, who had her own set of values and was extremely intelligent, must have stood out."'
44017: 'FEATHERINE@r@v50/65000278."......Though even that might have been due to the skillful way Kyrie tried to catch Rudolf''s gaze."'
44018: 'Ange@r@v11/62000417."...........................@k@v11/62000418. ......Yeah, maybe.@k@v11/62000419. Mom was smart in many ways."'
44019: '@rLike the other Ushiromiya siblings, Rudolf had strong ambitions and lofty goals.'
44020: '@rUnder the mottos of "who dares wins" and "it''s not a crime if you don''t get caught",@k he would set up businesses that were borderline swindles or bending the law, then bail out of them, and repeat that process over and over.'
44021: '@rApparently, he was already making use of that talent in his college years, cleverly making money by thinking up shameless projects and selling cheap tickets to parties for them,@k so much money that he could brag about how his wallet was always stuffed with a hundred 10,000 yen notes......'
44022: '@rMany women fell for his charisma in being the man responsible for these radical projects, ...as well as his thick wallet and generosity.'
44023: '@r......It would be a lie to say that Kyrie was not one of them.'
44024: '@rHowever, what made Kyrie very different from the other women...@k...was that she could also support Rudolf as a business partner.'
44025: '@rRudolf would laugh all the way to the bank as his large-scale party succeeded.@k His female entourage would surround him.'
44026: '@rAnd Kyrie would be the only one among them able to calmly point out several ways that income and expenditure could be improved upon,@k and even lay out a proposal for the next project.'
44027: 'FEATHERINE@r@v50/65000279."In that manner, ......Rudolf must have slowly begun to accept her as a partner."'
44028: 'Ange@r@v11/62000420.".........Just like some people say men don''t belong in the kitchen,@k@v11/62000421. ......there''s also a sense that women should stay out of financial affairs.@k@v11/62000422. ......It''s "normal" for women to be treated by men.@k@v11/62000423. ...The details of how those 10,000 yen notes were scrounged up are vulgar, so they don''t ask, don''t know, don''t even care."'
44029: 'FEATHERINE@r@v50/65000280."So, you''re saying that Kyrie viewed money from a man''s perspective..."'
44030: '@rIn that regard, Rudolf noticed something unique about Kyrie.'
44031: '@rHe knew all about how much hard work it took to make just one of those 10,000 yen notes.'
44032: '@rSo, somewhere inside him, he looked down upon those extravagant women who never even considered the efforts he had undertaken.'
44033: '@r......Among all of them, only Kyrie possessed the same sharp financial intuition as Rudolf...'
44034: '@rEvery time Rudolf thought of a new plan, he would talk to Kyrie about it, work out the kinks, and make it succeed.'
44035: '@rIn this way, Kyrie steadily worked her way up until she was the number one of Rudolf''s large group of followers.'
44036: 'Ange@r@v11/62000424."But Mom was still a woman.@k@v11/62000425. ......I doubt she enjoyed seeing Dad pampered by all the other girls."'
44037: 'FEATHERINE@r@v50/65000281."......So, she would rather have been his only one, instead of his number one..."'
44038: 'Ange@r@v11/62000426."Yeah.@k@v11/62000427. Though she served as Dad''s right hand, she slyly got rid of the other women in the shadows.@k@v11/62000428. ......It was only a matter of time before Mom would succeed in her love."'
44039: 'FEATHERINE@r@v50/65000282."When did Asumu come into the picture?"'
44040: 'Kyrie@r@v09/61300053."......She was one of those who swarmed around Rudolf-san.@k@v09/61300054. ...No, not even that.@k@v09/61300055. She was just one of his fans."'
44041: 'Jessica@r@v04/60200259."Did you ever talk with her...?"'
44042: 'Kyrie@r@v09/61300056."Of course.@k@v09/61300057. ......I knew her well.@k@v09/61300058. Ever since the very beginning, before Rudolf-san even knew her name.@k@|@y@v09/61300059. .........I''m sure she was quite intelligent herself.@k@v09/61300060. And cunning.@k@v09/61300061. ......I tried to use my intelligence to stick out, .........but she took the exact opposite approach."'
44043: 'Jessica@r@v04/60200260."......By her...stupidity......?"'
44044: 'Kyrie@r@v09/61300062."*giggle*...@k@v09/61300063. .........I mean she was good at triggering his protective instinct.@k@v09/61300064. Out of all the girls who came to flatter and flirt with him,@k@v09/61300065. ......only she stood out with every action she made, unlike the flashy girls Rudolf-san had tired of."'
44045: '@r......Even now, Kyrie recognized the mistake she had made in letting Asumu and Rudolf get too close.'
44046: '@rKyrie had thought that by taking the role of his business partner, she had succeeded in making him entirely hers.'
44047: '@r......She might have been a little conceited.'
44048: '@rAnd her arrogance in trying to eliminate the relationships the other girls had with Rudolf might also have contributed.'
44049: '@rPerhaps she sometimes tried too hard as a business partner,@k putting too much pressure on him, regardless of the fact that it was justified.'
44050: '@rBit by bit, Rudolf started to need a woman who could stay quiet and soothe him,@k ......without making him think about anything complicated.'
44051: '@r.........That woman was Asumu.'
44052: 'Kyrie@r@v09/61300066."I am ruthless and intellectual.@k@v09/61300067. Rational and economical.@k@v09/61300068. ......In a plank of Carneades situation, I would push the other person off without hesitation.@k@v09/61300069. ......I thought that was the kind of partner suitable for him."'
44053: '@rHowever, though that ruthlessness had made her reliable on the business side of things...'
44054: '@r......outside of business,@k it might have disturbed Rudolf deeply.'
44055: '@rAt some point, ......though Rudolf still acknowledged Kyrie''s skill, he began to yearn for a quiet, warm acceptance.'
44056: '@rAsumu filled that role completely.'
44057: '@rShe would never talk about anything complicated.@k@rEven if he did, she would just shake her head to say she didn''t know.'
44058: '@rHowever, she would care more for him physically than anyone else, quietly putting a blanket on him and staying by his side until morning...'
44059: 'Kyrie@r@v09/61300070."......Yes, I did get the position of his business partner.@k@v09/61300071. ......But before I knew it,@k@v09/61300072. ......Rudolf-san had grown a need for a mental partner, someone who could heal his heart.@k@v09/61300073. Foolishly enough, despite claiming to be the intellectual one, I never noticed."'
44060: 'Jessica@r@v04/60200261."............And then...@v04/60200262....Uncle Rudolf...@v04/60200263.married Aunt Asumu......?"'
44061: 'Kyrie@r@v09/61300074.".................................@k@v09/61300075. ...Yes, that''s right.@k@v09/61300076. She stole him away from me."'
44062: 'Jessica@r@v04/60200264."........................"'
44063: 'Kyrie@r@v09/61300077."He had slept with a lot of women.@k@v09/61300078. ......By that point, he wasn''t the kind of guy to let his emotions be captured by a woman just because he slept with her.@k@v09/61300079. After all, sleeping with women was just a game to him.@k@v09/61300080. .........That''s why I used something other than my body to attract his attention."'
44064: 'FEATHERINE@r@v50/65000283."......Conceit.@k@v50/65000284. A woman''s downfall..."'
44065: 'Ange@r@v11/62000429."Before long, they were both pregnant.@k@v11/62000430. ......Asumu-san told Dad about it right away, but Mom did the opposite."'
44066: 'FEATHERINE@r@v50/65000285.".........She must have been afraid that pregnancy would threaten her position as his business partner..."'
44067: 'Ange@r@v11/62000431."Apparently, Mom wasn''t eating much at the time and was often out of sorts.@k@v11/62000432. Because of that, it took a really long time before she realized she was pregnant."'
44068: 'FEATHERINE@r@v50/65000286."When did she notice...?"'
44069: 'Ange@r@v11/62000433."......It was after Asumu-san suddenly moved into Dad''s family register.@k@v11/62000434. ......Mom learned about her pregnancy after that and plotted several times to split Asumu-san and Dad apart, but..."'
44070: 'Kyrie@r@v09/61300081."Even though Asumu-san.........always appeared to be so absentminded,@k@v09/61300082. ...once she got her hands on Rudolf-san, she wouldn''t let go.@k@v09/61300083. ......''What do you want? Please stay out of our way'', she''d say.@k@v09/61300084. ......And this coming from that sissy little girl who''d curl up into a ball every time she got on a bus."'
44071: 'Kyrie@r@v09/61300085.".........At that point, I realized.@k@v09/61300086. ...She had been the truly cunning one.@k@v09/61300087. ......Yes, even her fear of vehicles was another lie to catch Rudolf-san''s sympathy.@k@v09/61300088. ..............."'
44072: 'Kyrie@r@v09/61300089.".....................My apologies.@k@v09/61300090. I must be boring you."'
44073: 'Jessica@r@v04/60200265."Oh, ......no........."'
44074: 'Kyrie@r@v09/61300091."At the very least,@k@v09/61300092. I wanted him to register himself as the father of my child.@k@v09/61300093. ......And it does seem as though Rudolf-san was prepared to do that.@k@v09/61300094. He made sure there was a hospital waiting for me, and even though Asumu-san was close to giving birth herself, he gallantly came to see me.@k@v09/61300095. .........Even though she was already his wife.@k@v09/61300096. What an awful man, really......"'
44075: '@rAfter that......is the tale I can''t bear even to tell.'
44076: '@rBoth Asumu and I......had the same delivery date.'
44077: '@rAnd yet, her pregnancy led to marriage, ......while mine was completely meaningless.'
44078: '@rI swore to bring up my child well, so that Rudolf-san would be proud to call himself its father.'
44079: '@rAsumu-san had won her battle against me.@k@r......However, I hadn''t yet lost the war.'
44080: '@rIf I could make my child excel far more than Asumu-san''s,@k if I could make my child the one that Rudolf-san most respected, I would be rewarded.@k .........That''s what I believed.'
44081: 'FEATHERINE@r@v50/65000287."However, ......Kyrie''s child was stillborn."'
44082: 'Ange@r@v11/62000435."Yeah.@k@v11/62000436. ......Asumu-san gave birth to Onii-chan.@k@v11/62000437. ......But Mom didn''t give birth to anyone.@k@v11/62000438. ......Even Mom''s final hope of being left a spot as Dad''s second wife...was destroyed......"'
44083: '@rKyrie had fallen from his partner to his second wife,@k ......and then, unable to give birth to the bond of a child, ......she tumbled down......to being merely his mistress.'
44084: '@rI can''t imagine...@w666....how much she must have hated Asumu and her child, ...Battler.'
44085: 'Ange@r@v11/62000439."......But despite that,@k@v11/62000440. ......Mom was able to act in a very friendly way towards Onii-chan.@k@v11/62000441. .........It was definitely a shock for me.@k@v11/62000442. To discover that my kind and gentle mother had held such negative emotions towards Onii-chan......and managed to hide them."'
44086: 'FEATHERINE@r@v50/65000288."........................@k@v50/65000289. ......She must have despised Battler."'
44087: 'Ange@r@v11/62000443."I don''t doubt it.@k@v11/62000444. ......If Asumu-san''s child had been stillborn and Mom had been the one to give birth to Onii-chan,@k@v11/62000445. ......history might have changed in some way.@k@v11/62000446. It seems she thought that if that had happened,@k@v11/62000447. she might have been able to make things play out in a way that Dad would divorce Asumu-san and marry her instead."'
44088: 'FEATHERINE@r@v50/65000290.".........Was that...also written in that book where she kept her thoughts?"'
44089: 'Ange@r@v11/62000448."Yeah.@k@v11/62000449. ......It truly was a collection of random thoughts, fantasies.@k@v11/62000450. .........Mom''s resentment, as she chewed on the corner of her tear-stained bed sheets."'
44090: 'Kyrie@r@v09/61300097."There''s just one thing I regret."'
44091: 'Jessica@r@v04/60200266.".........You mean...the pregnancy?"'
44092: 'Kyrie@r@v09/61300098."No, no.@k@|@y@v09/61300099. .........It''s my arrogance I regret.@k@v09/61300100. ".........Rudolf-san is already mine, so I''m completely safe.@k@v09/61300101. ......I''ll never lose to that Asumu girl.""'
44093: 'Kyrie@r@v09/61300102."......While she was screaming and shrieking on buses and planes, I was capable of properly managing the travel arrangements and expenditures.@k@v09/61300103. ......And so, I was overly confident......that I was the one Rudolf-san trusted the most."'
44094: 'Jessica@r@v04/60200267."........................"'
44095: 'Kyrie@r@v09/61300104."They say love needs to be nurtured, right?"'
44096: 'Jessica@r@v04/60200268."Y-......yeah."'
44097: 'Kyrie@r@v09/61300105."That''s not wrong.@k@v09/61300106. ......You both need to water that tree, care for it, and nurture it.@k@v09/61300107. ......And at the end, it will finally bear the fruit called love.@k@v09/61300108. Did you know?@k @v09/61300109.It isn''t over when it bears fruit.@k @v09/61300110.......You have to harvest that love, or it will never be realized."'
44098: 'Jessica@r@v04/60200269.".........Harvest......?"'
44099: 'Kyrie@r@v09/61300111."You need to think about that yourself, Jessica-chan.@k@v09/61300112. ......If you make the tree bear fruit without harvesting it, it can sometimes grow rotten.@k@v09/61300113. And bugs will often gather around it.@k@v09/61300114. In fact, ......sometimes thieves will come by and pluck it off the branch."'
44100: 'Jessica@r@v04/60200270."..........................."'
44101: 'Kyrie@r@v09/61300115."Young kids like you, Jessica-chan, think that love ends with nurturing.@k@v09/61300116. ......That''s naive.@k@v09/61300117. ......If you don''t harvest it, you will never be rewarded for your love."'
44102: 'Jessica@r@v04/60200271."Harvest......love......"'
44103: 'Kyrie@r@v09/61300118."At a glance, it may seem to be a matter just for the pair of lovers, but that isn''t true.@k@v09/61300119. Putting off the harvest because you assume you can do it at any time just gives the thieves a chance."'
44104: 'Kyrie@r@v09/61300120."......What if that fruit you''ve worked so hard to nurture gets pulled off the branch the next morning?@k @v09/61300121.......You''ll regret that you didn''t choose to harvest it the previous day instead of putting it off.@k@v09/61300122. ......That regret really hurts.@k@v09/61300123. ......It''ll make you crawl through hell."'
44105: 'Jessica@r@v04/60200272."........................"'
44106: 'Kyrie@r@v09/61300124."I was lucky.@k@v09/61300125. My hell ended after 18 years.@k@|@y@v09/61300126. ......So, I''ll never misjudge myself again.@k@v09/61300127. ......That man is mine.@k@v09/61300128. I won''t let him get away. I won''t let him out of my sight.@k@v09/61300129. And I''m grateful to my masters.........@k@v09/61300130.for giving me that chance.@k@v09/61300131. My "absolute, certain willpower" in not giving up on that man no matter what was answered with a "miracle"."'
44107: '@rBy now, Jessica was speechless......and didn''t even nod her head in understanding.'
44108: '@r......This true form of love that Kyrie was telling her about...@kwas far, far more harsh than anything she had imagined...'
44109: 'Kyrie@r@v09/61300132."Now,@k@v09/61300133. ......I will do anything to keep Rudolf-san by my side.@k@v09/61300134. And I will show no mercy to his enemies.@k@v09/61300135. ......If he wished it, I might not even hesitate to commit murder."'
44110: 'Kyrie@r@v09/61300136.".........Because I finally gained that determination, on the 18th year,@v09/61300137. .........that absolute willpower...@v09/61300138....brought about a miracle for me.@k@v09/61300139. .........You know, miracles only come to those who can make them come true themselves."'
44111: '@rAsumu''s death was no murder.'
44112: '@rHowever, Kyrie had often cursed her and hoped for her death,@k ......and finally, on the 18th year, she built up the determination to kill her with her own hands.'
44113: '@rAnd then, ......she actually......got herself a knife with which to do the deed.........'
44114: '@rThat was when the miracle occurred......'
44115: 'Jessica@r@v04/60200273."......Aunt Asumu passing away......was a miracle......?"'
44116: 'Kyrie@r@v09/61300140."Not really.@k@|@y@v09/61300141. ......That wasn''t even close to a miracle."'
44117: 'Jessica@r@v04/60200274."............Huh?"'
44118: 'Kyrie@r@v09/61300142."After all,@k@|@y@v09/61300143. ......if she hadn''t died, I would have killed her.@k@v09/61300144. ......In other words, she was fated to die no matter what.@k@v09/61300145. ......The miracle was that, even though she did die,@v09/61300146.@|@y I didn''t have to get my hands dirty.@k@v09/61300147. That''s all."'
44119: '@r......Until now, Kyrie had never shown Jessica...@w666.......no, she had never even shown Rudolf...that glint in the deepest depths of her eyes.'
44120: '@rIt told plainly and clearly...@kthat romance and love are not the sweet and fluffy candies that young girls imagine them to be.'
44121: '@rJessica was overwhelmed by that pressure......and stunned silent.@k@rAnd she had to acknowledge it.@k@rThis was.........the power of will that could make love be realized.'
44122: '@rThis was the level of willpower Kyrie showed in her support of Rudolf as his wife.'
44123: '@rAnd it was the same for George.'
44124: '@r......He already had the willpower to confront everything in the way of his love that transcended status,@k and he had proven that.'
44125: '@rNow, ......Jessica could clearly understand.'
44126: '@rThis was the magnitude of George''s determination,@k which had allowed him to coldly carry out his part of the demons'' trial...'
44127: '@rThen, ......what about her.........?'
44128: '@rDid she really have the resolve to make her love with Kanon bear fruit...@kand to go through with the task of harvesting it.........?'
44129: 'Kyrie@r@v09/61300148."*giggle*, I''m sorry.@k@v09/61300149. I only meant to give a little advice, but perhaps I scared you a little too much.@k @v09/61300150.......*giggle*giggle*.@k@v09/61300151. Blame the weather.@k@v09/61300152. I just wanted to pressure you a bit, but I''ve gone overboard."'
44130: '@rKyrie let a relaxed smile rise to her face.@k@rThe tense atmosphere finally slackened.'
44131: '@r......However, her words had been gouged into Jessica''s heart.'
44132: 'Kyrie@r@v09/61300153."I don''t know what your love has been like, Jessica-chan,@k@v09/61300154. .........but if you have a rival and neither is willing to back down, you can''t let yourself become complacent."'
44133: 'Kyrie@r@v09/61300155."......If you do, you''ll end up like me.@k@v09/61300156. ............Every woman should have one time in her life...@k@v09/61300157.when she would kill for the sake of love.@k@v09/61300158. ......I can tell you that all women in the world who call themselves mothers have been through that.@k@v09/61300159. After all..."'
44134: 'Kyrie@r@v09/61300160."Women who don''t do that are chewed to bits by the others and forced to crawl through the hell of envy and regret for the rest of their lives.@k@v09/61300161. .........My hell lasted 18 years.@k@v09/61300162. ......I was lucky to be pardoned after just 18.@k@v09/61300163. ......That hell is still filled with women......who will never get out until they die.@k@v09/61300164. ......Unless they execute themselves in their regret."'
44135: 'Jessica@r@v04/60200275."........................@k@v04/60200276. ......Wow, I......I have no words."'
44136: 'Kyrie@r@v09/61300165."*giggle*.@k@v09/61300166. ......I was trying to spur you on, but here I''ve gone and frightened you too much.@k@v09/61300167. ...I''m truly sorry.@k@|@y@v09/61300168. ......Love can be much more easygoing than that, okay?@k @v09/61300169.Love really is like playing with fire.@k@v09/61300170. Anyone can play easily and lightheartedly.@k@v09/61300171.......But when you mess up and get burned, that scar stays with you your whole life.@k @v09/61300172..........*giggle*giggle*giggle*."'
44137: '@rRegrets in love will never fade.'
