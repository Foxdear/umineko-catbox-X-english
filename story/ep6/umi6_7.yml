42874: '@rThey might end up together as a result, or they might not.'
42875: '@rBut whatever the outcome, she could accept it as long as she held nothing back.'
42876: '@rThat allowed her to stay true to her feelings, what she knew she felt right now, and act on them seriously.'
42877: '@rHowever, ......she couldn''t find the right words to tell Kanon this.'
42878: '@rWhen Kanon saw Jessica bite her lower lip in frustration,@w666. ............he finally realized...'
42879: 'Kanon@r@v16/60600197."......I''m such a fool."'
42880: 'Jessica@r@v04/60200147."Huh?"'
42881: 'Kanon@r@v16/60600198."What about me do you like?@k@v16/60600199. ......That very question is foolish.@k@|@y@v16/60600200. It''s proof that I''m not serious about myself, and that I haven''t been able to understand myself.@k@v16/60600201. ......It''s horrible of me to try and make you say it for me."'
42882: 'Jessica@r@v04/60200148."Th-that''s not true...!@k @v04/60200149.A-after all, it''s the first question any girl would like to ask after being given a love confession...!@k @v04/60200150.Th-the question "What part of me do you like?"..."'
42883: 'Kanon@r@v16/60600202."It was immature of me to ask you that.@k@v16/60600203. How could anyone like someone so immature?"'
42884: 'Jessica@r@v04/60200151."W-wait, that''s not..."'
42885: '@rJessica panicked, trying desperately to explain how she felt.'
42886: '@rHowever, Kanon was calm.@k And then, he spoke.'
42887: 'Kanon@r@v16/60600126."In that case,@k@v16/60600205. .........I want you to grow to love me...@v16/60600206....the way I already love you.@k@v16/60600207. ......I''ve decided to change myself so that can happen.@k@v16/60600208. I can''t possibly hope for you to love me the way I am.@k@v16/60600209. ......But someday............no matter what..."'
42888: 'Jessica@r@v04/60200152."......Yeah.@k@v04/60200153. I''m absolutely sure you''ll become a wonderful person, Kanon-kun.@k@v04/60200154. A guy so cool that I can''t keep my eyes off you.@k@v04/60200155. Until then, I''ll stick by you all the way.@k@v04/60200156. ......We have all the time in the world...!"'
42889: 'Kanon@r@v16/60600210."..............................@k@v16/60600211. ......Unfortunately, there isn''t that much time left."'
42890: 'Jessica@r@v04/60200157."......What about time?"'
42891: 'Kanon@r@v16/60600212."When I talk about furniture......it usually saddens you.@k@v16/60600213. ......But this is something I must talk to you about.@k@v16/60600214. And it is also something I must fight for with all my soul."'
42892: 'Jessica@r@v04/60200158."What are you talking about...?@k @v04/60200159.I don''t want to hear any more of that "I''m furniture so I can''t fall in love" talk.@k@v04/60200160. You''re a Human, not furniture...!"'
42893: 'Kanon@r@v16/60600215."I understand.@k@v16/60600216. That''s why I intend to become Human.@k@v16/60600217. But at the moment, I am furniture."'
42894: 'Jessica@r@v04/60200161."Just do it, then! Become Human...!"'
42895: 'Kanon@r@v16/60600218."The witch taught me once.@k@v16/60600219. ......The single element of this world.@k@v16/60600220. She said it was love.@k@v16/60600221. ......It''s something that Humans born into this world can take for granted."'
42896: 'Kanon@r@v16/60600222."......However, it is not something that those not from this world, who were born as furniture, can take for granted.@k@v16/60600223. .........In order to gain it for themselves, they must have magic or a miracle."'
42897: '@r......In the same way that Nee-san and George-sama...@k...would never have ended up as they have without borrowing the power of that golden butterfly brooch.'
42898: 'Ange@r@v11/62000281."I don''t really get this last part."'
42899: 'FEATHERINE@r@v50/65000220."......What is it that you do not understand?@k@v50/65000221. ......Let me hear it."'
42900: 'Ange@r@v11/62000282."Since this game began, ......a large portion of the time has been spent on Shannon and Kanon''s determination to fall in love.@k@v11/62000283. ......I have no problem with interpreting that as a story of growth and teenage determination for a girl and boy who call themselves furniture.@k@v11/62000284. However, one of the assumptions they make feels really out of place to me."'
42901: 'FEATHERINE@r@v50/65000222."...............''Why is magic necessary?''@k@v50/65000223. ......Is that it...?"'
42902: 'Ange@r@v11/62000285."Both Shannon and Kanon—no, I''ll purposefully refer to them as "furniture".@k@v11/62000286. ......The furniture has always claimed that there cannot be love between furniture and Humans.@k@v11/62000287. That''s where the magic of the golden butterfly brooch came into play—it was the miraculous result of that magic that love was established between Shannon and George onii-chan.@k@v11/62000288. That''s what they claim."'
42903: 'FEATHERINE@r@v50/65000224."Surely it would not be a stretch if they thought that forbidden love across class boundaries...@k@v50/65000225....could never bear fruit without a miracle of magic......?"'
42904: 'Ange@r@v11/62000289."Oh, I agree.@k@v11/62000290. Shannon and Kanon are both servants in love with members of the Ushiromiya family,@k@v11/62000291. so it makes perfect sense to me that they might disparage themselves as furniture while suffering from their forbidden love."'
42905: 'FEATHERINE@r@v50/65000226."......Then what is it that does not make sense to you...?"'
42906: 'Ange@r@v11/62000292."''Without the power of magic once more, marriage will be impossible''.@k@v11/62000293. ......Shannon and Kanon both seem to share that view.@k@v11/62000294. ......That''s the part that I just can''t understand."'
42907: '@rAfter meeting in secret for quite some time, George and Shannon had finally gotten engaged.'
42908: '@rBoth were fully prepared for it emotionally,@k and though there would be some trouble with the relatives, it had gotten to the point where it would probably be impossible for anyone to prevent their marriage.'
42909: 'FEATHERINE@r@v50/65000227.".........Trying to stand between two who wish to be wed is as foolish as standing in the path of an arrow in flight and trying to catch it."'
42910: 'Ange@r@v11/62000295."Exactly.@k@v11/62000296. George onii-chan has sworn to protect his partner for the rest of their lives and no longer fears opposition or disinheritance from his parents.@k@v11/62000297. ......On the contrary, he even considers them to be the perfect tests to demonstrate his love for her."'
42911: 'Ange@r@v11/62000298.".........In other words, they will be married no matter what.@k@v11/62000299. No one can stop them.@k@v11/62000300. And they have both consented to the engagement."'
42912: 'FEATHERINE@r@v50/65000228."No one can stop them or impede them.@k@v50/65000229. Trying to break apart lovers is a foolhardy venture..."'
42913: 'Ange@r@v11/62000301."Yeah.@k@v11/62000302. And that''s what''s strange.@k@v11/62000303. There''s no need for magic."'
42914: '@rIf George and Shannon...@k...had wanted Eva''s approval for their engagement...'
42915: '@r.........then magic really might have been necessary.'
42916: '@rAfter all, Eva had forbidden his relationship with her.'
42917: '@rNo matter how much George spoke on Shannon''s behalf, the chances of Eva being convinced were virtually zero.'
42918: '@rIf that were the case, it would be understandable if they wanted a magical miracle to make Eva acknowledge their engagement.'
42919: 'Ange@r@v11/62000304."But George onii-chan has already sworn to it.@k@v11/62000305. He doesn''t care whether his parents approve of the engagement or not.@k@|@y@v11/62000306. ......Yeah.@k@v11/62000307. There''s nothing standing in the way of their engagement.@k@v11/62000308. And Shannon should know that well herself.@k@v11/62000309. So why is it that now, on this night where the proposal went so smoothly, she''s still praying for a miracle of magic?"'
42920: 'FEATHERINE@r@v50/65000230."......Without such a miracle, she will not have the right to marry,@k@v50/65000231. is what the furniture claim..."'
42921: 'Ange@r@v11/62000310."And there you go.@k@v11/62000311. It means that Shannon has accepted George''s proposal,@k@v11/62000312. ......but she knows that there''s still some kind of obstacle remaining that can''t be overcome without a magical miracle.@k@v11/62000313. And that obstacle isn''t something that they can overcome by their own efforts.@k@v11/62000314. That''s why they need this miracle called magic."'
42922: 'Ange@r@v11/62000315."Why do they need magic?@k @v11/62000316.If two people love each other, what other miracle could they possibly need to be together?!"'
42923: 'FEATHERINE@r@v50/65000232."............Hmm, I see..."'
42924: '@rFEATHERINE listened to Ange''s interpretation, smiling in a satisfied way.'
42925: '@r......Apparently, she had already reached that conclusion and was enjoying watching Ange finally manage to do the same.'
42926: 'Ange@r@v11/62000317."And that same question applies to Kanon as well.@k@v11/62000318. ......The love between him and Jessica onee-chan has just begun, but their emotions are pure.@k@v11/62000319. There''s nothing standing in their way."'
42927: 'Ange@r@v11/62000320."They''re already in a loving relationship even without the golden butterfly brooch.@k@v11/62000321. ......It''d be no surprise if the relationship they''ve started lasts for years and eventually results in marriage.@k@v11/62000322. There''s nothing standing in their way either."'
42928: 'FEATHERINE@r@v50/65000233."......As long as they do not seek approval from Krauss and Natsuhi, it seems that they will not need a magical miracle either..."'
42929: 'Ange@r@v11/62000323."Exactly.@k@v11/62000324. ......Kanon watched how Shannon lived, and changed his own way of life.@k@v11/62000325. Then, he let his true feelings be known and started a relationship with Jessica onee-chan.@k@v11/62000326. ......There''s no need for magic anymore."'
42930: 'Ange@r@v11/62000327."......If it were a one-sided love, then he might need a love charm or something.@k@v11/62000328. But their feelings are already mutual.@k@v11/62000329. They''ve already communicated their intentions to one another.@k@v11/62000330. ......So why do they need a miracle on top of that?"'
42931: '@rBoth pieces of furniture are in relationships of mutual love.@k@rThere shouldn''t be any need for a miracle any longer.'
42932: '@rSo why...@w583....do they still desire a miracle of magic?'
42933: '@rAnd on top of that, the single brooch is portrayed as bestowing only a single miracle.'
42934: '@rIt feels almost as though Shannon is hesitating because, if she uses up that miracle for herself,@k Kanon''s chances at love will be automatically sealed away for eternity...'
42935: 'Ange@r@v11/62000331."So the question is this:@k@v11/62000332. ''Why is furniture not allowed to love?''"'
42936: 'FEATHERINE@r@v50/65000234."......So, you ask why love is not permitted without the miracle known as magic."'
42937: 'Ange@r@v11/62000333."And also,@k@v11/62000334. ......there''s that golden butterfly brooch that can allow the lamenting furniture to have the love they insisted they were incapable of.@k@v11/62000335. Just what on Earth is that?"'
42938: 'Elder BEATRICE@r@v60/60700351."Of course, it is a crystallization of magic.@k@v60/60700352. However, like most magics, it can be burnt by the anti-magic toxin."'
42939: 'BEATRICE@r@v27/60700353."......So, it can only have an effect for those who believe in magic and witches."'
42940: 'Elder BEATRICE@r@v60/60700354."Correct.@k@v60/60700355. So, Shannon, who was capable of interacting with me, was able to make use of its benefits.@k@v60/60700356. However, if Shannon had dropped it in a sandy beach and someone who knew nothing picked it up..."'
42941: 'BEATRICE@r@v27/60700357."......If that person was shrouded in the anti-magic toxin, they wouldn''t be able to make use of the brooch''s magic power..."'
42942: 'Elder BEATRICE@r@v60/60700358."Precisely.@k@v60/60700359. A witch''s magical items often lose their power if they are not handed over directly."'
42943: 'Elder BEATRICE@r@v60/60700360."However, in just the same way that a witch can manifest herself if her existence is acknowledged by a great many Humans and the anti-magic toxin disappears,@k@v60/60700361. the power of that magical item can also be preserved if it is believed in by a great many people."'
42944: 'BEATRICE@r@v27/60700362."That''s ironic.@k@v27/60700363. ......No matter what kind of magic we witches give out, everything depends on whether the Human we give it to can accept it."'
42945: 'Elder BEATRICE@r@v60/60700364."I have heard that the same goes for medicine.@k@v60/60700365. Even with the exact same medicine, Humans who know of the medicine''s effect experience it to a greater degree."'
42946: 'BEATRICE@r@v27/60700366."......Oh, I think I understand.@k@v27/60700367. When taking cold medicine, I''ve gotten the feeling that it''s more effective when you read the description on the bottle."'
42947: '@rAs she listened, Beato thought that magic sounded a bit like a charm.'
42948: '@rWhen most Humans think of magic,@k they think of incredible miracles being performed one after another in front of a crowd.'
42949: '@rHowever, this true magic that the older sister spoke of sounded almost like a charm,@k something that had no effect if the person using it didn''t believe.'
42950: '@r......Shannon''s heart was captured by George bit by bit as he grew by leaps and bounds.'
42951: '@rHowever, she had given up, thinking that one of lower status such as herself would never find love with him.'
42952: '@rThat was when BEATRICE had given her the golden butterfly brooch and encouraged her.'
42953: '@rGiving up means that you have zero chance of success.'
42954: '@rBut if, with the power of magic, you think there just might be some chance of your wish coming true,@k the probability then rises to something greater than zero at the very least.'
42955: '@rZero remains zero forever, but if even a faint probability were to exist,@k ......it would be no exaggeration to say that an impossible miracle had occurred, compared to the time when the probability was zero.'
42956: '@rHumans can use magic to take "resignation", by which they themselves make the probability of success zero, and cancel it out.'
42957: '@rWhen a Human does not give up, though their chances of success may be small, those chances do exist.'
42958: '@rAnd the stronger their belief, the more those odds rise.'
42959: '@rIt was easy to imagine that Shannon had made earnest wishes upon the brooch, believed in its effect,@k ......and made many little efforts to get George to like her.'
42960: 'BEATRICE@r@v27/60700368."The power of belief becomes magic......"'
42961: 'Elder BEATRICE@r@v60/60700369."And those who make others believe are witches."'
42962: '@rThose who make others believe...@w500....are witches.'
42963: '@r......That''s an interesting way to put it.@k If you think about it, it''s true.'
42964: '@rLet''s say a witch steps out into a spotlight, waves her staff in front of a crowd of onlookers,@k and makes a rabbit appear out of thin air.'
42965: '@rThe many people who see it will surely think that it was a sleight of hand.'
42966: '@rThey might wonder at how it was accomplished, but they would be sure that it wasn''t magic,@k and they would applaud the splendid trick that had appeared to be magic.'
42967: '@rBut what if...'
42968: '@rWhat if they conducted a sacred ceremony inside a great ancient temple in front of a crowd of believers...@kculminating in the exact same thing?'
42969: '@r......Would any of the people there think that was a sleight of hand?'
42970: '@rIn fact, in the ancient past, when magic tricks as a form of entertainment didn''t even exist and divine spirits were worshipped,@k this would doubtlessly have been a miracle of magic...'
42971: 'BEATRICE@r@v27/60700370."I-in that case,@k@v27/60700371. ......would this...@v27/60700372....count as magic?"'
42972: 'Elder BEATRICE@r@v60/60700373."Oh?@k@v60/60700374. Will the witch who cannot use magic now perform it for the first time?"'
42973: 'BEATRICE@r@v27/60700375."H-......here I have an empty tea cup.@k@v27/60700376. There is nothing inside it."'
42974: 'Elder BEATRICE@r@v60/60700377."Mhm, it is empty.@k@|@y@v60/60700378. *giggle*, go on."'
42975: 'BEATRICE@r@v27/60700379."I will take this cup,@v27/60700380. ......turn it like this,@v27/60700381. ......and place it upside down on the table."'
42976: 'Elder BEATRICE@r@v60/60700382."Heheheheheheh.@k@v60/60700383. And then? What next?"'
42977: 'BEATRICE@r@v27/60700384."Umm,@v27/60700385. ......le-let''s both close our eyes and chant the incantation."'
42978: '@rIt was......the same magic that had been used to give Maria candies.'
42979: '@rBeato the Elder grinned and closed her eyes.'
42980: '@rWhen she saw this, ......Beato slowly chanted the incantation.'
42981: 'BEATRICE@r@v27/60700386."C-come, try to remember.@k@v27/60700387. ......What was inside the cup?"'
42982: 'Elder BEATRICE@r@v60/60700388."Hmm.@k@v60/60700389. Come, try to remember.@k@v60/60700390. What was inside the cup?"'
42983: '@rAs she chanted,@k Beato slowly opened her eyes and made sure that the older sister was repeating her with her eyes closed.'
42984: '@rThen, a single gold butterfly appeared out of nowhere,@k ......fluttered down onto the overturned cup, and scattered away in a spray of gold.'
42985: 'Elder BEATRICE@r@v60/60700391."May I open my eyes now?"'
42986: 'BEATRICE@r@v27/60700392.".........Y-yes.@k@v27/60700393. Please open your eyes and inspect the contents of the cup."'
42987: 'Elder BEATRICE@r@v60/60700394."Well now.@k@v60/60700395. ......Let us see how well your first bit of magic has worked."'
42988: '@rTaking her time and dragging out the suspense a little, the older sister......lifted up the cup.'
42989: 'Elder BEATRICE@r@v60/60700396.".........Aha."'
42990: 'BEATRICE@r@v27/60700397."H-how is it......?"'
42991: '@rWhen the cup was lifted up,@k .........there lay......a single golden rose petal.'
42992: 'BEATRICE@r@v27/60700398."D-...does this count as...magic......?"'
42993: 'Elder BEATRICE@r@v60/60700399."*cackle*cackle*cackle*......@k@v60/60700400. Yes, it most certainly does.@k @|@y@v60/60700401.@c960.@[You used magic to create a golden flower petal inside an overturned cup.@k@v60/60700402.@|@y It was a splendid bit of magic.@]@c."'
42994: 'Ange@r@v11/62000336."''Without love, it cannot be ''seen''''.@k@v11/62000337. That much I understand."'
42995: 'FEATHERINE@r@v50/65000235."It may be viewed as a trick.@k@v50/65000236. It may also be believed to be magic.@k@v50/65000237. ......It all depends upon the toxin of the individual..."'
42996: 'Ange@r@v11/62000338."Then again, ......while this can explain some of the magic that''s been used in the past, it can''t explain everything."'
42997: 'Ange@r@v11/62000339."To get back to the point, none of this stuff about believing in magic and charms can answer the question:@k@v11/62000340. "What is the golden butterfly brooch that can allow the lamenting furniture to have the love they insisted they were incapable of?"@k@v11/62000341. It''s not enough for an answer."'
42998: 'FEATHERINE@r@v50/65000238."......To take what we heard from the two Beatos at face value,@k@v50/65000239. ......would it not make sense to consider that magic has the power to cancel out the furniture''s "resignation"?"'
42999: 'Ange@r@v11/62000342."''Why mustn''t furniture fall in love?''@k@v11/62000343. "Why is the power of the magic brooch necessary?"@k@v11/62000344. ......Yes, it does seem at a glance as though what you and the Beatos are saying provides an answer, though a vague one.@k@v11/62000345. However, let me say this as a Reader.@k@v11/62000346. ......I can''t accept this as you''ve presented it."'
43000: 'FEATHERINE@r@v50/65000240."You cannot accept it, you say...?"'
43001: 'Ange@r@v11/62000347."......The fate that those pieces of furniture were fighting to overturn was something much more immense than this would allow for.@k@v11/62000348. I doubt they could reform their way of thinking just because they were given a charm for making relationships."'
43002: 'Ange@r@v11/62000349."It''s true that the brooch gave Shannon the chance she needed to get together with George onii-chan,@k@v11/62000350. but after that, she said she wanted to deepen their relationship without borrowing the power of magic, and she even tried to give the brooch back to Beato.@k@v11/62000351. She put the miracle of magic behind her at that point.@k@v11/62000352. ......In that case, why is she once again in need of its power?"'
43003: 'FEATHERINE@r@v50/65000241."Well now.@k@v50/65000242. ......Perhaps there is no way to say it except that love and marriage are very different things."'
43004: '@rFEATHERINE laughed lightly.'
43005: '@r......She had probably formed a theory of her own and was laughing at Ange, who hadn''t reached it yet.'
43006: 'Ange@r@v11/62000353."Let me hear it.@k@v11/62000354. What''s your view?"'
43007: 'FEATHERINE@r@v50/65000243."I''d like to keep that to myself for just a while longer.@k@v50/65000244. ......And of course, watching you form doubts and let your mind race is one of the joys of being read aloud to.@k@v50/65000245. If I gave you my views, you would accept them and stop thinking.@k@v50/65000246. Then, having you read aloud would be no fun."'
43008: 'Ange@r@v11/62000355.".........So, you''re having me read a mystery novel you already know the answer to, just so you can enjoy watching me blunder about."'
43009: 'FEATHERINE@r@v50/65000247."Well, I am the Witch of Theatergoing.@k@v50/65000248. ......If you wish to laugh at my bad taste, please do not hold back, my miko."'
43010: 'Ange@r@v11/62000356."''Wa-ha-ha-ha.''"'
43011: 'FEATHERINE@r@v50/65000249."Pft, ......*giggle*giggle*, hahahahahahaha..."'
43012: '@rI understand that a part of magic is created by a believing heart.'
43013: '@rAnd that magic probably permeates deep into the world of us Humans as well.'
43014: '@rHowever, though it does permeate so far, the power that dwells within magic is small.'
43015: '@rVisiting a shrine before an important exam to pray that you''ll pass is something that many people do.'
43016: '@rHowever, not many people will actually credit that visit as the reason for their success.'
43017: '@rPraying like this contains no power except as a calming influence.'
43018: '@rIn love, where even a small chance and a little bit of courage can cause a major change,@k this power might cause a massive upheaval...'
43019: '@rHowever, .........would the insurmountable fate that those pieces of furniture claim to be in the middle of...@kreally change because of something like that......?'
43020: '@rI think that in the past, the magical power of the brooch as it joined Shannon and George was little more than a good-luck charm.'
43021: '@rHowever, at this point,@k the magical power that the pieces of furniture are seeking from the brooch, praying for their love to succeed...'
43022: '@r......It''s not something as vague as a charm.'
43023: '@rIt feels much stronger, like a whole different interpretation of magic.'
43024: '@rIf you believe in a sleight of hand, it becomes magic.'
43025: '@r......But that''s no more than a child''s trick.@k@rAnd that only explains one part of magic.'
43026: '@rThey...are hoping for something.'
43027: '@rThey''re hoping for something with much, much more power...@w583....for true magic, not a sleight of hand.'
43028: 'Ange@r@v11/62000357."......So then, just what kind of magic...@v11/62000358.......are the pieces of furniture expecting from that brooch......?"'
43029: 'Jessica@r@v04/60200162.".........A golden butterfly...brooch...?"'
43030: 'Kanon@r@v16/60600224."The Golden Witch BEATRICE...@k@v16/60600225.......gave a magic charm to Shannon in exchange for smashing a mirror—a charm that makes love succeed.@k@v16/60600226. ......That''s what this is."'
43031: '@rFrom his pocket, ......@w333.@|@yKanon pulled a wing of a gold butterfly.'
43032: '@rThough it was just a single wing, it was easy to tell from its distinctive shape that it had originally been part of something with a butterfly motif.'
43033: 'Kanon@r@v16/60600227."The magic of this brooch gave Shannon the chance she needed to start her relationship with George-sama.@k@v16/60600228. ......However, before that magic was fully realized, she left it to me.@k@v16/60600229. ......So, thanks to the power of this brooch,@v16/60600230. .........I gained your affection, Milady."'
43034: 'Jessica@r@v04/60200163."That''s not true...@k@v04/60200164. I started liking you because of my own honest feelings..."'
43035: 'Kanon@r@v16/60600231."......Thank you very much.@k@v16/60600232. ...You are Human, so you do not believe in witches or magic.@k@v16/60600233. It''s only natural.@k@|@y@v16/60600234. ......However, as furniture created by magic, my very existence here...@k@v16/60600235....is proof that the miracle of magic exists."'
43036: 'Jessica@r@v04/60200165."S-sorry,@k@v04/60200166. what are you talking about...?"'
43037: '@rJessica tried her hardest to grasp what Kanon was trying to say.'
43038: '@rHowever, she couldn''t understand it, and had to ask him to repeat it with a bitter smile...'
43039: 'Kanon@r@v16/60600236."...........................@k@v16/60600237. ......Both Shannon and I...@k@v16/60600238....need magic to succeed in love.@k@v16/60600239. The key for that is this brooch.@k@v16/60600240. ......I stepped on it and crushed it, so we each have one part."'
43040: '@rThe brooch had lost its power when it was split in half.@k@rHowever, if it was ever joined together again, ......its magic would be revived.'
43041: '@rIt would revive the miraculous power that could join furniture and a Human together...'
43042: 'Kanon@r@v16/60600241."However, a single brooch can only grant one person''s wish.@k@v16/60600242. ......Only one of us furniture can be joined by this single brooch."'
43043: '@rIt was the single spark of love that the old BEATRICE with her shrill laugh had sown on a day long ago.'
43044: '@rThat BEATRICE had likened humans who were tormented by this spark to ripe fruit and taken evil pleasure in their suffering.'
43045: '@rHowever, the magic infused within this spark...was real.'
43046: '@rIt was the only crystallization of magic that the Golden Witch BEATRICE ever left in this world......'
43047: '@rIts shine......grew brighter.'
43048: 'Jessica@r@v04/60200167."Huh? ......Wh-...what the...?!"'
43049: 'Kanon@r@v16/60600243."It''s okay.@k@v16/60600244. ......But please don''t look right at it.@k@v16/60600245. It''ll blind you."'
43050: 'Jessica@r@v04/60200168."Gh, .........ghhh.........!"'
43051: '@rIt grew more brilliant still, shining like the sun.'
43052: '@rJessica didn''t need Kanon to tell her to put her hands over her eyes......'
43053: '@rAs the light grew stronger, ......a sound like the roaring of the wind or the tide also grew in intensity.'
43054: '@rIt already drowned out the sound of the wind and rain outside...'
43055: '@rJessica could no longer even stand, and she crouched on the floor......'
43056: '@rIt was a flood of sound and light...@k And until it withdrew, Jessica could do nothing but moan......'