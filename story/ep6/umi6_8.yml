43387: 'BEATRICE@r@v27/60700536."C-......couldn''t you explain it for her?@k@v27/60700537. ...I don''t understand that well myself.@k@v27/60700538. Is there some kind of problem with the love between Jessica-san and Kanon-san...?"'
