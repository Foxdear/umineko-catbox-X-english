43316: 'Jessica@r@v04/60200177."...............A trial......?"'
43317: 'Shannon@r@v15/60500250."Kanon-kun.@k@v15/60500251. The brooch."'
43318: 'Kanon@r@v16/60600254."Yeah......"'
43319: '@rThe two of them brought the halves of the broken golden butterfly brooch closer to each other.'
