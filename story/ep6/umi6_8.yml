43326: '@rIt was such an embarrassing line that Jessica couldn''t help turning red,@k ......but the expression on George''s face, which was so serious that it was almost grim, forced her to tense up as well...'
43327: '@rShannon and Kanon were just as serious.'
43328: '@r......With a glow in their eyes, as though they were taking part in a sacred duel, the pair of them brought the two gold butterfly wings together.'
