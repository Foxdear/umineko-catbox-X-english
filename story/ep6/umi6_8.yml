43302: '@rIn the same way that it both looked like chess and not like chess...'
43303: '@r...the furnishings of this room—no, the room as a whole—looked at first glance like a Western tea room...@k...but also felt like something completely different...'
43304: 'Jessica@r@v04/60200169.".........J-@v04/60200170....just where...@v04/60200171.is this place......?"'
