43408: 'Zepar@r@v51/65100033."Yes, we''re messengers from the "you" of the future!@k @v51/65100034.Please, at this very moment, take your love seriously and fight!"'
43409: 'Furfur@r@v52/65200030."And if you don''t listen to the message of the "you" from the future?!"'
43410: 'Zepar@r@v51/65100035."The foolish snake eating its own tail will keep on gulping!"'
43411: 'Elder BEATRICE@r@v60/60700549."The endless cycle of suffering will swallow itself......and simply vanish."'
43412: 'Jessica@r@v04/60200200."What the......hell are you talking about...?!!"'
43413: '@rJessica''s confusion showed up on her face as anger.'
43414: '@r......However, a memory of something she had heard a long time ago surfaced in the back of her mind.'
43415: '@r......Unlike Nee-san, I don''t plan on working here for many years...'
43416: '@rAfter just a few years, ......or possibly...'
43417: '@r......If Nee-san ever decides to stop working here, ......I think I''ll stop working too.........'
43418: 'Jessica@r@v04/60200201."Kanon......kun......"'
43419: 'Kanon@r@v16/60600261."........................"'
43420: 'Elder BEATRICE@r@v60/60700550."If you give up on the miracle of magic and leave it to Shannon and George,@k@v60/60700551. ......they will be joined and leave the island.@k@|@y@v60/60700552. ......After that, Kanon will leave the island as well.@k@v60/60700553. That is an unavoidable fate."'
43421: 'BEATRICE@r@v27/60700554."Th-......then what if they can obtain the miracle of magic...?"'
43422: 'Elder BEATRICE@r@v60/60700555."Of course, Kanon will remain on the island, by Jessica''s side for all time.@k@v60/60700556. ......He will probably be able to start learning music with Jessica as she wished for.@k@|@y@v60/60700557. ......How their relationship will progress afterwards is a matter for the two lovers.@k@v60/60700558. They may deepen their relationship slowly all by themselves, as Jessica wanted..."'
43423: 'Shannon@r@v15/60500257."......However,@k@v15/60500258. ...if that happens, George-san and I will not be joined."'
43424: 'Kanon@r@v16/60600262.".........For the sake of our own happiness and futures,@k@v16/60600263. ......we are fated to fight."'
43425: 'Jessica@r@v04/60200202."A-......are you kidding me...?!@k @v04/60200203.What the hell...?!@k @v04/60200204.So if we are joined, the other pair will split apart?!@k @v04/60200205.What kind of demon''s game is this?!!"'
43426: 'Elder BEATRICE@r@v60/60700559."Don''t be mistaken.@k@v60/60700560. You will not be taking something from each other.@k@v60/60700561. ......Without the power of the golden butterfly brooch, neither love is fated to bear fruit."'
43427: 'Jessica@r@v04/60200206."A-and who the hell decided that?!!"@|@y'
43428: 'Elder BEATRICE@r@v60/60700562."It is due to your sin of falling in love with furniture, which is not allowed to love.@k@|@y@v60/60700563. ......Didn''t Kanon clearly reject you, saying that furniture was not qualified to love?!@k @v60/60700564.Knowing that, you chose Kanon as the one you loved.@k@v60/60700565. I won''t let you get away with saying you didn''t know...!"'
43429: 'Jessica@r@v04/60200207."...............!"'
43430: '@rThough she couldn''t accept any of it, Jessica was unable to argue back.'
43431: '@rThen, George spoke up with that soft tone that he always used to smooth things over.'
43432: '@r......However, his expression was still ruthlessly serious.'
43433: 'George@r@v07/60300226."......Jessica-chan,@k@v07/60300227. can''t you think of it this way?"'
43434: 'Jessica@r@v04/60200208."Think of it......what way...?"'
43435: 'George@r@v07/60300228."I love Shannon.@k@v07/60300229. I am prepared to overcome any and all trials and obstacles that stand in the way of us being together.@k@v07/60300230. .........What about you?"'
43436: 'Jessica@r@v04/60200209."W-well, yeah, ......one or two setbacks aren''t gonna stop me, I''m tougher than that..."'
43437: 'George@r@v07/60300231."Yes.@k@v07/60300232. That''s what this is about.@k@v07/60300233. ......Right now, we are being tested.@k@v07/60300234. Tested to see who can display the strength of our feelings more strongly."'
43438: 'Jessica@r@v04/60200210.".........Are you actually......satisfied with this insanity...?"'
43439: 'George@r@v07/60300235."There''s no need to be satisfied.@k@v07/60300236. ......When I gave Shannon that engagement ring, I swore to fight all trials and barriers that stand in my way.@k@|@y@v07/60300237. ......No matter how unreasonable or incomprehensible those trials might be,@k@v07/60300238. ......backing down is not an option."'
43440: '@rGeorge spoke clearly, ......then looked at Jessica with a cold gaze.'
43441: '@r......By now, Jessica almost understood.'
43442: '@rIf she kept on grumbling and refusing this demons'' trial,@k ......the game between the two groups would automatically end with her defeat by default.'
43443: '@rIn other words, George and Shannon would win.'
43444: '@rThen they would gain the miracle of magic, their love would be completed,@k .........and Jessica and Kanon would split apart,@k ......with Kanon eventually leaving the island and never seeing her again.'
43445: 'George@r@v07/60300239."......Personally,@k@v07/60300240. ......nothing would make me happier than you backing out of this trial.@k@v07/60300241. ......That way, I wouldn''t have to fight you.@k@|@y@v07/60300242. And it would reveal just how little you actually feel for Kanon-kun."'
43446: 'Jessica@r@v04/60200211."Nn...............gah............"'
43447: '@rIt seemed as though George spoke ruthlessly, ......but he was actually being exceptionally fair.'
43448: '@rIf it came to a loss by default, Jessica would never be able to clear away her lingering regrets.'
43449: '@rThat would leave a bad aftertaste even for George.'
43450: 'George@r@v07/60300243."......We must fight fair and square for that single miracle.@k@|@y@v07/60300244. ......Even if I lose at the end,@k@v07/60300245. ......I''ll be able to accept it if we both gave it our all.@k@v07/60300246. And because of that, I will be able to cheer on the victors from the bottom of my heart."'
43451: 'Elder BEATRICE@r@v60/60700566."............Hmph.@k@v60/60700567. ...George''s determination is quite impressive."'
