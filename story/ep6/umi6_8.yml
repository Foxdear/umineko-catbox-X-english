43399: 'Furfur@r@v52/65200025."Yes, and then you will mourn and hate!"'
43400: 'Zepar@r@v51/65100030."Hate who?!"'
43401: 'Furfur@r@v52/65200026."You!!"'
43402: 'Zepar@r@v51/65100031."Me?!"'
43403: '@r@v00/awase6009.""No, the "you" of this moment!!""'
43404: '@rWith a dramatic gesture, the two of them pointed at Jessica.'
43405: '@r......They were saying that, if she passed this by, it would be herself who would regret it later.'
43406: 'Jessica@r@v04/60200197."Wh-@v04/60200198.......what the hell are you...@v04/60200199....saying......"'
