43321: 'George@r@v07/60300220."......Jessica-chan, I want you to brace yourself for this.@k@v07/60300221. I am already mentally prepared."'
43322: 'Jessica@r@v04/60200178."Wh-what are you talking about...?!@k @v04/60200179.I don''t have a clue!@k @v04/60200180.What the hell''s going on...?!"'
