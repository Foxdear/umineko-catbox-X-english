43368: 'Furfur@r@v52/65200019."So, this is truly the final miracle!"'
43369: 'Zepar@r@v51/65100020."Once is enough for the miracle of love!@k @v51/65100021.After all, eternal love will never be needed a second time!"'
43370: 'Elder BEATRICE@r@v60/60700527."......There you have it.@k@v60/60700528. Lovers male and female!@k @|@y@v60/60700529.Gathered here are those cursed, absent a miracle, to unsuccessful love.@k@v60/60700530. The power of the golden butterfly brooch, which can grant such a miracle, is your last chance, and like it or not, this chance is limited to this evening!@k @v60/60700531.This miracle can be given only to a single pair!"'
43371: 'Shannon@r@v15/60500253."..........................."'
43372: 'Kanon@r@v16/60600256."......I won''t lose."'
43373: 'Shannon@r@v15/60500254."Yeah.@k@v15/60500255. ......Let''s both give it our all."'
43374: '@rShannon and Kanon exchanged a serious gaze.'
43375: '@r......Both had already readied themselves to fight for the sake of their love''s success.'
43376: 'Jessica@r@v04/60200183."I, I don''t really get it,@k @v04/60200184....but I don''t wanna borrow the power of some strange demon...!"'
43377: '@rJessica was finally starting to figure out the direction things were headed.'
43378: '@rThese demons......were probably planning to pit her and Kanon against George and Shannon.'
43379: 'Jessica@r@v04/60200185."Let me be totally clear: we don''t need your help!@k @v04/60200186.Kanon-kun and I can handle our relationship by ourselves.@k@v04/60200187. I''m not gonna be pressured into turning to some shady demons for help!"'
43380: 'Kanon@r@v16/60600257."............Milady, please listen.@k@v16/60600258. ...If we don''t overcome this trial,@v16/60600259. ......we cannot be together..."'
43381: 'Elder BEATRICE@r@v60/60700532."Jessica. Accept it.@k@|@y@v60/60700533. This is the only trial that can be imposed on upstart furniture wishing to be joined with a Human."'
