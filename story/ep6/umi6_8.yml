43459: '@rJessica was surprised to realize just how strong the determination was that dwelt within her usually weak and clumsy friend.'
43460: 'Jessica@r@v04/60200213."Kanon-kun........."'
43461: 'Kanon@r@v16/60600264."I......want to start a new life with you, Milady.@k@|@y@v16/60600265. ......Even if that life...@v16/60600266.......means crushing Nee-san''s happiness...@v16/60600267.......I will not falter now..."'
43462: '@rKanon was also doing all he could to be strong.'
43463: '@rYes.'
43464: '@rAll of them...@w500....were being serious and frank...@w583.and abandoning any naivety they might have possessed.'
43465: '@rAll this about golden butterfly brooches and miracles of magic...@k@r...and the trial that the demons were giving them—@knone of it mattered.'
43466: '@rOnly one thing was being tested:@k@rwhether or not they possessed the strong will to make their love come true.'
43467: '@rJessica clenched her fists, ......and hung her head, shaking, while biting her lower lip.'
43468: '@rShe was silent, but she would probably gain an unswerving will of steel before too long.'
