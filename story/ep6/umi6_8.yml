43360: 'BEATRICE@r@v27/60700522."Uh, ......ah, ...well, I wonder..."'
43361: '@rZepar and Furfur latched onto Beato from either side, wearing strange smiles.'
43362: '@rEach movement they made was exaggerated yet polished,@k as though they were acting out a play.'
43363: 'Elder BEATRICE@r@v60/60700523."Leave it at that for now, demons of the contract.@k@|@y@v60/60700524. To think that tonight will be the last time we see that mischievous spirit.@k@v60/60700525. It will be dearly missed."'
