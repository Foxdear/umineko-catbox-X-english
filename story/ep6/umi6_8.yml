43482: 'Zepar@r@v51/65100038."We will not make light of your wish!"'
43483: 'Elder BEATRICE@r@v60/60700578."......Even your relationship with Battler will eventually fester and rot.@k@|@y@v60/60700579. ......Even you, with your optimistic attitude,@k@v60/60700580. ......must understand that this fate will eventually come to pass, barring some kind of miracle."'
43484: 'BEATRICE@r@v27/60700581."...............Well........."'
43485: '@rBeato hung her head sadly.'
43486: '@rShe wasn''t about to let the cookie incident break her spirit.'
43487: '@r......However, it would have been a massive lie to say that it hadn''t hurt her...'
43488: '@rThe more she tried to get close to Battler, the more she hurt him.'
43489: '@rHowever, she had been born in order to get close to Battler.'
43490: '@r...She was like a hedgehog freezing in the cold and bunching together with others for warmth.@k@rShe had approached him because of love, and had been hurt for it......'
43491: 'Elder BEATRICE@r@v60/60700582."If you understand that much, entrusting your fate to a miracle may prove to be of some interest.@k@|@y@v60/60700583. As they say, an unbought lottery ticket earns you nothing.@k@|@y@v60/60700584. Zepar, Furfur!@k @v60/60700585.Let my little sister join in too."'
43492: 'Zepar@r@v51/65100039."Oh, of course!"'
43493: 'Furfur@r@v52/65200034."Welcome, second BEATRICE...!@k @v52/65200035.We were planning on including you from the very beginning!"'
43494: '@r@v00/awase6010_o.""After all, we are Zepar and Furfur!@k @v00/awase6011.The demons of love!!""'
43495: 'BEATRICE@r@v27/60700586."......I-......is it alright if I......join in......?"'
43496: 'George@r@v07/60300247."If you want to, I don''t see a problem.@k@v07/60300248. I won''t prevent anyone from entering.@k@v07/60300249. We''ll win against all hindrances and make everyone celebrate our union.@k@|@y@v07/60300250. ......Of course, it''s the same the other way around.@k@v07/60300251. If you succeed in love by defeating us at our best,@k@v07/60300252. then both Shannon and I promise to sincerely support the pair that wins.@k@v07/60300253. Right, Shannon?"'
43497: 'Shannon@r@v15/60500264."Yes.@k@v15/60500265. We will not lose.@k@|@y@v15/60500266. And even if we did, we would cheer you on from the bottom of our hearts."'
43498: 'Kanon@r@v16/60600268."......I feel the same.@k@v16/60600269. I will not lose."'
43499: 'Jessica@r@v04/60200214.".........Well, if there''s no way out of this fight,@k@v04/60200215. ......let''s show ''em what we''ve got.@k@v04/60200216. ......Neither I nor Kanon-kun...@k @v04/60200217....have any intention of losing without a fight!"'
43500: 'Elder BEATRICE@r@v60/60700587."You feel the same, I assume?"'
43501: 'BEATRICE@r@v27/60700588."Y-......yes...@k@|@y@v27/60700589. ......If there is even a small chance that Father—@v27/60700590.ah...@v27/60700591.no...@v27/60700592.......that Battler-san will acknowledge me,@k@v27/60700593. I''m willing to put myself on the line."'
43502: 'Elder BEATRICE@r@v60/60700594."Well said.@k@v60/60700595. Good going, little sister.@k@|@y@v60/60700584. Zepar, Furfur!@k @v60/60700597.The actors have gathered!"'
43503: 'Zepar@r@v51/65100042."Then let''s begin, Furfur!"'
43504: 'Furfur@r@v52/65200038."Yes, let us begin, Zepar!"'
43505: '@r@v00/awase6012_o.""Let''s begin this trial of lovers, the fight over a single miracle of magic...!!""'