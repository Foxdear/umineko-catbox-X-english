43355: '@rUnlike Jessica, George had maintained his composure even during this bizarre scene.'
43356: '@r......After all, Shannon had already told him what would happen next.'
43357: 'Elder BEATRICE@r@v60/60700519."Demons of the contract, it has been too long...!@k @v60/60700520.Zepar.@|@y@k@v60/60700521. And you too, Furfur."'
