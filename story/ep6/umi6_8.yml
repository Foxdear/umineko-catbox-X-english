43456: 'Jessica@r@v04/60200212.".........And Shannon......?"'
43457: 'Shannon@r@v15/60500259."......Please forgive me, Milady.@k@v15/60500260. ......For the sake of being joined with George-san, I am determined not to flinch in my resolve.@k@|@y@v15/60500261. .........Even if I know...@v15/60500262....that staying true to my heart...@v15/60500263....will mean the end of your loving relationship."'
