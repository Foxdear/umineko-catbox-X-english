43476: '@rShe had thought this had been about two pairs of lovers.'
43477: '@rBeato was surprised to suddenly hear that this had something to do with her as well...'
43478: 'Elder BEATRICE@r@v60/60700572."With the miracle of the golden butterfly brooch,@v60/60700573. .........even your wish,@k@v60/60700574. ......that your affection for Battler will be acknowledged, can be granted easily.@k@v60/60700575. ......And without that miracle, you two will also...@v60/60700576.............never be bound."'
