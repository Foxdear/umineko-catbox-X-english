43310: 'Shannon@r@v15/60500246."Milady, George-san, first of all, please allow us to apologize.@k@v15/60500247. And please stay calm.@k@|@y@v15/60500248. ......Something strange is about to happen.@k@v15/60500249. That strange thing will probably test us."'
43311: 'George@r@v07/60300212."Test us......?@k @v07/60300213....Do you mean...@k@v07/60300214.that trial you were just talking about...@v07/60300215....that we have to overcome if we want to be together?@v07/60300216. ......Is that it?"'
