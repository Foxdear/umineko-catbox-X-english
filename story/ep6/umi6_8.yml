43241: 'Battler@r@v10/60100326."......I know.@k@v10/60100327. ......Even though that Beato is you without a doubt, ......she''s a different being than the former you...@k@v10/60100328.......and I can say with certainty......that you will never revive again..."'
43242: 'BEATRICE@r@v27/60700473."My soul, femininity, sparkling personality, and splendid character were cultivated in a thousand years spent as a witch.@k@v27/60700474. Unless an exactly identical thousand years is traversed, it is impossible to become me.@k@v27/60700475. In short, ......from the very moment you decide to create me, my personal history will be different."'
43243: 'Battler@r@v10/60100329."Yeah.@k@v10/60100330. ............That damn BERNKASTEL has already guaranteed that you''ll never revive..."'
43244: 'BEATRICE@r@v27/60700476."However, you still hope for it, don''t you?"'
43245: 'Battler@r@v10/60100331.".............................."'
43246: 'BEATRICE@r@v27/60700477."One day, the new "me" trips and lands on her head, and all her memories of the past are spectacularly restored!@k @v27/60700478.......You''re hoping for something like that, aren''t you?@k @|@y@v27/60700479.Ahyahyahyahya!@k @v27/60700480.A delusional plot like that wouldn''t even pass in a light novel these days!"'
43247: 'Battler@r@v10/60100322."......Shut up.@k@v10/60100333. ......Don''t pretend you didn''t do the same.@k@v10/60100334. ......You waited and waited...@v10/60100335....for me to remember...@v10/60100336....and take notice..."'
43248: 'BEATRICE@r@v27/60700481."..........................."'
43249: 'Battler@r@v10/60100337."........................"'
43250: '@rThen, ......what?'
43251: '@rDoes this mean...@w500.......that our relationship now...@w500....is exactly the opposite of how it once was......?'
43252: 'BEATRICE@r@v27/60700482.".........Hmph...@k@v27/60700483. ......Well, there was a time when I continued the game believing that you would eventually notice and remember,@k@v27/60700484. ......that a miracle would occur."'
43253: 'Battler@r@v10/60100338."..................How did it feel?@k@v10/60100339. ......When you were playing those games with me."'
43254: 'BEATRICE@r@v27/60700485."*cackle*cackle*cackle*...@k@v27/60700486. As they say, look inside your own heart..."'
43255: 'Battler@r@v10/60100340."..........................."'
43256: '@r......It''s tough.'
43257: '@rIf only she didn''t look so much like you, ......I wouldn''t be so confused about how to feel about her.'
43258: 'BEATRICE@r@v27/60700487."Well, do as you wish.@k@v27/60700488. In the past, I toyed with you and tormented you.@k@|@y@v27/60700489. .........Now''s your chance for revenge against me.@k@v27/60700490. ......The new "me" will just wander about, ignorant of everything.@k@v27/60700491. You may boil or burn her as you see fit.@k@v27/60700492. Perhaps it will clear away an old hatred."'
43259: 'Battler@r@v10/60100341."............If she was you, I would.@k@v10/60100342. It''d probably make me feel a lot better.@k@|@y@v10/60100343. ......But...@v10/60100344..........that Beato...@v10/60100345....isn''t you."'
43260: 'BEATRICE@r@v27/60700493."Who is she, then, if not me?"'
43261: 'Battler@r@v10/60100346."......Someone very like you,@v10/60100347. .........but a different person."'
43262: 'BEATRICE@r@v27/60700494."However, there can be no doubt that she is also me."'
43263: 'Battler@r@v10/60100348.".........Yeah.@k@v10/60100349. She is you,@v10/60100350. ......and at the same time,@v10/60100351. ...she''s a different person."'
43264: 'BEATRICE@r@v27/60700495."In that case, the new "me" is most unfortunate.@k@v27/60700496. She is being treated like a plaything in my place.@k@|@y@v27/60700497. ......*cackle*cackle*, how truly pitiable."'
43265: 'Battler@r@v10/60100352."...................................."'
43266: '@rThat might......be the contradiction inside me.'
43267: '@rBecause the new Beato seems like a different person, I can''t accept her.'
43268: '@rEven though I know she''s a different person than Beato, ......she keeps reminding me of her.'
43269: 'BEATRICE@r@v27/60700498."In that case,@k@v27/60700499. ......think of her as my daughter."'
43270: 'Battler@r@v10/60100353.".........Your daughter.........?"'
43271: 'BEATRICE@r@v27/60700500."Consider her a blood daughter of mine who closely resembles me.@k@|@y@v27/60700501. After all, she is my double, but hasn''t lived a thousand years, so calling her that is not incongruous."'
43272: 'Battler@r@v10/60100354."......True..."'
