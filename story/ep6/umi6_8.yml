43389: 'Furfur@r@v52/65200020."With our blessing, the pair can cultivate their love at their leisure!@k @v52/65200021.No need to worry about suspicious demons!"'
43390: 'Zepar@r@v51/65100024."However, without our blessing,@k@v51/65100025. your love will vanish, disappear, wither, and decay."'
43391: 'Jessica@r@v04/60200196."How the hell''re you so sure?!!"@|@y'
43392: '@r@v00/awase6007.""Because it is fate!!@k @v00/awase6008_o.You may choose not to accept it, you may choose not to resist it!""'
43393: 'BEATRICE@r@v27/60700539.".........Oh, what happens if you choose not to resist it...?"'
43394: 'Elder BEATRICE@r@v60/60700540."That love will end.@k@v60/60700541. ......Well, an abstract explanation isn''t so convincing.@k@|@y@v60/60700542. Well now, how could one explain the dead end fate you''re in..."'
43395: 'Zepar@r@v51/65100028."Ushiromiya Jessica, the future you two share is far more grim than you realize."'
43396: 'Furfur@r@v52/65200024."If you don''t gain the miracle of magic, disaster will most certainly befall you both."'
43397: 'Elder BEATRICE@r@v60/60700543."The infection within will fester...@k@v60/60700544.and split the two of you apart.@k@|@y@v60/60700545. ......Even I will not be so boorish as to describe the details of that process.@k@v60/60700546. However, if you will not believe, Jessica, I will tell you how it ends.@k@v60/60700547. ......Kanon will stop being a servant and will leave the island.@k@v60/60700548. For all eternity."'
