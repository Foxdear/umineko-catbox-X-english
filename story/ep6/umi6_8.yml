43385: 'Jessica@r@v04/60200191."Kanon-kun, Shannon, and you, George nii-san!@k @v04/60200192.Why are you listening to these creeps?!@k @v04/60200193.No one can stand in the way of a person''s love!@k @v04/60200194.Why do we have to get approval from these demons?!@k @v04/60200195.It''s none of their business!!"'
