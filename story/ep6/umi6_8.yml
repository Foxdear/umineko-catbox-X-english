43057: 'Kumasawa@r@v18/61800065."Come on, it''s okay now. Let''s hurry."'
43058: 'BEATRICE@r@v27/60700403."I, I hope Father likes sweet foods......"'
43059: 'Kumasawa@r@v18/61800066."Oh yes, he does like them.@k@v18/61800067. In fact, he seems to enjoy eating pretty much anything.@k@v18/61800068. Hoh-hoh-hoh-ho."'
43060: '@rAfter waiting for the master of the study to be out, Beato and Kumasawa entered the study.'
43061: '@rThen, they quickly tidied away the books on the desk, set down the basket they had brought there, and began spreading out the contents.'
43062: '@rInside......were several cute cookies cut out in a butterfly shape.'
43063: '@rThey set out a cute plate and neatly decorated it with the cookies.'
43064: '@rIt was the kind of slight adornment that the person eating wasn''t likely to even notice.@k The whole setup was filled with that sort of feeling.'
43065: 'Elder BEATRICE@r@v60/60700404."You spare no efforts for the sake of your beloved father."'
43066: 'BEATRICE@r@v27/60700405."This is......all I''m permitted to do right now."'
43067: 'Elder BEATRICE@r@v60/60700406."To think that I would give Battler cookies...@k@v60/60700407. Why should I, the ruler of the night, do so much for a guest who comes so rarely?"'
43068: '@rThen, the study door swung violently open.'
43069: '@rIt was Battler, with Genji by his side...'
43070: '@rBattler''s eyes went wide for a second when he saw Beato there, but his expression quickly went blank again.'
43071: 'Battler@r@v10/60100296."......What are you doing here?"'
43072: 'BEATRICE@r@v27/60700408."Father, ......please excuse me.@k@v27/60700409. I didn''t come here to get in the way of your important game......"'
43073: 'Battler@r@v10/60100297."How were you able to get in here...?@k @v10/60100298.Wasn''t this room locked?"'
43074: 'Genji@r@v14/61600033."......My apologies.@k@v14/61600034. I lent them a key because they wished to surprise you with a gift."'
43075: 'Kumasawa@r@v18/61800069."See, have a look...!@k @v18/61800070.BEATRICE-sama baked these cookies with all her soul, hoping that you would enjoy them."'
43076: 'BEATRICE@r@v27/60700410."Kumasawa-san and Genji-san taught me...@k@v27/60700411. I never knew Genji-san was so good at baking cookies."'
43077: 'Kumasawa@r@v18/61800071."Hoh-hoh-ho.@k@v18/61800072. He hasn''t done it much of late, but Genji-san used to cook many things long ago.@k@v18/61800073. He was especially good with sweets...!"'
43078: 'Battler@r@v10/60100299."Cookies...?"'
43079: 'BEATRICE@r@v27/60700412."Y-yes.@k@v27/60700413. It''s a gift for you, Father.@k@v27/60700414. I sincerely pray for your victory in this important match..."'
43080: '@rBattler looked at the plate on the study desk that was piled up with beautiful cookies...and the message card of encouragement lying next to it,@k .........and his face twisted with a complex expression, which might have had traces of both sadness and anger contained within it...'
43081: 'Genji@r@v14/61600035."............My lord..."'
43082: '@rIn not so many words, Genji prompted him to consider giving Beato''s efforts some kind of acknowledgment...'
43083: '@rBattler understood.@k@r......He had no reason to respond to this kindness with displeasure.'
43084: '@rHowever, even though he understood that logically,@k ......all he could do was give a small exasperated sigh.'
43085: 'Battler@r@v10/60100300."......Thank you, I''m very grateful.@k@|@y@v10/60100301. ......But I don''t like sweets.@k@v10/60100302. Please take it away."'
43086: 'Kumasawa@r@v18/61800074."M-......my lord..."'
43087: 'Genji@r"....................."'
43088: 'Battler@r@v10/60100303."Don''t make me say the same thing again.@k@v10/60100304. ......Please clean it up and take it away."'
43089: 'Kumasawa@r@v18/61800075."M-my lord, couldn''t you try just one bite...?@k @v18/61800076.BEATRICE-sama worked hard to make them for your sake..."'
43090: 'Battler@r@v10/60100305."......I''m grateful for the sentiment.@k@v10/60100306. ......I''m in the middle of a very important game right now.@k@|@y@v10/60100307. Important to both me...@v10/60100308.and Beato.@v10/60100309. .........And it will be our last.@k@v10/60100310. So please.@k@v10/60100311. Try not to trouble me any more than necessary."'
43091: 'Kumasawa@r@v18/61800077."That''s just too sad for her...!@k @v18/61800078.I''m glad that you are grateful for her feelings,@k@v18/61800079. but can''t you show it by taking just one little bite...?!"'
43092: 'BEATRICE@r@v27/60700415.".....................Father..."'
43093: '@rBeato looked at Battler sadly.'
43094: '@r......Battler hung his head to avoid her gaze.'
43095: '@rThe expression on his face was more pained than any he had shown Beato before...'
43096: 'Genji@r@v14/61600037."..................@k@|@y@v14/61600038. ......Kumasawa, clean this up and take it away."'
43097: 'Kumasawa@r@v18/61800080."My lord...!!"@|@y'
43098: 'Battler@r@v10/60100312."..........................."'
43099: '@rKumasawa implored Battler to listen, but he turned his back to her...'
43100: 'BEATRICE@r@v27/60700416."......My...apologies...@k@|@y@v27/60700417. ......Let''s clean this up, Kumasawa-san..."'
43101: 'Kumasawa@r@v18/61800081."I won''t allow it.@k@v18/61800082. By making this gift, BEATRICE-sama gave it her all to try and support you in your important game in the only way she could.@k@v18/61800083. To tell her to take it away without eating a bite yourself... How can you trifle with a woman so?!!"'
43102: 'Genji@r@v14/61600039.".........Kumasawa."'
43103: 'Kumasawa@r@v18/61800084."If you call yourself a man,@k @v18/61800085.you should at least try a bite when a woman makes you a handmade snack!!@k @v18/61800086.If you truly intend to trample on this woman''s feelings, I promise you this,@k@v18/61800087. I will not back down even if it kills me! No I won''t!!"'
43104: 'BEATRICE@r@v27/60700418."K-@v27/60700419.......Kumasawa-san,@v27/60700420. ......you''ve done enough for me already......"'
43105: 'Kumasawa@r@v18/61800088."I won''t allow it!!@k @v18/61800089.My lord, do you think there might be poison inside them?!"'
43106: 'Battler@r@v10/60100313."..........................."'
43107: '@r......Yeah,@k if Beato ever came to give me cookies......'
43108: '@r......of course I''d think that she''d put some kind of crazy poison in them......'
43109: '@rShe asked me if I thought there''d be poison in these?'
43110: '@rHow could anyone ever think...@w583....that cookies like these, piled up in such a neat and cute way,@w500. .......could possibly have something bizarre hidden inside...?'
43111: '@rAnd...@w583.......who could possibly believe...@w666.......that Beato...@w666.......would make something like this......?'
43112: '@rBecause of that, ......Battler couldn''t bear to look at Beato''s innocent reaction,@k which was completely free from any malicious thoughts of slipping poison into the cookies......'
43113: '@rBeato quietly started to clean up.@k ......Every now and then, she sniffled.'
43114: '@rKumasawa had been glaring at Battler continuously,@k but she now gave a small sigh and helped Beato clean up.'
43115: '@rHowever, the hardness didn''t disappear from her expression.'
43116: 'BEATRICE@r@v27/60700421.".........My apologies, Father.@k@v27/60700422. ...Please excuse me."'
43117: 'Battler@r@v10/60100314."Don''t call me that......"'
43118: 'BEATRICE@r@v27/60700423.".................."'
43119: 'Battler@r@v10/60100315."Don''t call me Father.@k@v10/60100316. ......Beato never once called me that."'
43120: 'BEATRICE@r@v27/60700424."Y-......yes, as you wish...@k@v27/60700425. ......My apologies..."'
43121: '@rHanging her head so low that her chin touched her chest, Beato hurried out of the study.'
43122: '@rAfter giving Battler a look, Kumasawa chased after her.'
43123: '@rShe shut the door a bit violently, and the footsteps of the pair rapidly disappeared off into the distance...'
43124: 'Ange@r@v11/62000359.".....................@k@v11/62000360. ......I may be his little sister, but I''m not sure how I feel about that."'
43125: 'FEATHERINE@r@v50/65000250."If she were anyone other than Beato, you''d think of him as a true enemy of women, is that it...?"'
43126: 'Ange@r@v11/62000361."......I don''t have a clue why Onii-chan and Beato act so friendly together.@k@v11/62000362. Right now, I think of Beato as our greatest enemy, the one we must defeat.@k@|@y@v11/62000363. ......Still, even so...@k@v11/62000364. As a woman, ......I can''t say I like Onii-chan''s reaction."'
43127: 'FEATHERINE@r@v50/65000251."Though I can understand Battler''s feelings a little.@k@v50/65000252. ......What a sad state of affairs."'
43128: '@rI still don''t understand what kind of bad blood or connection there was between them.'
43129: '@rHowever, Onii-chan probably views Beato......as a friendly adversary, if not something more.'
43130: '@rOnii-chan''s reason for defeating Beato isn''t to destroy an enemy out of hatred.@k ......It feels like he wants to give a sincere answer to her questions.'
43131: '@rYes.@k I can''t deny the fact that their fight isn''t based on hatred...@kbut on a stronger emotion.'
43132: 'Ange@r@v11/62000365.".........And on top of that...@k@v11/62000366....Beato really is something, to remain dedicated to Onii-chan even after being treated so coldly.@k@v11/62000367. I agree with the other, older sister BEATRICE.@k@v11/62000368. ......I can''t understand why she''s so dedicated to Onii-chan."'
43133: 'FEATHERINE@r@v50/65000253."And, though it may take a thousand years,@k@v50/65000254. that single factor that you do not understand must be passed on to the Golden Witch BEATRICE we know so well..."'
43134: 'Ange@r@v11/62000369."......Yes.@k@v11/62000370. I understand that.@k@v11/62000371. ......Knowing this Beato leads to knowing the Beato who is to come.@k@v11/62000372. ......It may explain the greatest piece in this crazy game, if not the game board itself..."'
43135: 'FEATHERINE@r@v50/65000255."Such a mysterious witch......"'
43136: '@rThough she said those words, FEATHERINE wore a confident smile on her face.'
43137: '@rHer sarcastic confidence, as though she already knew the answer, was unchanged.'
43138: 'Ange@r@v11/62000373.".........BEATRICE.@k@v11/62000374. I want to ask you something."'
43139: 'BEATRICE@r@v27/60700426."Y-......yes, what would you like to know, Ange-san...?"'
43140: '@rBeato, who had been reading a fragment book in the shadows of the study, jumped when Ange called out to her.'
43141: 'Ange@r@v11/62000375."......Why do you call Ushiromiya Battler "Father"?"'
43142: 'BEATRICE@r@v27/60700427."B-because he created the piece that I am..."'
43143: 'Ange@r@v11/62000376."......In that case, why are you so dedicated to Ushiromiya Battler?@k @v11/62000377.Is there some rule that pieces must obey the creator who made them?"'
43144: 'FEATHERINE@r@v50/65000256."There is no such rule.@k@v50/65000257. ......Pieces are tools, ...like a knife.@k@v50/65000258. ......If the Game Master uses them well, they can be quite useful.@k@|@y@v50/65000259. However, if you use them incorrectly, they can hurt you as well.@k@v50/65000260. ......Whether the tool is used as a tool or a weapon, that has nothing to do with the tool''s own will.@k@v50/65000261. It is merely the result."'
43145: 'Ange@r@v11/62000378."In that case, why are you so dedicated towards Onii-chan?@k @v11/62000379.It''s almost as though......that''s your purpose as a piece."'
43146: 'BEATRICE@r@v27/60700428."Y-.........yes.@k@v27/60700429. ...That is the purpose for which I was born."'
43147: 'Ange@r@v11/62000380."Did Onii-chan, the one who gave birth to you, give you that purpose?"'
43148: 'FEATHERINE@r@v50/65000262."You have that wrong.@k@v50/65000263. ......Battler merely set "a piece with that role" on the board as the Game Master.@k@v50/65000264. ......The one who gave birth to this piece...@k@v50/65000265.was the first Game Master and the one who created this game, BEATRICE herself..."'
43149: 'Ange@r@v11/62000381."......Aaah, this is getting confusing.@k@v11/62000382. ......In other words, you keep calling Onii-chan "Father", but he''s not actually your father.@k@v11/62000383. ......You''re just calling him that affectionately,@k@v11/62000384. because you feel that you have to dedicate yourself to him."'
43150: 'BEATRICE@r@v27/60700430."Y-......yes.@k@v27/60700431. ......I think that''s true.@k@|@y@v27/60700432. Father was the one who placed me on the game board.@k@v27/60700433. If he hadn''t, my piece would never have had a turn.@k@v27/60700434. So, the reason I exist here right now and the reason I am able to devote myself to my purpose...is all thanks to Father."'
43151: 'Ange@r@v11/62000385."......I see.@k@v11/62000386. So that''s why it makes sense for you to call him Father.@k@|@y@v11/62000387. ......In that case, who told you to devote yourself to Onii-chan?@k @v11/62000388.......Oh, right, that''s the first Game Master, Beato herself.@k@v11/62000389. ......Aaaahh, this is so confusing."'
43152: 'FEATHERINE@r@v50/65000266."You wish to ask her why she must serve Ushiromiya Battler, correct?@k @|@y@v50/65000267.However, she cannot give you that answer.@k@v50/65000268. She was given nothing but the purpose itself.@k@v50/65000269. ......Only the person who gave her that purpose knows the reasons for which they did so."'
43153: 'Ange@r@v11/62000390."......I see.@k@v11/62000391. "Consider that as well, child of man", right?@k@v11/62000392. ......So, that means you already have an idea and you''re laughing at my confusion."'
43154: 'FEATHERINE@r@v50/65000270."*cackle*cackle*.@k@v50/65000271. You really are just perfect for my miko..."'
43155: 'BEATRICE@r@v27/60700435.".........I will......do anything for Father.@k@v27/60700436. ...My existence will bring Father happiness.@k@v27/60700437. ......That is my greatest pleasure.@k@|@y@v27/60700438. ......And............"'
43156: '@rAt that point, Beato hesitated.'
43157: 'Ange@r@v11/62000393."What?@k @v11/62000394.And what?"'
43158: 'BEATRICE@r@v27/60700439."Y-yes...@k@|@y@v27/60700440. ......And...@v27/60700441.......if I could one day have Father acknowledge my efforts,@v27/60700442. ......there would be no greater happiness for me..."'
43159: 'FEATHERINE@r@v50/65000272."Pft........."'
43160: 'Ange@r@v11/62000395.".........What the hell.@k@v11/62000396. ......If you only wanted to serve him, I''d say you''re just another piece of the witch''s furniture,@k@v11/62000397. ......but you want him to acknowledge your efforts?@k @v11/62000398.That''s less like furniture and more like—"'
43161: '@rAnge stopped mid-sentence.'
43162: '@r......That''s less like furniture and more like...@w500.......you''re just a girl...@w583.......who loves Onii-chan.'
43163: '@r..................I don''t...get it.'
43164: '@rThe guiding force behind this Beato''s actions...is that of a girl who adores Onii-chan.'
43165: '@rBut then, what would that make her?'
43166: '@rIf she liked Onii-chan, then she should have adored him and done things for him herself.'
43167: '@rWhy would she create "a piece of herself", a separate entity, to do it......?'
43168: '@rThis way, ......even if she does attract Onii-chan''s attention, it will be towards the piece version of herself,@k ......not the creator who made that piece.'
43169: '@rIf I ever fall in love with someone, I''ll probably want to do things for them.'
43170: '@rBut of course, I would want to do those things myself.'
43171: '@rAfter all, I would want him to notice me.'
43172: '@rThis love is destined to go virtually unrewarded...... No matter how devoted she is, she will never get anything out of it.@k@rAnd she''s done this out of her own free will...'
43173: '@rBeato''s behavior looks no different from that of an average girl in love.'
43174: '@rShe''s devotedly doing all she can for him, dreaming that her kindness will eventually be acknowledged.'
43175: '@r......Why would Beato create a piece like this...?'
43176: '@rIs putting it in terms of romance a bit too confusing?@k Then let''s try using food as an example.'
43177: '@rIt''s as pointless as creating "a piece to eat food for you".'
43178: '@rNo matter how much food your piece eats on your behalf, you won''t get any less hungry, right?'
43179: '@rYou are the one who wants to eat.@k@rThere''s no reason for having a piece do that in your place.'
43180: '@rFor most jobs in the world, you can get someone else to do it for you.@k However, with love and food alone, there can never be any meaning in letting another person do it in your place.'
43181: '@rThat''s right.@k ......This Beato was created as a "piece"...for an impossible reason......'
43182: '@r......Though at a glance, she looks like just a normal girl,@k .........the more I learn about her, the less I understand, ......like an imaginary number......'
43183: 'BEATRICE@r@v27/60700443."......Father hates it when I call him Father.@k@v27/60700444. ......And the "me" that Father desires...didn''t call him by that name either."'
43184: 'Ange@r@v11/62000399."Right.@k@v11/62000400. The former "you" spoke to everyone without even using honorifics."'
43185: 'BEATRICE@r@v27/60700445."..................@k@v27/60700446. However, ......simply possessing that knowledge doesn''t mean I can refer to Father quite that informally.@k@|@y@v27/60700447. ......I''d like to do my best......and make a start by calling him Battler-san."'
43186: 'Ange@r@v11/62000401."I''m surprised you haven''t gotten discouraged after being treated so coldly."'
43187: 'BEATRICE@r@v27/60700448."......Fath—@v27/60700449.no,@v27/60700450. ......Battler-san is in the middle of an important game right now.@k@v27/60700451. His opponent is the formidable Lady Erika, piece of the great Lady BERNKASTEL."'
43188: 'BEATRICE@r@v27/60700452."......I stepped in at a delicate moment in his game, just as it was starting to reach the critical part,@k@v27/60700453. ......and called Battler-san by that name he doesn''t want to hear,@k@v27/60700454. ......so it''s no surprise that he was in a bad mood..."'
43189: 'Ange@r@v11/62000402."....................."'
43190: '@rApparently, Beato still wanted to devote herself to Battler, even after being treated in such a cold manner.'
43191: '@rThough to an outsider, it just looks as though she''s being snubbed, ......it doesn''t faze her at all.'
43192: '@rIt truly is the blindness of a girl in love......'
43193: 'Ange@r@v11/62000403."......Or is it that I can''t ''see'' because I have no love?"'
43194: 'FEATHERINE@r@v50/65000273."At times, love can make the invisible ''visible''."'
43195: '@rBeato once again immersed herself in the fragment book that told of her former self.'
43196: '@r......She was trying to find something about the Beato that Battler desired.'
43197: '@rAnge shrugged, as though saying "well, I don''t get it".@k@rFEATHERINE laughed when she saw this, and quipped that an "innocent young woman" could never understand.@k@rAnge grumbled something back unhappily.'
43198: '@rTheir interactions seemed to have no effect whatsoever on Beato as she sat in the shadows of the library......'
43199: '@rAfter chasing all the others out, ......only Battler remained in the study.'
43200: '@rThere was no color in this dimly lit room.'
43201: '@rHowever, ......for just the short time that the plate of cookies had been placed there,@k the room had seemed at least a little cheery...'
43202: '@rBattler''s gaze drifted over to the desk, ......which no longer had anything on it.'
43203: '@rWhen he did, the cookie plate that had been there until a second ago was revived.'
43204: '@rHowever, ......it was an illusion.'
43205: '@rThough the cookies could be looked at, they could not be touched, much less eaten...'
43206: '@rIf Battler wished, he could make it possible to "touch them" or "eat them", ......but it would be an empty sensation.'
43207: '@rIt would only give the touch and taste that Battler desired.'
43208: '@r......He no longer had any way of knowing...@k...what kind of cookies they had actually been.'
43209: 'Battler@r@v10/60100317."..........................."'
43210: '@rIn a reception sofa facing Battler,@w583. ......a cloud of gold butterflies slowly gathered,@w333. ...and took the form of the old Beato.'
43211: 'BEATRICE@r@v27/60700455."''Come o~n, have a bite It''s not every day that I''ll make these by hand...!@k @v27/60700456.Have no fear, I''m confident in how well they''ve turned out.''"'
43212: 'Ronove@r@v31/63100001."''Pu ku ku ku!@k @v31/63100002.Hearing that from Milady makes them all the more dubious.''"'
43213: 'Battler@r@v10/60100318."......Seriously.@k@v10/60100319. ......Any cookies you made would obviously have some kind of strange poison in them."'
43214: 'BEATRICE@r@v27/60700457."''Shocking that you should think so.@k@v27/60700458. Even if I did put something in, it''d be no worse than the kind that does this and maybe that to your you-know-what.@k@v27/60700459. Uhyahyahya!''"'
43215: 'VIRGILIA@r@v30/63200014."''It''s because you do that sort of thing all the time that Battler-kun will never agree to eat them.''"'
43216: 'Gaap@r@v32/63700001."''Huh? Putting things in someone''s food is pretty basic, isn''t it?@k @v32/63700002.Fingernails, bits of hair, magic charms, fragments of love...eheheheheheheheh!@k @v32/63700003.What would you people put in?''"'
43217: 'Beelzebub@r@v43/62800001."''Yes, ma''aaam!!@k @v43/62800002.I wouldn''t put anything in them! I''d just eat them all myself!''"'
43218: 'Satan@r@v40/62500001."''Obviously. Do you have to be so predictable?!!''"'
43219: 'Asmodeus@r@v44/62900001."''Well, they say a girl''s gotta grab by all three sacks☆ The first step is the stomach, right?@k @|@y@v44/62900002.Next comes the wallet...so what could the third one be?! *giggle*''"'
43220: 'Mammon@r@v42/62700001."''If I could catch a guy''s attention, I''d want to make him sacrifice his body, heart, and soul to me!@k @|@y@v42/62700002.That''s why I pour all my power and affection into my cooking.''"'
43221: 'Belphegor@r@v41/62600001."''Heheh, in any event, giving someone food that you''ve cooked yourself is probably a frontal attack as old as time.''"'
43222: 'Lucifer@r@v38/62300001."''Ridiculous.@k@|@y@v38/62300002. How pathetic to think that you require such tricks to grasp a man''s heart.''"'
43223: 'Leviathan@r@v39/62400001."''Ohh~?@k @v39/62400002.I''d be very interested in hearing how much experience you have in grasping a man''s heart, Onee-sama!''"'
43224: 'BEATRICE@r@v27/60700460."''Battler, there''s nothing weird in it, so have a bi~te.@k@v27/60700461. Don''t think you''ll ever get a chance to eat my handmade cookies again''"'
43225: '@r.........There probably won''t...be another chance.'
43226: '@rI slowly stretched out my hand,@w500. ......out to the illusion of the cookie plate,@w500. ......and touched it.'
43227: '@rJust before I did, it became a cloud of gold butterflies, ......and vanished into the darkness of the study.'
43228: '@rThe illusions of Ronove and VIRGILIA also disappeared.@k@r...However, the illusion of Beato alone still remained on the sofa.'
43229: 'BEATRICE@r@v27/60700462."......Is there something that does not satisfy you?"'
43230: 'Battler@r@v10/60100320."............Are you really going to make me say it?"'
43231: 'BEATRICE@r@v27/60700463."*cackle*cackle*cackle*.@k@v27/60700464. ......The more the new "me" differs from the form you wished for,@v27/60700465. ......the more you are reminded that I can never be revived again,@v27/60700466. ......correct?"'
43232: 'Battler@r@v10/60100321."..........................."'
43233: 'BEATRICE@r@v27/60700467."*cackle*cackle*!@k @v27/60700468.If you let a good woman get away, you never get a second chance.@k@v27/60700469. So, only now, you''ve finally realized what a good woman I wa~s."'
