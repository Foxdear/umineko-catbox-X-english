43274: 'Battler@r@v10/60100355."That''s actually a good analogy. ......It''s unlike you."'
43275: 'BEATRICE@r@v27/60700504."Do not jest.@k@v27/60700505. That is my daughter.@k@v27/60700506. She is the child I left behind after my death.@k@|@y@v27/60700507. .........You are free to press my likeness upon her.@k@v27/60700508. You may also let loose your pent-up resentment on her in my place."'
43276: 'BEATRICE@r@v27/60700509."......Making her bear my sins and torturing her as you please may allow you to give vent to your emotions.@k@v27/60700510. If that is not to your taste, you can also guide her down the right path so that she does not end up on the inhumane road that I have tread."'
43277: 'BEATRICE@r@v27/60700511."......She was made to devote herself to you since the moment of her birth.@k@v27/60700512. If you wish, you can mold her into any shape you desire.@k@v27/60700513. .........With a miracle of a thousand years, she might even become me."'
43278: 'Battler@r@v10/60100356."......So, I could even strip her and drag her around with a chain, like you did to me once."'
43279: 'BEATRICE@r@v27/60700514."*cackle*cackle*.@k@v27/60700515. Yes, at this point, even greater humiliation would be possible..."'
43280: 'Battler@r@v10/60100363.".....................So she is both your double...@v10/60100364.and...@v10/60100365.your daughter,@v10/60100366. ......huh..."'
43281: '@rWithout a doubt, she is exactly the same person, the same piece, which was created once more by the rule called BEATRICE.'
43282: '@rHowever, when I can''t accept it that way, .........I can interpret her as being Beato''s daughter.@k ......This served as a clear guidepost on how to interact with her and smooth the uncertainty in my heart.'
43283: '@r............And...@w500....finally...'
