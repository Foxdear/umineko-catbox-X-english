44636: '@rWith the spirit mirror still held out, Natsuhi cautiously closed the gap between them.'
44637: '@rShe was cautious, so as to prevent the witch from suddenly lashing out and stealing the mirror, ......but she steadily moved forward to corner this evil.'
44638: 'Natsuhi@r@v03/60900031."I...I do not know who you are.@k@v03/60900032. ......All I know is that you tried to kill me,@k@v03/60900033. and that you are a creature of evil who cowers before this spirit mirror.@k@v03/60900034. ......Begone, evil one...!!"'
44639: '@rBeato didn''t understand what was happening herself.'
44640: '@r......She didn''t know why she had to fear this spirit mirror.'
44641: '@rHowever, when she tried to look at the bright light let off by the spirit mirror, it pierced her eyes.'
44642: '@rShe understood that she had to be afraid, even if she didn''t understand why.'
44643: '@rBy now, Beato realized that this spirit mirror was both terrifying and harmful.'
44644: '@rAs it came closer to her, she felt an increasingly strong burning sensation over her whole body, as though someone was approaching her with a hot iron.@k She couldn''t even open her eyes because of the mirror''s bright, painful glint...'
44645: 'BEATRICE@r@v27/60700641."Uuuuu...@v27/60700642....ah...@v27/60700643.......aaaaaaaahhh.........ah..."'
44646: 'Natsuhi@r@v03/60900035."Now, return to the world whence you came, wicked one!@k @v03/60900036.I, Ushiromiya Natsuhi, will not falter back a single step to evil!"'
44647: '@r......It''s......no use......@k@r......Why......?'
44648: '@rWhy is this......musty mirror...so...'
44649: '@rIf I...@w500....lose here,@w333. .........I''ll be the only one...@w583.......to fail this trial......'
44650: '@rJust like...@w583....George-san and Shannon-san,@w250. ......and Jessica-san and Kanon-san,@w583. ......I want Battler-san to see value in me...@w500....and treasure me...'
44651: '@rI''ve...@w500....finally managed to admit that,@w583. .........so I can''t...@w666................fail now............'
44652: 'Furfur@r@v52/65200072."Are you giving up?!@k @v52/65200073.You, and only you?!"'
44653: 'Zepar@r@v51/65100080."Believe!@k @v51/65100081.The miracle of love will surely occur!"'
44654: '@r......I...@w333.......love...@w500....Battler-san...'
44655: '@rI want him to notice me.@k@rAnd I want him to recognize and accept my feelings......'
44656: '@rMy reason for calling him Father as I dedicated myself to him...@k...was that no one helps a parent expecting something in return, and that helped me come to terms with getting nothing back...'
44657: '@rIt was...a deception to fool myself with......@k@r......I......love Battler-san.@k@rAnd I want him to recognize that.'
44658: '@rI admit it.@k I won''t hide from it any longer.'
44659: '@r......I was born to love Battler-san...and to have him love me back......'
44660: 'BEATRICE@r@v27/60700644."......So,@v27/60700645. .........I can''t afford...@v27/60700646.......to lose here........."'
44661: 'Natsuhi@r@v03/60900037."Begone, wicked one!!@k @v03/60900038.There is no place for you here!"'
44662: 'BEATRICE@r@v27/60700647."Nn, ......gwaah...!!!"'
44663: '@rHer determination had come too late.'
44664: '@rIf she had possessed it since the beginning, ......she would probably have finished off Natsuhi on the spot without any hesitation.'
44665: '@rBecause she had wavered, it had taken time to kill Natsuhi, ......and things had ended up like this.'
44666: '@rBut now, I am resolved.'
