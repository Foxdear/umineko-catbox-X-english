44632: '@rAnd Natsuhi realized that the spirit mirror had the power to repel witches.'
44633: 'BEATRICE@r@v27/60700638."......Gghh......uuuuuhhh......!!@k @v27/60700639.Wh-...why is...the mirror......?!"'
44634: 'Natsuhi@r@v03/60900029."It is because you are an evil witch.@k@v03/60900030. .........This miraculous spirit mirror repels all creatures of evil...!"'
