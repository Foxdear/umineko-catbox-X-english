44544: 'Shannon@r@v15/60500282."Then, goodbye...!"'
44545: '@rThe entire room was filled with the red light of the shield, ......and the output and pressure were raised to their limits.'
44546: '@r......Then, crushed between the shield and their own locked-room barrier,@w583.@|@y ......MARIA and Sakutarou lost their forms, scattered into a spray of gold, and disappeared...'
44547: 'Kanon@r@v16/60600315."......Thank you.@k@v16/60600316. ......I couldn''t afford to disappear here."'
44548: 'Shannon@r@v15/60500283."If you lost in a place like this, you''d never be able to let it go."'
