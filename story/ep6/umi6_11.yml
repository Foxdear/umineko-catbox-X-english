44477: '@rWhen she did,@w250. ......she saw a small...@w500.............red rose petal floating on the surface.'
44478: '@r...@w166....@w166.A@w333....@w166....@w166.rose@w333....@w166....@w166....@w166....@w166....@w166.？'
44479: 'Kanon@r@v16/60600298.".........I have heard that, in your youth,@k@v16/60600299. ......you loved to lie on that sofa."'
44480: 'Rosa@r"...................................."'
44481: '@rIt...@w500....wasn''t a rose petal.'
