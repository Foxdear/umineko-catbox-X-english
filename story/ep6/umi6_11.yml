44372: '@rRosa could be seen in the parlor.'
44373: '@rIt seemed that the relatives all wanted to be alone now that they had dispersed for a short break.'
44374: '@rSince everyone had avoided the parlor, the obvious place for people to gather,@k Rosa was able to have this relaxing and comforting room all to herself...'
44375: '@rThat didn''t mean she looked relaxed.@k@rHer expression was heavy with gloom and weariness.'
44376: '@rThe cup of black tea that she had brought from the dining hall had gone stone cold......'
44377: 'Rosa@r@v12/61400018."................................."'
44378: '@r......Comforting silence.'
44379: '@rNow that no one else was in sight, Rosa''s heart finally awoke.'
44380: '@rShe was always treated like a kid in the conferences with her three siblings.@k@rShe had no influence at all.'
44381: '@rBut, possibly because of that, she was apparently considered to be a neutral party.@k@rThe siblings would often ask for her agreement, sometimes even treating her like an adjudicator or a judge.'
44382: 'Rosa@r@v12/61400019."......I have to make use of that...@k@v12/61400020....and turn the discussion in the direction I want."'
44383: '@rI have to find almost a hundred million yen by March.'
44384: '@rThat was supposed to be my great commitment, a burden I bore to help support......his business.'
44385: 'Rosa@r@v12/61400021.Now, ......I''m not sure anymore.'
44386: 'Rosa@r@v12/61400022.If I can pay off the debt, ......will he call me again?'
44387: 'Rosa@r@v12/61400023.......Well, you can forget it.@k@r@v12/61400024.Even if you do contact me after all this time, ......I''ll be the one turning you down.'
44388: 'Rosa@r@v12/61400025.......But still,@v12/61400026. .........you are Maria''s father, you know......?'
44389: 'Rosa@r@v12/61400027.Please come and see her,@v12/61400028. ......if only just once......'
44390: 'Kanon@r@v16/60600274."......Love is quite a difficult thing...@v16/60600275.......to stick to, isn''t it?"'
44391: 'Rosa@r@v12/61400029."Huh?!@k @v12/61400030.Wh-.........who.........?"'
44392: '@rThough no one should have been in the parlor, someone suddenly spoke to Rosa, and she jumped.'
44393: '@r......Just when had it happened...?@k Kanon could be seen standing there.'
44394: '@rEven considering that she had been deep in thought, ......to think that she hadn''t noticed him at all......'
44395: 'Rosa@r@v12/61400031."......You scared me.@k@v12/61400032. ...Sorry, I guess I was thinking so hard that I didn''t notice you.@k@v12/61400033. ......Need something?"'
44396: 'Kanon@r@v16/60600276."No.@k@v16/60600277. .........The reason you are currently in pain is because of love, Rosa-sama.@k@v16/60600278. ......Am I wrong?"'
44397: 'Rosa@r@v12/61400034."Th-that''s sudden.@k@v12/61400035. ......I''m not sure what you''re talking about."'
44398: 'Kanon@r@v16/60600279."......Maria-sama''s father asked you to be the co-signer on a loan,@k@v16/60600280. and you accepted."'
44399: 'Rosa@r@v12/61400036."...........................@k@v12/61400037. ...What a troublesome kid.@k@v12/61400038. ......You were listening to Krauss nii-san from the hallway, weren''t you...?"'
44400: '@r......True, earlier this day, in this very room,@k Krauss had seen through to the fact that Rosa was bearing a massive debt because she had become a co-signer on a loan.'
44401: '@rHowever, he hadn''t said that her partner had been Maria''s father......'
44402: '@rWhy......did Kanon know so much......?'
44403: 'Kanon@r@v16/60600281."You are a very wise person, Rosa-sama.@k@v16/60600282. ......You wouldn''t have become a co-signer...@k@v16/60600283.without thinking carefully about the consequences."'
44404: 'Rosa@r@v12/61400039."...............I hadn''t yet moved to his family register,@k@v12/61400040. but I thought of the man I would soon marry as my partner.@k@v12/61400041. If he couldn''t borrow the money without my name, I figured that helping him out was my responsibility as his future wife."'
44405: 'Kanon@r@v16/60600284."......And did that future ever come?"'
44406: 'Rosa@r@v12/61400042.".............................."'
44407: '@rNo, it hadn''t.'
44408: '@rSo afterwards......Rosa was always alone.@k@rAnd Maria......never had a father.'
44409: '@rHowever, time moved on.'
44410: '@rMaria, who should have been a symbol of their union, just kept growing,@k almost like a living hourglass measuring the length of the hell Rosa had crawled through......'
44411: '@rBecause of that, Maria''s growth......hurt.'
44412: 'Rosa@r@v12/61400043."......It''s a cruel joke.@k@v12/61400044. ......I tried to forget that man several times.@k@v12/61400045. ......But you know, forgetting him doesn''t get rid of that debt."'
44413: '@rIt was only natural.@k ......And so, whether or not she forgot her love,@k she had to do all she could to pay that money back.'
44414: 'Rosa@r@v12/61400046."But you know, I also think of it this way.@k@v12/61400047. .........If I can manage to pay everything off, ......it''ll mean that I''ve passed the trial of love that he gave me.@k@v12/61400048. ......If I have to pay off my debt anyway, how can I abandon my reward, the love I could gain as a result, before it''s over...?@k @v12/61400049.Don''t you think I could put off thinking about that until after I''ve paid it all back......?"'
44415: 'Kanon@r@v16/60600285."..........................."'
44416: '@rIt may have been a trick of words that only those who have suffered through love could understand.'
44417: '@rEven Rosa vaguely realized that she might have been deceived.'
44418: '@rHowever, if she was able to succeed in paying back the loan, ......he might acknowledge her usefulness as a wife...'
44419: '@rWhen that happened, she might be able to regain her love.'
44420: '@rBut if she had already abandoned that love, then what?'
44421: '@r......This debt, this "trial that he had given her", would become completely meaningless......'
44422: '@rYes, for her, ......the debt itself appeared to be a trial of love.'
44423: '@rIn fact, the very fact that she looked at it that way might have been her blindness due to love,@k as well as proof that she still hadn''t cast off her infatuation with the past...'
44424: '@rEven now, she still suffered......'
44425: '@rAnd that suffering would continue, ......at least until she paid back the massive loan, and let a good deal of time pass after that,@k ......until she could finally lay her feelings for him to rest...'
44426: 'Kanon@r@v16/60600286.".........Could this be......that hell Kyrie-sama spoke of?"'
44427: 'Rosa@r@v12/61400050."......Probably.@k@v12/61400051. ......Though I''m not sure what you''re talking about.@k@v12/61400052. ......There''s no doubt that my world has been a total hell."'
44428: 'Kanon@r@v16/60600287."And how can that be put to an end...?"'
44429: 'Rosa@r@v12/61400053.".........Who knows?@k@v12/61400054. If anyone did, ......the disease called love would never eat into anyone again."'
44430: '@rThat disease is a serious one.@k@r......It sometimes eats into a person for their entire life, .....spreading to and hurting the people closest to them.@k@rThat disease was torturing her now as much as it ever had...'
44431: 'Rosa@r@v12/61400055."Well, since you bring up Kyrie-san,@k@v12/61400056. .........her story is like an aspiration to me, ......or a dream."'
44432: '@rThough she had her man stolen from her, she persevered for 18 years.@k@rShe never fell to despair, and instead continued to support Rudolf, lying in wait for a miracle......'
44433: 'Rosa@r@v12/61400057."Maria is still only nine years old.@k@v12/61400058. ......I''ve only waited for the first half of Kyrie-san''s 18 years.@k@|@y@v12/61400059. ......If I gave up after just this, ......she would laugh at me."'
44434: 'Kanon@r@v16/60600288."......Do you think that a miracle will occur in another nine years?"'
44435: 'Rosa@r@v12/61400060."..............................@k@v12/61400061. ......Doubting that would be the end of me."'
44436: 'Kanon@r@v16/60600289."..........................."'
44437: 'Rosa@r@v12/61400062."In a sense, I''m a ghost.@k@v12/61400063. ......I am already dead.@k@v12/61400064. I''m just living on without noticing."'
44438: 'Kanon@r@v16/60600290.".........A ghost waiting for eternity for a person who will never come......"'
44439: 'Rosa@r@v12/61400065."That''s right.@k@v12/61400066. .........That day, when I naively said that I wanted to support his dream, I was probably already dead.@k@v12/61400067. .........I guess that really was a regretful day, in the end.@k @v12/61400068."I have dreams. I want to go overseas.@k@v12/61400069. I''ll fly out of this tiny country, make it big, and come back to you."@k@v12/61400070. ......That takes me back..."'
44440: 'Rosa@r@v12/61400071.......At that time, I thought of lovers as a pair of people willing to acknowledge the other''s radical dreams.'
44441: 'Rosa@r@v12/61400072.I''d become a successful designer, announcing my new lines in Paris,@k@v12/61400073. getting jostled by the press...... He loved to talk about that dream, and I loved listening to him.'
44442: 'Rosa@r@v12/61400074.When I think about it, ......I really had my head in the clouds during that strange time.'
44443: 'Rosa@r@v12/61400075.............We both lifted the other up, as though we were drifting about in the air.'
44444: 'Rosa@r@v12/61400076.So, when he said that he wanted to get out of Japan, I applauded him and promised to support him.'
44445: '@rAcknowledging each other''s great dreams that might never be is a standard sort of pillow talk for lovers.'
44446: '@rBut once they started to translate into actual action, ........from that point on, I should have been serious and practical.'
44447: 'Rosa@r@v12/61400077."......For a long time, I felt proud of letting him go on that day.@k@v12/61400078. ......No, I still do."'
44448: 'Kanon@r@v16/60600291.".....................@k@v16/60600292. ......But you still regret it."'
44449: 'Rosa@r@v12/61400079.".........That''s right.@k@v12/61400080. .........If, on that day, I had sobbed and pleaded for him to stay, I might not have fallen into hell.@k@v12/61400081. ......Did seeing him off with a smile really make me a winner?@k @v12/61400082.Of course not.@k@v12/61400083. I basically lost by default by refusing to fight when the time came."'
44450: 'Rosa@r@v12/61400084."...I only glorified that loss, ......saw him off with a smile as he went to take on the world overseas,@k@v12/61400085. and became intoxicated with the fantasy that I was some brave woman waiting patiently with her daughter for her man''s return.@k@v12/61400086. .........Even though he never called me once after that, and mail sent to the address he gave me came back "forwarding address unknown"..."'
44451: 'Kanon@r@v16/60600293."..........................."'
44452: 'Rosa@r@v12/61400087."......Where I am right now...is hell.@k@v12/61400088. ......A hell where I''ll regret until the day I die that I didn''t fight when I was meant to.@k@v12/61400089. ......I''ve even dragged my daughter into hell with me.@k@|@y@v12/61400090. ............I wish someone would just kill me.@k@v12/61400091. ......I want to be told that I''ve already been killed, that I''m a ghost."'
44453: 'Kanon@r@v16/60600294."............In love,@v16/60600295. ......if you do not fight,@v16/60600296. ......you fall into hell."'
44454: 'Furfur@r@v52/65200063."......Yes. Love is a fight."'
44455: 'Zepar@r@v51/65100068."Will you win and gain,@k@v51/65100069. or lose and die?"'
44456: 'Furfur@r@v52/65200064."But please, have no fear of death."'
44457: 'Zepar@r@v51/65100070."After all, it is a peaceful sleep."'
44458: '@r@v00/awase6021.""What is truly terrifying...@k@v00/awase6022_o....is the hell that finds the unsleeping ghosts who could neither win nor die.""'
44459: 'Shannon@r@v15/60500272."......That hell has no end..."'
44460: 'George@r@v07/60300428."The battle of love is cruelest to those...@k@v07/60300429.who could neither win nor die."'
44461: 'Jessica@r@v04/60200362."......So, in love, you''ve got to go for broke.@k@v04/60200363. Dying in battle.......is better than the alternative."'
44462: 'Elder BEATRICE@r@v60/60700615."They say the most torturous toxin for humans is made from rotting love.@k@|@y@v60/60700616. ......The suffering it brings......exceeds the tortures of the most twisted hells."'
44463: '@rShe said this as a warning to motivate her double and little sister,@k encouraging her to take on any trial, no matter how severe...'
44464: 'BEATRICE@r@v27/60700617."............I understand."'
44465: '@rAfter all, when my desire to have Battler-san one day accept me wells up in my chest,@k .........I can feel the seed that resides there.'
44466: 'BEATRICE@r@v27/60700618."......It is up to me to kill that seed or make it bud.@k@v27/60700619. ......But if I let it rot here in my chest, ......its poison will surely torment me forever..."'
44467: 'Elder BEATRICE@r@v60/60700620."And that, .........even for us thousand year old witches,@k@v60/60700621. ......is the most terrifying torture in the world..."'
44468: 'Zepar@r@v51/65100073."Behold what happens to those who make light of love!@k @v51/65100074.This hell of Rosa''s—"'
44469: 'Furfur@r@v52/65200067."Is what happens to those who do not possess the courage to make the seed of love bud, and instead allow it to rot."'
44470: '@r@v00/awase6023_o.""One cannot end that pain by their own hands.""@|@y'
44471: '@r.........Huh?@k .........Just now......was that a red light......?'
44472: 'Kanon@r@v16/60600297."..................My apologies."'
44473: 'Rosa@r@v12/61400092."......Huh...?@k @v12/61400093..........What.........?"'
44474: '@rJust now...@w333.I thought...@w500....I saw something strange.'
44475: '@r......I wonder if I''m tired...@w500. ......It''s probably just my imagination.'
