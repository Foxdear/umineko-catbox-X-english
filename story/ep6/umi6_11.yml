44693: '@r@v10/60100367.".........That''s enough.@k@v10/60100368. ......Lucifer, do it."'
44694: 'Lucifer@r@v38/62300007."A-as you wish!"'
44695: '@rLucifer transformed into a stake, and, like the time she had smashed Natsuhi''s spirit mirror, flew violently around the room.@k ......Then, she struck Natsuhi''s forehead.'
44696: '@rNatsuhi......crumpled slowly.@|@y'
44697: '@rWhen Beato saw this, she also fell to her knees, breathing hard.'
44698: 'Furfur@r@v52/65200075."Say, Zepar!@k @v52/65200076.Does this count?@k @v52/65200077.BEATRICE didn''t complete the trial by her own strength alone!"'
44699: 'Zepar@r@v51/65100083."You raise a good point, Furfur!@k @v51/65100084.True, this trial must be accomplished without borrowing the help of any other!"'
44700: 'Furfur@r@v52/65200078."But maybe there are exceptions to that?!"'
44701: '@r@v00/awase6025_o.""After all, a pair in love are as one!@k @v00/awase6026_o.This is not outside assistance!""'
44702: 'BEATRICE@r@v27/60700654.".........B-......Battler-san......"'
44703: 'Battler@r@v10/60100369."Did you really have to scare me like that on the first twilight?"'
44704: 'BEATRICE@r@v27/60700655."F-......forgive me...@k@v27/60700656. I didn''t follow your instructions..."'
44705: 'Battler@r@v10/60100370."Instructions?"'
44706: 'BEATRICE@r@v27/60700657."......Well, .........I didn''t stay in my room......"'
44707: '@rBeato hung her head apologetically.@k@r......When he saw this, Battler scratched his head uncomfortably.'
44708: 'Battler@r@v10/60100371."In that case, ......I should apologize too.@k@v10/60100372. ......I should have been more kind."'
44709: 'BEATRICE@r@v27/60700658."N-@v27/60700659....no,@v27/60700034. ......Father,@v27/60700661. ......I...I mean...Battler-san, you did nothing wrong..."'
44710: 'Battler@r@v10/60100373."It''s okay. Call me whatever you like."'
44711: 'BEATRICE@r@v27/60700662."Huh.........?"'
44712: '@rBattler had always looked at the new BEATRICE sternly.'
44713: '@rHowever, that was gone from his expression now...'
44714: 'Battler@r@v10/60100374."......True, the old you may have called me just "Battler".@k@v10/60100375. ......At first, I might have tried to force you to speak to me that way.@k@v10/60100376. ......But forcing that on you is pointless.@k@v10/60100377. You are Beato...but you''re yourself.@k@v10/60100378. .........You can call me whatever you want."'
44715: 'BEATRICE@r@v27/60700663."B-.........Battler-san........."'
44716: 'Battler@r@v10/60100379."Sure, that works great.@k@v10/60100380. ......Can''t say being called Father is really my thing."'
44717: 'BEATRICE@r@v27/60700664."...Y-.........yes..."'
44718: '@rUntil this point, she had hesitated just to say Battler''s name at all.'
44719: '@rEven if she had known that Battler wanted her to say his name without honorifics, that would have been beyond her right now,@k .........and even if she had been able to call him that, doing so could have hurt Battler even more.'
44720: '@rHowever, ......now, she was allowed to call Battler by his name.'
44721: '@rIf you just looked into her eyes,@k ......there would be no need to describe just how happy this made her feel...'
44722: 'Battler@r@v10/60100381."I heard from Zepar and Furfur.@k@v10/60100382. ......It looks like you''re in the middle of some bizarre game."'
44723: 'BEATRICE@r@v27/60700665."Y-yes...@k@v27/60700666. I''m sorry for doing this without asking......"'
44724: 'Battler@r@v10/60100383."No, it''s fine.@k@v10/60100384. I never did know what you were going to do next—getting up to antics like this is really like you.@k@v10/60100385. ......And...well, I''ve heard about the intent of the game.@k@v10/60100386. Apparently, you''re supposed to tackle it as a pair."'
44725: 'Zepar@r@v51/65100087."Yes, that is correct, Lord BATTLER!!"'
44726: 'Furfur@r@v52/65200081."If you can emerge from our trial victorious—"'
44727: '@r@v00/awase6027.""We will bless the pair of you and bestow a miracle of magic upon you!""'
44728: 'Battler@r@v10/60100387."It looks like these guys were the ones giving power to Beato''s golden butterfly brooch.@k@v10/60100388. So they''re proven to produce results.@k@|@y@v10/60100389. .........We''ve been stuck with each other for a long time now.@k@v10/60100390. Nothing wrong with playing this sort of game every now and then."'
44729: 'BEATRICE@r@v27/60700667."......Battler-san............"'
44730: 'Zepar@r@v51/65100089."Oh, did you hear that, Furfur?!@k @v51/65100090.It looks like Lord BATTLER is joining in as well!!"'
44731: 'Furfur@r@v52/65200083."That''s no surprise!@k @v52/65200084.After all, we''ve known since the beginning!"'
44732: '@r@v00/awase6028.""Welcome to our trial, Lord BATTLER!@k @v00/awase6029_o.And who will your sacrifice be?!""'
44733: 'Battler@r@v10/60100391."......My work is already done.@k@v10/60100392. Go and check if you want."'
44734: 'Zepar@r@v51/65100093."Very well, Lord BATTLER!@k @v51/65100094.Come, Furfur, let us go check!"'
44735: 'Furfur@r@v52/65200087."Yes, let''s!@k @|@y@v52/65200088.But Zepar?@k @v52/65200089.This means that all six lovers have completed their trial!@k @v52/65200090.What should we do next?!"'
44736: '@r@v00/awase6030.""The resolve of all six is the real deal!@k @v00/awase6031_o.Let us test them further in the next trial!""'
44737: '@rThe two noisy demons disappeared.'
44738: '@rIt seemed that they had left to go check on the sacrifice Battler had killed,@k ......but it also seemed that they had done so in order not to bother Battler and Beato, who could finally look each other in the eye and talk......'
44739: 'Tohya@r@v56/64900089."......What do you think of the tale so far......?"'
44740: '@rWhen suddenly asked this question, Ange immediately came to her senses...'
44741: '@rThen, realizing that she had become immersed in this woman''s tale,@k she felt a bit defeated and tried to look displeased.'
44742: 'Ange@r@v11/62000451."Y-......you''ve cleverly tried to mix things up with all this about the love trial,@k@v11/62000452. but exactly six people have died, setting up the first twilight.@k@v11/62000453. Impressive."'
44743: 'Amakusa@r@v20/63000022."Oh, you''re right.@k@v20/63000023. I didn''t realize."'
44744: '@rAmakusa clapped his hands as though he''d been outsmarted.@k@rEven though he''d figured it out before me, he played the fool.'
44745: 'Tohya@r@v56/64900090."......That''s simply because the number of lovers just happened to be six.@k@|@y@v56/64900091. The fact that it matched to the number of the first twilight was half coincidence, half design.@k@v56/64900092. ......It''s a bit more interesting that way—feels more like fate."'
44746: 'Ange@r@v11/62000454."Humans have the bad habit of taking two meaningless phenomena and trying to link them together.@k@v11/62000455. Trying to make things seem like fate is a "trick" of books."'
44747: 'Amakusa@r@v20/63000024."I guess you aren''t a fan of <destiny> and <miracles>, missy."'
44748: 'Ange@r@v11/62000456."They''re like UFOs.@k@v11/62000457. Everyone knows about them, but no one has ever seen them."'
44749: 'Amakusa@r@v20/63000025."There''s a <cool> metaphor."'
44750: 'Ange@r@v11/62000458."......So.@k@v11/62000459. Normally, I would move right along at this point, my only comment being that love and illusions are unnecessary, useless scenes for a mystery story."'
44751: 'Ange@r@v11/62000460."......But Okonogi-san disagreed with that way of thinking.@k@v11/62000461. He thought that, by looking at things without love that way, the truth could never be reached."'
44752: 'Amakusa@r@v20/63000026."Ah, you mean President Okonogi''s killer phrase?@k @v20/63000027.Without love, it cannot be ''seen''?"'
44753: 'Ange@r@v11/62000462."Yeah, that.@k@v11/62000463. ......If I were to set aside the anger I feel towards this fictional murder of my family...@k@v11/62000464....and speak with respect for you as the one who wrote this tale, I''d say there must be a point to this depiction.@k@v11/62000465. After all, you''ve used up all these pages talking about love and trials.@k@v11/62000466. ......In other words, those are the themes and key words of this tale."'
44754: 'Tohya@r@v56/64900093."......Oho.@k@v56/64900094. ......And there are many who claim that all words not written in red ink are not worth reading.@k@v56/64900095. ......It is an honor, child of man,@k@v56/64900096. that you have read the black letters as well."'
44755: 'Ange@r@v11/62000467."Stories are written because the writer has something they want to communicate.@k@v11/62000468. And some writers feel that it''s unrefined to lay everything out too directly."'
44756: 'Ange@r@v11/62000469.".........All of this about how you''ll never reach the truth without love has shown up many times in the works before this one.@k@v11/62000470. This new work makes that even more striking.@k@v11/62000471. ......It means that that is the one thing the writer wanted to tell the most—the thing that they want the reader to think about the most."'
44757: '@r......Thinking about it, there have been many scenes about love since Beato first appeared.'
44758: '@rEven when she first appeared before Shannon, she spoke clearly about how love was the single element of the world.'
44759: '@rAnd the golden butterfly brooch she gave her......was also an item for love.'
44760: '@rShe said that she enjoyed sowing seeds of love and watching complications arise,@k and when Shannon stopped borrowing her power, the reason for her argument was also love.'
44761: '@r......After Beato''s interactions with Battler started up in full, scenes about love were toned down for a while,@k ......but the "without love, it cannot be ''seen''" definition of magic was mentioned repeatedly.'
44762: '@rThen, in the tale right before this one, where Beato had become like a doll,@k the scenes shown made it seem almost as though Battler and Beato accepted each other as adversaries......or possibly something more.'
44763: '@rIn the end, Battler regained some kind of memory, and his impression of Beato underwent a complete change.'
44764: '@r......And then there''s this game.'
44765: '@rFrom the beginning and throughout, the word "love" has been repeated over and over again.'
44766: 'Ange@r@v11/62000472."The tale you wrote keeps talking about love.@k@v11/62000473. However, that''s not the assertion of Maria onee-chan or BEATRICE.@k@v11/62000474. ......It''s the assertion of Hachijo Tohya."'
44767: 'Tohya@r@v56/64900097."......Correct.@k@v56/64900098. That is what I wanted to tell.@k@v56/64900099. And it is my own sort of "answer"."'
44768: 'Amakusa@r@v20/63000028."Answer?@k @v20/63000029.......You''re saying the entire incident of twelve years ago was caused by a trial of love started by strange demons?"'
44769: 'Ange@r@v11/62000475."Ridiculous.@k@v11/62000476. I didn''t come here to read a romance novel you wrote.@k@v11/62000477. ......What I want to know about is the truth you claim to have reached."'
44770: 'Tohya@r@v56/64900100."......Foolish child of man.@k@v56/64900101. ...I have exhausted so many words, and yet you still do not understand?"'
44771: '@rWith an obviously condescending gaze, Hachijo shrugged.'
44772: '@rIt was clear that she was trying to provoke Ange.'
44773: '@rShe was probably hinting, "If you can''t stand talking with me, you can get out."@k Perhaps even, "If you''re going to read my noble work and fail to understand it—what''s more, not even try—@kyou can get out for that reason as well."'
44774: '@r.........Under normal circumstances, Ange would already have thrown a fit and left.'
44775: '@rHowever, ......Ange couldn''t do that.'
44776: '@rThough she found it sickening that a stranger was playing around with her family''s fates in these stories,@k ......after reading this far through her tale, she was growing increasingly certain of something else.'
44777: '@r......Just as Hachijo''s followers said,@k ......this tale really did......have the same presence, the same scent, as the tales written by BEATRICE.'
44778: '@rThe author was certainly different.'
44779: '@rHowever, the tale had the same scent......because its author had arrived at the real truth...'
44780: '@rAnge was beginning to acknowledge this.'
44781: '@r......Hachijo Tohya......was one who had reached BEATRICE''s truth,@k .........an "Endless Witch" like BEATRICE, who could add to the endlessly stretching parallel worlds of the cat box...'
44782: 'Tohya@r@v56/64900102."......If one has reached BEATRICE''s truth,@k@v56/64900103. ......they can create a new tale, whoever they are.@k@v56/64900104. ......With this new manuscript, I''m sure some other than myself will appear and reach the truth.@k@v56/64900105. .........Those people will be qualified to create new tales of their own."'
44783: 'Ange@r@v11/62000478."So there will be more and more Endless Witches..."'
44784: 'Tohya@r@v56/64900106."Yes.@k@v56/64900107. And these many Endless Witches will add to BEATRICE''s cat box tale.@k@v56/64900108. ......The more they add to it, the more people will reach the truth..."'
44785: 'Tohya@r@v56/64900109."......When that happens, the very first Endless Witch, BEATRICE, will finally be rewarded for writing such long letters, packing them in bottles, and throwing them into the sea..."'
44786: 'Ange@r"................................."'
44787: 'Tohya@r@v56/64900110."......You could have yelled at me angrily and risen from your seat.@k@v56/64900111. However, you did not.@k@v56/64900112. .........Why?"'
44788: 'Ange@r@v11/62000480."I hate to admit it,@k@v11/62000481. ......but I''m starting to think that your tale has some kind of truth or hint within it."'
44789: '@rI already have my own ideas.@k@rHowever, that''s no more than looking with a single eye.'
44790: '@rUnless I accept a different viewpoint from my own and look at things from more than one angle, I''ll never be able to see the truth in three dimensions.'
44791: '@rThat''s my interpretation of "without love, it cannot be ''seen''".'
44792: 'Tohya@r@v56/64900113."That is as it should be, child of man.@k@v56/64900114. ......Perhaps, as the last surviving member of the Ushiromiya family,@k@v56/64900115. it was fated that you would find the truth and become an Endless Witch.@k@v56/64900116. ......I exist only as a guidepost to awaken you as the true successor.@k@v56/64900117. ......ANGE BEATRICE."'
44793: '@rSometimes, I have no idea what she''s saying......@k@rBut I''m positive she knows something.'
44794: '@rAnd maybe......she actually has reached the truth, as she claims...'
44795: '@r......To summarize, I couldn''t understand the truth from just the two message bottles BEATRICE left behind,@k ......and since then, I''ve been reading tale after tale of hints.'
44796: 'Ange@r@v11/62000482."Then......these "hints" are challenges, provoking me to think."'
44797: 'Tohya@r@v56/64900118.".........Precisely."'
44798: 'Ange@r@v11/62000483."Perfect.@k@v11/62000484. ......I''ll find this truth you say you''ve reached.@k@v11/62000485. ......I was meant to visit this place after all."'
44799: 'Tohya@r@v56/64900119."You were indeed.@k@v56/64900120. ......It is because you are yet to arrive there that I invited you here, child of man......"'
44800: '@rLet the truth I ''see'' and the truth you ''see'' overlap.'
44801: '@rJust as you see things with a single eye, so do I.'
44802: '@rAnd now that I''ve found you, for the first time, I too will be able to ''see'' the truth with both eyes...'
44803: 'Erika@r@v46/64500500."Fwaaah......aaaahhh...@k@|@y@v46/64500501. So, the first twilight has fiiinally happened.@k@v46/64500502. Everything so far''s made me so sleepy."'
44804: 'Battler@r@v10/60100393."......You have some sleep in your eye."'
44805: 'Erika@r@v46/64500503."Huh? Wh-where...@|@y@k@|@y@v46/64500504. ......Th-that was immature."'
44806: 'Battler@r@v10/60100394."......Hmph.@k@|@y@v10/60100395. As you wish, let''s get started.@k@v10/60100396. ......We''ll begin with the first twilight."'