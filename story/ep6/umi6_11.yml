44550: 'Shannon@r@v15/60500284."Zepar-sama, Furfur-sama.@k@v15/60500285. We have both finished our trial.@k@v15/60500286. Is that satisfactory...?"'
44551: 'Zepar@r@v51/65100076."Well, that was truly splendid!@k @v51/65100077.A faultless performance from the both of you!"'
44552: 'Furfur@r@v52/65200069."Then shall we finish with BEATRICE''s turn...?@k @v52/65200070.Oh, where did she go?"'
44553: 'Zepar@r@v51/65100078."To the victim she has chosen, of course."'
44554: '@r@v00/awase6024.""Come, let us go there as well!""'
44555: '@r......Natsuhi could be seen in her room.'
44556: '@rKrauss had instructed her to retire for the night,@k but she couldn''t afford to lie around sleeping on an important day like this.'
44557: '@rHowever, she was aware that she was the type to get excited easily,@k and that this sometimes held her husband back...'
44558: '@rSo,@w333. ......though she didn''t like it one bit,@w500. ......there was no way around it...'
44559: '@rIt was probably close to the time for the break to end and the family conference to begin once again in the dining hall.'
44560: '@rHer husband would have to protect the Ushiromiya family honor from his greedy siblings......all by himself.'
44561: '@rIf she grew emotional by his side, she would just tie him down.'
44562: '@r...Though she knew that quietly waiting here was the best way she could support him, ........that didn''t make the waiting any easier.'
44563: '@rNatsuhi opened a drawer and took out the small box she kept her treasures in.@k@rThis was her secret box.'
44564: '@rInside was everything from valuable items to mere odds and ends.'
44565: '@r......However, they were all precious, memorable treasures in Natsuhi''s eyes.'
44566: '@rShe pulled a small pouch out of the box.'
44567: '@rShe emptied its contents onto her palm.'
44568: '@r.........It was a kind of charm that her birth family had given her when she had married.'
44569: '@r...It was a spirit mirror to ward off evil.'
44570: '@rHer face was reflected in the mirror.'
44571: '@r......She wasn''t as young as she once was.'
44572: '@rRecently, she had begun to see a bit of her parents and grandparents in her own face.'
44573: '@rSo when she stared at her reflection in the mirror like this,@k she felt as though her soul had returned to the side of her parents and the family she had been born into...'
44574: 'Natsuhi@r@v03/60900005."......Father, ...Mother......@k@v03/60900006. ......I cannot support my husband......and I have only myself to blame..."'
44575: '@rOf course, her face in the mirror did not answer...@k However, Natsuhi continued.'
44576: 'Natsuhi@r@v03/60900007."......I am waiting here alone because I love my husband.@k@v03/60900008. ......However, I think love means being close to one another.@k@v03/60900009. ......Though I understand logically that staying here is the best way I can help him,@k@v03/60900010. .........I still feel wretched for doing it...@k@v03/60900011. .........It''s tough, isn''t it, ......waiting for the sake of love..."'
44577: '@rA tear plopped onto the mirror.'
44578: '@rOld, dear memories of her life at her parents'' house rose up inside her.'
44579: '@rNow was the time......for her to follow her parents'' example...'
44580: '@rWhen her father came home late, her mother would always sit up straight waiting for him, prepared for him to arrive at any moment.'
44581: '@r......She would always wait for him, kneeling in the entrance hall,@k and no matter how late he came home, she would always wake up all her children and line them up to greet him.'
44582: '@rAt the time, I only thought of her as being exceptionally strict,@k .........but at this age, I finally understand how strong she was, persevering in her love for her beloved husband even after being left alone in charge of the house.'
44583: '@r@v27/60700622."Because of your love for your husband,@k@v27/60700623. ......you couldn''t bear to be made to care for an unfamiliar child."'
44584: 'Natsuhi@r@v03/60900012."......?!?!"'
44585: '@rThe sudden voice made Natsuhi jump up and look about the room.'
44586: '@rWhen she did,@k ......there stood a Western lady wrapped in an extravagant dress.'
44587: 'Natsuhi@r@v03/60900013."Wh-......who are you?!"'
44588: 'BEATRICE@r@v27/60700624."........................"'
44589: '@rNatsuhi was confused.@k There was no one like this in this mansion.'
44590: '@rHowever, though this was supposedly her first time meeting this person, it felt as though she had seen her somewhere before...'
44591: '@rHer anger at the ruffian who had snuck into her private room...@k...and her confusion over the appearance of someone she didn''t know caused her mind to go blank,@k ......so much so that it took quite a bit of time before she realized that this was the witch of the portrait.'
44592: 'BEATRICE@r@v27/60700625."......Though you murdered a baby you didn''t know on that day 19 years ago, I won''t hold that sin against you."'
44593: 'Natsuhi@r@v03/60900014."Wh-@v03/60900015..........what are you...@v03/60900016.t-@v03/60900017.talking about......?"'
