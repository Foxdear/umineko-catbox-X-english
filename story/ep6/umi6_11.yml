44624: 'Natsuhi@r@v03/60900028."..................!!"'
44625: '@rBut Natsuhi was different.'
44626: '@rShe instantly realized that the reason for the hesitation of this unearthly being, this witch of the portrait, ......had to be the power of the mirror.'
44627: '@rSo, she rapidly crawled across the floor and picked up the mirror.'
44628: '@rThen, she stuck it out so that Beato could see it...'
44629: '@r......Beato still didn''t fully understand what was happening,@k so, still sitting down, she looked vacantly at it.'
