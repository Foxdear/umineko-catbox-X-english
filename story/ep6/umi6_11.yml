44596: '@r.........However, after discovering the fragment of the previous game,@k she had learned that there was a chance that Battler was the baby that Natsuhi had pushed off a cliff 19 years ago.'
44597: '@rAlthough that was just a blue wedge that Battler had used to protect Natsuhi from being framed,@k ......Beato thought it might have been a confession from Battler himself,@k and if that was the case, to her, Natsuhi was an enemy who probably forced Battler to live a painful life.'
44598: 'BEATRICE@r@v27/60700626."It was out of love for your husband that you killed that baby who lacked his blood, and it''s out of love that I won''t hold it against you."'
44599: 'Natsuhi@r@v03/60900018."I don''t......have a clue what you''re talking about!!@k@v03/60900019. Get out!! This is my room!!"'
44600: 'BEATRICE@r@v27/60700627."Therefore,@k@v27/60700628. ......when I kill you for the sake of my love, please don''t hold that against me either."'
44601: '@rBeato slowly stuck out her arms......and with both hands, she squeezed the air in front of her.'
44602: '@r......That squeeze......tightened around Natsuhi''s throat.'
44603: 'Natsuhi@r@v03/60900020."Ggh...@v03/60900021.......ah...@v03/60900022.......eh........."'
44604: '@rNatsuhi''s heels lifted off the ground, and a faint, purple hand shape appeared around her throat...'
44605: '@rNatsuhi frantically scratched at her throat, trying to stop whatever was strangling her, but there was nothing there.'
44606: '@r......So, to an outsider, it just looked as though Natsuhi was standing on her toes in anguish, scratching at her own throat.'
44607: 'BEATRICE@r@v27/60700629.".........Both pairs of lovers have shown their determination.@k@|@y@v27/60700630. ......I don''t think...that my feelings for Battler-san are inferior to theirs...@k@v27/60700631. ......Just as I won''t blame you for your sin of 19 years ago, ......I won''t blame myself for this sin...!"'
44608: 'Natsuhi@r@v03/60900023.".........Eh@|@y@v03/60900024..........gah@|@y@v03/60900025..........gghh..............."@|@y'
44609: '@rAs Natsuhi twisted in agony, something she had been grasping fell from her grip.'
44610: '@rIt rolled over to Beato, who dropped her gaze to see what it was...'
44611: '@r......It was......Natsuhi''s spirit mirror.'
44612: '@rWhen Beato peered into it, .........there was a loud crack like a burst of electricity.'
44613: '@rThat sound released Natsuhi from the invisible hands...@kand made Beato topple backwards like a doll.'
44614: 'Natsuhi@r@v03/60900026."*cough*...*cough*cough*......?!@k @v03/60900027.........................?!??"'
44615: '@rCoughing, Natsuhi tried to comprehend what was going on around her.'
44616: '@rBeato, whose head was still reeling and foggy as though she had hit it against something hard,@k slowly attempted to get to her feet.'
44617: '@rHer eyes were bewildered, as though even she didn''t really understand what had happened.'
44618: 'BEATRICE@r@v27/60700632."......Wh-......what...@k@v27/60700633.............what is this......?"'
44619: 'Elder BEATRICE@r@v60/60700634."That is...surprising......@k@v60/60700635. You could touch spiderwebs without trouble, ......but you cannot handle the spirit mirror...?"'
