44487: 'Kanon@r@v16/60600300."Sleep well, ......Rosa-sama.@k@v16/60600301. ......Your hell...has ended."'
44488: '@rKanon took a blanket out of a cupboard...@w500.......and gently covered Rosa with it...'
44489: '@rIt would have looked to anyone...@k...just as though Rosa was sleeping peacefully......'
44490: '@r......Those demons had not exaggerated when speaking of love as a battle and a trial.'
44491: '@rIn fact, although cruel, this could even be said to be an honest reflection of reality,@k in the sense that it made no attempt to hide the fact that to lose in love is to die...'
44492: 'Kanon@r@v16/60600302."......Now my part is complete.@k@v16/60600303. ......Were you watching, demons?"'
44493: 'Kanon@r@v16/60600304."......Oh......no.........!"'
44494: 'Maria@r@v13/60400135."How could you kill Mama?!!@k @|@y@v13/60400136.HOW COULD YOU KILL MAMAAAAAAAAAAAAAAAAAAWAAAAAAAAAAAAAAHH!!!"'
44495: '@rOne of the two great witches of Mariage Sorciere, MARIA.@k@rThough she was just an apprentice, the power sleeping within her had impressed even BEATRICE at the height of her strength.'
44496: '@rIn MARIA''s eyes, though Rosa was the black witch,@k ......she was also the vessel of the mother she couldn''t help but love.'
44497: '@rHer anger at having that stolen from her was near madness.'
44498: 'Maria@r@v13/60400137."How could you do that to Mama, to Mama to Mama to Mama!!@k @v13/60400138.Nngggyyyyyyaaaaaaaaaaaaaaaaahh!!!"@|@y'
44499: '@rMARIA''s attack was too emotional.'
44500: '@rBecause of this, she didn''t notice that Kanon had already disappeared in the span of a few short moments,@k ...and she released her barrage at what had become empty space.'
44501: '@rIn the meantime, Kanon jumped from wall to wall, around to MARIA''s back...'
44502: 'Maria@r@v13/60400139."...............Huh...h...?"'
