44513: 'Kanon@r@v16/60600311."D-......dammit......!"'
44514: '@rMARIA finally noticed where Kanon was, and she slowly turned around...'
44515: '@rKanon made his sword materialize yet again,@k@|@y but no matter how often he tried, it kept fading out, like a flashlight with a bad battery...'
44516: 'Maria@r@v13/60400142."I won''t let you get away now......@k@v13/60400143. ......I won''t forgive you.........for the sin of stealing Mama away...@k@|@y@v13/60400144. ......I''ll kill you.@k@v13/60400145. ...Just like Mama killed them, ...I''ll kill you without mercy!!!"'
44517: '@rAs MARIA howled, the entire parlor was surrounded by a cube of red, magic barriers.'
44518: '@rIt was a locked room symbolizing a barrier that Kanon could never escape.'
44519: 'Kanon@r@v16/60600312."......Dammiiiiiit...!!@k @v16/60600313.Not......here......!"'
44520: '@rKanon cursed his bad luck.'
44521: '@rEven though he had fulfilled his goal in the demons'' trial,@k ......if he was killed here, he''d be dragged off of the game board...!'
44522: 'Sakutarou@r@v33/64200021.".........MARIA.@k@v33/64200022. ......Don''t overdo it."'
44523: 'Maria@r@v13/60400146."Yeah, I won''t overdo it.@k@v13/60400147. ......I''ll be a little more gentle than Mama was.@k@|@y@v13/60400148. ......Kuhihihihihihihhi,@v13/60400149. hahahahahaahahahahaah@v13/60400150.hahaahahahahahahyahaaaaaahaahh!!!"'
44524: 'Maria@r@v13/60400151."......?!?!"'
44525: 'Sakutarou@r@v33/64200023."Uryu, who is it?!"'
44526: 'Shannon@r@v15/60500273."......Pardon me, Maria-sama...@k@|@y@v15/60500274. In accordance with the contract with Zepar-sama and Furfur-sama, I come for your life...!"'
44527: 'Maria@r@v13/60400152."Shannon, ......don''t get...@v13/60400153....in my wayyyyyyyyyyyy!!"@|@y'
44528: 'Sakutarou@r@v33/64200024."It''s pointless, Shannon.@k@|@y@v33/64200025. ......No one can target MARIA...!"'
44529: 'Shannon@r@v15/60500275."Yes.@k@v15/60500276. I don''t intend to target her in any way.@k@|@y@v15/60500277. ......I will simply protect myself."'
44530: '@rA cylindrical red magical barrier surrounded Shannon as she stood in the center of the parlor.'
44531: '@rIts brightness and thickness grew, and its radius quickly expanded, filling up the room.'
44532: '@rIt wasn''t targeting MARIA.@k@rShannon was wielding this power to protect herself.'
44533: '@rSo, Sakutarou''s power didn''t make it disappear.'
44534: 'Kanon@r@v16/60600314.".........N-......Nee-san......"'
44535: 'Shannon@r@v15/60500278."Are you going to let this be the ruin of your feelings for Milady?@k @v15/60500279.......Get ahold of yourself...!"'
44536: 'Maria@r@v13/60400154."Ugh, ......ghgh, gghh.........!!"'
44537: 'Sakutarou@r@v33/64200026."Uryu...uu.........!!"'
44538: '@rBy now, the shield with Shannon at the center had covered up the entire room.@k Its power crushed MARIA and Sakutarou into the corner of the room.'
44539: '@rIronically, it was the locked-room barrier MARIA had set up to prevent Kanon from escaping that they were pressed against, and the two together had them completely trapped.'
44540: 'Sakutarou@r@v33/64200027."...No...good......@v33/64200028. ...Can''t......escape......"@|@y'
44541: 'Maria@r@v13/60400155."......*cackle*cackle*, kuhihihihihihiihihihihhihihiihi!!@k @v13/60400156.That''s right, this is a locked room...@k@|@y@v13/60400157. ......Kihihihihihihihihihihi!@k @v13/60400158.This might be just perfect for that wannabe detective who''s trying to deny Beato''s magic."'
44542: 'Shannon@r@v15/60500280.".........Checkmate, Maria-sama.@k@v15/60500281. ......May I?"'
