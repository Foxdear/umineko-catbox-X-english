44677: 'Natsuhi@r@v03/60900040."S-......someone!!@k @v03/60900041.Help me!!@k @v03/60900042.Someoooooooone!!"'
44678: '@rNow that the spirit mirror she had been relying on had been smashed, and another strange demon had been added to the fold, Natsuhi could do nothing but run for it.'
