44668: 'BEATRICE@r@v27/60700648."......So I can''t...lose here...!@k @v27/60700649.Because I......was born for Battler-san''s sake...!!"'
44669: 'Zepar@r@v51/65100082."Yes, that is exactly—"'
44670: 'Furfur@r@v52/65200074."What we wanted to hear."'
44671: 'Natsuhi@r@v03/60900039.".........Ah...?!"'
44672: '@rFollowing a sound like a beetle banging off all the walls in the room,@k the spirit mirror was knocked out of Natsuhi''s outstretched hand.'
44673: '@rIt fell onto the floor,@k ......and the stake flying around the room pierced through it with a crash.'
44674: 'Lucifer@r@v38/62300003."Lucifer of Pride, right here!@k @|@y@v38/62300004.......You dare mock me by having a single old mirror as my first target in so long?"'
44675: 'BEATRICE@r@v27/60700650.".........Huh?!@k @v27/60700651.Ah, ......Lucifer...san......?"'
