41250: '@r......On Rokkenjima, this day—@w416.or rather, this time around—@w583.was the same as any other.'
41251: '@rThe typhoon would be coming very soon.@k@rThe clouds hadn''t yet grown thick, but they were moving quickly.'
41252: '@rThe only thing on Natsuhi''s mind was the plan to cover up Kinzo''s absence this year as well.'
41253: '@rKrauss appeared to have suffered a stomachache from the stress and was resting in his room.'
41254: '@rJessica and Kumasawa had left in a boat to go shopping and greet the incoming relatives on Niijima.'
41255: '@rThe servants had been busy since the early morning in preparation for the family conference, the greatest event of the year...'
41256: '@rShannon and Kanon were getting the guesthouse ready.'
41257: 'Kanon@r@v16/60600001."......Shouldn''t the guest rooms in the mansion be more than enough to hold the relatives?"'
41258: 'Shannon@r@v15/60500001."Good point.@k@v15/60500002. It is a pain to clean up here as well.@k@|@y@v15/60500003. ......Even so, I like cleaning the guesthouse."'
41259: 'Kanon@r@v16/60600002."Yeah, it''s nice and quiet without Madam and all the annoying servants."'
41260: '@rShannon gave a non-committal smile as she performed a detailed examination of the guest room.'
41261: '@rDid we forget to clean anything? Do we need to restock anything?@k@rShe diligently gave the room one final check over......'
41262: 'Kanon@r@v16/60600003."You checked everything thoroughly last night too, didn''t you?@k@v16/60600004. You really are dedicated."'
41263: 'Shannon@r@v15/60500004."It''s on days like this when you tend to get pranked if you''re careless.@k@v15/60500005. ......You can never find important things when you need them,@k@v15/60500006. and things that were supposed to be closed turn out to be open."'
41264: 'Kanon@r@v16/60600005."That''s because you''re too careless.@k@v16/60600006. You don''t pay attention while you work."'
41265: 'Shannon@r@v15/60500007."I guess that''s why you''re helping me check.@k@v15/60500008. Thanks."'
41266: 'Kanon@r@v16/60600007."......There''s nothing to thank me for.@k@v16/60600008. If you were a bit more alert, I wouldn''t have to help at all."'
41267: 'Shannon@r@v15/60500009.".........*giggle*.@k@v15/60500010. But the truth is, you just want to be with me, right?@k @v15/60500011.You''re such a kid."'
41268: 'Kanon@r@v16/60600009."Th-that''s not it at all...@k@v16/60600010. It''s all because you''ve been so ecstatic about George-sama lately.@k@v16/60600011. You''re messing up so much, I can''t let you out of my sight."'
41269: 'Shannon@r@v15/60500012."*giggle*...@k@v15/60500013. ......Kanon-kun.@k@v15/60500014. Let''s chat a bit."'
41270: 'Kanon@r@v16/60600012."......We can''t do that now. We''re working."'
41271: 'Shannon@r@v15/60500015."You keep making fun of me and George-sama,@k@v15/60500016. ......but how is it going between you and Jessica-sama?"'
41272: 'Kanon@r@v16/60600013."N-......nothing''s going on in particular.@k@v16/60600014. If you have time to talk about that, let''s just finish this...@k@v16/60600015.......wah—"'
41273: '@rKanon was—very obviously—trying to change the subject.@k@rSo Shannon snuck up behind him and pushed him down onto the bed.'
41274: 'Shannon@r@v15/60500017."Why did you turn down Milady when she asked you to go with her to welcome the relatives?"'
41275: 'Kanon@r@v16/60600016.".........Because I have work to do..."'
41276: 'Shannon@r@v15/60500018."Liar.@k@|@y@v15/60500019. ......You don''t actually have any work at all."'
41277: '@rShannon and Kanon had switched roles.'
41278: '@rNormally, Kanon was the one in control, but when it came to romance, it was the opposite.'
41279: '@rAs Shannon had said, ......Jessica and Kanon were supposed to have been the ones to go greet the relatives at the Niijima harbor.'
41280: '@rHowever, Kanon had suddenly claimed that he had work to do, so Kumasawa had gone instead.'
41281: '@rKanon...didn''t have any work to do.@k Shannon knew this...'
41282: 'Shannon@r@v15/60500020."Milady told me.@k@v15/60500021. ......Despite everything that happened after the cultural festival, her feelings for you haven''t changed."'
41283: 'Kanon@r@v16/60600017."............Even though I''m...furniture..."'
41284: 'Shannon@r@v15/60500022."That''s right.@k@v15/60500023. And I''m furniture too."'
41285: 'Kanon@r@v16/60600018."......And yet you''re in love with a Human.@k@v16/60600019. ......Even though that''s never going to be possible."'
41286: 'Shannon@r@v15/60500024."You think so...?@k@v15/60500025. ......Maybe thinking that way...@v15/60500026....is what makes us furniture."'
41287: 'Kanon@r@v16/60600020."I don''t have any special feelings for Milady Jessica.@k@v16/60600021. ......I only think of her as the daughter of the family we serve."'
41288: 'Shannon@r@v15/60500027."Really...?"'
41289: 'Kanon@r@v16/60600022."Really."'
41290: 'Shannon@r@v15/60500028."........................"'
41291: 'Kanon@r@v16/60600023."......Wh-......what?"'
41292: 'Shannon@r@v15/60500029."You know,@k@v15/60500030. ............there is a chance...@k@v15/60500031.that George-sama will propose to me tonight."'
41293: 'Kanon@r@v16/60600024."...............!"'
41294: '@rShannon wore an incredibly peaceful smile on her face,@k ......but Kanon could tell that there was no way she''d let him change the subject.'
41295: '@rKanon realized that she must have made him help out here in the guesthouse in order to talk to him about this, and he clicked his tongue softly...'
41296: 'Kanon@r@v16/60600025."......You really think you can marry a Human even though you''re furniture?"'
41297: 'Shannon@r@v15/60500032."I think I can."'
41298: 'Kanon@r@v16/60600026."That''s impossible."'
41299: 'Shannon@r@v15/60500033."Why?"'
41300: 'Kanon@r@v16/60600027."That dream future that George-sama has imagined for you two...is something you can never give him."'
41301: 'Shannon@r@v15/60500034."W-......well......"'
41302: 'Kanon@r@v16/60600028."......We aren''t Humans.@k@v16/60600029. We''re furniture, inferior to them.@k@v16/60600030. George-sama only thinks that you''re Human."'
41303: 'Shannon@r@v15/60500035."...W-......well, that is true, but......"'
41304: 'Kanon@r@v16/60600031."I''m impressed that you''ve managed to trick him for this long.@k@|@y@v16/60600032. Do you really think you can keep tricking him like that forever?@k @v16/60600033.Even though you still haven''t been able to tell him that you''re furniture."'
41305: 'Shannon@r@v15/60500036."......Being furniture or being Human...has nothing to do with this.@k@v15/60500037. ......I believe that George-sama will accept all of me."'
41306: 'Kanon@r@v16/60600034."And yet you don''t have the courage to check and make sure."'
41307: 'Shannon@r@v15/60500038."........................@k@v15/60500039. ......You know,@k @v15/60500040.......I''m planning on...@v15/60500041.saying yes."'
41308: '@rAs Shannon looked up at the ceiling, ......she spoke of the imagined future that she and George would create.'
41309: '@rThough some anxiety over the future appeared on her face,@k ......so did joy from discovering what it was like to live with love.'
41310: '@rAs Kanon watched this vivid dream he was being shown,@k ......he knew that none of his words would reach Shannon anymore...'
41311: 'Kanon@r@v16/60600035."......Hmph.........@k@v16/60600036. ...You can just do what you want.@k@|@y@v16/60600037. ......Once you''ve said something, you''re incredibly stubborn."'
41312: 'Shannon@r@v15/60500042."Yep.@k@v15/60500043. ......I want to live life my own way.@k@|@y@v15/60500044. ......I''ve decided to stop worrying...@k@v15/60500045.about who''s furniture and who''s a Human."'
41313: 'Kanon@r@v16/60600038."........................"'
41314: '@rKanon walked over to the window silently.'
41315: '@r......He saw the rose garden filled with boring, gray flowers in bloom...'
41316: '@rHe understood that Shannon was acting above her place.'
41317: '@rAnd he knew that her tale had no chance of a happy ending.'
41318: '@r......However, he also knew that now Shannon had made her decision,@k no words of his could change her mind.'
41319: 'Kanon@r@v16/60600039.".........In that case,@v16/60600040. ......it doesn''t matter what I say.@k@v16/60600041. ......If I tell you to stop, you won''t listen.@k@v16/60600042. If I tell you to do what you want, you''ll do what you want.@k@v16/60600043. ......Why are you talking to me about this?@k@v16/60600044. It''s not like you care what my response is."'
41320: 'Shannon@r@v15/60500046."What I want to know...@v15/60500047....is how you feel about Milady."'
41321: 'Kanon@r@v16/60600045."......I have nothing to do with the two of you."'
41322: 'Shannon@r@v15/60500048."Do you really...@v15/60500049....feel absolutely nothing...@v15/60500050.for Milady?"'
41323: 'Kanon@r@v16/60600046."......No, I don''t, as I keep telling you."'
41324: 'Shannon@r@v15/60500051."Liar."'
41325: 'Kanon@r@v16/60600047."Why do you think that''s a lie?"'
41326: 'Shannon@r@v15/60500052."I know.@k@v15/60500053. I''m your big sister."'
41327: 'Kanon@r@v16/60600048."You don''t know.@k@v16/60600049. You can''t know what I''m feeling...!!"'
41328: 'Shannon@r@v15/60500054."I do.@k@v15/60500055. I know everything about you, Kanon-kun."'
41329: 'Kanon@r@v16/60600050."If you really do know, then why are you asking?!@k @v16/60600051.Your head and heart are already full with your feelings for George-sama!!@k @v16/60600052.And that single-hearted devotion is what I love about you!!@k @v16/60600053.That''s why......I''m rooting for you in the only way I can, you know that!!@k @v16/60600054.Otherwise, ......even I...!!"'
41330: 'Shannon@r@v15/60500056."Even I?"'
41331: 'Kanon@r@v16/60600055."Even I...@v16/60600056..........would have loved to fall for Milady...!!!"'
41332: '@rKanon finally turned to face her, honestly and openly telling her his real emotions.'
41333: '@rThat was what Shannon had wanted to hear.@k@rAnd having heard it, she closed in even further on Kanon''s true feelings.'
41334: 'Shannon@r@v15/60500057."No, you can''t word it that way.@k@v15/60500058. I won''t let you."'
41335: 'Kanon@r@v16/60600057."Then what do you want from me?!!@k @v16/60600058.What am I supposed to say?!!"'
41336: 'Shannon@r@v15/60500059."Don''t try to dodge by saying "I would have loved to fall for her".@k@v15/60500060. All you need to do is honestly tell me what you really feel."'
41337: 'Kanon@r@v16/60600059."Milady is......too dazzling for me!!@k @v16/60600060.The way she lives is blinding like the sun!!@k @v16/60600061.That''s what I love about her...!@k @v16/60600062.I was so happy when Milady stretched out her hand and asked me to walk with her!!@k @v16/60600063.No, I still am happy!!"'
41338: 'Shannon@r@v15/60500061."You love her, don''t you?"'
41339: 'Kanon@r@v16/60600064."Yes, I do!!@k @v16/60600065.I love Milady!!"'
41340: '@rFinally,@w500. ......Kanon confessed his feelings in their entirety.'
41341: '@rIn fact, by saying it aloud, he finally understood how he truly felt.'
41342: '@rAs passionate tears welled up in his eyes,@w583. ......Kanon finally accepted it...'
41343: '@rHe couldn''t stop the tears from dripping down his face.'
41344: 'Kanon@r@v16/60600066."Milady was exactly like me, locked up on Rokkenjima and living without any hope at all...!@k @v16/60600067.And yet, she was able to light her own path and create her own fate...!@k @v16/60600068.She was so dazzling that I envied her!!@k @v16/60600069.I felt as though, if I could be with her, ......I could find my true self, instead of the pitiful person I am now...!!"'
41345: 'Shannon@r@v15/60500062."When you turned down Milady''s confession,@k@v15/60500063. ......were you sad?"'
41346: 'Kanon@r@v16/60600070."I was!!@|@y@k @v16/60600071.I never realized that lying to yourself could be so sad, so painful, so excruciating!!@k @v16/60600072.And I just couldn''t forgive myself for hurting Milady with that lie!!@k @v16/60600073.I believed that I didn''t have any right to fall in love ever again!!"'
41347: 'Shannon@r@v15/60500064."But you do.@k@v15/60500065. The right to love...@k @v15/60500066.is something only you can give yourself.@k@v15/60500067. Being furniture or not has nothing to do with it.@k@v15/60500068. If you tell yourself "no", then it''ll never happen.@k@v15/60500069. You mustn''t think that way.@k@v15/60500070. That''s why I gave myself, impudent furniture that I am, the right to fall in love.@k@v15/60500071. And you have it too."'
41348: 'Kanon@r@v16/60600074."The right to fall in love?"'
41349: 'Shannon@r@v15/60500072."Yes.@k@v15/60500073. If you can''t give it to yourself, then I will."'
41350: 'Kanon@r@v16/60600075."Thank you.@k@v16/60600076. ......I...@v16/60600077.feel as though...@v16/60600078.I can finally...@v16/60600079.see the sea......"'
41351: 'Shannon@r@v15/60500074."......I''m certain.@k@v15/60500075. Tonight, George-sama...@k@v15/60500076.will propose to me."'
41352: 'Kanon@r@v16/60600080.".............................."'
41353: 'Shannon@r@v15/60500077."When he does, I will accept.@k@v15/60500078. ......I intend to leave this island and start a new life in a new world."'
41354: 'Kanon@r@v16/60600081."If that''s the path you''ve chosen,@k@v16/60600082. ......then I have no say in the matter."'
41355: 'Shannon@r@v15/60500079."I''ll leave this island, ......and I''ll never return again.@k@v15/60500080. ......It will mean saying farewell to you, Kanon-kun."'
41356: 'Kanon@r@v16/60600083."...........................@k@v16/60600084. ......You''re right.@k@v16/60600085. ......We won''t......see each other again, will we?"'
41357: 'Shannon@r@v15/60500081."If...@k@v15/60500082....if you do love Milady from the bottom of your heart, and if you can honestly say that your feelings are at least as strong as the ones I have for George-san,@k@v15/60500083. .........then you and I need to settle this."'
41358: 'Kanon@r@v16/60600086."......N-.........nee-san......"'
41359: 'Shannon@r@v15/60500084."This way is best for both of us.@k@v15/60500085. ..........Don''t give up on your feelings on account of me."'
41360: 'Kanon@r@v16/60600087."Even though my selfishness might keep you from your happiness......?"'
41361: 'Shannon@r@v15/60500086."I''m fully aware of it.@k@v15/60500087. ......My happiness......is hurting you as well."'
41362: '@rWe have no choice but to hurt each other.'
41363: '@rAs she said this, Shannon turned her back to Kanon...'
41364: '@rAs Kanon watched Shannon from behind,@w500. ......he was struck by her strength...@w416....and the sisterly love she showed in still thinking of him despite everything.'
41365: 'Kanon@r@v16/60600088."......Nee-san.@k@|@y@v16/60600089. Living with you...made me happy."'
41366: 'Shannon@r@v15/60500088."Me too.@k@v15/60500089. I wouldn''t have lasted this long without you.@k@|@y@v15/60500090. ......And that''s why I was able to meet George-san."'
41367: 'Kanon@r@v16/60600090."Yeah.@k@v16/60600091. And I wouldn''t have realized how dazzling Milady is......if it weren''t for you."'
41368: 'Shannon@r@v15/60500091."I won''t abandon my emotions.@k@|@y@v15/60500092. ......I''ll focus only on my feelings and ignore everything else, and I won''t look away when I trample over your heart."'
41369: 'Kanon@r@v16/60600092."......Me too. I won''t use you as an excuse...@v16/60600093....to hide the way I really feel."'
41370: 'Shannon@r@v15/60500093."Whether my love bears fruit...@k@v15/60500094.or yours does,@k@v15/60500095. ......let''s each agree to celebrate the other."'
41371: 'Kanon@r@v16/60600094."Yes.@k@v16/60600095. ......I promise.@k@v16/60600096. And if I win,@k@v16/60600097. ......I will love Milady......and treasure you."'
41372: 'Shannon@r@v15/60500096."Thank you.@k@v15/60500097. But if I win,@k@v15/60500098. ......I''ll forget you and this island and leave this place forever."'
41373: 'Kanon@r@v16/60600098."Yes.@k@v16/60600099. ......Whichever of us wins,@k@v16/60600100. that person will pursue their love with all they''ve got.@k@|@y@v16/60600101. ......Even if they know that love will be unrequited."'
41374: 'Shannon@r@v15/60500099."Yes.@k@v15/60500100. After all..."'
41375: '@r@v00/awase6004.""We are furniture...no more.""'
41376: '@rThe boat carrying the relatives docked at Rokkenjima''s harbor.'
41377: '@rThey left the boat one by one, making fun of Battler...'
41378: '@rGohda wasn''t the only one to greet them. Kanon was there too.'
41379: 'Gohda@r@v17/61700001."It has been quite some time, everyone.@k@v17/61700002. Allow me to welcome you to Rokkenjima."'
41380: 'Kanon@r@v16/60600103."......I hope that your long journey went smoothly.@k@v16/60600104. Welcome to Rokkenjima......"'
41381: 'Gohda@r@v17/61700003."Ah, good, good."'
41382: '@rGohda complimented Kanon in a whisper.'
41383: '@rKanon ignored this, looking just a little sour, and continued to greet the incoming relatives.'
41384: 'George@r@v07/60300001."This is your first time meeting Gohda-san and Kanon-kun, isn''t it, Battler-kun?"'
41385: 'Maria@r@v13/60400001."Uu!@k @v13/60400002.It''s my first time meeting Battler too!@k @v13/60400003.*giggle*giggle*!"'
41386: 'Rudolf@r@v08/61200001."Gohda-san''s a splendid chef.@k@v08/61200002. He''s the only reason anyone''d ever want to come to this island."'
41387: 'Gohda@r@v17/61700004."I am most honored.@k@v17/61700005. Battler-sama, I do hope that you look forward to your meals during your stay."'
41388: 'Battler@r@v10/60100147."I can''t wait...!@k @v10/60100148.I''ll be looking forward to it!"'
41389: 'Rosa@r@v12/61400001."It''s good to see you again, Kanon-kun.@k@v12/61400002. You seem to be in high spirits today.@k@v12/61400003. That''s great."'
41390: 'Kanon@r@v16/60600105."......Y-you think so...?"'
41391: 'Kyrie@r@v09/61300001."Oh yes. Your face is looking brighter today.@k@v09/61300002. I can''t tell if it''s your complexion or if your gaze looks a bit more gallant."'
41392: 'Rudolf@r@v08/61200003."Hahah, it must be a growing phase.@k@|@y@v08/61200004. That''s how a boy becomes a man."'
41393: 'Eva@r@v05/61000001."You usually look as though you''re about to pass out from anemia.@k@v05/61000002. You''re a bit different today."'
41394: 'Hideyoshi@r@v06/61100001."You''ve got some vigor.@k@v06/61100002. A boy can change a lot in just three days.@k@v06/61100003. I guess this means even Kanon-kun''s gettin'' a bit more manly!"'
41395: 'Rosa@r@v12/61400004."We aren''t making fun of you, okay?@k@v12/61400005. We''re all complimenting you. *giggle*"'
41396: '@r......Kanon had sworn that starting today, he would start changing the way he lived bit by bit.'
41397: '@rHowever, he had only meant to change within himself, and hadn''t expected that it would show on the outside.'
41398: '@rHe was a bit shocked to hear that his expression had changed so much...@kthat people had apparently noticed as soon as he opened his mouth.'
41399: '@rNo,@k ......maybe the real surprise should have been that his normal expression looked so incredibly sullen in comparison.'
41400: '@rGohda led the way up to the guesthouse.@k@rKanon brought up the rear, helping to carry some of Kumasawa''s shopping.'
41401: 'Kanon@r@v16/60600106."......Does my...face really look that bright today?"'
41402: 'Kumasawa@r@v18/61800019."Hoh-hoh-ho...@k@v18/61800020. It looks that way to me as well.@k@|@y@v18/61800021. ......Did something good happen?@k @v18/61800022.*giggle*giggle*."'
41403: '@rEven Kumasawa was saying it.'
41404: '@r......Kanon, unable to see what his own face looked like, hung his head in embarrassment.'
41405: '@r......When they reached the rose garden, they could see the others entering the guesthouse.'
41406: '@rThen, he saw Jessica running towards him from there.'
41407: '@r......Is even Milady Jessica going to say that I''m in a good mood today?'
41408: '@rKanon hung his head even deeper.'
41409: '@rAnd so, almost as though he couldn''t control himself, Kanon spoke first.'
41410: 'Kanon@r@v16/60600107."......Do I really look that different?"'
41411: 'Jessica@r@v04/60200001."Huh?@k @v04/60200002.A...hahahahahaha.@k@|@y@v04/60200003. ......Well, you know.@k@v04/60200004. You aren''t usually the type to come out and say hello of your own accord.@k@v04/60200005. That''s probably why everyone was surprised..."'
41412: 'Kanon@r@v16/60600108.".....................@k@v16/60600109. ......I apologize for not going with you earlier, Milady."'
41413: 'Jessica@r@v04/60200006."Huh?@k @v04/60200007.Oh, don''t worry about that...@k@v04/60200008. I''m the one who''s sorry for asking you to come all the way out to Niijima with me just to meet everyone...@k@v04/60200009. I know how busy you must be today..."'
41414: 'Kanon@r@v16/60600110."I......didn''t have anything in particular to do.@k@v16/60600111. ......You were just so dazzling.@k@v16/60600112. ...So dazzling that I couldn''t bear to be with you.@k@v16/60600113. ......I was just weak."'
41415: '@rJessica faltered, uncertain what Kanon was talking about.@k@rHowever, she realized that this was something too important to be laughed off.'
41416: 'Jessica@r@v04/60200010."......Did something happen, Kanon-kun...?"'
41417: 'Kanon@r@v16/60600114."Shannon says...@v16/60600115....she''s going to get married."'
41418: 'Jessica@r@v04/60200011.".........I see.@k@v04/60200012. ...So George nii-san is going to propose this year."'
41419: '@rJessica thought that this change in Kanon''s appearance was probably caused by a change in his state of mind. She thought he was sad that he and Shannon would soon be parting ways.'
41420: '@rKanon realized that Jessica was probably thinking this.'
41421: '@r......So, he spoke to her clearly and honestly.@k Because he wanted her to know.'
41422: 'Kanon@r@v16/60600116."I had long decided that if Nee-san ever quit...@k@v16/60600117.I would stop working here as well."'
41423: 'Jessica@r@v04/60200013."......I know.@k@v04/60200014. ...So, are you going to quit too?"'
41424: 'Kanon@r@v16/60600118."I''m not sure anymore.@k@v16/60600119. ......I feel that, if I quit, I might again lose sight of......something that your dazzling sunlight revealed to me."'
41425: '@rJessica was stunned, unable to understand what he was saying.'
41426: '@r......However, she did realize that he was trying to tell her something important.'
41427: '@rAnd so, she was able to accept that his next words were neither a lie nor a joke...'
41428: 'Kanon@r@v16/60600120."Milady Jessica, I...love you."'
41429: 'Jessica@r@v04/60200015.".........I,@v04/60200016. .........I love you too...!"'
41430: 'Kanon@r@v16/60600121."You live your life like the sun...and I want to try walking that path alongside you.@k@v16/60600122. I have the feeling that, with you, I''d be able to get away from the part of myself that regarded me with contempt and called me furniture."'
41431: 'Jessica@r@v04/60200017."You aren''t furniture, Kanon-kun.@k@v04/60200018. And you weren''t born just so you could become a servant!@k @v04/60200019.A boy your age should have the right to enjoy life much, much more...!@k @v04/60200020.Ha...hahahaha.@k@v04/60200021. I''m the one who''s dazzled.@k@v04/60200022. You''re so dazzling......I can hardly see."'
41432: 'Kanon@r@v16/60600123."These are my genuine feelings.@k@v16/60600124. .........I''m...sorry for trying to hide them for so long.@k@v16/60600125. ......I apologize for hurting you on that day...in my cowardice."'
41433: 'Jessica@r@v04/60200023."That''s okay.@k@v04/60200024. Just hearing you say that......makes me happy."'
41434: 'Kanon@r@v16/60600126."So,@k@v16/60600127. ......in order that I can continue to be with you,@v16/60600128. ......I plan to stop being furniture.@k@|@y@v16/60600129. I ask that you give me some time to do that.@k@v16/60600130. ......Please forgive this last bit of weakness."'
41435: 'Jessica@r@v04/60200025."Th-there''s nothing weak about you...!@k @v04/60200026.You''ve shown me.@k@v04/60200027. You''ve shown me incredible courage by saying you want to change yourself from the way you used to be.@k@v04/60200028. So, I''ll support you until the end, and I won''t rush you until you''re ready."'
41436: 'Jessica@r@v04/60200029."......If I''m the sun lighting your path,@k@v04/60200030. that''s because I wanted to shine more brightly than anyone else so that you''d look only at me.@k@v04/60200031. Without you, I''d never have become like the sun.@k@v04/60200032. ......So, I''ll wait.@k@v04/60200033. As long as needed."'
41437: 'Kanon@r@v16/60600131."Thank you, Milady."'
41438: 'Jessica@r@v04/60200034."......I...don''t want to be ''Milady'' to you anymore."'
41439: 'Kanon@r@v16/60600132."May I......call you by your name?"'
41440: 'Jessica@r@v04/60200035."Sure.@k@v04/60200036. .........Oh, but only when we''re alone, okay?@k @v04/60200037.Otherwise, ...it might make things difficult for you."'
41441: 'Kanon@r@v16/60600133."......Good point.@k@v16/60600134. Nee-san and George-sama are doing the same, it seems."'
41442: 'Jessica@r@v04/60200038."If Shannon hadn''t told you about the engagement, ......you wouldn''t have said what you said just now, right?"'
41443: '@rKanon hung his head, at a loss for words for some time.'
41444: '@rBut it was true.'
41445: '@rIf Shannon hadn''t told him about the engagement, he probably wouldn''t have been having this conversation at this moment.'
41446: 'Kanon@r@v16/60600135.".........No, I wouldn''t.@k@|@y@v16/60600136. ...Her words...allowed me to think seriously."'
41447: 'Jessica@r@v04/60200039."Ah, come on.@k@v04/60200040. You heard about Shannon and you wanted to see what love felt like yourself, right?"'
41448: 'Kanon@r@v16/60600137."Yes."'
41449: 'Jessica@r@v04/60200041."......Th-that''s a pretty straight answer.@k@v04/60200042. ......W-......well,@k@v04/60200043. when I watched those two, uh......I was pretty envious myself..."'
41450: '@rIn truth, the real reason was different for both of them.'
41451: '@rThey had been shown the courage that was needed to confess to the one they loved.'
41452: '@rThis was the reason for both Kanon and Jessica.'
41453: 'Kanon@r@v16/60600138."......So, ......what should I...call you?"'
41454: 'Jessica@r@v04/60200044."Just "Jessica" would be nice."'
41455: 'Kanon@r@v16/60600139."......Just saying it like that......would be a bit embarrassing."'
41456: 'Jessica@r@v04/60200045."Then you can use "san", at least at first.@k@v04/60200046. Why not try it out? Come on."'
41457: 'Kanon@r@v16/60600140."J-.........Jessica-san......"'
41458: 'Jessica@r@v04/60200047."Yeah. That''ll do for now.@k@v04/60200048. And I''d like to call you by your name, Kanon-kun.@k@v04/60200049. ......You have a real name...besides Kanon, don''t you?@k @v04/60200050.I''ll bet it has @bon.@<嘉@> in it, like Kanon does...@k@v04/60200051. Wh-what could it be, ......ehehe..."'
41459: 'Kanon@r@v16/60600141."......My name is @bYoshiya.@<嘉哉@>."'
41460: 'Jessica@r@v04/60200052."U-......umm, ......how do you write it?"'
41461: '@rJessica tried tracing out various characters on the palm of her hand.@k@r......Then, Kanon used his own finger to write out his name on her hand...'
41462: 'Kanon@r@v16/60600142."Like this...Yoshiya."'
41463: 'Jessica@r@v04/60200053."......So, you''re Yoshiya...kun...@k@v04/60200054. ......Yeah, that''s a great name.@k@v04/60200055. ......Totally better than my weird name..."'
41464: 'Kanon@r@v16/60600143."That''s not true.@k@v16/60600144. Your name, Jessica, is just as—"'
41465: 'Jessica@r@v04/60200056."Hey, say that again...!"'
41466: 'Kanon@r@v16/60600145."Huh?@k @v16/60600146.......Y-your name, Jessica, is—"'
41467: 'Jessica@r@v04/60200057."One more time!"'
41468: 'Kanon@r@v16/60600147."Y-your name, Jessica, is just as......um, ......is something wrong?"'
41469: 'Jessica@r@v04/60200058."......*giggle*.@k@v04/60200059. It''s nothing.@k@v04/60200060. Thanks.@k@v04/60200061. ...Yoshiya...kun."'
41470: '@rThe red, red flowers of the rose garden seemed to celebrate the two lovers whose feelings had finally connected...'
41471: '@r......The scene was watched by one not human, who gazed out quietly from beneath the rose garden arbor...'
41472: 'BEATRICE@r@v27/60700059.".............................."'
41473: '@rCome to think of it, those two had never called each other by their names until now.'
41474: '@rJessica hadn''t known Kanon''s true name.@k@rKanon hadn''t called Jessica by her name.'
41475: '@rBy calling someone by their name, people acknowledge the worth of that person''s soul.'
41476: '@rThat is why names are sacred.'
41477: '@r......Receiving permission to speak one means that your soul has been acknowledged.'
41478: 'BEATRICE@r@v27/60700060."......Is that why...@v27/60700061....Father wants me to call him by his name......?"'
41479: '@rNo,@w500. ......that''s probably wrong.'
41480: '@rWhen Father sees me, it reminds him of that other me—the past me.'
41481: '@rAnd I''m sure that "me" called Father by his name.'
41482: '@rHowever,@k ......that probably doesn''t mean Father would be happy to hear me call him by his name.'
41483: '@rAfter all,@w583. .........I am me...@w583.......and not the BEATRICE my Father knows well.'
41484: '@r......What can I do...@w583....to help Father......?'
41485: '@rHow can I be useful to him?'
41486: '@rThat''s the only reason I was born......'
41487: '@rHanging her head,@k BEATRICE sat all alone in the Golden Land''s arbor that was next to the rose garden...'
41488: '@rThis scene was watched by the Witch of Theatergoing and her miko as they sat across from each other...'
41489: 'Ange@r@v11/62000199.".........Poor kid."'
41490: 'FEATHERINE@r@v50/65000158."I never thought I''d see you feel compassion for Beato..."'
41491: 'Ange@r@v11/62000200."......It''d be too cruel to call this Beato and the former Beato the same person.@k@v11/62000201. They''re completely different people."'
41492: '@rIt may be that, by the rules, this Beato is the Beato.'
41493: '@r......However, saying that would be horribly unfair to her.'
41494: 'FEATHERINE@r@v50/65000159.".........Battler must be very depressed to have revived his former adversary and have things end up this way."'
41495: 'Ange@r@v11/62000202."I can sort of understand Onii-chan''s despair.@k@v11/62000203. ......However, I can understand how this child feels as well.@k@v11/62000204. ......No person can become a replacement for another.@k@v11/62000205. Not even the past version of themselves."'
41496: '@rCompared to the young boy and girl who had found new versions of themselves and called each other by their true names,@k ......this witch looked very feeble.'
41497: '@rThe witch knew that she was an illusion created in the image of the person she once was.'
41498: '@rAnd she also knew that it would only hurt Battler to try and pretend to be that person.'
41499: 'FEATHERINE@r@v50/65000160.".........And even so, this Beato wants to be useful to Battler.@k@v50/65000161. ...How admirable."'
41500: 'Ange@r@v11/62000206."Is that the purpose of the witch known as BEATRICE?"'
41501: 'FEATHERINE@r@v50/65000162."......That is what she claims.@k@v50/65000163. She says that she was created to be of service to Battler."'
41502: 'Ange@r@v11/62000207."So, the Beato who was born for Onii-chan''s sake eventually commits a serial murder...@k@v11/62000208.and drags Onii-chan into a bizarre game that she calls eternal torture?@k @v11/62000209.I don''t get it."'
41503: 'FEATHERINE@r@v50/65000164."I believe you also understand that one can become a different person over a thousand years..."'
41504: '@r......At the very least,@k BEATRICE was once a pure creature who was born for Battler''s sake.'
41505: '@rIt is also very clear that, in her current feeble state,@k she does not possess any of the courage or the motivation needed to bring about those horrifying serial murders.'
41506: '@rIf so, ......that means the sinister witch we all know...@kmust have changed during the thousand years since her birth.'
41507: 'Ange@r@v11/62000210."......We keep getting this "thousand years" business,@k@v11/62000211. but I get the feeling that those words are just a metaphor for a really long time in the world of witches."'
41508: 'FEATHERINE@r@v50/65000165."As you get closer to the world of gods, the concept of time becomes increasingly vague.@k@v50/65000166. Six years can become a thousand, and a thousand years can be nothing more than a quick nap.@k@v50/65000167. ......One can fit an eternity long enough to be deserving of the title "one-hundred-year-old witch" in a mere two weeks..."'
41509: '@rIn other words, the pure Beato transformed into the cruel Beato...@k...during those six years that could be called a thousand...'
41510: '@rSo, does that mean something bad happened during those six years that made her hate Onii-chan?'
41511: 'Ange@r@v11/62000212."That doesn''t make sense.@k@v11/62000213. During those six years, Onii-chan not only stayed away from Rokkenjima, he even stopped using the Ushiromiya name.@k@v11/62000214. ......Onii-chan had nothing to do with her change.@k@v11/62000215. Her hatred must be totally misguided."'
41512: 'FEATHERINE@r@v50/65000168."..........................."'
41513: 'Kumasawa@r@v18/61800023."Oh, so this is where you were...@k@v18/61800024. Shall I make you some black tea...?"'
41514: 'BEATRICE@r@v27/60700062."......Kumasawa-san.@k@v27/60700063. ......There''s something I''d like to know."'
41515: 'Kumasawa@r@v18/61800025."Hoh-hoh-ho...@k@v18/61800026. Very well, what is it?"'
41516: 'BEATRICE@r@v27/60700064.".........My name is BEATRICE...@v27/60700065....isn''t it?"'
41517: 'Kumasawa@r@v18/61800027."Yes, that is correct.@k@v18/61800028. You are BEATRICE-sama, Milady."'
41518: 'BEATRICE@r@v27/60700066."However, ......the BEATRICE that Father talks about...isn''t me."'
41519: 'Kumasawa@r@v18/61800029."......Well........."'
41520: 'BEATRICE@r@v27/60700067."I think Father wanted me to be that person.@k@v27/60700068. But no matter how much I look like her...I''m a different person.@k@v27/60700069. ......I think that might be why he''s disappointed in me..."'
41521: 'Kumasawa@r@v18/61800030."That isn''t true...@k@v18/61800031. You are you, BEATRICE-sama herself."'
41522: 'Kumasawa@r@v18/61800032."......You have merely lost your memory of the past after being newly reborn...@k@v18/61800033. Even without your memory, you are still BEATRICE-sama.@k@v18/61800034. You are the same person whom the Master loves."'
41523: 'BEATRICE@r@v27/60700070."......So then,@v27/60700071. ......how can I regain those memories...?"'
41524: 'Kumasawa@r@v18/61800035."Well............"'
41525: '@rBeato looked at Kumasawa with hopeful eyes, as though praying that she would tell her the way.'
41526: '@r......Kumasawa averted her gaze unhelpfully, as though trying to say that she would if only such a way existed...'
41527: 'BEATRICE@r@v27/60700072."If I can''t regain them,@k@v27/60700073. ......can''t you at least tell me what kind of person the BEATRICE Father loved was?"'
41528: 'Kumasawa@r@v18/61800036."Th-......that is something I can tell you, but......"'
41529: 'BEATRICE@r@v27/60700074.@|@y"@c900.@[I was born for Father''s sake.@]@c.@k@v27/60700075. So, I want to become the Golden Witch BEATRICE that Father desires."'
41530: 'Kumasawa@r@v18/61800037."......B-......BEATRICE-sama......"'
41531: 'BEATRICE@r@v27/60700076."I can''t use magic.@k@|@y@v27/60700077. ......But if the witch Father desires could use it, then I will learn.@k@v27/60700078. I want to become the witch he desires.@k@v27/60700079. That''s the only way I can repay Father for creating me."'
41532: 'Ange@r@v11/62000216.".........That''s admirable.@k@v11/62000217. Without the thousand years gone wrong, she really is an incredible kid."'
41533: 'FEATHERINE@r@v50/65000169."A chick of a witch......very interesting.@k@|@y@v50/65000170. ......I''ve taken a liking to her, Ange.@k@v50/65000171. I shall allow this chick to make use of my study.@k@v50/65000172. Let us open the door which leads back to the world of witches."'
41534: 'Ange@r@v11/62000218."......So, you''re going to make her read aloud the stories about her previous self.@k@|@y@v11/62000219. ...Yes, I want to know too.@k@v11/62000220. The tale of how the Golden Witch BEATRICE was created."'
41535: 'Kumasawa@r"........................@k@v18/61800039. ...Very well.@k@v18/61800040. If you wish it,@v18/61800041. ......then let us open the door once again."'
41536: 'BEATRICE@r@v27/60700080."......Kumasawa...@v27/60700081.san..."'
41537: '@rA spray of gold welled up around them.@k@r......It was a cloud of gold butterflies.'
41538: '@rWith a golden flash, the form of the old lady transformed into that of a witch in a dress......'
41539: 'VIRGILIA@r@v30/63200001."You must choose the path that you are to walk down.@k@|@y@v30/63200002. ......Let us call it a path of roses.@k@v30/63200003. The beautifully blooming roses may celebrate you and they may torment you with their thorns."'
41540: 'VIRGILIA@r@v30/63200004."......But even so, it is a path that you once walked down.@k@v30/63200005. ...You may pass through the same thousand years.@k@v30/63200006. You may pass through a different thousand years.@k@v30/63200007. If you wish, you may even return back the way you came."'
41541: 'BEATRICE@r@v27/60700082."I''ll move on forward.@k@v27/60700083. ......I don''t want to spend a thousand years in this garden drinking tea.@k@|@y@v27/60700084. ......I, BEATRICE, was born for Father''s sake.@k@v27/60700085. So I want to live for Father''s sake.@k@v27/60700086. Please tell me...about the Golden Witch."'
41542: '@r......The great witch spread her arms,@k communicating BEATRICE''s unbending determination to the brilliant heavens.'
41543: '@rAt that moment, a brilliant light covered the two of them,@k and before they knew it, they were in a strange study.'
41544: '@rThere sat the great old witch who was the master of these archives, along with her miko.'
41545: '@r...VIRGILIA gave a deep and elegant bow.'
41546: 'VIRGILIA@r@v30/63200008."......It is the greatest of honors to be in your presence.@k@v30/63200009. Lady FEATHERINE AUGUSTUS AURORA, the majestic Witch of Theatergoing, Drama, and Spectating."'
41547: 'FEATHERINE@r@v50/65000173."Raise your head, child of man.@k@v50/65000174. ......I shall give that child the privilege of browsing my archives as she pleases for a time.@k@|@y@v50/65000175. ......Ange, my miko.@k@v50/65000176. See that she has no trouble."'
41548: 'Ange@r@v11/62000221."Sure, sure, as you wish, my master.@k@v11/62000222. You could just say that you want to see her story, you know."'
41549: 'VIRGILIA@r@v30/63200010."Miko of the Witch of Theatergoing.@k@v30/63200011. ......I leave BEATRICE in your care."'
41550: 'BEATRICE@r@v27/60700087."......Pleased...@v27/60700088....to meet you......"'
41551: 'Ange@r@v11/62000223.".....................@k@v11/62000224. ......The BEATRICE you''re trying to become......was suffering from something.@k@v11/62000225. ...At the very least, you''ve been released from that for now.@k@v11/62000226. ......Will you really go on a journey to regain those shackles...?"'
41552: 'BEATRICE@r@v27/60700089."Y-......yes.@k@v27/60700090. ......I want to become the Golden Witch.@k@v27/60700091. ......That is the reason I was born."'
41553: 'VIRGILIA@r@v30/63200012."In order that her journey through Purgatory may be a pleasant one,@k@v30/63200013. and that she may be granted protection as she travels, I ask your assistance by the name of the Endless and Finite Witch, PUBLIUS VIRGILIA MARO."'
41554: 'Ange@r@v11/62000227."Huh? Oh, uh...@k@|@y@v11/62000228. ......Let it be known that as the miko of the Witch of Theatergoing and as the Endless Witch and Apprentice Witch of Resurrection,@k@v11/62000229. I, ANGE BEATRICE, do accede to your request and all that stuff..."'
41555: '@rFEATHERINE snorted.'
41556: 'BEATRICE@r@v27/60700092."......So,@v27/60700093. ......your name is also BEATRICE......?"'
41557: 'Ange@r@v11/62000230.".........Yes.@k@v11/62000231. I know a lot about you."'
41558: 'BEATRICE@r@v27/60700094."Please teach me.@k@v27/60700095. What kind of person was I?"'
41559: 'Ange@r@v11/62000232."Sure.@k@v11/62000233. ......And I''ll want you to teach me.@k@v11/62000234. Why did you become the person you were?"'
41560: 'FEATHERINE@r@v50/65000177."......In this archive, the fragments showing the tales of all your games up until now are stored as books.@k@v50/65000178. By reading them, you should be able to learn everything that has happened before now..."'
41561: 'BEATRICE@r@v27/60700096."By reading them, can I become the Golden Witch......?"'
41562: 'FEATHERINE@r@v50/65000179."......To become the Golden Witch, one must solve the epitaph of the gold.@k@v50/65000180. ......And this trial cannot be skipped, not even by BEATRICE herself......"'
41563: 'BEATRICE@r@v27/60700097."I, I''ll do my best.@k@v27/60700098. So please, let me read the books in this archive...!"'
41564: 'Ange@r@v11/62000235."......As worthy of admiration as ever.@k@v11/62000236. I have no idea why you want to go back to being like that so much..."'
41565: 'BEATRICE@r@v27/60700099."I don''t know what I was like then.@k@v27/60700100. ......But if that me can be of use to Father,@k@v27/60700101. that is what I want to become."'
41566: '@rAnge sighed resignedly.@k@r......She had no words with which to stop this girl from following her noble sense of purpose.'
41567: '@r...After all, Ange was the miko of the Witch of Theatergoing.@k@rShe could do nothing except watch over the stage.'
41568: '@rYes—they weren''t actually interfering with the play.'
41569: '@rThis was just a bit of directing...to shine the spotlight onto the tale of Beato''s past.'
41570: '@rEven this was nothing more than the Witch of Theatergoing watching a play.'
41571: 'FEATHERINE@r@v50/65000181."If you read, you will learn what kind of a person the old BEATRICE was.@k@v50/65000182. ......However, you must decide what you will take from that experience...@k@|@y@v50/65000183. ......You are free to stay in the archive or leave the archive or even return to the archive again later.@k@v50/65000184. ......In compensation, I will watch your play."'
41572: 'BEATRICE@r@v27/60700102."Watch my play...?"'
41573: 'Ange@r@v11/62000237."......It means you can do whatever you want."'
41574: 'BEATRICE@r@v27/60700103."Th-thank you very much, Augusauau......umm—"'
41575: 'Ange@r@v11/62000238."She likes it when you call her FEATHERINE."'
41576: 'BEATRICE@r@v27/60700104."Thank you very much, FEATHERINE-sama......"'
41577: '@rAfter being welcomed in by FEATHERINE, ......Beato set out on a journey to discover herself.'
41578: '@rThat tale connected the old tale with the new one.@k It wove them together.'
41579: '@r......The thousand-year-old tale about her returned to its starting point, becoming a snake eating its own tail.'
41580: '@rThe ring of that snake began slowly, bit by bit, to turn into the shape of a small island floating on the sea.'
41581: '@rThat island......was Rokkenjima.'
41582: '@rThe thousand years of the witch born on this island...were tied to the island.'
41583: '@rWas it a thousand years, or just six?@k@r......Or did this tale start even further back into the past?'
41584: '@rBEATRICE went out on a journey to find herself......'
41585: '@rThe wind had been strengthening since a while back.'
41586: '@rThe breaking waves had grown fierce.@k@rThe ferryboats probably wouldn''t be coming for a while now.'
41587: '@rThe crashing thunder told that the island had been sealed off from the outside world.'
41588: '@rA thick rain poured down,@k mocking the fools outdoors who had to rush pathetically to find shelter.'
41589: '@rNo longer would anyone be able to leave this island.@k@r......And no longer would anyone be able to reach this island.'
41590: '@r......No one, unless blessed with a miracle.'
41591: '@rThere was another flash of lightning.@k@r......The retinas of all who saw it were filled with white.'
41592: '@rAs that white faded away,@w583. ......an eerie silhouette pulled itself up at the raging water''s edge...'
41593: '@rAs though suddenly remembering, it coughed violently several times,@k filthily spitting out the sea water that had filled its stomach.'
41594: '@r......And then, tearing apart the velcro of her life jacket,@k she cast off the reason she had been able to float here without so much as a thank you.'
41595: '@r@v46/64500058."Hahahahahahaha,@v46/64500059. ahahahahahahahaha!!@k @v46/64500060.Gurgh,@v46/64500061. *cough*cough*cough*,@v46/64500062.@|@y haah, haah, haah...@k@v46/64500063. ......*cackle*cackle*, ahahahahahahaha!!@k @v46/64500064.Welcomed in by a storm, same as always! Very <good>!@k @v46/64500065.And now, you and I are going to have some fun...Battler-san!!"'