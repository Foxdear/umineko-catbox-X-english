48444: '@rBEATRICE, the witch who mocks others with unsolvable locked room tricks...!'
48445: 'BEATRICE@r@v27/60701144.@|@y"@c900.@[At the time the next room over was sealed,@k@v27/60701145.@|@y Hideyoshi, George, Kumasawa, Shannon, and Nanjo were in it.@k@v27/60701146.@|@y And the number of people in the next room over was five.@k@v27/60701147.@|@y No one existed there except for those to whom those five names refer!@k @v27/60701148.@|@y Every name has just one person that it belongs to, and no one can go by a name that is not theirs!!@]@c."'
48446: 'Erika@r@v46/64501522."............uu...@v46/64501523....gkk...@v46/64501524....@v46/64501525.............!!"'
48447: '@rIt was a thoroughly merciless red truth...@k It really was...severe......'
48448: '@rNow that it had been limited to five people, any leeway for Kanon hiding there had been completely denied.'
48449: '@rSince only those to whom those five names referred existed within the room,@k Erika couldn''t even make a new theory by suggesting that one person held two names, so that the five names referred to only four people,@k and allowing for Kanon to sneak in even though his name wasn''t on the list.'
48450: '@rFurthermore, the part about how "every name has just one person that it belongs to, and no one can go by a name that is not theirs" was a fatal blow that cut down countless theories...!'
48451: 'BEATRICE@r@v27/60701149."......Come to think of it, you only know the half-sleeping me from the last game, don''t you...?@k @v27/60701150.What do you think, Erikaaa?@k @v27/60701151.......How do you like the game of the Golden Wiiiiiiiiiitch...???"'
