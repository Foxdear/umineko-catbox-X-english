48301: 'Erika@r@v46/64501475."That was the first time in my life that anyone had ever protected me.@k@v46/64501476. ......Even my master has never done so.@k@v46/64501477. All she gave me was a way to negate the pain of naked truth by laying bare the truths of others...@k@v46/64501478.and causing them just as much pain."'
