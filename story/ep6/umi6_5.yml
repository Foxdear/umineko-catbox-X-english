42014: 'Shannon@r@v15/60500119."......Back then I was, and I guess I still am, a bit of a klutz...@k@v15/60500120. I''d always forget where I''d put things...@k@v15/60500121.or intend to lock something but then forget......I caused a lot of trouble."'
42015: 'George@r@v07/60300032."Hahaha, I remember how Aunt Natsuhi used to get mad at you all the time."'
42016: 'Jessica@r@v04/60200099."But eventually, Shannon managed to overcome her forgetfulness."'
42017: 'Battler@r@v10/60100236."Oh, and how''d you do that?"'
42018: 'Shannon@r@v15/60500122."......Heheh.@k@v15/60500123. It wasn''t anything big, ......but I got into the habit of writing things down.@k@v15/60500124. I''d write down wherever I put something important.@k@|@y@v15/60500125. ......For things that were part of the daily routine, I made a checklist and always made sure to check it......"'
42019: 'Erika@r@v46/64500171."So?@k @v46/64500172.Did you see BEATRICE or didn''t you?"'
42020: 'Shannon@r@v15/60500126."Oh, umm,@v15/60500127. ......I didn''t see her directly,@v15/60500128. ......but, umm,@v15/60500129. ......some very strange things did happen..."'
42021: '@rShe was talking about a certain summer night.'
42022: '@rIt was when Shannon was doing the nightly rounds......@k@rFrom her perspective, it was a ghost story.'
42023: '@rFrom the witch''s perspective, ......it was just the story of a little summer''s night prank...'
42024: 'Elder BEATRICE@r@v60/60700177."My little sister.@k@v60/60700178. Do you understand the anti-magic toxin that Humans possess?"'
42025: 'BEATRICE@r@v27/60700179."N-no.@k@v27/60700180. What is that, Onee-sama?"'
42026: 'Elder BEATRICE@r@v60/60700181."Hmm.@k@v60/60700182. The time of witches has long since passed.@k@v60/60700183. ......Those vile Humans who claim to control everything came to deny our existence and possess a strong toxin."'
42027: 'BEATRICE@r@v27/60700184."Is that toxin harmful to us...?"'
42028: 'Elder BEATRICE@r@v60/60700185."It is extremely dangerous.@k@v60/60700186. If it got to us, our forms would probably evaporate in an instant.@k@|@y@v60/60700187. However, one thing we do have in our favor is the fact that our existence is still extremely weak.@k@v60/60700188. Because of that, the toxin does not affect us greatly.@k@v60/60700189. At worst, it can only transform us into mist for a time."'
42029: 'BEATRICE@r@v27/60700190."However, we''d rather avoid it if we can, right?"'
42030: 'Elder BEATRICE@r@v60/60700191."Correct.@k@v60/60700192. Yes, I see that you are me.@k@v60/60700193. You understand quickly."'
42031: '@rThe older sister appeared to be haughty at first,@k .........but, perhaps because she was so happy to have met her double and little sister, she was more than willing to teach her anything she wanted to know.'
42032: '@rThe first thing she had taught her was that they were witches,@k a different type of being than Humans.'
42033: '@rBeato had thought that she wasn''t a witch because she couldn''t use magic,@k but apparently, she was still a witch nonetheless.'
42034: '@rThen she was taught that witches such as her, unlike Humans, were bound by various restrictions.'
42035: '@rThe greatest of those restrictions was the anti-magic toxin possessed by Humans.'
42036: 'BEATRICE@r@v27/60700194."So, in other words, we mustn''t enter a Human''s field of vision..."'
42037: 'Elder BEATRICE@r@v60/60700195."Correct.@k@v60/60700196. You can think of it as though Human eyes radiate the toxin.@k@|@y@v60/60700197. If they see you, it is the same as your body being burnt.@k@v60/60700198. Though they are lesser in extent, being heard or sensed can also result in contact with the toxin."'
42038: 'BEATRICE@r@v27/60700199."......So, it''s dangerous just for us to get close to Humans..."'
42039: '@rWasn''t Father a Human...?@k@rWhy am I not burnt by Father''s toxin......?'
42040: 'Elder BEATRICE@r@v60/60700200."If we stock up magical power and have it acknowledged by Humans, that toxin can be reduced drastically.@k@v60/60700201. In other words, by having our existence acknowledged by Humans, we make them lose their toxin,@k@v60/60700202. making it possible for us to appear before them once more."'
42041: 'BEATRICE@r@v27/60700203."I see......@k@v27/60700204. Simply put, as we are now, we can only exist when Humans aren''t around..."'
42042: 'Elder BEATRICE@r@v60/60700205."We are still very lacking in magical power,@k@v60/60700206. which makes us inferior to even a stray cat hiding from Humans in the shadows."'
42043: '@rThe main goal of the older sister was to gain a large supply of magical power and be revived as a Great Witch strong enough to have no fear of the anti-magic toxin.'
42044: '@rFor that purpose, she had wandered around the mansion night after night,@k striving to regain her magical power and reduce the anti-magic power of the Humans...'
42045: '@rThe powerful previous BEATRICE, whom she had read about in FEATHERINE''s library,@k had appeared openly in front of Humans and had even toyed with them at will.'
42046: '@r......According to her big sister, such a level of power was most impressive.'
42047: 'Elder BEATRICE@r@v60/60700207."To think that a witch could appear openly before humans and use magic at will!@k @|@y@v60/60700208.......A witch like that would be so great that even I can hardly imagine it.@k@v60/60700209. Is that what we will eventually become?"'
42048: 'BEATRICE@r@v27/60700210."Yes.@k@v27/60700211. ......She was like a witch from a picture book, appearing openly before the Humans of the mansion and summoning magic and underlings at will..."'
42049: 'Elder BEATRICE@r@v60/60700212."Hmmm, how inspiring.@k@v60/60700213. If that is our future, it means that all of our hard work will be worth it."'
42050: 'BEATRICE@r@v27/60700214."Yes, it will.@k@|@y@v27/60700215. ......Anyway, Onee-sama.@k@v27/60700216. What does going around unlocking windows like this have to do with the hard work you''re talking about...?"'
42051: '@rIt was the middle of the night.@k They were following behind servants who were checking the locks on the doors and windows and undoing those locks after the servants thought they had locked them.'
42052: '@r......It felt more like a child''s prank than the work of a witch...'
42053: 'Elder BEATRICE@r@v60/60700217."Heheheh, this is the path that leads to becoming a Great Witch.@k@|@y@v60/60700218. All journeys begin with a single step.@k@v60/60700219. To those who cannot understand, that first step may look quite foolish from time to time.@k@v60/60700220. However, it is still a momentous first step...!"'
42054: '@rWith pride, as though making the first step for mankind on the surface of the moon,@k the older sister undid the lock on a window with a click.'
42055: 'Elder BEATRICE@r@v60/60700221."Do you not understand, my little sister?@k@v60/60700222. Can you not see what makes something like this momentous?"'
42056: 'BEATRICE@r@v27/60700223."............?@k @v27/60700224.No, Onee-sama.@k@v27/60700225. ......I don''t really understand."'
42057: '@rThe older sister closed her eyes lightly, smiled, and opened the unlocked window a crack.'
42058: '@rCool outside air flowed in, making the curtains flutter.'
42059: 'Elder BEATRICE@r@v60/60700226."Let us put it in the toxin-filled words of a Human.@k@v60/60700227. ......We are not supposed to exist on this island.@k@v60/60700228. I shall go further.@k@v60/60700229. "Right now, there is no one in this corridor".@k@v60/60700230. And yet, the lock has been undone, ......and the window has opened.@k@v60/60700231. ......Can you see how great a miracle, a work of magic, ......a proof of our existence that is?@k @v27/60700232.Even you should understand the coolness of this breeze..."'
42060: 'BEATRICE@r@v27/60700233."......I do understand.@k@v27/60700234. It''s nice and cool..."'
42061: 'Elder BEATRICE@r@v60/60700235."The coolness, the softness of the breeze.@k@v60/60700236. ......And the feel of the fluttering curtain touching your hair.@k@v60/60700237. ...All of these things show that we truly do exist here."'
42062: 'BEATRICE@r@v27/60700238."So, ......by unlocking a window like this, we can leave behind proof that we really did exist."'
42063: 'Elder BEATRICE@r@v60/60700239."......And that is why I unlock them."'
42064: '@rOf course, it wasn''t just small pranks like opening a window.'
42065: '@r......She could also smash windows and vases or leave behind strange fires and mysterious scribbles.'
42066: '@rIn fact, one time, she actually did play a large-scale prank in the kitchen,@k piling up kitchenware in an eerie manner and leaving behind a bizarre scribble, which scared the servants considerably.'
42067: '@rIt had been a complete success.'
42068: '@rIt had been truly terrifying, and she had succeeded in making the servants acknowledge the existence of magic, weakening the anti-magic toxin...'
42069: '@rHowever, she chose to make her presence known by unlocking windows.'
42070: '@rBy doing this, ......she could release herself from the restrictions imposed by the Humans'' toxin.'
42071: 'Elder BEATRICE@r@v60/60700240."One day,@k@v60/60700241. I will—no, we will become a single witch and control all of Rokkenjima.@k@|@y@v60/60700242. ......When that time comes, we will gain complete freedom and will be capable of stretching our wings as we please."'
42072: '@rWe won''t have to be afraid of anyone''s gaze anymore.'
42073: '@rWe''ll be able to fly wherever we wish, disappear whenever we want.@k Laugh however we like, prank however we like, talk with anyone we want to.'
42074: '@rHumans might ask things of us from time to time.@k@rThey might fight with us or play with us too.'
42075: '@rWhat wonderful things for us frail creatures,@k who cannot appear before anyone, to look forward to......'
42076: 'Elder BEATRICE@r@v60/60700243."......Right now, they are little more than pranks.@k@v60/60700244. However, as they pile up, proof that we exist will begin to gather.@k@|@y@v60/60700245. The servants already call me the witch BEATRICE, master of the night,@k@v60/60700246. and are beginning to believe in me bit by bit."'
42077: 'BEATRICE@r@v27/60700247."The more they believe, the more those Humans will lose their anti-magic toxin..."'
42078: '@r......I see...@k So, this means that Father has no anti-magic toxin.'
42079: '@rAnd.........that''s because he truly believes in the existence of the witch I am, without any doubts.'
42080: '@rI finally realized that, though I''d thought him to be cold, Father did possess a kindness that couldn''t be seen......'
42081: 'BEATRICE@r@v27/60700248."I''d like to become a great witch and appear in front of everyone soon."'
42082: 'Elder BEATRICE@r@v60/60700249."Mm.@k@v60/60700250. Eventually, we will be able to appear openly in front of anyone.@k@|@y@v60/60700251. By doing that repeatedly, we will make people believe in us, ...and eventually, we shall display even our magic for all to see.@k@v60/60700252. ......After that happens, we will descend upon Rokkenjima as the Great Witch you told me of. Ahahahahaha!"'
42083: 'FEATHERINE@r@v50/65000191."......The logic of the witch side is very interesting.@k@v50/65000192. It keeps me entertained."'
42084: 'Ange@r@v11/62000244."It does sound credible, in a way.@k@v11/62000245. When Humans are warned that they''re about to enter a famously haunted place, a hot spot for ghosts,@k@v11/62000246. they''re likely to start yelling "ghost, ghost!" at the drop of a hat."'
42085: 'FEATHERINE@r@v50/65000193."That''s right.@k@v50/65000194. All phenomena are fundamentally neutral, indifferent, and dull.@k@v50/65000195. ......If one wishes to have them be accepted in a certain manner, they must first create a suitable environment..."'
42086: 'Ange@r@v11/62000247."If a person has charisma, people will interpret what they do in a positive way, even when they screw up.@k@|@y@v11/62000248. ......I see.@k@v11/62000249. I guess in that sense, the Beatos'' small efforts aren''t for nothing."'
42087: 'FEATHERINE@r@v50/65000196."If it were just the mansion''s locks being undone, everything could be resolved by saying that someone forgot to lock up or that it was some kind of prank.@k@v50/65000197. ......It is the rumors of a witch wandering about the mansion night after night that give form to the existence of the witch."'
42088: 'Ange@r@v11/62000250."An environment was established such that, if anything strange happened in the mansion at night, it would all be viewed as the work of the witch.@k@|@y@v11/62000251. ......I get it. If things reached a point where no one questioned that logic,@k@v11/62000252. it would mean the same thing as a witch existing in the mansion at night."'
42089: '@rAfter the Beatos finished their mischief of unlocking and opening the window,@k they enjoyed the coolness of the wind and the brightness of the moon, then became gold butterflies and disappeared into the darkness.'
42090: '@r......There was no way of knowing whether the window they had opened had actually been opened by them.'
42091: '@rThe servants might have forgotten to lock up,@k or one of the family might have opened it after the servants had locked up and forgotten to shut it again,@k or maybe someone had played a prank.'
42092: '@rIn the same way that none of those possibilities could be denied,@k ......it was also impossible to deny the possibility that a witch really had opened a window to enjoy the night breeze......'
42093: 'Ange@r@v11/62000253.".........An outcome without an observer can possess an endless number of ways in which it might have occurred.@k@v11/62000254. ...Those Humans who can only conceive of a single possibility are unable to imagine anything."'
42094: 'FEATHERINE@r@v50/65000198."However, people who believe in the possibility of a witch can imagine that it was a witch''s prank.@k@v50/65000199. ......When that happens, the scene of the BEATRICEs'' prank that we have just seen is etched into the fragment as a fact..."'
42095: 'Ange@r@v11/62000255."......That''s one of the foundations of magic.@k@v11/62000256. Decorating...the process."'
42096: '@rWith just a little magic, even a mass-produced stuffed animal...@k...can be reborn as a wonderful, unique stuffed animal filled with a mother''s love.'
42097: '@rIf you doubt it, ......it will be burnt by the anti-magic toxin.@k@rIf you believe it, the magic will become the truth.'
42098: 'Ange@r"..............................@k@v11/62000258. ......Not all magic is bad.@k@|@y@v11/62000259. ......Maria onee-chan was right.@k@v11/62000260. ......Good magic exists too."'
42099: 'FEATHERINE@r@v50/65000200."The power to repel evil magic may be necessary for a child of man.@k@v50/65000201. However, it is part of the love of the human world not to burn away and defile love-filled magic."'
42100: 'Ange@r@v11/62000261.".....................@k@v11/62000262. ......Well, good magic is the only kind I''m willing to allow.@k@v11/62000263. ......For all other kinds, the best remedy is to deny them and burn them away."'
42101: 'FEATHERINE@r@v50/65000202."Heheheheheheheh...@k@v50/65000203. A typical answer for a child of man."'
42102: 'Ange@r@v11/62000264."Getting back to the point.@k@v11/62000265. ......What all this tells me...@k@v11/62000266.is that the ghost BEATRICE, who was called the ruler of Rokkenjima''s night, doesn''t really exist.@k@v11/62000267. It''s nothing more than a general term for any inexplicable occurrences that took place in the mansion at night.@k@v11/62000268. In other words, BEATRICE isn''t the name of a person, it''s the name of a phenomenon."'
42103: '@rIf anything bizarre happens, it all becomes the work of the Golden Witch...'
42104: '@rAny environment in which "there could be a witch" is, in fact, BEATRICE itself.'
42105: 'Ange@r@v11/62000269."......That all piles up until we reach 1986.@k@v11/62000270. ......This is the veil that the true culprit is hiding behind.@k@v11/62000271. And the person hiding behind it is, without a doubt, one of the Humans."'
42106: 'FEATHERINE@r@v50/65000204."Let us say that this holds true at this point in the witches'' tale of the past.@k@v50/65000205. ......However, I doubt you can use that argument alone to fight all the way through 1986......"'
42107: 'Ange@r@v11/62000272."..........................."'
42108: 'FEATHERINE@r@v50/65000206."Heheheheheheheheh......"'
42109: 'Erika@r@v46/64500173."Ridiculous.@k@|@y@v46/64500174. Someone obviously must have forgotten to lock up."'
42110: 'Shannon@r@v15/60500130."W-......well, you may say that, but...umm...@k@v15/60500131.b-but this isn''t just something that happened once or twice..."'
42111: 'Erika@r@v46/64500175."In other words, you''re a klutz, a fool,@k@v46/64500176. and a moron of a servant who forgot to check not just once or twice, but many times over?"'
42112: 'George@r@v07/60300033."......Shannon isn''t the only one.@k@v07/60300034. That same window was always opened even when other servants did the rounds."'
42113: 'Jessica@r@v04/60200100."Yeah, Mom even asked me if I''d ever left a window open in the hall at night.@k@v04/60200101. I had absolutely nothing to do with it, but she still got pissed.@k@v04/60200102. Sheesh."'
42114: 'Maria@r@v13/60400051."I''m sure BEATRICE wanted to gaze at the moon.@k@v13/60400052. Uu."'
42115: 'Battler@r@v10/60100237."It is a bit creepy to have that happen over and over at the same window.@k@|@y@v10/60100238. ......And that time where the kitchenware was piled up in the kitchen, with a creepy magic circle scribbled there...that sounds even more freaky."'
42116: 'Shannon@r@v15/60500132."......Y-yes.@k@v15/60500133. They said it was an eerie magic circle drawn with something like blood......@k@v15/60500134. Ever since then, people have been scared to patrol the kitchen..."'
42117: 'Erika@r@v46/64500177."About the case of the eerie magic circle in the kitchen.@k@v46/64500178. Who witnessed that?"'
42118: 'Shannon@r@v15/60500135."Well, ......uh, ......it wasn''t me...@k@v15/60500136. I, uh......think I heard about it from a servant kid who quit.@k@v15/60500137. I wasn''t on duty that day..."'
42119: 'Erika@r@v46/64500179."Then there you have it.@k@v46/64500180. In the same way that stories about popular haunted locations become exaggerated, you servants like to have a little fun telling ghost stories about the mansion at night, don''t you?@k @v46/64500181.By doing that, you speak as though the witch exists and infect others with that belief."'
42120: 'Battler@r@v10/60100239."......So, all of the eerie things that were supposedly done by BEATRICE...@k@v10/60100240.are either the result of coincidence and accident, or completely cooked-up stories that people fabricated for fun.@k@v10/60100241. ...Is that what you''re trying to say?"'
42121: 'Erika@r@v46/64500182."Exactly.@k@v46/64500183. Of course there''s no way BEATRICE exists."'
42122: 'Maria@r@v13/60400053."Uu......@k@v13/60400054. BEATRICE exists."'
42123: 'Erika@r@v46/64500184."I''m glad you understand so well, Battler-san.@k@v46/64500185. ......I imagine there does exist some human person with that name, or else multiple specific or nonspecific people who acted under such an alias."'
42124: 'Erika@r@v46/64500186."However, this "Golden Witch BEATRICE" that we hope and fantasize might exist...@k@v46/64500187.is completely and unequivocally impossible."'
42125: 'Maria@r@v13/60400055."Uu!!@|@y@k @v13/60400056.Uu-uu-uu!!@|@y@k @v13/60400057.BEATRICE exists!@k @v13/60400058.I''ve met her!!"'
42126: 'Erika@r@v46/64500188."Oh? Could you tell me about that in detail?@k @v46/64500189.You met BEATRICE?@k @v46/64500190.And did she show you magic or something?"'
42127: 'Maria@r@v13/60400059."Uu!@k @v13/60400060.I see her all the time!@k @v13/60400061.Every time I come to Rokkenjima!@k @v13/60400062.And she always shows me fun magic!!"'
42128: '@rDenying the existence of the witch would always have the immediate effect of infuriating Maria.'
42129: '@rHowever, Erika, who didn''t know to avoid this topic, had challenged her head on.'
42130: '@rBut no matter how Maria tried to smooth over the matter of BEATRICE''s existence, she stood no chance of defeating the ruthlessly intelligent Erika in an argument...'
42131: '@rGeorge and Jessica hurried to calm Maria down, but Maria''s anger could not be settled by this point.'
42132: 'Erika@r@v46/64500191."<Good>!@k @v46/64500192.So, she showed you magic?@k @v46/64500193.Could you explain in detail what kind of magic?"'
42133: 'Maria@r@v13/60400063."She would always use magic to give me candy as a present!!@k @v13/60400064.Beato can create candy with magic!!"'
42134: 'Erika@r@v46/64500194."Are you sure she didn''t just take it out of her pocket?"'
42135: 'Maria@r@v13/60400065."No, she didn''t!!@|@y@k @v13/60400066.It was magic!@|@y@k@v13/60400067. It was incredible!! Tons of candies poured out of an empty cup!"'
42136: 'Battler@r@v10/60100242."W-wow, that''s some awesome magic..."'
42137: 'George@r@v07/60300035."That''s right, that really would be magic...!"'
42138: 'Maria@r@v13/60400068."Yeah, it was magic!!@k @v13/60400069.It really was empty!!@k @v13/60400070.I checked inside it myself!!"'
42139: 'Erika@r@v46/64500195."Excuse me?@k @v46/64500196.What do you mean, you checked inside it?"'
42140: 'Jessica@r@v04/60200103."G-give it a rest, Erika-san...@k@v04/60200104. She''s just a kid..."'
42141: 'Shannon@r@v15/60500138."Anyway, Erika-sama, ...would you like some more t—@v15/60500139.kyah—"@|@y'
42142: 'Erika@r@v46/64500197."<No thank you>.@k@v46/64500198. I''m having a seriously intellectual discussion over here.@k@v46/64500199. You outsiders can stay out of this!"'
42143: 'Erika@r@v46/64500200."You''ll have to tell me in more detail, Maria-san.@k@v46/64500201. What do you mean when you say that you checked inside it?@k @v46/64500202.Fortunately, we have right here with us a tea cup that''s just been overturned and emptied!@k @v46/64500203.Will you do me the favor of recreating the circumstances for me right now?@k @v46/64500204.Let''s see it, if you would, let''s see it!!"'
42144: '@rAfter holding the cup of black tea, which she had just overturned and was still dripping, upside down over the table,@k@|@y Erika slammed it down hard and slid it over to Maria.'
42145: '@rErika''s eyes glowed repulsively, like those of a snake about to snap up a frog.'
42146: '@rThose eyes were ice-cold and had a madness in them that made one want to avert their gaze.'
42147: '@rOn the other hand, Maria was glaring furiously,@k her whole body shaking uncontrollably, in the greatest expression of anger that a human can manage.'
42148: '@rThe look on her face was frightening...not at all something one would expect to see on a nine-year-old girl.'
42149: 'Shannon@r@v15/60500140."S-stop it, both of you...!"'
42150: 'Maria@r@v13/60400071."Uuu!!!@k @v13/60400072.I''ll show you what BEATRICE did!!@k @v13/60400073.Just like this!!@k @v13/60400074.She took the empty cup!!@k @v13/60400075.And she put it upside down on the table!!"'
42151: 'Erika@r@v46/64500205."Yes, and then?!@k @v46/64500206.Did she then immediately lift it up and candies flowed out?!@k @v46/64500207.Incredible, that really would be magic! ...If it happened that way!!!"'
42152: '@rBattler and the others tried to get between the two and calm them down,@k but it was no use.'
42153: '@rThe two violently pushed aside the others,@k and, glaring at each other from so close that their foreheads banged together, they repeatedly slammed down the upside down cup on the table.'
42154: '@rThe sound of their foreheads banging together and the cup being slapped down...shattered the barrier between reality and illusion...!!'
42155: 'Maria@r@v13/60400076."It is magic, it is magic!!@k @v13/60400077.Beato used magic to make candies appear!!"'
42156: 'Erika@r@v46/64500208."Then why don''t you reproduce it for us?!!@k @|@y@v46/64500209.Founder of Mariage Sorciere and Witch of Origins, MARIAAAAAAAAAAAAAAAAA!!"'
42157: 'Dlanor@r@v47/64600008."Lady ERIKA, this opponent is not worth your TIME.@k@v47/64600009. This battle is not worth FIGHTING..."'
42158: 'Erika@r@v46/64500210."Shut up, ball-jointed murder doll!!@k @|@y@v46/64500211.Alright!!@k @v46/64500212.How do you claim that the overturned cup was filled with candies?!"'
42159: 'Maria@r@v13/60400078."Just turning the cup over won''t make candies come out!!@k @v13/60400079.Because you have to use magic to make them come out!!@k @v13/60400080.Beato can use magic because she''s a witch!!"'
42160: 'Erika@r@v46/64500213."Oh yes, magic, she used magic!!@k @v46/64500214.How did she use magic?!@k @|@y@v46/64500215.Did she swing a magic wand and tap the cup to make candies pour out?!@k @v46/64500216.*giggle*, no, that can''t be it, right? Right?!"'
