46763: 'Furfur@r@v52/65200114."Aah, Zepar!!@k @v52/65200115.What''s this ''important announcement''?!"'
46764: 'Zepar@r@v51/65100119."Listen, Furfur!@k @v51/65100120.Our@v51/65100121.@|@y image song is getting released on CD!"'
46765: '@r@v00/awase6044_o."""Whaaaaaaaaaaat?!"""'
46766: '@r@v00/awase6045.""Just kidding~!@k @v00/awase6046.Ahahahahahahahahahahahaha.""'
46767: 'Zepar@r@v51/65100124."We were just so bored of showing up the same way every time...!"'
46768: 'Furfur@r@v52/65200118."We thought we''d change our style a bit!"'
46769: 'Zepar@r@v51/65100125."We''re entertainers!@k @v51/65100126.And the stage is alive!"'
46770: 'Furfur@r@v52/65200119."You''ve got to ad lib every now and then...!"'
46771: 'Jessica@r@v04/60200389."Y-......yeah, we could''ve done without that, you jackasses..."'
46772: 'George@r@v07/60300461."......Thanks for helping remove the tension, you two.@k@v07/60300462. Sorry, but we''re still talking about what to do in the second trial.@k@v07/60300463. We''d like a little more time.@k@v07/60300464. And if possible, some quiet."'
46773: 'Zepar@r@v51/65100127."Sorry, George-kun.@k@v51/65100128. Actually, we have a truly important announcement regarding the second trial."'
46774: 'Furfur@r@v52/65200120."It is good news for some!@k @v52/65200121.And perhaps bad news for others?"'
46775: 'Zepar@r@v51/65100129."Those for whom it is bad news...@k@v51/65100130.have probably already figured it out!"'
46776: '@r@v00/awase6047_o.""If you don''t know what we''re talking about, then it''s good news for you!!""'
46777: 'Shannon@r@v15/60500296."............BEATRICE-sama...?"'
46778: 'BEATRICE@r@v27/60700889.".........It''s nothing."'
46779: 'Kanon@r@v16/60600327."........................"'
46780: '@rFive people were there.@k Only Battler was missing.@k@rAnd Beato''s expression was dark, her head hanging low.'
46781: '@rEveryone realized that something must have happened to Battler...'
46782: 'Zepar@r@v51/65100132."We''d like to announce...@k@v51/65100133.that Battler-kun has retired before the second trial."'
46783: '@rEveryone murmured.@k ......Just what had happened......?'
46784: 'Furfur@r@v52/65200123."The witch''s game will wait forever for him,@k@v52/65200124. but a pair of lovers cannot wait forever."'
46785: 'Zepar@r@v51/65100134."Love is like ice cream!@k @v51/65100135.It''s sweet and creamy, but if you don''t eat it quickly, you''ll lose it.@k@v51/65100136. Our game isn''t so gracious that it''ll wait for him to return."'
46786: 'Kanon@r@v16/60600328."......So that''s what you meant by good news."'
46787: 'Jessica@r@v04/60200390."Heh.@k@v04/60200391. ......Well, I''m glad that our rivals have gone down in number,@k@v04/60200392. but if you thought I''d applaud another person''s misfortune, you''re totally wrong..."'
46788: 'George@r@v07/60300465."Battler-kun, the one we thought of as our greatest enemy...@k@v07/60300466. .........I won''t ask why.@k@v07/60300467. If the demons in charge say so, then that''s how it is."'
46789: 'Shannon@r@v15/60500297.".........Then...what will happen to BEATRICE-sama...?"'
46790: 'BEATRICE@r@v27/60700890."..................It seems I will lose the right to take this trial."'
46791: 'Zepar@r@v51/65100137."After all, this is a trial to test the bonds between lovers!"'
46792: 'Furfur@r@v52/65200125."Battler-kun isn''t currently capable of doing that.@k@v52/65200126. So, his pair is disqualified!@k @v52/65200127.How truly saddening...!"'
46793: 'Zepar@r@v51/65100138."However, she is one of the participants in this three-way trial of love.@k@v51/65100139. So, I think we should let her watch the trial as an observer!"'
46794: 'Furfur@r@v52/65200128."A splendid idea!@k @v52/65200129.She does have the right to bless the pair that does overcome the trial!"'
46795: 'George@r@v07/60300468."......Are you okay with that?"'
46796: 'BEATRICE@r@v27/60700891."Yes......@k@v27/60700892. I want to watch until the end.@k@v27/60700893. ......And,@k@v27/60700894. .........I still believe he will come back quickly, regain his eligibility,@k@v27/60700895. and continue this trial with me once again."'
46797: 'Shannon@r@v15/60500298.".........If you ask me,@k@v15/60500299. she has the right to be an observer."'
46798: 'Jessica@r@v04/60200393."No objections here."'
46799: 'Kanon@r@v16/60600329."......There''s no need for us to be cruel."'
46800: 'George@r@v07/60300469."That may be, but as bad as it sounds, ......the loss of a powerful rival is our gain.@k@v07/60300470. ......Sorry to do this to you and Battler-kun, but I''d like to settle this trial right away."'
46801: 'Furfur@r@v52/65200130."Ah, that''s George-kun for you!@k @v52/65200131.I''m rooting for you the most on the inside!"'
46802: 'Zepar@r@v51/65100140."The coldness with which he furnishes that love...@k@v51/65100141.makes its heat stand out all the more...!"'
46803: 'George@r@v07/60300471."At any rate,@k@v07/60300472. ......we''ve now gone from three down to two, and the three-way deadlock has been resolved.@k@v07/60300473. ......We weren''t able to fight proactively because we were afraid of a one against two situation."'
46804: 'Kanon@r@v16/60600330.".........Now that it''s one against one,@k@v16/60600331. ......it''s just a good, clean duel."'
46805: 'Shannon@r@v15/60500300."..........................."'
46806: 'Jessica@r@v04/60200394."So in the end,@k@v04/60200395. ......we find that we should have just done this from the beginning..."'
46807: '@rThe four people stood up as though responding to some invisible summons...and faced each other, glaring...'
46808: '@rOnly Beato was off to the side,@k ......watching the course of the young lovers'' fight in suspense.'
46809: '@r......Each pair of lovers...@khas an unbreakably strong bond.'
46810: '@rThen, ......isn''t that enough?'
46811: '@rTheir love is already the real thing.@k There''s no need to test it.'
46812: '@rBut if so, ......then why must they fight...?'
46813: '@rThe victorious couple will be bound together by the magical miracle, ......and the defeated couple will fall apart.'
46814: '@rWhy have the demons promised us that we will fall apart without a magical miracle...?'
46815: '@r.........Why is a demon''s game like this necessary?@k ......I don''t understand.'
46816: '@rNo, they aren''t important right now...'
46817: '@rI have to think of an escape trick as soon as possible,@k ......so that I can save Battler-san from that locked room......'
46818: 'Elder BEATRICE@r@v60/60700896."............I heard about Battler.@k@v60/60700897. It seems things have gotten quite troublesome."'
46819: 'BEATRICE@r@v27/60700898."Onee-sama......"'
46820: 'Elder BEATRICE@r@v60/60700899."I would like to save you, as you are both my dear sister and a part of my full self.@k@v60/60700900. ......I am tackling Battler''s locked room in my own way, .........but it is difficult.@k@v60/60700901. It feels almost as though an ordinary chain has been made to look like a wire puzzle..."'
46821: 'BEATRICE@r@v27/60700902."I heard from LAMBDADELTA-san.@k@v27/60700903. ......She said that the old BEATRICE could definitely solve this trick.@k@v27/60700904. ......Don''t you have any idea?"'
46822: 'Elder BEATRICE@r@v60/60700905."That old BEATRICE is our completed form after we become one.@k@v60/60700906. ......Even I am naught but a part of her.@k@v60/60700907. It stands to reason that I cannot solve it..."'
46823: '@rBy this,@k ......she meant that we wouldn''t be able to figure it out no matter how much thought we put into it in our incomplete forms.'
46824: '@rShe was saying that neither the elder nor the younger sister...@k...could ever be expected to solve this riddle......'
46825: '@rBeato shook her head, chasing that thought from her mind.'
46826: 'BEATRICE@r@v27/60700908."I won''t give up...@k@v27/60700909. .........I''ll set right to work on that locked room...!@k @v27/60700910.Unless I can save Battler-san as soon as possible, .........his heart will be crushed."'
46827: 'Elder BEATRICE@r@v60/60700911."............Of course, I have no reservations about lending my own wisdom.@k@v60/60700912. ......However, even I cannot make anything out of this locked room..."'
46828: 'BEATRICE@r@v27/60700913."If we put our heads together, I''m sure we''ll find the same answer that we would if we were joined.@k@v27/60700914. ......Please lend me your wisdom and don''t give up...!!"'
46829: 'Elder BEATRICE@r@v60/60700915.".........I still cannot fathom why you are willing to go so for Battler,@k@v60/60700916. ......but I shall do as you ask.@k@v60/60700917. After all, it is a request made by myself.@k@v60/60700918. I will add my wisdom to yours......"'
46830: 'Zepar@r@v51/65100142."Look, Furfur.@k@v51/65100143. The two Beatos are thinking together."'
46831: 'Furfur@r@v52/65200132.".........I wonder if those two can really save Battler."'
46832: 'Zepar@r@v51/65100144."Oh, they can!@k @v51/65100145.If they have the miracle of love, that is...!!"'
46833: 'Furfur@r@v52/65200133."That''s right, Zepar!@k @v52/65200134.They can certainly do it if they have the miracle of love on their side!"'
46834: 'Zepar@r@v51/65100146."......Say, Furfur.@k@v51/65100147. Do you think they''ll realize that we''re giving them a hint for solving that locked room......?"'
46835: 'Furfur@r@v52/65200135."......................................."'
46836: '@rThe two Beatos put their heads together,@k ......and, straining their minds with all they had,@k ......they searched for a plan to save Battler with.'
46837: '@rIt was as though they couldn''t even see the four people glaring at each other and solemnly discussing the manner of the duel......'
46838: 'Furfur@r@v52/65200136."............They''ll realize.@k@v52/65200137. If they have love, they certainly will."'
46839: '@rThey were the demons of love.@k@rLove is the single element.@k The source of all miracles.'
46840: '@r......Could the miracle of love...provide an answer for a locked-room trick......?'
46841: 'Ange@r@v11/62000528."There it is again. "Without love, it cannot be ''seen''".@k@v11/62000529. ......I understand how that catchphrase can describe a certain concept.@k@v11/62000530. But locked-room tricks are pure, unfeeling mathematical puzzles, without a fragment of affection within them.@k@v11/62000531. .........Just what kind of hint could these demons be talking about...?"'
46842: 'FEATHERINE@r@v50/65000336."......I already have a certain answer.@k@v50/65000337. ......What these demons have said supports that even further..."'
46843: 'Ange@r@v11/62000532."Yeah, okay, you''re incredible.@k@v11/62000533. You always know the right answer.@k@v11/62000534. And you''ll never let me hear any of it.@k@v11/62000535. ......Going by the rule of observers, until you tell me about it,@k@v11/62000536. it''s possible that you''re just lying and pretending that you know."'
46844: 'FEATHERINE@r@v50/65000338."Pft, .........hhahahahahahahahahahaha.@k@v50/65000339. ......Yes, I believe I do prefer a bad-mouthed miko.@k@v50/65000340. You please me, child of man.@k@v50/65000341. To me, a miko''s sarcasm and abuse is like a ceremonial dance in my honor......"'
46845: 'Ange@r@v11/62000537."You''re a real irritating master.@k@|@y@v11/62000538. .........Stupid Onii-chan,@k@v11/62000539. ...why did you make a locked room like that......yourself......"'
46846: 'FEATHERINE@r@v50/65000342."Think, child of man.@k@v50/65000343. ......Thinking is not only a job for the characters within the tale.@k@v50/65000344. ......As a Reader, you too have the right to enjoy thinking.@k@v50/65000345. ......And I enjoy watching you as you do."'
46847: 'Ange@r@v11/62000540."......I''m willing to make a bet.@k@v11/62000541. Your last miko ran out of patience and ran away from you, didn''t she?"'
46848: 'FEATHERINE@r@v50/65000346."You are free to enjoy yourself by scolding me.@k@v50/65000347. You are also free to consider the problem like the two Beatos.@k@v50/65000348. ......Unless you think, the tale will not continue."'
46849: 'Ange@r@v11/62000542."Why?@k@v11/62000543. I''m a Reader, right?@k @v11/62000544.Can''t I just stay quiet and read?"'
46850: 'Tohya@r@v56/64900121.".........No.@k@v56/64900122. ......I want you to think.@k@v56/64900123. Not just the characters—you, the reader."'
46851: 'Ange@r@v11/62000545.".........!@k @v11/62000546.I see, ......you''re a pretty unpleasant author, aren''t you?"'
46852: '@rAnge was, of course, still only halfway through the tale.@k ......However, there were only a few pages left in the manuscript she was reading from.'
46853: '@rWhere was the manuscript for the rest of the tale?@k It should continue much further than this.'
46854: '@rThere should be many more pages remaining......'
46855: '@rThose were inside a different brown envelope, ......which was in Hachijo''s hand.'
46856: '@rWith a grin on her face, Hachijo waved the thick brown envelope about.@k ......"If you want to read more, do what I tell you".'
46857: 'Amakusa@r@v20/63000030."<Cool>......!@k @v20/63000031.Looks like she got you, missy!@k @v20/63000032.Hahahahahahahahaha, ahhahhahhahhahhahha...!"'
46858: '@rLetting you read only so far for free......and then stopping when it finally gets to the good part.@k Amakusa couldn''t stop laughing at this underhanded approach.'
46859: 'Tohya@r@v56/64900124."I want to hear your own opinions.@k@v56/64900125. ......Your own theories.@k@v56/64900126. ......If you tell me those now, ......I''ll hand over the rest of the manuscript."'
46860: 'Ange@r@v11/62000547."Quit mocking me.@k@v11/62000548. You think I''ll just do whatever you say after something like this...?"'
46861: 'Amakusa@r@v20/63000033."Come on now, missy, calm down.@k@v20/63000034. I want to read on too, so please just chill a bit."'
46862: 'Amakusa@r@v20/63000035."......About the rest of the manuscript, Hachijo.@k@v20/63000036. ......It contains the answer to the locked-room trick......and the truths behind a bunch of mysteries, right?"'
46863: 'Tohya@r@v56/64900127."Of course.@k@v56/64900128. .........However, I haven''t written it in a way that will be understandable to those who fail to think or consider..."'
46864: 'Ange@r@v11/62000549."......One of these days, you''re going to get stabbed by an obsessive reader of yours who''s very upset with you."'
46865: 'Tohya@r@v56/64900129."I understand that, which is why I don''t go out in the open.@k@v56/64900130. Child of man."'
46866: 'Amakusa@r@v20/63000037."Anyway, this is what Hachijo''s trying to say.@k@v20/63000038. ......First, tell me your answer.@k@v20/63000039. After that, I''ll let you check it."'
46867: 'Tohya@r@v56/64900131."......Correct, young man.@k@v56/64900132. .........I am not trying to be mean.@k@v56/64900133. ...I am asking because I want you to truly understand the tale''s conclusion."'
46868: 'Ange@r@v11/62000550."Amakusa, ......you''re really enjoying this, aren''t you?@k@v11/62000551. ......Yeah, come to think of it, you always take those TV quiz shows totally seriously.@k@v11/62000552. ......It looks like you enjoy life much more than I do."'
46869: 'Tohya@r@v56/64900134."So, ......what miraculous trick could get Battler out of the locked room?@k@v56/64900135. ......Please give it some thought yourself.@k@v56/64900136. I want to give the rest of the story especially to those—@k@v56/64900137.no, only to those who have thought..."'
46870: '@rIn the witches'' cathedral,@k ......no, considering everything that''s gone on in here, maybe it should be called a demon''s abode...'
46871: '@r...Erika, who wanted to savor the memory of her perfect victory,@k ......stood with the whole vast cathedral to herself as the flush slowly left her cheeks.'
46872: '@rThen,@k ......on the balcony that she had thought empty, ...a shadow came into view.'
46873: '@rIt was...LAMBDADELTA...'
46874: 'Erika@r@v46/64501275."......Oh, it''s you, Lady LAMBDADELTA.@k@v46/64501276. It''s not often one finds you alone in a place like this."'
46875: 'LAMBDADELTA@r@v29/62200349.".........Oh, you.@k@v29/62200350. ......Congratulations on your big victory.@k@v29/62200351. .........Heheh, that''s funny.@k@v29/62200352. I think I remember saying the same thing to you right here at the end of last game."'
46876: '@rShe was probably trying to be sarcastic.@k ......However, Erika was in such a good mood that even those words sounded like a compliment.'
46877: 'Erika@r@v46/64501277."I.....happened to hear what you said a short while back."'
46878: 'LAMBDADELTA@r@v29/62200353."......What?"'
46879: 'Erika@r@v46/64501278."I heard that you have also...@k@v46/64501279.......had the experience of being toyed with as a piece on some Great Witch''s game board,@k@v46/64501280. then sealed away in some awful hell..."'
46880: '@rErika had an unpleasant, triumphant look on her face,@k as though she had managed to pry into some embarrassing memory of another''s past.'
46881: '@rHowever, LAMBDADELTA didn''t look in the least bit flustered,@k ......and instead looked down from the balcony in silence.'
46882: 'LAMBDADELTA@r@v29/62200354.".........Yep.@k@|@y@v29/62200355. ......I wonder how many years I was shut up in there.@k@v29/62200356. ......Maybe I should''ve been like Bern and counted them...@k@v29/62200357. .........No, it''s probably best that I didn''t.@k@v29/62200358. Counting the years.........is what broke her."'
46883: 'Erika@r@v46/64501281."Are you saying...@k@v46/64501282.......that my master also fell into the hell of a logic error at some point...?"'
46884: 'LAMBDADELTA@r@v29/62200359."She did.@k@v29/62200360. Though she wasn''t the one responsible for that logic error."'
46885: 'Erika@r@v46/64501283."......Because she wasn''t the Game Master...?"'
46886: 'LAMBDADELTA@r@v29/62200361."That''s right.@k@v29/62200362. ......At that time, she was still a small piece that wasn''t even self-aware yet.@k@v29/62200363. It was her master, the Game Master, who committed the logic error."'
46887: 'Erika@r@v46/64501284."......My master was also...@k@v46/64501285....a witch''s piece?"'
46888: 'LAMBDADELTA@r@v29/62200364."Yep.@k@v29/62200365. .........That kid''s master......oh, yes, she was a bad one.@k@v29/62200366. ......Though she created the game herself, partway through, she lost sight of what her goal was.@k@v29/62200367. ......She created something like a broken game of backgammon,@k@v29/62200368. where the start and the goal were connected like a donut."'
46889: 'Erika@r@v46/64501286."What do you mean, she lost her goal......?"'
46890: 'LAMBDADELTA@r@v29/62200369."I''m talking about a logic error.@k@v29/62200370. ......She couldn''t describe how to reach her desired goal,@k@v29/62200371. couldn''t draw up the logic to her backgammon game.@k@v29/62200372. So, the game remained broken, with no goal at all."'
46891: 'LAMBDADELTA@r@v29/62200373."......She should have settled down and thought of an answer herself.@k@v29/62200374. ......But instead, she despicably left even the thinking entirely to her piece, Bern.@k@v29/62200375. .........Have you heard of the infinite monkey theorem?"'
46892: 'Erika@r@v46/64501287."......It''s the theory that if a monkey hits random letters on a typewriter for an infinite amount of time,@k@v46/64501288. at some point, the string of letters might end up exactly the same as Hamlet by sheer coincidence.@k@v46/64501289. ......I''d rather call it an absurdity than a theorem."'
46893: 'LAMBDADELTA@r@v29/62200376.".........Wouldn''t that be a horrible hell?@k@v29/62200377. .........Bern was forced to type randomly on that typewriter for an eternal period of time, without even knowing the meaning of what she was doing.@k@v29/62200378. .........The goal eluded even the Game Master herself,@k@v29/62200379. so she tried to get Bern to create it for her."'
46894: '@r......Could Erika even imagine...@k...how horrible a hell that had been?'
46895: '@rA job that you have to do a hundred times and a job that you have to keep repeating until it succeeds with a 1/100 probability...@k......may look very similar probabilistically, ......but the difference in cruelty between them is great.'
46896: '@rWhen you have to do a job a hundred times, you steadily approach the end, get more efficient as you become more used to it,@k and eventually, you can finish.'
46897: '@rHowever, when you have to do a job that succeeds with a 1/100 probability,@k ......the hard work of the individual doesn''t translate to even a slight gain in efficiency.'
46898: '@rEverything is left to luck.'
46899: '@r......If luck isn''t on your side, even the task of flipping a coin until you get heads...@k...can last more than a hundred years......'
46900: 'LAMBDADELTA@r@v29/62200380."How many keys are there on a typewriter?@k @v29/62200381.About a hundred, maybe?@k@v29/62200382. ......What do you think the odds are of hitting those at random and getting Hamlet...?"'
46901: 'Erika@r@v46/64501290.".........I can''t......even imagine.@k@v46/64501291. ......They must be......truly astronomical."'
46902: 'LAMBDADELTA@r@v29/62200383."That''s right.@k@v29/62200384. ......A virtually infinite amount of time.@k@v29/62200385. .........For that mind-bending stretch of time,@k@v29/62200386. ......that child was made to keep pounding on that typewriter until she typed out a "miracle"."'
46903: 'Erika@r@v46/64501292."And that''s why......she''s the Witch of Miracles...?"'
46904: 'LAMBDADELTA@r@v29/62200387."If she wasn''t a witch—no, if she hadn''t been able to become a witch,@k@v29/62200388. ......she would probably still be a black cat strapped to that typewriter for eternity.@k@v29/62200389. ......That child was blessed by a miracle, ......succeeded in typing out a "miracle",@k@v29/62200390. ...became a witch, and returned from that hell alive."'
46905: 'LAMBDADELTA@r@v29/62200391."That hell was so long and harsh......that her mind and heart were completely broken.@k@v29/62200392. That''s why she became such a mean and heartless witch.@k@v29/62200393. .........Given the choice, even you wouldn''t have chosen a master like her, right?"'
46906: 'Erika@r@v46/64501293."Th-that''s not true...!@k @v46/64501294.I am honored to be my master''s piece.@k@v46/64501295. My master is strong, an oppressor of others.@k@v46/64501296. Trampling over the weak is her natural right."'
46907: 'LAMBDADELTA@r@v29/62200394.".........You mean she''s a human on the bully''s side of life...?@k @v29/62200395.Heheh.@k@v29/62200396. ......Do you know how to create the greatest bully ever?"'
46908: 'Erika@r@v46/64501297."......?@k @v46/64501298.No."'
46909: 'LAMBDADELTA@r@v29/62200397."It''s easy.@k@v29/62200398. For just a short time, bully them horribly, ...then suddenly stop, and give them power instead.@k@v29/62200399. ......If you do that, then no matter who it is, they will be reborn as a grade-A bully.@k@v29/62200400. And what''s even more incredible is, even if that person was only bullied for about three days, they''ll reign as a grade-A bully for a billion times longer than that,@k@v29/62200401. believing themselves the victim all the while."'
46910: 'Erika@r@v46/64501299."............What does that have to do with my master?"'
46911: 'LAMBDADELTA@r@v29/62200402."......You don''t understand anything about Bern.@k@v29/62200403. .........No matter what kind of ruthless, cruel, horrible pukespittle Bern may be,@k @v29/62200404.......I want to be the one person who knows what she''s truly like."'
46912: 'LAMBDADELTA@r@v29/62200405.".........And it''s the same for me.@k@v29/62200406. ...I think that kid, as a fellow survivor from hell, .........is the only one who can understand what I''m truly like.@k@v29/62200407. .........It sounds like you''re jealous of the relationship we have, but give it up.@k@v29/62200408. The hell you think you''ve trudged through is nothing more than a blink compared to the one we crawled out of."'
46913: 'Erika@r@v46/64501300."...................................."'
46914: '@rLAMBDADELTA was probably......mocking Erika back.'
46915: '@rAnd the discouraged expression on Erika''s face clearly showed that she couldn''t accept LAMBDADELTA''s words.'
46916: 'Erika@r@v46/64501301.".........If you''ll pardon me for saying,@k@v46/64501302. ......I think it''s the depth of the hell that''s important, not the length of time spent there."'
46917: 'LAMBDADELTA@r@v29/62200409."Oh......?@k@v29/62200410. ......You''re not afraid to talk back, are you? .........Witch of Truth, ERIKA."'
46918: 'Erika@r@v46/64501303."I don''t know what kind of hell you were in, Lady LAMBDADELTA.@k@v46/64501304. ......And I''m sure the time I spent in hell was nothing more than a flash compared to yours.@k@v46/64501305. ......However, I don''t think the depths of my hell were any shallower than yours."'
46919: 'LAMBDADELTA@r@v29/62200411.".........In celebration of your victory, I''ll hear you out without arguing back."'
46920: 'Erika@r@v46/64501306."From my point of view,@k@v46/64501307. ......both the hell my master fell into, which could only be escaped by a miracle,@k@v46/64501308. ......and the hell you fell into, which presumably could only be escaped with certain willpower,@k@v46/64501309. ......were "hells made to be escapable"."'
46921: 'LAMBDADELTA@r@v29/62200412."Really......@k@v29/62200413. ......That''s a bold thing to say."'
46922: 'Erika@r@v46/64501310."I am the Witch of Truth.@k@v46/64501311. ......In the depths of my hell, there was nothing more or less than the truth.@k@v46/64501312. .........When faced with the harsh reality of truth, no sort of willpower or miracle matters.@k@v46/64501313. I reached this place by overcoming that truth.@k@v46/64501314. ......I don''t believe my power to withstand the truth is in any way inferior to yours...@k@v46/64501315.or my master''s."'
46923: 'LAMBDADELTA@r@v29/62200414."And what is this "power to withstand the truth"?"'
46924: 'Erika@r@v46/64501316."......Those who don''t know cannot understand.@k@v46/64501317. Perhaps your inability to look that in the face...@k@v46/64501318.is the reason you two couldn''t become Witches of Truth...?"'
46925: 'LAMBDADELTA@r@v29/62200415."........................@k@|@y@v29/62200416. ......Heh......heheheheheheheheheh.@k@v29/62200417. ......I''ll forgive you for those impudent words.@k@v29/62200418. Letting them pass with a slight nod is my present to you for your recent victory."'
46926: 'Erika@r@v46/64501319."*giggle*.@k@v46/64501320. ......Thank you very much, Great Lady LAMBDADELTA☆"'
46927: 'BERNKASTEL@r@v28/62100286."Oh, that''s unusual.@k@v28/62100287. ......It''s rare to spot you two getting along."'
46928: '@rAt some point, BERNKASTEL had appeared on the opposite balcony of the cathedral.'
46929: '@rErika, noticing her, cried "my master" happily and dashed over.'
46930: 'Erika@r@v46/64501321."Lady LAMBDADELTA was telling me old stories about you.@k@v46/64501322. ......A tale of miracles fitting for my master, the Witch of Miracles...!"'
46931: 'BERNKASTEL@r@v28/62100288."............I''ll forgive you just this once."'
46932: 'Erika@r@v46/64501323."Huh?"'
46933: 'BERNKASTEL@r@v28/62100289."Never speak of my past again."'
46934: '@rA grimace rose to her face,@k ......blasting Erika''s good mood away.'
46935: '@rAnd so, Erika understood.@k ......BERNKASTEL was also a witch running from boredom.@k Because if it ever caught up with her, ......she would remember.@k ......Those never-ending days of hell......'
46936: '@rThis is proof that even my master...@k...still hasn''t gotten over the pain and fear of hell.'
46937: '@rIt means that she lacks the power to withstand the truth.'
46938: '@r.........For the first time,@k ......Erika felt just a little disdain for her master.'
46939: 'Erika@r@v46/64501324."......My apologies.@k@v46/64501325. ......More importantly, what brings you to a place like this?"'
46940: 'BERNKASTEL@r@v28/62100290.".........I was looking for you. I wanted to give you a reward."'
46941: 'Erika@r@v46/64501326."A reward!@k @v46/64501327.......Really?!@k @v46/64501328.Th-thank you very much, my master!!"'
46942: 'LAMBDADELTA@r@v29/62200419."Ooh?@k@v29/62200420. ......Wow, I''m jealous!@k @v29/62200421.What are you gonna give her?"'
46943: 'BERNKASTEL@r@v28/62100291."First, I acknowledge your ascension as a true witch, not just a temporary one.@k@v28/62100292. .........I''ll be your guardian.@k@v28/62100293. Witch of Truth, Furudo ERIKA."'
46944: 'Erika@r@v46/64501329."Th-thank you very much!!"'
46945: 'LAMBDADELTA@r@v29/62200422."All you did was remove the temporary bit.@k@v29/62200423. That sort of reward can''t be very pleasing.@k@v29/62200424. She really deserves something better, don''t you thi~nk?"'
46946: 'Erika@r@v46/64501330."N-no, that''s not true, I''m very pleased."'
46947: '@rOf course, on the inside, Erika did want another present.@k ......Taking a cue from LAMBDADELTA, she waited patiently to see if there would be any other rewards.'
46948: 'BERNKASTEL@r@v28/62100294."I do have one other."'
46949: '@rBERNKASTEL snapped her fingers.'
46950: '@r......As she did, a cloud of gold butterflies gathered,@k ......and summoned Battler sitting in a throne at the center of the cathedral.'
46951: '@rOf course, his eyes were blank.@k ......He was still a shell of himself, his heart trapped in the locked room that he would never be allowed to escape from...'
46952: 'BERNKASTEL@r@v28/62100295."That man is your reward."'
46953: 'Erika@r@v46/64501331."......My reward......is Battler......?"'
46954: 'LAMBDADELTA@r@v29/62200425."Ooh...@k@v29/62200426. ......I see.@k@|@y@v29/62200427. ......She''s saying she''ll make it so that you inherit all of this game board''s territory."'
46955: 'BERNKASTEL@r@v28/62100296."That''s right.@k@v28/62100297. ......Look at Battler''s finger.@k@|@y@v28/62100298. ......He''s wearing the ring of the One-winged Eagle, symbol of the territory lord.@k@v28/62100299. If that becomes yours, you''ll become the official lord of this territory.@k@v28/62100300. ......I don''t mean you''ll be under my charge.@k@v28/62100301. ......In name and reality, this territory will be yours."'
46956: 'Erika@r@v46/64501332."So I need to take that ring off Battler''s finger...?"'
46957: 'LAMBDADELTA@r@v29/62200428."......*giggle*.@k@v29/62200429. Don''t be silly.@k@v29/62200430. ......There''s only one ceremony where a woman gets a ring from a man''s finger, right?"'
46958: 'BERNKASTEL@r@v28/62100302."Erika.@k@v28/62100303. ......Take Battler as your husband and become the wife of the territory lord."'
46959: 'Erika@r@v46/64501333."M-......marry......Battler......?!"'
46960: 'BERNKASTEL@r@v28/62100304."Yes, that''s right.@k@v28/62100305. ......If the territory lord is never to wake again, he''ll need a partner to serve by his side and act as his proxy.@k@v28/62100306. ......In other words, you will control this territory."'
46961: 'LAMBDADELTA@r@v29/62200431."And we''ll hold a wedding where you''ll exchange rings.@k@v29/62200432. ......Battler''s territory lord ring will become yours..."'
46962: 'BERNKASTEL@r@v28/62100307."And in exchange, you will put a ring of servitude on Battler''s finger.@k@v28/62100308. ......For eternity you will rule him, debase him,@k@v28/62100309. ...and use this territory and game board to weave whatever tale your heart desires."'
46963: 'LAMBDADELTA@r@v29/62200433."Furudo ERIKA, you will be the territory lord.@k@v29/62200434. ......Any tale you wish will come true.@k@v29/62200435. ......The territory lord is a god.@k@v29/62200436. ...Congrats, you''ll be the god of this small but wonderful world."'
46964: 'Erika@r@v46/64501334."......Ha......hahahahaha...hahahahahahahahahahahahahaha...@k@v46/64501335. Is that......true, ...my......master......?!!@k @v46/64501336.Will I......become this world''s......god......?"'
46965: 'BERNKASTEL@r@v28/62100310."That is the final reward I will give to you.@k@v28/62100311. Take Battler''s ring and create your own world.@k@v28/62100312. ......When that happens, you won''t be my piece anymore.@k@v28/62100313. You''ll be your own witch, and a splendid one at that."'
46966: 'BERNKASTEL@r@v28/62100314.".........Congratulations, Lady ERIKA.@k@v28/62100315. And, one day, you must welcome me when I come to visit, just like Beato once did."'
46967: 'Erika@r@v46/64501337."Y-yes, my master...!!@k @v46/64501338.There could be no greater honor...!@k @v46/64501339.And I''m starting to like this marriage to Battler thing!@k @v46/64501340.......*giggle*, if you think about it, there could be no greater disgrace to this game!"'
46968: 'Erika@r@v46/64501341."After all, that BEATRICE was apparently born out of a desire to serve Battler and be liked by him.@k@v46/64501342. In the world that witch created, ......I will marry, defile, and humiliate Battler!!@k @v46/64501343.*giggle*giggle*, *cackle*cackle*cackle*cackle*!!@k @v46/64501344.Oh yes, I understand.@k@v46/64501345. I sooo understand how painful it feels to have the one you love stolen away from you!!@k @v46/64501346.And now, I''m finally the one dealing out the pain...!!@k @v46/64501347.Truly, there could be no greater honor!!"'
46969: 'BERNKASTEL@r@v28/62100316."I''m glad you like it.@k@v28/62100317. I knew it was the one present you''d like most in the world."'
46970: 'Erika@r@v46/64501348."Thank you so much, thank you so much!!@k @v46/64501349.My......masterrrrrrrrrrr...!!!"'
46971: '@rErika leapt down from the balcony and walked briskly towards Battler.'
46972: '@rThen, she peered down at the reward she had been given...'
46973: 'LAMBDADELTA@r@v29/62200437.".........Now isn''t that a wonderful finale.@k@v29/62200438. You''ll hold a wedding ceremony?"'
46974: 'BERNKASTEL@r@v28/62100318."Of course.@k@v28/62100319. A magnificent one.@k@v28/62100320. It''s the perfect way to end Beato''s game."'
46975: 'LAMBDADELTA@r@v29/62200439."Of course, you''ll send Beato an invitation too, right?"'
46976: 'BERNKASTEL@r@v28/62100321."I only hope she actually comes."'
46977: '@r@v28/62100322|29/62200440.""*giggle*giggle*, ehheheheheheheheheheheheheh!!""'
46978: 'BERNKASTEL@r@v28/62100323."......Alright, things are going to get busy.@k@v28/62100324. We have to prepare for the ceremony, make programs, send invitations..."'
46979: 'LAMBDADELTA@r@v29/62200441."Don''t forget the wedding dress and a cake!!@k @v29/62200442.And you need to get things ready for the reception!"'
46980: '@rThe two witches disappeared, cackling.@k@rOnly the two who were to be wed remained in the cathedral.'
46981: 'Erika@r@v46/64501350.".........Could you hear...?@k @v46/64501351.......Battler-san.@k@v46/64501352. .........Do you realize......what''s about to happen to you......?"'
46982: 'Battler@r@v10/60100921."...........................@k@v10/60100922. .........Damn......it......"'
46983: '@rBattler''s consciousness wasn''t completely gone.@k ......It was very distant......but he was slightly tethered to reality.'
46984: '@r......And that......was what made it cruel.'
46985: '@rIt was as cruel as though the spider called Erika had wrapped Battler up...@k...and was eating him while he was still conscious.'
46986: '@rIn fact, she might have been more like certain kinds of wasp,@k paralyzing her prey and keeping it alive so that she could eat it later.'
46987: '@rIn short,@k her cruelty was very similar to that of a predator......'
46988: 'Erika@r@v46/64501353."You won''t be able to get out of that locked room.@k@v46/64501354. After all, you used all that red truth to show that it was a locked room.@k@v46/64501355. So stop worrying, and just let yourself be trapped in there forever."'
46989: 'Erika@r@v46/64501356."......While you''re spending time in there,@k@v46/64501357. ......I''ll take my time defiling your body.@k@v46/64501358. .........I''ll have our bedroom lined with mirrors.@k@v46/64501359. ......That way, you can see just how you''re being humiliated,@k@v46/64501360. ......with your own eyes.@k@v46/64501362. ............@|@y*giggle*giggle*giggle*giggle*!!"'
46990: 'Erika@r@v46/64501363."And then, let''s have a bird cage hanging from the ceiling.@k@v46/64501364. We can stick your beloved witch BEATRICE in there.@k@v46/64501365. What do you think......?@k @v46/64501366.......Wonderful, isn''t it......?@k @|@y@v46/64501367.Eheheheheheheheheeheheheheheheheh!!@k @v46/64501368.Aah, ......I can feel it.@k@v46/64501369. This is how sweet it is to be standing on the other side...@k@|@y@v46/64501370. ...Aha, ahahahahahahahahahahahahaha......"'
46991: '@rAs he listened to this mad laugh, ......Battler couldn''t even bring a distressed expression to his face.'
46992: '@rHis heart was still trapped in the locked room he had created...@k@rAnd his body and soul......would soon be trapped within a new locked room of Erika''s.'
46993: '@rA locked room...@k......called marriage.'
46994: 'Zepar@r@v51/65100148."Hey, did you hear, Furfur...?!"'
46995: 'Furfur@r@v52/65200138."I sure did, Zepar...!@k @v52/65200139.Lord BATTLER and Lady ERIKA are having a wedding!"'
46996: '@rThey said it with so much of their usual frivolity...@kthat Beato had to ask them to repeat it again.'
46997: 'BEATRICE@r@v27/60700919."Wh-......what......is happening......?"'
46998: 'Zepar@r@v51/65100149."As you know, the lord of this territory has had his heart sealed away and cannot speak."'
46999: 'Furfur@r@v52/65200140."So the beautiful Lady ERIKA is going to become his wife and support him in his work!"'
47000: '@rThe two demons explained the situation in a very simple,@k yet dramatic way.'
47001: '@r......I know what''s going on.'
47002: '@rThey''re planning to take advantage of the fact that Battler''s heart is sealed away and use marriage to lock up his body as well,@k so that they can steal everything from him...'
47003: '@rAt this rate, ......Battler will have his position as Game Master...@k...and his territory lord''s ring......stolen away...'
47004: 'Elder BEATRICE@r@v60/60700920."That damn homewrecker, she thinks she can do whatever she wants...!!@k @v60/60700921.Let''s steal him back!@k @v60/60700922.He may be of little importance to me, but matters that affect you are my business also!"'
47005: 'Zepar@r@v51/65100150."It''s no use to just steal his body back!@k @v51/65100151.After all, the great Lady BERNKASTEL has already signed the marriage certificate as a witness!"'
47006: 'Furfur@r@v52/65200141."With a Great Witch of the Senate serving as a witness, no one can dispel the union except for those who are a part of it...!"'
47007: 'BEATRICE@r@v27/60700923."......Then it''s as I thought...... Unless I can rescue Battler-san''s heart from that locked room,@k@v27/60700924. ......there''s no way we can save him......"'
47008: 'Zepar@r@v51/65100152."Then find a way to rescue him from that locked room!"'
47009: 'Furfur@r@v52/65200142."You''re going to steal away the bridegroom?!@k@v52/65200143. Ah!! How wonderful!!"'
47010: 'Elder BEATRICE@r@v60/60700925."......If you can do that, it would make for a tale beautiful enough for the opera.@k@v60/60700926. However, this locked room sealing Battler is quite difficult..."'
47011: 'BEATRICE@r@v27/60700927."The only way out is the door.@k@v27/60700928. And if the chain is unset, his escape won''t be accepted..."'
47012: 'Zepar@r@v51/65100153."And on top of that, the chain can''t be set from the outside!"'
47013: 'Furfur@r@v52/65200144."And now there''s no one left to switch places with him!"'
47014: 'Elder BEATRICE@r@v60/60700929."......No matter how you think about it, we''re stuck!"'
47015: 'BEATRICE@r@v27/60700930."If we give up, ......we won''t be able to save him.@k@v27/60700931. ...The only thing we can do to save him now......is to keep at it and keep thinking."'
47016: '@rThough Beato looked as though she was about to burst into tears, ......she clenched her fists tightly.'
47017: '@rShe was so frustrated with her inability to think up any brilliant plan...that her heart felt as though it would burst...'
47018: 'Elder BEATRICE@r@v60/60700932."......Zepar and Furfur, you two are known as being among the most powerful of demons.@k@v60/60700933. They say your magic can make the impossible possible.@k@v60/60700934. ......Could you not use your power and knowledge to work out a plan for crushing this impossible locked room...?!"'
47019: 'Zepar@r@v51/65100154."Yes, love can accomplish any impossible thing!"'
47020: 'Furfur@r@v52/65200145."If you can''t accomplish something, it means you lack enough love!"'
47021: 'BEATRICE@r@v27/60700935."..................Hearing that...@k@v27/60700936....hurts..."'
47022: 'Zepar@r@v51/65100155."But we are moved by the strength of will that prevents you from giving up!"'
47023: 'Furfur@r@v52/65200146."Because you have that, we''re sure you can bring about a miracle!"'
47024: 'Elder BEATRICE@r@v60/60700937."......Can''t you at least give us a hint about that miracle?!@k @v60/60700938.We have known each other for no short span of time.@k@v60/60700939. ......Will you not at least give my little sister a hint as a parting gift?"'
47025: '@r@v00/awase6048.""A hint?@k@v00/awase6049. We are always giving out hints.""'
47026: 'Zepar@r@v51/65100158."Without love—"'
47027: 'Furfur@r@v52/65200149."They cannot be ''seen''!"'
47028: 'Elder BEATRICE@r@v60/60700940."......If we could ''see'' them, I would not have asked!@k@v60/60700941. ......These two are always like this.@k@v60/60700942. It staves off boredom, but they can become very irritating at times like this."'
47029: '@rZepar and Furfur certainly were demons who possessed a great power.@k@rThe power of love that they bestowed had created several miracles in the past, miracles so great that they left a mark on human history.'
47030: '@rHowever, those miracles were never given easily.'
47031: '@rThey would give trials, tell riddles, ......and sometimes help the truth be realized,@k ......so that those who desired power could create that power themselves.'
47032: '@rNo matter how pitiful the eyes that looked up at them, the two demons would never lend their power out of pity.'
47033: '@rAs it is with God, it is with demons:@k ......they help those who help themselves.'
47034: 'BEATRICE@r@v27/60700943."I understand.@k@v27/60700944. ......I''ll think about it myself...@k@v27/60700945. ......I swear......I will free him......"'
47035: 'Elder BEATRICE@r@v60/60700946."Look upon her, demons! When last did you see a girl so pure of heart...?!@k @|@y@v60/60700947.As the demons of love, don''t your hearts ache even a little?!@k @v60/60700948.Come, let''s have a hint...!@k @v60/60700949.Surely you could give us a hint to a hint, at least?"'
47036: '@rZepar and Furfur looked at each other.'
47037: '@r......Of course, there was no pity on their faces.@k However, it could be seen that, though they did find the problem amusing, they were considering what they should do next.'
47038: 'Zepar@r@v51/65100159."What''ll we do, Furfur?!"'
47039: 'Furfur@r@v52/65200150."Maybe a hint to a hint would be okay?!"'
47040: 'Elder BEATRICE@r@v60/60700950."Yes, even that would be welcome, so let''s have it!"'
47041: '@r@v00/awase6050.""Oookay!@k @v00/awase6051.Here''s a present from Zepar and Furfur!@k @v00/awase6052.A hint to a hint of love!!""'
47042: 'BEATRICE@r@v27/60700951."P-please...!!"'
47043: 'Furfur@r@v52/65200154."You cannot ''see'' the answer—"'
47044: 'Zepar@r@v51/65100163."Because you don''t have enough love!"'
47045: 'Elder BEATRICE@r@v60/60700952."I—I told you, not a hint like that!"'
47046: 'Furfur@r@v52/65200155."And if you don''t have enough love...?!"'
47047: 'Zepar@r@v51/65100164."Why not observe couples who have it in abundance?!"'
47048: 'Furfur@r@v52/65200156."Yes, and as luck would have it,@k @v52/65200157.we have two loving couples right here!"'
47049: 'Zepar@r@v51/65100165."Why not stay awhile and be a spectator to their fight for love?!"'
47050: '@r@v00/awase6053.""You should watch our trial from the position of an outside observer!!""'
47051: 'Elder BEATRICE@r@v60/60700953."Will you listen?!!@k @v60/60700954.Not a hint like that, I said!"'
47052: '@rBeato the Elder yelled at them, asking for a more tangible hint.'
47053: '@rHowever, Zepar and Furfur just giggled...@k...and ran about like rats.'
47054: '@r......Beato, on the other hand,@k ......took their hint to a hint...@k...seriously.'
47055: '@rNow that she was out of the running,@k ......the second trial was between George and Shannon...and Jessica and Kanon.'
47056: '@r— Tear apart the two who are close.'
47057: '@rIn other words, defeat one of the members of the opposing team.'
47058: '@rThey were allowed to use any method they wanted.@k It could be a duel, or it could be rock-paper-scissors.'
47059: '@r......After alternating many times between speaking as a group and discussing things as couples,@k ......finally, the four of them seemed to have reached a decision.'
47060: 'George@r@v07/60300474.".........Zepar, Furfur.@k@v07/60300475. Do you have a second?"'
47061: 'Zepar@r@v51/65100167."Oh, they''ve finally called out to us!!"'
47062: 'Furfur@r@v52/65200159."What is it, George?!@k @v52/65200160.Have you decided the format for the duel?!"'
47063: '@rNo matter how much the two demons baited them with their facetious tone,@k the couples'' serious expressions did not waver...'
47064: 'Shannon@r@v15/60500301."......Yes.@k@v15/60500302. We''ve decided to have it...as a single duel."'
47065: 'Kanon@r@v16/60600332."It will be a duel between Shannon and me."'
47066: 'Zepar@r@v51/65100168."That''s surprising.@k@v51/65100169. For a one on one duel, we would have thought—"'
47067: 'Furfur@r@v52/65200161."That George and Jessica would''ve fought."'
47068: 'Jessica@r@v04/60200396."......These guys...@k@v04/60200397.really wanted it to be them, and they wouldn''t listen."'
47069: 'George@r@v07/60300476."As a man, I find it frustrating that all I can do is watch.@k@v07/60300477. ......However, Shannon''s resolve is firm.@k@v07/60300478. So I—we—have no choice but to respect their decision and believe in them..."'
47070: 'Jessica@r@v04/60200398.".........Kanon-kun..."'
47071: 'Kanon@r@v16/60600333."Thank you so much......for believing in me.@k@v16/60600334. I''ve always thought that, if the day ever came when we had to fight each other directly,@k@v16/60600335. ......then we shouldn''t shy away from it."'
47072: 'Shannon@r@v15/60500303."And we''ve realized that...that day is today.@k@v15/60500304. ......Of course, we might have been able to avoid this day."'
47073: 'Kanon@r@v16/60600336."However,@k@v16/60600337. ......now this day has come.@k@v16/60600338. So, we will not run from it."'
47074: 'Jessica@r@v04/60200399."......That''s right.@k@v04/60200400. ......I''ll stay right here too."'
47075: 'George@r@v07/60300479."Me too.@k@v07/60300480. .........I believe in Shannon.@k@v07/60300481. So, I won''t say anything more.@k@v07/60300482. ......And, even if Shannon is the one fighting in the duel,@k@v07/60300483. ...our power is one.@k@v07/60300484. So, we''ll be fighting together."'
47076: 'Shannon@r@v15/60500305.".........Yes, that''s right.@k@v15/60500306. ......I''m just speaking for the pair of us."'
47077: 'Zepar@r@v51/65100170."If it is a decision made by those in love—"'
47078: 'Furfur@r@v52/65200162."Even demons will not object."'
47079: 'Zepar@r@v51/65100171."So, ......how would you like to settle this duel?"'
47080: 'Furfur@r@v52/65200163."You don''t mean...@k@v52/65200164.that you want to have a real "duel", do you?"'
47081: '@rAt once, both Shannon and Kanon nodded.'
47082: 'Zepar@r@v51/65100172."......And the method?"'
47083: 'Kanon@r@v16/60600339."That doesn''t matter, as long as it is a fight to the death."'
47084: 'Shannon@r@v15/60500307."If possible, ......we would like it to be peaceful and painless.@k@v15/60500308. And we would like to avoid wounding each other unnecessarily before one of us dies."'
47085: 'Furfur@r@v52/65200165.".........Zepar.@k@v52/65200166. We should be the ones to oversee this noble duel."'
47086: 'Zepar@r@v51/65100173."True.@k@v51/65100174. ......Very well, you two.@k@v51/65100175. We propose a noble duel, one that will honor your noble spirits!"'
47087: '@rWhen Zepar clapped loudly, a case with an old design appeared in the air and landed between Shannon and Kanon.'
47088: '@rFurfur nodded at them, urging them to open it.'
47089: '@rKanon crouched down and opened the case.'
47090: '@r......There were a pair of antiques inside.@k They would have looked splendid hanging on the wall at some classy coffee shop.'
47091: '@rHowever, they were not mere decorations now.'
47092: 'Jessica@r@v04/60200401."............Th-these are......"'
47093: 'George@r@v07/60300485."I see.@k@v07/60300486. ......Just perfect for a duel..."'
47094: '@rInside the case......was a pair of old-fashioned dueling pistols,@k like the kind used many centuries ago.'
47095: '@rYes, this was a dueling pistol case,@k ......which was only permitted to be opened by those who wished for a fight to the death.'
47096: 'Zepar@r@v51/65100176."They have one bullet each.@k@v51/65100177. In accordance with your request, we have imbued the bullets with magic."'
47097: 'Furfur@r@v52/65200167."No matter where on your body they hit you,@k@v52/65200168. these magic bullets will bring certain and painless death."'
47098: 'Shannon@r@v15/60500309."......Thank you very much.@k@v15/60500310. You are...most merciful."'
47099: 'Kanon@r@v16/60600340."And what if we both miss?"'
47100: 'Zepar@r@v51/65100178."Normally, that would be a draw.@k@v51/65100179. ......However, such a thing is not allowed in our trial."'
47101: 'Furfur@r@v52/65200169."If you both miss, you will come back, and we will give you new bullets.@k@v52/65200170. This will repeat until one of you is dead."'
47102: 'Kanon@r@v16/60600341."......I have no objections."'
47103: 'Shannon@r@v15/60500311."Me neither.@k@v15/60500312. ......I''m glad.@k@v15/60500313. This means we can finally—"'
47104: '@r@v00/awase6054_o.""Settle this.""'
47105: 'Zepar@r@v51/65100180."Ushiromiya George, I recognize you as the witness for Shannon—nay, Sayo."'
47106: 'George@r@v07/60300487."......Understood."'
47107: 'Furfur@r@v52/65200171."Ushiromiya Jessica, I recognize you as the witness for Kanon—nay, Yoshiya."'
47108: 'Jessica@r@v04/60200402."S-......sure...!"'
47109: '@r@v00/awase6055.""We are responsible for this duel!@k @v00/awase6056.It is our responsibility to see that this duel reaches a decision no matter what!!""'
47110: '@rWhen Zepar and Furfur cried these words out,@k ......the whole area was blanketed in a gold-colored light, ......and when it cleared,@k ......it had become the rose garden where golden roses bloomed......'
47111: 'Elder BEATRICE@r@v60/60700955."A duel over love, is it......@k@v60/60700956. How old-fashioned they are.@k@v60/60700957. ......I have seen many duels with pistols during my thousand years, ......but I have never seen one like this."'
47112: 'BEATRICE@r@v27/60700958."......Because it''s being overseen by demons...?"'
47113: 'Elder BEATRICE@r@v60/60700959."No.@k@v60/60700960. ......A duel over love is usually a fight between two people both in love with the same single person.@k@v60/60700961. However, here we have a pair of lovers fighting another pair of lovers.@k@v60/60700962. ......This is quite odd."'
47114: 'BEATRICE@r@v27/60700963."I''m sure......that''s because they want the miracle of magic.@k@v27/60700964. ......It seems we cannot succeed in love without that miracle..."'
47115: 'Elder BEATRICE@r@v60/60700965."........................@k@v60/60700966. ......Do you know the minimum number of people needed to create a universe?"'
47116: 'BEATRICE@r@v27/60700967."......Huh?@k @v27/60700968.N-no, ......I don''t..."'
47117: '@rShannon and Kanon each took a pistol out of the case,@k returned to their respective witnesses, and checked the weapons over.'
47118: '@rThen, after they had both determined that there were no problems,@k ......the two were asked one final time whether they were prepared to duel,@k ......and both of them nodded.'
47119: 'Zepar@r@v51/65100183."If there are no problems, the duelists shall stand back to back,@k@v51/65100184. ......then walk a predetermined number of steps away from each other."'
47120: 'Furfur@r@v52/65200174."Then, the duel will begin on our signal.@k@v52/65200175. ......Zepar, how many steps should they walk?"'
47121: 'Zepar@r@v51/65100185."...............Good question.@k@v51/65100186. ......Well, ......maybe we should choose a number that is closely bound to this duel."'
47122: 'Furfur@r@v52/65200176."A number closely bound......?@k @v52/65200177.What number is that?"'
47123: 'Zepar@r@v51/65100187."It''s a number we know of well.@k@v51/65100188. ......It is that number which has been repeated over and over again since the time this tale began...!!"'
47124: '@r@v00/awase6057.""That number is "19"!""'
47125: 'Shannon@r@v15/60500315."...............That''s an interesting number........."'
47126: 'Kanon@r@v16/60600343."......I like it.@k@v16/60600344. ......It''s a good number to settle everything with."'
47127: '@r19.'
47128: '@rIt was the number used to refer to the witch each time the illusion of a 19th person had been seen on this supposedly 18-person island.'
47129: '@rIt was the length of time it had taken to create this tale.'
47130: '@rIt was the length of time leading up to this inevitable day.'
47131: '@rAnd it was...@k...the age of the true territory lord of this world.'
47132: 'Jessica@r@v04/60200403."They''ll stand across from each other, then walk 19 steps...@k@v04/60200404....and shoot."'
47133: 'George@r@v07/60300488."......That''s pretty far.@k@v07/60300489. ......At that distance, the first one to shoot won''t necessarily be the winner."'
47134: 'Shannon@r@v15/60500316."......If one of us shoots first and misses,@k@v15/60500317. ......that will probably be the end for them."'
47135: 'Kanon@r@v16/60600345."And if it hits, this easy game can be won without even getting a scratch..."'
47136: '@r@v00/awase6058_o.""Well then, duelers!@k @v00/awase6059_o.Stand with your backs together!!""'
47137: '@rShannon and Kanon slowly walked towards each other, facing each other.'
47138: '@rOnce they turned away,@k ......the next time they would see the other''s face would be the time that they killed them.@k ......So, this was the last time they would face each other.'
47139: 'Shannon@r@v15/60500318."Thanks for everything.@k@v15/60500319. .........Having a little brother like you made things fun."'
47140: 'Kanon@r@v16/60600346."......Thank you for letting me be me.@k@v16/60600347. ......Thank you for showing me the color in the world of gray."'
47141: 'Shannon@r@v15/60500320."Why......were we born, I wonder..."'
47142: 'Kanon@r@v16/60600348."It would have been better if we had died at birth."'
47143: 'Shannon@r@v15/60500321."......That is our father''s sin, isn''t it..."'
47144: 'Kanon@r@v16/60600349."Yeah.@k@v16/60600350. So he can just die. Let them all die."'
47145: 'Shannon@r@v15/60500322."Yeah. Everyone will die.@k@v15/60500323. It''ll happen very soon.@k@v15/60500324. ......And right after, everyone will revive, and we''ll be able to see them again.@k@v15/60500325. We won''t be birds in a cage anymore."'
47146: 'Kanon@r@v16/60600351."......We will finally leave our cage......and fly off to our separate worlds."'
47147: 'Shannon@r@v15/60500326."I should have had this duel with you......long ago."'
47148: 'Kanon@r@v16/60600352."......Surely, today is the day."'
47149: 'Shannon@r@v15/60500327."Yeah.@k@v15/60500328. It''s today."'
47150: 'Kanon@r@v16/60600353."October 5th, 1986.@k@v16/60600354. ......The fated day."'
47151: 'Shannon@r@v15/60500329."The day that one of us will die."'
47152: 'Kanon@r@v16/60600355."......Or maybe we''ll both shoot at the same time, and both die."'
47153: 'Shannon@r@v15/60500330."Oh, that might happen too.@k@v15/60500331. .........In fact, that''s not so unlikely at all."'
47154: 'Kanon@r@v16/60600356."Right.@k@v16/60600357. Even if that happens, our loves will surely be made complete."'
47155: 'Shannon@r@v15/60500332.".........Do we really......need to duel?"'
47156: 'Kanon@r@v16/60600358."We do.@k@v16/60600359. You said it yourself.@k@v16/60600360. ......We should have done this much sooner."'
47157: 'Shannon@r@v15/60500333."Right.@k@v15/60500334. ......Because...to me, you are—"'
47158: 'Kanon@r@v16/60600361."To me, you are—"'
47159: '@r@v00/awase6060.""Just in the way.""'
47160: '@rFor the first time, ......the intent to kill flashed through the eyes of both.'
47161: '@rWhy...?@k For what reason......?'
47162: '@rWhy must this day come for this pair,@k ......who are connected by a bond different from romantic love, as though they were real siblings...?'
47163: '@rIt''s a great mystery.'
47164: '@rAnd, also a great mystery is the question of how this can be the key...@k...towards unlocking Battler-san''s locked room.'
47165: '@r......If I watch over this duel instead of running away,@k ......will I find the key towards solving that locked room...?'
47166: '@rI will, right?@k Zepar-san, Furfur-san......!'
47167: '@rThe cathedral was beautifully decorated to be the place of the wedding between the territory lord, Lord BATTLER, and his wife-to-be, Lady ERIKA...'
47168: '@rA crowd of guests wearing goat masks filled the cathedral, waiting for the arrival of the bride and groom...'
47169: '@rFitting for a demon''s wedding, it was not solemn or quiet,@k ......but cheery and noisy, brimming with activity.'
47170: 'VIRGILIA@r@v30/63200015."......I wonder what Beato is doing."'
47171: 'Ronove@r@v31/63100012."I hear she has gone to see Zepar and Furfur.@k@v31/63100013. ......With the power of love, that powerful pair could even force the demon king to retreat.@k@v31/63100014. ......They are bound to be of some use, or at least I would like to think so..."'
47172: 'Gaap@r@v32/63700016."......I know a~ll about those two.@k@v32/63700017. ......I think you know as well as I that they won''t hand over their power easily."'
47173: 'Ronove@r@v31/63100015."True.@k@v31/63100016. ......However, ......that is why they are capable of granting a miraculous power."'
47174: 'VIRGILIA@r@v30/63200016.".........At any rate, if we can just free Battler-kun''s heart from that locked room, we should be able to manage something here.@k@v30/63200017. ......Locked rooms are your favorite, aren''t they, Gaap?@k @v30/63200018.Can''t you think of any tricks...?!"'
47175: 'Gaap@r@v32/63700018."This is a nasty one.@k@v32/63700019. Battler and Erika have locked it up tight with all kinds of red truths.@k@v32/63700020. ......I can say for certain that a solo escape from the inside is impossible."'
47176: 'Ronove@r@v31/63100017."So, after all, the only way is to have someone else trade places with him and set the chain..."'
47177: 'Gaap@r@v32/63700021."......If that "someone" does appear, it should be easy to save Battler.@k@v32/63700022. There are eleven people, right?"'
47178: 'VIRGILIA@r@v30/63200019."Those eleven are sealed on the second floor of the guesthouse...@k@v30/63200020. If we could somehow slip them out of there...!"'
47179: 'Ronove@r@v31/63100018."......I see.@k@v31/63100019. ......Solving the problem of Battler-sama''s locked room is equivalent to solving the problem of either locked room on the guesthouse''s second floor."'
47180: 'Gaap@r@v32/63700023."Exactly.@k@v32/63700024. Limiting your thoughts to just Battler''s guest room is like being trapped in a mental locked room.@k@v32/63700025. ......The locked room we need to break open to save Battler isn''t the guest room.@k@v32/63700026. It''s the locked rooms in the guesthouse...!"'
47181: 'Dlanor@r@v47/64600274.".........Most unfortunately,@k@v47/64600275. we of Eiserne Jungfrau have been placed in charge of those two ROOMS."'
47182: 'Gaap@r@v32/63700027."Tch.@k@v32/63700028. And you guys specialize in seals and barriers..."'
47183: 'Dlanor@r@v47/64600276."I must admit, I am impressed, Miss Gaap.@k@v47/64600277. It is quite an achievement to realize that the locked room you should destroy to save Battler is within the GUESTHOUSE.@k@v47/64600278. ......The ceremony will probably begin soon, but shall we reconstruct the scene as a way to kill time until THEN?"'
47184: 'VIRGILIA@r@v30/63200021."......A-are you sure?@k @v30/63200022.Doesn''t this violate the obligation of confidentiality you have as Lady ERIKA''s piece...?"'
47185: 'Dlanor@r@v47/64600279."That is no PROBLEM.@k@v47/64600280. ......I am sure that if you first confirm the seals around the scene and fall into despair,@k@v47/64600281. ......we will all be able to celebrate this ceremony more SINCERELY."'
47186: 'Gaap@r@v32/63700029."How confident......@k@v32/63700030. ......I''ll take that challenge.@k@v32/63700031. ...Lia, let''s have ourselves a little snack before the ceremony."'
47187: 'Ronove@r@v31/63100020."With that, dear ladies of Eiserne,@k@v31/63100021. we humbly ask that you reconstruct the scene for us."'
47188: '@r@v00/awase6061.""For your attention: we hear and obey.""'
47189: 'VIRGILIA@r@v30/63200023."......This is......the cousins'' room."'
47190: 'Dlanor@r@v47/64600282."The next room over has the exact same LAYOUT.@k@v47/64600283. Please investigate as thoroughly as you LIKE."'
47191: 'Ronove@r@v31/63100022."This room has......Genji, Gohda, Kanon...@k@v31/63100023.plus Krauss, Rudolf, and Jessica, for a total of six people."'
47192: 'Dlanor@r@v47/64600284."The next room over has Hideyoshi, George, Shannon, Kumasawa, and Nanjo, for a total of five PEOPLE."'
47193: 'Gaap@r@v32/63700032."Come on, everyone, don''t be stupid.@k@v32/63700033. It doesn''t matter who''s here.@k@v32/63700034. We need to find out how to escape from this room."'
47194: 'VIRGILIA@r@v30/63200024."Y-you''re right.@k@v30/63200025. ......The door and windows are sealed, so we must somehow escape from some other place......"'
47195: 'Gaap@r@v32/63700035.".........You know what?@k@v32/63700036. ...I know all about how you heaven people specialize in pressing ahead to hide inconvenient facts.@k@|@y@v32/63700037. ......It''s not a locked room, is it?@k @v32/63700038.This room......"'
47196: 'Cornelia@r@v49/64700027."......For your attention: I beg to inform you of the following.@k@v49/64700028. The locked rooms in our charge are perfect...!"'
47197: 'Gaap@r@v32/63700039."You were in charge of the window seal of Kinzo''s room last game, right...?@k @v32/63700040.......Just how did Battler get Kinzo out of that room again...?"'
47198: 'Cornelia@r@v49/64700029."..........................."'
47199: 'Dlanor@r@v47/64600285."......Cornelia was not at FAULT.@k@v47/64600286. The blame rests on me as her SUPERIOR."'
47200: 'Gaap@r@v32/63700041."This is exactly the same as Kinzo''s study.@k@v32/63700042. It''s the windows.@k@v32/63700043. This locked room can be broken by the windows.@k@v32/63700044. ......It''s clear as day how you people operate."'
47201: 'VIRGILIA@r@v30/63200026."H-how...?!@k @v30/63200027.Lady ERIKA sealed the entire room, right...?@k @v30/63200028.That means the entire room is sealed, including the windows...!"'
47202: 'Ronove@r@v31/63100024."......I see.@k@v31/63100025. ......It would seem that we have been misinterpreting the definition of these seals.@k@v31/63100026. A locked room sealed by duct tape...@k@v31/63100027.is not impossible to break out of.@k@v31/63100028. It forms no prison."'
47203: 'Gaap@r@v32/63700045."That''s it exactly.@k@v32/63700046. ......Yes, a seal proves that a room is a locked room.@k@v32/63700047. But it doesn''t guarantee that the room will remain sealed.@k@v32/63700048. All it does is prove that the room is a locked room as long as the duct tape isn''t broken."'
47204: 'Dlanor@r@v47/64600287."We are not trying to deceive you in any WAY.@k@v47/64600288. .........As long as the duct tape is intact, it is guaranteed to be a locked ROOM.@k@v47/64600289. That is ALL."'
47205: 'VIRGILIA@r@v30/63200029."Th-then why the windows...?!@k @v30/63200030.Why is it that we can break the locked room by the windows?!"'
47206: 'Gaap@r@v32/63700049."It''s simple.@k@v32/63700050. We just tear the duct tape apart and jump out.@k@v32/63700051. ......I don''t know what the outside wall of the guesthouse is like,@k@v32/63700052. but that girl crawled up it and stuck duct tape on the outside without anyone noticing, so it must have at least enough footholds for that."'
47207: 'Dlanor@r@v47/64600290.".........If you break the duct tape, we will immediately know that the seal has been BROKEN.@k@v47/64600291. And we have already proven that the seals were intact at the time of Battler''s logic ERROR."'
47208: 'Gaap@r@v32/63700053."True.@k@v32/63700054. It''s true that, at that time, you proved that the seals weren''t broken.@k@|@y@v32/63700055. ......That''s how you tricked us into thinking that it was a locked room.@k@v32/63700056. ......A seal doesn''t necessarily imply a locked room."'
47209: '@rGaap was the demon who specialized in putting an end to locked-room mysteries...'
47210: '@r......She drew herself up and looked down on the short Dlanor, as though a challenge such as this was like taking candy from a baby.'
47211: '@rDlanor looked up at her with a bold expression, and sparks flew between them......'
47212: 'VIRGILIA@r@v30/63200031."A seal doesn''t imply a locked room?!@k @v30/63200032.That can''t be..."'
47213: 'Gaap@r@v32/63700057."Remember, Lia.@k@v32/63700058. Which seals did Erika and the others show us at that time?@k @v32/63700059.Which seals did they show were still intact?!"'
47214: 'Ronove@r@v31/63100029.".........Pu ku ku ku.@k@v31/63100030. ...I see.@k@v31/63100031. ......This is the sort of falsification that the Great Court of Heaven likes to practice."'
47215: 'Dlanor@r@v47/64600292."I cannot let that remark PASS.@k@v47/64600293. ......What is your COMPLAINT?"'
47216: 'Gaap@r@v32/63700060."Come on, I''ve been saying it the whole time. It''s the windows.@k@v32/63700061. ......It''s true that you sealed everything with those seals.@k@v32/63700062. That included the windows, at that time.@k@v32/63700063. And you proved that at the time they were sealed.@k@v32/63700064. So far so good.@k@v32/63700065. But you know what?!"'
47217: 'Gaap@r@v32/63700066."After that, any one of the people inside could have done it!@k @v32/63700067.Umm, who was here again?!@k @v32/63700068.Genji, Gohda, Kanon, Krauss, Rudolf, Jessica!@k @v32/63700069.Any one of them could do it!@k @v32/63700070.All they had to do was tear the duct tape on the window, slip out from there, and save Battler...!"'
47218: 'VIRGILIA@r@v30/63200033."But at the time of the logic error, it was proven that the seals were intact...!"'
47219: 'Ronove@r@v31/63100032."Incorrect.@k@v31/63100033. ......At that time, Lady ERIKA only proved the status of the seals on the doors."'
47220: 'Dlanor@r".........................................."'
47221: 'VIRGILIA@r@v30/63200034."C-......come to think of it...!@k @v30/63200035.At that time, Lady ERIKA just showed the doors of the two rooms and claimed that the seals were intact for each...@k@v30/63200036. She never mentioned the seals on the windows...!!"'
47222: 'Gaap@r@v32/63700071."That''s correct.@k@v32/63700072. .........It''s probably true that the seals on the doors and windows were perfect at first.@k@v32/63700073. ......However, at the time of the logic error, only the status of the seals on the doors was confirmed.@k@v32/63700074. In other words, since the time Erika left the guesthouse,@k @|@y@v32/63700075.it was not forbidden for them to break through the windows and leave whenever they wished!"'
47223: 'Dlanor@r".............................."'
47224: 'Gaap@r@v32/63700076."Well?@k @v32/63700077.I''ve got you now, haven''t I?@k @v32/63700078.This is how you people do things."'
47225: 'Dlanor@r@v47/64600296."...............heh..............."'
47226: 'Gertrude@r@v48/64800024."......Supervisor Dlanor.@k@v48/64800025. ............It''s nearly time..."'
47227: 'Dlanor@r@v47/64600297."............It seems the bride and groom have ARRIVED.@k@v47/64600298. This ends our CHAT.@k@v47/64600299. .........We will meet again LATER."'
47228: '@rWith an amused grin on her face, Dlanor turned around.@k@r......But that had to have hit her where it hurt.'
47229: '@rGaap had no intention of letting her get away.@k She grabbed Dlanor''s shoulder.'
47230: 'Gaap@r@v32/63700079."......Wait there.@k@v32/63700080. Confirm whether or not the seals on the windows were preserved at the time of the logic error.@k@v32/63700081. If you don''t, it''s possible for anyone in that room to save Battler!!"'
47231: 'Dlanor@r@v47/64600300."And who......do you think such a rescue would be possible FOR?"'
