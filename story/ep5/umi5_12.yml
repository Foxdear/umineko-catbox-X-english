37711: 'LAMBDADELTA@r@v29/52200450.@|@y"@c900.@[Misidentifying a knocking sound means this:@k@v29/52200451. they would not mistake a sound very similar to a knocking sound for a real knocking sound.@k@v29/52200452. Hitting a pillar to make something similar to a knocking sound is no good.@k@v29/52200453. When you record a knocking sound on a cassette tape and play it back, it becomes "the sound of a tape with a knocking sound on it", and not a knocking sound.@k@v29/52200454. So that''s no good either!@]@c."'
37712: 'LAMBDADELTA@r@v29/52200455.@|@y"@c900.@[In other words, all of them would correctly distinguish a knocking sound of something truly hitting the door,@k@v29/52200456. and they definitely wouldn''t mishear it.@k@v29/52200457. It''s totally impossible that any sounds except hitting that door directly would be misinterpreted as a knock!!@]@c."'
37713: 'Erika@r@v46/54500729."Wh-......what the......@k@v46/54500730. But that means......at the time the clock struck midnight,@k@v46/54500731. no one existed who could have hit the door......@k@v46/54500732. Gggh, ggghgghhhhh......"'
37714: 'LAMBDADELTA@r@v29/52200458."Yep, they don''t exist.@k @v29/52200459.After all, it was the Golden Witch BEATRICE who hit it.@k@|@y@v29/52200460. *cackle*cackle*cackle*cackle*cackle*...!!"'
37715: 'BERNKASTEL@r@v28/52100467.".........So in other words, there''s no way around this other than hitting the door.@k@v28/52100468. So what about this?@k @v28/52100469.@|@y@c279.@[There was some kind of device that could knock on the door.@k@v28/52100470. There was something like an automatic door knocker, and that made it possible for someone to knock without touching the door with their hands.@]@c."'
37716: 'LAMBDADELTA@r@v29/52200461.@|@y"@c900.@["To knock" means someone hitting a door with their hand!@]@c.@k @v29/52200462.I won''t accept hitting it with some contraption, eheheheheheheheheheheh!!"'
37717: 'LAMBDADELTA@r@v29/52200463."They heard a knock at the same time as the clock struck midnight.@k@v29/52200464. Everyone inside the dining hall definitely heard it at that time.@k@|@y@v29/52200465. @c900.@[And none of them would misinterpret a knocking sound.@k@v29/52200466. Krauss, Natsuhi, and Genji had no involvement in any knocking.@k@v29/52200467. No one else existed inside the mansion.@k@v29/52200468. And a "knock" refers to the action of standing directly in front of a door and hitting it with a hand.@]@c."'
37718: 'LAMBDADELTA@r@v29/52200469."......Hey, Bern.@k@v29/52200470. What do you think of my red?@k @v29/52200471.Don''t you think this is pretty uncomplicated and enjoyable for something before the first twilight?@k @|@y@v29/52200472.The Golden Witch descended quietly with a knocking sound.@k@v29/52200473.@|@y *giggle*giggle*, eheheheheheheheheheheheheheheh...!"'
37719: 'BERNKASTEL@r@v28/52100471."..............................@k@|@y@v28/52100472. *giggle*giggle*.@k@v28/52100473. Ahhahhahhahahahhahaha!!@k @v28/52100474.This is interesting. This really is fascinating, Lambda...!@k @v28/52100475.Now we''re talking.@k@v28/52100476. Ah, this is great!@k @v28/52100477.Ahahahahahahahahahahahahahahaha!!"'
37720: '@rThe two witches doubled over laughing,@k as though this was the most fun thing in the world...'
37721: 'Erika@r@v46/54500733."Gah, ............@k@|@y@v46/54500734. ...M-...my master...@k@v46/54500735. Have no fear.@k@v46/54500736. As long as my little gray cells are given the time, I will definitely reach an answer to this pitiful red...!"'
37722: 'BERNKASTEL@r@v28/52100484.".........You''re nothing but a piece.@k@v28/52100485. Your absence wouldn''t hinder my progress in this game in the slightest.@k@v28/52100486. If you can''t think of any theories in particular, please just go back to the piece tray and gather dust or something.@k@v28/52100487. It''s painful to even reserve space in my memory for useless pieces."'
37723: 'LAMBDADELTA@r@v29/52200474."......Bern is pretty forgetful.@k@v29/52200475. If you don''t try a little harder, Bern''s gonna forget you, you know...?@k @v29/52200476.You''ll collect dust in that forgotten piece tray, awaiting your turn that will never come.@k@v29/52200477. ......I imagine that''d be pretty harsh, don''t you think...?"'
37724: 'Erika@r@v46/54500737."Ha-have no fear, Great Lady LAMBDADELTA, and my master...!@k @v46/54500738.I promise to deliver such a spectacular performance to earn your approval that you will never be disappointed in me again...!"'
