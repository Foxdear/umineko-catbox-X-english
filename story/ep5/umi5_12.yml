37773: 'Erika@r@v46/54500765.Thank you very much, Great Lady BERNKASTEL......@k@v46/54500766. I am Furudo Erika.@k@v46/54500767. I am my master''s piece and her double.@k@v46/54500768. ......I will most certainly present you with an incredible tale.@k@v46/54500769. Eheheheheh......'
37774: 'Erika@r@v46/54500770."Oh, yes, knives and forks are such primitive utensils, aren''t they?@k@v46/54500771. Chopsticks are best.@k@v46/54500772. They''re the easiest way to eat a salad, don''t you agree?@k @v46/54500773.Well, everyone?"'