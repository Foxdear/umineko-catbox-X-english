37602: 'Erika@r@v46/54500636."I am being reprimanded by Lady BERNKASTEL because you people are useless...!!@k @v46/54500637.Never demonstrate such miserable incompetence again...!@k @v46/54500638.Are-we-un-der-stood...?!"'
