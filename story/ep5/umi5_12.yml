37686: '@rAnd at the same time, try as we might, those who were inside the mansion cannot exist outside the mansion.'
37687: 'Erika@r@v46/54500701.@|@y"@c279.@[In that case, the letter might have been stuck to the ceiling of the hallway instead of the serving cart.@k@v46/54500702. The ceiling of the hallway is surprisingly high, so even if you just stuck it there out in the open, maybe no one would notice it.@k@v46/54500703. This way, it would certainly fall in the corridor.@k@v46/54500704. And you can slip by the red if someone outside the mansion did this!@]@c.@k @v46/54500705.<Good> job, me...!"'
