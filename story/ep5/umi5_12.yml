37376: '@rIn the Golden Land, the quiet rain......just kept on falling.'
37377: '@rIn the arbor......sat the sad witch whose eyes had lost their glint......and Battler.'
37378: '@rVIRGILIA could also be seen there.@k@r......She sat next to Beato, knitting quietly.'
37379: '@rLAMBDADELTA''s game had passed the climax of the first twilight, and they were taking a short break.'
37380: '@rGazing out at the golden rose garden soaked with rain,@k ......Battler thought back on the present, what was to come, and what had happened so far......'
37381: '@rTo Battler, thinking was itself a battle.'
37382: '@rEven with the game stopped and Beato unable to speak, ......he could still keep on fighting.'
37383: '@r......VIRGILIA suddenly stopped her knitting.'
37384: '@rBattler had noticed too.'
37385: '@r......Though none should have been able to visit this rose garden, they had noticed a silhouette approaching.'
37386: 'VIRGILIA@r@v30/53200115.".........That''s unusual.@k@v30/53200116. Not many people can reach this place."'
37387: 'Battler@r@v10/50100944."It''s her..............."'
37388: '@rThat silhouette, ......walking through the quietly falling rain without so much as an umbrella,@k .........was Dlanor.'
37389: 'Dlanor@r@v47/54600091."......That was a splendid garden MAZE.@k@v47/54600092. A very nice way to enjoy the ROSES."'
37390: 'Battler@r@v10/50100945."Why.........are you here?"'
37391: 'Dlanor@r@v47/54600093."It has been some time, Mrs. BEATRICE.@k@v47/54600094. ...Excuse me, it is Mrs. VIRGILIA now, is it NOT?"'
37392: 'VIRGILIA@r@v30/53200117."Long time no see, Dlanor.@k@v30/53200118. ......Come over here.@k@v30/53200119. We aren''t ones to leave a guest out in the rain."'
37393: 'Battler@r@v10/50100946."..........................."'
37394: 'VIRGILIA@r@v30/53200120."Don''t worry.@k@v30/53200121. She hasn''t come to fight."'
37395: 'Battler@r@v10/50100947."......Do you know her?"'
37396: 'VIRGILIA@r@v30/53200122."She''s one of my old friends from heaven.@k@v30/53200123. ......This really takes me back."'
37397: 'Dlanor@r@v47/54600095."Yes, it DOES.@k@v47/54600096. Mrs. VIRGILIA possesses a deep knowledge in Heavenly STUDIES.@k@v47/54600097. I have often battled with her over INTERPRETATIONS."'
37398: 'VIRGILIA@r@v30/53200124."Hoh-hoh-ho...@k@v30/53200125. My many intellectual adventures with you were quite enjoyable.@k@v30/53200126. I''d like to do it again sometime."'
37399: 'Dlanor@r@v47/54600098."YES.@k@v47/54600099. Let''s do it again SOMETIME.@k@v47/54600100. I''d love to fight with you AGAIN."'
37400: '@rThey used the word "fight", but it didn''t sound like they meant anything unpleasant by it.@k@rIt sounded like something old chess rivals would say to each other.'
37401: '@rUnlike Beato, it seemed that VIRGILIA had always acted properly and courteously,@k so she had many friends in various other worlds, including both heaven and the demon world.'
37402: '@rSurprisingly, Dlanor was one of them......'
37403: '@rDlanor, who had crossed swords with "me" just a short while ago,@k bowed her head as if to thank us for allowing her shelter from the sudden rain, and sat in the seat VIRGILIA pointed out, like a guest.'
37404: 'VIRGILIA@r@v30/53200127."......Is there any type of black tea you would prefer?"'
37405: 'Dlanor@r@v47/54600101."ANYTHING.@k@v47/54600102. ......Any tea you make is SUPERB."'
37406: 'VIRGILIA@r@v30/53200128."Then how about some Darjeeling?@k@v30/53200129. ......Battler, Beato, would you like some more?"'
37407: 'Battler@r@v10/50100948."......Yeah.@k@v10/50100949. Beato and I would like a refill.@k@v10/50100950. ......Right?"'
37408: 'BEATRICE@r"......................................."'
37409: '@rAs usual, Beato didn''t answer,@k ......but if you quietly gave her a cup, she would sip it from time to time.'
37410: '@rThere was still some black tea left in that cup, but it had already chilled.'
37411: '@rSo Battler asked for a refill for Beato as well...'
37412: 'Dlanor@r@v47/54600103."......I have heard the RUMORS.@k@v47/54600104. ......How pitiable that BEATRICE, the Endless Witch famous for her cruelty,@k@v47/54600105. has been reduced to THIS."'
37413: 'Battler@r@v10/50100951."She''s no longer participating in the game.@k@v10/50100952. ......LAMBDADELTA is the one controlling the Beato that''s on the game board."'
37414: 'Dlanor@r@v47/54600106."I KNOW.@k@v47/54600107. ......However, she is the original master of this WORLD.@k@v47/54600108. And you are the proper guest, invited by that MASTER.@k@v47/54600109. That is why I have come to greet YOU."'
37415: '@rOn the game board, Beato and I met Dlanor.'
37416: '@rBut those were the game pieces of those witches.@k@rThey weren''t Beato and me ourselves.'
37417: 'VIRGILIA@r@v30/53200130."Is that why you went out of your way to greet Battler-kun and Beato here...?@k @v30/53200131....I see you''re as conscientious as always."'
37418: 'Dlanor@r@v47/54600110."That is my way of doing THINGS.@k@v47/54600111. .........Greetings, Mr. Battler.@k@v47/54600112. I am Dlanor A. Knox.@k@v47/54600113. ...We play opposing roles, but it is a pleasure to meet YOU."'
37419: 'Battler@r@v10/50100953."......Sure.@k@v10/50100954. I''m Ushiromiya Battler.@k@v10/50100955. Pleased to meet you."'
37420: 'Dlanor@r@v47/54600114."Greetings, Miss BEATRICE.@k@v47/54600115. I am Dlanor A. Knox."'
37421: 'BEATRICE@r"...................................."'
37422: 'Battler@r@v10/50100956."......Beato.@k@v10/50100957. She''s saying hi.@k@v10/50100958. ........................"'
37423: 'BEATRICE@r"...................................."'
37424: 'Battler@r@v10/50100959."...............@k@v10/50100960. ......She says "welcome"."'
37425: 'Dlanor@r@v47/54600116."Thank you very MUCH,@k@v47/54600117. Miss BEATRICE."'
37426: '@rThe witch and the Inquisitor whose job it was to hunt witches...@kgreeted each other around a tea table surrounded by the aroma of black tea.'
37427: '@r......It was a strange sight.'
37428: '@rVIRGILIA made gold butterflies appear from the palms of her hands...@kand transformed them into a teapot and a can of tea leaves.'
37429: '@r......It was a very witch-like way of preparing tea.'
37430: '@rShe was a witch, so it wasn''t a particularly unusual sight.'
37431: '@r......Though I was a bit concerned about whether Dlanor, an Inquisitor, could allow herself to watch such a spectacle.'
37432: 'Dlanor@r@v47/54600118."......Have no FEAR.@k@v47/54600119. I am not so rude as to quibble about the way my tea is SERVED."'
37433: 'Battler@r@v10/50100961."Even though the tea''s being made with magic...?"'
37434: 'Dlanor@r@v47/54600120."......There is a tea set hiding in the shadows, and Mrs. VIRGILIA is making the tea with it in SECRET.@k@v47/54600121. We interpret and/or conclude that "it was made with magic", and it is written as such in the TALE.@k@v47/54600122. ......It is an interpretation permitted even by Knox''s 9th COMMANDMENT."'
37435: 'VIRGILIA@r@v30/53200132."Oh my...@k@v30/53200133. I do believe the interpretations of the ninth commandment are such a delicate issue that they''re even viewed as taboo by the Great Court......@k@v30/53200134. Even though it''s just a personal opinion, if it became known that the Chief Inquisitor said such a thing, you might be sacked."'
37436: 'Dlanor@r@v47/54600123."No matter what kind of interpretation I might record,@k@v47/54600124. there is nothing false about the way your tea TASTES.@k@v47/54600125. Therefore, I will never concern myself with how it was PREPARED."'
37437: 'Battler@r@v10/50100962.".....................Aha..."'
37438: '@rThough she looked cold, ......she was a surprisingly tactful person.'
37439: '@r......If Dlanor were to deny that the black tea had been prepared with magic, this magic would surely be crushed in a instant.'
37440: '@rHowever, even if it was depicted that a tea set existed here and VIRGILIA had used it to make the tea normally,@k the result, that VIRGILIA had made tea, would still remain unchanged.'
37441: 'Dlanor@r@v47/54600126."Magic that hides the result in darkness is EVIL.@k@v47/54600127. We will not permit IT.@k@v47/54600128. However, magic that conceals the process is not necessarily EVIL.@k@v47/54600129. My foe is the evil, not the magic ITSELF."'
37442: 'Battler@r@v10/50100963."I get it.@k@v10/50100964. ......The important thing is that you''re being welcomed with some tea,@k@v10/50100965. so it''s just common courtesy to avoid complaining about how it was made."'
37443: '@r......That''s right.'
37444: '@rIt''s common courtesy to be grateful for tea that someone makes for you.'
37445: '@rThere''s nothing elegant about pushing your way into the kitchen and poking around through the tea-making process.'
37446: 'VIRGILIA@r@v30/53200135."You don''t invite your guests into the kitchen.@k@v30/53200136. And when you set the table, you should adorn it beautifully in the spirit of hospitality.@k@|@y@v30/53200137. ......Here you go. It''s hot."'
37447: 'Dlanor@r@v47/54600130."Thank YOU.@k@v47/54600131. I would also like some sugar and MILK."'
37448: 'VIRGILIA@r@v30/53200138."*giggle*.@k@v30/53200139. You still can''t drink it straight?"'
37449: 'Dlanor@r@v47/54600132."I am a KID.@k@v47/54600133. It has to be SWEET."'
37450: 'Battler@r@v10/50100966.".........So is magic...@v10/50100967....a white...@v10/50100968.lie,@v10/50100969. ......then?"'
37451: 'VIRGILIA@r@v30/53200140.""Lie" is such a dirty word.@k@v30/53200141. The word "embellishment" is probably more fitting."'
37452: 'Dlanor@r@v47/54600134."When giving a child candy,@k@v47/54600135. you can either take a crumpled-up one out of your pocket,@k@v47/54600136. or use a wonderful bit of sleight of hand to produce the candy, and the impression you give with each method is completely DIFFERENT."'
37453: 'Battler@r@v10/50100970."Sure, I mean, producing the candy out of nowhere is a cool little trick."'
37454: 'Dlanor@r@v47/54600137."WRONG.@k@v47/54600138. The meaning is in embellishing the result—a candy is given—in a way that makes it even more beautiful and FUN."'
37455: 'VIRGILIA@r@v30/53200142."......Think of when you give Maria-chan a candy.@k@v30/53200143. There''s a huge difference between taking it out of your pocket to give to her,@k@v30/53200144. and saying a fairy gave it to her for being such a good girl...@k@v30/53200145.after secretly slipping it into her pocket."'
37456: 'Dlanor@r@v47/54600139."In my opinion, it would be boorish to then question everyone about their alibis...@k@v47/54600140.and investigate and pinpoint who it was that slipped it into her POCKET.@k@|@y@v47/54600141. The important thing is the result: that the girl received the candy and was DELIGHTED.@k@v47/54600142. And the meaning lies in the fact that it was embellished in order to delight HER."'
37457: 'Battler@r@v10/50100971."......That''s surprising.@k@v10/50100972. When you showed up, I got the feeling you''d deny anything that went by the name of magic."'
37458: 'Dlanor@r@v47/54600143."That is how I act in my capacity as an INQUISITOR.@k@v47/54600144. It is my JOB.@k@v47/54600145. However, when I am away from my job, I don''t enjoy being quite so cold-HEARTED."'
37459: 'Battler@r@v10/50100973."So, this is what they call leaving your personal feelings aside when on duty?@k@v10/50100974. ......You do it well."'
37460: 'Dlanor@r@v47/54600146."As an Inquisitor, hunting witches is my JOB.@k@v47/54600147. ......Personally, I find witches PITIABLE.@k@v47/54600148. However, I condemn them mercilessly as an INQUISITOR."'
37461: 'Dlanor@r@v47/54600149."......The result that I execute witches is UNCHANGED.@k@v47/54600150. ......In the end, my pity is nothing more than a useless EMBELLISHMENT.@k@v47/54600151. Whether I have it or not, nothing CHANGES.@k@v47/54600152. So it is better if I do NOT......"'
37462: 'VIRGILIA@r@v30/53200146.".........Not at all.@k@v30/53200147. Even if the end result is the same, there''s a big difference depending on your heart."'
37463: 'VIRGILIA@r@v30/53200148."......Your mother''s cookies must have been more delicious than those made by a good pastry shop.@k@v30/53200149. ...That''s because you know that they were made with heart."'
37464: 'Battler@r@v10/50100975."That''s right.@k@v10/50100976. .........Even if the result appears to be the same,@v10/50100977. ......there''s a huge difference depending on whether or not it had a little thing called sincerity..."'
37465: 'Dlanor@r@v47/54600153."I am not so SURE......@k@v47/54600154. .........Whether I have a heart or not is completely MEANINGLESS."'
37466: '@rDlanor''s gaze fell to her cup, a little sadly...'
37467: 'Battler@r@v10/50100978."That''s not true."'
37468: 'Dlanor@r@v47/54600155.".................."'
37469: 'Battler@r@v10/50100979."Because of everything you''ve just said, I''ve changed the way I look at you a little.@k@v10/50100980. ......So saying your heart is meaningless isn''t true at all."'
37470: '@rVIRGILIA was a little surprised to hear the words she should have said coming from Battler''s mouth.'
37471: '@rAfter all, understanding the "heart" was the first step towards magic''s true nature.'
37472: '@r......Perhaps Battler was unconsciously starting to understand, bit by bit,@k ...the essence of Beato, the essence of witches,@k and the very first essence of all, ......the essence of magic.'
37473: '@rWhether you want to become a witch or vanquish them...@k@r......The very first step is learning about magic.'
37474: '@rVIRGILIA was sure that she felt this faint change within Battler...'
37475: 'Dlanor@r@v47/54600156."......As for that last fight, thank you very MUCH.@k@v47/54600157. I am grateful for the mercy you showed me at the very END."'
37476: 'Battler@r@v10/50100981."That "me" wasn''t me.@k@v10/50100982. ......LAMBDADELTA was controlling him."'
37477: '@rI joined in on the fifth game partway through.@k@rAt "this point in the story", I still hadn''t joined.'
37478: '@rSo up until the point when I did join,@k the piece "me" is probably being controlled by BERNKASTEL or LAMBDADELTA.'
37479: 'Battler@r@v10/50100983."......Just what kind of mood''s taken those two?@k@v10/50100984. Trying to make it look all cool...@k@v10/50100985. They made me look like some kind of knight coming to save Beato."'
37480: 'VIRGILIA@r@v30/53200150."Lady LAMBDADELTA wants both witches and Humans to be in balance, resulting in a draw.@k@|@y@v30/53200151. .........With Erika''s appearance, the scales tipped strongly in the favor of the Human side,@k@v30/53200152. so she manipulated the tale in a way that supports Beato."'
37481: 'Dlanor@r@v47/54600158."Yes, I am AWARE.@k@v47/54600159. However, pieces cannot do things that are impossible for THEM.@k@v47/54600160. And they specialize in actions appropriate to their original PERSONALITY.@k@|@y@v47/54600161. ......Therefore, that was certainly something that you......that Battler was capable OF.@k@v47/54600162. That is why I am grateful to YOU."'
37482: 'Battler@r@v10/50100986."......It feels a bit weird to be praised when I didn''t actually do anything.@k@|@y@v10/50100987. ......After the game continues a bit more, I''ll probably regain control of my piece.@k@v10/50100988. Not sure I''ll be going easy on you then."'
37483: 'Dlanor@r@v47/54600163."The same goes for ME.@k@v47/54600164. I will not be caught unawares in our next BOUT."'
37484: 'Battler@r@v10/50100989."Perfect. I''ll take you on anytime.@k@v10/50100990. Give me everything you''ve got."'
37485: 'Dlanor@r@v47/54600165."You have my WORD. Everything I HAVE."'
37486: '@r......Dlanor.'
37487: '@rI''d thought she was an emotionless killer doll without a heart,@k ...but maybe she actually is pretty approachable.'
37488: '@r......Though of course, neither of us will show any mercy when fighting on the game board.'
37489: '@rFor a while, we gazed at the rain-drenched rose garden as we quietly enjoyed our tea.'
37490: 'Dlanor@r@v47/54600166.".........There is one thing I must apologize FOR."'
37491: '@rDlanor suddenly murmured something.'
37492: 'Battler@r@v10/50100991."What is it?@k@v10/50100992. ......If it''s about that fight a short while ago, it''s already over.@k@v10/50100993. We both fought with everything we had.@k@v10/50100994. The outcome was just luck of the draw."'
37493: 'Dlanor@r@v47/54600167."No, it was not luck of the DRAW.@k@v47/54600168. ...We were unable to let the outcome be decided naturally by chance, so I came here to APOLOGIZE."'
37494: 'Battler@r@v10/50100995."......What are you talking about...?"'
37495: 'VIRGILIA@r@v30/53200153."..................@k@v30/53200154. .........You''re saying you threw the match, aren''t you?"'
37496: '@rVIRGILIA spoke softly, without hesitating in her knitting.'
37497: 'Dlanor@r@v47/54600169.".........YES.@k@v47/54600170. ......Mr. Battler."'
37498: 'Battler@r@v10/50100996."That "Mr." is really getting to me.@k@v10/50100997. Just Battler is fine."'
37499: 'Dlanor@r@v47/54600171."Battler.@k@v47/54600172. ......I APOLOGIZE.@k@v47/54600173. We did not give it everything we HAD."'
37500: 'VIRGILIA@r@v30/53200155.".........I know.@k@v30/53200156.@|@y ......"@c900.@[Kinzo is dead at the starting time for all games@]@c.".@k@v30/53200157. Beato already told us that truth.@k@|@y@v30/53200158. ......Battler-kun should only have been able to achieve a draw at best in that battle.@k@v30/53200159. He shouldn''t have had any chance at all of winning."'
37501: 'Battler@r@v10/50100998."......You''re right.@k@v10/50100999. ......If you just say that, the whole fight''s already over.@k@v10/50101000. ......Why didn''t you use that red?@k @v10/50101001.Are you telling me it was because of a stalemate or something like that?"'
37502: 'Dlanor@r@v47/54600174.@|@y"@c900.@[Knox''s 2nd:@k@v47/54600175. It is forbidden for supernatural agencies to be employed as a detective TECHNIQUE.@]@c.@k@v47/54600176. We cannot use that red truth DIRECTLY.@k@v47/54600177.@|@y However, the red truth that "@c900.@[the window was never opened after it started raining@]@c."...@k@v47/54600178. was one I had given to Cornelia, who was protecting the window."'
37503: 'Battler@r@v10/50101002."Boom.@k@v10/50101003. ...That''s checkmate.@k@v10/50101004. .........Why didn''t that girl use that trump card...?"'
37504: 'Cornelia@r@v49/54700015_k."............!!@k @v49/54700016_k.Th-this is...... .........gh.@k@|@y@v49/54700017_k. F-For your attention...!@k @v49/54700018_k.There is no way to defeat my red!@k @v49/54700019_k.Know that your wish will not be granted...!!"'
37505: '@rThough she had fought calmly up until that point,@k ......she quickly got flustered when I dashed forwards.'
37506: '@rI''d thought that she had been frightened by my sudden attack, ......but the truth was different.'
37507: '@rEven though she held a trump card which could completely repel me,@k .........she suddenly became unable to use it, and hesitated.'
37508: 'Dlanor@r@v47/54600179."I am not SURE.@k@v47/54600180. In that instant, use of that trump card suddenly became FORBIDDEN.@k@v47/54600181. Once we lost that, your victory was GUARANTEED."'
37509: 'VIRGILIA@r@v30/53200160.".........The Game Master, Lady LAMBDADELTA, probably interfered."'
37510: 'Battler@r@v10/50101005."That bastard...@k@v10/50101006. .........So in the end, that whole fight was a farce in the palm of LAMBDADELTA''s hand.@k@v10/50101007. She made "us" play out that entire act according to her script."'
37511: 'Dlanor@r@v47/54600182."I understand that you are UPSET.@k@v47/54600183. However, since you told me to fight with everything I had, I had no choice but to let you KNOW.@k@|@y@v47/54600184. ......Please forgive ME."'
37512: 'VIRGILIA@r@v30/53200161."Still, even though you''d lost your trump card, you kept on fighting all-out with your remaining cards.@k@v30/53200162. I don''t believe anyone could find fault with what you did."'
37513: 'Battler@r@v10/50100998."......That''s right.@k@v10/50101009. ......If I should be mad at anyone, it''s LAMBDADELTA for butting in."'
37514: 'Dlanor@r@v47/54600185.@|@y""@c900.@[Kinzo does not exist@]@c." should already be an established FACT.@k@v47/54600186. Lady LAMBDADELTA and Lady BERNKASTEL know this WELL.@k@v47/54600187. And yet, they are both leaving room for Kinzo to exist as they continue through this GAME.@k@v47/54600188. ......It is almost as though the two are conspiring to prevent Kinzo''s existence from being DENIED."'
37515: 'Battler@r@v10/50101010."You''re saying they let "Grandfather" escape on purpose...?"'
37516: 'Dlanor@r@v47/54600189."YES.@k@v47/54600190. They must be after SOMETHING."'
37517: 'VIRGILIA@r@v30/53200163."............That is a bit odd.@k@v30/53200164. ...Lady LAMBDADELTA and Lady BERNKASTEL should always be in opposition unless the witch side is in a superior position.@k@v30/53200165. ......It''s hard to imagine that those two would be conspiring together with things going as they are..."'
37518: 'Dlanor@r@v47/54600191."I cannot help but think that they have some sort of wicked OBJECTIVE.@k@v47/54600192. I came here because I wanted you to know THAT."'
37519: 'Battler@r@v10/50101011."......So, ...you came all the way here to tell us something like that?"'
37520: 'Dlanor@r@v47/54600193."YES.@k@v47/54600194. ......Which means that my business here is FINISHED.@k@v47/54600195. I think I will leave NOW.@k@v47/54600196. The game will probably resume SHORTLY.@k@v47/54600197. I need to have a discussion with Erika about the FUTURE."'
37521: '@rDlanor gulped down the last of her black tea and stood up.'
37522: 'Dlanor@r@v47/54600198."I will see you next at the battle of the second TWILIGHT.@k@v47/54600199. There, I will once again raise my merciless LONGSWORD.@k@v47/54600200. ......So, Battler, I ask the same of YOU.@k@v47/54600201. Show no mercy towards ME."'
37523: 'Battler@r@v10/50101012."......I know.@k@v10/50101013. ...If I go easy on you, I''ll have my own head smashed in."'
37524: 'Dlanor@r@v47/54600202."On the game board, I am nothing more than Lady BERNKASTEL''s piece and Furudo Erika''s AGENT.@k@v47/54600203. In the future, I will likely block your way as an enemy many TIMES.@k@|@y@v47/54600204. ......However, in my heart, I am always NEUTRAL.@k@v47/54600205. ......No, ......please forget THAT.@k@v47/54600206. ......It has no bearing on the nature of our RELATIONSHIP."'
37525: 'Battler@r@v10/50101014."It does.@k@v10/50101015. ......There''s no doubt you''re a fearsome opponent, but you don''t piss me off anymore.@k@|@y@v10/50101016. Unlike that Erika, who totally pisses me off."'
37526: 'Dlanor@r@v47/54600207."I am GLAD.@k@v47/54600208. I also find Furudo Erika to be OBNOXIOUS."'
37527: 'Battler@r@v10/50101017."Heh, hahahahaha."'
37528: '@rDlanor''s expression finally softened slightly.@k@r......At the very last moment, it felt as though we finally understood each other.'
