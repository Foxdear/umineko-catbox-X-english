37749: 'Battler@r@v10/50101028."..................@k@v10/50101029. ......My argument then was about whether it was possible for Grandfather to escape from the study, remember...?@k @v10/50101030.And it was possible for Grandfather to escape through the window.@k@v10/50101031. All I did was prove that.@k@v10/50101032. ......Whether either of us jumped down or clambered down makes no difference."'
37750: 'Erika@r@v46/54500754."Don''t try to change the subject!!@|@y@k @v46/54500755.A mere Human can''t jump down from the third floor...!!@k @|@y@v46/54500756.How do you like that, how do you like that...?!!@k @v46/54500757.What do you think of my reasoning, my master...?!!"'
