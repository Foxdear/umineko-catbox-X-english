37682: 'LAMBDADELTA@r@v29/52200435."......Repetition requeeeeeest...?@k @v29/52200436.I know I''m being generous with the red, but aren''t you getting a bit greedy?@k @|@y@v29/52200437.I''m not an idiot like Beato,@k@v29/52200438. so I''m not gonna go blabbing all the repetitions my opponent asks for..."'
37683: 'BERNKASTEL@r@v28/52100460.".........I''ll give you a full-body massage scrub in a bath with marshmallows and konpeitou sometime soon.@k@v28/52100461. Hard enough to rub your skin off."'
37684: 'LAMBDADELTA@r@v29/52200439."Eheheheheh, now you''ve gotta keep that promise. *slurp*!@k @|@y@v29/52200440.......Alright, then, here''s a freebie♪@k @v29/52200441.I''ll respond to your repetition request.@k@v29/52200442.@|@y "@c900.@[At midnight, only Erika, George, Jessica, Maria, Nanjo, Gohda, and Kumasawa existed outside the mansion@]@c."!"'
