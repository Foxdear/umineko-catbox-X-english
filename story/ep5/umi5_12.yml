37697: 'Erika@r@v46/54500714."All been destroyed......?!@k @v46/54500715.Take a little more care how you speak to me, you useless furniture!@k @v46/54500716.If I can just think of that trick, it''s an instant checkmate...!@k @v46/54500717.All been destroyed?! Blue truth invalid?!@k @|@y@v46/54500569.I am...@v46/54500570....the detective...@v46/54500720....Furudo Erika...!@v46/54500721. ......How dare you speak to me like that.........!!"'
37698: '@rErika''s face twisted.'
37699: '@r......These words that seemed to deny Erika...@kno, Erika''s deductions...were the worst form of torture and humiliation for her.'
37700: 'Dlanor@r@v47/54600249."......Miss Erika.@k@v47/54600250. Why don''t we postpone the mystery of the letter for NOW?@k@v47/54600251. ...Your blue stake regarding the knock, "someone outside the mansion played it with a cassette tape", is still VALID.@k@v47/54600252. If it was possible to solve the noise, then it should be possible to solve the letter as WELL."'
