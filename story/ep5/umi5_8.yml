35661: 'Gohda@r@v17/51700030."I will clean up here.@k@v17/51700031. Please enjoy your sleep, everyone."'
35662: '@rLeaving the clean-up to Gohda-san, I went to the bathroom and then climbed the stairs to the second floor.'
35663: 'Nanjo@r@v19/51900038."Goodnight, everyone.@k@v19/51900039. These old bones have stayed up a little too late."'
