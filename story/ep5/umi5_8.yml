35282: '@r......Battler did nothing but gaze lazily out the window.'
35283: '@rThe fighting between the relatives continued without end......'
35284: '@rAt first, the relatives had crowded around the study.'
35285: '@rHowever, no matter how much they knocked, the master of the study did not answer even once.'
35286: '@rEva and several others said that they should open the door with the second key, the one Genji held.'
35287: '@rHowever, in a flash of brilliance, Natsuhi said that Kinzo had been in a particularly bad mood and had taken back the key he''d previously given Genji,@k meaning that he now had both keys himself.@k She claimed that it was therefore impossible for them to open the door.'
35288: '@rAfter she promised to let them meet Kinzo tomorrow morning no matter what, they finally returned to the dining hall.'
35289: '@rBut, of course, the argument continued on even after they returned there.'
35290: '@rEva''s group wanted a lot of cash very soon, and they were trying to threaten Krauss somehow and make him pay up.'
35291: '@r......Apparently, Battler''s solving of the epitaph, which threatened Krauss''s position as the next head,@k had given the others a huge tailwind.'
35292: '@rOn the other side, Krauss and Natsuhi denied the very basis of their argument,@k claiming that it had never been specified that ownership of the gold would be handed over to the person who solved the epitaph.'
35293: '@rThey asserted that it hadn''t been hidden gold, but just Kinzo''s stockpile,@k and it was still Kinzo''s property, which meant it was only natural for it to be distributed after Kinzo''s death with the rest of the inheritance.'
35294: '@rAfter hearing this, Eva''s group once again started demanding that they be allowed to see Kinzo.'
35295: '@r......It had probably been clear as day from the beginning.@k@rThis sibling fight could only be settled by Kinzo...'
35296: '@rIt was obvious that this confrontation was between Eva''s group, which wanted cash fast,@k and Krauss, who was hiding his lack of funds but still didn''t need money right away.'
35297: '@rAs Battler listened vaguely to this exchange,@k ......he marveled at how, despite their usual affluent airs, they were all surprisingly deep in debt...'
35298: 'Krauss@r@v02/50800228."Didn''t you already say that a short while ago?@k@|@y@v02/50800229. That''s enough, let''s take a break.@k@v02/50800230. We''re all repeating the same things over and over again."'
35299: '@rAccording to the clock, it was almost midnight.'
35300: '@rIt certainly was a perfect time for a break.'
35301: '@rThe atmosphere relaxed just a bit...'
35302: 'Hideyoshi@r@v06/51100091."I agree.@k@v06/51100092. It''d do both sides some good to take a breather.@k@|@y@v06/51100093. ...Listen, why don''t we take a record down for the rest.@k@v06/51100094. I''ve had enough of fighting over what was or wasn''t said."'
35303: 'Eva@r@v05/51000135."Seriously.@k@v05/51000136. We really can''t do without a record of proceedings, not when Nii-san can so easily deny something he''s said before the words stop bouncing off the walls."'
35304: 'Kyrie@r@v09/51300065."With a written record, just writing it would be a pain, and it''d be open to forgery."'
35305: 'Rudolf@r@v08/51200089."Right.@k@v08/51200090. ......Aniki, does this thing work?"'
35306: 'Krauss@r@v02/50800231."The tape set?@k@|@y@v02/50800232. ...I see.@k@v02/50800233. This way, we can keep a record without bothering to write it down, and forgery will be impossible.@k@v02/50800234. It''s fair for both sides."'
35307: 'Natsuhi@r@v03/50900490."Make sure you don''t mess anything up...!@k @v03/50900491.Those are Father''s precious music tapes!"'
35308: '@rThe dignified tape set had a sense of weight to it which matched this majestic dining hall perfectly.'
35309: '@rOn pleasant Sunday mornings, it would sometimes be used to play famous tapes or records.'
35310: '@rHowever, right now, it was the most neutral and impartial conference record keeper around...'
35311: '@rRudolf fished randomly around the cassette rack, searching for a blank tape.'
35312: '@rAnd every time he found some tape with "sophisticated" music, he would chuckle at how pompous it was.'
35313: 'Genji@r@v14/51600094."Excuse me.@k@v14/51600095. ......You called?"'
35314: 'Rosa@r@v12/51400094."We''re taking a break.@k@v12/51400095. Sorry, but could you make us something to drink?@k@v12/51400096. And maybe some biscuits would be nice too."'
35315: 'Genji@r@v14/51600096."Certainly.@k@v14/51600097. I will prepare it right away......"'
35316: 'Rosa@r@v12/51400097."Also, ......sorry.@k@v12/51400098. Do you have any cold medicine?@k@v12/51400099. I''ve been feeling a bit feverish."'
35317: 'Krauss@r@v02/50800235."Then don''t overstrain yourself.@k@v02/50800236. Get some sleep."'
35318: 'Eva@r@v05/51000137."If you really feel like it, why not get some sleep, Rosa?@k @v05/51000138.Though I wouldn''t step out of such an important conference because of a simple cold."'
35319: 'Krauss@r@v02/50800237."Really?@k @v02/50800238.I would excuse myself without hesitation.@k@|@y@v02/50800239. Natsuhi, why don''t we take a short rest too?"'
35320: 'Natsuhi@r@v03/50900492."............Yes, dear."'
35321: '@rSensing that he meant to have a strategy meeting, Natsuhi stood up.'
35322: '@r......Even if that wasn''t the case, she was so desperate to get out of the room even for a moment that she''d have taken any excuse.'
35323: '@rKrauss and Natsuhi left the dining hall, ......and the tension in the room truly relaxed.'
35324: 'Battler@r@v10/50100611."............Phew."'
35325: 'Kyrie@r@v09/51300066."You''ve been doing great, Battler-kun.@k@v09/51300067. ......I imagine you feel just horrible.@k@v09/51300068. Think of this as part of growing up and just accept it."'
35326: 'Battler@r@v10/50100612."Just how long am I going to have to sit around doing nothing here?"'
35327: 'Kyrie@r@v09/51300069."......Who knows.@k@v09/51300070. After all, you''re like our personal donation box.@k@v09/51300071. ......Sleepy?"'
35328: 'Battler@r@v10/50100613."About the same as Japanese Lit class."'
35329: 'Kyrie@r@v09/51300072."I''m pretty sure Father won''t show up tonight anyway.@k@v09/51300073. When Krauss nii-san and the rest come back, I''ll propose that we might as well let you go."'
35330: 'Battler@r@v10/50100614."......I''d appreciate that."'
35331: '@rTap-tap.'
35332: '@rA light knock and the faint sound of china clinking together could be heard.'
35333: 'Shannon@r@v15/50500011."Excuse us......"'
35334: 'Kanon@r@v16/50600026."We have brought tea."'
35335: '@rShannon and Kanon had come by with a serving cart.'
35336: '@rThe pleasant smell of black tea relieved their tension all the more.'
35337: 'Rudolf@r@v08/51200091."......Hey.@k@v08/51200092. Did you hear?"'
35338: 'Shannon@r@v15/50500012."What are you talking about......?"'
35339: 'Kanon@r@v16/50600027."............We didn''t hear anything."'
35340: 'Eva@r@v05/51000139."Stop it, Rudolf.@k@v05/51000140. There''s no reason to tell them."'
35341: 'Kanon@r@v16/50600028."......We are furniture,@k@v16/50600029. so we have no interest in the family conference."'
35342: 'Eva@r@v05/51000141."I see.@k@v05/51000142. That''s a wise answer."'
35343: 'Rosa@r@v12/51400100."......You have the midnight shift?@k @v12/51400101.That must be tough."'
35344: 'Shannon@r@v15/50500013."That is our job.@k@v15/50500014. ......We would be happy to receive your orders."'
35345: 'Hideyoshi@r@v06/51100095."You could be right there.@k@v06/51100096. It''d probably be even more tiresome to sit around awake doing nothing.@k@v06/51100097. When I was still down in the bottom rungs, I once worked as a warehouse keeper.@k@v06/51100098. Even if you''re just staying awake, it''s still pretty tough...!@k @v06/51100099.Right after the war, you had robbers all over the place.@k@v06/51100100. Plus you couldn''t rely on the police back then, so it was a pretty dangerous time...!"'
35346: '@rHideyoshi was particularly proud of how he had started with nothing and built up assets by diverting goods from the American army.'
35347: '@rOnce the subject came up, Hideyoshi tended to get pretty talkative.'
35348: '@rThe relatives knew this and were greatly relieved to see that a perfect sacrifice had come up.'
35349: 'Hideyoshi@r@v06/51100101."If you got found out, you were in for it big time!@k @v06/51100102.Those Yanks are scary!@k @v06/51100103.Their strength''s in another league ''cause of all that beef they eat.@k@v06/51100104. Get caught and that''d be the end of ya! Firin'' squad or <death by hanging>!"'
35350: 'Hideyoshi@r@v06/51100109."You know that one? <Death by hanging>!@k@v06/51100110. Oh yeah, and then, I figured it out.@k@v06/51100111. It''s all about the meat! The meat!@k@v06/51100112. Japanese people''ve gotta eat more meat!@k@v06/51100113. And that''s when I had the revelation—I had to start up a business to capture people''s stomachs!"'
35351: 'Shannon@r@v15/50500015."I, ...I see...@k@v15/50500016. That m-must have been quite a difficult task......"'
35352: 'Eva@r@v05/51000143."Stop it, darling.@k@v05/51000144. No matter how much you tell people born after the war, they''ll never understand how hard it was back then."'
35353: 'Hideyoshi@r@v06/51100114."Oops, looks like my bad habit''s jumped out again...!@k @v06/51100115.Sorry, sorry!@k @|@y@v06/51100116.Wahahahahaha!"'
35354: 'Rosa@r@v12/51400102."You two should have some tea as well.@k@v12/51400103. I think it might help you if once in a while you used your own mouths to learn more about the tea you''re brewing."'
35355: 'Kanon@r@v16/50600030.".........No, we''ll be fine.@k@v16/50600031. There''s no need to be concerned for our sakes..."'
35356: 'Battler@r@v10/50100615."Hang out with us for a bit.@k@v10/50100616. Being surrounded by only adults makes me feel like I''m gonna suffocate."'
35357: 'Rudolf@r@v08/51200093."Hear that? That''s an order from Battler-sama, successor to the head!@k @v08/51200094.Sit over there and have some tea with us.@k@v08/51200095. And tell us about what''s been going on recently, your hobbies, TV shows you''re watching, and whatever it is that''s popular with young folks these days.@k@v08/51200096. There''s a lot we could learn."'
35358: 'Kyrie@r@v09/51300074."*giggle*.@k@v09/51300075. That''s a brilliant idea.@k@v09/51300076. Come on, sit down, both of you.@k@v09/51300077. And become our sacrifices now that we''re starved of things to talk about."'
35359: 'Hideyoshi@r@v06/51100117."Wahahahahahaha.@k@v06/51100118. That''s right.@k@v06/51100119. The only way I''m gettin'' to talk to young folk at this age is goin'' to a cabaret club."'
35360: 'Eva@r@v05/51000145."......How long are you planning on standing around there?@k@v05/51000146. Rudolf told you to sit.@k@v05/51000147. Go on, sit down.@k@v05/51000148. ......I give you permission as well."'
35361: '@rAfter getting Eva''s permission, Shannon and Kanon looked at each other and finally obeyed, nervously.'
35362: '@rFor a while, the two were pounded by questions and became the relatives'' playthings......'
35363: '@rTap-tap.@k Another reserved knock could be heard.'
35364: '@rAll of the servants tended to knock in a similar manner,@k so no one noticed anything strange.'
35365: '@rHowever, Shannon and Kanon turned around with surprised looks on their faces.'
35366: '@r......The servants here today included the two of them, Genji, Kumasawa, and Gohda.'
35367: '@rGohda had the midnight shift at the guesthouse.@k@rKumasawa had gone to bed in the servants'' quarters in the guesthouse.'
35368: '@rAnd they were in here, ......so Genji was the only person left,@k ...but they knew very well that Genji wouldn''t knock like that......'
35369: 'Rudolf@r@v08/51200097."......Who is it?@k @v08/51200098.It''s not locked. Just come in."'
35370: '@rRudolf didn''t recognize the knock either.'
35371: '@rAnd when he asked "Who is it?", everyone came to the same realization that they too had no idea who would knock like that......'
35372: '@rAfter that, the same knock repeated just once more.'
35373: '@r......Could it be that someone had their hands full...and was asking that the door be opened for them...?'
35374: '@rAs a slightly odd feeling began to encompass the room, the sound of the large clock in the hall could be heard.'
35375: '@rIt was the sign that October 4th had ended and October 5th had begun......'
35376: '@rA short while earlier—'
35377: '@rKrauss and Natsuhi were well away from the dining hall, in a deserted corridor on the second floor......'
35378: 'Krauss@r@v02/50800240.".........So, we no longer have any other options."'
35379: 'Natsuhi@r@v03/50900493."Yes...@k@v03/50900494. ......I do not think the same trick will work again tomorrow.@k@v03/50900495. ...If we hesitate any longer, there''s a chance that Eva-san and the others will claim that we have Father locked up and call the police.@k@|@y@v03/50900496. This is......as far as we can go."'
35380: 'Krauss@r@v02/50800241."................................."'
35381: 'Natsuhi@r@v03/50900497."......Battler-kun finding the gold......was completely unexpected.@k@v03/50900498. If only that hadn''t happened, I''d thought of a plan which might have managed to get us through this somehow......"'
35382: 'Krauss@r@v02/50800242."......Hmph.@k@v02/50800243. Just like every other bet I''ve made.@k@v02/50800244. ...Something unexpected always arises, and the "guaranteed" outcome is thrown off course."'
35383: 'Natsuhi@r@v03/50900499.".........We''ll have Father''s room be empty starting tomorrow morning.@k@v03/50900500. Let''s plan it out with Genji and have him say that he saw Father heading out into the forest early in the morning."'
35384: 'Krauss@r@v02/50800245."I doubt Eva and the others will swallow that story of his disappearance..."'
35385: 'Natsuhi@r@v03/50900501."I''m fully aware of that.@k@v03/50900502. However, we have no other options...!"'
35386: 'Krauss@r@v02/50800246."If we do such a thing, ......Eva and the others will doubtless make a fuss about it being suspicious.@k@v02/50800247. They aren''t worried about appearances as long as they can squeeze some money out of us.@k@v02/50800248. ...They might strike a deal with some odd magazine and cause serious damage to the confidence placed in me."'
35387: 'Natsuhi@r@v03/50900503."We can live with damage...!@k @v03/50900504.If by any chance Father''s secret is discovered, it won''t be a matter of mere damage...!!"'
35388: 'Krauss@r@v02/50800249."There''s nothing wrong with persisting until the last second tomorrow.@k@v02/50800250. If we''re able to make it through safely, we won''t have to lose anything.@k@v02/50800251. There''s no need to get impatient and use up our trump card...!"'
35389: 'Natsuhi@r@v03/50900505."You want to wait until after they start accusing us of locking Father up, and then reply that he''s gone missing?@k @v03/50900506.That is far more likely to draw suspicion...!!"'
35390: 'Krauss@r@v02/50800252."........................nnnn......"'
35391: 'Natsuhi@r@v03/50900507."......Let''s just...@v03/50900508.put Father to rest now...@k@v03/50900509. To go any further...@v03/50900510.......would be impossible......"'
35392: 'Krauss@r@v02/50800001."Calm yourself.@k@v02/50800254. You''ve just had too much exposure to the toxin from Eva and the others and have lost your composure.@k@v02/50800255. ......Only two keys exist which can let anyone into that study!@k @v02/50800256.And you have both of them right here.@k@v02/50800257. That means no one can go inside.@k@v02/50800258. That door is of a very special make.@k@v02/50800259. No matter what kind of tools they bring out of the storehouse, it won''t even budge."'
35393: 'Natsuhi@r@v03/50900511."It isn''t a physical problem like that...!"'
35394: 'Krauss@r@v02/50800260."Look, stop panicking, settle down.@k@v02/50800261. If you like, you can pretend to have gotten a fever and stay in bed.@k@v02/50800262. In the meantime, I will overcome all of this."'
35395: 'Natsuhi@r@v03/50900512."......I can''t leave everything to you...!@k @v03/50900513.I''ll fight until the end too...!"'
35396: '@rWhen Natsuhi could no longer hold back the tears brought on by her fierce emotions, ......Krauss held her gently.'
35397: '@r......Just how long had it been since she''d last felt warmth from her husband''s embrace......'
35398: 'Krauss@r@v02/50800263."Your headache.........is killing you, isn''t it?@k @v02/50800264.Whenever you get those creases between your eyebrows, I can tell."'
35399: 'Natsuhi@r@v03/50900514."............Dear......"'
35400: '@rShe had come to think that her husband could never understand the way she felt.'
35401: '@rBut, ......when it came to times like this.........'
35402: 'Krauss@r@v02/50800265."......Let''s wait for the very last moment before using our disappearance trump card.@k@|@y@v02/50800266. It''s like a last-resort treasured sword:@k@v02/50800267. it''s best when it remains in its sheath.@k@v02/50800268. The important thing is being ready to pull it out at any time, wouldn''t you agree...?"'
35403: 'Natsuhi@r@v03/50900515."I......understand that..."'
35404: 'Krauss@r@v02/50800269."Why don''t you leave that trump card with me?@k@v02/50800270. .........Of course, at the final moment, I will take all of the responsibility.@k@v02/50800271. ......I won''t get you and Jessica involved."'
35405: 'Natsuhi@r@v03/50900516."What...do you mean by that...?!"'
35406: 'Krauss@r@v02/50800272."If the Ushiromiya family is destroyed, it is enough that I alone am crushed under the rubble.@k@v02/50800273. .........After the typhoon passes, I will prepare divorce forms.@k@v02/50800274. I will sign the papers for you to keep and use when you please.@k@v02/50800275. ......I have some assets hidden away in your name.@k@v02/50800276. Add on the settlement, and it should be enough for you and Jessica to live in comfort."'
35407: 'Natsuhi@r@v03/50900517."No!!@k @v03/50900518.Ushiromiya Natsuhi is the name that should be engraved on my tombstone...!@k @v03/50900519.Please let me be with you until the last moment...!@k @v03/50900520.Even if it turns out that you are the last head of the Ushiromiya family,@v03/50900521. ......please let Natsuhi...@v03/50900522....be the name of his wife...@v03/50900523....your wife......"'
35408: '@r......Krauss''s existence was based solely upon the power of his assets and his trustworthiness as a financial fixer.'
35409: '@rIf those were both undermined, nothing would remain.'
35410: '@rUsing the trump card of Kinzo''s disappearance would mean losing one of these two essential supports.'
35411: '@r......It was like offering your right arm to save your head from being cut off.'
35412: '@rIt was probably better than losing your head, but you still might die from the blood loss,@k and even on the off-chance that you did survive, you would have to bear a heavy wound that wouldn''t heal for the rest of your life......'
35413: '@rKrauss was prepared even for death......'
35414: '@rNatsuhi understood this,@w500. ......buried her face in Krauss''s chest,@w500. ...and cried...'
35415: 'Genji@r@v14/51600098."............My apologies for interrupting."'
35416: '@rGenji''s sudden voice made Natsuhi jump back and hurriedly wipe the tears from her eyes.'
35417: '@rKrauss stood in front of Natsuhi, shielding her.'
35418: 'Krauss@r@v02/50800277."Ah, Genji-san.@k@v02/50800278. Please don''t sneak up on us.@k@v02/50800279. ......Do you have some business?"'
35419: 'Genji@r@v14/51600099.".........Yes.@k@v14/51600100. My apologies, but I have something to report to Madam."'
35420: 'Natsuhi@r@v03/50900524."To......me......?@k @v03/50900525.Dear......"'
35421: 'Krauss@r@v02/50800280."I don''t mind."'
35422: '@rKrauss left Natsuhi''s side, went to a window a short way off,@k and gazed at the windy and rainy rose garden......'
35423: '@rNatsuhi went with Genji to a place a short distance away.'
35424: 'Natsuhi@r@v03/50900526."......What is it?"'
35425: 'Genji@r@v14/51600101.".........Well...@k@|@y@v14/51600102. The truth is, another phone call has come for you, Madam."'
35426: '@rAt that moment, she was surprised by a sudden, eerie sound.@k@rIt was the large clock in the hall announcing midnight...'
35427: 'Natsuhi@r@v03/50900527."You don''t mean............that man......again...?"'
35428: 'Genji@r@v14/51600103.".........Yes.@k@v14/51600104. ......What is to be done?"'
35429: 'Natsuhi@r@v03/50900528."D-......did he say what business he had with me?"'
35430: 'Genji@r@v14/51600105.".........He would not answer.@k@v14/51600106. He kept insisting that he wanted to speak to you directly."'
35431: 'Natsuhi@r@v03/50900529.".............................."'
35432: '@rAgain, ...a phone call......from the man who claimed to be taking revenge for what had happened 19 years ago.'
35433: '@r19 years ago.'
35434: '@r......That was just one year before Jessica and Battler were born.'
35435: '@rIn Natsuhi''s eyes, the gap between 19 years ago and 18 years ago was immense.'
35436: '@r......For a long time, she was unable to fulfill her role of creating a successor for the Ushiromiya family...and was treated very coldly.'
35437: '@rBut then, she finally gave birth to Jessica...@kand became able to call herself the wife to the Ushiromiya successor with her head held high.'
35438: '@r......So in her eyes, "Ushiromiya Natsuhi" began 18 years ago.'
35439: '@r......So everything before that, including 19 years ago......contained nothing but hateful memories.'
35440: '@rThe last year of that hateful period.........was whispering of revenge...from the other end of the phone......'
35441: '@r.........Once again......she heard the roar of the sea......'
35442: '@r....................................'
35443: 'Genji@r@v14/51600107.".........What is to be done?"'
35444: 'Natsuhi@r@v03/50900530."Transfer it......to my room.@k@v03/50900531. ......Don''t let my husband know."'
35445: 'Genji@r@v14/51600108."......As you wish."'
35446: '@rFrom the very beginning, Genji had understood that she wouldn''t want Krauss hearing about this phone call.'
35447: '@rThat was why he had told Natsuhi covertly......'
35448: '@rNatsuhi ordered that he transfer the call, told Krauss that she would turn in for the night, and left at a quick pace......'
35449: '@rShe returned to her room and locked the door.'
35450: '@r...There''s nothing peculiar about that.@k@r......In the Ushiromiya family, hallways are like public roads.@k@rThere''s no special meaning in locking the door when you enter your own room...'
35451: '@r...This is what she told herself.'
35452: '@rThen, as though it had been waiting for her, the telephone rang.@k@r...Genji must have transferred the call.'
35453: '@rShe took a deep breath, readied herself, ............and picked up the receiver.'
35454: 'Natsuhi@r@v03/50900532."............Hello........."'
35455: '@r".............................."'
35456: '@rAgain, ......it started with silence.'
35457: '@rShe realized that the person at the other end was trying to keep her in suspense and make her feel uncomfortable, and she got angry...'
35458: 'Natsuhi@r@v03/50900533."Why are you silent...?!@k @v03/50900534.I''m hanging up...!"'
35459: '@r@v10/50100618."...Hahahahahahaha...@k@v10/50100619. ......Don''t hang up, Mother.@k@v10/50100620. I want to hear your voice a little longer......"'
35460: '@rAgain......that unpleasant voice......'
35461: 'Natsuhi@r@v03/50900535."Are you trying to mock me...?!@k @v03/50900536.State your business...!"'
35462: '@r@v10/50100621."I want to play with you, Mother."'
35463: 'Natsuhi@r@v03/50900537."...Wh-......what?@k @v03/50900538.What are you talking about?!@k @v03/50900539.I have no desire to play with you...!!"'
35464: '@r@v10/50100622."......You''re tired from the family conference, right?@k @v10/50100623.I''ll bet that chronic headache of yours is giving you a bad time."'
35465: 'Natsuhi@r@v03/50900540."Th-that''s none of your business...!"'
35466: '@rJust the fact that he knew her headache was troubling her made a shiver run up her spine...'
35467: '@r@v10/50100624."You get headaches because your head''s all stiff.@k@v10/50100625. You won''t have pleasant dreams if you go straight to bed like that."'
35468: 'Natsuhi@r@v03/50900541."Haven''t I told you that''s none of your business?!!@k @v03/50900542.I''m hanging up!!"'
35469: '@rNatsuhi forcefully yelled that she was hanging up, but in actuality, she couldn''t...'
35470: '@rAfter all, this person was choosing to call her, and that was much better than the alternative.'
35471: '@r......If she hung up violently,@k ...this person might choose to call someone else...'
35472: '@r@v10/50100626."Let''s play a bit to help you relax.@k@v10/50100627. Don''t worry, I won''t take up much of your time."'
35473: 'Natsuhi@r@v03/50900543."I, ...I have no intention of playing with you......!"'
35474: '@r@v10/50100628."......Your name is Natsuhi, Mother.@k@v10/50100629. It has the kanji for a season in it.@k@v10/50100630. Pretty nice name.@k@v10/50100631. .........However, just because your name is Natsuhi, that doesn''t necessarily mean that you like summer.@k@v10/50100632. ...Which season is your real favorite, Mother......?"'
35475: 'Natsuhi@r@v03/50900544."You think I''ll tell you?"'
35476: '@r@v10/50100633."If you don''t, ......I''ll hang up.@k@v10/50100634. .........Are you sure you want that?"'
35477: 'Natsuhi@r@v03/50900545."...kh.................."'
35478: '@rIt was clearly a threat.'
35479: '@r......It meant that if she forced him to hang up the phone,@k anything might happen......'
35480: '@rHumiliated that she was forced to give in to a threat made by a man whose name she didn''t even know, she gave him the answer he wanted......'
35481: 'Natsuhi@r@v03/50900546.".........I-.........it''s autumn."'
35482: '@r@v10/50100635."Why......?"'
35483: 'Natsuhi@r@v03/50900547."B-because it''s an easy season to pass the time in...!@k @v03/50900548.There''s no other reason in particular.@k@v03/50900549. Are you satisfied now?!"'
35484: '@r@v10/50100636."Yeah, I''m satisfied.@k@v10/50100637. ......It looks like your favorite season really is the same as mine.@k@v10/50100638. ......I like the fall too.@k@v10/50100639. .........Heheheheheheheheheheheheh..."'
35485: 'Natsuhi@r@v03/50900550."......Liar!@|@y@k @v03/50900551.You just made that up...!"'
35486: '@rThis man would no doubt have done the same thing no matter which season I said I liked.'
35487: '@r......What is he after?!'
35488: '@rWhat''s so fun about making me uncomfortable like this...?!'
35489: '@r@v10/50100640."It''s not nice to call someone a liar.@k@v10/50100641. ......I didn''t make it up.@k@v10/50100642. I was already certain that you liked the fall, Mother.@k@v10/50100643. .........I can even show you proof."'
35490: 'Natsuhi@r@v03/50900552."Proof.........?"'
35491: '@r@v10/50100644."Yeah.@k@v10/50100645. ......Is there a clock in your room, Mother...?"'
35492: 'Natsuhi@r@v03/50900553."...A clock......?@k @v03/50900554.Y-......yes, there is, but what''s your point......?"'
35493: '@rIn Natsuhi''s room, there was a beautiful antique clock with an intricate design.'
35494: '@r......Krauss had bought it for her as a birthday present long ago.'
35495: 'Natsuhi@r@v03/50900555.".........It''s seven minutes past midnight right now.@k@v03/50900556. I''m tired, so please get this farce over with quickly...!"'
35496: '@r@v10/50100646."Try lifting the clock up."'
35497: 'Natsuhi@r@v03/50900557."Wh-why?"'
35498: '@r@v10/50100647.".........You just don''t know when to shut up.@k@v10/50100648. Stop resisting every single time I say something.@k@v10/50100649. Just shut up and do what I say."'
35499: '@rThe tone of the man''s voice suddenly went low, turning into a threat.@k@rIt indicated clear displeasure.'
35500: '@rOutwardly, this man had a calm manner of speaking, but on the inside, things were completely different.'
35501: '@rIf she angered this man even the slightest bit further, he would surely show his true nature right away...'
35502: '@r@v10/50100650."......Are you really that eager to make me hang up?@k @v10/50100651.You''d better start realizing how lucky you are that I''m talking on the phone with you right now......@k@v10/50100652. ...I can tell your husband and daughter about what happened 19 years ago any time I want to..."'
35503: 'Natsuhi@r@v03/50900558."I, I don''t know what you''re talking about, but please don''t get my husband and daughter involved...!@k @v03/50900559.I''m listening to everything you say...!"'
35504: '@r@v10/50100653."Then do what you''re goddamn told......"'
35505: '@rOnce again, the man threatened me in a low voice, as though warning me never to talk back to him again...'
35506: '@rMy head was filled with the pain from my headache, the sound of my beating heart, ......and the roar of the sea...'
35507: '@r......I couldn''t disobey him anymore.'
35508: '@r.........As the man had ordered, I lifted up the antique clock...'
35509: 'Natsuhi@r@v03/50900560.".................................?"'
35510: '@rThere lay something that resembled a single playing card.@k@r............?'
35511: '@rPerhaps it was the warranty for the clock.........?@k@rThinking this, she took it and turned it over............'
35512: '@r@v10/50100654."Are you.........wide awake now?"'
35513: 'Natsuhi@r@v03/50900561."Eek, ah,@v03/50900562. ......aaaaaaaahhhhh......@k@v03/50900563. Wh-@v03/50900564.wh-wh-@v03/50900565.why...@v03/50900566. ...Why is...@v03/50900567....this...?!?!"'
35514: '@r@v10/50100655."Well, I''ll be happy if your headache''s gone down a bit.@k@v10/50100656. ......Tell me you''re happy, Mother."'
35515: 'Natsuhi@r@v03/50900568."How did you...?!@k @v03/50900569.Why?!@k @v03/50900570.How?!"'
35516: '@r@v10/50100657."I want you to tell me you''re happy, you murderer.@k@v10/50100658. How dare you act like a normal, neat-freak mother. You make me want to vomit.@k@v10/50100659. Do you want some of it to land on your husband and daughter as well?@k @v10/50100660.You don''t, do you?@k @v10/50100661.You want me to keep quiet, don''t you?@k @v10/50100662.Yeah, I''ll keep quiet. See, aren''t you happy?@k @v10/50100663.Aren''t you happy?!"'
35517: 'Natsuhi@r@v03/50900571."Ah, .........aaaah, I''m happy... I''m happy...!!@k @v03/50900572.So please...stop...@k@v03/50900573. Don''t burden my husband and daughter...!@k @v03/50900574.What is it you want?@k@v03/50900575. Money?@k @v03/50900576.How much?!"'
35518: '@r@v10/50100664."I don''t want money.@k@v10/50100665. ......My wounds couldn''t be healed with any amount of money.@k@v10/50100666. But there is a medicine.@k@v10/50100667. ......Yes,@k@v10/50100668. it''s like a kind of ointment.@k@v10/50100669. ......Thick, syrupy and dribbling."'
35519: '@r@v10/50100670."............And that is...@v10/50100671.my hatred,@v10/50100672. ......my resentment towards you.@k@v10/50100673. ...Slathering myself with that...@v10/50100674.is the only way to hold back the pain..."'
35520: '@rNatsuhi had never had anything so hateful said to her in her entire life.'
35521: '@rSo she suspected many times that she must be having some sort of bad dream.'
35522: '@rHowever, ......this definitely wasn''t a dream...'
35523: 'Natsuhi@r@v03/50900577."......Y-@v03/50900578....you couldn''t possibly be...@v03/50900579....on this island right now, could you...?"'
35524: '@r@v10/50100675."I am.@k@v10/50100676. Didn''t I promise you?@k @v10/50100677.I said I''d be at the family conference."'
35525: 'Natsuhi@r@v03/50900580."That''s impossible...!@k @v03/50900581.There''s no way you could have come during this typhoon...!!"'
35526: '@r@v10/50100678."That''s no problem if I came before the typhoon reached here.@k@|@y@v10/50100679. ......And I''m pretty sure this guest called Erika or whatever arrived even during the typhoon."'
35527: '@rHer blood froze......@k@rFurudo Erika had been brought here by coincidence...@k@rIf he knew that name, he would have to be very close by......'
35528: 'Natsuhi@r@v03/50900582."Wh-@v03/50900583.......where...@v03/50900584....a-@v03/50900585.......are you.........?"'
35529: '@r@v10/50100680."......I won''t appear in front of anyone until you introduce me.@k@v10/50100681. Don''t worry.@k@v10/50100682. .........Oh yeah, it''s useless to try and search for me.@k@v10/50100683. Your mansion is huge.@k@v10/50100684. And you have phones all over the place.@k@v10/50100685. Besides, I''m sure you don''t want to see me either, do you?"'
35530: '@r@v10/50100686."......Or are you offering to find me and introduce me to everyone...?@k @v10/50100687.Introduce me to Jessica too.@k@v10/50100688. ......Tell her I''m her older brother by one year.@k@v10/50100689. Heheheheheheheheheheheheheheh!!"'
35531: 'Natsuhi@r@v03/50900586."S-stop it...... Stay away from Jessica......"'
35532: '@r@v10/50100690."I guess I''ve scared you a bit too much.@k@v10/50100691. That''s all from me...for tonight.@k@v10/50100692. ......But don''t forget.@k@v10/50100693. You cannot disobey me.@k@v10/50100694. Understand,@v10/50100695. ......Mother?"'
35533: 'Natsuhi@r@v03/50900587."......Y-.........yes......"'
35534: '@r@v10/50100696."I''m going to hang up for the night, ......but I have an order to be followed up until tomorrow morning."'
35535: 'Natsuhi@r@v03/50900588."Wh-......what is that.........?"'
35536: '@r@v10/50100697."You may no longer leave that room tonight, and you may not make any phone calls.@k@v10/50100698. If the phone rings, you aren''t allowed to pick it up, either.@k@v10/50100699. And you will turn the lights off right now, get in bed, and sleep.@k@v10/50100700. Then you will wake up at your ordinary time.@k@v10/50100701. ............Heheheheheh.@k@v10/50100702. It sure is nice to live a healthy life.@k@v10/50100703. I really am such a good son, working so hard for the sake of my Mother''s body......"'
35537: 'Natsuhi@r@v03/50900677."I, ......I understand.@k@v03/50900678. I''ll sleep right now.@k@v03/50900679. I won''t leave my room, and I won''t pick up the phone...!@k @v03/50900680.So please, don''t tell my husband and daughter......!"'
35538: '@r@v10/50100704."As long as you follow my orders, I''ll keep your secret, Mother.@k@v10/50100705. ......Don''t disobey me.@k@v10/50100706. ......I''m already very close by.@k@v10/50100707. I can easily tell whether you''ve turned your lights off and whether you''re on the phone.@k@v10/50100708. ...If I wished to, I could even kiss your sleeping face."'
35539: 'Natsuhi@r@v03/50900681."I''ll keep it!@k @v03/50900682.I''ll keep my promise!!@k @v03/50900683.So stop it, just stop it!@k @v03/50900684.Stop iiiiiiiiiiiiiiittt!!"'
35540: '@r......As she screamed, Natsuhi crushed the card she had found under the clock into a little ball.'
35541: '@rIt had a pattern on it like a tarot card,@k along with one single word:@w833.@|@y "Autumn".........'
35542: '@rWe go back in time once again.'
35543: '@rThe large clock in the hall was right in the middle of striking midnight.'
35544: '@rWondering who the person who had now knocked twice was,@k ......the relatives in the dining hall stared at the door.'
35545: '@rRudolf told them to come in.@k ......But there was no answer.'
35546: '@rUntil the end of that long tone marking the coming of midnight, which had come from the large clock in the hall shortly after the knock,@k they were unable to move in the slightest......'
35547: 'Battler@r@v10/50100709."......Maybe their hands are full and they can''t open it......"'
35548: 'Rudolf@r@v08/51200099."Maybe.@k@v08/51200100. ......But it''s a little creepy that they won''t say their name."'
35549: 'Kanon@r@v16/50600032."......Should I open it?"'
35550: 'Eva@r@v05/51000149."Do it."'
35551: '@rKanon nodded back, then slowly opened the door......'
35552: 'Rosa@r@v12/51400104."Ah, ......what''s that...?!"'
35553: 'Rudolf@r@v08/51200101."......It''s......one of Dad''s envelopes?"'
35554: '@rRight behind the opened door, on the floor of the hallway,@k ......lay the envelope.'
35555: 'Kanon@r@v16/50600033."There''s no one in the hallway.@k@v16/50600034. Perhaps they placed this here and left..."'
35556: '@rThe adults flew out into the corridor as well,@k but they could find no trace of anyone who might have knocked on the door......'
35557: '@rBarely an hour ago, Shannon and Kanon had come in to serve tea.'
35558: '@rAt that time, everyone had seen that nothing lay in that spot.'
35559: '@rSomeone came, knocked, left an envelope with the mark of the One-winged Eagle on it, and left...'
35560: 'Shannon@r@v15/50500017."C-......could it have been...the Master......?!"'
35561: 'Rosa@r@v12/51400105."......It''s not unthinkable.@k@v12/51400106. ......Father''s pretty much the only person in this mansion who would refuse to answer when asked who he was."'
35562: 'Eva@r@v05/51000150."That''s not possible.@k@v05/51000151. If that''s so, then why didn''t Father come in here openly?"'
35563: 'Hideyoshi@r@v06/51100120."......That''s right.@k@v06/51100121. Father would probably just come in here all of a sudden without knockin''...@k@v06/51100122. The doors and windows of this mansion are locked now, right...?@k @v06/51100123.In that case, the only people who could''ve left the letter there are Krauss-san, Natsuhi-san, and Genji-san."'
35564: '@rBy this point, the mansion had been completely locked up.'
35565: '@rTherefore, those in the guesthouse—the cousins, Nanjo, Gohda, Kumasawa, and Erika—could not have come here.'
35566: '@rFurthermore, since Krauss, Natsuhi, and Genji were the only three who weren''t in this room,@k one of those three had to have been the one who set that letter down in the corridor.'
35567: '@rIn that case, it was very likely that Krauss and the others had placed the letter there to make it seem like a message from Kinzo...'
35568: 'Eva@r@v05/51000152."I see...@k@v05/51000153. It''ll have something written on it which is supposedly in Father''s name, saying that he won''t accept Battler-kun as the next head, or something of the sort.@k@|@y@v05/51000154. Ridiculous.@k@v05/51000155. I can''t believe you''d try to pull such a childish trick, Nii-san...!"'
35569: 'Battler@r@v10/50100710."It''s not like I have any interest in being the next head..."'
35570: 'Rudolf@r@v08/51200102."Give up.@k@v08/51200103. This is just your fate.@k@v08/51200104. ......Anyway, why don''t we read what''s inside?"'
35571: '@rRudolf set the letter on the dining hall table and showed everyone the front and back,@k almost like a magician does before performing his act to show that there are no tricks or hidden mechanisms.'
35572: 'Kyrie@r@v09/51300078."......This envelope is without a doubt Father''s?"'
35573: 'Rosa@r@v12/51400107."Y-...yes, there''s no doubt.@k@v12/51400108. Father liked to use these envelopes for handwritten letters...@k@v12/51400109. What do you think, Shannon-chan?"'
35574: 'Shannon@r@v15/50500018."Y-yes......@k@v15/50500019. ......To my eyes as well, ......it looks like the type of envelope that the Master uses..."'
35575: 'Eva@r@v05/51000156."That doesn''t mean Father was the one who wrote it.@k@v05/51000157. It would be pitifully easy for Nii-san to snatch one of these from a drawer in Father''s study...!"'
35576: 'Kanon@r@v16/50600035."Even Krauss-sama cannot easily enter the study...@k@v16/50600036. It might be hard for him to steal an envelope......"'
35577: 'Rudolf@r@v08/51200105."Let''s try opening it.@k@v08/51200106. We can think about this later.@k@v08/51200107. ......There''s something in it.@k@v08/51200108. I wonder what."'
35578: '@rRudolf opened the envelope a bit roughly.'
35579: '@rThen, a folded letter...@k...and a glittering object fell out.'
35580: '@r......It was a ring.'
35581: 'Eva@r@v05/51000158."Huh?@k @v05/51000159.............Wait a second, ...that ring is......!"'
35582: '@rEva noticed it immediately and grabbed it...'
35583: 'Eva@r@v05/51000160."Th-@v05/51000161.......this is...@v05/51000162....Father''s ring...!@k @v05/51000163.I-it''s the Head''s Ring!!"'
35584: 'Hideyoshi@r@v06/51100124."......Wh-...what in the...!!@k @v06/51100125.Seriously?!"'
35585: 'Kyrie@r@v09/51300079."Are you sure it''s Father''s ring...?@k @v09/51300080.Could it be a replica...?"'
35586: 'Eva@r@v05/51000164."No, this is the real thing!@k @v05/51000165.I''ve always dreamed about wearing this ring on my finger someday.@k@v05/51000166. Even though Father wore this on his finger, I know more about it than anyone else.@k@v05/51000167. ......This is Father''s ring, no doubt about it!@k @v05/51000168.Why is it here?!"'
35587: 'Rosa@r@v12/51400110."Then it really was Father who wrote this letter...?!"'
35588: 'Rudolf@r@v08/51200109."......Heh, heheheheh.@k@v08/51200110. The sender isn''t Dad.@k@v08/51200111. ...It''s someone much more interesting."'
35589: 'Battler@r@v10/50100711."Then, ......who is the letter from?"'
35590: 'Rudolf@r@v08/51200112."It''s from the Ushiromiya family alchemist!@k @v08/51200113..........The Golden Witch, BEATRICE-sama......!!"'
35591: '@rRudolf showed everyone the part of the letter where that was written.@k@rIt really did say that......'
35592: 'Rosa@r@v12/51400111."I-......it''s from BEATRICE......?!"'
35593: 'Kyrie@r@v09/51300081."What''s it say......?"'
35594: 'Rudolf@r@v08/51200114."I''ll read it.@k@v08/51200115. .........<Congratulations>...@k@v08/51200116. I acknowledge that Battler-sama has spectacularly solved the riddle of the epitaph and reached the Golden Land.@k@v08/51200117. .........The gold belongs to him in its entirety.@k@v08/51200118. Furthermore, he is also the new head of the Ushiromiya family.@k@v08/51200119. ......As proof, ............I send the Head''s Ring, which Kinzo-sama left in my charge...@k@v08/51200120. ......Battler-sama, I beg that you put on this ring, become the new master of the gold, and lead the Ushiromiya family into the future.@k@v08/51200121. ......I pray with utmost sincerity that you flourish as the new head............"'
35595: 'Rudolf@r@v08/51200122."......Hah, ......hahah!@k @v08/51200123.What the hell...!@k @v08/51200124.I see, Dad just won''t come out of his study, so BEATRICE, the witch of the forest, has acknowledged Battler directly...!@k @v08/51200125.Hahaha, hahahahahahahahaha!"'
35596: 'Eva@r@v05/51000169."......Battler-kun.@k@v05/51000170. You should hold onto this ring.@k@v05/51000171. ......This is a special ring to be worn by the family head.@k@|@y@v05/51000172. .........I don''t know who this BEATRICE is,@k@v05/51000173. but she''s watched the whole thing and sent you this ring after acknowledging you as the true successor."'
35597: 'Battler@r@v10/50100712."I-......is that alright...?@k@v10/50100713. It''s such an important ring......"'
35598: 'Rudolf@r@v08/51200126."Yeah, it''s fine.@k@v08/51200127. You should wear it proudly on your finger.@k@|@y@v08/51200128. ......Got it? Even if Aniki and Natsuhi-san tell you to take it off, you better not do it no matter what...!"'
35599: '@rWith creepy smiles on their faces, all of the relatives urged Battler to put the ring on his finger...'
35600: '@rIt looked like things would get pretty nasty if he refused, so Battler reluctantly decided to put it on the middle finger of his left hand......'
35601: '@rThe ring was heavy and stiff......'
35602: '@rAt that moment, Krauss returned.'
35603: '@r......Genji came back as well immediately afterwards.'
35604: 'Krauss@r@v02/50800281."My apologies.@k@v02/50800282. It looks like my wife isn''t feeling so well, so she''s gone to bed early.@k@|@y@v02/50800283. ............Did something happen?@k @v02/50800284.You all seem incredibly flustered."'
35605: 'Genji@r@v14/51600109."..................Battler-sama, ......that........."'
35606: '@rImmediately, Genji keenly spotted the thing that Battler had just put on his finger...'
35607: 'Hideyoshi@r@v06/51100126."Your eyesight''s pretty good, Genji-san!@k @v06/51100127.......Looks like you know whose ring this is."'
35608: 'Krauss@r@v02/50800285."What...?@k @v02/50800286.What are you talking about......?"'
35609: '@rFrom Krauss''s questioning look, it was very difficult to imagine that he could have been the one who set that letter there......'
35610: '@rFurthermore, his expression quickly changed into one of shock.'
35611: 'Eva@r@v05/51000174."Eheheheheh!!@k @v05/51000175.That''s right, it''s the ring of the Ushiromiya family head!!"'
35612: '@rThe family conference took up this new topic,@k ......and the storm came once again.........'
35613: '@rThe rain was still pouring down as hard as ever.'
35614: '@r......This weather was supposed to continue all day tomorrow as well, which was making me feel a bit depressed.'
35615: '@r......Oh wait...given the time, that''s today, not tomorrow...@k@rBut that doesn''t really matter now.'
35616: '@r.........I''m sleepy...'
35617: '@rWith half-asleep eyes, I opened my umbrella.@k@rThe large drops of rain pounded against it mercilessly.........'
35618: '@rTechnically, they had called an end to the family conference at 1 a.m.,@k but the post-match scuffles were still dragging on.'
35619: '@rI was really jealous of Auntie Rosa, who managed to slip out of there at that time.'
35620: '@rShe cleverly got away by saying that she''d check on Maria, who might have been staying up too late.'
35621: '@rThanks to Dad constantly involving me, I missed my chance to escape,@k ...and they made me stick around until now, ......3 a.m....'
35622: '@rWhat on Earth did they spend all that time deciding...?'
35623: '@rNothing got decided at all.'
35624: '@r......They just kept on arguing about who said what, like elementary school kids.'
35625: '@r......They must be tired too.'
35626: '@rI''m sure that''s why they keep dragging on with the same pointless questions.'
35627: '@rI no longer felt any shock or anger towards them.@k@rI guess no painkiller works better than drowsiness...'
35628: '@r......I left them behind and finally returned to the guesthouse.'
35629: '@rWhen I returned to the guesthouse, the lights were on in the lounge downstairs.'
35630: '@rNot only that, I could even hear people chatting inside......@k@rApparently, some people were still awake even at this time of night.'
35631: '@rDespite the late hour, Gohda-san and Doctor Nanjo were still awake and chatting.'
35632: '@rPlates and cups were lined up on the counter,@k and it looked almost like a bar with Gohda-san as the bartender.'
35633: '@rAfter noticing I''d come back, it looked as though Doctor Nanjo finally realized how late it was.'
35634: '@rAs Gohda-san made to top off his glass, he declined with an exaggerated gesture.'
35635: 'Nanjo@r@v19/51900030."No, that''s enough, that''s enough.@k@v19/51900031. ......It''s already too late to be up."'
35636: 'Gohda@r@v17/51700020."Look how late it''s gotten...@k@v17/51700021. You were such a good person to chat with, I hardly noticed."'
35637: 'Nanjo@r@v19/51900032."No, no, it was your skill at entertaining that made the difference.@k@v19/51900033. We''ll have to do this again sometime."'
35638: 'Gohda@r@v17/51700022."Yes, gladly!@k @|@y@v17/51700023.Battler-sama, welcome back.@k@v17/51700024. Is the discussion with Krauss-sama and the others still continuing?"'
35639: 'Battler@r@v10/50100714."......The way things were going, they''ll probably drag it all the way out until dawn.@k@v10/50100715. None of my business..."'
35640: '@rI spoke carelessly, with a big yawn.'
35641: 'Erika@r@v46/54500216.".........You all have more stamina than I expected.@k@v46/54500217. It''s quite a surprise."'
35642: 'Battler@r@v10/50100716."Oh, ......so you''re here too..."'
35643: 'Erika@r@v46/54500218."......Yes, a humble little night gathering had begun to form quite naturally here,@k@v46/54500219. so I took it upon myself to join.@k@v46/54500220. .........Don''t worry, I haven''t said a word about you-know-what."'
35644: 'Battler@r@v10/50100717."..........................."'
35645: '@rErika could be seen on the sofa.'
35646: '@rShe had taken her shoes off and was lounging around as though she owned the place.'
35647: 'Gohda@r@v17/51700025."And you too, Erika-sama—you are very knowledgeable on a variety of subjects.@k@v17/51700026. I enjoyed listening to you immensely."'
35648: 'Nanjo@r@v19/51900034."Your knowledge truly is extensive.@k@v19/51900035. Very impressive for one so young..."'
35649: 'Erika@r@v46/54500221.".........You''re very welcome.@k@v46/54500222. It''s merely the trivial knowledge of Furudo Erika."'
35650: '@rErika posed by picking up the hem of her skirt.'
35651: '@rShe was lounging on the sofa with her feet up, so it didn''t look remotely elegant.'
35652: 'Battler@r@v10/50100718."......Where''s Auntie Rosa?"'
35653: 'Gohda@r@v17/51700027."She returned around 1 a.m., but she went straight upstairs to sleep."'
35654: '@rThat was probably the right choice...@k@rShe''d been going along with that conference for so long.'
35655: '@rI feel like flopping down in bed right away myself.'
35656: '@r......I''ve had it.@k@rI''m tired enough that I might flop over right here...'
35657: 'Nanjo@r@v19/51900036.".........Well then, let''s call it a night.@k@v19/51900037. Don''t you have to get up early tomorrow morning to make breakfast, Gohda-san?"'
35658: 'Gohda@r@v17/51700028."Preparations for breakfast have already been made.@k@v17/51700029. As always, I have full confidence that you will enjoy it greatly, so please look forward to it."'
35659: '@rIn Gohda-san''s eyes, the family conference is an open stage on which to display his culinary skills.@k@rHe''s probably so pumped up he won''t even get sleepy.'
