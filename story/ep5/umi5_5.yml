34599: '@rBut that''s only if we assume Grandfather was the one to create it.'
34600: '@rHe was probably alive at the time the epitaph was displayed,@k but of course, ......he''s already dead by 1986.'
34601: '@rAnd, in the games up until now, BEATRICE threatened us repeatedly with letters,@k saying that the only way to survive was to solve the epitaph, and trying to force us to solve the riddle.'
34602: '@rIn other words, ......it was BEATRICE''s intention, ...her hope......that we would try solving the riddle of the epitaph.'
34603: '@rThe epitaph is so confusing that, in most cases,@k the relatives never seriously tried solving it until the threatening letters started to arrive.'
34604: '@rThat''s why BEATRICE fired the starting pistol which made us take a go at it.'
34605: '@r.................................'
34606: '@r.........Why is BEATRICE carrying out Grandfather''s last wishes......?'
34607: '@rLike the theory proposed in the first game, ......is she really Grandfather''s confidant,@k following his orders even after his death and trying to select the successor with the riddle of the epitaph in his stead...?'
34608: '@rThat would mean that BEATRICE really is Grandfather''s trusted underling,@k and exactly the family alchemist she called herself in that letter...'
34609: '@rAfter Grandfather''s death, BEATRICE would have managed the ten tons of gold and taken the title of alchemist.'
34610: '@r......Without ever embezzling the gold,@k she entrusted it all to the epitaph''s riddle, and waited for a human fitting to be the successor to appear and solve it......'
34611: '@rAnd if that human didn''t appear within a set time limit,@k ......that meant game over?'
34612: '@rCertainly, when Auntie Eva solved the riddle in the third game,@k she became the only survivor and, automatically, the final head of the Ushiromiya family, inheriting everything.'
34613: '@rUp to this moment, no one has ever survived past October 5th except Auntie Eva, the one who solved the epitaph......'
34614: '@rThat was the only case where BEATRICE let anyone survive......'
34615: '@r.................................'
34616: '@rIs BEATRICE''s loyalty to Grandfather......the thing that drives her.........?'
34617: '@rDid Grandfather give her some terrible order to kill everyone if the epitaph isn''t solved,@k and she''s so loyal that she faithfully carries that out......?'
34618: '@r........................'
34619: '@r......I must not stop thinking.@k ...Don''t......stop thinking......'
34620: '@rDon''t just think of the riddle itself......think about why it''s significant.'
34621: '@r.................................'
34622: '@rWhy is BEATRICE telling us to solve the epitaph......?'
34623: '@rWhy did she create such a confusing epitaph for us......?'
34624: '@r......If BEATRICE makes us try and solve this epitaph that we have no real chance of solving,@k .........and by some lucky chance, a "miracle" occurs and someone is able to solve it......@k......what significance does that have to her.........?'
34625: '@rI don''t know......what this miracle would be worth to Beato.'
34626: 'Battler@r@v10/50100402."Anyway, ......until we figure out the first twilight, we''ll have to give up on the rest."'
34627: '@rWe tried looking at it from several different angles, but in the end, we got stuck there and made no further advances.'
34628: 'Maria@r@v13/50400033."Mmph, ...fwaaaaaaaaaaahhhhhh......"'
34629: '@rMaria let out an extra-large yawn.'
34630: '@rThis caused several other people to yawn.@k@r...We had been using our heads so much that everyone had gotten a little sleepy.'
34631: '@rJessica, who had been silent and looking displeased the whole time, quickly stood up.'
34632: 'Jessica@r@v04/50200032."......I''m going upstairs with Maria.@k@v04/50200033. We''ll watch TV or something."'
34633: 'George@r@v07/50300024."All right...@k@v07/50300025. I''ll go up too.@k@v07/50300026. Hey, why don''t we all play cards upstairs?"'
34634: '@rWhen George proposed this, Maria completely forgot about that big yawn of hers and started jumping around, insisting that she wanted to play cards.'
34635: '@rJudging by the clock, it would soon be ten at night.'
34636: '@rIt was already about that time you normally take a bath and get ready for sleep.'
34637: '@rEven the adults seemed pretty weary from traveling.'
34638: '@rWe decided to continue this later and went our separate ways...'
34639: 'George@r@v07/50300027."Will you play with us too, Erika-chan?@k @v07/50300028.Cards?"'
34640: 'Erika@r@v46/54500101.".........I appreciate the sentiment.@k@v46/54500102. I overstepped my bounds a little, forgetting that I''m a simple guest.@k@v46/54500103. I''d like to take it easy and rest for the night.@k@v46/54500104. .........I''d almost forgotten that I was just in an accident."'
34641: 'Rudolf@r@v08/51200068."Seriously.@k@v08/51200069. You''re in such high spirits it''s hard to believe you almost drowned."'
34642: 'Eva@r@v05/51000081."*giggle*.@k@v05/51000082. That''s youth for you.@k@v05/51000083. Still, I enjoyed it.@k@v05/51000084. I think we''ve taken a big step in our reasoning thanks to you.@k@v05/51000085. If I find the gold, I''ll let you have about a million yen''s worth."'
34643: 'Hideyoshi@r@v06/51100065."Wahahaha!@k@v06/51100066. Can''t you at least offer the poor girl a hundred million!@k@v06/51100067. Uhahaha!"'
34644: 'Erika@r@v46/54500105."There''s really no need.@k@v46/54500106. I''m only interested in solving the riddle.@k@v46/54500107. ......Well then, if you''ll excuse me.@k@v46/54500108. ......Good night."'
34645: 'Battler@r@v10/50100403."Yeah, ''night."'
34646: 'Rosa@r@v12/51400042."Oh, you aren''t going upstairs, Battler-kun?"'
34647: 'Battler@r@v10/50100404."......I''m getting a bit interested here.@k@v10/50100405. I''ll think things through here just a bit longer.@k@|@y@v10/50100406. If I can just figure out the list of characters that marks the first twilight, I''ll bet the road before me will open up all at once..."'
34648: '@rEveryone went up to the second floor one by one.'
34649: '@rOnly Auntie Rosa remained behind, cleaning up the coffee cups everyone had been drinking out of.'
34650: '@rKyrie-san and some others had offered to help,@k but since Auntie Rosa had refused this, she was washing them all alone.'
34651: '@rSince I''d just been treated to such delicious coffee, I decided to help too.'
34652: '@r......I wasn''t just doing it because I felt obligated.@k@rI wanted to keep discussing the epitaph with someone.'
34653: 'Battler@r@v10/50100407.".........The first twilight...the first twilight.@k@v10/50100408. ......Gah.@k@|@y@v10/50100409. Auntie Rosa, have you thought of some list of characters or a word?"'
34654: 'Rosa@r@v12/51400043."Nope...@k@v12/51400044. I don''t have a clue.@k@v12/51400045. .........But instead of the first twilight, it''s the tenth twilight that bugs me."'
34655: 'Battler@r@v10/50100410."The tenth twilight...?@k @v10/50100411.What about it?"'
34656: 'Rosa@r@v12/51400046."Well,@k@v12/51400047. .........the word @bGolden Land.@<黄金郷@> appears several times, right?"'
34657: 'Battler@r@v10/50100412."Yes, it does."'
34658: 'Rosa@r@v12/51400048."For some reason......on the tenth twilight alone, when the journey ends, it says we reach the @bHome of the Gold.@<黄金の郷@>, read "ougon no kyou"—no, sorry, "ougon no sato".@k@v12/51400049. The @bHome.@<郷@> kanji is separated out.@k@v12/51400050. I can''t help but wonder why this is the one place where it''s written like that."'
34659: 'Battler@r@v10/50100413."............You''re right.@k@v10/50100414. ...No mistake.@k@v10/50100415. Everywhere else, it says @bGolden Land.@<黄金郷@>..."'
34660: '@rEven though all the rest are written "Golden Land", the tenth twilight is the only one where it''s different,@k and "Home of the Gold" is written instead...'
34661: '@rI wonder if the word @bHome.@<郷@> has some kind of special meaning.........'
34662: '@r...........................'
34663: 'Rosa@r@v12/51400051."Still, ......you and that Erika-chan girl are incredible.@k@v12/51400052. The way you think really is flexible.@k@v12/51400053. ...I''m already an old lady, and my mind just doesn''t work that fast.@k@v12/51400054. That theory about the six chosen by the key signifying six characters to be removed was very impressive."'
34664: 'Rosa@r@v12/51400055."After hearing that, I can''t see it as being any other way,@k@v12/51400056. but before then, I didn''t think it was like that at all...@k@v12/51400057. It''s frustrating how thickheaded I am."'
34665: 'Battler@r@v10/50100416."That''s not true.@k@v10/50100417. You have a very flexible mind, Auntie Rosa.@k@v10/50100418. That "Home" discovery might be really important somewhere down the line."'
34666: 'Rosa@r@v12/51400058."Not at all. My mind''s very stiff.@k@v12/51400059. ......Until a few moments ago, I was thinking of the first twilight as a place, one-tenth of the way to the Golden Land."'
34667: 'Battler@r@v10/50100419."......What''s that?@k@v10/50100420. Sounds interesting. Mind telling me about it?"'
34668: 'Rosa@r@v12/51400060."*giggle*.@k@|@y@v12/51400061. ......After all, in the line before the first twilight, it says "you must journey to the Golden Land", right?@k @v12/51400062.The next part describes a journey that lasts ten days, so I thought the first twilight would be part of the way through that journey."'
34669: 'Battler@r@v10/50100421."......A journey...@k@v10/50100422. .........I see.@k@v10/50100423. .................."'
34670: 'Rosa@r@v12/51400063."So, you start the journey, and then on the first twilight you set up camp and sacrifice the six.@k@v12/51400064. ......So I thought, where is that place?@k@v12/51400065. How many kilometers from the starting point...?@k @v12/51400066.Things like that...@k@v12/51400067. Don''t tell anyone this, okay?@k @v12/51400068.I''m not very clever, so for a long time I read the @bHome.@<郷@> kanji as "kyou" when it''s probably "sato"."'
34671: 'Rosa@r@v12/51400069."......And "kyou" reminds you of @bKyoto.@<京都@>, right? It''s often shortened to @bkyou.@<京@>.@k @v12/51400070.So I thought the ten-day trip might be between Father''s home and Kyoto, and there might be something hidden one-tenth of the way there..."'
34672: 'Battler@r@v10/50100424."Are you kidding? That''s a brilliant idea.@k@|@y@v10/50100425. .........The first twilight as the first stop on a ten-day journey...@k@v10/50100426. ......The name of that place might be the key......"'
34673: 'Rosa@r@v12/51400071."For my ten-day theory to work, you''d have to know both the start point and the end point.@k@v12/51400072. ......I know the start point.@k@v12/51400073. I know the home Father would call beloved.@k@v12/51400074. Father really did spend his youth a long way away."'
34674: 'Rosa@r@v12/51400075."......But the problem is the goal...the Golden Land.@k@v12/51400076. What does that really mean?@k@v12/51400077. ......If we don''t know that, my theory gets us nowhere.@k@v12/51400078. I''ve been stuck at this spot for a long time,@k@v12/51400079. but after listening to your reasoning today, I''ve realized what an embarrassing mistake I''ve been making."'
34675: 'Battler@r@v10/50100427.".........No, ...I think that''s still an interesting idea.@k@|@y@v10/50100428. ........................@k@v10/50100429. A start and a goal, a ten-day journey.@k@v10/50100430. ...And the place reached at the very first twilight......"'
34676: 'Rosa@r@v12/51400080."Believe it or not, I think you might solve this one easily, Battler-kun.@k@v12/51400081. ......If you do solve it with your auntie''s hint, share a little with me, okay? Even 5% would be great.@k@v12/51400082. Promise me♪"'
34677: '@rShe gave me a wink and a smile which almost made my heart jump a little, even though she was my aunt.'
34678: '@rAs I helped her wash the coffee cups,@k ......I kept pondering the epitaph''s riddle silently.........'
34679: '@r......After I finished helping Auntie Rosa and went into the corridor on my way to the bathroom,@k I saw Erika unlocking the door to a room on the way there.'
34680: 'Battler@r@v10/50100431."......Your room is on the second floor, right?@k @v10/50100432.I was sure you''d gone upstairs and fallen asleep by now."'
34681: 'Erika@r@v46/54500109."............I was just searching for something.@k@v46/54500110. ......I thought it might be here."'
34682: 'Battler@r@v10/50100433."Searching for something......?"'
34683: '@rErika unlocked the door and opened it.@k@rA dusty smell drifted out...'
34684: '@rIt was the archive.'
34685: '@rThe distance between the bookshelves was too small for this to be called a library room.'
34686: '@rThis was obviously a room made for storing books, not reading them.'
34687: 'Battler@r@v10/50100434."......So you''re searching for a book?"'
34688: 'Erika@r@v46/54500111."Not necessarily a book, ......but, well, reference material.@k@v46/54500112. There''s something I simply have to look up."'
34689: 'Battler@r@v10/50100435."...............You''re looking for something having to do with the epitaph''s riddle...?@k @v10/50100436.Pretty admirable that you haven''t given up yet.@k@v10/50100437. I guess 20 billion yen is pretty enticing."'
34690: '@rI hadn''t given up either.@k@rApparently, we were both bad at giving up......'
34691: 'Erika@r@v46/54500113."You''re joking.@k@v46/54500114. ......I''m only interested in riddle-solving.@k@v46/54500115. I''m only looking for the gold because I want proof that my reasoning was correct.@k@v46/54500116. Even if I found it, I wouldn''t pocket it for myself, so don''t worry."'
34692: '@r......She immediately dismissed the idea, saying that she just liked solving riddles and had no interest at all in the gold.'
34693: '@rMy first impression of her had been that she was a bit of a weird one, and it looked like I hadn''t been wrong.'
34694: '@rErika started searching for the book she was after, slowly going around the bookshelves...'
34695: 'Battler@r@v10/50100438."I''m also in the middle of trying to solve the epitaph.@k@v10/50100439. .........Oh yeah, just a second ago, I heard something interesting from Auntie Rosa which might be a hint about the first twilight."'
34696: 'Erika@r@v46/54500117."............May I ask what it was?"'
34697: '@rErika asked this without stopping her search or even turning to face me.'
34698: 'Battler@r@v10/50100440."In the line before the first twilight, it says something like whoever obtains the key must do so and so, right?"'
34699: 'Erika@r@v46/54500118.".........You who laid hand upon the key must journey as follows to the Golden Land."'
34700: 'Battler@r@v10/50100441."Whoa...@k@v10/50100442. You''ve already got it memorized?@k@v10/50100443. Guess I shouldn''t be surprised..."'
34701: 'Erika@r@v46/54500119."And what about that line?"'
34702: 'Battler@r@v10/50100444."......Right.@k@v10/50100445. "Must journey to the Golden Land", it says.@k @v10/50100446.Apparently, this made Aunt Rosa picture setting off on a journey from the beloved home of old to the Golden Land, a journey lasting until the tenth twilight,@k@v10/50100447. or in other words, ten days."'
34703: 'Erika@r@v46/54500120."Actually, I already noticed that myself.@k@v46/54500121. The place you reach on the first day of the ten-day journey.@k@v46/54500122. ......That''s where you offer the sacrifices from."'
34704: 'Battler@r@v10/50100448."Y-...yeah, that''s exactly what Aunt Rosa thought of.@k@v10/50100449. I also think it''s an interesting theory.@k@v10/50100450. ......The place you reach on the first day of the ten-day journey.@k@v10/50100451. That bit of land, or else the place''s name, might be the key..."'
34705: 'Erika@r@v46/54500123.".........I have also been speculating that the name of a place might be the key.@k@v46/54500124. That''s why I''m looking for a reference book.@k@v46/54500125. I want to turn this from speculation into certainty."'
34706: 'Battler@r@v10/50100452."What is it.........that you''re looking for?"'
34707: '@rThen, Erika''s hand suddenly stopped, ......and she slowly pulled it out...'
34708: '@rThen, as she dusted it off, she finally looked at me and spoke.'
34709: 'Erika@r@v46/54500126."An atlas."'