34596: 'LAMBDADELTA@r@v29/52200234."Of course.@k@v29/52200235. If I told you that, there''d be too many hints.@k@v29/52200236. .........If a riddle isn''t hard, there''s just no point to it.@k@v29/52200237. ......Uh-oh, that''s a hint too. *giggle*......"'
34597: '@r......This theory about Grandfather creating the epitaph in order to choose a successor isn''t bad at all.'
