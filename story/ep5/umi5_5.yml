34283: '@rErika''s seat was the lowest one in rank.@k In other words, it was at the inferior end of the table.'
34284: '@rSince Kinzo''s seat at the high end of the table was empty,@k if you turned the whole thing around, it sort of looked like Erika was the host of this dinner...'
34285: 'Gohda@r@v17/51700015."Well then, everyone.@k@v17/51700016. I would like to begin tonight''s dinner, if I may."'
34286: '@rAfter Gohda''s announcement, dinner began with the almost customary applause.'
34287: '@rIt was finally the beginning of the dinner orchestra conducted by Toshiro Gohda.'
34288: '@rSitting at such a majestic dinner table was no everyday thing for these people by any means, except for those in Krauss''s immediate family.'
34289: '@rHowever, they were all used to it and acted as though this was completely normal.'
34290: '@r......Again, if anyone was to be surprised, it should have been Erika.'
34291: '@rAnd yet, she showed no surprise at this dinner,@k and acted with composure, blending in with everyone else.'
34292: '@r......There wasn''t even a sliver of the fear one might expect from someone who had wandered here like a lost puppy.'
34293: 'Natsuhi@r@v03/50900398.".........What a mysterious child.@k@v03/50900399. She doesn''t seem the least bit flustered over the Ushiromiya family''s grandest dinner of the year."'
34294: 'Kyrie@r@v09/51300033."Kids these days have nerves of steel.@k@v09/51300034. ...Definitely not something I dislike."'
34295: 'Nanjo@r@v19/51900027."Furudo-san, are you accustomed to meals like this...?@k @v19/51900028.I''m impressed that you look so composed."'
34296: 'Hideyoshi@r@v06/51100044."No kiddin''.@k@v06/51100045. She''s a real pro.@k@v06/51100046. Heck, I still get confused about which fork I''m supposed to use next.@k@|@y@v06/51100047. Yeah...was it this one, or this one...?@k@|@y@v06/51100048. Wahahahahaha!"'
34297: '@rErika had been gracefully eating her hors d''oeuvres, without showing any confusion over the line of utensils in front of her.'
34298: '@rHideyoshi started joking around with her, gripping a fork in each hand.'
34299: '@rOf course, a president of a company in the food service industry like Hideyoshi would obviously know his table manners.'
34300: '@rHowever, thinking that Erika must be nervous over this dinner, he had intentionally spoken with a comic tone of voice.'
34301: 'Erika@r@v46/54500014."............You just have to start on the outside and work your way in.@k@v46/54500015. ......If that''s too much trouble, then just ask for some chopsticks.@k@v46/54500016. ......Any self-respecting Japanese would use chopsticks."'
34302: 'Erika@r@v46/54500017."Chopsticks are wonderful.@k@v46/54500018. Just a single pair, and you can handle any kind of food!"'
34303: '@rAs soon as she began talking about chopsticks, her eyes started glittering.'
34304: '@r......The smile she now showed for the first time was far different from the dignity she had shown before and more like something you''d expect from someone her age.'
34305: 'Kyrie@r@v09/51300035."*giggle*.@k@v09/51300036. But you''d use a spoon for curry and rice at least, wouldn''t you?"'
34306: 'Erika@r@v46/54500019."Simply pour it into a bowl donburi-style.@k@v46/54500020. Is there anyone who eats gyuudon with a spoon?@k @v46/54500021.Of course not.@k@v46/54500022. We Japanese must unwaveringly, unfailingly, unflinchingly use chopsticks!@k @v46/54500023.So, Gohda-san.@k@v46/54500024. If you please, I would like some chopsticks.@k@v46/54500025. I shall show everyone the proud and proper way for a Japanese person to eat!"'
34307: 'Erika@r@v46/54500026."......Incidentally, what is the next dish?"'
34308: 'Gohda@r@v17/51700017."Unfortunately, that would be soup."'
34309: '@rAs she pretended to shrug, Erika winked at everyone.'
34310: '@r@v00/awase5002."""Wahhahahahahahahahahahahahahahaha...!!"""'
34311: '@rOf course, no one was laughing at her.'
34312: '@rShe obviously knew that soup came after hors d''oeuvres in a full course meal.'
34313: '@rFurthermore, Erika had even noticed that she had performed a little too perfectly,@k creating a sense of tension that led Hideyoshi to think that she was nervous herself,@k and that this was why he had tried to break the ice.'
34314: '@rThat was why she''d started behaving a little childish and light-hearted,@k acting out the part of a guest enjoying a harmonious dinner......'
34315: '@rPretty soon, not only Kyrie, but everyone else also caught on.'
34316: '@rEven though she was an uninvited guest, she was apparently worthy of participating in an Ushiromiya family dinner.'
34317: 'Eva@r@v05/51000038."Smart kid.@k@v05/51000039. ......Did she really just come here by coincidence?@k @|@y@v05/51000040.Are we sure she isn''t an illegitimate child of Nii-san''s he secretly invited to today''s family conference?"'
34318: 'Krauss@r@v02/50800197."It seems she''s not only smart, but knows how to brighten the mood too.@k@v02/50800198. And her manners are simply wonderful.@k@v02/50800199. It wouldn''t be bad at all to have this girl as a daughter."'
34319: 'Rudolf@r@v08/51200052."Hihihihi.@k@v08/51200053. That''s pretty cruel.@k@v08/51200054. Where does that leave Jessica-chan?"'
34320: 'Rosa@r@v12/51400028."*giggle*.@k@v12/51400029. That''s mean, Rudolf nii-san."'
34321: 'George@r@v07/50300009."What''s wrong, Jessica-chan?@k@v07/50300010. Headache?"'
34322: 'Jessica@r@v04/50200019."Uuuu...@k@v04/50200020. I can feel my reputation dropping by the minute......"'
34323: 'Battler@r@v10/50100319."C''mon, as the daughter of the head family, you can''t let this stand.@k@v10/50100320. Try fighting back with the table manners and dignity Aunt Natsuhi''s always teaching you."'
34324: 'Maria@r@v13/50400021."Wanna see, wanna see!@k @v13/50400022.Wanna see table manners!@k @v13/50400023.Uu!"'
34325: 'George@r@v07/50300011."Hey, making a fuss is bad manners.@k@v07/50300012. Come on, Jessica-chan.@k@v07/50300013. Show us how it''s done."'
34326: 'Jessica@r@v04/50200021."......S-sure, no sweat..."'
34327: '@rJessica straightened up so much it looked like someone had poked her in the back with a pole.'
34328: '@r......She had good posture, but it somehow lacked elegance.@k@rShe looked...well...kind of like a triangle ruler.'
34329: '@rShe sat at attention with her gaze fixed straight ahead, tried to bring her food to her mouth despite this,@k ......and failed miserably.'
34330: '@rDad, who was sitting next to her, suddenly realized that something was up.'
34331: 'Rudolf@r@v08/51200055."Hm?@k @v08/51200056.What is it, Jessica-chan?@k@v08/51200057. Your stomach hurt??"'
34332: '@rJessica turned bright red.@k ......Ah, sorry, I can''t help myself...'
34333: '@rWe laughed our heads off.@k@rJessica protested, still bright red.@k@rAunt Natsuhi scolded us for not behaving ourselves.'
34334: '@rIn the end, no matter how much we tried to smooth it over, we were who we were.@k@rWe couldn''t act like we were anything else.'
34335: '@rStill, that laughter really did help us to relax.'
34336: '@rWe had been so concerned about the guest getting nervous that we had grown even more nervous ourselves.'
34337: '@rThe lively chatter spread from where we were sitting at the center of the long table to both ends,@k and ultimately, the dinner went even more smoothly than usual...'
34338: '@rWith some delicious cheese and coffee, our peaceful meal came to an end.'
34339: '@rGohda won unanimous acclaim and was praised for his skill by all present......'
34340: '@rAfter a short period of harmony following the meal, it was decided that we would return to the guesthouse.'
34341: '@rNormally, dinner tended to have a very dark atmosphere about it,@k and the adults would often move right on to the family conference with the same dark atmosphere.'
34342: '@rHowever, perhaps because this year''s dinner had been oddly peaceful, everyone decided to take a break, the adults included.'
34343: '@rAfter eating, taking a bath, and relaxing while watching TV,@k I wonder if they''ll gather again in the mansion in the middle of all this rain and resume their high-tension family conference...@k I''d rather not think about that.'
34344: '@rAuntie Eva seemed to get very worked up trying to convince the rest to start the family conference right away, but it didn''t look like many people agreed with her.@k The meeting had probably come to a close for the night.'
34345: '@rSince they had guesthouse duty, Gohda-san and Kumasawa-san were chosen to guide us to the guesthouse.'
34346: '@rIt must be tough for Gohda-san.'
34347: '@rEven after making and cleaning up such an extravagant dinner, he also has the midnight shift at the guesthouse.'
34348: '@rI heard that Kumasawa-san, old as she was, would be going to sleep soon.'
34349: '@rIt seemed that she had been assigned the servants'' quarters in the guesthouse.'
34350: 'Gohda@r@v17/51700018."Please allow me to guide all of you to the guesthouse.@k@v17/51700019. Erika-sama, your room has also been prepared."'
34351: 'Erika@r@v46/54500027."............Thank you very much."'
34352: 'George@r@v07/50300014."Why not rest a bit?@k @v07/50300015.Are you sure you feel alright?"'
34353: 'Battler@r@v10/50100321."...That''s right.@k@v10/50100322. I''d totally forgotten, but you nearly drowned and floated here, didn''t you, Erika-chan?@k@v10/50100323. It''s probably best if you take it easy today and get to bed early."'
34354: 'Erika@r@v46/54500028.".........I''m perfectly fine.@k@v46/54500029. ......On the contrary, I''m so nervous and excited that I doubt I could get to sleep."'
34355: 'Maria@r@v13/50400024."Uu-uu!!@k @v13/50400025.Then let''s play, let''s all play together!@k @v13/50400026.Play cards!"'
34356: '@rMaria latched on to her, giggling.'
34357: '@rThis lack of restraint particular to youth was very much like Maria.@k@r......But for now, we really should be thinking about Erika''s physical condition.'
34358: 'Jessica@r@v04/50200022."Maria, why don''t you play cards with us.@k@v04/50200023. Erika onee-chan says she''s tired."'
34359: 'Erika@r@v46/54500030."......I like cards.@k@v46/54500031. Please let me join you after I''ve had a short rest."'
34360: 'Maria@r@v13/50400027."Uu-uu-uu!! Hooray!!"'
34361: 'Erika@r@v46/54500032."..................Who is that?"'
34362: '@rAs she passed through the lobby of the entrance hall, Erika stopped walking......@k@rWhen we saw what she was looking at, ......the rest of us also stopped.'
34363: 'Kumasawa@r@v18/51800020."......Oh, that is the Golden Witch, BEATRICE-sama."'
34364: 'Erika@r@v46/54500033."............The Golden...@v46/54500034.......Witch."'
34365: 'Rudolf@r@v08/51200058."What''re you doing, brats?@k@v08/51200059. Get your asses in gear, we''re off back to the guesthouse."'
34366: '@rDad, Kyrie-san, Auntie Eva, Uncle Hideyoshi, and Auntie Rosa all came over.'
34367: '@rThe guesthouse party had all gathered.'
34368: '@rHowever, Erika''s gaze was captured by the portrait of the witch, and she simply stared at it for a while......'
34369: 'Rudolf@r@v08/51200060."......Yeah.@k@v08/51200061. Supposedly, Dad has a stash of hidden gold worth 20 billion yen,@k@v08/51200062. and the hiding place for that gold is written of on this epitaph."'
34370: '@rPerhaps because it was too early for them all to disperse into their individual rooms,@k the relatives who had returned to the guesthouse were all gathered downstairs, continuing their chat.'
34371: '@rThe topic......was the witch''s epitaph, which Erika had taken an interest in.'
34372: 'Erika@r@v46/54500035.".........It really is a fascinating riddle.@k@v46/54500036. .........He displayed it in a place where anyone could see it as a challenge to our intellect.@k@|@y@v46/54500037. .........I adore challenges like that."'
34373: 'Battler@r@v10/50100324."Whoa.@k@v10/50100325. I didn''t expect you to be so into this, Erika-chan.@k@v10/50100326. Do you like solving riddles or something?"'
34374: 'Erika@r@v46/54500038."......Well, they''re interesting, don''t you think?@k@v46/54500039. These kinds of challenges.@k@v46/54500040. ............I have no doubt that Kinzo-san intends to use that epitaph to choose his successor."'
34375: '@rWhen she said that, the adults froze,@k ......and slowly turned to face Erika...'
34376: 'Eva@r@v05/51000041."Why.........do you think that...?"'
34377: '@rAuntie Eva spoke with a coaxing voice.'
34378: '@r......Though there had been whisperings between the relatives every now and then that the person who solved the epitaph''s riddle might inherit the family headship,@k ......that had been nothing more than wishful thinking, since such a thing had never been specifically stated.'
34379: '@rAnd yet, though she had only read it once......this outsider had already reached that conclusion.'
34380: '@rHow had she come to it?@k@rNo, .........that wasn''t the problem.@k@r"If you solve the epitaph, you can become the next head".'
34381: '@rShe wanted to establish this not as wishful thinking......but an outright fact.'
34382: '@rSo they closed in around Erika, asking why she was so sure.'
34383: 'Erika@r@v46/54500041.".........It''s somewhat common for extremely rich people to relinquish their wealth to the person who solves a riddle.@k@v46/54500042. ......Furthermore, Kinzo-san didn''t publish this epitaph in a newspaper,@k@v46/54500043. but displayed it within the mansion.@k@v46/54500044. That means the riddle is intended for the people in this mansion."'
34384: 'Battler@r@v10/50100327."You''re right...@k@v10/50100328. .........Since it''s inside the mansion, there''s no way for someone who can''t enter the mansion to solve it.@k@v10/50100329. ...So, that means Grandfather has been challenging the people in this mansion."'
34385: 'Erika@r@v46/54500045.".........<Good>.@k@v46/54500046. Well thought.@k@v46/54500047. Just by the simple fact that the epitaph is inside the mansion, it''s possible to figure out that much."'
34386: '@rAt first, this Furudo Erika girl had seemed to be the fairly silent type,@k ......but apparently, that wasn''t the case.'
34387: '@rWhen she grew excited about being challenged to a game of wits, she became much more talkative than I had imagined.'
34388: 'Hideyoshi@r@v06/51100050."I, I see......@k@v06/51100051. Well, it does make sense that an epitaph inside a mansion would be there so the people in that mansion could read it......"'
34389: 'Rosa@r@v12/51400030."But......can you really be so sure that the one who solves it will be given the headship too?"'
34390: 'Erika@r@v46/54500048.".........If the treasure gained by solving the riddle had been something small,@k@v46/54500049. I would not even have considered it."'
34391: 'Kyrie@r@v09/51300038."That''s right.@k@v09/51300039. The hidden gold is worth 20 billion.@k@v09/51300040. ......You could consider it the wealth of the Ushiromiya family itself."'
34392: 'Erika@r@v46/54500050."............Inheriting that would be tantamount to inheriting the Ushiromiya family itself.@k@v46/54500051. ...In other words, the riddle contained within the epitaph that indicates the hiding place of the gold is nothing less than a way of selecting the practical successor of the Ushiromiya family."'
34393: '@r......The idea that the person who solved the epitaph would be chosen as the next head...@kwas something that had been floating around between a few of the relatives for a while now.'
34394: '@rHowever, since it had never been stated specifically, they had thought of it as nothing more than an optimistic dream.'
34395: '@r......And so they had abandoned all consideration of that aspect and left it as a gray area.'
34396: '@rErika had declared in clear terms that this uncertain part was, in fact, true.'
34397: '@rIf one of the relatives had said it, the others would have thought it to be merely an optimistic dream.'
34398: '@rHowever, when declared by Furudo Erika, a complete outsider,@k those words seemed more credible than they otherwise would have......'
34399: '@rEveryone remained silent for a while, slowly considering what those words implied...'
34400: 'Erika@r@v46/54500052.".........All it takes is the presence of that epitaph,@k@v46/54500053. and a deduction like this becomes trivial for Furudo Erika.@k@|@y@v46/54500054. ......Your thoughts, ladies and gentlemen?"'
34401: 'Jessica@r@v04/50200024."......S-sorry to butt in,@k@v04/50200025. but my father is the successor to the head.@k @v04/50200026.It doesn''t matter who finds the gold,@k@v04/50200027. because just finding it doesn''t make someone the head, right?"'
34402: '@rJessica thought the treasure-hunting part of the epitaph was really fun.'
34403: '@rHowever, she couldn''t help but let her expression grow bitter once they started talking about undermining her father''s position...'
34404: 'Erika@r@v46/54500055."......As far as I can deduce,@k@v46/54500056. Kinzo-san does not seem to wish for Krauss-san to have a smooth transition to inheriting the headship."'
34405: 'Jessica@r@v04/50200028."Wh-why''s that?!!"'
34406: 'Erika@r@v46/54500057.".........Becoming the head of the Ushiromiya family, with all of the vast wealth it entails, would mean gaining a great deal of influence in a political sense.@k@v46/54500058. ......Ordinarily, then, the succession should be rigorously conducted so that no element of doubt is permitted to creep into the equation."'
34407: 'Eva@r@v05/51000042."Th-...that''s right.@k@v05/51000043. ......It happens a lot in those stories about Sengoku period military commanders that my husband loves.@k@v05/51000044. When there are multiple candidates for the successor, it usually results in a family dispute..."'
34408: 'Hideyoshi@r@v06/51100052."...That''s right......@k@v06/51100053. That''s why it''s important to clearly specify a successor, so you can avoid any trouble.@k@v06/51100054. Sometimes, there''s even a purge of all the competin'' successors."'
34409: '@rEven the Sengoku commander Hideyoshi admired, Toyotomi Hideyoshi, made his son-in-law Hidetsugu commit seppuku,@k but it was rumored that he might have done this to make Hideyori, who was his real son and born after Hidetsugu, his true heir.'
34410: '@r......In other words, naming a successor was a way to make it known to the world that a given single, unique person would be acknowledged by everyone as the successor,@k and a way to remove any chance of another person becoming an opposing candidate.'
34411: 'Erika@r@v46/54500059.".........<Good>.@k@v46/54500060. That''s exactly correct.@k@v46/54500061. The only purpose for an epitaph like that would be to cast doubt on Krauss-san''s position as successor to the head.@k@v46/54500062. In other words, if Kinzo-san wished for Krauss-san to become the head without any trouble, he would have no reason to go out of his way to display something so dangerous for all to see."'
34412: 'Kyrie@r@v09/51300041."Yes.@k@|@y@v09/51300042. .........If you flip over the chessboard, you certainly could say that.@k@v09/51300043. It would be odd if he handed over the position of the head normally, but wouldn''t hand over the 20 billion yen in gold except to the person who solved the riddle."'
34413: '@rGiving up the title of head, but only giving the 20 billion yen in gold to the person who solved the epitaph...'
34414: '@r......You really couldn''t call that passing on the headship in the truest sense.'
34415: 'Erika@r@v46/54500063.".........So there you have it.@k@v46/54500064. With this logic, I can cast doubt upon whether Kinzo-san truly acknowledged Krauss-san as his successor.@k@|@y@v46/54500065. ......All it takes is the presence of that epitaph,@k@v46/54500066. and a deduction like this becomes trivial for Furudo Erika."'
34416: 'Erika@r@v46/54500067."......Your thoughts, Jessica-san?"'
34417: 'Jessica@r@v04/50200029."Wh-...what the hell is that?!!@k @v04/50200030.That''s not logic!@k@v04/50200031. That''s bullshit!! You''re just making it all up!!"'
34418: '@rJessica let her emotions lay bare and glared at Erika.'
34419: '@r...Erika, on the other hand,@k looked exceedingly calm with an expression that said "The truth is the truth".'
34420: '@r.........I see.@k It looks like table manners aren''t the only way this Erika girl is fitting for the Ushiromiya family.'
34421: '@r...It seems she really is like the family, ......even in ways that it would''ve been better if she wasn''t...'
34422: 'Battler@r@v10/50100330."Okay, okay... T-take it easy, Jessica...@k@v10/50100331. ......And Erika, let''s leave it at that for now."'
34423: 'Hideyoshi@r@v06/51100055."Well, umm, we can put all this about the successor to the side for now.@k@v06/51100056. Any way you slice it, there''s no doubt that it''s Father''s big question for us.@k@|@y@v06/51100057. ......Wahahaha!@k @v06/51100058.It''s 20 billion yen!@k @v06/51100059.Maria-chan, what would you use it for if you found it?@k @|@y@v06/51100060.Wahahahahahahaha!"'
34424: 'Maria@r@v13/50400014."......Uu.@k@v13/50400029. The Golden Land isn''t just gold.@k@v13/50400030. It''s a sacred place!"'
34425: '@rUncle Hideyoshi persisted with his fake laughter, attempting to force the mood to improve.'
34426: '@rEveryone else tried to go along with him, but Jessica''s mood didn''t get any better.'
34427: 'George@r@v07/50300016."Ha...hahahaha.@k@v07/50300017. So, Erika-chan, would you like to have a go at the epitaph''s riddle?"'
34428: 'Erika@r@v46/54500068."............Yes.@k@v46/54500069. My little gray cells are itching to get started.@k@v46/54500070. So I would like to start solving at once, if I may."'
34429: '@rGeorge-aniki skillfully turned the conversation around.'
34430: '@rJust like the time she had made everyone laugh in the dining hall, Erika looked about with gleeful eyes and jumped at the chance.'
34431: 'Eva@r@v05/51000045."*giggle*giggle*.@k@v05/51000046. I like it.@k@v05/51000047. .........Well, since Erika-chan seems so interested,@k@v05/51000048. let''s all try and solve it together, just like last year."'
34432: 'Rosa@r@v12/51400031."I''ll make some coffee.@k@v12/51400032. Raise your hand if you want some.@k@|@y@v12/51400033. Not for you, Maria!@k @v12/51400034.You won''t be able to sleep...!"'
34433: 'Maria@r@v13/50400031."Uu-uu!!@k @v13/50400032.Wanna drink black coffee!!"'
34434: 'Battler@r@v10/50100332."...................................."'
34435: 'Erika@r@v46/54500071."......Don''t they get you excited?@k @v46/54500072.Riddles like this.@k@v46/54500073. .........I adore them."'
34436: '@rErika said that and smiled...'
34437: '@rEven though she must have known that she''d ticked Jessica off and made the atmosphere sour,@k ......she just smiled nonchalantly...'
34438: 'BERNKASTEL@r@v28/52100260."......See? There''s a mystery you can solve even without waiting for the crime on October 5th."'
34439: 'Battler@r@v10/50100333."........................@k@v10/50100334. ......I did try to solve it a bunch of times.@k@v10/50100335. But—"'
34440: 'BERNKASTEL@r@v28/52100261.".........But you didn''t have a clue, so you gave up and stopped thinking.@k@v28/52100262. ...Right?"'
34441: '@rIt pissed me off, but I didn''t have a good counter for that.'
34442: '@rAfter all, ......I don''t get the epitaph at all.'
34443: '@rI don''t even know what the beloved home of old means, much less the parts about the sweetfish river and the key...'
34444: '@rThinking that a few more hints would show up if I waited,@k ......I kept on waiting, ...and just stopped thinking......'
34445: 'BERNKASTEL@r@v28/52100263.".........Have you figured out an answer on your own?@k @|@y@v28/52100263_b..........Because I''m about to solve it."'
34446: 'Battler@r@v10/50100336."Wh-what......?"'
34447: 'LAMBDADELTA@r@v29/52200200."This is where Bern solved the riddle of the epitaph.@k@v29/52200201. ......I''d expect no less from the Witch of Miracles.@k@v29/52200202. "If a riddle is solvable, she can solve it without fail regardless of the difficulty".@k@|@y@v29/52200203. ......How many years did it take to solve this one?"'
34448: 'BERNKASTEL@r@v28/52100264.".........How rude.@k@v28/52100265. I only fished through a few hundred fragments."'
34449: 'LAMBDADELTA@r@v29/52200204."Heheheheheheheheheheh......@k@v29/52200205. You really are terrifying."'
34450: 'Battler@r@v10/50100337."You better not have cheated by suddenly saying the answer in red or something like that..."'
34451: 'BERNKASTEL@r@v28/52100250.".........Don''t worry.@k@v28/52100267. Just like you, I followed the rules as a player.@k@v28/52100268. ......Well, shall we begin?@k@v28/52100269. .........It''s cramped here.@k@v28/52100270. Why don''t we talk at sea?"'
34452: 'LAMBDADELTA@r@v29/52200206."OK.@k@v29/52200207. ...Don''t get queasy, Battler."'
34453: 'Battler@r@v10/50100338."What do you mean, sea...?@k @|@y@v10/50100339................?!"'
34454: '@rRight after I thought the world had turned pitch black,@w500. ......I was struck by a strange floating sensation.'
34455: '@rIt must have felt like suddenly having the floor drop from under you, sending you into a bottomless pitfall...'
34456: '@rWhen I looked,@w500. ......I saw that the two witches and I...@w666....had been thrown into a pitch black universe.'
34457: '@rThis space was cloaked in endless darkness in every direction, and it felt like an infinite expanse filled with countless glittering objects.'
34458: '@r......Instead of a universe, some people might have likened it to the depths of an ocean where countless glittering fragments drifted.'
34459: 'Battler@r@v10/50100340."Uh, ......wh-whoa................!"'
34460: 'BERNKASTEL@r@v28/52100271."............Didn''t she tell you not to get queasy?"'
34461: 'LAMBDADELTA@r@v29/52200208."If you want the concept of gravity, just create it yourself, okay?@k @v29/52200209.......Come on, calm down and look at us.@k@v29/52200210. ......Come on, don''t we look like we''re just fine?@k @|@y@v29/52200211.......Believe that your feet are on the ground and that you''re being controlled by gravity.@k@v29/52200212. ......If you do that, you''ll find your equilibrium."'
34462: '@rSh-she''s right... The two witches were standing normally, as though their feet were planted on a transparent piece of glass.'
34463: '@rI was the only one floating about like someone in a rapidly plummeting elevator.'
34464: '@r......When I saw that they were just fine, I started calming down, figuring that there was no need to be scared.'
34465: '@rThen, just as LAMBDADELTA said,@k I gritted my teeth and kept telling myself that there was a place to stand here...and that I had to calm down......'
34466: 'Battler@r@v10/50100341."Whoa, whoa............ Ohh..."@|@y'
34467: 'LAMBDADELTA@r@v29/52200213."Very good, very good.@k@v29/52200214. ......What''s your name?"'
34468: 'Battler@r@v10/50100342."Ushiromiya Battler.@k@v10/50100343. ......Who else do I look like?"'
34469: 'LAMBDADELTA@r@v29/52200215."OK.@k@v29/52200216. No matter what, you mustn''t lose your will, emotions, or form.@k@v29/52200217. After all, this is the ocean.@k @v29/52200218.If you lose your purpose, you''ll fall into the depths of eternity and become a scrap of ocean seaweed.@k@v29/52200219. Be careful."'
34470: '@rI didn''t get what LAMBDADELTA was saying, but I tried to calm down for the time being.'
34471: '@rI seemed to be regaining my balance the more I calmed down.'
34472: '@rGradually, that weird floating feeling, like I was falling forever, began to disappear.'
34473: '@r......It still felt strange, like struggling to stand upright at the bottom of a deep pool, but it was much better than before.'
34474: 'BERNKASTEL@r@v28/52100272.".........Then let''s begin.@k@v28/52100273. .........I''ll weave a fragment for solving the riddle of the epitaph......"'
34475: '@rBERNKASTEL opened both of her hands.'
34476: '@rThen, like a planetarium...@k......all of the fragments throughout this empty space began to spin, leaving tails behind them...'
34477: '@rThe expression "planetarium" might have been even more fitting than I thought...'
34478: '@r......Multiple fragments were tied together by gold lines,@k and what looked like constellations zoomed by us rapidly, one after another.'
34479: '@rIt felt almost as though we were dashing through space at an incredible speed...'
34480: '@rThen, with tails of light drifting behind them,@k ......several brightly glowing fragments swirled around BERNKASTEL.'
34481: '@rIt looked almost like she had created her own solar system with her as the sun.'
34482: '@rThat solar system surrounding BERNKASTEL grew to a radius large enough to swallow us up.'
34483: '@rAnd every once in a while, one of the satellite fragments zoomed right past me.'
34484: '@rWhen those fragments passed right by me,@k ......it felt as though some kind of memory welled up inside me.'
34485: '@rI could feel it in my gut.'
34486: '@r......These fragments were probably like crystals of memories.'
34487: 'LAMBDADELTA@r@v29/52200220."They aren''t memories.@k@v29/52200221. They''re fragments of worlds.@k@v29/52200222. ......Well, I guess they might feel like memories to you."'
34488: 'BERNKASTEL@r@v28/52100274."............Then let''s begin.@k@v28/52100275. ...Let''s start with this fragment."'
34489: '@rOne of the satellites in this solar system was slowly sucked in towards BERNKASTEL as its orbit around her decayed.'
34490: '@rIt drew a spiral as it approached her, and came to rest on the palm of her outstretched hand...'
34491: '@rThen, it shone brightly, painting over the world with pure white......'
34492: '@r@v34/53300001."...The "beloved home of old" definitely won''t betray our expectations.@k@v34/53300002. ......The only past that Father held dear was his years as a boy."'
34493: 'Battler@r@v10/50100344.".........I remember that.@k@v10/50100345. ...This is when, in the third game, Auntie Eva was just about to solve the riddle of the epitaph, and was thinking it over with this witch inside her or whatever."'
34494: 'BERNKASTEL@r@v28/52100276."............That''s right.@k@v28/52100277. And, from these thoughts, she made her way to the correct answer.@k@v28/52100278. In other words, this fragment shows a vital hint for reaching the truth.@k@v28/52100279. .........In other words, it means that this theory is not mistaken."'
34495: 'Battler@r@v10/50100346."So, ......you''re saying we should assume this beloved home of old isn''t a metaphor or anything like that...@k@v10/50100347.but the place Grandfather actually spent his youth?"'
34496: 'BERNKASTEL@r@v28/52100280.".........That''s right.@k@v28/52100281. And at the very least, it isn''t Odawara."'
34497: 'Eva@r@v05/51000049.".........Odawara is definitely where he was born, but I don''t think this home Father loved was Odawara.@k@v05/51000050. I believe all of us siblings are thinking of the same place."'
34498: 'Rosa@r@v12/51400035."...Yes.@k@v12/51400036. This probably isn''t Odawara.@k@v12/51400037. From what I''ve heard, he had a very fun time as a youth."'
34499: 'Battler@r@v10/50100348."That''s right......@k@v10/50100349. ......Auntie Eva and her siblings said that it wasn''t Odawara.@k@v10/50100350. ......And not only that, it looks like everyone had a good idea where Grandfather''s home was."'
34500: 'BERNKASTEL@r@v28/52100282."......Right.@k@v28/52100283. And annoyingly, the actual location isn''t spoken of in any of the fragments."'
34501: 'LAMBDADELTA@r@v29/52200223."Of course.@k@v29/52200224. If I told you that, there''d be too many hints.@k@v29/52200225. .........If a riddle isn''t hard, there''s just no point to it.@k@|@y@v29/52200226. ......Uh-oh,@k@v29/52200227. that''s a hint too.@k@v29/52200228. *giggle*......"'
34502: 'Battler@r@v10/50100351."........................@k@v10/50100352. ......Just where is this home of Grandfather''s?@k@v10/50100353. ...We can''t even start if we don''t know that..."'
34503: 'BERNKASTEL@r@v28/52100284."You mean you couldn''t start, so you stopped thinking?@k @v28/52100285.......Since it had to be a place where he could have lived, the number of possibilities is limited.@k@|@y@v28/52100286. .........Well, this is the toughest part."'
34504: 'Battler@r@v10/50100354.".........You were the witch who could "certainly solve any riddle that can be solved", weren''t you?@k@|@y@v10/50100355. ......So you took those limited possibilities,@k@v10/50100356. ...in other words, everywhere on the earth, and considered every single piece of land that Grandfather might have lived on?"'
34505: 'BERNKASTEL@r@v28/52100287."............That would work too, but that way, no amount of time would be enough.@k@v28/52100288. So, I needed to take some more hints into consideration to wring out the answer."'
34506: '@r@v34/53300003."......Didn''t you say it yourself?@k@v34/53300004. You said it didn''t have to be a river with water flowing down it.@k@v34/53300005. ......If the word sweetfish is too complicated, why not forget it forever...?"'
34507: '@r@v34/53300006."Think of a river.@k@v34/53300007. A river.@k@v34/53300008. Linking it with a "family tree" wasn''t a bad idea.@k@v34/53300009. Try thinking about how to link a river with something else along those lines......"'
34508: 'BERNKASTEL@r@v28/52100289.".........A sweetfish river running through his home of old.@k@v28/52100290. However, this river isn''t truly a river.@k@v28/52100291. ......Eva thought of something else, something that could be linked with a river."'
34509: 'Battler@r@v10/50100357."Sure......@k@v10/50100358. But if it isn''t a river, then why the sweetfish...?@k@v10/50100359. ....................."'
34510: 'BERNKASTEL@r@v28/52100292.".........Think.@k@v28/52100293. A river that runs through the home of old.@k@v28/52100294. ......But it isn''t a river with water running down it.@k@v28/52100295. Something that can be likened to a river........."'
34511: 'Battler@r@v10/50100360."..........................."'
34512: 'BERNKASTEL@r@v28/52100296.".........Behold the sweetfish river, running through my beloved home of old.@k@v28/52100297. ......Eva knew where his old home was, so she ignored the sweetfish hint.@k@v28/52100298. ......However, since we don''t know where it is, this could be a hint for us."'
34513: 'Rosa@r@v12/51400038.".........I racked my brains too much over the sweetfish river.@k@v12/51400039. The sweetfish part didn''t really matter that much at all, did it?"'
34514: 'Eva@r@v05/51000051."That isn''t true.@k@v05/51000052. It was an excellent hint, if you ask me.@k@v05/51000053. Well, of course, maybe there was no need for it to be sweetfish."'
34515: 'Battler@r@v10/50100361."............What are these "sweetfish"...?@k@v10/50100362. ......If the river isn''t a literal river, then of course, "sweetfish" probably doesn''t mean the kind of fish that swims."'
34516: 'LAMBDADELTA@r@v29/52200229."Yeah.@k@v29/52200230. And on top of that, Rosa tossed it aside, saying that sweetfish weren''t that significant."'
34517: 'BERNKASTEL@r@v28/52100299.".........And on the other hand, Eva said that it wasn''t important for them to be sweetfish, but that it was still an excellent hint.@k@v28/52100300. .........In other words, the "sweetfish" is a key to make you think of something else.@k@v28/52100301. If that something is a different word, but a word that sweetfish makes you think of, then Eva''s line about how it "probably didn''t have to be sweetfish" makes sense..."'
34518: 'Battler@r@v10/50100363."...................................."'
34519: '@rFrom these thoughts, Auntie Eva formed some theory,@k ......went to the archive, looked through some kind of book, and verified that she was right.'
34520: '@rIn short, Auntie Eva formed some theory about the true nature of this sweetfish river running through his home of old.'
34521: '@rThen, ......she opened a certain book to determine whether that theory was correct or not.'
34522: '@rIn other words, this theory was something that could be verified through some kind of book...'
34523: '@rAlso, after she figured out what the sweetfish river was, she figured out the rest of the riddle very quickly......'
34524: 'BERNKASTEL@r@v28/52100302.".........Good thinking.@k@v28/52100303. ......The epitaph continues on, saying "as you travel down it, you will see a village".@k@v28/52100304. At that point in time, Eva hadn''t yet solved the three lines starting with this one."'
34525: 'Eva@r@v05/51000054."......What is village?@k @v05/51000055.What does it mean?!@k @v05/51000056.Is there a village if you go down this "river"......?!@k @v05/51000057.............ah, .........aaaaaaaahhh......!!"@|@y'
34526: '@rAll those pieces that I hadn''t been able to understand at all were...@w500....right before my eyes, starting to...@w416....snap,@w500. snap into place, all by themselves......'
34527: '@rI couldn''t even remember to close my open mouth.@k@r...My throat grew completely dry...'
34528: '@rIs it......really alright for this to be the answer?@k@rR-really?@k Really...?!'
34529: 'Battler@r@v10/50100364."...So...@k@v10/50100365.if we figure out what the "sweetfish river running through my beloved home of old" is,@k@v10/50100366. ......that leads us directly to understanding the "as you travel down it, you will see a village" stuff, ......and then we get the key to the Golden Land."'
34530: 'BERNKASTEL@r@v28/52100305."............Correct.@k@v28/52100306. And we know that because even Eva didn''t know what the village meant until she checked the book."'
34531: 'Battler@r@v10/50100367."Dammit...@k@v10/50100368. ......Just what is this book...?!"'
34532: 'Eva@r@v05/51000058."...But this isn''t six characters at all.@k@v05/51000059. ......I''m absolutely sure that this is the answer, but this doesn''t reach six characters at all...!"'
34533: '@r@v34/33300121e.Did you stop thinking again?@k @v34/33300121_1e.In that case, think of a way you could read it with six characters.'
34534: '@r@v34/33300122e.If you can''t think of one, then research it.@k@v34/33300123e. ......There has to be an answer.@k@r@v34/33300123_1e. You must not doubt that.'
34535: '@r@v34/33300124e.If you can''t believe that, why don''t you cry yourself to sleep, and then just give up and die forever...?'
34536: 'Eva@r@v05/51000060."............One,@v05/51000061. two,@v05/51000062. three,@v05/51000063. four,@v05/51000064. five,@v05/51000065. six..."'
34537: 'Eva@r@v05/51000066."......Oooh,@v05/51000067. ...s-@v05/51000068.......@v05/51000069.@|@ysix characters...@k@v05/51000070. ......I,@v05/51000071. ......I found it.@k@v05/51000072. ...This is...@v05/51000073.......the Golden Land''s...@v05/51000074.k-@v05/51000075.@|@y ......key.........!!"'
34538: 'BERNKASTEL@r@v28/52100307."............Then, Eva found the key to the Golden Land."'
34539: 'Battler@r@v10/50100369."Yeah.@k@v10/50100370. And this key...@k@v10/50100371....was some kind of word, number, or string of characters...six characters long!"'
34540: 'BERNKASTEL@r@v28/52100308.".........That''s it.@k@v28/52100309. If we know that the key''s true identity is six characters, the meaning of the first twilight changes drastically."'
34541: 'Battler@r@v10/50100372."O-...on the first twilight, sacrifice the six chosen by the key...@k@v10/50100373. ......The six...chosen by the key...@k@|@y@v10/50100374. .........Six characters......!"'
34542: '@rIn other words, ......it means "on the first twilight, sacrifice the six characters chosen by the key"...!'
34543: 'Kyrie@r@v09/51300044."This key points towards a certain specific group of six people.@k@v09/51300045. ......No, we should say it points to a certain specific group of six things.@k@v09/51300046. ......If this doesn''t mean a literal command to offer sacrifices.@k@v09/51300047. ......For example, it could be an anagram."'
34544: 'Krauss@r@v02/50800200."An anagram?@k @v02/50800201.Do you mean a word game...?"'
34545: '@rThat''s right, Kyrie-san theorized this already way back then...!'
34546: 'Kyrie@r@v09/51300048."...On the second twilight, it says "those who remain".@k@v09/51300049. ......Which means that, at the very least, that "something" has a finite number of characters.@k@v09/51300050. You could read it like it''s telling you to continue with the remaining characters after the six characters are removed."'
34547: 'Battler@r@v10/50100375."In other words, on the first twilight, we take a list of characters that''s longer than six,@k@v10/50100376. "kill" the six that are the key,@k@v10/50100377. and then do something with the characters that remain...!"'
34548: 'BERNKASTEL@r@v28/52100310."............That''s right.@k@v28/52100311. But, like Kyrie said,@k@v28/52100312. what should we kill the characters from?@k@v28/52100313. ......We don''t know this longer string of characters that we''re supposed to be killing from."'
34549: '@rOn the first twilight, kill the six characters that are the key.@k@r.....................On the first twilight.'
34550: 'Battler@r@v10/50100378."......In other words, ...by the time we reach the first twilight, some string of characters already exists?@k @|@y@v10/50100379.But @bthe first twilight.@<第一の晩@> only has four characters.@k@v10/50100380. Are we meant to read it differently?@k @v10/50100381.If we read it in English like Grandfather would, maybe ''the first twilight''? Or...something else like...@k @v10/50100382.first night...?@k @v10/50100383............."'
34551: 'Erika@r@v46/54500074.".........<Good>.@k@v46/54500075. That idea of yours is quite insightful, Battler-san.@k@v46/54500076. ......We can interpret the six sacrifices chosen by the key as a string of six characters.@k@v46/54500077. I think that''s a clever way of thinking outside the box.@k@v46/54500078. After all, key-shaped objects are not the only types of keys."'
34552: 'Kyrie@r@v09/51300051."I also thought of the possibility that it''s an anagram."'
34553: 'Rudolf@r@v08/51200063."......Come to think of it, you did say something like that before.@k@v08/51200064. But in that case, what do we remove the six characters from?"'
34554: 'Eva@r@v05/51000076."That''s right.@k@v05/51000077. ......Since we''re removing six characters from it, whatever it is must be at least six characters long.@k@v05/51000078. How could we read it in a way that gives us more than six characters...?"'
34555: 'Rosa@r@v12/51400040."If we follow Father''s sensibilities...I guess it probably is English after all..."'
34556: 'Erika@r@v46/54500079.".........If it looks like we''re getting stuck, why don''t we move on to the second twilight and look for hints?"'
34557: 'Erika@r@v46/54500080."......Those who remain shall tear apart the two who are close.@k@v46/54500081. ......We can probably think of "those who remain" as "the remaining characters after the first six have been removed"."'
34558: 'George@r@v07/50300018."In that case, ......what does it mean by two characters that are close...?"'
34559: 'Battler@r@v10/50100384.".........I see.@k@v10/50100385. ......I get it, so that''s what this is about...!"'
34560: '@rFor example, let''s take the following list of nine characters: 123456789.@k@rAnd then, let''s say that the six characters offered as sacrifices are 1, 3, 6, 7, 8, and 9.@k@rWe erase the aforementioned six characters from 123456789...and get x2x45xxxx.'
34561: 'Rudolf@r@v08/51200065."So 2, 4, and 5 are left.@k@v08/51200066. ......So what?"'
34562: 'Rosa@r@v12/51400041."......Oh, ......4 and 5 are close..."'
34563: 'Hideyoshi@r@v06/51100061."Yes, I get it!!@k @v06/51100062.So by "the two who are close", it means..."'
34564: '@rx2x45xxxx.'
34565: 'Battler@r@v10/50100248."Yep.@k@v10/50100387. There''s a gap between 2 and 4, but 4 and 5 are right next to each other.@k@v10/50100388. They''re the two who are close...!"'
34566: 'Erika@r@v46/54500082.".........<Good>.@k@v46/54500083. Well done, Battler-san.@k@|@y@v46/54500084. I can''t tell whether to "tear apart" means to eliminate 4 and 5,@k@v46/54500085. or to put a gap between them, but I think that''s a good observation."'
34567: 'Rudolf@r@v08/51200067."Then what do you think about the third twilight, those who remain shall praise my noble name?"'
34568: 'Erika@r@v46/54500086.".........Since there''s a good chance that the epitaph is a word game, there''s a possibility that this part is also a word game of sorts.@k@v46/54500087. ......"The characters that remain shall praise my noble name"."'
34569: 'George@r@v07/50300019."Hmmmmm......@k@v07/50300020. That''s tough...@k@v07/50300021. ......What could it mean...?"'
34570: 'Erika@r@v46/54500088.".........Have any of you figured it out?@k @v46/54500089..........I think I have."'
34571: 'Eva@r@v05/51000079."Huh?@k @v05/51000080.What is it? Tell me...!"'
34572: 'Battler@r@v10/50100389."......Is this also...an anagram?"'
34573: 'Erika@r@v46/54500090.".........<Good> once again.@k@v46/54500091. ...Battler-san, you''re a pretty flexible thinker."'
34574: 'George@r@v07/50300022."By anagram, you mean playing with letters, right?@k @v07/50300023.......That means......"'
34575: 'Kyrie@r@v09/51300052."I would guess they mean that you can make some kind of word by changing the order of the remaining letters."'
34576: 'Battler@r@v10/50100390."Yeah.@k@v10/50100391. ......If so, ..................@k@|@y@v10/50100392. ......I might be getting ahead of myself a bit with this theory,@k@v10/50100393. ...but I''m going to assume the original list of characters that the first twilight is taken out of is eleven characters long."'
34577: 'Erika@r@v46/54500092."............Well done again.@k@v46/54500093. I reached the same conclusion."'
34578: 'Hideyoshi@r@v06/51100063."Wh-why''s that?@k @v06/51100064.How can you be sure there are eleven characters?!"'
34579: 'Erika@r@v46/54500094."........."Killing a single sacrifice" appears to mean "eliminating a single character".@k@v46/54500095. If we interpret the "tear apart" of the second twilight to mean adding a gap between two characters, then we would expect there to be eleven characters in total.@k@v46/54500096. If "tear apart" means to eliminate those two characters, then we would expect thirteen."'
34580: 'Erika@r@v46/54500097."......The reason for this is that from the fourth twilight to the eighth twilight, the word "kill" appears five times.@k@v46/54500098. And then, on the ninth twilight, it''s written that none will be left alive."'
34581: 'Battler@r@v10/50100394."If we ignore the part about the witch reviving for now,@k@v10/50100395. I figured it meant that after eliminating six characters on the first twilight, separating the characters that are close, and then eliminating five more......@k@v10/50100396.there should be exactly none left."'
34582: '@rSo that makes 6+5=11 characters.@k@rIf tearing apart the two who are close on the second twilight means to kill both of them,@k that makes 6+2+5=13 characters.@k@rThere''s a chance that the word symbolizing the first twilight has eleven or thirteen characters......'
34583: 'Erika@r@v46/54500099.".........Wonderfully done. Exactly my logic.@k@v46/54500100. ......It looks like you were gifted with the same little gray cells I was, Battler-san."'
34584: 'Battler@r@v10/50100397."Hey, quit it.@k@v10/50100398. Just doing what comes naturally."'
34585: 'Battler@r@v10/50100399."............Hang on, what the hell?@k@v10/50100400. ......My piece is pretty damn clever, isn''t he?@k@v10/50100401. There''s no room left for me to make theories."'
34586: 'BERNKASTEL@r@v28/52100314."Oh, sorry about that.@k@v28/52100315. ......You weren''t around at this point, so I just controlled your piece for you.@k@v28/52100316. .........Isn''t it nice how sharp I made you seem...?"'
34587: 'LAMBDADELTA@r@v29/52200231."*giggle*giggle*giggle*...!@k @v29/52200232.You look so much smarter when Bern''s playing as you.@k@v29/52200233. ......Why not step down as the player and concentrate on being the piece instead?"'
34588: '@rI joined in on this game on October 5th, after the first few murders.'
34589: '@rSo up until that point, the piece called "me" was being controlled by BERNKASTEL, the player.'
34590: '@rWhich makes it possible for BERNKASTEL to present her reasoning through "my" mouth...'
34591: '@r......The game I''m watching now is nothing more than a replay of a part that''s already ended.'
