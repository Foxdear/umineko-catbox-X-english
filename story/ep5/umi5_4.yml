34198: '@r@v46/54500004."............Thank you very much.@k@v46/54500005. ...Allow me to introduce myself.@k@|@y@v46/54500006. ......I am called @bFurudo Erika.@<古戸ヱリカ@>."'
34199: 'Erika@r@v46/54500007."My deepest apologies for disturbing you members of the Ushiromiya family like this.@k@v46/54500008. ......I am truly grateful for the warm welcome I have received despite my status as an uninvited guest."'
34200: '@r......There was a general sigh of acceptance.'
34201: '@rThe clothes she had been lent were probably Jessica''s formal wear from long ago,@k ......but the composure of her introduction gave the impression of a dignity by no means inferior to the clothes she wore...'
34202: '@rThe girl''s name was Furudo Erika.'
34203: '@rShe looked slightly younger than Battler and Jessica,@k but her composure and mannerisms were beyond what anyone would have expected from a high-schooler, almost as though she was a well-to-do family''s daughter...'
34204: 'Battler@r@v10/50100301."Wait a sec.@k@v10/50100302. ......Who is this person?"'
34205: 'BERNKASTEL@r@v28/52100248."............With someone incompetent like you as the main character piece, the game wouldn''t get anywhere.@k@v28/52100249. That''s why I''ve placed myself there as a piece..."'
34206: 'LAMBDADELTA@r@v29/52200175."Well, it''s just a bit of a bonus.@k@v29/52200176. Even in a closed circle, it''d get boring to see the same faces every single time, right?"'
34207: 'Battler@r@v10/50100022."Quit messing around.@k@v10/50100304. This piece doesn''t exist on Beato''s game board.@k@v10/50100305. Beato and I won''t acknowledge it...!"'
34208: 'LAMBDADELTA@r@v29/52200177."This is Beato''s game board, right?@k @v29/52200178.If Beato refuses, then I''ll think about it.@k@|@y@v29/52200179. And Beato''s opinio~n?"'
34209: 'BEATRICE@r"...................................."'
34210: '@rBeato was unable to answer.@k@r......LAMBDADELTA grinned as though in triumph.'
34211: 'LAMBDADELTA@r@v29/52200180."......Wanna try complaining about the rules and stepping down from the game?@k @v29/52200181.Isn''t that the favorite move of you mystery people~@k @v29/52200182.If there''s even a tiny element that goes against your expectations, you have a tantrum and totally stop thinking."'
34212: 'Battler@r@v10/50100306.".........Ugh..."'
34213: 'BERNKASTEL@r@v28/52100250.".........Don''t worry.@k@v28/52100251. I''ll make a detective proclamation about this piece."'
34214: 'Battler@r@v10/50100307."Detective proclamation......?"'
34215: 'BERNKASTEL@r@v28/52100252.@|@y"@c900.@[I proclaim that Furudo Erika is the detective.@]@c."'
34216: 'BERNKASTEL@r@v28/52100253.@|@y"@c900.@[The detective is not the culprit.@]@c.@k@v28/52100254.@|@y @c900.@[No proof is needed to show this.@]@c.@k@v28/52100255. ......In short, there is absolutely no need to suspect this girl.@k@v28/52100256. With this guarantee, you can theorize the same way as you always did, even now that she''s appeared as a Human piece, right...?"'
34217: 'LAMBDADELTA@r@v29/52200184."......That''s Knox''s seventh commandment.@k@v29/52200185. "It is forbidden for the detective to be the culprit".@k@v29/52200186. There was an exception clause in the original, but for this game@v29/52200187. "@|@y@c900.@[the detective isn''t the culprit@]@c." has been proclaimed in red, so you don''t need to consider the exception.@k@|@y@v29/52200188. I hate word games, so I''ll say it in red too.@k@v29/52200189.@|@y @c900.@[Furudo Erika is not the culprit.@]@c."'
34218: 'Battler@r@v10/50100308."Repetition requested.@k@v10/50100309. ......"Furudo Erika had no influence on any of Beato''s games before now"."'
34219: 'LAMBDADELTA@r@v29/52200190."Sure, I''ll respond.@k@v29/52200191.@|@y @c900.@[Furudo Erika had no influence on any of Beato''s games before now.@]@c.@k@v29/52200192. She''s nothing more than an extra character who appears for the first time this round.@k@v29/52200193.@|@y @c900.@[She does not exist in the worlds before this one, nor does she influence them.@]@c."'
34220: 'Battler@r@v10/50100310."In that case, what happens to the number of people on this island right now?"'
34221: 'LAMBDADELTA@r@v29/52200194."Of course, it''s plus 1 over the previous number.@k@v29/52200195. But don''t worry.@k@v29/52200196. @|@y@c900.@[It has only increased by one person: Furudo Erika.@]@c.@k@v29/52200197. @|@y@c900.@[Besides her, the number of people on this island is exactly the same as it was in the previous games.@]@c."'
34222: '@rAt that time, the loud sound of people running through the corridor could be heard.'
34223: '@rIt was Battler, George, and Jessica, who had come from the guesthouse after being called here by Eva.'
34224: '@rThey immediately spotted a guest they didn''t recognize, and their eyes went wide.'
34225: 'Battler@r@v10/50100311."......Whoa...@k@v10/50100312. ......Wh-who are you.........?"'
34226: 'Maria@r@v13/50400004."Uu.@k@v13/50400019. Guest.@k@v13/50400020. She came by faaaall faaaalling."'
34227: 'Battler@r@v10/50100313."Huh?@k @v10/50100314.Fall fall...??"'
34228: 'George@r@v07/50300004."...Genji-san.@k@v07/50300005. Who is this person...?"'
34229: 'Genji@r@v14/51600066."This is Furudo Erika-sama, a guest.@k@|@y@v14/51600067. ......Furudo-sama,@k@v14/51600068. this is the daughter of the family, Jessica-sama, along with her cousins George-sama and Battler-sama."'
34230: 'Jessica@r@v04/50200016."Umm, oh, ......n-nice to meet you.@k@v04/50200017. I''m Ushiromiya Jessica..."'
34231: 'Erika@r@v46/54500009."............Hello.@k@v46/54500010. My name is Furudo Erika.@k@v46/54500011. I am very pleased to meet you......"'
34232: '@rThough Battler, George, and Jessica didn''t have a clue what was going on and were utterly bewildered, they each introduced themselves...'
34233: 'BERNKASTEL@r@v28/52100257."......Isn''t that convenient.@k@v28/52100258. This way, the number of people is clear.@k@v28/52100259. The people in the guesthouse have joined up with the rest, and now, all of the pieces except for Kinzo—all of the Humans—have gathered in the parlor."'
34234: 'LAMBDADELTA@r@v29/52200198."Looks like it.@k@v29/52200199. @|@y@c900.@[In other words, the number of people in this parlor now is equal to the total number of people on this island.@]@c."'
34235: 'Battler@r@v10/50100315."There were supposedly 18 humans on the island, ...but since Grandfather was actually dead, that became 17.@k@v10/50100316. ......And now that one piece of BERNKASTEL''s has been added......"'
34236: '@rThe number of humans on this island has returned to 18......'
34237: '@r"I" glanced around at the humans in the parlor.'
34238: '@rThe guest, Furudo Erika.@k@|@y And behind her, Kumasawa-san and Shannon-chan.@k@|@y Off to the side was Genji-san.'
34239: '@rUncle Krauss and Aunt Natsuhi were welcoming the guest.'
34240: '@rGohda-san immediately started showing off,@k and Kanon-kun was being unsociable, wearing his usual blank expression.'
34241: '@rThere was Dad and Kyrie-san.'
34242: '@rAuntie Eva and Uncle Hideyoshi.'
34243: '@rAuntie Rosa and Maria.@k@|@y And Doctor Nanjo.'
34244: '@rAnd on either side of me...@k@|@yGeorge-aniki,@k@|@y and Jessica...'
34245: '@rThis is everyone. The true number of people on the island at the moment......'
34246: 'George@r@v07/50300006."All of us are Ushiromiyas.@k@v07/50300007. So please don''t feel obligated to call us by our family name.@k@v07/50300008. I''m George."'
34247: 'Battler@r@v10/50100317."I''m Battler.@k@v10/50100318. Nice to meet you!"'
34248: 'Erika@r@v46/54500012."......Thank you very much, George-san, Battler-san.@k@v46/54500013. ......I''d be pleased if you would call me Erika."'
34249: 'Jessica@r@v04/50200018."Nice to meet you, Erika-san...!"'
34250: '@rErika was welcomed like a guest,@k and it was decided that she could borrow the bedroom next to the cousins'' room on the upper floor of the guesthouse.'
34251: '@rIn front of all the relatives, she had seemed dignified and a bit stiff.'
34252: '@rHowever, as she talked with George and Jessica, her expression began to soften gradually......'
34253: '@r -- And so,@k the "detective", Furudo Erika, was placed on the game board......'
34254: 'Natsuhi@r@v03/50900382."I''m surprised that Jessica''s old clothes suit her so well."'
34255: 'Genji@r@v14/51600069."......Kumasawa made the decision on her own to use Milady''s old clothes.@k@v14/51600070. Please forgive her."'
34256: '@rThe clothes Erika was wearing were Jessica''s old formal attire.'
34257: '@rThough the guest possessed a dignity that would put many adults to shame, her body was still physically similar to a middle-schooler''s.@k Jessica''s old clothes fit her perfectly.'
34258: 'Natsuhi@r@v03/50900383."Not to worry.@k@v03/50900384. They match this guest perfectly.@k@v03/50900385. If she likes them, I should think it would be all right for her to keep them as a sign of friendship."'
34259: 'Genji@r@v14/51600071."......Certainly.@k@v14/51600072. Thank you very much."'
34260: 'Natsuhi@r@v03/50900386."Have you contacted the police and her family?"'
34261: 'Genji@r@v14/51600073."Yes.@k@v14/51600074. They seemed to have been quite distressed."'
34262: 'Natsuhi@r@v03/50900387."............By the way,@k@v03/50900388. ......our guest really did...have an accident, right?"'
34263: 'Genji@r@v14/51600075."......She said that she fell from a boat as it was returning to port."'
34264: 'Natsuhi@r@v03/50900389."Is there anything to back up that claim?"'
34265: 'Genji@r@v14/51600076."I checked with the Coast Guard.@k@v14/51600077. It seems that she fell from the rear of a pleasure boat, unnoticed by the others on board.@k@v14/51600078. We don''t know the exact location she fell from, but it was probably somewhere near this island..."'
34266: 'Natsuhi@r@v03/50900390.".........How foolish, to be out boating with such a bad weather forecast.@k@|@y@v03/50900391. All the same, ......is it really conceivable that she nearly drowned in the nearby waters and drifted to this island?"'
34267: 'Genji@r@v14/51600079."It is not impossible.@k@v14/51600080. Tales of drifters washing ashore exist on several of the islands around this area."'
34268: 'Natsuhi@r@v03/50900392."..........................."'
34269: 'Genji@r@v14/51600081."......I believe it likely that there was an accident.@k@v14/51600082. ......This is the middle of a typhoon.@k@v14/51600083. There is no place on this island where it would be possible to land a boat."'
34270: '@rGenji had already figured it out.'
34271: '@rNatsuhi almost certainly suspected that this mysterious guest, who had arrived during the already high-stress family conference,@k might be a pawn in someone''s plot.'
34272: '@rTherefore, Genji had already checked to make sure that the accident was real, that Furudo Erika was her real name,@k and that there was nothing suspicious going on......'
34273: 'Natsuhi@r@v03/50900393."......Very well.@k@v03/50900394. My husband has ordered you to roll out the red carpet for her.@k@v03/50900395. Make sure that there are no blunders.@k@v03/50900396. ......However.........you understand, don''t you?"'
34274: 'Genji@r@v14/51600084."Yes.@k@v14/51600085. ......We will not allow her anywhere near the family conference.@k@v14/51600086. After dinner, I will see that she retires to the guesthouse."'
34275: 'Natsuhi@r@v03/50900397."Make sure that they don''t start talking about letting her meet Father, or anything like that, either."'
34276: 'Genji@r@v14/51600087."Of course.@k@v14/51600088. I will keep that in mind."'
34277: 'BEATRICE@r@v27/50700230.".........Hoh.@k@v27/50700231. ...Furudo Erika, was it?@k@v27/50700232. It''s rare for guests to come here to Rokkenjima.@k@v27/50700233. She looks as though she''ll be entertaining, don''t you think?"'
34278: 'Ronove@r@v31/53100040."She is probably Lady BERNKASTEL''s piece.@k@v31/53100041. ......Though she will follow the rules of Humans, the player is a witch.@k@v31/53100042. We can''t underestimate her."'
34279: 'BEATRICE@r@v27/50700234."Hmph, there is no problem.@k@v27/50700235. Even if she were Lady BERNKASTEL herself, she is a Human, and so she is no match for us.@k@v27/50700236. ......After all, we have Gaap with us.@k@v27/50700237. Humans certainly cannot win against Gaap!"'
34280: 'Gaap@r@v32/53700010."............Thanks.@k@v32/53700011. Still, it''s not a good idea to overestimate yourself.@k@v32/53700012. ......The definition of a witch doesn''t only imply the ability to use magic."'
34281: 'Ronove@r@v31/53100043."True.@k@v31/53100044. ......A joker and the eye of a typhoon.@k@v31/53100045. That is what a witch is..."'
34282: 'BEATRICE@r@v27/50700238."Hmph.@k@v27/50700239. I''m the one who gets to call herself a witch on this Rokkenjima.@k@v27/50700240. Only I, the Golden Witch and Endless Witch, BEATRICE!@k @v27/50700241.Let us see how good Lady BERNKASTEL''s next piece after Ange is.@k@v27/50700242. I intend to watch very carefully...!"'