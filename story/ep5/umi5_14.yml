39263: '@rThen, the trial for the fifth game was over.@k@rThe detective, Furudo Erika, accused the culprit, Ushiromiya Natsuhi.'
39264: '@rThere are three riddles that the detective must explain.'
39265: '@rThe first is the whodunit.@k Who is the culprit?'
39266: '@rAs previously stated, it is Ushiromiya Natsuhi.'
39267: '@rThe second is the howdunit.@k How did they carry out the crime?'
39268: '@rDuring the hour between midnight on October 4th, 1986 and 1 a.m. the next day,@k Ushiromiya Natsuhi went to the cousins'' room on the second floor of the guesthouse and the servants'' quarters on the first floor of the mansion.@k There, she carried out the murders.'
39269: '@rIt is only possible for the crime to have taken place during that hour,@k and for that one hour, alibis have been proven for all characters except Natsuhi.'
39270: '@rFrom the sky, a massive, red longsword, even greater in size than the one Dlanor held, came crashing down like a thunderbolt,@k and pierced through Battler''s heart, pinning him in place while he still stood......'
39271: '@rIn that instant, BEATRICE vanished in a spray of gold,@k ......and her former minions disappeared as well.'
39272: '@rAs the heartless witches looked down at the cathedral''s center, laughing coldly,@k ......all that remained was Battler, with the red longsword sticking through him, and Dlanor.'
39273: 'Battler@r@v10/50101232."Agh.........nng...@v10/50101233................gghh........."'
39274: 'Dlanor@r@v47/54600341."......Rest in PEACE, Ushiromiya Battler.@k@|@y@v47/54600342. It is a SHAME.@k@v47/54600343. I thought you were a more capable person than THIS."'
39275: 'Battler@r@v10/50101234."...............guh........................"'
39276: '@rBattler blew bubbles of blood,@k ......closed his eyes slowly,@k ............and expired......'
39277: '@rDlanor stared on in silence,@k ......then turned on her heels when she saw his life leave him.'
39278: '@rAfter that, all that remained was the corpse of this sorrowful man, pierced by the sword that acted as a massive, red grave marker,@k and lit by the faint glow let in from the cathedral''s skylight.........'
39279: '@rAnd then, there is the third riddle that the detective must uncover.'
39280: '@rThe final riddle...the whydunit.@k@rWhy did they commit the crime—@kthe motive.'
39281: '@rIn third-rate mysteries, there''s no need to uncover this.'
39282: '@rAfter all, even if you don''t expose the motive, the culprit will just confess it when all''s said and done.'
39283: '@rHowever, Furudo Erika was first-rate, so she would expose even this.'
39284: '@rNatsuhi was confined in the parlor, under everyone''s watchful gaze.'
39285: '@rThen, with everyone''s assent,@k Erika diligently and persistently searched all places, even Natsuhi''s room, for clues about her motive.'
39286: 'Erika@r@v46/54501098."Well, now that we have all gathered,@k@v46/54501099. just what is it that drove Ushiromiya Natsuhi-san to commit these terrible murders?@k@|@y@v46/54501100. Through my investigation, I, the detective Furudo Erika, have discovered the general outline that explains this.@k@v46/54501101. I would like to announce it now."'
39287: '@rEveryone remained silent, urging her to continue......'
39288: '@rErika tossed some of Natsuhi''s possessions that had been "confiscated" onto the table...'
39289: 'Erika@r@v46/54501102."First, these are past diaries that were discovered in Natsuhi-san''s room.@k@v46/54501103. They have barely been used at all in recent years,@k@v46/54501104. but they describe in detail the period shortly after she became a part of the Ushiromiya family."'
39290: 'Erika@r@v46/54501105."Most of them were locked, but in order to find the full truth behind this crime,@k@v46/54501106. I used my authority, which everyone has acknowledged,@k@v46/54501107. to destroy the locks on all of them."'
39291: 'Natsuhi@r@v03/50900985."......Y-@v03/50900986.......you monster......@k@v03/50900987. ......Reading...@v03/50900988....another person''s diary......"'
39292: 'Eva@r@v05/51000349."If we''re monsters, what does that make you, murderer?!!@k @v05/51000350.A criminal like you has no right to privacy!!"'
39293: 'Erika@r@v46/54501108."And this is what I found from these diaries.@k@v46/54501109. Natsuhi-san ended up married to Krauss-san due to special circumstances."'
39294: 'Erika@r@v46/54501110."......I imagine that all of you here know much more about this than I do.@k @v46/54501111.Natsuhi-san and Krauss-san were not married because of love or as a normal arranged marriage.@k@v46/54501112. ......If anything, it was more like taking a hostage."'
39295: 'Natsuhi@r@v03/50900989."Th-......that is not true!!"'
39296: 'Erika@r@v46/54501113."This is written on the 24th page of this red diary:@k@|@y@v46/54501114. ........."I am a hostage being imprisoned by the Ushiromiya family under the guise of marriage.@k@v46/54501115. However, if everything can be resolved this way......""'
39297: 'Erika@r@v46/54501116."Natsuhi-san.@k@v46/54501117. Right here, you''ve already admitted that you were a hostage.@k@v46/54501118. ......Kumasawa-san, you have served Natsuhi-san since the time she first came here, right?@k @v46/54501119.Could you tell me about what it was like at the time?"'
39298: 'Kumasawa@r@v18/51800089.".........Y-......yes, that''s correct.@k@v18/51800090. ...I did catch wind of something similar to what you describe...@k@v18/51800091. ......I think that by now, the only ones who would know the details of Madam''s marriage...@k@v18/51800092....are Doctor Nanjo and myself..."'
39299: 'Nanjo@r@v19/51900085."Very true......@k@v19/51900086. ......That was during Kinzo-san''s golden era, when he did whatever he pleased...@k@v19/51900087. He defeated all of his enemies and expanded his financial power.@k@v19/51900088. ......Natsuhi-san''s family was one of those enemies."'
39300: '@rAs though the time to talk had suddenly come at hand,@k Kumasawa and Nanjo openly delved into territory that should never have been touched upon again......'
39301: '@rIt concerned the period during which Kinzo was most feared for his ferocity.'
39302: '@rAlthough he was financially very powerful and had many connections,@k the elite looked down upon him as an upstart, which gave him a complex about his social standing.'
39303: '@rTo combat this, Kinzo wanted to find Krauss a wife from a noble family...@kand use this to raise the Ushiromiya family''s status...'
39304: '@rHe waged a financial war against Natsuhi''s family, beat them down, ......and then proposed that a marriage be performed as a method of reconciliation.'
39305: '@rAnd the person he picked......was Natsuhi.'
39306: '@rShe was a veritable princess, raised good and true by a family of Shinto priests.'
39307: '@rBy choosing her, not only did Kinzo cause them the worst possible humiliation,@k he also won what he considered to be the greatest possible trophy.'
39308: '@rSo that marriage proposal was humiliating to Natsuhi from the very beginning......'
39309: 'Erika@r@v46/54501120."Regarding the events of this period, both Kumasawa-san and Doctor Nanjo''s claims just now...@k@v46/54501121.match with the contents of the diaries."'
39310: 'Erika@r@v46/54501122."Therefore, since the time Natsuhi-san first took the name Ushiromiya Natsuhi,@k@v46/54501123. she has held a strong animosity towards the Ushiromiya family.@k@v46/54501124. ......What do you have to say, Natsuhi-san?@k @v46/54501125.Do you admit this?"'
39311: '@rAll of the cold gazes turned to face Natsuhi...'
39312: 'Natsuhi@r@v03/50900990."I-......it''s true that I thought that at first......@k@v03/50900991. I thought I was being forced into a marriage without love, ...a hostage under the guise of a bride......"'
39313: 'Natsuhi@r@v03/50900992."However, ......my husband......never viewed me as a mere hostage......@k@v03/50900993. ...He understood what I had gone through and gave me compassion and affection......@k@v03/50900994. My husband......was the only person who could understand me...!"'
39314: 'Erika@r@v46/54501126."......I see.@k@v46/54501127. That makes sense.@k@v46/54501128. There are indeed a number of places in your diaries illustrating that Krauss-san knew of your difficulties...@k@v46/54501129.and showed concern for you."'
39315: 'Erika@r@v46/54501130."However, on page 47 of this diary here,@k@v46/54501131. you describe these moments as being unpleasant, correct?"'
39316: 'Erika@r@v46/54501132."Let me read aloud.@k@v46/54501133. "When Krauss tries to show consideration, it only makes me feel more wretched.@k@v46/54501134. Sometimes, I think he might even be trying to humiliate me further."@k@v46/54501135. ......From this, we can tell that Natsuhi-san was repulsed by her husband and the concern he showed."'
39317: 'Natsuhi@r@v03/50900995."W-......wait...!@k @v03/50900996.Yes, I may have thought that at the beginning...!@k @v03/50900997.Back when I lived every day in fear for my future, I couldn''t accept his concern as true...@k@v03/50900998.and yes, I may have written of my distrust from time to time...!@k @v03/50900999.But I eventually realized he was sincere and grew to accept his feelings...!"'
39318: 'Erika@r@v46/54501136."Well, nothing like that appears in any of these diaries."'
39319: 'Natsuhi@r@v03/50901000."I, ......I never even wrote it down,@k@v03/50901001. those feelings were so secret...!"'
39320: 'Erika@r@v46/54501137."Multiple diverse pieces of evidence and testimony...@k@v46/54501138.make it clear that you had an intense hatred for your husband.@k@v46/54501139. On the other hand, your claim,@k@v46/54501140. that you eventually accepted his feelings, is unsupported by evidence."'
39321: 'Natsuhi@r@v03/50901002.".........I, I loved my husband...!!"'
39322: 'Erika@r@v46/54501141."You can''t find any testimony or evidence that can be used to elevate that statement to the level of red truth, can you?"'
39323: 'Natsuhi@r@v03/50901003."D-......does a person need evidence to say they''re in love...?!"'
39324: 'Erika@r@v46/54501142."Nothing can be trusted except for red truth...!!@k @v46/54501143.Statements that aren''t red don''t count as evidence at all, and they can''t be trusted at all!@k @v46/54501144.All text that is not red is a falsehood that exists to deceive me!!"'
39325: 'Erika@r@v46/54501145.""I love him"?@k @v46/54501146.Who would believe a profession of love in white text?@k @v46/54501147.No non-red words can ever be trusted!!@k @v46/54501148.The only things that can be trusted in this world are the red truth and the pieces of evidence I offer to my master to obtain it!!"'
39326: 'Erika@r@v46/54501149."You lying Humans can''t speak the truth!!@k @v46/54501150.Humans lacking the red truth have no right to speak of love or the heart or truth!@k @v46/54501151.Did you know?@k @v46/54501152.Men aren''t as stupid as you women think they are.@k @v46/54501153.Men never really take it seriously when a woman says "I love you"...!"'
39327: 'Natsuhi@r@v03/50901004."......What a pitiful person......@k@v03/50901005. I see you''ve never truly loved someone..."'
39328: 'Erika@r@v46/54501154."Romance is unnecessary for a detective.@k@v46/54501155. I don''t think I''ve ever used the word "romance" except to explain the motive for murder."'
39329: 'Natsuhi@r@v03/50901006."No matter what you say, we loved each other...!!@k @v03/50901007.I owe my husband an apology for always writing down my complaints and nothing else...!@k @|@y@v03/50901008.But I gave my heart to him...!!@k @v03/50901009.Even if I can''t prove it with evidence, ......that is the truth!!"'
39330: 'Erika@r@v46/54501156."Overruled.@k@v46/54501157. You just don''t know when to give up, do you?@k @|@y@v46/54501158.From evidence and testimony, it''s clear by now...@k@v46/54501159.that you hated both your husband and the Ushiromiya family."'
39331: 'Eva@r@v05/51000351."That''s right!!@k @v05/51000352.I can''t even count the number of times I''ve heard you complain...!!"'
39332: 'Natsuhi@r@v03/50901010."Don''t we all...? I remember there being days when you talked behind Hideyoshi-san''s back...!"'
39333: 'Eva@r@v05/51000353."You killed my husband!!@k @v05/51000354.How dare you say that?!!@k @v05/51000355.Die! Die so you can apologize to my husband in the afterlife!!"'
39334: 'Erika@r@v46/54501160."Please cease your violence, Eva-san.@k@v46/54501161. This is my delectable moment where I question and convict the culprit.@k@v46/54501162. It''s not yours, okay?"'
39335: 'Erika@r@v46/54501163."Now then.@k@v46/54501164. Over the next several years, she appeared to have gotten used to her new way of life,@k@v46/54501165. but in actuality, an intense hatred still lurked in her heart.@k@v46/54501166. Taking that into consideration, there would be nothing odd at all about her deciding to take revenge."'
39336: 'Natsuhi@r@v03/50901011."D-don''t act like you know what I''m thinking...!!"'
39337: '@rEach time Erika read from Natsuhi''s diaries,@k ......she exposed another of Natsuhi''s emotions during those painful days.'
39338: '@r......Natsuhi hadn''t written them down to record them for posterity.@k@rShe had written to forget those memories and seal them away.'
39339: '@rThat was why, after writing down her feelings during those painful days,@w500. ......she had locked them up and sealed them away for all eternity.'
39340: '@rHowever, Erika claimed that these were Natsuhi''s true, hidden feelings...@kthat had been locked away and concealed.'
39341: '@rSince it had already been "concluded" that Natsuhi was a murderer, everyone accepted Erika''s claim.'
39342: '@rBy this point, the red truth wasn''t even necessary to establish Natsuhi''s motive.@k@rAs long as the reason seemed plausible, everyone would believe it.'
39343: '@rNo matter how much Natsuhi might object, no one would believe her.'
39344: '@rNo one could accept the truth Natsuhi spoke of, about the days she had spent loving her husband.'
39345: '@rAnd so it was being painted over by a false truth, in which she hated her husband and swore revenge against him......'
39346: '@rThe pen of the gods that composes the truth had been given to Erika.'
39347: 'Eva@r@v05/51000356."And so what?!@k @v05/51000357.Who gives a damn about your past?!!@k @v05/51000358.Murderer, murdereeeeeer!!"'
39348: 'Nanjo@r@v19/51900089."S-stop that...!@k @v19/51900090.I can understand how Natsuhi-san felt...!"'
39349: 'Kumasawa@r@v18/51800093."I always thought this day might come, eventually......@k@v18/51800094. ...Poor thing, poor thing......"'
39350: 'Rudolf@r@v08/51200237."I think she''s another one of the pitiable victims...@k@v08/51200238.of Father''s wild life."'
39351: 'Gohda@r@v17/51700101."I knew of the pain in Madam''s heart......@k@v17/51700102. I always tried to support her......@k@v17/51700103.but I failed, and look what has happened......"'
39352: 'Kanon@r@v16/50600085."......I don''t...@v16/50600086....even understand...@v16/50600087....the emotions of love and hate."'
39353: 'Kyrie@r@v09/51300155.".........You will, someday.@k@|@y@v09/51300156. They can give you a reason to live...@k@v09/51300157.and also a reason to kill."'
39354: 'Shannon@r@v15/50500067."....................."'
39355: 'Battler@r@v10/50101235."...........................@k@v10/50101236. ......I-@v10/50101237.......is Aunt Natsuhi...@v10/50101238....really the culprit...?"'
39356: 'Erika@r@v46/54501167."Well, now that you mention it, there is...@k@v46/54501168.one last person besides Natsuhi-san that might be the culprit."'
39357: 'Battler@r@v10/50101239."Wh-......what?@k @v10/50101240.Hey, are you serious...?!@k @|@y@v10/50101241.Why the hell didn''t you say something that important sooner?!!"'
39358: 'Erika@r@v46/54501169."Natsuhi-san.@k@v46/54501170. The truth is, there is one person besides you for whom the crime was possible.@k@|@y@v46/54501171. ......If you insist on claiming that you aren''t the culprit,@k@v46/54501172. it means that person must be the culprit."'
