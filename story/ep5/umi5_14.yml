39113: 'BEATRICE@r@v27/50700939."............That''s okay...@k@v27/50700940. In this world,@v27/50700941. ......there is no truth.@k@v27/50700942. ......The truth is made later on and overwrites what comes before it.@k@v27/50700943. Real truth...@v27/50700944....doesn''t exist anywhere......"'
39114: 'BERNKASTEL@r@v28/52100666."This is a wonderful turn of events, Dlanor.@k@v28/52100667. Yes, the execution of a princess would be no fun at all without a knight appearing to rescue her.@k@|@y@v28/52100668. ......And there could be nothing better than having him beheaded before her very eyes!@k @v28/52100669.Bury the old piece and the unneeded player together!!"'
