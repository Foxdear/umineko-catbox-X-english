38355: '@r.........All of the pieces from the game board were gathered.'
38356: '@rAll of the Humans, furniture, witches, and the witches on an even higher level...@k...had gathered in one place.'
38357: '@rThat place was like a solemn cathedral, with an unbelievably high ceiling.'
38358: '@rWhite stonework.@k Golden ornaments.'
38359: '@rThough there were windows, there were no entrances nor exits.@k@rIt was a strange, strange place.'
38360: '@rBut for some reason, no one wondered where this strange place was.'
38361: '@r......Because they were not given the right to think of this place as strange.'
38362: 'LAMBDADELTA@r@v29/52200485."Pieces.@k@v29/52200486. Are you all gathered?"'
38363: 'Chiester00@r@v37/53600014."All present, ma''am."'
38364: 'LAMBDADELTA@r@v29/52200487."Good work.@k@v29/52200488. ......What a spectacle.@k@v29/52200489. I wonder just how many people there are here."'
38365: 'BERNKASTEL@r@v28/52100494."............No matter how many we see, every being outside the 18 is an illusion."'
38366: 'BEATRICE@r@v27/50700743."Making you acknowledge them is what my game''s all about.@k@v27/50700744. *cackle*cackle*!"'
38367: '@rThe three witches were seated on special thrones set upon a very high balcony.'
38368: '@rIn the center sat the Game Master, LAMBDADELTA,@k and on either side of the semicircular balcony sat BERNKASTEL and BEATRICE, facing each other.'
38369: '@rBelow them, Erika ran forward, lifted the corners of her skirt and bowed respectfully.'
38370: 'Erika@r@v46/54500835."Great Lady LAMBDADELTA, I thank you for granting my request for an assembly.@k@|@y@v46/54500836. ......And Great Lady BERNKASTEL, my master.@k@v46/54500837. You can expect great things from this assembly.@k@v46/54500838. Though it may be only for a short while, I will most certainly make you forget about the poison that torments you."'
38371: 'BERNKASTEL@r@v28/52100495."Yes, great things are what I expect.@k@v28/52100496. .........Because you are my double,@k@v28/52100497. and my piece."'
38372: '@rErika and BERNKASTEL exchanged nasty smiles that would make anyone want to avert their gaze.'
38373: 'LAMBDADELTA@r@v29/52200490."Hear me, witches, Humans!!@k @v29/52200491.I hereby announce the assembly of a witches'' coven! The Court of Illusions is now in session!!"'
38374: '@rThe ruler of the game spoke with words of power.'
38375: '@rThough her words were spoken inside such a vast space,@k they rang out with the force of a bell in a bell tower...'
38376: 'LAMBDADELTA@r@v29/52200492."Your lives and roles within this game are over!@k @v29/52200493.The fifth game is hereby closed, and the 24:00 answer session shall begin!@k @v29/52200494.......I''d love to get started right away, but why don''t we have everyone quickly introduce themselves first?@k @v29/52200495.Since there''s so many of us here."'
38377: 'LAMBDADELTA@r@v29/52200496."Eheheheheh!@k @v29/52200497.I am LAMBDADELTA!@k @v29/52200498.The Witch of Certainty and the new ruler of this game!"'
38378: 'BERNKASTEL@r@v28/52100498.".........BERNKASTEL.@k@v28/52100499. Witch of Miracles.@k@v28/52100500. ......My goal is to penetrate BEATRICE''s witch illusions."'
38379: 'BEATRICE@r@v27/50700745."I am the Endless Witch, BEATRICE.@k@v27/50700746. My goals are to assert my own existence and to protect Natsuhi and Kinzo."'
38380: 'Battler@r@v10/50101057."................................."'
38381: 'Chiester00@r@v37/53600015."......Battler-sama.@k@v37/53600016. You come next in rank."'
38382: 'Battler@r@v10/50101058.".........I''m Ushiromiya Battler.@k@v10/50101059. I''m fighting Beato''s—no.........I''m fighting the witches.@k@v10/50101060. ......That''s all."'
38383: 'Chiester00@r@v37/53600017."As I believe you know, you joined in on this game partway through.@k@v37/53600018. This means that at the time the coven commenced, you were not yet a participant.@k@v37/53600019. Do I need to explain further...?"'
38384: 'Battler@r@v10/50101061."I get it.@k@v10/50101062. ......You mean I don''t have the right to speak for the time being, right?"'
38385: 'Chiester00@r@v37/53600020."Thank you for understanding."'
38386: '@rEven though Battler held a rank second only to the witches,@k he sat on the foremost pew with the other relatives, all by himself at one end.'
38387: '@rHe met the gaze of Beato, who was up on the balcony.'
38388: 'BEATRICE@r@v27/50700747."You could simply have said you were my arch-enemy."'
38389: 'Battler@r@v10/50101063.".........Well, you aren''t necessarily my only enemy."'
38390: 'BEATRICE@r@v27/50700748."Hmph...@k@v27/50700749. .........Let''s take this game back.@k@|@y@v27/50700750. It belongs to us."'
38391: 'Battler@r@v10/50101064.".....................Yeah."'
38392: '@rI almost said that I was fighting Beato''s witch illusions.@k@r............Originally, Beato was my one and only enemy.'
38393: '@rBut now, ......Erika and those witches who started tampering with Beato''s tale...@k...are my enemies as well.'
38394: '@rWho should I fight and how?@k@rMaybe it''s a good thing I won''t have the right to speak for a while.'
38395: '@rI''ll keep a cool head and calmly watch everything unfold......'
38396: 'Erika@r@v46/54500839."I am the detective and the initiator of this coven, Furudo Erika.@k@v46/54500840. I will expose the culprit of the fifth game and bring this tale to a pleasing conclusion."'
38397: '@rErika greeted the witches above her and the Humans behind her once again.'
38398: 'LAMBDADELTA@r@v29/52200499."I''m looking forward to your performance too.@k@v29/52200500. Okay, remaining pieces, introduce yourselves in whatever order, and make it quick."'
38399: 'Chiester45@r@v35/53400019."Humans!@k @v35/53400020.Introduce yourselves, all of you...!"'
38400: '@rUrged by 45 to introduce himself, Kinzo stood up.'
38401: 'Kinzo@r@v01/51500238."......I am Ushiromiya Kinzo.@k@v01/51500239. I slipped out of the study window and am hiding somewhere on Rokkenjima."'
38402: 'Krauss@r@v02/50800292."Ushiromiya Krauss.@k@|@y@v02/50800293. I have been captured and am currently being confined somewhere."'
38403: 'Eva@r@v05/51000334."I''m Ushiromiya Eva.@k@v05/51000335. I''m alive."'
38404: 'Rudolf@r@v08/51200233."I''m Rudolf.@k@|@y@v08/51200234. ......The rest of us are all Ushiromiya too, so let''s just skip the family name."'
38405: 'Rosa@r@v12/51400112."I''m Ushiro—......Rosa.@k@v12/51400113. I was killed on the first twilight."'
38406: 'Jessica@r@v04/50200034."Jessica.@k@v04/50200035. Same here, dead on the first twilight."'
38407: 'George@r@v07/50300029."I''m George.@k@v07/50300030. ......Likewise, I died on the first twilight."'
38408: 'Maria@r@v13/50400034."Maria.@k@v13/50400035. I died, but look, I''m here talking.@k@v13/50400036. See?@k @|@y@v13/50400037.Dying isn''t a big deal, right?@k @v13/50400038.Kihihihihihihihihihihihihihi..."'
38409: 'Natsuhi@r@v03/50900927."I''m Ushiromiya Natsuhi.@k@v03/50900928. ......I am alive."'
38410: 'Erika@r@v46/54500841."............Eheheheheheheheh."'
38411: 'Natsuhi@r@v03/50900929."..................kh..."'
38412: 'Hideyoshi@r@v06/51100191."Hideyoshi here.@k@v06/51100192. I was killed just a short while ago."'
38413: 'Kyrie@r@v09/51300152."Kyrie.@k@v09/51300153. I''m still alive."'
38414: 'Nanjo@r@v19/51900077."Nanjo......@k@v19/51900078. I am also hanging in there..."'
38415: 'Genji@r@v14/51600110."My name is Genji.@k@v14/51600111. .........I died on the first twilight."'
38416: 'Shannon@r@v15/50500065."I''m Shannon.@k@v15/50500066. ......I''m still alive."'
38417: 'Kanon@r@v16/50600081."I''m Kanon.@k@v16/50600082. I''m also alive."'
38418: 'Gohda@r@v17/51700095."I, I''m Gohda.@k@v17/51700096. Pleased to meet you, everyone......"'
38419: 'Kumasawa@r@v18/51800076."I am Kumasawa...@k@v18/51800077. Pleased to meet you......"'
38420: 'Chiester410@r@v36/53500019."Now, on to the witches!@k @v36/53500020.Everyone, introduce yourselves!"'
38421: '@rVIRGILIA''s group could also be seen.'
38422: '@rThere was a second balcony, different from the one Beato''s group was on, which jutted out like raised audience seating.@k They sat there, looking down as though they were at a theater...'
38423: 'VIRGILIA@r@v30/53200236.".........My name is VIRGILIA.@k@v30/53200237. I am BEATRICE''s master in magic."'
38424: 'Gaap@r@v32/53700161."I''m Gaap.@k@v32/53700162. Making corpses disappear is my job."'
38425: 'Ronove@r@v31/53100157."Ronove.@k@v31/53100158. I am charged with making the tea.@k@|@y@v31/53100159. Pu ku ku..."'
38426: 'Lucifer@r@v38/52300011."I greet you in the name of the Seven Sisters of Purgatory.@k@v38/52300012. I served in the murder of Hideyoshi on the second twilight."'
38427: '@r@v00/awase5007_o.""""""The Seven Sisters of Purgatory, right here!""""""'
38428: 'Chiester00@r@v37/53600021."Let us then have Lady Erika''s furniture introduce themselves."'
38429: 'Gertrude@r@v48/54800049."Gertrude.@k@v48/54800050. I am an Assistant Inquisitor."'
38430: 'Cornelia@r@v49/54700056."Cornelia.@k@v49/54700057. I am an Assistant Inquisitor."'
38431: '@rThe two of them could also be seen on the second-floor balcony.@k@rThey sat apart from VIRGILIA''s group.'
38432: '@rThen, ......Dlanor, who was seated between the two, slowly stood up.'
38433: '@rShe had a presence and dignity about her, as though she was overseeing everything from that place.'
38434: 'Dlanor@r@v47/54600253."Dlanor A. Knox is my NAME.@k@v47/54600254. .........I am Lady Erika''s primary ASSISTANT."'
38435: 'Battler@r"........................"'
38436: 'Dlanor@r@v47/54600255."Battler.@k@v47/54600256. I am expecting a lot of YOU.@k@v47/54600257. Please do not disappoint ME."'
38437: 'Battler@r@v10/50101066."......Let''s just both give it all we''ve got."'
38438: 'Erika@r@v46/54500842."Most of the time, there will be no need for Dlanor to step forward.@k@v46/54500843. However, when the witch side plays around with ugly word games, I''ll need to have Dlanor pass judgment on them.@k@|@y@v46/54500844. ......The miracle in the study will not occur again."'
38439: 'Battler@r@v10/50101067."..........................."'
38440: 'Chiester00@r@v37/53600022."And finally, let us introduce ourselves.@k@v37/53600023. We are the Chiester Sisters Imperial Guards, who have been tasked with management of proceedings at this coven."'
38441: 'Chiester45@r@v35/53400021."H-hello, everyone...!!"'
38442: 'Chiester410@r@v36/53500021."Nyeh nyeh♪"'
38443: 'Chiester00@r@v37/53600024."This ends the introductions of all pieces.@k@v37/53600025. A total of 38 people are present here!"'
38444: '@rThe number of characters was 38 if you only took the fifth game into account,@k but if you added all the pieces who appeared in previous games too, it would probably rise even higher.'
38445: '@rThis mysterious game, which had so often been likened to chess, now had far more pieces than a chessboard.'
38446: 'LAMBDADELTA@r@v29/52200501."Good.@k@v29/52200502. Then I guess we''ll get started.@k@v29/52200503. Initiator, please begin!@k @|@y@v29/52200504.......Oh, excuse me, you, the goat over there.@k@v29/52200505. Refill my drink."'
38447: 'BERNKASTEL@r@v28/52100501."......And some popcorn for me."'
38448: 'LAMBDADELTA@r@v29/52200506."Oh, that''s right.@k@v29/52200507. .........It was you who decided that popcorn was the only proper accompaniment to demonic theater, after all."'
38449: 'BERNKASTEL@r@v28/52100502."Yes, I intend to enjoy this.@k@v28/52100503. .........And could I get some black tea and mustard miso?@k @|@y@v28/52100504.Erika, begin.@k@v28/52100505. I''m already starting to get bored."'
38450: 'Erika@r@v46/54500845."Yes, my master, leave it to me...!!@k @v46/54500846.Order!! Silence!"'
38451: '@rAt the sound of her voice, the Chiester Sisters troops straightened up, lifted their right knees, and stamped down hard on the floor with their heels.'
38452: '@rIt became a low, deep rumble in the ground, which instantly erased all chatter in the cathedral...@kand turned their eyes and expressions even more hollow and empty.'
38453: '@r......The room fell back into silence, almost as though they were a collection of wax models...'
38454: '@rAmidst this heavy silence, there was the sound of footsteps...@kas Erika walked out into the center where she could catch everyone''s attention.'
38455: '@rWhen she signaled with her chin, a goat attendant appeared from behind a pillar,@k .........and carried a single, plain chair out into the front and center of the room.'
38456: '@rIt must have been......the defendant''s chair.'
38457: 'Erika@r@v46/54500847."I, Furudo Erika, will make an accusation.@k@v46/54500848. The murderer of the fifth game is—"'
38458: 'Erika@r@v46/54500849."Ushiromiya Natsuhi-san.@k@v46/54500850. You are the culprit."'
38459: '@rErika pointed at Natsuhi and spoke......'
38460: '@rThe Natsuhi wax doll alone...twitched and regained its expression.@k@r......It was an expression of panic.'
38461: 'LAMBDADELTA@r@v29/52200508."Chiester Sisters.@k@v29/52200509. Please take the defendant to her chair."'
38462: 'Chiester00@r@v37/53600026."Understood."'
38463: 'Natsuhi@r@v03/50900930."Wait, ......what are you doing?!!@|@y@k @v03/50900931.Let go of me!!"@|@y'
38464: '@r45 and 410 pinned Natsuhi''s arms behind her back...@kand led her to the chair in the center.'
38465: '@rNatsuhi resisted, but the Chiester Sisters were surprisingly strong, and she couldn''t do anything.'
38466: '@rShe turned to the relatives for help, but they just remained silent like wax models...'
38467: 'Erika@r@v46/54500851."I, Furudo Erika,@k@v46/54500852. will now reconstruct why the crime was only possible for Ushiromiya Natsuhi."'
38468: 'BERNKASTEL@r@v28/52100506.".........Beato.@k@v28/52100507. Of course, you''ll be defending her, right?"'
38469: 'BEATRICE@r@v27/50700751."Naturally.@k@|@y@v27/50700752. I am the Ushiromiya family alchemist, BEATRICE the Golden.@k@v27/50700753. ......Furudo Erika, I accept your challenge.@k@v27/50700754. I shall take these false accusations you''re trying to place on my master...@k@v27/50700755.and tear them apart!!"'
38470: 'Natsuhi@r@v03/50900932."B-...BEATRICE......!"'
38471: 'BEATRICE@r@v27/50700756."Fear not, Natsuhi.@k@v27/50700757. You are my master.@k@v27/50700758. And you are the true head, with the One-winged Eagle engraved in your heart.@k@v27/50700759. Do not fear a crime you have not committed."'
38472: '@rAt those words, Natsuhi jerked back, ......and gulped.@k@rHer panic finally disappeared, and she stood up straight.'
38473: 'Natsuhi@r@v03/50900933."...Th-that''s true...!@k @v03/50900934.I am Ushiromiya Natsuhi!@k @v03/50900935.I will confront any challenger who would dare blaspheme the name of Ushiromiya!"'
38474: 'BERNKASTEL@r@v28/52100508.".........*giggle*.@k@v28/52100509. How can you make such an empty boast in a situation like this?@k@v28/52100510. ......You really are the bullied kid in every single fragment."'
38475: 'LAMBDADELTA@r@v29/52200510."So, Bern.@k@v29/52200511. Make your claims."'
38476: 'BERNKASTEL@r@v28/52100511."I, BERNKASTEL, claim...@k@v28/52100512....that a Human, Ushiromiya Natsuhi, is the culprit of this game."'
38477: 'LAMBDADELTA@r@v29/52200512."And you too Beato, okay?"'
38478: 'BEATRICE@r@v27/50700760."I, BEATRICE, claim...@k @v27/50700761.that the culprit in this game is not Human!@k @v27/50700762.I am the culprit!"'
38479: '@rBERNKASTEL, who smiled daringly, and BEATRICE, who smiled firmly, crossed gazes.'
38480: 'LAMBDADELTA@r@v29/52200513."Do you hear this, witches, Humans?!@k @v29/52200514.Two claims have appeared for a single truth!@k @v29/52200515.Is the culprit the Human Ushiromiya Natsuhi?@k@v29/52200516. Or is the culprit the witch BEATRICE?!"'
38481: 'LAMBDADELTA@r@v29/52200517."If the witch wins, the truth of the fifth game will disappear into darkness.@k@v29/52200518. If Erika wins, the witch illusion will be wiped from the game board.@k@|@y@v29/52200519. ......In other words, for Beato alone, this is a battle where losing is not an option. Are you prepared?"'
38482: 'BEATRICE@r@v27/50700763."And what am I supposed to be preparing myself for?@k@v27/50700764. This is what I''ve been craving all along...!"'
38483: '@r......If Erika were to win, the witch illusion would be destroyed.'
38484: '@rThat would mean the existence of the witch would be denied.@k@rBeato was fighting for her life.'
38485: '@rHowever, this wasn''t the only time she had been fighting for her life.@k@r.........It had always been a life-or-death struggle, even when she fought with Battler.'
38486: '@r...Because if Battler had won and broken through the witch illusion in any of the previous games,@k Beato would have been destroyed.'
38487: 'Battler@r@v10/50101068."......That''s dirty.@k@v10/50101069. Erika''s the only one with nothing to lose if she fails."'
38488: 'VIRGILIA@r@v30/53200238."I wouldn''t be so certain of that.@k@v30/53200239. ......Lady BERNKASTEL is not a compassionate person.@k@v30/53200240. ......I can''t imagine she''d give any warm treatment to a piece that didn''t perform as she had hoped..."'
38489: '@rIt was inconceivable that the ruthless BERNKASTEL would place no blame at all on a piece who had suffered defeat.'
38490: '@r......Erika was probably fighting for her life just the same.'
38491: '@rThe two claims would clash, and one would be weeded out.'
38492: '@rOne would fall...and would not leave this place alive......'
38493: '@rThe only ones who truly had nothing to lose......were those witches.'
38494: 'LAMBDADELTA@r@v29/52200520."OK, no problems!@k @v29/52200521.Now begin!!"'
38495: 'Erika@r@v46/54500853.".........In that case,@k@v46/54500854. I would like to go first.@k@|@y@v46/54500855. The murder of Hideyoshi-san is very simple.@k@v46/54500856. It should be impossible to suspect anyone other than Natsuhi-san.@k@v46/54500857. Except for the victim and Natsuhi-san, all of us were in the same room, correct?"'
38496: '@rIt really was simple.'
38497: '@r......Everyone except Natsuhi was in the parlor.@k@rAnd because it was so simple, it was decisive......'
38498: 'BERNKASTEL@r@v28/52100513."......No matter how you look at it, the one who killed Hideyoshi was Natsuhi.@k@v28/52100514. No, it''s the other way around.@k@v28/52100515. ......No matter how you look at it, no one except for Natsuhi could have killed Hideyoshi.@k@v28/52100516. There''s no room for discussion or debate."'
38499: 'Natsuhi@r@v03/50900936."I, I''m telling you, you''re mistaken...!!@k @v03/50900937.It may be true that I don''t have an alibi.@k@v03/50900938. However, I don''t believe a lack of an alibi proves that one is the culprit...!"'
38500: 'BEATRICE@r@v27/50700765."Hmph, I understand that Natsuhi is the only one without an alibi.@k@|@y@v27/50700766. But wait.@k@v27/50700767. The scene of the murder was a locked room.@k@v27/50700768. It should have been impossible for anyone, including Natsuhi, to have committed the crime in that room.@k@v27/50700769. Except for me, since I could have done it with magic."'
38501: 'Erika@r@v46/54500858."I''ll explain the locked room trick—the howdunit—later.@k@v46/54500859. We are starting with the whodunit for the time being.@k@|@y@v46/54500860. ......So for the reason I just mentioned, it''s impossible to suspect any character except Natsuhi-san for the murder of Hideyoshi-san."'
38502: 'Ronove@r@v31/53100160.".........Milady.@k@v31/53100161. It may be dangerous to press any further on this."'
38503: 'Gaap@r@v32/53700163."I agree.@k@v32/53700164. It''s a fact that Natsuhi was hiding in the closet of Hideyoshi''s room.@k@v32/53700165. ......If they use a repetition request to check her location, we''ll be cornered."'
38504: 'BEATRICE@r@v27/50700770."......Probably.@k@v27/50700771. Lady LAMBDADELTA is the ruler of this game.@k@v27/50700772. ......If it suits her fancy, she''ll set up Natsuhi as the culprit regardless of the facts."'
38505: '@rIf the typhoon were to pass and the police were to come and perform a scientific investigation,@k perhaps the true culprit would be identified and the false accusations against Natsuhi lifted.'
38506: '@rHowever, the police would never arrive at this closed-off Rokkenjima.'
38507: '@r......In other words, the real truth would never be revealed.'
38508: '@rInside a cat box that will never be opened, false charges that everyone accepts have exactly the same value as the truth.'
38509: 'Ronove@r@v31/53100162."Their aim is most likely to use the simple murder of Hideyoshi to give the impression that Natsuhi-sama is the culprit...@k@v31/53100163.before moving on to the first twilight''s reconstruction, which has more uncertain elements."'
38510: 'Gaap@r@v32/53700166."It''s not good at all to proceed while under the Game Master''s suspicion.@k@v32/53700167. We should take the initiative."'
38511: 'BEATRICE@r@v27/50700773."Indeed.@k@|@y@v27/50700774. ............Lady LAMBDADELTA!@k @v27/50700775.As you are well aware, a fair number of murders were committed during the fifth game,@k@v27/50700776. and we are skipping the rather lengthy chunk of time from midnight until the early morning."'
38512: 'BEATRICE@r@v27/50700777."Skipping to Hideyoshi''s murder...@k@v27/50700778.and stepping backwards and forwards in time will only lead to confusion.@k@v27/50700779. It is my belief that we should follow events chronologically and in order, though the decision is yours, of course."'
38513: 'BERNKASTEL@r@v28/52100517."Objection.@k@v28/52100518. Chronological order has no significance in the process of building a case against the culprit."'
38514: 'BEATRICE@r@v27/50700780."Objection.@k@v27/50700781. Furudo Erika is trying to manipulate perception in her favor by mixing up the chronological sequence."'
38515: 'LAMBDADELTA@r@v29/52200522."Ugh, I don''t like it when things get all muddled either.@k@|@y@v29/52200523. I accept Beato''s claim.@k@v29/52200524. Erika, start with the first twilight instead of jumping to the second."'
38516: 'Erika@r@v46/54500861."...............Tch."'
38517: '@rI definitely saw Erika click her tongue.'
38518: '@r......Now I understand.@k This is how the tales of Rokkenjima are created.'
38519: '@rAfter being guided by VIRGILIA and meeting BEATRICE,@k ......now I stand here, at this peak from which I can see everything below me, and I finally understand the truth of this world.'
38520: 'Battler@r@v10/50101070."This is......that thing you talked to me about before."'
38521: 'VIRGILIA@r@v30/53200241.".........Yes, that''s right.@k@v30/53200242. Truth is very fragile in this place."'
38522: 'Battler@r@v10/50101071."As long as each side makes its own claim, different truths can exist at the same time..."'
38523: '@rYes.@k This really is a trial.@k@rBoth sides put forth their own truths.'
38524: '@rThis here truly is the Braun tube trial that VIRGILIA once used as an analogy......'
38525: 'Erika@r@v46/54500862."Then I will follow Lady LAMBDADELTA''s orders and start from the first crime at the first twilight.@k@v46/54500863. As you know, at midnight on October 4th, the first day,@k@v46/54500864. following a short break in the family conference, Natsuhi-san left on her own, saying that she was going to bed early.@k@v46/54500865. Therefore, her alibi is completely lost from that time until the next morning."'
38526: 'BEATRICE@r@v27/50700782."Oh, is that so?@k @v27/50700783.I believe there are several people besides Natsuhi who have dubious alibis.@k@v27/50700784. Unless you can clear suspicion from all of them, I cannot allow you to call Natsuhi the culprit."'
38527: 'LAMBDADELTA@r@v29/52200525."True.@k@v29/52200526. If Erika wants to claim that Natsuhi is suspicious,@k@v29/52200527. she should first show that everyone besides Natsuhi has an alibi.@k@v29/52200528. Right, Bern?"'
38528: 'BERNKASTEL@r@v28/52100519.".........Yes, of course.@k@v28/52100520. Erika will provide a complete explanation that covers everyone."'
38529: 'Erika@r@v46/54500866."Of course, my master...!@k @|@y@v46/54500867.In that case, I would like to explain things in order.@k@v46/54500868. Let''s forget about Genji''s murder for now and focus on the crime in the guesthouse.@k@v46/54500869. The inclination here is to suspect the servants who were in the guesthouse, yes?@k @v46/54500870.On that night, Gohda-san and Kumasawa-san were in the guesthouse.@k@v46/54500871. Isn''t that right, you two?"'
38530: '@rShe turned to face the direction where those two people were seated, ......and just those two wax models came back to life.'
38531: '@rWhen they weren''t allowed to speak, they probably weren''t even granted a soul.'
38532: '@rIn that case, it would have been much better if Natsuhi''s soul could simply have disappeared as well...'
38533: '@r......Natsuhi, who was in the defendant''s chair, kept her soul the whole time, and was constantly hanging her head, looking nervous...'
38534: '@rGohda hurried to his feet and answered Erika''s question.'
38535: 'Gohda@r@v17/51700097."Y-yes, that is correct.@k@v17/51700098. On that evening, I was alone in the guesthouse servant room..."'
38536: 'Kumasawa@r@v18/51800078."Well, look at my age.@k@v18/51800079. Staying up the night would be a heavy burden, so I returned to the servants'' quarters in the guesthouse...@k@v18/51800080.and went to bed right away on my own... Yes, you''d better believe I did...!"'
38537: 'Natsuhi@r@v03/50900939."......Doesn''t that mean Gohda and Kumasawa have lost their alibis?!!@k @v03/50900940.Kumasawa claims that she was sleeping alone in the servants'' quarters.@k@v03/50900941. Gohda claims he was alone in the servant room.@k@v03/50900942. Either of them should have had enough time to go to the cousins'' room and commit murder!!"'
38538: 'Gohda@r@v17/51700099."N-n-nonsense...!@k @v17/51700100.Why would we do something like that...?!"'
38539: 'Kumasawa@r@v18/51800081."That''s right, that''s right...!@k @v18/51800082.How could we ever kill another person...?!"'
38540: 'BEATRICE@r@v27/50700785."Natsuhi said it all.@k@v27/50700786. Both Kumasawa, who was sleeping alone in the servants'' quarters, and Gohda, who was alone in the servant room,@k@v27/50700787. are in the exact same situation as Natsuhi in her room.@k@v27/50700788. Both of them have lost their alibis."'
38541: 'Erika@r@v46/54500872."Have no fear.@k@v46/54500873. I guarantee that neither of these two are murderers.@k@|@y@v46/54500874. Firstly, Kumasawa-san—following dinner, she left the mansion with me and the others and went to the guesthouse,@k@v46/54500875. entered the servants'' quarters, and slept until morning.@k@v46/54500876. It''s the same for Gohda-san.@k@v46/54500877. Once he finished with his job, he chatted with us in the lounge and went to sleep afterwards.@k@v46/54500878. Neither of them had the opportunity to commit murder."'
38542: 'BEATRICE@r@v27/50700789."Hmph.@k@v27/50700790. So, we''re finally here."'
38543: 'BEATRICE@r@v27/50700791."......I see that it''s time for me to stand up as well.@k@v27/50700792. Your turn is over already, Erika.@k@v27/50700793. ...Go summon that bodyguard you rely on so much."'
38544: '@rBeato glanced at where Dlanor sat on the second-floor balcony.@k@r......However, Dlanor just stared back with those usual expressionless eyes.'
38545: 'BEATRICE@r@v27/50700794."Repetition requested.@k@v27/50700795. "We have absolute proof of Gohda and Kumasawa''s alibis"."'
38546: 'BERNKASTEL@r@v28/52100521."Decline repetition.@k@v28/52100522. .........Why give a hint to an enemy?@k @v28/52100523.There''s no way we''d answer."'
38547: 'BEATRICE@r@v27/50700796."Hah!@k@v27/50700797. Did you hear that, Lady LAMBDADELTA?@k @v27/50700798.They say they have no proof!@k @v27/50700799.Is it acceptable for them to claim that Gohda and Kumasawa have alibis without proof?!"'
38548: 'LAMBDADELTA@r@v29/52200529."Good point.@k@v29/52200530. What do you say, Bern, Erika?@k@v29/52200531. How can you claim that Gohda and Kumasawa have alibis?"'
38549: 'BEATRICE@r@v27/50700800."Stay out of this, Erika.@k@v27/50700801. My opponent is Dlanor over there.@k@v27/50700802. A mere Human like you is not fit to argue with a witch!"'
38550: 'Dlanor@r@v47/54600258.".............................."'
38551: 'Erika@r@v46/54500879."No.@k@v46/54500880. There''s no need for Dlanor to step forward.@k@v46/54500881. .........In fact, it is precisely this, a "mere Human" defeating a witch, that will spell the end for the witch illusion.@k@|@y@v46/54500882. ......So go ahead.@k@v46/54500883. Use the red and blue as much as you like.@k@v46/54500884. ......I''m ready for you."'
38552: '@rIn response to Erika''s challenge, Beato smiled boldly yet gracefully and slowly stood up.'
38553: '@rAnd they glared at each other between the floor and the balcony......'
38554: 'BEATRICE@r@v27/50700803.@|@y"@c279.@[Gohda and Kumasawa have no alibis.@k@v27/50700804.@|@y The two of them were in the guesthouse and could have reached the cousins'' room to commit murder at any time.@k @v27/50700805.@|@yUnless you can eliminate that possibility, you cannot treat Natsuhi as the culprit.@]@c."'
38555: '@rBeato''s blue truth struck out rapidly.@k@rThe curtain had finally dropped, and the battle had begun......'
38556: 'Gaap@r@v32/53700168."......A Human like Erika can''t use any red.@k@v32/53700169. How could she turn this around without calling Dlanor?"'
38557: 'Ronove@r@v31/53100164."Though Erika cannot use it, her master, Lady BERNKASTEL, can.@k@v31/53100165. ......We mustn''t let our guards down."'
38558: 'LAMBDADELTA@r@v29/52200532."Blue truth, valid.@k@|@y@v29/52200533. ......What''ll you do, Bern?@k @v29/52200534.Will you or Dlanor step in instead?"'
38559: 'Dlanor@r@v47/54600259."It is still not my TURN.@k@v47/54600260. And it is not Lady BERNKASTEL''s turn EITHER."'
38560: 'BERNKASTEL@r@v28/52100524."......Yes, that''s right.@k@v28/52100525. There''s no need for us to show up for something like this.@k@v28/52100526. ......This is important precisely because a mere Human like Furudo Erika will defeat you, Beato."'
38561: 'BERNKASTEL@r@v28/52100527."......Because you''ll be defeated by a Human, we''ll know.@k@v28/52100528. We''ll all know that the fake witch who calls herself "BEATRICE the Golden" is nothing more than a sub-Human illusion."'
38562: 'LAMBDADELTA@r@v29/52200535."*giggle*giggle*...@k@v29/52200536. If you really can do that, it''ll be seriously interesting...@k @|@y@v29/52200537.Okay, Erika.@k@v29/52200538. Let''s see what you''ve got...!"'
38563: 'Erika@r@v46/54500885."I will begin with Kumasawa-san. It is extremely simple.@k@v46/54500886. Kumasawa-san, stand."'
38564: 'Kumasawa@r@v18/51800083."Y-.........yes...!"'
38565: 'Erika@r@v46/54500887."Kumasawa-san, from the time you went to bed last night...@k@v46/54500888.to the time you were informed about the crime in the morning, did you ever leave the servants'' quarters?"'
38566: 'Kumasawa@r@v18/51800084."No!@k @v18/51800085.I was sound asleep until morning, I really was!!"'
38567: 'Erika@r@v46/54500889."The truth is...@k@v46/54500890.......after dinner last night, I had a chat with Eva-san, and she told me something very interesting.@k@v46/54500891. ...And I tested it out myself."'
38568: 'BEATRICE@r@v27/50700806."What are you talking about...?@k @v27/50700807.......You don''t mean..."'
38569: 'Erika@r@v46/54500892."That''s right.@k@v46/54500893. It''s what cornered and sealed Kinzo in the study.@k@v46/54500894. ......I learned that you can create a seal by putting something between a door and the frame."'
38570: 'Battler@r@v10/50101072.".........Are you kidding...?@k@v10/50101073. Did she actually......do that to the servants'' quarters where Kumasawa-san was sleeping?!"'
38571: 'VIRGILIA@r@v30/53200243."Erika was in the guesthouse, so there''s no obstacle to her having been capable of that."'
38572: 'Erika@r@v46/54500895."After all, it was an unsettling night, and a massive amount of gold had just been discovered. Many sorts of crimes might have occurred.@k@|@y@v46/54500896. ......Where there is a detective, there will be a crime.@k@v46/54500897. I foresaw that some kind of crime would take place,@k@v46/54500898. so I used this to seal away people whose alibis might otherwise be lost."'
38573: '@rErika held a small, folded piece of brown paper high in the air.'
38574: 'Erika@r@v46/54500899."After I watched Kumasawa-san, who returned to the guesthouse with me, say goodnight and enter the servants'' quarters,@k@v46/54500900. I used this to seal the door."'
38575: 'Erika@r@v46/54500901."Then, in the morning,@k@v46/54500902. when the crime was discovered and caused a big uproar, I immediately went to check Kumasawa-san''s quarters,@k@v46/54500903. where I confirmed that the seal was still intact.@k@v46/54500904. Therefore, I can prove Kumasawa-san''s alibi!"'
38576: 'BERNKASTEL@r@v28/52100529.".........<Good>.@k@v28/52100530. A wonderful alibi. Absolutely airtight.@k@v28/52100531. Kumasawa returned to the guesthouse with Erika, went to the servants'' quarters to sleep, and never left the room until morning.@k@|@y@v28/52100532. @c900.@[In other words, after Kumasawa returned to the guesthouse, she never went to the second floor until morning.@]@c."'
38577: '@rThe proof Erika had shown was elevated by BERNKASTEL and became red truth.'
38578: '@rThis truth, which had become red, could no longer be overturned, even by Beato...'
38579: '@rIn other words, in that instant, Kumasawa''s perfect alibi had been absolutely guaranteed.'
38580: 'BEATRICE@r@v27/50700808."Hohoh!@k @v27/50700809.Then what about Gohda?!"'
38581: 'Erika@r@v46/54500905."Gohda-san holed up in the servant room right after reaching the guesthouse.@k@|@y@v46/54500906. I sealed him up in the same way.@k@v46/54500907. Then, when Rosa-san returned at 1 a.m., I happened to notice her when I stepped out into the corridor.@k@v46/54500908. I let Gohda-san, who was still in the servant room, know this."'
38582: 'Erika@r@v46/54500909."The seal was intact at that time, so from the time we arrived at the guesthouse until 1 a.m.,@k@v46/54500910. Gohda-san never left the servant room.@k@v46/54500911. And afterwards, he was with me in the lounge until 3 a.m.@k@v46/54500912. And after 3 a.m., I was upstairs,@k@v46/54500913. so I can guarantee that Gohda-san didn''t come up."'
38583: 'BERNKASTEL@r@v28/52100533.".........Erika''s seal proves that Gohda was holed up in the servant room until 1 a.m.@k@v28/52100534. And Erika can testify to his alibi from then until 3 a.m.,@k@v28/52100535. because she was passing the time in the lounge with him.@k@v28/52100536. And after that point, he never set foot upstairs until the morning after.@k@v28/52100537. Erika can attest to this as well."'
38584: 'BERNKASTEL@r@v28/52100538.@|@y"@c900.@[In other words, after Gohda returned to the guesthouse, he never went up to the second floor until morning.@]@c."'
38585: 'LAMBDADELTA@r@v29/52200539."Red truth, valid.@k@|@y@v29/52200540. ......Well done, Erika.@k@v29/52200541. The alibis due to your seals on those doors have been acknowledged by Bern and elevated to the status of red truth."'
38586: 'Erika@r@v46/54500914."Thank you very much, my master.@k@|@y@v46/54500915. ......I am the detective! A being greater than Humans, who can invoke the red truth despite her Humanity!"'
38587: 'BEATRICE@r@v27/50700810."You claim to be greater than Human......?@k@|@y@v27/50700811. You conceited brat! Live another thousand years, and then you can talk!"'
38588: 'Erika@r@v46/54500916."It''ll be a pain to have you try anything funny, so I''ll make this clear now.@k@v46/54500917. In fact, I should have done this in the beginning.@k@v46/54500918. I apologize for being so roundabout.@k@v46/54500919. This is the state of the guesthouse at midnight."'
38589: 'Erika@r@v46/54500920.".........The gold had been found, an emergency family conference called, and Battler-san had gone to the mansion with the relatives.@k@v46/54500921. I, the three cousins, Doctor Nanjo, Gohda-san, and Kumasawa-san remained in the guesthouse."'
38590: 'Erika@r@v46/54500922."I have already explained Gohda-san and Kumasawa-san''s alibis.@k@v46/54500923. George-san, Jessica-san, and Maria-san were playing cards in the cousins'' room.@k@v46/54500924. I actually joined in for a little bit, and I clearly witnessed that they were alive at that time."'
38591: 'Erika@r@v46/54500925."My master, I request that you repeat this!!"'
38592: 'BERNKASTEL@r@v28/52100539."Yes, I''ll oblige you.@k @v28/52100540.@|@y@c900.@[At 24:00 in the guesthouse, George, Jessica, and Maria were alive,@k@v28/52100541.@|@y and they were in the second-floor cousins'' room.@k@v28/52100542. @|@yNanjo, Gohda, and Kumasawa were on the first floor.@]@c."'
38593: 'BERNKASTEL@r@v28/52100543."And, since there''s no need to hold off on it anymore,@k@v28/52100544. I''ll confirm that all the victims so far are dead.@k @v28/52100545.@|@y@c900.@[George, Jessica, Maria, Rosa, and Genji—these five really are dead.@]@c.@k@v28/52100546. How could they be playing dead with their necks sliced open like that?"'
38594: 'Erika@r@v46/54500926."Thank you for repeating, my master...!@k @|@y@v46/54500927.I had to make these things clear, you see, or I might have started hearing about how they were already dead before I guaranteed everyone''s alibi,@k@v46/54500928. or that they weren''t actually dead at all."'
38595: 'BEATRICE@r@v27/50700812.".........gh..."'
38596: '@rUnsurprisingly, Beato''s side couldn''t get away with the simple plan of claiming that the victims were only playing dead.'
38597: '@rBut in order to overcome Gohda and Kumasawa''s alibis, it should have been possible to suppose that the crime occurred before those doors were sealed.'
38598: '@rHowever, the opponent had predicted this move perfectly.'
38599: '@rIt had now been shown in red that the crime did not occur before the time period covered by Erika''s alibis.'
38600: 'LAMBDADELTA@r@v29/52200542."Got it.@k@v29/52200543. That''s the last time the victims were confirmed to be alive.@k@v29/52200544. I wish you''d said that in the beginning.@k@v29/52200545. ......This means we can ignore everything that happened before midnight."'
38601: 'BERNKASTEL@r@v28/52100547.".........To go even further,@v28/52100548. @|@y@c900.@[at 24:00, Natsuhi, Krauss, and Genji were in a corridor on the second floor of the mansion.@k@v28/52100549.@|@y All the remaining people were at the family conference in the dining hall.@k@v28/52100550.@|@y Of course, at that point in time, no murder had occurred.@k@v28/52100551. Genji was also alive.@]@c."'
38602: 'LAMBDADELTA@r@v29/52200546."That isn''t something that Erika observed,@k@v29/52200547. but we can''t move the game forward without establishing it.@k@v29/52200548. Okay, I''ll acknowledge that red truth."'
38603: 'Erika@r@v46/54500929."Thank you very much for that red truth, my master!"'
38604: '@rSince Erika had been in the guesthouse,@k it was only natural that she could explain the situation there.'
38605: '@rHowever, since she hadn''t been in the mansion at the time,@k explaining the situation over there would have been extremely difficult for her.'
38606: '@r......Beato would normally have attacked there with the blue truth,@k saying that the people in the dining hall had all agreed to keep to the same story,@k and that someone might have snuck out of the dining hall and committed murder in the guesthouse.'
38607: '@rHowever, because Bern had instantly settled that matter with the red truth,@k Beato had completely lost her chance to strike back......'
38608: 'BEATRICE@r@v27/50700813."Damn you............"'
38609: 'Ronove@r@v31/53100166."......Very troublesome.@k@v31/53100167. ......To think we would be put at such a disadvantage..."'
38610: 'Gaap@r@v32/53700170."This is almost the exact opposite of Riiche''s fights with Battler......"'
38611: 'Ronove@r@v31/53100168."......In fact, the situation might be even worse than it was back then."'
38612: '@rAt a glance, the fight between the two of them resembled our previous fights.'
38613: '@rHowever, there were some vital differences.'
38614: '@rThe first was whether or not Beato was the Game Master.'
38615: '@rThe Beato who fought against me was the Game Master.@k@rSo she knew all the truth.'
38616: '@rThat''s why she was able to use the red truth at will.'
38617: '@rHowever, the current Beato isn''t the Game Master.@k@rShe''s just a single piece on the game board.'
38618: '@r......In other words, even Beato doesn''t know the truth.'
38619: '@rSo you could say that Beato is now in the same position I once was.'
38620: '@rAlso, though Erika may seem to be in the same position I once was,@k the situation for her is totally different.'
38621: '@rShe''s connected to the witch called BERNKASTEL.'
38622: '@r......Even though she isn''t the Game Master, she''s capable of elevating Erika''s statements to become red truth.'
38623: '@rBecause of this, Erika can use the red truth even though she''s neither a witch nor the Game Master.'
38624: '@rBeato, who''s supposed to be the witch, possesses no truth or red she can use.@k@rAnd yet the detective, Erika, can use the red truth.'
38625: '@rThe advantage has completely flipped over to the other side.'
38626: '@r......You could probably say that the current Beato is in a much worse position than I was when I fought with her.'
38627: '@rAfter I got used to the game, Beato stopped responding to my repetition requests,@k but in the beginning, she responded to almost all of them, giving me quite a few hints.'
38628: '@rThat''s why we were able to fight on par.'
38629: '@rHowever, BERNKASTEL is different.'
38630: '@rShe fully understands the rules of this game, and is prepared to corner Beato without even a hint of restraint.'
38631: '@r.........And all this made me realize.'
38632: '@r......Beato was going easy on me so that we could fight on par with each other......'
38633: 'BEATRICE@r@v27/50700814."*cackle*cackle*cackle*......@k@v27/50700815. This has become quite an interesting fight.@k@|@y@v27/50700816. ...I see, so I must fight from the position Battler once stood in."'
38634: 'Battler@r@v10/50101074.".........Beato......"'
38635: 'BEATRICE@r@v27/50700817."I once insulted you and called you incompetent.@k@v27/50700818. ......I can handle much, much worse than this. *cackle*cackle*!"'
38636: 'Gaap@r@v32/53700171."It''s now impossible to suspect Gohda and Kumasawa.@k@v32/53700172. You can''t win by arguing that point any longer."'
38637: 'BEATRICE@r@v27/50700819."Yep.@k@v27/50700820. Let''s switch to a different approach."'
38638: 'Ronove@r@v31/53100169."The next in line would probably be Nanjo.@k@v31/53100170. He was also in the guesthouse."'
38639: 'Gaap@r@v32/53700173."Nanjo was in the lounge with Erika, if I''m not mistaken.@k@v32/53700174. ......But the time periods before and after that should be wide open."'
38640: 'BEATRICE@r@v27/50700821."That''s right, I''ll strike there.@k@|@y@v27/50700822. ......Nanjo.@k@v27/50700823. You were relaxing in the downstairs lounge of the guesthouse with Erika and Gohda, correct?"'
38641: 'Nanjo@r@v19/51900079."Yes......@k@v19/51900080. I was with Erika-san the whole time..."'
38642: 'BEATRICE@r@v27/50700824."And during what time was this?"'
38643: 'Nanjo@r@v19/51900081."F-from 1 to 3 a.m."'
38644: 'Erika@r@v46/54500930."Yes, that''s right.@k@v46/54500931. Between 1 a.m. and 3 a.m,@k@v46/54500932. Doctor Nanjo, Gohda-san, and I were relaxing in the lounge.@k@|@y@v46/54500933. ......Repetition requested, my master!"'
38645: 'BERNKASTEL@r@v28/52100552."I''ll respond.@k @v28/52100553.@|@y@c900.@[From 1 a.m. to 3 a.m., the trio of Erika, Nanjo, and Gohda...@k@v28/52100554. spent their time in the lounge on the first floor of the guesthouse.@]@c."'
38646: '@r......Though she had flat out refused Beato''s repetition request, she responded to Erika''s immediately.'
38647: '@rThe red truth...was starting to corner Beato.'
38648: '@r......Beato grimaced as though in pain, but she still struck back with the blue truth.'
38649: '@r......No, she really was in pain.'
38650: '@rAs alibis were steadily established for everyone other than Natsuhi, the witch illusion was also being denied.'
38651: '@rBeato perceived the denial of her existence as pain...'
38652: 'BEATRICE@r@v27/50700825.@|@y"@c279.@[Even so, he shouldn''t have an alibi for the time period before and after you were in the lounge!@k @v27/50700826.@|@yIt was possible for Nanjo to commit the crime too!@]@c."'
38653: 'LAMBDADELTA@r@v29/52200549."That''s right.@k@v29/52200550. I get that Nanjo was in the lounge with Erika from 1 a.m. to 3 a.m., but what about before and after that?@k @v29/52200551.......Well, Erika?"'
38654: 'Erika@r@v46/54500934."Of course.@k@v46/54500935. First, the alibi for before 1 a.m.@k@v46/54500936. This is no problem at all.@k@|@y@v46/54500937. I played cards with the cousins in their room until midnight,@k@v46/54500938. and then went downstairs to the lounge, where I met Doctor Nanjo."'
38655: 'Nanjo@r@v19/51900082."That''s right......@k@v19/51900083. At midnight, I met Erika-san as she was coming down the stairs, and spoke with her, learning that she was quite the connoisseur of the mystery genre.@k@v19/51900084. I realized that I''d found a kindred spirit......"'
38656: 'Erika@r@v46/54500939."When I went into the archive to solve the epitaph''s riddle,@k@v46/54500940. I noticed that there were several original copies of famous foreign mystery novels stored there.@k@v46/54500941. So, I wanted to discuss them with the actual books in hand.@k@v46/54500942. We moved to the archive and were talking the whole time.@k@v46/54500943. Constantly, until we moved to the lounge."'
38657: '@rThe archive in the guesthouse had enough books in it that you might even call it a small library.'
38658: '@rIn it were several famous foreign mystery novels...@kthat Kinzo had once taken a liking to.'
38659: '@rOf course, they were all originals and in English, but English was no problem for both Erika and Nanjo.'
38660: '@rOn that occasion, Erika had again borrowed the key to the archive from Gohda in the servant room.'
38661: '@rShe added that she had rechecked the seal at that point and, of course, reset it.'
38662: '@rDamn her.'
38663: '@rEven though she keeps it sealed for anyone else to enter or leave, she alone enters and leaves whenever she wants.'
38664: 'LAMBDADELTA@r@v29/52200552."I see.@k@v29/52200553. So, from midnight until 3 a.m. when you went to bed, you were with Nanjo the whole time?@k @v29/52200554.That means Nanjo''s alibi is the most rock solid of them all."'
38665: 'Erika@r@v46/54500944."Yes, that is indeed the case!@k @v46/54500945.Repetition requested, my master...!"'
38666: 'BERNKASTEL@r@v28/52100552."I''ll respond.@k@v28/52100556. @|@y@c900.@[After 24:00, Erika was with Nanjo the whole time until 3 a.m.@]@c."'
38667: '@rAt midnight, the crime in the cousins'' room still hadn''t occurred.'
38668: '@rSo this establishes an alibi for the period before the time he spent in the lounge.'
38669: 'Erika@r@v46/54500946."After that, we walked out of the archive and into the hallway at 1 a.m.@k@v46/54500947. When we did, we just happened to bump into Rosa-san as she returned.@k@|@y@v46/54500948. I then told Gohda-san about that.@k@v46/54500949. ......I figured it was probably a servant''s responsibility to welcome in a guest."'
38670: '@rGohda asked if he should bring a towel, but Rosa refused.'
38671: '@rShe quickly headed up to the second floor.'
38672: '@rAt this point, Erika, Gohda, and Nanjo gathered together and decided to have a drink......'
38673: '@rTheir alibis in the lounge up until 3 a.m. have already been proclaimed in red, so there are no problems there.'
38674: 'Erika@r@v46/54500950."Let''s continue on to after 3 a.m.@k@v46/54500951. This is Doctor Nanjo''s alibi after we split up.@k@|@y@v46/54500952. At 3 a.m., Battler-san returned and the people in the lounge went their separate ways.@k@v46/54500953. Doctor Nanjo, Battler-san and I went up to the second floor.@k@v46/54500954. I then said good night to Doctor Nanjo.@k@v46/54500955. At this time, of course, I put a seal on the door to the doctor''s room as well."'
38675: 'Erika@r@v46/54500956."And it went unchanged until the crime was discovered.@k@v46/54500957. I flew out of my room the moment Battler-san screamed,@k@v46/54500958. and I confirmed that the door to Doctor Nanjo''s room was still sealed.@k@v46/54500959. Therefore, Doctor Nanjo''s alibi is perfect both before 1 a.m. and after 3 a.m...!"'
38676: 'BERNKASTEL@r@v28/52100557."Splendid, Erika.@k @v28/52100558.@|@y@c900.@[Both your seal and your red truth are perfect.@k@v28/52100559. Nanjo had the alibi of being with Erika until 3 a.m.@k@v28/52100560. And he didn''t leave his room after 3 a.m. until morning.@]@c."'
38677: '@rUsing the seals she had placed on the doors,@k Erika was granted red truths from BERNKASTEL one after another......'
38678: '@rWhen I gave Beato a repetition request, it was about maneuvering and tactics,@k ......but it''s totally different for Erika.'
38679: '@rFor her, it''s like having a trump card which can make red whenever she wants......'
38680: 'Erika@r@v46/54500960."This concludes the proof of alibis for all suspects in the guesthouse.@k@v46/54500961. ......No problems, I assume?"'
38681: 'BEATRICE@r@v27/50700827."I, ......I do have a problem...!!@k @v27/50700828.And that problem is, ......umm........."'
38682: '@rBeato racked her brains to find some point to latch onto, but Erika''s red had been ruthlessly perfect.'
38683: '@r......There was no point she could take issue with...'
38684: '@rBeato kept thinking hard, trying to fault Erika on something,@k but her expression was so wrought with desperation that anyone could tell by looking...'
38685: 'LAMBDADELTA@r@v29/52200555."I''m overruling you, Beato.@k@v29/52200556. I can''t sense any problems at all.@k@v29/52200557. ......It''s totally <pop>, <cute>, and <perfect>!@k @v29/52200558.The alibis for all humans in the guesthouse have now been proven."'
38686: 'Battler@r@v10/50101075."......Hold it, Erika.@k@v10/50101076. You''re gonna leave me out of this?@k@v10/50101077. I''m pretty sure Ushiromiya Battler also had a chance to commit the crime.@k@|@y@v10/50101078. ......After all, I was in the same room as the victims all night.@k@v10/50101079. There''s no way I''ll let you carry on this discussion while ignoring me.@k@v10/50101080. ......?!"'
38687: '@rAt that moment, an arrow twisted like a golden snake and hit me.'
38688: '@rIt didn''t pierce through me, but it slapped me hard on the cheek like a whip.'
38689: 'Chiester00@r@v37/53600027."Battler-sama, your right to speak has not yet been recognized.@k@v37/53600028. Be warned."'
38690: 'Battler@r@v10/50101081."......Oooww... Dammit......"'
38691: 'BEATRICE@r@v27/50700829."Yeah, I understand, Battler.@k@v27/50700830. ......And my apologies. Forgive me.@k@|@y@v27/50700831. ......Erika!@k @v27/50700832.You still haven''t shown an alibi for Battler!@k @v27/50700833.Battler is the man who was sleeping alongside the victims.@k@v27/50700834. Shouldn''t he be placed under the greatest suspicion of all?!"'
38692: 'LAMBDADELTA@r@v29/52200559."Beato''s right.@k@v29/52200560. You can''t go skipping Battler like that."'
38693: 'Erika@r@v46/54500962."My apologies.@k@v46/54500963. I had completely forgotten about him."'
38694: 'BEATRICE@r@v27/50700835."After Battler returned at 3 a.m., you went upstairs with him.@k@v27/50700836. And I believe you also went to your own room and slept.@k@v27/50700837. You may have gone to the cousins'' room at midnight, but I don''t think you went there after 3 a.m."'
38695: 'BEATRICE@r@v27/50700838."......Will you now claim that you went to crawl into Battler''s bed later on?@k @v27/50700839.*cackle*cackle*!@k @v27/50700840.Of course, if you tell me you were looking at Battler''s sleeping face all night long to confirm his alibi in the cousins'' room,@k@v27/50700841. I might just be willing to accept your proof...!"'
38696: 'Erika@r@v46/54500964."Yes. I listened to him breathing in his sleep all night long. Got a problem with that?"'
38697: 'BEATRICE@r@v27/50700842."......What......?!"'
38698: 'Erika@r@v46/54500965."I, Furudo Erika, can prove that Battler-san returned to the cousins'' room at 3 a.m.,@k@v46/54500966. that he went straight to bed afterwards, and that he went straight to sleep.@k@v46/54500967. And I can prove that until he woke up, noticed the gruesome situation the room was in, and let out a scream, nothing happened in that room."'
38699: 'Erika@r@v46/54500968."So you have no need to worry.@k@v46/54500969. Battler-san isn''t the culprit.@k@v46/54500970. He''s just the charming first discoverer who entered the murder scene without realizing it was one and slept until morning."'
38700: 'BEATRICE@r@v27/50700843."That''s insane...@k@v27/50700844. Even with those seals you love so much, it shouldn''t be possible for you to prove that...!@k @v27/50700845.How can you prove this?!!"'
38701: 'Battler@r@v10/50101082.".........It''s a load of crap.@k@v10/50101083. I entered that room alone.@k@v10/50101084. And Erika must have gone into her own room as well.@k@v10/50101085. How can she say something like that, as though she saw the whole thing...?!"'
38702: 'VIRGILIA@r@v30/53200244."She never said that she saw it.@k@|@y@v30/53200245. ......The room Erika was assigned to—where was it located?"'
38703: 'LAMBDADELTA@r@v29/52200561."Erika, tell me, please.@k@v29/52200562. How can you prove so much about Battler?"'
38704: 'BERNKASTEL@r@v28/52100561.".........*giggle*giggle*.@k@v28/52100562. I''d expect no less from a true detective......"'
38705: 'Erika@r@v46/54500971."My room was right next to the cousins'' room.@k@v46/54500972. There was only a single thin wall between them."'
38706: 'BEATRICE@r@v27/50700846."Y-@v27/50700847.......you don''t mean......@k@v27/50700848. ......You...put your ear against the wall...@v27/50700849....to check what was happening in the cousins'' room...?"'
38707: 'Erika@r@v46/54500973."Yes.@k@v46/54500974. My ears are perfect.@k@v46/54500975. Right after Battler-san entered the room, I put my ear against the wall and listened carefully to make sure nothing out of the ordinary occurred."'
38708: 'LAMBDADELTA@r@v29/52200563."......You said you could prove that nothing happened until Battler let out a scream the next morning...@k@v29/52200564. ......You don''t mean..."'
38709: 'Erika@r@v46/54500976."Yes.@k@|@y@v46/54500977. I put my ear against the wall and listened in on that room until morning, without sleeping a wink."'
38710: '@r...............Everyone...@w500.was stunned into silence.........'
38711: '@rShe put her ear against the wall...@w500....and for the entire time until morning...@w666......she listened to what was going on in Battler''s room......'
38712: '@rJust what would that have looked like......'
38713: '@rUntil dawn, she had silenced her breathing in a pitch-black room,@k clinging to the wall shared with the cousins'' room......'
38714: '@rLike some kind of creepy venomous spider clinging to the wall of a darkened room......'
38715: '@rBERNKASTEL alone was grinning in triumph.'
38716: 'BERNKASTEL@r@v28/52100563."......Due to the progression of the game, I realized that Battler, the one who had received the Head''s Ring, would be a key player.@k@v28/52100564. ......I was sure that Battler would be a victim of the first twilight."'
38717: 'Erika@r@v46/54500978."Yes.@k@v46/54500979. So, just as my master told me to do,@k@v46/54500980. ......I put my ear against the wall until morning without a wink of sleep, checking to make sure nothing unusual happened...!"'
38718: 'BERNKASTEL@r@v28/52100565."Erika has a photographic memory.@k@v28/52100566. And her hearing ability is on par with a tape recorder.@k@v28/52100567. ......It would have been impossible for Battler to kill George and the others and slit their throats without Erika hearing it."'
38719: 'LAMBDADELTA@r@v29/52200565."......It''s an accepted power of the detective''s authority.@k@|@y@v29/52200566. I have no choice but to acknowledge it.@k@v29/52200567. I''ll confirm it in red...!@k @v29/52200568.@|@y@c900.@[Ushiromiya Battler returned to the cousins'' room at 3 a.m. and fell asleep.@k@v29/52200569. After that, until the discovery of the crime, absolutely nothing out of the ordinary happened in the room!@]@c."'
38720: 'BERNKASTEL@r@v28/52100568.@|@y"@c900.@[In other words, it was impossible for Battler to commit murder or damage the corpses.@]@c."'
38721: 'BEATRICE@r@v27/50700850.".........nn...@v27/50700851....ggghh........."'
38722: '@rThe red from the two of them forced Beato to show an expression of considerable anguish...'
38723: '@rIt was only natural.'
38724: '@rThe red truth they had spoken not only guaranteed Battler''s alibi, but a number of other things as well.'
38725: '@rFirst off, it meant the murder was impossible for anyone after 3 a.m.'
38726: '@rAnd since the cousins were confirmed to be alive as late as midnight, the time period of the crime automatically became...@k"between midnight and three o''clock".'
38727: '@rThat also automatically provided a guaranteed alibi...@kfor everyone who wasn''t in the guesthouse before 3 a.m.'
38728: 'Gaap@r@v32/53700175.".........That one hurts...@v32/53700176....a lot........."'
38729: 'Ronove@r@v31/53100171."After midnight, Erika was in the guesthouse the whole time.@k@v31/53100172. So, it should have been difficult for her to prove alibis for all of the people in the mansion..."'
38730: 'Gaap@r@v32/53700177."It should have been almost impossible to prove alibis for Eva and the others.@k@v32/53700178. ...But now, all she has to do is prove that they never visited the guesthouse between midnight and 3 a.m.,@k@v32/53700179. and she can prove those alibis..."'
38731: 'BEATRICE@r@v27/50700852."......Anyway, we''ll have to construct it so that the murders were possible before 3 a.m.@k@v27/50700853. And we have to prove that it was possible for one of the people in the mansion to do it...!"'
38732: '@rThe people who were in the guesthouse all had alibis.@k@rThe crime didn''t occur before midnight.@k@rThe crime couldn''t have occurred after three o''clock.'
38733: '@rIn other words, there was no way for the murders to happen unless someone from the mansion committed the crime between midnight and three o''clock......'
38734: '@rIn order to protect Natsuhi, she had to establish that it was possible for someone other than Natsuhi to commit the crime.'
38735: '@rIronically, the witch had to prove that a Human could have committed the crime...'
38736: 'Battler@r@v10/50101086."............Still, that''s a tall order.@k@|@y@v10/50101087. ......Until 3 a.m., Erika was in the lounge.@k@v10/50101088. And you have to pass through there to get upstairs.@k@v10/50101089. In other words, she''s practically like a sentry for the upstairs floor of the guesthouse."'
38737: 'VIRGILIA@r@v30/53200246."......This is an unimaginative suggestion, but if it was possible to reach the upper floor without Erika noticing,@k@v30/53200247. we would probably be able to prove that the crime was possible for anyone."'
38738: 'Battler@r@v10/50101090."It''s probably possible for a Human to climb up to the second-story windows if they really wanted to."'
38739: '@rOf course, Beato had also thought of striking back that way.'
38740: '@r......And BERNKASTEL must have thought this as well.'
38741: 'BEATRICE@r@v27/50700854."Battler, Nanjo, Gohda, Kumasawa.@k@v27/50700855. We realize that the crime was impossible for all these people in the guesthouse.@k@|@y@v27/50700856. ......However, what about the Humans in the mansion?!"'
38742: 'Erika@r@v46/54500981."As I have already said, and as my master has even proclaimed with the red truth,@k@|@y@v46/54500982. I was in the lounge on the first floor of the guesthouse.@k@v46/54500983. And to reach the second floor, one must pass through the lounge.@k@v46/54500984. In other words, it was impossible to reach the second floor without me seeing it."'
38743: 'BEATRICE@r@v27/50700857."And what if that wasn''t impossible?@k @v27/50700858.@|@y@c279.@[For example, what if someone placed a ladder against the outer wall of the guesthouse and snuck in through a second-story window?!@k @v27/50700859.@|@yThere must be a way to reach the second floor without passing through the lounge!@k @v27/50700860.@|@yIf this is the case, it would be possible to reach the crime scene without you seeing it...!@]@c."'
38744: '@rBeato finally struck back.'
38745: '@rBefore now, she had let Erika take total control and attack her with the red over and over.'
38746: '@rDuring that time, Beato''s counterattacks with the blue truth had been few in number, even including this one...'
38747: 'Erika@r@v46/54500985."Of course, I knew you''d try saying that.@k@v46/54500986. I can''t have my lookout in the lounge become meaningless.@k@v46/54500987. So first, I must prove that my lookout was perfect."'
38748: 'Erika@r@v46/54500988."......Firstly, because of how the guesthouse is constructed,@k@v46/54500989. it is impossible to reach the second floor without me seeing it from the lounge.@k@v46/54500990. There are no places under cover, and neither are there any physical or mental blind spots.@k@|@y@v46/54500991. ......My master, I request you repeat!"'
38749: 'BERNKASTEL@r@v28/52100569.@|@y"@c900.@[It is impossible for someone to reach the second floor of the guesthouse without anyone in the lounge noticing it.@k@|@y@v28/52100570. ......Though of course, this only refers to reaching the second floor from inside the building.@]@c."'
38750: 'Erika@r@v46/54500992."<Good>, my master!@k @|@y@v46/54500993.......So, next is Lady BEATRICE''s theory that there might be a way to reach the second floor from the outside.@k@v46/54500994. This really does pose a problem.@k@v46/54500995. After all, there are trees that could probably be climbed, and someone could have used a ladder.@k@v46/54500996. We also can''t be certain that crawling up the rain gutter would be impossible.@k@v46/54500997. But I can''t let you do that."'
38751: 'BEATRICE@r@v27/50700861."Hoh, you won''t let me...?@k @v27/50700862.And how''s that?@k@v27/50700863. Did you stay up all night circling the guesthouse?@k @|@y@v27/50700864.No, you couldn''t do that, could you?@k @v27/50700865.You were in the lounge...!@k @v27/50700866.From the lounge, you can only see a small part of the outer perimeter through the window!"'
38752: 'Erika@r@v46/54500998."That''s true.@k@v46/54500999. I couldn''t prevent all methods of climbing up to the second floor from the outside.@k@|@y@v46/54501000. ......However, I was able to prevent all entry from the second floor."'
38753: 'BEATRICE@r@v27/50700867."Prevent...entry...?!"'
38754: 'Ronove@r@v31/53100173."......I had already foreseen this move.@k@v31/53100174. ......Frightening......and so persistent...!"'
38755: 'Erika@r@v46/54501001."Because of how the guesthouse is constructed, the only method of entry from the second floor is the windows."'
38756: 'Erika@r@v46/54501002."The locks? They don''t matter at all.@k@v46/54501003. I only had to prove that none of the windows or shutters were opened even once."'
38757: 'Erika@r@v46/54501004."After I witnessed the location of the hidden gold, I returned to the guesthouse...@k@v46/54501005.and immediately began severing all methods of entry to the second floor that didn''t pass through the lounge.@k@v46/54501006. .........Yes, it''s exactly the same.@k@v46/54501007. No different from the rest...!"'
38758: 'LAMBDADELTA@r@v29/52200570."......Don''t tell me...@k@v29/52200571.you used that seal of yours......on all the windows of the guesthouse......?@k @v29/52200572.In that weather, ......dressed like that...?"'
38759: 'Erika@r@v46/54501008."Well, I did have my swimsuit from when I drifted here."'
38760: 'Battler@r@v10/50101091.".........She''s insane......@k@v10/50101092. ...At a house where she was welcomed as a guest, before anything had happened at all, she went out in all that rain,@k@v10/50101093. and did something like that......?"'
38761: 'VIRGILIA@r@v30/53200248."For a normal Human, it would certainly be an impossibly dubious action.@k@|@y@v30/53200249. ......However, she is the witch''s piece."'
38762: '@rIn the middle of all that rain,@k Erika sealed all the windows from the outside...@k...to create an alibi showing that no one could have snuck into the guesthouse from the outside.'
38763: '@rShe climbed up the walls herself, ......and did that to all the windows on the first and second floor.@k@rNo, to all things which could possibly have permitted entry.'
38764: '@rAfter hearing that she''d listened to the cousins'' room all night long without sleeping a wink,@k even this bizarre behavior didn''t seem quite so impossible......'
38765: '@rThat had probably also......looked like a venomous spider.'
38766: '@rA repulsive venomous spider crawling eerily over the outer walls of the guesthouse in the middle of a storm......'
38767: 'Natsuhi@r@v03/50900943.".........You...@v03/50900944. ......Just what do you think...@v03/50900945....of the house of Ushiromiya...?@k@v03/50900946. Is this how you repay us for welcoming you as a guest...?!"'
38768: 'Erika@r@v46/54501009."To the detective, the Ushiromiya house is nothing more or less than the stage upon which the crime occurs.@k@v46/54501010. ......Before the outbreak of the crime, it was important for me to memorize the names of the characters, memorize the lay of the land,@k@v46/54501011. and prepare for the upcoming crime by devoting my time towards collecting and creating all possible alibis."'
38769: 'Erika@r@v46/54501012."From my perspective, detectives who make no preparations before the outbreak of the crime are pretty third-rate.@k@v46/54501013. After all, we all know that someone will die wherever we spend the night."'
38770: 'BERNKASTEL@r@v28/52100571.".........Furthermore,@k@v28/52100572. at the moment the crime was discovered, Erika confirmed that none of those seals had been broken.@k@v28/52100573. That''s why Erika wasn''t the first one to reach the cousins'' room when the corpses were discovered."'
38771: 'BERNKASTEL@r@v28/52100574."Even without inspecting the corpses, she could be certain of several things thanks to the red truth.@k@v28/52100575. It was more important to check the seals and construct alibis."'
38772: 'Erika@r@v46/54501014."You are perfect, my master.@k@v46/54501015. All I did was prove everything to perfection by following your orders...!"'
38773: 'BERNKASTEL@r@v28/52100576."Well done, Erika.@k@v28/52100577. My double, my piece...!@k @v28/52100578.What do you think, Lambda?@k @v28/52100579.I''d say this proves that Erika''s lookout in the lounge contains absolute reliability as far as constructing alibis is concerned..."'
38774: 'LAMBDADELTA@r@v29/52200573."......Yeah, I''ll acknowledge that.@k@v29/52200574. Erika, your seal is perfect.@k@v29/52200575. I''ll acknowledge it in red.@k @|@y@v29/52200576.@c900.@[It was impossible to reach the second floor of the guesthouse without passing through the lounge,@k@v29/52200577. and impossible to reach it at all without Erika, who was in the lounge, knowing about it!@]@c."'
38775: 'Erika@r@v46/54501016."Thank you very much, Lady LAMBDADELTA...!@k @|@y@v46/54501017.So, you know what''s coming next, Great Lady BEATRICE!@k @v46/54501018.@|@y@c279.@[Therefore, the time of the crime is limited to the single hour between midnight, when they were confirmed to be alive,@k@v46/54501019. @|@yand 1 a.m., when our party in the lounge started!@]@c."'
38776: 'BEATRICE@r@v27/50700868."Ug...@v27/50700869....gah...@v27/50700870....ah......"'
38777: 'Erika@r@v46/54501020."I''ve already said it, but at midnight, I went down to the lounge,@k@v46/54501021. hit it off with Doctor Nanjo, and was engrossed by a discussion of the mystery genre in the archive until 1 a.m."'
38778: 'Erika@r@v46/54501022."......It''s a bit embarrassing, but I grew so engrossed with this discussion...@k@v46/54501023.that I wouldn''t have noticed if anyone had passed through the corridor during that period.@k@v46/54501024. ......Quite a regretful mistake for a detective."'
38779: '@rAfter doing all that maneuvering and setting up seals to guarantee a perfect alibi,@k she became too engrossed in a mystery discussion and left an opening......?'
38780: '@rHer relaxed smile was completely shameless, the total opposite of her words.'
38781: '@rIt almost seems like it''s the other way around.'
38782: '@rIt''s enough to make you think that this is an intentional trap,@k said in full awareness that only Natsuhi doesn''t have an alibi for the hour following midnight...'
38783: 'Erika@r@v46/54501025."To put it the other way around, this has the following corollary:@k@v46/54501026. the only ones who could have reached the cousins'' room and committed the crime...are those who have no alibi between midnight and 1 a.m.!"'
38784: '@rHer eyes clearly hinted that Natsuhi was the only one who fit this description...'
38785: '@r......It had been a crime that occurred at a completely unknown point during that long night.'
38786: '@rBut because of the alibis Erika had constructed,@k that time period had been compressed and restricted to the single hour following midnight.'
38787: '@rErika left the cousins'' room at midnight.@k@rThis is the last time we have confirmation that George and the others were alive.'
38788: '@rAnd after the party in the lounge started at 1 a.m,@k it was impossible to reach the cousins'' room by any method.'
38789: 'Gaap@r@v32/53700180."............All this from a mere Human......"'
38790: 'Ronove@r@v31/53100175."This is quite bad...@k@v31/53100176. The night has been sealed up into an hour, ......and at this rate, there won''t be many pieces left to suspect..."'
38791: 'BEATRICE@r@v27/50700871."......Damn you, Lady BERNKASTEL...@k@v27/50700872. ...Not bad at all........."'
38792: 'BERNKASTEL@r@v28/52100580."Unlike Battler, I''m not an idiot.@k@|@y@v28/52100581. ......After this game''s repeated five times, I have more than enough cards in my hand.@k@v28/52100582. ......@v28/52100583.@|@y*giggle*giggle*giggle*giggle*!!"'
38793: 'Erika@r@v46/54501027."Then let us continue.@k@v46/54501028. Let''s examine the alibis of the remaining suspects, the people in the mansion.@k@v46/54501029. After all, we only have to worry about the single hour between midnight and 1 a.m.@k@v46/54501030. That shouldn''t be difficult at all."'
38794: 'Erika@r@v46/54501031."First, midnight.@k@v46/54501032. At this time, Natsuhi, Krauss, and Genji were in the second floor corridor, and all of the others were in the first floor dining hall.@k@v46/54501033. This has already been given in red truth by my master!"'
38795: 'BERNKASTEL@r@v28/52100584."Yes, that''s right.@k @v28/52100585.@|@y@c900.@[At 24:00, Natsuhi, Krauss, and Genji were in the corridor on the second floor of the mansion.@k@v28/52100586. The rest of them were in the dining hall on the first floor.@]@c.@k@v28/52100587. And as you know, there was a mysterious knock, and a letter with the One-winged seal on it appeared.@k@v28/52100588. The discussion surrounding that continued on until 1 a.m.@k@v28/52100589. I will say it with the red truth.@k@v28/52100590. @|@y@c900.@[Of all the people in the dining hall, not one of them left the dining hall until 1 a.m....!@]@c."'
38796: '@rThe time that the crime was possible had been limited to between midnight and one o''clock.'
38797: '@rAnd it had been guaranteed that the adults in the family conference did not leave the mansion between midnight and one o''clock.@k This gave them all proven alibis.'
38798: 'BEATRICE@r@v27/50700873."......A-......and how do you intend to prove that?!@k @|@y@v27/50700874.Erika''s in the guesthouse!@k @v27/50700875.Did someone prove it by using one of your favorite seals on the dining hall door?!@k @v27/50700876.You have no convincing evidence or proof...!!"'
38799: 'BERNKASTEL@r@v28/52100591.@|@y"@c900.@[The red truth is simply truth, and there is no need to provide evidence, proof, or room for a counterargument!!@]@c.@k @v28/52100592.......You made that rule.@k@v28/52100593.@|@y *cackle*cackle*cackle*giggle*giggle*giggle*ehehehehehahahahahahahahahahaha...!!"'
38800: '@rThis overbearing red truth hadn''t only given alibis to the adults in the dining hall.'
38801: '@rIt also gave alibis to Shannon and Kanon, who had come to serve tea,@k and even guaranteed that they never left the dining hall.'
38802: '@rIn other words, ......the only ones who didn''t have proven alibis......@kwere three people: Natsuhi, Krauss, and Genji...'
38803: '@rNo, ......there were only two left.'
38804: '@rIf alibis were proven for Krauss and Genji,@k it would prove that no one but Natsuhi could have been the culprit...!'
38805: 'Erika@r@v46/54501034."Let''s move on to Genji.@k@v46/54501035. He''s a victim, but we can''t rule out the possibility that he committed the crime in the cousins'' room and then was killed himself."'
38806: 'Erika@r@v46/54501036."And furthermore, although he was in the second-floor corridor at midnight,@k@v46/54501037. he then returned to the servant room to transfer the phone call for Natsuhi and was completely isolated."'
38807: 'BEATRICE@r@v27/50700877."Which means that it was possible for Genji to commit the crime—"'
38808: 'BERNKASTEL@r@v28/52100594."I''ll say it in red.@k @v28/52100595.@|@y@c900.@[When Genji finished transferring the call, he immediately returned to the servants'' quarters.@]@c.@k@v28/52100596. That''s just a cold, hard truth, without any evidence, proof, seals or alibis, got it?"'
38809: 'Erika@r@v46/54501038."Then, at 1 a.m.,@k@v46/54501039. there was another break in the family conference, and Rosa returned to the guesthouse.@k@v46/54501040. ......At that time...@k@|@y@v46/54501041. I''m truly thankful for your cooperation, Ushiromiya Eva-san.@k@v46/54501042. Please rise...!"'
38810: 'Eva@r@v05/51000336.".........Erika-chan wasn''t the only one, you know?@k @|@y@v05/51000337.I was also certain that something would happen that night."'
38811: 'Erika@r@v46/54501043."She''s the person who taught me how to make those seals.@k@v46/54501044. And she helped me to check the alibis of those people under suspicion...!"'
38812: 'Eva@r@v05/51000338."During the break at 1 a.m.,@k@v05/51000339. I went to Genji-san''s quarters and used the same seal as Erika-chan...!@k @v05/51000340.In other words, if this wasn''t broken,@k@v05/51000341. it would mean that no one could have entered or left that room between 1 a.m. and the next morning...!!"'
38813: 'Erika@r@v46/54501045."Now, Kanon-san and Kumasawa-san.@k@v46/54501046. Please rise."'
38814: '@rKanon rose expressionlessly, and Kumasawa got to her feet timidly.'
38815: 'Erika@r@v46/54501047."In the morning,@k@v46/54501048. you two went to wake Genji-san because he had slept in, right?@k @v46/54501049.And at that time, you noticed that the door was sealed, broke the seal, and opened the door, correct?"'
38816: 'Kumasawa@r@v18/51800086."......Y-...yes.@k@v18/51800087. ......I thought it was some kind of prank."'
38817: 'Kanon@r@v16/50600083."I didn''t think deeply about it at the time."'
38818: 'Erika@r@v46/54501050."I''m not asking for your opinions. Just give us the facts.@k@v46/54501051. Did you break the seal when you entered the room?"'
38819: '@r@v00/awase5008.""Y-yes...""'
38820: 'BERNKASTEL@r@v28/52100597."With the red truth, I''ll guarantee that Eva, Kanon, and Kumasawa''s statements just now are the truth.@k @v28/52100598.@|@y@c900.@[At 1 a.m., Eva sealed Genji''s sleeping quarters, and that seal was broken by Kanon and Kumasawa in the morning when the crime was discovered.@]@c.@k@|@y@v28/52100599. Just to save time, I''ll add on some more."'
38821: 'BERNKASTEL@r@v28/52100600.@|@y"@c900.@[During the short break at 1 a.m., the first two to leave the dining hall were Rosa and Eva.@k@v28/52100601. Until Eva returned, everyone in the dining hall remained there.@k@v28/52100602. After seeing Rosa off, Eva went to the sleeping quarters and sealed it.@k@v28/52100603. Of course, she did not enter the room at all at this time.@]@c."'
38822: 'Erika@r@v46/54501052."This is all information I discovered by gathering it from the people involved.@k@v46/54501053. These are not baseless red truths.@k@v46/54501054. They are truths I arrived at through proper reasoning constructed from testimony.@k@v46/54501055. And not only testimony—I took fingerprints and performed every kind of forensic test available to me."'
38823: 'Erika@r@v46/54501056."After all, Kinzo-san''s study is a treasure trove of all kinds of chemicals!@k @v46/54501057.I obtained all sorts of scientific evidence, which is truth in its purest form and infinitely close to red truth.@k@v46/54501058. However, this isn''t a science mystery, so I''ll spare you the details."'
38824: '@rAs Erika swaggered around the cathedral, she arrogantly touted her scientific knowledge.'
38825: '@rShe had thorough knowledge of all the chemicals in Kinzo''s study and had used them to conduct a scientific investigation,@k which had now been acknowledged and made into red truth by BERNKASTEL.'
38826: '@r......Without going into too much detail, the results she had obtained would have been convincing even without the red truth.'
38827: '@rFingerprint collection with aluminum powder.@k@rComposition analysis on the mud under people''s shoes. Various chemical reactions from clinging rain water.'
38828: '@r......Erika had walked in and out of the study that didn''t belong to her several times,@k using all manner of chemicals however she pleased without asking the family''s permission.'
38829: '@rHowever, no one could fault her for this.@k@rThe pieces couldn''t hinder any action the detective might take for the investigation.@k@rThat was the power of the detective''s authority.'
38830: 'BEATRICE@r@v27/50700878."............You act like you own the place...@k@v27/50700879. ......From now on, I''ll warn everyone I meet never to welcome in any guest who calls themselves a detective."'
38831: 'Erika@r@v46/54501059."I believe that would be wise.@k@v46/54501060. Giving shelter to a detective is just about the worst omen of misfortune out there."'
38832: 'BERNKASTEL@r@v28/52100604.".........This is proof...@k@v28/52100605.that it was only possible to reach Genji''s sleeping quarters and commit the crime...@k@v28/52100606.between midnight and 1 a.m, just as with the murders in the guesthouse.@k@v28/52100607. And furthermore, Erika''s investigation also proved that it was impossible for Genji to reach the cousins'' room."'
38833: '@rIt had already been made clear in red truth that, after transferring the phone call to Natsuhi,@k Genji had gone straight back to the servants'' quarters.'
38834: '@rNow, based on the results of Erika''s scientific investigation, they added a further red truth:@k @|@y@c900.@[Genji never left the mansion after 24:00...@]@c.'
38835: '@rThis made it clear beyond doubt that Genji couldn''t have reached the guesthouse,@k much less the cousins'' room......'
38836: 'LAMBDADELTA@r@v29/52200578."That leaves......only Krauss and Natsuhi...!@k @v29/52200579.All other people have had their alibis proven!!"'
38837: 'Natsuhi@r@v03/50900947."......Im...@v03/50900948....possible.........@k@v03/50900949. ...............—"'
38838: '@rNatsuhi''s mouth flapped open and shut like a goldfish starved of oxygen.'
38839: '@rAnd that was an accurate analogy.'
38840: '@r......Natsuhi''s mind was blank and spinning out of control, and she felt as though she really would suffocate.'
38841: 'BERNKASTEL@r@v28/52100608."......Ushiromiya Natsuhi.@k@v28/52100609. ......I''ll give you one last chance.@k@v28/52100610. Confess that all of the crimes were the work of your husband."'
38842: 'Natsuhi@r@v03/50900950."D-......don''t be ridiculous!!@k @v03/50900951.Do I look like the kind of woman who would falsely accuse her husband?!!"'
38843: 'BERNKASTEL@r@v28/52100611."......Beato.@k@v28/52100612. Natsuhi''s denied it.@k@v28/52100613. I''ll give you the same chance.@k@|@y@v28/52100614. ......You understand, right?@k @v28/52100615.......Please don''t tell me...@k@v28/52100616.that you expect to be able to take advantage of the fact that Krauss is missing to try and pull a Devil''s Proof on me......"'
38844: 'BEATRICE@r@v27/50700880.".........gah, ghh............"'
38845: '@rBeato realized that they were rapidly approaching the end of this battle.'
38846: '@rNormally, these alibis of Erika''s would still have many places that Beato could argue against using the blue truth.'
38847: '@rHowever, all of those alibis had been accepted by BERNKASTEL and LAMBDADELTA as red truth,@k and Beato no longer had any room to argue......'
38848: 'Battler@r@v10/50101094."......It''s like.........Erika''s creating the plotline,@k@v10/50101095. and those witches are distorting things so that everything matches up with it..."'
38849: 'VIRGILIA@r@v30/53200250."That''s right.@k@v30/53200251. If the Game Master, Lady LAMBDADELTA, accepts a truth, its authenticity will not be questioned.@k@v30/53200252. The world that comes after will be formed based on the truth that remains in the end.@k@v30/53200253. ......This happens no matter how far this final truth is from the real truth."'
38850: 'Battler@r@v10/50101096."There''s no way Uncle Krauss is the culprit.@k@v10/50101097. He''s being held prisoner somewhere.@k@|@y@v10/50101098. ......W-wait,@k@v10/50101099. we can''t deny the possibility that Aunt Natsuhi was skillfully tricked into believing that during the phone call......"'
38851: 'VIRGILIA@r@v30/53200254."Do you suspect Natsuhi and Krauss, Battler-kun?"'
38852: 'Battler@r@v10/50101100."Well............"'
38853: 'VIRGILIA@r@v30/53200255."Erika''s truth has been constructed in a cowardly fashion, but it is a proper truth.@k@v30/53200256. She may be colluding with a witch, but it has still been acknowledged as red truth.@k@v30/53200257. In other words, it cannot be a fake truth built only on lies."'
38854: 'VIRGILIA@r@v30/53200258."......This means that even Erika''s truth makes sense.@k@v30/53200259. The truth about Natsuhi and Krauss being the culprits is also very possible.@k@v30/53200260. It may be a hollow truth, but it is consistent.@k@v30/53200261. ......It''s a fiction that holds the same worth as truth.@k@v30/53200262. ......Which of those two truths will you believe?@k@v30/53200263. That is for you to decide."'
38855: 'Battler@r@v10/50101101.".........No.@k@v10/50101102. ......I''ll...............trust Aunt Natsuhi...and Uncle Krauss.@k@v10/50101103. I realize that they''re in some money trouble."'
38856: 'Battler@r@v10/50101104."But even so, ......I don''t want to believe that they''re the culprits.@k@v10/50101105. No, I can''t believe it...!"'
38857: 'VIRGILIA@r@v30/53200264."How do you intend to get Natsuhi out of this position, where she''s so cornered by red which is slowly but surely closing in on her?"'
38858: 'Battler@r@v10/50101106."I, ......I don''t know......@k@v10/50101107. But I......seriously don''t want to give up...!@k @v10/50101108.Aunt Natsuhi''s been caught in a cowardly trap, that''s all.@k@v10/50101109. ...And Erika''s reasoning is all part of it...!@k @v10/50101110.So whether it''s intentional or she''s being manipulated, Erika is aiding the true culprit."'
38859: 'Battler@r@v10/50101111.".........Even if Erika has accused Aunt Natsuhi of being the culprit, ......and even if everyone else here believes that,@k@v10/50101112. ......that''s exactly why I want to be the one person who trusts her...!"'
38860: '@rIf everyone assumes it''s true, does it become the truth?@k@rIf everyone accepts a lie, does it become the truth?'
38861: '@rMust the solitary truth-teller...@kbe dragged to the guillotine to the jeers of liars?'
38862: 'Battler@r@v10/50101113."I......don''t like it.@k@v10/50101114. ......If no one will believe Aunt Natsuhi, then I will...!!"'
38863: 'Battler@r@v10/50101115."Real truth isn''t something that''s determined when everyone thinks something sounds reasonable!@k @v10/50101116.It''s something you arrive at after thoroughly investigating both possibilities...!@k @v10/50101117.So this trial is a downright lie!@k @v10/50101118.It''s a kangaroo court that exists for no reason other than to set Aunt Natsuhi up as the culprit!!"'
38864: 'VIRGILIA@r@v30/53200265."......Beato is doing all she can to plead Natsuhi''s case, you know."'
38865: 'Battler@r@v10/50101119."Wrong.@k@v10/50101120. Beato is trying to refute Erika''s argument.@k@v10/50101121. ......She''s just defending!@k @v10/50101122.You can''t fight in this trial by simply resisting all of your opponent''s claims.@k@v10/50101123. This is why Beato always cornered me in the past...!"'
38866: 'Battler@r@v10/50101124."She isn''t going to beat Erika by finding flaws in her reasoning!@k @v10/50101125.She has to find a different truth and show LAMBDADELTA, the ruler of this game...@k@v10/50101126....@v10/50101127.@|@ythat her truth is more correct than Erika''s...!!"'
38867: 'VIRGILIA@r@v30/53200266."Without violating any of the red truths that Lady BERNKASTEL has shown,@k@v30/53200267. can you weave together a truth where Natsuhi isn''t the culprit......?"'
38868: 'Battler@r@v10/50101128."......I, ......I don''t know...@k@v10/50101129. But, .......as long as I don''t believe that Aunt Natsuhi is the culprit, there''s got to be a different truth!"'
38869: 'Battler@r@v10/50101130."I don''t even care if the culprit for the crime ends up being a witch.@k@v10/50101131. That''s better than having Aunt Natsuhi be framed by an incorrect truth...!!"'
38870: 'VIRGILIA@r@v30/53200268.".........So, no matter how much red truth you are shown,@k@v30/53200269. you won''t believe that Natsuhi is the culprit, correct?"'
38871: 'Battler@r@v10/50101132."Yeah......!@k @v10/50101133.For everything, there should always be some people who believe and some who don''t...!@k @v10/50101134.No matter how much evidence is stacked up against her, someone has to believe that she''s innocent!@k @|@y@v10/50101135.I''m sure there are countless truths in the world that can''t be proven with evidence.@k@v10/50101136. I don''t ever want to accept that something''s true just because everyone says it is!!"'
38872: '@rHow can you be sure that there''s nothing on the far side of the moon if you''ve never seen it?!'
38873: '@rIs there some reason that you have to believe it?!'
38874: '@rUntil you see the far side of the moon with your own eyes,@k you can''t rule out the possibility that nothing is there,@k and neither can you rule out the possibility of a thriving culture of space bunnies...!'
38875: '@rYou should never assume something is the truth until you actually check it.'
38876: '@rThis court is maliciously trying to force a single interpretation on a truth that can''t be checked.'
38877: '@rI once believed there was a society on the far side of the moon!!'
38878: '@rBut that was in elementary school, and I was made fun of and laughed at.@k So I thought it was embarrassing to think that a society lives on the moon......@k...and I threw away that belief.'
38879: '@rI''d been told by a book my mom read me that rabbits lived on the far side of the moon,@k and I believed that for a long, long time.'
38880: '@r......But when everyone said that was wrong,@k I abandoned that truth without even trying to check it!'
38881: '@r......Even without evidence,@k I abandoned the truth I believed in......!'
38882: '@rAnd now, everyone is starting to believe that Aunt Natsuhi is the culprit.'
38883: '@rEven though not a single piece of decisive proof has been shown...!'
38884: '@rThere''s no proof, but Erika''s words sound reasonable, so they''re probably the truth......?@k That''s your reason to abandon your belief that Aunt Natsuhi is innocent?!'
38885: 'Battler@r@v10/50101137."If no one else will believe, ......then I will...!@k @v10/50101138.I believe that real truth only surfaces if you look with both eyes, one denying and one affirming...!!@k @v10/50101139.No matter how much they try to make Aunt Natsuhi out to be the culprit, it''s my belief that she isn''t!@k @v10/50101140.And I''ll never give that up!!"'
38886: 'VIRGILIA@r@v30/53200270."...............I understand.@k@v30/53200271. Then allow me to grant you a single red truth.@k@|@y@v30/53200272. This is the single bit of power I will give you, now that you hold the will to fight in the truest sense."'
38887: 'Battler@r@v10/50101141."Power.........?"'
38888: 'VIRGILIA@r@v30/53200273."By the name of the Finite Witch VIRGILIA,@k@v30/53200274. .........no, as the former witch BEATRICE, I grant you this red truth."'
38889: 'VIRGILIA@r@v30/53200275.@|@y@a1666."@c900.@[Ushiromiya Natsuhi is not the culprit!@]@c."'
38890: 'Battler@r@v10/50101141_b."............!!!!"'
38891: 'BERNKASTEL@r@v28/52100617."Plea bargain.@k@v28/52100618. ......If you acknowledge that Krauss is the culprit,@k@v28/52100619. Erika will cease her pursuit of Natsuhi.@k@v28/52100620. From then on, the investigation will proceed assuming that Krauss, whose location is unknown, is the culprit."'
38892: 'LAMBDADELTA@r@v29/52200580."What''ll you do, Beato?@k @v29/52200581.At this rate, Natsuhi''s in serious trouble, right?@k @v29/52200582.......Will you accept the plea bargain?@k @v29/52200583.If you''re willing to abandon this Ushiromiya family honor thing, Bern says she''ll let you off with a draw.@k@v29/52200584. She''s being really soft on you, you know...?"'
38893: '@rKrauss was currently missing, and it was unknown whether he was alive or dead.@k@rLike Kinzo, he was no different than a "cat in a box" that had disappeared into the mists of the island.'
38894: '@rThe cat in the box is a creature of infinite variation; no interpretation of it can be denied.'
38895: '@rIt is the root of endless interpretations.@k The true source of the Endless Witch''s power.'
38896: '@rIn other words, no matter how much BERNKASTEL were to claim that Krauss was the culprit,@k ......she wouldn''t be able to make that the sole truth.'
38897: '@rThat is, the Krauss culprit theory and the witch theory could exist in almost perfect balance.'
38898: '@r......Beato could make the game a draw.'
38899: '@rBERNKASTEL was......tempting her.@k She was offering her a second chance if she would abandon the honor of the family she''d sworn to protect...@kand consent to weaving a fragment that would trample all over that honor.'
38900: '@rThere was no room for false confidence.@k For Beato, to lose was to die.'
38901: '@r......Unless she could see herself having an overwhelming advantage in this game, the right move had to be to actively pursue a draw.'
38902: 'BEATRICE@r@v27/50700881."......Mmg.........ugh........."'
38903: 'Natsuhi@r@v03/50900952."I will not allow you to call my husband a killer!!@k @v03/50900953.My husband is the next in line to the Ushiromiya family headship!!@k @v03/50900954.The one person who will inherit the glory of the Ushiromiya family!@k @v03/50900955.I will never allow you to brand him as a criminal...!!"'
38904: 'BEATRICE@r@v27/50700882."......Are you sure, Natsuhi......?@k@v27/50700883. .........If you refuse to suspect Krauss, ......then...you''ll be the only one left.@k@|@y@v27/50700884. ...Alibis have been proven for everyone else, ......in other words, Hempel''s Raven...!@k @v27/50700885.Even without any evidence, ...it will be determined that you are the culprit...!"'
38905: 'Natsuhi@r@v03/50900956."And so what if I''m the only one left?!@k @v03/50900957.I am Ushiromiya Natsuhi!!@k @v03/50900958.I will not run or hide!@k @v03/50900959.I am innocent!!@k @v03/50900960.And I am the representative of the noble head, with the One-winged Eagle engraved into my heart!!"'
38906: 'Natsuhi@r@v03/50900961."If you wish to insult me, go ahead!@k @v03/50900962.If you wish to ridicule me, do as you please!!@k @v03/50900963.But none of you can damage my honor with fiction!!"'
38907: '@rWith a dignified voice, ......Natsuhi stated her case openly before the witches above her.'
38908: '@rHowever, this response of hers...@kmight have been exactly what BERNKASTEL had intended...'
38909: 'BERNKASTEL@r@v28/52100621."......Natsuhi refuses the deal.@k@v28/52100622. .........And you, Beato?@k @|@y@v28/52100623....You understand, right?@k @v28/52100624.The instant Natsuhi is singled out, Lambda will deliver her verdict.@k@v28/52100625. As soon as that happens, the witch illusion will be denied, and you''ll vanish into mist.@k@v28/52100626. ......Do you plan to let Natsuhi''s foolish stubbornness drag you down to the depths of hell...?"'
38910: 'BEATRICE@r@v27/50700886."...............nn............gah........."'
38911: 'Gaap@r@v32/53700181."......Riiche.@k@v32/53700182. You fought well.@k@v32/53700183. ......Now''s the time to withdraw.@k@v32/53700184. Convince Natsuhi and try to work out a compromise...!"'
38912: 'Ronove@r@v31/53100177."Both Lady LAMBDADELTA and Lady BERNKASTEL have boredom, not you, as their true enemy.@k@v31/53100178. ......I imagine they would like to play this game over again.@k@v31/53100179. If they see that you''re willing to make a concession, they will most likely accept it gladly...@k@v31/53100180.and move on to the next game."'
38913: 'BEATRICE@r@v27/50700887."If we move on to the next game, .........then what will happen to the Natsuhi of this game,@k@v27/50700888. ......the Natsuhi of this fragment......?"'
38914: 'Gaap@r@v32/53700185."Now isn''t the time to be worrying about that!@k @v32/53700186.Natsuhi is just a piece!@k @v32/53700187.Even if she gets removed from this game, she''ll show up again in the next one!"'
38915: 'Ronove@r@v31/53100181."But the same does not hold for you, Milady...@k@v31/53100182. Through this game, I believe you have learned the moves that Lady BERNKASTEL has up her sleeves.@k@v31/53100183. It''s a more realistic goal to make use of that and aim for victory in the next game instead.@k@v31/53100184. ......Accepting Lady BERNKASTEL''s deal might be your one and only good option right now...!"'
38916: 'Gaap@r@v32/53700188."Throw away that useless pride of yours!!@k @v32/53700189.Neither Kasparov nor Deep Blue won every game!@k @v32/53700190.The person that wins more games wins in the end, right?!@k @v32/53700191.If a witch gets too attached to a single match, a single life, a single piece,@k@v32/53700192. ......that witch dies!!"'
38917: 'BEATRICE@r@v27/50700889."............My apologies,@v27/50700890. .........but I cannot do that.@k@v27/50700891. .........I know the strength of a man who believed even though everyone said he was wrong,@k@v27/50700892. ......and I know the suffering he went through when he was forced to abandon that belief...!"'
