33719: '@rAfter dashing to her bedroom, Jessica answered the phone call that had been transferred there.'
33720: 'Jessica@r@v04/50200001."Ah, hello?!@k @v04/50200002.Sorry to keep you waiting!@k @|@y@v04/50200003.Battle~r!@k @v04/50200004.What d''ya think you''re doing, not contacting us for six years?!@k @v04/50200005.How''s it goiiiiiiiing?!@k @v04/50200006.Oh, really?@k @v04/50200007.How the hell would I know?!@k@v04/50200008. Cram it, you jackass! Ahhahahahahahaha!@k @v04/50200009.So you''ll be coming to this year''s family conference?@k @v04/50200010.It''s been six years!"'
33721: '@rFive businessmen in expensive suits were visiting in the parlor,@k giving Krauss and Natsuhi a progress report on their business.'
33722: '@rSpread out on the table were the blueprints and designs for a building, as well as documents related to expenditures and the like...@kso packed that even a tea cup would have gotten in the way.'
33723: '@rOfficially, they were here to give Krauss a progress report,@k ......but in actuality, Krauss had called them all the way over to Rokkenjima so that Natsuhi could hear from them directly.'
33724: '@rThis was because Natsuhi needed to hear someone other than her husband explain what condition their business was in.'
33725: '@r......In short, even though another family conference without Kinzo was approaching,@k their business had not yet earned them any money.'
33726: '@rAfter telling the guests to wait for a short while and make themselves at home,@k Krauss took Natsuhi out into the hall and once again summarized the situation...'
33727: 'Krauss@r@v02/50800169."......In short, they are saying that the business is proceeding much better than we imagined it would.@k@v02/50800170. This is where that personal connection between me and the governor is really starting to pay off!@k @v02/50800171.There is no possible way for this catch to get away from us now.@k@v02/50800172. To the contrary, it''s growing so big that in one go, we''ll be able to regain not just that power of attorney, but everything we''ve lost up to this point as well!"'
33728: '@rKrauss spoke passionately.'
33729: '@r......This made things seem all the more suspicious to Natsuhi,@k but this time, at least, she had to admit that everything really did seem to be going well.'
33730: '@rCertainly, this business Krauss boasted of had expanded in scope over the last year,@k and was promising an even greater payoff than had been anticipated in the beginning.'
33731: '@rInvestors were gathering, jumping on the bandwagon of their own accord, and the business was rapidly gathering funds.'
33732: '@rIt was a perfect example of the saying "money makes money".'
33733: '@rThis was probably the greatest success of Krauss''s life so far.@k ......No, it probably would become his greatest success yet.'
33734: '@rThat point was where Natsuhi''s misgivings lay.'
33735: '@rTrue, it was certain, and as Krauss had said, they wouldn''t lose this catch now.'
33736: '@rHowever, .........the fish on the line had gotten too big.'
33737: 'Krauss@r@v02/50800173."We''ll definitely be able to reel this fish in.@k@v02/50800174. There''s no need to rush.@k@v02/50800175. It''s such a success that I wish I could show it to Dad to be praised, if he were still alive...!"'
33738: 'Natsuhi@r@v03/50900301."Yes, I know.@k@v03/50900302. However, I believe you made me a promise last year.@k@v03/50900303. You said you were sure you could manage something within a year...!"'
33739: '@rA pained look rose to Krauss''s face.@k They certainly had hooked a fat fish that guaranteed a great success.'
33740: '@rHowever, it would require an appropriate amount of time to reel it in......'
33741: '@rNatsuhi pressed Krauss, asking if there was any way for them to make money before this year''s family conference,@k but Krauss kept saying that he needed just one more year...'
33742: '@rKrauss planned to use this unprecedented success...@kas a springboard to future endeavors.'
33743: '@rBecause of this, he didn''t want to do anything that would raise suspicions by making it seem like they were rushing to get money...'
33744: '@rCertainly, fortune tends to turn against people who take it for granted even in the slightest.@k@rThere''s a saying about hasty anglers......'
33745: '@rOn many occasions before now, Krauss had gotten cold feet and sold businesses that would surely have brought in a profit had he just waited,@k and had, in effect, given away his winning picks.'
33746: '@rNatsuhi also knew this.@k@rShe knew that guts were the thing her husband lacked most.'
33747: '@rThat was why she was unable to refuse when Krauss said he wanted to prudently wait just one more year......'
33748: 'Kinzo@r@v01/51500111."......Hahahahahahahaha.@k@v01/51500112. So wonderful that things are going well.@k@v01/51500113. And that means it looks like I''ll have to sit around here as a ghost for a little longer."'
33749: 'BEATRICE@r@v27/50700182."You don''t look too disappointed.@k@v27/50700183. Your life is fated to be chewed to bits by demons as soon as you leave this world."'
33750: 'Natsuhi@r@v03/50900304."......My apologies, Father.@k@v03/50900305. ...For another year, ...you might not be granted peace."'
33751: 'Kinzo@r@v01/51500114."It is fine. Do not worry, Natsuhi.@k@v01/51500115. I am no longer the Ushiromiya family head.@k@v01/51500116. The ghost of the study should obediently follow the current head''s commands.@k@v01/51500117. ......I''ve taken a look at Krauss''s charts, and they aren''t bad at all."'
33752: 'Natsuhi@r@v03/50900306."Even from your perspective, Father?"'
33753: 'BEATRICE@r@v27/50700184."......Hmmm. They''re pretty good even from my perspective.@k@v27/50700185. Everyone is confident in his victory and concentrating a significant quantity of magical power.@k@v27/50700186. As a result, that victory is growing ever deeper, gathering more and more people and magical power, and beginning to create gold.@k@v27/50700187. A perfect embodiment of the classic method of alchemy."'
33754: 'Kinzo@r@v01/51500118."Hoh.@k@v01/51500119. If you''ve earned even the Golden Witch''s approval, that is very reassuring.@k@v01/51500120. Be pleased, Natsuhi.@k@v01/51500121. This business of Krauss''s will save the Ushiromiya family from its crisis without fail."'
33755: 'Natsuhi@r@v03/50900307."Th-...thank you very much.@k@v03/50900308. ......And, if you would once again......"'
33756: 'BEATRICE@r@v27/50700188."Hmmm.@k@v27/50700189. We''ll have to overcome one more family conference, won''t we..."'
33757: 'Natsuhi@r@v03/50900309."Yes.@k@v03/50900310. I think things went well last year, but I imagine some of the relatives will find it suspicious.@k@v03/50900311. .........I think this year''s conference will be a critical period."'
33758: 'Kinzo@r@v01/51500122."During last year''s family conference,@k@v01/51500123. you were correct to predict that the same thing might have to happen again."'
33759: 'BEATRICE@r@v27/50700190."......Even for those who aren''t witches, preparing for the worst case scenario is one of the basics for getting on in this world.@k@v27/50700191. ......So, what will you do this year?"'
33760: 'Natsuhi@r@v03/50900312."Just like last year, I will see to it that a high concentration of the servants who know Father''s secret are there on the day of the conference.@k@v03/50900313. ......Some of the relatives may already suspect that Father isn''t around.@k@v03/50900314. A careless act might actually put us in more danger of exposure."'
33761: 'Kinzo@r@v01/51500124."Hmmm.@k@v01/51500125. It is said that too much is as bad as too little.@k@v01/51500126. ......Then what will you do?"'
33762: 'Natsuhi@r@v03/50900315."Unlike last year, I think we''ll go with a plan that has you staying inside your study until the end."'
33763: 'Kinzo@r@v01/51500127."That would be suitable.@k@v01/51500128. A barricade is simple, and a final trump card."'
33764: 'BEATRICE@r@v27/50700192."No matter how much the mansion is filled with the toxin,@k@v27/50700193. it will be impossible to deny Kinzo''s existence as long as the locked-room barrier remains around this room.@k@v27/50700194. I shall guarantee that myself.@k@v27/50700195. ......However, if you choose to make a barricade, it is inevitable that you will be surrounded."'
33765: 'Natsuhi@r@v03/50900316."I know.@k@v03/50900317. ......Even so, I beg that both of you lend us your power just one more time..."'
33766: 'Kinzo@r@v01/51500129."I cannot disobey the orders of the new head.@k@v01/51500130. Furthermore, a ghost cannot disobey the orders of the living.@k@v01/51500131. If you tell me not to leave this room, then I will obey."'
33767: 'Natsuhi@r@v03/50900318."Thank you very much......"'
33768: 'BEATRICE@r@v27/50700196."I, on the other hand, will not.@k@v27/50700197. If you want me to lend you my power, I won''t listen to a mere request."'
33769: 'Natsuhi@r@v03/50900319."Yes.@k@v03/50900320. You are the family alchemist.@k@|@y@v03/50900321. So, I won''t ask you to help.@k@v03/50900322. I order you to help.@k@v03/50900323. ......We are relying on your magic alone.@k@v03/50900324. Use that power to create an illusion of Father just one more time."'
33770: 'BEATRICE@r@v27/50700198."Very well.@k@v27/50700199. I hear and obey.@k@v27/50700200. I find your dignity quite pleasing."'
33771: '@rFrom the shadows of the study, Battler watched the exchange between these three......'
33772: 'Battler@r@v10/50100228."......I see.@k@v10/50100229. And then this year''s family conference comes around.@k@v10/50100230. ......Grandfather shuts himself in his study because he''s in a bad mood and doesn''t appear in front of anyone."'
33773: 'BEATRICE@r"................................."'
33774: '@rNatsuhi spoke boldly, saying that she would find a way to overcome this year''s crisis and protect the Ushiromiya family honor to the end.@k Kinzo praised her, saying that he was relieved to hear it and trusted her to succeed.'
33775: '@rBeato also praised her, saying that Natsuhi''s dignity was even more fitting for the family head than Krauss''s.'
33776: '@r.........However,@w666. .........right now,@w666. the true number of people in this room was......'
33777: '@rAt the same time I thought that......no, just because I thought that, Beato grabbed her chest and moaned.'
33778: 'Battler@r@v10/50100231."......Don''t worry.@k@v10/50100232. We''re still outside the game board.@k@v10/50100233. So, I won''t deny you or Grandfather over there."'
33779: 'BEATRICE@r"................................."'
33780: '@rAs Beato tried to hold back the pain deep inside her chest, I put my hand on hers......'
33781: '@rI already told BERNKASTEL.'
33782: '@rDenying the witch illusions in just the two day period of the 1986 family conference is enough.'
33783: 'Battler@r@v10/50100234.@|@y"@c279.@[In the last game, you said in red that Grandfather is dead at the start time for all games.@k@v10/50100235. However, you never mentioned whether Grandfather was alive or dead before the start time for the games.@k@v10/50100236. ......In short, even if Grandfather exists in this place right now, that doesn''t create any contradictions.@]@c."'
33784: '@rMy hand that was touching her let off a faint blue light,@k ......which seeped into her chest.'
33785: '@rThat light...@ktenderly wrapped itself around the splinters in Beato''s chest...'
33786: 'Battler@r@v10/50100238."@|@y@c279.@[......And I also can''t deny the existence of the BEATRICE in this place.@k@v10/50100239. The number of people on this island outside the game board...in other words, before October 4th, 1986, has not been declared in red.@k@v10/50100240. Therefore, there''s nothing strange about BEATRICE existing here.@]@c."'
33787: 'BEATRICE@r@v27/50700203."..............................ah..."'
33788: '@rBeato''s expression softened slightly.'
33789: '@rMy blue light......slowly started to melt the red splinters that denied the witch illusion...'
33790: 'BEATRICE@r"........................"'
33791: '@rBeato still wore the same sad expression, but she lifted her face...@kand looked me right in the eye.'
33792: '@rEven though she was silent, her eyes told me that the pain had gone away.'
33793: '@rThe feelings that showed in her eyes were gratitude for taking the pain away,@k .........and appreciation—or was it surprise?—that I had left even a tiny bit of leeway for witches to exist.'
33794: '@rUnable to look directly at those pure eyes of hers, I automatically averted my gaze.'
33795: 'Battler@r@v10/50100241."......Don''t get the wrong idea.@k@v10/50100242. I don''t plan on accepting the existence of witches or surrendering.@k@v10/50100243. I just want to focus solely on that one time period and fight like a stoic so that I can win in this game against you.@k@v10/50100244. I have no desire to bully you outside the game board as well."'
33796: 'BEATRICE@r".............................."'
33797: 'Battler@r@v10/50100245."..............."'
33798: '@rBeato hung her head.@k ...I was still facing away from her.'
33799: '@rHowever, we waited wordlessly for a while, my hand still on hers......'
33800: '@r.........By now, no one would believe that this woman with sad eyes...@k...was the same person as that prideful Beato.'
33801: '@rSo, ......I asked once more.'
33802: '@rEven though I said it aloud, it wasn''t a question to her.@k@rI was asking myself.'
33803: 'Battler@r@v10/50100246."......Just what in the world...@k@v10/50100247....were you thinking?"'
33804: 'BEATRICE@r".............................."'
33805: 'Battler@r@v10/50100248."That''s right.@k@v10/50100249. Even though this is LAMBDADELTA''s game, ......I have to find you here.@k@v10/50100250. I have to find what you thought...and what you were trying to do."'
33806: '@rVery soon, this game will also reach October 4th, 1986.@k@r......The fifth game will finally begin.'
33807: '@rAnd this time, I''ll reach the end.@k The end of that journey.'
33808: 'Battler@r@v10/50100251."......I''m not worried about the obvious stuff, like murders and tricks.@k@v10/50100252. ...What did you, ...the Golden Witch BEATRICE, think, and why did you do what you did?@k@v10/50100253. What were you hoping for?@k@v10/50100254. ............That''s what I''m gonna find out."'
33809: '@rThat''s right.@k I already know the method for reaching the end of that journey.@k And I''ve been shouting it since the very beginning.'
33810: 'Battler@r@v10/50100255."......This time, I really will flip over the chessboard.@k@v10/50100256. I''ll untangle this tale not from my side,@k@v10/50100257. ......but from yours."'
33811: 'BEATRICE@r".............................."'
33812: 'Battler@r@v10/50100258."And this time, ......I''ll understand you.@k@v10/50100259. And I''ll pick my way to your heart.@k@v10/50100260. ......I won''t let you feel pain.@k@|@y@v10/50100261. Don''t worry.@k@v10/50100262. ......I won''t let those witches make you their toy anymore."'
33813: 'BEATRICE@r@v27/50700208.".....................nn..."'
33814: '@rBeato looked up at me again......and gave a small nod.'
33815: '@r......That''s right.'
33816: '@rThe position of the Game Master might have been snatched up by LAMBDADELTA.'
33817: '@rHowever, ......as long as I continue this contest with the intent of fighting against Beato,@k ......our fight will continue no matter who controls the game board.'
33818: '@r......Very soon, the curtain will rise on our game......'
33819: 'Genji@r@v14/51600018."During this year''s family conference, we must conceal the Master''s secret once again."'
33820: 'Shannon@r@v15/50500001."Y-yes.@k@v15/50500002. ......I understand."'
33821: 'Kanon@r@v16/50600014."............I''m a little doubtful that the same trick will work twice."'
33822: 'Genji@r@v14/51600019."Madam shares your concerns.@k@v14/51600020. Because of that, it was decided that this year, he will not leave the study even once."'
33823: 'Shannon@r@v15/50500003."In other words, we''ll make it seem like he''s shut away in the study the whole time...?"'
33824: 'Genji@r@v14/51600021."......Yes.@k@v14/51600022. And the only ones allowed to enter the study...@k@v14/51600023.will be the three of us, the servants permitted to wear the One-winged Eagle."'
33825: 'Kanon@r@v16/50600015.".........Which means that the three of us will have to perpetuate the lie about the Master..."'
33826: 'Genji@r@v14/51600024."Correct.@k@v14/51600025. ......The relatives will probably question you about the Master''s health and mood.@k@v14/51600026. Make sure you answer without hesitation, and see to it that nothing is seen as suspicious."'
33827: 'Shannon@r@v15/50500004."......Y-yes.@k@v15/50500005. I understand."'
33828: 'Kanon@r@v16/50600016."I''m sure you''ll screw up right away, Nee-san.@k@v16/50600017. Maybe it''s better to say you have a cold or something so that you can skip that day."'
33829: 'Shannon@r@v15/50500006."Th-that''s mean......"'
33830: '@rKanon wasn''t just saying that to make fun of Shannon.'
33831: '@r......He simply wanted to release her from the stresses they would face that day as they took on the critical task of concealing Kinzo''s death.'
33832: 'Kanon@r@v16/50600018."Genji-sama.@k@v16/50600019. Is it really necessary for Shannon to work that day?@k@v16/50600020. We can manage things well enough without her."'
33833: 'Genji@r@v14/51600027."That I cannot do.@k@v14/51600028. Madam gave strict orders that the three of us be scheduled to work on that day."'
33834: 'Shannon@r@v15/50500007."Yes......@k@v15/50500008. I am prepared to perform my duties successfully."'
33835: 'Kanon@r@v16/50600021."Don''t screw up."'
33836: 'Shannon@r@v15/50500009."I won''t."'
33837: '@rShannon grew sullen, and Kanon shrugged.@k@rThen Genji told them that they weren''t taking this seriously enough.'
33838: 'Genji@r@v14/51600029."......Shannon. Kanon.@k@v14/51600030. ......The master we serve has already passed away.@k@v14/51600031. However, until he has truly passed on, we will continue to serve.@k@|@y@v14/51600032. ......That study is not empty.@k@v14/51600033. The Master is still there, hard at work on his usual research.@k@v14/51600034. Make sure you take that to heart."'
33839: '@r@v00/awase5001.""Yes, Genji-sama.""'
33840: 'Eva@r@v05/51000007."Father has already passed away...?!@k @v05/51000008.That''s insane...!"'
33841: 'Hideyoshi@r@v06/51100006."Settle down...@k@v06/51100007. It''s only a possibility.@k@|@y@v06/51100008. It''s well known that Takeda Shingen said in his will that his death was to be kept secret for three years.@k@v06/51100009. Know about that?"'
33842: 'Eva@r@v05/51000009."......Is that how it went?@k@v05/51000010. My Japanese history isn''t so great."'
33843: 'Hideyoshi@r@v06/51100010."At the time, Takeda was in the middle of a war with Oda and Tokugawa.@k@v06/51100011. If his death had become known at a time like that, it would probably have had a negative effect on the war.@k@v06/51100012. ''Cause of this, he left a will sayin'' that his death should be kept hidden for three years.@k@v06/51100013. ......Hideyoshi did the same thing, right?@k @v06/51100014.He completely suppressed information about the death of his master, Oda Nobunaga, so that the enemy wouldn''t find out,@k@v06/51100015. quickly made peace with Mouri, and defeated Akechi in the Battle of Yamazaki."'
33844: 'Hideyoshi@r@v06/51100016."Shibata Katsuie, on the other hand... That was where he failed.@k@v06/51100017. The enemy, Uesugi, learned of Nobuyuki''s death, so Shibata had to deal with an unexpected counterattack and was slowed down.@k@v06/51100018. That''s why, later on, he suffered a great loss against Hideyoshi in the fight for the succession."'
33845: '@rHideyoshi, who had a strong fascination with the commanders of the Sengoku period, would always show off his knowledge whenever he got the chance.'
33846: '@rWincing slightly, Eva made him get back to his point.'
33847: 'Hideyoshi@r@v06/51100019."......Long story short, ...the whole time since last year''s family conference,@k@v06/51100020. something''s not been feelin'' right to me about what happened."'
33848: 'Eva@r@v05/51000011."You mean the time when Rudolf and I were talking about the inheritance and Father overheard us from the hall..."'
33849: 'Hideyoshi@r@v06/51100021."That''s just it.@k@v06/51100022. ......Natsuhi-san and the servants kept saying Father was here or there and that he seemed to be in a bad mood,@k@v06/51100023. but not a single one of us relatives saw Father, right?"'
33850: 'Eva@r@v05/51000012."If what you''re thinking is right......@k@v05/51000013.......what does that mean?!@k @v05/51000014.Does it mean that Nii-san is trying to get all of the inheritance for himself?!"'
33851: 'Hideyoshi@r@v06/51100024."Of course, hidin'' someone''s death is a very dangerous thing to do.@k@v06/51100025. And all things considered, I''m not sure Krauss-san would be willin'' to do it just to have the inheritance to himself.@k@v06/51100026. But it is possible."'
33852: 'Eva@r@v05/51000015."......W-...well, it''s true that Nii-san has always been greedy.@k@v05/51000016. He always used to take things that were meant for all of the siblings and keep them all for himself..."'
33853: 'Hideyoshi@r@v06/51100027."Krauss-san''s meant to be the most affluent of you siblings.@k@v06/51100028. For Krauss-san to scheme to keep the inheritance all to himself to the point of acceptin'' the risk of hidin'' Father''s death...@k@v06/51100029. I don''t know, it sounds a little unbelievable to me.@k@v06/51100030. But last year''s family conference was just so strange, it makes me wonder."'
33854: 'Eva@r@v05/51000017."................................."'
33855: '@rEva and the others were painfully aware of how reckless it would be...@kto try to see Kinzo knowing that he was in a bad mood.'
33856: '@rSo ever since hearing about Kinzo getting into a terrible mood during last year''s family conference,@k they had never actively tried to contact him.'
33857: '@rThat was why, until this very day, it hadn''t occurred to them to find it suspicious that Kinzo never showed himself......'
33858: 'Eva@r@v05/51000018."......It definitely is something we should suspect...@k@|@y@v05/51000019. But I wonder if Nii-san really would do something as appalling as hiding Father''s death...@k@v05/51000020. ......For all his pride, that man has a coward''s side to him.@k@v05/51000021. Would he really make such a once-in-a-lifetime bet......?"'
33859: 'Hideyoshi@r@v06/51100031."In any event, it''d probably be a good idea to make sure we get a chance to meet with Father during this year''s conference."'
33860: 'Rudolf@r@v08/51200004."......They''re extremely bad rumors.@k@v08/51200005. It seems that Aniki''s businesses are failing even worse than we''d imagined.@k@v08/51200006. It looks like he''s had massive losses and is giving it everything he''s got just to try and cover up that fact."'
33861: 'Kyrie@r@v09/51300003."In that case, it would be very difficult to borrow money from Krauss-san."'
33862: 'Rudolf@r@v08/51200007."Yeah. I could almost cry."'
33863: 'Kyrie@r@v09/51300004."............So, would being in financial distress give Krauss-san some kind of weakness?"'
33864: 'Rudolf@r@v08/51200008."A weakness?@k @v08/51200009..........Well, investors tend to have a keen eye.@k@v08/51200010. If they were to hear that Aniki is actually low on funds, no one would give him the time of day."'
33865: 'Kyrie@r@v09/51300005."I guess trust is the most important part of that business.@k@v09/51300006. .................."'
33866: '@rKyrie smiled thinly.@k Rudolf was taken aback by that smile...'
33867: '@rHe had figured that his plan, which involved raising money to get him out of his current mess by borrowing from the affluent Krauss,@k would all come to nothing now that they knew Krauss himself was in financial trouble......'
33868: 'Kyrie@r@v09/51300007."......Krauss-san''s credibility might be something he needs for his future work,@k@v09/51300008. but we won''t have any use for it."'
33869: 'Rudolf@r@v08/51200011."You''re suggesting extorting money from Aniki?"'
33870: 'Kyrie@r@v09/51300009."If I was in your place, I''d hate the idea.@k@v09/51300010. Who would want to undermine their own blood sibling like that?@k@v09/51300011. *giggle*giggle*."'
33871: '@rRudolf felt a shiver go up his spine at Kyrie''s cold smile...'
33872: '@rAt times, Kyrie was able to throw away all compassion and think in an extremely ruthless manner.'
33873: '@rWhenever he felt that, Rudolf thought about how he never wanted to have her as his enemy......'
33874: 'Kyrie@r@v09/51300012."I wouldn''t want to threaten Onii-san if there were any other way to get money."'
33875: 'Rudolf@r@v08/51200012."......If there were another way, we wouldn''t be worrying."'
33876: 'Kyrie@r@v09/51300013."Don''t you think worrying about a problem when you have no other options is a waste of time?"'
33877: 'Rudolf@r@v08/51200013."................................."'
33878: '@rRudolf stopped talking, folded his arms, and lowered his gaze.'
33879: '@rEven now, Rudolf had a kind of fear of Krauss due to his violence when they were young.'
33880: '@r......And now, Rudolf would be the one to threaten him.'
33881: '@rThat meant Rudolf would also have to fight against his childhood trauma.'
33882: '@rSo to give her husband a little push, Kyrie smiled reassuringly,@k ......and perhaps coldly.'
33883: 'Kyrie@r@v09/51300014."I never want to do business based on trust.@k@v09/51300015. It takes hard work to build up trust, but only an instant to lose it. There''s no less profitable investment."'
33884: 'Rudolf@r@v08/51200014."Y-...you''re right.@k@v08/51200015. ...All the trust in the world isn''t worth a crisp new banknote."'
33885: 'Kyrie@r@v09/51300016."Even though Krauss-san has been taking huge losses,@k@v09/51300017. he should be able to prepare enough money to buy us some time.@k@v09/51300018. Of course, this will involve forcing him to exchange all the trust he''s built up for cash."'
33886: 'Rudolf@r@v08/51200016.".........This is......gonna get rough..."'
33887: 'Kyrie@r@v09/51300019."We''ll have to prepare sufficiently.@k@v09/51300020. We haven''t been given any time or room for failure.@k@v09/51300021. Isn''t that right?"'
33888: 'Kyrie@r@v09/51300022."Among my Kyoto friends, there are a few people who are very good at investigating that sort of thing.@k@v09/51300023. I''d rather not be in the debt of these people, ......but do you want to try meeting them?@k @v09/51300024.They don''t give receipts, but I''m sure they''ll dig up something that makes them worth the investment."'
33889: 'Rosa@r@v12/51400003."Yes.@k@v12/51400004. Maria is doing well too.@k@v12/51400005. .........That''s none of your concern.@k@v12/51400006. Thank you.@k@v12/51400007. .........Huh?@k @v12/51400008.I don''t know, I''d have to look at my schedule..."'
33890: '@rRosa was talking to Rudolf over the phone.'
33891: '@rRosa rarely received calls from her older siblings, so she braced herself for something serious.'
33892: 'Rudolf@r@v08/51200017."Well, truth is...@k@v08/51200018.I want to have a little talk about the next family conference, without Aniki."'
33893: 'Rosa@r@v12/51400009.".........Between you, me, and Eva nee-san?@k @v12/51400010.......Sounds like a headache."'
33894: 'Rudolf@r@v08/51200019."I can''t talk about the details over the phone,@k@v08/51200020. but you might find that it''s worth listening to."'
33895: 'Rosa@r@v12/51400011."Something good?"'
33896: 'Rudolf@r@v08/51200021."Of course.@k@v08/51200022. Aneki is all for it."'
33897: 'Rosa@r@v12/51400012."Nee-san is......?"'
33898: 'Rudolf@r@v08/51200023."We just want your approval. We aren''t going to ask you for money or anything like that.@k@v08/51200024. The most important thing is that the three of us are united.@k@v08/51200025. Understand what I''m saying?"'
33899: '@rRosa let out a sigh.'
33900: '@r...She did so because, in the past, when Rudolf and Eva got into a fight with Krauss, they often used a tone like this to drag her into it......'
33901: 'Rosa@r@v12/51400013."First, tell me.@k@v12/51400014. I stand to gain something from this too, right?"'
33902: 'Rudolf@r@v08/51200026."Yep.@k@v08/51200027. The three of us will each grab 200 million out of this.@k@v08/51200028. If things go well, we might be able to squeeze out more.@k@v08/51200029. That should be enough to wipe out your debt, right?"'
33903: 'Rosa@r@v12/51400015.".....................@k@v12/51400016. And when will we be grabbing this by?"'
33904: 'Rudolf@r@v08/51200030."Within this fiscal year, of course.@k@v08/51200031. I need it.@k@v08/51200032. Aneki needs it.@k@v08/51200033. And you need it too, Rosa.@k@v08/51200034. All three of our problems''ll be settled."'
33905: 'Rosa@r@v12/51400017."So, its chances of success are good enough that Nee-san''s agreed to it?"'
33906: 'Rudolf@r@v08/51200035."Now do you wanna hear?@k @v08/51200036.I know it''s a bit sudden, but let''s meet this Sunday, 19:00, at that coffee shop you like in Ginza.@k@v08/51200037. That''s the only time Aneki''s schedule and mine match.@k@v08/51200038. Any problems?"'
33907: 'Rosa@r@v12/51400018."If it can bring me 200 million, I have no choice but to listen.@k@v12/51400019. ......Then let''s meet at 7 p.m. this Sunday at Leopold''s."'
33908: 'Rudolf@r@v08/51200039."Say hi to Maria-chan for me.@k@v08/51200040. You can bring her too if you want."'
33909: 'Rosa@r@v12/51400020."Don''t talk about money in front of that child!"'
33910: '@rShe set the receiver down with a clunk, a little violently.'
33911: '@rApparently, either Eva or Rudolf had gotten ahold of one of Krauss''s weak points.'
33912: '@rThey were probably thinking of threatening him with that at the next family conference and forcing him to pay money.'
33913: '@rEven before hearing the details, she knew full well that it could be nothing good.'
33914: '@rBut even so, ......this was a once-in-a-lifetime chance to pay back her large debts.'
33915: '@rRosa took a notebook out of her handbag,@k and went to fill in the day she would be meeting with Rudolf and Eva.@k ......Then she frowned and smacked herself hard in the forehead.'
33916: '@rBecause written there was "DZL with Maria".'
33917: '@rMaria was in her room, playing around excitedly with Sakutarou and the others.'
33918: '@rIt was because her mother was going to take her to the amusement park that had just been built,@k Delsney Land, on Sunday......'
33919: '@rLooking at the clock, Rosa saw that it was just past nine o''clock at night.@k@rMaria was breaking the lights-out rule.'
33920: '@rAfter covering her face and agonizing for a while,@k ......Rosa stood up and stomped over to Maria''s room.'
33921: '@rThe room was almost certainly a mess as well.@k@r......At least tonight, that was convenient.'
33922: '@rAs she stood outside the door to Maria''s room, listening to the happy laughter seeping through,@k Rosa''s face twisted in anguish once again, and she looked at the floor.'
33923: '@rThen, when she raised her head again,@k her brow was furrowed, and her face had become an ugly expression of anger...'
33924: '@rThe weather wasn''t looking very good.'
33925: '@rThe weekend forecast had said that there was a high likelihood of a tropical cyclone growing into a large typhoon.'
33926: '@rIf it was true that premonitions tended to be right...'
33927: '@r......then this year''s family conference would probably take place in absolutely horrible weather.'
33928: '@rIn fact, Natsuhi wished that a typhoon large enough to stop boat travel to the island would seal Rokkenjima away forever.'
33929: '@rIf that happened, she would be able to keep Kinzo''s death hidden as long as she wanted......'
33930: 'Natsuhi@r@v03/50900325."If only......the typhoon would keep them at bay forever."'
33931: '@rNatsuhi let out a deep sigh.@k ......Just doing that made her headache throb...'
33932: '@rAs the day of the family conference approached, the intensity of her headache just kept on increasing.'
33933: '@rAt that time, the phone rang.@k@rNatsuhi turned the television off and picked up the receiver...'
33934: 'Natsuhi@r@v03/50900326."......Hello?"'
33935: 'Genji@r@v14/51600035."I apologize for calling during your rest.@k@v14/51600036. It is Genji."'
33936: 'Natsuhi@r@v03/50900327."Is something the matter...?"'
33937: 'Genji@r@v14/51600037."There is a phone call for you from the external line.@k@|@y@v14/51600038. ......However, they will not state their name."'
33938: 'Natsuhi@r@v03/50900328."They aren''t saying their name...?"'
33939: 'Genji@r@v14/51600039."Yes.@k@v14/51600040. The person in question said you would know when you spoke with them...@k@v14/51600041. What would you like me to do?@k@v14/51600042. It might be a prank."'
33940: 'Natsuhi@r@v03/50900329."What did they sound like?"'
33941: 'Genji@r@v14/51600043."I believe it was a young man.@k@v14/51600044. Do you have any ideas as to who it might be...?"'
33942: 'Natsuhi@r@v03/50900330."A young......man?"'
33943: '@rNatsuhi didn''t have a clue who that might be.'
33944: '@rIn the first place, there was no one amongst her acquaintances who would do something as rude as refusing to state their name.'
33945: '@rAnd on top of that...a young...man......?'
33946: '@rNatsuhi thought that as a wife, it wasn''t right for her to have connections with men other than her husband, much less a young man; it might be considered suspicious.'
33947: '@rThe phone call suddenly seemed like something dirty.'
33948: '@rBut at the same time, she was more interested than ever in what this person wanted to tell her.'
33949: '@r......Could it be that there was some kind of trouble related to Krauss''s business?'
33950: '@rWhat if there was some particular reason that they needed to talk to Krauss''s wife instead of Krauss directly......?'
33951: 'Natsuhi@r@v03/50900331."..........................."'
33952: '@rNo matter what the message, it was her duty as a wife to hear it and relay it to Krauss.'
33953: '@r......If it was some strange kind of extortion attempt, she just had to firmly refuse and inform Krauss that she had received a phone call like that.'
33954: '@rIf the call was something irritating, then she just had to tell Genji to never again send her a call if the caller refused to state their name.'
33955: '@rThinking this, Natsuhi told Genji, who was offering to hang up after all, to connect her to this person,@k and she set the receiver down.'
33956: '@rAfter a short while, the phone rang again......'
33957: 'Natsuhi@r@v03/50900332."............Hello?"'
33958: '@rThis wasn''t the internal line.@k It was the external phone line, which Genji had transferred to her.@k@rSo it should already have been connected directly to the mysterious man.'
33959: '@rHowever, the person on the other end didn''t respond to her.'
33960: '@r......Not liking this at all, Natsuhi spoke one more time, sounding displeased.'
33961: 'Natsuhi@r@v03/50900333."Hello?@k @v03/50900334.Who is it?@k @v03/50900335.Tell me your name...!"'
33962: '@r@v10/50100263."..........................."'
33963: '@rShe heard something that sounded like a sigh.@k@rShe automatically gulped.'
33964: '@rAfter remaining silent for a little longer, the man finally answered......'
33965: '@r@v10/50100264.".........It''s been a long time."'
33966: '@rThat was the first time the man had spoken.'
33967: '@r@v10/50100265."......Just how long has it been?@k@v10/50100266. ......How many years, I wonder."'
33968: 'Natsuhi@r@v03/50900336."What are you talking about?@k@v03/50900337. Who are you...?!"'
33969: '@rThe voice certainly did sound like that of a young man.'
33970: '@rBut it was a bit hard to figure out much about a person just by their voice over the phone...'
33971: '@rHe sounded like a young adult, but he might actually have been of middle-school age,@k or an adult whose voice still hadn''t deepened.'
33972: '@rIn fact, it might have been premature to assume this person was a male at all.'
33973: '@rHowever, one thing was certain......@k Though this person spoke to Natsuhi in such a familiar and casual manner, Natsuhi had absolutely no clue who it was...'
33974: '@r@v10/50100267."......It''d be easy for me to tell you my name.@k@v10/50100268. ......But that would make me very sad."'
33975: 'Natsuhi@r@v03/50900338."I don''t know what you''re talking about.@k@v03/50900339. Who are you?@k@v03/50900340. And what business do you have with me?!@k @v03/50900341.If you can''t tell me that, I''m not interested!@k @v03/50900342.I''m hanging up...!"'
33976: '@r@v10/50100269."What I want......is for you to remember."'
33977: 'Natsuhi@r@v03/50900343."And what is it that you''re telling me to remember?@k@v03/50900344. I don''t know you, so I have nothing to remember!"'
33978: '@r@v10/50100270.".........Don''t say that.@k@|@y@v10/50100271. I''m your child, aren''t I?"'
33979: 'Natsuhi@r@v03/50900345."What did you say......?!@k @v03/50900346.What are you talking about?!"'
33980: '@r@v10/50100272."Don''t say things that''ll make me so sad,@k@v10/50100273. ...Mother."'
33981: '@rThat unsettling word thrust itself mercilessly into the depths of Natsuhi''s heart and started churning it about...'
33982: '@rIn Natsuhi''s entire life,@k no one had ever said anything so unsettling to her.'
33983: '@rIn her bewilderment, Natsuhi felt her heart beat so loudly that it felt like it would explode.'
33984: 'Natsuhi@r@v03/50900347."I, ......I, I have no idea why you think you have the right to call me "Mother"!@k @v03/50900348.I don''t know what you''re thinking, but I''m hanging up...!!"'
33985: '@r@v10/50100274."......I came back for revenge.@k@v10/50100275. ......Revenge for your crime of 19 years ago."'
33986: '@rNatsuhi''s mind went blank......'
33987: '@rAnd beyond the sound of the wind howling outside the window, she most certainly heard the roar of the sea from that day......'
33988: '@r@v10/50100276.".........You...@v10/50100277.remember, actually, don''t you......?"'
33989: 'Natsuhi@r@v03/50900349."I, ...I told you I don''t know what you''re talking about!!@k @v03/50900350.N-...n-never call here again!"'
33990: '@r@v10/50100278."I haven''t forgotten what you did to me 19 years ago...@k@v10/50100279. ......So I will call you Mother despite what you did,@k@v10/50100280. no, because of what you did, to curse you.@k@v10/50100281. .........It''ll be the family conference very soon, won''t it?@k@v10/50100282. ......I am your son, Mother, after all.@k@v10/50100283. I''ll come on the day of the conference.@k@v10/50100284. ...After 19 years.@k@v10/50100285. ......So that I can have my revenge on you."'
33991: '@rClick!!'
33992: '@rBreathing so hard her shoulders heaved, Natsuhi slammed the receiver down and hung up...'
33993: '@rThen she hit the phone violently, knocking the receiver off.'
33994: '@rSo that there was no chance of that man calling back...'
33995: '@rI can hear the roar of the sea......'
33996: '@rThe voice I''m hearing from beyond the howling wind must be...@w666. ...Aaah...@w500.no matter how I cover my ears, no matter how I cover my ears, ......@k......the headache won''t...............'
33997: '@rCompletely pale, ...Natsuhi kept shivering as though cold......'
33998: 'BERNKASTEL@r@v28/52100223."............Lambda, are you there?"'
33999: 'LAMBDADELTA@r@v29/52200138."Yes, I''m here.@k@v29/52200139. I''m anywhere you want me to be, Bern."'
34000: 'BERNKASTEL@r@v28/52100224."......Then crawl into the cupboard under the kitchen floor.@k@v28/52100225. Or in a jar of rice-bran paste, if you want."'
34001: 'LAMBDADELTA@r@v29/52200140."Ooh, you''re gonna dip me in bean paste and bite me?@k @v29/52200141.But in that case, I''d prefer to be dipped in hone~y.@k@v29/52200142. And in return, I''ll cook you in sugar water."'
34002: 'BERNKASTEL@r@v28/52100226."......At least make it sweet soy sauce with sweet sake."'
34003: 'LAMBDADELTA@r@v29/52200143."So what''s up?@k @v29/52200144.You wanna play with repetition requests?"'
34004: 'BERNKASTEL@r@v28/52100227.".........That''s right.@k@v28/52100228. Is Natsuhi''s phone conversation here a fact?"'
34005: '@rLAMBDADELTA grinned unpleasantly, as though sizing BERNKASTEL up.'
34006: '@rShe was probably trying to tease BERNKASTEL by taking her time on the repetition request.'
34007: 'BERNKASTEL@r@v28/52100229.".........Declining to repeat?"'
34008: 'LAMBDADELTA@r@v29/52200145."I dunno, lemme see...@k@v29/52200146. Should I decline or should I respond...@k@v29/52200147. As the Game Master, that''s up to me to decide, and I get to make that decision any time I want."'
34009: 'BERNKASTEL@r@v28/52100230.".........Unless I state it in the blue text, you aren''t obligated to respond."'
34010: 'LAMBDADELTA@r@v29/52200148."Exactly!@k @v29/52200149.*giggle*giggle*.@k@v29/52200150. For now the best you can do is be all like "Natsuhi has a secret from 19 years ago?! What could it be?!"@k @v29/52200151.Make sure you''re sitting on the edge of your seat, alright?@k @v29/52200152.*giggle*giggle*."'
34011: '@rOf course, this fishy telephone call...@koccurs before October 4th, 1986.'
34012: '@rThis is still before the start time of the game.@k@rSo it''s not necessary to question whether it''s true or false in the first place.'
34013: 'BERNKASTEL@r@v28/52100231.".........Since you, the Game Master, went out of your way to show me this, I''m just going to assume you''re setting up something for later.@k@v28/52100232. ......It might be a trick, but I''ll at least keep this move of yours in my memory."'
34014: 'LAMBDADELTA@r@v29/52200153."Ehheheheheheheheheheheheheheheheh.........@k@v29/52200154. I place this card face-down onto the field, hehe~.@k@|@y@v29/52200155. Ouch, wh-what?!"'
34015: 'BERNKASTEL@r@v28/52100233."............<Direct Attack>."'
34016: '@rAfter suddenly being conked on the head, LAMBDADELTA was bewildered.'
34017: '@rBut perhaps this incomprehensible exchange was funny to her...because she quickly went back to giggling.'
34018: 'BERNKASTEL@r@v28/52100234."......Are you done preparing the game board now?"'
34019: 'LAMBDADELTA@r@v29/52200156."Yeah, that''s right.@k@v29/52200157. Now I''ll finally move on to the game.@k@v29/52200158. On to October 4th, 1986...!"'
34020: 'BERNKASTEL@r@v28/52100235.".........I wonder what number October 4th, 1986 this is.@k@v28/52100236. ......The Endless Witch...@k@v28/52100237.BEATRICE.@k@v28/52100238. ...She really is a frightening child."'
34021: 'LAMBDADELTA@r@v29/52200159."Taking any actions on your side, Bern?"'
34022: 'BERNKASTEL@r@v28/52100239.".........No.@k@v28/52100240. If you aren''t going to respond to my repetition request, I''m done."'
34023: 'LAMBDADELTA@r@v29/52200160."<Turn end>, then?@k @v29/52200161.<Start, cleanup, draw>!!"'
34024: 'LAMBDADELTA@r@v29/52200162."Come!!@k @v29/52200163.October 4th, 1986!!!"'