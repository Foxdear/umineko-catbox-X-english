34969: '@rKnock-knock-knock-knock!!!'
34970: '@rThe sudden sound of someone banging fiercely on the door brought Natsuhi to her senses.'
34971: '@rShe had probably nodded off in the study while planning how they would overcome the next day.'
34972: '@rBut...what could it be...?@k At a time like this...'
34973: '@rMore importantly, the knock itself was strange.'
34974: '@rIf someone had wanted to contact her, they could have just used the internal phone line.'
34975: '@rShe had told them that she would be here.'
34976: '@rRealizing that something strange was going on,@k Natsuhi shook her head one more time, completely throwing off her drowsiness.'
34977: 'Eva@r@v05/51000086."Father, Father...!!@k @v05/51000087.It''s Eva.@k@v05/51000088. I have something urgent and vital to talk to you about!"'
34978: '@rIt was Eva''s voice.'
34979: '@r......What is this?'
34980: '@rI thought I told them to lock the doors and windows of the mansion tightly after everyone left for the guesthouse.'
34981: '@rSo why is Eva here...?!'
34982: '@rNatsuhi ran up to the door, responded with a small knock, and spoke through the door in a quiet voice.'
34983: 'Natsuhi@r@v03/50900459.".........What do you want? Keep your voice down."'
34984: 'Eva@r@v05/51000089."Natsuhi nee-san...?!@k @v05/51000090.Why are you in Father''s study at this hour?!"'
34985: 'Natsuhi@r@v03/50900460."......I told you to be quiet!@k @v03/50900461.Have you forgotten that the head treasures peace and silence above all else...?!"'
34986: 'Eva@r@v05/51000091."Now''s not the time to be saying that!!@k @v05/51000092.Stop harping on that and open up quickly!!@k @v05/51000093.Bring Father out!!"'
34987: 'Natsuhi@r@v03/50900462."The head just went to sleep!@k @v03/50900463.I don''t know what business you have, but I will listen to it tomorrow!"'
34988: 'Eva@r@v05/51000094."I don''t have any business with you!!@k @v05/51000095.Just open up right now!!"'
34989: '@rSometimes, all one''s schemes and assumptions can fall apart due to the most direct, simple, and emotional of strategies.'
34990: '@rThis is bad...'
34991: '@rIf I open the door, Eva will probably throw herself forwards and rush into the study.'
34992: '@rNow, I can''t even open this door...!'
34993: '@rAt that moment, the phone suddenly rang.'
34994: '@rI-it''s alright.@k Both of the keys to the study are here.'
34995: '@rNo one can open this door...!'
34996: '@rNatsuhi inched away from the door and grabbed the receiver...'
34997: 'Natsuhi@r@v03/50900464."H-...hello!!@k @v03/50900465.It''s Natsuhi!"'
34998: 'Krauss@r@v02/50800202."It''s me...@k@v02/50800203. Things are bad.@k@v02/50800204. I want you to come down to the parlor, quickly."'
34999: '@rIt was from Krauss.@k His tone was strained.'
35000: '@r......What in the world happened...?!'
35001: 'Krauss@r@v02/50800205."It seems that Battler-kun and the guest called Erika...@k@v02/50800206.......solved the witch''s epitaph and found the gold."'
35002: 'Natsuhi@r@v03/50900466."Huh? ........................@k@v03/50900467. ...Is, ...is that true?!"'
35003: 'Krauss@r@v02/50800207."Rudolf and the rest have forced their way in.@k@v02/50800208. They''re saying that Battler-kun is going to show us all the way to the location of the hidden gold..."'
35004: 'Natsuhi@r@v03/50900468."Right now, Eva-san is just outside the door, yelling at me to open it...!@k @v03/50900469.If I open it now, she might push her way into the study...!!"'
35005: 'Krauss@r@v02/50800209."...I, I understand.@k@v02/50800210. I will be there soon.@k@v02/50800211. Don''t worry about Eva.@k@v02/50800212. Just stay there and don''t do anything...!@k @v02/50800213.I''ll give you a signal once I''ve gotten Eva away from the door, so leave as soon as you hear that.@k@v02/50800214. Be ready...!"'
35006: '@rRight after that, Krauss came up the staircase, accompanied by Genji.'
35007: '@rA heated debate started between him and Eva. "Open up!" "No, calm down."'
35008: '@rIn the middle of that, there was a small knock as a signal.'
35009: '@r......Krauss had skillfully pushed Eva away from the door and distracted her.'
35010: '@rDuring that gap, Natsuhi slipped out of the study and quickly shut the door...'
35011: '@rEva noticed this, and her face twisted in disappointment,@k@|@y but the heavy sound of the auto-lock had already rung out, and the door had been sealed.'
35012: 'Eva@r@v05/51000096."The gold of the epitaph has been found!!@k @v05/51000097.It''s only natural that we should inform Father...!!@k @v05/51000098.Or else what?@k @v05/51000099.Is there some reason you can''t tell Father about this?!"'
35013: 'Krauss@r@v02/50800215."We have strict orders from Father not to wake him after he goes to bed under any circumstances.@k@v02/50800216. Following those orders is the duty of the head''s representative.@k@|@y@v02/50800217. Isn''t that right, Genji-san?"'
35014: 'Genji@r@v14/51600089."............Yes.@k@v14/51600090. The Master''s sleep must not be disturbed, no matter the circumstances."'
35015: 'Eva@r@v05/51000100."There''s a time and place for everything, isn''t there...?!!@k @v05/51000101.I mean, the epitaph was solved!!@k @v05/51000102.Father has a right to know straight away!"'
35016: 'Natsuhi@r@v03/50900470."Of course, the two of us will report on everything to the head tomorrow.@k@v03/50900471. That''s our duty as the head''s representatives."'
35017: 'Eva@r@v05/51000103."I don''t care about that!!@k @v05/51000104.Just open this door!!@k @v05/51000105.Let me see Father!!@k @|@y@v05/51000106.Father, Father, can you hear me?@k @v05/51000107.It''s Eva!!@k @v05/51000108.Please open up!!"'
35018: 'Eva@r@v05/51000109."Owowow, let go of me...!!@k @v05/51000110.Th-that hurts...!!"'
35019: 'Krauss@r@v02/50800218."We will bring this to his attention......!@k @v02/50800219.Now stop knocking on the door so loudly......!!"'
35020: 'Eva@r@v05/51000111."Ouch, owowowowow...!!@k @v05/51000112.Let go, let go of me!!"'
35021: 'Genji@r@v14/51600091."Krauss-sama, Eva-sama.@k@v14/51600092. You have been told that the Master is sleeping.@k@v14/51600093. Please refrain from disturbing him any further...!"'
35022: '@rWhen Genji spoke firmly, the two finally ceased their scuffle.'
35023: '@rIt seemed that Genji, the one who had spoken for Kinzo since they were very young, still possessed an air of dignity strong enough to handle both Krauss and Eva...'
35024: '@rEva put her argument aside for the time being.'
35025: '@rShe could worry about that after seeing the gold with her own eyes.@k@rAfter all, not even she had yet seen it for herself.'
35026: '@rNatsuhi and the others had managed to deal with this crisis somehow.'
35027: '@r......However, the demons'' move which would sneer upon their efforts was already in motion...'
35028: 'BEATRICE@r@v27/50700305."Battler.........solved the riddle of the epitaph, you say......?!"'
35029: 'Kinzo@r@v01/51500147."Mm.@k@v01/51500148. ......Though he had a lot of help from that Erika girl, Battler was the one who reached the answer.@k@v01/51500149. Erika has proclaimed that she will renounce her rights to the Golden Land.@k@v01/51500150. ......Therefore, Battler is the one who reached the Golden Land."'
35030: 'Ronove@r@v31/53100080.".........Fate can be truly interesting.@k@v31/53100081. To think that Battler-sama should be the one to reach that place..."'
35031: 'VIRGILIA@r@v30/53200063."What will you do, Beato?@k@v30/53200064. ......You made a promise to stop the ritual if anyone solved the epitaph''s riddle."'
35032: 'Kinzo@r@v01/51500151."Mm.@k@v01/51500152. ...That was the agreement."'
35033: 'BEATRICE@r@v27/50700306.".........That is the agreement.@k@v27/50700307. Yes."'
35034: 'Ronove@r@v31/53100082."Apparently, Battler-sama does not intend to become the master of the Golden Land.@k@v31/53100083. ......It now seems that no one will become our master."'
35035: 'VIRGILIA@r@v30/53200065."That is also fate.@k@v30/53200066. It has been several decades since we first manifested in the Human world through our bond with Lord GOLDSMITH.@k@v30/53200067. ......It was all very fun."'
35036: 'Gaap@r@v32/53700056.".........Come on, Lia, you sound like an old lady.@k@|@y@v32/53700057. ......So, what''re we going to do?@k @v32/53700058.According to Riiche and GOLDSMITH''s rules, now that Battler''s solved the epitaph and decided not to become our master,@k@v32/53700059. we''ve been relieved from duty, right?"'
35037: 'Kinzo@r@v01/51500153."That''s true.@k@v01/51500154. ......I have no regrets at all.@k@v01/51500155. I''ve been prepared to be kicked down into Cocytus all this time."'
35038: 'BEATRICE@r@v27/50700308."Wait.@k@v27/50700309. We can''t let that happen.@k@|@y@v27/50700310. ......You might not have any regrets, but I still serve Natsuhi.@k@v27/50700311. To let ourselves be relieved from duty just because Battler solved the epitaph would be quite irresponsible.@k@v27/50700312. ......Witches aren''t allowed to break contracts, but they also must not fail to show gratitude."'
35039: 'Ronove@r@v31/53100084."......True.@k@v31/53100085. We should serve her until the family conference ends."'
35040: 'VIRGILIA@r@v30/53200068."In that case, you won''t be relieved from duty for a while either, Lord GOLDSMITH.@k@v30/53200069. ......Perhaps you should wait until you''ve overcome this family conference safely, said goodbye to Natsuhi-sama at the very least,@k@v30/53200070. ......and if possible, rewarded her for all her efforts."'
35041: 'Kinzo@r@v01/51500156."...............Hmm.@k@v01/51500157. ......She has done well supporting my foolish son."'
35042: 'BEATRICE@r@v27/50700313."Aren''t you a fallen angel with one of its wings plucked off?@k@v27/50700314. Just leave the other wing as a parting gift and go."'
35043: 'Kinzo@r@v01/51500158."......Hmm.@k@v01/51500159. ......That is also fitting.@k@v01/51500160. Natsuhi might be worthy to bear my wing.@k@|@y@v01/51500161. ...However, .........we are approaching the critical moment.@k@v01/51500162. ......Your reward is waiting for you.@k@v01/51500163. Try and overcome this test safely, ......Natsuhi..."'
35044: '@rThe mountain of gold left everyone speechless.'
35045: '@rRegardless of how strongly they had believed in its existence,@w500. ......no one could look at this much real gold and not be shocked...'
35046: 'Natsuhi@r@v03/50900472."............To think that a place like this existed........."'
35047: 'Krauss@r@v02/50800220."I can''t believe it......@k@v02/50800221. ......That Dad........."'
35048: '@rEveryone was stunned by the gold.'
35049: '@rThe first one to break the silence and jump around in ecstasy was Hideyoshi.'
35050: '@rLetting out an excited laugh, he clung to the wall of gold,@k@rand he felt the cold, hard touch of it all over his cheek.'
35051: 'Hideyoshi@r@v06/51100068."W-wahahahahahahahahahahahaha...!!@k @v06/51100069.Th-this is incredible!@k @v06/51100070.It''s the real thing!!"'
35052: 'Rudolf@r@v08/51200070."......Ha......hahahahahahaha!!@k @v08/51200071.Damn you, old man, stockpiling all this gold in a crazy place like this!!"'
35053: 'Eva@r@v05/51000113."If we have all this...@v05/51000114....there''s...@v05/51000115.nothing to be afraid of anymore...@k@v05/51000116. Anything life throws at us,@v05/51000117. ......we can overcome......!@k @v05/51000118.Rosaaa......!!"'
35054: 'Rosa@r@v12/51400083."Nee-san...... Nee-san......@k@v12/51400084. We''ll be able to find happiness with this, right......?"'
35055: '@rEva and Rosa started walking towards each other at the same time and hugged each other as they broke down crying...'
35056: '@rEcstasy and shock...wonder and sighs.'
35057: '@rAfter stepping forward in front of the pile of gold that caused these mixed emotions,@k ......Erika spoke as though she were an announcer in some show.'
35058: 'Erika@r@v46/54500184.".........If money is everything in this world, then this gold is the embodiment of happiness.@k@v46/54500185. ......Congratulations, everyone.@k@v46/54500186. I pray with all my heart that this discovery enriches your lives."'
35059: 'Kyrie@r@v09/51300053."I take my hat off to you......@k@v09/51300054. ......To think that you would solve the epitaph within a single day of coming to this island."'
35060: 'Erika@r@v46/54500187.".........If it wasn''t solvable in a single day, then it wouldn''t have been solvable no matter how many days I spent on it.@k@v46/54500188. After all, it doesn''t take more than an instant for your little gray cells to give you a flash of intuition.@k@v46/54500189. ......Also, I wouldn''t have been able to solve this riddle on my own.@k@v46/54500190. I ask that you praise Battler-san''s achievement as well, everyone."'
35061: 'Battler@r@v10/50100502."................................."'
35062: 'Erika@r@v46/54500191."......I renounce any rights to this discovery.@k@v46/54500192. My reasoning was proven correct, and that alone is enough to satisfy me.@k@v46/54500193. Therefore, I want to give Battler-san the full credit for discovering the gold."'
35063: 'Erika@r@v46/54500194."......I may be here, but please continue your discussion as though I am not.@k@v46/54500195. Battler-san called all of the adults here, making sure that none of his cousins would notice.@k@v46/54500196. That can only mean one thing.@k@v46/54500197. ......He must wish for you all to conduct the true family conference."'
35064: 'Battler@r@v10/50100503."......Erika.@k@v10/50100504. Quit trying to run the show."'
35065: 'Erika@r@v46/54500198."Oh, how rude of me.@k@v46/54500199. ............In that case, I''ll step down as the facilitator of these proceedings.@k@v46/54500200. So, who will take my place?"'
35066: '@rShrugging, Erika looked around at everyone.'
35067: '@r......After a short period of silence, Eva made the first move.'
35068: 'Eva@r@v05/51000119."I assume none of us have forgotten......the deal we made earlier today."'
35069: 'Rudolf@r@v08/51200072."Yeah.@k@v08/51200073. We divide it between the four of us, 2.5 billion each.@k@v08/51200074. And then the successor to the head gets another 10 billion."'
35070: 'Natsuhi@r@v03/50900473.".........W-wait just a moment!@k @v03/50900474.Who decided that the one who discovers the gold becomes the successor?!"'
35071: 'Hideyoshi@r@v06/51100071."Hold your horses, you''re not gettin'' away with that, Natsuhi-san...!!@k @v06/51100072.That''s been the basis of all our talkin'' this whole time!@k @v06/51100073.Sayin'' that now is shameful, don''t ya think?!"'
35072: 'Rosa@r@v12/51400085."...That''s right.@k@v12/51400086. ......Weren''t you the one worrying about how if one of the servants solved the riddle, they might consider themselves the successor to the head...?"'
35073: 'Krauss@r@v02/50800222."But nowhere is it explicitly written that that''s the truth!"'
35074: 'Eva@r@v05/51000120."You miserable coward!!!@|@y@k @v05/51000121.That was the way every single one of us interpreted it!!"'
35075: 'Rudolf@r@v08/51200075."She''s right, Aniki!@k @v08/51200076.Are you really going to do a 180 on that now?!"'
35076: 'Kyrie@r@v09/51300055."Though it was never written down, I believe it was most definitely common understanding between us.@k@v09/51300056. I don''t see how you can say it''s completely irrelevant."'
35077: 'Natsuhi@r@v03/50900475."You can''t just interpret the head''s epitaph however you like!!@k @v03/50900476.Where is it written that the one who finds the gold becomes the successor?!@k @v03/50900477.The epitaph was decided upon by the head.@k@v03/50900478. You have no right to decide these things for yourselves!!"'
35078: 'Krauss@r@v02/50800223.".........Calm down, Natsuhi."'
35079: 'Natsuhi@r@v03/50900479."How can I possibly calm down?!@k @v03/50900480.I certainly find it very impressive that Battler-kun solved the epitaph!@k @v03/50900481.I do think it would be fair for him to receive some kind of a reward.@k@v03/50900482. However, saying that reward should be half of everything here is clearly over the line,@k@v03/50900483. and the argument that the discoverer automatically becomes the successor is one that I absolutely will not permit to go unchallenged...!!"'
35080: 'Rosa@r@v12/51400087."Th-that''s low, Natsuhi nee-san...!@k @v12/51400088.This is completely different from what you were saying earlier today...!"@|@y'
35081: 'Rudolf@r@v08/51200077."I agree!@k @v08/51200078.It may not have been written down, but the fact that the guy who solves the epitaph becomes the successor has always been our greatest unwritten assumption...!@k @v08/51200079.It''s not exactly fair to start complaining about that at the last second, is it?!@k @v08/51200080.Yeah, not fair at all!!"'
35082: 'Natsuhi@r@v03/50900484."At any rate!!@|@y@k @v03/50900485.This gold belongs to Father!!@k @v03/50900486.We are not to decide how it will be split up without Father''s permission!!"'
35083: 'Hideyoshi@r@v06/51100074."No way!!@k @v06/51100075.That''s real low, Natsuhi-san!@k @v06/51100076.We were talkin'' about this on and on earlier!@k @v06/51100077.Are you sayin'' that whole conversation today was a bunch of bull?!@k @v06/51100078.That''s just not right!!"'
35084: 'Eva@r@v05/51000122."Why don''t we just vote on it?!!@k @v05/51000123.Battler-kun, the one who found the gold, is the successor to the head!@k @v05/51000124.My husband and I have no objections!!@k @v05/51000125.What about you, Rudolf and Kyrie-san?@k @v05/51000126.Rosa?!"'
35085: 'Rudolf@r@v08/51200081."No objections here. Nice going, Battler!!"'
35086: 'Rosa@r@v12/51400089."I have no objections either.@k@v12/51400090. Battler-kun is the true successor, chosen by the epitaph.@k@|@y@v12/51400091. If you aren''t satisfied, then why don''t we just ask Father directly...?!"'
35087: 'Kyrie@r@v09/51300057."That''s right.@k@v09/51300058. Like you just said, Natsuhi nee-san, Father is the one who wrote the riddle of the epitaph.@k@v09/51300059. And he''s also the proper owner of this gold.@k@|@y@v09/51300060. In that case, we should raise the matter with him, wouldn''t you say?@k @v09/51300061.What kind of treatment should Battler-kun receive as the person who discovered the gold?@k@v09/51300062. I believe Father is the only one with the right to determine that...!"'
35088: 'Natsuhi@r@v03/50900487."B-...but......!!"'
35089: 'Krauss@r@v02/50800224."......I told you to calm down........."'
35090: 'Eva@r@v05/51000127."Rosa and Kyrie-san are right.@k@v05/51000128. Let''s ask Father!!@k @v05/51000129.It''s time for you two to step aside!!"'
35091: 'Hideyoshi@r@v06/51100079."Darn right!!@k @v06/51100080.Bring Father down to us!!@k @v06/51100081.We won''t get anywhere with just you two!@k @v06/51100082.Let''s get the real family conference started!!@k @v06/51100083.You think this looks like somethin'' you can put off because he''s tired?!@k @v06/51100084.We don''t do this properly, an'' we''ll have a massive problem on our hands...!"'
35092: 'Hideyoshi@r@v06/51100085."Hey, ya listenin'' to me?!!@k @v06/51100086.I''m sayin'' we''re through with you two!!@k @v06/51100087.Get off your asses and bring Father down right noooooow!!!"'
35093: 'Erika@r@v46/54500201."...............Are family conferences always like this?"'
35094: 'Battler@r@v10/50100505."......How the hell''d I know?"'
35095: 'Erika@r@v46/54500202."They''re probably always feeling like this on the inside.@k@v46/54500203. .........Heheheheh.@k@v46/54500204. Looks like they won''t be able to get this figured out right now without Kinzo-san."'
35096: 'Erika@r@v46/54500205."......To think he''s still being called out to settle his children''s fights even though he''s been told he only has a short while to live.@k@v46/54500206. ......I wonder how he feels right about now.@k@v46/54500207. ......*giggle*.@k@v46/54500208. Imagining that...no, deducing that will be a treat."'
35097: '@rThe parents ignored Battler and Erika and kept yelling at each other, on and on...'
35098: '@rEven though Battler had more or less imagined that this sort of thing happened behind the scenes, this was the first time he had seen it.'
35099: '@rHe had suspected it since six years ago,@k and he''d been able to get a pretty good idea of what this was like by the darkening expressions on his parents'' faces when this time of year drew near...'
35100: '@rHowever, this argument his relatives were having before his very eyes...@w500....was much more...@k...ugly than he had imagined...'
35101: '@rHe was very glad that he''d called the adults out here without letting the cousins catch wind of anything......'
35102: '@rPerhaps because everyone was tired out from this seemingly endless argument, they took a short break.'
35103: '@rIt was decided that this family conference inside the Golden Land should be moved over to the mansion...'
35104: '@rThis place may have been gorgeous, like a VIP room, but there was no ventilation, and it was a little cold.'
35105: '@rIt wasn''t well suited for a long conversation.'
35106: '@rThey thought of the possibility that someone might carry the gold away while their backs were turned,@k but it wasn''t as if anyone could manage much with just human hands and a small amount of time when they had ten tons of gold to deal with.'
35107: '@rIn fact, it even seemed as though having this mountain of gold in the background was robbing them of the ability to make sound decisions.'
35108: '@rSo they agreed to return to the mansion, in part so that they could regain their composure and continue the conference more ruthlessly......'
35109: 'Erika@r@v46/54500209."......Well then, I will retire for the night.@k@v46/54500210. ......I imagine I would just get in the way if I remained any longer."'
35110: 'Rudolf@r@v08/51200082."Yeah, sorry about this.@k@v08/51200083. Did we bother you too much?"'
35111: 'Rosa@r@v12/51400092."Please let us show our gratitude again tomorrow.@k@v12/51400093. Sorry for letting you see such an embarrassing side of us."'
35112: 'Eva@r@v05/51000130."I know you said you were turning it down,@k@v05/51000131. but we''ll still prepare a fitting share, out of gratitude, for you as one of the first to discover the gold.@k@v05/51000132. Right, Nii-san?"'
35113: 'Krauss@r@v02/50800225."......Mm.@k@v02/50800226. We know what you''re capable of.@k@v02/50800227. I think you can grasp our current circumstances."'
35114: '@r20 billion yen in gold wasn''t something they wanted out in the open.'
35115: '@rThey didn''t want an outsider like Erika telling people about it.'
35116: '@rOf course, Erika had already "deduced" that much.'
35117: '@rShe wore an unpleasant smile on her face, as though she understood all too well...'
35118: 'Erika@r@v46/54500211."......It''s quite unnecessary for you to worry about me.@k@v46/54500212. I have no intention of telling anyone about this, of course.@k@v46/54500213. ......And even if I did, no one would believe me without proof."'
35119: 'Erika@r@v46/54500214.".........I had the pleasure of witnessing something very interesting tonight.@k@v46/54500215. It was truly a feast for the eyes, so let me assure you that I''m more than satisfied."'
35120: 'Eva@r@v05/51000133."Heheh, I see.@k@v05/51000134. Yes, it''s not every day you get to see ten tons of gold."'
35121: '@r......Getting to see the gold was the feast for the eyes?@k Of course not.@k@rFrom Erika''s dark nature, it was easy to guess what she was so happy about seeing.'
35122: '@rI thought about telling her to get the hell out of here already, but I wanted out myself...'
35123: '@rI tried to head back to the guesthouse along with Erika.@k@rHowever, Kyrie-san grabbed my shoulder.'
35124: 'Kyrie@r@v09/51300063."Not you as well, Battler-kun.@k@v09/51300064. You come with us, please."'
35125: 'Hideyoshi@r@v06/51100088."Darn right.@k@v06/51100089. You''re a real successor to the head now!@k @v06/51100090.You''ve gotta go see Father and make it all official...!"'
35126: 'Natsuhi@r@v03/50900488."Father is the only one who gets to decide that!!@k @v03/50900489.Don''t make things up on your own!"'
35127: 'Rudolf@r@v08/51200084."......Battler.@k@v08/51200085. I know it''s a pain, but you''re gonna have to stick around with us for a little while longer.@k@|@y@v08/51200086. Don''t say a word.@k@v08/51200087. Just stay quiet and keep your head down.@k@v08/51200088. Got it?"'
35128: 'Battler@r@v10/50100506."............Just do whatever you want."'
35129: '@rIt would have been easy to say that I had no interest in being successor to the head.'
35130: '@r......But I was sure that would only add more oil to the fire.'
35131: '@rEven if I hadn''t been ordered to keep quiet, I was certain that staying shut up like a clam was the wisest thing to do...'
35132: '@rIn that case, would it really be so bad if they just let me go back to the guesthouse...?'
35133: '@rDad put his arm firmly around my shoulder, and I told him to quit crowding me.'
35134: '@rBut it didn''t make any difference...'
35135: 'Battler@r@v10/50100507.".........We solved the epitaph.@k@v10/50100508. Just like you wanted."'
35136: 'BEATRICE@r"................................."'
35137: 'Battler@r@v10/50100509."When you were the Game Master, we''d always get those letters.@k@v10/50100510. ......"Try and solve the epitaph.@k@v10/50100511. If you don''t, I''ll kill you all"."'
35138: 'BEATRICE@r"................................."'
35139: '@r.........Why did she want to make us solve the riddle of the epitaph?'
35140: '@rBy solving it, we found a mountain of gold.@k@rYippee for us.'
35141: '@rAnd what about Beato?'
35142: '@r......Does she gain anything......by having us find the gold?'
35143: '@rOr does she lose something...?'
35144: 'Battler@r@v10/50100512."...As far as chessboard thinking tells us, ......people don''t make moves which cause them to lose something.@k@v10/50100513. That means you must have something to gain by having us solve the epitaph..."'
35145: 'VIRGILIA@r@v30/53200071."No.@k@v30/53200072. @|@y@c900.@[This child has nothing to gain from having someone solve the epitaph.@]@c."'
35146: 'Battler@r@v10/50100514."............Are you sure that''s alright?@k@v10/50100515. Using the red truth like that without her permission."'
35147: 'VIRGILIA@r@v30/53200073."......It is what she would want."'
35148: '@rVIRGILIA, who had suddenly appeared there, gave me an immediate answer to my question with the red truth...'
35149: 'Battler@r@v10/50100516."In the past, I sometimes guessed that the reason Beato was trying to make us solve the epitaph...@k@v10/50100517.was that she wanted to make us find the gold''s hiding place for her so that she could snatch it away.@k@v10/50100518. .........Is that wrong too?"'
35150: 'VIRGILIA@r@v30/53200074."Yes.@k@v30/53200075. ......In the first place,@w166.@v30/53200076.@|@y @c900.@[the gold of the Golden Land belongs to her from the start.@]@c.@k@v30/53200077. @|@y@c900.@[She has absolutely no need to make anyone find it for her or to snatch it away herself.@]@c."'
35151: '@rOf course.@k ......Beato is BEATRICE the Golden.'
35152: '@rShe''s the master of the Golden Land and the Ushiromiya family alchemist.@k@r...That makes total sense.'
35153: '@rHowever, if that''s true, that makes me even more confused.'
35154: '@r......Even if someone exposes the answer to the epitaph''s riddle, Beato gains nothing.'
35155: '@rNo, to the contrary, she might get her own gold stolen away.'
35156: 'Battler@r@v10/50100519."In that case, I''m understanding this less and less.@k@v10/50100520. .........I understand the epitaph murders.@k@v10/50100521. It could be revenge against the Ushiromiya family, or else a ritual to revive her powers as a witch.@k@v10/50100522. ...She''s probably got some reason or goal of her own for it."'
35157: 'BEATRICE@r"................................."'
35158: 'Battler@r@v10/50100523."But what''s the point of her telling us to solve the epitaph?@k@v10/50100524. Whether we solve it or not, she gains nothing.@k@v10/50100525. ......In other words, the whole issue of whether the epitaph is solved or not is immaterial in Beato''s eyes."'
35159: 'VIRGILIA@r@v30/53200078."......You could say that.@k@v30/53200079. @|@y@c900.@[Whether the epitaph''s riddle is solved or not, she has nothing at all to gain from it.@]@c."'
35160: 'Battler@r@v10/50100526."It doesn''t matter whether it''s solved or not.@k@v10/50100527. ......Doesn''t that mean that the epitaph''s riddle itself has no value to Beato...?"'
35161: 'VIRGILIA@r@v30/53200080."..................@k@v30/53200081. ......I suppose.@k@|@y@v30/53200082. The epitaph''s riddle doesn''t have any meaning for her.@k@v30/53200083. So even if you take the extreme position that it''s immaterial and has no value, it may not be possible to argue against your claim..."'
35162: 'BEATRICE@r"................................."'
35163: '@rBeato......'
35164: '@r......Why are you making us solve the riddle of the epitaph...?'
35165: '@rIf we liken the witch you are to a pair of scales, the epitaph murders lie on one plate...'
35166: '@rAnd the riddle of the epitaph lies on the other plate.'
35167: '@rBecause she''s saying that she''ll stop the epitaph murders if the epitaph is solved.'
35168: '@r......In other words, the epitaph murders and the epitaph''s riddle are worth the same to Beato.'
35169: '@rLike two sides on a balanced scale.'
35170: '@rThat means that the epitaph''s riddle and massacring the entire family...@khave equal significance from Beato''s point of view......'
35171: '@rBut VIRGILIA responded with the red text.'
35172: '@r@a1666.@|@y@c900.@[Regardless of whether the epitaph is solved or not, Beato has nothing to gain.@]@c.'
35173: '@rIf she has nothing to gain, then this epitaph''s riddle...is meaningless and immaterial to Beato.'
35174: '@rIn that case, how much are the epitaph murders, which lie on the other side of the scales and are equal to the epitaph''s riddle in value...@k......worth to her...?'
35175: '@r......Think, don''t stop thinking......'
35176: '@rThe epitaph murders and solving the riddle of the epitaph have equal worth.'
35177: '@rAs long as the epitaph murders, which are Beato''s goal each time, have this single way that they can be stopped, a way that she decided on herself, both are worth the same thing to her.'
35178: '@rX=Y.@k@rAnd whether the epitaph''s riddle is solved or not, Beato gains nothing.@k@rY=0.@k@rSo, in this case, ......what is X......?'
35179: 'BEATRICE@r"................................."'
35180: 'Battler@r@v10/50100528."......Wait a sec.@k@v10/50100529. ......That means the epitaph murders are also meaningless and immaterial."'
35181: 'Battler@r@v10/50100530."......Beginning with politely sending us an advance notice,@k@v10/50100531. she''s been willing to spend an incredible amount of effort killing us one by one, following the epitaph''s steps in order, without getting exposed,@k@v10/50100532. every time she performs that bizarre serial murder.@k@v10/50100533. So all of that is meaningless to her...?"'
35182: '@rI''ve flipped over the chessboard many times exploring Beato''s moves.@k@rThis was always the first place I stumbled.'
35183: '@rThe significance of the epitaph murders.'
35184: '@rWhy did she have to commit serial murders in a way that reproduced the witch''s epitaph?'
35185: '@rIf she wanted to kill the whole Ushiromiya family for revenge, it would be much simpler, safer, and more reliable if she just put poison into their dinner,@k or else went around killing people one by one in the middle of the night while they were sleeping.'
35186: '@rHowever, on the first evening, Beato sends us a letter that sounds like an advance notice,@k and then carries out what could be broadly described as a three-part serial murder,@k killing six people on the first twilight, two on the second, and five on the fourth and later.'
35187: '@rWe aren''t fools.'
35188: '@rOnce the first murders occur, we barricade ourselves in somewhere to stave off any further murders.'
35189: '@rFurthermore, we quickly suspect a culprit among us and start analyzing each other''s alibis.'
35190: '@rAs the victims increase, the number of suspects decreases automatically,@k and Beato''s chances of completing the serial murder drop closer and closer to zero...'
35191: '@rEverything about the epitaph murders......is full of useless ornament and empty decoration...@k...that only seems to make it harder for her to carry out the serial murder.'
35192: 'Battler@r@v10/50100534.".........She''s raising the difficulty of completing her own objective."'
35193: 'VIRGILIA@r@v30/53200084."That does follow.@k@v30/53200085. ......She''s a strange child, isn''t she?"'
35194: 'Battler@r@v10/50100535."Did you know?@k @v10/50100536.In mystery novels, there are sometimes murders that follow the events of a poem or nursery rhyme, just like these epitaph murders.@k@v10/50100537. ......I think you can split the reasons these "nursery-rhyme murders" occur into three major groups."'
35195: 'VIRGILIA@r@v30/53200086."......And what are those?"'
35196: 'Battler@r@v10/50100538."The first would be when it benefits the culprit to follow the epitaph and thereby confuse the evidence and alibis.@k@v10/50100539. ......The classic technique of pretending to be dead and mixing yourself in with the victims is an example of this,@k@v10/50100540. as is committing murders in an order that doesn''t follow the epitaph so that you can cause the others to mistake the order and give yourself an alibi."'
35197: 'VIRGILIA@r@v30/53200087."I see.@k@v30/53200088. So she could make it look as though she was carrying out the murders in accordance with the epitaph, ......when she was actually guiding everyone''s thinking in a manner that benefited her.@k@v30/53200089. That sounds interesting."'
35198: 'Battler@r@v10/50100541.".........However, in our games, the dead are truly down for the count thanks to the red.@k@v10/50100542. ...She might be able to trick everyone in the world of the game board, but she can''t trick us up here in the same way.@k@v10/50100543. ......In other words, the most traditional purpose for this kind of murder...isn''t what we''re dealing with here."'
35199: 'VIRGILIA@r@v30/53200090."In that case, what are the other two reasons for carrying out a nursery-rhyme murder?"'
35200: 'Battler@r@v10/50100544."One is coincidence.@k@v10/50100545. ......The culprit carries out a serial murder which just happens to look similar to the epitaph without being intended to,@k@v10/50100546. and the witnesses mistakenly think it''s a nursery-rhyme murder.@k@v10/50100547. We humans try to find cause and effect in everything we see.@k@v10/50100548. ......If we think we know what something is, then that''s how it looks to us."'
35201: 'VIRGILIA@r@v30/53200091."......I see.@k@v30/53200092. That''s also interesting.@k@v30/53200093. ...However, I''m not sure it''s convincing.@k@v30/53200094. In this child''s games, there''s always an advance notice of the crime given before the murders of the first twilight.@k@v30/53200095. Also, I believe you find letters and circumstantial evidence one after another that clearly show the culprit is carrying out epitaph murders."'
35202: 'Battler@r@v10/50100549."Yeah, that''s right.@k@v10/50100550. .........It isn''t coincidence.@k@v10/50100551. From the very beginning, Beato has been intentionally shoving the epitaph murders in our faces as she carries them out.@k@|@y@v10/50100552. We aren''t just misunderstanding.@k@v10/50100553. These murders clearly follow the epitaph.@k@v10/50100554. So this can''t be the reason either."'
35203: 'VIRGILIA@r@v30/53200096."In that case, ......it must be your final reason."'
35204: 'Battler@r@v10/50100555."The last one.........is to show the murders to someone.@k@v10/50100556. In other words, to make them feel fear.@k@v10/50100557. ...By following the epitaph, she gives the others clear notice in advance that the murders will continue.@k@v10/50100558. The survivors are in constant fear of the murders, which they''re certain will continue."'
35205: 'BEATRICE@r"...................................."'
35206: 'VIRGILIA@r@v30/53200097."In other words,@v30/53200098. ......this child performed these epitaph murders to create a feeling of mortal terror?"'
35207: 'Battler@r@v10/50100559."At least, ...putting it that way, everything makes a surprising amount of sense.@k@v10/50100560. ......The grotesque mutilation of the bodies and the disturbing displays were all a show to terrify us......"'
35208: 'VIRGILIA@r@v30/53200099."To terrify whom......?"'
35209: 'Battler@r@v10/50100563."Huh?@k @v10/50100564.......Like I said, us.@k@|@y@v10/50100565. .............................."'
35210: '@rAfter hearing that one line VIRGILIA spoke so casually, ......my thoughts clouded over once again...'
35211: '@rIs it really enough...@kto just use the vague word "us"......?'
35212: '@rThere are a lot of people in the Ushiromiya family.'
35213: '@rThere''s the head and the one who holds the rank of his successor...Grandfather and Uncle Krauss.'
35214: '@rOur parents, who have some pull in the business world.'
35215: '@r......On the other side, you have the young cousins, who usually visit at most once a year,@k and the unfortunate servants, who just happened to be on duty.'
35216: '@r......Even if the culprit hated all of us,@k ......they probably didn''t hate all of us equally.'
35217: '@rIn other words, they might have made it clear which of those among us they particularly wanted to take revenge against and terrify.'
35218: '@rIf we liken this to a kid eating dessert......'
35219: '@rIsn''t the strawberry on top of a shortcake the part you should eat last?'
35220: '@rNo one tells you that you shouldn''t eat it first, but our mentality leads us into saving it for later.'
35221: 'Battler@r@v10/50100566.".........In that case, ...the culprit would want to leave the person they hated most until the end.@k@|@y@v10/50100567. ......Yeah, similar to what was said by my favorite character in this novel I like.@k@v10/50100568. Something about how if you start by killing the people closest to someone, make them feel that sadness, then kill that person last of all,@k@v10/50100569. that''s the worst way to kill someone."'
35222: 'VIRGILIA@r@v30/53200100."Oh my, that must have been quite a terrifying novel.@k@v30/53200101. How frightening......"'
35223: 'Battler@r@v10/50100570."......In that case, you could argue that the people who stay alive until the end are the ones Beato hates the most.@k@v10/50100571. ......But the order people are killed in gets totally changed every single time.@k@|@y@v10/50100572. ......I mean, we all die in the end,@v10/50100573. but if you go through looking for someone who lives at least until the last twilight every time, there''s...@v10/50100574......................@k@v10/50100575. ..........................."'
35224: 'BEATRICE@r"...................................."'
35225: '@r......There''s only me.'
35226: 'VIRGILIA@r@v30/53200102.".........Let me first speak with the red.@k@v30/53200103.@|@y @c900.@[Battler-kun, you are not the culprit.@]@c.@k@v30/53200104.@|@y @c900.@[You haven''t killed anyone.@]@c.@k@v30/53200105. @|@y@c900.@[This can be said of all games.@]@c."'
35227: 'Battler@r@v10/50100576."Then that.........just makes it even more likely that it''s about me.@k@v10/50100577. ...It means the sole reason she had for bringing about the epitaph murders...was to show them to me."'
35228: '@rBeato''s always making out that she chooses who to kill next by roulette.'
35229: '@rBut I''m an exception. The only exception.@k@r......Though she does kill me in the end, she always leaves me be until the very last moment.'
35230: '@rIn all of these supposedly random games, there''s only this one unchanging constant......'
35231: 'Battler@r@v10/50100578."She wants.........revenge? Against me?@k @v10/50100579.So is she performing the epitaph murders to make me feel fear...?"'
35232: 'VIRGILIA@r@v30/53200106."That''s wrong.@k@v30/53200107.@|@y ......@c900.@[Her goal is not to make someone experience fear.@]@c.@k@v30/53200108. @|@y@c900.@[And it isn''t to have revenge on someone either.@]@c."'
35233: 'Battler@r@v10/50100580."In that case!@k @v10/50100581.That means the epitaph murders really don''t mean anything to her.@k@v10/50100582. The riddle of the epitaph is meaningless, and the corresponding epitaph murders are also meaningless.@k@v10/50100583. X=Y=0!@k @v10/50100584.But even so, she''s clearly trying to show these meaningless things to me!"'
35234: 'Battler@r@v10/50100585."What could she want from me...which is worth the same to her as something meaningless?!@k @v10/50100586.......I don''t get it!!@k @v10/50100587.The more I think about it, the less I understand what she''s thinking!"'
35235: 'BEATRICE@r"...................................."'
35236: '@rBEATRICE,@k the fickle witch who committed a meaningless, worthless serial murder.'
35237: '@rEven the riddle of the epitaph, which she made into a condition to suspend the serial murders,@k is meaningless, immaterial.'
35238: '@rAnd......she''s thrusting this meaningless, immaterial thing in front of my face.'
35239: '@r......What is it......that you want from me...?@k@r......Or else, what is it that you want to give me......?'
35240: '@rMy idea that Beato must have been taking revenge on me...has already been refuted in red by VIRGILIA.'
35241: '@rBoth X and Y...@k@rBoth the epitaph murders and the epitaph''s riddle...mean nothing to Beato.'
35242: '@rX=Y=0.'
35243: '@rHowever, since she''s thrusting that in front of me,@w500. ...it must...@w500....have some meaning.'
35244: '@rShe presents us a pair of scales representing "if you don''t solve the epitaph, I''ll carry out the epitaph murders".'
35245: '@rNeither the epitaph murders nor the epitaph''s riddle have any significance by themselves.'
35246: '@rHowever, it becomes meaningful when she puts both halves on the scales and thrusts it out before us.........no, before me.'
35247: '@r......In other words, it should be like this:'
35248: '@rX=0.@k@rY=0.@k@rX+Y>0.'
35249: '@rA scale with meaningless, weightless things on both sides.@k@rHowever, it has weight itself...and gives the rest meaning.'
35250: 'Battler@r@v10/50100588."......It''s almost like......playing.@k@v10/50100589. Like kids playing rock-paper-scissors."'
35251: '@rRock-paper-scissors is the most immediate method of randomly determining a winner and a loser.'
35252: '@rYou usually bet some sort of privilege on the outcome,@k ......but kids often do rock-paper-scissors just to play, without betting anything in particular.'
35253: '@rUnless you bet something, nothing but a feeling of joy or disappointment will come from a win or a loss.'
35254: '@rIn other words, the two sides of the scale, winning and losing, are both valueless.'
35255: '@rHowever, the very act of seeing which way it will tip...@kis the reason kids play rock-paper-scissors.'
35256: '@rAfter all, the kids are enjoying the communication that surrounds the game,@k ......and they aren''t purely interested in the value of winning or losing.'
35257: '@rThey aren''t overly concerned about who wins and who loses......'
35258: 'Battler@r@v10/50100590."That would mean that it doesn''t matter to Beato......whether the epitaph murders succeed or not.@k@v10/50100591. ......It almost feels like she''s just enjoying the process."'
35259: 'VIRGILIA@r@v30/53200109."........................"'
35260: 'Battler@r@v10/50100592."......In the past, ...I would have cursed her, deciding that she was a heartless witch who kept murdering people for no reason.@k@v10/50100593. ......But now, I can''t imagine that''s true."'
35261: 'VIRGILIA@r@v30/53200110.".........Thank you.@k@v30/53200111. In that case, I''ll give you one more red.@k@v30/53200112.@|@y ...@c900.@[Beato never committed murder for the sake of pleasure.@]@c."'
35262: '@rShe didn''t do it for pleasure, and she didn''t do it to make anyone feel fear.'
35263: '@rShe has nothing to gain from the epitaph murders,@k and she doesn''t care whether they succeed or fail.'
35264: '@rIt''s almost like...a random game kids would play......'
35265: 'Battler@r@v10/50100594."No.@k@v10/50100595. ......It must have meaning.@k@v10/50100596. To her."'
35266: 'VIRGILIA@r@v30/53200113.".........And what is...this meaning...?"'
35267: 'Battler@r@v10/50100597."I don''t know.@k@v10/50100598. Even though neither side of the scale has any value, ......the scale itself has some weight to it in her eyes."'
35268: '@r......Of course it isn''t meaningless.@k Some meaning definitely exists.'
35269: '@rIn the previous game, she urged me to remember my sin of six years ago.'
35270: '@r......Was that "meaningless" too?'
35271: '@rNo.@k There''s no way that''s the case.'
35272: '@rI clearly remember the serious look in her eyes at that moment.'
35273: '@rUnfortunately, I didn''t have a clue what she was talking about.@k@r......And she was devastated.'
35274: '@rThat''s right.'
35275: '@rAt that time, I''m sure she even went so far as to say that the crime wouldn''t have occurred if I hadn''t come.'
35276: 'Battler@r@v10/50100601."There is a meaning.@k@v10/50100602. .........A meaning to her.@k@|@y@v10/50100603. And she wants me to provide it."'
35277: 'BEATRICE@r@v27/50700323.".........................................."'
35278: '@rI laughed softly and poked Beato lightly on the head,@k ......then patted her head.'
35279: 'Battler@r@v10/50100604."......Next time you want to send a love letter, I suggest that you just write "I love you".@k@v10/50100605. ...If you make it too roundabout and confusing, no one''s gonna be able to figure it out."'
35280: 'VIRGILIA@r@v30/53200114.".........*giggle*."'
35281: 'Battler@r@v10/50100606."I still don''t have a clue what she''s thinking.@k@v10/50100607. ......But even so,@k@|@y@v10/50100608. I won''t stop thinking.@k@v10/50100609. ...I''ve only just started flipping over the chessboard.@k@v10/50100610. ......I definitely won''t give up......on this journey through your thoughts."'