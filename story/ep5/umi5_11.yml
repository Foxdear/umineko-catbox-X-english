37048: 'BEATRICE@r@v27/50700644.".........S-sorry, Kinzo...@k@v27/50700645. ......She really is...too tough for me......"'
37049: 'Kinzo@r@v01/51500206."BEATRICE, I thank you.@k@v01/51500207. ......You''ve fought so hard for me despite your lingering grudge."'
37050: 'BEATRICE@r@v27/50700646."I guess it''s true that your life flashes by when you see death coming.@k@v27/50700647. ......I''ve remembered how you once looked when you were young.@k@v27/50700648. .........You were annoyingly like Battler."'
37051: 'Kinzo@r@v01/51500208."Battler is now carrying on everything, including my soul and the right to lead the family.@k@v01/51500209. I no longer have any regrets...!"'
