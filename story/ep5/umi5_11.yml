37105: 'Erika@r@v46/54500542."......Miss Dlanor,@k@v46/54500543. there isn''t a remote chance of a mistake, is there?@k @v46/54500544.It is impossible for Kinzo and the witch to slip out of this room, correct?"'
37106: 'Dlanor@r@v47/54600062."Of COURSE.@k@v47/54600063. ......Gertrude, Cornelia,@k@v47/54600064. and the imperial guard,@k@v47/54600065. double check that the seal of this locked room is PERFECT."'
