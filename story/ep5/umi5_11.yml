36433: 'Natsuhi@r@v03/50900750."Wh-what did you say...?!@k @v03/50900751.This is the family head''s precious study and research room!@k @v03/50900752.No one is permitted to intrude without his permission, no one!"'
36434: 'Eva@r@v05/51000218."Who here holds the highest rank?@k @v05/51000219.Me, remember?!@k @v05/51000220.I am the third in rank of the Ushiromiya family!@k @v05/51000221.And if someone must be scolded by Father for opening this door, that will be my responsibility as the highest ranked as well.@k@v05/51000222. As this is an emergency, I am opening this door.@k@v05/51000223. You have a key, right? Open it."'
