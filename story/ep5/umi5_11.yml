37356: 'Battler@r@v10/50100932.@|@y"@c279.@[Ushiromiya Kinzo escaped from the study through the window when Aunt Natsuhi couldn''t see him.@k@v10/50100933.@|@y Aunt Natsuhi didn''t notice and locked the window.@k@v10/50100934.@|@y This way, Aunt Natsuhi can see Grandfather go to bed at eleven o''clock and Grandfather can escape from the study without contradicting the lock of the window or the door sealed by the receipt.@k@v10/50100935.@|@y I proved through my demonstration that this escape was physically possible.@k@v10/50100936.@|@y Therefore, this battle is over!!@]@c."'
37357: '@rThe blue wedge flashed through the courtyard along with a blue bolt of lightning,@k and roared down towards Dlanor''s forehead as she stared up at the sky.'
