37117: '@rEveryone nodded and watched Battler''s every move...'
37118: 'Battler@r@v10/50100864."So I''m Grandfather, and I was lying in bed like this,@k@v10/50100865. grunting my understanding of Aunt Natsuhi''s report or whatever."'
