37095: 'Kinzo@r@v01/51500215."Heh, ......heheheheh...@k@v01/51500216. ......I''ve got it.@k@v01/51500217. I see, so that move is still available."'
37096: 'Battler@r@v10/50100855."So you finally figured it out, you damn geezer.@k@v10/50100856. Hidden doors and hiding under the bed...... All that stuff is so pathetic I was almost weeping for you.@k@|@y@v10/50100857. This is the Ushiromiya Kinzo we''re talking about here.@k@v10/50100858. ......There''s got to be a more thrilling and exciting answer."'
37097: 'Kinzo@r@v01/51500218."Exactly.@k@v01/51500219. How pitiful that I couldn''t even match my own ingenuity.@k@v01/51500220. And how pitiful that with all these relatives of mine present, the only one to understand me is the grandson who''s returned after six years of absence.@k@|@y@v01/51500221. .........Battler, you are my acting proxy.@k@v01/51500222. Do not disgrace my legacy!"'
