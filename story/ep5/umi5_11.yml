37089: '@rRustle.'
37090: '@r.........That sound wasn''t just the noise of the onlookers fidgeting.@k@r...It was a provocative chill that ran up Erika''s spine.'
37091: 'Erika@r@v46/54500536.".........I like it.@k@v46/54500537. Yes, you are after all the Ushiromiya family head, the one who bears the Head''s Ring.@k@v46/54500538. That should more than qualify you to stand in for Kinzo-san.@k@|@y@v46/54500539. .........So let''s hear your deduction!!"'
