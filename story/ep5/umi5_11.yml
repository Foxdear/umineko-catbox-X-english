36443: '@rThe atmosphere, which had been so agitated a second ago, suddenly went cold......and an eerie feeling filled the room as everyone stared at Natsuhi.'
36444: '@r......They could understand why Natsuhi would protect the study under normal circumstances.'
36445: '@rIt was understood that she probably didn''t want to disturb the research of Kinzo, whom she respected,@k and she was therefore trying to keep the unpleasant relatives away.'
36446: '@rHowever, ......this was an emergency.@k People had been murdered.'
36447: '@rNatsuhi''s persistence in keeping things quiet for Kinzo even in a situation like this...@kwas hard to understand from a rational perspective.'
36448: 'Erika@r@v46/54500311.".........The evidence suggests that the crimes occurring on this island are most likely a series of murders following the epitaph.@k@v46/54500312. ......It''s probably reasonable to assume that the crimes will continue."'
36449: 'Erika@r@v46/54500313."If we reinterpret the epitaph as outlining this series of murders, that means the crimes will continue further, resulting in a total of thirteen lives being taken.@k@v46/54500314. .........Do you have any concept of how many victims that would be?"'
