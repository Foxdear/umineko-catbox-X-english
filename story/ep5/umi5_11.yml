36451: 'Erika@r@v46/54500315."Non, non. You have it all wrong.@k@v46/54500316. .........To my knowledge, the serial murder resulting in the most deaths in mystery novel history...@k@v46/54500317.was ten people in a well-known work from England, in which everyone including the culprit died.@k@v46/54500318. As far as Japanese mysteries go, it''s probably that famous novel in which an astrologer served as the detective.@k@v46/54500319. Though there were less than ten deaths in that one."'
36452: 'Erika@r@v46/54500320."......Do you realize?@k @v46/54500321.If this continues and thirteen people die, it will lead to the most prestigious and gruesomely spectacular accomplishment in the annals of mystery writing:@k@v46/54500322. the completion of a thirteen-person serial murder case!@k @v46/54500323.And if everyone on this island is killed..."'
36453: 'Erika@r@v46/54500324."......Why, that could give it an even greater number of deaths than the world record for serial murder mysteries and Japan''s record added together,@k@v46/54500325. making it a historical achievement in the world of serial murder mysteries!@k@v46/54500326. ......Well? Did you know that, ladies and gentlemen?"'
36454: 'Erika@r@v46/54500327."The culprit of this crime...@k@v46/54500328....is undertaking an incredible challenge, one that stands to rewrite the record books of mysteries throughout the world and throughout history!@k @v46/54500329.......But I''m sure all of you were well aware of that, weren''t you......?@k @v46/54500330.Any mystery lover worth her salt will have read the works of the Queen of Crime.@k@v46/54500330B. And it goes without saying that any Japanese reader has covered the works of the Shin-Honkaku genre of mysteries.@k@|@y@v46/54500331. ......Are you sure you''ve been reading enough, everyone?@k @v46/54500332.*giggle*giggle*, *cackle*cackle*cackle*........."'
36455: 'Battler@r@v10/50100812."............That''s no good."'
36456: 'Erika@r@v46/54500333."Oh.........?"'
36457: 'Battler@r@v10/50100813."Looks like you haven''t read enough yourself."'
36458: 'Erika@r@v46/54500334."Did I say something wrong...?"'
36459: '@rErika, who had been chatting away happily all by herself up until a second ago,@k changed her expression into a displeased glare in an instant...'
36460: 'Battler@r@v10/50100814."About Japanese mysteries.@k@v10/50100815. ......Prior to Shin-Honkaku, a writer of the Shin-Gesaku school wrote a different work that also qualifies."'
36461: 'Erika@r@v46/54500335.".....................@k@|@y@v46/54500336. .....................Th-@k@v46/54500337..........the number of people was the same in both."'
36462: 'Battler@r@v10/50100816."They tie for the record, but if you pay attention to the fact that the Shin-Gesaku novel asked its readers to search for the culprit, it''s a far more fitting example.@k@v10/50100817. If you know so much about this, shouldn''t your examples have been based on more than simply the number of victims, like perhaps the approaches of each work?"'
36463: 'Erika@r@v46/54500338."............nn,@v46/54500339. ...............khh."'
36464: '@rErika glared at Battler with an expression that couldn''t be fully described with the word "shock",@k and her arms shook as she stood there, lost for words......'
36465: 'LAMBDADELTA@r@v29/52200387."Ahahahahahahaha, kyaahhahahahahahahahahaha!!@k @v29/52200388.Oh my god, she''s so laaame, this is priceless!!"'
36466: 'LAMBDADELTA@r@v29/52200389."Well, I mean, who can blame her, right?@k @v29/52200390.Shin-Honkaku is so much more famous where mysteries are concerned.@k@v29/52200391. It''s easy to overlook that there were murder mysteries among the Shin-Gesaku novels.@k@|@y@v29/52200392. Aaahhihihihihihihihhyahahahaahh!!"'
