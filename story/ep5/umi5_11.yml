36476: 'Rudolf@r@v08/51200158."That''s right.@k@v08/51200159. At any rate, checking Dad''s safety is our first priority right now.@k@v08/51200160. But what should we do?@k@v08/51200161. He''s ignoring the phone and our knocking. The keys are inside.@k@v08/51200162. There''s nothing we can do.@k@v08/51200163. Are we supposed to knock this thick door down?@k @v08/51200164.......That won''t be easy."'
