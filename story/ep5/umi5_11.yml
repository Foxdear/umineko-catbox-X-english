37126: 'Battler@r@v10/50100868."......After seeing Grandfather go to sleep, Aunt Natsuhi apparently performs an inspection of the room before leaving."'
37127: 'Battler@r@v10/50100869."Of course, she has Shannon-chan and the others clean it every day,@k@v10/50100870. but she still checks it thoroughly herself.@k@v10/50100871. ......Making sure there was no dust piling up.@k@v10/50100872. Making sure that he hadn''t run out of any consumables."'
37128: 'Natsuhi@r@v03/50900854."Y-yes.@k@v03/50900855. This is the family head''s treasured room, so I check everything carefully myself instead of relying entirely on the servants.@k@v03/50900856. I do this every single time."'
37129: 'Shannon@r@v15/50500056.".........Th-that''s true.@k@v15/50500057. Madam always checks things very carefully."'
37130: 'Kanon@r@v16/50600071."Her inspection is very detailed, and she even checks all of the consumables in the washroom one by one."'
37131: 'Battler@r@v10/50100873."In other words, it''s not just dust on the windowsill like you see all the time on TV.@k@v10/50100874. .........She even checks to see that there''s enough soap and toilet paper in the washroom.@k@v10/50100875. Pretty devoted, if you ask me. It wouldn''t kill you to skip a day from time to time."'
37132: 'Natsuhi@r@v03/50900857."Th-that is my routine.@k@v03/50900858. I mustn''t become complacent in my inspection of the head''s room for even a single day."'
37133: 'Erika@r@v46/54500545."............What is your point?@k@v46/54500546. Please don''t waste our time putting on airs."'
37134: 'Kyrie@r@v09/51300129."*giggle*.@k@v09/51300130. Isn''t putting on airs the detective''s right?"'
37135: 'Erika@r@v46/54500547."Nn, gah, ......I...am the...d-detective........."'
37136: 'Battler@r@v10/50100876."Since we''re inside the study, you can probably tell, but even though we call it a study,@k@v10/50100877. it wouldn''t be wrong to call it a second house inside the mansion."'
37137: 'Battler@r@v10/50100878."It has a sleeping room, a study, a washroom, and even a toilet and bath.@k@v10/50100879. So it''s not so much a "room"...@k@v10/50100880.as it is a "house"."'
37138: 'Dlanor@r@v47/54600066."......Thank you for the explanation of the study''s LAYOUT.@k@|@y@v47/54600067. However, the move of having him hide somewhere within it has already been DEFEATED."'
37139: 'Battler@r@v10/50100881."There won''t be any hiding.@k@v10/50100882. But I''m pretty sure there are plenty of blind spots.@k@v10/50100883. ......For example, if Aunt Natsuhi went into the bathroom to check the amount of toilet paper,@k@v10/50100884. most of the study would be out of her sight range."'
37140: 'Battler@r@v10/50100885."......In other words, for almost every location in the study, the observer would have disappeared."'
37141: 'Chiester45@r@v35/53400014."!!@k @v35/53400015.......O-observer disappearance...!@k @v35/53400016.We''ve lost track of Kinzo...!"'
37142: 'Gertrude@r@v48/54800014."For your attention: I beg to inform you that the witch''s darkness is filling the study."'
37143: 'Kinzo@r@v01/51500227."Good. ......It''s being filled with the power of darkness.@k@v01/51500228. Heheheheheheheh!"'
37144: 'Erika@r@v46/54500548."And so what if the observer...if Natsuhi left...?@k @v46/54500549.......So what?!"'
37145: 'Battler@r@v10/50100886."When Grandfather noticed that fussy Aunt Natsuhi finally leaving, he got up."'
