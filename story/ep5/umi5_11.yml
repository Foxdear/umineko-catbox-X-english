36561: '@rTherefore, after confirming Beato''s resolve one last time and seeing that she was completely firm in her decision,@k ......they nodded in silence and accepted it.'
36562: 'Gaap@r@v32/53700124."OK.@k@v32/53700125. ......I''ll leave this up to you. I''m rooting for you.@k@v32/53700126. .........Take care."'
36563: 'BEATRICE@r@v27/50700479."Indeed.@k@v27/50700480. Feel free to stand back and watch my performance...!"'
36564: 'Ronove@r@v31/53100125."......Lady BERNKASTEL will probably start trying to expose Kinzo''s absence with a locked-room argument.@k@|@y@v31/53100126. ......Fights in a locked room are normally Gaap''s area of expertise.@k@v31/53100127. ......Queens rule the battlefield because they are best at fighting in wide open areas.@k@v31/53100128. ......This won''t be an easy fight."'
36565: 'BEATRICE@r@v27/50700481."I''m fully aware of that.@k@v27/50700482. I currently serve Natsuhi.@k@v27/50700483. It would not be right for me to delegate her peril to Gaap and callously watch from safety."'
36566: 'Ronove@r@v31/53100129."............Understood.@k@v31/53100130. ......I wish you luck in your battle."'
36567: 'Gaap@r@v32/53700127."Be careful...@k@v32/53700128. ......If it becomes a complete locked room, we won''t be able to come in and help you."'
36568: 'BEATRICE@r@v27/50700484."I''ll laugh at them a bit, and if things get bad, I''ll just grab Kinzo and run for it.@k@|@y@v27/50700485. It''ll be easy.@k@v27/50700486. With the door and the window, the past and the future to choose from, there are plenty of places to run to.@k@v27/50700487. Of course I won''t let this become a locked room."'
36569: 'Gaap@r@v32/53700129."......Though you won''t see us, we''ll be cheering you on from very close by.@k@v32/53700130. ......Good luck."'
36570: 'BEATRICE@r@v27/50700488."Mm."'
36571: '@rGaap and Ronove became a swarm of gold butterflies and disappeared,@k and Kinzo melted into the darkness beneath the bed.'
36572: '@rThen, Beato also became a swarm of gold butterflies and melted away inside the study...'
36573: '@rAfter that, all figures and signs of life had disappeared from the study, and it once more regained a silence as though no one had been there from the beginning...'
36574: '@rThen, ......Rudolf''s outline slipped into view from beyond the window''s curtain.'
36575: 'Rudolf@r@v08/51200185."Dad...!!@k @v08/51200186.If you''re there, answer!@k @v08/51200187.Daaad!"'
36576: '@rAs he yelled, he hit the window.'
36577: '@rHis foothold was so uncertain that just hitting the window felt life-threatening.'
36578: '@rBut of course, this was Rudolf, the show-off.'
36579: '@rDeciding that he couldn''t show himself up with so many people watching from below, he suppressed the fear from being so high up...@kand boldly knocked on the window.'
36580: 'Battler@r@v10/50100828.".........Come on, Grandfather... Can''t he hear...?"'
36581: 'Gohda@r@v17/51700068."I, I wonder...@k@v17/51700069. I hope he doesn''t drop the hammer..."'
36582: 'Kyrie@r@v09/51300107."How many seconds have passed?"'
36583: 'Kanon@r@v16/50600062."......It''s been thirty seconds since he knocked on the window."'
36584: 'Shannon@r@v15/50500044."So,@v15/50500045. ......he''s really going to...@v15/50500046.sm-@v15/50500047.......smash it?@k @v15/50500048.Umm, the Master...will be very angry..."'
36585: 'Kyrie@r@v09/51300108."There''s one person who''s been kind enough to brag about how accepting that anger is her duty, so there''s no need to worry.@k@|@y@v09/51300109. ......Rudolf-san!@k @v09/51300110.That''s enough. Do it...!"'
36586: 'Rudolf@r@v08/51200188."Sure...!@k @v08/51200189..........Dammit Dad, you better not complain after I smash it."'
36587: '@rHe hit it several times, and eventually, a fist-sized hole opened up in the glass.'
36588: '@rBecause of his unstable footing, this took a lot of effort...'
36589: '@rUsing the end of the hammer skillfully, he brushed aside the now fractured bits of glass and opened the hole further,@k stuck his hand through it, and unlocked the window.'
36590: '@rThen, after a hard struggle, he somehow managed to open the window, and his body slipped through into the study.'
36591: '@rAfter that, he flopped onto the floor, using his entire body to enjoy the relief of having a ground under him.'
36592: 'Rudolf@r@v08/51200190.".........Dad! It''s Rudolf.@k@v08/51200191. Answer me!"'
36593: '@rIt wouldn''t be an exaggeration to say that Kinzo''s study was a small villa he had created inside the mansion.'
36594: '@rA study.@k A book archive.@k A place to sleep.@k And a bathroom and washroom.@k@rIt was divided into multiple rooms.'
36595: '@r......Indeed, with all this at your fingertips, it wouldn''t be hard to spend your days in this study without ever leaving at all.'
36596: '@rThe bed was empty.@k@rThere were marks on it which made it seem as though someone had slipped out, but there was no one in sight.'
36597: 'Rudolf@r@v08/51200192."......They do this a lot in ninja movies.@k@v08/51200193. "The bed''s still warm! They can''t have gotten far!" Just like that."'
36598: '@rRudolf tried placing his hand on the bed, but he couldn''t feel any heat at all.'
36599: '@rNot only was there no heat......it felt completely ice cold.'
36600: '@rAnd the bed wasn''t the only thing that was ice cold.'
36601: '@r......The air inside the room......and even the presence about it, if that''s the right word for it,@k ...even that felt ice cold.'
36602: '@rTo Rudolf, it felt as though Kinzo had slipped out of this room a long time ago...'
36603: 'Rudolf@r@v08/51200194."......It''s very clean.@k@v08/51200195. There are signs it''s been lived in.@k@v08/51200196. ........................"'
36604: '@rWrinkles in the bed.@k The slight angle of the chair.'
36605: '@rHere and there, there were many marks that would doubtlessly have been cleaned or fixed up if someone had come in to make the beds.'
36606: 'Rudolf@r@v08/51200197."As far as I can tell off the top of my head, Dad must have slipped out of bed several hours ago at the latest..."'
36607: '@rThat placed it in the same general time period as the brutal series of murders.'
36608: '@r......It didn''t seem possible to say that Kinzo''s absence was completely unrelated to the crime.'
36609: '@rHaving reached a dead end for now, Rudolf leaned out of the window,@k and told Kyrie and the others in the courtyard to come back up since he was going to unlock the door.'
36610: '@rThen, he pushed the button on the study desk and released the door''s auto-lock.'
36611: '@rThere was a heavy clunking sound, and Natsuhi and the rest dashed in immediately...'
36612: 'Natsuhi@r@v03/50900761."F-......Father...... Good morning..."'
36613: 'Rudolf@r@v08/51200198."Sorry, but it isn''t Dad.@k@v08/51200199. ......I''m the one who opened it."'
36614: 'Erika@r@v46/54500350.".........Was Kinzo-san there?"'
36615: 'Rudolf@r@v08/51200200."Nope.@k@v08/51200201. ......There are signs he slipped out of bed, but no way to tell when that was."'
36616: 'Eva@r@v05/51000231."And Natsuhi nee-san was the last person to meet him, right...?@k @v05/51000232.At around eleven o''clock last night.@k@v05/51000233. I wonder if that means he slipped out of the study sometime after that and went somewhere else..."'
36617: 'Natsuhi@r@v03/50900762."W-......well......@k@v03/50900763. B-but Father is a fickle man...@k@v03/50900764. Many times, he has bolted awake in the middle of the night saying that he had a revelation in a dream,@k@v03/50900765. and walked around the mansion.@k@v03/50900766. Isn''t that right, Doctor Nanjo...?"'
36618: 'Nanjo@r@v19/51900059."Nn, ......y-yes, that sort of thing has happened before...@k@v19/51900060. ...As you say, ......he is, erm, a fickle fellow.@k@|@y@v19/51900061. R-right, Kumasawa-san...?"'
36619: 'Kumasawa@r@v18/51800050."...Hoh, ...hohoho.@k@v18/51800047. That''s true...@k@v18/51800052. He might have had some sort of strange dream and slipped out of bed...@k@v18/51800053. That happens a lot, yes......"'
36620: 'Hideyoshi@r@v06/51100154."Then where''d he slip off to...?!@k @v06/51100155.Isn''t there a good chance...Father''s been caught up in this crime?!"'
36621: 'Eva@r@v05/51000234."............You see?@k @v05/51000235.We should have checked to make sure Father was safe from the beginning, shouldn''t we?"'
36622: 'Natsuhi@r@v03/50900767."...nn....................."'
36623: 'Eva@r@v05/51000236."We can''t be sure he isn''t in this room.@k@v05/51000237. Maybe the culprit tied him up and locked him in the closet or something like that."'
36624: 'Erika@r@v46/54500351.".........Just what I was thinking.@k@v46/54500352. Let''s conduct a search."'
36625: 'Natsuhi@r@v03/50900768."Th-......the head treasures this study...@k@v03/50900769. It will not do to have you pawing all over it...!"'
36626: 'Erika@r@v46/54500353."Oh, that''s right.@k@|@y@v46/54500354. I have an announcement for our guilty party."'
36627: '@rWhen Natsuhi heard this said from right in front of her, her heart froze.'
36628: '@r......But Erika had only just happened to be standing right in front of Natsuhi when she said it.@k She had directed her words to the room at large.'
36629: '@r......She hadn''t been speaking to Natsuhi in particular.........'
36630: '@rNatsuhi turned her back on Erika, trying to make it so that her faltering expression wasn''t noticed...'
36631: 'Erika@r@v46/54500355."......My memory is photographic in every detail.@k@v46/54500356. If any attempt is made to hide evidence or alter the scene, I will know at once.@k@v46/54500357. ......Please don''t commit some stupid blunder here and disappoint me.@k@v46/54500358. Don''t you agree that any whodunit in which the culprit is unmasked by way of some silly mistake or slip of the tongue is dreadfully third-rate?"'
36632: 'Natsuhi@r@v03/50900770."............I, ...I don''t understand what you''re talking about, but I''ll ask you to refrain from imprudent remarks.@k@|@y@v03/50900771. ......Father, are you there...?!@k @v03/50900772.Please answer me...!"'
36633: '@rNatsuhi started walking around and calling out in a loud voice, refusing to let Erika say any more.'
36634: '@rThere was a knock.@k Kyrie and the others who had gone down to the courtyard had returned.'
36635: 'Kyrie@r@v09/51300111."No sign of Father, I assume?"'
36636: 'Rudolf@r@v08/51200202."He might be tied up and shut away somewhere around here.@k@v08/51200203. We were just about to start searching for him."'
36637: 'Battler@r@v10/50100829."............I''m amazed he can keep himself locked up in a place like this for so long."'
36638: 'Shannon@r@v15/50500049."..........................."'
36639: 'Kanon@r@v16/50600063."......Give it up, Nee-san.@k@v16/50600064. ......We can''t change anything now."'
36640: 'Shannon@r@v15/50500050."I wonder......what Madam plans to do......"'
36641: 'Kanon@r@v16/50600065."......Get paid back for all the lies she''s told up until now."'
36642: 'Kumasawa@r@v18/51800054.".........Shh.@k@v18/51800055. ...Let''s leave fate in God''s hands."'
36643: 'Shannon@r@v15/50500051."Y-.........yes......"'
36644: 'Kanon@r@v16/50600066.".................."'
36645: '@rMany people traipsed around Kinzo''s vast study, looking here and there.'
36646: '@rInside the closet and in the bathtub.@k@rEven in the refrigerator and under the study desk.'
36647: '@r......They looked everywhere, almost as though they were "it" in a game of hide-and-seek.'
36648: '@r......However, not only were they unable to spot Kinzo, they couldn''t even find a single suspicious mark...'
36649: 'Natsuhi@r@v03/50900773."I-it seems clear that Father isn''t here.@k@v03/50900774. ......That''s enough.@k@v03/50900775. I ask you all not to disturb Father''s precious study any further."'
36650: 'Kumasawa@r@v18/51800056."Yes, yes...@k@v18/51800057. There''s nothing the Master hates more than having things moved around without his permission..."'
36651: 'Eva@r@v05/51000238."Father''s nowhere to be found.@k@v05/51000239. .........Maybe he really was caught up in the crime...?"'
36652: 'Natsuhi@r@v03/50900776.".........Th-though we can''t be sure of that..."'
36653: '@rNatsuhi averted her gaze once more.'
36654: 'BEATRICE@r@v27/50700489."......It''s alright, Natsuhi."'
36655: 'Natsuhi@r@v03/50900777."......We truly do have our backs against the wall...@k@v03/50900778. On the off-chance that someone entered the study, I had planned to talk my way out of it by saying that he had probably gone for a walk somewhere.@k@v03/50900779. ......However..."'
36656: 'Kinzo@r@v01/51500193."Hmph.@k@v01/51500194. No one would believe that I was enjoying a casual midnight stroll in a mansion where a murder has occurred and many people have been killed.@k@v01/51500195. Though I wouldn''t put it past myself to do such a thing."'
36657: 'BEATRICE@r@v27/50700490."Come now, Kinzo.@k@v27/50700491. Be a good boy and stay hidden under the bed.@k@|@y@v27/50700492. ......It''s alright, Natsuhi.@k@v27/50700493. Remain calm.@k@v27/50700494. .........You can prove that someone exists, but you can''t prove that they don''t exist."'
36658: 'BEATRICE@r@v27/50700495."In other words, the Human world is one in which regardless of whether something exists or not, you can make it "exist".@k@v27/50700496. ......And the shadows in which you can make it "exist" form the world of us witches and the world of demons and devils."'
36659: 'Natsuhi@r@v03/50900780."......You mean...the Devil''s Proof."'
36660: 'BEATRICE@r@v27/50700497."Yes.@k@v27/50700498. .........So don''t worry.@k@v27/50700499. The power of demons will most certainly protect you."'
36661: 'Natsuhi@r@v03/50900781.".........If it could protect the honor of Father and my husband, ...I would gladly sacrifice this body of mine to demons."'
36662: 'BEATRICE@r@v27/50700500."Your resolve is good.@k@v27/50700501. ......Don''t be anxious.@k@v27/50700502. I won''t allow them to kill Kinzo."'
36663: '@rAt that moment, a dry sound suddenly rang out twice.'
36664: '@rErika had clapped her hands, seeking everyone''s attention.'
36665: '@rThough such an action should have been above a guest''s place,@k for some reason, it already felt like a natural right of hers.'
36666: '@r......After all, she was the "detective".'
36667: 'Erika@r@v46/54500359.".........I think that''s enough.@k@v46/54500360. Ushiromiya Kinzo-san is nowhere to be found in this study."'
36668: 'Rudolf@r@v08/51200204."Yeah, we''ve searched every possible hiding spot.@k@v08/51200205. Dad''s nowhere to be seen."'
36669: 'Eva@r@v05/51000240."And we haven''t found anything out of place."'
36670: 'Erika@r@v46/54500361."Yes, we didn''t find anything at all."'
36671: '@rErika said it again.@k@rThey hadn''t been able to discover anything......'
36672: 'Natsuhi@r@v03/50900782."In that case, we mustn''t continue to loiter in this room.@k@v03/50900783. Do you understand how angry Father would be if he learned that so many people were looking through his study...?!"'
36673: 'Natsuhi@r@v03/50900784."Eva-san,@k@v03/50900785. you said that you were prepared to take responsibility, didn''t you?@k @v03/50900786.I hope you''re prepared to be disowned for life...!"'
36674: 'Eva@r@v05/51000241."Th-that''s for Father to decide...!!@k @v05/51000242.Not you!!"'
36675: 'Erika@r@v46/54500362."Quiet down.@k@v46/54500363. .........I''d like to assemble the facts as we know them.@k@v46/54500364. At eleven o''clock last night, the last person to meet Kinzo-san in this room was Natsuhi-san, correct?@k @v46/54500365.Can anyone confirm that?"'
36676: 'Battler@r@v10/50100830."......Confirm...?"'
36677: 'Erika@r@v46/54500366."Yes, that''s right.@k@v46/54500367. After all, the only one who claims that Natsuhi-san really did stop by here at eleven o''clock last night is Natsuhi-san herself.@k@|@y@v46/54500368. A confirmation from Kinzo-san that Natsuhi-san did indeed come here last night would have sufficed,@k@v46/54500369. but his absence is the very issue under question."'
36678: 'Kyrie@r@v09/51300112.".........Alibis are the foundation of a mystery, correct?"'
36679: 'Erika@r@v46/54500370."Yes, that''s right.@k@v46/54500371. Alibis are important.@k@|@y@v46/54500372. Of course, they''re almost useless when it comes to the actual theory-making,@k@v46/54500373. but it''s common courtesy to be particular about this kind of thing."'
36680: 'Battler@r@v10/50100831."Heh.@k@v10/50100832. ......You didn''t ask for alibis regarding last night''s murders, but you''ll do it for Grandfather''s disappearance, huh?@k@v10/50100833. ...You really are unpredictable."'
36681: 'Erika@r@v46/54500374."Oh, don''t worry.@k@v46/54500375. Regarding the murders of the first twilight,@k@v46/54500376. have no fear that I will fully examine everyone''s alibi for that as well later."'
36682: 'Erika@r@v46/54500377.".........So, can anyone confirm that Natsuhi-san visited here at eleven o''clock?@k @v46/54500378.If no one can, we''ll be forced to doubt whether Natsuhi-san really was the last person to spot him."'
36683: 'Natsuhi@r@v03/50900787."......A-are you saying that I can''t be trusted?"'
36684: 'Erika@r@v46/54500379."No, no, just the opposite.@k@v46/54500380. I hope that you aren''t the culprit.@k@v46/54500381. After all, that would be dreadfully dull, don''t you agree?@k@|@y@v46/54500382. Only the worst third-rate mysteries have the most suspicious person as the culprit."'
36685: 'Nanjo@r@v19/51900062."...Natsuhi-san......is suspicious?@k @v19/51900063.W-wait a second.@k@v19/51900064. What exactly is your argument...?!"'
36686: 'Gohda@r@v17/51700070."Yes...!@k @v17/51700071.Calling Madam suspicious is the height of discourtesy...!!"'
36687: 'Natsuhi@r@v03/50900788."Quiet!!@k @|@y@v03/50900789.Doctor Nanjo, Gohda,@k@v03/50900790. thank you.@k@v03/50900791. ......Erika-san.@k@v03/50900792. ......I presume you have some basis for the tremendous disrespect you just showed me......?"'
36688: 'Erika@r@v46/54500383."......I do.@k@v46/54500384. It''s painfully simple,@k@v46/54500385. but if you''ll permit me some TV drama-quality evidence, I''ll be happy to oblige."'
36689: 'Battler@r@v10/50100834."............Let''s hear it."'
36690: '@rWhen Battler glared at her, ......a cold expression rose to Erika''s face for an instant.'
36691: '@rBut it was only for an instant.@k@rAfter smiling peacefully and gazing around at everyone, she started to talk.'
36692: '@rShe looked just like the main character in a play,@k who had come out onto center stage bathed in a spotlight...'
36693: 'Erika@r@v46/54500386."Think back to this morning.@k@v46/54500387. Please recall the chaos that followed the murders.@k@v46/54500388. ......We wanted to inform Kinzo-san about the crime, but he wouldn''t come out no matter how many times he was called on the telephone.@k@v46/54500389. Remember what happened then."'
36694: 'Hideyoshi@r@v06/51100156."Anyway, ...isn''t it bad if we can''t get in touch with him?@k@v06/51100157. I mean, Father might not even know there''s crimes goin'' on! Right?!"'
36695: 'Kanon@r@v16/50600067."......I, I''m not sure........."'
36696: '@rKeenly noticing that people were starting to doubt Kinzo''s existence, Kanon mumbled his words...'
36697: 'Kyrie@r@v09/51300113."............Who was the last person to see Father...?@k @v09/51300114.......And when?"'
36698: 'Natsuhi@r@v03/50900793."I-...it was me.@k@v03/50900794. Last night, ............up until moments before all the fuss of Battler-kun finding the gold, I was reporting the day''s events to him in the study."'
36699: 'Erika@r@v46/54500390.".........So around eleven o''clock last night.@k@v46/54500391. ...........................Heheh."'
36700: '@rErika chuckled significantly.'
36701: 'Natsuhi@r@v03/50900795."A-and what''s your point?@k@v03/50900796. Ridiculous."'
36702: 'Erika@r@v46/54500392."I think Kyrie-san probably did that intentionally.@k@v46/54500393. ......Am I right?"'
36703: 'Kyrie@r@v09/51300115."..........................."'
36704: 'Shannon@r@v15/50500052."Wh-@v15/50500053....what do you mean...@v15/50500054....by that......?"'
36705: 'Kyrie@r@v09/51300116."......I figured someone might fall for it."'
36706: 'Erika@r@v46/54500394."Yes.@k@v46/54500395. Thank you, Kyrie-san.@k@v46/54500396. Actually, I was planning to say the same thing, if you hadn''t done it first."'
36707: 'Kanon@r@v16/50600068."......W-...was the question of who saw the Master last...@k@v16/50600069.really that important...?"'
36708: 'Erika@r@v46/54500397."Yes.@k@v46/54500398. If we take the circumstances into account, then in response to the question "Who saw him last?",@k @v46/54500399.it was very odd for Natsuhi-san to instantly answer "me"."'
36709: 'Gohda@r@v17/51700072."Wh-......why?!@k @v17/51700073.Madam told the plain, unvarnished truth...!"'
36710: 'Natsuhi@r@v03/50900788."Quiet!!@k @v03/50900798.Why do you think that was odd...?"'
36711: 'Erika@r@v46/54500400."Why are you so sure that no one else saw Kinzo-san after eleven o''clock?"'
36712: 'Natsuhi@r@v03/50900799."W-......well, ...that''s because I watched as he went to bed.@k@v03/50900800. It''s only natural to assume that he would then sleep until morning,@k@v03/50900801. and not entertain any other visitors..."'
36713: 'Erika@r@v46/54500401."Considering the circumstances, whoever saw him last was going to be at risk of being suspected of having some kind of involvement with this case.@k@v46/54500402. ......A normal person in your position, Natsuhi-san, wouldn''t say, ''I was the last to see him.@k@v46/54500403. I met with him at eleven o''clock.''@k@|@y@v46/54500404. Right, Kyrie-san......?"'
36714: 'Kyrie@r@v09/51300117.".....................@k@|@y@v09/51300118. ......Yes, that''s right.@k@v09/51300119. ......A normal person would say,@k@v09/51300120. ''I saw him at eleven o''clock.@k@v09/51300121. But I don''t know if I was the last person to see him.''@k@v09/51300122. ......Something like that."'
36715: 'Erika@r@v46/54500405."<Good>.@k@v46/54500406. .........Identifying oneself as the final witness is usually quite difficult.@k@v46/54500407. ......That is, unless you know some reason that makes you certain that there couldn''t have been any other witnesses after you."'
36716: 'Erika@r@v46/54500408."......In third-rate mysteries, the final witness is often the culprit.@k@v46/54500409. They killed the victim themselves, so they knew that no one else could have met the victim later on...is how the argument goes."'
36717: 'Kumasawa@r@v18/51800058."Hohoh, ...hohohoho...@k@v18/51800059. That''s nothing more than a minor misuse of words...@k@v18/51800060. It''s nothing to make such a fuss of and focus on..."'
36718: 'Nanjo@r@v19/51900065."Yes, yes, that''s nothing more than nitpicking...@k@v19/51900066. Aren''t you jumping the gun a little, suspecting Natsuhi-san because of a little slip of the tongue like that......?"'
36719: 'Gohda@r@v17/51700074."And you mentioned that Madam must have a reason to be sure that no one else could have seen the Master,@k@v17/51700075. but, of course, Madam has one...!@k @v17/51700076.She left the room after seeing the Master go to bed!@k @v17/51700077.Following common sense, it''s perfectly natural to assume that he probably wouldn''t meet anyone else until the next morning...!"'
36720: 'Erika@r@v46/54500410."......No.@k@v46/54500411. That isn''t natural whatsoever.@k@v46/54500412. After all, Natsuhi-san, Doctor Nanjo, and Kumasawa-san all made this claim a short while ago.@k@v46/54500413. Please, try to remember."'
36721: 'Eva@r@v05/51000231."And Natsuhi nee-san was the last person to meet him, right...?@k @v05/51000232.At around eleven o''clock last night.@k@v05/51000233. I wonder if that means he slipped out of the study sometime after that and went somewhere else..."'
36722: 'Natsuhi@r@v03/50900762."W-......well......@k@v03/50900763. B-but Father is a fickle man...@k@v03/50900804. Many times, he has bolted awake in the middle of the night saying that he had a revelation in a dream, and walked around the mansion.@k@v03/50900766. Isn''t that right, Doctor Nanjo...?"'
36723: 'Nanjo@r@v19/51900059."Nn, ......y-yes, that sort of thing has happened before...@k@v19/51900060. ...As you say, ......he is, erm, a fickle fellow.@k@|@y@v19/51900061. R-right, Kumasawa-san...?"'
36724: 'Kumasawa@r@v18/51800050."...Hoh, ...hohoho.@k@v18/51800047. That''s true...@k@v18/51800052. He might have had some sort of strange dream and slipped out of bed...@k@v18/51800053. That happens a lot, yes......"'
36725: 'Battler@r@v10/50100835.".........Yeah.@k@v10/50100836. ......Grandfather often slips out of bed all of a sudden late at night...@k@v10/50100837. ......That''s what you claimed."'
36726: 'Erika@r@v46/54500414."<Good>.@k@v46/54500415. Battler-san, you have quite an impressive memory.@k@v46/54500416. .........In other words, it''s well known amongst the people at the Ushiromiya head house, Natsuhi-san included,@k@v46/54500417. that there''s a chance Kinzo-san might wake up in the middle of any given night on a whim and wander around.@k@v46/54500418. On top of that, they were aware that this happened quite often."'
36727: 'Eva@r@v05/51000246."......Isn''t that odd?@k@v05/51000247. ...If you knew that Father often wanders around at night,@k@v05/51000248. there''s no way you could be certain that he''d stay in his bed until morning.@k@v05/51000249. Right?"'
36728: 'Rudolf@r@v08/51200206."It really is......like a third-rate mystery.@k@v08/51200207. A lot of those have this part in the last five minutes where the culprit asks ''When did you figure out it was me?''@k @v08/51200208.and the detective answers..."'
36729: 'Erika@r@v46/54500419."It is, isn''t it?@k@v46/54500420. ......That''s why I feel let down.@k@|@y@v46/54500421. If it turns out that Natsuhi-san really is the culprit, this will be worse than a TV mystery.@k@v46/54500422. ......That''s why I want to clear away the suspicion surrounding Natsuhi-san as soon as I can.@k@v46/54500423. I want to make sure that this mystery isn''t third-rate before I do anything else."'
36730: 'Natsuhi@r@v03/50900806.".........ugh......gah......"'
36731: 'BEATRICE@r@v27/50700503."......There''s no need to get anxious, Natsuhi.@k@v27/50700504. She is merely playing with words, a favorite trick of would-be detectives.@k@v27/50700505. ......Is it of any consequence?@k @v27/50700506.How can she possibly use that one statement to corner you?@k @v27/50700507.In the court of hell, all of the demon jurors will declare you innocent.@k@v27/50700508. So calm down and don''t get flustered..."'
36732: 'Battler@r@v10/50100838.".........Sure, when you say it like that, it does make Aunt Natsuhi look suspicious.@k@v10/50100839. ......But to me, it just sounds like you''re picking holes in whatever she''s saying for the sake of it."'
36733: 'Eva@r@v05/51000250."But it is suspicious.@k@v05/51000251. ......I think this is more than enough reason to suspect that Natsuhi nee-san might be hiding something..."'
36734: 'Natsuhi@r@v03/50900807."Th-that accusation is entirely false...!@k @v03/50900808.And you are not being fair, Eva-san...!!@k @v03/50900809.You yourself can testify that I was in fact here at eleven o''clock...!"'
36735: 'Erika@r@v46/54500424.".........Is this true, Eva-san?"'
36736: 'Eva@r@v05/51000252."........................@k@|@y@v05/51000253. .........Oh, now that you mention it, perhaps it is.@k@v05/51000254. ......Heheheh, I''m sorry.@k@v05/51000255. At the time, I was losing my head because the gold had just been found,@k@v05/51000256. so I forgot all about meeting Natsuhi nee-san until just a second ago."'
36737: 'Erika@r@v46/54500425."So, Eva-san, you can confirm that Natsuhi-san was a witness at eleven o''clock?"'
36738: 'Eva@r@v05/51000257."Unfortunately, yes,@k@v05/51000258. I can attest to part of Natsuhi nee-san''s story.@k@v05/51000259. ......But only the part that she came out of this room."'
36739: 'Natsuhi@r@v03/50900810.".........Wh-what are you implying?"'
36740: 'Eva@r@v05/51000260."Let me tell you what I''m implying.@k@v05/51000261. ......No, I''ve wanted to say this for a long time now.@k@v05/51000262. ...I really did feel like saying this in the middle of such a tragic murder case would be improper,@k@v05/51000263. but the timing now is just too perfect.@k@v05/51000264. .........You know what I''m talking about, don''t you?@k @v05/51000265.......Natsuhi nee-san.........?"'
36741: '@rThe servants gulped and held their breaths...@k@rIt seemed that they hadn''t been able to hide it......after all.........'
36742: '@rIn the middle of this heavy silence, ......Eva fingered her trump card, and Natsuhi pretended to be calm.'
36743: '@rBoth space and time grew as heavy as lead...and swallowed up everything...'
36744: 'Erika@r@v46/54500426."How long has Kinzo-san been gone......?"'
36745: '@rErika''s words, spoken almost casually,@k tore that atmosphere to pieces like shattering glass......'
36746: 'Rudolf@r@v08/51200209."......Simply put, we haven''t seen him once at the family conferences this year or last."'
36747: 'Hideyoshi@r@v06/51100158."That''s right...@k@v06/51100159. We''ve suspected it since last year.@k@v06/51100160. ...Seeing as how my son and the others have just been killed, this may not be the time or place to pursue this.@k@v06/51100161. ......But there''s a chance that this has something to do with the crime, so we will do just that..."'
36748: 'Kyrie@r@v09/51300123."It''s possible that you have a motive for hiding Father''s death.@k@v09/51300124. ......We can suspect that you''re embezzling Father''s assets."'
36749: 'Eva@r@v05/51000266."If Father were to die, an investigation would be conducted for the distribution of the assets and your embezzlement would be exposed.@k@v05/51000267. That''s why you''ve been hiding the fact that Father is already dead!!"'
36750: 'Erika@r@v46/54500427.".........I see.@k@v46/54500428. That''s more than enough for the whydunit.@k@v46/54500429. This keeps getting more and more third-rate.@k@|@y@v46/54500430. Aaah, ......how boring."'
36751: 'Natsuhi@r@v03/50900811."I, ......I don''t know what you''re talking about...!!@|@y@k @v03/50900812.You accuse me of hiding the death of the head?!@k @v03/50900813.Slander of this nature is...absolutely unforgivable!!"'
36752: 'Gohda@r@v17/51700078."That''s right...!!@k @v17/51700079.In addition to Madam, the other servants take care of the Master on a daily basis, and they see him all the time...!!@k @v17/51700080.Genji-san, Shannon-san, and Kanon-kun...!@k @v17/51700081.Even Doctor Nanjo and Kumasawa-san meet with him often...!"'
36753: 'Gohda@r@v17/51700082."......P-perhaps because he doesn''t trust me, I haven''t seen him even once since last year, but..."'
36754: 'Natsuhi@r@v03/50900814."Be quiet, Gohda!!!"'
36755: 'Gohda@r@v17/51700083."Eek!!@k @v17/51700084.M-my apologies...!"'
36756: 'Erika@r@v46/54500431."All of the witnesses besides Natsuhi-san are servants she employs.@k@|@y@v46/54500432. ......You paid them to corroborate your story... Ohh, this really is third-rate. What a waste of time.@k@v46/54500433. .........I''m disappointed, Natsuhi-san.@k@v46/54500434. I think it''s time I concluded this now."'
36757: 'Natsuhi@r@v03/50900815."C-.........concluded what......?!"'
36758: 'Erika@r@v46/54500435."Ushiromiya...Kinzo-san."'
36759: 'Kinzo@r@v01/51500196.".........What is it, ...uninvited guest?"'
36760: 'Erika@r@v46/54500436."You don''t exist.@k@v46/54500437. ......You''re a ghost whose death was concealed by people who didn''t want it known due to the inheritance problem."'
36761: 'Kinzo@r@v01/51500197."......Hmph.@k@|@y@v01/51500198. ......Heheheheheheheh."'
36762: 'Erika@r@v46/54500438."If you''re a ghost, you should pass on quickly to the next world as ghosts are meant to.@k@v46/54500439. ......Oh, where are my manners, this is the first time we''ve met and I''ve yet to give you a proper greeting."'
36763: 'Erika@r@v46/54500440."......Good day, pleased to meet you.@k@v46/54500441. And goodbye!!!"'
36764: '@rBeato''s pipe......@kstopped mere millimeters from Erika''s face, so close that you might just barely have been able to wedge a single sheet of paper between them.'
36765: 'BEATRICE@r@v27/50700509."And good day from me.@k@v27/50700510. ......Ushiromiya family alchemist, BEATRICE the Golden.@k@v27/50700511. I shall be your opponent in this fight from here on out."'
36766: 'Erika@r@v46/54500442."Glad to meet you. I''m the detective of this game, Furudo Erika.@k@v46/54500443. It''s a pleasure to make your acquaintance.@k@v46/54500444. And soon, to bid you farewell."'
36767: 'BEATRICE@r@v27/50700512."So, you''re Lady BERNKASTEL''s next piece after Ange.@k@v27/50700513. ......I''m afraid I didn''t get to fight with her to my satisfaction in the end.@k@|@y@v27/50700514. It pleases me that we can test wits at last,@k@v27/50700515. piece of Lady BERNKASTEL...!"'
36768: 'Erika@r@v46/54500445."............My master is almighty and all-powerful.@k@v46/54500446. A fool like you couldn''t even begin to compare with her.@k@v46/54500447. I accept your challenge."'
36769: 'BEATRICE@r@v27/50700516."*cackle*cackle*cackle*.@k@v27/50700517. You really are calm.@k@v27/50700518. ......Even though a witch has appeared before you and is about to fight with magic and fantasy.@k@v27/50700519. .........If you were Battler, you''d be on your knees wailing that this isn''t a mystery anymore."'
36770: 'Erika@r@v46/54500448."Well, parallel worlds like this are popular even within the mystery genre these days.@k@v46/54500449. Are you familiar with that detective who reasons from an armchair in a meta-like space?"'
36771: 'BEATRICE@r@v27/50700520."Mind your anachronisms. That author doesn''t make his debut until next year."'
36772: 'Erika@r@v46/54500450."You certainly are picky for a witch."'
36773: 'BEATRICE@r@v27/50700521."Hahha!!@k @v27/50700522.You think yourself a witch''s equal?@k @v27/50700523.Don''t be so conceited, you miserable little Human!!"'
36774: '@rBeato snapped her fingers, and something bounced around the room at terrifying speeds...!!'
36775: '@rIt was the witch''s stake.@k The witch''s wedge which contained the power of the blue truth within it...!'
36776: '@rOf course, a mere Human like Erika couldn''t follow its terrible speed with her eyes.'
36777: '@rErika understood this, so she didn''t attempt to look every which way stupidly trying to spot it.'
36778: 'Lucifer@r@v38/52300009."You slowpoke!!@k @v38/52300010.Take this!!"'
36779: '@rWith a terrible sound, Lucifer''s blue stake buried itself into Erika''s right collarbone.'
36780: '@rIt shot all the way through and out of her back.'
36781: '@rSpinning as she rebounded off the walls, Lucifer landed in front of Beato,@k and disappeared, laughing shrilly.'
36782: '@rErika wasn''t blown back.@k@rHowever, a blue wedge was stuck deeply into her.'
36783: 'Erika@r@v46/54500451.".........So this is that so-called blue truth.@k@v46/54500452. Well then, let me hear your opinion."'
36784: 'BEATRICE@r@v27/50700524.@|@y"@c279.@[You can''t eliminate the possibility that Natsuhi met with Kinzo at 11 p.m.@k@v27/50700525.@|@y In the six-plus hours between then and the time you all barged into the study, Kinzo had every opportunity to escape!@k @v27/50700526.@|@yBecause of this, you can''t state decisively that Kinzo doesn''t exist.@]@c."'
36785: '@rBeato announced that with an expression worthy of her title as witch.@k@rErika, on the other hand, was silent.'
36786: '@r......Was she too shocked to speak?'
36787: '@rThere was no anguish in her expression.@k@rShe was just quietly listening to Beato''s blue truth.'
36788: '@rNo, ......judging by her disdainful expression,@k it would probably be more appropriate to say that Beato''s words went in one ear and out the other.'
36789: 'Erika@r@v46/54500453.".........<Good>.@k@v46/54500454. Begin with the orthodox.@k@v46/54500455. .........By the way, this thing really is stuck good.@k@v46/54500456. It won''t come out."'
36790: '@rShe tried pulling from the front and the back of the blue wedge that pierced her, but it didn''t budge an inch.'
36791: '@rHowever, her indifferent, relaxed expression didn''t budge an inch either.'
36792: 'BEATRICE@r@v27/50700527."You can''t take it out!@k @v27/50700528.......The blue truth can only be broken by the red truth.@k@v27/50700529. ......And as you are a guest who came to this island a day ago at most, there exists no truth that you could possibly know!@k @v27/50700530.There is no red available to the likes of you...!@k @v27/50700531.In other words, this is checkmate!!"'
36793: 'Erika@r@v46/54500457."......I see.@k@v46/54500458. This is one of those spaces.@k@v46/54500459. ......In that case, I''ll need a piece suitable for fighting a witch.@k@|@y@v46/54500460. ......I am the detective.@k@v46/54500461. Let it be my role to deal with the Human culprit.@k@v46/54500462. You are a witch.@k@v46/54500463. ...There is a piece better suited to the role of dealing with witches and demons."'
36794: 'Erika@r@v46/54500464."Allow me to introduce you.@k@v46/54500465. .........Miss Dlanor.@k@v46/54500466. It looks like it''s your turn."'
36795: 'BEATRICE@r@v27/50700532."D-.........Dlanor...!!!"'
36796: 'LAMBDADELTA@r@v29/52200393."Ahhahahahahahaha!!@k @v29/52200394.I knew it, I was certain you''d bring that piece in sooner or later...!!@k @v29/52200395.The ten witch-hunting wedges, the archbishop of witch hunting, Dlanor!!"'
36797: 'BERNKASTEL@r@v28/52100431."There''s no more fitting piece for a battle against devils and demons.@k@v28/52100432. I have my double, Erika, and the greatest natural enemy of witches, Dlanor."'
36798: 'BERNKASTEL@r@v28/52100433."I''ve now taken control of the seventh rank with my two rooks.@k@v28/52100434. ......And now you''ll entertain me, LAMBDADELTA. And you too, BEATRICE.@k@v28/52100435. As I watch you struggle and scramble to no avail.@k@|@y@v28/52100436. ......*giggle*, ahahahahahaahahaahahahahahahahaha!!"'
36799: '@rThe air shone brightly, and the piece Erika had guided there showed its form...'
36800: '@rIt was a form that resembled a cleric, perfect for confronting an evil witch......'
36801: 'Dlanor@r@v47/54600001."Pleased to meet YOU.@k@|@y@v47/54600002. Dlanor A. Knox is my NAME."'
36802: '@rEven though the atmosphere in this space could be cut with a knife,@k she introduced herself in a neat and frank manner.'
36803: '@r......Her out-of-place appearance, completely different from those of the demons and witches,@k felt blatantly odd and had a kind of severity to it.'
36804: 'BEATRICE@r@v27/50700533."......This is the first time I''ve met you, but I''ve heard all the rumors.@k@v27/50700534. Therefore, this truly doesn''t feel like a first meeting."'
36805: 'Dlanor@r@v47/54600003."The same goes for ME, Miss BEATRICE.@k@|@y@v47/54600004. Eiserne Jungfrau has a detailed file on you 600 pages LONG.@k@v47/54600005. I always look over those, so this doesn''t feel like a first meeting to me EITHER."'
36806: 'BEATRICE@r@v27/50700535."The secretary of hell could summarize those 600 pages in a mere six letters."'
36807: 'Dlanor@r@v47/54600006."Allow me to ASK."'
36808: 'BEATRICE@r@v27/50700536.""Danger"."'
36809: 'Dlanor@r@v47/54600007."That''s a good SUMMARY.@k@v47/54600008. When I get back, out of respect to you, I will close out your file with an additional two letters for a total of EIGHT."'
36810: 'Erika@r@v46/54500467."<Executed>."'
36811: 'BEATRICE@r@v27/50700537.".........So I''m <cute> now, *cackle*!@k @v27/50700538.Flattery will get you nowhere, my guest...!"'
36812: 'Dlanor@r@v47/54600009."Then let us CONTINUE.@k@v47/54600010. Miss BEATRICE.@k@v47/54600011. I, Chief Inquisitor Dlanor, do humbly accept my role as your OPPONENT."'
36813: 'BEATRICE@r@v27/50700539."I''ve already completed my first move.@k@v27/50700540. If you can''t remove the blue wedge from that Furudo Erika over there, then you might as well trudge back up to heaven,@k@v27/50700541. and get back to your usual boring job of stamping things!"'
36814: 'Erika@r@v46/54500468."......Take care of this wedge or whatever it is, please.@k@v46/54500469. BEATRICE-san seems to think that this is all it takes to achieve checkmate."'
36815: '@rAfter making a show of tapping the blue wedge that pierced her with her finger,@k Erika shrugged as though taunting BEATRICE.'
36816: 'Natsuhi@r@v03/50900199."......B-BEATRICE..."'
36817: 'BEATRICE@r@v27/50700542."It''s alright. I''m just going to toy with her a bit.@k@v27/50700543. ............After all, if things get bad, I can take Kinzo''s ghost and flee from here whenever I want.@k@v27/50700544. I can leave this room at any time and go anywhere."'
36818: 'Dlanor@r@v47/54600012."That is USELESS."'
36819: 'BEATRICE@r@v27/50700545."......Hoh?"'
36820: 'Dlanor@r@v47/54600013."Encountering me is equivalent to your DEMISE.@k@v47/54600014. There will be no ESCAPE. No one can evade ME."'
36821: 'Eva@r@v05/51000268."As you say, there''s always the possibility that Father bolted awake and went off somewhere.@k@|@y@v05/51000269. .........But you know what? I can state for certain that such a thing couldn''t have happened.@k@v05/51000270. Heheheh, you know why?"'
36822: 'Natsuhi@r@v03/50900817."O-of course I don''t...!@k @v03/50900818.Are you saying that you stood outside this door all night, watching to make sure the head didn''t take a step outside...?!"'
36823: 'Eva@r@v05/51000271."Yes, someone was watching.@k@|@y@v05/51000272. This little guy right here!!"'
36824: 'Gertrude@r@v48/54800001."For your attention: I beg to inform you of the following.@k@v48/54800002. Be advised that entering or exiting through this door is impossible.@k@v48/54800003. Guards, you are hereby ordered to blockade the study door."'
36825: '@rThe doors to heaven opened with a strong, unrelenting radiance like the sun''s,@k and Dlanor''s subordinates appeared.'
36826: '@rTheir words were clad in the red truth and cut off the witch''s method of escape.'
36827: 'Chiester410@r@v36/53500001."Chiester410, right here!"'
36828: 'Chiester45@r@v35/53400001."Chiester45, right here!@k @v35/53400002.It has been some time, Great Lady BEATRICE!@k @v35/53400003.We were dispatched in accordance with Alliance Agreement #1516 and a request from the Great Court of Heaven.@k@v35/53400004. We apologize for the rudeness that is to follow...!"'
36829: 'Chiester410@r@v36/53500002."We''ve formed a precision blockade on the study door nyeh.@k@v36/53500003. I think it''s best if you stay away from the door nyeh...@k @v36/53500004.Kihihi!"'
36830: 'Gertrude@r@v48/54800004."For your attention: I further inform you of the following.@k@v48/54800005. @|@y@c900.@[From last night at 23:00 until the present time, the study door was not opened even once.@]@c."'
36831: 'Natsuhi@r@v03/50900819."Wh-......what is that scrap of paper?"'
36832: 'Eva@r@v05/51000273."It''s a completely ordinary receipt.@k@v05/51000274. But even so, this mere scrap of paper proves that you lied."'
36833: 'Hideyoshi@r@v06/51100162."Last night, when you came out of the study,@k@v06/51100163. Eva saw her chance and wedged a receipt into the crack of the door to the study...!@k @v06/51100164.And that fell down just now when Rudolf-kun opened the door for us...!!"'
36834: 'Eva@r@v05/51000275."Know what that means?@k @|@y@v05/51000276.In other words, from 11 p.m. last night until now,@k @|@y@v05/51000277.it''s impossible that Father could have opened this door!!"'
36835: 'Battler@r@v10/50100840.".........Wh-what''d you say......?"'
36836: 'Eva@r@v05/51000278."Rudolf.@k@v05/51000279. The window was locked, right?"'
36837: 'Rudolf@r@v08/51200210."......Yeah. That''s why I smashed the glass."'
36838: 'Kyrie@r@v09/51300125."The other windows are all locked as well.@k@v09/51300126. They can''t be locked from the outside by construction...!"'
36839: 'Cornelia@r@v49/54700001."For your attention: I beg to inform you of the following!@k@v49/54700002. Be advised that@|@y @c900.@[the windows were all locked!@]@c.@k @v49/54700003.Guards, blockade all of the windows."'
36840: 'Gertrude@r@v48/54800006."In the name of Eiserne Jungfrau, the imperial guard is hereby permitted to make use of forbidden weapons."'
36841: 'Chiester00@r@v37/53600001."Understood, ma''am.@k@v37/53600002. All units, clearance granted for use of forbidden weapon: red warheads.@k@v37/53600003. Transmit activation code!"'
36842: 'Chiester410@r@v36/53500005."Unya?@k @v36/53500006.The password doesn''t work nyeh."'
36843: 'Chiester45@r@v35/53400005."410, turn caps lock off and try again...!"'
36844: 'Chiester00@r@v37/53600004."Chiester Troops, precision blockade for study door and all windows complete.@k@v37/53600005. The Great Lady BEATRICE is hereby warned that if anything is caught passing through these physically, conceptually, or by any other method,@k@v37/53600006. we will fire without warning...!"'
36845: 'Chiester45@r@v35/53400006."Data link from four Archangel Satellites.@k@v35/53400007. Homing format: verdict-model conceptual guidance...!"'
36846: 'Chiester410@r@v36/53500007."And on top of that, we''ve got red warheads nyeh.@k@v36/53500008. Impossible to shoot down, impossible to avoid, impossible to survive when hit.@k@v36/53500009. ......It''d smash even Lady BEATRICE into little bits nyeh♪"'
36847: '@rThe Chiester Troops had laid down a pinpoint blockade over the door and all of the windows.@k@rEscape would no longer be permitted through any of these...!'
36848: 'BEATRICE@r@v27/50700546.".........My, my.@k@v27/50700547. ......I should be doing the welcoming, but it seems I am the one being welcomed.@k@v27/50700548. And a courtesy call with the Chiester Sisters in tow, no less...!"'
36849: 'Cornelia@r@v49/54700004."For your attention: I beg to inform you that your paths of retreat have been severed!@k @v49/54700005.Supervisor Dlanor, let us now remove the sin and purify...!!"'
36850: 'Dlanor@r@v47/54600015."Your work is APPRECIATED.@k@v47/54600016. .........Miss BEATRICE.@k@v47/54600017. I have had your paths of retreat TERMINATED.@k@v47/54600018. You cannot leave through the door, nor can you leave through the WINDOWS.@k@|@y@v47/54600019. You will find that escape is now IMPOSSIBLE."'
36851: 'BEATRICE@r@v27/50700549.".........You think you have me trapped with this alone?@k @v27/50700550.*cackle*cackle*......"'
36852: '@rThe Inquisitor in Heaven and her subordinates surrounded the witch.'
36853: '@rThe subordinates used a powerful barrier to cut off Beato''s methods of escape.'
36854: '@r......Demons prefer to fight, and as a result, they sometimes allow their victims to escape.'
36855: '@rHowever, angels prefer to block off passages of escape, and as a result, they eradicate their targets without fail...!'
36856: 'Eva@r@v05/51000280."In other words, from the time you claim you bid him goodnight yesterday...@k@v05/51000281.until the time Rudolf opened the door, this study was a perfect locked room...!"'
36857: 'Hideyoshi@r@v06/51100165."In that case, Father''s gotta be here.@k@v06/51100166. But we haven''t seen hide nor hair of him...!!@k @v06/51100167.Come on, what the hell is goin'' on...?!!"'
36858: 'Natsuhi@r@v03/50900820."Uh, ...gah.................."'
36859: 'BEATRICE@r@v27/50700551."I keep telling you to calm yourself...!@k @v27/50700552.The thought that I, BEATRICE, could be imprisoned merely because the doors and windows are closed is simply laughable."'
36860: 'BEATRICE@r@v27/50700553."...Kinzo, I was planning on playing around, but it seems our guest has no such intentions.@k@v27/50700554. Let us withdraw before we overstay our welcome."'
36861: 'Kinzo@r@v01/51500199."Mm.@k@v01/51500200. I would not hesitate to give up this life of mine, but for Natsuhi''s sake, I cannot die yet."'
36862: '@rBeato waved her pipe and the air was split vertically.'
36863: '@rThen, a pitch black gate appeared there and slowly opened.'
36864: '@r......It was a warp portal, the same as the pitch-black holes that Gaap used.'
36865: 'BEATRICE@r@v27/50700555."In my file, it should have said this:@k@v27/50700556. "She is an elusive phantom,@k@v27/50700557. appearing and disappearing wherever she desires"...!@k @v27/50700558.As long as Kinzo has me, it will be impossible to capture him...!"'
36866: '@rThe pitch-black gate opened.@k@rThat gate led from everywhere and to nowhere.'
36867: '@rBoth Beato and Kinzo would be sent to a place where no one could catch them,@k a place where no one could set foot, much less chase after them...!'
36868: 'Natsuhi@r@v03/50900821."Th-...this is the study of the Ushiromiya family head.@k@v03/50900822. And it is also a room that Father had a direct hand in designing.@k@v03/50900823. ......Don''t you agree that there would be nothing strange about him having some mechanism for getting outside without using the door...?"'
36869: 'Gohda@r@v17/51700085."...Y-yes, of course...!@k @v17/51700086.There would be nothing at all strange about the Master having a hidden door...!"'
36870: 'Eva@r@v05/51000282."A hidden door?!@k @v05/51000283.Really, and where would we find one of those...?!"'
36871: 'Natsuhi@r@v03/50900824."It''s a hidden door, so nobody knows.@k@v03/50900825. ......There are several mechanisms and hidden doors in this mansion that only Father knows of.@k@v03/50900826. ......No one has seen them first-hand, but all the people of this mansion know of them in concept. Correct...?"'
36872: 'Shannon@r@v15/50500055."Uh, ...ah, ......yes...!"'
36873: 'Kanon@r@v16/50600070."......It''s true that there have been always been rumors about hidden passages only the Master knows of..."'
36874: 'Nanjo@r@v19/51900070."Th-that is the sort of trick that Kinzo-san would love..."'
36875: 'Kumasawa@r@v18/51800065."Hohohoho......@k@v18/51800066. And they are hidden doors, after all...@k@v18/51800067. No matter how much people such as ourselves might search, it''s only natural that we won''t find them."'
36876: 'Kyrie@r@v09/51300127.".........I see. It''s a Devil''s Proof.@k@v09/51300128. You''re saying we can''t eliminate the possibility that a hidden door exists in this room."'
36877: 'Eva@r@v05/51000284."That''s nonsense, it''s all made up...!!@k @v05/51000285.How dare you stoop to this just because your lie about concealing Father''s death is about to be revealed...!!"'
36878: 'Hideyoshi@r@v06/51100168."Darn right!! Just where in this study is there a hidden door...?!!@k @v06/51100169.Go on, try provin'' it exists!!"'
36879: 'BEATRICE@r@v27/50700559.@|@y"@c279.@[No proof is required!!@k @v27/50700560.@|@yIt''s a Devil''s Proof! The existence of a hidden door is impossible to discover or disprove!!@k @v27/50700561.@|@yTherefore, no one can eliminate the possibility that Kinzo escaped from this study through a hidden door!!@]@c."'
36880: 'Dlanor@r@v47/54600020.@|@y"@c900.@[I will not allow a hidden door to exist in this ROOM.@]@c."'
36881: '@rBeato''s blue wedge, which had been fired off as a farewell gift,@k was crushed with a flash of Dlanor''s longsword, ......and the pitch-black gate was crushed as well...!'
36882: '@rAnd it wasn''t just crushed visibly and physically.'
36883: '@rFrom that moment onwards, the warp portal which conceptualized hidden doors had been destroyed forever.'
36884: 'BEATRICE@r@v27/50700562."H-how can someone like you, who is neither the owner of the study nor the Game Master,@k@v27/50700563. ......use the red truth......?!@k @v27/50700564.And what was that?! What do you mean you "will not allow" hidden doors to exist?!"'
36885: 'Erika@r@v46/54500470."It''s because that''s what defines a mystery.@k@v46/54500471. @|@y@c900.@[Knox''s 3rd: It is forbidden for hidden passages to exist.@k@v46/54500472.@]@c. You can''t have any hidden doors in the mystery genre. I''m terribly sorry."'
36886: 'Dlanor@r@v47/54600021."In this world, gods other than our God do not exist, and hidden doors do not EXIST.@k@v47/54600022. They must not EXIST. We will not allow them to EXIST.@k@v47/54600023. They are a BLASPHEMY."'
36887: 'BEATRICE@r@v27/50700565."......Arrogance enough to shock a witch...@k@v27/50700566. Hah, how delightfully preposterous...!"'
36888: 'LAMBDADELTA@r@v29/52200396."Ahahahahahahaahahahahahahaha...!!@k @v29/52200397.Here it comes, the ten wedges to pierce witches...!!@k @v29/52200398.Just like usual, it''s the kind of irrational argument that I just love to hear...!"'
36889: 'BERNKASTEL@r@v28/52100437."What a fool.@k@v28/52100438. The Devil''s Proof might have been vague enough to let you escape from everything until now,@k@v28/52100439. but now that you''re up against Dlanor, that move won''t work anymore, BEATRICE!"'
36890: 'Dlanor@r@v47/54600024."......As I thought, you''re no different from any ordinary WITCH.@k@v47/54600025. I am DISAPPOINTED."'
36891: 'Kinzo@r@v01/51500201."......Beato.@k@v01/51500202. ...It seems, after all, that this is not an opponent who will allow us an easy escape."'
36892: 'Erika@r@v46/54500473."Please do entertain me, BEATRICE-san.@k@v46/54500474. ......You should at least serve some tea for your guests.@k@v46/54500475. It doesn''t even matter if it''s third-rate!"'
36893: 'Erika@r@v46/54500476."How did Kinzo-san escape from this locked-room study?@k@v46/54500477. Educate me with your blue truth...!!"'
36894: 'BEATRICE@r@v27/50700567."......Very well.@k@|@y@v27/50700568. Make sure you don''t regret it!!"'
36895: 'BEATRICE@r@v27/50700569.@|@y"@c279.@[It''s possible that, after slipping out the door, Kinzo noticed the trick with the receipt and correctly returned it to its original place.@]@c."'
36896: 'Dlanor@r@v47/54600026.@|@y"@c900.@[That possibility has already been eliminated in RED.@k@v47/54600027.@|@y After 23:00, the door to the study was not opened even ONCE.@]@c."'
36897: 'BEATRICE@r@v27/50700570.@|@y"@c279.@[Kinzo might have been a marvelous mage and inventor!@k @v27/50700571.@|@y He might have invented a concoction to turn his body to mist and slipped out through the keyhole!!@]@c."'
36898: 'Dlanor@r@v47/54600028.@|@y"@c900.@[No such substance EXISTS.@k@v47/54600029.@|@y It must not EXIST.@]@c."'
36899: 'BEATRICE@r@v27/50700572.@|@y"@c279.@[Maybe he invented a teleportation device!@k@v27/50700573.@|@y That possibility is impossible to eliminate because of the Devil''s Proof!!@]@c."'
36900: 'Dlanor@r@v47/54600030.@|@y"@c900.@[Such a machine does not EXIST.@k@v47/54600031.@|@y I will not permit it to EXIST.@]@c."'
36901: 'BEATRICE@r@v27/50700574.@|@y"@c279.@[Oh, so you can examine every chemical substance in the world?@k @v27/50700575.@|@yYou can rule out the existence of unknown scientific devices?!@k @v27/50700576.@|@yThere''s no way you can, it''s a Devil''s Proof!@k@v27/50700577.@|@y You cannot rule out their existence!@]@c."'
36902: 'Dlanor@r@v47/54600032.@|@y"@c900.@[I will REPEAT.@k@v47/54600033.@|@y In the name of God, I will not permit such chemicals or devices to EXIST.@k@v47/54600034.@|@y From now until the end of time, I will not permit them to EXIST.@]@c."'
36903: 'BEATRICE@r@v27/50700578."Even in the future?!@k @v27/50700579.Oho, so you think you can even deny the possible futures of the human race?!"'
36904: 'Erika@r@v46/54500478."It''s Knox''s fourth commandment.@k@v46/54500479. It is forbidden for unknown drugs or obscure scientific devices to be used."'
36905: 'Dlanor@r@v47/54600035."The progression of humanity and the techniques and knowledge that the future might bring are for God to DECIDE.@k@v47/54600036. And their existence has been declared forever DENIED.@k@v47/54600037. Therefore, from now until the end of time, I will not allow for such technology to EXIST. It is not PERMITTED."'
36906: '@rBeato and Dlanor had just gone through a massive exchange of red and blue.'
36907: '@r......However, not only had Dlanor not taken any damage, she also showed no signs of fatigue.'
36908: '@rBeato might have been a fearsome witch, but blood flowed through her veins and she did breathe.@k@rShe felt both pain and fatigue.'
36909: '@rBut Dlanor......was like a doll made of marble.'
36910: '@rShe felt no fatigue, no pain, no hesitation.'
36911: '@rEven if Beato''s sharp wedges had aimed right for Dlanor''s eyes, she wouldn''t have shut them.'
36912: '@r......No, it was doubtful whether she ever even blinked in the first place......'
36913: 'Natsuhi@r@v03/50900827."B-......BEATRICE...... Hang in there......"'
36914: 'BEATRICE@r@v27/50700580."......I''d heard the rumors, but she really is the worst matchup for me.@k@v27/50700581. ......To think that dreams, hopes, and even future possibilities are forbidden. The arrogance of the gods is overwhelming.@k@|@y@v27/50700582. ......I''d expect no less from a witch hunt executioner.@k@v27/50700583. It seems we''ll never be able to drink together."'
36915: '@rEven the strikes which had defeated Battler over and over had absolutely no effect on Dlanor.'
36916: '@r......She had expected that already more or less, but she hadn''t expected to be repelled so easily...'
36917: 'Kinzo@r@v01/51500203."Quite a formidable opponent..."'
36918: 'BEATRICE@r@v27/50700584."Oh my, so even the great GOLDSMITH has gotten old and decrepit.@k@v27/50700585. Hearing those words come out of your mouth is rarer than seeing two comets in the night sky...!"'
36919: 'Kinzo@r@v01/51500204."Hmph. I''m not decrepit, I''m already dead."'
36920: 'BEATRICE@r@v27/50700586."Hah, that''s true.@k@v27/50700587. Sorry, but I won''t let you be for just a little longer."'
36921: '@rBeato experienced something she''d only rarely felt during her entire life.'
36922: '@r......It was probably what we''d call "hardship".'
36923: '@rAs Natsuhi tried to comfort her, Beato quietly brushed aside her hand,@k and she regained her posture again, showing off her witch''s pride and her continued readiness to fight.'
36924: 'Dlanor@r@v47/54600038."Is that ALL?@k@v47/54600039. There was no need for me to be PRESENT.@k@v47/54600040. I am DISAPPOINTED."'
36925: 'BEATRICE@r@v27/50700588."I''m not done yet. I was just testing a few moves just now.@k@v27/50700589. I was only trying to measure your abilities."'
36926: 'Gertrude@r@v48/54800007."It is foolish in the extreme.@k@v48/54800008. Know your place, Golden Witch."'
36927: 'Chiester00@r@v37/53600007.".........Lady BEATRICE..."'
36928: '@rBeato''s expression became tense once again.@k@rNo longer was there any trace of mischief.'
36929: '@r......The mood changed.'
36930: 'BEATRICE@r@v27/50700590."The time for playing is over.@k@v27/50700591. Here I go.@k@v27/50700592. In that case, I shall acknowledge that Kinzo did not enter or leave the study.@k@v27/50700593. Why don''t I accept your locked room?"'
36931: 'Dlanor@r@v47/54600041.".........HM."'
36932: 'Gertrude@r@v48/54800009."For your attention: I beg to inform you that BEATRICE has changed her pattern of attack."'
36933: '@rBEATRICE, who had until then thoroughly resisted the idea that a locked room existed, did an about face.'
36934: '@rShe declared that she would accept that proposition.'
36935: '@rOf course, this didn''t mean that she''d surrendered.@k This was a new attack of Beato''s.@k@rDlanor noticed this and readied herself.'
36936: 'Chiester410@r@v36/53500010."What''s going on?@k @v36/53500011.Why did Lady BEATRICE acknowledge the locked room when she''s trying to destroy it nyeh?"'
36937: 'Chiester45@r@v35/53400008."......Sh-she''s probably going to claim that Kinzo existed outside of this room.@k@|@y@v35/53400009. ......Reactivation of the great Lady BEATRICE''s warp portal confirmed!"'
36938: 'BEATRICE@r@v27/50700594.@|@y"@c279.@[Natsuhi claims to have "talked with Kinzo in the study", but she never said that she spoke with him face to face.@k@v27/50700595.@|@y Therefore, if Kinzo was in a location other than the study, there is no contradiction as long as they held a conversation!@]@c."'
36939: 'Dlanor@r@v47/54600042.".........nn—"'
36940: '@rAfter bouncing at an erratic angle, the witch''s stake pierced the top of Dlanor''s foot.'
36941: 'Asmodeus@r@v44/52900010."You sure are slow.@k@|@y@v44/52900011. ......Heheheheh, top of the foot, all mi~ne!"'
36942: 'BEATRICE@r@v27/50700596.@|@y"@c279.@[Natsuhi used the internal phone line in this study to speak with Kinzo, who was in another place!@k @v27/50700597.@|@yThere''s nothing strange about Kinzo, who hates the relatives, predicting that they would enter his study and leaving to go elsewhere.@k@v27/50700598.@|@y He might have gone to the hidden mansion, Kuwadorian!@]@c."'
36943: '@rThe power of Beato''s blue truth began to dwell in the Stake of Asmodeus piercing the top of Dlanor''s foot, changing the stake into a blue wedge.'
36944: 'Chiester410@r@v36/53500012."Not bad, that makes sense nyeh...!"'
36945: 'Chiester00@r@v37/53600008."......Blue truth, valid!"'
36946: '@rA cyclone of gold butterflies swept up with Beato at its center.@k@r......The magical power of the pitch-black gate that had been smashed was once again refilled.'
36947: '@r......If she could hold Dlanor off here somehow,@k this time, she would be able to warp Kinzo out of the study, all the way to Kuwadorian...!'
36948: '@rDlanor moved clumsily, trying to pull the blue wedge out of her foot,@k but it didn''t even budge.'
36949: '@rOf course, Beato didn''t miss this chance.@k@rNo witch would!'
36950: 'BEATRICE@r@v27/50700599."I have more, so prepare yourself.@k@v27/50700600. @|@y@c279.@[There''s a chance that the Kinzo mentioned by Natsuhi does not refer to the person himself!@k @v27/50700601.@|@yThe Kinzo spoken of by Natsuhi might have been another name for this room!@k @v27/50700602.@|@yKinzo had taken refuge in Kuwadorian and was impossible to contact.@k@v27/50700603.@|@y Perhaps Natsuhi called this room "Father",@k@v27/50700604.@|@y and by contemplating inside of it, she felt as though she had received some sort of revelation from Kinzo!!@]@c."'
36951: 'Beelzebub@r@v43/52800006."We''ve stopped you from moving. You''ve already lost!"'
36952: '@rBeelzebub''s blue wedge pierced the base of Dlanor''s neck!@k@rOf course, even this didn''t cause her to flinch, but her movements were restricted even further.'
36953: 'Dlanor@r@v47/54600043."......INTERESTING.@k@v47/54600044. Is that ALL?"'
36954: 'BEATRICE@r@v27/50700605."You don''t call it a full-course dinner if you stop at the soups and hors d''oeuvres!@k @|@y@v27/50700606.I''ll hit you with the main dish and the dessert at once, so watch your stomach explode and die!!!"'
36955: 'BEATRICE@r@v27/50700607.@|@y"@c279.@[Even if, as you say, this is a locked room and impossible to escape from, you can''t deny the possibility that he is still hiding in this room.@k@v27/50700608.@|@y I''m not talking about a hidden door! He might be under the bed or above the ceiling!@k@v27/50700609.@|@y He might be hiding in such a subtle blind spot that even a demon would not recognize it!@]@c."'
36956: 'BEATRICE@r@v27/50700610.@|@y"@c279.@[Or, it might be that Natsuhi, ordered by Kinzo to act as his proxy,@k@v27/50700611.@|@y considered herself both his representative and another Kinzo!@k@v27/50700612.@|@y In other words, it''s possible that Natsuhi was also Kinzo!@]@c."'
36957: 'BEATRICE@r@v27/50700613.@|@y"@c279.@[I''ve got plenty more!! At eleven o''clock last night, Kinzo escaped out the window!@k @v27/50700614.@|@yNatsuhi watched him go, then locked the window!!@k @v27/50700615.@|@yThis doesn''t lead to any problems. In fact, it might be the most beautiful blue truth yet!@]@c."'
36958: 'BEATRICE@r@v27/50700616."How''s that, Dlanor A. Knox?!@k @|@y@v27/50700617.Hyahhahahahaaaaaaahh!! There are any number of ways to escape from this locked room!!"'
36959: 'Satan@r@v40/52500015."Know your foolishness in trying to oppose my master!"'
36960: 'Belphegor@r@v41/52600007."There''s no need for you to argue back."'
36961: 'Mammon@r@v42/52700007."Just suffer defeat here and sleep for all eternity...!"'
36962: '@rThe Seven Sisters appeared from Beato''s golden tornado one after another, and they pierced Dlanor with blue wedges.'
36963: '@rFour blue wedges were buried into her neck, her chest, her gut, and her thigh.'
36964: '@rIncluding the one buried into the top of her foot, she had been pincushioned by five stakes.'
36965: 'Leviathan@r@v39/52400010."Aaaah, BEATRICE-sama!@k @v39/52400011.What about my turn?!"'
36966: 'BEATRICE@r@v27/50700618."I''ll use you if I think of any more. Be quiet for now!!@k @|@y@v27/50700619.*cackle*cackle*, how''s that, Dlanor the witch hunter?!!@k @v27/50700620.After skewering so many witches in the past and burning them at the stake, how does it feel to have the tables turned and be skewered by a witch?!!@k @|@y@v27/50700621.Hehhihhahhaaahhhahahahahahaha!!"'
36967: '@rThey were all ridiculous arguments, but they came fiercely one after another.'
36968: '@rThough a total of five wedges pierced Dlanor, her expression didn''t change in the slightest.'
36969: '@rHowever, her movements had indeed been limited...'
36970: 'Chiester410@r@v36/53500013."Ooh...@k@v36/53500014. Witches sure are scary nyeh...@k@v36/53500015. You can''t beat twisted logic nyeh."'
36971: 'Chiester45@r@v35/53400010."They don''t violate the Knox Decalogue...@k@v35/53400011. They''re all valid...!"'
36972: 'Dlanor@r@v47/54600045."..........................."'
36973: 'Natsuhi@r@v03/50900828."...W-......well done, BEATRICE...!@k @v03/50900829.Even if there was no one in this study and even if it was a locked room, that alone isn''t enough to deny Father''s existence...!"'
36974: 'BEATRICE@r@v27/50700622."Against a normal opponent, I''d think the matter settled by now.@k@v27/50700623. ......But this is Dlanor, Chief Inquisitor!@k @|@y@v27/50700624.This ruthless woman even killed her father when he violated the Ten Commandments...!@k @v27/50700625.Kinzo, now!"'
36975: 'Kinzo@r@v01/51500205."Mm...!"'
36976: '@rNow that Dlanor had been pinned down, this was their last chance to recover their magical power and escape.'
36977: '@rOnce again, a pitch-black gate began to rise slowly in front of Beato and Kinzo......'
36978: '@rThough the gate had once been opened by simply drawing in the air,@k it wasn''t so easy in the study now, filled as it was with the power of denial.'
36979: 'Natsuhi@r@v03/50900830."D-......do you see now, everyone?!@k @v03/50900831.No matter how much you question the state of this study, the truth of Father''s good health remains unshakeable...!!"'
36980: 'Erika@r@v46/54500480."......Oh, very bold words.@k@v46/54500481. I suggest you don''t forget that you and I...@k@v46/54500482.are both also a part of this battle.@k @v46/54500483.I cannot fight against witches, but I can fight against you."'
36981: '@rErika grinned at Natsuhi with a smile more demonic than a real demon''s.'
36982: 'Erika@r@v46/54500484."......Natsuhi-san.@k@v46/54500485. Let me ask you again.@k@v46/54500486. ......Are you sure that last night, you spoke with Ushiromiya Kinzo-san in this room?"'
36983: 'Natsuhi@r@v03/50900832."Y-yes.@k@v03/50900833. I have said repeatedly that I reported the day''s events to him and bid him good night...!"'
36984: 'Erika@r@v46/54500487."This may be a strange thing to ask, but since it''s needed to prove your innocence,@k@v46/54500488. please answer me straightforwardly.@k@|@y@v46/54500489. ......Is this Kinzo-san you speak of the same Ushiromiya Kinzo-san we are all thinking of?@k @v46/54500490.It isn''t a different person or thing with the same name, is it?"'
36985: 'Natsuhi@r@v03/50900834."I, I''m not really sure what you mean...!"'
36986: 'Eva@r@v05/51000286."......It''s like this.@k@v05/51000287. You didn''t, for instance, start calling this room itself "Father" after Father''s death, right?@k@v05/51000288. That''s what she''s asking."'
36987: 'Eva@r@v05/51000289."You said you gave a report of the day''s events to Father before bed, right?@k @v05/51000290.That doesn''t mean you were here alone, delivering your report directly to the wall of the study and addressing it as "Father", does it...?"'
36988: 'Natsuhi@r@v03/50900835."H-how rude!!@k @v03/50900836.Nothing of the sort happened...!@k @v03/50900837.Father is Father!!@k @v03/50900838.He is in good health!@k @v03/50900839.And I most certainly gave him a report and said good night to him in this room last night...!!@k @v03/50900840.I''m not trying to trick you or talk my way out of anything!"'
36989: 'Erika@r@v46/54500491."I see.@k@v46/54500492. In that case, can you repeat what I tell you to?@k @v46/54500493.If you aren''t tricking or deceiving us in any way, you should be able to repeat my words."'
36990: 'Natsuhi@r@v03/50900841."F-fine.@k@v03/50900842. I''ll repeat whatever you want...!"'
