37034: 'Erika@r@v46/54500504."Hahahahaha, ahhahahahahahahaha...!!@k @v46/54500505..........You witches are truly pitiful beings.@k@v46/54500506. ......You just try to talk your way out of things endlessly in an attempt to cover up the truth.@k@v46/54500507. Let me borrow Dlanor''s words.@k@v46/54500508. ......I''m disappointed, BEATRICE-san.@k@|@y@v46/54500509. ...*giggle*giggle*giggle*!"'
