37036: '@rErika coldly delivered these decisive words to Beato, ......who was crawling on the ground.'
37037: 'Erika@r@v46/54500256."Detective''s authority.@k@v46/54500511. The detective has the right to inspect all crime scenes.@k@v46/54500512. And I have exercised that right.@k@v46/54500513. Therefore, I can say this."'
37038: 'Erika@r@v46/54500514."Kinzo-san is not inside this room.@k@v46/54500515. Furthermore, this room is a perfect locked room.@k@v46/54500516. From the above two points, I can state this fact:@k@v46/54500517. This room has been uninhabited all along.@k@v46/54500518. Natsuhi-san was lying about having met Kinzo-san here last night!@k @v46/54500519.And that is checkmate, BEATRICE-san...!"'
37039: 'Erika@r@v46/54500520."*giggle*giggle*, ......ahahahaha, ahhahhahahahahahahahaahahahahahahahahaha!@k @v46/54500521.What do you think of that?@k @v46/54500522.All it takes is the presence of this room,@k @v46/54500523.and a deduction like this becomes trivial for Furudo Erika!@k@v46/54500524. Your thoughts, ladies and gentlemen?!@k @|@y@v46/54500525.Ahhahahahahhahhahhaaaahh!!"'
