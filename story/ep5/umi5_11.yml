36437: 'Battler@r@v10/50100811.".........So, both of the keys that can open this door are inside the study."'
36438: 'Erika@r@v46/54500306."A locked room!@k@|@y@v46/54500307. .........<Good>.@k@v46/54500308. Things are finally starting to get a little interesting.@k@v46/54500309. ......If, inside that room,@k@v46/54500310. Kinzo-san is lying on the bed with his throat cut, that would be pretty neat."'
