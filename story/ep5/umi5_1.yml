32891: 'Natsuhi@r@v03/50900003."It''s Natsuhi, please open up...!!"'
32892: '@rNatsuhi yelled as she knocked loudly and repeatedly.'
32893: '@rShortly after, there was a heavy clunking sound, and the sound of the door to Kinzo''s study unlocking could be heard.'
32894: '@rAs the door opened, a heavily sweet venomous odor flowed out.'
32895: '@rNatsuhi was always ashamed of how she automatically grimaced at that,@k even though she thought it rude to the family head...'
32896: '@rKrauss was waiting for her inside the study.'
32897: '@rNatsuhi flew into his arms.'
32898: 'Natsuhi@r@v03/50900004."......I-is Father... ......Is he........."'
32899: 'Krauss@r@v02/50800001."Calm yourself.@k@v02/50800002. ......Doctor Nanjo is examining him now..."'
32900: '@rWith an uncertain gait, Natsuhi went towards the center of the study, supported by Krauss.'
32901: '@rThere, a dignified bed fitting for the head of the Ushiromiya family could be seen, along with Nanjo, Genji, and Kumasawa...'
32902: 'Natsuhi@r@v03/50900005."Doctor Nanjo...@k@v03/50900006. I-...is Father......"'
32903: '@rAfter sighing deeply, Nanjo left the side of the bed.'
32904: '@rOn the bed, Kinzo could be seen lying down, sleeping......'
32905: 'Nanjo@r@v19/51900001.".........He died peacefully.@k@v19/51900002. ...I don''t think Kinzo-san had any regrets."'
32906: 'Natsuhi@r@v03/50900007."Ah, ...waaaaaaaaaaaahhhhhhhh...@k@v03/50900008. Father... Fatheeeeeeeeer...!!"'
32907: '@r...Sobbing, Natsuhi put her head against the chest of the man who had fallen into a sleep from which he would never awaken.'
32908: 'Kumasawa@r@v18/51800001."M-......Madam, ...please, stay strong..."'
32909: 'Natsuhi@r@v03/50900009."Father, Father......!!@k @v03/50900010.This is...just too sudden......@k@v03/50900011. Aaaaaaaahhhhhhh!!!"'
32910: 'Genji@r"..............."'
32911: '@rNatsuhi couldn''t stop her tears over the death of Kinzo, whom she had loved like a second father.'
32912: '@rKumasawa rubbed Natsuhi''s back, consoling her......'
32913: '@rKrauss slumped into his late father''s favorite chair.'
32914: '@rBy sitting there, he might have been immersing himself in memories of his departed father.'
32915: '@rOr perhaps he thought that by sitting there, he might be able to understand just a bit of the madness of Kinzo''s later years,@k which had eluded him to the end of his father''s life...'
32916: '@rNanjo turned his back and looked down over the outside world through a crack in the curtains.'
32917: '@rIt was the same thing he''d often done when Kinzo sat in that chair contemplating a chess move...'
32918: 'Krauss@r@v02/50800003."...If he was to die anyway, it would have been better if he was sick in bed for a year or so before dying.@k@v02/50800004. I do wish he could have died after a grace period during which the proper arrangements could have been made."'
32919: 'Nanjo@r@v19/51900003."It''s the other way around.@k@v19/51900004. ......We should be glad that he was in high spirits until the very end."'
32920: 'Krauss@r@v02/50800005."That will have to be my public stance, yes..."'
32921: '@rNanjo understood that as well.'
32922: '@rThis was the death of Ushiromiya Kinzo, a man who had risen like a comet and glittered like a supernova in the post-war world of business.'
32923: '@rHis funeral would probably be of a fantastic scale.@k@rAnd it would also be the ceremony marking Krauss''s inheritance of the headship.'
32924: '@rHe would have to arrange everything as the host of the event, carry out funeral diplomacy perfectly,@k and make it clear that the Ushiromiya family would still hold enormous influence in the political and financial spheres.'
32925: '@rAs Nanjo watched Krauss, he was vividly reminded of the time when Kinzo had been suddenly selected as the Ushiromiya family head,@k a time in which Kinzo had been lost and confused.'
32926: '@rNanjo could remember that well, and for that reason, he was able to understand Krauss''s distress and sympathize with it...'
32927: '@rNatsuhi''s sobs eventually subsided.'
32928: '@rSeeing this, and leaving Kumasawa to care for Natsuhi as a fellow woman, Genji returned to Krauss.'
32929: '@rAnd he lowered his head slightly, as though asking what should be done.'
32930: 'Nanjo@r@v19/51900005."......Genji-san and I will deal with the formalities.@k@v19/51900006. Krauss-san, perhaps you should contact the relatives first."'
32931: 'Krauss@r@v02/50800006.".................."'
32932: '@rKrauss, with his hands still over his eyes, didn''t respond...'
32933: '@rPerhaps even though he had known this day would come, Krauss really couldn''t hide his shock at how suddenly it had reached them.'
32934: 'Genji@r@v14/51600002."......Leave this to Doctor Nanjo and me.@k@v14/51600003. Krauss-sama, I suggest that you first speak with Madam."'
32935: '@rMaybe she heard that, or maybe it was a coincidence.@k@rAs though responding to Genji''s words, Natsuhi came over.'
32936: '@rHer eyes were red from crying so much,@k but she apparently understood the heavy responsibility that had been imposed on the two of them even better than Krauss did.'
32937: 'Natsuhi@r@v03/50900012."As of now, you are the head of the glorious Ushiromiya family.@k@v03/50900013. Let us show our relatives and the world that you have splendidly succeeded your father.@k@|@y@v03/50900014. ......As your wife, I am prepared to serve you until the day our coffins are laid down alongside each other."'
32938: 'Krauss@r@v02/50800007.".................."'
32939: '@rTrying to encourage her husband who was overcome with shock, Natsuhi lent him some reassuring words.'
32940: '@rWhen Krauss finally lowered the hands that had been covering his face,@k ...he looked up at the ceiling with a blank expression and let out a deep, deep sigh...'
32941: 'Natsuhi@r@v03/50900015."......Please, stay strong.@k@v03/50900016. There are a great many people who will intend on helping themselves to everything Father has left behind.@k@v03/50900017. We must fight to protect Father''s honor and wealth.@k@v03/50900018. That is the first responsibility of the Ushiromiya head."'
32942: 'Krauss@r@v02/50800008."...I understand.@k@v02/50800009. I do understand."'
32943: 'Natsuhi@r@v03/50900019."Doctor Nanjo, Genji, please take care of the legal and funeral arrangements.@k@|@y@v03/50900020. Especially you, Genji.@k@v03/50900021. I ask that you take particular care and see to it that the funeral will be a fitting one for Father."'
32944: 'Genji@r@v14/51600004."......Certainly."'
32945: 'Natsuhi@r@v03/50900022."And Doctor Nanjo.@k@v03/50900023. Father didn''t pass away in a hospital, ......so..."'
32946: 'Nanjo@r@v19/51900007."Yes.@k@v19/51900008. An autopsy might indeed be required depending on the circumstances......"'
32947: 'Natsuhi@r@v03/50900024."Is there anything you might be able to do about it...?@k@v03/50900025. Even though he has passed away, Father''s body is precious.@k@v03/50900026. Any damage to it would not be acceptable..."'
32948: 'Nanjo@r@v19/51900009."I understand how you feel.@k@v19/51900010. ...However, it is important to follow proper procedure where things like this are concerned.@k@|@y@v19/51900011. And, umm, ......I don''t really know how to say this.@k@v19/51900012. I fear that several of your relatives might be difficult..."'
32949: '@r......There was no way to know what those inheritance vultures might try to find fault with.'
32950: '@rThey might squawk that there was something suspicious about the cause of death, and use that as a point of contention to start some trouble.'
32951: '@rRight now, not only was it important to pay Kinzo''s remains the respect they were due, but there was also a need to focus on solidifying the position of the new family head, Krauss...'
32952: 'Natsuhi@r@v03/50900027."......I understand.@k@v03/50900028. In that case, please keep it to an absolute minimum.@k@v03/50900029. And whatever you do, please make absolutely sure that Father''s dignity remains unharmed."'
32953: 'Nanjo@r@v19/51900013."That I can assure you.@k@v19/51900014. Please don''t worry.@k@v19/51900015. ......In any event, leave Kinzo-san to us and stay by Krauss-san''s side.@k@v19/51900016. ...Things are only going to get tougher for him."'
32954: 'Natsuhi@r@v03/50900030."I understand.@k@v03/50900031. ......And you too, dear...please stay strong."'
32955: 'Krauss@r@v02/50800006.".................."'
32956: '@rKrauss was still staring lazily at the ceiling with a befuddled expression on his face...'
32957: '@rNatsuhi understood the shock and heavy responsibility.@k@rShe felt that she understood her husband''s feelings as well as anyone possibly could.'
32958: 'Natsuhi@r@v03/50900032."......I will contact the relatives.@k@v03/50900033. Please rest for the time being."'
32959: 'Krauss@r@v02/50800011."............"'
32960: '@rKrauss didn''t respond.'
32961: '@r...Natsuhi thought that he was being a little bit weak, but that just made it all the more important for her to support him right now.'
32962: '@rSeeing her husband like this actually stirred Natsuhi up, and a resolute expression rose to her face.'
32963: 'Natsuhi@r@v03/50900034."Things are going to get busy.@k@v03/50900035. Let''s get started with whatever we can do right now.@k@v03/50900036. .........I''m sure my husband wants to have some time alone with Father.@k@v03/50900037. We should step out for the time being."'
32964: 'Kumasawa@r@v18/51800002."......Yes, I think that would be best...@k@v18/51800003. After all, I expect this will be the only time he''ll have."'
32965: '@rBeing in charge of a funeral is tiring work.@k There''s no time to shed tears.'
32966: '@rIf Krauss were ever to be given time to cry for his dead father, that time would have to be now.'
32967: '@rEveryone agreed with Kumasawa''s words.'
32968: '@rEven then, Krauss continued to lazily gaze up at the ceiling and didn''t respond in any way.'
32969: '@rNatsuhi urged the servants to go.'
32970: 'Natsuhi@r@v03/50900038."I''ll go talk to Jessica too.@k@v03/50900039. ......She is the successor to the head now.@k@v03/50900040. I''ll have to impress upon her that she needs to be appropriately aware of it."'
32971: 'Krauss@r@v02/50800012.@a1666."Wait."'
32972: '@rAs they each started to make their way out of the study, Krauss finally spoke.'
32973: '@rThey stopped walking.'
32974: 'Natsuhi@r@v03/50900041."Yes?"'
32975: 'Krauss@r@v02/50800013."......Wait."'
32976: 'Natsuhi@r@v03/50900042.".........Yes??"'
32977: '@rHadn''t she already stopped walking, just like her husband had asked?@k@rBut despite that, he had once again told her to wait.'
32978: '@rFrom those slightly weak words, Natsuhi understood that he had probably stopped her because he wanted her to be by his side.'
32979: 'Natsuhi@r@v03/50900043."The rest of you, downstairs.@k@v03/50900044. I will stay with my husband.@k@v03/50900045. Please call us on the phone if anything happens."'
32980: 'Genji@r@v14/51600004."......Certainly."'
32981: 'Krauss@r@v02/50800014.@z150."I said wait!!"'
32982: '@rWhen Krauss suddenly raised his voice, everyone jumped and turned around...'
32983: '@rUnable to comprehend what she had done to spark her husband''s wrath, Natsuhi ran up to him.'
32984: 'Natsuhi@r@v03/50900046."What''s wrong, dear...@k@v03/50900047. Have I said something rude...?@k @v03/50900048.If so, please forgive me."'
32985: 'Krauss@r@v02/50800015."No, no, that''s not it, that''s not it...@k@v02/50800016. Wait a second, give me some time."'
32986: 'Natsuhi@r@v03/50900049."Yes, I understand.@k@v03/50900050. It''s important to have time to sort things out inside your heart.@k@v03/50900051. ...We were just going to leave quietly to give you the time you need..."'
32987: 'Krauss@r@v02/50800017."And I''m telling you to wait before doing that......@k@v02/50800018. ......Listen, just no one move.@k@v02/50800019. Not even an inch...@k@v02/50800020. ......If you''re tired, then feel free to sit in whatever chair or sofa you want.@k@v02/50800021. So just stay quiet and shut up in silence, don''t do anything, just stay right there!"'
32988: '@r......Those unreasonable words felt like a glimpse of how Kinzo used to be.'
32989: '@rNatsuhi couldn''t hide a slight surprise at those words, which made it seem as though Kinzo had possessed her husband.'
32990: '@rNatsuhi told the servants to wait for the time being.'
32991: '@rShe ordered them to sit in a sofa a short distance off, approached her husband, and spoke to him in a small voice...'
32992: 'Natsuhi@r@v03/50900052."......If you order it, I will wait however long you ask. I won''t move.@k@v03/50900053. So please, try and calm yourself..."'
32993: 'Krauss@r@v02/50800022."...No, ......that''s not it, that''s not it..."'
32994: '@rWas it really his father''s blood, or was he actually being possessed?'
32995: '@rKrauss''s disorderly style of speech strongly resembled Kinzo''s...'
32996: '@rAs she watched this, Natsuhi felt with even greater certainty that Krauss was indeed Kinzo''s son,@k and that he was the true successor to the head, more suitable than any other person.'
32997: 'Krauss@r@v02/50800023.".........Natsuhi.@k@v02/50800024. Over here."'
32998: '@rKrauss stood up and headed towards the window, trying to lengthen the distance between himself and the servants waiting on the sofa by even a small amount.'
32999: '@rNatsuhi realized that he must have something secret that he wanted to talk about.'
33000: 'Natsuhi@r@v03/50900054."...Yes, dear?@k@v03/50900055. ......What is it...?"'
33001: 'Krauss@r@v02/50800025."............Dad dying...@v02/50800026.would be bad."'
33002: 'Natsuhi@r@v03/50900056."Would be? But he has already passed away.@k@v03/50900057. We can''t change reality..."'
33003: 'Krauss@r@v02/50800027."That''s not it.@k@v02/50800028. ...Now is...a bad time..."'
33004: 'Natsuhi@r@v03/50900058."......What do you mean?"'
33005: 'Krauss@r@v02/50800029."I''ve been putting Dad''s fortune up as collateral.@k@|@y@v02/50800030. Once the issue of dividing the inheritance comes up, I won''t be able to hide it...!"'
33006: 'Natsuhi@r@v03/50900059."Wh-...what...?@k @v03/50900060.C-collateral, you say?@k@v03/50900061. How much...?"'
33007: 'Krauss@r@v02/50800031."...You remember how I helped out Kondo-kun with Melody Land?"'
33008: 'Natsuhi@r@v03/50900062."Didn''t I tell you to break ties with that person?@|@y@k@v03/50900063. You told me you''d refused him...!@k @v03/50900064.Why?!"'
33009: 'Krauss@r@v02/50800032."There is such a thing as a man''s honor!@k @v02/50800033.I couldn''t refuse!"'
33010: '@rKrauss claimed to hold honor as a virtue.'
33011: '@r...However, Natsuhi knew that he most often used this as an excuse after he couldn''t bring himself to pass up a deal.'
33012: 'Natsuhi@r@v03/50900065."Th-that wouldn''t be a problem if we had plenty of money on hand...!@k @v03/50900066.But didn''t you borrow quite a lot of money for the plan to turn this island into a resort?!"'
33013: 'Krauss@r@v02/50800034."Yeah, I did!@k @v02/50800035.And there were people here and there who lent me a hand along the way!@k @v02/50800036.If I''m going to repay them, I can''t just sit around on my hands!"'
33014: 'Krauss@r@v02/50800037."You need money to repay people!@k @v02/50800038.You need money to make money!@k @v02/50800039.You can''t even get started without money!@|@y@k @v02/50800040.And even the plan for this island would be proceeding smoothly if only there hadn''t been problems with the planning company!"'
33015: 'Krauss@r@v02/50800041."I had the cooperation of government officials.@k@v02/50800042. I even had the governor''s personal guarantee that this would become the newest travel destination in the Tokyo Metropolis!@k @v02/50800043.The groundwork I laid was completely perfect!!@k @v02/50800044.Random chance and bad timing were against me!@k @v02/50800045.It was just a bit of bad luck.@k@v02/50800046. Like a traffic accident!!"'
33016: 'Natsuhi@r@v03/50900067."That was no accident!@k @v03/50900068.It was fraud!@k @v03/50900069.You were tricked!!@k @v03/50900070.They were never drawing up plans for making this island a resort in the first place!!"'
33017: 'Krauss@r@v02/50800047."That''s not true!!@|@y@k @v02/50800048.Hijikata-kun''s vision was simply overflowing with foresight!@k@v02/50800049. The way his eyes always focused on the whole world and the future taught me that things I always believed to be mere dreams were only the tip of the iceberg of what is possible!!@k@v02/50800050. Expand your dreams! To the whole world, to the future!@k@v02/50800051. You heard him say that too, didn''t you?!"'
33018: 'Natsuhi@r@v03/50900071."Yes, I did...! And I think I remember telling you what I thought after we returned home!!@k@v03/50900072. I said that he was suspicious!@k@v03/50900073. That he only spoke of dreams and didn''t have his feet planted on the ground,@k@v03/50900074. and that you must not have any further relations with him!!"'
33019: 'Krauss@r@v02/50800052."Hijikata-kun is a wonderful, pleasant young man!!@|@y@k @v02/50800053.One could learn a lot from the way he lives!@k @v02/50800054.I can respect him despite his youth!@k@v02/50800055. I won''t have you insulting him!!"'
33020: 'Natsuhi@r@v03/50900075."That''s what you said about the whole moon tourism thing!!@k@v03/50900076. You kept saying it was visionary, that it looked to the future, that it had high aspirations, and what was the end result?!@k@v03/50900077. Eventually, even you yourself admitted that it was utter nonsense!!@k@v03/50900078. I was sure something was wrong from the moment that strange man showed up claiming to be a high-ranking NASA official!"'
33021: 'Krauss@r@v02/50800056."The only issue was that foreigner who was an international swindler!@k@v02/50800057. Mr. Sonezaki and I were both victims of that incident.@k@v02/50800058. Even now, his vision isn''t mistaken!@k@v02/50800059. There will definitely come a time when space tourism will become a popular indulgence for the world''s richest.@k@v02/50800060. And the very first enterprise in that area will probably be monopolized by a single, private company.@k@v02/50800061. That viewpoint is not mistaken!@k@v02/50800062. There is simply a group of international swindlers who are trying to take advantage of that fact and deceive investors across the world—"'
33022: 'Natsuhi@r@v03/50900079."And I''m trying to tell you that this Sonezaki man was one of them too!!@|@y@k@v03/50900080. Just how gullible are you? Why do you always just accept these suspicious offers without any doubts?!!"'
33023: 'Krauss@r@v02/50800063."Take that back!@|@y@k@v02/50800064. Mr. Sonezaki is a man with a brilliant future ahead of him!@k@v02/50800065. There''s nothing suspicious about him!!@k@v02/50800066. Because the dreams he speaks of anticipate the future, they sound crazy to people who can''t look that far ahead!@k@v02/50800067. A woman like you can''t see into the future!!"'
33024: 'Natsuhi@r@v03/50900081."Yes, a woman like me can''t see into the future!!@k@v03/50900082. But I can see the present!@k@v03/50900083. Right in front of me, I can see a pitiful husband who''s been taken in by sly, double-crossing swindlers and still trusts them implicitly even after he''s been tricked!!"'
33025: 'Krauss@r@v02/50800068."Oh, shut up!!@|@y@k @v02/50800069.You don''t understand anything about money or business or economics!!@k @v02/50800070.Don''t try to butt in on the job of the husband!!@k @v02/50800071.All a wife needs to do is the housework!@k @v02/50800072.You just keep quiet!!!"'
33026: 'Natsuhi@r@v03/50900084."...............!@v03/50900085. ........."'
33027: '@rWithout another word, Natsuhi fell silent, just as Krauss wanted.@k@rShe was already far beyond anger and sadness.'
33028: '@rAnd the emotion that lay on the other side of those...was an almost indifferent pity.'
33029: '@rKrauss had always been frightened of Kinzo since the days of his youth, and had come to subconsciously admire the way his father lived.'
33030: '@r...Without realizing it, he had come to believe that he could only be recognized as a man in his own right if he surpassed his father.'
33031: '@rHowever, Kinzo had been a mad genius, the likes of which had never before been seen in the Ushiromiya family''s long history.'
33032: '@rHis talent was a gift from heaven,@k ......and it definitely wasn''t genetic, much less something that could be learned.'
33033: '@rNatsuhi instructed the servants not to tell anyone about Kinzo''s death,@k and dismissed everyone for the time being, to give the two of them a chance to talk alone.'
33034: '@rThen, she invited Krauss to her bedroom,@k ......and made him tell her everything about their current financial situation.'
33035: '@rThey were things that Natsuhi hadn''t been told about under the assumption that a woman had no business knowing.'
33036: '@rNatsuhi had herself made a point of avoiding this area in the past, thinking that it wasn''t a wife''s place to intrude on such matters.'
33037: '@rHowever, this might also have meant that she had been remiss in her duty as a wife to protect her family.'
33038: '@rThe depths of this sin had been made quite clear to Natsuhi...'
33039: '@rKrauss was probably tired of trying to defend himself.@k@rPerhaps because he had gotten a headache, he hid his face and sank into silence...'
33040: '@rNatsuhi noticed that the water in the electric kettle was boiling and stood up to refill her cup with black tea.'
33041: '@rAnd when she touched the cup of black tea, she noticed for the first time.'
33042: '@rThe sound of the cup and saucer clinking together told her that her fingers were shaking...'
33043: '@rKrauss had built up a large debt to obtain funds for his various projects...and to cover the losses when they failed.'
33044: '@rOf course, he had put the mansion and property up as collateral.'
33045: '@rHowever, doing such a thing above board would have resulted in the mortgage being registered.'
33046: '@rIn other words, there would have been a record that Krauss had put Kinzo''s wealth up as collateral to obtain a loan without anyone''s permission.'
33047: '@rKrauss couldn''t afford for Kinzo, Eva, and the others to learn of such a thing.'
33048: '@rTherefore, he had been putting those assets up as collateral using the worst possible method.'
33049: 'Krauss@r@v02/50800073.".........I signed over the deeds and power of attorney..."'
33050: 'Natsuhi@r@v03/50900086."And...what does that mean......?"'
33051: '@rWhat Krauss was saying probably meant that he had, in essence, signed away the rights to their assets.'
33052: '@rIf those assets had been used as collateral for a loan, then Krauss would have had some options under the law.'
33053: '@rHe would have had to deal with a bank, which would have absolutely no compassion,@k but they would have been able to work something out within the rules set by society.'
33054: '@r......However, signing away the deed and power of attorney was a whole different story.'
33055: '@rIn short, even the mansion they were living in was at risk.@k If the person holding the deed were to decide to ignore his agreement with Krauss and sell the mansion to a third party right this moment, they would have no recourse whatsoever.'
33056: '@rFar from using their house as collateral for a loan, this was basically the same as selling it to borrow money...'
33057: 'Natsuhi@r@v03/50900087."...In other words, ...the moneylenders have the power to make or break the Ushiromiya family as they please.@k@|@y@v03/50900088. If they were to suddenly sell our house on some slight whim,@k@v03/50900089. ......we''d have to pack our bags and leave right now, wouldn''t we...?"'
33058: 'Krauss@r@v02/50800074."That is technically true.@k@v02/50800075. However, all of the people I have arrangements with are very reputable.@k@v02/50800076. They aren''t loan sharks.@k@v02/50800077. These are transactions based on trust between economically literate men."'
33059: 'Krauss@r@v02/50800078."I trust them.@k@v02/50800079. And they, in turn, trust that by lending me money, I will achieve great success in business and give them massive returns on their investment.@k@v02/50800080. I signed over the power of attorney as a sign of good faith and so that they wouldn''t have to doubt in the certain success of my enterprises."'
33060: 'Krauss@r@v02/50800081."What happens if I hesitate now?@k @v02/50800082.Wouldn''t that mean even I have no confidence in my own ventures?!"'
33061: 'Natsuhi@r@v03/50900090.".................."'
33062: '@rIf your ventures had been successful, we wouldn''t be in debt now, would we...@k@r...Natsuhi only barely stopped herself from saying it.'
33063: 'Natsuhi@r@v03/50900091."......Father is dead.@k@v03/50900092. What happens next?@k@v03/50900093. Your debt will be exposed to the light of day, and your siblings will hold you responsible?"'
33064: 'Krauss@r@v02/50800083."............That won''t be all.@k@v02/50800084. ......It will probably lead to criminal charges..."'
33065: 'Natsuhi@r@v03/50900094."C-criminal charges......@k@v03/50900095. Wh-why is that......?"'
33066: 'Krauss@r@v02/50800085.".........It''s better if you don''t know.@k@v02/50800086. ......The point is...we can''t allow anyone to find out about this......"'
33067: 'Natsuhi@r@v03/50900096."..............."'
33068: '@rKrauss looked at the floor shamefully, shaking his head over and over......'
33069: '@rIf it would come to criminal charges, ...then he must have broken some laws.'
33070: '@rHe had probably been so intent on raising a large sum of money that he hadn''t paid any heed to appearances.'
33071: '@r......Krauss had seriously believed that his many projects would definitely succeed and return huge profits.'
33072: '@rSo he had figured that even if he broke a few laws, he would be able to pay everything back before too long and pretend that the whole thing had never happened.'
33073: '@r......This might have lessened his resistance towards breaking a couple laws.'
33074: '@rAnd now Kinzo''s death, the worst possible thing, had occurred, and soon he wouldn''t be able to keep it all hidden......'
33075: 'Natsuhi@r@v03/50900097."......What will happen to us?"'
33076: 'Krauss@r@v02/50800087."Th-there is no need to worry...@k@v02/50800088. You may not believe, but conditions are most certainly on the rise now.@k@v02/50800089. The value of the city real estate I invested in is rising rapidly."'
33077: 'Krauss@r@v02/50800090."I have a project in progress to consolidate those and construct a massive business tower.@k@v02/50800091. This is the most reliable of all my investments so far, and it''s proving to be the most successful."'
33078: 'Krauss@r@v02/50800092."......However, it will take a little more time for it to bear fruit.@k@v02/50800093. It''s absolutely certain to do so, but it will not happen immediately..."'
33079: 'Natsuhi@r@v03/50900098."......Will the success of that venture be enough to pay back our debts?"'
33080: 'Krauss@r@v02/50800094."Of course it will.@k@v02/50800095. I''ll be able to write off all of the debt I''ve accumulated so far...!!@k @v02/50800096.So believe me.@k@v02/50800097. I only need a little more time!"'
33081: 'Natsuhi@r@v03/50900099."But Father has already passed away!@k @v03/50900100.We don''t have that kind of time anymore!"'
33082: 'Krauss@r@v02/50800098."I know, I know that...!!@k @v02/50800099.That''s why...I have to obtain money from somewhere and pay off those debts right now!"'
33083: 'Krauss@r@v02/50800100."I need money, that''s what it comes down to...@k@v02/50800101. Money, a lot of it, right now!!@k @v02/50800102.Aaaaaaaaarrrrgghhhhhh...!!"'
33084: '@rKrauss roared and clutched his head, writhing about as if in pain.'
33085: '@rAs Natsuhi watched, several conflicting emotions swirled about in her chest.@k@rShe felt pity for her husband, but at the same time, she felt he was a fool.'
33086: '@r......And she also felt a mixture of anger and regret towards her own irresponsibility in letting her husband run wild for so long.'
33087: '@rIt should have been clear to him well before today that they were in a very critical situation.'
33088: '@rAnd yet he had irresponsibly waited for this moment to come and was now writhing about.'
33089: '@r......Her husband was so foolish......and pitiful.@k@rIt was easy to feel frustrated with him.@k ......However, she was his wife.'
33090: '@rFor a wife to ridicule her husband as a fool would run in conflict with her responsibilities.'
33091: '@r...If he was a fool, then she would have to support him to compensate...'
33092: '@rHowever, she didn''t have a clue what she was meant to do about this...'
33093: '@rIf there was a massive amount of money like that within easy reach,@k there was no way that Krauss wouldn''t have already laid his hands on it......'
33094: '@rIt would also be easy to tell him to be a man and give up on everything.@k@rBut that would also run in conflict with her responsibilities.'
33095: '@rShe was Ushiromiya Natsuhi.'
33096: '@r......The woman who had become Krauss''s wife and sworn to support him, the new head of the Ushiromiya family, for as long as she lived.'
33097: '@rShe had to somehow help her husband in his efforts to raise money.'
33098: '@r......She understood it logically.'
33099: '@rBut she couldn''t suppress the indescribable feeling of dejection that seemed to rise up from the dark depths of her heart......'
33100: 'Krauss@r@v02/50800103."That''s right, D-Dad''s hidden gold...!@|@y@k @v02/50800104.Ten tons of gold is worth 20 billion yen!@k @v02/50800105.If I had that...@v02/50800106. That''s right, if I had that, everything could be resolved...!"'
33101: 'Krauss@r@v02/50800107."Natsuhi, that''s it! The witch''s epitaph!@k @v02/50800108.Let''s solve that, let''s solve it together!@k @v02/50800109.If we can just find the gold, everything will work itself out!!@k @v02/50800110.That''s right, it must be hidden somewhere on this island!!@k @v02/50800111.If we had that, if we had that!!"'
33102: 'Natsuhi@r@v03/50900101."Y-you''re hurting me...@v03/50900102. Dear,@v03/50900103. ......p-please, stop this......"'
33103: '@rKrauss, acting as excited as if he''d thought up a perfect, brilliant plan, grasped Natsuhi''s upper arm tightly.'
33104: '@rNatsuhi couldn''t help but be dumbfounded.'
33105: '@rIt wasn''t just because she''d heard something as fake-sounding as the hidden gold brought up.'
33106: '@rKrauss usually disparaged the story of the hidden gold,@k saying that it didn''t exist and that it was all a fiction his father had created to borrow a lot of money.'
33107: '@rNatsuhi was doubly taken aback because of this...'
33108: 'Krauss@r@v02/50800112."I know, let''s have Jessica help us too.@k@v02/50800113. Maybe some things can only be solved with the sense of a child!@k @v02/50800114.This is a family crisis.@k@v02/50800115. All of us have to stick together!!"'
33109: 'Krauss@r@v02/50800116."Yes, it''s just a fanciful little puzzle that Dad created...!!@k @v02/50800117.We should be able to solve it... There''s no way we can''t solve it...!@k @v02/50800118.It''s the only way!!"'
33110: 'Krauss@r@v02/50800119."Oh, Natsuhi, this is wonderful,@k@v02/50800120. we still have an option left, and right here next to us!!@k @v02/50800121.The gold is on this island!!@k @v02/50800122.If we had it, everything would be resolved!"'
33111: 'Krauss@r@v02/50800123."Waha, wahahahahahahahahahahaha!!@k @v02/50800124.Natsuhi, call Jessica here right away!@k @v02/50800125.Let''s overcome this family crisis as a family!!@k @v02/50800126.Yes, right now!!@k @v02/50800127.The gold is on this island, it''s right beside us!!@k @|@y@v02/50800128.......Wah!!"@|@y'
33112: '@rNatsuhi knocked Krauss aside, unable to withstand the pain in the arm he was twisting in his excitement.'
33113: '@rKrauss tripped over the edge of the bed and flopped pathetically onto the floor...'
33114: 'Natsuhi@r@v03/50900104."P-please get ahold of yourself!!@k @v03/50900105.And please calm down...!!@k @v03/50900106.Do you really think that this Ushiromiya family crisis......could be solved by saying something as dream-like as that...?!!"'
33115: 'Krauss@r@v02/50800129."N-.........Natsuhi........."'
33116: 'Natsuhi@r@v03/50900107."Please, cool your head off and think of a realistic plan to gather money...!!@k @v03/50900108.I''m going to go cool my head off as well......!"'
33117: 'Krauss@r@v02/50800130."...Wait......Natsuhi......"'
33118: '@rMaybe falling over had knocked the sense back into him.@k@rKrauss tried to tell Natsuhi to stop, but she just kept walking.'
33119: '@rClosing the door forcefully, Natsuhi dashed away......'
33120: '@rNatsuhi ran through the corridor.'
33121: '@rShe didn''t want anyone to see her like this, but she ran headlong into Genji......'
33122: 'Genji@r@v14/51600006."......My deepest apologies.@k@v14/51600007. Madam, have you been injured...?"'
33123: 'Natsuhi@r@v03/50900109."I, I''m alright.@k@v03/50900110. Leave me alone...!!"'
33124: 'Genji@r@v14/51600008.".........Certainly."'
33125: 'Natsuhi@r@v03/50900111."Oh, ......Genji.@k@v03/50900112. ...What''s the state of Father''s study?"'
33126: 'Genji@r@v14/51600009."......It is just as you left it.@k@v14/51600010. Doctor Nanjo is in the parlor."'
33127: 'Natsuhi@r@v03/50900113."I see...@k@v03/50900114. ......Do you have the key to the study?"'
33128: 'Genji@r@v14/51600011."Yes.@k@v14/51600012. Right here."'
33129: 'Natsuhi@r@v03/50900115."Give it to me.@k@v03/50900116. ...Let me have some time alone with Father.@k@v03/50900117. If my husband asks where I am, tell him you don''t know."'
33130: 'Genji@r@v14/51600004."......Certainly."'
33131: '@rAfter grabbing the key to the study that Genji was holding out to her, Natsuhi rushed up the stairs.'
33132: '@rShe then flew into the study,@k ......and finally, ...she cried out loud.'
33133: 'Natsuhi@r@v03/50900118.".........Father......@k@|@y@v03/50900119. Please forgive our foolishness...!!@k @v03/50900120.My husband and I...@v03/50900121....aren''t capable of inheriting all that you created...!@k @v03/50900122.Please......please,@v03/50900123. ............forgive us for our foolishness and our crimes...@k@v03/50900124. And,@v03/50900125. ...if you can forgive us,@v03/50900126. .........please guide the way for us fools......"'
33134: '@rClinging to Kinzo as he slept in the bed, Natsuhi cried even harder.'
33135: '@rShe kept imagining Kinzo sitting up suddenly and patting her head.'
33136: '@rNo, Father isn''t the type of person to pamper...@k@rMore likely, he''d yell at me to stop being so noisy.'
33137: '@r......However, neither of these imaginations would come true.@k@r...Because it was an undeniable fact that Kinzo had entered an eternal sleep.@k@rBut even so, Natsuhi begged the sleeping Kinzo to forgive and help them...'
33138: '@rIt had only been a few hours since his passing.'
33139: '@rPerhaps his soul was still here, listening to her.'
33140: '@r......Believing this, Natsuhi begged for Kinzo''s forgiveness and help even more earnestly......'
33141: 'Kinzo@r@v01/51500001.@a1666."Noisy woman.@k@v01/51500002. Don''t I always say that I value silence?"'
33142: 'Natsuhi@r@v03/50900127.".........Huh—"'
33143: '@rThat voice made Natsuhi jump up in surprise.'
33144: '@rWhen she faced in the direction that the voice had come from, .........she saw Kinzo sitting at the study desk, folding up his reading glasses...'
33145: 'Kinzo@r@v01/51500003."Did you get in a fight with Krauss again?@k@v01/51500004. ......Neglecting his wife...that Krauss only inherited my bad traits."'
33146: 'Natsuhi@r@v03/50900128."F-.........Father......"'
33147: 'Kinzo@r@v01/51500005."......What a wretched-looking face.@k@v01/51500006. Wash it.@k@v01/51500007. Aren''t you the wife of the successor to the Ushiromiya family?@k@v01/51500008. You mustn''t let the servants see you wear such a shameful expression."'
33148: 'Natsuhi@r@v03/50900129."Y-......yes, Father...@k@v03/50900130. ...My apologies......"'
33149: '@r......Natsuhi understood.'
33150: '@rThis was just an illusion, ...one that Natsuhi had created from her desire to speak with Kinzo and her memories of the man as he once was.'
33151: '@rNo, that''s not it...'
33152: '@r......She believed that just for now, Kinzo''s soul had shown itself to her.'
33153: '@rShe was sure that doubting this would cause it to vanish in an instant...'
33154: 'Kinzo@r@v01/51500009."It seems that a family crisis has arisen the very instant the headship was passed on..."'
33155: 'Natsuhi@r@v03/50900131."Y-...yes, Father......@k@v03/50900132. I wasn''t able to support my husband...@k@v03/50900133. ......I am truly...very sorry......"'
33156: 'Kinzo@r@v01/51500010."Hmph.@k@v01/51500011. The Ushiromiya family is so very cursed.@k@v01/51500012. It was in a terrible state when I succeeded the headship too.@k@v01/51500013. The hardships you two are suffering are trivial in comparison."'
33157: '@rKinzo''s succession to the family headship came suddenly.'
33158: '@rAt the time, he was nothing more than a young man from one of the branch families, far separated from the Ushiromiya main family.'
33159: '@rThe main family might have had honor and tradition, but that was of no relevance at all to Kinzo, and he couldn''t have cared less.'
33160: '@rThen, the principal members of the main family were wiped out in the Great Kanto Earthquake, along with their businesses.'
33161: '@rOn top of that, there was a complicated antagonism between the members of the family at the time,@k and the elders were all trying to impose their will on the others in that sinking ship.'
33162: '@rBecause of this, they weren''t even able to elect a leader to rebuild the Ushiromiya family.'
33163: '@rThey found common ground by selecting Kinzo, a youth with absolutely no ties to any of the opposing elders, to be the head.'
33164: '@rSo the elders hadn''t really entrusted Kinzo with the rebuilding of the Ushiromiya family.'
33165: '@rKinzo had been nothing more than their puppet, with his arms and legs being pulled in opposite directions......'
33166: 'Natsuhi@r@v03/50900134.".........Yes.@k@v03/50900135. ...I know a lot about your days of suffering, Father."'
33167: 'Kinzo@r@v01/51500014."And then the war started.@k@v01/51500015. I was already tired of life at that point.@k@v01/51500016. I hoped to die on the battlefield, but I wasn''t sent to the front lines.@k@v01/51500017. ......However, the state of the war grew worse with every day, and the time for the decisive battle on the Japanese mainland seemed to grow ever closer.@k@v01/51500018. As bad as it might sound, I hoped that day would come quickly..."'
33168: '@rIt was said that as Kinzo listened to Death''s approaching footsteps day in and day out,@k ...he started cutting his ties with this world one by one.'
33169: '@rAnd then, on that day when he had freed himself from all his attachments to life, and reached a state of enlightenment......'
33170: '@r...he had a mystical experience.'
33171: '@r......And he met her.@k@rThe Golden Witch, BEATRICE......'
33172: 'Kinzo@r@v01/51500019."I made a contract with the witch and was given gold and the power of madness.@k@v01/51500020. ......On that day, the old me died, and a new me possessing the insane power of magic was born."'
33173: 'Natsuhi@r@v03/50900136."...I know.@k@v03/50900137. And after the war,@k@v03/50900138. you used your ingenious cunning to revive the Ushiromiya family."'
33174: '@rThe now-deceased elders who knew Kinzo at the time...@khad whispered to each other that Kinzo must have taken a knock to the head on the battlefield and returned with a different personality...'
33175: '@rThat was how much Kinzo stood out after the war.'
33176: '@rWhether the story about Kinzo meeting a witch was true or not,@k there could be no doubt that the extraordinary experience of war had prepared him for death...and let him reach a state of enlightenment.'
33177: '@rNatsuhi must surely have felt that if Kinzo had decided to describe that resulting mystical experience as a meeting with a witch, that wasn''t something she could flatly dispute...'
33178: 'Natsuhi@r@v03/50900139."......That''s right.@k@v03/50900140. ...You returned from the war,@k@v03/50900141. conquered the witch BEATRICE, and became the head of the Ushiromiya family in the truest sense..."'
33179: 'Kinzo@r@v01/51500021."Correct.@k@v01/51500022. Before I met BEATRICE, I was nothing more than a puppet and only the head in name.@k@v01/51500023. ......I only became the head after conquering the Golden Witch."'
33180: 'Natsuhi@r@v03/50900142."......Father......@k@v03/50900143. Will this...Golden Witch...aid my husband Krauss now that he''s the new head...?"'
33181: 'Kinzo@r@v01/51500024."Oh, she will.@k@v01/51500025. Assuming that he has truly succeeded the headship."'
33182: 'Natsuhi@r@v03/50900144."Wh-what do you mean by "truly succeeded"......?"'
33183: 'Kinzo@r@v01/51500026."I mean it depends on whether he bears the responsibility and pride of the Ushiromiya family head in the truest sense.@k@v01/51500027. ...Natsuhi, you should understand this.@k@v01/51500028. The headship is not inherited by blood.@k@v01/51500029. It is inherited through spirit and conviction.@k@v01/51500030. ......Even though Krauss is my eldest son, he cannot be called the true head if he does not possess these things!"'
33184: 'Kinzo@r@v01/51500031."And even someone other than Krauss would make a splendid new head so long as that spirit dwelled in their heart.@k@v01/51500032. The Golden Witch BEATRICE will lend her power to that true head.@k@|@y@v01/51500033. .........Isn''t that right, BEATRICE?!!"'
33185: '@rWhen Kinzo called the witch''s name, ......gold butterflies seethed out of every corner of the room.'
33186: '@rThis fantastical scene had an otherworldly beauty to it.'
33187: '@rIt was like standing in the midst of a blizzard of golden flower petals being blown about a rose garden of gold.'
33188: '@rAs Natsuhi stared at this scene in shock, the gold butterflies gathered and formed a human shape...'
33189: '@rThen, ......the witch of the portrait appeared...'
33190: 'BEATRICE@r@v27/50700020."Indeed.@k@v27/50700021. I am the Ushiromiya family alchemist, the Golden Witch BEATRICE.@k@|@y@v27/50700022. ......I am free to run rampant!@k @v27/50700023.I do not listen to anyone''s orders."'
33191: 'Kinzo@r@v01/51500034."And there''s only one person in the world who can control her.@k@v01/51500035. Me.@k@v01/51500036. ......That is why I am qualified to be the Ushiromiya family head."'
33192: 'BEATRICE@r@v27/50700024."Hmph.@k@v27/50700025. So that pride of yours is what qualifies you to be the head?"'
33193: 'Kinzo@r@v01/51500037."Pride implies self-confidence and bravery.@k@v01/51500038. And, it is the embodiment of the insatiable desire to gain the power to match.@k@v01/51500039. ...That is why I control you."'
33194: 'BEATRICE@r@v27/50700026.".........It is quite pleasant to watch men who speak of pride as they turn that desire into reality.@k@v27/50700027. The "quiet man of action" is nothing more than an excuse used by the extremely lucky.@k@v27/50700028. ...A true monarch also speaks of what he doesn''t have.@k@v27/50700029. And he makes sure to turn that arrogance, that pride, into reality.@k@v27/50700030. ......If one is to control me, they must possess that monarch''s pride."'
33195: 'Kinzo@r@v01/51500040."Do you understand, Natsuhi?@k@v01/51500041. A true monarch fears no hardship.@k@v01/51500042. They declare that they will overcome anything without fail.@k@v01/51500043. Even if they haven''t yet figured out how.@k@v01/51500044. This gives hope to the weak people.@k@v01/51500045. They gather, revere the monarch, and swear to assist him.@k@v01/51500046. That is where power is gained and his word is carried out.@k@v01/51500047. Engrave that into your heart."'
33196: 'Natsuhi@r@v03/50900145."Y-.........yes, Father......"'
33197: '@rNatsuhi understood.'
33198: '@rThrough this mystical experience, ...Kinzo was teaching her the attitude required to overcome hardship.@k ...Even after his own death.'
33199: '@rFeeling a warm sensation rise up in her chest, she let the valuable words Kinzo had given her echo through her mind over and over.'
33200: '@r......A true monarch,@w333. ...in other words,@w500. the true head of the Ushiromiya family...was not to fear hardship.'
33201: '@rThey had to believe that they could overcome any hardship...@k If they could not believe themselves capable, then there was no reason why they would be...'
33202: '@r.........Natsuhi suddenly felt very ashamed of the way she had come into this room,@k sobbing and asking Kinzo what to do...'
33203: 'Natsuhi@r@v03/50900146."I......was foolish..."'
33204: 'Kinzo@r@v01/51500048."..............."'
33205: 'Natsuhi@r@v03/50900147."...Of course there''s no time for crying when an Ushiromiya family crisis is upon us.@k@v03/50900148. And now that we have inherited the Ushiromiya family from you, Father, we must protect its honor no matter what."'
33206: 'BEATRICE@r@v27/50700031."Hoh.@k@v27/50700032. ......Even though you can''t even draw a blueprint on how to repay Krauss''s debts?"'
33207: '@rAs BEATRICE laughed unpleasantly,@k ......no, that wasn''t it.@k@rShe was testing Natsuhi, to see whether she possessed the mental readiness to be a true monarch.'
33208: '@rNatsuhi didn''t hesitate anymore.@k@rShe answered clearly, gazing into BEATRICE''s eyes.'
33209: 'Natsuhi@r@v03/50900149."Yes.@k@v03/50900150. At this moment, I have not yet discovered the method that we should pursue.@k@v03/50900151. However, my husband is the new head of the Ushiromiya family, and I am his supporting wife.@k@v03/50900152. So in my husband''s place, I will proclaim it."'
33210: 'BEATRICE@r@v27/50700033."Let us hear it."'
33211: 'Natsuhi@r@v03/50900153."Ushiromiya Krauss and Natsuhi will definitely overcome these trials and protect the honor of the Ushiromiya family.@k@v03/50900154. You have nothing to worry about, Father."'
33212: 'Kinzo@r@v01/51500049."......You do know the scope of Krauss''s debt, as well as the disastrous state things are in?"'
33213: 'Natsuhi@r@v03/50900155."Yes.@k@v03/50900156. Things could hardly be worse—we could even be ordered to leave this mansion tomorrow, and we wouldn''t be able to refuse.@k@v03/50900157. Once the distribution of the inheritance comes up, his relatives might even file a criminal complaint against us."'
33214: 'Natsuhi@r@v03/50900158."However, there is no need to worry.@k@v03/50900159. We will repay all of the debts before then and restore our honor."'
33215: '@rAs she stood at attention with a resolute attitude,@k Natsuhi proclaimed this clearly with Ushiromiya Kinzo and BEATRICE as witnesses.'
33216: '@rFor a while,@k they remained silent, as though weighing Natsuhi''s resolve.'
33217: '@rThen Kinzo chuckled and turned away...'
33218: 'Kinzo@r@v01/51500050."......How vexing.@k@v01/51500051. ...Why couldn''t this person have been my son..."'
33219: 'BEATRICE@r@v27/50700034."The very fact that a woman with such a disposition married your son is another sign of your great luck."'
33220: 'Kinzo@r@v01/51500052."............@k@v01/51500053. BEATRICE.@k@v01/51500054. This is my final order."'
33221: 'BEATRICE@r@v27/50700035."Now that you are no longer the head, I am not obligated to obey your orders."'
33222: 'Kinzo@r@v01/51500055."Hoh.@k@v01/51500056. In that case, obey the orders of the new Ushiromiya family head."'
33223: 'BEATRICE@r@v27/50700036."You are no longer the head, and Krauss is not yet the head.@k@v27/50700037. Whom are you suggesting that I serve?"'
33224: 'Kinzo@r@v01/51500057."I will leave that to you.@k@v01/51500058. It is up to you to decide who is qualified to succeed the Ushiromiya family head, and who is fitting to bear the mark of the One-winged Eagle.@k@v01/51500059. ......You will be witness."'
33225: 'BEATRICE@r@v27/50700038."I refuse.@k@v27/50700039. I won''t listen to the orders of a man who isn''t the head."'
33226: 'Kinzo@r@v01/51500060."No, this is different.@k@v01/51500061. This is a will.@k@v01/51500062. The last order that the head left behind for you."'
33227: 'BEATRICE@r@v27/50700040."......*cackle*.@k@v27/50700041. Then it seems I will have to obey.@k@v27/50700042. What a good friend I am."'
33228: 'Kinzo@r@v01/51500063."I think not."'
33229: 'BEATRICE@r@v27/50700043."Hoh?"'
33230: 'Kinzo@r@v01/51500064."You''re only doing this because it caught your interest."'
33231: 'BEATRICE@r@v27/50700044."I can''t hide anything from you, can I?"'
33232: 'Kinzo@r@v01/51500065."Natsuhi."'
33233: 'Natsuhi@r@v03/50900160."Yes, Father..."'
33234: 'Kinzo@r@v01/51500066."Go and overcome your hardship."'
33235: 'Natsuhi@r@v03/50900161."...Y-.........yes."'
33236: '@rTo Natsuhi, that might have been nothing more than a simple response,@k but to Kinzo and BEATRICE, it seemed to carry much greater significance.'
33237: '@rBEATRICE nodded deeply,@k and with a motion as elegant as her dress, she bowed deeply before Natsuhi...'
33238: 'BEATRICE@r@v27/50700045."The Ushiromiya family alchemist, the Golden Witch BEATRICE, right here.@k@v27/50700046. I will give you my aid so that the Ushiromiya family can overcome crisis once again..."'
33239: 'Natsuhi@r@v03/50900162."......Thank you.@k@v03/50900163. I will need your power.@k@v03/50900164. We will most certainly overcome these trials."'
33240: 'BEATRICE@r@v27/50700047."I will not hold back on my support for your cause, but there is something I must warn you about beforehand.@k@v27/50700048. I understand that your troubles now could be solved if I were to bestow a vast quantity of gold again, like I did when I saved Kinzo from his crisis.@k@v27/50700049. However, that is something I cannot do."'
33241: 'Natsuhi@r@v03/50900165.".........I see."'
33242: 'Kinzo@r@v01/51500067."Sorry, Natsuhi.@k@v01/51500068. The contract for BEATRICE''s gold stated that it cannot be inherited.@k@v01/51500069. It was agreed that it could only be passed on to another if that person solves the witch''s epitaph."'
33243: 'BEATRICE@r@v27/50700050."The gold is sealed away by the epitaph.@k@v27/50700051. As long as that is not solved, I cannot give you the magic of gold."'
33244: 'Natsuhi@r@v03/50900166.".........I understand.@k@v03/50900167. Then I shall search for another method by which we can save ourselves from this crisis.@k@|@y@v03/50900168. ......My husband said that his plan would take time, but he also said that it would definitely be sufficient to repay our debts.@k@v03/50900169. If we can buy enough time for that to happen, we will be able to overcome this trial."'
33245: 'Kinzo@r@v01/51500070."Good, Natsuhi.@k@v01/51500071. Continue."'
33246: 'BEATRICE@r@v27/50700052."But Kinzo is already dead.@k@v27/50700053. The doctor and servants are preparing his funeral,@k@v27/50700054. and you will be contacting the family members about it.@k@v27/50700055. The window of opportunity for you to raise money will be closed by your own hand.@k@v27/50700056. *cackle*cackle*, how charming is a guillotine where you lower the blade yourself..."'
33247: 'Natsuhi@r@v03/50900170."..................Ah—"'
33248: '@rNatsuhi gasped and looked up at the ceiling.'
33249: '@rThere wasn''t actually anything there.@k@r......But even so, Natsuhi had found something.'
33250: 'Kinzo@r@v01/51500072."So, ......the magical power has descended."'
33251: 'BEATRICE@r@v27/50700057."Natsuhi.@k@v27/50700058. ......Have you made up your mind?@k @v27/50700059.What magic of miracles do you desire from me?"'
33252: '@r......All of those who had witnessed Kinzo''s corpse were once again gathered in the study.'
33253: '@rKrauss was still very unsettled and clutching at his head.'
33254: '@rGenji was as expressionless as ever.'
33255: '@rNanjo and Kumasawa wore bewildered expressions on their faces.'
33256: '@rBut in stark contrast to all of them, Natsuhi''s expression was resolute.'
33257: 'Natsuhi@r@v03/50900171."Dear, let me ask you one more time.@k@v03/50900172. Your plan for raising money is absolutely certain?"'
33258: 'Krauss@r@v02/50800131."......Y-......yes.@k@v02/50800132. Give it a year, ...no, just half a year, and it will certainly bear fruit!@k @v02/50800133.But it''s just impossible to hope for anything right this second......"'
33259: 'Natsuhi@r@v03/50900173."Then we will wait."'
33260: 'Krauss@r@v02/50800134."B-but you said it yourself.@k@v02/50800135. ......Dad is already dead......"'
33261: 'Natsuhi@r@v03/50900174."Father hasn''t passed away.@k@v03/50900175. As you can see, he is as healthy as ever."'
33262: '@rWhen Natsuhi said this, everyone looked up instantly, startled.@k@r...Because they immediately understood what those words meant...'
33263: '@rHowever, Krauss alone didn''t get it right away and had to ask.'
33264: 'Krauss@r@v02/50800136."What......@v02/50800137.do you mean by that......?@k@v02/50800138. Dad is right there,@v02/50800139. and he''s......"'
33265: 'Natsuhi@r@v03/50900176."I will say it again.@k@v03/50900177. Father is still in good health.@k@v03/50900178. He is busy with his research, so he''ll be even less able to leave his study than usual.@k@v03/50900179. Because of this, we must handle all external affairs ourselves,@k@v03/50900180. so that Father can devote himself to his research without being burdened by meaningless tasks."'
33266: 'Natsuhi@r@v03/50900181."In short, nothing will change from the way things have been up until now.@k@v03/50900182. .........Do you understand, Genji?"'
33267: 'Genji@r@v14/51600014."...............Yes.@k@v14/51600015. ...The furniture of the One-winged Eagle will continue to serve the Master."'
33268: 'Natsuhi@r@v03/50900183."Kumasawa.@k@v03/50900184. And you, Doctor Nanjo.@k@v03/50900185. Do you understand what I''m saying?"'
33269: 'Kumasawa@r@v18/51800004."......Oh, ...uh, ......ummm..."'
33270: 'Nanjo@r@v19/51900017."I-......is this really what you want to do, Natsuhi-san......?"'
33271: 'Natsuhi@r@v03/50900186."It may be true that Father passed away today.@k@|@y@v03/50900187. But if everyone here right now believes, we can use magic to revive Father."'
33272: 'Kumasawa@r@v18/51800005."I-it''s impossible, Madam...@k@v18/51800006. That''s just too much...!"'
33273: 'Nanjo@r@v19/51900018."The time of death will be determined during the autopsy.@k@v19/51900019. We can''t stop it from looking suspicious...!"'
33274: 'Natsuhi@r@v03/50900188."Father will not pass away, so there will be no reason for there to be an autopsy."'
33275: '@rOf course, she wasn''t planning to make Kinzo live forever.'
33276: '@rThe fake life given to Kinzo would only last until Krauss could repay his debts.'
33277: '@rAfter that, Kinzo''s soul would finally be able to sleep in peace.'
33278: '@rNanjo repeated himself that the time of death would be discovered during the autopsy, but Natsuhi said again that this wouldn''t be a problem.'
33279: 'Natsuhi@r@v03/50900189."Father will not pass away by being reported dead."'
33280: 'Krauss@r@v02/50800140."A-.........ah, I see.@k@v02/50800141. ......He''ll be reported missing...!!"'
33281: '@rAfter clapping his hands together, Krauss stood up, shaking his fists.'
33282: 'Natsuhi@r@v03/50900190."Yes.@k@v03/50900191. Once we''ve managed to pay back the debt and finish the preparations to lay Father to rest, we will then announce that Father has disappeared."'
33283: '@rRokkenjima''s vast, uncultivated forest was the perfect place to stage a disappearance.'
33284: '@rOne day, Kinzo would go out to the forest for a walk and never return.@k ......They would search for him without success and then be forced to report his disappearance...'
33285: 'Krauss@r@v02/50800142."If he disappears, we can file a report of his death even without a corpse.@k@v02/50800143. In other words, we can conceal the time of death!@k @|@y@v02/50800144.What do you think, Doctor Nanjo?!@k @v02/50800145.There won''t be any problems this way!"'
33286: 'Nanjo@r@v19/51900020."Y-......yes, I can see the logic, but......"'
33287: 'Kumasawa@r@v18/51800007."...Are you sure about this, Madam...?@k@v18/51800008. Y-yes, if all of us can keep quiet, then perhaps we could keep it a secret that the Master has passed away...!@k @v18/51800009.But there are so many ways that one of us could slip up and allow someone to find out...!!"'
33288: 'Natsuhi@r@v03/50900192."Kumasawa.@k@v03/50900193. Keep your voice down.@k@|@y@v03/50900194. ......Have you forgotten that Father is sleeping right over there?@k @v03/50900195.Are you trying to wake him?"'
33289: '@rIt isn''t a corpse.@k ...Kinzo...is sleeping.'
33290: '@rAs Natsuhi said that,@k ......Kinzo lay quietly on the bed, as though there was nothing at all odd about her words.'
33291: 'BEATRICE@r@v27/50700060."Come, try to remember.@k@v27/50700061. What form did you have?@k@v27/50700062. What sort of life did you enjoy?!"'
33292: '@rOnce again, a storm of gold butterflies started to swirl, covering Kinzo''s cold body...'
33293: '@rThen, after the butterflies exploded into fine gold powder and disappeared,@k .........just like those fairy tales that have been told over and over since long ago, ......Kinzo slowly opened his eyes and sat up...'
33294: 'Natsuhi@r@v03/50900196.".........F-......Father......!!"'
33295: 'Kinzo@r@v01/51500073."......Natsuhi.@k@v01/51500074. Let me first make one thing clear.@k @v01/51500075.I did not coax you into doing this because I have an attachment to life."'
33296: 'BEATRICE@r@v27/50700063."You liar.@k@v27/50700064. Don''t tell me you didn''t anticipate this at least a little.@k@v27/50700065. How does it feel, Kinzo?@k@v27/50700066. How is your body?"'
33297: 'Kinzo@r@v01/51500076."It isn''t bad, but it feels somewhat like being in a dream.@k@v01/51500077. I feel light."'
33298: 'BEATRICE@r@v27/50700067."A being not permitted to remain in this world still remains here.@k@v27/50700068. You''ll have to accept a little discomfort."'
33299: 'Natsuhi@r@v03/50900197."...Is your body truly alright?!@k @v03/50900198.Are you really...alright...?!"'
33300: 'Kinzo@r@v01/51500078."Mm.@k@v01/51500079. Actually, this feels quite pleasant.@k@v01/51500080. ......If this is what the world after death feels like, playing the part of a ghost might not be so bad."'
33301: 'BEATRICE@r@v27/50700069."How is this, Natsuhi?@k@v27/50700070. Kinzo has revived.@k@v27/50700071. That means a funeral is unnecessary.@k@v27/50700072. Your hardship has been resolved!"'
33302: 'Natsuhi@r@v03/50900199."......B-BEATRICE..."'
33303: '@rAs Natsuhi tried to find words of gratitude,@k BEATRICE waggled her index finger and spoke.'
33304: 'BEATRICE@r@v27/50700073."There is no need for thanks.@k@v27/50700074. A ruler should be proud.@k@v27/50700075. I do not pay heed to requests, but I do follow orders."'
33305: 'Natsuhi@r@v03/50900200."I''ll say it even so.@k@v03/50900201. ......Thank you.@k@v03/50900202. This way, ......you''ve bought some time for my husband...@k@v03/50900203. ......We will handle the rest."'
33306: 'BEATRICE@r@v27/50700076."Be warned, Natsuhi.@k@v27/50700077. Kinzo may have revived, but that is not an eternal thing.@k@v27/50700078. It will only continue as long as my magic does."'
33307: 'BEATRICE@r@v27/50700079."......Be warned that the anti-magic toxin might destroy the magic.@k@v27/50700080. You must understand the laws of magic correctly and work hard to maintain it.@k@v27/50700081. I can show you a miracle, but it is your role to grasp it and hold it together."'
33308: 'Natsuhi@r@v03/50900204."Of course.@k@v03/50900205. We won''t neglect the miracle you have given us."'
33309: 'BEATRICE@r@v27/50700082."Very good.@k@v27/50700083. ...I see... It seems masters do need to be changed every once in a while, just like floor mats.@k@|@y@v27/50700084. *cackle*cackle*!@k @v27/50700085.I like it.@k@v27/50700086. I shall serve you."'
33310: 'BEATRICE@r@v27/50700087."Ushiromiya Natsuhi!@k @v27/50700088.I am the Ushiromiya family alchemist, the Golden Witch BEATRICE...!!@k @v27/50700089.Call my name whenever you wish. I shall then appear and grant you a miracle."'
33311: 'Natsuhi@r@v03/50900206."Thank you.@k@v03/50900207. I am Ushiromiya Natsuhi.@k@v03/50900208. I will employ you to protect the honor of the Ushiromiya family...!!"'