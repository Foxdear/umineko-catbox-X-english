38209: 'Kyrie@r@v09/51300148."Erika-chan, are you listening?@k @v09/51300149.We''ve decided to stick together from now on.@k@v09/51300150. First, we''re carrying Hideyoshi-san''s body to the parlor.@k@v09/51300151. Can you hold off playing detective until we get there?"'
