38269: 'Erika@r@v46/54500820."Oh, an interesting response.@k@v46/54500821. Then let''s take this one step at a time.@k@v46/54500822. ......Please worry about your lock later.@k@v46/54500823. I have something vitally important to discuss with everyone."'
