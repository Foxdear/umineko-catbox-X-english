38321: '@rHe had left the arbor a short while ago for that reason.'
38322: '@rNow, the only ones in sight were VIRGILIA, who continued to knit silently,@k ......and Beato, ...who just sat there blankly amidst the smell of her black tea,@k not even putting the cup to her lips......'
38323: '@rVIRGILIA stopped knitting for a moment...@k...and looked out across the vast golden rose garden that extended as far as the eye could see.'
38324: 'VIRGILIA@r@v30/53200198."......At least in terms of mere culprit-guessing games,@k@v30/53200199. ......I think we can say that Battler-kun has gained the strength to never again surrender."'
38325: 'BEATRICE@r"......................................."'
38326: 'VIRGILIA@r@v30/53200200."You gave him every message he needs by the end of the fourth game.@k@v30/53200201. .........That is to say, ......Battler-kun possesses all the tools to reach the truth at any moment.@k@v30/53200202. .........However, he has a weak side.@k@v30/53200203. ......Because of that,@k@v30/53200204. even if the game goes on to repeat a hundred times,@k@v30/53200205. he will never solve it.@k@v30/53200206. He''ll just wander forever like someone trying to find the blue bird."'
38327: '@rAnd that, ............BEATRICE,@k@rgoes for you as well.'
38328: '@rEven if you play this game hundreds more times,@k@ryou will never arrive at the answer you seek.'
38329: '@rBERNKASTEL will abuse this game without a doubt.'
