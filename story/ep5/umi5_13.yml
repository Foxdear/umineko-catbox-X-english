38316: 'BEATRICE@r@v27/50700736."I welcome a troublesome fight!@k @v27/50700737.I won''t let them do as they please with my golden island any more...!!@k @|@y@v27/50700738.I shall meet your challenge, Lady BERNKASTEL!@k @v27/50700739.Furudo Erika!"'
38317: '@r......In the Golden Land, the endless rain continued to fall.'
