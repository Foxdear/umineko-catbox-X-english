38251: 'Natsuhi@r@v03/50900909."I, ...I couldn''t sleep, so I was going to return to the parlor,@k@v03/50900910. ......b-but I wasn''t sure whether I had locked my room or not, so I was about to head back.@k@|@y@v03/50900911. ......I''m a worrier, so this sort of thing happens a lot.@k@v03/50900912. Don''t worry about it..."'
38252: 'Erika@r@v46/54500809."Ah, of course, that is quite common, isn''t it?@k@v46/54500810. It''s a common quirk among people who aren''t confident in their ability to remember things."'
