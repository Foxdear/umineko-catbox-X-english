38334: '@rTo bring an end to Battler''s weak side.@k To bring an end to your hesitation.'
38335: 'VIRGILIA@r@v30/53200207."And that is why...@k@v30/53200208.you called the two of them here.@k@v30/53200209. To end the eternal torture between the two of you."'
38336: 'BEATRICE@r"......................................."'
38337: 'VIRGILIA@r@v30/53200210."Those two will bring you either victory or defeat.@k@v30/53200211. But either result will now be one filled with compassion.@k@v30/53200212. .........You should understand that as well by now."'
38338: '@rVIRGILIA faced Beato, whom she had come to adore like a daughter,@k ......with cold eyes that she must not have shown often.'
38339: '@rIt was like the gaze of a mother who, instead of scolding, silently urges their child to recognize their mistake.'
38340: 'VIRGILIA@r@v30/53200213."BEATRICE.@k@v30/53200214. .........How long do you intend to stay there...@v30/53200215....neither alive...@v30/53200216.nor dead,@k@v30/53200217. .........not ascending to heaven...@v30/53200218.nor descending to hell,@k@v30/53200219. there in a daze on the peak of Mount Purgatory......?"'
38341: 'BEATRICE@r@v27/50700742."......................................."'
38342: 'VIRGILIA@r@v30/53200220."I am VIRGILIA.@k@v30/53200221. I have guided him through Purgatory and brought him to you at its peak.@k@v30/53200222. ......And you are BEATRICE.@k@v30/53200223. You must choose whether to take his hand and rise up to heaven, or embrace him and fall into hell."'
38343: '@rDid you know that the tribulations of Purgatory, which lies in the gap between heaven and hell,@k are sometimes more torturous than even hell itself...?'
38344: '@rOn the gates of hell, it is written that you must abandon all hope.'
38345: '@r......A human without hope can accept their suffering and give up.'
38346: '@rHowever, the denizens of Purgatory have hope.@k@rA hope of possibly reaching heaven, a hope that cannot be abandoned.'
38347: '@rAnd that tortures them.'
38348: '@rEven in the depths of hell, ...no greater torture device exists than the single pin known as hope......'
38349: 'VIRGILIA@r@v30/53200224."Leap.@k@v30/53200225. Leap from the cliff of Purgatory.@k@v30/53200226. ......Cast open Pandora''s box, and cast aside your fleeting, fragile, foolish hope and all the longing it brings.@k@v30/53200227. You''re afraid, aren''t you?@k @v30/53200228.Of opening the box."'
38350: '@rBeato was silent,@k .........but with a single tear, she nodded slightly.'
38351: 'VIRGILIA@r@v30/53200229."Is the cat in the box alive or dead?@k@v30/53200230. The time has now come...to check.@k@v30/53200231. ......If the cat is dead, hold a funeral for it quickly and have it rise to heaven.@k@v30/53200232. If the cat is alive, feed it quickly and give it all of your affection."'
38352: 'VIRGILIA@r@v30/53200233."Whether it is alive or dead,@k@v30/53200234. your cat box eternally desecrates the cat.@k@v30/53200235. .........Those two have brought you the key to the box that you were too afraid to open."'
38353: '@rBEATRICE.@k@rThe time has come for you to die.'
38354: '@rI hope...@kthat your heart will be stopped...@k...by the hand of the person you desire.'