37775: 'Erika@r@v46/54500774."Battler-san returned to the guesthouse at 3 a.m.@k@v46/54500775. Then, the rest of you split up about thirty minutes later, is that correct?"'
37776: 'Eva@r@v05/51000292."Yes, that''s right.@k@v05/51000293. We were getting pretty tired by that point.@k@v05/51000294. We decided to take a short rest before starting up again."'
37777: '@rTo smoke out the murderer of the first twilight,@k Erika closely questioned everyone involved to check their alibis and evidence.'
37778: '@rTo confirm these, she went around the mansion with them,@k and when needed, took several trips out to the guesthouse through all the rain.'
37779: '@r......Her vitality was admirable.'
37780: '@r......Though she was an uninvited guest,@k everyone had long since stopped feeling anything strange about the way she imitated a detective...'
37781: 'Ronove@r@v31/53100139."......It seems Erika is also steadily building her foundation."'
37782: 'BEATRICE@r@v27/50700686."It''s useless.@k@v27/50700687. Whether alibis exist or not, she can''t deny our existence.@k@v27/50700688. ......Kinzo escaped through the window and is now one with the mists of Rokkenjima.@k@v27/50700689. She can never capture or deny him."'
37783: 'Gaap@r@v32/53700135."When all''s said and done, perhaps you could say he''s escaped to the underside of the chessboard."'
37784: 'Ronove@r@v31/53100140."In that case, maybe it would be appropriate to say he''s been stored away."'
37785: 'BEATRICE@r@v27/50700690."......Come to think of it, about those corpses from the first twilight.@k@v27/50700691. They''ve been stored away too, right?"'
37786: 'Gaap@r@v32/53700136."Yes.@k@v32/53700137. They''ve been put away in my darkness between the human world and the other."'
37787: 'BEATRICE@r@v27/50700692."......And that would-be detective won''t be able to find them...?"'
37788: 'Gaap@r@v32/53700138."Of course.@k@v32/53700139. It''s absolutely impossible for a Human.@k@|@y@v32/53700140. .........Want to check?"'
37789: 'BEATRICE@r@v27/50700693."Just in case.@k@v27/50700694. And we also need to take this opportunity to reexamine what Lady BERNKASTEL''s goals are likely to be from now on."'
37790: 'Ronove@r@v31/53100141."As they say, if you know your enemy, you need not fear the outcome of a hundred battles."'
37791: 'BEATRICE@r@v27/50700695."If you know the truth, you can win a hundred battles without fighting."'
37792: 'Ronove@r@v31/53100142."Pukkukukukuku.@k@v31/53100143. Quite so."'
37793: '@rGaap opened up a large pitch-black hole in the sky and had it swallow all of them up.'
37794: '@rShe invited Beato and Ronove to the gap between worlds where she had hidden the corpses......'
37795: '@r......That place was nowhere in this world,@k and existed at no time of this world.'
37796: '@rIn other words, it truly and literally was a place not of this world.'
37797: '@rIn this place, questions such as "Where is this?" and "What time is it?" had no meaning.'
37798: '@rEvery single place led to here, but no place could be reached from here.'
37799: '@rFurthermore, all times connected to this place, but no time could be passed to from here.'
37800: '@rIn short, ......this place was just what they said it was: the underside of the chessboard.'
37801: '@rNo, perhaps it would be most appropriate to call this the captured pile, where pieces that have left the game go......'
37802: '@r......Then, deep within this pitch-black world,@k five corpses came into view, illuminated by a glow like a faint spotlight......'
37803: '@rThe five pitiful corpses with their necks sliced open had been arranged neatly.'
37804: '@rTheir eyelids were shut and their hands joined.@k@rApparently, even Gaap had respect for the dead...'
37805: 'VIRGILIA@r@v30/53200177."Oh my.@k@v30/53200178. .........There are five sacrifices for the first twilight in this game?@k @v30/53200179.Not six?"'
37806: 'BEATRICE@r@v27/50700696."Oh, it''s you, Master.@k@v27/50700697. I was worried about where you''d gone.@k@v27/50700698. The game has already reached the first twilight, and as you can see, the first victims have emerged.@k@v27/50700699. ......Now it''s time for the real show. I''m getting all excited...!"'
37807: 'VIRGILIA@r@v30/53200180."I see.@k@v30/53200181. .........The version of you that''s here looks to be in high spirits.@k@v30/53200182. I''m pleased."'
37808: 'BEATRICE@r@v27/50700700."Hm??@k @|@y@v27/50700701.If you took away my high spirits, my bewitching <body>,@k @v27/50700702.and my pleasant disposition, I''d have nothing left!@k @v27/50700703.Wahaha."'
37809: '@rFor some reason, VIRGILIA praised Beato for her high spirits.'
37810: '@rThough Beato was taken aback at such granny-like words coming out of VIRGILIA''s mouth all of a sudden,@k she answered while bumping a fist against her chest.'
37811: '@rVIRGILIA had been absent often during this game.'
37812: '@rShe might even have been away from her seat when Battler solved the epitaph and during the uproar that followed.'
37813: '@rApparently, she had been absent for so many critical points...@kthat she didn''t have a very good grasp of what had happened so far in this game...'
37814: 'Gaap@r@v32/53700141."For now, we''ve got five corpses.@k@v32/53700142. ......All slit through the neck, as you can see."'
37815: '@rGeorge, Jessica, Maria, Rosa, Genji.'
37816: '@rSomething sharp had sliced open all five of their necks......'
37817: '@rThose gaping wounds opened wider than their mouths,@k ......and made it feel as though they would no longer need their mouths to breathe.'
37818: 'VIRGILIA@r@v30/53200183."......I see.@k@v30/53200184. So, @|@y@c900.@[anyone looking at George, Jessica, Maria, Rosa, or Genji''s corpses could confirm at a glance that they are dead.@]@c."'
37819: 'BEATRICE@r@v27/50700704."Hmm?@k @v27/50700705.Red?@k @v27/50700706.Well, there''s no point in me holding out against you.@k@|@y@v27/50700707. That''s right,@v27/50700708. @|@y@c900.@[at a glance, anyone could confirm that these corpses are dead, so it is absolutely impossible that they are just people playing dead.@]@c."'
37820: 'Gaap@r@v32/53700143."Why did Lia use the red......?"'
37821: 'Ronove@r@v31/53100144."Who knows.@k@v31/53100145. ......However, she is always thinking of Milady.@k@v31/53100146. She must have something in mind that will benefit Milady."'
37822: 'Gaap@r@v32/53700144."......Hmmm."'
37823: '@rBut they had hidden the corpses here so that no one could use the red...'
37824: '@rDespite that, however, Ronove was right—VIRGILIA always thought of BEATRICE first.'
37825: '@rThe way that these corpses, which Gaap had gone to all the trouble of erasing, had now been confirmed with the red made a slightly displeased expression rise to Gaap''s face.'
37826: '@rHowever, in the end she remembered that she was only a guest and shrugged.'
37827: 'VIRGILIA@r@v30/53200185."Why did you have Gaap hide the corpses?"'
37828: 'BEATRICE@r@v27/50700709."Well,@k@v27/50700710. since the epitaph has already been solved, this game of mine is different from usual.@k@v27/50700711. I now have serving and protecting Natsuhi as my goal."'
37829: 'VIRGILIA@r@v30/53200186."...........................@k@v30/53200187. How would concealing their corpses protect Natsuhi?"'
37830: 'Gaap@r@v32/53700145."......We''ve more or less figured out what our opponents'' moves will be.@k@v32/53700146. This is probably a trap made to corner Natsuhi.@k@v32/53700147. Most likely, they''ll sort through alibis for the first twilight and find them for everyone except Natsuhi."'
37831: 'Ronove@r@v31/53100147."Last night, Natsuhi-sama was the first to leave the family conference, and then rested alone in her room.@k@v31/53100148. ......Unfortunately, she has no alibi whatsoever until the next morning."'
37832: 'BEATRICE@r@v27/50700712."We have already ensured that Kinzo''s existence is impossible to disprove.@k@v27/50700713. ......However, the enemy has one remaining method of breaking through that roadblock."'
37833: 'VIRGILIA@r@v30/53200188."I see.@k@v30/53200189. .........They can corner Natsuhi and make her confess that Kinzo doesn''t exist."'
37834: 'BEATRICE@r@v27/50700714."Mm.@k@v27/50700715. The enemy is probably after something like that.@k@v27/50700716. By watching the movements of the pieces involved with the family conference, we quickly realized that Natsuhi was isolated,@k@v27/50700717. noticed that trap of theirs, and countered with this move."'
37835: 'Gaap@r@v32/53700148."The corpses disappear!@k @v32/53700149.Everyone has alibis, and no one exists who could have moved them.@k@v32/53700150. Not only does this support the claim that a witch exists, it also throws doubt on whether they were actually dead in the first place,@k@v32/53700151. making it just about possible for Natsuhi to avoid being a suspect."'
37836: 'Ronove@r@v31/53100149."In other words, it''s possible for Natsuhi-sama to claim...@k@v31/53100150.that the sacrifices of the first twilight were only playing dead."'
37837: 'VIRGILIA@r@v30/53200190."Even though many people confirmed their deaths for certain in the cousins'' room...?"'
37838: 'BEATRICE@r@v27/50700718.""Confirmation" is nowhere near red truth...!@k @v27/50700719.No matter how strongly they claim to have seen unmistakeable corpses, the red truth doesn''t exist in the human world!@k @|@y@v27/50700720.Because the corpses don''t exist, Natsuhi can discount their words as a mistake,@k@v27/50700721. a trick, or by saying that all of them were lying,@k@v27/50700722. and it''s possible for her to do this over and over to buy time for herself."'
37839: 'Ronove@r@v31/53100151."In the human world, which lacks the red truth, perpetual check is an effective move."'
37840: 'Gaap@r@v32/53700152."An endless argument with both sides denying the other''s claims.@k@v32/53700153. ......Not pretty."'
37841: 'Ronove@r@v31/53100043."True.@k@v31/53100153. However, beauty is secondary to victory.@k@v31/53100154. If someone who cannot achieve victory seeks it, it is nothing but a poison to them."'
37842: 'BEATRICE@r@v27/50700723."They do say that might makes right.@k@v27/50700724. Wahahahahaha."'
37843: 'Gaap@r@v32/53700154."And even if I don''t think it''s beautiful,@k@v32/53700155. those Voyager witches will probably like it and say it isn''t boring..."'
37844: 'VIRGILIA@r@v30/53200191."............I see.@k@v30/53200192. I''ve managed to grasp the flow of this game.@k@v30/53200193. ...It seems that it will get quite nasty."'
37845: 'Gaap@r@v32/53700156."We''re fully aware of that.@k@v32/53700157. ......And we already know that Natsuhi is probably about to be lured into yet another trap."'
37846: 'VIRGILIA@r@v30/53200194."A trap?"'
37847: 'BEATRICE@r@v27/50700725."Mm.@k@v27/50700726. Someone Lady LAMBDADELTA created, who calls himself a man from 19 years ago, has already threatened Natsuhi.@k@v27/50700727. She was ordered to go into a closet in a certain guest room at 1 p.m., which is only a few minutes away, and hide there.@k@v27/50700728. ......Krauss was taken as a hostage, so Natsuhi can''t resist."'
37848: 'VIRGILIA@r@v30/53200195.".........I see.@k@v30/53200196. How relentless.@k@v30/53200197. ...Can you protect her?"'
37849: 'BEATRICE@r@v27/50700729."Of course.@k@v27/50700730. After all, Natsuhi isn''t the culprit.@k@v27/50700731. No matter how much they treat her as one, both truth and illusions are on our side.@k@|@y@v27/50700732. There''s no way we can lose.@k@v27/50700733. *cackle*cackle*cackle*cackle*!!"'
37850: '@rNatsuhi threw her cup of black tea to the ground in protest to show the anger that flowed throughout her entire body.'
37851: 'Natsuhi@r@v03/50900859."......Wh-what do you mean by that...?!!@k @v03/50900860.A-are you......saying that you suspect me?!!"'
37852: 'Erika@r@v46/54500776."I hear what you''re saying: you left before anyone else, returned to your room, and didn''t leave that room until morning.@k@v46/54500777. I am simply explaining that I need you to prove that, otherwise it won''t count as an alibi."'
37853: 'Natsuhi@r@v03/50900861."Prove it...?!@k @v03/50900862.How...?!!"'
37854: 'Erika@r@v46/54500778."Any way you like.@k@v46/54500779. All you have to do is prove objectively that it was impossible for you to commit the crime.@k@v46/54500780. .........Everyone else is cooperating.@k@v46/54500781. I would very much appreciate it if you could also be a little less harsh with me and please give me your alibi and evidence."'
37855: 'Eva@r@v05/51000295."......That''s right.@k@v05/51000296. The whole night is a blank space in time for Natsuhi nee-san.@k@v05/51000297. ......After she left the conference saying she was going to bed, she might have gone to the guesthouse and attacked George and the others..."'
37856: 'Natsuhi@r@v03/50900863."Don''t be so ridiculous!!@k @v03/50900864.Why would I kill George-kun, and most of all, whyever would I kill my own daughter?!!"'
37857: 'Kyrie@r@v09/51300132."Calm down.@k@v09/51300133. ......We''re all equally suspicious.@k@v09/51300134. It''s sad, but we all have to prove our innocence."'
37858: 'Rudolf@r@v08/51200217."Yeah.@k@v08/51200218. We''ve all been thinking frantically about how to prove our alibis for last night so we can clear up the suspicion against us."'
37859: 'Hideyoshi@r@v06/51100173."I know you can''t like being suspected, Natsuhi-san.@k@v06/51100174. If it frustrates you, shouldn''t your first priority be searchin'' for some way to prove your own innocence...?"'
37860: '@rThe relatives spoke as though they were all under equal suspicion,@k but the mood about the place didn''t feel so peaceful.'
37861: '@rErika was still in the middle of confirming everything,@k but other than Natsuhi, who was unwilling to prove her alibi,@k everyone else had an alibi which was reasonably credible.'
37862: '@rOnly Natsuhi, who claimed that just being suspected was an insult, was uncooperative with Erika,@k and her position began to grow more and more perilous......'
37863: '@rThis parlor was no longer a place of comfort for Natsuhi.@k@rAnd the sound of the cup smashing had made that decisive.'
37864: 'Natsuhi@r@v03/50900865."Th-......this is ridiculous!@k @v03/50900866.Why must I be suspected when I''ve lost a daughter...?!!@k @v03/50900867.You''re maliciously trying to make me look like the culprit just because I went to bed early last night!@k @v03/50900868.I cannot stand this humiliation any further...!!"'
37865: 'Eva@r@v05/51000298."Oh, so what are you going to do about it?@k @v05/51000299.Show us some kind of alibi that proves your innocence.@k@|@y@v05/51000300. As if you could!!@k @v05/51000301.Give me back my George, you murderer!!"'
37866: 'Hideyoshi@r@v06/51100175."Give it a rest, Eva...!@k @v06/51100176.......Natsuhi-san, you''re probably a little tired too.@k@v06/51100177. Of course, so are we.@k@v06/51100178. Why don''t we take it easy for a bit...?"'
37867: 'Rudolf@r@v08/51200219.".........Seriously.@k@v08/51200220. We''re a little too high-strung."'
37868: 'Battler@r@v10/50101035."Aunt Natsuhi......@k@v10/50101036. Where are you going...?"'
37869: 'Natsuhi@r@v03/50900869."This search for alibis and culprits is truly ludicrous...!@k @v03/50900870.When the typhoon passes and the police arrive, everything will be exposed to the light of day.@k@v03/50900871. There''s no reason whatsoever for us to play detectives.@k@v03/50900872. Am I wrong, Erika-san?"'
37870: 'Erika@r@v46/54500782."Generally speaking, you would be right.@k@|@y@v46/54500783. However, I have the authority to do this."'
37871: '@rWho gave her that authority?@k No one asked.'
37872: '@rIt was an authority given by words of power from a higher world,@k so the pieces weren''t even allowed to doubt it...'
37873: 'Natsuhi@r@v03/50900873."I will take my leave.@k@v03/50900874. I have no intention of playing along with your pointless questioning until the police are here.@k@|@y@v03/50900875. If you suspect me, feel free to do so.@k@v03/50900876. I will leave it to the police to investigate that and clear my name."'
37874: '@r.........It may be a bit late to mention this, but—well, no, this happens every time.'
37875: '@rAs usual, the phone couldn''t connect to the police.'
37876: '@rNatsuhi said the police would come, but that wasn''t exactly true.'
37877: '@rStrictly speaking, the boat to pick them up would come tomorrow, and they would be able to use the radio on that boat to contact the police.'
37878: '@rWell, ......it''s not like I''ll let everyone live that long anyway.'
37879: '@r...*giggle*.'
37880: 'Nanjo@r@v19/51900073."......Natsuhi-san, it''s dangerous to be alone...@k@v19/51900074. Perhaps it would be better if you......"'
37881: 'Eva@r@v05/51000302."Why not let her?@k@v05/51000303. That might make for some excellent proof.@k @v05/51000304.If Natsuhi nee-san gets murdered in her own room, that''ll be excellent proof of her innocence."'
37882: 'Rudolf@r@v08/51200221."Quit it, Aneki.@k@v08/51200222. .........It''s probably best if we all get a bit of rest.@k@v08/51200223. Our bodies won''t last until tomorrow."'
37883: 'Kyrie@r@v09/51300135."Rest is fine, but let''s not let our guard down, okay...?@k @v09/51300136.We might not make it through the night, much less tomorrow."'
37884: 'Battler@r@v10/50101037."............Aunt Natsuhi.@k@v10/50101038. If you''re returning to your room, make sure you lock it tight, close the windows and shutters, and stay safe.@k@|@y@v10/50101039. ......I don''t want to suspect anyone.@k@v10/50101040. And more than that, ......I don''t want there to be any more victims."'
37885: 'Natsuhi@r@v03/50900877.".........Thank you, Battler-kun.@k@|@y@v03/50900878. .........Then I''ll return to my room.@k@v03/50900879. Gohda, you''re in charge now.@k@v03/50900880. I know this is a horrible situation, but make sure that the guests at least have everything they need."'
37886: 'Gohda@r@v17/51700088."Y-yes, Madam......@k@v17/51700089. I shall do so......"'
37887: '@rWith everyone watching her, Natsuhi left the parlor.'
37888: '@rFrom their faces, she could tell that they were expecting the classic mystery pattern...@kthat the first person to quarrel and leave the circle would become the next victim.'
37889: '@r............Natsuhi......couldn''t disobey because of the threat against Krauss, who had been taken as a hostage.'
37890: '@rVery soon, it would be 1 p.m., the time that had been arranged.'
37891: '@rShe was to hide for an hour in the closet of a specific guest room.'
37892: '@rIt was easy to suspect that this bizarre order was a trap to select her as the next sacrifice.'
37893: '@rShe thought of various ways to resist,@k but all methods would be useless against a culprit who had a hostage and was observing her from close by...'
37894: '@rSo Natsuhi could do nothing but obediently follow his orders,@k and then claim that she had been forced to do this for her husband''s safety...'
37895: '@rAs the arranged time had drawn near,@k Natsuhi had intentionally acted annoyed and smashed the cup on the ground to give her an excuse for slipping out of the parlor.'
37896: '@r.........At any rate, no matter how cowardly a trap it may be, ......I cannot disobey now.'
37897: '@rI am now the one who carries the burden of the One-winged Eagle.'
37898: '@r......Now that my husband, Krauss, has been captured,@k I must protect it even if I have to crawl through the mud...'
37899: 'Natsuhi@r@v03/50900881.".............................."'
37900: '@r......Of course, I am prepared to do that.@k I am Ushiromiya Natsuhi.'
37901: '@rEven if I am not permitted to bear the One-winged Eagle on my clothes,@k .........Father gave me permission to bear it in my heart......'
37902: 'Natsuhi@r@v03/50900882.".............................."'
37903: '@r......I think dashing away in a rage got me here without raising too much suspicion.'
37904: '@rSo far......everything has gone well.'
37905: '@rBefore my eyes was the doorknob of the specified guest room.@k@r......However, ...I wondered about the lock.'
37906: '@rThe servants are under orders to always lock any unused rooms.'
37907: '@r......What will I do if it''s locked...?'
37908: '@rI dashed out of the parlor pretending that I was returning to my room.'
37909: '@rGoing back and asking a servant to unlock this guest room would be obviously suspicious...'
37910: '@rIf possible, ......I''d like to get this eerie hide-and-seek over with without anyone noticing.'
37911: '@rIn that phone call from the one who claimed to be a man from 19 years ago,@k he said that I would win if no one found me, but lose if anyone did find me.'
37912: '@rHe said that he''d release my husband whether I won or lost,@k ......but as a person with a hostage taken against me, I''d rather not lose...'
37913: '@rI don''t like it at all, but I have to go along with this game.'
37914: '@rI softly gripped the doorknob, ......and I could feel that it was unlocked.'
37915: '@rDid Shannon or Kumasawa forget to lock it after cleaning?'
37916: '@r......Or did that man unlock it in advance......?'
37917: '@rThat man...@w333....couldn''t be waiting for me in this room, could he?'
37918: '@rAnd then...@w333....he''ll...@w500.........................'
37919: '@rAll that about hide-and-seek might have been just an excuse.'
37920: '@rI kept the fact that I was coming here secret, and all of the other people think I''m resting in my room.'
37921: '@rIf I were to be killed in this situation, in this room,@k ......it might create a new baffling murder case, like an extension of the one which occurred this morning.'
37922: 'Natsuhi@r@v03/50900883.".........I-...if that''s what he''s up to, so much the better.@k@v03/50900884. ...It will be a good chance to confront the culprit directly..."'
37923: '@rNatsuhi had some experience with using a naginata, but only from casual lessons.'
37924: '@rUnlike Eva, she couldn''t brag about being able to hold off any single ruffian indefinitely.'
37925: '@rAs she was now, she had no realistic chance of prevailing over a man with malicious intent on her own, and no weapons that could make that possible.'
37926: 'Natsuhi@r@v03/50900885.".............................."'
37927: '@rShe readied herself......and slowly opened the door.'
37928: '@rShe couldn''t afford to stand around in the corridor and risk being seen by someone...'
37929: '@rThe atmosphere inside the guest room......was ice-cold,@k and she could sense no trace of a person waiting impatiently for her.'
37930: '@rAll she could hear were the unsettling sounds of the wind and rain.'
37931: '@rAt first, that seemed to be proof that no one existed to threaten her,@k ......but before long, it only stirred up the uneasy feeling inside her all the more...'
37932: '@rThe closet was just off to the side of anyone entering the room.'
37933: '@rLined up inside it was a set of hangers where guests could hang their coats.'
37934: '@rThis closet, which had nothing hanging in it, was large enough for even an adult to hide in...'
37935: '@rShe softly opened the closet.@k ......Of course, there was nothing inside.'
37936: '@rShe would have to hide quietly in here for an hour.'
37937: '@rThe room had a wood floor, but something like a carpet had been laid in the closet.'
37938: '@r......It seemed that sitting down wouldn''t be a problem.'
37939: '@rShe had been sure that someone would be waiting for her in this room,@k or that a strange letter would be lying in the closet.'
37940: '@r......She had even imagined the worst, that her husband''s corpse might be inside.'
37941: '@rHowever, none of these things she imagined turned out to be true.'
37942: '@rAll that was here was a cold guest room...@kand a lifeless closet which silently urged her to go inside......'
37943: 'Natsuhi@r@v03/50900886."............And he told me...to hide in here for an hour...@k@|@y@v03/50900887. ......He''s making fun of me."'
37944: '@rNatsuhi shrugged, turned around, then locked and chained the guest room door.'
37945: 'Natsuhi@r@v03/50900888."This way, no one will be able to get into this room.@k@|@y@v03/50900889. ......In other words, no one will be able to find me for the next hour.@k@v03/50900890. I win.@k@v03/50900891. What a stupid game of hide-and-seek."'
37946: '@rThis would certainly result in a total victory in the hide-and-seek game against that mystery man.'
37947: '@r......However, it was such an easy victory, it made her feel uneasy.'
37948: '@rThis is normally against the rules of hide-and-seek...'
37949: '@r......Even if I win, won''t this displease the culprit?'
37950: '@rAnd everyone thinks I''m in my room right now.'
37951: '@rIf they find a room with a chain set, that will be an impossible locked room to them.'
37952: '@rErika was dashing around the mansion to confirm everyone''s alibi.'
37953: '@rIf she notices that the chain is set on this room, there will probably be an uproar which will end in them cutting the chain and searching the room.'
37954: '@r......If that happens, I''ll be found hiding in the closet right away.'
37955: '@rIt would be easy for me to honestly confess why I was hiding.'
