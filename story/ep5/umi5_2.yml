33312: '@rThe rose garden was truly splendid this year.@k@rThe roses were blooming like crazy, as though they were competing with each other.'
33313: '@rIn that rose garden, Kinzo, Kanon, and Natsuhi could be seen...'
33314: 'Kinzo@r@v01/51500081."Once again, the flowers have grown wonderfully this year.@k@v01/51500082. It must be the result of your care."'
33315: 'Kanon@r@v16/50600001.".........Thank you very much.@k@v16/50600002. The weather just happened to be good this year."'
33316: 'Natsuhi@r@v03/50900209."Thanks to your care, the garden is even more beautiful than usual.@k@v03/50900210. Good work."'
33317: 'Kanon@r@v16/50600003."Thank you very much..."'
33318: 'Kinzo@r@v01/51500083."If today weren''t so special...@k@v01/51500084.we might have been able to admire the roses while enjoying some black tea."'
33319: '@rKinzo shrugged.@k Today was the family conference.'
33320: '@r......When it came to the other siblings'' businesses, they hadn''t heard anything good.'
33321: '@rOn the contrary, those siblings probably planned to turn the conversation to the topic of Kinzo''s remaining life,@k and hold a quiet feud over the inheritance.'
33322: 'Kinzo@r@v01/51500085."......Those people are quite unpleasant.@k@v01/51500086. By the way, what about Krauss?@k@v01/51500087. Is that debt repayment plan of his proceeding well?"'
33323: 'Natsuhi@r@v03/50900211."It really does seem to be a realistic plan.@k@v03/50900212. .........However, the scale of the plan appears to be quite large, and it doesn''t seem to be bearing fruit as well as he expected."'
33324: 'Kinzo@r@v01/51500088."If possible, I had hoped that something could be done before today''s family conference."'
33325: 'Natsuhi@r@v03/50900213."......Yes.@k@v03/50900214. My apologies."'
33326: 'BEATRICE@r@v27/50700090."Are you sure that''s alright, Kinzo?@k@|@y@v27/50700091. Casually walking around in a place like that."'
33327: '@rHow had she gotten up there?@k@r......Well, it''s pretty pointless to wonder about that sort of thing when you''re dealing with a witch.'
33328: '@rBEATRICE was casually sitting on the roof of the arbor,@k almost as though she had been basking in the sun.'
33329: 'BEATRICE@r@v27/50700092."Those relatives are like a massive lump of the anti-magic toxin, and they''ll be intruding on us.@k@v27/50700093. If you bump into them, your soul will evaporate in a instant."'
33330: 'Kinzo@r@v01/51500089."Hmph.@k@v01/51500090. I am already dead.@k@v01/51500091. Even evaporating would be no detriment."'
33331: 'Natsuhi@r@v03/50900215."......We can''t have that happen.@k@v03/50900216. Please, for the sake of the Ushiromiya family, lend us your strength just a little longer."'
33332: 'BEATRICE@r@v27/50700094."Natsuhi.@k@v27/50700095. It seems that the boat with the relatives on it has left the harbor.@k@v27/50700096. It might be a good idea to end your walk soon."'
33333: 'Natsuhi@r@v03/50900217."......Is that so?@k@v03/50900218. Thank you.@k@v03/50900219. ...Please return to the study, Father."'
33334: 'Kinzo@r@v01/51500092."Just great...@k@v01/51500093. A shame that I must go back when the weather is so perfect."'
33335: 'BEATRICE@r@v27/50700097."Don''t grumble, Kinzo.@k@v27/50700098. Right now, you are nothing more than a ghost that I gave life to.@k@|@y@v27/50700099. It''ll be troublesome for both me and Natsuhi if you''re scattered away by the toxin.@k@v27/50700100. Just be a good boy, shut yourself away in the study, and put a blanket over yourself or something.@k@v27/50700101. *cackle*cackle*!"'
33336: 'Kinzo@r@v01/51500094."Hmph.@k@v01/51500095. ......Just being given the chance to enjoy the roses even after death makes me extremely fortunate.@k@v01/51500096. I understand.@k@v01/51500097. I shall return to the study."'
33337: 'Kinzo@r@v01/51500098."But I would like some black tea.@k@v01/51500099. Kanon, tell Genji to bring me some.@k@v01/51500100. Some Marco Polo would be nice today."'
33338: 'Kanon@r@v16/50600004."......Certainly."'
33339: 'Kinzo@r@v01/51500101."Then let''s go our separate ways.@k@v01/51500102. Natsuhi.@k@v01/51500103. ......I want you to conduct the family conference splendidly without me."'
33340: 'Natsuhi@r@v03/50900220."Of course, Father.@k@v03/50900221. He can''t say it in front of them, but my husband is already the Ushiromiya family head.@k@v03/50900222. And, I will do all I can to see that I don''t embarrass him as his wife."'
33341: 'Kinzo@r@v01/51500104."......Compared to Krauss, who''s had a stomachache since this morning, you are so very composed, Natsuhi.@k@v01/51500105. ......My son is quite hopeless."'
33342: 'Natsuhi@r@v03/50900223."My husband is talented in his own way.@k@v03/50900224. Supporting him where he''s weak is my duty as his wife."'
33343: 'Kinzo@r@v01/51500106."Mm.@k@v01/51500107. Give it your best.@k@v01/51500108. I will make sure to stay shut away so that I don''t get in the way of this farce."'
33344: 'Natsuhi@r@v03/50900225."Kanon.@k@v03/50900226. Go with Father to the study.@k@v03/50900227. And then have Genji serve some black tea."'
33345: 'Kinzo@r@v01/51500109."I''m not so senile that I need your help to stand up.@k@v01/51500110. Here I go......"'
33346: '@rRefusing Kanon''s attempt to lend him a hand, Kinzo rose from the flower bed he had been sitting on.'
33347: '@rThe retired head left everything in Natsuhi''s hands and returned to the study at a gentle pace......'
33348: 'BEATRICE@r@v27/50700102."......You''re looking well.@k@v27/50700103. You possess a sense of dignity similar to Kinzo''s deceased wife."'
33349: 'Natsuhi@r@v03/50900228."On the off-chance that the anti-magic toxin does get to Father,@k@v03/50900229. ......will the magic dissolve in an instant?"'
33350: 'BEATRICE@r@v27/50700104."Yes.@k@v27/50700105. In the blink of an eye.@k@v27/50700106. ......I can simply erase my form if necessary,@k@v27/50700107. but if someone already dead such as Kinzo loses his form, he will be blown away by the winds of the sun and disappear like dust in a matter of seconds.@k@v27/50700108. You must take care."'
33351: 'Natsuhi@r@v03/50900230."Yes.@k@v03/50900231. I understand."'
33352: 'BEATRICE@r@v27/50700109.".........You might have talent as a witch.@k@v27/50700110. The anti-magic toxin has been building up in your system over the years,@k@v27/50700111. and yet you are still able to understand magic.@k@v27/50700112. ......If you and I had met during your youth, you might have become a powerful witch by now."'
33353: 'Natsuhi@r@v03/50900232."I am Ushiromiya Krauss''s wife, the head''s wife.@k@v03/50900233. I would become even a witch or a demon to protect his honor.@k@|@y@v03/50900234. ......I am deeply grateful for the power of your magic.@k@v03/50900235. I wouldn''t have been able to protect the honor of the Ushiromiya family without you."'
33354: 'BEATRICE@r@v27/50700113."Let''s discuss that at another time.@k@v27/50700114. I''d like to enjoy it with just the two of us women drinking tea."'
33355: 'Natsuhi@r@v03/50900236."A friend of mine who went to Sri Lanka sent me some black tea with a wonderful rose fragrance."'
33356: 'BEATRICE@r@v27/50700115."Hoh, you mean Dimbula.@k@v27/50700116. That isn''t bad.@k@v27/50700117. Then you should also have patis on the side.@k@v27/50700118. ......You must serve me some as a reward if I manage to trick everyone for the whole upcoming family conference.@k@v27/50700119. Promise me now."'
33357: 'Natsuhi@r@v03/50900237."Understood.@k@v03/50900238. I promise.@k@v03/50900239. Then, I''ll see you later."'
33358: 'BEATRICE@r@v27/50700120."Mm. Later it is."'
33359: '@rThe witch made her body crumble into the rustling winds, became gold flower petals, and scattered into thin air.'
33360: '@rNatsuhi watched her go, then turned on her heels and headed for the mansion.'
33361: '@rAfter that, there was no one left in the rose garden......'
33362: 'LAMBDADELTA@r@v29/52200083."Alright then.@k@v29/52200084. It''s <break time>.@k@v29/52200085. Any complaints about how things have gone so far?"'
33363: 'BERNKASTEL@r@v28/52100056.".........None at all.@k@v28/52100057. If you gotta pee, why don''t you just go and do it...?"'
33364: 'LAMBDADELTA@r@v29/52200086."What a rude thing to say.@k@v29/52200087.@|@y@c900. @[Kinzo is already dead@]@c., remember?@k @|@y@v29/52200088.But he''s walking around and talking, isn''t he?@k@v29/52200089. Doesn''t that mean this is magic?!"'
33365: 'LAMBDADELTA@r@v29/52200090."Well, I doubt this move would work on you after all this time, Bern.@k@v29/52200091. ......But what about you, Battler?@k @|@y@v29/52200092.Isn''t this weird?@k @v29/52200093.Don''t you have to accept the existence of the magic that revived Kinzo?@k @|@y@v29/52200094.Hahhihhyahhahaaaah!"'
33366: 'Battler@r@v10/50100088."......If you''re trying to imitate Beato,@k@v10/50100089. stop it right now, ''cause it''s pissing me off."'
33367: 'LAMBDADELTA@r@v29/52200095."*giggle*!@k @v29/52200096.Figured it out?!@k @v29/52200097.Then come on, how are you gonna answer, Battler?@k @v29/52200098.Kinzo was just out for a stro~ll."'
33368: 'LAMBDADELTA@r@v29/52200099."Why don''t you do what you usually do and start holding your head, crying "this doesn''t make any sense!!"...?@k@v29/52200100. C''mon, use that old "it''s no goddamn good at all" catch phrase and let me hear your classic crazy counterargument."'
33369: 'LAMBDADELTA@r@v29/52200101."There''s no way that a human who''s supposed to be dead could be walking around, right?@k @v29/52200102.Is this all because of some unknown virus called the Rokkenjima Syndrome which causes mass delusions?@k@v29/52200103. Or do the scales of a mysterious form of butterfly that only lives on Rokkenjima happen to be hallucinogenic?!@k @v29/52200104.Or is it all because a mysterious secret organization called "Yamainu" made an as-of-yet undiscovered drug called Purupurupikopuyo which causes mass delusions?!!"'
33370: 'LAMBDADELTA@r@v29/52200105."Let me hear tons of this wonderful crap,@v29/52200106.@|@y kyaaahahahaahahahahahahahahahahahahahaha!!"'
33371: 'Battler@r@v10/50100090.".........Just shut up.@k@v10/50100091. This isn''t even a problem."'
33372: '@r@|@y@c900.@[Grandfather is dead at this point in time.@]@c.@k There''s no way he exists.'
33373: 'Battler@r@v10/50100092."The only reason everything''s behaving as though he actually exists...@k@v10/50100093.is because that''s the lie that Aunt Natsuhi''s creating in an attempt to hide Grandfather''s death and trick her way through the family conference."'
33374: 'LAMBDADELTA@r@v29/52200107."Oh?@k@v29/52200108. It''s Natsuhi''s lie?@k @v29/52200109.You can revive the dead by lying?@k @v29/52200110.Wouldn''t that make it Natsuhi''s magic?"'
33375: 'Battler@r@v10/50100094."This world is like a Braun tube before you''ve looked in it.@k@v10/50100095. ......It''s the world of the cat box before you open it."'
33376: 'Battler@r@v10/50100096."As long as Aunt Natsuhi says that she took a walk with Grandfather, and as long as no one can confirm that that''s a lie,@k@v10/50100097. it''s possible to display "Aunt Natsuhi taking a walk in the rose garden with Grandfather" as Natsuhi''s reality.@k@v10/50100098. That means it''s possible for Grandfather to appear."'
33377: '@rClap, clap, clap...'
33378: '@rThat extremely unflattering applause was coming from BERNKASTEL.'
33379: 'BERNKASTEL@r@v28/52100058."......Bravo.@k@v28/52100059. ............You''re much calmer without Beato around."'
33380: 'Battler@r@v10/50100099."Quiet.@k@v10/50100100. You shut up too."'
33381: 'LAMBDADELTA@r@v29/52200111."Wait a second, Battler.@k@v29/52200112. According to your theory, sure, it might really be possible for Kinzo to appear if Natsuhi''s the only person there.@k@v29/52200113. If Natsuhi claims to have observed Kinzo in a world with no one except Natsuhi in it, then no one can deny it, right?"'
33382: 'LAMBDADELTA@r@v29/52200114."But Kanon was in the same place, and he was also looking at Kinzo, right?@k @v29/52200115.How would you explain that?"'
33383: 'Battler@r@v10/50100101."...That''s no problem at all.@k@v10/50100102. Kanon-kun is a servant who works for the Ushiromiya family.@k@v10/50100103. ......Aunt Natsuhi probably ordered him to keep to her story so that she can hide Grandfather''s death.@k@v10/50100104. ......This means that just like Aunt Natsuhi, Kanon can see Grandfather even though Grandfather isn''t supposed to exist."'
33384: 'BERNKASTEL@r@v28/52100060."............Too bad, Lambda.@k@v28/52100061. Battler isn''t going to fall for that kind of child''s play anymore."'
33385: 'LAMBDADELTA@r@v29/52200116."Seems so.@k@v29/52200117. ......Well, this is nothing more than an opening before the game.@k@v29/52200118. Like an aperitif before a meal."'
33386: 'BERNKASTEL@r@v28/52100062.".........An appetizer at a bar.@k@v28/52100063. Green tea at a sushi restaurant."'
33387: 'Battler@r@v10/50100083."Shut up.@k@v10/50100106. So we aren''t gonna get anywhere unless I say it again in blue text?"'
33388: 'LAMBDADELTA@r@v29/52200119."Looks like it.@k@v29/52200120. Would you mind?"'
33389: 'Battler@r@v10/50100107."............@k@v10/50100109.@|@y@c279.@[......The reason Grandfather is strolling around like nothing happened even though he''s already dead...@k@v10/50100110.is that people who want to make it seem as though he''s alive created an illusion of him.@k@v10/50100111. Everyone with the same intention can share in that illusion.@k@v10/50100112. Then, they talk as though Grandfather actually exists and was with them until a second ago.@k@v10/50100113. That''s why he''s strolling around like it''s perfectly natural.@]@c."'
33390: 'Battler@r@v10/50100114."@|@y@c279.@[Because of this, the illusion of Grandfather is unable to appear in front of people who aren''t in on this with Aunt Natsuhi.@]@c.@k@v10/50100115.@c279. @[That''s why they needed to set it up so that he would shut himself away in his study and not come out.@]@c."'
33391: '@rIn the games before now, Grandfather was always shut away in his study.'
33392: '@rWe never met him directly.'
33393: '@rHowever, there were some people who spoke in a way that made it seem like he was locked up in his study in a bad mood,@k and who claimed to have met him only a short while ago.@k We blindly accepted that and believed that Grandfather was in the study.'
33394: '@r@a1666.That''s why it was possible for an illusion of Grandfather to exist in the study.'
33395: '@rThat''s right, in the games before now,@k the only people who met Grandfather were Uncle Krauss,@k Aunt Natsuhi, and the servants.'
33396: '@r@|@y@c279.@[Because they all stuck to the same story,@k an illusion of Grandfather was able to exist on this island, making it seem like he was alive.@]@c.'
33397: 'Battler@r@v10/50100116."......You were even kind enough to show me a scene at the beginning of this game...@k@v10/50100117.of Aunt Natsuhi convincing Doctor Nanjo and the rest to cover up Grandfather''s death.@k@v10/50100118. ......I''m not gonna fall for this kind of cheap trick now."'
33398: 'LAMBDADELTA@r@v29/52200121.".........Not bad.@k@v29/52200122. But I was hoping for the unknown drug Purupurupikopuyo."'
33399: 'BERNKASTEL@r@v28/52100064."There''s no way he''d say something so ridiculous, right......?@k @v28/52100065.After all, supposing that such a thing exists would be just as bad as surrendering to the fantasy genre.@k@v28/52100066. ......Whether it''s a virus or a drug or an illness, anything that hasn''t been discovered yet is in violation of Knox''s fourth commandment."'
33400: 'Battler@r@v10/50100119."......What do you mean, fourth commandment?"'
33401: 'BERNKASTEL@r@v28/52100067."Knox''s 4th:@k@v28/52100068. It is forbidden for unknown drugs or obscure scientific devices to be used.@k@v28/52100069. .........It''s a rule that these cannot be used for murder."'
33402: 'Battler@r@v10/50100120."What?@k@v10/50100121. I don''t know what world you''ve been living in, but unknown drug X and unknown scientific device X are the best kinds of weapons to use when fighting against a witch..."'
33403: 'BERNKASTEL@r@v28/52100070.".........Yes, those.@k@v28/52100071. They all violate the rules of proper mystery stories.@k@v28/52100072. Supposing an unknown virus,@k@v28/52100073. an unknown drug,@k@v28/52100074. ...an unknown sickness, or an unknown X was used puts it totally in the fantasy genre.@k@v28/52100075. My condolences.@k@v28/52100076. If that was your theory, then it''s game over for you.@k@|@y@v28/52100077. *giggle*giggle*."'
33404: 'Battler@r@v10/50100122.".........H-hey...@k@v10/50100123. What are you talking about......?"'
33405: 'BERNKASTEL@r@v28/52100078."You think you''ve been fighting in direct opposition to Beato.@k@v28/52100079. But that''s not actually true.@k@v28/52100080. You haven''t been in direct opposition.@k@v28/52100081. You''ve been fighting from a diagonal angle."'
33406: 'BERNKASTEL@r@v28/52100082."All this playing detective you''ve done hasn''t been fantasy vs. mystery.@k@v28/52100083. It''s only been fantasy vs anti-fantasy."'
33407: 'Battler@r@v10/50100124."......I don''t have a clue what you''re talking about.@k@|@y@v10/50100125. ...But there''s one thing I do get.@k@v10/50100126. ......It sounds like you''re saying there''s something wrong with the way I''ve been fighting."'
33408: 'BERNKASTEL@r@v28/52100084.".........We are fighting to kill the fantasy known as the witch illusion.@k@v28/52100085. That means interpreting this tale...@v28/52100086.as a proper mystery.@k@v28/52100087. In other words, from the very start, we have to forget about any and all elements that would violate the taboos of the mystery genre."'
33409: 'Battler@r@v10/50100127."F-...forget about them.........?"'
33410: 'BERNKASTEL@r@v28/52100088."For example, several locked-room murders have occurred in the games before now, right?"'
33411: 'Battler@r@v10/50100128."......Y-...yeah."'
33412: 'BERNKASTEL@r@v28/52100089.At every single crime scene, to make sure there are no hidden doors,@k@v28/52100090. you''ve been enthusiastically checking with Beato, haven''t you?'
33413: 'BERNKASTEL@r@v28/52100091.Weaving a flashy bunch of red truths together all over the place,@k@v28/52100092. almost as though that itself was the battle.'
33414: 'BERNKASTEL@r@v28/52100093.I call that a waste of time.'
33415: 'BERNKASTEL@r@v28/52100094.After all, it''s clearly specified by Knox''s third commandment.@k@r@v28/52100095."It is forbidden for hidden passages to exist."@k@r@v28/52100096.In the mystery genre, hidden passages mustn''t exist.'
33416: 'BERNKASTEL@r@v28/52100097.So when trying to interpret everything as a proper mystery,@k@v28/52100098. having a debate over whether there are hidden doors or not is a defeat from the beginning, don''t you see...?'
33417: 'BERNKASTEL@r@v28/52100099.After all, there aren''t any.@k@r@v28/52100100.As soon as you suspect that they might exist, then it''s already game over for you.'
33418: 'BERNKASTEL@r@v28/52100101.In other words, the way you assume that you can''t use reason just because it hasn''t been proven that hidden doors don''t exist at the crime scene...@k@v28/52100102.makes you simply naive and a failure at mysteries.@k@v28/52100103. You''ve already lost once you start thinking that.'
33419: 'BERNKASTEL@r@v28/52100104.You were trying to interpret everything within the bounds of the mystery genre, right...?'
33420: 'BERNKASTEL@r@v28/52100105.Then you''ve got to follow its conventions.@k@v28/52100106. ...*giggle*giggle*giggle*giggle*, hihihihihihihihihihihihyahhahhahahahahahahahahahahahahahaha...!!'
33421: 'BERNKASTEL@r@v28/52100107."*cough*.@k@v28/52100108. .........That''s how it is.@k@v28/52100109. Hidden doors must not exist at any of the crime scenes.@k@v28/52100110. That means anything you do to try and check whether they exist or not is a waste of time."'
33422: 'Battler@r@v10/50100129."...I think I know what you''re talking about.@k @v10/50100130.I''ve heard about it somewhere.@k@v10/50100131. Is this like the ten basic rules for mystery novels or something?"'
33423: 'LAMBDADELTA@r@v29/52200123."Yeah, that''s right.@k@v29/52200124. They''re the ten witch-piercing wedges brandished by Knox, the peerless archbishop of witch hunting.@k@v29/52200125. Those are the true weapons with which to fight and defeat the fantasy known as the witch illusion head-on."'
33424: 'LAMBDADELTA@r@v29/52200126."......Just like you, Bern.@k@v29/52200127. Bringing in such annoying weapons.@k@v29/52200128. They''re the fantasy side''s worst enemies."'
33425: 'Battler@r@v10/50100132."..................@k@v10/50100133. So you deny the existence of hidden doors right from the start, without even investigating the crime scene...@k@v10/50100134. That''s what sounds like fantasy to me..."'
33426: 'BERNKASTEL@r@v28/52100111."Lambda, who''s in charge of the witch side, is fantasy.@k@v28/52100112. I''m the one who''s fighting her, mystery.@k@v28/52100113. What are you?@k @v28/52100114.The most you can do is repeatedly dodge and deny fantasy, which makes you merely "anti-fantasy".@k@v28/52100115. You''re opposed to absolutely everything, but you can make no counter-proposals.@k@v28/52100116. You''re like a politician from some government.@k@v28/52100117. *giggle*giggle*."'
33427: 'Battler@r@v10/50100135."Shut up.@k@v10/50100136. I didn''t come here to speak gibberish with you two.@k@v10/50100137. Just get on with the story...!!"'
33428: 'LAMBDADELTA@r@v29/52200129."......Quiet down.@k@|@y@v29/52200130. That sleeping princess behind you is suffering, you know?"'
33429: '@rWhen he turned around, he saw Beato''s living corpse resting in a chair...'
33430: '@rHowever, sweat glistened all over her body and it felt like she was breathing a little harder than normal.'
33431: '@r......She looked as though she was suffering from a high fever.'
33432: 'Battler@r@v10/50100138."Beato......@k@v10/50100139. What''s wrong... Are you okay...?"'
33433: 'LAMBDADELTA@r@v29/52200131."What do you mean, okay?@k@v29/52200132. You sure do say some strange things.@k@v29/52200133. ......You''re fighting to kill that girl."'
33434: 'Battler@r@v10/50100140."..............."'
33435: 'LAMBDADELTA@r@v29/52200134."We''ve rewound this fifth game for your benefit,@k@v29/52200135. but where we''re at right now, Bern''s cornered me pretty good and she''s about to break through the witch illusion.@k@v29/52200136. ...That girl''s existence has been almost completely denied.@k@v29/52200137. It''s only natural that she''s suffering."'
33436: 'BERNKASTEL@r@v28/52100118.".........Even just now,@k@v28/52100119. you smashed a witch illusion by saying there was no way Kinzo existed.@k@v28/52100120. ......This is the proof that your attack reached Beato.@k@v28/52100121. This agony of hers."'
33437: 'Battler@r@v10/50100141."....................."'
33438: '@r......I tried to at least wipe away the sweat on Beato''s forehead with a handkerchief.'
33439: '@rIt''s true I promised Beato that I''d let her die.@k@rBut that was supposed to be......peacefully.@k@rI wasn''t planning to make her suffer first.'
33440: '@r......My goal isn''t to make the sleeping Beato suffer like this before killing her......'
33441: '@rAs if the complicated feelings inside me were plain as day to them,@k the two witches grinned together...'
33442: 'Rudolf@r@v08/51200003."Dammit, Aneki, Dad overheard because you kept yelling about the inheritance!"'
33443: 'Eva@r@v05/51000005."It isn''t my fault, how was I supposed to know?!@k @v05/51000006.He just happened to be in the corridor and heard! It was an unlucky coincidence!"'
33444: 'Hideyoshi@r@v06/51100001."Could you two give it a rest......?@k@v06/51100002. Just call it our bad luck this time and give it up.@k@v06/51100003. If you leave a man alone, his mood''ll pop right back to normal."'
33445: 'Kyrie@r@v09/51300002."Hopefully Father''s feelings weren''t hurt so much that he writes up some strange will."'
33446: '@rThe relatives sighed deeply and fell into silence...'
33447: 'Rosa@r@v12/51400001."Hey! Maria! No jumping around!@k@v12/51400002. What if Ange-chan trips over?!"'
33448: 'Genji@r@v14/51600016.".........Sorry to keep you waiting.@k@v14/51600017. The boat is ready."'
33449: 'Hideyoshi@r@v06/51100004."Alright, let''s go.@k@v06/51100005. Won''t get anywhere by complainin'' now."'
33450: 'Gohda@r@v17/51700001."We eagerly await your return to this island."'
33451: '@rNatsuhi was sitting on a bench in the rose garden, looking completely worn out.'
33452: '@rHowever, when she noticed that Kanon and Kumasawa were coming back, she immediately sat up straight, regaining the dignity of the head''s wife.'
33453: 'Natsuhi@r@v03/50900240."......Did the boat leave?"'
33454: 'Kanon@r@v16/50600005."Yes.@k@v16/50600006. It departed just a minute ago."'
33455: 'Natsuhi@r@v03/50900241."I see.@k@v03/50900242. Good job seeing them off.@k@v03/50900243. ......What is my husband doing?"'
33456: 'Kanon@r@v16/50600007."He returned to his room a short while ago.@k@v16/50600008. He is resting."'
33457: '@rSince the previous day, Krauss had been almost overwhelmed by anxiety over the thought that Kinzo''s death might be discovered.'
33458: '@rWhen the family conference ended, his weariness must have suddenly gotten ahold of him.'
33459: '@r......However, the way he had refused to let even a sliver of his true intentions slip out...@kand the manner in which he had managed to act as though everything was normal showed that Krauss''s nerve was nothing to sneeze at.'
33460: 'Natsuhi@r@v03/50900244.".........How was it?@k@v03/50900245. Did they seem to notice anything suspicious about Father...?"'
33461: 'Kumasawa@r@v18/51800010."Nope.@k@v18/51800011. Eva-sama in particular was raising quite the racket about the Master overhearing her talking about the inheritance. Right?@k @v18/51800012.Wasn''t her panicking just priceless?"'
33462: 'Kanon@r@v16/50600009."Yes.@k@v16/50600010. She was quite shaken up."'
33463: 'Natsuhi@r@v03/50900246."Kumasawa, you really are quite an actress.@k@v03/50900247. All that panic in the corridor made it seem like Father really was there."'
33464: 'Kanon@r@v16/50600011.".........Kumasawa-san is quite talented at that sort of thing."'
33465: 'Kumasawa@r@v18/51800013."Oooh, come now, I don''t deserve such praise.@k@v18/51800014. Hoh-hoh-hoh-ho."'
33466: 'Natsuhi@r@v03/50900248."*giggle*.@k@v03/50900249. I will have to make it very clear to Genji not to believe you easily when you call in sick."'
33467: 'Kumasawa@r@v18/51800015."Now that''s just too harsh, Madam.@k@v18/51800016. Oh-hoh-hoh-hoh-ho..."'
33468: 'Natsuhi@r@v03/50900250."You really did a good job.@k@v03/50900251. As promised, both of you, as well as Genji and Shannon,@k@v03/50900252. will be reimbursed for the time off you''ve sacrificed over the past month, and will receive five days of additional pay.@k@|@y@v03/50900253. This bonus is a secret.@k@v03/50900254. Speak with Genji when you collect your pay to ensure that the other servants don''t find out."'
33469: 'Kumasawa@r@v18/51800017."Don''t you worry, we understand.@k@v18/51800018. Don''t we?"'
33470: 'Kanon@r@v16/50600012.".........Kumasawa-san.@k@v16/50600013. Your voice is too loud."'
33471: 'Kumasawa@r@v18/51800019."Ooh, how very careless of me... Hoh-hoh-ho."'
33472: 'Natsuhi@r@v03/50900255."Yes, we should be careful.@k@v03/50900256. Let''s leave it at that for the time being.@k@v03/50900257. All of you, please return to your regular duties.@k@|@y@v03/50900258. Oh, that''s right, I had Gohda prepare some special tea.@k@v03/50900259. Tell him to serve it."'
33473: '@rNatsuhi let them know that she wanted to be left alone for a while,@k so that she could drink some black tea in the rose garden.'
33474: '@rThat black tea, carried all the way to the bench,@k ...was the Sri Lankan tea Dimbula that she had promised Beato, along with patis...'
33475: '@rAnd sitting on either side of it, the wife of the head and her witch could be seen, both of them staring at it curiously.'
33476: 'Natsuhi@r@v03/50900260."......So this is patis...@k@v03/50900261. I just assumed it would be some kind of baked sweet..."'
33477: '@rNatsuhi hadn''t thought for a moment that it would have a curry-like spicy flavor, and had started coughing after putting it in her mouth.'
33478: '@rTo describe it in Japanese terms, it was like age-gyoza stuffed with mashed, curry-flavored potatoes.'
33479: '@rAs a savory snack, it would probably be pretty popular with the kids.'
33480: '@rHowever, it was something of a shock to Natsuhi, who expected that a treat to go with tea would be something sweet.'
33481: 'BEATRICE@r@v27/50700121."Didn''t you know?@k@v27/50700122. You cannot have Dimbula without this.@k@v27/50700123. Were it another black tea, it would be cookies.@k@v27/50700124. Oh, but chocolate is good too.@k@v27/50700125. With Japanese tea, sweet bean jelly is the tradition, although salted konbu also works.@k@v27/50700126. With Chinese tea, you have xiaolongbao.@k@v27/50700127. Though I like moon cakes as well."'
33482: 'Natsuhi@r@v03/50900262."......I''m surprised.@k@v03/50900263. You know a lot about culture, don''t you?"'
33483: 'BEATRICE@r@v27/50700128."Well, I haven''t been living a thousand years for nothing.@k@v27/50700129. I have sampled all the finest teas from around the world.@k@v27/50700130. Perhaps you could call me a tea traveler."'
33484: 'Natsuhi@r@v03/50900264."That does seem like it would be a wonderful way to "travel the world".@k@v03/50900265. Before today, I never knew that one could enjoy tea like this.@k@v03/50900266. I will treasure this experience."'
33485: 'BEATRICE@r@v27/50700131."I cannot leave Rokkenjima.@k@v27/50700132. This is the only way I can travel.@k@|@y@v27/50700133. What about you?@k@v27/50700134. I''m sure you''ve traveled the world in luxury as the wife of a rich man should."'
33486: 'Natsuhi@r@v03/50900267."............Before Jessica was born, my husband took me to many countries.@k@v03/50900268. Before marrying, I never once traveled overseas, so each time was a fresh and new experience."'
33487: 'BEATRICE@r@v27/50700135."......Hmph.@k@v27/50700136. Sounds like you were also born into a very restrictive household."'
33488: 'Natsuhi@r@v03/50900269."..................@k@v03/50900270. ...It was strict, but they gave me a wonderful upbringing.@k@v03/50900271. It would be rude to my father and mother to call that restrictive."'
33489: 'BEATRICE@r@v27/50700137."That tells me eloquently that it was. *cackle*."'
33490: '@rKrauss might have pitied Natsuhi.'
33491: '@rOr, he might have wanted to take her away from the restrictive Ushiromiya family for a little bit and let her rest.'
33492: '@r......Or, he might simply have wanted to take his wife around countries he knew well and show off everything he knew.'
33493: 'Natsuhi@r@v03/50900272."Unlike Father, my husband likes countries in Asia.@k@v03/50900273. Hong Kong, Taiwan, Korea, Thailand.@k@v03/50900274. I think we also went to Malaysia."'
33494: 'BEATRICE@r@v27/50700138."*cackle*cackle*.@k@v27/50700139. That Krauss...was he trying to rebel against Kinzo''s Western obsession?@k@|@y@v27/50700140. But Asia is good too.@k@v27/50700141. The Japanese are strongly influenced by the West.@k@v27/50700142. When they think of foreign countries, only Western ones come to mind.@k@v27/50700143. But the East exists as well."'
33495: 'Natsuhi@r@v03/50900275."I myself knew a few things about the West, but I knew very little about the Orient...@k@v03/50900276. I seem to recall my husband making fun of me now and then during our travels."'
33496: '@rAs Natsuhi grumbled that they had all been very tiring trips, Beato secretly peeked into her heart.'
33497: 'Krauss@r@v02/50800146."Now, listen.@k@v02/50800147. This is called an areca nut.@k@v02/50800147B. It''s a popular luxury food item around here."'
33498: '@rIt looked like a small, round, gourd-like nut that had been split open, with a slice of cucumber wedged in it.'
33499: '@rAt a glance, it looked as though it would probably taste like pickles.'
33500: 'Natsuhi@r@v03/50900277."I, I see.@k@v03/50900278. So I just bite it here...?"'
33501: '@rAs she tried to bite the one her husband was holding, he suddenly moved it away.'
33502: '@r...It felt kind of embarrassing, like she was a fish who took the bait.'
33503: 'Krauss@r@v02/50800148."Whoa, wait up.@k@v02/50800149. You have to eat it a certain way.@k@v02/50800150. Yes, you are supposed to bite it.@k@v02/50800151. Bite it.@k@v02/50800152. Chew it.@k@v02/50800153. But don''t eat it."'
33504: 'Natsuhi@r@v03/50900279."Huh?@k @v03/50900280.Even though you bite and chew it, you can''t eat it?"'
33505: 'Krauss@r@v02/50800154."Yes.@k@v02/50800155. Bite and chew.@k@v02/50800156. Don''t eat.@k@v02/50800157. And don''t drink the juice.@k@v02/50800158. It''ll make your stomach hurt."'
33506: 'Natsuhi@r@v03/50900281."I, I don''t understand...@k@v03/50900282. Why would you eat something like that??"'
33507: 'Krauss@r@v02/50800159."Think of it as something like gum.@k@v02/50800160. Chew it and enjoy the flavor.@k@v02/50800161. Spit the juice and the scraps you''ve chewed off into a paper cup like this."'
33508: 'Natsuhi@r@v03/50900283."......D-dear,@k@v03/50900284. the inside of your mouth is bright red...!@k @v03/50900285.Wipe it off, wipe it off.@k@v03/50900286. ......Eeek!"'
33509: '@rThe handkerchief she had wiped Krauss''s mouth with, a favorite of hers, also had bright red marks on it now.'
33510: '@rSomething that''s poisonous if eaten or drunk, and it makes the inside of your mouth so bright red,@k and on top of that, having to spit something out after you''ve put it in your mouth...how indecent!@k ......Thinking this, Natsuhi firmly refused what Krauss was offering her.'
33511: 'Natsuhi@r@v03/50900287."No. No! No, thank you. Thank you, but no...!"'
33512: 'Krauss@r@v02/50800162."This is a cross-cultural experience.@k@v02/50800163. What''s the point of traveling if we don''t do things that can only be done here?"'
33513: '@rKrauss kept chewing, ignoring the fact that even his lips were being colored bright red.'
33514: 'Krauss@r@v02/50800164."Father likes these too.@k@v02/50800165. He must have ordered some long ago, because he used to chew away at them on the mansion''s terrace.@k@v02/50800166. Although he seems to have stopped ever since you came here."'
33515: 'Krauss@r@v02/50800167."Come on! Father, the person you respect even more than me, chewed these all the time.@k@v02/50800168. Come on, come on, don''t hold back, try it."'
33516: 'Natsuhi@r@v03/50900288."No, no! Stop it! Stop i~t! De~~ar!"'
33517: '@r......When he was traveling the world, Krauss had the innocence of a child.'
33518: '@rHe wouldn''t even conceal his jealousy of the respect Natsuhi normally gave Kinzo.'
33519: '@rJust being able to see that side of her husband made traveling all the way to another country worthwhile...'
33520: '@rKrauss kept on urging her to bite it,@k but Natsuhi, undaunted, ran from place to place and finally yelled at him that he was being too pushy.'
33521: '@rKrauss was miffed for most of the bus ride.'
33522: '@rWhat a child, to let something like this get him down,@k@rNatsuhi thought, astounded.'
33523: '@rThen, a native tour guide on the bus took out one of those areca nuts and started explaining about it.'
33524: '@rHe talked about how it had been a beloved luxury item in these parts since ancient times, similar to tobacco.'
33525: '@rAbout how its popularity was declining because young people were starting to take a dislike to it, just like Natsuhi.'
33526: '@r......And about how it was treated as a good luck charm in this area,@k and was known as a symbol for couples.'
33527: '@rShe looked at her husband''s face.@k ......He turned away abruptly, but it looked like his cheeks had gotten a little red...'
33528: 'BEATRICE@r@v27/50700144."And then...@k@v27/50700145.you leaned on your husband and held his hand, I''ll bet?!@k @|@y@v27/50700146.What the heck, you and your husband share a pretty pure love, don''t you?!@k @v27/50700147.Did you get all fired u~p?@k @v27/50700148.You know, like, that night@k @v27/50700149.Kiiihihihihihihi!!"'
33529: '@rRed-faced and avoiding Beato''s eye, Natsuhi tried to hide her embarrassment by stuffing the patis whole into her mouth,@k chewing with her cheeks puffed out like a blowfish.'
33530: '@rBeato said that there was nothing better than this to go with tea,@k and nodded several times, a broad smile on her face...'
33531: 'Natsuhi@r@v03/50900289."Of course, that was when we were newlyweds.@k@v03/50900290. Right now, I cannot even leave Rokkenjima.@k@v03/50900291. I''m a bird in a cage."'
33532: 'BEATRICE@r@v27/50700150."Well, it''s the same for me.@k@v27/50700151. I have died more than once, and still I can''t escape Rokkenjima.@k@v27/50700152. I''m a bird in a cage just as you are."'
33533: 'Natsuhi@r@v03/50900292."I don''t know much about you, and I won''t pry.@k@v03/50900293. ......However, I can imagine that the circumstances you''re under are not ones I can make light of."'
33534: 'BEATRICE@r@v27/50700153."I have no desire to act like the chief prisoner here.@k@v27/50700154. Let''s be friendly as fellow birds in this cage.@k@v27/50700155. I''ve taken a liking to you."'
33535: 'Natsuhi@r@v03/50900294."Really?@k @v03/50900295.Thank you."'
33536: 'BEATRICE@r@v27/50700156."The instructions and orders you gave the servants for this family conference were superb.@k@v27/50700157. You thought of everything from where Kinzo would be and when to what he did and what he left behind,@k@v27/50700158. and you put it all together splendidly without any contradictions.@k@v27/50700159. That detailed written plan of yours had the same beauty as a high-level magic circle."'
33537: '@rTo make it look like Kinzo actually existed and was living life his own way,@k she had written his schedule for the day down to the finest detail and made the servants follow it to the letter.'
33538: '@rWho did he meet, when and where did he meet them, and what did he leave with them?@k@rWhat was he doing, when and where was he doing it, and what did he change?'
33539: '@rAs a result, even though the relatives hadn''t seen Kinzo even once,@k they never suspected in the slightest that he hadn''t been there.'
33540: '@rEva and the rest truly believed that their conversation about the inheritance had been overheard by Kinzo as he happened to walk through the hall, and that it had sent him into a rage.'
33541: '@rEverything had gone just as Natsuhi''s plan had predicted, down to the finest detail.@k@rAnd the coordination between the two of them and the servants had also been spectacularly intricate......'
33542: 'Natsuhi@r@v03/50900296."We couldn''t afford to have this secret found out under any circumstances.@k@v03/50900297. That''s why I made such a thorough plan."'
33543: 'BEATRICE@r@v27/50700160."Your willpower and attention to detail summoned success with certainty.@k@v27/50700161. ......As a witch, it seems that you''re in Lady LAMBDADELTA''s camp.@k@v27/50700162. At your current level, as soon as you become self-aware of that as magic, you will be worthy of calling yourself a witch apprentice."'
33544: 'Natsuhi@r@v03/50900298."If you call something like that magic, then that would make Kumasawa the witch of feigned illnesses.@k@v03/50900299. She only calls us to say she''s taking the day off because of her bad back on the busy days.@k@v03/50900300. Like every year''s family conference."'
33545: 'BEATRICE@r@v27/50700163."Oh no, Kumasawa is completely different.@k@v27/50700164. She''s a witch of a much, much higher level.@k@v27/50700165. If you knew what she really was, it''d shock you!@k @v27/50700166.*cackle*cackle*!"'
33546: '@rWatching these two have their pleasant chat...@kwas another pair with steam rising from their black tea.'
33547: '@rHowever, this second pair was in a world that the first couldn''t see, where golden roses bloomed.'
33548: 'Battler@r@v10/50100142."......Ronove was kind enough to make us some of that Dimbula tea too."'
33549: 'BEATRICE@r@v27/50700168.".................................nn..."'
33550: '@rIt felt as though Beato muttered something.@k@rFor the first time, it felt as though she had been able to communicate something.'
33551: '@rSurely, she had taken an interest in the black tea and felt like drinking it...'
33552: '@rThinking this, Battler took Beato''s cup and her hand, and made her grip the cup...'
33553: 'BEATRICE@r@v27/50700168."...............nn, ..............."'
33554: '@rBeato''s eyes trembled sadly, and her fingers shook.'
33555: '@rAlmost as though she couldn''t even move her fingers as she wanted to...@k...and was mourning the fact that she could no longer even enjoy the tea she had once loved without assistance...@k That was how she looked...'
33556: '@rSo Battler rested his hand on Beato''s, softly took hold of the tea cup, and lifted it to her lips......'
33557: '@r......Then, ...though it was only a single mouthful, ...Beato sipped.'
33558: '@rThe days in which they had been in a killing-fest with red swords and blue wedges...@kalready seemed like the distant past.'
33559: '@rNow, not only was Beato unable to do that, ......it was even difficult for her to make her body do as she pleased.'
33560: '@rEven just drinking a mouthful of black tea like this was hard......'
33561: 'Battler@r@v10/50100143."......How is it?@k@v10/50100144. That rose aroma makes for a great black tea.@k@v10/50100145. Do you like it...?"'
33562: 'BEATRICE@r".............................."'
33563: '@rOf course,@k .........Beato didn''t respond.'
33564: 'Battler@r@v10/50100146."......What happened to you...?@k@v10/50100147. ......This is...another strategy, right?@k @v10/50100148.You''re pretending to be in a slump so you can shock me later."'
33565: 'BEATRICE@r"..........................."'
33566: 'Battler@r@v10/50100149."......If that''s what you''re after, the same trick won''t work again, so give it a rest.@k@v10/50100150. ......If you keep acting like that, even I''ll start to feel out of whack."'
33567: 'BEATRICE@r"..........................."'
33568: 'Battler@r@v10/50100151."Hey.@k@v10/50100152. ...Isn''t it about time for you to start laughing loudly, saying "Caught you, dumbass!" or something?@k@v10/50100153. Any kind of joke stops being funny if you use it too much.@k@v10/50100154. Especially if it''s a rehash."'
33569: 'BEATRICE@r"..........................."'
33570: 'Battler@r@v10/50100155."Laugh.@k@v10/50100156. Just like you''re cackling over there as you drink with Aunt Natsuhi."'
33571: 'BEATRICE@r"..........................."'
33572: 'Battler@r@v10/50100157."..............."'
33573: 'BEATRICE@r".................................................................................................................................................................."'
33574: 'Battler@r@v10/50100158."............Can''t you at least grin...?"'
33575: '@r@v28/52100122.@a1666."Never again.@k@v28/52100123. This child will never laugh again."'
33576: '@rThose sudden words......were exceedingly cruel.'
33577: 'Battler@r@v10/50100159."How can you say that for sure?!@k @v10/50100160.Quit trying to steal away Beato''s right to laugh."'
33578: 'BERNKASTEL@r@v28/52100124."......Oh, should I say it in red, then...?"'
33579: '@rI shook my head furiously.'
33580: '@rThen, with an expression that didn''t reveal her thoughts in the slightest, BERNKASTEL spoke while looking at Beato''s face.@k ......And I didn''t understand the word she used in the slightest.'
33581: 'BERNKASTEL@r@v28/52100125.@a1666."Congratulations."'
33582: 'Battler@r@v10/50100161.".........For what?"'
33583: 'BERNKASTEL@r@v28/52100126."Beato is like this as a result of your victory."'
33584: 'Battler@r@v10/50100162.".........What are you talking about......?"'
33585: 'BERNKASTEL@r@v28/52100127."You said something interesting in a previous game.@k@v28/52100128. You said that this would be eternal torture where you both torment each other.@k@v28/52100129. That was right.@k@v28/52100130. It was torture for Beato as well.@k@v28/52100131. And you won that torture game.@k@v28/52100132. ......That''s why Beato''s soul was killed, and why she became a doll-like corpse."'
33586: 'Battler@r@v10/50100163."Are you saying......that I did this to Beato?"'
33587: 'BERNKASTEL@r@v28/52100133."The battle ends when one of you loses the will to try and win.@k@v28/52100134. ......As far as the battle between you and Beato goes, the conclusion was already reached last time.@k@v28/52100135. Well, it probably happened without you noticing, though."'
33588: 'Battler@r@v10/50100164.".........In that case, why hasn''t the game ended when I''ve already won?@k@v10/50100165. ...Why is this game still continuing?"'
33589: 'BERNKASTEL@r@v28/52100136."The shackle attached to that girl''s ankle.@k@v28/52100137. ......That''s a rule Lambda made."'
33590: '@rEven if BEATRICE tries to yield or gets discouraged or gives up,@k she isn''t capable of stepping down from the game.'
33591: '@r......That''s the rule.@k Or maybe it''s a curse.'
33592: 'BERNKASTEL@r@v28/52100138."Some time ago, when it looked like you were going to give in,@k@v28/52100139. I gave you my support.@k@v28/52100140. Though you probably couldn''t perceive it,@k@v28/52100141. I assisted you by making sure that you would receive hints and things would go your way.@k@v28/52100142. That''s why you''re able to be here now.@k@v28/52100143. ............Do you remember? How I helped you?"'
33593: '@rBERNKASTEL stared at me...'
33594: '@r......It''s true I wasn''t aware of it,@k ......but maybe it was true...@kthat she had helped me.'
33595: 'BERNKASTEL@r@v28/52100144."In the same way, Lambda is supporting Beato.@k@v28/52100145. And this time, it''s Beato who''s on the verge of giving in.@k@v28/52100146. So to make sure that she doesn''t, this time it''s Lambda who''s been giving her support.@k@v28/52100147. That''s what the shackle is.@k@v28/52100148. By refusing to let her resign, she''s saved Beato within the game."'
33596: 'Battler@r@v10/50100166."......How is this "saving her"?"'
33597: 'BERNKASTEL@r@v28/52100149."This game was made with only two ways for it to end.@k@v28/52100150. Either one side accepts defeat and resigns,@k@v28/52100151. or one side wins the game with a checkmate.@k@v28/52100152. Beato was about to collide with the first way.@k@v28/52100153. That''s why Lambda crushed that chance and managed to just barely avoid her losing.@k@v28/52100154. That''s a wonderful bit of support within this game."'
33598: '@rIn that case, the only way left for this game to end......is for me to win.'
33599: '@rAt the very least, until I do win,@k this witch called LAMBDADELTA can probably try to buy time for Beato''s condition to turn back around.'
33600: '@rBut that......would just prolong Beato''s suffering even more...'
33601: '@rNeither of us want that.'
33602: '@rBoth Beato and I fought with all we had trying to win.'
33603: '@rIt was because we were both giving it everything we could muster that the game repeated several times to begin with.'
33604: '@rAnd that was also why, that one time,@k we confronted each other head-on with all of our strength.'
33605: '@rAnd Beato.........admitted defeat.'
33606: '@rShe said she wanted me to end this game...and entrusted everything to me.'
