36342: 'BERNKASTEL@r@v28/52100374."Of course.@k@v28/52100375. Anyone could have thought of that ridiculous move.@k@v28/52100376. I have more.@k@v28/52100377. Second one.@k@v28/52100378.@|@y @c279.@[Krauss carried the bodies off and hid them.@k@v28/52100379. You''re making it look like you''ve kidnapped Krauss and locked him up somewhere, but he might actually be free.@k@v28/52100380. Krauss has no alibi.@k@v28/52100381. Krauss hid their corpses.@]@c."'
