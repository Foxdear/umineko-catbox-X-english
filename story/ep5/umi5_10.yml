36339: 'BERNKASTEL@r@v28/52100370."Here''s the first one I can think of.@k@v28/52100371.@|@y @c279.@[The victims aren''t actually dead.@k@v28/52100372. They pretended to be dead, then secretly hid themselves somewhere.@k@v28/52100373. After all, you haven''t declared anyone''s death with the red truth.@]@c."'
