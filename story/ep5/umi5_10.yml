36344: 'BERNKASTEL@r@v28/52100382."Third one.@k@v28/52100383.@|@y @c279.@[The corpses were different people in the first place.@k@v28/52100384. They were substitute corpses made to look like the victims.@k@v28/52100385. George and the others were hiding from the beginning, and later cleared away the substitute corpses.@k@v28/52100386. The corpses were dead from the very beginning, so they don''t count towards the number of people on the island.@]@c."'
36345: 'LAMBDADELTA@r@v29/52200377."Ahhahhahhahahahahahahahaha!!@k @v29/52200378.What is that, that''s hilarious!!@k @v29/52200379.So all those people gathered around and looked at their dead faces, and not a single one of them realized that they were fakes?"'
