35923: '@r......Was it someone''s alarm clock?'
35924: '@rA repetitive electronic beeping noise filled the room......'
35925: '@rBattler, who had gone to bed late and hadn''t had anywhere near enough sleep yet,@k covered his head in his blanket and waited for someone to turn off the alarm.'
35926: '@r......But no matter how much time passed, the beeping didn''t stop.'
35927: '@r.........I see.'
35928: '@rThe point of an alarm clock isn''t just to be loud enough to wake you,@k but to be annoying enough to keep you from wanting to fall back asleep.'
35929: '@rHeyyyy... Guuyys... The alarm''s going off.@k Make it stop please......'
35930: '@rWhy do we always sound so annoyed when first waking up?'
35931: '@r......Well, it does makes sense.@k After all, we''re still sleepy and in a bad mood.'
35932: '@rHowever, there was absolutely no sign that my annoyed voice had caused anyone to turn over in their sleep,@k much less crawl out of bed to stop the alarm.'
35933: '@rLetting out a deep sigh, I flung the covers off me and got up.'
35934: '@rWith the shutters down on the windows, there was almost no light getting in, and the room was as dim as it had been earlier.'
35935: '@rThough even if the shutters hadn''t been down,@k there''s no way that this dull weather would have let in enough sun to make this a pleasant morning.'
35936: '@rMy cousins were still wrapped up in their beds, sound asleep and taking no notice whatsoever of that beeping.'
35937: '@rNormally, once any one person gets up, the others tend to automatically follow...'
35938: '@r......Annoyed that the Law of Consecutive Summer Camp Awakenings that I''d come up with had just been broken, I drowsily searched for the source of the sound.'
35939: '@rI could hear it coming from a wristwatch set on a table.'
35940: '@rJudging by the style of the watch, it was probably George-aniki''s.'
35941: '@rTaking a random guess, I pushed a small button on the side of it, and the sound stopped.'
35942: '@rApparently, it had been set for seven in the morning.@k@r........Is it already seven?'
35943: '@rSorry, but I really don''t feel like I slept at all......'
35944: '@rPlaying cards had been left on the table as though they had stopped mid-game.'
35945: '@r......The game looked like sevens.'
35946: 'Battler@r@v10/50100740."................................."'
35947: '@rDammit, ......I''ve got a piercing headache.'
35948: '@rWhat the hell was all that last night?'
35949: '@r......That mountain of gold and the subsequent argument between our parents...it all feels like a bad dream...'
35950: 'Battler@r@v10/50100741."............So stupid..."'
35951: '@rBreakfast normally starts at eight.@k@r......Now isn''t a bad time to start getting up and getting dressed.'
35952: '@rThe adults probably won''t argue in front of us cousins.'
35953: '@r......In that case, I think I''ll stay with my cousins all day long.'
35954: '@rI''m sure they''ll be able to keep me away from all that annoying talk about the gold and being the successor and all......'
35955: '@rIn fact, I should have done that in the first place...'
35956: '@rI slept with my clothes on last night, too, so I''m drenched in sweat... Gross.'
35957: '@r......I guess I''ll take a shower.'
35958: '@rI''m sure the others want to too.'
35959: '@rAt this age, it''s embarrassing to wake them by shaking their shoulders.@k@rIf I turn the TV on, everyone will probably wake up.@k@rWell, let''s at least turn the lights on for now.'
35960: '@r......In this dim light, with the quiet sound of the continuing wind and rain, it really doesn''t feel like morning''s come yet.'
35961: '@rI flipped the light switch.@k And then, that dimly lit morning ended.'
35962: 'Eva@r@v05/51000176.".........George...... .........Geeeooooooooorge!!!"'
35963: 'Hideyoshi@r@v06/51100128."This is just too much......@k@v06/51100129. How...could anyone get away with something like this...?!!"'
35964: '@rAs they clung to Aniki''s corpse, knowing that he would never wake up again,@k ......Auntie Eva and Uncle Hideyoshi cried.'
35965: 'Nanjo@r@v19/51900040."......Please, let him go now.@k@v19/51900041. Do you think George-kun would like the two of you to see him this way...?@k @v19/51900042.Of course not...!"'
35966: 'Rudolf@r@v08/51200134.".........Aneki.@k@v08/51200135. I know how you feel, but let''s have Doctor Nanjo handle this..."'
35967: 'Eva@r@v05/51000177."How could you understand?!@|@y@k @v05/51000178.George was killed!@k @v05/51000179.George!!@k @|@y@v05/51000180.Geoooooooooorge, ugghaaaaaaaaaaahhhhh!!"'
35968: 'Hideyoshi@r@v06/51100130."Doctor Nanjo''s right.@k@v06/51100131. We mustn''t keep looking at George like this...@k@v06/51100132. ......This is for his sake!@k @v06/51100133.We''ve gotta hold back for now...!"'
35969: '@rWhen Auntie Eva tried even harder to cling to that corpse,@k Dad and Uncle Hideyoshi dragged her away and had a heated debate with her beside the wall...'
35970: 'Eva@r@v05/51000181."No, nooooooooooooo!! Geooooooooorge!!@k@v05/51000182. Doctor Nanjo! Help him!!@k@v05/51000183. If he''s lost too much blood, do a blood transfusion!!@k @v05/51000184.George and I are the same blood type!!@k @v05/51000185.I beg you!@k @v05/51000186.Doctor Nanjo!!"'
35971: 'Nanjo@r@v19/51900043.".....................Eva-san.@k@v19/51900044. ...It pains me to say this,@v19/51900045. ......but what George-kun needs right now isn''t your blood..."'
35972: '@rDoctor Nanjo shook his head slightly, then nodded across to where I stood.'
35973: '@rI softly pulled the blanket up......and covered George-aniki''s body.'
35974: '@rHis throat......had been split wide open.@k@r...The wound was probably.....larger and deeper than his mouth.@k@rDid it look like a clean and neat corpse now that his neck was at least covered...?'
35975: '@rOf course not...'
35976: '@r......The large amount of blood that had spilled from the wound stained the bed a horrible dark red,@k ......and even covering him with the blanket couldn''t hide the blood that had poured out.'
35977: '@rAfter all, there were large, dark red stains on the blanket too,@k so that even once he was covered with it, the gruesomeness of the body was still being thrust in our faces......'
35978: '@rSo I stripped the blankets off of my bed and placed one on top.'
35979: '@r......But I only had two blankets.'
35980: '@rSo if I covered just one more body, ......I wouldn''t be able to cover any more.'
35981: '@rFeeling pity for the ones I couldn''t cover,@k......for some reason, in spite of the situation, ...I muttered "don''t complain about not getting the same as everyone else" inside my head......'
35982: 'Rudolf@r@v08/51200136."......Kyrie.@k@v08/51200137. Pull their blankets over them.@k@v08/51200138. ...They''ll catch cold."'
35983: 'Kyrie@r@v09/51300082."..................Sure."'
35984: '@rKyrie-san and I covered the other bodies with their blankets in the same way as George-aniki''s...'
35985: '@r......So that they wouldn''t have to suffer the indignity...of having their terrible wounds exposed like this anymore......'
35986: '@rIn one bed......rested Jessica.'
35987: '@r......Jessica was exactly the same as George-aniki.'
35988: '@rThough she appeared to be resting quietly in the bed...@k......her throat had been sliced deep and the wound lay open in a brutal way......'
35989: '@rAnd Maria was the same.'
35990: '@r......Not only Maria.'
35991: '@rThere was one more victim.'
35992: '@rLying on the same bed, sleeping alongside her,@w500. ......was Auntie Rosa.'
35993: '@rGeorge-aniki, Jessica, Maria, ...and Auntie Rosa.'
35994: '@r......In this room were four people who had been killed, their throats sliced open.'
35995: '@rThey''d probably been like that since last night.'
35996: '@r......And I came back to the room completely ignorant, snuggled under the covers, and fell asleep right next to them.........'
35997: '@r.........All of them had a horizontal cut across their throats.'
35998: '@rI had been...forced to see all the way......into the depths of those gashes in everyone''s throat...'
35999: '@rThose cuts might even have reached as far as halfway into their necks.'
36000: '@r......If you tried to open one up, you''d probably be able to see that the gash reached all the way to the bone.'
36001: '@rThe only wounds were the single gash on each neck.'
36002: '@r......So if you just covered their necks with your hand,@k ......you might be able to persuade yourself that they were merely sleeping.'
36003: '@rBut even so,@w500. ......this frighteningly deep wound...@w666.......was incredibly...@w500....gruesome......'
36004: '@rThere''s no such thing as "clean" or "dirty" ways of killing.@k@r...All methods of killing are equally brutal.'
36005: '@rBut even so,@w583. .........this was incredibly...@w333....brutal...............'
36006: '@rAnd...there was one more thing which adorned these brutal murders to make them even more unsettling.'
36007: '@rDrawn very large on the wall...@k......was something like an eerie magic circle.'
36008: '@rIt was drawn in a bright red paint which looked like blood,@k making it look as though some disturbing ritual had taken place in this room,@k with the four of them offered as human sacrifices...'
36009: '@rHowever, none of us were paying it any attention.'
36010: '@r......No one has a heart so cold that they could witness the deaths of those close to them...@k...and still worry about some graffiti on the wall...'
36011: 'Erika@r@v46/54500245.".........Good morning, everyone.@k@v46/54500246. .........Oh, ......what a wonderful magic circle."'
36012: '@rThe girl who bragged that she drew more pleasure from the process of exposing the truth than from the truth itself,@k ......and who went so far as to call herself an intellectual rapist, ......appeared in the hall.'
36013: '@rWhen she saw the extraordinarily creepy magic circle in this gruesome room,@k I heard what was unmistakably a sigh of admiration escape her lips...'
36014: 'Battler@r@v10/50100742."You...............don''t come in here......"'
36015: 'Erika@r@v46/54500247."............I overheard the details from the corridor.@k@v46/54500248. Is it four people who have passed away?@k @v46/54500249.......Allow me to express my sincere condolences."'
36016: '@rOn Erika''s face...@w583....no, that''s not it.@k It was in her eyes.'
36017: '@r......In Erika''s eyes, I could see...@w500....a shameless smile...@w583....that was hard to describe.'
36018: '@rShe found this...entertaining.@k@r......She found the outbreak of a crime...@w583....entertaining...'
36019: '@rIt was like the smile of a kid waiting in the wings at a school play,@k moments before she was due to come on stage...'
36020: 'Rudolf@r@v08/51200139."......Sorry, Erika-chan.@k@v08/51200140. We''re busy at the moment.@k@v08/51200141. ......Could you wait in your room?"'
36021: 'Erika@r@v46/54500250."............I''m afraid not.@k@v46/54500251. It''s the detective''s right to investigate the scene."'
36022: 'Battler@r@v10/50100743."We said we don''t want you here...!@k @v10/50100744.You''re not one of the family, so have the respect to back off!!"'
36023: 'Erika@r@v46/54500252.".........It is a disappointing, third-rate mystery in which the suspect blocking access to the murder scene turns out to be the culprit.@k@v46/54500253. ......At least, in my humble opinion...?"'
36024: 'Battler@r@v10/50100745."Who gives a damn about what you want?!!@k @v10/50100746.Get out!!@k @v10/50100747.No one needs you here!!"'
36025: 'Hideyoshi@r@v06/51100134."Erika-chan...!@k @v06/51100135.I''m real sorry about this, but could you return to your room?!@k @v06/51100136.We''re busy here!"'
36026: 'Eva@r@v05/51000187."Geooooooooooorge,@v05/51000188. Geooooooooooorge,@v05/51000189. waaaaaaaaaaaaahhh!!"'
36027: 'Erika@r@v46/54500254."......Move out of the way, please.@k@v46/54500255. I can''t investigate the crime scene."'
36028: 'Battler@r@v10/50100748."If there''s a need for that, we''ll do it ourselves or leave it to the police!@k @v10/50100749.Like hell you have the right to defile their bodies even further!!"'
36029: 'Erika@r@v46/54500256.@|@y"@c900.@[Detective''s authority.@k@v46/54500257.@|@y ......The detective has the right to investigate all crime scenes.@k@v46/54500258.@|@y Move out of the way, Ushiromiya Battler.@k@v46/54500259. @|@yThis is my legitimate right within the game, as granted to the Human side.@]@c."'
36030: '@rThose words, which seemed to be utterly ridiculous at first,@k ......were words of power that had come from a world much higher than theirs.'
36031: '@rBattler was thrown back by an unseen power and landed on his butt.'
36032: '@rStruck silent by Erika''s quiet intensity and the bizarre, suffocating atmosphere, ......nobody was able to prevent her from entering the room...'
36033: 'Erika@r@v46/54500260.".........Rest assured,@k@v46/54500261. my goal is not to profane the dignity of the deceased.@k@v46/54500262. And I have no desire to peer into the ghastly gashes in their throats.@k@v46/54500263. ......What I wish to ascertain is something completely different."'
36034: 'Erika@r@v46/54500264."Namely, who committed these murders.@k@v46/54500265. .........Doctor Nanjo and the rest of you,@k@v46/54500266. ......and particularly Battler-san, the first to discover the bodies:@k@v46/54500267. .........I have a number of questions for you, so I hope you will oblige me."'
36035: 'Battler@r@v10/50100750."A-......are you listening?! What gives you the right...?!"'
36036: 'BERNKASTEL@r@v28/52100352.@|@y"@c900.@[Because I am the detective.@]@c."'
36037: '@rBattler couldn''t argue against this incomprehensible nonsense.@k@r......No, ...he wasn''t permitted to argue.@k@rIt was a restriction...placed on pieces.'
36038: '@rErika summoned Doctor Nanjo and got him to tell her in detail about his preliminary findings.'
36039: '@r......Normally, he wouldn''t have spoken of that to an outsider so casually.'
36040: '@r...However, for some reason, the atmosphere about the place had begun to make it feel as though nothing should be hidden from Erika...'
36041: 'BERNKASTEL@r@v28/52100353.".........Okay, let''s enjoy this first twilight of Lambda''s.@k@v28/52100354. Four corpses?@k @v28/52100355.That''s two corpses short.@k@v28/52100356. ......Well, she doesn''t necessarily have to see to it that six people are killed, but that''s how we''ve been playing.@k@v28/52100357. That girl isn''t completely clueless, so she must have killed two more people somewhere."'
36042: '@rThere''s a magic circle on the wall representing the first twilight, similar to the ones in Beato''s games.'
36043: '@r*giggle*, that girl talks big, but I wonder just how closely she can imitate Beato.'
36044: '@r*giggle*giggle*, ahhahahahahaha...!'
36045: '@rYour Hebrew sure is crappy, Lambda.@k You''ve got this part slightly wrong.'
36046: 'Mammon@r@v42/52700001."......What the heck...@k@v42/52700002. What''s going on?@k @v42/52700003.Why''s there a magic circle?"'
36047: 'Asmodeus@r@v44/52900001."I''ll bet someone wanted to try imitating BEATRICE-sama.@k@|@y@v44/52900002. Aha, what a crappy magic circle...!"'
36048: 'Satan@r@v40/52500001."This isn''t some funny imitation!@k @v40/52500002.Some Human deliberately drew this to make it look like BEATRICE-sama''s own work...!@k @|@y@v40/52500003.Anyway, let''s report to BEATRICE-sama about this!"'
36049: 'Mammon@r@v42/52700004."Even though we''re already up to our eyeballs just protecting GOLDSMITH''s secret... ...What a pain."'
36050: 'Asmodeus@r@v44/52900003."These murders have no beauty to them at all.@k@v44/52900004. ......It isn''t a locked room or anything, and there''s nothing impossible about it.@k@v44/52900005. Sloppy murders like this aren''t worthy of BEATRICE-sama at all."'
36051: 'Satan@r@v40/52500004."...Furudo Erika...@k@v40/52500005. ......An unexpected woman for an unexpected crime.@k@v40/52500006. ......And there''s that unexpected man from 19 years ago.@k@|@y@v40/52500007. .........And if you add on the fact that Battler''s already solved the epitaph, this game is completely different than normal.@k@v40/52500008. ...What the heck''s going on...?!@k @|@y@v40/52500009.Let''s go!!"'
36052: '@r@v00/awase5003.""Yes, Onee-sama!!""'
