39537: '@r@z70.After being forced into an unwanted marriage,@k Natsuhi developed a grudge against the Ushiromiya family and was filled with a desire for revenge.@k@r(*Trial Summary, p.3)'
39538: '@r@z70.As revenge for financially ruining her birth family,@k Natsuhi also plotted to take over the Ushiromiya family''s fortune.@k@r(*Trial Summary, p.4)'
39539: '@r@z70.When Natsuhi learned that the wealth of the Ushiromiya family was for all intents and purposes controlled by Kinzo himself,@k she initiated sexual relations to curry favor with him and managed to ensnare him.@k@r(*Trial Summary, p.7)@k@r(*BERNKASTEL Documents, p.682)'
39540: '@r@z70.To curry favor with Kinzo,@k Natsuhi repeatedly disguised herself as BEATRICE, a witch and figment of Kinzo''s imagination, and engaged in sexual acts.@k@rKinzo saw Natsuhi dressed as the mistress from his past and was easily ensnared.@k@rAdditionally, a servant happened to witness her in this outfit, forming part of the basis for the legend of the witch.@k@r(*Trial Summary, p.8)@k@r(*Submitted Evidence #17)@k@r(*BERNKASTEL Documents, p.802)'
39541: '@r@z70.However, late at night on 1986-10-04, Ushiromiya Battler discovered the hidden gold.@k@rNatsuhi planned the crimes after the relatives raised a fuss and insisted that Battler should succeed the headship.@k@rShe murdered the children in the "cousins'' room" and tried to frame Battler for the crime.'
39542: '@r@z70.Furthermore, Genji was murdered because he was opposed to this scheme.@k@rLater on, Hideyoshi was also murdered.@k@rAfter this point, Natsuhi displayed a strong intent to murder all those involved without discrimination.@k@r(*Trial Summary, p.27)@k@r(*Supplemental Materials B, p.61)@k@r(*BERNKASTEL Documents, p.1103)'
39543: '@r@z70.The concrete details of the crimes are as follows:'
39544: '@r@z70.1986-10-04 24:00.@k@rNatsuhi decided to commit the crimes.'
39545: '@r@z70.Because Genji refused to assist her when asked, she murdered him.'
39546: '@r@z70.She then murdered her husband Krauss in his own room.@k@r(*Trial Summary, p.40)@k@r(*Supplemental Materials S, p.8)@k@r(*BERNKASTEL Documents, p.1105)@k@r(*Great Court Internal Documents: Library of Law A09 #9974)'
39547: '@r@z70.Afterwards, she went to the "cousins'' room" on the upper floor of the guesthouse,@k waited for Rosa to join the rest, and killed George, Jessica, Maria, and Rosa.'
39548: '@r@z70.She mutilated the necks of the bodies.'
39549: '@r@z70.Afterwards, because there were people in the downstairs lounge, she waited in an empty room upstairs.'
39550: '@r@z70.She hid in this empty room until the people in the lounge dispersed and went to bed.@k@r(*Trial Summary, p.41)@k@r(*Supplemental Materials S, p.10)@k@r(*BERNKASTEL Documents, p.1131)@k@r(*Great Court Internal Documents: Library of Law A09 #9974)'
39551: '@r@z70.The people in the lounge dispersed just after 3 a.m.'
39552: '@r@z70.Natsuhi left the empty room and escaped from the guesthouse.'
39553: '@r@z70.She returned to her room, where she met up with Kinzo, who had been hiding there.@k@rThey spent the rest of the night there together.'
39554: '@r@z70.Kinzo left the room early next morning and concealed himself somewhere near the guesthouse.@k@r(*Trial Summary, p.41)@k@r(*Supplemental Materials S, p.29)@k@r(*BERNKASTEL Documents, p.1200)@k@r(*Great Court Internal Documents: Library of Law A09 #9974)'
39555: '@r@z70.Afterwards, Kinzo saw his chance and carried off the bodies of the six victims one by one, hiding them.@k Unfortunately, these hidden bodies have not been found.@k@r(*Trial Summary, p.42)@k@r(*Supplemental Materials S, p.37)@k@r(*Great Court Internal Documents: Library of Law A09 #9974)'
39556: '@r@z70.Natsuhi, who had failed in her scheme to cast suspicion on Battler, changed her plan to include the murder of all present.@k@r(*Trial Summary, p.58)@k@r(*Supplemental Materials T, p.19)@k@r(*BERNKASTEL Documents, p.1348)@k@r(*Great Court Internal Documents: Library of Law A09 #9974)'
39557: '@r@z70.Predicting that one of those present would eventually want to take a rest in a private room,@k Natsuhi concealed herself inside a closet in one of the guest rooms.'
39558: '@r@z70.When Hideyoshi visited that room at approximately 13:00, she murdered him.@k@r(*Trial Summary, p.61)@k@r(*Supplemental Materials T, p.26)@k@r(*Great Court Internal Documents: Library of Law A09 #9974)'
39559: '@r@z70.Natsuhi once again concealed herself in the closet from the time the others became aware of the incident to the time that they carried out Hideyoshi''s body.@k@rFurthermore, as proof of this, a button from Natsuhi''s clothes was found in the closet.'
39560: '@r@z70.Afterwards, she exited the closet and tried to return to her own room.'
39561: '@r@z70.However, Furudo Erika discovered her on the way, and Natsuhi confessed to her crimes after questioning.@k@r(*Trial Summary, p.63)@k@r(*Supplemental Materials T, p.32)@k@r(*Submitted Evidence #26)@k@r(*BERNKASTEL Documents, p.1348)@k@r(*LAMBDADELTA Documents, line 7)@k@r(*Great Court Internal Documents: Library of Law A09 #9974)@k@r(*Great Court Internal Documents: Legal Mgmt. U99 #0107)@k@r(*Great Court Official Notice #01724434)'
39562: '@r@z70.Great Court Official Notice #01724434@k@rTrial of Illusions #0147-007982 (1986-10-05 24:00) decides as follows:@k@rUshiromiya Natsuhi confessed to the crimes.@k@rFor a period of 13 months following this announcement, related documents may be perused at the Great Court Legal Offices Document Management Center, First Subsection.@k@rGreat Court Deputy Attorney General@k@rChief Inquisitor@k@rDlanor A. Knox'
39563: 'Natsuhi@r@v03/50901083."Then just say that I did it, okay?!@k @v03/50901084.That''s what you want me to say, right?!@k @v03/50901085.Waaaaaaaaaaaaaahhhhhh...!!!"'
39564: '@rAs though she had given up and decided that it would be useless to try and talk her way out of this any longer,@k Aunt Natsuhi said that and screamed.'
39565: '@r......It was a sad incident.'
39566: '@rI wanted to believe that, despite the pitiable circumstances which led to her marriage into the Ushiromiya family,@k ......Aunt Natsuhi had been able to find some small measure of happiness with Uncle Krauss and Jessica.'
39567: '@r......But instead, by Aunt Natsuhi''s own hand, Uncle Krauss,@w583. ......and even her beloved daughter Jessica,@w500. ......had been heartlessly killed...'
39568: '@rIt was even harder to believe that Grandfather had been an accomplice and hid the bodies...'
39569: '@rHowever, several people had given clear testimony that Grandfather''s mental state for these last few years...@khad been far from what anyone would consider normal.'
39570: '@rPerhaps, possessed by a mad devotion to the mistress he had lost long ago,@k ......Grandfather might truly have believed that Aunt Natsuhi was a reincarnation of BEATRICE.'
39571: '@rWhere is Grandfather now?'
39572: '@rLike Erika theorized,@k did he really believe that he could revive BEATRICE by carrying out murders following the epitaph,@k and succumb to Natsuhi''s cajolery?'
39573: '@r......Right now, is he holding some kind of disturbing ritual with the bodies he carried away......?'
39574: 'Natsuhi@r@v03/50901086."Are you............@v03/50901087.......satisfied now.........?@k @v03/50901088.......This...@v03/50901089....is what you wanted to make me say, right......?"'
39575: '@rAunt Natsuhi sobbed as she spoke.'
39576: 'Natsuhi@r@v03/50901090."......This is...@v03/50901091.......your revenge, isn''t it......?@k @|@y@v03/50901092.You, the man from 19 years ago...!!"'
39577: '@rThis "man from 19 years ago" that Aunt Natsuhi kept mentioning was the man who had supposedly framed her.'
39578: '@rHowever, referring to "a man from 19 years ago" was as far as she would go,@k and she made no attempt at all to explain what had actually happened back then...'
39579: 'Natsuhi@r@v03/50901093."I''m certain......that a pawn of that man is among us now.@k@v03/50901094. ......I''m sure that right now, that man is ridiculing me through one of you..."'
39580: 'Natsuhi@r@v03/50901095.".........So tell me...!@k @v03/50901096.Are you happy now?@k @v03/50901097.Has a little of that pain and suffering you''ve endured for 19 years gone away...?!@k @|@y@v03/50901098..........I finally understand.@k@v03/50901099. ...The reason you brought me down to this point......is because......you wanted to make me admit it, isn''t it......?"'
39581: 'Erika@r@v46/54501264."......Natsuhi-san.@k@v46/54501265. Other than us, there''s absolutely no one here.@k@v46/54501266. Please stop this insanely desperate charade and quit pretending that someone who doesn''t exist actually does."'
39582: '@rErika laughed mockingly, but, as Aunt Natsuhi looked at us...'
39583: '@r......no, as she looked at some being behind us, ......she hung her head and shook.'
39584: '@rThen, .........she confessed to her sin.'
39585: 'Natsuhi@r@v03/50901100."I.........committed murder......"'
39586: 'Erika@r@v46/54501267."So you finally admit your crime directly."'
39587: 'Natsuhi@r@v03/50901101."No,@k@v03/50901102. this is not about what has happened today and yesterday.@k@v03/50901103. .........I confess to a murder that occurred 19 years ago."'
39588: '@rThe adults all whispered together, wondering what this was about.@k@r......Because they had never heard about a murder case 19 years ago.'
39589: 'Natsuhi@r@v03/50901104."......19 years ago,@k@v03/50901105. ......I.........committed a sin.@k@v03/50901106. .........I couldn''t tolerate it.@k@v03/50901107. ......That.........baby...!!"'
39590: 'Erika@r@v46/54501268."Baby?@k @v46/54501269.Now what are you talking about?"'
39591: 'Natsuhi@r@v03/50901108."......On that day 19 years ago,@k@v03/50901109. ...Father entrusted me with a baby.@k@v03/50901110. .........Since I was having so much trouble conceiving a successor, Father told me to adopt a child,@k@v03/50901111. ......and he brought me a baby which he said was from a welfare institute......and he put it in my arms..."'
39592: 'Natsuhi@r@v03/50901112."Do you have any idea......how humiliating that was to me as a woman...?!"'
39593: '@rWith a mix of conflicting emotions, of anger, sadness, regret and possibly defiance,@k Aunt Natsuhi confessed.'
39594: '@rThe humiliation as a woman that others had given up hope on her ever bearing a child.@k@rAnd also, the indescribably unpleasant feeling of being made to nurse a strange baby.'
39595: '@rIt caused her great sadness and rage,@k and before very many nights passed, it ate a hole into her heart......'
39596: 'Natsuhi@r@v03/50901113.And then, ......I sold my soul.........to demons...'
39597: 'Natsuhi@r@v03/50901114..........It happened when I went on a walk through the rose garden to the harbor, along with a servant holding the baby...'
39598: 'Natsuhi@r@v03/50901115.......I wanted to be alone,@k@v03/50901116. ......but that servant woman holding the baby faithfully followed me everywhere.'
39599: 'Natsuhi@r@v03/50901117.I was unable even to tell her to stop following me, ......and therefore unable to escape from the child''s crying......'
39600: 'Natsuhi@r@v03/50901118..........That day...@k@v03/50901119.marked the beginning of 19 long, headache-filled years......'
39601: 'Natsuhi@r@v03/50901120..........Then, we were by the fence overlooking the cliff.'
39602: 'Natsuhi@r@v03/50901121.If by taking that baby...@v03/50901122....and throwing it down onto the rocky beach far below me,@v03/50901123. ......I could make all this go away...'
39603: 'Natsuhi@r@v03/50901124.......I really did hear that demonic temptation in my ear.'
39604: 'Natsuhi@r@v03/50901125.And.........for the smallest of moments, I thought of how wonderful it would be if I really could do that,@k@v03/50901126. ......and lent an ear to that temptation.@k@v03/50901127. ......And that was when—'
39605: 'Natsuhi@r@v03/50901128.The servant holding the baby stepped on a large rock, twisted her ankle, and staggered......'
39606: 'Natsuhi@r@v03/50901129.She leaned against the rough fence, ......and at that moment, I thought I heard the fence creak loudly.'
39607: 'Natsuhi@r@v03/50901130.I told her to look out and went to grab her shoulder.'
39608: 'Natsuhi@r@v03/50901131.......No,@v03/50901132. ......I shouldn''t be so vague...@k@v03/50901133. I''ll repent.@k@v03/50901134. I''ll confess.@k@v03/50901135. .........At that moment, I''m sure that......as I told her to look out,@k@v03/50901136. ............with both hands,@v03/50901137. I reached for that servant''s shoulders,@v03/50901138. and with a thud,@v03/50901139. ......I pushed her away hard......'
39609: 'Natsuhi@r@v03/50901140.The rough fence snapped from the base,@k@v03/50901141. .........and the servant,@v03/50901142. ......along with the baby held in her arms,@k@v03/50901143. .........fell down towards the rocky beach below......'
39610: 'Natsuhi@r@v03/50901144.Even though...@v03/50901145....I remember that moment vividly,@k@v03/50901146. ...for some reason I recall a vague...@v03/50901147....and very strange feeling.'
39611: 'Natsuhi@r@v03/50901148.It almost felt as though instead of falling,@k@v03/50901149. ......the two of them were silently swallowed up into empty space.'
39612: 'Natsuhi@r@v03/50901150.So I never even heard the sound of them crashing to the rocky beach.'
39613: 'Natsuhi@r@v03/50901151.No, I must have heard it.'
39614: 'Natsuhi@r@v03/50901152.But because I wanted to think that they''d simply disappeared,@k@v03/50901153. ......I must have erased that sound from my memory...'
39615: 'Battler@r@v10/50101246.".........A-.........and then.........?"'
39616: 'Natsuhi@r@v03/50901154."For an instant, ...I thought it was a dream.@k@v03/50901155. ......It was high enough that I couldn''t see the two of them below me just by leaning over.@k@v03/50901156. So I couldn''t tell whether their fall, ......the events of just a few seconds earlier, had actually happened or not..."'
39617: 'Natsuhi@r@v03/50901157.I must have been wishing so strongly that the child would fall from there...@k@v03/50901158.that I hallucinated the whole thing...'
39618: 'Natsuhi@r@v03/50901159.Trying to make myself believe this, I hurried back to the rose garden.@k@v03/50901160. ......I decided to say that I''d left the baby with the servant and had been taking a rest alone in the garden...'
39619: 'Natsuhi@r@v03/50901161.......Then,@v03/50901162. .........Father asked what had happened to the baby,@v03/50901163. ............@k@v03/50901164..........which caused a stir over the disappearance of the servant...@v03/50901165.......who I''d left the baby with.........'
39620: '@rEventually, the broken fence was discovered,@k .........and the two corpses were found at the bottom of the cliff...'
39621: '@r......The baby''s origins apparently couldn''t be made known, so its existence was hushed up,@k ......and the official story was that the servant simply died in an accident alone.'
39622: 'Natsuhi@r@v03/50901166.That''s right.'
39623: 'Natsuhi@r@v03/50901167.I......stole away two innocent lives in one go.........'
39624: 'Natsuhi@r@v03/50901168.As for the poor servant......her family was generously compensated.'
39625: 'Natsuhi@r@v03/50901169.This was enough to satisfy her aged husband, who grieved over the unfortunate accident—he never knew the truth.'
39626: 'Natsuhi@r@v03/50901170.Then, just a few years ago, he died of old age, .........and I confessed the truth over his grave, apologizing.'
39627: 'Natsuhi@r@v03/50901171.".........But to this day...@k@v03/50901172.......I have never apologized to that baby.@k@v03/50901173. ......Yes,@v03/50901174. .........that''s what you''re after, isn''t it......?"'
39628: 'Natsuhi@r@v03/50901175."So right here, right now, I''ll confess to my crime!@k @v03/50901176.......I, Ushiromiya Natsuhi,@v03/50901177. .........did 19 years ago...@k@v03/50901178.......push you off a cliff...@v03/50901179....and try to kill you......"'
39629: 'Natsuhi@r@v03/50901180.......But...@v03/50901181.......you didn''t die after all......'
39630: 'Natsuhi@r@v03/50901182..........You''re still alive,@v03/50901183. ......and you still call me "Mother"...'
39631: 'Natsuhi@r@v03/50901184..........You came to this island,@v03/50901185. .........and took your revenge on me, didn''t you......?'
39632: 'Natsuhi@r@v03/50901186.When you learned...'
39633: 'Natsuhi@r@v03/50901187.......that you were pushed off a cliff by the woman you should have been calling a mother for the past 19 years,@k@v03/50901188. ......you must have lived a life so full of hatred...'
39634: 'Natsuhi@r@v03/50901189."......And now, ......you''ve taken everything I''ve gained since pushing you off that cliff,@k@v03/50901190. 18 years of my life, ......and smashed it all to pieces...@k@v03/50901191. ......I no longer have my beloved husband or daughter.@k@v03/50901192. ......And I''ve lost even my honor,@v03/50901193. ......and am being called a murderer...@v03/50901194. .........No, ......I really am a murderer, aren''t I......"'
39635: 'Natsuhi@r@v03/50901195."Yes, that''s right.@k@v03/50901196. ......It all went according to your plans.@k@v03/50901197. ......I''m now regarded as a killer..."'
39636: 'Natsuhi@r@v03/50901198."...............How is this for you...?@k @v03/50901199.Is this enough...@v03/50901200....for your revenge......?"'
39637: 'Natsuhi@r@v03/50901201."My husband and daughter have been killed!!@v03/50901202. ......I''ve been made to look like a murderer......like an adulteress even......@k@v03/50901203. After seeing me put through such terrible humiliation,@k@v03/50901204. ............are you satisfied......?!"'
39638: 'Natsuhi@r@v03/50901205."Yes, I''ll bet you''re quite satisfied...@k@v03/50901206. ......Because my family...@v03/50901207....my honor...@v03/50901208.......everything.........has been taken from me......@k@v03/50901209. ......Uuughuu...@v03/50901210....*hic*......@v03/50901211.uuuuughhuuhhuuu!!"'
39639: 'Erika@r@v46/54501270.".........After all this, you still claim that you were framed?@k @|@y@v46/54501271.Seriously, you just don''t know when to give up."'
39640: 'Natsuhi@r@v03/50901212."Can you hear me?! You, the cursed baby from 19 years ago...!!@k @v03/50901213.Are you satisfied now?!@k @v03/50901214.You''ve taken everything from me!!@k @v03/50901215.What more do you want?!@k @v03/50901216.......Please,@v03/50901217. ......just...@v03/50901218.......forgive me............"'
39641: 'Battler@r@v10/50101247.@a1666."......No good."'
39642: 'Natsuhi@r@v03/50901219."Huh.........?"'
39643: 'Erika@r@v46/54501272.".........Battler-san,@k@v46/54501273. did you say something?"'
39644: 'Battler@r@v10/50101248."No good at all."'
39645: 'Natsuhi@r@v03/50901220.".........B-@v03/50901221..........Battler......ku......n......?"'
39646: 'Battler@r@v10/50100835.@e@s50.".........Yeah.@|@y@v10/50101250. ...It''s no good...@|@y@v10/50101251. It''s no goddamn good at all......"@|@y'
39647: 'Natsuhi@r@v03/50901222.@e@s50."Ah......@|@y@v03/50901223..........aaahhhh...............!!"@|@y'