39648: 'BERNKASTEL@r@v28/52100771."......Erika, Dlanor."'
39649: 'Erika@r@v46/54501274."Yes, my master."'
39650: 'Dlanor@r@v47/54600344."You CALLED?"'
39651: 'BERNKASTEL@r@v28/52100772."......I want you two to stay in this fragment...@k@v28/52100773....and explain everything in the remaining first through fourth games.@k@|@y@v28/52100774. That pitiful transient witch no longer exists to assert her witch illusions.@k@v28/52100775. Expose the naked truth with extreme prejudice."'
39652: 'Erika@r@v46/54501275."*giggle*! Leave it to me, my master.@k@v46/54501276. There is no mystery that Furudo Erika cannot solve."'
39653: 'BERNKASTEL@r@v28/52100776."......Of course.@k@v28/52100777. That''s why you''re my piece, my double.@k@v28/52100778. *giggle*giggle*giggle*!"'
39654: '@rBERNKASTEL wore a massive...and horrible smile, which Erika shared.'
39655: '@r......BEATRICE''s witch illusions would disappear,@k and the results of all of the previous games would be painted over.'
39656: '@rIt had been crushed in every way possible, ......and only the naked truth remained.'
39657: '@rTo Erika, such a weak truth might as well have been fish on a chopping board...'
39658: 'Erika@r@v46/54501277."All four prior games...@k@v46/54501278.can be explained as either Natsuhi''s crimes or freak exceptions.@k@v46/54501279. I won''t let anyone talk about them as the crimes of some witch called BEATRICE again.@k@v46/54501280. I''ll start compiling it together at once and present you a first-rate tale."'
39659: 'BERNKASTEL@r@v28/52100779."*giggle*......@k@v28/52100780. You mustn''t leave even a single fragment of Beato''s Legend of the Witch behind.@k@|@y@v28/52100781. The rumors among the servants, the way people talked about unexplained events as though a witch was the cause,@k@v28/52100782. the witch illusions used alongside the illusion of Kinzo.@k@v28/52100783. ......Deal with all of them completely."'
39660: 'Erika@r@v46/54501281."Of course.@k@v46/54501282. I''ll get to it right away.@k@v46/54501283. ......We currently have the furniture in custody.@k@v46/54501284. We''re hurrying to identify their vessels."'
39661: '@rThe Seven Sisters of Purgatory had already been taken into custody.'
39662: '@rThose noisy sisters who had served Beato now faced nothing but denial.'
39663: '@rWhat sort of fantasy were they based upon which allowed them to "manifest"?'
39664: '@r......Everything would be exposed...@w500....and denied.'
39665: 'Dlanor@r@v47/54600345."Eiserne Jungfrau has already begun its INVESTIGATION.@k@|@y@v47/54600346. Our most recent findings indicate that there is a high probability they were produced during the 1960''s in New York or somewhere NEARBY.@k@v47/54600347. An aide has already been sent to the LOCATION."'
39666: 'BERNKASTEL@r@v28/52100784."The 1960''s? The Seven Sisters of Purgatory are <Made in USA>?@k @|@y@v28/52100785.Pfft, *giggle*giggle*giggle*......@k@v28/52100786. Even though they bragged about being furniture connected with King Solomon and serving a thousand year old witch, they''re a total sham.@k@v28/52100787. So what are they...?"'
39667: 'Erika@r@v46/54501285."According to the report, there''s this group of big-time swindlers...@k@v46/54501286....who make money by selling high-priced imitation goods to rich fans of the occult."'
39668: 'Dlanor@r@v47/54600348."The deceived millionaires resell the articles with invented histories,@k@v47/54600349. and this may have caused the items to become falsely deified among COLLECTORS.@k@v47/54600350. We are rushing to find confirmation and further DETAILS."'
39669: 'Erika@r@v46/54501287."Ushiromiya Kinzo was apparently a big customer of theirs who''d pay exorbitant sums for the most blatantly fake objects."'
39670: 'BERNKASTEL@r@v28/52100788."......*giggle*giggle*, ...ahahahahahahahaha...!!@k @v28/52100789.And that''s what the Seven Sisters of Purgatory really are...?@k @v28/52100790.That''s ridiculous,@v28/52100791.@|@y ahahahahahhhahahahahhahahahha!!@k @v28/52100792.A total sham, just what I''d expect from one of Beato''s witch illusions."'
39671: 'Erika@r@v46/54501288."So despite calling themselves the seven deadly sins, they''re actually cheap, fake souvenirs.@k@|@y@v46/54501289. ......Of course,@k@v46/54501290. from the first time I saw them, I figured they were nothing more than paperweights sold at some shady souvenir shop."'
39672: 'BERNKASTEL@r@v28/52100793."*giggle*giggle*!! Paperweights...!@k @|@y@v28/52100794.Ahhahhahhahahahahahahahahahaha!!@k @v28/52100795.Have you confronted the Seven Sisters with that truth yet?"'
39673: 'Dlanor@r@v47/54600351."No, not YET."'
39674: 'Erika@r@v46/54501291."They still seriously believe...@k@v46/54501292.that they were created by a great magician over a thousand years ago.@k@|@y@v46/54501293. ......I can''t wait to thrust the truth and perfect evidence in their faces...@k@v46/54501294.and let them know that they''re mere paperweights worth less than 30 US dollars."'
39675: 'BERNKASTEL@r@v28/52100796."I wonder what kind of expressions will register on their faces as they lose all hope?@k@v28/52100797. ......*giggle*, I can''t wait.@k@v28/52100798. Call me when you do it.@k@v28/52100799. I''ll come to watch, with some of the best black tea and dried plums."'
39676: '@rBeato''s witch illusions had already been seen through,@k and it had been proven that every one of them was simply the result of a Human fantasy.'
39677: '@rWhat kind of fantasies created them and what was their basis?@k@rThe illusions would be confronted with this perfectly proven truth...'
39678: '@r......And at that time, they would disperse like smoke and be completely annihilated.'
39679: '@rThis was called......"execution".'
39680: 'Dlanor@r@v47/54600352."......An execution is not a SHOW.@k@v47/54600353. As a general rule, it is not open to the PUBLIC."'
39681: 'Erika@r@v46/54501295."This is an inspection by the great Lady BERNKASTEL, member of the Senate,@k@v46/54501296. so she can observe that the Great Court is performing its duties satisfactorily.@k@v46/54501297. Do you, a mere Inquisitor, intend to obstruct this...?"'
39682: 'BERNKASTEL@r@v28/52100800."Yes, that''s right.@k@v28/52100801. I''m just observing as a representative of the Senate to make sure you observe the proper procedures when you carry out your work.@k@v28/52100802. ......*giggle*giggle*giggle*."@|@y'
39683: 'Erika@r@v46/54501298."We are currently preparing to take VIRGILIA, Ronove, and Gaap into custody as well.@k@v46/54501299. The Chiester Sisters Imperial Guards are conducting that investigation."'
39684: 'Erika@r@v46/54501300.".........Of course, after that is done, we will then detain and execute the three Chiester Sisters, who are also connected to BEATRICE."'
39685: 'BERNKASTEL@r@v28/52100803."Dlanor, what is the true nature of the Chiester Sisters?"'
39686: 'Dlanor@r@v47/54600354."......We believe there is a high likelihood that their vessels are weapons used in the CRIMES.@k@|@y@v47/54600355. My senior aide, Gertrude, has formed a dedicated TEAM.@k@v47/54600356. We are currently investigating their individual CASES."'
39687: 'Erika@r@v46/54501301."I''m looking forward to the Chiester Sisters'' execution too...!@k @v46/54501302.One at a time?@k @v46/54501303.Or all of them at once?"'
39688: 'BERNKASTEL@r@v28/52100804."No one''s stupid enough to empty the entire can of tea leaves into the pot at once.@k@v28/52100805. You''ve got to enjoy it slowly, one spoonful at a time."'
39689: 'Erika@r@v46/54501304."*giggle*giggle*! Exactly.@k@v46/54501305. Let''s hold their executions on consecutive days.@k@v46/54501306. One for each witch and piece of furniture.@k@v46/54501307. I''ll present you with a new execution show every day."'
39690: 'BERNKASTEL@r@v28/52100806."Wonderful.@k@v28/52100807. .........After all, there really are a lot of them.@k@v28/52100808. Looks like we''ll be able to enjoy ourselves for a full two weeks."'
39691: 'BERNKASTEL@r@v28/52100809."......Maybe we could let them decide among themselves which of them to execute first.@k@|@y@v28/52100810. Heheheheheheheheh!@k @v28/52100811.Make sure you think up something great for the execution concepts.@k@v28/52100812. ......I''d like to enjoy executions both old and new from East and West every day."'
39692: 'Dlanor@r@v47/54600357."......The rules state that the method of execution is to follow Great Court REGULATIONS."'
39693: 'Erika@r@v46/54501308."Leave it to me, my master.@k@v46/54501309. I will most certainly prepare you a fascinating execution show!"'
39694: 'BERNKASTEL@r@v28/52100813."I expect quartering at the very least."'
39695: 'Erika@r@v46/54501281."Of course.@k@v46/54501311. I shall make a list of the highest forms of execution from countries across the world from Europe to Asia,@k @v46/54501312.which were used by kingdoms East and West for nothing less than treason against the king!"'
39696: 'BERNKASTEL@r@v28/52100814."......I''d like to propose an execution method myself.@k@v28/52100815. ...Pondering that will be the perfect way to relax on those sleepless nights.@k@v28/52100816. ......*giggle*. I''ll come up with an idea and send you a letter soon."'
39697: 'Erika@r@v46/54501313."Certainly, my master.@k@v46/54501314. Then we''ll use the BERNKASTEL-style execution for the grand finale.@k@|@y@v46/54501315. ......At the very, very end, when all of the illusions have been broken and Beato''s system of magic has been completely crushed,@k@v46/54501316. ...I shall present you with the finest execution you desire...at the execution of BEATRICE...!"'
39698: 'BERNKASTEL@r@v28/52100817."Thank you, Erika.@k@v28/52100818. ......Thanks to you, it seems I''ll be able to forget the pain of my illness for a little while......@k@|@y@v28/52100819. *giggle*giggle*, hehehehehehhahahahahahahahahaha!@k @v28/52100820.You''re just perfect.@k@v28/52100821. My piece, my double,@v28/52100822. ......and my precious daughter."'
39699: 'Erika@r@v46/54501317."Y-......your words are too good for me...! My master...!!"'
39700: 'BERNKASTEL@r@v28/52100823."Erika, I will give you honor and a reward.@k@|@y@v28/52100824. ......Beato''s greatest symbol, the portrait in the reception hall.@k@v28/52100825. Take it down, smash it to make firewood, bake a cake over that fire and eat it.@k@v28/52100826. Then you have my permission to put your own portrait up in the empty frame."'
39701: 'Erika@r@v46/54501318."...Th-......thank you very much...!@k @v46/54501319.It is the greatest of honors...!"'
39702: 'BERNKASTEL@r@v28/52100827.".........You will eradicate and erase BEATRICE''s name and all traces of her.@k@v28/52100828. Until that is all finished, I order you to become the master of this sealed-off Rokkenjima."'
39703: 'BERNKASTEL@r@v28/52100829."......By the name of the Witch of Miracles, BERNKASTEL,@k@v28/52100830. I hereby grant you the rank of witch until that day arrives.@k@v28/52100831. ......From now on, you will call yourself ERIKA, Witch of Truth."'
39704: 'Erika@r@v46/54501320."W-@v46/54501321.......Witch...of Truth......!@k @v46/54501322.......Th-@k@|@y@v46/54501323.......thank you very much, my master...!!@k @v46/54501324.I vow to work even harder so that this honor is not wasted...!"'
39705: '@rEven though she was nothing more than a piece,@k .........she was being granted the honor of calling herself a witch like her master, if only for a brief stretch of time......'
39706: '@rErika was so moved at having her hard work acknowledged in this greatest form that she trembled......'
39707: 'BERNKASTEL@r@v28/52100832."Dlanor, continue to aid ERIKA...@k@v28/52100833.and report on her progress to me."'
39708: 'Dlanor@r@v47/54600358."......As you WISH."'
39709: 'BERNKASTEL@r@v28/52100834."............By the way, where''s Lambda?"'
39710: 'Dlanor@r@v47/54600359."She is over THERE."'
39711: '@rFrom the guest seating on the second floor, she pointed downwards.'
39712: '@rLAMBDADELTA.........could be seen beneath Battler, who hung there dead, run through by the red longsword.'
39713: 'LAMBDADELTA@r@v29/52200684.".........Ushiromiya Battler...@k@v29/52200685. You were an interesting guy.@k@v29/52200686. ...You could have been so much more interesting...... Such a shame."'
39714: 'BERNKASTEL@r@v28/52100835."I think it was a wonderful way to die.@k@|@y@v28/52100836. .........ERIKA!@k @v28/52100837.You can hang Battler''s corpse in the mansion''s reception hall.@k@v28/52100838. ......The next time I come to visit this fragment, welcome me in front of it."'
39715: 'Erika@r@v46/54501325."Certainly, my master.@k@v46/54501326. I''ll make that foolish man an eternal monument to your victory!"'
39716: 'LAMBDADELTA@r@v29/52200687."*giggle*, that sounds wonderful. Super stylish.@k@v29/52200688. Maybe you can coat him with plaster and make a beautiful white statue.@k@|@y@v29/52200689. ......And it''d be even better if you decorated him all cute!"'
39717: 'Erika@r@v46/54501327."Yes, Lady LAMBDADELTA.@k@v46/54501328. I will strive to answer your expectations...!"'
39718: 'LAMBDADELTA@r@v29/52200690."Grats on your witch promotion.@k@v29/52200691. Even though it''s only temporary, I welcome you as a friend."'
39719: '@rErika was so overcome with emotion that tears came to her eyes.'
39720: '@r.........Because no greater pleasure exists for a piece than having its efforts acknowledged by its master.'
39721: 'BERNKASTEL@r@v28/52100839."In the end, I''d like to have Beato stuffed too.@k@v28/52100840. Then I''ll have her displayed on high in the reception hall."'
39722: 'LAMBDADELTA@r@v29/52200691B."Lake Shirakaba?"'
39723: 'BERNKASTEL@r@v28/52100840_B."The Human-hunting Count."'
39724: 'LAMBDADELTA@r@v29/52200692."......You know,@k@v29/52200692B. I read that back when I wasn''t a witch.@k@v29/52200693. ...I wondered, how can humans who obtain eternal life become so cruel?@k@v29/52200694. I always found that strange.@k@|@y@v29/52200695. ......At the time, I honestly couldn''t relate."'
39725: 'BERNKASTEL@r@v28/52100841.".........After becoming a witch and living a thousand years, I fully understand it.@k@v28/52100842. ......That writer could understand our cruelty really well, in the truest sense.@k@v28/52100843. *giggle*giggle*!"@|@y'
39726: 'LAMBDADELTA@r@v29/52200696."......Where to next?@k @v29/52200697.I guess we''ll go off in opposite directions like always?"'
39727: 'BERNKASTEL@r@v28/52100844."Only because I don''t want to bore you."'
39728: 'LAMBDADELTA@r@v29/52200698."Thanks, Bern.@k@v29/52200699. But you can be sure that I''ll count to a hundred and then start searching for you again."'
39729: 'BERNKASTEL@r@v28/52100845."You never let me get bored, do you?@k@v28/52100846. That''s why I like you, love you.@k@|@y@v28/52100847. ............Let''s meet again somewhere.@k@v28/52100848. Of course, that might be a hundred or a thousand years from now...or never again for all eternity."'
39730: 'LAMBDADELTA@r@v29/52200700."It''ll work out.@k@v29/52200701. The sea of fragments is tiny to a pair who love each other."'
39731: 'BERNKASTEL@r@v28/52100849."The Third Man?"'
39732: 'LAMBDADELTA@r@v29/52200702."No, Children of Paradise, of course."'
39733: 'BERNKASTEL@r@v28/52100850.".........If each time you smashed one of those countless fragments that glitter like a starry night,@k@v28/52100851. you could escape the poison of just a single evening''s worth of boredom,@k@v28/52100852. even you would want to count the stars in the sky."'
39734: 'LAMBDADELTA@r@v29/52200703."Ooh, not bad...pfft, *giggle*giggle*...!"'
39735: '@rThe witches known as Voyagers travel across the countless glittering futures of possibility,@k ......and gobble them up, trying to escape their illness called boredom for as long as they can.'
39736: '@rThe tiny, tiny fragment created by the Human known as BEATRICE...@k...had now been gobbled up by the two witches...@k...and had lost its glitter.'
39737: '@rThe two who had earlier called themselves rivals in front of Beato...@know stopped that charade and laughed together playfully.'
39738: 'BERNKASTEL@r@v28/52100853."ERIKA.@k@v28/52100854. The new ruler of this fragment.@k@v28/52100855. .........Weave the truth, ......and create the tale that leads up to this world''s demise.@k@|@y@v28/52100856. ...Umm, the next was the sixth game, right?"'
39739: 'Erika@r@v46/54501329."Yes, it''s the sixth game."'
39740: 'BERNKASTEL@r@v28/R52100857."Decide the title for Episode 6 yourself.@k@v28/52100858. After all, you''re already the spinner of this tale, as well as its Master."'
39741: 'Erika@r@v46/54501330."Thank you very much.@k@v46/54501331. ......Actually, I''ve already decided on one."'
39742: 'BERNKASTEL@r@v28/52100859."......Oh, already?@k @v28/52100860.......Then let me hear it.@k@v28/52100861. What''s the title?"'
39743: 'Erika@r@v46/54501332."It is...@k@v46/54501333.Episode 6.........@k@|@y@v46/54501334.heheheheh, actually, I''d like to tease you a bit, but I''ll tell you."'
39744: 'LAMBDADELTA@r@v29/52200704."*giggle*!@k @v29/52200705.Come on, stop being a smartass and tell us.@|@y@k@v29/52200706. A newbie witch like you shouldn''t be teasing your seniors!"'
39745: 'Erika@r@v46/54501335.@z90."Episode 6: Checkmate of the Golden Witch!"'