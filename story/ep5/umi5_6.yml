34842: 'Erika@r@v46/54500144.".........She really was acting big about her father being the successor to the head.@k@v46/54500145. ......When she wakes up tomorrow and learns that you''ve inherited all the gold,@k@v46/54500146. and that her father is no longer the successor, I wonder what kind of expression she''ll have on her face......?"'
34843: 'Battler@r@v10/50100461.".........I don''t intend to keep all 20 billion for myself, you know.@k@|@y@v10/50100462. ......I mean, even ten percent would be great, I wouldn''t want any more than that.@k@v10/50100463. We can split the rest fairly amongst the family.@k@v10/50100464. I''m even less interested in being the successor to the head.@k@v10/50100465. I''d be glad to let Uncle Krauss deal with that."'
34844: 'Erika@r@v46/54500147.".........Will it really be so simple, I wonder...?@k @v46/54500148.*giggle*giggle*giggle*.@k@v46/54500149. Instead of trying to predict that,@k@v46/54500150. ......I have a feeling that it will be much more fun to puzzle out what kind of expression Jessica-san will have on her face tomorrow,@k@v46/54500151. and what kind of sad excuses she''ll try to make."'
34845: 'Battler@r@v10/50100466."............You have a real twisted mind."'
34846: 'Erika@r@v46/54500152."Oh?@k@v46/54500153. ............Couldn''t you deduce that from the moment I said I liked solving riddles......?@k @v46/54500154..........I''m an intellectual rapist who enjoys exposing things that other people hide.@k @v46/54500155.......It was the same for solving the epitaph."'
