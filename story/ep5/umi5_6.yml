34849: 'Battler@r@v10/50100468."Halfway through?@k @v10/50100469.......Changed to what?"'
34850: 'Erika@r@v46/54500158."Jessica-san.@k@v46/54500159. .........She cast doubt on my deductions and contaminated my sublime and noble moment.@k@v46/54500160. .........I changed my goal into solving the riddle so that I could get even with this Jessica girl."'
34851: 'Battler@r@v10/50100470.".....................Are you...being serious?"'
34852: 'Erika@r@v46/54500161."*giggle*.@k@v46/54500162. .........*giggle*giggle*giggle*giggle*.@k@v46/54500163. ...I can bring any opponent to their knees, no matter who they are.@k@v46/54500164. That is my one and only pleasure.@k@v46/54500165. ......Perhaps you still need time to reason?"'
34853: 'Erika@r@v46/54500166.".........Ushiromiya Jessica irritated me.@k@v46/54500167. So I decided to solve the epitaph to put her in her place.@k@v46/54500168. .........From this, you should be able to deduce how I''m feeling at this very moment.@k@v46/54500169. ...Can you work it out?"'
