34710: 'Natsuhi@r@v03/50900401."......We''ve managed to make it through the first day."'
34711: '@rNatsuhi could be seen in the study.'
34712: '@rWhen she muttered as though to herself, gold butterflies appeared and formed into the shape of a person...'
34713: 'BEATRICE@r@v27/50700243."We can''t afford optimism.@k@v27/50700244. ......I doubt that we will be able to make it through tomorrow by sitting around here."'
34714: 'Natsuhi@r@v03/50900402."......So you do think that saying Father is in a bad mood and refuses to come out won''t be enough to fool them..."'
34715: 'BEATRICE@r@v27/50700245."Mm...@k@v27/50700246. It seems they were already quite suspicious last year.@k@v27/50700247. Because of that, the toxin has expanded and is coiling itself around this study, growing ever tighter..."'
34716: 'Ronove@r@v31/53100046."I expect that the suspicion they have harbored since last year is not the only cause."'
34717: 'VIRGILIA@r@v30/53200025.".........That''s right.@k@v30/53200026. The toxin has grown too thick to be explained away by that alone.@k@v30/53200027. ......I have no doubt that after suspecting Kinzo-sama''s death last year, they have come with a strong determination to expose it at this year''s conference."'
34718: 'Natsuhi@r@v03/50900403."Even last year, ......we didn''t succeed in fully deceiving them?"'
34719: 'Ronove@r@v31/53100047."...Unfortunately, it might be best to assume that in the current situation.@k@v31/53100048. The typhoon will remain here tomorrow, and the boat will not come for them until the day after.@k@v31/53100049. In short, we must endure for another thirty-six hours at the very least..."'
34720: 'BEATRICE@r@v27/50700248.".........Your eyes may not be able to see it, Natsuhi, but the locked-room barrier sealing this room was once very firm.@k@v27/50700249. In the span of a single night, it has been worn ragged like wilted leaves, and now only awaits a storm."'
34721: 'VIRGILIA@r@v30/53200028."No, the storm is already here.@k@|@y@v30/53200029. .........Natsuhi-sama.@k@v30/53200030. I propose that we switch from the locked-room barrier to something else."'
34722: 'Natsuhi@r@v03/50900404."What do you mean by something else...?@k @v03/50900405.Do you mean to change our plan...?"'
34723: 'Ronove@r@v31/53100050."That is correct.@k@v31/53100051. ......VIRGILIA-sama and I will reconstruct a barrier similar to last year''s."'
34724: 'BEATRICE@r@v27/50700250."In other words, we''ll take Kinzo out of the study and have him tightrope walk from shadow to shadow where the toxin can''t reach, just like last year.@k@v27/50700251. It will be dangerous, but I would like to propose the same thing."'
34725: 'Natsuhi@r@v03/50900406."What did you say...?@k@v03/50900407. You want to change the plan this far in...?!"'
34726: 'VIRGILIA@r@v30/53200031."When you learn that you cannot withstand a siege, you must consider abandoning the castle..."'
34727: 'Ronove@r@v31/53100052."......Right now, this room is like a castle surrounded by enemy troops with its walls about to crumble.@k@v31/53100053. If staying put means certain death, then you still have the ability to ride out for one last stand and an honorable defeat.@k@v31/53100054. ......After all, surrender doesn''t seem to be an option in this fight."'
34728: 'Natsuhi@r@v03/50900408."I''ll protect Father''s secret until the very end!@k @v03/50900409.If it''s discovered, there will be no chance for us to talk our way out of it!@k @v03/50900410.My husband''s embezzlement will be exposed to the light of day, and the Ushiromiya family''s honor will be destroyed!@k @v03/50900411.We must remain firm and prevent that no matter what...!"'
34729: 'BEATRICE@r@v27/50700252."......Calm down, I understand that.@k@v27/50700253. ...Krauss''s alchemy will soon see great results.@k@v27/50700254. If we can make it through this year, we''ll be able to manage.@k@v27/50700255. So don''t get flustered."'
34730: 'Natsuhi@r@v03/50900412."But we planned this barricade strategy because using the same trick as last year wouldn''t work...!@k @v03/50900413.Isn''t it the height of stupidity to return to a plan you previously abandoned because it was impossible...?!@k @v03/50900414.Just what kind of story do you suggest we create at this point...?!"'
34731: 'VIRGILIA@r@v30/53200032."Ronove and I will prepare that.@k@v30/53200033. Leave it to us, as creating illusions is what witches do.@k@v30/53200034. ......All you have to do is give us your permission, Natsuhi-sama."'
34732: 'BEATRICE@r@v27/50700256.".........Master and Ronove are very reliable at times like these...!@k @v27/50700257.Also, the servants of the One-winged Eagle are excellent furniture.@k@v27/50700258. If Master and Ronove reconstruct the magic, they will work to protect it.@k@v27/50700259. ...It still isn''t too late by any means.@k@v27/50700260. Let''s take Kinzo out of the study and have his illusion walk around...!"'
34733: 'Natsuhi@r@v03/50900415."Did you forget that we chose our current strategy because we considered those kinds of plans at length and couldn''t find anything that would work?!@k @v03/50900416.To get flustered in an emergency and carelessly throw away the primary plan is simply foolish!"'
34734: 'VIRGILIA@r@v30/53200035."But Natsuhi-sama...!@k @v30/53200036.You, right there amidst the toxin, must realize better than anyone else that our barricade cannot endure any longer...!"'
34735: 'Natsuhi@r@v03/50900417.".........I propose that we try and think of another plan without changing our objective of holding the fort.@k@v03/50900418. ......In any event, as long as we can keep this room sealed, no one will be able to deny Father''s existence.@k@v03/50900419. After all, you can''t determine the contents of a cat box that can''t be opened, no matter how many people you have with you......!"'
34736: 'BEATRICE@r@v27/50700261."...Well, that is true......@k@|@y@v27/50700262. However, Humans are unreasonable.@k@v27/50700263. It''s possible for them to eat into an airtight cat box and go inside like black ants swarming a box of cake.@k@v27/50700264. ............And Lady BERNKASTEL''s piece also concerns me."'
34737: 'Ronove@r@v31/53100055.".........It was fortunate that Erika-sama stole the show at tonight''s dinner.@k@v31/53100056. By doing that, she created an atmosphere where it was possible for tonight''s family conference to come to a close.@k@v31/53100057. ......If you had gone straight back to the family conference afterwards like usual, the barrier might have broken tonight."'
34738: 'VIRGILIA@r@v30/53200037."But because of that, the toxin has grown even thicker.@k@v30/53200038. ......After thickening all night, the toxin may be able to corrode the locked-room barrier easily.@k@v30/53200039. Whether we continue holding the fort or give up that plan,@k@v30/53200040. we will not be able to make it through tomorrow unless we prepare a new strategy and a new barrier."'
34739: 'BEATRICE@r@v27/50700265."......Lady BERNKASTEL may have some plan for breaking the locked-room barrier.........@k@|@y@v27/50700266. We can''t take that piece called Erika lightly..."'
34740: 'Ronove@r@v31/53100058."............Come to think of it, that man who said something about taking revenge for the events of 19 years ago might also be Lady BERNKASTEL''s piece.@k@|@y@v31/53100059. ......This board, which achieved equilibrium with 18 pieces, has had two undesired pieces added to it.@k@v31/53100060. ...There are too many irregularities this year."'
34741: 'BEATRICE@r@v27/50700267."Lady BERNKASTEL is a fan of Eastern things.@k@v27/50700268. ......They say that in shogi, Japanese chess, you are allowed to drop pieces onto the board in the middle of a game, do they not?"'
34742: 'VIRGILIA@r@v30/53200041."Yes, that is possible.@k@v30/53200042. ......In shogi, even dropping a queen from the captured pile right in front of the enemy king is a permissible move that can serve as a trump card."'
34743: 'Natsuhi@r@v03/50900420."......What is......that man who spoke of "19 years ago" doing right now?@k@v03/50900421. ...Is he already hiding somewhere on this island...?"'
34744: 'Natsuhi@r@v03/50900422.".........That girl called Erika was able to appear, claiming to have drifted here.@k@v03/50900423. ......That man might also have landed somewhere on this island despite the typhoon, ...and he might be hiding somewhere......"'
34745: 'Natsuhi@r@v03/50900424."......And it''s going to be hard to fully deceive the relatives any longer......@k@v03/50900425. ...........................@k@v03/50900426. ......Why?!!@|@y@k @v03/50900427.Why must there be so many irregularities?!!@k @v03/50900428.How can you explain this miracle of nightmares and coincidences?!!"'
34746: '@rNatsuhi slammed the desk hard, held her head, and cringed at the pain from her overwhelming headache...'
34747: 'BEATRICE@r@v27/50700269.".........Lady BERNKASTEL controls miracles.@k@v27/50700270. ...There''s no point being surprised at irregularities or miracles when that person is around."'
34748: 'Ronove@r@v31/53100061."It may be true that shogi is a game where an enemy piece can suddenly appear right in front of a king.@k@v31/53100062. However, that is why you build up a perfect formation that doesn''t allow for that kind of weakness, artistically constructing a castle to protect your king."'
34749: 'Natsuhi@r@v03/50900429."Then holding the fort is what we should be doing, isn''t it?!!"'
34750: 'Ronove@r@v31/53100063."If we had a fort that we could hold then perhaps, but we cannot hope for such a thing now."'
34751: 'BEATRICE@r@v27/50700271."It is difficult to corner a king without a wall to his back, and even more difficult to corner one with open spaces in all directions.@k@|@y@v27/50700272. ......Think of a mouse.@k@v27/50700273. You can catch a mouse that''s shut in a cage.@k@v27/50700274. However, catching a mouse in a field is like trying to catch a cloud."'
34752: 'VIRGILIA@r@v30/53200043."Natsuhi-sama.@k@v30/53200044. ......Please allow us to explore this option...@k@v30/53200045....of Kinzo-sama leaving his study and wandering around the mansion on a whim, avoiding the gazes of the relatives.@k@v30/53200046. ......We will think of a story that makes it appear natural before morning."'
34753: 'Natsuhi@r@v03/50900430."............Don''t you see the danger......?@k@v03/50900431. ......If we''re willing to consider such a dangerous option, wouldn''t it be better to continue acting as though Father is in his room in a bad mood......?"'
34754: 'VIRGILIA@r@v30/53200047."Tomorrow, the relatives will again crowd around in front of the study.@k@v30/53200048. They will crowd right on the other side of that door.@k@|@y@v30/53200049. How many hours do you think you will be able to stand there keeping up the charade of a yelling match with Kinzo-sama?!@k @v30/53200050.It''s impossible...!"'
34755: 'Natsuhi@r@v03/50900432."And it falls to me to resist that impossibility for thirty-six hours!!@|@y@k @v03/50900433.If you tell me to do it, I will!!@k @v03/50900434.I am Ushiromiya Natsuhi!@k @v03/50900435.The wife of the Ushiromiya family head!!@k @v03/50900436.If you tell me to do that, ......I will act out a shouting match with Father for as many days as it takes...!!@k @v03/50900437.Uuhhhuu!!"'
34756: '@r......Even Natsuhi understood that there was no way she could manage it.'
34757: '@rBut she could no longer see any chance of victory from a plan which involved making an illusion of Kinzo walk around......'
34758: '@rBanging on the desk several times, with tears of intense emotion streaming down her face, Natsuhi alternated between groaning from her headache and placing the blame on one thing or another.'
34759: '@rIt was enough to make one feel that there was a curse which made anyone who sat in that chair do the same......'
34760: 'Ronove@r@v31/53100064.".........This is like a game of mating shogi, where you are on the defensive.@k@v31/53100065. ......In mating shogi, the opponent has no king.@k@v31/53100066. And you have no way of winning other than avoiding a checkmate for a predetermined number of moves."'
34761: 'Natsuhi@r@v03/50900438."And to think...@v03/50900439.......that I must escape for a whole day and a half''s worth of moves...@v03/50900440. ......That''s just too many..."'
34762: 'BEATRICE@r@v27/50700275."Do not stop thinking... Do not surrender...!@k @|@y@v27/50700276.I am here to listen to your woes, but do not admit defeat...!@k @v27/50700277.Your absolute determination to overcome this trial no matter what will produce results with certainty...!@k @v27/50700278.That is the power of the Witch of Certainty."'
34763: 'BEATRICE@r@v27/50700279."You must not lose that magical power.@k@v27/50700280. ......Believe that you will overcome this no matter what...!@k @v27/50700281.I am sure a brilliant plan will come to mind.@k@v27/50700282. You must not give up and stop thinking...!"'
34764: 'Natsuhi@r@v03/50900441."......You''re right...@k@v03/50900442. I understand...@k@v03/50900443. If I can''t overcome this hardship, then no one can......"'
34765: 'BEATRICE@r@v27/50700283."That is correct.@k@v27/50700284. Didn''t Kinzo entrust you with the job of overcoming all of this?@k@v27/50700285. ......Kinzo acknowledged that you were worthy of this responsibility...!"'
34766: 'Natsuhi@r@v03/50900444.".........Father...@k@|@y@v03/50900445. ...Father... Uuuhu...uhu...!!!"'
34767: 'BEATRICE@r@v27/50700286."Master and Ronove will think of a move.@k@v27/50700287. Of course, I will think as well!@k @v27/50700288.However, we cannot do even that without our master''s permission...your permission!@k @v27/50700289.So the least you can do is not abandon the will to fight...!@k @v27/50700290.Do not give in...!!"'
34768: 'Natsuhi@r@v03/50900446."I know that, ...I know!!@k @v03/50900447.But, ...I''m......so very tired, ...and the headaches are unbearable...@k@v03/50900448. ......Why am I here...in this freezing cold study......crying alone?!@k @v03/50900449.Why...why isn''t my husband here for me now?!"'
34769: '@rBack when dinner ended, Krauss claimed to be dizzy and went to bed early.'
34770: '@rOf course, he had done this to get enough rest to ready himself for the long day ahead,@k but to Natsuhi right now, it felt as though he had just gone straight to sleep and pushed all of the burden onto her.'
34771: '@rHowever, complaining about such a thing would mean that she had failed as a wife.'
34772: '@r......Wasn''t it a good wife''s duty to work hard and think of the family first even when her husband was resting......?'
34773: '@rRegretting even her anger at her husband,@k ...and unable to determine whom she should be angry at, Natsuhi continued to sob......'
34774: '@rIf only......Kinzo could just speak to her kindly at times like this.'
34775: '@rBeato searched for him, but Kinzo had been nowhere to be seen in the study for some time now...'
34776: '@rPerhaps Natsuhi had noticed this as well...'
34777: '@rThough she took pride in fighting alone and supporting from behind, thinking of those as the responsibilities of a good wife,@k ......without anyone to validate what she was doing and say it was needed, .........she was now so frail that she couldn''t even stop her own tears.'
34778: '@rJust as Beato was thinking of words she could use to console Natsuhi, VIRGILIA tapped her lightly on the shoulder.'
34779: '@r......If words of consolation don''t come from the mouth of the right person, they can sometimes do more harm than good.'
34780: '@rTherefore, VIRGILIA silently urged Beato that saying nothing was the best course of action for now...'
34781: 'Gaap@r@v32/53700013."...............Hi, sorry to interrupt.@k@v32/53700014. ...I know I''m an outsider, but I wonder if you''d let me speak."'
34782: 'VIRGILIA@r@v30/53200051."Gaap.@k@v30/53200052. ...Please restrain yourself for the time being."'
34783: 'Natsuhi@r@v03/50900450."No, as long as you''re here, there''s no distinction between outsiders or guests and the rest of us.@k@v03/50900451. ......You may speak."'
34784: 'Gaap@r@v32/53700015.".........Thank you.@k@v32/53700016. ......Ronove said it himself a while ago.@k@|@y@v32/53700017. This is mating Shogi with you on the defensive.@k@v32/53700018. .........How does one lose in mating Shogi?@k @v32/53700019.It''s because their king is checkmated, right?"'
34785: 'BEATRICE@r@v27/50700291."That goes without saying.@k@v27/50700292. And the opponent has no king.@k@v27/50700293. Therefore, all Natsuhi can do is have her king run away constantly."'
34786: 'Ronove@r@v31/53100067.".........I see.@k@v31/53100068. ......So you''re thinking of that move.@k@v31/53100069. Has that time already come?"'
34787: 'Natsuhi@r@v03/50900452."What do you mean?@k@v03/50900453. ......Are you saying we have some sort of move?"'
34788: 'Gaap@r@v32/53700020."............It''s the first thing you suggested to conceal GOLDSMITH''s death.@k@v32/53700021. ......I''m trying to say that the time has come for us to use it..."'
34789: 'Natsuhi@r@v03/53200053."You mean...having him go missing......?!@k @v03/53200054.You mean to make that move right now, during the family conference?!@k @v03/53200055.That''s too dangerous!"'
34790: '@rAfter successfully resolving all of their problems, they would have to lay Kinzo to rest.'
34791: '@rAnd the way to do that......was to make him disappear.'
34792: '@rOne day, Kinzo would go out into the forest and never return.@k@rThey wouldn''t be able to find him no matter how much they searched, so he would be declared "missing"......'
34793: 'Gaap@r@v32/53700022.".........You said it yourself a second ago, Riiche.@k@v32/53700023. You can''t catch a mouse that''s escaped to a field.@k@v32/53700024. And you can''t catch a GOLDSMITH who''s disappeared into the forest."'
34794: 'VIRGILIA@r@v30/53200056."Do you honestly think that we could talk our way out of this using that?!@k @v30/53200057.Using such a move now, when the suspicion against us is greatest, would be no better than committing suicide!!"'
34795: 'Ronove@r@v31/53100070."They will suspect, yes.@k@v31/53100071. It is a move fully deserving of being called suspicious.@k@|@y@v31/53100072. .........However, even if they set foot in this study, such suspicions will be unprovable.@k@v31/53100073. ......It will be impossible for them to capture Kinzo-sama forever after,@k@v31/53100074. and no matter how much they suspect him to be dead, they will be unable to prove it..."'
34796: 'Gaap@r@v32/53700025."Forget about thirty-six hours, you could protect Kinzo''s secret forever this way, couldn''t you......?@k @v32/53700026....Of course, it''ll mean taking on that much risk as well."'
34797: 'BEATRICE@r@v27/50700294."......If you make this move, you may be able to overcome this particular challenge,@k@v27/50700295. ......but I cannot even guess at how much prestige you might lose for it."'
34798: 'Gaap@r@v32/53700027."Even so,@k@v32/53700028. ............this move can definitely get you through this.@k@v32/53700029. Of course, you''ll be treated with even greater suspicion.@k@v32/53700030. But it won''t be fatal."'
34799: 'Natsuhi@r@v03/50900454."Y-@v03/50900455........yes,@v03/50900456. ......that may be true, but......"'
34800: 'Gaap@r@v32/53700031.".........The Ushiromiya family should have collapsed after the Great Kanto Earthquake.@k@v32/53700032. But the mad genius GOLDSMITH revived it,@k@v32/53700033. and he rebuilt it into something so magnificent that you want to protect it.@k@v32/53700034. ......So this time, it is up to you and your husband, the new head and his wife, to do the same."'
34801: 'Ronove@r@v31/53100075."......Hoh...@k@v31/53100076. .........Is that how you intend to stir her up?"'
34802: 'Gaap@r@v32/53700035."I''m not stirring her up.@k@v32/53700036. I''m just asking if she''s prepared to be the wife of the head......@k@v32/53700037. ......Are you prepared to protect the Ushiromiya family, even if you end up getting dragged through the dirt to do it......?"'
34803: 'Natsuhi@r@v03/50900457."I, ......I am..."'
34804: 'Gaap@r@v32/53700038."Then now is the time.@k@v32/53700039. .........If you can survive by being dragged through the dirt, then crawl with all your might.@k@v32/53700040. You''ll drag yourself through a world of suffering, and you''ll eventually regain your glory.@k@v32/53700041. .........I, Gaap, the 33rd in rank, promise you this."'
34805: 'BEATRICE@r@v27/50700296."............Gaap..."'
34806: 'Gaap@r@v32/53700042.".........The fact that I dropped in at a time like this must be guidance from the gods of happenstance...@k@|@y@v32/53700043. ......I''ll keep that promise, Ushiromiya Natsuhi.@k@v32/53700044. I don''t need anything in return.@k@v32/53700045. Riiche, the one who serves you, has already paid me plenty in advance."'
34807: '@rGaap seemed quite cavalier, but she was actually possessed by a strong sense of duty.@k@rShe was the kind of person who just couldn''t leave someone in trouble alone.'
34808: 'BEATRICE@r@v27/50700297."Payment in advance?@k @v27/50700298.Now when did I do that...?@k @v27/50700299.I can''t recall..."'
34809: 'Gaap@r@v32/53700046."*giggle*giggle*...@k@v32/53700047. .........Just the various magical items that you couldn''t remember where you put.@k@v32/53700048. I made off with quite a few of those."'
34810: 'BEATRICE@r@v27/50700300."Wha?!!@k @v27/50700301.So it really was your fault that I could never find those...!!@k @|@y@v27/50700302.Give ''em back!!@k @v27/50700303.Give back my Phantom Silver Crystal and Moon Stick!@k @v27/50700304.I still haven''t played around by sticking them together yet!"'
34811: 'Gaap@r@v32/53700049."............This is the sort of magic or plan that I can give you.@k@v32/53700050. I can hide GOLDSMITH away in a world where no one will be able to find him.@k@v32/53700051. .........Let me know the instant you need this magic.@k@v32/53700052. Until then, you may think of another, safer plan."'
34812: 'Ronove@r@v31/53100077."True.@k@v31/53100078. ......Having an option open to you leaves you with a little peace of mind.@k@v31/53100079. ...Without any peace of mind, you cannot think up a brilliant plan."'
34813: 'VIRGILIA@r@v30/53200043."Natsuhi-sama.@k@v30/53200059. The night is not short.@k@v30/53200060. ......Let''s leave Gaap''s plan as a final trump card and iron out our plan for the time being.@k@v30/53200061. Please give us permission.@k@v30/53200062. ......Furthermore, please give us the trust, magical power, and certain conviction needed to succeed without fail."'
34814: 'Gaap@r@v32/53700053."If you believe, I will make that come true.@k@v32/53700054. If you doubt, I will make that come true.@k@v32/53700055. ......You must make your own future."'
34815: 'Natsuhi@r@v03/50900458.".............................."'
34816: '@rHaving Kinzo...go missing.@k And doing it right in the middle of this family conference.@k@rThat was truly a last resort.'
34817: '@rHiding this final trump card in her heart, ......Natsuhi decided that she would grope around for a different plan until the last second.'
34818: '@rAfter all, this long, long night had only just begun......'
34819: '@r......And it was long not only for her.@k BERNKASTEL and her pieces had just as much time.........'
34820: 'Battler@r@v10/50100453."......Gouge the leg......and kill.@k@v10/50100454. ......Now it''s complete..."'
34821: 'Erika@r@v46/54500127."I see, ......so that was what "gouge" meant after all.@k@v46/54500128. Once again, my reasoning was correct."'
34822: '@rThe feel of the last one was clearly different from all the ones before,@k making the two of them almost certain that they had activated some sort of mechanism.'
34823: '@rHowever, as far as a quick glance could tell, there was no dramatic change, such as an entrance of some sort opening.'
34824: '@rApparently, they would need to do just a little more before they could find it...'
34825: 'Battler@r@v10/50100455."You''re something else.@k@v10/50100456. .........If this really does lead us to the gold, we''ll have to split it between us."'
34826: 'Erika@r@v46/54500129."Enjoying the intellectual stimulation is enough for me.@k@v46/54500130. ............The only thing I like is solving riddles.@k@v46/54500131. Proof that I was right is all I need for a reward."'
34827: '@rShe shrugged it off, saying that just seeing the gold would be enough.'
34828: '@rThen she crouched down, peering fixedly at the gimmick that made up the key.'
