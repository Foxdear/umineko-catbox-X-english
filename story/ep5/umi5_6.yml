34948: 'Battler@r@v10/50100497.@|@y"@c279.@[For example, maybe that was some kind of sheet or cover that had gotten caught in a dark grove of trees,@k@v10/50100498. which looked like Grandfather wearing a pitch black cloak!@k@v10/50100499. As a result, I mistakenly thought that I''d had some sort of conversation with Grandfather.@]@c."'
