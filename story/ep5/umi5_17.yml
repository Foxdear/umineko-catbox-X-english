40459: 'Battler@r@v10/50101504."Yeah, that''s right.@k@v10/50101505. Regardless of my truth, yours can exist at the same time.@k@v10/50101506. ......That''s what this world is like.@k@v10/50101507. No one can disprove them, so even if there are various truths and even if they contradict each other wildly, they can exist at the same time.@k@v10/50101508. Here, as many truths exist as you can imagine.@k@v10/50101509. No one can unilaterally deny them...!"'
