39746: '@rIn the cathedral devoid of people,@w500. .........a figure could be seen still staring up at the heavens,@k its chest pierced with a long red sword which pinned it in place to the ground.@k ......It was the figure of Battler.'
39747: '@r......Ironically,@k it looked just like what he had done to Beato with blue wedges in the fourth game......'
39748: '@rBattler had died quite some time ago.'
39749: '@rNo, .........in this place, the concept of death means nothing except that one has stopped thinking.'
39750: '@rTherefore, in a sense, Battler was not dead.'
39751: '@r......After being defeated in a fight over the truth, he no longer had the strength to think of a way to resist.'
39752: '@rAnd so...he was dead.'
39753: '@rDlanor''s massive longsword, which had been left in place of a tombstone,@k ......fastened Battler to the spot even after his death...'
39754: '@rThis was being lit by a faint light seeping out of a high, high skylight.'
39755: '@rQuiet footsteps rang out across this still cathedral......'
39756: '@rFrom the darkness behind a pillar, ......a woman slowly stepped forwards.'
39757: '@r......It was BEATRICE.'
39758: '@rHer eyes had no light in them, ......and looked the same way they had for so long in the Golden Land,@k still muddied over with gray.'
39759: '@rPreviously, she couldn''t even drink black tea properly without assistance,@k ......but now, though it was slow, ...and though there was no life in her eyes,@k ......she was, surprisingly, walking.'
39760: '@rAnd with slow, deliberate steps,@w500. she reached Battler,@w583. ......who was still dead and pierced......'
39761: '@rThen,@w333. ......slowly...@w500....she touched him.@k@r......She tugged...@w500.on his sleeve.'
39762: '@rHowever, Battler showed no reaction......'
39763: '@r......When she realized that it wasn''t sleep...@w500....but death,@k .........the witch with the forlorn gaze...@w500....drooped her head even lower...'
39764: '@rThen...@w333....she quietly...@w583.......whispered...'
39765: 'BEATRICE@r"...............@k@v27/50700982. ............You@v27/50700983.......liar........."'
39766: '@rBeato...@w500....softly touched Battler.........@k@rThen,@w500. ......she pressed her forehead against Battler''s chest.'
39767: '@rThere was no longer......@w666.......any heartbeat.'
39768: '@rIt wasn''t just because he had surrendered.@k@rIt was because the witches had banished him from the game board.'
39769: '@r......So now...@k@r......Battler would never......return...'
39770: '@rSo now...@k@r.........the Golden Witch BEATRICE...'
39771: '@r...had no more reason...@w500.......to exist............'
39772: 'BEATRICE@r@v27/50700984..........Thank you...@w800.@r@v27/50700985.@|@y......Liar......@w800.@r@v27/50700986....Goodbye......@w800.@r@v27/50700987.And.........@r@|@y@v27/50700988....I''m sorry.'
39773: '@rThen,@w583. ......the Golden Witch,@w333. ...her task...@w500....completed,@k ...scattered...@w500.as a spray of gold.'
39774: '@rIn the Golden Land,@w500. ......the gray rain...@w333.gently continued to fall.'
39775: '@r......There was a faint aroma of good black tea.'
39776: '@rBeato stared blankly at the surface of the tea.'
39777: '@rThere was VIRGILIA, continuing her knitting,@k@|@y .........along with me and......Dlanor, talking to each other.'
39778: '@r......This is...@w416.......a flashback......'
39779: '@rA flashback to a memory of Battler''s, which Dlanor''s sword must have given him as it pierced him......'
39780: '@rA flashback of that time Dlanor had come to visit the tea party in the Golden Land.........'
39781: 'Dlanor@r@v47/54600360."The same goes for ME.@k@v47/54600361. I will not be caught unawares in our next BOUT."'
39782: 'Battler@r@v10/50101252."Perfect.@k@v10/50101253. I''ll take you on anytime.@k@v10/50101254. Give me everything you''ve got."'
39783: 'Dlanor@r@v47/54600362."You have my WORD.@k@v47/54600363. Everything I HAVE."'
39784: '@r......Dlanor.'
39785: '@rI''d thought she was a ruthless killer doll without a heart,@k ...but maybe she actually is pretty approachable.'
39786: '@r......Though of course, neither of us will show any mercy when fighting on the game board.'
39787: '@rFor a while, we gazed at the rain-drenched rose garden...@kas we quietly enjoyed our tea.'
39788: 'Battler@r@v10/50101255."......Still, it really is terrifying.@k@v10/50101256. The way you fight.@k@|@y@v10/50101257. ......Knox''s Ten Commandments, or the Decalogue, wasn''t it?@k @v10/50101258.Those fallbacks of the mystery genre, right?"'
39789: 'Dlanor@r@v47/54600364."YES.@k@v47/54600365. ......They are commandments conceived by my FATHER."'
39790: 'Battler@r@v10/50101259."Hidden doors must not exist.@k@v10/50101260. That''s Knox''s third commandment, right?@k @v10/50101261.That means there''s no need for detectives to even look for hidden doors.@k@v10/50101262. ......Sounds pretty ridiculous."'
39791: '@rBERNKASTEL talked about this.'
39792: '@rShe said that even searching for hidden doors was a waste of time because they''re forbidden by Knox''s third commandment.'
39793: '@rIt makes me want to argue back and say it isn''t so uncommon for a rich family''s mansion to have a hidden door or two built into it.'
39794: '@r......But apparently, you can get away with that kind of rule in the mystery genre.'
39795: '@rAs an aside, there exist many wonderful mysteries in which hidden doors appear,@k and where hidden doors are the theme.'
39796: '@r......Though of course this is limited to novels which have the "premise" that hidden doors exist.'
39797: '@rWithout that "premise", hidden doors mustn''t exist.@k@rSo if that "premise" isn''t there, there''s no need to search for hidden doors.'
39798: '@r......I think that''s probably the essence of her ridiculous argument.'
39799: '@rI get the feeling that the detective trying to expose the truth and the illusion trying to mask it with fiction...@kare getting blended together, leading to a bizarre form of argument similar to a Devil''s Proof.'
39800: '@rMaking a locked-room murder seem to be accomplished by a witch with magic—that''s fantasy.'
39801: '@rExposing that it was a Human''s crime done with tricks—that''s anti-fantasy.'
39802: '@rInvestigating all possibilities to expose what those tricks are—that''s mystery.'
39803: '@rBut claiming that possibilities with no hints supporting them are unworthy of investigation—that''s......also mystery?'
39804: '@rHidden doors, by definition, are hidden in a way that there can''t be any clues.'
39805: '@rWould claiming that hidden doors therefore necessarily exist even if the detective can''t find them...@k...be anti-mystery?'
39806: '@r.........That''s enough of that.@k@rThis argument is too far of a digression from the riddles I''m actually supposed to be solving.'
39807: '@rMy fight is very simple.'
39808: '@rI''m only fighting to explain that it was possible for a Human to carry out these crimes which were supposedly carried out by a witch.'
39809: '@rThis whole discussion about "mystery" and "anti" doesn''t serve any purpose.'
39810: '@rSo I can''t bring myself to have any particular interest in the rules known as the Knox Decalogue...'
39811: 'Dlanor@r@v47/54600366."............Do you dislike Knox?"'
39812: 'Battler@r@v10/50101263."It doesn''t work for me.@k@v10/50101264. ......There''s something just wrong about making it possible to deny the existence of all hidden doors without investigating.@k@v10/50101265. ...It''s about as dubious as a Devil''s Proof.@k@v10/50101266. ......Even though it''s supposed to be the exact opposite of fantasy, it somehow feels like it''s the same kind of argument."'
39813: 'Dlanor@r@v47/54600367."..........................."'
39814: 'Battler@r@v10/50101267."......Ah, I shouldn''t have said that.@k@v10/50101268. Your dad was the one who made them, after all."'
39815: 'Dlanor@r@v47/54600368."Pay that no MIND.@k@v47/54600369. ......After all, there are some who say they are nothing more than mindless FUN."'
39816: 'VIRGILIA@r@v30/53200276."The Decalogue feels like something very arrogant to you, right, Battler-kun...?"'
39817: 'Battler@r@v10/50101269."......To be honest, yeah.@k@v10/50101270. ......If there was ever a detective who said he didn''t need to look for hidden doors because they must not exist,@k@v10/50101271. everyone should start looking around on the floor to see if some of his screws had come loose..."'
39818: 'Dlanor@r@v47/54600370."In that case, Battler,@k@v47/54600371. ......let us say we did away with the third COMMANDMENT.@k@v47/54600372. In that case, what would happen to locked-room MYSTERIES...?"'
39819: '@r......What if Knox''s third commandment, "hidden doors are forbidden", didn''t exist...?'
39820: 'Battler@r@v10/50101272.".........You mean if hidden doors became OK to use as the solution to locked-room mysteries?"'
39821: 'Dlanor@r@v47/54600373."I do not mean hidden doors with hints or FORESHADOWING.@k@v47/54600374. ...I mean hidden doors that even the detective cannot find because, of course, they are HIDDEN."'
39822: 'VIRGILIA@r@v30/53200277."Battler-kun, you often fight by using a Devil''s Proof to propose an undiscoverable element X.@k@|@y@v30/53200278. ......That''s what this is about."'
39823: 'Battler@r@v10/50101273."That''d be horrible.@k@v10/50101274. Locked-room mysteries would just unravel as stories."'
39824: '@rThat was another way of saying......that those kinds of stories would simply no longer work.'
39825: '@rNo one would want to try solving the mystery in the first place if they knew the answer might just be an unforeseeable hidden door.'
39826: 'Battler@r@v10/50101275."......If you aren''t first given some guarantee that no hidden doors exist,@k@v10/50101276. you don''t feel like trying to deduce anything.@k@|@y@v10/50101277. ............I see.@k@v10/50101278. Knox''s third commandment is needed.@k@v10/50101279. ......Without it, locked-room mysteries wouldn''t even be worth anyone''s time."'
39827: 'VIRGILIA@r@v30/53200279."If you don''t feel like trying to deduce anything...what does that mean...?"'
39828: 'Battler@r@v10/50101280."It means you don''t even feel like reading to begin with."'
39829: 'Dlanor@r@v47/54600375."That is CORRECT.@k@|@y@v47/54600376. ......Humans are weak creatures who cannot even think unless they have assurance that reasoning is POSSIBLE."'
39830: 'VIRGILIA@r@v30/53200280."...That reasoning is possible.@k@v30/53200281. ......In other words, they need encouragement that they can solve it if they do their best."'
39831: '@rThat......might actually be true.'
39832: '@r......It''s the same with exercising.'
39833: '@rIf you''re told to run ten laps around the campus, you can tough it out.'
39834: '@rBut if you''re made to run without even knowing how many laps it''s going to be,@k you''ll probably get tired out before you make it around three times.'
39835: '@rThe same thing goes for thinking and reasoning.'
39836: '@rDepending on whether or not a problem is guaranteed to be solvable,@k the way we humans react to it changes completely......'
39837: 'VIRGILIA@r@v30/53200282."In detective novels, there''s always a scene where the detective announces that he''s discovered who the culprit is.@k@|@y@v30/53200283. ......That''s a sign saying "The hints have all been given in the previous parts of the story,@k@v30/53200284. so dear readers, please try to reason it out"."'
39838: 'Battler@r@v10/50101281.".........Huh.@k@v10/50101282. I always thought it was just a classic line... Never knew it had that meaning."'
39839: 'VIRGILIA@r@v30/53200285."To put it harshly,@k@v30/53200286. as long as the detective doesn''t say that,@k@v30/53200287. ......even the most avid mystery lover who prides himself on his deductions won''t feel like trying to solve it."'
39840: 'Dlanor@r@v47/54600377."......In the previous games, you were like that yourself, were you NOT......?"'
39841: 'Battler@r@v10/50101283."...................................."'
39842: '@rCome to mention it,@k ......maybe that really was the case.'
39843: '@rMy fight against Beato began in earnest starting with the second game, I think.'
39844: '@rWhen Beato threw locked-room mysteries at me, at first,@k I didn''t seriously try to tackle them.'
39845: '@rAfter all, I knew nothing except that people had died in a locked room, and the windows and doors were all locked from the inside.'
39846: '@r......I had basically no hints.'
39847: '@rSo I refused to debate, on the grounds that I couldn''t fight because the lack of clues made reasoning impossible.'
39848: '@r......After that, Beato sneered at me, didn''t she...@kasking whether I would repeat that over and over forever in an endless repetition of moves......'
39849: '@rAt that time, Beato said this:'
39850: 'BEATRICE@r@v27/50700989.— The reason you incompetent fools always stop thinking and then moan about it is "lack of information"!@k @v27/50700990.If you are then given information, you start doubting whether the information is true or not by "denying the basis"!@k @|@y@v27/50700991.Aren''t those convenient?@k @v27/50700992.What clever little words to hide your own incompetence.'
39851: '@rThen, she said she''d give me reliable information that couldn''t be denied,@k and created the rule called the red truth.'
39852: '@rOnly after Beato had done all that for me did the curtain finally rise on my battle with her......'
39853: 'Battler@r@v10/50101284."......So, ......once I finally had the guarantee that I could solve this tale if I tried,@k@v10/50101285. ......that''s when I stepped into the ring with her for the first time......?"'
39854: 'Dlanor@r@v47/54600378."BEATRICE.@k@v47/54600379. ......She is a strange PERSON.@k@|@y@v47/54600380. Mysteries are the only spaces where witches can live, and yet she herself began to give you the red truth, a method by which those mysteries could be SOLVED."'
39855: '@rYou could say that the red truth is a hint Beato gives me so that I''ll agree to compete in this war of reasoning.'
39856: '@r......It''s a carrot.'
39857: '@rBeing given a hint is like she''s saying,@k "Go on.@w500. Try solving it.@w500. It is possible."'
39858: '@r......An enigma which is guaranteed to be solvable...@w500....can''t be called a true "enigma".'
39859: 'Battler@r@v10/50101286."Isn''t this almost as though...@v10/50101287.......Beato herself...@v10/50101288.is admitting that she...@k@v10/50101289....isn''t really a witch...?"'
39860: 'VIRGILIA@r@v30/53200288."Well now.@k@v30/53200289. That does seem logical.@k@v30/53200290. ......She truly is a strange child."'
39861: 'BEATRICE@r"................................."'
39862: '@rBeato gave no answer.'
39863: '@rWith gray eyes, ......she did nothing but blankly gaze at the steam rising from her black tea...'
39864: 'Dlanor@r@v47/54600381."My father created the Decalogue to act as a crutch for the power of THINKING.@k@|@y@v47/54600382. ......It most certainly was not created to arrogantly insist on the way things must BE."'
39865: 'Battler@r@v10/50101290."......A crutch...for the power of thinking......"'
39866: 'Dlanor@r@v47/54600383."YES.@k@v47/54600384. Knox''s 8th: It is forbidden for the case to be resolved with clues that are not PRESENTED.@k@v47/54600385. ......This does not only mean that one must avoid making baseless guesses that are not supported by CLUES."'
39867: 'VIRGILIA@r@v30/53200291."If you turn it around,@k@v30/53200292. .........it means that the one posing the mystery must present clues which lead to the solution."'
39868: 'Battler@r@v10/50101291."......So, in other words,@v10/50101292. ......if a story follows the Decalogue,@k@v10/50101293. ......all riddles must have hints,@v10/50101294. ......and therefore, it''s guaranteed that finding the solution is possible."'
39869: '@rI see......so this is what she means by a crutch for the power of thinking.'
39870: '@rIf you can believe that it''s solvable, you start feeling the desire to have a go at those riddles.'
39871: '@rIf you''re capable of believing that hints do exist, you get fired up about rereading the story to search for them......'
39872: 'Battler@r@v10/50101295."I''ll admit......it might have the power of giving courage to people trying to solve it."'
39873: 'Dlanor@r@v47/54600386."The Knox Decalogue is often thought of as a series of restrictions imposed by the one who made the mystery,@k@v47/54600387. but it is also vital for the READERS.@k@|@y@v47/54600388. .........By using the Decalogue as a crutch,@k@v47/54600389. we are given the courage needed to use reasoning, as well as the willpower to reread the tale several times...@k@v47/54600390.in search of the clues we know must be hidden THERE."'
39874: 'Battler@r@v10/50101296.".........It''s like the lid of a jar of jam which is too tight and won''t open.@k@v10/50101297. ......Like Mom always used to say,@k@v10/50101298. ......if you think you can''t open it, then it really won''t open no matter how hard you try.@k@|@y@v10/50101299. ......The same thing happens in sports.@k@v10/50101300. They say that whether or not you have a strong image of yourself and believe you can win no matter what...@k@v10/50101301.has a large impact on the records you set."'
39875: '@rIn that case,@k the Knox Decalogue isn''t really a set of arrogant and strict restrictions.@k ......You can also see it as a way to encourage readers, who are trying to solve the mystery, by telling them to give it their all since it''s definitely solvable...'
39876: 'Battler@r@v10/50101302.".........That''s an interesting way to interpret it.@k@v10/50101303. ......But I''ve heard that not every detective novel in the world necessarily follows the Decalogue.@k @v10/50101304..........If you ran into one of those, wouldn''t you feel betrayed...?"'
39877: 'Dlanor@r@v47/54600391."Even the Decalogue is nothing more than a single interpretation, and it does not apply to all mystery STORIES.@k@|@y@v47/54600392. ......Though among fundamentalists of my father''s work,@k@v47/54600393. it seems there are those who harshly criticize works which violate the Decalogue and call them HERESY..."'
39878: '@rThere''s no end of arguments like this in the mystery world.'
39879: '@rIs this or that famous detective novel a "fair" mystery—in other words, one that follows Knox''s Ten Commandments?'
39880: '@rThat sort of argument is already an eternal theme of the mystery world.'
39881: '@rIn fact, in mystery discussions,@k arguments like these sometimes become more heated than talk about the actual solutions......'
39882: 'Battler@r@v10/50101305."I can understand the criticism.@k@v10/50101306. ......You try your best to solve a mystery, trusting that it follows the Decalogue and can be solved,@k@v10/50101307. but then it turns out that it was never made to be solvable in the first place...I can understand how irritating that must be."'
39883: '@rThat''s right.'
39884: '@rWhen fighting with the Decalogue, ......there''s just one thing you want guaranteed from the beginning.'
39885: '@rAnd that is.........the guarantee that the detective novel will adhere to the Decalogue.'
39886: '@rIf a work labels itself as an orthodox mystery, then you have nothing to worry about.'
39887: '@rHowever, the mystery genre contains many unorthodox sub-genres within it.'
39888: '@r.........Does that mean that trying to use reasoning in an unorthodox detective novel...@kis a complete waste of time......?'
39889: 'Battler@r@v10/50101308."......Looking at it that way,@v10/50101309. ......it really does feel arrogant."'
39890: 'Dlanor@r@v47/54600394."YES.@k@v47/54600395. I also find it extremely sad that my father''s Decalogue has been used as such an elitist WEAPON."'
39891: 'Battler@r@v10/50101310."............So...you just fought Beato using the Decalogue as a weapon.@k@v10/50101311. ......Can I take that as proof that this game world of Beato''s follows the Knox Decalogue......?"'
39892: 'BEATRICE@r"......................................."'
39893: '@rWhen I asked that, ......there was a strange silence.'
39894: '@rVIRGILIA, Dlanor,@w500. ......and of course, Beato...@w500....all remained silent for a while......'
39895: '@rAlmost as though my question had touched at the core of something...'
39896: 'VIRGILIA@r@v30/53200293."That......is something I cannot answer myself."'
39897: 'Battler@r@v10/50101312."Why...?"'
39898: 'VIRGILIA@r@v30/53200294."This is a game that this child made.@k@v30/53200295. ......A game to determine a winner between you and her.@k@v30/53200296. ......She called it a confrontation between mystery and fantasy."'
39899: 'VIRGILIA@r@v30/53200297."But unfortunately, she has never called it an orthodox mystery.@k@v30/53200298. That means you have no guarantee that it follows the Decalogue."'
39900: 'Dlanor@r@v47/54600396."......But at the same time, Miss BEATRICE has said that this game is a contest between you and HER.@k@v47/54600397. ......That means there is room for you to achieve VICTORY."'
39901: 'Battler@r@v10/50101313."In other words,@v10/50101314. ...............you''re trying to say that it''s possible to deduce the solution?"'
39902: 'BEATRICE@r"......................................."'
39903: 'VIRGILIA@r@v30/53200299.".........If you asked her that question, she would probably say that it is.@k@|@y@v30/53200300. ......However, just as she is the challenger and you are the challenged, the two of you are different creatures.@k@v30/53200301. ......Something Beato might have proposed thinking it is solvable...@k@v30/53200302.may or may not be something that is solvable for you as well."'
39904: '@rFor example, let''s say we pose a simple riddle that any Japanese person would be familiar with.'
39905: '@r......However, if the person we''re telling this riddle to is a foreigner with a Japanese-English dictionary in their hand,@k it might be almost impossible to solve.'
39906: '@r......In other words, it''s possible to have a one-sided "solvable problem",@k which might be easy for the questioner but extremely difficult for the person trying to solve it...'
39907: '@rBy the way, do you know of the foreign riddle:@k "Why do dragons sleep all day?"'
39908: '@rThe answer is:@w666. "Because they fight knights".'
39909: '@rIt''s a riddle from the English realm, so it might be a little tough for a Japanese person.'
39910: 'VIRGILIA@r@v30/53200303."For that reason,@k@v30/53200304. .........I cannot promise that this tale is something you will definitely be able to solve.@k@v30/53200305. .........However, I can promise you one thing.@k@v30/53200306. ...I will guarantee it with the red truth."'
39911: 'Battler@r@v10/50101315.".........What?"'
39912: 'VIRGILIA@r@v30/53200307.@|@y"@c900.@[Beato wanted you to solve it,@k@v30/53200308. so she created this game—@v30/53200309.and the riddles of this tale—to be solvable.@]@c.@k@|@y@v30/53200310. That alone, I will guarantee with the red truth."'
39913: '@rIt was...@w583....the one guarantee...@w666.......that all those who try to use reasoning desire.'
39914: 'Dlanor@r@v47/54600398."I do not know whether the answer can be derived by following the Decalogue my father CREATED.@k@|@y@v47/54600399. ......However, if you run into a tight spot and want a compass for your reasoning,@k@v47/54600400. please try using my Decalogue if you REMEMBER.@k@v47/54600401. ......It might give you renewed courage and possibly even some new DISCOVERY......"'
39915: 'Battler@r@v10/50101316."Thank you.@k@v10/50101317. If I''m truly stuck, I''ll think about your fighting style.@k@|@y@v10/50101318. ......Are you sure it''s alright to help out an enemy like this?"'
39916: 'Dlanor@r@v47/54600402."Pay that no MIND.@k@v47/54600403. I came to this tea party without a GIFT.@k@v47/54600404. I hope you enjoy this in place of a SNACK.@k@|@y@v47/54600405. ......And...if you come face to face with me AGAIN,@k@v47/54600406. there will probably be no time to speak of something so CASUALLY."'
39917: '@r.........Knox''s Decalogue...@w500....and VIRGILIA''s red truth.'
39918: 'Battler@r@v10/50101319.@|@y"@c900.@[Beato wanted me to solve the riddles of this game,@k@v10/50101320. so she created them to be solvable.@]@c."'
39919: '@rIn other words, ......Beato thinks I can solve it.'
39920: '@rIsn''t that......proof that it''s possible to apply logic to this......?'
39921: '@r......Of course, that''s from Beato''s point of view,@k ......and it doesn''t necessarily mean that it''ll be possible for me to work it out......'
39922: '@rBut compared to before now, when I didn''t even know whether applying reasoning was possible or impossible,@k ......that one sentence might give me a great deal of courage and strength...'
39923: '@rAt least it has the power to silence any negative thoughts about it just being useless anyway...'
39924: 'VIRGILIA@r@v30/53200311."......Unless the other party assures you that it''s possible to deduce the answer, you won''t try.@k@v30/53200312. ......It''s almost like love between shy, young people."'
39925: 'Battler@r@v10/50101321."Love?"'
39926: 'VIRGILIA@r@v30/53200313."Yes.@k@v30/53200314. .........Unless the other person first proves that they love you, you don''t want to love them.@k@v30/53200315. ......Right?"'
39927: '@rBoth boys and girls......want to hear someone say "I love you" to them first without being prompted.'
39928: '@rThat''s the dream.'
39929: '@r......They don''t want to love another person...@kuntil they''re sure that person will love them back.'
