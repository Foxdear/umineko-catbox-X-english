40465: 'Battler@r@v10/50101510."And...@k@v10/50101511.because no unique truth exists, everything is covered in darkness.@k@v10/50101512. ......Therefore,@k@v10/50101513. although both my theory and Erika''s are impossible to deny, neither is the single truth.@k@v10/50101514. They are uncertain things, neither of which can be denied, and neither of which is absolute...!!"'
