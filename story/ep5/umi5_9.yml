35920: 'Battler@r@v10/50100737."......I''m taking it back.@k@v10/50100738. .........This is our game.@k@|@y@v10/50100739. ......You two aren''t invited!!"'
35921: 'BERNKASTEL@r@v28/52100346."*giggle*.@k@v28/52100347. Yes, that''s true.@k@v28/52100348. .........This is your game.@k@v28/52100349. Then show us you''re capable of reclaiming it.@k@v28/52100350. ......You couldn''t even win Beato''s games when she went easy on you at every turn.@k@v28/52100351. Show us how far you can take Lambda''s completely ruthless game without anyone''s help!"'
35922: 'LAMBDADELTA@r@v29/52200329."Now awaken, Ushiromiya Battler!! Welcome to the morning of October 5th!!"'