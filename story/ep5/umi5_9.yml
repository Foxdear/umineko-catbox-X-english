35910: 'Erika@r@v46/54500238."Is now really the time to act tough?@k @v46/54500239..........Oh well, let''s both give it our all, okay?@k @|@y@v46/54500240.Together, let''s tear the witch illusions to shreds.@k@v46/54500241. *giggle*giggle*!"'
