35907: 'Battler@r@v10/50100730.".............................."'
35908: 'Erika@r@v46/54500234."Don''t worry.@k@v46/54500235. ......Lady LAMBDADELTA may be a far more terrifying opponent than that fool BEATRICE,@k@v46/54500236. but I''ll be giving you plenty of support, so there won''t be any problems.@k@|@y@v46/54500237. ......Let''s work together, and this time we''ll expose the witch illusions for what they really are."'
