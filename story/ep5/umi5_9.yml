35863: 'LAMBDADELTA@r@v29/52200095."*giggle*!@k @v29/52200257.Anyone can change their voice.@k@v29/52200258.@|@y A sweet voice when begging Papa for a favor♪@k @v29/52200259.@|@yA hoarse-sounding voice when taking the day off school.@k@v29/52200260.@|@y An apologetic voice when turning down a friend that you actually hate!@k @v29/52200261.@|@yIF YOU WANT♪,@k@v29/52200262.@|@y I can do~@k@v29/52200263.@|@y a n y  v o i c e ☆@k@v29/52200264.@|@y at all~!"'
35864: 'BERNKASTEL@r@v28/52100324.".........You should stop being a witch and become a voice actress."'
35865: 'LAMBDADELTA@r@v29/52200265."Heheheheheheheh!@k @v29/52200266.So, are all the pieces set up for both of us now?@k @|@y@v29/52200267............."Furudo Erika".@k@v29/52200268. What a wonderful piece.@k@v29/52200269. She suits you so much more than Ange did, Bern."'
35866: 'Erika@r@v46/54500225."............Your praise honors me, Lady LAMBDADELTA."'
35867: 'LAMBDADELTA@r@v29/52200270."The pleasure is mine.@k@|@y@v29/52200271. ......Mmm, she really is wonderful.@k@v29/52200272. Super adorable.@k@v29/52200273. I''m dying to break her spirit with my witch illusions and see her face twist in humiliation."'
35868: 'BERNKASTEL@r@v28/52100325."......Hear that?@k@v28/52100326. ......Don''t embarrass me, okay?@k @v28/52100327.Show me that you''re a much more useful piece than Ange was."'
35869: 'Erika@r@v46/54500226."Yes, leave it to me.@k@v46/54500227. Lady BERNKASTEL, my master.@k@v46/54500228. ......I''m nothing like that gloomy, dull, utterly charmless piece."'
35870: 'LAMBDADELTA@r@v29/52200274."*giggle*giggle*giggle*!@k @v29/52200275.She''s so right.@k@v29/52200276. The only useful thing that Ange did was get turned into meat chunks to fire Battler up!"'
35871: 'LAMBDADELTA@r@v29/52200277."We have no interest at all in family love or sibling love!@k @v29/52200278.The game we want to see is more gruesome and sticky!@k @v29/52200279.A <grotesque>, <pop>, and <cute> murder case!!"'
35872: 'BERNKASTEL@r@v28/52100328.".........If Natsuhi is the king, then I wonder if Beato is the queen.@k@v28/52100329. *giggle*.@k@v28/52100330. The pack of witches and furniture guarding Natsuhi is less like a set of chess pieces and more like—"'
35873: 'LAMBDADELTA@r@v29/52200280."Bowling pins, right?!@k @|@y@v29/52200281.Kyahhahahahahahahahahaha!!@k @v29/52200282.Illusions of Natsuhi and Beato,@k@v29/52200283. Kinzo and the worthless furniture!@k @v29/52200284.Entertain us a bit, will you?!"'
35874: 'LAMBDADELTA@r@v29/52200285."Especially Beato!@k @v29/52200286.We''re bored of you now!@k @v29/52200287.That "Legend of the Witch" murder game of yours is over!@k @v29/52200288.And your time is up too!!"'
35875: 'LAMBDADELTA@r@v29/52200289."This game board is Bern''s and mine now.@k@v29/52200290. It''ll suit you to be reduced to one of our pieces and toyed with for all eternity!!"'
35876: 'BERNKASTEL@r@v28/52100331."*giggle*giggle*giggle*giggle*giggle*.@k@v28/52100332. Both Natsuhi and Beato are sacks of filthy, rotten truth, just entrails wrapped up in a thin layer of skin.@k@v28/52100333. ......Tearing that to shreds and dragging the insides out will be one of my—@k@v28/52100334.no, one of our few pleasures."'
35877: 'LAMBDADELTA@r@v29/52200291."Yes, you can have a lot of fun with it.@k@v29/52200292. Hey, are you watching?@k @v29/52200293.BEATRICE?@k @v29/52200294.Look at how much fun can be had playing with your board.@k @v29/52200295.I''ll show you.@k@v29/52200296. A fifth game that''s actually fun!!"'
35878: 'BERNKASTEL@r@v28/52100335.".........It''s a bit sad if we''re the only ones having a pleasant chat.@k@v28/52100336. Why don''t you let Beato talk too?"'
35879: 'LAMBDADELTA@r@v29/52200297."Hear that?@k@v29/52200298. I''ll give you special permission to talk.@k@v29/52200299. What do you hope to gain from this latest game?!"'
35880: 'BEATRICE@r"......................................."'
35881: 'LAMBDADELTA@r@v29/52200300."Ahahahaha!@k @v29/52200301.Nothing, she says!@k @v29/52200302.That''s right, that''s right!@k @v29/52200303.You''re the loser who got crushed by Battler!@k @v29/52200304.Leave it to me, okay?@k @v29/52200305.I''ll put the witch side on top in a snap!@k @v29/52200306_b.But I''m gonna be sacrificing you as a piece in the process!!"'
35882: 'Erika@r@v46/54500229."What a dreadful loss of face for BEATRICE, keeper of the gold, to have her epitaph so easily solved before the first twilight.@k@v46/54500230. ......*giggle*giggle*!!"'
35883: 'BERNKASTEL@r@v28/52100337."......Isn''t it great that you''ve been left as a piece as part of Natsuhi''s fantasy?@k@v28/52100338. ......Well, except that we''re treating you as a pin now instead of a piece."'
35884: 'LAMBDADELTA@r@v29/52200307."The Golden Witch BEATRICE is out of the picture now!@k @v29/52200308.In my game, you and your furniture only have a teeny-tiny role, a loser''s role!!@k @v29/52200309.You can enjoy getting tossed and thrown around and made into toys for me and Bern!!"'
35885: 'BERNKASTEL@r@v28/52100339.".........If that''s not what you want, just tell us to stop.@k @v28/52100340.And we''ll stop."'
35886: 'BEATRICE@r@v27/50700402."......................................."'
35887: 'LAMBDADELTA@r@v29/52200310."She doesn''t mind!@k @|@y@v29/52200311.*giggle*giggle*!!@k @v29/52200312.Pin confirmed!!"'
35888: 'BERNKASTEL@r@v28/52100341."Ahhahaha...ahhahahahahaha!"'
