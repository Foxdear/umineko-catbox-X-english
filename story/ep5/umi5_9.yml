35693: '@r......The sound of crashing waves.'
35694: '@rThe sound of the tide surging.@k The noise of the sea breeze.'
35695: '@rWhenever my headache torments me, these are the sounds that fill my head......'
35696: '@rMy inability to bear a successor placed me in a very difficult position within the Ushiromiya family...'
35697: '@rI tried every medication that was said to promote fertility, every incense or herb,@k ......but nothing I tried had any effect.'
35698: '@rUntil I was blessed with Jessica 18 years ago,@k ......I was ashamed to even call myself a wife.'
35699: 'BEATRICE@r@v27/50700325."......The creation of a child depends on the efforts of two people and the whims of heaven.@k@v27/50700326. It''s not fair to place all the blame on yourself."'
35700: 'Natsuhi@r@v03/50900597."I still don''t know what caused my inability to become pregnant.@k@v03/50900598. I even went to see noted physicians.@k@v03/50900599. I underwent humiliating examinations.@k@v03/50900600. ......But I was always just told that they didn''t understand the reason..."'
35701: 'BEATRICE@r@v27/50700327."Even though quite some time had passed since your marriage, you still couldn''t bear a child.@k@|@y@v27/50700328. ......I see.@k@v27/50700329. It''s only natural that Eva, who secretly aspired to become the next head, would start getting ideas..."'
35702: '@rEva tried to convince Father that I was a failure as a future head''s wife.'
35703: '@rIt was a time when Kinzo was also very disappointed in my husband''s repeated business failures.'
35704: '@rOn the other hand, Eva''s husband Hideyoshi''s business was growing well, completely the opposite of my husband''s business.'
35705: '@r......He was the only person who could bring Father good news.'
35706: '@rIn that case, perhaps there could be no blame placed on Father if he decided to lend an ear to Eva''s words...@k...or even accept them without question.'
35707: '@rIt was all my fault, because I couldn''t bear a child...'
35708: 'BEATRICE@r@v27/50700330."You are sinless.@k@v27/50700331. Aren''t babies of this country carried here by storks?@k@v27/50700332. If anyone is to be judged, it should be the stork."'
35709: 'Natsuhi@r@v03/50900601."...............Thank you.@k@v03/50900602. However, ...even though he was still in good health then, the head was already well past his prime,@k@v03/50900603. and it''s not hard to imagine that he wanted to see his grandchildren''s faces as soon as possible..."'
35710: 'BEATRICE@r@v27/50700333."Who cares.@k@v27/50700334. If he wanted a grandchild, he could have just done what he wanted with that appalling amount of money he had.@k@|@y@v27/50700335. ......This is Kinzo, the man who always bragged about how money could create anything.@k@v27/50700336. If he wanted a grandchild, why couldn''t he just manage something with that money he was so proud of...?!"'
35711: 'Natsuhi@r@v03/50900604."..................Yes, ......that''s right.@k@v03/50900605. ......The head......gave up on me when I couldn''t bear a child...@k@v03/50900606....and did just that."'
35712: '@r......Thinking it the duty of anyone in possession of large amounts of money, the head gave a lot to charities.'
35713: '@rOne among these, the facility known as the "Gospel House", had been given an especially large donation, possibly because he had old ties with that place.'
35714: 'BEATRICE@r@v27/50700337."Ah, the Gospel House.@k@v27/50700338. ......Furniture came from that place quite often."'
35715: 'Natsuhi@r@v03/50900607."As part of their work training and public activity,@k@v03/50900608. the head employed Gospel House children with exceptional grades as servants.@k@|@y@v03/50900609. ......All of the servants in the mansion with the character "@bon.@<音@>" in their names—Shannon, Kanon, Lunon, Manon, Lenon, and more besides—@k@v03/50900610.were children from there."'
35716: 'BEATRICE@r@v27/50700339."......There were quite a lot of them, weren''t there...@k@v27/50700340. Though most quit after just a few years."'
35717: 'Natsuhi@r@v03/50900611."That''s probably because a few years of wages from working here would earn them more than enough to live on their own.@k@v03/50900612. ......Experience as a servant for the Ushiromiya family is a wonderful thing to add to one''s resume.@k@v03/50900613. I''m sure it was also the head''s desire for them to gain this for themselves and then spread their wings in society."'
35718: 'BEATRICE@r@v27/50700341."............I see.@k@v27/50700342. ......So, an adopted child........."'
35719: 'Natsuhi@r@v03/50900614.".............................."'
35720: 'Natsuhi@r@v03/50900615."F-Father......@k@v03/50900616. What......did you just say......?"'
35721: 'Kinzo@r@v01/51500164."Accept this infant as my grandchild."'
35722: 'Kumasawa@r@v18/51800021."Ohhh...... There, there.@k@v18/51800022. There, there..."'
35723: '@rApparently, the baby Kumasawa was trying to soothe didn''t like the air in the study at all.'
35724: '@r...It kept on crying as if it hated it here......'
35725: 'Natsuhi@r@v03/50900617."M-...my apologies, Father...@k@v03/50900618. ......I''m not sure what you want me......"'
35726: 'Kinzo@r@v01/51500165."Accept this infant as my grandchild.@k@v01/51500166. You shall raise it to be the one who succeeds Krauss."'
35727: 'Natsuhi@r@v03/50900619."......In other words, ......you want my husband and I to raise this baby...as our own child......?"'
35728: 'Kinzo@r@v01/51500167."That''s right.@k@v01/51500168. It''s clear by now that you are barren.@k@v01/51500169. ......Your body must have some sort of defect."'
35729: 'Kumasawa@r@v18/51800023."Ooh... There, there.@k@v18/51800024. Ooh, there, there......"'
35730: '@rAs though she couldn''t hear our discussion in the slightest, Kumasawa kept on persistently trying to cuddle the baby.'
35731: '@rThis made its crying get even louder......'
35732: 'BEATRICE@r@v27/50700343."............That''s nonsense.@k@v27/50700344. If all the responsibility of giving birth rested with the woman, this world would have no need for men."'
35733: 'Natsuhi@r@v03/50900620."I''ve never forgotten the bitter pain I felt that day......@k@v03/50900621. ......Of course I wanted a child......@k@v03/50900622. ......But no matter how much I prayed, I couldn''t get pregnant......@k@v03/50900623. Thinking that something to do with my body might be the cause, I went to see several famous doctors.@k@v03/50900624. But even so, no matter how hard I tried, ......I couldn''t become pregnant......"'
35734: 'BEATRICE@r@v27/50700345."After all that, ......for this to be how you were treated...@k@v27/50700346. ............I understand."'
35735: '@rThe baby had been picked up by the Gospel House just recently.'
35736: '@rOf course, it wasn''t that I didn''t feel compassion for the child,@k who was so young and who had already lost its parents'' affection.'
35737: '@rHowever, .........the pain and sadness I felt were far greater.'
35738: '@rIt would have been another story if I had suffered to bear this child,@k ......but why...@w500....did I have to cradle this baby,@w500. who not only shared none of my blood,@k but who was not related to my husband in the slightest either......?'
35739: 'Natsuhi@r@v03/50900625."I don''t hate Father.@k@v03/50900626. ......If anything, ......I only hated my own body...!@k @v03/50900627.I detested it!@k @v03/50900628.I truly detested my own body for being unable to bear a child......!!@k @v03/50900629.So I prayed.@k@v03/50900630. I prayed to both angels and demons!!@k @v03/50900631.And my wishes were granted by both...!"'
35740: 'BEATRICE@r@v27/50700347."......What did you pray to the angels?"'
35741: 'Natsuhi@r@v03/50900632."I prayed for a miracle in my body...!@k @v03/50900633.If there was something wrong with my body, I could accept that.@k@v03/50900634. But I wanted to overcome that defect and somehow be granted the miracle of my husband''s child...!"'
35742: 'Gaap@r@v32/53700060."......That wish came true.@k@v32/53700061. ......The next year, you gave birth to Jessica."'
35743: 'BEATRICE@r@v27/50700348."And......what did you pray to the demons?"'
35744: 'Natsuhi@r@v03/50900635."I couldn''t stand it,@v03/50900636. I couldn''t stand it......@k@v03/50900637. I cursed this body of mine...!@k @v03/50900638.And I cursed this baby,@v03/50900639. ......who was the living reminder of my failure...!!"'
35745: 'Ronove@r@v31/53100086.".........What did you wish for?"'
35746: 'Natsuhi@r@v03/50900640."For the first time in my life, I prayed and wished to demons...!!@k @v03/50900641.I wished that this baby would simply disappear!!"'
35747: '@r......Of course, that wish was also granted...by demons.'
35748: '@rOn that day, I left the baby with one of the older servants and went to think about the future in the rose garden.'
35749: '@rNo, that''s a lie.@k ......I just wanted to clear my mind of everything.'
35750: '@rThe baby''s cries were aggravating,@k so I ordered the servant to take the baby to a place where I couldn''t hear.'
35751: '@r......By a place where I couldn''t hear, I meant somewhere far away.'
35752: '@rYes, I wished.'
35753: '@r......I wished for the servant to take the baby far away and never return...!!'
35754: 'Ronove@r@v31/53100087."I see......@k@v31/53100088. ......So, a passing demon heard your wish, Natsuhi-sama."'
35755: 'BEATRICE@r@v27/50700349."And then, ......what happened next?"'
35756: 'Natsuhi@r@v03/50900642."After that...was a bizarre accident that could only have been granted me by a demon..."'
35757: '@rThe woodland path from the rose garden to the harbor is certainly well suited for a pleasant walk.'
35758: '@r......And from time to time, if the mood took you, it would undoubtedly feel good to veer off the path and take a walk through the trees.'
35759: '@rHowever, .........wouldn''t that be venturing a little too far for a walk with a baby in your arms...?'
35760: 'Natsuhi@r@v03/50900643."There was a cliff on the other side.@k@v03/50900644. It was......about ten meters high, I think.@k@v03/50900645. It was rocky below.@k@v03/50900646. ...There was even a fence there!@k @v03/50900647.Are we to suppose that the servant deliberately walked all the way over there holding the baby,@k@v03/50900648. and then leaned against the fence...?!@k @v03/50900649.The only conceivable explanation is that she was lured there by the beckoning of a demon!!"'
35761: 'Gaap@r@v32/53700062."............So she was lured there.@k@v32/53700063. ......A demon who heard your wish lured that servant there......"'
35762: 'Ronove@r@v31/53100089."So then, ......the servant and the baby..."'
35763: 'Natsuhi@r@v03/50900650."They died...!!@k @v03/50900651.They fell from the cliff, down to the rocks below...!@k @v03/50900652.No, they died because I wished it!@k @v03/50900653.That means this is my—"'
35764: 'BEATRICE@r@v27/50700350."It isn''t your fault!@k @v27/50700351.There''s no need to think about it any further."'
35765: 'Natsuhi@r@v03/50900654."But it happened because I wished it......!!"'
35766: 'BEATRICE@r@v27/50700352."No, that''s wrong!@k @v27/50700353.Making wishes is one thing, but it is only at the whims of gods, demons, and witches that they may be granted!@k @v27/50700354.You bear no sin.@k@v27/50700355. Humans bear no sin.@k@v27/50700356. You can even claim that I killed them if you so desire.@k@|@y@v27/50700357. No, I did kill them!@k @v27/50700358.I took pity upon your misery, and I lured the servant with the baby to the cliff and led them down it!"'
35767: 'Ronove@r@v31/53100090."It was simply an unfortunate accident.@k@v31/53100091. If you cannot accept that explanation, then blame it on us.@k@v31/53100092. That''s why demons exist."'
35768: 'Gaap@r@v32/53700064.".........That''s right.@k@v32/53700065. We''re here for your sake.@k@v32/53700066. .....It''s not like you killed them.@k@|@y@v32/53700067. We killed them.@k@v32/53700068. So you are sinless.@k@v32/53700069. ......So please, don''t blame yourself, Natsuhi."'
35769: 'Natsuhi@r@v03/50900655."Is that true......?@k@v03/50900656. Am I truly sinless......?!"'
35770: 'BEATRICE@r@v27/50700359."Yeah, you are.@k@v27/50700360. Fuhhahahahaha!!@k @|@y@v27/50700361.Young one who claims revenge for 19 years ago.@k@v27/50700362. If you''re going to curse someone, curse me.@k@v27/50700363. However, witches have a patent on curses...!@k @v27/50700364.Let me take on this fight you''re trying to pick with Natsuhi!!"'
35771: 'BEATRICE@r@v27/50700365.@z90.I am the Ushiromiya family alchemist, BEATRICE the Golden!@k@r@v27/50700366.@z90.If anyone picks a fight with the master I serve, I will fight in my master''s stead!@k@r@v27/50700367.@z90.Revenge for 19 years ago, you say?@k@r@v27/50700368.@z90.I''ll make you learn that''s not even a blink of an eye for a witch who''s lived a thousand years!!'
35772: 'BEATRICE@r@v27/50700369.@z90.Gahahahahahaahahahahahahahaha!!@k@r@v27/50700370.@z90.So, you hate Natsuhi for wishing your death 19 years ago?!'
35773: 'BEATRICE@r@v27/50700371.@z90.Let me make you remember just who it was that lured you off that cliff...!!'
35774: '@r......As the middle-aged female servant cuddled the sobbing baby, she walked on a small path through the trees...'
35775: '@rNatsuhi had told her that the baby was too loud, so she tried to get as far from the rose garden as she could.'
35776: '@r......She was completely unaware as to why she''d gone out of her way to head in this direction.'
35777: '@rHowever, the sobbing baby...@w500....suddenly stopped crying.'
35778: '@rSomething was reflected in its eyes, but the servant couldn''t tell what.'
35779: '@rHowever, thinking that the baby had stopped because it had taken an interest in something,@k ......she headed in the direction of the baby''s gaze...'
35780: '@rThe baby had seen......a group of gold butterflies disappearing off into the trees.'
35781: '@rAnd.........on the other side of the trees, ...the servant saw a woman.'
35782: '@r.........Who?@k It was someone she didn''t recognize, someone who couldn''t possibly have been there.'
35783: '@rThe baby stopped crying and stared in that direction.@k@r...Then, the servant''s legs started to automatically carry her that way...'
35784: 'BEATRICE@r@v27/50700372."Come this way, woman.@k@v27/50700373. .........Bring that cursed baby with you."'
35785: '@r@v99/SIYOA5001."...........................Ah......"'
35786: '@rThe woman couldn''t disobey.'
35787: '@r......She was completely overwhelmed by Beato''s gold-glowing eyes...'
35788: '@rShe walked lightly, as though through a dream world.'
35789: '@r......At some point, the scenery around her had changed,@k ......but she did not notice.@k She could not notice...'
35790: '@rThough this should have been Rokkenjima,@k ......at some point, it had become the garden of a mansion she had never seen before.'
35791: '@rIt was a garden she had never seen before, even grander than the great rose garden of the Ushiromiya family......a garden of gold roses.'
35792: '@rThere stood an arbor,@k ......and a woman wearing an elegant dress beckoning her.........'
35793: '@r...There was a man who looked like a butler, and the tea he poured with a beautiful gesture had a very nice and enticing smell.'
35794: '@rIt was as though they were telling her to join their tea party......'
35795: '@rShe couldn''t disobey.'
35796: '@r.........She had to go to the master of this golden rose garden...@w500.......and give this child as an offering......'
35797: 'BEATRICE@r@v27/50700374."Forgive me, woman.@k@v27/50700375. Curse your bad luck for being entranced by a witch.@k@v27/50700376. ......And, surrounded by these gold roses, which you would never be able to enjoy in this world, sleep.@k@|@y@v27/50700377. .........Gaap."'
35798: 'Gaap@r@v32/53700070.".........Yes, understood."'
35799: '@rWhen Gaap snapped her fingers,@k ......a pitch-black hole opened at the woman''s feet, and she was swallowed up along with the baby.'
35800: '@rThe sight that the woman and the baby witnessed in the very next moment probably burned itself into their eyes forever.'
35801: '@rThe two floated in the air......and looked down at the gold rose garden spread out below them.'
35802: '@rBelow their feet was not the ground, but an unobstructed view of a golden rose garden which stretched as far as the eye could see.'
35803: '@rIf one could have this scene imprinted in their mind as their last memory, that would be such a merciful way to die......'
35804: '@rThen, the woman and the baby were swallowed up by the golden sea.'
35805: '@rThe thud was remarkably plain, and remarkably quiet for the sound of two lives being taken.'
35806: '@r......However, it was a perfect fit for the entertainment at a tea party of witches.'
35807: '@rDarkness swallowed the woman and the baby, ......and slowly expanded to engulf the entire rose garden...'
35808: '@rThe sound of the wind grew stronger bit by bit.'
35809: '@r...Was that TV static?@k What was that noise...?'
35810: '@r......It was the roar of the sea.'
35811: '@rThe two who had died after falling from a great height into a thicket of golden roses...@k...were gradually engulfed by the roar of the sea, engulfed by the scenery of the beach below the cliff...'
35812: 'BEATRICE@r@v27/50700378."I guarantee it.@k@v27/50700379. You are completely sinless!!@k @v27/50700380.If someone wants revenge for 19 years ago, they need look no further than me!!@k @v27/50700381.Wahhahahahahahahahahaha!!"'
35813: 'Natsuhi@r@v03/50900657."...Ee......eeeeeeeeeeeeekkk.........!"'
35814: 'Natsuhi@r@v03/50900658.When I spotted the two of them on the rocks below, ......I went pale.'
35815: 'Natsuhi@r@v03/50900659.Then, I dashed back to the mansion......and there was a great uproar.'
35816: 'Natsuhi@r@v03/50900660.We urgently rushed them to hospital by boat, ......but from that height, it was a miracle that they had even avoided an instant death.'
35817: 'Natsuhi@r@v03/50900661.Both the servant...@v03/50900662....and the baby...@v03/50900663.......died.'
35818: 'Natsuhi@r@v03/50900664.In less than three days from the time Father had entrusted me with the baby, ......I had killed it...!'
35819: 'Natsuhi@r@v03/50900665.My husband was on a business trip.'
35820: 'Natsuhi@r@v03/50900666.Rosa-san, who still lived on the island at the time, was away traveling with her friends.'
35821: 'Natsuhi@r@v03/50900667.......Father and I were the only ones on Rokkenjima!!'
35822: 'Natsuhi@r@v03/50900668.And before anyone except Father and I knew,@v03/50900669. ......a baby had appeared out of nowhere...and then disappeared again!!'
35823: 'Natsuhi@r@v03/50900670.That''s right, it was a dream...a nightmare!!'
35824: 'Natsuhi@r@v03/50900671.I was convinced that Father would blame me.@k@r@v03/50900672....However, his reaction was somehow strange...!'
35825: 'Kinzo@r@v01/51500170."Heh, ......heheheheheheheh, fwahahahahahahahahahahahhahhahaha!!@k @v01/51500171.I saw this coming, I knew this would happen!@k@v01/51500172. How long must you struggle?@k@v01/51500173. To what lengths will you go to escape being mine?!!@k @v01/51500174.Wahahahahaahahahahahaha!!@k @v01/51500175.I have no interest in an empty cage!@k @v01/51500176.Throw it away!!"'
35826: '@rWhen Father learned of the accident,@k he kept on laughing and laughing, as though nothing could be more amusing, to the point that just listening to him disturbed me.'
35827: '@rPerhaps something had come loose in his mind......'
35828: '@rThat was the day that changed him.'
35829: '@rFather shut himself up inside the world of the occult even more than he ever had before......'
35830: '@rWhen my husband came back, he was astonished to see how eccentric Father had now become.'
35831: '@rHowever, ......he had already accepted that this would happen sooner or later.'
35832: '@rOf course, my husband had heard about the baby.'
35833: '@rHowever, he told me that it was surely just some whim of Father''s, and to forget the whole episode.'
35834: '@rSo I forgot it!'
35835: '@rIt was an unfortunate accident.'
35836: '@rNo, there wasn''t an accident at all!'
35837: '@rI forgot everything, even that the baby had existed in the first place...!!'
35838: '@rAfter all, it was a twisted nightmare which lasted not even three days!@k@rThat''s right, it was all a nightmare...!!'
35839: '@rI don''t want to remember any of it!!'
35840: '@rThe cliff, the broken fence, the roar of the sea,@k and......the wailing of that baby.........!!!'
35841: 'Gaap@r@v32/53700071."So, that baby.........is the baby of 19 years ago?"'
35842: 'BEATRICE@r@v27/50700382."Of course not!@k @v27/50700383.I killed that baby!@k @v27/50700384.It no longer exists in this world!"'
35843: 'Ronove@r@v31/53100093."......However, there is no red truth in the Human world.@k@v31/53100094. In the Human world, nothing can be trusted."'
35844: 'Gaap@r@v32/53700072."............That''s right.@k@v32/53700073. Beato, you definitely killed that baby.@k@|@y@v32/53700074. But in the Human world, it might still be considered alive.@k@v32/53700075. ......Whether it''s really alive or not, catch my drift?"'
35845: 'Natsuhi@r@v03/50900673."Are you saying.........that it actually was alive?!@k @v03/50900674.After falling to the rocks from that height......?!"'
35846: 'BEATRICE@r@v27/50700385."I don''t know.@k@v27/50700386. But calm down.@k@v27/50700387. ......No matter how much that person hates you, the truth is that it was an accident.@k@v27/50700388. If he does hate you, that hatred is completely unjustified...!"'
35847: 'Natsuhi@r@v03/50900675."But, but...!@k @v03/50900676.Even if I didn''t lay a finger on him, ......inside my heart, I...!!"'
35848: 'BEATRICE@r@v27/50700389."Calm down.@k@v27/50700390. ......No matter who the man from 19 years ago hates or what he yells, there''s no way the sin he''s after actually occurred.@k@|@y@v27/50700391. So calm down.@k@v27/50700392. Why don''t I welcome the man from 19 years ago as my guest?@k@v27/50700393. *cackle*cackle*cackle*!"'
35849: 'BEATRICE@r@v27/50700394."And just when the riddle was solved and I thought my job was finished.@k@v27/50700395. I''ve got to entertain this final guest of mine!!@k @|@y@v27/50700396.Kuhhyahyahyahyahya!!"'
35850: 'Ronove@r@v31/53100095."It''s getting interesting.@k@v31/53100096. ......Not only are you protecting Lord GOLDSMITH''s secret, but you also have a 19th guest and a man from 19 years ago."'
35851: 'Gaap@r@v32/53700076.".........That''s right—to us who claim that Kinzo is alive, Erika is number 19.@k@v32/53700077. And in addition to that 19th piece, we have a man from 19 years ago?@k @v32/53700078.How interesting. I''m getting all excited."'
35852: 'BEATRICE@r@v27/50700397."We have no lack of opponents!!@k @v27/50700398.And I was just thinking it a shame to have only one guest at my tea party!!@k @v27/50700399.Come, you fools!!@k @v27/50700400.Kuhhahahahaahahahahahahaahahah!!"'
35853: '@rFurudo Erika is Lady BERNKASTEL''s piece.@k@rIn that case, whose piece is the man from 19 years ago......?'
35854: '@rThe voice which could be faintly overheard through the receiver...was Natsuhi''s.'
35855: 'Natsuhi@r@v03/50900589."I, ......I understand.@k@v03/50900590. I''ll sleep right now.@k@v03/50900591. I won''t leave my room, and I won''t pick up the phone...!@k @v03/50900592.So please, don''t tell my husband and daughter......!"'
35856: '@rWhen heard through a receiver, even these begging screams which would have shaken the heart of anyone who heard them...@k......could be listened to with a heart of ice...'
35857: '@r@v10/50100721."As long as you keep our promise, I''ll keep your secret, Mother.@k@v10/50100722. ......Don''t break our promise.@k@v10/50100723. .........I''m already very close by.@k@v10/50100724. I can easily tell whether you''ve turned your lights off and whether you''re on the phone.@k@v10/50100725. ...If I wished to, I could even kiss your sleeping face."'
35858: 'Natsuhi@r@v03/50900593."I''ll keep it!@k @v03/50900594.I''ll keep my promise!!@k @v03/50900595.So stop it, just stop it!@k @v03/50900596.Stop iiiiiiiiiiiiiiittt!!"'
35859: '@rThe receiver was set down violently.'
35860: '@r......"He" knew very well how bad an aftertaste you could leave for the other side just by the way you hung up the phone...'
