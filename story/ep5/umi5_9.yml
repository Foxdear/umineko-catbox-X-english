35912: '@r...Instead of just passively ignoring this,@k I gave her an active and clear answer by knocking her hand aside.'
35913: 'BERNKASTEL@r@v28/52100343.".........*giggle*.@k@v28/52100344. Looks like he hates shaking hands.@k@v28/52100345. Just like Ange."'
35914: 'Erika@r@v46/54500242."Don''t worry.@k@v46/54500243. I''m a far more useful piece than Ange.@k@v46/54500244. ......I''m nothing at all like shredded meat that couldn''t accomplish anything besides restoring Battler-san''s fighting spirit."'
35915: 'Battler@r@v10/50100733."..........................."'
35916: 'LAMBDADELTA@r@v29/52200318."*giggle*...!@k @v29/52200319.Isn''t it great that you''ve been blessed with such helpful-looking allies?!@k @v29/52200320.In the past, it was VIRGILIA and Ronove.@k@v29/52200321. Then Ange came as well."'
