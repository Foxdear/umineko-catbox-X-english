32648: 'BEATRICE@r@v27/50700001."You idiot!!@k @v27/50700002.Isn''t it obvious?!!@k @|@y@v27/50700003.It''ll be fun to kill her and see the pained look on your face, why else?!!@k @v27/50700004.Kuhyahahahahahahaha!!"'
32649: 'BEATRICE@r@v27/50700005."Look, look, don''t turn your eyes away, look at it.@k@v27/50700006. Look look, look look!@k @v27/50700007.It''s magic, it''s furniture, no matter how much you try to deny me and magic, look look, look look look look!@k @|@y@v27/50700008.Gyahhahhahahaha!!"'
32650: 'BEATRICE@r@v27/50700009."......Sorry, Battleer.@k@v27/50700010. It was pretty interesting.@k@|@y@v27/50700011. ...Still, I was just trying to do what Master told me, but it really did work very well!@k @|@y@v27/50700012.I hear, after acting @btsuntsun.@<bad-tempered@> and exploring the depths of cruelty, if you act properly incompetent and @bdere.@<soft@>, you can get a massive rise on that goodwill meter thing, riiight?@k @|@y@v27/50700013.Kyahahahahahaah!!"'
32651: '@rThat lonely tone was the sound of the desolate wind blowing by.@k@rThe color of the glittering flower petals on the rose bushes was...that of gold.'
32652: '@rThe group of gold butterflies which had once danced through this golden rose garden like fluttering rose petals...@kcould no longer be seen anywhere...'
32653: '@rThe master of the Golden Land is the Golden Witch, BEATRICE.@k@rShe could be called inhumane and cruel.@k Arrogant and outrageous.@k@rAnd also, naive and simple.'
32654: '@rThat laugh of hers, which lost its grace more and more the longer it continued, ......could no longer be heard.'
32655: '@rThe Golden Witch BEATRICE...@ksat like a doll, resting in a deck chair adorned as beautifully as the golden rose garden.'
32656: '@r......She wasn''t relaxing there.'
32657: '@rEmpty-eyed,@k never responding to any questions,@k@rand yet still not permitted to sleep,@k@rBEATRICE was sitting there as if she was a doll......'
32658: '@rHer hair was down, and VIRGILIA was carefully fixing it up with a comb.'
32659: '@rIf BEATRICE had been complaining about this and that regarding her hairstyle,@k then it would have been clear that she was the usual Beato.'
32660: '@r......However, she gave no responses, and showed no reactions.@k@rSo instead, it only looked like VIRGILIA was combing the golden hair of a large doll...'
32661: '@rAlongside them, there was a table.'
32662: '@rOn it was a chessboard...along with a mix of black and white pieces in an all-out battle.'
32663: '@rHowever, something about this setup looked different from normal chess.@k@r...It might have been a game similar to chess but not identical.'
32664: '@rAnd on the other side, ......sitting back in his chair as he contemplated his next move, was a young man.'
32665: '@r...No, perhaps he wasn''t thinking of his next move.'
32666: '@rEvery once in a while, he would change the positions of the pieces, reconsidering the situation each time he changed it.'
32667: '@rMaybe he was reconstructing previous games, trying to discover the thought process behind those moves.'
32668: '@rIn the past...@kKinzo, the Ushiromiya family head, once likened studying chess games to taking a journey through the thoughts of the old masters.'
32669: '@rUshiromiya Battler...was on a journey.'
32670: '@rA journey in search of the Golden Witch''s thought process...which had led her to create these arrangements and make these moves.'
32671: '@rBattler took a black piece which he had only just moved forward...and returned it to its original place, sighing deeply.'
32672: '@rBattler''s pieces were white.@k However, on that chessboard, the side facing Battler was Black''s territory.@k He was stepping through the game from Beato''s perspective...'
32673: 'Battler@r@v10/50100001."......The more I do this, the less I understand your moves."'
32674: '@rEven Battler...didn''t expect that Beato would respond to that statement.'
32675: '@rNo, ......he was still holding onto the hope that there might be a chance of her responding,@k and had only made it sound as though he was talking to himself.'
32676: '@rBeato''s eyes......reflected nothing.@k@rAnd her mouth told nothing.'
32677: 'BEATRICE@r"........................"'
32678: '@rAfter begging him to kill her,@k ...the Golden Witch had become a corpse which had given up on living.'
32679: '@rShe wasn''t sleeping.@k@r......She was forbidden to step down from this game, and therefore, sleep was not permitted.'
32680: '@rSo she must have heard.@k@rHowever, ......his words probably hadn''t reached her heart.'
32681: '@rThe Golden Witch would no longer sneer at Battler''s moves, nor would she praise them or belittle them.'
32682: '@rBEATRICE was no longer......anything more than a living doll.'
32683: '@rEven so, she would glance at him every once in a while. It would be an empty glance, but a glance nonetheless.'
32684: '@rSometimes, she would seem to make some sort of gesture or even move her lips.'
32685: '@rHowever, her movements were never able to communicate anything to Battler......'
32686: 'Battler@r@v10/50100002."What led you to make this move in this situation?@k @v10/50100003.......I don''t get it at all.@k@v10/50100004. I don''t understand your moves."'
32687: 'BEATRICE@r"....................."'
32688: 'VIRGILIA@r@v30/53200001."......Beato.@k@v30/53200002. Battler-kun is talking to you..."'
32689: 'BEATRICE@r"....................."'
32690: 'Battler@r@v10/50100005."...Say something.@k@v10/50100006. Snicker or guffaw if you want.@k@v10/50100007. ......I don''t even care if you use that shrill laugh of yours."'
32691: '@r......It seemed unbelievable.@k That shrill laugh of Beato''s...would never be heard again.'
32692: '@rHowever, even if she couldn''t answer, his voice was surely reaching her.@k@r......Battler was talking to her because he believed this.@k@rSo he said the same thing one more time...'
32693: 'Battler@r@v10/50100002."What led you to make this move in this situation?@k @v10/50100009.I don''t get it at all.@k@v10/50100004. I don''t understand your moves."'
32694: 'VIRGILIA@r@v30/53200003."............@k@v30/53200004. ......So, her thoughts don''t make any sense to you?"'
32695: '@rVIRGILIA answered in her disciple''s stead.'
32696: '@rUp to this point, she had done her best to avoid speaking for Beato.@k@rAfter all, there was a chance that Beato would respond in some way, and VIRGILIA didn''t want to be the one to take that opportunity away from her.'
32697: '@r......Which meant that Battler was being forced to bear with this silence...@k...until Beato herself answered.'
32698: '@rVIRGILIA could no longer bear to watch him like this...'
32699: '@rAnd Battler, too, wanted to have a conversation with VIRGILIA,@k@rwith faith that their words would reach Beato''s heart......'
32700: 'Battler@r@v10/50100011."Yep.@k@v10/50100012. I don''t have a clue.@k@v10/50100013. ......The more I try standing in Beato''s shoes and moving the pieces like this, the less I understand."'
32701: '@rThe successful execution of a serial murder following an epitaph.@k He was stepping through the games from the witch side with that as the victory condition,@k ......but he just couldn''t make it fit with Beato''s moves.'
32702: '@rHe could see several incomprehensible moves in the records of their past games that clearly conflicted with that victory condition...'
32703: 'Battler@r@v10/50100014."......I don''t get it at all.@k@v10/50100015. This journey through her thinking process is just too rugged."'
32704: 'VIRGILIA@r@v30/53200005."Even so, you won''t give up, will you."'
32705: 'Battler@r@v10/50100016."Yeah.@k@v10/50100017. .........I promised."'
32706: '@r@a1666.Kill...me.@k ......Let me die......'
32707: 'Battler@r@v10/50100018."I promised to let her die peacefully.@k@v10/50100019. ......And I''m the only one who can do that."'
32708: '@r...Beato''s right ankle was bound with a heavy, cold, steel shackle.'
32709: '@rIt wasn''t tied to anything, so it didn''t restrict her movement.'
32710: '@rHowever, it symbolized restriction.@k It was a visualization of the restriction that prevented her from leaving the game without either victory or loss...'
32711: '@rAnd...the shackle was probably hurting her.@k@rThe mercilessly cold steel shackle...@kwas tormenting her over and over inside her waking dream.'
32712: 'BEATRICE@r@v27/50700017."............Ghh............ah..."'
32713: '@rSo there was never any relief in her empty expression.@k@rHer eyelids would sometimes tremble like she was having a bad dream, ...and every once in a while, she would let out a pained gasp.'
32714: '@rUnless I win,@k ......Beato will never be released from the curse that prevents her from resting in peace...'
32715: 'VIRGILIA@r@v30/53200006."...Are you not in a hurry?@k@v30/53200007. It seems that the fifth game has already started."'
32716: 'Battler@r@v10/50100020."............@k@v10/50100021. ......I''m not interested."'
32717: '@rWhy should I take part in any game without Beato as an opponent...?@k@rIf that''s the only alternative,@k then stepping through past games on a journey in search of Beato''s thought process is a much better use of my time......'
32718: 'LAMBDADELTA@r@v29/52200001."I''ll be the next Game Master.@k@v29/52200002. Any objections?@k @v29/52200003.You have none, right?"'
32719: 'BERNKASTEL@r@v28/52100001."......I have tons.@k@v28/52100002. Beato has abandoned the fight and lost consciousness.@k@v28/52100003. Isn''t this loss by default and game over for her...?"'
32720: 'LAMBDADELTA@r@v29/52200004."I''ll admit a lot''s happened to Beato, and it feels a teensy bit like she''s been knocked out right now.@k@|@y@v29/52200005. But that doesn''t mean she''s lost the will to fight.@k@v29/52200006. That''s why I''m acting as her assistant.@k@v29/52200007. Get it?"'
32721: '@rBeato was lying down on a deck chair, almost as though she was sleeping.'
32722: '@rHowever, she wasn''t sleeping,@k ......and she wasn''t awake either.'
32723: '@rShe was nothing more than a living doll who had given up on victory, asked Battler to perform her last rites,@k and entrusted everything to him...'
32724: '@rOf course, no fifth game would ever be prepared if everyone just sat around.'
32725: '@rSo, LAMBDADELTA had succeeded Beato as the Game Master,@k and proclaimed that she would prepare the next game.'
32726: 'Battler@r@v10/50100022."Quit messing around.@k@v10/50100023. This game is between me and Beato.@k@v10/50100024. I don''t know who you two are, but I''m not gonna just let you carry on without us."'
32727: 'LAMBDADELTA@r@v29/52200008."No one asked your opinion.@k@|@y@v29/52200009. So, Bern?@k@v29/52200010. Do you accept or not?"'
32728: 'BERNKASTEL@r@v28/52100004."..................@k@v28/52100005. ......Sure.@k@v28/52100006. Go and succeed her position."'
32729: 'Battler@r@v10/50100025."What the hell?! How dare you say that!@k@v10/50100026. I don''t know who you two are, but I''m not gonna let you ignore Beato and me and just carry on by yourselves!"'
32730: 'LAMBDADELTA@r@v29/52200011."Calm down.@k@v29/52200012. Of course a different player will choose different moves.@k@|@y@v29/52200013. You might have a lot of reason to feel uneasy about the idea,@k@v29/52200014. but even so, it could give you some big hints, right?"'
32731: 'Battler@r@v10/50100027."Who cares?!!@|@y@k @v10/50100028.And who put you in charge?!!"'
32732: 'BERNKASTEL@r@v28/52100007.".........Beato''s game has repeated four times, and you still don''t understand anything, right?@k @v28/52100008.In that case, I think that changing the player might lead to some huge hints."'
32733: 'Battler@r@v10/50100029."That''s none of your business!@k @v10/50100030.This is our game! Beato prepared it, and she designated me to be her opponent in it.@k@v10/50100031. I don''t know what hole you two crept out of, but I don''t want you screwing things up!"'
32734: 'BERNKASTEL@r@v28/52100009.".........In that case, wake Beato up and make her get the next game ready.@k@v28/52100010. Can you...?"'
32735: 'Battler@r@v10/50100032."B-...Beato won''t be getting up for a while.@k@v10/50100033. But there''s no need for a new game.@k@v10/50100034. Just the four games she''s already laid out are more than enough!"'
32736: 'Battler@r@v10/50100035."Even if there is to be a fifth game, it just needs to be something that Beato lays out and I challenge.@k@v10/50100036. You two have absolutely nothing to do with this!"'
32737: '@rBattler couldn''t hide his irritation at these two witches called LAMBDADELTA and BERNKASTEL,@k who had shown up after the game''s start and who had started to try and continue it on their own...'
32738: '@rIt looked like these witches were of an even higher rank than Beato—@kso high, in fact, that even Beato''s master VIRGILIA couldn''t come close.'
32739: '@rBattler had the feeling that he''d seen these two several times before.'
32740: '@rHowever, this was the first time he had learned their names and spoken to them directly.'
32741: 'LAMBDADELTA@r@v29/52200015."You can''t get the next game ready without waking Beato.@k@v29/52200016. That''s why I''m going to prepare it instead!"'
32742: 'LAMBDADELTA@r@v29/52200017."Listen, Battler,@k@v29/52200018. we aren''t so patient that we''re willing to wait however long we have to for Beato to regain consciousness.@k@v29/52200019. Right, Bern?"'
32743: 'BERNKASTEL@r@v28/52100011."............I don''t like boredom.@k@v28/52100012. It really ticks me off."'
32744: 'Battler@r@v10/50100037."We really don''t care whether you get bored or not."'
32745: 'LAMBDADELTA@r@v29/52200020."Come on now.@k@v29/52200021. Leave everything to <perfect> LAMBDADELTA-sama, okay?@k @v29/52200022.I''ll take over as the Game Master."'
32746: 'LAMBDADELTA@r@v29/52200023."DON''T WORRY, I won''t play with too much "certain perfection".@k@v29/52200024. I''ll act all Beato-like and prepare plenty of clues, bonus hints, and fakes that make no sense.@k@v29/52200025. I''ll make it into one big hint to help you understand Beato''s world even more, okay?"'
32747: '@rLetting my voiceless emotions explode, ...I slammed the table hard.'
32748: '@rThe two witches barely flinched.'
32749: '@r......One grinned.@k@rThe other looked indifferent, as though nothing had happened.'
32750: '@rThe two of them just stared at me silently.@k@r...As though they were reproaching me.'
32751: 'LAMBDADELTA@r@v29/52200026."What''s this?@k @v29/52200027.Not satisfied?@k @v29/52200028.Are you saying you''ll step down from my fifth game?@k @v29/52200029.Isn''t that loss by default?"'
32752: 'BERNKASTEL@r@v28/52100013.".........Battler won''t step down.@k@v28/52100014. Of course he''ll participate in the fifth game."'
32753: 'Battler@r@v10/50100038."Don''t just decide that yourself!!@|@y@k @v10/50100039.I''m not gonna play along with you two.@k@v10/50100040. I don''t give a shit!"'
32754: 'LAMBDADELTA@r@v29/52200030."Hmmm...@k@v29/52200031. ......Then it really is loss by default, right...?@k @v29/52200032.The witch side wins this game,@k@v29/52200033. the Humans submit, and we wrap things up, then...?"'
32755: 'BERNKASTEL@r@v28/52100015.".........If you step down, then you lose by default and the game ends... Are you okay with that?@k @v28/52100016..........If you want to make certain that your lonely sister...@k@v28/52100017.will always meet with miserable circumstances in an endless number of worlds, that option is indeed open to you."'
32756: '@rWhen BERNKASTEL mentioned Ange, .........Battler''s expression changed instantly.'
32757: 'Battler@r@v10/50100041."H-......how dare you...@k@v10/50100042.talk about Ange so casually......"'
32758: 'BERNKASTEL@r@v28/52100018.".........It''s because you have me, the Witch of Miracles BERNKASTEL, as your ally,@k@v28/52100019. ...that there exists the possibility of a miracle in which Ange''s family might come home to her."'
32759: 'BERNKASTEL@r@v28/52100020."Well, if you throw that chance away yourself, guaranteeing that Ange''s endless futures will all end in sorrow, that might be pretty interesting for me too."'
32760: '@rI vaguely understood what she was saying.'
32761: '@rUntil I win in Beato''s game, I''ll remain trapped in this bizarre world.'
32762: '@rAnd if I abandon victory, ......then most certainly, my parents and I will never return to Ange.'
32763: '@rFor Ange''s sake, ...even though I know that the witches are toying with me,@k I must keep on fighting...'
32764: 'Battler@r@v10/50100043."Nn, ...d-.........damn......"'
32765: 'BERNKASTEL@r@v28/52100021.".........What''s wrong?@k @v28/52100022.You look unsatisfied.@k@v28/52100023. Did you already forget the anger you felt when your sister was turned into mincemeat......?"'
32766: 'BERNKASTEL@r@v28/52100024."That spectacle where she was torn to bits, ripped to pieces by countless red-hot pliers.@k@v28/52100025. Do you need to look at it directly this time......?"'
32767: '@rBERNKASTEL faced the palm of her right hand upwards.@k@r...As she did, a pale light gathered there, ......and some kind of blue-glowing crystal appeared there.'
32768: '@r......A scene was reflected on its sharp surface,@k ...but it wasn''t the scene that surrounded them now.'
32769: '@rIf you looked deep into that crystal, ......that fragment,@k then you would probably learn what was reflected on there.'
32770: '@rIf you stared at it,@k then you would surely witness that scene where Ange.........finally reached her beloved brother after devoting twelve years of her life to that goal,@k ......only to have her entire body torn to bits while she was still alive.'
32771: 'Battler@r@v10/50100044."D-......damn...you........."'
32772: '@rWithout thinking, he grabbed at her collar,@k but as soon as he touched whatever made up her form, it disappeared like foam on the waves.'
32773: '@rAnd then, as naturally as though she had been there from the beginning,@k BERNKASTEL was leaning against a distant wall.'
32774: 'BERNKASTEL@r@v28/52100026.".........If you step down from the game,@k@v28/52100027. this will become not just a fragment, but a definite reality.@k@v28/52100028. I won''t be the one to weave that future.@k@v28/52100029. You''ll do it yourself.@k@v28/52100030. ......So you decide, alright?@k @v28/52100031.Figure out what you want to do with your beloved little sister''s future."'
32775: '@rBattler''s fists shook with anger,@k ......but even if he swung them down, he wouldn''t be able to hit BERNKASTEL.'
32776: '@rLike a cat or a phantom, this witch wouldn''t even let someone pet her if she didn''t wish for it.'
32777: '@rBesides, ...she''s telling the truth.@k@rFor Ange''s sake, I can''t step down from this fight.@k@rEven if these unpleasant witches hijack the game board.'
32778: 'LAMBDADELTA@r@v29/52200034."Ehheheheheh.@k@v29/52200035. That''s just like you, Be~rn.@k@v29/52200036. Even the way you frighten people into doing what you want is heartless.@k@|@y@v29/52200037. ...That''s how it is, Battlerr."'
32779: 'LAMBDADELTA@r@v29/52200038."You aren''t allowed to step down from the game board.@k@v29/52200039. You and Beato are both nothing more than pieces on the game board who exist to distract us from our boredom.@k@v29/52200040. ...Even your incomprehensible anger and irritation make for a wonderful treat to sate our boredom."'
32780: 'LAMBDADELTA@r@v29/52200041."Well, this level of anger only makes for a cheap snack."'
32781: 'BERNKASTEL@r@v28/52100032.".........Like those curry-flavored potato wafers that sell at 30 yen for a pair."'
32782: '@r@v28/52100033|29/52200042.""*giggle*giggle*, ahhahahahahahaha...!!""'
32783: 'Battler@r@v10/50100045."Y-you damn......witches......"'
32784: 'BERNKASTEL@r@v28/52100034.".........*giggle*.@k@v28/52100035. Fight for Ange''s sake, okay?@k @v28/52100036.And for Beato''s too, right...?"'
32785: '@rIn a way that was admonishing, ...or perhaps babying,@k ......BERNKASTEL smiled, tormenting Battler in a similar way to how something too sweet sometimes gives you a headache.'
32786: '@rThe host of this tea party, Beato, was absent now,@k@r......and the guest witches were already making themselves at home.'
32787: 'LAMBDADELTA@r@v29/52200043."...What''ll you do, Ushiromiya Battlerr?@k @v29/52200044.Surrender to faaate...?"'
32788: 'Battler@r@v10/50100046.".................."'
32789: 'LAMBDADELTA@r@v29/52200045."Just step down.@k@v29/52200046. You''ve had enough of being toyed with as a witch''s piece, right?@k @v29/52200047.Eheheheheh, it''s tough being one of Bern''s pieces.@k@|@y@v29/52200048. You''ll be a throwaway just like Ange.@k@v29/52200049. Geheheheheh!"'
32790: 'BERNKASTEL@r@v28/52100037."I''m not giving you the option of stepping down.@k@v28/52100038. ......Keep fighting for the sake of your sister''s future.@k@|@y@v28/52100039. I''m on your side.@k@v28/52100040. Until you win, I''ll support you so that you can reach that future...@k@v28/52100041.for all eternity, until I get bored.@k@v28/52100042. ......*giggle*giggle*."'
32791: '@rBattler couldn''t allow himself to fall for their provocation and cajolery......'
32792: '@rThese witches knew that he got mad easily, and they were trying to take advantage of that...'
32793: '@r...Battler withstood it all, ......and finally relaxed his clenched fists.'
32794: 'Battler@r@v10/50100047.".........If you want to start this fifth game of yours, ...then just do it.@k@v10/50100048. Do whatever you want."'
32795: 'LAMBDADELTA@r@v29/52200050."Oh, I will.@k@|@y@v29/52200051. ......Hey, where are you goi~ng?"'
32796: '@rEven though Battler had acknowledged this fifth game, he turned his back on them,@k which surprised LAMBDADELTA a bit.'
32797: 'Battler@r@v10/50100049."If you''re going to be Beato''s substitute,@k@v10/50100050. ......then I''m sure that BERNKASTEL witch over there can be mine if she wants."'
32798: 'BERNKASTEL@r@v28/52100043.".........Not a bad idea.@k@v28/52100044. Otherwise, this''ll turn into a loss by default."'
32799: 'LAMBDADELTA@r@v29/52200052."What the heck?!@k @v29/52200053.Are you gonna just ignore this Episode 5 that I put so much effort into making?!@k @v29/52200054.Rude, ruuude!"'
32800: 'BERNKASTEL@r@v28/52100045."......Battler says he''s going to take a break for a while.@k@v28/52100046. Until he comes back, I''ll be the substitute player.@k@|@y@v28/52100047. How''s that sound...? Battler...?"'
32801: 'Battler@r@v10/50100051.".........You do that."'
32802: 'LAMBDADELTA@r@v29/52200055."............"'
32803: 'BERNKASTEL@r@v28/52100048."......What''s wrong, Lambda?@k@v28/52100049. If your opponent is me and not that fool Battler, you won''t play...?"'
32804: 'LAMBDADELTA@r@v29/52200056."Ehheheheheh!!@k @v29/52200057.Of course I will♪@k @v29/52200058.I''m glad I get to play with you, Be~rn!@k @|@y@v29/52200059.Come on, let''s play, let''s play!@k @v29/52200060.Let''s play together in LAMBDADELTA-sama''s super <hyper> and <cute> Episode 5~!"'
32805: 'BERNKASTEL@r@v28/52100050.".........This is a world that Beato created, remember.@k@v28/52100051. You aren''t going to ruin the atmosphere of the story, are you...?"'
32806: 'LAMBDADELTA@r@v29/52200061."Don''t worry about that.@k@v29/52200062. I''m really good at reading between the lines for that sort of stuff.@k@v29/52200063. I made sure to use a Beato-ish atmosphere and I made it into an even more interesting story."'
32807: 'LAMBDADELTA@r@v29/52200064."Battler, make sure you come back as soon as your break''s over, okay?@k @v29/52200065.It''d be a shame to miss this.@k@v29/52200066. I''ve prepared plenty of bonus hints that''ll get you closer to Beato''s secre~t♪"'
32808: 'LAMBDADELTA@r@v29/52200067."...Is what it''ll look like but I''ll actually fill it with misdirection and make things more and more confusi~ng.@k@|@y@v29/52200068. Wait, hey, Battlerr! Why aren''t you listening when a witch is talking?!"'
32809: '@rWithout answering, Battler disappeared into the darkness.'
32810: '@rAfter shrugging and cackling,@k the witches immediately started playing with the game board they had stolen from Beato......'
32811: 'Battler@r@v10/50100052."Can those witches really understand Beato''s game?"'
32812: 'VIRGILIA@r@v30/53200008."...Since they''re using the same game board, they cannot do anything that this child cannot do.@k@v30/53200009. However, they can do things that she wouldn''t do."'
32813: 'Battler@r@v10/50100053."............@k@v10/50100054. ...What do you mean, things she wouldn''t do?"'
32814: 'VIRGILIA@r@v30/53200010."The materials of chess exist to play chess with.@k@v30/53200011. You cannot use them to play cards.@k@v30/53200012. However, as for throwing the chess pieces at your opponent, or scribbling on the board..."'
32815: 'VIRGILIA@r@v30/53200013."Doing such things is not impossible.@k@v30/53200014. However, that would be blasphemy against the game of chess,@k@v30/53200015. so people don''t do that."'
32816: 'BEATRICE@r"....................."'
32817: '@rThat definitely......wouldn''t be chess anymore.@k@rIt looked like Beato''s eyes clouded very slightly with sadness.'
32818: 'Battler@r@v10/50100055.".........Damn them.@k@v10/50100056. .........This game is between me and Beato.@k@v10/50100057. ...I won''t let anyone else profane it."'
32819: '@rAt that time, gold butterflies gathered and Ronove appeared, holding a tea set with black tea.'
32820: 'Ronove@r@v31/53100001."Would you like some more tea?"'
32821: 'Battler@r@v10/50100058.".........If you wouldn''t mind."'
32822: 'Ronove@r@v31/53100002."Certainly.@k@v31/53100003. ......So,@k@v31/53100004. how has this journey of yours in search of Milady''s thoughts been?"'
32823: 'Battler@r@v10/50100059."I''m as clueless as ever, but I''m enjoying it."'
32824: 'Ronove@r@v31/53100005."On a different topic, ......are you certain about this?@k @v31/53100006.Relaxing here, I mean."'
32825: 'Battler@r@v10/50100060."......Are you talking about the game those witches are playing all by themselves?"'
32826: 'Ronove@r@v31/53100007."Yes.@k@v31/53100008. Just now, when I went to serve them some tea, the murders of the first twilight had already taken place,@k@v31/53100009. and it seemed as though the next murder would occur shortly."'
32827: '@rWhen Beato and I were playing,@k the game would be paused whenever someone left their seats.'
32828: '@r......However, those witches wouldn''t pause that game just because I wasn''t around...'
32829: 'Battler@r@v10/50100061."............Ronove, did you see their game?"'
32830: 'Ronove@r@v31/53100010."Just a part of it."'
32831: 'Battler@r@v10/50100062."How was it?"'
32832: '@rRonove lifted the pot high with an elegant gesture as he poured the black tea.'
32833: '@rAfter he was done, he finally spoke,@k@rexpressing his thoughts in very few words.'
32834: 'Ronove@r@v31/53100011."It did not have...love."'
32835: 'Battler@r@v10/50100063."......What do you mean, love?"'
32836: 'Ronove@r@v31/53100012."My apologies.@k@v31/53100013. That is how it would be put if a woman were to say it.@k@|@y@v31/53100014. ......As a man,@v31/53100015. ......perhaps one could say it was dishonorable."'
32837: '@rI understood what those words meant.'
32838: '@rWhen I met VIRGILIA''s eyes, she shook her head slightly and stared at the floor...'
32839: 'Ronove@r@v31/53100016.".........At a glance, I believe it resembles Milady''s games greatly.@k@v31/53100017. However, the foundation is very different."'
32840: 'Battler@r@v10/50100064."Does it go against the rules of Beato''s game?"'
32841: 'Ronove@r@v31/53100018."No, it does not.@k@v31/53100019. LAMBDADELTA-sama understands the rules of Milady''s game very well indeed.@k@v31/53100020. ......However..."'
32842: 'VIRGILIA@r@v30/53200016.".................."'
32843: '@rBattler stood up.'
32844: '@rThere was no need to make Ronove say any more.'
32845: 'VIRGILIA@r@v30/53200017."Battler-kun......"'
32846: 'Battler@r@v10/50100065."......Sorry, Ronove.@k@v10/50100066. I know you went to all the trouble of pouring this for me, but tea isn''t what I need."'
32847: 'Ronove@r@v31/53100021."You will go after all?"'
32848: 'Battler@r@v10/50100011."Yeah.@k@|@y@v10/50100068. ......We don''t need any outsiders in our game."'
32849: '@r...Those guys weren''t even here in the beginning.'
32850: '@rBecause I''ve been loafing about, crazier and crazier witches have been introduced,@k ......and now they''ve hijacked this game between me and Beato.'
32851: 'Battler@r@v10/50100069."I''ve got to take it back.@k@v10/50100070. ......I''m supposed to be the one taking care of Beato''s game board now.@k@v10/50100071. ...That means I shouldn''t just sit around here."'
32852: 'VIRGILIA@r@v30/53200018."......Thank you.@k@v30/53200019. I wanted to let this child hear those words."'
32853: 'Ronove@r@v31/53100022."I''m sure she hears them.@k@v31/53100023. ......Milady is simply unable to answer."'
32854: '@rBeato lay there silently, like a living doll with dull eyes...'
32855: '@rThe game board that she had created herself had been hijacked by incomprehensible people and was being turned into a mess...'
32856: '@rBeato had called on me to be her opponent.@k@rThen this game must be something she created for me.@k@rI''ve......got to take it back.'
32857: 'Battler@r@v10/50100072."......You just wait here.@k@v10/50100073. I''m going to take it back."'
32858: 'BEATRICE@r"....................."'
32859: '@rOf course, Beato didn''t respond in any way.@k ......That''s right.@k@rIf she can''t respond, ...then I have to protect it in her place.'
32860: 'Battler@r@v10/50100074."I''ll be right back.@k@v10/50100075. ......VIRGILIA, Ronove.@k@v10/50100076. ...I''m counting on you two to look after this golden sleeping princess."'
32861: 'Ronove@r@v31/53100024."Yes. Leave it to us."'
32862: 'VIRGILIA@r@v30/53200020."......See you later, Battler-kun.@k@v30/53200021. And please,@k@v30/53200022. ......try to discover some part of this child in their game without her.@k@v30/53200023. If you can,@k@v30/53200024. ......then it will mean that you have fought with her, even in her absence."'
32863: 'Battler@r@v10/50100077.".........You''re right.@k@v10/50100078. ...Yeah,@k@|@y@v10/50100079. ......this is no goddamn good at all.@k@v10/50100080. What am I doing?"'
32864: '@rLet''s go.@k ...And let''s take it back.'
32865: 'Battler@r@v10/50100081."Sorry to keep you waiting, witches!!@k @v10/50100082.My break is over!!"'
32866: '@rWhen he faced the jet-black heavens and yelled this,@k the whole world shattered, as though it were made out of thin glass.'
32867: '@rThen, ......as though it had been that way since the beginning,@k .........it transformed into that smoking room where Battler had fought Beato so many times, ...and which the two witches had now hijacked.'
32868: 'LAMBDADELTA@r@v29/52200069."What do you think you''re doing?@k@v29/52200070. You''re only coming back now?@k @v29/52200071.It''s way too late!@k @v29/52200072.Not only has the game reached the second day, it''s already at the finale!"'
