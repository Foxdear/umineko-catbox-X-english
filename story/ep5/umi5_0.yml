32870: '@rYeah, like you ever even waited for me in the first place...'
32871: 'LAMBDADELTA@r@v29/52200073."Bern was waaay sharper and more thrilling than you were. Right?!"'
32872: 'Battler@r@v10/50100083."Shut up.@k@v10/50100084. I''m the player here.@k@v10/50100085. You substitute witches can just take a step back now."'
32873: 'BERNKASTEL@r@v28/52100053.".........Well, I don''t really mind if you join in starting now, but there''s probably no need for you anymore."'
32874: 'LAMBDADELTA@r@v29/52200074."Seriously.@k@v29/52200075. After all, we''re already at the climax!@k@v29/52200076. After this, Bern will probably corner me and win."'
32875: 'Battler@r@v10/50100086."What the hell.........?!"'
32876: 'BERNKASTEL@r@v28/52100054.".........Why not, though?@k @v28/52100055.Let''s let him watch the final moves."'
32877: 'LAMBDADELTA@r@v29/52200077."Yeah.@k@v29/52200078. Come on over, Ushiromiya Battler.@k@|@y@v29/52200079. It''s almost completely over, but here''s the <cute> and <elegant> game I made!"'
32878: 'LAMBDADELTA@r@v29/52200080."Episode 5:@k@v29/52200081. End of the@v29/52200082. golden witch!"'
