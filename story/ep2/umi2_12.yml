12023: '@r...Rosa and the rest returned from the chapel to the parlor in the mansion.@k@rSuch a horrific thing had happened so early in the morning.@k@rOf course they were high-strung...'
12024: '@rBattler and George—who had cried, raged, and let their emotions explode after seeing their parents'' tragic bodies—@kreturned to the parlor, sat on the sofas, and let their minds go blank, as though everything up until then had been a lie...'
12025: '@rOnly Maria was completely unchanged, and looked just like normal.'
12026: '@r......When she wasn''t being mischievous, she was basically a kid who played wordlessly by herself,@k so even if her mind was blank, she would probably look as she did.'
12027: '@r...But as she turned on the TV and flipped through the channels, it looked as though nothing about her had changed from normal.'
12028: '@rPerhaps Rosa had some opinions about this attitude, which was clearly different from normal people.'
12029: '@r......She stared at Maria''s back with a gaze that wasn''t quite pleasant.'
12030: '@rEventually, Kumasawa came to say good morning.@k ...Her cheerful manner was clearly out of place, and she couldn''t help but be bewildered at the strange atmosphere in the room.'
12031: '@r......Then, she heard the details from Gohda, and expressed her shock in a truly noisy manner.'
12032: 'Kumasawa@r@v18/21800052."O-o-o-of course you''ve contacted the police, right...?!@k @v18/21800053.What should we do in a time like this, oooh, what should we do...?!"'
12033: 'Gohda@r@v17/21700112.".........Please listen calmly.@k@v17/21700113. ...It seems that some kind of apparatus was done in by lightning last night.@k@v17/21700114. Because of that, we have become unable to use the telephones..."'
12034: 'Kumasawa@r@v18/21800054."Huuuh?!!@k @v18/21800055.Th-then, until the typhoon passes, we can''t even contact the police?!"'
12035: '@rMaybe Kumasawa''s exaggerated surprise was a little comical.'
12036: '@rRosa giggled, in spite of the situation.'
12037: '@r......Because of that, the fog of confusion that had covered her head cleared up a little.'
12038: 'Rosa@r@v12/21400359.".........I''ve got to stay strong.@k@v12/21400360. ......It''s not just Maria.@k@v12/21400361. ......I''m acting as a parent for George-kun and Battler-kun too now, so I have to stay strong......"'
12039: '@rRosa had been the youngest sibling, with a large difference in age between her and the others.@k@rSo she was always treated as a child.'
12040: '@rEvery time she learned something new, it was something obvious to her brothers and sister,@k and she had grown a complex, thinking that she must be incompetent.'
12041: '@rSo she had formed a passive attitude, asking her brothers and sister for advice every time something happened...'
12042: '@r.........But she no longer had any brothers or sisters.@k@rNow, Rosa was the only one of the four Ushiromiya siblings left.'
12043: '@r...Furthermore, if Kinzo continued to shut himself away even in this extraordinary situation,@k ......Rosa would have to surpass this crisis as the representative of the head.'
12044: 'Rosa@r@v12/21400362."...............I''m not a child anymore, not a child.@k@v12/21400363. ................................."'
12045: '@r...Rosa slapped her knees lightly and stood up.'
12046: '@rShe must not wait for orders now.@k@r...She had to start moving herself.'
12047: '@rShe picked up the receiver to the extension phone on the side table.@k@r......Then she immediately remembered that the telephones were out of order.'
12048: '@rGenji and Shannon, who she had sent to see Kinzo, hadn''t returned yet.'
12049: '@r...She had a general guess.@k He was probably yelling about something nonsensical again, and they were unable to calm him.'
12050: '@r...His important chapel had been defiled with blood.@k@rThat was easy to imagine.'
12051: '@rShe had planned on using the extension phone to call the study, but with the telephone line dead, there was nothing else for it.'
12052: '@rRosa decided to go to the study directly, with her own two feet.'
12053: '@rHer old self would have been so frightened that she wouldn''t have been able to go see Kinzo.'
12054: '@r...And in fact, if she did meet him, she would probably be blamed for something and abused.'
12055: '@rBut now wasn''t the time to be frightened.@k .........As his true daughter, she had to make him aware of the current situation.'
12056: 'Rosa@r@v12/21400364."......Kumasawa-san,@k@v12/21400365. I''m going to see Father.@k@v12/21400366. ...Take special care of George-kun and Battler-kun.@k@v12/21400367. ......I''m sure they are on edge right now."'
12057: 'Kumasawa@r@v18/21800056."Yes, yes...@k@v18/21800057. I am quite sure they must be...@k@v18/21800058. ...It is truly pitiable...@k@v18/21800059. I shall make them something warm to drink."'
12058: 'Rosa@r@v12/21400368."Thank you."'
12059: '@rRosa went out into the hallway, and headed towards Kinzo''s study.'
12060: '@rThe atmosphere in this mansion, which she had spent her younger days in and should have been full of memories, seemed somehow different...'
12061: '@rAnd she began to climb the stairs in the entrance hall...'
12062: '@r......Just then.@k In the gloom down the stairs behind Rosa, ...something glowed.'
12063: '@rIt was a single fluttering gold butterfly.@k@r...It fluttered around and sparkled.@k@rThat butterfly quietly danced without a sound.'
12064: '@r......Obviously.@k No one can hear the sound of a butterfly''s wings beating.'
12065: '@r.........And then, ......it stopped on Rosa''s back as she slowly climbed the stairs.'
12066: '@rRosa didn''t notice.@k And to an ignorant observer, it would probably have looked just as though a single sheet of gold leaf in the shape of a butterfly had gotten stuck there.'
12067: '@rWithout noticing, Rosa continued heading to Kinzo''s study......'
12068: 'BEATRICE@r@v27/20701079.".........Wellll then, in what way should I entertain myself next?@k@v27/20701080. ...There are still many, many pieces left.@k@v27/20701081. ...*cackle*cackle*cackle*cackle*...!"'
12069: '@rIn the parlor, which had returned to silence, the only sound was that of the TV, which Maria was watching alone.'
12070: '@rIf there was anything audible other than that, it was the sound of the rain which had continued on and on since last night.'
12071: '@rEvery one of those people who had viewed that unearthly and horrible scene stayed silent, as though praying that the events of this morning were all a dream.'
12072: '@rOnly Kumasawa hadn''t seen it, and so acted slightly differently.'
12073: '@r...She instead found this silence difficult to bear, and was fidgety with the desire to cheer everyone up.'
12074: '@r...However, unable to say more than she should, it seemed that she was racking her brains as to how she could be of some use...'
12075: '@rNormally it would be time for breakfast.@k ......However, maybe because something like that had happened, Gohda seemed to have forgotten about preparing a meal.'
12076: '@r...No, maybe everyone was so beaten up that they had forgotten their hunger.'
12077: '@rKumasawa wanted to bring up the subject of what they would do for breakfast, but it didn''t seem like the right atmosphere, so she really couldn''t.'
12078: '@rBut it was difficult being hungry.@k@r...So, she casually made a proposal.'
12079: 'Kumasawa@r@v18/21800060."...I imagine you all must be tired after all that has happened.@k@v18/21800061. ......In times like this, I think the best thing is to heat yourself with some warm black tea."'
12080: 'Nanjo@r@v19/21900126."......Mm, that is a good plan.@k@v19/21900127. I agree as well."'
12081: 'Kumasawa@r@v18/21800062."Hoh-hoh-ho.@k@v18/21800063. How about some delicious black tea with biscuits and jam?@k@v18/21800064. Oh yes, yes, it seems that it''s near Halloween—there were some delicious-looking pumpkin-shaped cookies on the shelf..."'
12082: 'Nanjo@r@v19/21900128."......Ah, Kumasawa-san, that''s........."'
12083: '@rOf course, she had said the wrong thing.@k ...Because she had reminded Battler and the rest about that horrible and tragic Halloween party in the chapel...'
12084: '@rNanjo hurriedly whispered into Kumasawa''s ear.'
12085: 'Battler@r@v10/20100562.".........................................."'
12086: 'Kumasawa@r@v18/21800065."......Battler-san, I am truly sorry!@k @v18/21800066....I didn''t mean anything bad, gracious, no..."'
12087: 'Battler@r@v10/20100563."No, don''t worry about it.@k@v10/20100564. .........I''ll definitely turn this boiling anger back on the culprit."'
12088: 'George@r@v07/20300479.".........I wonder if that culprit is still on the island."'
12089: 'Battler@r@v10/20100565."Probably.@k@v10/20100566. After all, there''s not gonna be a boat coming until the typhoon passes."'
12090: 'Kumasawa@r@v18/21800067."Ye-...yes, my goodness!@k @v18/21800068.Because the boats don''t come even if there is a little wind.@k@v18/21800069. They certainly wouldn''t be able to ride one during a typhoon, good gracious no!"'
12091: 'George@r@v07/20300480."......It creeps me out."'
12092: 'Battler@r@v10/20100567."You think so too, Aniki?@k@v10/20100568. Me too.@k@v10/20100569. .........Regardless of whether the culprit was that mystery guest or not."'
12093: 'Nanjo@r@v19/21900129."That''s right.@k@v19/21900130. ......We are naturally suspecting the mysterious guest who calls herself BEATRICE,@k@v19/21900131. but we still cannot be sure that she is the culprit.@k@v19/21900132. ...There is still the possibility she''s a victim whose corpse still hasn''t been found."'
12094: 'George@r@v07/20300481."......When I think of it that way, there''s something I just can''t understand."'
12095: 'Gohda@r@v17/21700115."What do you......mean by that......?"'
12096: 'Battler@r@v10/20100570."It''s simple.@k@v10/20100571. It''s just like Kumasawa baa-chan said a short while ago.@k@v10/20100572. Right now, this island is right in the midst of the typhoon, and escape is impossible.@k@v10/20100573. The same thing goes for the culprit.@k@v10/20100574. .........In that case, having the crime come to light should have been the thing that the culprit most wanted to avoid."'
12097: 'Gohda@r@v17/21700116."......That''s right.@k@v17/21700117. ...There was no need to draw that creepy magic circle on the entrance to the chapel, and show off the fact that the corpses were there."'
12098: 'Battler@r@v10/20100575."Right, exactly that.@k@v10/20100576. Furthermore, if they were able to take the time and effort to do something so horrible to those six,@k@v10/20100577. ......it should have been equally possible for them to hide the six corpses where they would be impossible to find."'
12099: 'George@r@v07/20300482."I agree. That brutal Halloween party probably wasn''t directed at those who died.@k@v07/20300483. ......It was directed at the people who would eventually discover it: us.@k@v07/20300484. You could probably claim that the magic circle was there to show it to us."'
12100: 'Battler@r@v10/20100578."...The culprit knew that they wouldn''t be able to get away from this island for a while.@k@v10/20100579. ......And yet, they acted as though they wanted to make us find the corpses in the middle of this typhoon."'
12101: 'Battler@r@v10/20100580."......What...does this mean?@k@v10/20100581. ...If I was the culprit, I definitely wouldn''t play around and make us find the corpses."'
12102: 'Gohda@r@v17/21700118."............BEATRICE-sama was not in her room.@k@v17/21700119. ...The room did not seem particularly disturbed.@k@v17/21700120. ......Ah, no, Milady did disturb it quite a lot though..."'
12103: 'Battler@r@v10/20100582."...Come to think of it, what happened to Jessica?"'
12104: 'Gohda@r@v17/21700121."Kanon-san is looking after her.@k@v17/21700122. ...They are probably in Milady''s room."'
12105: 'George@r@v07/20300485."............That isn''t good.@k@v07/20300486. ...The culprit is definitely still on the island.@k@v07/20300487. ......In this situation, I don''t believe it''s a very good idea to isolate ourselves in small numbers."'
12106: 'Kumasawa@r@v18/21800070."Wh-what do you mean by that...?@k@v18/21800071. Y-y-you don''t mean to say that the culprit plans to kill all of us...?!@k @v18/21800072.Awawawawawawawawa..."'
12107: 'Nanjo@r@v19/21900133."Let us remain calm...@k@v19/21900134. That is not yet certain..."'
12108: 'Battler@r@v10/20100583."But we can''t deny the possibility, much to my chagrin. Ihihi."'
12109: 'Battler@r@v10/20100584."......This letter was in the chapel.@k@v10/20100585. According to this, the culprit is the witch,@k@v10/20100586. and if we don''t solve the riddle of Grandfather''s epitaph and find the gold, she''ll massacre the whole family...or something like that."'
12110: 'Gohda@r@v17/21700123."Is that true...!@k @v17/21700124.Umm, would you allow me to read it as well...?"'
12111: 'Kumasawa@r@v18/21800073."Hii...hi...hi...hieeeeeeeeeeeeeeeeeeee...eeeeeeeeee...hh..."'
12112: 'Nanjo@r@v19/21900135."......mmmmmmmgh......"'
12113: '@rAs they read the witch''s letter, Gohda, Kumasawa, and Nanjo''s faces grew even paler than they had been...'
12114: '@rKumasawa could no longer hide her shaking.'
12115: 'Battler@r@v10/20100587.".........If you don''t want to die, try finding Grandfather''s hidden gold, huh.@k@|@y@v10/20100588. ...Screwing around with us.@k@v10/20100589. I''ll bet you can''t solve the riddle, so you''re trying to make us solve it...!"'
12116: 'Gohda@r@v17/21700125."However, ...I wonder what the truth is.@k@v17/21700126. Madam always insisted that the Legend of the Gold was nothing more than a fantasy created by the Master.@k@v17/21700127. ......It is doubtful whether that actually existed..."'
12117: 'Nanjo@r@v19/21900136."True...@k@v19/21900137. Supposedly, they thought it would be nice if it existed, but only somewhat believed it.@k@v19/21900138. ......The relatives only all started believing in the Legend of the Gold after Kinzo''s health worsened and the inheritance problem came up.@k@v19/21900139. I would think that there were very few people who believed it before then."'
12118: 'George@r@v07/20300488."...Really? I wonder if that''s why.@k@v07/20300489. Do you remember?@k @v07/20300490.On the table in the chapel.@k@v07/20300491. ...There were three gold ingots.@k@v07/20300492. That alone is worth quite a lot.@k@v07/20300493. Couldn''t that truly prove that the Legend of the Gold was real?"'
12119: 'Kumasawa@r@v18/21800074."E-...excuse me, ...please wait.@k@v18/21800075. Just now, did you say three gold bars......?"'
12120: 'Battler@r@v10/20100590."......Yeah, there were definitely three of them piled up.@k@v10/20100591. So what?"'
12121: 'Kumasawa@r@v18/21800076."Well, umm, I, .........happened to hear Krauss-sama talking about it once.@k@v18/21800077. ......Yes, I just heard it, you understand?!@k @v18/21800078.It''s not like I was trying to listen to his discussions in secret, gracious no!"'
12122: 'Battler@r@v10/20100592."Don''t worry about that now.@k@v10/20100593. So then what?@k@v10/20100594. Is there something wrong with there being three of those gold bars?"'
12123: 'Kumasawa@r@v18/21800079."...Y-yes.@k@v18/21800080. According to Krauss-sama, ...there was only one bar ever found to support the Legend of the Gold."'
12124: 'Nanjo@r@v19/21900140."......That is correct.@k@v19/21900141_b. I do believe the story goes that Kinzo-san showed the president of Marusoo a mountain of gold, and let him take one bar back with him."'
12125: 'Kumasawa@r@v18/21800081."And that one came to be in Krauss-sama''s possession.@k@v18/21800082. And he said this as well.@k@v18/21800083. That there was no gold which supported the Master''s legend besides that one..."'
12126: 'Battler@r@v10/20100595."You''re talking about my uncle here, right?@k @v10/20100596.So what have we got here?@k @|@y@v10/20100597.......No wait, ......three?!@k @v10/20100598.Wait, wait, where did they come from, that''s too many of them!"'
12127: 'Nanjo@r@v19/21900142."Might we not think of it this way?@k@v19/21900143. Maybe the other people in the family each found one, and they each brought one of them there..."'
12128: 'Gohda@r@v17/21700128."No, I cannot believe that.@k@v17/21700129. When all of the relatives came to the mansion, I was entrusted with their luggage.@k@v17/21700130. I did not feel any suspicious weight back then."'
12129: 'George@r@v07/20300494."......I think they weighed about ten kilograms.@k@v07/20300495. If that much weight was in their bags, even I would notice.@k@v07/20300496. But it didn''t seem that way."'
12130: 'Battler@r@v10/20100599."Same here.@k@v10/20100600. At the most, there were some changes of clothes, medicine, Kyrie-san''s makeup.@k@v10/20100601. That''s about it, I think.@k@v10/20100602. Auntie Rosa''s luggage also looked pretty light."'
12131: 'George@r@v07/20300497."......In that case, those three piled up gold bars were being shown to them, ...or maybe us.@k@v07/20300498. ......Telling us that the Legend of the Gold is definitely real.@k@v07/20300499. That it isn''t a fantasy.@k@v07/20300500. And challenging us to uncover it."'
12132: 'Gohda@r@v17/21700131."Could there be a scheme...to have us solve the epitaph which points to the hidden location, and then try to snatch it away?"'
12133: 'Battler@r@v10/20100603."............That does fit best.@k@v10/20100604. ...But there are a few parts that don''t make sense.@k@v10/20100605. First, our parents, who should have been the most likely to be able to solve the epitaph, were killed first.@k@v10/20100606. I think that creates an immediate contradiction."'
12134: 'Battler@r@v10/20100607.".........And something else makes even less sense.@k@v10/20100608. ......They''re trying to say that the Legend of the Gold is actually true,@v10/20100609. but how could they prepare that gold?@k@v10/20100610. ......It''s almost like the culprit has already found the gold,@k@v10/20100611. and is telling us to try and find it too."'
12135: 'George@r@v07/20300501."Maybe the culprit obtained those three like Uncle Krauss and thereby became certain about the Legend of the Gold,@k@v07/20300502. and is trying to make us search for the rest... I think that way is the most convincing."'
12136: 'Battler@r@v10/20100612."...........................@k@v10/20100613. ......The pieces on the chessboard aren''t lining up at all.@k@v10/20100614. ............We don''t have a clue what the culprit is planning, what they want, what they want to make us do.@k@v10/20100615. ............Is it pointless?@k@r@v10/20100616. Thinking about anything, at this point in time.@k@v10/20100617. ..........................."'
12137: 'Maria@r@v13/20400377."......Kihihi.@k@v13/20400378. It was written down.@k@v13/20400379. What she wants you to do.@k@v13/20400380. Can''t any of you read? Kihihihihihihihihihi."'
12138: '@rMaria suddenly laughed in a creepy voice.'
12139: '@r...I''d thought she''d been concentrating on the TV, but she''d been listening in too, apparently.'
12140: '@rAs she remained facing the TV, ...she very simply told us what we were forgetting.'
12141: 'Maria@r@v13/20400381."BEATRICE hasn''t said one word about wanting the gold.@k@v13/20400382. ......She''s not asked anything except whether you can solve the epitaph''s riddle or not."'
12142: 'Maria@r@v13/20400383."...Although I bet she thinks it''ll be impossible for you anyway.@k@v13/20400384. ......Kihihihihihihihihihihihihihihihihi."'
12143: 'Battler@r@v10/20100618."......So you''re saying you can solve it, Maria?"'
12144: 'Maria@r@v13/20400385."...Don''t caaare.@k@v13/20400386. She''s going to take me to the Golden Land, so.@k@v13/20400387. Won''t get in BEATRICE''s way.@k@v13/20400388. Kihihihihihihihihihihi,@w333.@|@y ouch."'
12145: 'Battler@r@v10/20100619."Looks like if we wanna understand further, we''re gonna have to ask Maria.@k@v10/20100620. ...Maria, tell us.@k@v10/20100621. ...............Who is this BEATRICE?@k@v10/20100622. What is she planning?"'
12146: 'Maria@r@v13/20400389."Kihihihihihihihihihihihihihihihihi!@k @v13/20400390.Well, you see, BEATRICE is a witch!@k @v13/20400391.She can do anything with her wondrous powers."'
12147: 'Maria@r@v13/20400392."Anything can be done with the power of magic.@k@v13/20400393. You can create gold, you can create bread.@k@v13/20400394. And of course, you can even create sweets!@k @v13/20400395.You saw it, didn''t you?@k @v13/20400396.Kihihihihihihihihihihihihihihihihihihihihihihihi!"'
12148: 'George@r@v07/20300502_1."......hn?"'
12149: '@rAt that time, everyone jumped at the sound of a door being closed forcefully.'
12150: '@rWe turned around to find that at some point Rosa had returned, bringing Genji and Shannon.'
12151: '@r......Then she rapidly approached Maria, her heels clacking, and hit her sharply on the cheek.'
12152: 'Rosa@r@v12/21400369."......Stop talking about that.@k@v12/21400370. Battler-kun and the rest will take it badly."'
12153: 'Maria@r@v13/20400397."..................Uu..."'
12154: '@rWithout waiting for a response, she slapped Maria''s cheek once more.@k@rEveryone could only stand there, shocked.'
12155: 'Rosa@r@v12/21400371."I don''t know what "uu" means.@k@v12/21400372. What about yes?"'
12156: 'Maria@r@v13/20400398."...............Uu."'
12157: '@rShe mercilessly slapped Maria''s cheek again.'
12158: '@r......Maybe she didn''t feel like resisting after being hit twice.'
12159: '@rMaria weakly said yes.'
12160: 'Nanjo@r@v19/21900144."Ro-......Rosa-san, there was no reason to do something so harsh..."'
12161: 'Rosa@r@v12/21400373."...This is my daughter''s education.@k@v12/21400374. I would greatly appreciate it if you didn''t interject."'
12162: '@rThe atmosphere around Rosa, with Genji and Shannon in tow, was somehow cold, and yet dignified,@k ...completely different from how she seemed before she left.'
12163: '@rWe saw that Auntie Rosa was holding something that looked like a gun.@k@r......I couldn''t imagine that she would have brought back a toy in this situation.'
12164: 'George@r@v07/20300503."Auntie Rosa, what is...?"'
12165: 'Rosa@r@v12/21400375."......This is Father''s.@k@v12/21400376. Because of the current situation, I borrowed it specially.@k@v12/21400377. .........I''m sure you all realize as well as I do.@k@v12/21400378. The culprit is still nearby.@k@v12/21400379. We don''t know what could happen."'
12166: 'George@r@v07/20300504."...............I agree.@k@v07/20300505. ......Rather than trying to figure out what the culprit is planning, it might be better to first think about our own safety."'
12167: 'Maria@r@v13/20400399."..........................."'
12168: 'Rosa@r@v12/21400380."Father was alright, but he was slightly agitated by these sudden events.@k@v12/21400381. ...Fortunately, he said that he won''t leave his room, so he''s probably safe.@k@v12/21400382. Now, we should do all we can to gather in the same place."'
12169: 'Battler@r@v10/20100623."...I agree.@k@v10/20100624. We don''t even know where the culprit is hiding, ......and anyway, there''s no proof that there''s only one of them.@k@v10/20100625. ..............."'
12170: '@rI shivered at the words that had come out of my own mouth.'
12171: '@rThat''s right.@k Could a single person kill six people and create such a horrible scene all alone?'
12172: '@r......Isn''t it natural to assume that this crime was carried out by multiple culprits?'
12173: 'Nanjo@r@v19/21900145."......I agree with Rosa-san.@k@v19/21900146. It is probably good for us to gather in one place."'
12174: 'Kumasawa@r@v18/21800084."My goodness, yes, I also think that is good, yes, yes!"'
12175: 'Gohda@r@v17/21700132.".........Maybe it would be good to call Milady and Kanon-san here already."'
12176: 'George@r@v07/20300506."Good idea.@k@v07/20300507. ......Let''s have them come down."'
12177: '@rGeorge-aniki made to grab the extension phone, but Gohda-san shook his head.'
12178: '@r......Oh, right, we can''t use the phones right now.'
12179: 'Battler@r@v10/20100626."......I''ll go with a couple people.@k@v10/20100627. If George-aniki and Gohda-san come as well, that should be enough."'
12180: 'Rosa@r@v12/21400383."............No.@k@v12/21400384. Let''s all go together.@k@|@y@v12/21400385. ...It''s a "Wolves and Sheep Puzzle".@k@v12/21400386. If we''re all gathered together here in equilibrium, that situation is the most safe."'
12181: 'Battler@r@v10/20100628."...''Wolves and Sheep Puzzle''?"'
12182: 'Maria@r@v13/20400400."......Uu.@k@v13/20400401. I have it.@k@v13/20400402. Show you."'
12183: 'Rosa@r@v12/21400387."Maria, turn off the television.@k@v12/21400388. ......Genji-san.@k@v12/21400389. Please tell me where Jessica-chan''s room is.@k@v12/21400390. Let''s all go together."'
12184: 'Genji@r@v14/21600091."......Yes.@k@v14/21600092. I will guide you."'
12185: 'Rosa@r@v12/21400391."Come on, everyone.@k@v12/21400392. We''ll move together.@k@v12/21400393. Follow my instructions."'
12186: '@rWe stood up.@k Maria alone looked like she had some lingering attachment to the TV, but she went along with everyone for now, and got up.'
12187: 'George@r@v07/20300508."...Shannon, thank goodness.@k@v07/20300509. I was a little worried when you took so long to get back."'
12188: 'Shannon@r@v15/20500668."I am sorry to have worried you.@k@v15/20500669. The Master ordered me to copy down something..."'
12189: 'George@r@v07/20300510."Copy down?"'
12190: 'Genji@r@v14/21600093."............Shannon."'
12191: 'Shannon@r@v15/20500670."I, .........I am sorry, excuse me..."'
12192: '@rWe headed for Jessica''s room, led by Genji-san, and Auntie Rosa, holding the gun.'
12193: '@rJessica and Kanon-kun are a girl and boy of about the same age.@k That''d sure be a shame if we walked in on them at a bad tiiime, is what I''d have joked about normally, I''m sure.'
12194: '@rHowever, Auntie Rosa was on edge, constantly exuding tension.@k ...So it really wasn''t the kind of atmosphere where I could joke like that.'
12195: 'Rosa@r@v12/21400394."Hey, don''t fall behind!!@k @v12/21400395.Everyone move together!@k @v12/21400396.We don''t know when or where the culprit might leap out at us, you know?!"'
12196: '@r...No, maybe Auntie Rosa''s attitude was more appropriate.@k@r......Since Grandfather hadn''t come down, Auntie Rosa was the leader.'
12197: '@rThis wasn''t a situation where she could smile like she always did.'
12198: '@r......And Auntie Rosa was herself a mother.@k She probably also thought that, if she didn''t get ahold of herself, some harm might befall her beloved daughter.'
12199: '@rThe culprit had killed six of our parents at once.@k@r......The method they had used was unknown, but there was a good chance that this opponent could take down a large number of people in an instant.'
12200: '@rWas that with weapons, or with numbers?@k@r......Or was it the magic of a witch?'
12201: '@rIn any case, it definitely didn''t look like there were any factors indicating we could get careless...'
12202: '@rThe rest of us should also take much, much greater care, like Auntie Rosa...'
12203: 'Rosa@r@v12/21400397."............Everyone, stop!"'
12204: '@rAuntie Rosa spoke in a sharp voice.'
12205: '@rWhen we peered forwards, wondering what was up...@k@r......we immediately noticed the reason...'
12206: 'Kumasawa@r@v18/21800085.".........Wh-......what is this......"'
12207: 'Shannon@r@v15/20500671."Hii...............!"'
12208: 'Gohda@r@v17/21700133."Everyone, get back...!"'
12209: '@rGohda-san and Genji-san approached the door...@k@rJessica''s room was probably on the other side of that door.'
12210: 'Gohda@r@v17/21700134."This......seems to be the same paint that was scribbled on the door to the chapel."'
12211: 'Genji@r@v14/21600094."......It appears so.@k@v14/21600095. It appears that not much time has passed since it was drawn."'
12212: 'Battler@r@v10/20100629."What is that......@k@v10/20100630. ......Another...magic circle?!"'
12213: 'Maria@r@v13/20400403."......It''s the first magic circle of the moon.@k@v13/20400404. ...It has the power to open unopenable doors."'
12214: '@rThe door to Jessica''s room......had that creepy graffiti on it which had been drawn on the door to the chapel.'
12215: '@r......That strange shape definitely had some meaning related to the occult.'
12216: '@rBut it didn''t matter what that meaning was.@k@rWe were more worried about whether those two were alright.'
12217: 'George@r@v07/20300511."Tha-that doesn''t matter!@k @v07/20300512.Are Jessica-chan and Kanon-kun alright?!"'
12218: 'Nanjo@r@v19/21900147."...I have a bad premonition...@k@v19/21900148. We should quickly take those two downstairs."'
12219: 'Gohda@r@v17/21700135."Milady!@k @v17/21700136.Milady!!@|@y@k @v17/21700137.Are you there?@|@y@k @v17/21700138.Please answer!!"@|@y'
12220: '@rGohda-san knocked violently and yelled, ...but there was no answer.'
12221: '@rHe twisted the doorknob with a clatter, but the lock just resisted him.'
12222: 'Genji@r@v14/21600096."......Rosa-sama, it seems to be locked."'
12223: 'Rosa@r@v12/21400398."There are no other options.@k@v12/21400399. Please open it."'
12224: '@rGenji nodded, and Gohda quickly unlocked the door with the master key.'
12225: '@r...In the back of my mind, horrible images floated up and disappeared, one after another.@k@r......A magic circle had been drawn on the door to the chapel.@k@rAnd six corpses had been behind that.'
12226: '@r......So, if there was a magic circle drawn on the door to Jessica''s room, ......then beyond it............'
12227: 'Gohda@r@v17/21700139."Je-............Jessica-sama!!"'
12228: 'Rosa@r@v12/21400400."Wh-what happened?@k@v12/21400401. Is she there?!"'
12229: 'Battler@r@v10/20100631."Jessica!!@k @v10/20100632.What happened?!!"'
12230: '@r......It was truly heartless.'
12231: '@r...The expression on Gohda-san''s face and what he said when he opened the door...@kprepared us for the brutal fate that Jessica might have met, even without seeing her...'
12232: '@rEveryone tumbled into Jessica''s room at once.@k@r...That scene told everyone that their worst fears were right on the mark...'
12233: 'Battler@r@v10/20100633."...Jessicaaaaaaaaaaaaaaa!!!"@|@y'
12234: 'Rosa@r@v12/21400402.".........Oh......my......@k@v12/21400403. ...Doc-...Doctor Nanjo!!"'
12235: '@rThe room seemed elegant for Jessica''s age, and there she was inside it, lying on the ground.'
12236: '@rThere was a large pool of blood on the floor.'
12237: '@r......And there was a knife or something sticking deep into her back......'
12238: '@r...Was it a knife?@k There was a design in the handle that had to have been done in a devil motif.'
12239: '@rThere was no doubt that this weapon(?) carried some kind of occult meaning.'
12240: 'Nanjo@r@v19/21900149."...This is.........horrible.@k@v19/21900150. ...She has passed away.@k@v19/21900151. ......This...probably...reaches her lungs...@k@v19/21900152. ......Not much time has passed since she died."'
12241: 'Battler@r@v10/20100634."Jessicaaaaaaaaaaaa!!@k @v10/20100635.Damn it, damn iiiiiiiiiiiiiiiiiit!!"@|@y'
12242: 'Shannon@r@v15/20500672."......B-Battler-sama......"'
12243: 'Battler@r@v10/20100636."I was naive!!@|@y@k @v10/20100637.I knew it!!@|@y@k @v10/20100638.Since they couldn''t escape the island, the culprit was definitely close by!@k @v10/20100639.Then why wasn''t I on my guard straight away!!@k @v10/20100640.......I was naive!!@|@y@k @v10/20100641.I just assumed that culprits sneak away after they commit a crime!"'
12244: 'George@r@v07/20300513."......We were stunned then.@k@v07/20300514. We thought we just had to accept it when Jessica-chan gave in to rage and ran off.@k@v07/20300515. ......But we were naive.@k@v07/20300516. We should have stopped her...!"'
12245: 'Rosa@r@v12/21400404."...Gohda-san, why did you leave those two alone?!@k @v12/21400405.If only you had been with them, something like this would never...!!"'
12246: 'Gohda@r@v17/21700140."N-no, you, you see, I...!!@k @v17/21700141.I said it was dangerous so we should return!@k @v17/21700142.It''s just that...Milady said that she wanted to be alone!@k @v17/21700143.Kanon-san told me to leave it to him, and...!"'
12247: 'Gohda@r@v17/21700144."......Speaking of which, where is Kanon-san...?!"'
12248: 'George@r@v07/20300517."That''s right!@k @v07/20300518.What in the world happened to Kanon-kun?!"'
12249: 'Shannon@r@v15/20500673."K-......Kanon-kun...@k@v15/20500674. Where........."'
12250: 'Gohda@r@v17/21700145."Kanon-san should have been with Milady...@k@v17/21700146. Where in the world...!"'
12251: 'Battler@r@v10/20100642."You don''t think...they got him...?!"'
12252: 'Rosa@r@v12/21400406.".......................................@k@|@y@v12/21400407. Quiet.@k@v12/21400408. .........Someone might be hiding in this room.@k@v12/21400409. Search under the bed and in the closet!"'
12253: '@rThere was also a chance that Kanon-kun''s corpse had been pushed away somewhere.'
12254: '@rAt Rosa-san''s order, everyone searched the room together.'
12255: '@r......But there wasn''t a single human hiding anywhere.'
12256: 'Battler@r@v10/20100643."......He''s nowhere!!@k @v10/20100644.Could the culprit have taken him out of the room?!@k @v10/20100645.Then we have to search for him quickly and save him!@k @v10/20100646.......If we''re slow, something awful might happen!!"'
12257: 'Battler@r@v10/20100647."Auntie Rosa, let''s search all over the mansion!@k @v10/20100648.Let''s search for the culprit!@k @v10/20100649.Let''s save Kanon-kun!!"'
12258: 'Rosa@r@v12/21400410."........................@k@|@y@v12/21400411. ............Quiet!!!"'
12259: '@rAuntie Rosa yelled at us loudly, and we fell instantly silent.'
12260: '@rShe was probably contemplating something.@k@r...But what in the world could that be......?'
12261: '@r...Auntie Rosa walked around the room as though looking for something, ...or as though she was collecting her thoughts.'
12262: '@r............Then, she found something on the side table by the bed, and picked it up.'
12263: 'Rosa@r@v12/21400412."...............If anyone knows, tell me.@k@v12/21400413. ......What key is this?"'
12264: '@rAuntie Rosa showed everyone a key with a cute mascot attached to it.'
12265: '@r...Judging from its cute appearance, I didn''t doubt that it was Jessica''s key, but I had no way of knowing what key it was.'
12266: 'Genji@r@v14/21600097."......It is probably the key to this—to Milady''s room."'
12267: '@rAfter hearing that, Auntie Rosa made a point of going outside the door and checking.'
12268: '@r.........Without a doubt, it was the key to this room.'
12269: 'Rosa@r@v12/21400414."............I wonder why it was set in a place like this.@k@v12/21400415. Normally, don''t you keep important keys in your pocket?"'
12270: 'Shannon@r@v15/20500675."...Umm, ............Milady wasn''t in the habit of locking her room.@k@v15/20500676. Except for when she went to school—@k@v15/20500677.it seems she would do it then, because she didn''t want Krauss-sama to look inside her room..."'
12271: 'Rosa@r@v12/21400416.".........I see.@k@v12/21400417. She wasn''t at school, so it''s natural that Jessica-chan would set the key down here.@k@v12/21400418. How many keys can open this door?"'
12272: 'Kumasawa@r@v18/21800086."Ju-...just the one Milady had..."'
12273: 'Rosa@r@v12/21400419."Can''t it be opened with your master keys?"'
12274: 'Genji@r@v14/21600098."......They can open it."'
12275: 'Rosa@r@v12/21400420."How many master keys are there?@k @v12/21400421.Do all of the servants have one?@k @v12/21400422.Are there extras?"'
12276: 'Gohda@r@v17/21700147."Yes.@k@v17/21700148. We all have one.@k@v17/21700149. .........As for extras, ...I wonder."'
12277: 'Shannon@r@v15/20500678."There used to be several, ...but Madam strongly scolded us that this was careless, so I believe they have been dealt with."'
12278: 'Genji@r@v14/21600099."......That is correct.@k@v14/21600100. There is only one held by each servant.@k@v14/21600101. There are no more."'
12279: 'Battler@r@v10/20100650."...nn?@k @v10/20100651.Wait a second.@k@v10/20100652. ...In the last game, I thought we said there were extra master keys?"'
12280: 'BEATRICE@r@v27/20701082."Yes.@k@v27/20701083. Regarding that.@k@v27/20701084. I have noticed that having several master keys whose locations are unknown is quite disadvantageous for me."'
12281: 'Battler@r@v10/20100653."......Well, yeah.@k@v10/20100654. Since you want to make me believe in magic by using locked rooms, it must be really disadvantageous for you to have master keys unaccounted for."'
12282: 'Battler@r@v10/20100655."...In fact, every time a trick related to locks showed up,@k@v10/20100656. I was planning to resist by arguing that the culprit possessed a master key that someone had lost in the past, or a duplicate."'
12283: 'BEATRICE@r@v27/20701085."Yes, exactly.@k@v27/20701086. So I''ve decided to make a move to defeat that.@k@v27/20701087. ......I''ll alter the setup."'
12284: 'BEATRICE@r@v27/20701088."@|@y@c900.@[The only master keys are the ones held by the servants, one key each.@]@c.@k@v27/20701089. *cackle*cackle*."'
12285: 'Battler@r@v10/20100657."...Messing with me.@k@v10/20100658. ......More importantly.@k@v10/20100659. What is this move?@k@v10/20100660. ......What''s Auntie Rosa saying?"'
12286: 'BEATRICE@r@v27/20701090."*cackle*cackle*.@k@v27/20701091. Who knows?@k @v27/20701092.You should try listening in."'
12287: 'Rosa@r@v12/21400423."...............Thank you.@k@v12/21400424. I have the situation sorted out."'
12288: 'Rosa@r@v12/21400425."......And I''ve managed to identify the culprit who assaulted Jessica-chan, or maybe one of their accomplices."'
12289: 'Battler@r@v10/20100661."Wha-what did you say...?!@k @v10/20100662.Who is that?!"'
12290: 'George@r@v07/20300519."...Auntie Rosa, you can''t be talking about Kanon-kun...?"'
12291: 'Shannon@r@v15/20500679."......Huh, ......huuuh?!@k @v15/20500680.Wh-why Kanon-kun?!"'
12292: 'Rosa@r@v12/21400426."This room was locked.@k@v12/21400427. And the only keys that can unlock this room are the master keys that each servant is holding, as well as the key Jessica had."'
12293: 'Rosa@r@v12/21400428."......But Jessica-chan''s key was closed up in here.@k@v12/21400429. ...Which means the only keys that could have locked it are the master keys."'
12294: 'Genji@r@v14/21600102."............It is as you say."'
12295: 'Rosa@r@v12/21400430."In that case, someone killed Jessica-chan, then locked the door!@k @v12/21400431.That person was holding a master key.@k@v12/21400432. And there are only five people who were holding master keys!"'
12296: 'Kumasawa@r@v18/21800087."Oh, oh my!!@k @v18/21800088.It wasn''t me, not me!@k @v18/21800089.Gracious, no, I couldn''t do something like that!"'
12297: 'Rosa@r@v12/21400433."......Kumasawa-san, you got up late.@k@v12/21400434. After we returned from the chapel to the parlor, we did meet you there,@k@v12/21400435. but it''s impossible to prove where you were and what you were doing until that time."'
12298: 'Rosa@r@v12/21400436."You watched us from the shadows, chased after Jessica-chan and Kanon-kun when they were isolated, and stealthily attacked them."'
12299: 'Kumasawa@r@v18/21800090."A-are you saying that I visited Milady''s room,@v18/21800091. and did something so horrible?!@k @v18/21800092.I, I, I did no such thing!@k @v18/21800093.Gracious no, no such thing!!"'
12300: 'Rosa@r@v12/21400437."What about you, Gohda-san?@k @v12/21400438.You said that you left Jessica-chan in Kanon-kun''s care and returned."'
12301: 'Rosa@r@v12/21400439."...But I wonder if that''s true?@k@v12/21400440. ......I wonder if you didn''t really kill the two of them, hide Kanon-kun''s corpse,@k@v12/21400441. and then come back with an innocent look on your face?!"'
12302: 'Gohda@r@v17/21700150."Nothing of the sort happened!@k @v17/21700151.I swear on my name that I did not do anything like that!!"'
12303: 'Shannon@r@v15/20500681."......It, it wasn''t us, either...!!@k @v15/20500682.We were following the Master''s orders and—"'
12304: 'Rosa@r@v12/21400442."Yes.@k@v12/21400443. At least you and Genji-san are alright.@k@v12/21400444. That is backed up by what I heard from Father.@k@v12/21400445. The two of you were in Father''s room the whole time, one copying and one standing witness.@k@v12/21400446. Father and I can guarantee that."'
12305: 'Genji@r@v14/21600103.".........Thank you very much."'
12306: 'Rosa@r@v12/21400447."In that case, I think the argument becomes who is more suspicious, Gohda-san or Kumasawa-san.@k@v12/21400448. ......That''s how I thought, too, at least in the first moments after entering this room."'
12307: 'Rosa@r@v12/21400449.".........But then, I thought it was strange.@k@v12/21400450. Look at the state of Jessica-chan''s body.@k@v12/21400451. Don''t you all think it''s strange?"'
12308: 'Nanjo@r@v19/21900153."......Strange, ...you say...?"'
12309: 'Rosa@r@v12/21400452."Jessica-chan was stabbed in the back.@k@v12/21400453. .........Come on, it''s often generally said, right?@k @v12/21400454.That in crimes where the victim is stabbed in the back, there''s a high likelihood that the culprit was someone whose face was known to the victim.@k@v12/21400455. She definitely wouldn''t invite a person that she doesn''t trust into her room, and defenselessly expose her back."'
12310: 'Shannon@r@v15/20500683."Ro-......Rosa-sama, you couldn''t mean...@v15/20500684..........to say that was Kanon-kun...?"'
12311: 'Rosa@r@v12/21400456."Yes.@k@v12/21400457. We know well what state Jessica-chan was in right before she was killed."'
12312: 'Rosa@r@v12/21400458."......Jessica-chan was very panicked after seeing her parents'' tragic bodies.@k@v12/21400459. And it''s easy to imagine that after she regained her composure, she''d have been in a horrible slump."'
12313: 'Rosa@r@v12/21400460."......I can really understand it if Jessica-chan''s frame of mind led her to shut herself up alone in her room.@k@v12/21400461. And those particulars would also fit with Gohda-san''s story."'
12314: 'Rosa@r@v12/21400462."......Jessica-chan said to leave her alone.@k@v12/21400463. ...Then Kanon-kun, who is of a similar age, and may have had some adolescent relationship with her, said to leave it to him.@k@v12/21400464. I can really understand why he''d feel that way."'
12315: 'Rosa@r@v12/21400465.".........And I think that is the very reason why Jessica-chan welcomed Kanon-kun into her room."'
12316: 'Rosa@r@v12/21400466."But what if it had been Gohda-san or Kumasawa-san?@k@v12/21400467. Would she have let them into her room?"'
12317: 'Gohda@r@v17/21700152."......I, I believe that I have gained Milady''s trust.@k@v17/21700153. But even so, err..."'
12318: 'Rosa@r@v12/21400468."Then you are another suspect after all, right, Gohda-san?@k @v12/21400469.I thought that you probably weren''t liked by Jessica-chan, so I believed she wouldn''t have let you into her room."'
12319: 'Rosa@r@v12/21400470."So I thought it was impossible that you were the culprit, but...?"'
12320: 'Gohda@r@v17/21700154."No, umm...!@k @v17/21700155..........I am afraid to say that I may not have been accepted by Milady.@k@|@y@v17/21700156. ...K-Kumasawa-san, what about you?"'
12321: 'Kumasawa@r@v18/21800094."Ho, hohohohohoho!@k @|@y@v18/21800095.A senior like me is far too separated by age to understand the feelings of a young person like Milady very well...@k@v18/21800096. And perhaps Milady did not open her heart up to me.@k@v18/21800097. Right, Gohda-san?!"'
12322: 'Gohda@r@v17/21700157."Yes, that''s right!@k @v17/21700158.She probably did not open her heart to us to a great degree!@k @v17/21700159.It would be inconceivable that Milady would let us into her room when she was heartbroken!"'
12323: '@rGohda-san and Kumasawa baa-chan each clasped their hands together, affirming each other with forced smiles on their faces.'
12324: '@rIt was a really unpleasant routine.'
12325: 'Rosa@r@v12/21400471."Someone who would be permitted to enter Jessica-chan''s room when she was heartbroken.@k@v12/21400472. Who would have been given access to her defenseless back.@k@v12/21400473. And that person had a master key.@k@v12/21400474. That only points to one person.@k@v12/21400475. ......It was impossible for anyone except Kanon-kun."'
12326: 'Shannon@r@v15/20500685."Ple-......please, wait...!@k @v15/20500686.Kanon-kun definitely wouldn''t do something like...!"'
12327: 'Rosa@r@v12/21400476."Oh, then, is there someone else?@k @v12/21400477.Is Gohda-san or Kumasawa-san suspicious after all?@k@v12/21400478. Which of the two do you think is more suspicious, Shannon-chan...? Come on."'
12328: 'Shannon@r@v15/20500687."I, ......I, ...don''t............"'
12329: 'Kumasawa@r@v18/21800098."It wasn''t me, Shannon-san!@k @v18/21800099.Gracious, no, it was not me!"'
12330: 'Gohda@r@v17/21700160."Of course, it wasn''t me either!@k @v17/21700161.It was Kanon-san who had a close relationship with Milady, and you, Shannon-san, if anyone!"'
12331: 'Rosa@r@v12/21400479.".........Oh yes, I almost forgot.@k@v12/21400480. ......Jessica-chan might also have let Shannon-chan into her room."'
12332: 'Rosa@r@v12/21400481."But you should have been with Father.@k@v12/21400482. .........But in reality,@v12/21400483. ......are you the culprit...............?"'
12333: 'George@r@v07/20300520."Sha-......Shannon can''t be the culprit!@k @v07/20300521.You only just said that she was doing some important work with Grandfather!"'
12334: 'Rosa@r@v12/21400484."Yes, I know that.@k@v12/21400485. Neither Shannon-chan nor Genji-san is the culprit.@k@v12/21400486. Even Father acknowledges that they were together the whole time.@k@v12/21400487. .........Well then, what do you think, everyone...?"'
12335: '@rAsked that, no one could respond...@k@rBecause even if someone did argue back, they would then have to offer the name of a different suspicious person.'
12336: '@r......And no matter whose name that was, that person was here.@k@r...No one could do something like that.'
12337: '@rAuntie Rosa glanced at everyone in turn, fingering the gun like it was a toy...'
12338: '@r.........She seemed so different from the normal, kind Auntie Rosa.'
12339: '@r...No, it''s probably because I still don''t feel how much danger we''re in.@k@r...Maybe until Auntie Rosa''s attitude seemed natural to me, I wasn''t fully appreciating the danger...'
12340: 'Rosa@r@v12/21400488."Looks like no one has an opinion.@k@v12/21400489. Then I will say mine."'
12341: 'Rosa@r@v12/21400490."Of course, I can''t deny the possibility that Kanon-kun is a victim without a corpse.@k@v12/21400491. But until we find his corpse, I also definitely can''t deny the possibility that Kanon-kun is a suspect."'
12342: 'Rosa@r@v12/21400492."......There''s a chance that Kanon-kun may claim to have been attacked by the culprit and confined somewhere...@k@v12/21400493. He may appear unexpectedly with that excuse."'
12343: 'Rosa@r@v12/21400494."But take care.@k@v12/21400495. Maybe, probably—no, definitely.@k@|@y@v12/21400496. .........Kanon-kun killed Jessica-chan."'
12344: 'Battler@r@v10/20100663."............No, ..................no way........."'
12345: 'Shannon@r@v15/20500688."I, ...I can''t believe it...@k@v15/20500689. For Kanon-kun to do that...@v15/20500690.......to Milady,@v15/20500691. ......that''s too much to accept!!"'
12346: 'George@r@v07/20300522."I feel the same as Shannon.@k@v07/20300523. I oppose labeling Kanon-kun as the culprit."'
12347: 'Rosa@r@v12/21400497."Then is the culprit Gohda-san or is it Kumasawa-san?@k @v12/21400498.Tell me who''s more suspicious."'
12348: '@r@v17/21700162|18/21800100.""I-i-i-it wasn''t us!!""@|@y'
12349: 'Rosa@r@v12/21400499."If it wasn''t Kanon-kun, then who could have locked this door?@k @v12/21400500.Shannon-chan.@k@v12/21400501. George-kun.@k@v12/21400502. ......Well?@k @v12/21400503.Well, well, well...?"'
12350: '@rAuntie Rosa closed in on Shannon-chan and George-aniki, laughing unpleasantly.'
12351: '@r...Of course, they couldn''t say anything back.'
12352: '@rThey wanted to believe in Kanon-kun.@k ...But if they did, they would have to suspect the other servants.'
12353: '@rThe simplest culprit was the mystery guest BEATRICE.@k@r......But she was nothing more than a guest, and didn''t have a master key.'
12354: '@r.........Then if BEATRICE was the culprit without a master key...'
12355: '@r...Do we have to accept the argument that she really is a witch, and locked the door with the power of magic......?'
12356: 'Battler@r@v10/20100664."............That''s a filthy argument...@k@v10/20100665. ......Filthy...... Filthy......"'
12357: 'BEATRICE@r@v27/20701093."What''s so difficult?@k@v27/20701094. Make it my fault.@k@v27/20701095. You can just make it the fault of the 19th person, the mystery guest, can you not?@k@v27/20701096. If you do, you won''t have to watch this ugly battle of humans pressing each other...@k @|@y@v27/20701097.*cackle*cackle*cackle*cackle*!"'
12358: 'Battler@r@v10/20100666."So then what.@k@v10/20100667. The culprit is the 19th person, the guest BEATRICE.@k@v10/20100668. ...She''s a witch, so she could lock the door without a key using magic."'
12359: 'Battler@r@v10/20100669."Are you telling me to accept that?@k @v10/20100670.No goddamn way...!@k @v10/20100671....No way, no goddamn way...!!"'
12360: 'BEATRICE@r@v27/20701098."......*cackle*cackle*cackle*cackle*.@k@v27/20701099. In the last game, I learned all of your weak points.@k@v27/20701100. So, what now, what now...?@k @v27/20701101.You said you''re never going to accept me, did you not?@k @v27/20701102.In that case, .........you can use Kanon as a perfect sacrifice."'
12361: 'BEATRICE@r@v27/20701103."Kanon killed Jessica!@k @v27/20701104.If you support Rosa''s theory, everything is settled here, you know?@k @v27/20701105.Kanon is already dead.@k@v27/20701106. There should be no need to show concern for the dead.@k@v27/20701107. And you won''t have to doubt anyone here!@k @|@y@v27/20701108.*cackle*hahahahahahahahahahaha!"'
12362: 'Battler@r@v10/20100672."Damn it!!@k @v10/20100673.I won''t accept you!!!@k @v10/20100674.But......Kanon-kun being the culprit, ......that''s impossible!!"'
12363: 'Nanjo@r@v19/21900154."..........I don''t want to suspect anyone.@k@v19/21900155. ...However, it is sometimes the case that the suspicious are the guilty.@k@v19/21900156. ......In any case, there is probably nothing better than caution..."'
12364: 'Shannon@r@v15/20500692."Doc-...Doctor Nanjo...@k@v15/20500693. What do you mean by that...?"'
12365: 'Nanjo@r@v19/21900157."...Umm, please do not misunderstand.@k@v19/21900158. ...I do not wish to label Kanon-san as the culprit.@k@v19/21900159. ......However, until we understand the situation, there is the possibility that Kanon-san is the culprit,@k@v19/21900160. and I believe keeping that in mind is safer."'
12366: 'Kumasawa@r@v18/21800101."Ho, ......hoh-hoh-ho...@k@v18/21800101_1. Yes, that''s right... You cannot be too cautious."'
12367: '@rIt didn''t seem as though anyone blamed Nanjo.@k@rIn reality, no one thought that Kanon was the culprit.'
12368: '@r...But if they didn''t suspect him, they would have to suspect one of the servants here.'
12369: '@r......We didn''t want to do that.@k@rWe didn''t want to suspect.@k@rWe didn''t want to be suspected.'
12370: 'Rosa@r@v12/21400504."That is the correct way to think.@k@v12/21400505. ......We cannot be too vigilant.@k@v12/21400506. Is there anyone who objects to that?"'
12371: 'Rosa@r@v12/21400507."Listen.@k @v12/21400508....There is a very high likelihood that this murder case is related to the legend of Father''s gold.@k@v12/21400509. In that case, it''s certainly the crime of someone plotting to keep a vast amount of gold worth tens of billions of yen all for themselves."'
12372: 'Rosa@r@v12/21400510."......With that amount of money, you could play around for the rest of your life in any country.@k@v12/21400511. ...It may be possible that they would massacre us for this reason."'
12373: 'Maria@r@v13/20400405.".............................."'
12374: 'Rosa@r@v12/21400512."For the simple reason that our guest wasn''t holding a master key, for the murder of Jessica-chan, and this murder alone,@k@v12/21400513. we removed our 19th person—BEATRICE—from suspicion.@k@v12/21400514. But we can''t say that she is unrelated to the crime."'
12375: 'Rosa@r@v12/21400515."......After all, it''s a vast amount of gold we''re talking about.@k@v12/21400516. We can''t deny the possibility that there are multiple culprits.@k@v12/21400517. ......Right now, one of the people here among us might have been bought by the culprit!!"'
12376: '@rAs Auntie Rosa yelled, she looked all around, her gun still raised.'
12377: '@r......Don''t believe anyone, suspect the person next to you—that''s what she was saying.'
12378: '@rBut no one wanted to suspect.@k@r...They didn''t want to suspect anyone here.'
12379: '@rThat weakness in their hearts demanded an answer from those not here...'
12380: 'Rosa@r@v12/21400518."There are only two groups of people you can be sure aren''t suspects.@k@v12/21400519. .........Yourself, and those who are already corpses.@k@v12/21400520. .........The same goes for Kanon-kun."'
12381: 'Rosa@r@v12/21400521."Until we catch sight of his corpse, he is the most likely suspect in Jessica-chan''s murder!!@k @v12/21400522.So take care.@k@v12/21400523. Even if he''s still alive, even if he smooths things over with some explanation, you absolutely must not trust him!@k @v12/21400524.Alright?!"'
12382: '@rNo one gave a answer of their own initiative.@k ......However, those who met Auntie Rosa''s eyes had to nod their heads...'
12383: '@rHumans are social beings.@k@r......In other words, from the time they are born, trusting each other is imprinted in their genes.'
12384: '@r...It is unpleasant to go against that.'
12385: '@rThey definitely don''t want to suspect anyone.'
12386: '@r...But if they had to suspect someone,@k ...they thought that choosing one of the people not here right now would be the most acceptable.'
12387: '@rFor just the reason of acceptability, they had passively chosen to sacrifice Kanon.'
12388: '@rThis is ridiculous.........@k@rI definitely don''t want to believe that Kanon-kun is the culprit!'
12389: '@rI''d only just heard it from George-aniki, but not only were those two close in age,@k they also had that adolescent relationship Auntie Rosa had mentioned.'
12390: '@r......It may be a little late now, but yes, they really did have that kind of air about them.'
12391: '@rAfter seeing her parents'' tragic bodies, Jessica, bearing deep wounds in her heart, would only have trusted Kanon-kun.'
12392: '@r...That''s a very conceivable story.@k@rSo I don''t like it...!!'
12393: '@rKanon-kun was the only one she trusted.@k@rSo she wouldn''t have let anyone but Kanon-kun in.'
12394: '@rSo he was the only one who could have killed Jessica. ......I just can''t accept that line of argument......!!!'
12395: 'Rosa@r@v12/21400525."...Understand?!@k @v12/21400526.Even if Kanon-kun appears, don''t get careless!@k @v12/21400527.As long as we cannot prove Kanon-kun''s innocence, we will suppose that Kanon-kun is the culprit who killed Jessica-chan!!"'
12396: '@rAuntie Rosa made that claim.@k By using the ever-so-slightly vague word "suppose", ...ultimately, she gave everyone that last little push they needed.'
12397: '@rEveryone nodded weakly,@w500. ...............and, under the excuse that they were just temporarily supposing it,@w583. .........they concluded that Kanon was the culprit who had killed Jessica...'
12398: '@r.........I wonder what the dead Jessica and Kanon would think if they could hear this exchange.'
12399: '@rJessica...was crying.@k@r......She was crying in the chest of the person who had put his life on the line to fight for her: Kanon.'
12400: '@rIt was frustrating.@k@rSo frustrating that it felt like her chest would explode...'
12401: '@rShe grieved and resented how far the dignity of the dead had been trampled...'
12402: 'Jessica@r@v04/20200613."...Those guys, ...why are they treating you like the culprit?!!"'
12403: 'Kanon@r@v16/20600494."........................Because there''s...no corpse."'
12404: 'Jessica@r@v04/20200614."Why are they treating you like the culprit because there''s no corpse?!@k @v04/20200615.You risked your life to fight for me...!"'
12405: 'Jessica@r@v04/20200616."Then, ......that witch erased your corpse for fun......!@k @v04/20200617.To call you the culprit because of that, it''s horrible, it''s too horrible!!"'
12406: 'Kanon@r@v16/20600495.".........It''s alright.@k@v16/20600496. ......In the end, I couldn''t completely protect you, but...@k@v16/20600497. .........I was able to be of use to you, Milady..."'
12407: 'Jessica@r@v04/20200618."So......why doesn''t everyone understand that?!@k @v04/20200619.Stop it, Auntie Rosa!!@k @v04/20200620.Don''t call Kanon-kun the culprit with that messed up reasoning!!"'
12408: 'Kanon@r@v16/20600498.".........She isn''t saying that I''m the culprit.@k@v16/20600499. ...She''s just saying I''m suspicious,@v16/20600500. ......no,@v16/20600501. ......she''s saying to be careful."'
12409: 'Jessica@r@v04/20200621."She is saying it!!@k @v04/20200622.These people are saying you''re the culprit, Kanon-kun, so they can stop thinking!@k @v04/20200623.They aren''t gonna think about who the culprit who killed me is anymore!!@k @v04/20200624.They aren''t gonna think of the possibility that you aren''t the culprit!!"'
12410: 'Jessica@r@v04/20200625."And after this, every time something happens, they''ll repeat the excuse that it was the work of Kanon-kun who''s gone missing!!@k @v04/20200626.......I can''t stand that!!"'
12411: 'Kanon@r@v16/20600502."...............It''s alright.@k@v16/20600503. ...At least you know the truth, Milady."'
12412: 'Jessica@r@v04/20200627."If only I know the truth, that''s pointless!!@k @v04/20200627_1.I found out by dying.@k@v04/20200627_2. Truth belongs to living humans!!@k @v04/20200627_3.If the truth doesn''t remain, the dead won''t be rewarded!!@k @v04/20200627_4.They won''t know why you risked your life!!"'
12413: 'BEATRICE@r@v27/20701109."*cackle*cackle*cackle*cackle*, hahahahahahahahahahahaha!@k @v27/20701110.Truly a splendid sight.@k@v27/20701111. It is a rare honey that is sweeter than the laments of the dead."'
12414: 'BEATRICE@r@v27/20701112."Lament, lament.@k@v27/20701113. No matter how much you lament, the voices of the dead never reach the living."'
12415: 'Jessica@r@v04/20200628."Damn it, damn iiiiiiit!!"@|@y'
12416: 'Jessica@r@v04/20200629."It doesn''t matter who!!@k @v04/20200630.Hear my voice!!@k @v04/20200631.Kanon-kun isn''t the culprit!!@k @v04/20200632.Kanon-kun''s corpse was just erased!@k @v04/20200633.Why, why don''t you understand that?!!"'
12417: 'Kanon@r@v16/20600504.".........Milady."'
12418: 'Jessica@r@v04/20200634."......I can''t take this!!@k @v04/20200635.It''s so sad!@k @v04/20200636.It''s so frustrating!!"'
12419: 'Jessica@r@v04/20200637."If it''s like this, ......you died for nothing!!@k @v04/20200638.The dead have no honor unless the living acknowledge it!@k @v04/20200639.It doesn''t matter who!@k @v04/20200640.Realize!!@k @v04/20200641.Realize!! Please!!@k @v04/20200642.Kanon-kun isn''t the culprit!!"'
12420: 'Jessica@r@v04/20200643."Aaaaaaaaaaaaaahh, don''t go, don''t go, guys!!@k @v04/20200644.Please, don''t end it like this......!@k @v04/20200645.Don''t go, ......don''t goooooooooooooo!!!"'
12421: '@rRosa proclaimed that this room should be sealed until the police came.'
12422: '@r...The rest didn''t want to suspect each other, so they happily accepted that.'
12423: '@r......They accepted Kanon as the tentative culprit.'
12424: '@r...Without even imagining how much disgrace that gave to the dead, they accepted it.'
12425: 'Kanon@r@v16/20600505."......Milady... It''s alright now...@k@v16/20600506. ......Thank you......"'
12426: 'Jessica@r@v04/20200646."Don''t go!!@k @v04/20200647.Don''t go, guys!!"'
12427: 'Jessica@r@v04/20200648."I beg you, come back!!@k @v04/20200649.Don''t leave us like this!!"'
12428: 'Jessica@r@v04/20200650."Don''t leave......Kanon-kun......treated as the culprit!!!!!!!@k @v04/20200651.Uwaaaaaaaaaaaaaaaaaaahhh...!!"'
12429: 'BEATRICE@r@v27/20701114."It won''t reach!!@k @v27/20701115.The laments of the dead never reach!"'
12430: 'BEATRICE@r@v27/20701116."You make me laugh, yes, that face of yours makes me laugh!!@k @v27/20701117.You''re thinking it will reach, aren''t youuu?@k @v27/20701118.It won''t reach, Jessicaaaaaaa!!!@k @|@y@v27/20701119.*cackle*cackle*cackle*cackle*, wahahahahahahahahahahahahahahahahahahahahahahaha!!"'
12431: 'Battler@r@v10/20100675."That''s no goddamn good."'
12432: 'Rosa@r@v12/21400528."Huh?@k @v12/21400529..........Battler-kun, did you say something?"'
12433: 'Battler@r@v10/20100676."Yeah, this is no good.@k@v10/20100677. ...It''s no goddamn good at all."'
12434: '@rAt the time everyone made to leave the room,@k ...only Battler had his back to them, and he was still looking down at Jessica''s body.'
12435: 'Rosa@r@v12/21400530."What do you mean, ...it''s no good at all?@k @v12/21400531.Do you have some objection...?"'
12436: 'Battler@r@v10/20100678."I''ll at least agree that we have to be vigilant.@k@v10/20100679. ......But this talk about having Kanon-kun be the culprit, sorry, but allow me to refuse."'
12437: 'BEATRICE@r@v27/20701120."......Hoh.@k@v27/20701121. So you''re biting into this part.@k@v27/20701122. If Kanon wasn''t the culprit, and it wasn''t my doing either, then how do you explain this locked room that Jessica''s room has become...?"'
12438: 'Battler@r@v10/20100680.".........Honestly, I''ve gotta throw my hands up there.@k@v10/20100681. ...Seriously, why''d I say it''s no goddamn good?"'
12439: 'Battler@r@v10/20100682."...I''ve gotta take responsibility for my own actions.@k@v10/20100683. Ihihihihi...!@k @|@y@v10/20100684................I''m empty-handed with zero weapons to argue with.@k@|@y@v10/20100685. ...But you know, I won''t stand here twiddling my thumbs anymore!! BEATRICE!!"'
12440: 'Shannon@r@v15/20500694."B-......Battler-sama......"'
12441: 'George@r@v07/20300524."......I-is there some proof that Kanon-kun isn''t the culprit......?"'
12442: '@rThe expression that rose to those two faces was definitely expectant.@k@r......They didn''t want to believe that Kanon was the culprit.@k@rIn truth, they believed in Kanon.'
12443: '@rSo this expectation was because they wanted to be made to believe in him even more strongly!'
12444: 'Rosa@r@v12/21400531_1."Then, Battler-kun, which of the other servants do you suspect?@k @v12/21400531_2.Gohda-san?@k @v12/21400531_3.Or is it Kumasawa-san?"'
12445: 'Battler@r@v10/20100686."Quit it, Auntie Rosa.@k@v10/20100687. ...I know the person called Kumasawa baa-chan well.@k@v10/20100688. ......She''ll sometimes slack off on work, but she''ll always try to make things fun for people.@k@v10/20100689. ......She is not a person who would kill, not even if her eyes were dazzled by money."'
12446: 'Kumasawa@r@v18/21800102_b."B-......Battler-sama........."'
12447: 'Battler@r@v10/20100690."And I''ve just met Gohda-san yesterday.@k@v10/20100691. ......Honestly, I still don''t really understand him.@k@|@y@v10/20100692. ......But there is one thing I understand."'
12448: 'Gohda@r@v17/21700166."........................I, I........."'
12449: 'Battler@r@v10/20100693."......I''ve never seen someone look so happy to be making food.@k@v10/20100694. ...You''re the same.@k@v10/20100695. The same as Kumasawa baa-chan.@k@v10/20100696. ......Gohda-san likes to make people happy."'
12450: 'Battler@r@v10/20100697."As if a person like that could kill those who praised his own food as delicious, ...even if money was piled up in front of him!!"'
12451: 'Rosa@r@v12/21400532."...Then, who do you think killed Jessica-chan, Battler-kun?@k @v12/21400533.Who do you think shut Jessica-chan up in a room that could only be locked by a master key?"'
12452: 'Battler@r@v10/20100698."Wait.@k@v10/20100699. ......Before I argue about that, there''s something I want to make clear.@k@|@y@v10/20100700. I don''t want to talk about, if so-and-so is not the culprit, then so-and-so is the culprit.@k@v10/20100701. ...I just want to talk about how it''s completely impossible for Kanon-kun to be the culprit."'
12453: 'BEATRICE@r@v27/20701123."You say that you can establish that Kanon isn''t the culprit?@k @v27/20701124.*cackle*, how?!"'
12454: 'Battler@r@v10/20100702."It''s really simple.@k@v10/20100703. ...It''s something I came dangerously close to overlooking.@k@v10/20100704. ......Beato!"'
12455: 'Battler@r@v10/20100705."Repetition requested!!@k @v10/20100706.Say it if you can: "Kanon-kun was holding a master key"!!"'
12456: 'BEATRICE@r@v27/20701125."...........................Hoh...!"'
12457: 'Rosa@r@v12/21400534."......Kanon-kun wasn''t holding a master key?!@k @v12/21400535.How can you tell that?!"'
12458: 'Battler@r@v10/20100707."I heard what Gohda-san said before.@k@v10/20100708. Just before he split up with Kanon-kun.@k@v10/20100709. ...The part about when Jessica went to raid the VIP room."'
12459: 'Battler@r@v10/20100710.".........Gohda-san, you did a good job remembering it.@k@v10/20100711. You protected Kanon-kun''s honor."'
12460: 'Gohda@r@v17/21700167."......I,@v17/21700168. ......I...@v17/21700169.did...?!"'
12461: 'George@r@v07/20300525."I heard him talk about the same thing.@k@v07/20300526. But I don''t really understand!@k @v07/20300527.Could you explain it, Battler-kun?!"'
12462: 'Battler@r@v10/20100712."......That''s right.@k@v10/20100713. When Jessica unlocked the VIP room,@k@v10/20100714. she borrowed the key from Kanon-kun, but didn''t give it back!@|@y@k @v10/20100715.So Kanon-kun wasn''t holding a master key!!"'
12463: 'BEATRICE@r@v27/20701126."*cackle*cackle*!@k @v27/20701127.Or was he?"'
12464: 'BEATRICE@r@v27/20701128."Certainly, Gohda has no recollection of the master key being returned to Kanon.@k@v27/20701129. However, she might have returned it when Gohda wasn''t looking!@k @v27/20701130.How can you prove that it definitely didn''t happen?!"'
12465: 'BEATRICE@r@v27/20701131."*cackle*cackle*cackle*, if you could just search the pocket of Kanon''s corpse, you could probably establish that, but you can''t!!@k @v27/20701132.It is impossible to prove!!"'
12466: 'Battler@r@v10/20100716."You''re no goddamn good at all.@k@v10/20100717. It''s truly simple to prove, isn''t it?"'
12467: 'Rosa@r@v12/21400536."......No way...!@k @v12/21400537.So, you''re saying that Kanon-kun wasn''t holding a key?!"'
12468: 'Battler@r@v10/20100718."Yeah.@k@v10/20100719. And to prove it, all you have to do is search Jessica.@k@v10/20100720. ......Kanon-kun''s master key should be in Jessica''s pocket.@k@|@y@v10/20100721. Doctor Nanjo, would you check for us?"'
12469: 'Nanjo@r@v19/21900161."Ye-......yes."'
12470: '@rNanjo dashed up to Jessica, and searched in her jacket pocket......@k@rEveryone...hoped for it.........!'
12471: 'Nanjo@r@v19/21900162."......mgh..."'
12472: '@r...Please.@k Be there............!!'
12473: 'Nanjo@r@v19/21900163."......Here it is!@k @v19/21900164.Is this it?"'
12474: 'Genji@r@v14/21600104."...............Yes.@k@v14/21600105. That is a master key.@k@v14/21600106. Without a doubt."'
12475: '@rAt Genji''s statement, there was a small "oooh" of joyful voices.'
12476: 'Battler@r@v10/20100722."That is Kanon-kun''s master key.@k@v10/20100723. .........I''ll say it again."'
12477: 'Battler@r@v10/20100724."''Kanon-kun isn''t holding a master key''.@k@v10/20100725. Therefore, there''s no way he could have locked the door!!"'
12478: 'Rosa@r@v12/21400538."......It certainly does...appear that way.@k@|@y@v12/21400539. ......But Kanon-kun was the last person to meet Jessica-chan.@k@v12/21400540. The fact that he''s suspicious hasn''t changed."'
12479: 'Battler@r@v10/20100726."Let''s......give that a rest."'
12480: 'Rosa@r@v12/21400541."......Huh?"'
12481: 'Battler@r@v10/20100727."Humans were originally supposed to be creatures that trust each other.@k@v10/20100728. ...But in order to live in a tough world, we learn to be wary.@k@v10/20100729. ...So we''ll doubt anything.@k@v10/20100730. We are sad creatures.@k@v10/20100731. ...I won''t deny that''s our nature."'
12482: 'Battler@r@v10/20100732."...............But I won''t permit you to come to a conclusion without proof!!@k @v10/20100733.The suspicious are not the guilty, they are the innocent!!@k @v10/20100734.Of course, the world is full of wolves.@k@v10/20100735. I won''t tell you to carelessly believe everyone!"'
12483: 'Battler@r@v10/20100736."But if you''re going to say someone''s guilty, prepare some perfect evidence!@k @v10/20100737.Unless you can do that, never say someone is guilty because of speculation!!!"'
12484: 'Rosa@r@v12/21400542."...............u......@k@v12/21400543. That''s........."'
12485: 'Nanjo@r@v19/21900165."......I was the one who said the suspicious were the guilty.@k@v19/21900166. .........That was thoughtless.@k@v19/21900167. I apologize."'
12486: 'Shannon@r@v15/20500695."............Battler-sama........."'
12487: 'George@r@v07/20300528."...W-wonderful reasoning, Battler-kun!@k @v07/20300529.Thank you too, Gohda-san.@k@v07/20300530. Because of what you remembered, Kanon-kun is cleared from suspicion!"'
12488: 'Gohda@r@v17/21700170."N-no, I... Hahahaha..."'
12489: '@rClap clap clap...@k ...It was the dry sound of the witch''s applause.'
12490: 'BEATRICE@r@v27/20701133."Well done, well done.@k@v27/20701134. ......Not a bad job."'
12491: 'Battler@r@v10/20100738.".........Shit.@k@v10/20100739. Did I just fall for a blatant bait piece...?"'
12492: 'BEATRICE@r@v27/20701135."You wonderfully proved that at least Kanon couldn''t lock the door to this room.@k@v27/20701136. The servants should all have been holding master keys.@k@v27/20701137. With that as a basis, Kanon was treated as the culprit, so you did a wonderful job of at least clearing away that suspicion.@k@v27/20701138. *cackle*cackle*cackle*."'
12493: 'Battler@r@v10/20100740."......In that case.@k@v10/20100741. ...How did the culprit who killed Jessica lock the door?@k@v10/20100742. So that''s the problem I have now."'
12494: 'Battler@r@v10/20100743."Tch.@k@v10/20100744. ......I''ve been drawn into a development that went exactly like you wanted..."'
12495: 'BEATRICE@r@v27/20701139."Right into my trap, yes...?@k @v27/20701140.Furthermore, you said something outrageous about not doubting any of the other servants.@k@v27/20701141. Wellll then, it''ll be worth seeing how you gloss this over..."'
12496: 'Battler@r@v10/20100745."Shut your face.@k@v10/20100746. ...Let''s get this started.@k@v10/20100747. I''m sure I''ll be denied from all angles, ...but first I''ll verify the definition of what it means for this room to be a locked room."'
12497: 'BEATRICE@r@v27/20701142."Very well.@k@v27/20701143. First, @|@y@c900.@[there are absolutely no types of hidden doors.@]@c.@k @v27/20701144.@|@y@c900.@[This door is the only way in or out.@]@c.@k @v27/20701145.@|@y@c900.@[The only way to lock this door is with Jessica''s single key or the master keys, only one of which is held by each servant.@]@c."'
12498: 'BEATRICE@r@v27/20701146."It is on the second floor, but it is probably possible to enter or leave through the window.@k@v27/20701147. However, @|@y@c900.@[the window is locked from the inside.@]@c."'
12499: 'Battler@r@v10/20100748."......Let me flip over the chessboard right away.@k@v10/20100749. ...If I start by arguing about the door and the lock, I probably won''t leave the palm of your hand."'
12500: 'BEATRICE@r@v27/20701148."Do as you like.@k@v27/20701149. Well then, well then, what should I repeat?"'
12501: 'Battler@r@v10/20100750.".........Repetition requested.@k@v10/20100751. "Kanon-kun was killed in this room"."'
12502: 'BEATRICE@r@v27/20701150."Mmhm.@k @v27/20701151.@|@y@c900.@[Kanon was killed in this room.@]@c.@k@|@y@v27/20701152. Although I erased his corpse with magic, of course?@k @v27/20701153.*cackle*cackle*cackle*!"'
12503: 'Battler@r@v10/20100752."And again, repetition requested.@k@v10/20100753. "Kanon-kun''s corpse is in this room"."'
12504: 'BEATRICE@r@v27/20701154."*cackle*cackle*cackle*cackle*!@k @v27/20701155.I decline.@k@v27/20701156. I cannot repeat it.@k@v27/20701157. ...Because I erased the corpse with magic.@k@v27/20701158. *giggle*giggle*giggle*!"'
12505: 'Battler@r@v10/20100754."Of course you wouldn''t.@k@v10/20100755. ......There''s got to be a secret hidden in there somewhere."'
12506: 'Battler@r@v10/20100756." ......Damn, where''s the point of contention to this riddle?@k@v10/20100757. .........Is it that they locked it without a master key?@k @v10/20100758.Or is it how they managed to kill two people who were inside a room with the door locked?@k @v10/20100759.Or is it how they managed to escape after killing them both?"'
12507: 'Battler@r@v10/20100760."......I hate to say it, but I''ll have to tackle this one step at a time.@k@v10/20100761. ...Repetition requested.@k@v10/20100762. ......''The last time it was locked was by a master key''."'
12508: 'BEATRICE@r@v27/20701159."I also decline that.@k@v27/20701160. *cackle*cackle*."'
12509: 'Battler@r@v10/20100763."......This declining thing is really vague.@k@v10/20100764. I don''t know if you decline because it''s impossible to repeat, or whether you can repeat it and you''re declining on purpose..."'
12510: 'BEATRICE@r@v27/20701161."Back when discussing the lock to the chapel, you completely turned the tables on me.@k@v27/20701162. When I have an advantage, there''s no need to go out of my way to speak using the red, which carries risk.@k@v27/20701163. That''s all it is."'
12511: 'Battler@r@v10/20100765.".........Yeah, I guess so.@k@v10/20100766. ...At its heart, the red is something you use when you want to stop my strange theories."'
12512: 'BEATRICE@r@v27/20701164."It is natural that I would use it to my advantage.@k@v27/20701165. Because of the risk of it being quibbled with, I won''t use it uselessly."'
12513: 'BEATRICE@r@v27/20701166."...*cackle*cackle*.@k@v27/20701167. Well then, what move will you come at me with next?@k @v27/20701168.A move that puts Gohda or Kumasawa under suspicion would probably be the easiest to use, right...?"'
12514: 'Battler@r@v10/20100767."......Damn.@k@v10/20100768. It''s like you''re leading me down a path, goddamn annoying...@k@v10/20100769. Stay quiet a while, I''m thinking...!"'
12515: 'BEATRICE@r@v27/20701169."Of course, this door is the same as the chapel.@k @v27/20701170.@|@y@c900.@[When locked, it does not permit any form of entry or exit.@]@c."'
12516: 'BEATRICE@r@v27/20701171."I''ll say more. @c900.@[No trick could have the effect of locking the door from the outside without using a key.@]@c.@k@v27/20701172. *cackle*cackle*...!"'
12517: 'Battler@r@v10/20100770."Tch.@k@v10/20100771. Damn you for always using red when I don''t ask for it..."'
12518: '@r............Let''s back up.@k ...Let me just think.@k@rI''ll lay out everything I know.'
12519: '@rFirst, there are two victims.'
12520: '@rJessica and Kanon-kun.'
12521: '@r...Kanon-kun''s corpse isn''t here, but BEATRICE admitted in red that Kanon-kun was killed.'
12522: '@rSo even without a corpse, he''s included as a victim.'
12523: '@rThere are a few questionable points.@k And depending on which I focus on, my line of thought changes a lot.'
12524: '@rFirst, after the culprit committed murder in this room, how did they lock it?'
12525: '@rIf we assume that the culprit was one of those holding a master key, it''s extremely simple.'
12526: '@r......But I want to avoid that if I can.'
12527: '@rBecause I would have to suspect Gohda-san or Kumasawa-san—no, in the worst case, even Shannon-chan and Genji-san.'
12528: '@rAt this point, I noticed something.'
12529: '@r......I''m contradicting myself.@k@rI''m cutting my own throat.'
12530: '@rI want to deny BEATRICE no matter what.@k@rI want to erase the existence of that brutal, fickle, ridiculous witch!'
12531: '@rIn order to do that, I have to explain everything with humans, not magic.'
12532: '@r......But that also means suspecting some human.'
12533: '@rI don''t want to suspect someone.'
12534: '@r......Of course, if there was some clear proof, I would have to believe that person was the culprit,@k ...but as long as that didn''t happen, I didn''t want to cast any suspicions.'
12535: '@rAm I just green...?@k@rAm I just a kid who doesn''t want to have my feelings, which tell me that at least this person or that person couldn''t be a murderer, betrayed...?'
12536: '@rI want to deny that it was a witch; I also want to deny that it was a human.@k@r.........Now I don''t know what is what anymore...'
12537: 'BEATRICE@r@v27/20701173."*cackle*cackle*!@k @v27/20701174.In the first place, the only victory condition in our game regarded whether or not you could deny my existence.@k@v27/20701175. ...Even though that alone was a game that put you at a disadvantage, you''ve increased the number of victory conditions all by yourself, and made your own victory difficult...!"'
12538: '@r......It''s just as she says.@k ...If I started arguing that someone holding a master key was the culprit, this locked room could be easily broken.'
12539: '@r......However, since the number of keys that could open this door are limited,@k and furthermore it''s clearly known who holds them,@k saying that would mean that I was suspecting someone I knew well...'
12540: '@r...No, ......have I just been averting my eyes?'
12541: '@rIn that locked room trick with the chapel, which had been exhilarating to destroy,@k I had proposed that "someone stole the key from Maria''s handbag, and returned it".@k If that theory was right, then the question becomes who could have stolen the key from her handbag.'
12542: '@r...Maria''s handbag had probably been at its most unguarded when she was sleeping.'
12543: '@r......In that case,@w500. .........in addition to me,@w583. ...George-aniki and Jessica are also suspects.'
12544: '@rGeorge-aniki or Jessica was the culprit?@k@rOr maybe an accomplice?!'
12545: '@r......All of our parents had been killed, right?!@k@rAnd yet, ......and yet, one of us consented to that and assisted with the crime?!'
12546: '@rWe had lamented, mourned, and shed tears in the chapel.@k@r...And yet, one among us......had been lying?!'
12547: 'BEATRICE@r@v27/20701176."......*cackle*cackle*.@k@v27/20701177. That theory of yours about taking the key out of the handbag and putting it back cast a pronounced suspicion on the cousins, did it not...?"'
12548: 'BEATRICE@r@v27/20701178."Quite impressive—in spite of that, you managed to act like you didn''t notice,@k@v27/20701179. and spoke your theory with such gusto...!@k @v27/20701180.*giggle*giggle*giggle*."'
12549: 'Battler@r@v10/20100772."D-............damn it...@k@v10/20100773. That doesn''t guarantee that one of the family or the servants is the culprit!@k @v10/20100774.If you snuck up on us hiding in a cardboard box, for example,@k@v10/20100775. there''s a good chance you could have slunk into our room when we were fast asleep and stolen the key, right?!"'
12550: 'BEATRICE@r@v27/20701181."Mmm.@k@v27/20701182. That would also be acceptable in that instance.@k@v27/20701183. By suspecting me as the guest, the 19th person, you won''t have to suspect them."'
12551: 'BEATRICE@r@v27/20701184.".........But then, what will you do about the lock to Jessica''s room?@k @v27/20701185.It''s no trouble at all for me to open the lock with magic, but of course, I don''t have a master key.@k@v27/20701186. If you deny my magic, you also have to deny that I''m a suspect, you realize...?"'
12552: 'BEATRICE@r@v27/20701187."And what that entails is suspecting one of you 18...!!"'
12553: 'Battler@r@v10/20100776."Tha-......thanks for the lovely explanation.@k@v10/20100777. ...I''ve been able to sort things out a bit."'
12554: 'Battler@r@v10/20100778."......My goal is to pursue how the 19th person, the Human guest BEATRICE, committed the crimes.@k@v10/20100779. If I do that, I won''t have to suspect anyone!!"'
12555: 'BEATRICE@r@v27/20701188."*cackle*cackle*!@k @v27/20701189.If you can do that, yes...!@k @v27/20701190.Foolish man.@k@v27/20701191. ......A room like this never needed to be a locked room at all.@k@v27/20701192. After all, there are a total of six keys that can open it."'
12556: 'BEATRICE@r@v27/20701193."And there were several who possessed those keys!@k @v27/20701194.You can suspect any of them!@k @v27/20701195.Suspect as much as you like!!@k @v27/20701196.But you went to all the trouble of denying all of those, and made it a locked room yourself."'
12557: 'BEATRICE@r@v27/20701197.".........Understand?@k @v27/20701198.This is a locked room born from your mental contradiction.@k@v27/20701199. *cackle*cackle*!@k @v27/20701200.There''s no one else, you closed that door yourself."'
12558: 'Battler@r@v10/20100780."......So accept that a witch opened it with magic,@k@v10/20100781. ...or accept that someone I know is the culprit—those are my only two options, you''re saying.@k@v10/20100782. Damn, are you trying to fork the rook?!"'
12559: 'BEATRICE@r@v27/20701201."I merely wanted to show you that this move also exists."'
12560: 'BEATRICE@r@v27/20701202."......*cackle*.@k@v27/20701203. So, what will you do, Ushiromiya Battleeeeeeer?@k @v27/20701204.Isn''t it a truly simple problemmm...?@k @v27/20701205.You just have to make sacrifices of that overly self-confident cook and that hag who should have died yeeears ago.@k@|@y@v27/20701206. *cackle*cackle*cackle*cackle*cackle*!!"'
12561: 'Battler@r@v10/20100783."...............Damn it!!@|@y@k @v10/20100784.So if I suspect Gohda-san and Kumasawa-san, everything''s fine?!@k@v10/20100785. That''s no good!"@|@y'
12562: 'Battler@r@v10/20100786.".........I can''t think of Gohda-san as the culprit!@k @v10/20100787.I can''t think of Kumasawa-san as the culprit!!@k @v10/20100788.But I won''t accept you!!@k @v10/20100789.Ever!!"'
12563: 'BEATRICE@r@v27/20701207."In that case, they would have to enter the room without using magic or a master key,@k@v27/20701208. kill Jessica and Kanon, and even erase Kanon''s corpse without using magic."'
12564: 'BEATRICE@r@v27/20701209."......How could it be done?!@k @v27/20701210.How could it be done so that you can deny me and not suspect anyone at the same time?!!@k @|@y@v27/20701211.*cackle*cackle*cackle*cackle*cackle*!"'
12565: 'Battler@r@v10/20100790."............<Resign>."'
12566: 'George@r@v07/20300531."Huh?@k @v07/20300532.Battler-kun, what did you say?"'
12567: 'Battler@r@v10/20100791."......I give up.@k@v10/20100792. I was able to prove that Kanon-kun couldn''t have locked this door.@k@v10/20100793. ......But that doesn''t mean I was able to figure out who killed Jessica."'
12568: 'Shannon@r@v15/20500696."N-......no, ...that''s more than enough...@k@v15/20500697. Umm, ......for doing all that for Kanon-kun,@v15/20500698. ...thank you very much...!"'
12569: 'Battler@r@v10/20100794."......I don''t want thanks.@k@v10/20100795. After all, ......that means that you''re under suspicion too."'
12570: 'Shannon@r@v15/20500699."....................."'
12571: 'Battler@r@v10/20100796."...And sorry, Auntie Rosa.@k@v10/20100797. ......It''s not like I wanted to be defiant towards you.@k@v10/20100798. I don''t want to die either, and I want to find Dad and the rest''s true killer.@k@v10/20100799. ......Sorry for saying something that wasn''t cooperative."'
12572: 'Rosa@r@v12/21400544."......No, it''s alright.@k@v12/21400545. I was also a little rash.@k@v12/21400546. Let''s make up.@k@v12/21400547. As auntie and nephew, we have to be friendly with each other.@k@v12/21400548. ............Right?"'
12573: '@rAuntie Rosa shifted the gun to one hand, and held out her other hand.'
12574: '@r...I reached out, and for the time being, we shook hands.'
12575: '@rAuntie''s gaze was sharp.@k@r......In order to deny the witch, she would make anyone a sacrifice.@k@r...That''s what her eyes told me.'
12576: '@rAnd me...?@k@rI denied the witch.@k@r......But I wasn''t prepared to lose anything.'
12577: '@rI was probably the one who thought himself most ready to fight, ......and the one standing furthest from the truth.'