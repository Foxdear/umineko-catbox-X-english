12578: '@rWith Jessica''s death, it became certain that the culprit was hiding somewhere nearby, and that they would come after our lives if they had a chance.'
12579: '@rAccording to Genji-san, when tomorrow morning comes, the boat should arrive.'
12580: '@rThe boat has a radio, too.@k@rWe''ll probably be able to contact the police immediately with that.'
12581: '@rWe all gathered in the parlor, and decided to wait quietly until tomorrow.'
12582: '@rI proposed that we should search throughout the mansion for clues about the culprit,@k but Auntie Rosa rejected that, saying that if we put pressure on the culprit, or provoked them,@k it might lead to a third murder.'
12583: '@r...That was probably the right thing to do.@k@rEven if a bunch of amateurs like us investigated, there''s no way we''d find anything.'
12584: '@rIt would be wisest to focus on protecting ourselves without doing anything unnecessary, and leave it to the police after tomorrow.'
12585: '@rWe had been tense in the beginning, but other than Auntie Rosa,@k most of us had spent all morning watching TV and were getting bored, so our sense of danger had grown much less intense.'
12586: '@rWhen we thought about it, even though there certainly had been six adults killed at once in the first murder,@k that made us imagine that some back-handed method like poison had been used.'
12587: '@rAnd in the second murder, it was thought that those two had become sacrifices because they were unfortunately isolated from the rest of us.'
12588: '@rFrom this, we imagined that there weren''t a great number of culprits,@k and they didn''t have the ability to kill this large group gathered in the parlor all at once.'
12589: '@rRight now, in this parlor, there was George-aniki and me,@k Maria,@k Auntie Rosa,@k Genji-san, Gohda-san, Shannon-san, Kumasawa-san, ......and finally Doctor Nanjo—a total of nine people were here.'
12590: '@rFurthermore, Auntie Rosa was even armed with a gun.'
12591: '@rSurely, with this many people staying in this room, they wouldn''t be able to touch us easily.'
12592: '@rThat feeling of security, along with the passage of time, allowed us to recover from the shock of that morning bit by bit...'
12593: '@rIncidentally, lunchtime had just ended for us.@k@rHowever, it had been a canned-food lunch, a far cry from last night''s dinner which Gohda-san had skillfully made for us.'
12594: '@r...Auntie Rosa too had suspected that poison had been used in the murder of those six people.'
12595: '@r...So, we probably couldn''t deny the possibility that the culprit had snuck into the kitchen during all that confusion in the morning, and mixed poison in with the ingredients there.'
12596: '@r......Auntie Rosa had ordered all of us not to put anything into our mouths except safe foods like canned food, until the police came.'
12597: '@rAs a cook, Gohda-san must have felt very let down.'
12598: '@rAs though he wanted to display his skill anyway, he said that he at least wanted to bring the plates and pile them up with canned food.'
12599: '@rAt first, Auntie Rosa had been reluctant, examining each one of the plates that were brought, but she hadn''t been able to find anything to complain about,@k and Gohda-san''s "Chef''s Pick Canned Food Combo Lunch" had become a reality.'
12600: '@rGohda-san had said something about taste being savored not just with the tongue, but with the eyes too.'
12601: '@r...I found myself agreeing—it had been the same canned food we ate for breakfast, but it felt like something completely different...'
12602: 'Maria@r@v13/20400406."Uu, Battler.@k@v13/20400407. Look, look.@k@v13/20400408. Here, "Wolves and Sheep Puzzle".@k@v13/20400409. Uu."'
12603: '@rAs I was sitting lazily on a sofa, with no desire to watch TV,@k Maria came over, pulled a picture book out of her handbag, and held it out to me as she said that.'
12604: 'Battler@r@v10/20100800."......What is that book?@k@|@y@v10/20100801. "Wolves and Sheep Puzzle"?@k @v10/20100802...................Let''s have a look-see."'
12605: '@r"Wolves and Sheep Puzzle".@k@rIt was a phrase that Auntie Rosa had said this morning when we had gone to call on Jessica.'
12606: '@r...At the time, I hadn''t known what it meant, and then after that, there was the uproar when Jessica''s body was found, so I''d forgotten about it completely.'
12607: '@rThe book that Maria held out to me looked like a foreign picture book or something that had been translated.'
12608: '@rOpening it, I could tell that the book contained an assortment of puzzles.'
12609: 'Maria@r@v13/20400410."Uu.@k@v13/20400411. So there''s several wolves and sheep, okay?@k @v13/20400412.And the puzzle is to take them to the other side using one boat."'
12610: 'Battler@r@v10/20100803."......Hmmmm?@k @v10/20100804.I''ve heard of a game with rules like this.@k@v10/20100805. So this is that, but with wolves and sheep?"'
12611: '@rIt was a very simple puzzle, passed on from long ago.@k@rLet''s try one of the problems.'
12612: '@rOn the right bank, there are two wolves and two sheep.@k@rThere is a boat that as many as two animals can ride on, and using it, you have to move all four of them to the opposite left bank.'
12613: '@rThere are two rules.'
12614: '@rThe first is regarding the boat.@k@rIt can be paddled by wolves or sheep, and even just by one animal on its own.@k@rBut it can only hold up to two.'
12615: '@rThe second is regarding the wolves.@k@rWhen they are greater in number than the sheep in that location, they attack the sheep and it''s game over.'
12616: '@rFor example, at the start of the game:@k@rBoth sheep ride the boat, and go to the other side.@k@rThen one sheep gets off, and the other goes back to the first bank.'
12617: '@r......When it does, there are two wolves on the first bank.@k@rAnd a single sheep returns there.'
12618: '@rWhen that happens, there are more wolves, so the sheep is attacked and it''s game over.'
12619: '@rOn either bank or even the boat, there must not be more wolves than sheep.'
12620: '@rIt''s a puzzle about how to shuttle them across in the boat under these conditions.'
12621: '@rBy the way, the right answer is: On the first turn, move both wolves to the opposite bank.@k@rThen one wolf comes back.'
12622: '@rOn the second turn, move two sheep to the opposite bank.@k@rThen one wolf comes back.'
12623: '@rThen on the third turn, put that last wolf that was on the right bank on the boat and cross to the opposite bank, and congratulations, transport successful.'
12624: '@rPartway, there may be the same number of wolves and sheep in the boat or on either side, but that isn''t a problem.'
12625: '@rYou only lose when the number of wolves is greater.'
12626: '@rThis book symbolizes it using wolves and sheep, but there are probably lots of people who know this same game with a different symbolism...'
12627: '@rIt looked like Maria wanted to test whether I too could solve the puzzles she knew how to solve,@k and she kept showing me different pages, saying "solve this one" and "this one''s hard".'
12628: '@rWhat had been happening when Auntie Rosa had said the name of this puzzle...'
12629: '@rThat''s right.'
12630: '@r...When we''d decided to go call Jessica, we had been talking about how many men should go,@k and Auntie Rosa mentioned the "Wolves and Sheep Puzzle", and said that we should all go together......'
12631: 'Battler@r@v10/20100806.".................................Wait a sec..."'
12632: '@rThat could only mean one thing.@k ...Auntie Rosa was saying that there are "wolves" among us.'
12633: '@rAnd when the number of wolves and sheep is balanced, we''re safe, but when a situation comes up where that isn''t the case, the wolves will bear their fangs—is that what she''s thinking......?'
12634: '@rAt the time we had found our parents'' corpses, Auntie Rosa was already suspecting that the servants might be "wolves".'
12635: '@rWhile she didn''t know whether it was all of them or just some, she had sniffed out the possibility that "wolves" were hiding among them.'
12636: '@r......Well, yeah.'
12637: '@rThat murder scene was pretty damn elaborate.@k@rIt''s easy to imagine that there were multiple culprits.'
12638: '@rAnd considering that she had that idea already in mind when we went to Jessica''s room,@k where Jessica had been alone with a servant, Kanon, and had been killed,@k .........it isn''t hard to imagine why Auntie Rosa had suspected the servants so persistently...'
12639: 'Rosa@r@v12/21400549."All you servants.@k@v12/21400550. Gohda-san is going to the kitchen to wash the dishes.@k@v12/21400551. Just in case, would you please all go with him?"'
12640: 'Gohda@r@v17/21700171."My apologies, everyone.@k@v17/21700172. Let us go as a group."'
12641: 'Genji@r@v14/21600107."......Shannon, Kumasawa.@k@v14/21600108. Let''s go."'
12642: 'Kumasawa@r@v18/21800103."Yes, yes, coming.@k@v18/21800104. Hoh-hoh-ho."'
12643: 'Shannon@r@v15/20500700."Well then, George-san, excuse me for now."'
12644: 'George@r@v07/20300533."Okay.@k@v07/20300534. .........Take care.@k@|@y@v07/20300535. Ah, Auntie Rosa, could I go as well?"'
12645: 'Rosa@r@v12/21400552."I''m sorry, would you remain here, George-kun?@k@v12/21400553. There''s something I want to talk to you about."'
12646: 'George@r@v07/20300536."......Is that so?@k @|@y@v07/20300537.Sorry, Shannon.@k@v07/20300538. Anyway, take care.@k@v07/20300539. ...Don''t be alone."'
12647: 'Shannon@r@v15/20500701."...Yes..."'
12648: 'Rosa@r@v12/21400554."Excuse me, Doctor Nanjo.@k@v12/21400555. ......I wanted to consult with you about something."'
12649: 'Nanjo@r@v19/21900168."Yes, ......what might that be?@k @v19/21900169........................."'
12650: '@rThe servants put the dishes and empty cans on the serving cart and started to head out into the corridor.'
12651: '@rBehind them, Auntie Rosa was talking to Doctor Nanjo about something in a small voice.'
12652: 'Nanjo@r@v19/21900170."...Alright.@k@v19/21900171. I will go."'
12653: 'Rosa@r@v12/21400556."Yes, if you wouldn''t mind."'
12654: '@rDoctor Nanjo closed the book he had been reading, stood from the sofa, and followed after the servants...'
12655: '@rAuntie Rosa stuck her head out into the hallway, and after watching them leave completely, she closed the door, and spoke.'
12656: 'Rosa@r@v12/21400557."Listen, everyone.@k@v12/21400558. Now everyone here is an Ushiromiya."'
12657: 'George@r@v07/20300540."......Hmm?@k @v07/20300541.Yes, that is true..."'
12658: 'Battler@r@v10/20100807."So you''re saying that you''ve chased out all of the "wolves"?@k@v10/20100808. ......Auntie Rosa."'
12659: '@rWith that one sentence, Auntie Rosa''s gaze grew sharp.@k@r...Apparently she had picked up on my sardonic tone.'
12660: '@r......Auntie Rosa laughed lightly.'
12661: 'Rosa@r@v12/21400559."...Your mind sure works fast, Battler-kun.@k@|@y@v12/21400560. I like clever kids.@k@v12/21400561. It means there''s less to explain."'
12662: 'Maria@r@v13/20400413."Uu.@k@v13/20400414. Battler, smart...?@k @|@y@v13/20400415.Can you solve this?@k @v13/20400416.Hard one on page 64.@k@v13/20400417. Uu!"'
12663: 'Rosa@r@v12/21400562."Maria, sit there watching TV for a while.@k@v12/21400563. Mama wants to talk with Battler-kun and George-kun."'
12664: 'Maria@r@v13/20400418."..................Uu."'
12665: 'George@r@v07/20300542."Auntie Rosa.@k@v07/20300543. ...I heard about the puzzle from Battler-kun.@k@v07/20300544. ...I don''t think it''s bad to be very careful, but I think being too suspicious isn''t good either."'
12666: 'Rosa@r@v12/21400564."Whether the real culprit is BEATRICE or not,@k@v12/21400565. I think there is reason for us to suspect that the servants are in league with her."'
12667: 'Rosa@r@v12/21400566."......In the first murder, where Nii-san and the others were killed,@k@v12/21400567. they''d been given a very brutal treatment, right?@k @v12/21400568.Did that look like something that could be done alone?"'
12668: 'Battler@r@v10/20100809."............Maybe our mystery guest BEATRICE-sama worked all night and did it all."'
12669: 'Rosa@r@v12/21400569."And the incident with the master keys involving the door to Jessica''s room?@k @v12/21400570.Isn''t that proof that one of the servants was involved?"'
12670: 'Battler@r@v10/20100810."......nn.................."'
12671: '@rOnly a master key could have locked the door to Jessica''s room.@k@r...In that case, we can only suppose that one of the servants locked it......'
12672: '@r.........No,@w500. ......wait.'
12673: 'Battler@r@v10/20100811."Flip over the chessboard.@k@v10/20100812. ......That''s strange, Auntie Rosa."'
12674: 'Battler@r@v10/20100813."After killing Jessica, why did the culprit go to all the trouble of locking the door?@k @v10/20100814.It was inevitable that the owners of the master keys were gonna be suspected if they did that.@k@v10/20100815. ......There was no need to deliberately lock the door."'
12675: 'George@r@v07/20300545."...Tha-that''s right.@k@v07/20300546. It''s just as Battler-kun says!@k @v07/20300547.They have no reason to deliberately go and do something that makes themselves suspicious."'
12676: 'Rosa@r@v12/21400571."Yes.@k@v12/21400572. That''s an interesting thought.@k@v12/21400573. Of course, I also thought that."'
12677: 'Rosa@r@v12/21400574."......If that''s so, then the person who locked it wanted to cast suspicion on the servants, and locked that door without a master key.@k@v12/21400575. But that''s impossible.@k@v12/21400576. Right?"'
12678: '@r......That''s right.@k If there was a trick that could lock the door without a master key, this would be a good disguise aimed at casting doubt on the servants.'
12679: '@r...If the culprit wanted to isolate us and attack us one by one, this trick was a very effective one that could even give rise to paranoia.'
12680: '@rHowever, there was no way to lock that door without using a master key...'
12681: 'Rosa@r@v12/21400577."How can you make the claim that there''s no way to lock the door without using a master key?@k @v12/21400578.Isn''t that a Devil''s Proof, like Rudolf nii-san was talking about?@k @v12/21400579.Maybe it was locked by a method we can''t think of."'
12682: 'Rosa@r@v12/21400580."Even if we can''t think of it, that doesn''t disprove that there was some unknown trick."'
12683: 'Battler@r@v10/20100816."............Well, sure, but...@k@v10/20100817. So is that it?@k@v10/20100818. The suspicious ones are guilty...?"'
12684: 'Rosa@r@v12/21400581."I don''t know the practical details of the trick, but I have a general idea.@k@v12/21400582. My apologies, but if we suppose that Kanon-kun was the culprit, it can be explained extremely easily.@k@v12/21400583. Even as to why there was no corpse."'
12685: 'George@r@v07/20300548."Huh......@k@v07/20300549. But Kanon-kun wasn''t holding a master key, right?!@k @|@y@v07/20300550.Putting aside the other servants, at least Kanon-kun shouldn''t have been able to lock the door!"'
12686: 'Battler@r@v10/20100819."......I see.@k@v10/20100820. ...So that''s why you told us to search in the closet and everywhere else right after we entered Jessica''s room.@k@v10/20100821. ......Auntie Rosa, ...your mind works faster than I could imagine judging by your normal appearance."'
12687: 'Rosa@r@v12/21400584."The brain speed of a little sister is always the big sister''s minus 1.@k@v12/21400585. ...I feel glad that there''s no one I need to worry about now."'
12688: '@rGeorge-aniki realized that she was referring to Auntie Eva,@k and seemed a little disturbed about how he should take that nasty remark...'
12689: 'George@r@v07/20300551."......I, I''m sorry.@k@v07/20300552. Could you explain it so that even I can understand?"'
12690: 'George@r@v07/20300553."Kanon-kun''s master key was in Jessica-chan''s pocket, closed up inside a locked room.@k@v07/20300554. After the door was locked, it should have been impossible for him to pull a stunt like putting it in her pocket from outside the room...!"'
12691: 'Battler@r@v10/20100822."That''s not it, Aniki.@k@v10/20100823. ......If it was done in the way Auntie Rosa imagines, ......this trick could only be used by Kanon-kun."'
12692: 'Battler@r@v10/20100824."...And, the door could be locked without a key, while the master key was still in Jessica''s pocket.@k@v10/20100825. ......And, as a result, his corpse would also disappear."'
12693: 'George@r@v07/20300555."H-......how?!@k @v07/20300556.How would he lock the door without a key?!"'
12694: 'Rosa@r@v12/21400586."It''s simple.@k@v12/21400587. George-kun, when you return home, you lock the door, right?@k @v12/21400588.You twist the knob, click, right?"'
12695: 'George@r@v07/20300557."Huh...?!@k @v07/20300558..........C-@v07/20300559....could it be...@v07/20300560. ......No, but...@v07/20300561....Kanon-kun wasn''t anywhere......"'
12696: 'Battler@r@v10/20100826."...It looks like you''ve got it, Aniki.@k@v10/20100827. .........That''s what Auntie Rosa was searching inside the room for."'
12697: 'Battler@r@v10/20100828."......She was searching for Kanon-kun, who had locked the door from the inside, stuck the key in Jessica''s pocket,@k@v10/20100829. and was hiding somewhere, waiting for us to go away."'
12698: '@rThe simplest locked-room trick.@k ...In other words, to hide inside the locked room after committing the murder.'
12699: '@r...And if he could get out after those who discovered the body left, it would create a perfect locked-room murder......'
12700: 'Rosa@r@v12/21400589."We searched that room, but we couldn''t find anything.@k@v12/21400590. ...But, that doesn''t mean we can rule out something like a secret hidden passage in that room that only the servants know about."'
12701: 'Rosa@r@v12/21400591."I don''t know where that might be hidden,@k@v12/21400592. but if we assume that there was a hidden passage, we can say for certain that it was impossible for anyone except him."'
12702: 'Battler@r@v10/20100830."..................You know, that line of reasoning,@k@v10/20100831. ...it was the first thing I thought of, too.@k@v10/20100832. ......It''s the reasoning I hate the most, so I wanted to destroy it in the very beginning..."'
12703: 'BEATRICE@r@v27/20701212."*cackle*cackle*...@k @v27/20701213.@|@y@c900.@[Kanon was killed in this room@]@c., yes?"'
12704: 'BEATRICE@r@v27/20701214."Because you seemed to suspect Kanon as the culprit, you made me repeat this to destroy that possibility right away.@k@v27/20701215. I understand, I understand.@k@v27/20701216. *cackle*......"'
12705: 'Battler@r@v10/20100833."...So this is what I thought of next.@k@v10/20100834. A theory that there were actually three people in that room.@k@v10/20100835. Jessica and Kanon-kun were victims.@k@v10/20100836. And the culprit, the guest BEATRICE, was also there with them."'
12706: 'BEATRICE@r@v27/20701217."You wanted to make it "the human me" who committed the crime without using magic.@k@v27/20701218. I see, a strange theory that fits you perfectly.@k@v27/20701219. *giggle*giggle*."'
12707: 'Battler@r@v10/20100836_b."......I guessed that you killed those two, then locked the door from the inside.@k@v10/20100836_c. And you carried Kanon-kun''s corpse using some secret method that normal people wouldn''t notice.@k@v10/20100836_d. ......In other words, you used a secret door to escape."'
12708: 'Battler@r@v10/20100837."But you told me it in red.@k@v10/20100838. ...You said that there are no types of hidden doors in that room."'
12709: 'BEATRICE@r@v27/20701223."Indeed.@k@v27/20701224. No secret passage exists unknown to you all.@k@v27/20701225. Was it Knox, or was it Van Dine?@k@v27/20701226. It seems that in mystery novels, there must never be hidden passages, no matter what.@k@v27/20701227. I also follow that etiquette."'
12710: 'BEATRICE@r@v27/20701228."In other words, even without having to thoroughly search a room, great detectives can state with confidence that there are no secret passages.@k@v27/20701229. .........*cackle*cackle*, humans have it so easy with their little detective games."'
12711: 'Battler@r@v10/20100839."Damn you, talking so big...@k@|@y@v10/20100840. Thanks.@k@v10/20100841. Thanks to the witch''s arrangement, I can say for sure that the room doesn''t have a hidden door without searching the whole thing."'
12712: 'BEATRICE@r@v27/20701230."Indeed.@k @v27/20701231.@|@y@c900.@[There are no hidden doors in this room.@]@c.@k @v27/20701232.@|@y@c900.@[There is no way to get in or out other than the door and the windows.@]@c."'
12713: 'Battler@r@v10/20100842."......Which means...@k@v10/20100843....that theory Auntie Rosa''s so confident in...@v10/20100844....is wrong."'
12714: 'Battler@r@v10/20100845."...Plus, frustratingly, it''s impossible to disprove that theory.@k@v10/20100846. ......If you, the witch, say in red that @v10/20100847.@|@y@c900.@[there are no hidden doors@]@c., then it''s settled."'
12715: 'Battler@r@v10/20100848."......However, no matter how much a human like me tries to argue against her, Auntie Rosa probably won''t accept it.@k@v10/20100849. Humans can''t prove there''s no hidden door."'
12716: 'Battler@r@v10/20100850."It''s a Devil''s Proof.@k@v10/20100851. ...............Damn.@k@v10/20100852. Sure is convenient being a witch..."'
12717: 'George@r@v07/20300562."......No way!@k @v07/20300563.You''re calling Kanon-kun the culprit because of a hidden door that we don''t even know exists...@k@v07/20300564. I...can''t accept that."'
12718: 'Rosa@r@v12/21400593."If you can''t accept that, tell me some reasoning that''s easier to accept, then?@k @|@y@v12/21400594..........There is none.@k@v12/21400595. I''ve been thinking the whole time.@k@v12/21400596. There''s nothing but this!"'
12719: 'George@r@v07/20300565.".............................."'
12720: 'Rosa@r@v12/21400597."George-kun, you had a good relationship with Shannon-chan, right?@k@v12/21400598. So I think it would be hard for you to accept that all of the servants are the culprits."'
12721: 'Rosa@r@v12/21400599."I also don''t want to believe that Shannon-chan is one of the culprits.@k@v12/21400600. .........But whether it''s all of them or not, the culprit, or maybe an accomplice, is definitely in that group.@k@v12/21400601. You must not fail to see that!"'
12722: 'Battler@r@v10/20100853."......If you thought that there were more wolves in addition to Kanon-kun,@k@v10/20100854. ...then causing that uproar by saying that Kanon-kun was the culprit in Jessica''s room was to see the servants'' reactions...?"'
12723: 'Rosa@r@v12/21400602."Yes, that''s right.@k@v12/21400603. And as a result, I began to suspect them even more.@k@v12/21400604. ......I''m certain there are wolves among the servants.@k@v12/21400605. Certain.@k@v12/21400606. And, just like the "Wolves and Sheep Puzzle", while they are normally docile, they will surely attack if they get the chance."'
12724: 'Rosa@r@v12/21400607."......Jessica-chan was a lone sheep on the boat.@k@v12/21400608. ......In that puzzle, they may not attack when there is a balance between wolves and sheep, but our puzzle is different.@k@v12/21400609. Depending on the opportunity and the number of people, they''ll attack even if there is a balance.@k@v12/21400610. Just like when Jessica-chan was killed!"'
12725: 'George@r@v07/20300566.".........Th-there''s something I don''t like!@k @v07/20300567.In that case, Shannon, who you sent to the kitchen, is in a dangerous situation, isn''t she?!!@k @v07/20300568.We should also go to the kitchen right now!@k @v07/20300569.No matter who might or might not be a wolf!@k @v07/20300570.If we can form a balance by gathering together, I think we should maintain that!!"'
12726: 'Rosa@r@v12/21400611."......Shannon-chan went to see Father along with Genji-san.@k@v12/21400612. She was isolated then, but she wasn''t killed."'
12727: 'Rosa@r@v12/21400613."Because Genji-san wasn''t a wolf either?"'
12728: 'Rosa@r@v12/21400614."......No!@k @v12/21400615.Because they were both wolves!!"'
12729: 'George@r@v07/20300571."Shannon isn''t the kind of person who would take part in a crime!!@k @v07/20300572.Even if it''s you, Auntie Rosa, I cannot ignore that.@k@v07/20300573. I demand that you take back what you just said...!"'
12730: 'Battler@r@v10/20100855."...I hate to say this in front of Aniki, but that argument...@k@v10/20100856....feels just like something Auntie Eva would say.@k@|@y@v10/20100857. If we can''t argue back, then you automatically assume that you''re right.@k@v10/20100858. ......Looks like you can''t fight your blood after all, Auntie."'
12731: 'Rosa@r@v12/21400616.".........Even I don''t think of myself as very praiseworthy right now."'
12732: 'Rosa@r@v12/21400617."But you know what? I''m a mother!@k @v12/21400618.I would even become a demon to protect Maria''s safety.@k@v12/21400619. Honestly speaking, I wish I could just shut myself away somewhere alone with Maria."'
12733: 'Rosa@r@v12/21400620."......But I also plan to act as a mother to you two.@k@v12/21400621. Right now, you are as good as my children.@k@v12/21400622. ......You may not be my own children, ...but I won''t forsake you.@k@v12/21400623. .........Ever."'
12734: 'Battler@r@v10/20100859."......Sure, thanks."'
12735: 'Rosa@r@v12/21400624."I just wanted to warn you not to be careless, as your mother.@k@v12/21400625. Always remain where I can see you.@k@v12/21400626. I will protect you."'
12736: 'Battler@r@v10/20100860."And at the same time, you''ll be observing us to make sure we aren''t "wolves".@k@|@y@v10/20100861. ...Yeah, thanks a lot for that.@k@v10/20100862. Can you prove that you aren''t a "wolf" yourself?"'
12737: 'Rosa@r@v12/21400627."Yes, I can."'
12738: 'Battler@r@v10/20100863."That''s a quick answer.@k@v10/20100864. How?"'
12739: 'Rosa@r@v12/21400628."With this.@k@v12/21400629. ...This is my proof."'
12740: '@rAuntie Rosa held up the gun, and pointed the barrel at me.'
12741: '@rBut that was only for an instant.'
12742: '@rShe immediately lowered the gun, laughing impishly.@k@r......But to me, the time I spent staring down the barrel of the gun had felt like an eternity.'
12743: 'George@r@v07/20300574."...How does that gun prove that you aren''t the culprit, Auntie Rosa?"'
12744: 'Rosa@r@v12/21400630."Think about it.@k@v12/21400631. What if I were the culprit?@k @v12/21400632.Do you think I would let by this once-in-a-lifetime chance I got when the servants left?"'
12745: 'Rosa@r@v12/21400633."I could just shoot you both, bang, and all that''s left is to come out with a fitting excuse.@k@v12/21400634. Something like, BEATRICE appeared outside the window and shot at us with a gun.@k@v12/21400635. I would claim that I fired two shots back at her, and throw the two shots'' worth of empty cartridges onto the floor."'
12746: 'Battler@r@v10/20100865."That''s a crazy wild argument, but it does make sense. Ihihihi!"'
12747: 'Rosa@r@v12/21400636."There''s something Krauss nii-san often used to say.@k@v12/21400637. Might makes right.@k@v12/21400638. .........I wonder if this proves that?"'
12748: 'Rosa@r@v12/21400639.".........I''m sorry, you two.@k@v12/21400640. I''ve lost a lot of my composure after all these crimes since morning.@k@v12/21400641. You know how I normally am, so right now I must seem on-edge and a little short-tempered."'
12749: 'Rosa@r@v12/21400642."...But understand.@k@v12/21400643. I want to protect you from the malicious culprit.@k@v12/21400644. I will become a demon to do that.@k@v12/21400645. That''s all there is to it.@k@v12/21400646. ......I''m sorry for saying something that''s angered you.@k@v12/21400647. Battler-kun, George-kun.@k@v12/21400648. ...Let''s make up."'
12750: '@rGeorge-aniki was wearing an unsatisfied expression.@k@r...He probably couldn''t forgive the damage done to Shannon''s honor.'
12751: '@r...What about me...?@k Several bits of circumstantial evidence hint strongly at the servants'' participation.'
12752: '@r......I don''t want to believe that one of them is the culprit, or possibly colluding with the culprit,@k ...but in the current situation, that''s nothing but wishful thinking.'
12753: '@rWho should I believe?'
12754: '@rIn the first place, who is the culprit?@k@rAre there accomplices?@k@rIf so, how many?!'
12755: '@r......I feel like I''m constantly only suspecting the people connected to all this.'
12756: '@r...I find myself quickly forgetting about that 19th person,@k the guest, BEATRICE, who came yesterday and boldly called herself the Golden Witch.'
12757: '@rI haven''t actually seen her face.'
12758: '@rI''ve heard that she''s like a double of the witch in that portrait,@k but because I haven''t seen her directly, no matter how hard I try, I can''t really feel like there are 19 people on this island.'
12759: '@r...So I easily slip into the illusion that the culprit is one of the 18...'
12760: '@rDamn it......@k Come out, BEATRICE.'
12761: '@rIf you''re the bad guy, then act like the bad guy, and show yourself, laughing in a high-pitched voice and looking down on us.'
12762: '@rJust like a bad guy in one of those dramas who, even once they''re exposed as the culprit,@k aggressively says "is there any proof?"'
12763: 'BEATRICE@r@v27/20701232_b."*cackle*cackle*cackle*cackle*cackle*cackle*.@k@v27/20701232_c. Is there any proof?"'
12764: 'Battler@r@v10/20100868."Shut up, you keep your trap shut for a minute..."'
12765: '@rThere were five humans in the kitchen, but it was very quiet, filled only with the sound of the rain.'
12766: '@rIt was only accented by the sound of Shannon and Kumasawa washing the dishes.'
12767: '@rGohda was using the leftovers from breakfast and lunch as ingredients for a servants'' soup.'
12768: '@r......Rosa had suspected that poison might have been added to the food, so they had decided to eat canned food, but it hadn''t really been filling.'
12769: '@rBut Gohda thought that she was being too careful.@k@rSo he was spontaneously creating a soup to be served only to those that wanted to eat it.'
12770: '@rShannon and Kumasawa were washing the dishes that the food had been arranged on.'
12771: '@rOn the inside, they thought maybe Gohda should be the one to wash them since he had been the one who wanted the food on plates in the first place,@k but they left their complaints unsaid for the time being.'
12772: '@rGenji and Nanjo were facing each other across a crude chess set which had seen many years.'
12773: '@r...It had still only just begun.'
12774: '@rAnd because the opening game of the experienced players had been endlessly refined,@k it looked like a ritual where they just moved specified pieces in a specified order.'
12775: 'Kumasawa@r@v18/21800105."That''s a nice aroma...@k@v18/21800106. You wouldn''t get this from canned food."'
12776: 'Gohda@r@v17/21700173."It was made only from sealed ingredients, so there won''t be any poison mixed in."'
12777: 'Gohda@r@v17/21700174."I have made enough for everybody, so please, eat.@k@v17/21700175. Of course, I will also taste for poison.@k@v17/21700176. Please feel secure and eat."'
12778: 'Shannon@r@v15/20500702."That really is a nice aroma.@k@v15/20500703. Gohda-san, your makeshift servant meals really are delicious."'
12779: 'Gohda@r@v17/21700177."It''s natural that you can create delicious food if you buy delicious ingredients.@k@|@y@v17/21700178. ......My teacher taught me that perfecting your ability to make delicious food from whatever is at hand is what makes you a true cook."'
12780: 'Nanjo@r@v19/21900172."That was a good teacher.@k@v19/21900173. Thanks to him, it looks like I shall be able to enjoy some truly delicious soup."'
12781: 'Genji@r@v14/21600109."......Although it is a shame that it was made from ingredients intended for all of the family members to eat."'
12782: 'Nanjo@r@v19/21900174."I''m sure that Rosa-san is also tired after everything that happened this morning.@k@v19/21900175. It is only natural."'
12783: 'Kumasawa@r@v18/21800107."But thanks to that, we get to eat some soup made from delicious ingredients, hoh-hoh-ho."'
12784: '@rRosa had fervently told everyone that they didn''t realize the danger they were in, and that they must suspect that poison was mixed in with the food.'
12785: '@rThe atmosphere in that place had led to their agreement,@k but their hunger wouldn''t be overcome by that momentary emotion.'
12786: 'Gohda@r@v17/21700179."Ironically, it has become a soup that we normally wouldn''t be able to savor.@k@|@y@v17/21700180. If possible, I would like to also serve it to everyone in the parlor, but..."'
12787: 'Genji@r@v14/21600110."......Seeing as that goes against Rosa-sama''s instructions, you''d better not.@k@v14/21600111. ......Those who want to eat it can do so."'
12788: 'Kumasawa@r@v18/21800108."Hoh-hoh-hoh-ho.@k@v18/21800109. Skillfully taking a breather when no one is looking is one of the things you learn as a servant, after all."'
12789: '@rKumasawa laughed loudly, and Shannon and Gohda laughed with her.'
12790: '@rIt seemed that, in an area where only their fellow servants were gathered, they could be very relaxed.'
12791: '@rShannon didn''t like Gohda''s occasional dishonesty,@k but she knew that there was no falsehood in his childish smile when he cooked,@k nor in his desire that people enjoy his food.'
12792: '@rSo even though it was a little aggravating to be made to wash the dishes,@k she couldn''t really hate him.'
12793: '@rHowever, they couldn''t have dreamed that Rosa was calling them wolves in the parlor at exactly the same moment that they were spending their time peacefully like this......'
12794: '@rAt that time, several of the servants heard a sound like something was being dragged, and then a thump.'
12795: '@rWhen a servant was out carrying a mountain of trash bags on a rainy day,@k or doing some work in a raincoat, they would create exactly this kind of noise and presence as they returned and hovered around the back door.'
12796: '@rSo after hearing that sound, at first, none of them noticed anything out of the ordinary...'
12797: '@rBut they quickly realized.@k ............In a situation where everyone was either in the kitchen or the parlor, who in the world was at the back door...?!'
12798: '@rAs the servants all looked at each other, they checked to make sure that each one of them knew what that sound meant.'
12799: 'Kumasawa@r@v18/21800110."Who, ..........who could it be......?"'
12800: '@rThe servants knew the mansion''s layout well.'
12801: '@rSo they understood how unimaginable it would be for someone from the parlor to actually go outside in this typhoon,@k go all the way around, and come up to this back door.'
12802: '@rThen was it Kinzo?@k ...They found it even more difficult to imagine that Kinzo, who never left his study even under normal conditions,@k would dash out into the middle of this typhoon for no apparent reason, and come to the back of the house, where only low-class people came in or out.'
12803: 'Shannon@r@v15/20500704."......Tha-@v15/20500705.......that wasn''t...@v15/20500706.our imagination, was it......?"'
12804: 'Kumasawa@r@v18/21800111.".............Awawawawawawawawa..."'
12805: '@rShannon and Kumasawa drew close together, fearfully looking at the back door...'
12806: 'Gohda@r@v17/21700181."...Who, ...who is it......?"'
12807: '@rAs Gohda fearfully approached the back door, he called out.@k@r......And he checked with his eyes the location of a butcher''s knife set on a nearby sink.'
12808: '@r......He didn''t pick it up yet.@k@rBecause there was still a possibility that this was a member of the family.@k@rHowever, that possibility wasn''t possible...'
12809: '@rThere was no response from across the door to Gohda''s initial question.@k@r...Maybe his voice had been so quiet that it hadn''t reached through all the wind and rain outside.'
12810: 'Gohda@r@v17/21700182.".........Genji-san."'
12811: 'Genji@r@v14/21600112."......Yes.@k@v14/21600113. .........Stand back, Doctor Nanjo and the women."'
12812: 'Nanjo@r@v19/21900176."...Who, ......who in the world could it be......"'
12813: '@rGenji took a knife with a classical design from a stationery box placed near the chess set.'
12814: '@r...It was something to be used instead of a paper knife to open envelopes for invoices and bills.'
12815: '@rBut it was fundamentally a knife.@k@rSo the blade on it could injure someone...'
12816: '@rGenji hid it in his sleeve with a well-practiced manner.@k@rThen he too approached the back door, and signaled to Gohda with a silent nod.'
12817: '@rGohda cautiously approached the back door, .........and slowly started to open it......'
12818: 'Gohda@r@v17/21700183."Wa...wahyaaaaaaaaaaaaaaaaaaaaaaaaa...!!!"@|@y'
12819: '@rThe figure of a person suddenly shuffled into sight, landed on its knees, and fell over.@k@rGohda fell backwards onto his backside in shock.'
12820: '@rThat figure was soaked with rain, smeared with mud, and drenched with blood...'
12821: 'Shannon@r@v15/20500707."K-............Kanon-kun?!@k @v15/20500708.Kanon-kun!!"'
12822: 'Genji@r@v14/21600114.".........Kanon.@k@v14/21600115. Are you alright...?@k@v14/21600116. Doctor Nanjo...!"'
12823: '@rIt was Kanon.'
12824: '@r......His breath was feeble, ......and the puddles of mud he left quickly became drenched bright-red.'
12825: '@rWhen Nanjo held him and turned him face up, there was a deep, gruesome scar right in the center of his chest, as though he had been run through with a spear or something.'
12826: '@rEven now, deep-red blood poured out from there...!'
12827: 'Kumasawa@r@v18/21800112."Th-th-th-...this is horrible...@k@v18/21800113. Wh-what shall we do—first aid kit? First aid kit?!"'
12828: 'Nanjo@r@v19/21900177."Kanon-san, put your hand against the wound!@k @v19/21900178.Please, push firmly!@k @|@y@v19/21900179.Let''s carry him to the bed in the servant room!!@k @v19/21900180.Everyone, please, lend a hand."'
12829: 'Gohda@r@v17/21700184."C-come now, Kanon-san!@k @v17/21700185.Please, hang in there a little longer...!"'
12830: 'Shannon@r@v15/20500709."Hang in there!!@k @v15/20500710.It''s alright now!!@k @v15/20500711.So don''t take your hand from the wound...!!"'
12831: 'Genji@r@v14/21600117."Anyway, let''s carry him to the servant room.@k@v14/21600118. ......Kumasawa, inform Rosa-sama that we have found Kanon."'
12832: 'Kanon@r@v16/20600507."Wai-.........wait.........@k@v16/20600508. ......Not...@v16/20600509.......Rosa-sama........."'
12833: 'Gohda@r@v17/21700186."...Please wait!@k @v17/21700187.Kanon-san said not Rosa-sama..."'
12834: 'Shannon@r@v15/20500712."......Wh-what do you mean, Kanon-kun...!"'
12835: 'Genji@r@v14/21600119."............Not now.@k@v14/21600120. Let''s carry him to the servant room quickly.@k@|@y@v14/21600121. Kumasawa, don''t tell Rosa-sama yet.@k@v14/21600122. ...We''ll do it after we hear the situation from Kanon."'
12836: 'Kumasawa@r@v18/21800114."Y-......yes......@k@v18/21800115. ......hiiiiii..."'
12837: '@rAfter appearing in this horrible state, he had said not to tell Rosa.'
12838: '@r......That could only mean something very disquieting.@k@r......An eerie sense of panic rose to their faces...'
12839: 'Nanjo@r@v19/21900181."C-come now, everyone!@k @v19/21900182.Let''s hurry and carry him...!@k @v19/21900183.Quickly, quickly...!"'
12840: '@rKanon''s wound was unbelievably deep,@k ...and judging from Nanjo''s pale face, it was almost a miracle that he was still conscious...'
12841: 'Nanjo@r@v19/21900184."......This is......horrible...@k@v19/21900185. It appears that he has been stabbed with something like a spear.@k@v19/21900186. I-if it hasn''t reached the lungs, I might be able to do something......@k@v19/21900187. Anyway, stop the bleeding......!"'
12842: 'Kanon@r@v16/20600510."u...guo......aaaaga!!!"@|@y'
12843: '@rNo matter how much Nanjo tried to wipe off that gushing deep-red blood, ...he couldn''t wipe it he couldn''t wipe it he couldn''t wipe it all away...!@k And each time, the wound was aggravated, causing Kanon to cry in anguish...'
12844: 'Shannon@r@v15/20500713."Kanon-kun, Kanon-kun Kanon-kun!@k @v15/20500714.Hang in there... Hang in there...!!"'
12845: 'Gohda@r@v17/21700188."Doctor Nanjo!@k @v17/21700189.A new towel...!@k @|@y@v17/21700190....How...horrible...!!"'
12846: 'Genji@r@v14/21600123."What is his condition...?"'
12847: 'Nanjo@r@v19/21900188.".........In all honesty, ...it is so severe that I cannot believe he is alive...@k@v19/21900189. Maybe the location of the stab was fortunate...@k@v19/21900190. But the blood loss is too horrible...!@k @v19/21900191.A blood transfusion is necessary, but that''s impossible until tomorrow...!"'
12848: 'Kanon@r@v16/20600511."......u...@v16/20600512....*cough*cough*!!@k @v16/20600513.Ro-@v16/20600514.......Rosa-sama...@v16/20600515.......she......@v16/20600516.ugaaaaaa!!"@|@y'
12849: 'Shannon@r@v15/20500715."D-don''t talk, Kanon-kun!@k @v15/20500716.Your wound will open...!"'
12850: 'Kanon@r@v16/20600517."......Rosa-sama...came...@v16/20600518.......t-@v16/20600519.......to Milady and...@v16/20600520....me, and........."'
12851: 'Gohda@r@v17/21700191."Wh-......what did you say......"'
12852: 'Kumasawa@r@v18/21800116."Rosa-sama......did...?@k@v18/21800117. Oooooh... Could that mean, could that mean..."'
12853: 'Genji@r@v14/21600124."......Are you certain?"'
12854: 'Kanon@r@v16/20600521."Yes.........@k@v16/20600522. ......I''m certain......it was Rosa-sama........."'
12855: 'Nanjo@r@v19/21900192."Come now, don''t speak any more...!@k @|@y@v19/21900193.Kumasawa-san, please grab another first aid kit!"'
12856: 'Gohda@r@v17/21700192.".........Genji-san.@k@v17/21700193. ......Is it possible Rosa-sama......did such a thing?"'
12857: 'Genji@r@v14/21600125."............I don''t know."'
12858: '@rDisregarding Nanjo and Kumasawa, who were struggling hard and stained with blood as they tried to stop the bleeding, Genji and Gohda faced each other...'
12859: '@r......Because if what Kanon had said was the truth,@w500. ......Rosa was the culprit who killed Jessica.'
12860: 'Kanon@r@v16/20600523."Curse you, Rosa......@k@v16/20600524. How could you do that...to Milady......@k@v16/20600525. ...I''m gonna kill you......ugnnnggg...!"'
12861: '@rKanon screamed even more hatefully...@k@r...His hate-filled voice made it seem like he had seen Jessica being harmed right before his eyes.'
12862: 'Gohda@r@v17/21700194."......Cer-certainly, Rosa-sama may have had a reason to kill Milady.@k@v17/21700195. If the Ushiromiya family was wiped out, the inheritance would all go to Rosa-sama..."'
12863: 'Gohda@r@v17/21700196."If so, Battler-sama and George-sama are in danger...!@k @v17/21700197.Not only is Rosa-sama holding a gun, but right now, they are the only ones in the parlor...!@k @v17/21700198.Genji-san, isn''t this quite perilous......?!"'
12864: 'Genji@r@v14/21600126."................................."'
12865: 'Shannon@r@v15/20500717.".............................."'
12866: '@rShannon suddenly ran out into the corridor.'
12867: '@r...Her expression was complex and tragic, as though she didn''t know what to believe...'
12868: '@rShannon ran.@k To where?'
12869: '@r......The inside of the mansion had been scrupulously cleaned, so they probably wouldn''t be easy to find.'
12870: '@rShe might find some if she searched the rose garden, but they would probably have all been lost in this wind and rain...'
12871: '@rThat''s right, ......the boiler room isn''t cleaned very often.@k@r...If she went there, ......she might be able to find some...'
12872: '@rShannon ran down the stairs to search for those in the underground boiler room...'
12873: '@rHad some medicine taken effect at the brink of death,@k or had Kanon finally stopped even feeling pain?'
12874: '@r...For the time being, Kanon had at least gotten over his painful gasping.'
12875: '@rNanjo apparently didn''t think of this as that great of a trend, and didn''t let his eyes off Kanon for a second.'
12876: '@rKumasawa firmly gripped Kanon''s hand, and kept encouraging him, so that his will to stay alive didn''t fall asleep.'
12877: '@rGenji and Gohda seemed bewildered at how to deal with the truth that Kanon had risked his life to deliver...'
12878: 'Genji@r@v14/21600127.".........I believe Rosa-sama''s gun had four or five shots loaded."'
12879: 'Gohda@r@v17/21700199."That is no small number.@k@v17/21700200. ...But loading cartridges into that gun should require quite a lot of practice.@k@v17/21700201. We might unfortunately allow her to get one shot off, but if everyone attacks her at once, we should be able to take the gun from her before she shoots again..."'
12880: 'Genji@r@v14/21600128.".........On this island, we may have a doctor, but there''s no medicine, and no hospital.@k@v14/21600129. ......If you''re shot in the wrong place, ...you''re dead."'
12881: 'Gohda@r@v17/21700202."I understand that, but...@k@v17/21700203. More importantly, if we don''t move quickly, there is also the possibility that another crime will occur...!@k @v17/21700204.I get the feeling that Rosa-sama skillfully chased us out.@k@v17/21700205. There is a possibility that George-sama and Battler-sama are being killed right about now...!"'
12882: 'Genji@r@v14/21600130."..........................."'
12883: 'Kumasawa@r@v18/21800118."......Ho...hohohohoho.@k@v18/21800119. If the opponent is so dangerous, wouldn''t it be better if we didn''t provoke them too much...?"'
12884: 'Gohda@r@v17/21700206."But there is still much time before tomorrow comes...!@k @v17/21700207.We can''t even imagine what strategy she will use!@k @|@y@v17/21700208.Genji-san, we should be the ones to make the first move.@k@v17/21700209. If we can at least take the gun from her under some pretext, things might work out...!"'
12885: 'Kumasawa@r@v18/21800120."There are four or five cartridges, are there not?@k@v18/21800121. That means there aren''t enough to kill all of us...@k@v18/21800122. If we don''t carelessly provoke her, surely even Rosa-sama wouldn''t recklessly—"'
12886: 'Kanon@r@v16/20600526."............No, she said it.@k@|@y@v16/20600527. She said she''ll massacre all of us."'
12887: '@rKanon, who they thought had been sleeping quietly, suddenly started talking brightly.'
12888: '@rAlmost like he had been awake the whole time and had suddenly opened his mouth.'
12889: '@rHe looked firm and steady, and Nanjo was slightly relieved, but thinking of the deepness of that wound, he just couldn''t wipe away a certain creepy feeling.'
12890: '@r......He knew because he was a doctor.'
12891: '@rKanon should have been expected to fall unconscious after losing so much blood.@k@rAnd yet somehow, he had preserved his awareness so clearly.'
12892: '@r......Youth?@k Or tenacity?@k@r...Sometimes the power of human life did surpass common knowledge......'
12893: '@rWhen they had stopped the bleeding, to make sure there were no foreign objects inside the affected area,@k Nanjo had groped around a bit inside the bleeding hole with tweezers, and the great depth of the wound had surprised him.'
12894: '@r...The wound had certainly reached as far as his lungs.'
12895: '@r......And yet, ...and yet...@k@r......No, on the other hand, the fact that he is alive is fortunate...'
12896: '@r......But Kanon had spoken clearly.@k@r...He had hatefully said that the one named Rosa had created this wound, and was repeating curses and enraged words.'
12897: 'Kanon@r@v62/20600528."...She wants to kill everyone by any means necessary before the typhoon passes, so that she can have the Master''s wealth all to herself.@k@v62/20600529. She told me that clearly."'
12898: 'Gohda@r@v17/21700210.".........Damn...!@k @v17/21700211.What a person...@k@v17/21700212. Genji-san, what should we do?!@k @v17/21700213.Do we also not need some kind of weapons...?"'
12899: 'Genji@r@v14/21600131."......I can''t believe it so suddenly.@k@v14/21600132. ......That Rosa-sama would do something like......"'
12900: 'Kanon@r@v62/20600530."Genji-sama, it isn''t a question of whether you believe or not.@k@v62/20600531. She told me.@k@v62/20600532. I heard it.@k@|@y@v62/20600533. WHY won''t you believe me?"'
12901: 'Nanjo@r@v19/21900194."D-don''t get up...@k@v19/21900195. You''ll worsen your wound..."'
12902: '@rKanon sat up on the bed, and spoke to Genji, who was making no effort to believe Kanon''s story.'
12903: 'Kanon@r@v62/20600534."She will definitely kill all of us.@k@v62/20600535. She''s surely killed all of the people in the parlor by now.@k@v62/20600536. If we don''t kill her first, it will absolutely be us who are killed first.@k@v62/20600537. Just like how I was killed first, everyone else will also be killed first.@k@v62/20600538. Kill or be killed.@k@v62/20600539. Kill or be killed kill or be killed."'
12904: 'Nanjo@r@v19/21900196."...K-.........Kanon-san, ......you...@k@v19/21900197. ......Does it really not hurt...?"'
12905: 'Kanon@r@v62/20600540."......Oh, this?@k@v62/20600541. It isn''t a serious wound."'
12906: 'Nanjo@r@v19/21900198."Wh-...what do you mean, not a serious wound, ...you......"'
12907: 'Kanon@r@v62/20600542."It really isn''t a big deal.@k@v62/20600543. It doesn''t hurt at all anymore—it really isn''t a serious wound."'
12908: '@rAs Kanon said that, he began to untie his own bandages which had been painstakingly wrapped...'
12909: '@rThe gruesome hole in his chest was immediately exposed...'
12910: 'Kumasawa@r@v18/21800123."K-Kanon-san...!@k @v18/21800124.You mustn''t do something like that!@k @v18/21800125.Quickly, lie down...!"'
12911: 'Kanon@r@v16/20600544."I said it''s fine.@k@v16/20600545. ......Look.@k@|@y@v16/20600546. See...?@k @v16/20600547.It''s...not...a serious wound, right...?"'
12912: '@rKanon showed off his gaping wound, which was still slowly spitting out foamy blood.'
12913: '@r...Everyone averted their eyes reflexively.'
12914: 'Kanon@r@v16/20600548."See, I told you that it wasn''t a serious wound at all..."'
12915: 'Nanjo@r@v19/21900199."S-......stop that... You mustn''t play with your wound......"'
12916: 'Kanon@r@v16/20600549."...Look, see?@k @v16/20600550.......It isn''t a deep wound...at all.@|@y@k@v16/20600551. .........Look.@|@y@k@v16/20600552. ..................Look."@|@y'
12917: '@rKanon held up two fingers, showed them to everyone, and slowly started to stick them into the gruesome wound right in the center of his chest...'
12918: '@r......Plunging, slimy, squishy, wet.@k@rThe fingers...went in deep...to the base...@k@r@|@y ......Squich, gloop, blorp...'
12919: 'Kumasawa@r@v18/21800126."Hiiiiiiiiiiiiiiiiiiii...!!@|@y@k @v18/21800127.K-K-K-Kanon-san, stop it, stop it...!!"'
12920: '@rHaving stuck his fingers completely into his chest......up to their base,@k ......he slowly pulled them out in exactly the same way...'
12921: '@rThe fingers he pulled out were stained a sticky, solid, deep-red color, and there was even a thread hanging...'
12922: '@r...The fingers were, all the way to their base, covered......in deep red...'
12923: 'Nanjo@r@v19/21900200."......Y-@v19/21900201..........you...@v19/21900202. ......Wh-wh-wh-what in the world.................."'
12924: 'Kanon@r@v16/20600553.".........See?@k @v16/20600554.It is...not a serious wound...at all, you see?@k @|@y@v16/20600555.*cackle*cackle*cackle*cackle*cackle*cackle*!"'
12925: '@rJust then, the door opened vigorously, and Shannon appeared.'
12926: '@r...Even after she saw Kanon stained with fresh blood, her impregnable expression didn''t falter.'
12927: 'Kanon@r@v16/20600556."......Hey, Nee-san.@k@v16/20600557. Where''d you go?@k @v16/20600558.I''m on the verge of death here, where''d you go?"'
12928: 'Shannon@r@v15/20500718."Well.@k@v15/20500719. I went to the boiler room.@k@v15/20500720. Looking for something.@k@v15/20500721. .........More importantly, I want to check.@k@|@y@v15/20500722. Are you really...Kanon-kun?"'
12929: 'Gohda@r@v17/21700214."......Huh, ......huhh...?"'
12930: '@rIt was only natural.@k Everyone believed he was Kanon.@k@rSo they couldn''t understand the meaning of Shannon''s question.'
12931: '@rWhen they looked, they noticed that Shannon was holding a handkerchief in her hand.'
12932: '@rIt was filthy, and looked like she had wiped up some trash or dust.@k@rAnd while holding that, she approached Kanon, .........and drew close to his legs.'
12933: 'Kanon@r@v16/20600559."What is that......?"'
12934: 'Shannon@r@v15/20500723."It''s a handkerchief with a spider''s web wiped onto it."'
12935: 'Kanon@r@v16/20600560.".....................@k@v16/20600561. ...Why something like that?"'
12936: 'Shannon@r@v15/20500724."If you''re Kanon-kun, you should be alright.@k@v15/20500725. ......But if spiders are your natural enemy, I thought you might hate it."'
12937: 'Kanon@r@v16/20600562."...........................@k@v16/20600563. Hahaha, oh no.@k@v16/20600564. Why would I hate spiders?"'
12938: 'Shannon@r@v15/20500726."Sorry, I''ll try it."'
12939: 'Kumasawa@r@v18/21800128."......Sha-...Shannon-san."'
12940: '@rWhen Shannon brought that handkerchief close to Kanon''s thigh, ......something happened in an instant.'
12941: '@rIt happened all at once.@k The human eye couldn''t have followed it.'
12942: '@rKanon jumped back like a wild goat, ...fleeing from the thing Shannon was holding.'
12943: '@rAnd his arm drew trails with some kind of afterglow that flashed purple.'
12944: '@rThey were three beautiful purple trails drawn in an arc, and they were traced across the throats of Nanjo and Kumasawa, who had been tending to him.'
12945: '@rAnd Nanjo and Kumasawa''s throats......had opened like gaping mouths, ...and it was the very instant before the blood was about to start spewing out.'
12946: '@rThe third purple trail should have traced across Shannon''s throat.@k@rBut Shannon wasn''t there.'
12947: '@rBecause Genji, who had been behind her, had wrapped his own arm around Shannon''s neck and pulled her back.'
12948: '@rThis all happened in an instant.'
12949: 'Gohda@r@v17/21700215."...........................!!!"'
12950: '@rIn the instant Gohda tried to think fast in an attempt to understand this scene, the frozen moment in time shattered.'
12951: '@rBlood spewed forcefully from Nanjo and Kumasawa''s necks, which had been torn open.'
12952: '@rStill mid-jump, Kanon wall-kicked off a picture frame that had been hanging from the wall behind him, springing forward just like a cat, and aiming for Shannon''s throat again.'
12953: '@rBut Kanon''s target once again disappeared from in front of him.@k Because Genji had pulled Shannon again, and the two of them had fallen onto the ground, keeping flat to the floor.'
12954: 'Kanon@r@v16/20600565."Nice reflexes, you senile old piece of furniture!!"'
12955: 'Genji@r@v14/21600133."......Gohda!"'
12956: 'Gohda@r@v17/21700216."Uu...uooooooooooooooooooooooooooohhh!!"@|@y'
12957: '@rGohda wasn''t an idiot either.@k Even if he couldn''t fully understand what was going on, he at least realized that if this "Kanon" wasn''t seized, his own life would also be in peril.'
12958: '@rHe sprung at Kanon with his huge body, pushing him up against the wall with his weight and physical strength.'
12959: 'Gohda@r@v17/21700217."Uuuoooooooooooooooooohhh...! Ooaaaaaaaaaaaaaaaaaahhh!!"'
12960: 'Kanon@r@v16/20600566."Let...me...go, you fatass!!"@|@y'
12961: '@rThe tips of the fingers on Kanon''s right hand began to trace out another purple trail.'
12962: '@rAnd when he raised that blade-hand up, aiming to strike at Gohda''s back, there was a loud thunk.'
12963: '@rBecause Kanon''s raised blade-hand had been pinned to the wall.'
12964: '@rHe couldn''t tear his palm away from the wall.'
12965: '@rSticking out from it was the knife Genji had thrown.'
12966: '@rUnder normal circumstances, it should have been surprising to see someone as old as Genji handle a knife so skillfully,@k but in this abnormal space, no one paid it much mind.'
12967: 'Shannon@r@v15/20500727."Genji-sama, here...!"'
12968: 'Genji@r@v14/21600134."......Yes."'
12969: '@rGenji took the handkerchief with the spiderweb stuck to it from Shannon.@k@rAnd he approached Kanon, who was pinned to the wall by Gohda''s massive body and the knife.'
12970: 'Kanon@r@v16/20600567."Sto-stop it...!!@k @v16/20600568.Don''t co—Don''t come near me with that...!!@|@y@k @v16/20600569.Stop it, sto-stop!!"'
12971: 'Kanon@r@v16/20600570."Gyaooooooooooooaaaaaaaaaaaaaaaahhh!!"@|@y'
12972: '@rWhen Genji pushed the handkerchief up against Kanon''s face,@k ...there was a sound just like the one you hear when you set meat on a red-hot iron plate.'
12973: '@rOf course, the smell was the same too.@k As he was burned and inflamed, festering in filthy red and black, and cried out in his death throes, Kanon''s body burst open and scattered.'
12974: '@rIt was almost as though a balloon filled with gold leaf had popped.@k@rThe entire servant room was completely buried under a storm of gold leaf—no, a rabble of gold butterflies...'
12975: '@rThose butterflies began to softly fade into nothingness, as though dissolving into water, no, into the air itself,@k ......and afterwards, all that was left was the three of them sitting on their behinds, stained with blood.'
12976: '@rHowever, not everyone was just stained with blood.@k@rSome of them were lying on the ground, vomiting blood themselves.'
12977: 'Genji@r@v14/21600135."...Kumasawa...!@k @v14/21600136.......Doctor Nanjo...!@k @v14/21600137......................"'
12978: '@rA slit so sharp that it looked like it could cut your finger if you touched it was opened wide, causing large amounts of blood to keep pouring out...'
12979: 'Gohda@r@v17/21700218."What was that, .........j-...just now............"'
12980: 'Shannon@r@v15/20500728."..........................."'
12981: 'Genji@r@v14/21600138.".........Gohda.@k@v14/21600139. Have you been injured?"'
12982: 'Gohda@r@v17/21700219."I, I am alright...@k@|@y@v17/21700220. But.........what did we see?!@k @v17/21700221.What happened?!@k @v17/21700222.E-ev-ev-......even though I definitely pushed that thing against this wall with this very hand!"'
12983: 'Gohda@r@v17/21700223."I cannot understand what happened...!!"'
12984: '@rGohda looked at his own hand.'
12985: '@rThe bright-red blood left from his scuffle with Kanon...definitely remained.'
12986: '@r...And yet, Kanon was nowhere to be seen.'
12987: '@rBecause he had disappeared.@k@rHe had turned into gold butterflies and scattered.'
12988: '@rGohda kept screaming alone that he had no clue about what was going on.'
12989: '@rShannon sobbed in front of Nanjo''s and Kumasawa''s remains,@k ...and Genji watched over her, silent as always...'