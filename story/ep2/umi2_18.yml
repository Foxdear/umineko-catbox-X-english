14219: 'Rosa@r@v12/21400874."Where are you, BEATRICE!!@k @v12/21400875.Show yourself!!@k @v12/21400876.BEATRICEEE!!"'
14220: '@rRosa finally arrived at the chapel.@k She pointed her gun around her, screaming the witch''s name, but there was no way there would be an answer.'
14221: '@rAfter grimacing slightly, she noisily approached the table where her siblings'' corpses were still exposed, and stretched out her arm towards the gold ingots.'
14222: '@rThey were very heavy, but Rosa paid that no regard.@k@rShe wrapped one of them up in a blanket, and slung it over her shoulder.'
14223: 'Rosa@r@v12/21400877."At least...just this one......@k@v12/21400878. Just this should be worth more than ten million..."'
14224: '@rRosa did not part with her gun either, carrying the gold in addition to it.@k@r...Her shoulders were screaming, but Rosa didn''t care.'
14225: 'Maria@r@v13/20400523."......Kihihihihihihihihihihihihihihihihi.@k@v13/20400524. It will happen very soon.@k@v13/20400525. ......Very soon, the door to the Golden Land...will open."'
14226: 'Rosa@r@v12/21400879."Stop laughing with that creepy voice!!@k @v12/21400880.Where is BEATRICE?!@k @v12/21400881.Yes, I know it, she''s around here somewhere, isn''t she?!@k @v12/21400882.You know, right?!@k @v12/21400883.Where?!"'
14227: 'Maria@r@v13/20400526."Kihihihihihihihihihihihi.@k@v13/20400527. I dooon''t knowww.@k@v13/20400528. Even if you don''t search for her, you can meet her in the Golden Land.@k@v13/20400529. ...Kihihihihihihihihihihihihihihihihi,@w1500.@|@y ouch."@|@y'
14228: 'Rosa@r@v12/21400884."Stop that laugh!!@k @v12/21400885.......Aaah, it almost makes me want to laugh!!@k @v12/21400886.That''s right, that was definitely a witch, definitely a witch!!@k @v12/21400887.I didn''t understand, I thought it was a human calling herself a witch, I was wrong!!!"'
14229: 'Rosa@r@v12/21400888."...It really was a witch!!@k @v12/21400889.I won''t be fooled by a thing like that!!@k @v12/21400890.You''re there, aren''t you?!@k @v12/21400891.Come out, show yourself!!@k @v12/21400892.BEATRICEEEEEEEEEEEEEE!!!"@|@y'
14230: 'Maria@r@v13/20400530."I told you, she''ll appear very soon.@k@v13/20400531. The door to the Golden Land will be opened.@k@v13/20400532. ......Kihihihihihihihihihihihi..."'
14231: 'Kinzo@r@v01/21500240."............Of course.@k@v01/21500241. That''s what I should have done!@k @v01/21500242.I don''t care, I shall throw away the rook!@k @v01/21500243.You, woman, are the king, who can''t even be reached without the resolve to lose everything one has.@k@v01/21500244. I''ll corner you, BEATRICEEEE.@k@v01/21500245. Hihahahahahahahahahaha!"'
14232: 'BEATRICE@r@v27/20701536."At least call me a queen.@k@v27/20701537. Hoh, what a brilliant move.@k@v27/20701538. Tenacity is in your, ...no, in the Ushiromiyas'' blood."'
14233: 'Kinzo@r@v01/21500246."......How pleasant!@k @v01/21500247.Truly an elegant night.@k@v01/21500248. Ku-hah-hah-hah-hah-hah-hah-ha...!!"'
14234: 'Genji@r@v14/21600266.".........My lord, BEATRICE-sama.@k@v14/21600267. It will soon be time for the banquet."'
14235: 'Kinzo@r@v01/21500249."Already?@k@v01/21500250. ......That''s fast.@k@v01/21500251. Every night I pass with you goes by fast:@v01/21500252. the moon falls like an apple, and the sun rises like a small fish leaping out of the river."'
14236: 'BEATRICE@r@v27/20701539."Shall we go? It is time.@k@v27/20701540. ......Stand, Battler.@k@v27/20701541. It is the beginning of the banquet to celebrate my revival."'
14237: 'BEATRICE@r@v27/20701542."I''ll introduce you as my new furniture, ...no, as my toy.@k@v27/20701543. To the dignitaries among witches."'
14238: '@rThe witch was relaxing elegantly, her feet thrown out from the sofa and sitting on top of a footrest.'
14239: '@r...However, the footrest wasn''t a part of the sofa, ......it was a Human.@k Which was down on all fours......'
14240: 'Genji@r@v14/21600268."......BEATRICE-sama, your silk dress."'
14241: 'Kinzo@r@v01/21500253."You are the guest of honor, but I am the host.@k@v01/21500254. I will go out first.@k@v01/21500255. It would have been nice if Shannon were here to help dress you, but, unfortunately, it seems that she no longer remains."'
14242: 'Kinzo@r@v01/21500256."......She''s never around when I want to use her.@k@v01/21500257. Completely useless.@k@|@y@v01/21500258. .........However, you did well to remain here.@k@v01/21500259. ...I''m happy, my friend."'
14243: 'Genji@r@v14/21600269."......I am grateful for your words."'
14244: 'BEATRICE@r@v27/20701544."Good.@k@v27/20701545. Wait downstairs, you two.@k@|@y@v27/20701546. Genji, good work, set the dress down over there."'
14245: 'Genji@r@v14/21600270."......Certainly.@k@v14/21600271. .........Well then, my lord."'
14246: 'Kinzo@r@v01/21500260."We will go first.@k@v01/21500261. ...BEATRICE, I will see you later."'
14247: 'BEATRICE@r@v27/20701547."Indeed."'
14248: '@rKinzo and Genji left the study.@k@rAfter that, only the witch and the dress and the furniture remained.'
14249: 'BEATRICE@r@v27/20701548.".........Do you know why I am not embarrassed to show myself to you naked...?"'
14250: 'Battler@r@v10/20101265."..........................."'
14251: 'BEATRICE@r@v27/20701549."It''s because you are furniture.@k@v27/20701550. Furrrrniture.@k@v27/20701551. Understand?@k @v27/20701552.Furniture, just furrrrniture!"'
14252: 'BEATRICE@r@v27/20701553."Who would feel shame at exposing their body to furniture?@k @v27/20701554.So there is no reason for me to feel shame because of you.@k@v27/20701555. ...*cackle*cackle*cackle*cackle*cackle*!"'
14253: '@rThe witch stood up, and removed her jacket just at the shoulders.@k@r......The jacket slumped down at the back.'
14254: '@rWhen the furniture respectfully approached to pick up her clothing, the witch gave it a small kick and it fell over.@|@y'
14255: '@r...The furniture was afraid of what misconduct it had shown...'
14256: 'BEATRICE@r@v27/20701556."Do you, as furniture, plan to force me to unbutton myself?"'
14257: 'BEATRICE@r@v27/20701557."......Stand.@k@v27/20701558. And undo the buttons.@k@v27/20701559. ...One by one, carefully.@k@v27/20701560. Quickly.@k@v27/20701561. Beautifully.@k@v27/20701562. With no mistakes.@k@v27/20701563. The guests are being kept waiting, change my clothes quickly."'
14258: 'Battler@r@v10/20101266."..................Yes..."'
14259: 'BEATRICE@r@v27/20701564."*cackle*cackle*cackle*cackle*cackle*, kakakaka, hah-hah-hah-hah-hah-hah-ha!!@k @v27/20701565.Undo them carefully.@k@v27/20701566. Those buttons are each worth more than one of your eyeballs.@k@v27/20701567. ...If you accidentally tear one off, I''ll sew on an eyeball of yours in its place...@k@v27/20701568. *cackle*cackle*cackle*cackle*cackle*cackle*cackle*cackle*cackle*cackle*!!"@|@y'
14260: '@rThe entrance hall was bustling with a large number of figures.@k@rAnd it was sparkling gold with the gold butterflies flying around.'
14261: '@rThe gentlemen in suits and tuxedos and the ladies in dresses looked like they were having a great number of friendly chats.@k At a glance, it might have looked like a fabulous medieval ball.'
14262: '@rBut they all had one thing in common, and that thing was exceedingly bizarre.'
14263: '@r......Because all of them...had goat heads.'
14264: '@rIt was impossible to tell whether it was a goat mask masquerade,@w500. .........or whether they really had goat heads.'
14265: '@r...The latter was a ridiculous notion, but in this bizarre world, there was serious doubt about which was true...'
14266: '@rKinzo was amongst those goat nobles, greeting them.'
14267: '@rEvery one of them seemed to be an honored guest, and Kinzo greeted them more respectfully than could ever have been imagined from his normal demeanor.'
14268: '@rAt that time, Genji''s voice rang out through the hall.@k@rIt was a voice calling for silence.@k@rThat voice stopped the voices of idle chatter, and everyone turned to face Genji.'
14269: 'Genji@r@v14/21600272.".........Tonight marks the entrance of our Golden Witch, who has achieved her revival,@k@v14/21600273. the Lady BEATRICE.@k@v14/21600274. I ask you all to join me in welcoming her with your applause."'
14270: '@rWhen Genji began to applaud, it quickly spread through the guests, and became thunderous applause.'
14271: '@rAnd.........the Golden Witch appeared at the top of the large staircase...'
14272: '@rShe gracefully waved her hand as she slowly descended the staircase...with her preferred furniture in tow...'
14273: '@rThe goat nobles offered unanimous words of celebration in some long-forgotten language.'
14274: '@rAnd those with whom she was closely acquainted embraced her, filled with joy at their reunion.'
14275: '@rAs the witch offered greetings of reunion, ...the witch''s furniture followed behind her the whole time.'
14276: '@r.........There was a chain around its neck.@k@rThis was gripped in the witch''s hand, like it was a trained dog.'
14277: '@rThe chain wasn''t there to restrain it.@k@r...The only purpose of the restraining device was to injure the furniture''s dignity...'
14278: '@rIt wasn''t permitted to wear anything else on its body.'
14279: '@rOne of the young woman goats, mixed in with the goat nobles,@k@|@y softly removed her goat mask as the furniture passed in front of her, and spoke with eyes that had no light in them.'
14280: '@rThat face...looked like it belonged to a long-haired young girl...'
14281: 'BERNKASTEL@r@v28/22100001."...............How pitiful."'
14282: 'BEATRICE@r@v27/20701569."Ohh, Lady BERNKASTEL.@k@v27/20701570. Welcome.@k@v27/20701571. Do you like my furniture?"'
14283: 'BERNKASTEL@r@v28/22100002.".........Good taste."'
14284: '@rAfter saying only that, the witch called BERNKASTEL once again put on her goat mask,@k and was swallowed up in the shadows of the other tall goats...'
14285: '@r@v29/YagiF2001."Ahahahahahahaha...@k@v29/YagiF2002. Sore loser.@k@v29/YagiF2003. She''s irritated."'
14286: 'BEATRICE@r@v27/20701572."You''re right.@k@v27/20701573. *cackle*cackle*cackle*cackle*cackle*cackle*cackle*cackle*cackle*cackle*!"'
14287: '@rThe young women goats giggled, and the witch once again let out a high-pitched laugh.'
14288: 'BEATRICE@r@v27/20701574."Thank you for gathering here for my sake tonight!!@k @v27/20701575.Why don''t we enjoy to the fullest this "banquet of the witch", where old friends have gathered from past and present, east and west...!"'
14289: 'BEATRICE@r@v27/20701576."Come, we will eat all night,@v27/20701577. drink all night,@v27/20701578. slurp all night,@v27/20701579. and chew to bits all night as we enjoy ourselves!!@k @v27/20701580.Look at the clock, it shows the time when the ending hour and the beginning hour melt together... ...Come!!@k @v27/20701581.Let us begin the banquet of the witch!!!"'
14290: '@rWhen the witch proclaimed the beginning of the banquet, the large clock pointed to 24:00, and the sound of a bell began to ring out loudly...'
14291: 'BEATRICE@r@v27/20701582."Come...... Now is the time!!@k @v27/20701583.Open the golden door............!!!"'
14292: '@rAll at once, the butterflies leafed in gold flew all around the inside of the room.'
14293: '@rAmidst the golden storm and the brilliant gold-colored light, the cross-section joining this world and a different world......was cut open......'
14294: '@rAmidst the goats'' delighted voices, the mansion of the human world and the mansion of those not human overlapped,@k ......and, in the form of golden butterflies, all those folk who praised the resurrection of the Golden Witch...@k...poured out of the depths of hell...'
14295: '@rIt was...a golden...tornado.@k@r...A rondo of golden demons.'
14296: '@rCome, tonight we will put aside rank.'
14297: '@rThrow open the wine cellar,@w500. drop the snake''s head into the liquor pot,@w583. throw cows and chickens into the furnace alive,@w500. drink and eat and sing and dance,@w583. sneer and kill and desecrate and degrade!!'
14298: 'Kinzo@r@v01/21500262."Aaaaaahh, BEATRICE!!@k @v01/21500263.Take me to the Golden Land now!@k @v01/21500264.To the Golden Laaaaaaaaaaaaaand!!!@k @v01/21500265.Oooooooooohhhhhhhhh, aaaaaaaaaaaaaaaaaaaaaaaaaaahhh!!!"'
14299: '@rThe goat nobles were suddenly crushing in around Kinzo.'
14300: '@r...Almost like they were kids demanding the autograph of some famous movie star.'
14301: '@rThere were two differences.@k First, they were witches, not kids.@k And second, what the witches demanded were not autographs.'
14302: '@rKinzo began to drown in the sea of goat nobles.@k@rOnly Kinzo''s laughing voice echoed throughout the area.'
14303: '@rIt was a grand mixture of laughter and his death throes.@k@rAnd Kinzo became wine and meat and bread.'
14304: '@rAn aroma if slurped, a rich taste if gnawed, and pleasant to tear to bits!'
14305: '@rThe voice of his death throes lingered on sweetly,@k and adorned with melted chocolate and silver dragees, it would make a wonderful dessert!'
14306: '@rIf you took the bones home, you could also use them for a soup,@k and the remains could even become toys for the children to play with,@k and they could also become good tools for fortune-telling that always gave misfortune!'
14307: '@rThat entire scene, ......was watched by the piece of furniture.@k@rIt was all fantastical.@k ...It was all demonic.'
14308: '@r...Was the quaking of its heart, which should have been paralyzed, ...proof that it could still feel fear?'
14309: '@rJust then, its knees buckled, and the furniture''s body tumbled onto the center of the carpet.@|@y'
14310: '@rBecause the witch had kicked those knees from behind.'
14311: 'BEATRICE@r@v27/20701584."Kneel and show your respect.@k@v27/20701585. Rub your forehead against the carpet and show how vulgar you are.@k@v27/20701586. Join your hands behind your back and swear that you will offer all your flesh and blood to me."'
14312: 'Battler@r@v10/20101267."..................u............ah........."'
14313: '@rThe piece of furniture let out a painful voice.'
14314: '@r...Fear is the most primal emotion Humans have.@k@r...Was that emotion reviving his sense of self, which should already have been killed?'
14315: 'BEATRICE@r@v27/20701587.".........Hmph.@k@v27/20701588. So, you are still far from being appropriate for my furniture."'
14316: 'BEATRICE@r@v27/20701589."Good!@k @v27/20701590.I will carefully make you into the kind of furniture I like, the kind appropriate only for me.@k@v27/20701591. ...I suppose the best you can do for now is simply entertaining the guests!"'
14317: '@rThe goat nobles were surrounding the cowering furniture...@k@rIt seemed that their blazing, blood-red eyes couldn''t hide their ecstasy at this new young food that they had been given.'
14318: '@rAnd from their mouths, from which protruded countless ugly teeth, saliva,@w500. ...or maybe the traces of meat and wine that they had just eaten, dribbled down...'
14319: 'Battler@r@v10/20101268.".........e............eeeeeeeeeeeeeeeeeeeeeeeeeek!!"@|@y'
14320: '@rAs the piece of furniture let out a wild scream, it retreated, still sitting on its backside.'
14321: '@r...But the circle of goat nobles was closing in...'
14322: '@rAnd the piece of furniture looked at the witch''s face.@k ...It stared at her face one final time, believing that because it had submitted to the witch, she would show it some mercy.'
14323: '@rBut there was nothing but scorn on the witch''s face, and she wasn''t even facing it anymore.'
14324: '@rThe witch went off to greet an honored guest with whom she had crossed gazes...'
14325: '@rThe goat nobles looked down upon the furniture.'
14326: '@rThey were, in fact, waiting.'
14327: '@rJust like how one must remove the cork in order to drink champagne,@k before bringing the offering served at the banquet to their mouths, they were waiting for just one of those.'
14328: '@rOf course, the furniture didn''t know what that was.'
14329: '@r...But it would come out of his mouth all by itself.@k In the same way there is always a pop when the cork is removed, it too would certainly leave his mouth.'
14330: 'Battler@r@v10/20101269."...G...@v10/20101270.......yaa...@v10/20101271.ahiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiIII!!!"@|@y'
14331: '@rA scream.@k@rIt was a sign that the modest banquet at which he was to be served...had begun.'
14332: 'Battler@r@v10/20101272."Gyaaaaaaaaaaaaaa@|@y@v10/20101273.gebukikyakyakaku@|@y@v10/20101274.oooogaageoe@|@y@v10/20101275.ooooaaaaaaaaaaaaaaaaaaaaaaaaa@|@y@v10/20101276.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@|@y@v10/20101277.aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaah...!!!"@|@y'
14333: '@rGapupogyugukigukiboryu.'
14334: '@rBy now the rose garden was a garden of roses and gold.@k A gold-colored garden where gold butterflies, gold fairies, gold lizards rampaged and flew about wildly.'
14335: 'Rosa@r@v12/21400893."Maria, hurry!!@k @v12/21400894.Run!!@k @v12/21400895.Hurry hurry hurry hurry!!"'
14336: '@rHolding onto the gun and the blanket wrapping the ingot,@k Rosa ran at a speed Maria couldn''t catch up with, sometimes pausing to call out at Maria to run faster.'
14337: '@rTherefore, she saw it every time.@k@r...She saw the golden pursuers chasing them from the mansion!'
14338: '@rThe mass of gold butterflies was chasing after them like a massive crawling hand!!@k And horrifyingly strange-looking shadowy figures with goat heads were chasing after them...!!'
14339: '@rThere was no need for her to strain her eyes.@k Because those blazing pupils told her what would happen if she was captured.'
14340: 'Maria@r@v13/20400533."......Mama, wait,@v13/20400534. Mama, wait......@v13/20400535. ...Uu-uu,@v13/20400536. ......au!!"@|@y'
14341: '@rMaria tripped over.'
14342: '@rRosa, ashamed that for just an instant she had entertained thoughts of abandoning her daughter and running away, kicked back against the ground and instantly reversed direction.'
14343: '@rAs Rosa''s own child tried to stand,@k the goat-head that had sprinted over to get the first bite grabbed a fistful of her hair and pulled her up from the back...!!'
14344: 'Maria@r@v13/20400537."Mamaaaaaaaaaaaaaaaaaaaa,@|@y@v13/20400538. noooooooooooooooooooooooooooo!!"'
14345: '@rRosa rammed into the goat-head with her shoulder,@|@y spun,@|@y bashed the back of her elbow into the goat''s jaw,@|@y and buried her knee into its protruding chest!!@|@y'
14346: '@rAnd she thrust the barrel of the gun inside the goat-head''s mouth as it doubled over from the pain in its gut!'
14347: 'Rosa@r@v12/21400896."......Just try laying one finger on Maria in front of me.@k@v12/21400897. I''ll show you just how lukewarm the hell you came from is."'
14348: '@rThe blast from the 45-caliber Long Colt bullet exploded inside the goat-head''s throat,@k and its medulla oblongata was instantly pulverized.'
14349: '@rThe goat-head couldn''t understand.'
14350: '@rIt had thought that women were like already opened wine bottles!@k@rIt had thought that they were wine bottles, and that turning them upside down would immediately cause their deep-red contents to come out!'
14351: 'Maria@r@v13/20400539."Mama!!@k @v13/20400540.Mamaaaaaa!!"'
14352: '@rReleased, Maria flung her arms around Rosa.'
14353: '@rBut the pursuers were still coming!@k They could see the giant goat-heads, who had given up even pretending to be Human, running towards them from across the rose bushes.'
14354: '@rRosa spilled several extra bullets, which had been in the pocket of her coat, all over the place, and told Maria to pick them up.'
14355: 'Maria@r@v13/20400541."Y-yes...!@k @v13/20400542.Pick up, pick up...!!"'
14356: 'Rosa@r@v12/21400898."Maria.@k@v12/21400899. If Mama falls down,@k@v12/21400900. run.@k@v12/21400901. Go to the shore.@k@v12/21400902. And swim, and swim, and swim!@k @v12/21400903.There''s no place on this island where we can survive!!"'
14357: 'Maria@r@v13/20400543."N-no!!@k @|@y@v13/20400544.Together with Mama!!@k @v13/20400545.Uuu!!"'
14358: '@rRosa''s gun roared four times.@k But even though she really did land four shots in the chest of the massive, approaching goat, it didn''t even flinch!!'
14359: '@rThe goat ran with a violent vigor, as though it planned to crush Rosa and Maria with its massive body!!'
14360: 'Rosa@r@v12/21400904."Put the bullets in!!@k @v12/21400905.Quickly!!"@|@y'
14361: 'Maria@r@v13/20400546."U-uu!!"'
14362: '@rRosa grasped the blanket with the ingot in both hands,@k and she herself sprinted at the goat, dragging the ingot along behind her!!@k Without even an ounce of fear of that strange-looking giant!!'
14363: '@rIf it''s to protect my daughter, I''ll overcome even hell!!'
14364: 'Rosa@r@v12/21400906."I''ll show you...@k@|@y@v12/21400907.what a golden dream looks liiiiiiiiiiike!!!"@|@y'
14365: '@rRosa''s roar.@k The goat-head''s roar.'
14366: '@rThe terribly heavy ingot, after picking up a terrible centrifugal force and speed, slammed into the goat-head''s cranium.'
14367: '@rRosa pulled a fountain pen from her pocket.@k But she held it crooked.@k She placed it in her palm,@k in the gap between her middle finger and her ring finger, so that it stuck out when she made a fist, almost like it was a stinger growing out.'
14368: '@rShe jabbed that stinger into the left eye of the goat-head as its head toppled forward.@k Was the goat-head''s roar a scream?'
14369: '@rBut Rosa''s roar was different.'
14370: '@rShe pulled back her fist and slammed it into the fountain pen that was still sticking into the goat-head''s eye.@k The pointed tip was gouged destructively into the depths of its head...!'
14371: 'Maria@r@v13/20400547."Mama, bullets in!!"'
14372: 'Rosa@r@v12/21400908."Good job!!"'
14373: '@rAs I grabbed the gun Maria had thrown, I finally heard the thunderous crash of the giant tumbling to earth.@|@y'
14374: '@rHowever, at the same time, I saw the goat-head pursuers on the other side of the rose bushes increase in number.@k I''ve gained some distance, more than enough now!'
14375: '@rHolding onto the gun and the blanket wrapped around the ingot, I once again ran with Maria.'
14376: '@r...Why am I running with a gun in my right hand and the gold in my left?'
14377: '@rWhy don''t I free one hand and grasp Maria''s hand...?!!'
14378: '@rI can''t let go of the gun that protects my body.@k@rI can''t let go of the gold that protects my future.'
14379: '@rAnd yet I would let go of the hand of my daughter, who is my very future...?!'
14380: '@rRun.@k Run. Run.'
14381: '@rShe got out of the rose garden and began to run down the staircase through the grove of trees.'
14382: '@rBut Rosa knew.@k This path through the grove was only turning and twisting many times to make it seem long.@k She tore straight through it!'
14383: '@rShe had always played here since she was a kid.@k@rSo she knew!'
14384: '@rTo the beach. To the beach.@k To the sea, to the sea, to the sea.'
14385: '@rAnd after reaching the sea?'
14386: '@rNothing to do but swim, swim swim, if Maria can''t swim, I''ll carry her as I swim!!'
14387: '@rThere is nothing but death on this island!'
14388: 'Rosa@r@v12/21400909."Kya!!!"@|@y'
14389: 'Maria@r@v13/20400548."Mamaaaa?!"'
14390: '@rAs she raced down the stairs, she took a bad step.@k@rA violent pain ran up her left ankle and her mind went completely blank.'
14391: '@rRosa fell down several stairs, and stared in shock at her ankle, which was bent at an odd angle.'
14392: '@r...And the blanket with the ingot wasn''t there.@k She had let go of it the instant she fell, and it had disappeared somewhere into the darkness.'
14393: '@rOnly the gun was left.'
14394: '@rThe tremors in the earth were getting closer.@k@rIt was only a matter of time before the goat-heads flooded in.'
14395: '@rShe didn''t want to imagine how many there would be, or how strange they would look.'
14396: '@rThe lightly dancing gold pursuers arrived.'
14397: '@rThe gold butterflies surrounded Rosa and Maria, sparkling and clamoring as though saying "the prize is here, the prize is here".'
14398: '@rRosa couldn''t even try to get up.@k@rThe violent pain from her broken ankle was so great that she couldn''t ignore it, even in her last moments.'
14399: '@rAaaaaaaaaaaaah, what am I doing...@k@rI had the gold, it would have been worth several million yen.'
14400: '@rI might have been able to start over with that!!@k And yet I fell, lost it, and that''s not all, my own life is in danger, even Maria''s life is in danger?!'
14401: '@r......What has my life been?!!!'
