8644: '@rFor the cultural festival today, she had formed a group with her friends,@k and would be performing casual pop-rock on a temporary stage.'
8645: '@rShe had kept on preparing and practicing for that, and was really looking forward to today,@k .........but there was one thing that had been worrying her.'
8646: '@rShe looked at the clock.@k ...There was still a little time, ...but she was uneasy.'
8647: '@rWould he really come?'
8648: '@rAs she was about to breathe out a stress-relieving sigh, her heart jumped as all her friends suddenly started speaking in shrill voices.'
8649: '@r@v99/FreFA2001."No wayyyy, Hina''s boyfriend''s a to~tal stud!!"'
