8686: '@rJessica buried her head in her favorite cushion to hide the fact that her face had grown bright red.'
8687: '@rAnd she bit away at her thumbnail...@k@r...It really was a reaction to be appreciated.'
8688: '@rShannon and Jessica were about the same age, of the same gender, and they were also friends.'
8689: '@rAnd they were both right in the middle of puberty.@k@rThey could never talk enough about things related to love.@k@rThat''s why they were able to be open with each other about these topics.'
