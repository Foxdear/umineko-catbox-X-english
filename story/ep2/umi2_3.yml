8676: 'Jessica@r@v04/20200151."Y-y-@v04/20200152.......you think so?@k @|@y@v04/20200153....No,@v04/20200154. but,@v04/20200155. ...I''d feel bad for Kanon-kun......"'
8677: 'Shannon@r@v15/20500395."Then I think you''re out of options...@k@v15/20500396. How about meekly confessing to everyone that you don''t have a boyfriend?"'
8678: 'Shannon@r@v15/20500397."...Oh, sure, sure, that may well cause you to experience some shame,@k@v15/20500398. but you would only have to endure for the short and yet oh so loooong time before graduation.@k@v15/20500399. To those couples in love, there''s no sweeter honey than the face of a single person with an inferiority complex☆"'
8679: 'Jessica@r@v04/20200156."Sha-Shannonnnn~!!@|@y@k @v04/20200157.You aren''t really worrying for my sake, are you, you''re teasing meeeeee!!"'
8680: '@rJessica wrestled about with Shannon, her eyes teary.@k@rBut Shannon was unconcerned, laughing with her usual smile.'
8681: 'Shannon@r@v15/20500400."Yes,@k@v15/20500401. this is to get you back for making fun of me and George-sama all the time."'
8682: '@rAt that comeback of Shannon''s, the likes of which didn''t happen even once a year, Jessica rolled around on her bed hugging her cushion, writhing and suffering.'
8683: '@rShannon''s triumphant smile was unbearably frustrating, but right now, she was the only person Jessica could talk with.@k She could wait until later to suffocate her with a cushion.'
