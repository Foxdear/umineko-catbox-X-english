8840: '@rIn any case, he thought that if Natsuhi-sama heard it, she would probably faint.'
8841: '@rBut everyone looked like they were having a really good time.'
8842: '@rThe die-hard fans, who had even brought pen-lights, sang along,@k dancing crazily with the exact same movements, almost as though it had been planned ahead.'
8843: '@rOn the stage, Jessica-sama also sang enthusiastically, dripping with sweat.'
8844: '@r.........He couldn''t find a single element that was appropriate for a daughter of the Ushiromiya family,@w416. ...but it looked like she was having a lot of fun.'
8845: '@r@v99/awase0011."""Jessie-samaaaaaaaa!!@|@y@k @v99/awase0012.Jessiiiiie, Jessiiiiiiiiiiie!!!"""@|@y'
8846: 'Jessie@r@v04/20200210."Thank you!! OK, next up, we''ve got a brand new one for you! Don''t Call Me An Ordinary Magician!!"'
8847: '@r...I couldn''t keep up with the atmosphere, but...@k......anyway, Milady was full of life and looked like she was having a great time.'
8848: '@rAs I looked at Milady having a great time, I thought...'
8849: '@rIsn''t this what Ushiromiya Jessica is really like?'
8850: '@r...Don''t I know better than anyone just how badly life on Rokkenjima kills your own sense of self?'
8851: '@rThen the time she spends, ...not as Milady, the successor to the Ushiromiya family,@k but as a single girl called Jessica, living life to the fullest, must be very important to her.'
8852: '@r...I worked close to Milady, saw her in all seasons, and I thought I knew everything about her.'
8853: '@r...But that was only a single limited side of her, Milady of Rokkenjima.'
8854: '@r......We are furniture.@k@rWe serve on Rokkenjima, and end our lives on Rokkenjima.'
8855: '@r...So I had come to think that Rokkenjima itself was our whole world, as though—just like in the old geocentric theories—@kthe ocean spilled off the end of the world into an abyss.'
8856: '@rBut as I looked at Milady like this, I realized that this was a horribly narrow outlook.'
8857: '@r...I still couldn''t keep up with the excitement of the crowd.'
8858: '@r...But I felt like I had seen something that "cannot be ''seen''" on Rokkenjima.'
8859: '@r.........Although I don''t know if that was the ''unseeable'' thing Shannon was talking about.'
8860: '@rI still can''t see the ocean as blue...'
8861: 'Krauss@r@v02/20800023."Wasn''t today the cultural festival at Jessica''s school?@k@v02/20800024. ...Has the principal been doing well?"'
8862: 'Natsuhi@r@v03/20900039."...Yes, he seemed to be in good health.@k@v03/20900040. Oh, that''s right, Ms. Takamiya was also there.@k@v03/20900041. She was particularly insistent that I give you her regards."'
8863: 'Krauss@r@v02/20800025."Hmm, busy as usual?"'
8864: 'Natsuhi@r@v03/20900042."It appeared so.@k@v03/20900043. She is a very energetic person.@k@v03/20900044. Oh, yes, there was also President Enomoto."'
8865: '@rNaturally, the topic of Jessica''s cultural festival came up at dinner.'
8866: '@rSchool events often became social gatherings for influential people.@k@rIt was the same for the Ushiromiya family, who were big names around this area.'
8867: '@rAs Natsuhi remembered the names of the important people at the social, she updated Krauss on the news concerning them.'
8868: '@r...Jessica didn''t really have any interest in that discussion, and rudely slurped her pumpkin soup.'
8869: 'Genji@r@v14/21600001."......Milady.@k@v14/21600002. I would hesitate to call those appropriate manners."'
8870: 'Jessica@r@v04/20200211."............Yeah yeah, sorry ''bout that."'
8871: 'Natsuhi@r@v03/20900045."Jessica.@k@v03/20900046. I am always telling you to do something about your speech."'
8872: 'Jessica@r@v04/20200212."......Yes."'
8873: '@rJessica answered, discouraged.@k@rWhen he saw that, Krauss smiled a little and interrupted his conversation with Natsuhi.'
8874: 'Krauss@r@v02/20800026."How was the festival for you, Jessica?"'
8875: 'Jessica@r@v04/20200213."Huh?@k @v04/20200214.Ah,@v04/20200215. ......well, okay!"'
8876: 'Natsuhi@r@v03/20900047."I was watching.@k@v03/20900048. You did a good job."'
8877: 'Jessica@r@v04/20200216."Huh, ......huh?!@k @|@y@v04/20200217.Ah, ......ahahahaha, y-yeah, I guess!"'
8878: '@rJessica''s face turned bright red.'
8879: '@r...She probably hadn''t thought that Natsuhi would actually come to see her on the stage.'
8880: '@rShe felt a mix of happiness and embarrassment.'
8881: '@rActually, she hadn''t wanted her mother to watch because she didn''t want to be told that her music was inappropriate for the Ushiromiya family.'
8882: '@r......But it wasn''t as though it didn''t make her happy to hear her parent say that she did a good job after watching her try her best...'
8883: 'Natsuhi@r@v03/20900049."You appeared with both composure and dignity.@k@v03/20900050. Fitting behavior for the students'' representative."'
8884: 'Jessica@r@v04/20200217_1."...ah,@v04/20200217_2. ............oh,@v04/20200217_3. ...yeah."'
8885: '@rThe smile that had been there a second ago crumbled like sand.@k@r...Jessica immediately realized that she was talking about something different.'
8886: '@rJessica was also the school''s student president.'
8887: '@r...She had no interest in something so annoying, but her parents had been pushy so she had grudgingly accepted.'
8888: '@rUnfortunately, she was popular in school, so she had won the election easily.'
8889: '@rSo Natsuhi was praising her for the ceremony organized by the student council at the beginning of the cultural festival.'
8890: '@rActually, she had just carried that out halfheartedly.@k@rShe had immediately met up with her friends, and had held a stage rehearsal for the rest of the time...'
8891: 'Krauss@r@v02/20800027."The experience of standing above people and bearing responsibility will definitely be useful in the future.@k@v02/20800028. It will surely help you mature as a member of the Ushiromiya family."'
8892: 'Natsuhi@r@v03/20900051."But you spoke the greeting a little quickly.@k@v03/20900052. You passed on content, but your fast style of speech dilutes it.@k@v03/20900053. It would be good if you developed a habit of taking a breath every once in a while."'
8893: 'Jessica@r@v04/20200218."............yeah."'
8894: '@rAfter she finished eating, Jessica didn''t feel like going straight to her room.'
8895: '@rYou could say that her room was the place where her parents had specified for her to be.'
8896: '@rSo maybe you could say that, for Jessica,@k choosing not to return to her own room and instead disappearing to an unknown location in this large mansion was a meager form of resistance...'
8897: '@rJessica felt that even being in the mansion made it hard to breathe, so she went outside to the rose garden.'
8898: 'Jessica@r@v04/20200219."...............@k@v04/20200220. ...Well, even if she had come, she''d just have said something about how it wasn''t appropriate for the successor to the Ushiromiya family anyway.@k@v04/20200221. ...So what the hell''s my problem.@k@v04/20200222. Ahahahahahaha."'
8899: '@rJessica laughed at what she was sulking over.'
8900: '@r...Laughed at what kind of words she would have had to receive to be satisfied.'
8901: '@r......Ridiculous.@k In the end, I''m just a spoiled little kid.@k@rI can''t believe myself—it''s almost funny.'
8902: 'Kanon@r@v16/20600119."......Milady."'
8903: 'Jessica@r@v04/20200223."wah!—Kanon-kun...@k@v04/20200224. D-don''t scare me like that, hahaha...!@k @|@y@v04/20200224_1.*cough*cough*!"'
8904: '@rKanon had suddenly started talking to her just as she had tried to force a laugh, so she choked.'
8905: 'Jessica@r@v04/20200225."What?@k @v04/20200226.Something to say...?"'
8906: 'Kanon@r@v16/20600120.".....................@v16/20600121.umm."'
8907: 'Jessica@r@v04/20200227."......Yeah?"'
8908: '@rJessica''s expression had become the one Kanon always saw.@k@rThe listless Jessica from a second ago was gone.'
8909: '@rIf he still only knew Jessica as the successor to the Ushiromiya family, as he did until today,@k ...he would have mistakenly thought that Jessica''s mood had sprung back to normal.'
8910: '@r......But that was wrong.'
8911: '@rHe now knew a part of her that he could not ''see'' until today, so he understood that there was no way that, on the inside, Jessica was just as she appeared.'
8912: 'Jessica@r@v04/20200228."Ah... About today''s cultural festival...@v04/20200229. ...Well, thanks for coming with me so I could show off.@k@v04/20200230. You really helped."'
8913: 'Kanon@r@v16/20600122."......Your singing.@k@v16/20600123. ...It was good."'
8914: 'Jessica@r@v04/20200231."Wha?!@k @v04/20200232.......Ah,@v04/20200233. .........ahahahahahaha?!@k @v04/20200234.Re-really? I''m embarrassed..."'
8915: '@rEven though she had heard the words she had most wanted to hear,@k ...Jessica became shy, and couldn''t accept them frankly.'
8916: 'Kanon@r@v16/20600124."......I cannot sing.@k@v16/20600125. And I don''t know how to play any instruments other than the harmonica and the recorder, which I learned in elementary school.@k@v16/20600126. ...So I had just assumed that you were the same, Milady."'
8917: '@r...Kanon hadn''t been consciously looking down on Jessica to that degree.'
8918: '@rBut people playing unique instruments were always on the other side of the cathode ray tubes in the TV.'
8919: '@r...He had got it into his head that it would be impossible for Jessica, at least.'
8920: 'Kanon@r@v16/20600127."...I am furniture.@k@v16/20600128. ...So I didn''t believe there was any need to sing or play instruments."'
8921: '@rBut...@w500....I''m not sure anymore.'
8922: 'Jessica@r@v04/20200235."......Kanon-kun,@k@v04/20200236. seriously, enough with that phrase "I am furniture"...@k@v04/20200237. That''s some kind of servant''s mentality, right...?@k @v04/20200238.That "servants should be living furniture" thing.@k@v04/20200239. ...Genji-san says it a lot."'
8923: 'Kanon@r@v16/20600129."It isn''t a mentality......@k@v16/20600130. ...We really are...furniture."'
8924: 'Jessica@r@v04/20200240."I know the kids from the Gospel House...receive assistance from Grandfather in various ways...@k@v04/20200241.and I realize you feel gratitude for that."'
8925: 'Jessica@r@v04/20200242."......But that doesn''t mean...you should call yourself furniture.@k@v04/20200243. Aren''t you a human like us?"'
8926: 'Kanon@r@v16/20600131."........................"'
8927: 'Jessica@r@v04/20200244."Kanon-kun, when you saw me singing, ...what did you think?"'
8928: 'Kanon@r@v16/20600132."......It looked like you were having a lot of fun."'
8929: 'Jessica@r@v04/20200245."That''s probably not it."'
8930: 'Kanon@r@v16/20600133."......Huh?"'
8931: 'Jessica@r@v04/20200246."It wasn''t that I looked like I was having fun,@k@v04/20200247. ...you were jealous, weren''t you?"'
8932: 'Kanon@r@v16/20600134."...............@v16/20600135. I......"'
8933: '@rEven Kanon himself probably hadn''t noticed that emotion.@k@r......Kanon had seen something he had never seen before, never known of before...and had probably become jealous.'
8934: '@rAnd to trick himself about that emotion, he had called himself furniture over and over...'
8935: 'Jessica@r@v04/20200248."I know I''m the successor to the Ushiromiya family or something,@k@v04/20200249. ......and, well, I''m sure there''ll be a lot of annoying stuff to do in the future too.@k@v04/20200250. As far as that goes, I''ve just gotta resign myself to it—I was born under an unlucky star."'
8936: 'Jessica@r@v04/20200251."...Probably, just like you had to live at the Gospel House, neither of us have a choice.@k@v04/20200252. We couldn''t choose the stars we were born under."'
8937: 'Kanon@r@v16/20600136."...............That may be true."'
8938: 'Jessica@r@v04/20200253."But there''s one part where you and me are completely different.@k@v04/20200254. ...Know what that is?"'
8939: '@rI am furniture, and you are not.@k@r......He was about to say that, but stopped.'
8940: 'Kanon@r@v16/20600137."...I don''t know."'
8941: 'Jessica@r@v04/20200255."Kanon-kun, you think that your own fate is everything about you, and you gave up.@k@v04/20200256. I can''t accept this kind of fate, so I decided to do the best I can."'
8942: 'Jessica@r@v04/20200257."......So as well as my normal constrained self who has to act as the daughter of the Ushiromiya family,@k@v04/20200258. I''ve created another self who pours all her heart into the things she likes."'
8943: 'Kanon@r@v16/20600138.".........Another...self."'
8944: 'Jessica@r@v04/20200259."Yeah.@k@v04/20200260. ......Kanon-kun, you''ve been telling yourself "I am furniture".@k@v04/20200261. ......I''m sure there''s been many tough things that have forced you to tell yourself that."'
8945: 'Jessica@r@v04/20200262."...I think that''s...@v04/20200263....really unfortunate.@k@v04/20200264. .........But for that to determine your entire life, that feels so sad to me."'
8946: 'Kanon@r@v16/20600139."................................."'
8947: 'Jessica@r@v04/20200265."You know, people can always make another self inside themselves that they can really grow to like.@k@v04/20200266. This isn''t escaping from reality, okay?@k @v04/20200267.......When I''m that other part of myself, I can really feel like I''m living a great life."'
8948: 'Jessica@r@v04/20200268."So no matter how constrained and boring everyday life is, I can definitely live without suffocating."'
8949: 'Kanon@r@v16/20600140."......To make...@v16/20600141....another self that you can really grow to like...@v16/20600142.inside yourself..."'
8950: '@rTo make another me, which isn''t furniture...'
8951: '@rThrough her relationship with George-sama, has Shannon given birth to a part of herself that isn''t furniture?'
8952: '@r......And did this other Shannon...see something that cannot be ''seen'' by furniture?'
8953: 'Jessica@r@v04/20200269."Yeah.@k@v04/20200270. .........Well, I don''t know anything about your private life, Kanon-kun.@k@v04/20200271. But, ...I can sorta guess.@k@v04/20200272. Your private life is...probably...nothing at all.@k@v04/20200273. Bulls-eye...?"'
8954: '@rKanon couldn''t reply, but that was answer enough.'
8955: '@rHe had no concept of a private life.'
8956: '@rSo Kanon would always be Kanon.@k@rSo furniture would always be furniture.'
8957: 'Jessica@r@v04/20200274."......Kanon-kun, that "Kanon" isn''t your real name, right?"'
8958: '@rThe Gospel House gave new students new families and a new life, so it also made a point of giving each of them a new name.'
8959: '@r......In his case, that was "Kanon".'
8960: 'Kanon@r@v16/20600143.".........Certainly, ......that name of mine may be a temporary thing."'
8961: '@rHe had thought that he wasn''t anyone other than Kanon.'
8962: '@r......But he remembered.@k@r...There definitely had been a part of himself that wasn''t Kanon.@k@rBut that was far, far away, beyond the distant fog of oblivion...'
8963: 'Jessica@r@v04/20200275."So even for you, it should be alright to have times when you''re Kanon-kun, and times when you aren''t.@k@v04/20200276. ......Maybe the Kanon-kun you are when you act as a servant calls himself furniture and strictly limits his own will."'
8964: 'Jessica@r@v04/20200277."......But when you aren''t Kanon-kun, I think it''s alright to live much, much more freely."'
8965: '@rThose words definitely weren''t just lip-service.'
8966: '@rJessica had also been like this in the past.@k@rShe had cursed her own birth into an environment different from all of her friends at school.'
8967: '@rShe had been the only one in a heavily constricted environment, forced to learn various things,@k and she had even received words about the friends she played with.'
8968: '@r......Though she had been sad about that, she had given up, thinking that she had just been born under that kind of star.'
8969: '@rBut one day, Jessica had stopped giving up and surrendering.'
8970: '@rStuff like the Ushiromiya family customs and pressure, those didn''t matter.'
8971: '@rShe created a real "Jessica" inside herself, who could do what she really wanted to do.'
8972: 'Jessica@r@v04/20200278."You know, I''m called by this nickname Jessie in school.@k@v04/20200279. So when I''m Jessie, I live life honestly and to the fullest.@k@v04/20200280. And because of that, I can do my best when I''m Jessica too."'
8973: 'Jessica@r@v04/20200281."...Maybe you too could have times when you''re Kanon,@k@v04/20200282. and times when you''re, umm,@k@v04/20200283. ......your real name, and live a different way in each.@k@v04/20200284. ......When you aren''t Kanon, ...can''t you try being another self who you can grow to like?"'
8974: 'Kanon@r@v16/20600144."..................When...I am not Kanon."'
8975: '@rHe had thought that his real name didn''t matter at all.@k@rSo he had thought Kanon was all he was.'
8976: '@rAnd now Jessica was saying that he should create a new existence, another self that wasn''t Kanon.'
8977: 'Jessica@r@v04/20200285."......Kanon-kun,@k@v04/20200286. if you don''t mind, tell me.@k@v04/20200287. ......What''s your...real name?"'
8978: 'Kanon@r@v16/20600145."................................."'
8979: '@rHe was silent for quite some time.'
8980: '@rMaybe his real name had risen to the tip of his tongue.'
8981: '@r...After hesitating for a long time over whether he should say it,@k ...in the end,@w833. ...he swallowed it back down.'
8982: 'Kanon@r@v16/20600146."......I forgot.@k@v16/20600147. ...My name doesn''t matter anymore."'
8983: '@rThose words signified a slight rejection.'
8984: 'Kanon@r@v16/20600148."No matter what kind of real name I had,@k@v16/20600149. ......the only truth now is that here, I am Kanon.@k@v16/20600150. The past has nothing to do with anything.@k@v16/20600151_b. ......Just as it does not matter the name of the tree from whose trunk a piece of furniture was originally made."'
8985: 'Jessica@r@v04/20200288."......I said stop that!@k @v04/20200289.You aren''t furniture, you''re human, you know?!"'
8986: 'Kanon@r@v16/20600152."I am not human!"'
8987: '@rKanon clearly spoke his refusal.@k@r......It was with a rage that he normally didn''t show.'
8988: '@rJessica couldn''t say anything back, and was struck silent...'
8989: 'Kanon@r@v16/20600153."...You are human, Milady.@k@v16/20600154. So you are free to live any way you like,@k@v16/20600155. and any kind of future is possible for you.@k@v16/20600156. It''s almost like you have wings and can dance through the sky like a bird."'
8990: 'Kanon@r@v16/20600157."But I am not like that.@k@v16/20600158. Even if you see me as a bird, I am nothing more than a domestic duck.@k@v16/20600159. ......They may have wings, but they cannot fly."'
8991: 'Kanon@r@v16/20600160."To speak of that dream of flight despite that,@v16/20600161. ......that''s just...@v16/20600162.too cruel...!"'
8992: 'Jessica@r@v04/20200290."...Furniture, ducks!!@k @v04/20200291.What the hell is all this!!@k @|@y@v04/20200292.............No, ..."'
8993: '@rJessica had unconsciously gone along with Kanon''s forceful manner of speaking, but she realized that she shouldn''t fire back, and swallowed her words.'
8994: 'Jessica@r@v04/20200293."...............I don''t know anything about you.@k@v04/20200294. I don''t even know your upbringing, and I don''t know the hardships you''ve been through.@k@v04/20200295. ...So I can''t even imagine why you started calling yourself furniture."'
8995: 'Jessica@r@v04/20200296."......But know this.@k@v04/20200297. You aren''t furniture or a duck.@k@v04/20200298. You''re a real human."'
8996: 'Kanon@r@v16/20600163."................................."'
8997: 'Jessica@r@v04/20200299."If you want to say that the Kanon-kun working as a servant is furniture, that''s alright.@k@v04/20200300. ......But, ...in that case,@k@v04/20200301. ......don''t you think you can make another self for when you aren''t furniture, when you''re human?"'
8998: 'Kanon@r@v16/20600164."......Only a human like you can embrace that possibility.@k@v16/20600165. ...I am not like that.@k@v16/20600166. I have no future, no possibilities, and no dreams I am permitted to see."'
8999: 'Kanon@r@v16/20600167."............So, Milady.@k@v16/20600168. Please don''t...@v16/20600169.say any more...@v16/20600170.....cruel things......"'
9000: 'Jessica@r@v04/20200302."Why...@k@v04/20200303. Why......are you saying that..."'
9001: 'Kanon@r@v16/20600171."Because it seems that you are mistaking me for...a human just like you, Milady.@k@v16/20600172. We are different beings.@k@v16/20600173. I just wanted to make that clear."'
9002: 'Kanon@r@v16/20600174."......I heard from Shannon.@k@v16/20600175. Something about you taking a liking to me."'
9003: 'Jessica@r@v04/20200304."Huh, ......huh?!@k @v04/20200305.Ah, .........no, wahaha..."'
9004: 'Kanon@r@v16/20600176."...I look almost identical to a human.@k@v16/20600177. Therefore, .........like Shannon, maybe I could delude myself that I am human, and for a time, pretend to love."'
9005: 'Kanon@r@v16/20600178."...But that would surely be fooling myself.@k@v16/20600179. No, it would also be fooling you, Milady.@k@v16/20600180. Shannon and George-sama will definitely fall apart.@k@v16/20600181. ...Shannon herself must understand that day will come, and yet she does this...stupid..."'
9006: 'Jessica@r@v04/20200306."There, ......there''s nothing stupid about it!!@k @v04/20200307.Sure, George nii-san''s a brilliant person, and he''s bearing both of his parents'' expectations."'
9007: 'Jessica@r@v04/20200308."...And yeah, when it comes to marriage, I''m sure Auntie Eva''s gonna interfere in a bunch of ways, and, umm, I think they''ve got a really tough road ahead of them, alright?!@k @v04/20200309....But you know, George nii-san isn''t the kind of guy who''ll surrender to all that!@k @v04/20200310.He won''t turn Shannon into Juliet, he''ll definitely make her happy!!"'
9008: 'Kanon@r@v16/20600182."People and furniture cannot love one another.@k@v16/20600183. ...I am trying to say that even if you can love furniture, I cannot love you, Milady."'
9009: 'Jessica@r@v04/20200311."..................nn—"'
9010: '@rThose words of Kanon''s......crushed all of Jessica''s bittersweet feelings from today.'
9011: '@rThere was no way she could have anticipated the emotions of such a blunt rejection...'
9012: '@rIn an instant, she lost the willpower that had caused her to try and unravel something stubborn in Kanon''s heart,@k ...and before she knew it, she was just standing there in shock...'
9013: 'Kanon@r@v16/20600184."......Milady, if your feelings for me are due to my conceit, then I beg for your forgiveness."'
9014: 'Jessica@r@v04/20200312."...N-......no.@k@v04/20200313. ...Well, uh, ...I won''t deny it."'
9015: 'Kanon@r@v16/20600185."......Thank you very much."'
9016: 'Jessica@r@v04/20200314."Huh...?"'
9017: 'Kanon@r@v16/20600186."For thinking of me as a human,@v16/20600187. ...thank you very much.@k@v16/20600188. Just those feelings truly make me happy.@k@v16/20600189. ......And anything more would be too cruel, so..."'
9018: 'Jessica@r@v04/20200315."No, tha-...that''s enough.@k@v04/20200316. ...Umm,@v04/20200317. .........sorry."'
9019: '@rJessica scratched at her head as she spoke, and tried to force her voice to sound bright.'
9020: 'Jessica@r@v04/20200318."......I just kinda...@v04/20200319....ran on ahead by myself,@v04/20200320. ...and caused you trouble.@k@v04/20200321. ...I''m honestly sorry.@k@v04/20200322. I''m really sorry...for using up your whole day off."'
9021: 'Kanon@r@v16/20600190."No.@k@v16/20600191. ......I was also...happy that I could see you having fun."'
9022: 'Jessica@r@v04/20200323."...Then, let''s be done for the night.@k@v04/20200324. ......If I don''t go back to my room and turn off the lights, Mom will get mad at me again.@k@v04/20200325. ...Hahaha."'
9023: 'Kanon@r@v16/20600192."That would probably be most appropriate.@k@v16/20600193. ...I wish you a good night, Milady."'
9024: 'Jessica@r@v04/20200326."......Yeah.@k@v04/20200327. ............Good night........."'
9025: '@rJessica turned her back to him, and slowly trodded away, looking disheartened.'
9026: '@rBut suddenly, she started dashing pell-mell, and disappeared in the direction of the mansion...'
9027: '@rAs he watched her go, ...for just an instant,@k Kanon was tormented by the feeling that he had just made a huge mistake.'
9028: '@r...But, no, he thought, this had not been a mistake at all.'
9029: '@r......It was for her sake that he''d been forced to refuse her now, while her pain was still at its smallest.'
9030: 'BEATRICE@r@v27/20700315."............Nice going, making a woman cry like that.@k@|@y@v27/20700316. *cackle*cackle*.@k@v27/20700317. I didn''t expect you to refuse her that strongly.@k@v27/20700318. ......Had you answered normally, another pair of lovers would have been born with my magic."'
9031: 'Kanon@r@v16/20600194."How long have you been there...?@k@v16/20600195. .........You''re just horrible."'
9032: '@rWhen he turned around, the witch was suddenly there.@k@r...It looked like she had been there the whole time, enjoying their performance as if it were a play.'
9033: 'BEATRICE@r@v27/20700319."I shall forgive your reckless words towards me just this once in deference to that pleasant show.@k@v27/20700320. ......Even after one thousand years, no more interesting show exists than complications between men and women.@k@v27/20700321. To me, it''s an addictive pleasure sweeter than any other.@k@v27/20700322. ......nn?"'
9034: '@rKanon pulled that butterfly brooch out of his pocket.@k@rIt was the crystallization of the great magic that the witch had bestowed.'
9035: '@rWithout hesitation, Kanon flung it hard onto the ground and stomped on it.'
9036: 'BEATRICE@r@v27/20700323."......Hoh?@k @v27/20700324.What is the meaning of this, when you know that was something given by me?"'
9037: 'Kanon@r@v16/20600196."Just now, I figured it out.@k@v16/20600197. ......What you are doing isn''t as tasteful as being a cupid of love.@k@v16/20600198. You are just a demon who enjoys showing love to those who can never be joined, and deceiving them."'
9038: 'BEATRICE@r@v27/20700325."...............Hmph.@k@v27/20700326. ...You are free to think that.@k@v27/20700327. Most humans I have lent my power to have said the same thing."'
9039: 'Kanon@r@v16/20600199."Don''t play dumb!!@k @v16/20600200.You didn''t lend Shannon your power because you felt sorry for her.@k@v16/20600201. ...You took advantage of a weak point in Shannon''s heart as it burned with love, and made her break the mirror that sealed you.@k@v16/20600202. And that''s not all,@v16/20600203. ...you''re toying with her, when you know very well how it''s all going to end!@k @v16/20600204.Am I wrong?!"'
9040: 'BEATRICE@r@v27/20700328."Hehheheheheh, *cackle*!@k @v27/20700329.Furniture is a thoroughly pitiful existence.@k@v27/20700330. So you have no dreams, no future, and even no love?@k@v27/20700331. Good, good, there is nothing better than knowing your place.@k@v27/20700332. *cackle*cackle*!"'
9041: 'Kanon@r@v16/20600205.".........khh..."'
9042: 'BEATRICE@r@v27/20700333."Just as you suspected, there was a faint love growing in Jessica''s heart.@k@v27/20700334. You are under the impression that you have snipped it out, harvested it."'
9043: 'BEATRICE@r@v27/20700335."......But did you know?@k @v27/20700336.Trees grow thicker branches if you thin them out, instead of letting them grow rampant. ......A girl who loves furniture, interesting, truly interesting!@k @v27/20700337.Shannon and George will also eventually reach a stalemate with their unfulfillable love, and will bear just the kind of large fruit I like."'
9044: 'BEATRICE@r@v27/20700338."However, to my regret, they''ve been getting on so well that it just isn''t interesting, you see?@k @v27/20700339.In that respect, I think you two shall entertain me greatly, *cackle*cackle*!"'
9045: '@rThe witch laughed.@k Even though she had known that the two could not be joined, she had lent magic to join them together.'
9046: '@rHowever, they couldn''t escape the fate that made it impossible for them to be joined.'
9047: '@r......The witch knew that.'
9048: '@rEven if they were joined, the relationships of Shannon and George, Kanon and Jessica would fail for certain,@k and as they wandered through the eternal desert in the hell of love, they would be tormented by eternal thirst...!'
9049: 'BEATRICE@r@v27/20700340."Did you think I would lend them that power without any compensation?@k @v27/20700341.I''ll lend a hand in love.@k@v27/20700342. And my compensation shall be one ticket to watch the cruel fate that the two of them will eventually meet.@k@v27/20700343. Even after one thousand years, no better show exists...!"'
9050: 'BEATRICE@r@v27/20700344."Just look at Kinzo.@k@v27/20700345. See how he ended up, an old, pitiful man who knew the taste of love and was thrown out of Paradise!@k @v27/20700346.Look at how he lives, like a dead man who can''t fully die.@k@v27/20700347. *cackle*cackle*!!"'
9051: 'Kanon@r@v16/20600206."You really are a witch.@k@v16/20600207. Get out of my sight, you demon...!!"'
9052: 'BEATRICE@r@v27/20700348."......I shall disappear regardless.@k@v27/20700349. My power still hasn''t returned, you see.@k@v27/20700350. It is still tiring to continue showing myself."'
9053: 'BEATRICE@r@v27/20700351."......I overdid it when I gave you lovers my power.@k@v27/20700352. ...As I am now, it will not be easy to maintain that power without that brooch as a catalyst."'
9054: '@rKanon ground his foot even more into the stomped brooch.@k@rHe felt it break under his foot.'
9055: '@rThen, it dissolved as if into water,@k and changed into butterflies that sparkled gold, which fluttered away from beneath Kanon''s foot...'
9056: 'BEATRICE@r@v27/20700353."I also find it a little difficult to continue preserving this form.@k@v27/20700354. As you ask, I will hide myself for a brief period.@k@v27/20700355. Just as there is no tide that does not rise, and no moon that does not wax, my magical power will surely become whole again.@k@v27/20700356. ...And there will surely come a time that is appropriate for my revival."'
9057: 'BEATRICE@r@v27/20700357."......I cannot imagine whether that will be tomorrow, next year, or even one hundred or one thousand years in the future.@k@v27/20700358. But as long as there are those that entertain me, I will surely gain power and revive.@k@v27/20700359. ......I will disappear for a short while, until that time comes."'
9058: 'BEATRICE@r@v27/20700360."The bruise on the palm of your hand is already gone,@k@v27/20700361. so if you wish, tomorrow morning, you can let my existence disappear like an illusion or a dream.@k@v27/20700362. ......There is nothing more saddening for me than to be forgotten."'
9059: 'BEATRICE@r@v27/20700363."However, I will definitely be revived.@k@v27/20700364. Make sure that you won''t regret that day''s coming at any time.@k@v27/20700365. I will surely have my second coming and control everything as this island''s true master.@k@v27/20700366. ...And at that time, the door to the Golden Land will be opened again.@k@v27/20700367. ...The covetous and the greedy shall call me forth without fail...!"'
9060: 'Kanon@r@v16/20600207_b."...Enough!!@k @v16/20600207_c.Disappear, now, Golden Witch...!!"'
9061: '@rLeaving behind a mocking laugh, the witch turned into a flight of gold butterflies, and scattered away.'
9062: '@r...The whole area sparkled like a gold blizzard in a snow globe.'
9063: '@rIt was a fleeting fantastical scene that disappeared in a heartbeat...'
9064: '@rThe witch could no longer be seen.@k ...However, Kanon felt like he could still hear that shrill, unpleasant laugh...'
9065: 'BEATRICE@r@v27/20700369_1.......Aahh, how entertaining, how entertaining.@k@r@v27/20700369_2.Why is the human world so entertaining after such a long absence?!'
9066: 'BEATRICE@r@v27/20700369_3_a.Go insane with love. Go insane with gold.@k@r@v27/20700369_4_a.Those that don''t go insane from those are not human!'
9067: 'BEATRICE@r@v27/20700369_5.I see, then the word furniture is fitting indeed, *cackle*cackle*!'
9068: 'BEATRICE@r@v27/20700369_6.Furniture is created to serve humans.@k@r@v27/20700369_7.And I toy with and tyrannize those humans to ease my thousand years of boredom.@k@r@v27/20700369_8.What a truly entertaining rock-paper-scissors situation, that I cannot control furniture!'
9069: 'BEATRICE@r@v27/20700369_9.Kinzo, your enterprises are truly interesting!@k@r@v27/20700369_a.Furniture, try and see if you can hunt me...!'
9070: 'BEATRICE@r@v27/20700369_b.Tonight, two seeds of love have been sown.@k@r@v27/20700369_c....Including the one already sown, that makes three!'
9071: 'Kinzo@r@v01/21500021."BEATRICE...@k@v01/21500022. Why...did you leave me alone in this painful world...?@k@v01/21500023. ......I detest you.@k@v01/21500024. You are yearned after this much, and yet make no attempt to answer... I will detest you for all eternity!"'
9072: 'Genji@r@v14/21600003."My lord, drinking any more will be damaging to your health.@k@v14/21600004. ...Haven''t you also been warned by Doctor Nanjo?"'
9073: 'Kinzo@r@v01/21500025."Be silent, Genji!!@|@y@k @v01/21500026.You do not understand, you do not understand my grief and sadness!@k @v01/21500027.Even though I believed that as my oldest friend, at least you would understand my pain!!@k @v01/21500028.Why is it so incomprehensible to you?!"'
9074: 'Kinzo@r@v01/21500029."Oooooohhh, BEATRICEEEE,@v01/21500030. why did you leave me alooooone......?!!"'
9075: 'Genji@r@v14/21600005."..........................."'
9076: 'Jessica@r@v04/20200328."Uuuuughhu!@k @v04/20200329.Hic, hic...!@k @v04/20200330.What the hell is all that furniture stuff?!@k @v04/20200331.What is all that crap...!@k @v04/20200332.Uuuuuuuuuughhu!!"'
9077: 'Kumasawa@r@v18/21800001."......Ohhh, how heartrending, Jessica-sama.@k@v18/21800002. ...Even though her crying voice that I can hear from her room tells me of the situation, there is nothing I can do."'
9078: 'Kumasawa@r@v18/21800003."...This is all a tragedy due to people who are too young getting too close, when the positions of their birth are too distant.@k@v18/21800004. ...I can do nothing but understand Milady''s feelings, and walk away quietly with silent feet..."'
9079: 'Shannon@r@v15/20500410."...Umm,@v15/20500411. ...wh-@v15/20500412.what...@k@v15/20500413.......do you mean by that,@v15/20500414. George-san...?"'
9080: 'George@r@v07/20300194."I mean what I said.@k@v07/20300195. ......I still haven''t built up my castle.@k@v07/20300196. Once I have, I will be able to think of myself as an adult for the first time.@k@v07/20300197. ......When that happens, I want to marry you."'
9081: 'Shannon@r@v15/20500415."......Tha-@v15/20500416....that''s, umm,@v15/20500417. ......err..."'
9082: 'George@r@v07/20300198."But,@k@v07/20300199. my heart won''t let me do just that anymore.@k@v07/20300200. ......So I want to give you an engagement ring."'
9083: 'Shannon@r@v15/20500418."En-...engagement...@v15/20500419....you say...@k@v15/20500420. But, umm,@v15/20500421. ......I''m...@v15/20500422. ......f-@v15/20500423.............furniture........."'
9084: 'George@r@v07/20300201."That''s right.@k@v07/20300202. And furniture has to listen to what people say."'
9085: 'George@r@v07/20300203."...I am currently having a ring made that''s worthy to be a gift for you.@k@v07/20300204. I think I''ll probably be able to bring it to the family conference coming up soon.@k@v07/20300205. I''ll give it to you then, so please, I want you to let me hear your answer."'
9086: 'George@r@v07/20300206."......If you accept my engagement proposal,@k@v07/20300207. I will proclaim right there, to all of the relatives, including Grandfather, my engagement to you."'
9087: 'Shannon@r@v15/20500424."Geor-......George-san............"'
9088: 'George@r@v07/20300208."I''m sure some people won''t approve of our relationship.@k@v07/20300209. ...But there''s no need to look at their faces.@k@v07/20300210. ...Because you only have to fill your eyes with me."'
9089: 'George@r@v07/20300211."I will definitely make you happy.@k@v07/20300212. That, I promise you, definitely."'
9090: 'BEATRICE@r@v27/20700369_d.I look forward to seeing how it will ripen!'
9091: 'BEATRICE@r@v27/20700369_e.The gold butterflies do not swoop upon the juice of overripe and rotting fruit.'
9092: 'BEATRICE@r@v27/20700369_f.I cannot wait for the day of harvest to come!@rIs the time of the banquet here yet?!@r*cackle*cackle* hahahahahahahahahahahahahahahahahahahahaha...!!'
