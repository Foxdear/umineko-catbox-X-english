8701: 'Shannon@r@v15/20500406."People who aren''t honest about their feelings, such as you, Milady,@v15/20500407. ...what was that word again, I learned it from George-sama.@k@|@y@v15/20500408. That''s right, they call them "@btsundora.@<tundra@>".@k @v15/20500409.Apparently they will be quite popular a few decades from now, you know?"'
