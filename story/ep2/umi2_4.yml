9093: '@rThey had eaten breakfast at a coffee shop in the station building.'
9094: '@r...By chance, the inside of the shop had been decorated with Halloween colors, since it was October.'
9095: '@rIt seemed that Maria had really taken a liking to that.'
9096: '@rEver since, she had been making a fuss inside the train about wanting to have a Halloween festival, without caring that she was attracting the attention of others.'
9097: '@rHalloween is popular in Europe and America, but people are hardly familiar with it at all in Japan.'
9098: '@rThe shopping district was colorfully decorated with orange pumpkins,@k but the costume parades of children demanding sweets and saying "trick or treat" were nowhere in sight.'
9099: 'Maria@r@v13/20400001."Uu!@k @v13/20400002.I want a Halloween festivaaal!@k @v13/20400003.I don''t want to wear these clothes, I want to look like a wiiiitch!@k @v13/20400004.Uu-uu!"'
9100: 'Rosa@r@v12/21400001."The family conference isn''t for playing.@k@v12/21400002. We''re going to meet Grandfather, so you have to dress up nice."'
9101: '@rWhile it wasn''t completely full inside the train, there were enough people here that almost all of the seats were occupied.'
9102: '@rAmong them, Maria was making a fuss, kicking her feet back and forth in her seat, while Rosa scowled at her.'
9103: '@rRosa had told her many times in a low voice to stop, but Maria was taking no notice whatsoever.'
9104: '@r...Once Maria gets this way, no matter how much you try to explain the situation or calm her, she doesn''t listen.'
9105: '@rIn the past, Rosa used to pamper Maria and give in to her at times like this.'
9106: '@rBut, that had probably been the problem.'
9107: '@rAlmost certainly, the young Maria had formed the wrong impression that if she kept complaining noisily, her mother would give in, and listen to her.'
9108: '@rThat error had been brought to Rosa''s attention through an educational book, and since then, she had hardened her heart so as not to pamper her beloved daughter...'
9109: '@rBut Rosa could manage less and less mutual understanding with Maria, and it had become more and more common that she felt discouraged by her own powerlessness...'
9110: 'Maria@r@v13/20400005."Halloween, Halloween!!@k @v13/20400006.Trick or treat, uu-uu-uu!!"@|@y'
9111: 'Rosa@r@v12/21400003."I''m not giving you any sweets!@k @v12/21400004.You just ate breakfast!"'
9112: 'Maria@r@v13/20400007."Trick or treat!@k @v13/20400008.Trick or treat!@k @v13/20400009.Uu-uu-uu!!"@|@y'
9113: '@rAs Maria kicked her feet, a stout old woman sitting in the seat across from Maria picked a candy out of her handbag and gave it to her.'
9114: 'Maria@r@v13/20400010."Uu! Got a treat, got a treat!@k @v13/20400011.Look, look, Mama,@|@y@v13/20400012. Mama!@|@y@k @v13/20400013.Happy Hallowee~n!"@|@y'
9115: 'Rosa@r@v12/21400005."Maria! You can''t just accept sweets from strangers, remember?!@k @v12/21400006.Return it!!"'
9116: '@r@v99/EldF2001."It''s alright, hoh-hoh-ho.@k@v99/EldF2002. She''s a lovely young lady.@k@v99/EldF2003. How old is she?"'
9117: '@rThere may not have been any malice in those words from the old woman.@k@r...But it seemed that Rosa had taken that in an extremely humiliating way.'
9118: 'Rosa@r@v12/21400007."Maria! I''m always telling you not to accept sweets from strangers!!"'
9119: 'Maria@r@v13/20400014."Uu!@k @v13/20400015.Uu!!@|@y@k @v13/20400016.This one''s mine!!@k @v13/20400017.Uu-@|@y@v13/20400018.uu!!@|@y@k @v13/20400019.No, it''s mine!!"@|@y'
9120: 'Rosa@r@v12/21400008."Let go of it!@k @v12/21400009.Don''t I always tell you to listen to what Mama says?!!"'
9121: 'Maria@r@v13/20400020."It''s miiine!!@k @v13/20400021.Miiiine!!@k @v13/20400022.Uu!!@|@y@k @v13/20400023.Uuu-uuu!!"@|@y'
9122: 'Rosa@r@v12/21400010."I told you, stop making that childish whining noise!!"'
9123: 'Maria@r@v13/20400024."Uu-uu-uu-uu-uu-uu-uu-uu!!!"'
9124: '@rRosa reflexively hit Maria violently on her cheek.@k@r...In a flash, Maria started crying loudly.'
9125: '@rRosa immediately snatched the candy from Maria''s hand and stuck it out towards the dumbfounded old woman sitting next to them.'
9126: 'Rosa@r@v12/21400011."...Please, do not just give sweets to my daughter!"'
9127: '@r@v99/EldF2004."...............I''m, ...I''m very sorry."'
9128: '@rBreathing heavily, Rosa once again held the candy out to the old woman.'
9129: '@r...The woman looked confused for a moment about what she should say,@k but then understood that perhaps her actions may have caused trouble for this parent and child, and she accepted the candy back, apologizing...'
9130: '@rThen, Rosa finally took notice of her surroundings...'
9131: '@rHer daughter''s clothes were all messed up, she was crying and shouting with her nose dripping,@k and there were many dumbfounded passengers watching them.'
9132: '@r...Except for the sound of the train running, the railcar was completely silent.'
9133: '@rFortunately, that pitiful silence didn''t last more than a short while.@k@r...However, in its place came an even more painful atmosphere as everyone whispered.'
9134: '@rMaria shouted, cried, kicked and stomped her feet as usual, paying no heed to the people sitting around her.'
9135: '@r...Impulsively, Rosa tried to slap her again,@k but she noticed the cold eyes of the people in the train, and couldn''t do that anymore.'
9136: '@rWhen the train stopped, Rosa got off, forcibly pulling Maria by the arm, and almost dragging her along the ground.'
9137: '@rAs usual, Maria didn''t stop crying.'
9138: '@rRosa took her to the end of the platform and hit her cheek again.'
9139: '@rAt the moment she was hit, Maria stopped crying for an instant, but before long, she shouted and cried even more than before.'
9140: '@rRosa, whose emotions had exploded, grabbed Maria by her collar, and pulled her hair as if to rip it out.'
9141: 'Maria@r@v13/20400025."Uu!!@k @v13/20400026.Uu-uu-uu!!@k @v13/20400027.Uu!!@k @v13/20400028.Mama, it hurts, Mama, it hurts!!@k @v13/20400029.Uu-uu-uu!!"'
9142: 'Rosa@r@v12/21400012."Can''t you hear me, I''m telling you to shut up!!@|@y@k @v12/21400013.That "uu-uu" of yours!@k @v12/21400014.I''m telling you to STOP it!!"@|@y'
9143: 'Rosa@r@v12/21400015."That''s the reason you can''t make friends in class, don''t you get it?!@k @v12/21400016.Get ahold of yourself!!@k @v12/21400017.Why are you always a kindergartner inside your head?!!@|@y@k @v12/21400018.Why can''t you do what Mama says?!!@k @v12/21400019.Why!!@k @v12/21400020.WHY!!!"'
9144: '@rAlong with those severe words, Rosa hit Maria''s head over and over again.@k@rThe more Maria cried and shouted, the more Rosa hit her.@k@rAnd the more Maria was hit, the more intensely she cried and shouted...'
9145: 'Maria@r@v13/20400030."Mama, it hurts...!@k @v13/20400031.Mama, it hurts...!@k @v13/20400032.Mama, save me, Mama, save me...!@k @v13/20400033.Uu-uu-uu-uu!!"'
9146: 'Rosa@r@v12/21400021."WHY can''t you just STOP that whining?!!@|@y@k @v12/21400022.It''s because you''re like this that you can''t make friends!!@k @v12/21400023.It''s because you''re like this that Papa never comes back from his business trip!!@k @v12/21400024.It''s because you''re like this that I...!!"'
9147: '@r@v99/StaA2001."E-...excuse me, ...madam, is something the matter...?"'
9148: 'Rosa@r@v12/21400025."Is there something...that you want...?!"'
9149: '@rThe one who timidly called to her was the station attendant.@k@rRosa glared at him with a look that said "don''t cut into the problems of a mother and child, stranger".'
9150: '@rThe station attendant surely hadn''t wanted to talk to her.@k@rHowever, Rosa had been yelling on the platform for a much longer time than she had imagined.'
9151: '@r...Her emotional scolding had caused the passengers on the platform to advise the station attendant that it would be a good idea to speak to her.'
9152: '@rRosa yelled at the station attendant that they would get on the next train and not to bother them anymore.'
9153: '@r...And then, finally, or maybe we should say, for the second time, ...she noticed the passengers on the platform staring at her from the distance.'
9154: '@r......Rosa sweated slightly; she felt the wind chill the sweat, tormenting her.'
9155: '@rMaria was still crying, shielding her own head.@k@r......No - unless this beating stopped, she would probably keep crying forever.'
9156: 'Rosa@r@v12/21400026."........................@v12/21400027.......I''ve...@v12/21400028.............done it again......"'
9157: '@rAs Rosa recovered from the evil heat inside her head,@w500. ...she knew she had surrendered her soul to something bad again.'
9158: 'Maria@r@v13/20400034."Mama, Mama!@k @v13/20400035.Mama, come back...!@k @v13/20400036.Uu!@k @v13/20400037.Uu-uu-uu-uu!!"'
9159: '@rRosa fell to her knees and hugged Maria, whose face was all soggy with tears and mucus.'
9160: 'Rosa@r@v12/21400029."......Maria... I''m sorry... I''m sorry..."'
9161: 'Maria@r@v13/20400038."Mama, ......Mama...@k@v13/20400039. Welcome back, welcome back......"'
9162: '@rFinally, ...Maria realized that her mother had turned back to being her mother.@k@rThen, she clung to her mother''s body and cried, burying her face in her mother''s chest.'
9163: 'Rosa@r@v12/21400030."...Forgive your bad mama...@k@v12/21400031. Forgive your bad mama...@k@v12/21400032. ......I''m so...sorry...!@k @v12/21400033.Please don''t hate your mama......."'
9164: 'Maria@r@v13/20400040."Uu...@k@v13/20400041. I''m perfectly fine...@k@v13/20400042. Won''t hate Mama.@k@v13/20400043. ......Mama was just being possessed by an evil witch again.@k@v13/20400044. ...But Mama came back, so it''s okay."'
9165: 'Rosa@r@v12/21400034."Yeah... ......Yeah...@k@v12/21400035. ......Mama was...being possessed by an evil witch again...@k@v12/21400036. ...I''m sorry, ......I''m really sorry......."'
9166: '@rFor a long time, the two of them hugged each other, asking for forgiveness and sending words of forgiveness back.'
9167: '@rAfter a while, the two of them gradually calmed down and naturally drew their faces apart.'
9168: '@rMaria''s face, Rosa''s face - both were deep red after crying their eyes out.'
9169: 'Rosa@r@v12/21400037."...Do you want to have a Halloween festival, Maria?"'
9170: 'Maria@r@v13/20400045."Yeah.@k@v13/20400046. ...I wanted to show the pumpkin marshmallow to George onii-chan and Jessica onee-chan......"'
9171: '@rThat was a sweet which had been alongside the cash register at the shop where they had eaten breakfast.'
9172: '@r......It was a fancy sweet that had a big orange marshmallow in the shape of a jack-o''-lantern stuck on the end of a stick.'
9173: '@rMaria had wanted that and had insistently pestered for it.@k@r...Rosa had disallowed it, saying that there was no way she would buy such a sweet right after they''d had breakfast.'
9174: 'Rosa@r@v12/21400038."......Okay, then, Maria.@k@v12/21400039. ......I don''t know if they sell those in this town or not, but let''s get off and try searching for one, okay?"'
9175: 'Maria@r@v13/20400047."u, ......yeah!@k @v13/20400048.Love you Mama, love you so much...@k@v13/20400049. Thank you..."'
9176: 'Rosa@r@v12/21400040."I love you too, Maria......."'
9177: '@rThe truth was that they had no time to waste loitering around at a stopover station.@k@rIf they missed the airplane, they would fall half a day behind schedule.'
9178: '@rShe should have left home with more time to spare, but she had ended up leaving late after spending too long choosing Maria''s clothes.'
9179: '@r...Because of that, Rosa had been a bit impatient since the morning.'
9180: '@rShe looked at the clock.@k ...They should be getting on the next train immediately.'
9181: '@rBut her daughter had firmly joined hands with her to go buy the sweet together, and that hand was warm.'
9182: '@r...To Rosa right now, it was more important to regrow her bonds with Maria.'
9183: '@r...Maria was not only Rosa''s beloved daughter, ...she was everything Rosa had.'
9184: '@rFortunately, she could see that there was a big supermarket right in front of the station.@k@r...Maybe she wouldn''t be able to find a sweet exactly like that one, but Maria would probably accept something similar.'
9185: '@rBesides, Rosa also couldn''t show up with a face swelled from crying.@k@rShe would have to fix her makeup.'
9186: 'Rosa@r@v12/21400041."We might not find a marshmallow exactly like that one, ...but I hope we can find a sweet that''s similar.@k@v12/21400042. ......And let''s surprise all your cousins with it."'
9187: 'Maria@r@v13/20400050."Yeah.@k@v13/20400051. ...If it''s a sweet I bought together with Mama, anything is fine."'
9188: '@rThe two left the turnstiles of the station in this unknown town.@k@rMaria walked across the pedestrian crossing together with her mother, feeling very pleased, as though she was walking in an amusement park.'
9189: '@rBoth faces were still deep red,@k ......but warmth could be seen between the two of them, mother and child, as they smiled at each other awkwardly...'
9190: 'Natsuhi@r@v03/20900054.".........Dear.@k@v03/20900055. What are you doing in a place like this?"'
9191: 'Krauss@r@v02/20800029."Oh, it''s you.@k@v02/20800030. .........It''s nothing.@k@v02/20800031. It''s just that this was a pleasant place to think."'
9192: 'Natsuhi@r@v03/20900056."...I have finished all the preparations for today.@k@v03/20900057. For now, shall we relax and wait while drinking some tea?"'
9193: 'Krauss@r@v02/20800032.".........Sorry.@k@v02/20800033. I''m always pushing all my problems on you."'
9194: 'Natsuhi@r@v03/20900058."...Please.@k@v03/20900059. Can''t you rely on me more?@k@v03/20900060. ...I am your wife."'
9195: 'Krauss@r@v02/20800034."......Naturally, I''m grateful for you always coming to my aid.@k@v02/20800035. ......For that very reason, I am able to devote myself to my work."'
9196: 'Natsuhi@r@v03/20900061."I understand that.@k@v03/20900062. ......About your work.@k@v03/20900063. ......And the topic of Father''s inheritance, right?"'
9197: 'Krauss@r@v02/20800036."............That has nothing to do with you.@k@v02/20800037. It''s nothing more than my greedy siblings scavenging for rotten meat."'
9198: 'Natsuhi@r@v03/20900064."......It''s alright, dear.@k@v03/20900065. ...Everything will work out.@k@v03/20900066. Your work has never once turned out badly."'
9199: 'Krauss@r@v02/20800038."....................."'
9200: '@rNatsuhi softly cuddled close to Krauss''s shoulder.'
9201: '@rShe spoke words to reward Krauss for the difficulties of his work, ...but Natsuhi was herself the one who knew best that it wasn''t going well.'
9202: '@r...Krauss''s enterprises were something like a seesaw where large amounts of money swung.'
9203: '@rA big investment leads to a large return,@k but the swaying of a large-scale seesaw is large yet sluggish, and not something which shows immediate results.'
9204: '@rAt times, he would make more investments so that the seesaw inclined faster towards the good side.'
9205: '@r......Naturally, he did that because he had the confidence that, in a not-so-distant future, he would be able to recover all the investments made.'
9206: '@r......However, the seesaws Krauss chose never turned out as he would have liked them to.'
9207: '@r...His foresight wasn''t wrong, ......but times were slow.@k@rThey never caught up with him.'
9208: '@rFor example, think of a literal seesaw, placed in a park.'
9209: '@rDue to its great popularity, there was always someone playing on it, so if he wanted to play, he would have to wait a long time for his turn.'
9210: '@r...And then, one day, he found that seesaw vacant, straddled it realizing he was the first to arrive, and had it all to himself.'
9211: '@rHowever, ...nobody got on the opposite side of the seesaw, so he couldn''t play on it.'
9212: '@rAnd no matter how much time passed, nobody came to the opposite side of the seesaw.'
9213: '@rThe seesaw is a popular piece of playground equipment, so if you waited, another person would definitely show up.'
9214: '@r......Krauss noticed.'
9215: '@rThe weather looked like it was getting worse.@k@rThat''s why nobody was coming outside to play.'
9216: '@rBut the seesaw is a popular piece of playground equipment, so someone would definitely come.'
9217: '@r...If he vacated his place because the weather seemed to be getting worse, someone would definitely snatch his place away,@k and he would end up only longingly gazing from a distance, at someone else having fun playing on the seesaw again...'
9218: '@rOn one side of the seesaw, he continued to wait patiently, all alone...@k@rThat was Krauss''s current enterprise, and situation.'
9219: 'Krauss@r@v02/20800039."............If only I''d had a bit more courage, ...and the self-confidence to believe in my own foresight...@k@v02/20800040.I''d never once......have failed."'
9220: 'Natsuhi@r@v03/20900067."...Yes, that''s true.@k@v03/20900068. Your foresight is never wrong.@k@v03/20900069. ......You are the only one who inherited Father''s gift.@k@v03/20900070. You inherited an innate disposition that none of the other siblings did."'
9221: 'Krauss@r@v02/20800041."......Yet, I was unable to believe in it!@k @v02/20800042.I always closed my own projects like a coward.@k@v02/20800043. ......Why can''t I trust myself?!@k @v02/20800044.Who would trust a man who can''t trust himself?@k @v02/20800045.Nobody!!"'
9222: 'Krauss@r@v02/20800046."......I''m always sitting myself down in the seats where the losers must sit;@v02/20800047.@|@y ......my father, my mother,@v02/20800048.@|@y ...and my siblings, all of them sneer at me...@k@v02/20800049. How long before I am set free of this complex......@k@v02/20800050. How long........."'
9223: '@r...Only Natsuhi knew.'
9224: '@rShe knew of Krauss''s anguish.@k As the eldest son of the Ushiromiya family, who would have to shoulder a big responsibility, he couldn''t open his pained heart to anyone, and would always be compared to his father''s great enterprises...'
9225: 'Natsuhi@r@v03/20900071.".........I have finished all the preparations, so you can devote yourself to the family conference.@k@v03/20900072. ...All of them."'
9226: 'Krauss@r@v02/20800051."............Sorry.@k@v02/20800052. ......Will there be any problems...@k@v02/20800053....with Father?"'
9227: 'Natsuhi@r@v03/20900073."No.@k@v03/20900074. ......Genji and Doctor Nanjo are on our side.@k@v03/20900075. ...I''ll never allow those greedy siblings to meet Father."'
9228: 'Gohda@r@v17/21700001."Hello, Gohda here.@k@|@y@v17/21700002. ......Yes, please leave it to me!@k @v17/21700003.I''m anxious to put my skills to work for the big annual job."'
9229: '@rIngredients of varied colors had been gathered in the kitchen, and the preliminary arrangements had already been started.'
9230: '@rEven though it was still morning, the ingredients for dinner were already in saucepans and steaming.'
9231: '@rNormally, he had to deal with several assorted matters other than cooking, but on the day of the family conference, he could devote himself to it entirely.'
9232: '@rTo Gohda, who was originally a chef, this was surely the greatest gala occasion of the whole year.'
9233: 'Gohda@r@v17/21700004."Yes, dinner will be an excellent calf steak...!@k @v17/21700005.A wonderful cut of meat is already in the refrigerator anxiously waiting for tonight.@k@v17/21700006. Please, let the other servants know to look forward to tonight - I will not disappoint them either."'
9234: '@rIt was rare for Gohda to be in this good of a mood towards his fellow servants.'
9235: '@rTo Gohda, who boasted about being a chef who worked exclusively for the Ushiromiya family, being given the right to show off his cooking at the family conference was the greatest honor.'
9236: 'Genji@r@v14/21600006."......OK.@k@v14/21600007. I''m leaving it in your hands.@k@v14/21600008. ...Also, is Kumasawa there?"'
9237: 'Gohda@r@v17/21700007."Kumasawa-san?@k @v17/21700008.I happened to see her earlier, but she is not here.@k@v17/21700009. I wonder if she went to make preparations at the guesthouse."'
9238: 'Genji@r@v14/21600009."......So she''s loafing around again.@k@v14/21600010. ......No, that''s fine.@k@v14/21600011. Alright then, I''m counting on you."'
9239: 'Gohda@r@v17/21700010."Yes, leave everything to me...!"'
9240: '@rGenji placed the telephone back on the receiver, sighing lightly.'
9241: '@rThinking of Kumasawa, who was no doubt hiding and slacking off even though things were this busy,@k and the ostentatious Gohda, who only felt like doing anything on a day when he could show off, Genji sighed once again.'
9242: 'Shannon@r@v15/20500425."Excuse me.@k@v15/20500426. All the rooms in the guesthouse have been prepared."'
9243: 'Kanon@r@v16/20600208."......We received instructions from Milady to make preparations for four people so that the children can stay there - what shall we do?"'
9244: 'Genji@r@v14/21600012."...I hear Battler-sama is coming this year for the first time in six years.@k@v14/21600013. I guess Milady wants to stay up late with the other three cousins.@k@v14/21600014. ......Get them ready.@k@v14/21600015. No need to tell Madam."'
9245: 'Shannon@r@v15/20500427."I see.@k@v15/20500428. Certainly."'
9246: 'Kanon@r@v16/20600209."......So tonight, we''ll have the late-night shift, followed immediately by the morning shift tomorrow.@k@v16/20600210. It looks like these two days will be tiresome."'
9247: 'Shannon@r@v15/20500429."Speaking of that, the weather forecast is saying a typhoon will strike right over here...@k@v15/20500430. Will that be alright?"'
9248: 'Genji@r@v14/21600016."...Unless the typhoon diverts greatly, it may affect the family''s boat trip back, depending on circumstances.@k@v14/21600017. The family conference schedule may drag on until about Monday or Tuesday.@k@v14/21600018. ......It will probably be a long haul, but I ask you both to be careful not to make any blunders."'
9249: 'Genji@r@v14/21600019."............Shannon, relax and don''t panic.@k@v14/21600020. Kanon, be sure to greet them with courtesy."'
9250: 'Shannon@r@v15/20500431."......Y-yes.@k@v15/20500432. I''ll be careful."'
9251: 'Kanon@r@v16/20600211."...I''ll be careful."'
9252: 'Genji@r@v14/21600021."Today we will be entertaining a very important guest.@k@v14/21600022. ...Make extra sure that everything goes smoothly."'
9253: 'Kanon@r@v16/20600212."......I understand fully.@k@v16/20600213. ...Any guest who visits here is important."'
9254: 'Genji@r@v14/21600023."Kanon.@k@v14/21600024. ......We welcome, today,@v14/21600025. an important guest in the truest sense.@k@v14/21600026. Make sure you''re prepared."'
9255: 'Kanon@r@v16/20600214."......Yes."'
9256: 'Genji@r@v14/21600027.".........Shannon, what''s wrong?@k @v14/21600028....You''ve been looking restless... Did you promise to be somewhere?"'
9257: 'Shannon@r@v15/20500433."Huh?@k @v15/20500434.N-no, it''s nothing.@k@v15/20500435. My apologies..."'
9258: 'Kanon@r@v16/20600215."Nee-san.@k@v16/20600216. An important guest will be arriving today.@k@v16/20600217. ...Detach yourself from your private life."'
9259: 'Shannon@r@v15/20500436."I don''t, ...I don''t know what you mean by private life..."'
9260: '@rAs Shannon blushed just a bit, she turned her gaze away from the clock.'
9261: '@r......Was it about time for the airplane carrying the family to arrive at Niijima?@k@r...She had thought she had been hiding the fact that her long-awaited reunion with George was making her heart palpitate, but Kanon, who stood at her side, understood her perfectly.'
9262: 'George@r@v07/20300213.".........Shannon, please accept this from me without a word...!"'
9263: '@r...Inside a bathroom stall, George was practicing something over and over, taking out a small velvet box hidden in his pocket like a quick-draw desert gunman.'
9264: 'George@r@v07/20300214."That''s not it...@k@v07/20300215. Shannon likes a man with traction.@k@v07/20300216. It, it must have a more powerful feel to it...!"'
9265: 'George@r@v07/20300217."Shannon, put this on your ring finger.@k@|@y@v07/20300218. ...Tha-that''s an order, okay...?"'
9266: 'George@r@v07/20300219."Aah, if I don''t say properly that it''s on the left hand, maybe she''ll put it on the right hand!@k @v07/20300220.N-no, Shannon isn''t that ignorant,@k@v07/20300221. aaah, but, if there''s no free will, that''d be a little, I mean,@v07/20300222. uuuuuu, nnnnuuuuuuu, muuuuuuuaaaaaaaaahhhh...!!"'
9267: '@rAs he crossed his arms, moaning and groaning, someone knocked on the door.@k@rGeorge was startled back to reality.'
9268: 'Rudolf@r@v08/21200001."Hey, George-kun.@k@v08/21200002. You alright?@k @v08/21200003.Got a stomachache or something?"'
9269: 'George@r@v07/20300223."Ah, ahahahaha, Uncle Rudolf...!@k @v07/20300224.It''s alright, I''m fine!@k @v07/20300225.No need to worry, ahahahahahaha...!"'
9270: 'Rudolf@r@v08/21200004."You sure...?@k @v08/21200005.OK then.@k@v08/21200006. Don''t strain too much.@k@v08/21200007. Your ass''ll burst."'
9271: '@rRudolf washed his hands, laughing cheerfully, and left.'
9272: '@r...George knew that the most embarrassing part hadn''t been overheard, and he patted his chest in relief...'
9273: 'Rudolf@r@v08/21200008."Kyrie, isn''t Rosa here yet?"'
9274: 'Kyrie@r@v09/21300001."Not yet.@k@v09/21300002. She''s pretty late."'
9275: 'Rudolf@r@v08/21200009."It''s a good thing the weather''s delaying our flight.@k@v08/21200010. If the schedule had been like normal, she''d have missed the plane by now.@k@v08/21200011. What would she have done then?"'
9276: 'Kyrie@r@v09/21300003."...Rosa-san is an adult now.@k@v09/21300004. She''d manage it somehow.@k@v09/21300005. No matter how old they get, older brothers always treat their younger sisters like children."'
9277: 'Battler@r@v10/20100001."Dad''s always a kid, no matter how old he gets."'
9278: 'Rudolf@r@v08/21200012."What''d you say? If I''m a kid, that''d make you a baby.@k@v08/21200013. Come on, Battler-chan, up ya go~!"'
9279: 'Battler@r@v10/20100002."Stop it, that tickles, wahahaha, stooop!"'
9280: 'Kyrie@r@v09/21300006."You two look more like a couple of naughty kids than a father and son.@k@v09/21300007. ...Look, she''s here."'
9281: 'Hideyoshi@r@v06/21100013."Ohoooooooooh!!!@k @v06/21100014.If it isn''t Rosa-san!@k @v06/21100015.Maria-chan, long time no see!!"'
9282: 'Maria@r@v13/20400052."Long time no seee!@k @v13/20400053.Uu!"'
9283: 'Rosa@r@v12/21400043."Maria!@k @v12/21400044.Shouldn''t that be "It''s good to see you again"?@k @v12/21400045.Greet your uncle properly."'
9284: 'Maria@r@v13/20400054."Uu.@k@v13/20400055. It''s...good to see you again..."'
9285: 'Hideyoshi@r@v06/21100016."There you go!@k @v06/21100017.Well said!@k @v06/21100018.How about some candy as a reward?!@k @|@y@v06/21100019.......Oh, huh?@k @v06/21100020.Where''d I put ''em..."'
9286: 'Kyrie@r@v09/21300008."Rosa-san, it''s good to see you again.@k@v09/21300009. It''s good to see you too, Maria-chan."'
9287: 'Rosa@r@v12/21400046."It''s been too long, Kyrie nee-san, Hideyoshi nii-san.@k@v12/21400047. ...And......oh my, Battler-kun?!@k @v12/21400048.Look how big you''ve gotten...!"'
9288: 'Battler@r@v10/20100003."Ah, come on, hahaha...@k@v10/20100004. It''s embarrassing hearing that from every person I meet...!"'
9289: 'Rudolf@r@v08/21200014."Hey, Rosa.@k@v08/21200015. You''re late.@k@v08/21200016. If the plane was on time, you''d barely have made it..."'
9290: 'Rosa@r@v12/21400049."I''m sorry.@k@v12/21400050. We had some trouble making our train connection.@k@v12/21400051. So we''re waiting on the weather yet again?"'
9291: 'Eva@r@v05/21000093."Oh, don''t complain.@k@v05/21000094. I much prefer the thirty-minute plane trip to spending six hours bouncing about on a boat.@k@v05/21000095. Even if we''re kept waiting here for an hour, it''s still much faster overall."'
9292: 'Battler@r@v10/20100005."Is that Maria...?@k @v10/20100006.She sure has gotten big...@k@v10/20100007. She''s at that growing age..."'
9293: 'Rosa@r@v12/21400052."You last met her...six years ago?@k @v12/21400053.Of course she''d change.@k@v12/21400054. Women are creatures who can be born anew in a single day, and all it takes is a change of heart."'
9294: 'Maria@r@v13/20400056."......Uu?"'
9295: '@rMaria noticed a big man who she didn''t remember mixed among the relatives, and hid behind Rosa''s back, glaring at Battler.'
9296: 'Rudolf@r@v08/21200017."Hey, Battler, say hi.@k@v08/21200018. The last time you met her, she was just three years old, so this might as well be the first time."'
9297: 'Battler@r@v10/20100008."Yeah, I guess she wouldn''t remember if she was three!@k @v10/20100009.Hey Maria, long time no see.@k@v10/20100010. You sure have gotten big!"'
9298: 'Rosa@r@v12/21400055."Maria.@k@v12/21400056. This is Battler onii-chan.@k@v12/21400057. Uncle Rudolf''s son.@k@v12/21400058. ...Understand?"'
9299: 'Maria@r@v13/20400057."............Uncle''s son is...@k@v13/20400058. Uncle''s the son...@k@v13/20400059. ............??@k @|@y@v13/20400060.......Uuuu!!"'
9300: '@rShe was obviously on her guard.@k@rShe must have found it frightening for a large guy like Battler to suddenly start speaking frankly to her.'
9301: '@rBattler noticed that as well, and thought of various ways he might approach her.'
9302: '@rThen, he noticed the sweet she had in her hand.'
9303: '@rIt was the jack-o''-lantern sweet that Rosa had bought for her.'
9304: 'Battler@r@v10/20100011."Oh, right, it''s October, so that must be for Halloween.@k@v10/20100012. Ihihihi, trick or treee~at!"'
9305: '@rIf you try to take a treat away from a small child, normally, you''d expect them to cry and start a fuss.'
9306: '@rThe adults thought that method wasn''t good, but surprisingly, Maria looked pleased, her face splitting into a wide grin.'
9307: 'Maria@r@v13/20400061."Halloween, Halloween!!@k @v13/20400062.See, Mama, Battler knows about Halloween too, see, see!!"'
9308: 'Rosa@r@v12/21400059."Hey, call him Battler onii-chan!@k @|@y@v12/21400060.Sorry, Battler-kun."'
9309: 'Battler@r@v10/20100013."No, no, I don''t care.@k@v10/20100014. Call me Battler.@k@v10/20100015. And I''ll call you Maria, too.@k@|@y@v10/20100016. Come on, Maria, it''s Halloween!@k @v10/20100017.Trick or treeee~at!!"'
9310: 'Maria@r@v13/20400063."Trick or treeee~at!!@k @v13/20400064.Kyahahaha, *giggle*giggle*!!"'
9311: '@rFrom inside her handbag, Maria picked out a jack-o''-lantern sweet identical to the one she had in her hand, and presented it to Battler.'
9312: '@rIt seemed that Battler accepting it was enough to confirm their friendship.'
9313: '@rThe adults felt admiration at how children have their own ways of communicating.'
9314: '@rTo Maria, who had been complaining that she wanted to have a Halloween festival,@k it must have felt like Battler was a friend, since he knew about trick or treat.'
9315: '@rHer defensive posture from before was completely gone.@k@rNow, she was all merry, as though they had been friends for decades.'
9316: 'Battler@r@v10/20100018."Yeah, Halloween''s a minor event in Japan, isn''t it...@k@v10/20100019. You often see people parading around in costume on the news over there, but I''ve never seen it in Japan."'
9317: 'Maria@r@v13/20400065."I wanted to wear a costume too.@k@v13/20400066. Wanted to do trick or treat with all the cousins wearing costumes..."'
9318: 'Battler@r@v10/20100020."Yeah, I bet you did. Let''s us two do it together sometime!@k @v10/20100021.What would you want to go around as?"'
9319: 'Maria@r@v13/20400067."A witch!!@k @v13/20400068.BEATRICE!"'
9320: 'Kumasawa@r@v18/21800005."Oh, Milady, what are you doing in such a place?@k@v18/21800006. Madam was looking for you."'
9321: 'Jessica@r@v04/20200333."I''m here ''cause I don''t want to be found.@k@v04/20200334. ...I bet she only wants to nag at me anyway, all that crap like "is your appearance alright?" and "mind how you speak"."'
9322: 'Kumasawa@r@v18/21800007."Hoh-hoh-ho...@k@v18/21800008. Without a doubt."'
9323: 'Jessica@r@v04/20200335."......You know.@k@v04/20200336. When the day of the family conference comes, for some reason, I start getting weird feelings about this witch."'
9324: 'Kumasawa@r@v18/21800009."Hoh...@k@v18/21800010. Whyever do you say that...?"'
9325: 'Jessica@r@v04/20200337."The family conference is the day when everyone related to Grandfather gathers.@k@v04/20200338. ......Like, I hear Battler''s coming for the first time in six years, this year.@k@v04/20200339. ...Same kind of thing.@k@v04/20200340. I always wonder whether some "relative" who hasn''t shown themselves for several decades might suddenly turn up."'
9326: 'Kumasawa@r@v18/21800011."............Hohoh.@k@v18/21800012. Could a relative like that exist...?"'
9327: 'Jessica@r@v04/20200341."I''m talking about that BEATRICE-sama.@k@v04/20200342. ......Nobody knows her background.@k@v04/20200343. Could she be Grandfather''s mistress from long ago?@k@v04/20200344. ......Maybe one of her descendants will suddenly show up and tell us to give back the gold we were granted or something, you know?"'
9328: 'Kumasawa@r@v18/21800013."Hoh-hoh-hoh-ho...@k@v18/21800014. Krauss-sama and the others will probably have a discussion about the problem of the Master''s inheritance this year too.@k@v18/21800015. ...With such excitement abound over talk of the witch''s gold, I don''t suppose it would be strange at all if the witch herself who granted that gold finally made her appearance."'
9329: 'Jessica@r@v04/20200345."Kumasawa-san, you know,@k@v04/20200346. ...sure, you''re always quitting one moment and working the next, but you''ve been here as long as Genji-san, right?@k @v04/20200347.......You know more, about BEATRICE, don''t you?"'
9330: 'Kumasawa@r@v18/21800016."......Well, I wonder.@k@|@y@v18/21800017. Hoh-hoh-ho...@k@v18/21800018. Even if I try to remember, this old woman here can''t even recall what she had for breakfast this morning..."'
9331: 'Jessica@r@v04/20200348."Kumasawa-san, you''re always escaping with those excuses, but you know something, right?@k @v04/20200349.Sometimes I feel a kinda devious atmosphere about you, like you know something and you''re laughing behind our backs..."'
9332: 'Kumasawa@r@v18/21800019."Hoh-hoh-ho... How harsh.@k@v18/21800020. ...I don''t have any secrets.@k@v18/21800021. ......The only thing I can say...@k@v18/21800022.is that BEATRICE-sama is the Golden Witch, and that she is the other master who controls the night of this island."'
9333: 'Jessica@r@v04/20200350."That''s second-hand talk from Grandfather.@k@v04/20200351. Even though you get paid, it must be a pain to go along with Grandfather''s tales."'
9334: 'Kumasawa@r@v18/21800023."......But, I can say this much."'
9335: 'Jessica@r@v04/20200352."...What?"'
9336: 'Kumasawa@r@v18/21800024."......In ancient times, Rokkenjima was feared, and called "Azukijima".@k@v18/21800025. The story told among the fishermen is that "Azuki" was a mispronounced form of "@bEvil Appetite.@<Akujiki@>", and in fact it was called "Akujikijima"."'
9337: 'Jessica@r@v04/20200353."I''ve heard this before.@k@v04/20200354. It''s that story about how, ''cause of all the sunken rocks and shipwrecks around here, the fishermen got afraid and stayed away as much as they could, right?"'
9338: 'Kumasawa@r@v18/21800026."......Evil spirits had settled down in Akujikijima, devouring human souls from time immemorial.@k@v18/21800026_1. ...There were all too many people who got involved with this island and were dispossessed of their lives."'
9339: 'Jessica@r@v04/20200355."And it all settled down when a traveling mountain ascetic or someone built that shrine and laid those souls to rest, right?@k @v04/20200356....What a shady story."'
9340: 'Kumasawa@r@v18/21800027."They say that shrine was destroyed by an eerie violet thunderbolt this summer, which tore through the darkness of the night..."'
9341: 'Jessica@r@v04/20200357."Kumasawa-san, you really like those stories, don''t you?@k@v04/20200358. Sure, it''d be pretty creepy if a thunderbolt wiped out the shrine keeping the dead at peace.@k@v04/20200359. But, well, it was all worn out from the start.@k@v04/20200360. I bet it just got carried away by some large wave.@k@v04/20200361. Hahahahaha."'
9342: 'Kumasawa@r@v18/21800028."The evil spirits of Akujikijima woke up from their sleep, and summoned BEATRICE-sama.@k@v18/21800029. .........So if BEATRICE-sama ever happened to come for the family conference, then..."'
9343: 'Jessica@r@v04/20200362."Then...?"'
9344: '@rKumasawa kept silent for a moment there.@k@r...Jessica, who wanted her to keep going, found that silence very eerie.'
9345: '@rOnce Kumasawa was satisfied that she had spooked Jessica just the right amount, she grinned broadly.'
9346: 'Kumasawa@r@v18/21800030."Well now, I wonder what would happen.@k@v18/21800031. Hoh-hoh-hoh-hoh-ho..."'
9347: 'Rudolf@r@v08/21200019."Whoa, that sounds wonderful."'
9348: 'Kyrie@r@v09/21300010."It does, doesn''t it?@k @v09/21300011.Isn''t it useful for your work to enrich your heart and have an elegant time every once in a while...?"'
9349: 'Rudolf@r@v08/21200020."I think so.@k@v08/21200021. The heart and the wallet must be rich.@k@v08/21200022. Got it, I''ll keep that day open.@k@v08/21200023. Please, make the reservations."'
9350: 'Kyrie@r@v09/21300012."Will do.@k@v09/21300013. No backing out!"'
9351: 'Rudolf@r@v08/21200024."Yeah, let''s make it happen.@k@v08/21200025. I love you, Kyrie."'
9352: '@rAfter kissing the receiver, Rudolf hung up.'
9353: '@r...In front of his seat, there were many executives with their sleeves rolled up, eagerly awaiting the end of that phone call.'
9354: 'Rudolf@r@v08/21200026."Sorry about the wait.@k@v08/21200027. Have we had contact from America?"'
9355: '@r@v99/ExeA2001."Yes.@k@v99/ExeA2002. It''s from our lawyer Dale Watanabe on the external line.@k@v99/ExeA2003. I''ll transfer it."'
9356: 'Rudolf@r@v08/21200028."......Overall, how do you feel about the situation?"'
9357: '@r@v99/ExeA2004."Well, I''m afraid......it seems it is not all that favorable.@k@v99/ExeA2005. It seems they have no plans of withdrawing from the trial."'
9358: 'Rudolf@r@v08/21200029."......Looks like we can''t fool ''em after all.@k@v08/21200030. Tahaha...@k@v08/21200031. Please, transfer it here."'
9359: '@r@v99/ExeA2006."Very well.@k@v99/ExeA2007. Right away."'
9360: '@rThe executive ordered the secretarial office to connect him to the external line.@k@rImmediately, the telephone in front of Rudolf started ringing.'
9361: 'Rudolf@r@v08/21200032."Hello.@k@v08/21200033. <Hello, hello>!@k @v08/21200034.Apologies for the wait, Ushiromiya speaking.@k@v08/21200035. Good day, good day.@k@v08/21200036. How is it going over there?"'
9362: '@r@v99/watA2001."<Hello, President Ushiromiya>.@k@v99/watA2002. Let''s skip the greetings and get right down to business.@k@v99/watA2003. I have good news and bad news; which one shall we start with?"'
9363: 'Rudolf@r@v08/21200037."...The bad news can go first.@k@v08/21200038. I can''t fight if there''s no dessert."'
9364: '@r@v99/watA2004."Very well.@k@|@y@v99/watA2005. The bad news is that they have started preparing to prosecute us.@k@v99/watA2006. Just a few days ago, a verdict was handed down in a similar trial, overwhelmingly in favor of the plaintiff.@k@v99/watA2007. The defendants were also making roughly the same arguments as us, but they were rejected in everything."'
9365: '@r@v99/watA2008."I''m afraid to say it, but if we face the courtroom as we are now, the probability that our argument will be rejected in its entirety is extremely high."'
9366: 'Rudolf@r@v08/21200039."...So that other trial was a disaster.@k@v08/21200040. ......And I was thinking their conditions were more favorable than ours.@k@v08/21200041. That''s tough.@k@v08/21200042. Then, what about the good news?"'
9367: '@r@v99/watA2009."I managed to get in contact with their executives.@k@v99/watA2010. I explained our situation to them,@k@v99/watA2011. explained that we have no intention of tarnishing their brand image, and I managed to get their understanding."'
9368: '@r@v99/watA2012."They will offer us conditions in a few days, and if these are carried out, they promised to withdraw from the prosecution.@k@v99/watA2013. This comes straight from the number-two man on their board of directors."'
9369: 'Rudolf@r@v08/21200043."Your impression?"'
9370: '@r@v99/watA2014."Honestly, I expect the conditions will be extremely severe.@k@v99/watA2015. I would assume that changing the company name and the brand name will be inevitable.@k@v99/watA2016. Where we do have margin in the negotiations is the amount of settlement money, the appearance of a public apology in a major newspaper, and the amount of time needed to carry out those things."'
9371: 'Rudolf@r@v08/21200044."Why don''t they just come straight out with it and tell us to go bankrupt."'
9372: '@r@v99/watA2017."They changed to their second president only a couple of years ago, and the new president doesn''t have a firm foothold on the position yet.@k@v99/watA2018. If we resist until the bitter end, they fear that the forces who want to go against the current president wouldn''t hesitate to do some work in favor of the enemy."'
9373: '@r@v99/watA2019."Hence, it seems the big shots over there want to settle this matter as fast as possible too.@k@v99/watA2020. Therefore, for the sake of a quick settlement, we may still have enough leeway to pull for some mitigation of the conditions."'
9374: 'Rudolf@r@v08/21200045."At any rate, an absurd amount of money will be necessary, I guess."'
9375: '@r@v99/watA2021."You need to be prepared for that.@k@v99/watA2022. And even so, I believe it will be much cheaper than disciplinary compensation."'
9376: 'Rudolf@r@v08/21200046."Thank you very much.@k@v08/21200047. If there''s any more progress, please contact me.@k@v08/21200048. You bill highly, so I can''t even chat around idly with you.@k@v08/21200049. Hahahaha.@k@v08/21200050. <Thank you, thank you, goodbye>."'
9377: '@rRudolf hung up the phone.'
9378: '@rIt seemed that the executives sitting in the reception seats could guess what had been said.'
9379: 'Rudolf@r@v08/21200051."......You get all that, you reprobates?@k@v08/21200052. Well, to sum up.@k@v08/21200053. If we can just pay them off, they''re gonna let it slide.@k@v08/21200054. All we have to do now is turn our focus onto how much."'
9380: '@r@v99/ExeB2001."But, President.@k@v99/ExeB2002. The sum that Mr. Watanabe estimated for the settlement is too much.@k@v99/ExeB2003. We don''t have that much of a margin...!"'
9381: 'Rudolf@r@v08/21200055."If we''d have known this was going to happen, we never should have started diversifying..."'
9382: '@r@v99/ExeA2008."The calculations were that we could escape the capital crisis if we were able to endure for three years.@k@v99/ExeA2009. ...To be stabbed at this juncture is just...incredibly unfortunate...!"'
9383: 'Rudolf@r@v08/21200056."I guess we tripped and fell at the "step" of the "hop, step, jump".@k@v08/21200057. I could cry."'
9384: '@r@v99/ExeC2001."We have no choice but to draw the money from the main bank."'
9385: 'Rudolf@r@v08/21200058."Banks are no good.@k@v08/21200059. They only bet their money on winning horses.@k@v08/21200060. ...The situation is getting better, but we can''t show weakness to the banks."'
9386: '@r@v99/ExeA2010."......President.@k@v99/ExeA2011. Do you have any funds which are unaccounted for?@k@v99/ExeA2012. Funds that we aren''t aware of?"'
9387: 'Rudolf@r@v08/21200061."Stop that.@k@v08/21200062. Do I look like that kind of man?@k@v08/21200063. The contents of my wallet are all exposed to you guys, alright?@k @v08/21200064.The account books over there show all that our company has."'
9388: '@r@v99/ExeA2013."In that case, ......we need to raise money.@k@v99/ExeA2014. We need a sponsor, who can draw in several million dollars for us, as soon as possible."'
9389: '@r@v99/ExeB2004."......President!@k @v99/ExeB2005.Couldn''t something be worked out with one of your associates...?!"'
9390: '@r@v99/ExeC2002."President!@k @v99/ExeC2003.President...!"'
9391: 'Rudolf@r@v08/21200065."...Aaaah, calm down, you bastards.@k@v08/21200066. ......I''ll find a way to raise the money.@k@v08/21200067. You guys just maintain the business and try not to fall to pieces.@k@v08/21200068. They''re saying they''ll forgive us so long as we hand over the money."'
9392: 'Rudolf@r@v08/21200069."We already have thick pipelines in Asia.@k@v08/21200070. This''ll probably have consequences all over the place, but we can still maintain our deals.@k@v08/21200071. The point is, this is a problem that can be entirely resolved just by handing over money."'
9393: 'Rudolf@r@v08/21200072."Just watch, I''ll settle everything.@k@v08/21200073. I won''t let you out in the cold.@k@v08/21200074. Start feeling like you''re in good hands!@k @v08/21200075.When this is all over, I''ll be rewarding all of you guys with a champagne tower.@k@v08/21200076. I promise.@k@v08/21200077. So, just shut up and follow me.@k@v08/21200078. Alright?!!"'
9394: '@rThe airplane suddenly shook.@k Probably because of turbulence.'
9395: '@rThat shaking roused Rudolf from his sleep.@k@rHe had woken up early that morning, and had ended up drifting off to sleep while resting in his seat.'
9396: 'Kyrie@r@v09/21300014."...Are you alright?@k @v09/21300015.You''re still very drowsy, aren''t you?@k @v09/21300016.You''ve been so busy with work lately."'
9397: 'Rudolf@r@v08/21200079."It''s a damned good thing I am busy with work.@k@v08/21200080. If I suddenly find myself with nothing to do, we''ll all be out in the cold starting the next day."'
9398: 'Kyrie@r@v09/21300017."You''re right.@k@v09/21300018. Battler-kun''s come back now, so I''m afraid we can''t just go around begging if things get rough."'
9399: 'Rudolf@r@v08/21200081."......Yeah.@k@v08/21200082. We''ve finally got our whole family back after six years.@k@v08/21200083. ...The man of the house is gonna have to give his best so we can all spend some family time together..."'
9400: '@rWhen he looked outside the window, he saw that the airplane was already starting to drop in altitude considerably.'
9401: '@rThe fishing boats, which had only looked like black grains until a short while ago, had become clearly visible.'
9402: 'Rudolf@r@v08/21200084.".........If I could prostrate myself before Dad and borrow ten mil in exchange for a punch to the head, I''d take at least a dozen, but...@k@v08/21200085. Failing that, he''d better hurry and give up the ghost."'
9403: 'Rudolf@r@v08/21200086." .........I''ve mooched off him so much over the years, and now I''m going for the inheritance.@k@v08/21200087. ............I''m going to hell.@k@v08/21200088. ...It won''t surprise me a bit if he doesn''t want to see me......"'
9404: 'Nanjo@r@v19/21900001."......Could it be that you don''t plan on appearing at the family conference this year either?"'
9405: '@rNanjo looked at Kinzo''s face, sighing.@k@r...Kinzo''s eyes remained rooted to those strange magic books.'
9406: 'Kinzo@r@v01/21500031."I have no intention of joining those vultures in their discussion.@k@v01/21500032. They can discuss how they will suck my bones as they wish.@k@v01/21500033. ......They are not worth a moment of my time."'
9407: 'Nanjo@r@v19/21900002.".....................@k@v19/21900003. ...My, my.@k@v19/21900004. How troublesome..."'
9408: '@rNanjo shook his head slightly.'
9409: '@r...To him, children and grandchildren were to be adored.@k@rAnd he believed that their growth was the only enjoyment for old men.'
9410: '@rHe found Kinzo''s words to be a very sad thing.'
9411: 'Kinzo@r@v01/21500034."If the time comes when I must leave this room, I will show myself then.@k@v01/21500035. ......Just as that one does not show itself."'
9412: '@rKinzo raised his face, and in the direction of his gaze was the portrait of the witch, respectfully displayed on the wall...'
9413: 'Nanjo@r@v19/21900005.".................."'
9414: '@rInside Kinzo''s head, there was no conception of today being the day of the family conference, the day when all his dear family would gather together.'
9415: '@r......There was only the face of the witch in the oil painting, who never smiled outside her portrait...'
9416: '@rEverybody knew that when Kinzo talked about BEATRICE, unnecessarily cutting in would instigate his wrath...'
9417: 'Kinzo@r@v01/21500036."Today, I will...perform a certain ritual."'
9418: 'Nanjo@r@v19/21900006."Hoh.@k@v19/21900007. ...And what would that be?"'
9419: 'Kinzo@r@v01/21500037."......It would be more accurate to call it a gamble.@k@v01/21500038. ...After all, no miracles dwell in magic without risk."'
9420: '@rNanjo had already heard this countless times.@k@rYou could call it Kinzo''s favorite phrase.'
9421: '@r......It seemed that Kinzo believed in magic and miracles arising through betting his own fate with a certain kind of risky probability and beating the odds...'
9422: 'Nanjo@r@v19/21900008."Kinzo-san, you may once have been called the Golden Gambler,@k@v19/21900009. but I cannot imagine what kind of gamble you will take on with that aged body, when you could go to the other world at any time...@k@v19/21900010. I guess this will be worth seeing..."'
9423: 'Kinzo@r@v01/21500039."Hmph...@k@v01/21500040. ......I see.@k@v01/21500041. So, if it were up to you, unversed in magic, even this secret ritual I have thoroughly researched would be branded as a gamble.@k@v01/21500042. So be it."'
9424: 'Kinzo@r@v01/21500043."...............If it is I, a believer in miracles, who wins...@k@v01/21500044.you will be able to understand clearly that all my research, which probably only appears as vagary in your eyes, did bear fruit on this day.@k@v01/21500045. If you win,@k@v01/21500046. ......it will all end as, just as you observed, nothing more than the vagary of an old man who could go to the other world at any time."'
9425: 'Nanjo@r@v19/21900011."Hoh...@k@v19/21900012. I wonder what on Earth is this gamble you will start...@k@v19/21900013. As your friend, I only pray that you come out from that bet - no, was it a ritual?@k@|@y@v19/21900014. ...I only pray, from the bottom of my heart, that you can come out from that ritual victorious."'
9426: 'Kinzo@r@v01/21500047."Mmhm... ...I thank you."'
9427: 'Nanjo@r@v19/21900015."......Speaking of that, Kinzo-san.@k@v19/21900016. I hear that a long-awaited guest will be present at the family conference this year?"'
9428: 'Kinzo@r@v01/21500048."What......?"'
9429: '@rKinzo reacted in a unusual way to Nanjo''s words and turned around.'
9430: 'Nanjo@r@v19/21900017."You know, Battler-kun from Rudolf-san''s family.@k@v19/21900018. I hear he will be coming for the first time in six years.@k@v19/21900019. I''m sure he has become a splendid boy."'
9431: 'Kinzo@r@v01/21500049."............Oh, Battler.@k@v01/21500050. ...I wouldn''t describe a guest who has been away a scant six years as "long-awaited"."'
9432: '@rUpon hearing Battler''s name, he showed an ill-humored expression, as though he had been let down, and turned his back to Nanjo again.'
9433: 'Nanjo@r@v19/21900020."I guess these six years went by in a blink of an eye to you, sunk in your research in this room..."'
9434: 'Kinzo@r@v01/21500051."Hmph.@k@v01/21500052. ......Perhaps a truly long-awaited guest...@v01/21500053.......will pay us a visit.@k@v01/21500054. .........Everything depends on the results of the roulette.@k@v01/21500055. ...The roulette is already starting to revolve.@k@v01/21500056. Rouge, or noir?"'
9435: 'Kinzo@r@v01/21500057."............Tonight, let us enjoy ourselves as we see what kind of miracle the roulette will show us.@k@v01/21500058. ...The payoffs are large.@k@v01/21500059. And I don''t feel like losing...@k@v01/21500060. ......BEATRICE, ...you shall accept my bet........."'
9436: '@rJust then, the telephone on the table rang.'
9437: '@rThat piercing noise seemed to displease Kinzo, and he picked up the receiver in order to preserve the silence as much as he could.'
9438: 'Kinzo@r@v01/21500061."......What is it?@k@v01/21500062. I''m busy."'
9439: 'Genji@r@v14/21600029."It is Genji.@k@v14/21600030. The family has arrived."'
9440: 'Kinzo@r@v01/21500063."And what does that have to do with me?@k@v01/21500064. You can serve them some tea or something."'
9441: 'Genji@r@v14/21600031."...Certainly.@k@v14/21600032. I will see to it."'
9442: '@rKinzo hung up the phone rudely.'
9443: '@rWatching him, Nanjo sighed yet again, and shifted his attention outside the window.'
9444: '@rAs he was now, Kinzo would probably show no interest in any kind of guest.'
9445: '@r...Was there any guest who could make Kinzo agree to come out when he should?'
9446: '@rHe had one person in mind, but that guest was one who could not possibly appear...'
9447: '@rAfter a glance at the witch of the portrait, and her candid expression which he could not place as happy or sad, Nanjo gazed up at the leaden sky......'
9448: '@rNow then, are the pieces all lined up......?@k@rLet us start a new game, with the pieces all lined up once more.'
9449: 'BEATRICE@r@v27/20700370."Are there any problems...?"'
9450: 'Battler@r@v10/20100022."......Nope."'
9451: '@rThe witch looked at him in challenge while elegantly smoking her pipe.'
9452: '@rAnd Battler?@k@rHe just slovenly shrugged his shoulders as though she wasn''t worth his time.'
9453: '@rHe wouldn''t look her in the eyes.@k@rBut that didn''t mean he wasn''t going to play.'
9454: '@r...It signified his plain determination to never be taken in by the artifices of this being he faced.@k@rIt was an expression of his powerful determination to fight.'
9455: 'BEATRICE@r@v27/20700371."Don''t tell me you don''t have a plan...?"'
9456: 'Battler@r@v10/20100023."I don''t know how you''re going to play, so no, I don''t have any plan.@k@v10/20100024. ...Feel free to take the first move."'
9457: 'BEATRICE@r@v27/20700372."Hmph... Naturally, I intend to.@k@v27/20700373. In what way shall I destroy your defense?@k@v27/20700374. In how many moves will I checkmate you?@k@|@y@v27/20700375. ......That is how I will display my skills."'
9458: 'Battler@r@v10/20100025."............Whatever moves you come at me with, I will never believe in you!@k @v10/20100026....As long as I stand my ground on that one point, I won''t lose.@k@v10/20100027. And what that means is this.@k@v10/20100028. The way this game is made, you cannot win...!"'
9459: 'BEATRICE@r@v27/20700376."Maybe you''re right.@k@v27/20700377. However...@k @v27/20700378.I shall decide how many times we''ll repeat this game.@k@v27/20700379. It will be repeated over and over again, until I win and you admit defeat...!"'
9460: 'BEATRICE@r@v27/20700380."In other words, this is torment.@k@v27/20700381. Eternal torment that will continue until you surrender to me...!@k @v27/20700382.Continuing eternally, until you acknowledge me and the existence of witches!"'
9461: 'Battler@r@v10/20100029."......In that case, I''ll go along with you endlessly, any number of times, until you run out of patience.@k@v10/20100030. I''ve never lost in such a "battle of wills"."'
9462: 'BEATRICE@r@v27/20700383."Did some witch or other suggest that to you...?@k @v27/20700384.*cackle*cackle*, that''s just fine...!"'
9463: 'Battler@r@v10/20100031."I''m tired of listening to your rambling.@k@v10/20100032. ...C''mon, get this started!"'
9464: 'BEATRICE@r@v27/20700385."Come, let us begin!@k @v27/20700386.I already know your moves far too well.@k@v27/20700387. A defense doesn''t amount to much if the plan behind it is known!@k @v27/20700388.Don''t think you''ll be able to defy me with the same moves!!"'
9465: 'Battler@r@v10/20100033."......BEATRICE.@k@v10/20100034. I have only one thing to tell you before we start."'
9466: 'BEATRICE@r@v27/20700389."What is it...?"'
9467: 'Battler@r@v10/20100035."You''re free to say anything.@k@v10/20100036. But when it comes to whether I believe or not,@v10/20100037. that is always@v10/20100038. for me@v10/20100039. to decide...!"'
9468: 'Battler@r@v10/20100040."No matter how great your magic is!@k @v10/20100041.My soul won''t yield to you.@k@v10/20100042. You think this will be torture for me?@k @v10/20100043.You''re wrong!!"'
9469: 'BEATRICE@r@v27/20700390."Then, what would you call it...?"'
9470: 'Battler@r@v10/20100044."This is torture for you!!"'
9471: 'Battler@r@v10/20100045."Someday you will yield to me and give up!@k @v10/20100046.Until then, you''ll be tortured over and over again!"'
9472: 'BEATRICE@r@v27/20700391."How amusing, a fine metaphor!!@k @v27/20700392.Torture where we torment each other, how truly amusing!@k @|@y@v27/20700393.Come, we shall begin that torture!!@k @|@y@v27/20700394.Ushiromiya Battleeeeer!!!"'