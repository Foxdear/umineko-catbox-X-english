7553: 'Shannon@r@v15/20500001."Look, George-sama!@k @v15/20500002.They''re so cute, look, look!"'
7554: '@rShannon found a pair of hammerhead sharks playfully swimming in the tank,@k and made a fuss like a grade schooler seeing an aquarium for the first time.'
7555: 'George@r@v07/20300001."Yeah, they''re really cute.@k@v07/20300002. I almost want to eat them."'
7556: 'Shannon@r@v15/20500003."I, I''d feel so sorry for them...@k@|@y@v15/20500004. Did you know?@k @v15/20500005.I hear that the only people in the world who come to an aquarium and say that the fish look delicious are the Japanese."'
7557: 'George@r@v07/20300003."Is that so?@k @v07/20300004....I''m sure even Americans and Italians would want to eat these."'
7558: 'Shannon@r@v15/20500006."...Uh,@v15/20500007. ...um......@k@v15/20500008.err..."'
7559: 'George@r@v07/20300005."Those clothes look good on you.@k@v07/20300006. Really."'
7560: '@rShannon embraced her chest with both hands in embarrassment.@k@r...She apparently felt like she was being made fun of for wearing these clothes that she wasn''t used to.'
7561: '@rEven though George''s face didn''t show it, the truth was that even he was surprised at how easily those tremendous words had left his lips,@k and he was as embarrassed as Shannon on the inside.'
7562: '@rHowever, when he saw how embarrassed Shannon was,@k he started to feel as though he was teasing the girl he liked,@k and instead of embarrassment, ticklish amusement welled up in him.'
7563: '@r......Wait, that isn''t just a feeling.@k@r...I really am teasing the girl I like.'
7564: '@rIt pains me to admit it,@k ......but I used to think that such embarrassing expressions had fallen so far out of use they no longer showed up even in manga.'
7565: '@rOn the contrary, if I''d seen a couple acting like that, I''d have felt like throwing rocks at them.'
7566: '@rHowever, even if rocks were thrown at us now,@k I''m sure they would be just like confetti celebrating us.'
7567: '@rNow, I can''t even remember those lonely days...@kwhen I felt jealous of couples who were completely oblivious to their surroundings.'
7568: '@rTo use an old-fashioned phrase, these would be truly rose-colored days...'
7569: '@rI was so entranced that I no longer even noticed the big tank of the world''s largest aquarium.'
7570: '@rInstead, I saw only Shannon happily playing with the fish, all her changing emotions showing on her face.'
7571: 'Shannon@r@v15/20500009."...It''s amazing, isn''t it......?@k@v15/20500010. It''s my first time seeing a tank large enough for a whale to swim in."'
7572: 'George@r@v07/20300007."I heard that this tank is the biggest selling point here.@k@v07/20300008. And that it''s the biggest in the whole world."'
7573: 'Shannon@r@v15/20500011."Is that so?@k @v15/20500012.That''s amazing.@k@v15/20500013. ......It''s really wonderful.@k@v15/20500014. It doesn''t even look like a tank at all, but rather like they sliced off a part of the sea with a knife and brought it here."'
7574: 'George@r@v07/20300009."It does, doesn''t it?@k@v07/20300010. This is a splendid little sea."'
7575: '@rDespite its size, I hadn''t thought of the tank as anything more than a tank.'
7576: '@rThat''s why I thought her expression about slicing off a part of the sea with a knife was so interesting.'
7577: '@rNo matter how far humans broaden their experiences, in the end, they can only hold a single personal worldview.@k Maybe that''s why it''s so interesting to interact with someone who has a different worldview.'
7578: '@rI said that to her honestly.@k@rAnd she responded:'
7579: 'Shannon@r@v15/20500015."Certainly, this might not be the real sea.@k@v15/20500016. ...But, if those little guys swimming in there believe that it''s a sea, then it certainly is a sea."'
7580: 'George@r@v07/20300011."Even though they''re inside a finite tank."'
7581: 'Shannon@r@v15/20500017."The sea is finite too.@k@v15/20500018. No, even if it were infinite,@k@v15/20500019. how much could we cover in our whole lives?@k@v15/20500020. I''m sure that it would be so much smaller than a sea."'
7582: 'George@r@v07/20300012."...Certainly.@k@v07/20300013. It''s ironic, isn''t it?@k@v07/20300014. Even though the world is so vast, most of us live out our lives without ever leaving our own country."'
7583: 'Shannon@r@v15/20500021."All it takes is the belief that it is a complete world...@k@v15/20500022.for even the bottom of a narrow well to be a proper world, and a sea.@k@v15/20500023. ...In the eyes of the frogs who live there."'
7584: '@rShannon, who spent her days as a servant on a small island ten kilometers in circumference called Rokkenjima,@k said that with a smile.'
7585: '@rAfter we finished walking through the whole aquarium, we had a slightly late afternoon lunch at a restaurant with a nice view.'
7586: '@rAny boy''s heart will jump about at the sight of a buffet.'
7587: '@rI myself was like that in the past.'
7588: '@rBut with Shannon beside me, this buffet felt different.@k@rI couldn''t shamefully make a huge pile of nothing but my favorite foods.'
7589: '@rI was - how should I put it - worried about my appearance,@k and chose a menu suited for a snob: toast, salad and coffee.'
7590: '@rIf I were by myself, I''d have made a pile of greasy stuff like yakisoba, mashed potatoes, gratins, and the like.'
7591: 'George@r@v07/20300015."Shannon, is that enough for you?@k @v07/20300016.If it is, then I guess we men are animals with really bad fuel efficiency."'
7592: 'Shannon@r@v15/20500024."...Umm,@v15/20500025. I, I didn''t mean to imply that......"'
7593: '@rOn Shannon''s tray, there was only tea and salad.@k@rMaybe the very idea that she could "get away with at least one more dish" indicated I was thinking with my male stomach.'
7594: 'Shannon@r@v15/20500026."What about you, George-sama, will that be enough?@k @v15/20500027.I think it''s better for men to eat a little bit more.@k@v15/20500028. ...You normally eat more than that for lunch, don''t you?"'
7595: 'George@r@v07/20300017."Oops, right.@k@v07/20300018. You already know how much I eat from when I have lunch on the island."'
7596: 'Shannon@r@v15/20500029."Yes.@k@v15/20500030. So, I was wondering whether your stomach isn''t feeling well today..."'
7597: '@rShannon was showing concern that I wasn''t feeling well.@k@rApparently I had made her worry with my stupid attempt to impress her.'
7598: '@rAnd in any case, it didn''t seem like my stomach was going to let me keep this pretense up any longer.'
7599: 'George@r@v07/20300019."...Gah, ahaha...@k@v07/20300020. I''ll confess already.@k@v07/20300021. I was just trying to look cool...@k@v07/20300022. I just held back because I was with a girl..."'
7600: 'Shannon@r@v15/20500031."I thought so.@k@v15/20500032. Considering how much you eat during lunch at the family conferences, I thought that this wasn''t nearly enough.@k@v15/20500033. Please, don''t be so reserved, and feel free to go and choose another dish."'
7601: 'George@r@v07/20300023."This isn''t fair... All the embarrassment is on me.@k@v07/20300024. What about you, then, Shannon?@k @v07/20300025.Do you always manage your work for the Ushiromiya family while eating so little?"'
7602: 'Shannon@r@v15/20500034."......Umm, uh,@v15/20500035. ............au."'
7603: '@rShannon grew silent and blushed bright red.'
7604: '@rApparently, I wasn''t the only one putting on a front.@k@rWhen I realized that, my embarrassment disappeared completely.'
7605: 'George@r@v07/20300026."That isn''t enough for you either, is it?@k@v07/20300027. Yes, normally, you eat more than this for lunch."'
7606: 'Shannon@r@v15/20500036."A, a woman''s stomach is made of magic, so this is enough...@k@v15/20500037. au."'
7607: 'George@r@v07/20300028."This must mean that we were both trying to impress each other.@k@v07/20300029. Let''s not hold back anymore, shall we?"'
7608: '@rI smiled to show that I wouldn''t make fun of her anymore and stood up from the seat.'
7609: 'George@r@v07/20300030."We''ve come all the way to Okinawa - it would be a waste if we didn''t eat some bitter melon.@k@v07/20300031. I''ll go get some fried bitter melon or something.@k@v07/20300032. Come with me, Shannon.@k@v07/20300033. C''mon, c''mon."'
7610: 'Shannon@r@v15/20500038."Ah, yes...!"'
7611: '@rTo anyone watching us, we might have seemed like a pretty humorous - and above all embarrassing - couple.'
7612: '@rBut it''s only after becoming a couple that you realize.'
7613: '@rThis banter means the world to us, and is our world.@k@rSo, no matter how cold the looks we might have been getting from other people, we wouldn''t even notice.'
7614: '@r......Indeed, at this age, I finally understand the feelings of couples who want to endlessly flirt without any regard to their surroundings.'
7615: '@rAfter I returned with a plate piled up with fried food, Shannon arrived with a lovely cake.'
7616: '@rWhile laughing at our fake stoicism, we resumed our lunch.'
7617: 'George@r@v07/20300034."It''s a shame that it''s so cloudy, considering this restaurant has such a view of the sea."'
7618: '@rOur window seats, which we were lucky to get, showed us seaside scenery so grandiose that it didn''t even fit entirely within our field of vision.'
7619: '@rHowever, because of the cloudy sky, it was a far cry from its normal beauty.'
7620: 'Shannon@r@v15/20500039."Yes, it is.@k@v15/20500040. If it had been clear, we would have seen quite the deep blue sea."'
7621: 'George@r@v07/20300035."Yes.@k@v07/20300036. I imagine you''re used to seeing the sea on Rokkenjima, but the sea here would surely have been an exceptional blue.@k@v07/20300037. ...It''s a real shame."'
7622: 'Shannon@r@v15/20500041."Aah, but - no matter how blue it is, the sea I see during work might as well be gray.@k@v15/20500042. But, today, I''m not working, so...I mean..."'
7623: '@rApparently, Shannon was doing her best to say an embarrassing line.@k But I grade harshly.'
7624: 'George@r@v07/20300038."So close.@k@v07/20300039. If only you''d said "when I look at it with you, even the grayest sea looks deep blue",@k@v07/20300040. I''d have given you full marks and a reward."'
7625: 'Shannon@r@v15/20500043."Uh,@v15/20500044. ah,@v15/20500045. I, I, I''m sorry......@k@v15/20500046. nnnnnn..."'
7626: 'George@r@v07/20300041."Wanna hear what the reward would have been...?"'
7627: 'Shannon@r@v15/20500047."Umm,@v15/20500048. ......@v15/20500049.uh,@v15/20500050. if you wouldn''t mind......"'
7628: 'George@r@v07/20300042."No.@k@v07/20300043. I won''t tell you.@k@v07/20300044. Ahahahahahaha."'
7629: 'Shannon@r@v15/20500051."Tha-that''s not fair..."'
7630: '@rWhen I was in elementary school, I was always the kid that got bullied.@k@rWhen everyone teased me, I grew nervous and speechless, to the delight of the bullies.'
7631: '@rBack then, I wondered why everyone teased me.'
7632: '@rBut now, teasing Shannon like this, I understand why.@k@rThis is so much fun.'
7633: '@rI can play with her emotions however I please,@k ...and I can have them all to myself.'
7634: '@rRight now, I can''t think of any higher pleasure.'
7635: '@rWhich is exactly why I have to treat her lightly.@k@rI don''t want her to get embarrassed and have a bad time.@k@rSo I decided to end the topic there and then.@k@rIt''s not good to be too persistent.'
7636: 'George@r@v07/20300045."When you''ve finished your lunch, do you want to take a walk on the beach?@k @v07/20300046.Perhaps the clouds will clear up and we''ll be able to see a picturesque sea."'
7637: 'Shannon@r@v15/20500052."That''s a nice idea.@k@v15/20500053. I''d like to do that."'
7638: 'George@r@v07/20300047."OK, that''s what we''ll do.@k@v07/20300048. ...But that looks like a really delicious cake.@k@v07/20300049. I wonder if I should get one like that too."'
7639: 'Shannon@r@v15/20500054."You mustn''t...@k@v15/20500055. If you eat cake after already eating so much, you will get fat.@k@|@y@v15/20500056. Hideyoshi-sama''s blood seems to run pretty thick in you, George-sama, so if you don''t take care, you will get chubby."'
7640: 'George@r@v07/20300050."So, Shannon, would you stop liking me if I got fat...?@k @v07/20300051.I wouldn''t stop liking you if you did."'
7641: 'Shannon@r@v15/20500057."I, I didn''t mean it that way...@k@v15/20500058. I meant...if you don''t take good care of your body, your health will...@v15/20500059. au."'
7642: 'George@r@v07/20300052."Mother warns me all the time too.@k@v07/20300053. Maybe I also need to take up Tai-chi-chuan or something to get some exercise."'
7643: 'Shannon@r@v15/20500060."If you want to lose weight, it''s best to start by reconsidering your eating habits, instead of doing intense exercise.@k@v15/20500061. The exercise has to come on top of that, or you won''t get any results, I hear."'
7644: 'George@r@v07/20300054."In other words, you''re telling me not to eat cake, right?@k@v07/20300055. Then, I guess I''ll just have to gaze at you while you stuff your cheeks with that cake, Shannon."'
7645: 'Shannon@r@v15/20500062."Uh,@v15/20500063. er,@v15/20500064. .........@k@|@y@v15/20500065. ......Maybe one whole cake is too much,@v15/20500066. ......but maybe just half of one would be alright.@k@v15/20500067. Here, it''s really delicious."'
7646: '@rShannon cut her own cake and tried to move half to my salad plate.'
7647: '@rI had no doubt that she wanted to share the flavor of the delicious cake with me.'
7648: '@rEven so, I deliberately and meanly pulled my plate away from her.'
7649: '@rShe blinked her eyes in surprise.@k She couldn''t seem to figure out if that was a refusal of the cake or not.'
7650: '@rSo I winked, opened my mouth, and said "aah".'
7651: 'Shannon@r@v15/20500068."*giggle*.@k@v15/20500069. This is what you wanted from the beginning, isn''t it?@k@v15/20500070. ......Gosh, you''re such a pampered child, George-sama."'
7652: 'Shannon@r@v15/20500071."Okay,@v15/20500072. say "aah"."'
7653: '@rWhile still wearing an embarrassed, exasperated face, Shannon offered the cake to me with a fork.'
7654: '@rChomp.'
7655: '@rIt tasted like cheap chocolate cake you could find anywhere.@k Still, it was exceptional.'
7656: '@rBecause eating cake in such an embarrassing way, as if we were the ultimate stereotypical lovey-dovey couple, had been my dream for many years.'
7657: '@rIt made this cake''s flavor heavenly...'
7658: '@rIf the Earth is destined to end someday, I wouldn''t have had any regrets if it happened right then.'
7659: '@r......It was such a moment of bliss.'
7660: '@rAfter that, we gathered shells, ran from the waves, and enjoyed each other''s company while walking along the beach.'
7661: '@rIn the end, the clouds never parted.@k However, we both believed that our eyes were still reflecting a deep, blue sea.'
7662: 'Shannon@r@v15/20500073.".........Somehow, I''m so happy,@v15/20500074. ...it makes me scared."'
7663: 'George@r@v07/20300056."You do say that from time to time.@k@v07/20300057. What is it that you''re afraid of?"'
7664: 'Shannon@r@v15/20500075."...I''m...@v15/20500076.......a servant of the Ushiromiya family.@k@v15/20500077. For someone like me...to be here together with a member of the Ushiromiya family...@k@|@y@v15/20500078. Um,@v15/20500079. .........it just seems like too much for me."'
7665: 'George@r@v07/20300058."I''m also surprised.@k@v07/20300059. I didn''t just meet you today or yesterday, Shannon-chan.@k@v07/20300060. We''ve known each other for years now.@k@v07/20300061. But we would only ever exchange greetings during family meetups, barely a few times per year."'
7666: 'George@r@v07/20300062."...I never imagined we''d become close enough that I could spend time with you like this.@k@v07/20300063. It''s the same for you too, right?"'
7667: 'Shannon@r@v15/20500080."Uh,@v15/20500081. ......I...@v15/20500082....umm..."'
7668: 'George@r@v07/20300064."Hm?"'
7669: 'Shannon@r@v15/20500083."......I did...@v15/20500084....imagine.@k@v15/20500085. No, umm, err!@k @v15/20500086.Rather than imagination,@v15/20500087. ......it was more like I was fantasizing......@k@v15/20500088. You''re always so considerate and gentlemanly, so I wondered, if we were in a relationship,@v15/20500089. ......um, I just had fantasies of what it would be like......"'
7670: 'George@r@v07/20300065."Then, our relationship happened thanks to your believing heart.@k@v07/20300066. Magic dwells in the power of dreaming.@k@v07/20300067. So, I''m sure it was that magic that brought us together."'
7671: 'Shannon@r@v15/20500090.".........You''re right.@k@v15/20500091. ...I really think......that it truly was magic."'
7672: 'George@r@v07/20300068."But, you know, that''s not quite right.@k@v07/20300069. Every time we met, I saw you as more and more beautiful, and you grew to occupy a large space in my heart.@k@v07/20300070. If the same thing happened to you,@k@v07/20300071. then the fact that we are here today is simply an inevitable consequence, rather than something caused by magic or a miracle."'
7673: 'Shannon@r@v15/20500092."...............No.@k@v15/20500093. A miracle did happen,@k@v15/20500094. George-sama."'
7674: '@rShe stopped at the water''s edge, and gazed beyond the sea.'
7675: 'George@r@v07/20300072." ......A miracle?"'
7676: 'Shannon@r@v15/20500095."No, magic.@k@v15/20500096. ...It happened."'
7677: '@rI was bewildered by that slightly mysterious expression, which I sometimes heard her use.'
7678: 'George@r@v07/20300073."......Magic, you say?"'
7679: 'Shannon@r@v15/20500097."Yes, magic.@k@v15/20500098. .........You probably won''t believe me even if I say it, so I won''t.@k@v15/20500099. But that magic definitely had the power to grant the miracle which brought you and me together."'
7680: 'George@r@v07/20300074."You mean, like a lucky chant to make your wish come true?"'
7681: 'Shannon@r@v15/20500100."Perhaps.@k@v15/20500101. Maybe it was something like that.@k@v15/20500102. ...Except that it wasn''t pretend - it really was real magic."'
7682: 'George@r@v07/20300075."...Hmm..."'
7683: '@rPerhaps Shannon isn''t alone in wanting to credit an encounter on a miracle, or on chance; it might be a universal thing all girls share.'
7684: '@rFor a man like me, an encounter with a girl is 70 percent effort to try to please her, and 20 percent raw courage.@k And only 10 percent chance.'
7685: '@rWhat she believes to be everything carries little relative weight within me.@k ...Maybe that way of thinking is in itself calculating and typical of men.'
7686: '@rBut, were I to express that in words, any kind of magic would be broken.'
7687: '@rI do think that to become this close has taken many fortuities, concessions, and great efforts from us both.'
7688: '@rWe have this private time together now only as the result of all those things put together,@k and if she wants to call that "magic", that isn''t strange in the slightest.'
7689: '@rThat''s why I answered her the way I did:'
7690: 'George@r@v07/20300076."Yes.@k@v07/20300077. ......If the same fate were repeated a hundred times, you and I might have gotten into a relationship like this only once."'
7691: 'George@r@v07/20300078."Our distant and formal connection could have continued right up to now, even as we both remained conscious of each other.@k@v07/20300079. From the perspective of those otherworldly selves, we are undoubtedly in a miraculous relationship."'
7692: 'Shannon@r@v15/20500103."It''s not like that...@k@v15/20500104. ......It really is magic."'
7693: 'Shannon@r@v15/20500105."...Perhaps this is something that men will never believe, no matter how often you tell them.@k@v15/20500106. Kanon-kun didn''t believe me at all, either."'
7694: 'George@r@v07/20300080."...I believe you.@k@v07/20300081. ......Because I wouldn''t want to break the magic by not believing in it."'
7695: 'Shannon@r@v15/20500107."George-sama..."'
7696: '@rIn a small voice, I apologized for making light of her magic.'
7697: '@rThose words seemed to make Shannon a lot happier.'
7698: '@rAfter all, if a pair of people believes in the magic of love, it becomes eternal.'
7699: 'George@r@v07/20300082."Oh, that''s right.@k@v07/20300083. I have a request, if you''d be willing to indulge me."'
7700: 'Shannon@r@v15/20500108."...Yes?@k @v15/20500109.What is it?"'
7701: 'George@r@v07/20300084."You know how you call me "George-sama"?@k@v07/20300085. It''s not that I dislike it, but would you not call me that anymore?"'
7702: 'George@r@v07/20300086."Of course, you have to keep up your appearance with the Ushiromiya family, so I won''t force you to do this during your everyday routine at Rokkenjima.@k@v07/20300087. But, when we are alone, I''d rather you didn''t call me that.@k@v07/20300088. Yeah, let''s create that rule."'
7703: 'Shannon@r@v15/20500110."A, a rule?@k@v15/20500111. Wh-what would happen if I broke it...?"'
7704: 'George@r@v07/20300089."Good point.@k@v07/20300090. Maybe rule violations do need to have some kind of penalty attached.@k@v07/20300091. ...What should it be...@k@v07/20300092. ......Wanna hear?"'
7705: 'Shannon@r@v15/20500112."N-no, I don''t want to hear..."'
7706: 'George@r@v07/20300093."Ahahahahahaha.@k@v07/20300094. I''ll have to think about what it should be."'
7707: 'Shannon@r@v15/20500113."Yes.@k@v15/20500114. ......George...@v15/20500115.san."'
7708: 'George@r@v07/20300095."...Yeah.@k@v07/20300096. That sounds wonderful, doesn''t it?@k@v07/20300097. I''m so happy,@v07/20300098. Shannon."'
7709: 'Shannon@r@v15/20500116."I,@v15/20500117. ......I...@v15/20500118....have the name Sayo...@v15/20500119.......as well."'
7710: 'George@r@v07/20300099."Right.@k@v07/20300100. Rules must be fair.@k@v07/20300101. I''ll abide by that too, and from now on, I''ll call you Sayo.@k@v07/20300102. Alright?@k @v07/20300103.Sayo...?"'
7711: 'Shannon@r@v15/20500120."Y-yes."'
7712: '@rI put my arm around her shoulder and held her close.'
7713: '@rHer delicate body was pulled irresistibly towards me, and she leapt into my chest like a doll.@k As I held her head in my arms, we looked at the horizon together.'
7714: 'George@r@v07/20300104."What a deep blue sea.@k@v07/20300105. I''m so happy that we were able to see it together."'
7715: 'Shannon@r@v15/20500121."......Me too.@k@v15/20500122. It makes me very happy that I could look at such a deep blue sea with you."'
7716: '@rAs we gazed at the gray sea and a light rain began to sprinkle down,@k we kept listening to each other''s heartbeats...'
7717: '@rThe sound of waves soaked into my ears.@k ...No, this was the sound of raging waves.@k My body, bathed in painfully cold splashes, did not allow me to forget.'
7718: '@rThe memory of the day when my old fate was broken and smashed.'
7719: '@rIn the past, "tomorrow" had been literally like a mirror to me.'
7720: '@rAll I could see in it was the same me that existed "today".@k@r......My tomorrow would never be any different from my today.'
7721: '@rThat was my old fate.'
7722: '@r...But at that moment, for the first time, I saw a different fate beyond the mirror.'
7723: '@rThe witch whispered.'
7724: '@rShe tempted me to take a bite out of the fruit of knowledge.@k@rShe tormented me, saying that as long as I stayed in the paradise of God, I would remain furniture.'
7725: '@rAnd so I learned of love, and decided to choose to become a person.'
7726: '@r......Those days were like sweetly melting honey,@k ......but then, I hadn''t realized that they were the beginning of days filled with a new kind of suffering......'
7727: '@rTaking a motorboat that I had just been told about, I made my way to this islet.'
7728: '@rNo, I couldn''t possibly call it an islet.@k@rIt''d really be more appropriate to call it a reef.'
7729: '@rIt had a torii and a small shrine for the local deity.'
7730: '@rIt was probably built to worship the guardian deity of Rokkenjima.@k@r......Even though I didn''t know the exact meaning, I understood that it had a holy significance.'
7731: '@rDespite being in a place like this, I took just one more look around to see if there was anyone observing me.'
7732: '@r......The only things I could see were the stormy ocean, Niijima looming in the distance, and the waves breaking against Rokkenjima''s steep cliffside.'
7733: '@rI readied myself,@k ......timidly approached the small shrine,@w500. ...and took up the mirror that had been placed there.'
7734: '@rIt was an old-looking mirror, dim and dirty.@k@r......If it were an ordinary mirror, that would probably give you a terribly bad impression of its value.'
7735: '@r...However, since the mirror had been offered to this small shrine, that quality made me feel some kind of divinity from it.'
7736: '@r......And I realized.'
7737: '@rThis was not merely a mirror.@k@r...Even if it was nothing more than an old-looking mirror to a non-believer like myself, in actuality, it was a mirror that had an important meaning.'
7738: '@r......Is it really alright to break it after being captivated by honeyed words?'
7739: '@r......No, this is no mirror.@k@r...It is the inescapable life I have lived until today - my fate.'
7740: '@rBreak it.'
7741: '@rBreak it, ......and seize a life from beyond the mirror.@k@rIf I don''t break it, my life will forever be a pair of facing mirrors.@k@rNothing will ever change in the slightest...'
7742: '@rThe witch whispers.'
7743: '@rShe tempts me to take a bite out of the fruit of knowledge.@k@rOr maybe I have already had a taste of that fruit.'
7744: '@rBecause I ended up knowing those maddening emotions.@k@rJust as Adam and Eve felt compelled to pluck the fig leaf...'
7745: '@rI can no longer...@w500....go without breaking this mirror.'
7746: '@rI fought with conflict for many days.@k@rInside my heart, the virtuous part of me and the part that sided with the witch repeatedly fought each other.'
7747: '@rAnd now, here I am.'
7748: '@rDid the part of me who is here win or lose?'
7749: '@rThere''s only one thing I know.@k@rTo obtain something, you must be ready to lose something.'
7750: '@rThe cowards who don''t risk loss and never try to change anything will never be given the key to open the path to a new future.'
7751: '@rThe key is already in my hands.'
7752: '@rIt is - to break this.@k To break it.'
7753: '@rIs there any other effort I can make, as furniture imprisoned on Rokkenjima?'
7754: '@rNo.@k There''s nothing...but this.'
7755: '@rCome, have courage.@k I''ll free myself from being mere furniture.@k@rAnd I''ll accept my new sufferings, and become human.@k@rThese are surely the small and large trials I must impose on myself.'
7756: '@rNow,@w666. ......break it.'
7757: '@rBreak the eternally unchangeable fate that imprisons me...into pieces......!'
7758: '@rI raised it high,@k .........thought back on all those days of conflict,@k ......and, after a time far too brief to do them justice, I finished my reflections...@w416....@w416.and threw it.'
7759: '@rThe thunder roared, ...crying out against me for my outrageous act.@k@r...It was truly the wrath of the angels, preparing to banish me from eternal paradise.'
7760: '@rI looked down on the mirror tumbling at my feet, broken in two equal parts,@k ...and, having made sure I had accomplished my task,@k ......I looked up at the enraged sky, and screamed.'
7761: 'Shannon@r@v15/20500123."...I,@v15/20500124. ...............I kept...@v15/20500125.......the promise...@k@v15/20500126. ......Now,@v15/20500127. .........it''s your turn to keep your promise with me, right......?"'
7762: '@rThe thunder roared once more.'
7763: '@r...I had already been banished from Paradise.@k@rSo, I would have to struggle by myself in order to live.'
7764: '@rThe witch had said it.@k That''s the single element of the world.'
7765: '@rTo lose it - means to lose the world.@k@r...Like how a flask with a hole in the bottom can''t be filled, no matter how much water you scoop into it...'
7766: 'Shannon@r@v15/20500128."......I kept the promise.@k@v15/20500129. .........Now, it''s your turn to keep your promise.@k@v15/20500130. ......Please, grant my wish!@k @v15/20500131.BEATRICE-samaaaaaa!!"'