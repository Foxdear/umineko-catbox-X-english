13754: 'George@r@v07/20300717."......Da-damn it!!"'
13755: '@rAll at once, the gold butterflies attacked George, who was painfully slowly trying to remove the contents of the pouch.'
13756: '@rJust then, it seemed like, for just an instant, a bright red flash lit up the room...'
13757: '@rThat red flash seemed to wipe out the gold butterflies that were raging around the room, ......within a circle drawn with Shannon at the center...'
13758: '@r......Therefore, it was a very divine scene.@k ...Almost as though a single streak of light had cut through the clouds in the ceiling, in this world of gold...'
13759: '@rGeorge, who was curled in a ball trying to protect himself from the group of butterflies, didn''t have a clue what had occurred.'
13760: '@r......Then he noticed that Shannon was blocking the way to him, shielding him,@k with a serious face that she had never shown him before, as she glared at the witch and the rest...'
13761: 'BEATRICE@r@v27/20701439.".........I''d forgotten.@k@v27/20701440. You were also Kinzo''s excellent furniture.@k@v27/20701441. And you''ve matured much more than Kanon, ......"'
13762: 'Shannon@r@v15/20500814."..................How dare you...do that to Kanon-kun.@k@v15/20500815. .........Not the fact that you killed him.@k@v15/20500816. ...How dare you...erase his remains,@v15/20500817. ...and even try to disgrace his honor......"'
13763: 'BEATRICE@r@v27/20701442."Come now, Shannonnnnn, is that what''s making you maaad?@k @v27/20701443.If you''re lonely because you can''t meet Kanon, just ask meee, I''ll bring you together anytiiiiime!!"'
13764: '@rWhen the witch snapped her fingers, ......one of the six goat attendants......glittered gold and changed into Kanon.'
13765: '@rIt was definitely a sight to make one doubt their eyes.@k@r...It was definitely Kanon''s face.'
13766: '@r......However, in those eyes, there was none of that sincere glint of Kanon''s.'
13767: '@r...They were only the clouded eyes of furniture that did nothing but obey the orders of the witch.'
13768: '@r...George couldn''t understand the scene right before his eyes.@k@r......And he finally understood why Gohda and the rest had been unable to talk about what they had seen in the servant room.'
13769: 'Shannon@r@v15/20500818.".........Is it fun?"'
13770: 'BEATRICE@r@v27/20701444."Oh yeah, it''s fun.@k@v27/20701445. It''s always fun to reunite two that have been torn apart by death.@k@|@y@v27/20701446. Because I get to enjoy it thrice—once tearing the two apart by death, once reuniting them, and once tearing them apart again."'
13771: 'BEATRICE@r@v27/20701447."So, Kanonnn, play with your sister.@k@v27/20701448. If she knocks you about, show her a face with as much anguish as you can manage.@k@|@y@v27/20701449. *cackle*cackle*cackle*cackle*cackle*cackle*!!"'
13772: '@r......From the impostor Kanon''s arm, ...a strangely shining trail extended.@k@r.........It planned to tear Shannon apart with that.'
13773: '@r......Shannon, who still hadn''t prepared her heart, apart with a single stroke...'
13774: 'Shannon@r@v15/20500819."......I won''t forgive you.@k@v15/20500820. ......For dishonoring the dead not once, ...but twice, ...I won''t forgive you."'
13775: 'BEATRICE@r@v27/20701450."Stop babbling, get killed by your brother, Shannonnnnn,@k@|@y@v27/20701451. I''m sure you''ll be able to have a good dreeeeeeeeeeeaaaaaaam!!!"@|@y'
13776: '@rAs the impostor Kanon drew several purple trails, he definitely had attacked Shannon...'
13777: '@rBut when he flew at Shannon, ......it felt like some kind of invisible wall had been set up in front of her.'
13778: '@rA bright red ripple trail was left on the wall, ......and it repelled the impostor.'
13779: '@r......No, it didn''t repel him, it smashed him.@k ......It knocked him back, turning him into golden dust, into pieces, scattering him...!'
13780: '@rThe figure of the foolish furniture, who had mocked Kanon''s form and even disgraced his honor after his death, broke into countless gold butterflies,@k and then those butterflies themselves broke into pieces, and those pieces were broken into pieces,@k until they were no longer butterflies, but a spray of gold, and disappeared.'
13781: 'George@r@v07/20300718."......Sha-...............Shannon..............."'
13782: 'Shannon@r@v15/20500821."............George-san, please don''t move from there.@k@v15/20500822. I don''t want to shift the central axis."'
13783: 'BEATRICE@r@v27/20701452."This is.........a surprise!!@k @v27/20701453.Even though you make a face like you wouldn''t hurt a fly, .........you can display such power?!!"'
13784: 'BEATRICE@r@v27/20701454."I see, so the spirit mirror is lending you power...@k@v27/20701455. But you don''t have the preparations or the time to draw out the true power of that spirit mirror."'
13785: 'BEATRICE@r@v27/20701456."I won''t give you either one.@k@v27/20701457. *cackle*cackle*cackle*cackle*!"'
13786: '@rThe spirit mirror George gripped was letting out a divine radiance, and displaying its strength not to submit to wicked power.'
13787: '@rBut that radiance was no match for the witch''s sinister nature...'
13788: 'BEATRICE@r@v27/20701458."This is why furniture is frightening!@k @v27/20701459.That feeling, like unexpectedly hitting the corner of a cabinet with your little toe."'
13789: 'BEATRICE@r@v27/20701460."...This is why furniture is frightening!!@k @|@y@v27/20701461.You furniture, furniture furnituuuuuuuuuuuuuuuuuuuure!!"'
13790: 'Shannon@r@v15/20500823."............I am not furniture.@k@v15/20500824. ...And I think you are very pitiful right now."'
13791: 'BEATRICE@r@v27/20701462."Whaat...?@k @v27/20701463.Hohh.@k@|@y@v27/20701464. ......I wonder, what did this furniture, who hasn''t lived even a hundred years, just say to a witch of one thousand......?"'
13792: 'Shannon@r@v15/20500825."......You are a very pitiful person.@k@v15/20500826. .........Of course there will be lingering regrets between two people who love each other.@k@|@y@v15/20500827. But there isn''t even a scrap of the kind of regrets you''re hoping for."'
13793: 'BEATRICE@r@v27/20701465."You dare speak, furniture...!!@k @v27/20701466.When you say that, have you forgotten the days that you wanted to be tied to George so much that you licked my shoes?!!"'
13794: 'Shannon@r@v15/20500828."Living with love, and crawling in muck is what humans do.@k@v15/20500829. For sneering at that and thinking you can look down on it, you are far inferior to them."'
13795: 'Shannon@r@v15/20500830."Especially now, I think you are pitiful.@k@v15/20500831. ......How much does it mean for a loving couple to consummate their love?"'
13796: 'Shannon@r@v15/20500832."......It does mean something, it definitely does.@k@|@y@v15/20500833. ...But it''s completely different from what you''re saying.@k@v15/20500834. It means something more sacred, so sacred that one such as you has no right to speak of it wickedly."'
13797: 'Shannon@r@v15/20500835."So I no longer have any regrets.@k@v15/20500836. George-san and I have sworn our love to each other.@k@|@y@v15/20500837. As proof, I accepted the ring."'
13798: 'Shannon@r@v15/20500838."......With that, our eternal vows were completed!@k@v15/20500839. No matter how you torture us with your wicked magic and your malice, you cannot disgrace that for all eternity!!"'
13799: 'BEATRICE@r@v27/20701467."......Ha!@k @|@y@v27/20701468.Don''t speak as a poet like it''s so neat and clean!!@k @v27/20701469.Love is lust it can''t be talked about with only pretty words like in a shoujo manga.@k@v27/20701470. Men are flies and maggots that get caught in your scent and gather around you.@k@v27/20701471. Do you still not understand that at your aaaaaaaaaaaaage?"'
13800: 'BEATRICE@r@v27/20701472."You''ll despair, when you get even one glimpse of the black-as-tar lust of that glasses man behind you,@k@v27/20701473. you''ll be devastated speechless no words no reaction no expression no goddamn good at all Shannoooooooonnnnnnnnnnnnnnnnnnn???@k @|@y@v27/20701474.Hiiiihaaaaaaahahahahahaaahaaa!!"@|@y'
13801: 'BEATRICE@r@v27/20701475."That''s enough stop talking furniture you furniture furniture furniture,@|@y@k@v27/20701476. who the hell do you think you are talking like that, love is just a fraud how to pretty up something that''s ultimately filthy as all hell,"@|@y'
13802: 'BEATRICE@r@v27/20701477."Don''t people become adults when they realize thaaaaaaaaaat, die you trash, furniture furniture scrap,@|@y@v27/20701478. I''ll turn you into a filthy maggot then we''ll see whether that glasses guy still loves you,"@|@y'
13803: 'BEATRICE@r@v27/20701479."I''ll show you the goddamn filthy reality of his looooooooooooove,@|@y@v27/20701480. die you piece of craaaaaaaaaaaaap don''t you tell me about looooooooooooooooooove!!"@|@y'
13804: '@rThe invisible column of light with Shannon at the center started to have bright red ripples drawn all over it at once.'
13805: '@r...The wall did its best to withstand the invisible malice that was trying to corrode it from all directions.'
13806: 'BEATRICE@r@v27/20701481."What is this you call that resiiiisssting?!"@|@y'
13807: 'BEATRICE@r@v27/20701482."You''re insignificant you''re frail, just like the pretty picture you try to paint, just a frail pretense,@|@y@k@v27/20701483. you''re just hiding what you don''t want to see by covering it with a veil do you stiiill not understand that''s why you''re furniture you fuuuuuurniture,"@|@y'
13808: 'BEATRICE@r@v27/20701484."see see see see see it''s chipping awaaaaaaaaay crackcrunchsmacksnap how thin how shameful,@|@y@k@v27/20701485. compared to your frail resistance Parmigiano-Reggiano would take muuch more effort to shaaaaaaaaaaaaaave@|@y@k@v27/20701486. hiiyahhaaahahaah!!"'
