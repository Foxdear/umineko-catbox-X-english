13374: 'George@r@v07/20300625."............Unbelievable.@k@v07/20300626. ......Are you...saying that''s the truth?"'
13375: 'Shannon@r@v15/20500760."......Yes.@k@v15/20500761. ......We described everything as we saw it."'
13376: '@rGeorge folded his arms and started humming again.@k@r...And the kitchen was once again absorbed by a long silence.'
13377: 'Gohda@r@v17/21700275."George-sama, I understand well why you aren''t able to believe it so suddenly.@k@v17/21700276. ...After all, ...even though I''m sure I saw it with my own eyes, I still don''t know what it was I saw..."'
13378: 'Gohda@r@v17/21700277."I''m sure I saw it.@k@v17/21700278. And I''m sure I even got into a scuffle with it!@k @v17/21700279.And yet, ......I almost feel like it was all an illusion..."'
13379: 'George@r@v07/20300627."...I see.@k@v07/20300628. ......So that''s why you couldn''t go into the details in front of Auntie Rosa."'
13380: 'George@r@v07/20300629."......If you had actually told her what you just told me, then it would have created even bigger problems.@k@v07/20300630. ...Yes, I now understand that Genji-san handled it all in a remarkably composed fashion."'
13381: 'Genji@r@v14/21600170."...............If only I had the power to explain it."'
13382: '@rGeorge had not actually seen it, so even when pressed to believe, he just couldn''t imagine it.'
13383: '@r......It was only natural.@k Because even the people who had actually seen it had ended up questioning themselves as to what it was...'
13384: 'George@r@v07/20300631."...Let me back up a bit.@k@v07/20300632. ......Shannon, you said that when you thought Kanon-kun was an impostor, you went to pick up some spider webs, right?@k @v07/20300633.Why did you do that?"'
13385: 'Gohda@r@v17/21700280."......That''s right, I was thinking about that as well.@k@v17/21700281. Why spider webs?"'
13386: 'Shannon@r@v15/20500762."I heard it once from Kumasawa-san.@k@v15/20500763. ......A long time ago, evil spirits lived in Rokkenjima, and they, umm, feared spider webs.@k@v15/20500764. And they say there''s a legend that people treasured spider webs as wards against magic."'
13387: 'Shannon@r@v15/20500765."......So I, umm, ......just went with it.@k@v15/20500766. I, I think I was also a bit confused..."'
13388: 'Genji@r@v14/21600171."............Interesting story.@k@v14/21600172. ...Kumasawa was very knowledgeable about those kinds of tales."'
13389: 'George@r@v07/20300634."Spiders are useful, after all.@k@v07/20300635. ......Certainly, the existence of such a creed isn''t strange at all."'
13390: 'Shannon@r@v15/20500767."............I''m sure...@k@v15/20500768....that torii shrine was entrapping the power of those evil spirits.@k@v15/20500769. ...And since the spirit mirror was broken, that power revived...@k@v15/20500770. ......I have no doubt that it became the power to make BEATRICE-sama revive..."'
13391: 'Shannon@r@v15/20500771."............If I,@v15/20500772. ......while I was in that weak-hearted state,@v15/20500773. .........hadn''t done such an outrageous thing.........@k@v15/20500774. Uuuuughh...!!"'
13392: 'George@r@v07/20300636."...Shannon.@k@v07/20300637. You don''t have to worry about that anymore.@k@v07/20300638. ......I don''t blame you for that."'
13393: '@rSince long ago, Shannon had often hinted at a certain occult aspect regarding how she had met George.'
13394: '@rWhile he did lend an ear to her tales, George had always thought that this was typical of a girl, associating love with fate, chance, and miracles.'
13395: '@r......George had thought that breaking the spirit mirror offered to the torii shrine was going a little too far,@k but he had forgiven her, laughing it off as just a little prank she had done because she had seriously desired a relationship with him.'
13396: '@r......Just breaking a mirror in some musty shrine wouldn''t change the fate of our meeting.'
13397: '@rAnd that would never cause any curse.@k@rI remembered cheering her up, saying it was only a musty mirror covered in dust.'
13398: 'Gohda@r@v17/21700282."...After I started working on this island, many of my coworkers told me of the existence of a spirit called BEATRICE-sama."'
13399: 'Gohda@r@v17/21700283."In the beginning, I thought it was ridiculous,@k@v17/21700284. but since it appeared indiscreet to comment on that,@k@v17/21700285. ...outwardly, I conducted myself as if I also believed it.@k@v17/21700286. ......But, it''s astonishing, she really—"'
13400: 'Shannon@r@v15/20500775."Existed.@k@v15/20500776. ...BEATRICE-sama was in this mansion all along.@k@v15/20500777. ......But BEATRICE-sama had lost her powers, ...and could not appear before us.@k@v15/20500778. She did "exist" all along.@k@v15/20500779. ...It''s just that we couldn''t ''see'' her."'
13401: 'George@r@v07/20300639."............I''d like to hear Genji-san''s opinion."'
13402: 'Genji@r@v14/21600173.".........I do not have any opinion.@k@|@y@v14/21600174. .........All that I would like to say is......that when it happened......there were five of us here."'
13403: 'Genji@r@v14/21600175."......And I thought that Kanon had returned through the back door.@k@v14/21600176. Then, we carried him to the servant room,@k@v14/21600177. .........something happened, and Doctor Nanjo and Kumasawa passed on."'
13404: 'Genji@r@v14/21600178."......That is all.@k@v14/21600179. ......We have already explained everything we saw.@k@v14/21600180. ...I understand that it would be very unreasonable to try to force you to believe it when you did not see it yourself."'
13405: 'Gohda@r@v17/21700287."How could he believe it?@k@v17/21700288. .........I thought that it was undoubtedly Kanon-san."'
13406: 'Gohda@r@v17/21700289."......But when that thing got up from the bed,@v17/21700290. ...and, that''s right,@v17/21700291. started to grope about that wound in its chest like this,@k@v17/21700292. ......I felt that it wasn''t Kanon-san, but some different being."'
13407: 'Gohda@r@v17/21700293.".........You probably can''t understand, George-sama.@k@v17/21700294. ...The terror of that moment when a person you thought you knew well exposes that he is in fact someone else...@k@v17/21700295. .........I can''t explain.@k@v17/21700296. ...I can''t explain it at all..."'
13408: 'George@r@v07/20300640."I understand.@k@v07/20300641. ......I can tell just how dreadful a thing must have happened to cause you such a shock."'
13409: 'Gohda@r@v17/21700297."......Thank you very much,@k@v17/21700298. ...George-sama."'
13410: '@rAnd they all went silent again.'
13411: '@rNo matter how many times she was consoled, Shannon kept on crying, weeping that listening to the witch''s sweet whispers and breaking the spirit mirror on that day had been where this had all gone wrong...'
13412: 'George@r@v07/20300642."..................The witch that whispered to you...loses her powers if that mirror exists?"'
13413: 'Shannon@r@v15/20500780."...I think she explained it to me a little, but I don''t really remember.@k@v15/20500781. ......I think she said something about how she couldn''t release her power if that mirror existed."'
13414: 'George@r@v07/20300643."......What happened to this mirror that you broke?"'
13415: 'Shannon@r@v15/20500782."I don''t remember.@k@v15/20500783. I suppose, ...since I left it broken, ...it would just have been lying there the way I left it."'
13416: 'George@r@v07/20300644."......So when, as they say, the reef was struck by lightning and disappeared, it would have gone to the bottom of the ocean...@k@v07/20300645. Well, I''ll bet picking it up and taping it together wouldn''t have made it effective again anyway.@k@v07/20300646. Hahahahaha."'
13417: 'Shannon@r@v15/20500784.".........Truly, .........what.........have I done........."'
13418: 'George@r@v07/20300647."......Sorry.@k@v07/20300648. I shouldn''t have said that."'
13419: '@rHe didn''t know whether Shannon breaking the mirror had really been what had started everything off.'
13420: '@rThe servants didn''t go so far as to blame Shannon, but it seemed that they believed that it had been the trigger.'
13421: '@r...But even now, there was no way George could believe that much.'
13422: '@r......Even if he was told a story about witches and evil spirits, it just sounded fake to him.'
13423: '@rEven so, he listened seriously to Shannon''s story, trying to find a hint that might relieve at least a little of the pain in her heart.'
13424: 'Gohda@r@v17/21700299."Come to think of it, .........I think it is different from the one in that torii,@k@v17/21700300. ...but I have heard that Madam keeps a spirit mirror as a charm."'
13425: 'George@r@v07/20300649."......Oh?@k @v07/20300650.Aunt Natsuhi does?"'
13426: 'Gohda@r@v17/21700301."Yes.@k@v17/21700302. I believe she received it as one of the mementos of her grandfather or something, and that it held a very strong magic repelling power, a "historically rich"(?)@k @v17/21700303.spirit mirror or something..."'
13427: 'Genji@r@v14/21600181."............I have also heard the same story.@k@v14/21600182. ......Something about the mirror having the power to reflect that which is not good and send it back."'
13428: 'George@r@v07/20300651."If we had that spirit mirror, ......could we resist the witch, BEATRICE?"'
13429: 'Shannon@r@v15/20500785."Huh......"'
13430: '@rWhen George proposed this, the servants looked up.'
13431: 'George@r@v07/20300652."......The shrine and the torii where it was enshrined are gone now, but the important thing is that there is still another spirit mirror."'
13432: 'George@r@v07/20300653.".........I''ve heard that Aunt Natsuhi''s family is descended from Shinto priests.@k@v07/20300654. Maybe that isn''t just a simple mirror."'
13433: 'Gohda@r@v17/21700304."I, I believe I have heard Madam say that she keeps it safe in a treasure box.@k@v17/21700305. ...It might not be very large."'
13434: 'Shannon@r@v15/20500786.".........I don''t think its size is a problem.@k@v15/20500787. Even the mirror I broke looked small and insignificant at a glance."'
13435: 'George@r@v07/20300655."............If our opponent is occult, then we too must resist by using occult measures.@k@v07/20300656. ...If we just sit around here, nothing will be resolved.@k@v07/20300657. It''s worth trying, if only for some peace of mind."'
13436: '@rOf course, this didn''t mean that George had accepted the witch.@k@r......However, he thought it would be necessary to have some kind of purification ceremony to heal the wounds in Shannon''s heart.'
13437: '@r...So this story about Natsuhi''s spirit mirror was just what the doctor ordered.'
13438: 'George@r@v07/20300658."Let''s go.@k@v07/20300659. ...I won''t suggest going to finish off the witch or something so outrageous.@k@v07/20300660. ...However, I think it would be nice if we had something that repels magic to protect us from the witch."'
13439: 'George@r@v07/20300661."......Maria-chan told me about this earlier, but the door to Grandfather''s room is supposed to be able to repel magic, right?@k @v07/20300662.......As expected of Grandfather.@k@v07/20300663. He had sufficient defense against the occult as well.@k@v07/20300664. .........Let''s go.@k@v07/20300665. To Aunt Natsuhi''s room!"'
13440: 'Gohda@r@v17/21700306."Bu-but, I think Madam''s room is locked...!@k @v17/21700307.We returned the master keys to Rosa-sama,@k@v17/21700308. ...and even the servant room, which contains the key box, has been locked up..."'
13441: 'George@r@v07/20300666."......In that case, Aunt Natsuhi should have been walking around with that key.@k@v07/20300667. ...Aunt Natsuhi''s body should still be in the chapel.@k@v07/20300668. It will be bad to disturb it ourselves before the police come, but we can fully explain that."'
13442: 'Gohda@r@v17/21700309."However...the entrance to the chapel is also locked..."'
13443: 'George@r@v07/20300669."Hahaha, Gohda-san, are you not strong enough to break a single glass window?@k @v07/20300670.You could smash it with a rock from around there."'
13444: 'Shannon@r@v15/20500788."W-would it, ...umm, be okay to break the window of that important chapel...?"'
13445: 'George@r@v07/20300671."When Grandfather gets mad at us, I''ll take responsibility.@k@v07/20300672. ......From the beginning, I was planning on fighting with the whole Ushiromiya family today.@k@|@y@v07/20300673. So that they would permit my engagement with you.@k@v07/20300674. ...So I am already prepared."'
13446: 'George@r@v07/20300675."Let''s break the glass.@k@v07/20300676. Then, let''s borrow the key from Aunt Natsuhi''s body."'
13447: '@rIt seemed that George''s claim that he would take responsibility had given the servants a great amount of courage.'
13448: '@r...Shannon and Gohda glanced at each other, and then looked at George''s face again.'
13449: 'George@r@v07/20300677."Grandfather knows everything about the occult.@k@v07/20300678. I''m sure he''ll understand if it''s about the power of Aunt Natsuhi''s spirit mirror.@k@v07/20300679. Don''t worry, he won''t get mad at you."'
13450: 'Shannon@r@v15/20500789.".........I wonder if Madam''s mirror...@v15/20500790....can really seal BEATRICE-sama...@v15/20500791....once again."'
13451: 'George@r@v07/20300680."I don''t know.@k@v07/20300681. But I think it''s worth trying.@k@|@y@v07/20300682. ...So let''s go.@k@v07/20300683. It''s getting darker and darker outside.@k@v07/20300684. Let''s hurry!"'
13452: 'George@r@v07/20300685."Shannon, get a flashlight!@k @v07/20300686.Gohda-san, find something that looks like it can break the glass!@k @v07/20300687.Genji-san, sorry, but could you get us some umbrellas?"'
13453: '@r@o60.@v15/20500792|17/21700310|14/21600183."""Yes!"""@|@y'
13454: '@rThe servants, who had been rejected by Rosa, started to move once again, having gained a new master.@k@rGeorge, who was normally calm and gentle, was now exuding a commanding presence.'
13455: '@rShannon checked the emergency flashlight.@k@rJust in case, she changed the batteries.'
13456: '@rGohda was examining several heavy-looking cooking tools.@k@r...Normally, a self-respecting chef like himself wouldn''t want to use them for anything other than their intended purpose.'
13457: '@rBut now he was frantic to fulfill the orders of the one he accepted as his master.'
13458: '@rAfter some deliberation, he took a large, weighty frying pan.'
13459: '@rGenji removed several umbrellas from the umbrella stand set in the corner near the back door of the kitchen.@k ...He took three of them.'
13460: 'George@r@v07/20300688."Genji-san...?"'
13461: 'Genji@r@v14/21600184.".........I cannot go with you.@k@v14/21600185. ......It would be embarrassing for me, as the head servant of the Ushiromiya family, if we were all absent when an order was to be given."'
13462: 'Gohda@r@v17/21700311."Wh-...what in the world, Genji-san?!@k @v17/21700312.Even you should understand how dangerous it would be to be alone in this mansion now...!"'
13463: 'Genji@r@v14/21600186."......I can''t go.@k@v14/21600187. ......I must stay here so the Master can call me at any time."'
13464: 'Shannon@r@v15/20500793."Genji-sama......"'
13465: 'Genji@r@v14/21600188."......Go, and serve George-sama.@k@v14/21600189. Don''t make any blunders.@k@v14/21600190. Gohda, I''m counting on you to be an example."'
13466: 'Gohda@r@v17/21700313."Ye-.........yes.@k@v17/21700314. ...Leave it to me."'
13467: 'Shannon@r@v15/20500794."I will surely fulfill my duty..."'
13468: 'George@r@v07/20300689."Is this really alright, ...Genji-san?"'
13469: 'Genji@r@v14/21600191."Yes.@k@v14/21600192. .........I am already at this age.@k@v14/21600193. All the days of my life until now have been in repayment for the Master''s favor."'
13470: 'Genji@r@v14/21600194."...Whatever happens to a senile old man like myself will be decided by the roulette.@k@v14/21600195. I think I would like to sit here and see what the result will be with my own eyes."'
13471: '@rAs Genji said that, he sat down.'
13472: '@rAs though saying that he didn''t intend to discuss this anymore, ...his gaze fell to the chessboard that he had played on with Nanjo.'
13473: '@rWhen George saw this, he decided to leave Genji there.'
13474: 'George@r@v07/20300690."Let''s go, everyone.@k@v07/20300691. It looks like the wind is a little softer right now!"'
13475: '@rGeorge took an umbrella and dashed out into the hallway, and Shannon and Gohda chased after him, each holding a tool.'
13476: '@r......After they flew out of the room, Genji quietly extended his hand to the side of the chessboard.'
13477: '@r.........He softly pulled something that was there towards himself, and hid it by covering it with his palm.'
13478: '@rGenji killed his breathing even more than before.@k@r.........As he did, .........something flashed gold.'
13479: '@rFrom inside an ice pail set on the counter, ...a small gold butterfly appeared, softly and silently.'
13480: '@rIt was almost as though it had watched George and the rest leave, and was trying to secretly follow them......'
13481: '@rIt happened in an instant.'
13482: '@r...The gold butterfly, elegantly flapping its wings, was pinned against the wall by the knife Genji had thrown, just like a butterfly in a bug collection.'
13483: '@rAfter the gold butterfly beat its wings several times, looking like it was in pain, it accepted the fact that it couldn''t break free, became fine gold powder and smoke, and disappeared as though dissolving into water...'
13484: '@rGenji''s gaze was still lowered at the chessboard, as though nothing had happened.'
13485: '@r......Maybe he would think up a brilliant move very soon.'
13486: '@rBut no matter what move he made, his opponent would not be able to respond for all eternity.'
13487: '@rEven though he knew that, Genji searched for a brilliant move.'
13488: '@r......It must have been the perfect way to kill time, during the short period before some fate would be given to him...'
13489: '@r......He didn''t know what result the roulette would bring about.@k@rBut that decision would be made very soon.'
13490: '@r.........No one could interfere with the tumbling roulette ball...'
13491: '@rThe door to the parlor was not only locked, but blocked with a barricade made of sofas and the like.'
13492: '@rSo Auntie Rosa seemed to suspect that if a suspicious person appeared, it would be by breaking the window.'
13493: '@rSitting on a one-person sofa, her back to the door, she continued to hold onto her gun.'
13494: '@rI didn''t know what was what anymore, and so, my body and mind worn out, I was just playing with Maria however she wanted.'
13495: '@rIn Maria''s words,@k ...BEATRICE was testing us to see whether we could solve the epitaph of the gold, so we had to challenge this riddle.'
13496: '@rIn the beginning, I had been a little interested, and had tried to solve it, but I didn''t have a clue what those weird paragraphs even meant in the first place.'
13497: '@r......I didn''t doubt that there was some riddle hidden there, but I couldn''t imagine that I would solve it by chance.'
13498: '@rIn the middle part of the epitaph, there were lines saying to journey to the Golden Land, over the course of the first to the tenth twilight.'
13499: '@rOn the first twilight, sacrifice the six chosen by the key.@k@rOn the second twilight, those who remain shall tear apart the two who are close.'
13500: '@rIt was obvious that this hinted at the first six murders that had already occurred in the chapel, and Jessica and Kanon-kun''s murders.'
13501: '@rIf this was being followed, we would have to be prepared for yet five more people to be killed.'
13502: '@rOn the fourth twilight, gouge the head and kill.@k@rOn the fifth twilight, gouge the chest and kill.@k@rOn the sixth twilight, gouge the stomach and kill.@k@rOn the seventh twilight, gouge the knee and kill.@k@rOn the eighth twilight, gouge the leg and kill.'
13503: '@rThe bodies of Doctor Nanjo and Kumasawa baa-chan hadn''t been found.'
13504: '@r...However, if we reasonably assumed that they were the sacrifices of the fourth and fifth twilights,@k ......they would surely be found in a pitiful state, with their head and chest gouged.'
13505: '@rIn which case, could we expect that three more would be gouged in the stomach, knee, and leg, and be killed?'
13506: '@r......Who would that be?@k@r...I looked around the room, noticing that there were three people here, but, how should I say it, my emotions seemed paralyzed.'
13507: '@r...Strangely, I didn''t find it terrifying.'
13508: '@rMaria noticed me, with my upper body entrusted to the sofa, gazing lazily up at the ceiling.'
13509: '@r...Apparently, she felt I was slacking off in my riddle-solving.@k@rShe got mad at me, and told me I wasn''t being serious enough.'
13510: 'Battler@r@v10/20101018."......Hey, Maria."'
13511: 'Maria@r@v13/20400456."Uu...?"'
13512: 'Battler@r@v10/20101019."What was it again, that BEATRICE said she would do if we solved this?"'
13513: '@rI was sure that the witch had written in her letter that she would give up on collecting the interest, or something abstract like that.'
13514: '@r...I was optimistically taking that to mean that she would give up on killing the whole family,@k ......but was it really written with that meaning?'
13515: '@rI didn''t really feel that solving this riddle would actually save us.'
13516: '@r.........I thought that even if we did solve it, that would be doing just what the culprit wanted us to, and it would all be a wasted effort...'
13517: 'Maria@r@v13/20400457."No, that''s not true.@k@v13/20400458. ......If you solve the epitaph, Beato''s ritual will be over.@k@v13/20400459. So there won''t be any need for more people to die."'
13518: 'Battler@r@v10/20101020."......Really?@k @v10/20101021.Isn''t that rule just something she made up...?@k @v10/20101022.If we solve this riddle, ...we''ll probably know the location of Grandfather''s hidden gold.@k@v10/20101023. ...She''ll surely go after that and—"'
13519: 'Maria@r@v13/20400460."Uu.@k@v13/20400461. Won''t."'
13520: 'Battler@r@v10/20101024."...How...can you be so sure?"'
13521: 'Maria@r@v13/20400462."The gold was Beato''s from the start.@k@v13/20400463. She won''t go after something that''s hers."'
13522: 'Battler@r@v10/20101025."......Then, ...then why is Beato giving us all these big hints?@k @v10/20101026.......Not just that, why did she even set up this game-like thing?"'
13523: 'Maria@r@v13/20400464."Magic needs risk."'
13524: 'Battler@r@v10/20101027."......Risk.@k@v10/20101028. ...I don''t really get what you mean."'
13525: 'Maria@r@v13/20400465."For example, in a marathon,@k@v13/20400466. ......do you think that a medal that anyone can get by running the whole thing is worth the same as the medal given only to the person who gets first...?"'
13526: 'Battler@r@v10/20101029."No, I don''t...@k@|@y@v10/20101030. ......What are you trying to say? That in the end, she''s just playing around?@k @v10/20101031.Purposefully giving us a chance—"'
13527: 'Maria@r@v13/20400467."Noooooo.@k@v13/20400468. That''s what magic is.@k@v13/20400469. No matter how great the magic, there are always risks and weak points.@k@v13/20400470. No, there has to be."'
13528: 'Battler@r@v10/20101032."...I don''t get it when you call it magic, ...but if I think about it as a gamble, I can understand a little.@k@v10/20101033. If you aren''t prepared to lose big, then you can''t win big.@k@v10/20101034. And the slimmer the chances of winning, the bigger the payoff."'
13529: 'Maria@r@v13/20400471."That''s it, exactly.@k@v13/20400472. That''s why Beato properly explained the risk of the ritual to everyone.@k@v13/20400473. That''s why, if this riddle is solved, the ritual will be interrupted as promised.@k@v13/20400474. After all, if she breaks her promises, then there wouldn''t be any risk."'
13530: 'Battler@r@v10/20101035."If we solve this, ...will she really keep her promise?"'
13531: 'Maria@r@v13/20400475."Why are flowers beautiful even though they wither?@k @v13/20400476.Why is it that an artificial flower isn''t beautiful, even if it''s so elaborate you can''t tell the difference by looking?"'
13532: 'Maria@r@v13/20400477."Humans can bring about miracles by gambling their death.@k@v13/20400478. If there were an undying human, that person would have no way of bringing about a miracle.@k@v13/20400479. .........It''s the same for us, for life, for witches and for rituals.@k@v13/20400480. If we don''t bear a risk, we can''t achieve anything."'
13533: 'Battler@r@v10/20101036."......What do we do if we solve the riddle?@k@v10/20101037. Do we press our answer buzzers and put a hand in the air, tell the witch our answer and see what she says?"'
13534: 'Maria@r@v13/20400481."Uu.@k@v13/20400482. I don''t know about that.@k@v13/20400483. But, if we solve it, the ritual will surely end automatically."'
13535: 'Battler@r@v10/20101038."........................@k@|@y@v10/20101039. ...You sure know a lot, Maria.@k@v10/20101040. ...Did you learn all of that......from BEATRICE?"'
13536: 'Maria@r@v13/20400484."Uu."'
13537: '@rSo, ...if you don''t bear a risk, nothing can be gained.@k That is doubtlessly the way of the world, ......but it was in conflict with the chessboard theory style of thinking that I liked.'
13538: '@rA move in chess is always a search for the best play, that minimizes the risk, and promises an advantageous turn of events.'
13539: '@rYou don''t trust your plays to chance, like in gambling.@k ......That''s right, there''s no room for gambling in an intellectual game.'
13540: '@rAnd yet, this person called BEATRICE was carrying out such an outrageous crime,@k ...or maybe a ritual,@k ......while purposefully imposing conditions for her own loss and announcing them to us.'
13541: '@rIn chess, you always play the best move.@k@rSo by standing in your opponent''s position, you can predict their next move.'
13542: '@r...However, you couldn''t say for sure that BEATRICE''s moves were always the best moves.'
13543: '@rI thought she was probably making us focus on the epitaph as a smokescreen, to mislead us about something.'
13544: '@r......But Maria said that of all things was impossible.'
13545: '@rShe said that this was a genuine risk that the witch had taken, and therefore proof that this was a formal magical ritual.'
13546: '@r.........I can''t understand this witch called BEATRICE.'
13547: '@rShe must be committing this chain of murders with some goal in mind,@k ......so why would she deliberately expose the conditions for her own defeat?'
13548: '@r......No matter how I flip over the chessboard and think from my opponent''s perspective, ......I can''t understand why she would give up if this riddle was solved.'
13549: '@rIsn''t it almost as though BEATRICE...doesn''t care whether she wins or loses?@k It''s natural that chessboard reasoning wouldn''t work if you played chess against an opponent like this...'
13550: '@r...I don''t understand, I don''t understand.@k ......What is BEATRICE after that''s making her commit this crime?'
13551: '@rIf she just wants to massacre us all, she could just do it secretly, without this whole crazy setup.@k There was no need for that scrupulous advance notice, dramatic suggestions of locked rooms, or anything.'
13552: '@r...It''s all over-dramatized.@k@rI don''t get the point at all.'
13553: '@rAs long as I continue to think of BEATRICE as a greedy human culprit, will I be unable to understand anything?'
13554: '@r...If I don''t accept her as a witch, will I be unable to even set the pieces on the chessboard at all......?'
13555: '@r......If she really is a witch, and everything Maria has said is true...'
13556: '@r...then there''s only one thing we should have been doing.@k@r...We shouldn''t have bothered with any of the reasoning or the discord or the searching for the culprit.'
13557: '@rWe should have all gathered in the dining hall, and pooled our knowledge to solve the riddle.@k If we had pooled the knowledge of that many people, maybe we would have been able to at least grasp a thread of the answer...'
13558: '@rWe greedy humans, desiring to gain something more than one another, ......never pooled our knowledge, and were being offered up as sacrifices one by one.'
13559: '@r.........In the end, were we humans getting what we deserved?@k We thought we were thinking, ...but we were actually thinking only of our greedy selves.'
13560: '@rIn the end, chessboard theory is a technique of thinking where you project yourself on your opponent.@k ......So greedy people look inside their opponents and see their greedy selves...'
13561: '@rI looked vaguely at Auntie Rosa.'
13562: '@rShe was probably tired from being under all this tension the whole time.@k@rShe wasn''t sleeping, but she was continually staring vaguely at some point off in space.'
13563: '@rAuntie Rosa had proclaimed that she couldn''t trust anyone who had not been killed.'
13564: '@r......Auntie Rosa''s chessboard thinking......saw herself inside her opponent.'
13565: '@r...In other words, Auntie Rosa...@k...might be an isolated woman, unable to trust anyone and unable to let her guard down.'
13566: '@r...Long ago, I think I heard a bit about it from my dad.@k@rAuntie Rosa had originally been a very obedient child.'
13567: '@r......But because her age was so far separated from her other siblings,@k and because her confrontational siblings had often made conflicting demands of her,@k she had been going through psychological hardship ever since she was young.'
13568: '@rApparently, when she had taken the side of one sibling, often another gave her a hard time for it.'
13569: '@rCertainly Auntie Rosa had said many things today that could be taken as abusive language.@k .........But those were words that had been engraved into her vocabulary because they had been showered upon her as well.'
13570: '@rThe many abusive words that she had spoken......were also the same abuse that Auntie Rosa had been showered with in the past...'
13571: '@r...Now that I think about it, I have the feeling that her style of speech today has had occasional traces of Uncle Krauss and Auntie Eva in it.'
13572: '@r......I''d just assumed the similarity came from being siblings, ...but maybe that wasn''t the case...'
13573: '@rFor the first time, I was able to sympathize from my heart with Auntie Rosa, who I had come to think of as being only gentle...'
13574: '@rThen, what about Maria...?@k@rMaria had been claiming something for a while.'
13575: '@rIf we could solve the riddle that the witch had presented to us, the ritual would be halted and we would definitely be saved.'
13576: '@rAnd I think she also said that BEATRICE would never break a promise she made.'
13577: '@r......So that describes Maria herself.@k@rShe''s the one with the most innocent heart, who would never break a promise...'
13578: '@rSo she believed that BEATRICE wouldn''t break a promise either.@k@rShe could believe that.'
13579: '@rBut wasn''t that just an image of BEATRICE that Maria imagined...?@k There''s no proof that the real BEATRICE definitely keeps her promises, right...?'
13580: 'BEATRICE@r@v27/20701352."@|@y@c900.@[I keep my promises.@]@c.@k@v27/20701353. If you solve the riddle of the epitaph, you shall be able to reach the Golden Land.@k@v27/20701354. When that happens, the ritual will end.@k@v27/20701355. No more people will die."'
13581: 'Battler@r@v10/20101041."......So you''re saying a complete monster like you follows the rules?"'
13582: 'BEATRICE@r@v27/20701356."I won''t deny that I am brutal and unjust and a monster."'
13583: 'BEATRICE@r@v27/20701357."......However, I am a witch.@k@v27/20701358. I use magic.@k@v27/20701359. In order to use magic, there are some rules that must be followed.@k@v27/20701360. ...It is precisely because I am a witch that I cannot neglect those.@k@v27/20701361. You should believe at least that much."'
13584: 'Battler@r@v10/20101042.".....................@k@v10/20101043. ......Even after pulling all this shit, you''re still telling me to trust in at least the rules?"'
13585: 'BEATRICE@r@v27/20701362."......I do play tricks.@k@v27/20701363. Of course, I also deceive people.@k@v27/20701364. That''s no different from humans.@k@v27/20701365. ......But not once have I disregarded something that I have said as a promise."'
13586: 'BEATRICE@r@v27/20701366."What about you humans?@k @v27/20701367.Do you always keep your promises?"'
13587: 'Battler@r@v10/20101044."............Given that we have catchphrases like "keep your promises",@k@v10/20101045. ...it''s doubtful that we always follow them as we should."'
13588: 'BEATRICE@r@v27/20701368."From my perspective, humans are much more selfish monsters.@k@v27/20701369. ......There''s nothing as doubtful as a human''s promise.@k@v27/20701370. Even I sometimes make contracts with humans, but I doubt you can even imagine how strict an agreement must be made just to grant a single foolish wish."'
13589: 'BEATRICE@r@v27/20701371."...If there''s even a small loophole, they''ll immediately say something like "increase the number of wishes to one hundred", or "try transforming into a tiny speck"."'
13590: 'Battler@r@v10/20101046."......Dad often tells me something.@k@v10/20101047. He says that there''s nothing as scary as contracts.@k@v10/20101048. ......He said it''s only natural that people who agree without reading them thoroughly will be chewed to the bone.@k@v10/20101049. ...He made a killing through vice."'
13591: 'BEATRICE@r@v27/20701372."............Realize this.@k@v27/20701373. People do not know of fraud from birth.@k@v27/20701374. ...They suffer it somewhere.@k@v27/20701375. And so it is learned."'
13592: 'Battler@r@v10/20101050."..........................."'
13593: 'BEATRICE@r@v27/20701376."Yes, the sins of the human world, which must be forced on one another.@k@v27/20701377. ......Now who was the witch I heard that from...?@k@|@y@v27/20701378. Oh well.@k@v27/20701379. ......I''m not as heartless as you think, you see?@k @v27/20701380.*cackle*cackle*cackle*!"'
13594: 'Battler@r@v10/20101051."Liar!!@k @v10/20101052.All these people, and it''s not even the first time!!@k @v10/20101053.And you did it in such a horrible way too, how could you not be heartless?!!"'
13595: 'Battler@r@v10/20101054."You say you keep your promises?!@k @v10/20101055.Don''t say stuff like that!!@k @v10/20101056.I won''t accept you.@k@v10/20101057. Never.@k@v10/20101058. I believe that not giving that up is the only way I can resist you!"'
13596: 'BEATRICE@r@v27/20701381."............I see.@k@v27/20701382. So you''re saying that this eternal torment will be the same for me.@k@v27/20701383. .........*cackle*cackle*cackle*cackle*."'
13597: 'BEATRICE@r@v27/20701384."......Maybe so.@k@v27/20701385. One thousand years is a long time......@k@v27/20701386. Maybe a witch''s true strength is decided not by their magical power, but by their endurance.@k@v27/20701387. ...Yes, it explains how terrifying Lady Bern is."'
13598: 'Battler@r@v10/20101059."Damn you, babbling on and on about incomprehensible stuff.@k@v10/20101060. .........Hurry up and continue that eternal torment or whatever.@k@v10/20101061. I''m prepared to stick around for a thousand years, or even ten thousand."'
13599: 'BEATRICE@r@v27/20701388."*cackle*cackle*!@k @v27/20701389.Good, good.@k@v27/20701390. It looks like you''ve regained some of your will to fight.@k@v27/20701391. It would be boring otherwise."'
13600: 'BEATRICE@r@v27/20701392."Come now, don''t you often see it in multiplayer games?@k @|@y@v27/20701393.You enter as a new challenger, but the opponent is so weak that it''s a bit of an anticlimax, so you lose on purpose to extend the game until the last round,@k@v27/20701394. then get serious and beat them to a pulp, riiight?"'
13601: 'Battler@r@v10/20101062."......I don''t get the analogy."'
13602: 'BEATRICE@r@v27/20701395."It''s the same as wine.@k@v27/20701396. If you don''t let it age well, it won''t sparkle."'
13603: 'BEATRICE@r@v27/20701397."......You are a wine that can withstand that process.@k@v27/20701398. I''ll age you carefully.@k@v27/20701399. ......I''ll raise you to be the best alcohol to color my elegant time..."'
13604: 'BEATRICE@r@v27/20701400."So don''t let this much break you.@k@v27/20701401. Keep on denying me.@k@v27/20701402. After all, as long as you don''t accept me, I''m nothing more than a fleeting illusion.@k@|@y@v27/20701403. ......*cackle*cackle*cackle*cackle*cackle*cackle*cackle*cackle*cackle*cackle*...!"'
13605: 'George@r@v07/20300692."...............No matter how many times I see it, ......it''s awful."'
13606: 'Gohda@r@v17/21700315."......I sympathize with all my heart.@k@|@y@v17/21700316. ......Shannon-san, please get the key.@k@v17/21700317. ......Even though she has passed away, Madam is a lady.@k@v17/21700318. I cannot touch her."'
13607: 'Shannon@r@v15/20500795.".........Yes."'
13608: '@rShannon nodded sharply, her expression filled with a sense of duty.'
13609: '@rGeorge, Gohda and Shannon had broken a suitable window, and were inside the chapel.@k@r...Since they really hadn''t wanted to break one, they had searched for another way in, just in case.'
13610: '@r...But, in the end, that only proved once again that there was nowhere that anyone could slip in through,@k and emphasized further how inscrutable was the chapel''s locked room...'
13611: '@rInside the chapel, time had stopped since they had left it earlier.'
13612: '@rOf course, even George could not approach that horrible Halloween party again.'
13613: '@rIt was only natural.@k Because it made him remember again the sadness of losing both of his parents at once.'
13614: '@r......And Gohda, thinking of the possibility that their bodies might have changed in some horrible way now that a half of a day had passed, didn''t want to let George approach.'
13615: '@rShannon followed Gohda''s instructions, and approached the party table...'
13616: '@r...Normally, Shannon might have resented having another dirty job forced on her.@k ......But now, she could truly understand Gohda''s mental state.'
13617: '@rDespite Gohda''s prodigious skill, he had gotten into trouble, lost his job, and been left out in the streets, and then Natsuhi had given him a new life.'
13618: '@r......Even though it had just been a casual employment for Natsuhi, Gohda must have felt that it was a turning point in his fate.'
13619: '@r...Those around Gohda could see that he felt a special kind of loyalty to Natsuhi.@k ......So he probably didn''t want to lose that feeling, even though she was dead.'
13620: '@r......Now that half a day had passed, the bodies of Natsuhi and the rest had changed completely.@k@rSmall bugs that had sniffed out the smell of death had started to gather.@k@r...It really wasn''t something you could look at directly...'
13621: 'Shannon@r@v15/20500796."......Madam, ............excuse me......"'
13622: '@rBecause of her long experience as a servant, Shannon had an idea of which pocket Natsuhi had kept the key to her room in.'
13623: '@r.........Probably, in this pocket...'
13624: '@rHer guess didn''t fail her.@k Just by touching the outside of the pocket, she was immediately able to feel it...'
13625: 'Shannon@r@v15/20500797."It''s here.@k@|@y@v15/20500798. ......The key to Madam''s room."'
13626: '@rShannon held the key up high, showing the others that it had been found.'
13627: '@rAs George and Gohda watched her, their eyes opened wide...@k@rThat wasn''t the expression Shannon was expecting, so it startled her.'
13628: '@rBecause Shannon hadn''t noticed.@k@rGeorge and Gohda, watching from afar, had been able to notice it first.'
13629: '@rBecause when Shannon had held the key up high, ......a blizzard of gold leaf had billowed up from around the table.'
13630: '@rThey were...countless gold butterflies.'
13631: '@rBecause it was the first time George had seen them, to him, they might have looked fantastical.'
13632: '@r......But Gohda already knew.@k@r...He knew that those gold butterflies, far from being beautiful, held sway over something disastrous.'
13633: '@rAnd that gold swelled, trying to suck Shannon in.........'
13634: 'Gohda@r@v17/21700319."Sh-Shannon-san!!@|@y@k @v17/21700320.Run!!"'
13635: 'Shannon@r@v15/20500799."Huh?!@k @v15/20500800.Kyaa!!!"@|@y'
13636: '@rShannon also realized that she was about to be swallowed up by gold butterflies.'
13637: '@rShe ran unsteadily, her expression still shocked.@k@rAs she did, the gold butterflies danced around Shannon in unison.@k@rThey grouped together.@k They tried to swallow her up!'
13638: 'George@r@v07/20300693."Shannonnnnn!!@k @v07/20300694.Damn it, what is this?!@k @v07/20300695.Are these...the gold butterflies you guys were talking about?!"'
13639: 'Gohda@r@v17/21700321."Outside, quickly!!@k @v17/21700322.You bastards!@k @v17/21700323.Damn it, damn it!!"@|@y'
13640: '@rGeorge and Gohda rushed up to Shannon, driving off the group of butterflies.@k@rAnd while the butterflies were scattered, they ran towards the broken window!'
13641: '@rHowever, they needed good footing to get out of the window, which was surrounded with shards of broken glass.'
13642: '@rWhen they had entered, there had been enough time to prepare for that, but now there was none.'
13643: 'George@r@v07/20300696."Let''s go out through the door!!@k @v07/20300697.There''s no time to look for footing!"'
13644: 'Shannon@r@v15/20500801."......I-@v15/20500802....it won''t open...!@k @v15/20500803.It''s stuck...!"'
13645: 'George@r@v07/20300698."Give it to me!!@k @v07/20300699.Damn this ancient piece of crap -@|@y@v07/20300700.nnnnnnnn!!"@|@y'
13646: 'Gohda@r@v17/21700324."George-sama, quickly!!@k @v17/21700325.Damn it, you want a piece of me?! Uooooooooooooooohhh!!"@|@y'
13647: '@rGohda took off his jacket, swinging it around and scattering the group of butterflies.@k@rBut he was vastly outnumbered.@k@rIt was doubtful that it even bought them a short amount of time.'
13648: '@rGeorge struggled with the virtually broken handle.@k@rIts age showed, and it didn''t turn well.'
13649: '@rBrute force alone won''t do it, it needs the right angle or some trick......'
13650: 'Gohda@r@v17/21700326."George-sama!!@k @v17/21700327.Damn iiiiiiiiiiiit!!@k @v17/21700328.You monsteeers!!"@|@y'
13651: '@r......Just then, Gohda saw it.'
13652: '@r......He was seen by it.@k In other words, their eyes met.'
13653: '@rOn top of the party table,@k ......no, floating above it, backed by a stained glass window, laughing: the figure of the witch.'
13654: '@rHe saw the figure of the witch, laughing in the center of the golden whirlwind, allowing the gold butterflies to attend to her whims.'
13655: 'Gohda@r@v17/21700328_1."...............@v17/21700328_2.B-@v17/21700328_3.......BEATRICE........."'
13656: '@rIt should have been Gohda''s first meeting with her.@k@r...But he knew her at a glance.'
13657: '@rJust like the other servants had said, this was certainly, certainly...the witch of the portrait herself...!'
13658: 'BEATRICE@r@v27/20701407."*cackle*cackle*cackle*cackle*, hahahahahahahahahahahaha!!@k @v27/20701408.It is almost time for dinner, is it not?@k@v27/20701409. ......I am already the host of this mansion.@k@v27/20701410. So I must give you a warm reception with a wonderful dinner.@k@v27/20701411. ......And how perfectly ideal, there are three of you!@k@v27/20701412. ......My, my, how truly, truly convenient!!"'
13659: 'Gohda@r@v17/21700329."U-...uwaaaaaaaaaaaaaaaaaa!!"@|@y'
13660: 'George@r@v07/20300701."I-it opened!!"'
13661: 'Shannon@r@v15/20500804."Gohda-san, quickly...!!@k @v15/20500805.............!@k @v15/20500806.BEATRICE......sama..."'
13662: 'George@r@v07/20300702."Huh?!@k @v07/20300703................?!?!"'
13663: 'BEATRICE@r@v27/20701413."Are you sure you want to just stand there...?@k @v27/20701414.If you think this place is suitable for your cemetery, then very well.@k@v27/20701415. *cackle*cackle*!!@k @v27/20701416.I''ll praise your spirit for wanting to stay by your former masters'' side, serving them even after death!"'
13664: '@rThe golden whirlwind enshrouding the witch burst.'
13665: '@rIt was like...an evil hand had literally spread its fingers and was trying to attack them!'
13666: '@rThe group of gold butterflies attacked with a "whoosh" sound.'
13667: 'George@r@v07/20300704."Hurry!!@k @v07/20300705.We can''t stand here!!"'
13668: '@rGeorge''s voice brought Shannon and Gohda back to themselves.@k@rStanding here now would be the same as a frog being stared down by a snake.'
13669: '@rThey had to resist.@k@r......They had to fight this incarnation of the new, brutal, and frightening order that had enveloped Rokkenjima...!'
13670: '@rThere was no time to take out their umbrellas.@k@rThe three of them dashed out into the pouring rain.'
13671: '@rThey never realized because they didn''t turn around,@k but the gold butterflies apparently couldn''t handle the rain too well, and this hampered their ability to chase after the three.'
13672: '@rThe three people ran from their golden pursuers and flew into the mansion...'
13673: 'BEATRICE@r@v27/20701417."............*cackle*cackle*cackle*cackle*.@k@v27/20701418. How nice, how nice.@k@v27/20701419. If it wasn''t like this, it wouldn''t be interesting!"'
13674: '@rThey unlocked the door, and flew into the room.'
13675: '@rA bit of the scent from Natsuhi''s favorite gentle incense remained in the room.'
13676: '@r...However, there was no time to let that calm them now.'
13677: 'George@r@v07/20300706."Where is it?!@k @v07/20300707.You said it was in a treasure box, right...?!"'
13678: 'Gohda@r@v17/21700330."It''s just something I heard...!@k @v17/21700331.I never knew where it actually...!"'
13679: 'Shannon@r@v15/20500807.".........I, I think it''s probably in her dresser, or in the corner by the bed!"'
13680: '@rShannon claimed that because of her woman''s sense.@k But in the corner by the bed, there was only an incense burner, a half-read novel, and a pair of glasses.'
13681: '@rBut the dresser was elegant and had many drawers, and it would be understandable if she had kept some of her valuables there.'
13682: 'George@r@v07/20300708."Auntie Natsuhi, I''m sorry...!!"'
13683: '@rHe began to violently open each one of the drawers.@k@rHe had to hurry.'
13684: '@rHe couldn''t actually hear footsteps, ...but he had the feeling that the witch was approaching...'
13685: '@rHe had the feeling that her laugh was approaching...!!'
13686: '@rHe pulled out the drawers one by one and examined their contents.'
13687: '@r......Every small box for makeup looked like a treasure box,@w500. and the amount of effort it would take to inspect all of them made him feel a little dizzy.'
13688: 'Shannon@r@v15/20500808."May-......maybe it''s this box...@k@v15/20500809. It''s locked, and I can''t open it...!"'
13689: '@rAt a glance, it looked slightly larger than a music box.@k@rWhen shaken, it rustled, as though various small objects were inside.@k@rBut it was locked and wouldn''t open!'
13690: 'Shannon@r@v15/20500810."N-normally, you''d hide the key somewhere nearby.@k@v15/20500811. ...But maybe some people always take it with them......@k@v15/20500812. I don''t know, ...I don''t know...!!"'
13691: 'George@r@v07/20300709."There''s no choice—let''s break it!@k @v07/20300710.But we can''t do it recklessly, right, we might break the mirror inside.@k@v07/20300711. Isn''t there some tool we could pry it open with...?!@k @v07/20300712.Damn it...!!"'
13692: '@rGohda looked all over the room, trying to see if there was some tool that they could use.@k@rAnd he noticed the door, which had been left open ever since they had entered.'
13693: '@rHe approached the door to close it, ......and noticed the abominable shadows of people approaching from beyond the darkness in the hall...'
13694: '@rNo, the phrase "shadows of people" wasn''t right.@k@rBecause that referred to Human shadows.'
13695: '@r......You can''t call the shadows of beings that aren''t Human "shadows of people"!!'
13696: 'Gohda@r@v17/21700332."...............G-@v17/21700333.......George-sama!!!@k @v17/21700334.H-@v17/21700335.......hurry......"'
13697: '@rGohda''s voice trailed off...@k@rIt was the shock from seeing a procession of those not of this world.'
13698: '@rHe was a servant.@k@rSo he knew all of the servants that worked for the Ushiromiya family.'
13699: '@r...But he didn''t know about these.@k@rHowever, they were definitely servants...!!'
13700: '@rThey weren''t servants working for Ushiromiya Kinzo or Ushiromiya Krauss.'
13701: '@r...They were new servants, who worked for the new master of the mansion, the Golden Witch BEATRICE,@k and who had goats'' heads and bright-red, boiled eyes of lava!!'
13702: '@rAs the new master laughed loudly and trimly directed six of the new servants,@k he saw her pierce the darkness as she came.'
13703: '@r...Of course, she was clad in the gold butterflies that were her symbol.'
13704: '@rGohda hurriedly closed the door and locked it!@|@y'
13705: '@rHowever, the instant he locked it, it returned to normal, just as though it had been knocked back by a spring or something!'
13706: '@rIt almost gave the illusion that some prankster on the other side of the door was opening it every time he closed it.'
13707: '@r......Distance-wise, they shouldn''t have reached the other side of the door yet!!'
13708: '@rThen who, how...?!'
13709: '@rIt felt just like playing with a broken toy.'
13710: '@rClick, boing.@|@y@k@rClick, boing!!@|@y'
13711: 'Gohda@r@v17/21700336."U-uwaaaaaaaaaaaaaaa!!@|@y@k @v17/21700337.I-it won''t close!!@k @v17/21700338.It opens even if I close it!@k @v17/21700339.What''s going on, damnitdamnitdamnitdamnit!!"'
13712: 'BEATRICE@r@v27/20701420."Ku-hah-hah-hah-hah-hah-hah-hah-ha...!!@k @v27/20701421.Did you think a lock would stop me?@k @v27/20701422.Did you think the door to that room would inhibit the room''s new master?!"'
13713: '@rIt was like the witch could see Gohda''s frantic effort through the door.'
13714: '@rEven as he struggled, their footsteps continued to approach.'
13715: '@rAnd when not just footsteps, but their breath too could be heard,@k Gohda gave up on the lock and rammed the door with his shoulder, making the lock his own large body.@|@y'
13716: 'Gohda@r@v17/21700340."......George-sama, quickly quickly quickly!!!"'
13717: 'Shannon@r@v15/20500813."George-sama, what about this?!"'
