13744: 'BEATRICE@r@v27/20701423.".........Shannon.@k@v27/20701424. The roulette has chosen you and George.@k@v27/20701425. Thank me for your day of release.@k@v27/20701426. I assume you have no regrets?"'
13745: 'BEATRICE@r@v27/20701427."None at all, riiight?@k @v27/20701428.Receiving an engagement ring from the man you fell for, and then being killed before spending a night together, that isn''t a regret at all, riiiiiiiiiiiiight???@k @v27/20701430.You wanted him to teach you the happiness of being a woman, didn''t yooouuu?@k @|@y@v27/20701431.Kuhihihyahyahyahyahyahyahyahya!!"'
13746: 'BEATRICE@r@v27/20701432."Ahh, no, no, Shannon, it''s hanging! Your regret. From your mouth.@k@v27/20701433. I can see it dribbling from your moooooooouth, Shannonnnnnnnnnnnnnnnnn???@k @|@y@v27/20701434.Hiiihyahyahahahahahahahahaha@v27/20701435.@|@y kyaaakyakkyakkyakkyakkyakkya!!!"'
13747: '@rCrack.@k It was the sound of the lid to the treasure box breaking and opening.'
13748: '@rWhen George turned it over, out fell accessories, charms,@w333. ......various small objects that Natsuhi had treasured when she was a girl.'
13749: '@r...Mixed in with those was a pouch that stood out from the rest.'
13750: '@rHe picked it up, and checked it immediately.@k .........This was it.'
13751: 'George@r@v07/20300716."I found it—this is it........."'
13752: 'BEATRICE@r@v27/20701436."One move short.@k@v27/20701437. *cackle*cackle*cackle*cackle*cackle*!!"'
