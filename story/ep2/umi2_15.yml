13720: 'Gohda@r@v17/21700341."Quickly quickly!!@|@y@k @v17/21700342.HiiIIiii,@|@y@v17/21700343. UOOOOOOOOOAAAAAAAAAAAAAAHHH!!"@|@y'
13721: '@rThe pressure from across the door grew even stronger.'
13722: '@r......Gohda screamed.@k It wasn''t a war cry for this test of strength.@k@r......He was terrified.'
13723: '@rHe was simply terrified that, except for a single wooden door, he would be touching something not of this world.'
13724: '@rBut he was still lucky.@k@rHe wasn''t touching them directly.@k@rBecause they were on the other side of the door.'
13725: '@rSo it was natural that if he did touch them directly, ...Gohda''s cry would turn from something brave into a shameful,@k ...and yet very real scream that would make glass shatter.'
13726: '@rGohda couldn''t believe what was right before his eyes.'
13727: '@r...Going through the door,@w250. ...an arm,@w333. ......an arm,@w166. ......almost as though it was sticking through the surface of water,@k slipped through, as though it was perfectly natural, and stroked the back of Gohda''s hand as he tried desperately to hold the door closed.'
13728: '@r.........It...@w416.traced slowly up his arm,@w416. ...to his chest,@w250. ...and then...@w166.......his chin.'
13729: '@rBy now, Gohda''s scream was not even vocalized.@k@rHe could hear a sweet whispering voice from across the door.'
13730: '@r......It wasn''t coming from the witch, but judging by the sound of the voice, it was a young woman.'
13731: '@r...But there was no difference in the fact that it was a voice from one not of this world.'
13732: 'Beelzebub@r@v43/22800001."......*giggle*giggle*.@k@v43/22800002. How cuuute.@k@v43/22800003. ......Hey. You see it, right? Your life flashing before your eyes.@k@v43/22800004. ......Tell me. When it''s over."'
13733: 'Gohda@r@v17/21700344."HIIIIIIIIIiiiiiIIIIIIIIIIIiiiiIIIIiii!!"@|@y'
13734: 'Beelzebub@r@v43/22800005."Thanks.@k@v43/22800006. Over already, huh?@k@v43/22800007. ......*giggle*giggle*!"'
13735: '@rThat obscene arm burst apart.@k And they heard the sound of something jumping around the room at an incredible speed.'
13736: '@rThey didn''t know what it was.@k@rIncredibly fast, small, like steel or maybe a beetle...!'
13737: '@rWhen it buried itself right in the center of Gohda''s chest and stopped,@w500. .........for the first time,@w250. ...they realized that its true form...@w500....was something like a stake with a strange design on it......'
13738: '@rGohda''s large body shook, ...@w333....bent backwards,@w500. ......and fell over.@|@y'
13739: '@rAs it did, the door opened softly, even though no one was pushing it,@w500. ......and the new masters of this room were welcomed in.'
13740: '@rIt looked almost as though the door itself had accepted them.'
13741: '@rThe goat attendants entered one after another, six of them...!!'
13742: '@rThen that witch entered, and the gold butterflies entered!!'
