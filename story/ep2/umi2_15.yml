13810: '@rThe bright-red ripples frantically drew a pattern of resistance, but the wall was beginning to envelop the two, becoming instead a red wall of despair...'
13811: 'Shannon@r@v15/20500840."............George-san, I''m sorry......@k@v15/20500841. .........It was impossible...@v15/20500842.......for me,@v15/20500843. ...after all........."'
