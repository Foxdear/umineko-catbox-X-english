7767: '@rMy mind wandered.'
7768: '@rBack to the days when I could barely imagine the happiness I have today.'
7769: '@rI was a middle schooler at the time.@k@rAn ordinary girl, who dreamed about love, as is normal at that age.'
7770: '@rBut I really should not have dreamed that dream.'
7771: '@r...Because I am "furniture".@k@rFurniture is nothing more than a tool, and is not human.'
7772: '@rFor a person less than human such as myself, just receiving my education was more than sufficient happiness.'
7773: '@rSo even thinking about love was more than I deserved...'
7774: '@rThe Ushiromiya family conference was a customary event held every October,@k but relatives would occasionally visit at other times as well.@k@r...Of course, they didn''t come just to drink tea.'
7775: '@rOn this day, Eva''s family had visited the head family on Rokkenjima.'
7776: '@rThe three people from Krauss''s family and the three people from Eva''s family had gathered in the parlor,@k and were having a friendly chat as they updated everyone on their situations.'
7777: '@rGenji had supposedly told Kinzo of Eva''s family''s arrival, but he hadn''t come down yet.'
7778: '@r...He was probably immersed in his own "research", and couldn''t spare the time.'
7779: '@rThis often happened, so the others waited patiently for their fickle father to come down.'
7780: 'Krauss@r@v02/20800001."Hoh.@k@v02/20800002. That does sound promising.@k@v02/20800003. Study a lot at your father''s, and do your best to become able to help him soon."'
7781: 'George@r@v07/20300106."Thank you very much.@k@v07/20300107. The mentors Father has introduced me to are providing me truly valuable study.@k@v07/20300108. Everything I learn is something that can''t be learned in school."'
7782: 'Hideyoshi@r@v06/21100001."It''s not language or math you learn in school.@k@v06/21100002. What you study is the attitude to have towards studying.@k@v06/21100003. Once you form that basis, you can finally start a long period of study that''ll last your entire life."'
7783: 'Hideyoshi@r@v06/21100004."People who don''t get this will spend the rest of their lives with rocks for brains, totally unable to absorb knowledge.@k@v06/21100005. They might get full marks in math and language, but they''ll be useless for their company!"'
7784: 'Krauss@r@v02/20800004."Mmhm, that is exactly right.@k@v02/20800005. Hideyoshi-san, your education policy is always truly excellent."'
7785: 'Hideyoshi@r@v06/21100006."You''re not a full man yet, George!@k @v06/21100007.Always keep that in mind, and embrace your studies."'
7786: 'Eva@r@v05/21000001."Oh, stop that, honey.@k@v05/21000002. George is always doing his very best.@k@v05/21000003. Aren''t you?"'
7787: 'Natsuhi@r@v03/20900001."Truly excellent.@k@v03/20900002. I wish our Jessica would learn from him..."'
7788: 'Jessica@r@v04/20200001."...Ughhh.@k@v04/20200002. Are you still holding a grudge about my test scores?@k@v04/20200003. I said I am studying for the exams, I''m doing it my own way.@k@v04/20200004. You didn''t have to bring it up here as well.@k@v04/20200005. Cram it already."'
7789: '@rWhen George was praised for his diligence, the conversation would nearly always turn to Jessica, who hated studying.'
7790: '@rJessica made an openly displeased face, as though she''d known it would come back to her.'
7791: 'Krauss@r@v02/20800006."My, my...@k@v02/20800007. In addition to studying, I think you need to learn to speak a little more ladylike, don''t you?@k @v02/20800008.It''s quite shameful for a daughter who bears the Ushiromiya family crest."'
7792: 'Eva@r@v05/21000004."Oh, but this is charming in itself, don''t you think?@k @v05/21000005.Times change.@k@v05/21000006. The times when we had to feign purity in order for a man to allow us to eat ended a long time ago."'
7793: 'Jessica@r@v04/20200006."Yes, yes!@k @v04/20200007.I knew you''d understand, Auntie Eva!@k @v04/20200008.Eheheheh!"'
7794: 'Natsuhi@r@v03/20900003."......Haah...@k@v03/20900004. My headache is truly trying today."'
7795: 'George@r@v07/20300109."Are you alright?@k @v07/20300110.Aunt Natsuhi, your face looks off-color."'
7796: 'Natsuhi@r@v03/20900005."Thank you, I am all right.@k@|@y@v03/20900006. ......But time really has flown.@k@v03/20900007. It feels like just yesterday when you would run around half-naked by the beach and come back soaked."'
7797: 'Eva@r@v05/21000007."Wasn''t Jessica-chan the same?@k @v05/21000008.And now she''s a lady who fusses over how to put on makeup.@k@v05/21000009. You really are particular about your eyebrows... You look really cute today."'
7798: 'Jessica@r@v04/20200009."Thank you very much.@k@v04/20200010. Nobody noticed, so my confidence was taking a beating."'
7799: '@rA full smile rose to Jessica''s face as the results of her own "studies" were finally noticed.'
7800: '@rEva smiled back just as widely.@k@r...Then, she turned that smile towards Natsuhi.'
7801: 'Eva@r@v05/21000010."Come on, Natsuhi nee-san!@k @v05/21000011.You must take notice of small changes in your own child.@k@v05/21000012. Poor Jessica-chan.@k@v05/21000013. She must have wanted her mother to notice first, su~rely?"'
7802: 'Jessica@r@v04/20200011."It''s fine, it''s fine.@k@v04/20200012. She never notices anything like that."'
7803: 'Krauss@r@v02/20800009."Jessica.@k@v02/20800010. I do not think much of you calling your mother "she".@k@v02/20800011. Apologize."'
7804: 'Natsuhi@r@v03/20900008."......Later, I will speak to you at length about your language."'
7805: 'Jessica@r@v04/20200013."Ugh...@k@v04/20200014. If you''ve had enough of the annoying little kid, just say so next time.@k@v04/20200015. I''m getting out of here.@k@v04/20200016. This room is getting stuffy."'
7806: 'Natsuhi@r@v03/20900009."Jessica...!"'
7807: '@rJessica was still at that unpredictable age with exams right around the corner.@k@rRecently, she had clashed often with her mother, who was enthusiastic about her education.'
7808: 'Shannon@r@v15/20500132."Excuse me...@k@|@y@v15/20500133. kya?!"'
7809: '@rJessica, making to leave the parlor in a bad mood, and Shannon, pushing a serving cart loaded with tea, bumped into each other.'
7810: 'Jessica@r@v04/20200017."Ah, Shannon. Don''t bother with my tea.@k@v04/20200018. I''m just going to wander around the garden."'
7811: 'Shannon@r@v15/20500134."...Mi-Milady..."'
7812: 'Natsuhi@r@v03/20900010."Shannon, the tea is getting cold.@k@v03/20900011. Serve it quickly."'
7813: 'Shannon@r@v15/20500135."My, my apologies..."'
7814: '@rShannon hadn''t actually done anything wrong,@k but Natsuhi, who felt like some shame to herself had been shown, lashed out at her emotionally.'
7815: '@r...This was something that often happened in the Ushiromiya family.@k@rBut it seemed that Shannon wasn''t strong-willed enough to accept it that way.'
7816: '@rShe shrunk back, and nervously prepared the black tea.'
7817: '@rShe had the unfortunate habit of making more mistakes when she felt intimidated.'
7818: '@rHer pitiful appearance dispersed the peaceful atmosphere that had been there until just a moment ago.'
7819: '@rThat wasn''t really Shannon''s fault, but she thought she might be the source, and felt a pressure on her chest.'
7820: '@rHer shaking fingers made the porcelain clatter, and you couldn''t have called it graceful, not even as an empty compliment.'
7821: '@rThe more pitiful everyone thought that was, the greater the silence grew,@k the more irritated Natsuhi looked, and the more Shannon cowered...'
7822: '@rShannon''s thin neck felt like it was being choked and suffocated by the death god called tension.'
7823: '@rThen, George spoke cheerfully, as if to blow away the stiff atmosphere.'
7824: 'George@r@v07/20300111."That''s a nice smell.@k@v07/20300112. What kind of tea is it?"'
7825: 'Shannon@r@v15/20500136."Umm,@v15/20500137. .........this is......"'
7826: 'George@r@v07/20300113."No, don''t say it.@k@v07/20300114. I''ll guess.@k@v07/20300115. It''s a very distinctive smell, so I probably know it.@k@v07/20300116. ......Is it...Earl Grey?"'
7827: 'Shannon@r@v15/20500138."I, I think it probably is..."'
7828: 'George@r@v07/20300117."Ahahahaha.@k@v07/20300118. It probably is Earl Grey.@k@v07/20300119. When you get back to the kitchen, check the can."'
7829: 'Krauss@r@v02/20800012."Hoh.@k@v02/20800013. George-kun, are you knowledgeable about black tea?"'
7830: 'George@r@v07/20300120."I''m currently in the service of a company president who knows a lot about black tea.@k@v07/20300121. After enough time listening to his expositions, I picked up a little of it."'
7831: 'Hideyoshi@r@v06/21100008."Oh yeah, the president of Okonogi Foods.@k@v06/21100009. That sort of in-depth knowledge is his specialty!"'
7832: 'Eva@r@v05/21000014."The names of tea often refer to the place where it''s made, right?@k @v05/21000015.So is this something cultivated from a place called Earl Grey?"'
7833: 'George@r@v07/20300122."I have heard that long ago in England, there was an earl called Grey, and it was named after him."'
7834: 'George@r@v07/20300123."Incidentally, this distinctive smell doesn''t come from tea leaves, but from a fruit called a bergamot, which is a relative of the mandarin orange."'
7835: 'Natsuhi@r@v03/20900012."Is that so?@k@v03/20900013. I never knew that.@k@v03/20900014. Having that knowledge, the tea will taste even more delicious."'
7836: 'Hideyoshi@r@v06/21100010."Alcohol and cigarettes are the same.@k@v06/21100011. With luxuries, you''ve gotta appreciate the romance.@k@v06/21100012. Knowledge like this deepens the taste."'
7837: 'Eva@r@v05/21000016."It''s the same with the advertising on medicine.@k@v05/21000017. Natsuhi nee-san, you should try reading the explanation on your favorite headache medicine someday.@k@v05/21000018. *giggle*giggle*giggle*giggle*."'
7838: 'Krauss@r@v02/20800014."Hahahaha!@k @v02/20800015.A fine idea.@k@v02/20800016. Try it tonight."'
7839: 'Natsuhi@r@v03/20900015."...Yes, I shall."'
7840: 'George@r@v07/20300124."Shannon-chan, open that pot and have a look.@k@v07/20300125. You should be able to find some dried bergamot mixed in with the tea leaves."'
7841: 'Shannon@r@v15/20500139."Ah, ......yes.@k@v15/20500140. It is in there.@k@v15/20500141. Something like dried orange peel is mixed in."'
7842: 'George@r@v07/20300126."Yep.@k@v07/20300127. That''s probably bergamot.@k@v07/20300128. The main ingredient in Earl Grey''s scent.@k@v07/20300129. The scent is vivid, so it gives the impression of having a sharp taste, but it''s a docile taste that''s easy to drink."'
7843: 'George@r@v07/20300130."It might be lovely to make it with milk - the scent should become more mild.@k@v07/20300131. If there''s anything left in the pot after you''ve poured for everyone, you really should make a milk tea out of it and try it out."'
7844: 'Shannon@r@v15/20500142."Ah, ...yes...@k@v15/20500143. Thank you very much..."'
7845: '@rGeorge gave her a small wink.'
7846: '@rShannon finally realized that George had been doing her a favor by calming down the atmosphere in the room.@k And he had been doing it for her sake as she had lost her self-confidence.'
7847: '@rThe Ushiromiya family did not pamper their servants.@k@rSo if there was any awkwardness, they would be harshly punished.'
7848: '@rSo it didn''t often happen that they were given a helping hand like this.'
7849: '@rThanks to George''s concern, Shannon was somehow able to get ahold of herself and finish serving everything safely.'
7850: '@rIf she was calm when she worked, she could easily carry out her tasks elegantly and flawlessly.'
7851: '@rBy the time the black tea was laid out on the table and the elegant scent drifted around,@k the room was completely back to how it had been, in a peaceful mood, as everyone praised George''s knowledge.'
7852: '@rShannon wanted to thank him for saving her, but it didn''t look like she would get the chance.'
7853: '@rSo she at least thanked him inside her heart, praying to God that George would hear it, and pushed the serving cart away.'
7854: 'Jessica@r@v04/20200019."George nii-san has always lent a helping hand in times like that.@k@v04/20200020. By changing the topic or something."'
7855: '@rShannon and Jessica could be seen in the rose garden.'
7856: '@rJessica, having gotten into a fight with her mother, now felt unable to simply nonchalantly wander back into the parlor, and so found herself here, killing time.'
7857: 'Shannon@r@v15/20500144."......When I think back on it, I feel that maybe this wasn''t the first time he has helped me like that."'
7858: '@rWhenever I made a careless mistake, and George-sama was there,@k he would always naturally smooth things over and make things harmonious, I think.'
7859: '@r...Maybe it wasn''t something as direct as picking up a fork that had been dropped.'
7860: '@rBut that was his way of caring.@k@rEven servants have pride.@k They want to fix their own mistakes by themselves.'
7861: '@r...Because if a guest helped them out with that, they would lose face.'
7862: 'Jessica@r@v04/20200021."He''s really good at reading between the lines in those kinds of situations.@k@v04/20200022. Well, maybe that''s George nii-san''s aesthetic take on things.@k@v04/20200023. That guy''s more of a show-off than he looks.@k@v04/20200024. Ahahahahaha."'
7863: 'Shannon@r@v15/20500145."Tha-that''s not true...@k@v15/20500146. ...I think he is a really wonderful person."'
7864: 'Jessica@r@v04/20200025."Hmmmm...?!@k @v04/20200026.......Shannon, you haven''t fallen in love with George nii-san, have you?"'
7865: '@rShannon had refuted Jessica''s words uncharacteristically forcefully, so Jessica caught on immediately.'
7866: 'Shannon@r@v15/20500147."No, ...that''s not it, I...think......"'
7867: 'Jessica@r@v04/20200027."Come to think of it, I''ve never heard any of that kind of gossip about George nii-san.@k@v04/20200028. Wait...@k @v04/20200029.Actually, didn''t I hear him say that family-oriented girls were his type?@k @|@y@v04/20200030.Nice, that fits you perfectly, Shannon!"'
7868: 'Shannon@r@v15/20500148."It, it, it does...?!@k @|@y@v15/20500149.I don''t -@v15/20500150.I am not, umm,@v15/20500151. ...qualified...for that..."'
7869: 'Jessica@r@v04/20200031."You sure are qualified!@k @v04/20200032.You''ve known each other for years, you''re almost childhood friends.@k@v04/20200033. They say that when you have a natural relationship where you don''t think of each other as boy and girl, it''s plain sailing once you do!@k @v04/20200034.No doubt!"'
7870: '@rJessica loved teen magazines with these kinds of stories, and she was always on the phone talking excitedly with her friends about that kind of thing.'
7871: '@rSo she had a keen intuition for this kind of romantic topic.'
7872: '@rSo, this wasn''t the first time a topic like this had been brought to Shannon.'
7873: '@rBut it was certainly the first time she had noticed George as a member of the opposite sex.'
7874: '@rShe was furniture, and George was an honored guest connected to the Ushiromiya family.@k@r......She had thought it impermissible to even imagine any deeper relationship.'
7875: '@rSo she hadn''t thought about it.'
7876: '@rJessica was taking immense pleasure in poking fun at all this, since it didn''t affect her.@k@rShannon was doing her best to make sure that her blushing cheeks weren''t discovered.'
7877: '@rSo if George showed up at a time like that, there would be no way that she would be able to keep her cool.'
7878: '@rThey saw George come out from the entrance hall of the mansion.@k@rIt looked like he had seen them as well.@k@rHe headed over, waving his hand.'
7879: '@rShannon had to frantically try to regain her ordinary composure before George reached them...'
7880: 'George@r@v07/20300132."Grandfather finally came down.@k@v07/20300133. Now they''re having an adult discussion, so they chased me out."'
7881: 'Jessica@r@v04/20200035."Hahaha, escaping then was the right choice.@k@v04/20200036. I''d sooner kiss a god of pestilence than go look Grandfather in the face."'
7882: 'George@r@v07/20300134."You shouldn''t speak that way.@k@v07/20300135. ...However, I think Grandfather may think of us as such pestilent creatures.@k@v07/20300136. After all, we came over here specifically to ask him for money for business."'
7883: '@rThat''s right - this wasn''t the customary annual October family conference.'
7884: '@rEva''s family had visited to apply for a business loan from the main family.'
7885: '@rKinzo had vast resources, and he lent those out to his children.'
7886: '@rOf course, this was not money to lend because they had gotten themselves into financial trouble.@k@r...How would they expand their business, using the vast amount of money that they borrowed?'
7887: '@rHow much interest would be attached, and how soon could it be repaid?'
7888: '@rThis wasn''t a loan for the have-nots.@k@rIt was a loan for those who were on the offense.'
7889: '@rKinzo judged strictly whether it was worth lending out his fortune, and afterwards, he strictly oversaw its use.'
7890: '@rSo there was occasionally this spectacle where relatives visited Rokkenjima and explained their business to Kinzo.'
7891: '@rTo the parents, it may well have been a meeting concerning the movement of large sums of money, forcing immense stress upon them.'
7892: '@rBut to Jessica, who lived on this isolated island called Rokkenjima, it was a precious opportunity to meet up with her cousins.'
7893: '@rSo even her bad mood from getting into that fight with her mother...@kwas immediately cured by this chat with the infrequent visitor George.'
7894: 'Jessica@r@v04/20200037."My family''s a total bunch of tightwads.@k@v04/20200038. They''ve probably got money to spare, why not be generous with it.@k@v04/20200039. I bet my Dad and Grandfather are both just being really tight."'
7895: 'George@r@v07/20300137."It''s natural to be prudent when lending money.@k@v07/20300138. Of course, my father has come with a plan by which he can expand his business with what he borrows, and which he can definitely repay.@k@v07/20300139. Everything else will be up to the presentation."'
7896: 'George@r@v07/20300140."......Really, I would have liked to watch alongside and learn.@k@v07/20300141. But Mother chased me out.@k@v07/20300142. I''m a little let down."'
7897: 'Shannon@r@v15/20500152."......It seems that the Master still scolds Krauss-sama and Eva-sama in just the same way he did when they were kids.@k@v15/20500153. I''m sure she didn''t want to show that to you, her son."'
7898: '@rAs Shannon hung her head, she thought back on those scenes she had grown used to seeing while working in the mansion.'
7899: '@rEven Krauss, who acted haughtily towards his siblings, was still treated like a child by Kinzo.'
7900: '@r...Shannon herself had often seen Kinzo slapping Krauss, or making him sit in seiza-style.'
7901: '@r......It was probably deeply humiliating to have that forced upon him at his age.'
7902: '@rIn the Ushiromiya family, taking care not to be present when this happened was one of the great tasks of the servants.'
7903: '@r...Of course, that did mean that Shannon had been making mistakes by being witness to it.'
7904: 'George@r@v07/20300143."Probably.@k@v07/20300144. ...Realizing that and going away may be my duty as her child.@k@|@y@v07/20300145. ......Welllll!@k @v07/20300146.All that aside, the flowers in this garden are truly splendid this year, aren''t they?"'
7905: '@rGeorge stretched as he said that.'
7906: '@r...And truly effortlessly, he changed the subject away from something that had become a little gloomy.'
7907: '@rThis time, Shannon noticed it too.'
7908: '@r......This person, George, was highly sensitive to the mood of a group, and was always caring enough to change the subject to something harmonious.'
7909: '@rIt had been so smooth that Shannon hadn''t noticed it until today.'
7910: '@rToday, Shannon had to really admire that behavior of George''s.'
7911: '@rAlmost all of the boys Shannon knew of her own age were her classmates during her education.'
7912: '@rBut they were all immature, ......and none of them had had the composure that George did.'
7913: '@rEven though he had been just another guest until moments ago,@k ...now, she couldn''t describe him with just that.'
7914: '@rBut that was idle thinking, irrelevant to her work as a servant.@k@rShannon tried to chase it away with a small shake of her head.'
7915: 'Jessica@r@v04/20200040."Hm?@k @v04/20200041.What''s up?"'
7916: 'Shannon@r@v15/20500154."Ah, no, it''s nothing...!"'
7917: 'Shannon@r@v15/20500155."Umm, shall I prepare some tea?@k @v15/20500156.Uhh, ......I will prepare some more of that Earl Grey for you."'
7918: 'George@r@v07/20300147."Ahaha, so you remembered the name of that black tea.@k@v07/20300148. I''m happy."'
7919: 'Shannon@r@v15/20500157."Um, .........umm........."'
7920: 'George@r@v07/20300149."Hm?"'
7921: 'Shannon@r@v15/20500158."...Umm, ......thank you for your concern back then..."'
7922: '@rShannon was finally able to put her thanks into words.'
7923: '@rIf you wrote them out on paper, they wouldn''t seem like much,@k ...but Shannon had needed just a little courage to say them out loud.'
7924: '@rBut George played dumb.'
7925: 'George@r@v07/20300150."What''s this?@k @v07/20300151.I don''t remember doing anything I should be thanked for?@k @v07/20300152.Heheh."'
7926: '@rIt seemed he was being a gentleman in his own way, saying that he hadn''t helped her because he wanted to be thanked.'
7927: '@rIt seemed that George''s response had been more or less predictable to Jessica.@k She burst out laughing uncontrollably.'
7928: 'Jessica@r@v04/20200042."Seeee?@k @v04/20200043.This is it, isn''t he a show-off?"'
7929: 'Shannon@r@v15/20500159."N-no...@k@v15/20500160. I don''t think that''s......"'
7930: '@rJessica made fun of Shannon as she remained silent, red-faced.@k@rGeorge didn''t know the details, but he naturally joined in, laughing the same way.'
7931: '@rThe three of them lazily walked around the garden, talking about what was new.'
7932: '@rGeorge, as the oldest cousin, talked about his life experiences.@k@rJessica talked about recent life on Rokkenjima.@k@rAnd Shannon talked about her recent work.'
7933: '@rThese silly little topics went round and round in circles.'
7934: '@rEven when the others'' stories had been fascinating,@k Shannon had never felt particularly connected to their contents.'
7935: '@rShe was nothing more than a servant, and she had no intention of delving into her masters'' lives.'
7936: '@rShe simply wanted them to enjoy their time speaking with her,@k and was only pretending to listen intently, and nodding at the right moments.'
7937: '@rBut for some reason, she found talking with George deeply interesting today.'
7938: '@rEven for things that she would normally ignore, she felt like she could feel a kindness hidden beneath the words.'
7939: '@rFor some reason, she wanted to know more things about George, no matter how trivial.'
7940: '@rSo...she stared fixedly at him.'
7941: '@rShe thought that as far as looks went, this person Ushiromiya George, ......was probably...@kabout average, and he didn''t really stick out.'
7942: '@rBut he was diligent, serious, ...and deeply thoughtful in a way that allowed him to understand people''s hearts and care for them.'
7943: '@rBut she had never been aware of these things until now.@k@rShe might not have met him many times, but she had known his face for many years.'
7944: '@rEven so, she had not noticed once until now.@k@r...So Shannon felt ashamed of this, and her cheeks went red.'
7945: '@rMaybe George thought that Shannon was appreciating him talking about himself, because he continued to relate his personal stories.'
7946: '@r...But Jessica didn''t miss that slight change in Shannon.'
7947: '@rSo she turned the discussion around to the topic Shannon wanted to hear about most.'
7948: 'Jessica@r@v04/20200044."......Oh yeah, come to think of it!@k @v04/20200045.George nii-san, did you finally get a girlfriend yet or what?"'
7949: 'George@r@v07/20300153."Wha-what is this, out of the blue..."'
7950: '@rNormally, just George''s reaction would have been answer enough.'
7951: '@rBut for some reason, as she was now, Shannon found herself unable to understand it unless he said it clearly.'
7952: 'Shannon@r@v15/20500161."Um, ...umm...@k@v15/20500162. George-sama is very nice,@v15/20500163. ......so I''m sure...@v15/20500164.umm......he must be very popular with the girls......"'
7953: 'George@r@v07/20300154."No, err, ...hahahahahahahahahaha."'
7954: 'Jessica@r@v04/20200046."Quit it Shannon~.@k@v04/20200047. That''s pretty meeeean, cornering him like that...@k @v04/20200048.*cackle*!"'
7955: 'Shannon@r@v15/20500165."I, I wasn''t trying to be mean........."'
7956: 'George@r@v07/20300155."Thank you for your happy wrong impression.@k@v07/20300156. It''s a shame, but I still don''t have a relationship with any special girl.@k@v07/20300157. As you can see, my looks are below average.@k@v07/20300158. And I can''t speak wittily in a way that can entertain a girl."'
7957: 'Shannon@r@v15/20500166."I, I don''t think that''s true.@k@v15/20500167. ......And...I think that a man''s charm is decided by things you can''t measure on the outside.@k@|@y@v15/20500168. Tha-that''s why, umm,@k@v15/20500169. ......I think that you might be a, um, ...very charming man, George-sama..."'
7958: '@rShannon was uncharacteristically verbose.@k@rCompared to her normal self, she was being very wordy indeed.'
7959: '@rGeorge looked fairly pleased about hearing his own charm described, but he was just a little surprised at this high praise.'
7960: '@rJessica, sure now that her own imagination was right on, acted as though she could barely hold back her laughter.'
7961: 'George@r@v07/20300159."Thank you, Shannon-chan.@k@v07/20300160. I hope I soon run into a girl gracious enough to find me attractive."'
7962: 'Shannon@r@v15/20500170."Yes, I''m sure you will.@k@v15/20500171. ......I''m sure there''s a girl not - @v15/20500172.I mean, a, a, a lot of girls who will recognize your real charm."'
7963: '@rShe probably wanted to say "there''s a girl not very far away".'
7964: '@r...She avoided saying that much, drawing a final line as a servant.'
7965: 'George@r@v07/20300161."Re-......really.@k@v07/20300162. ...I guess I''m kind of...embarrassed..."'
7966: '@rMaybe he had never been praised this much by a girl.@k@rGeorge''s face turned just as bright red as Shannon''s.'
7967: '@rAs she watched the two of them, Jessica giggled sadistically.'
7968: 'Jessica@r@v04/20200049."Well, I''m sure you''ll eventually find a wonderful partner, George nii-san.@k@v04/20200050. But I don''t think you''ll be able to escort your partner as you are now, riiiight?@k @v04/20200051.Your Braininess may be a diligent worker, but it looks like you''re totally clueless when it comes to that aspect of your studies."'
7969: 'George@r@v07/20300163."...E-excuse me for being ignorant.@k@v07/20300164. I''ll start studying that bit by bit."'
7970: 'Jessica@r@v04/20200052."How would you do that by yourself?@k @v04/20200053.Are you gonna watch movies about love?@k @v04/20200054.Learn from Uncle Hideyoshi?@k @v04/20200055.*cackle*cackle*!"'
7971: 'George@r@v07/20300165."Tch...@k@v07/20300166. You''re milking it for all it''s worth, aren''t you?@k@v07/20300167. Men aren''t a match for girls in this kind of conversation."'
7972: '@rNormally, when George and Jessica got together, their parents would say "George is diligent and admirable", and "Jessica is lazy and rude".'
7973: '@rSo it was probably irresistible fun for Jessica when their roles were finally reversed.'
7974: '@rGeorge also realized that, so this time, he was content with being the one who was teased.'
7975: 'Jessica@r@v04/20200056."Then, George nii-san, as long as you''re okay with it, why not practice a bit with Shannon?@k @v04/20200057.Keep Shannon entertained all day long on a date!@k @v04/20200058.What do you think?!"'
7976: 'Shannon@r@v15/20500173."Wh-wha-what are you...!@k @v15/20500174.Mi-Milady...!"'
7977: '@rWhen she heard Jessica''s audacious plan, Shannon''s face turned bright red, and a donut of smoke rose from it with a "poof".'
7978: 'George@r@v07/20300168."Tha-that''s a very attractive plan, but...I''d feel bad for Shannon-chan.@k@v07/20300169. I wouldn''t just be wasting her precious day off,@k@v07/20300170. I''d also be butting in on the ideal moment when she''d be able to be alone with someone she really has feelings for.@k@v07/20300171. I couldn''t do something so boorish."'
7979: 'Shannon@r@v15/20500175."I, I, ...I also, umm......@k@v15/20500176.......don''t have a person I have feelings for or anything, so, umm,@v15/20500177. ...caring for me like that is - yes, it''s, it''s unnecessary...!"'
7980: '@rShannon''s blood had all rushed to her head, and it looked like even she didn''t know what she was babbling about.'
7981: '@rJessica, who knew how Shannon normally was, seemed to find that really comical.'
7982: '@rShe couldn''t hide her cackling laugh anymore.'
7983: 'George@r@v07/20300172."...I-is that true...?@k @v07/20300173.I can''t believe that a cute girl like you would be single, Shannon-chan..."'
7984: 'Shannon@r@v15/20500177_1."I, I, I,@v15/20500177_2. ...I''m a servant, so, umm,@v15/20500177_3. ......I don''t have any opportunities to meet boys, and, umm..."'
7985: 'Jessica@r@v04/20200059."Which means that, in the future, if Shannon''s gonna have any chance of getting herself a wonderful guy,@k@v04/20200060. she needs practice with relationships, right?@k @v04/20200061.So you each want the same thing.@k@v04/20200062. Alright, that''ll work nice, *cackle*!"'
7986: '@rJessica irresponsibly cheered the two of them on.@k@rNow, George was also hanging his head, red-faced.'
7987: 'Eva@r@v05/21000019."George, I''ve been calling for you.@k @v05/21000020.Couldn''t you hear me?"'
7988: '@rSince Eva appeared in what was already an embarrassing situation, both of them became even more flustered.@k Jessica was in stitches.'
7989: 'George@r@v07/20300174."Ah, M-M-Mother...!@k @v07/20300175.Sorry, our conversation got complicated.@k@v07/20300176. I didn''t notice...!"'
7990: 'Shannon@r@v15/20500178."Oh, Eva-sama... My deepest apologies..."'
7991: 'Eva@r@v05/21000021."It sounds like you young kids were getting really excited.@k@v05/21000022. You''re all about that age.@k@v05/21000023. I remember well what that''s like - you must have no end of things like that to talk about.@k@v05/21000024. *giggle*giggle*giggle*."'
7992: 'Jessica@r@v04/20200063."Oh, come on, Auntie Eva, you''re still in your priiime!@k@v04/20200064. Please tell us how you and Uncle Hideyoshi met!"'
7993: 'Eva@r@v05/21000025."Oh my, there''s no way I could tell you that.@k@v05/21000026. *giggle*giggle*giggle*.@k@v05/21000027. You''re all so young.@k@v05/21000028. *giggle*giggle*giggle*."'
7994: 'George@r@v07/20300177."S-so, what is it, Mother?@k@v07/20300178. You called because you wanted something, right?"'
7995: 'Eva@r@v05/21000029."Your father and the rest have finished talking.@k@v05/21000030. We''re going to talk to Grandfather about you, so come on."'
7996: 'George@r@v07/20300179."About me?@k @v07/20300180.What could that be?"'
7997: 'Eva@r@v05/21000031."The same topic you all were just having.@k@v05/21000032. Remember, that topic?"'
7998: 'George@r@v07/20300181."Oh, ...oh, that topic.@k@v07/20300182. That isn''t really something we need to talk to Grandfather about, is it...?"'
7999: 'Jessica@r@v04/20200065."What are you talking about?@k @v04/20200066.Wait, George nii-san, you aren''t getting married to someone?!"'
8000: 'Shannon@r@v15/20500179."Con-...congratulations...!"'
8001: 'George@r@v07/20300183."No, no...!@k @v07/20300184.Didn''t I just say I don''t have a special woman?"'
8002: 'Eva@r@v05/21000033."That isn''t something to brag about, is it?@k @v05/21000034....Seriously."'
8003: '@rEva smiled bitterly, looking a little exasperated.'
8004: 'Jessica@r@v04/20200067."...Ah, ...I got it!@k @v04/20200068.George nii-san, it''s one of those, right? A marriage meeting!"'
8005: 'Shannon@r@v15/20500180."A marriage meeting...?"'
8006: 'George@r@v07/20300185."......nn, ......well, yeah.@k@v07/20300186. ......Hahahaha..."'
8007: '@rAs a man, George undoubtedly wanted to find a partner by himself and carry her off himself.'
8008: '@rSo it seemed that he found the idea of meeting his partner for the first time in a marriage meeting arranged by his parents to be a little pathetic.'
8009: 'George@r@v07/20300187."Shouldn''t marriage meetings be done at a more mature age...?!@k @v07/20300188.I still don''t feel like I''ve become an adult..."'
8010: 'Eva@r@v05/21000035."We don''t intend on rushing you into an immediate engagement or marriage - of course not.@k @v05/21000036.It isn''t a problem if you deepen your friendship first, and then have her moved to our family register later when you settle down as you age."'
8011: '@rFrom the forceful impression Eva was giving, and George''s evasiveness, it seemed you could catch a glimpse of how this marriage meeting linked into everything.'
8012: '@rWho this other person was remained unclear, but it was surely someone profitable to Eva''s family in a business sense.'
8013: '@rIt felt almost like a political strategy; they wanted to create a connection between the two families, if not by changing registers, then at least by having them get engaged.'
8014: 'Eva@r@v05/21000037."Marriage isn''t something you do after you start liking someone.@k@v05/21000038. It''s something you get used to after you do it.@k @v05/21000039.If you marry just based on emotions, you''ll definitely regret it.@k@v05/21000040. There''s definitely nothing wrong with choosing a person with a secure background as your partner in life, and then building up emotions of love."'
8015: 'Jessica@r@v04/20200069."Auntie Eva, that''s so rude to Uncle Hideyoshiii...@k@v04/20200070. *cackle*!"'
8016: 'Eva@r@v05/21000041."I love him, you know.@k@v05/21000042. I want to always be with him, and to live my life by his side."'
8017: 'Shannon@r@v15/20500181."......Eva-sama, that''s wonderful.@k@v15/20500182. Truly splendid..."'
8018: 'Eva@r@v05/21000043."Thank you.@k@v05/21000044. But we built up those feelings while we were husband and wife, you see?@k @v05/21000045.And I believe that in the future, we will be much, much closer than we are now.@k@v05/21000046. I think that''s the best way for a husband and wife to be."'
8019: 'George@r@v07/20300189."Although I don''t think that makes it alright to marry someone you don''t even like."'
8020: 'Eva@r@v05/21000047."And that doesn''t make it alright to marry whoever you want just so long as you like them.@k@v05/21000048. A wedding only lasts a moment.@k@v05/21000049. But your life as a married couple after that is very, very long."'
8021: 'Eva@r@v05/21000050."So you should search with prudence, and not leave it up to momentary emotions.@k@v05/21000051. And don''t you think that your mother and the rest of us would be better at that than a person inexperienced in life like yourself?"'
8022: 'George@r@v07/20300190."......Tha-that may be true, but..."'
8023: 'Eva@r@v05/21000052."You are my pride and joy - my only son.@k@v05/21000053. You have grown into a fine man who could match up to anyone.@k@v05/21000054. ...And with Battler-kun leaving the register, you are the only grandson to carry Father''s blood.@k@v05/21000055. ......We must prudently choose a fitting partner for you."'
8024: '@rAs everyone related to the Ushiromiya family knew, Eva adored George so much that he was the apple of her eye.'
8025: '@rBut that didn''t mean she had pampered him.@k@rShe had raised him strictly, and he had grown into a charming man who wouldn''t betray her expectations.@k ...That''s how he was the apple of her eye.'
8026: 'Eva@r@v05/21000056."We definitely aren''t deciding your partner based on what we personally stand to gain from it.@k@v05/21000057. ......I will introduce you to a truly wonderful woman who''s right for you.@k@v05/21000058. Right now, you may still have some immature youth inside of you that''s turning you away from this."'
8027: 'Eva@r@v05/21000059."......But at least listen to what your mother says on this point.@k@v05/21000060. Have I ever failed to think of what''s best for you?"'
8028: 'George@r@v07/20300191.".....................No, ......you haven''t..."'
8029: 'Eva@r@v05/21000061."That''s all you need to think of for now.@k@v05/21000062. Come on now, let''s go.@k@v05/21000063. We''re keeping Father waiting.@k@v05/21000064. Hurry to the mansion."'
8030: 'George@r@v07/20300192."Well, sorry, you two.@k@v07/20300193. See you later."'
8031: '@rGeorge bowed to the two of them, ...and after bowing once more to Shannon, he dashed off to the mansion.'
8032: 'Eva@r@v05/21000065."I''ll be going as well, then.@k@v05/21000066. Sorry for cutting your fun conversation short, Jessica-chan, Shannon-chan."'
8033: 'Jessica@r@v04/20200071."Ah, no no.@k@v04/20200072. Please don''t worry about it.@k@v04/20200073. Come on, Shannon.@k@v04/20200074. Let''s go."'
8034: 'Shannon@r@v15/20500183."Ye-yes...!"'
8035: 'Eva@r@v05/21000067."It''s alright.@k@v05/21000068. I''m sure you''ll meet someone wonderful soon too, Jessica-chan.@k@v05/21000069. A wonderful person suitable for you."'
8036: 'Jessica@r@v04/20200075."So if he''s at the same level as me, hahaha, you mean a guy with bad grades?@k @v04/20200076.Well that kinda frickin'' sucks, hahaha!"'
8037: 'Eva@r@v05/21000070."And of course, you too, Shannon-chan.@k@v05/21000071. I''m sure that a wonderful man suitable for you will appear."'
8038: 'Shannon@r@v15/20500184."Ye-yes!!@k @v15/20500185.Thank you very much..."'
8039: '@rAs Eva giggled and smiled, she approached Shannon''s ear with a hand over her mouth, as though she was trying to tell her a secret.'
8040: 'Shannon@r@v15/20500186.".........Huh?"'
8041: 'Eva@r@v05/21000072."I''m sure you''ll find a perfect match for a lowly servant like yourself.@k@v05/21000073. ......Have you forgotten to be grateful for your schooling?@k@v05/21000074. Know your place."'
8042: 'Shannon@r@v15/20500187.".........Th-...that''s not what I... ...I didn''t..."'
8043: 'Eva@r@v05/21000075."George is the eldest grandson carrying Father''s blood.@k@v05/21000076. He''s a person who may bear the burden of the Ushiromiya family someday in the future."'
8044: 'Eva@r@v05/21000077."To answer that expectation, he has studied tirelessly, entered a wonderful college, and is getting wonderful grades.@k@v05/21000092. Do you reeeally think you''re in his league, you incompetent, unqualified, uncultured seeerrrrvant?"'
8045: '@rThose malicious words all poured into Shannon''s ear without spilling a drop...'
8046: '@r......To Shannon, it was like cold water was being poured in there.'
8047: 'Shannon@r@v15/20500188.".....................I, I...@v15/20500189....didn''t mean..."'
8048: '@rThis was all whispered in secret.@k@rAnd with the same smile as before.'
8049: '@r...Jessica, who could only see Eva''s expression, didn''t think it was anything other than Eva telling Shannon some embarrassing story about love.'
8050: '@rWhen their secret conversation ended, Eva patted Shannon''s shoulders, as though to underscore her message.'
8051: 'Eva@r@v05/21000079."Don''t worry!@k@v05/21000080. I''m sure that you''ll find a partner just "perfect" for you.@k@v05/21000081. Right?@k @v05/21000082.*giggle*giggle*giggle*giggle*.@k@v05/21000083. ...Alright, Jessica-chan.@k@v05/21000084. See you later."'
8052: 'Jessica@r@v04/20200077."Yeah, see you later!@k@v04/20200078. And then, please tell me some stories about you and Uncle Hideyoshi~~!!"'
8053: 'Eva@r@v05/21000085."No waaay.@k@v05/21000086. Ahahahahahahahahaha...!"'
8054: '@rEva laughed dryly and headed back to the entrance hall.'
8055: '@rBehind Jessica, who was cheerfully waving her hand,@k ...Shannon reflected very, very deeply on those words of Eva''s, about knowing her place...'
8056: '@r...I felt deep remorse for my brief moment of conceit.'
8057: '@rI had forgotten.@k I am furniture.'
8058: '@rFurniture isn''t human.'
8059: '@rSo I am a being who must feel gratitude for even being treated like a human,@k and I am not permitted to wish for anything more.'
8060: '@rEven if people develop affection for furniture that they''re used to using,@k that is an emotion on the human''s side, and the furniture has no right to hope for that.'
8061: '@r......They should just serve with simple honesty every day.'
8062: '@rBut that feeling I felt when talking with George-sama and Jessica-sama...is a forbidden drug for me.'
8063: '@rIn other words, it may have been an emotion I must not know.'
8064: 'Natsuhi@r@v03/20900016."......Shannon.@k@v03/20900017. You have been too distracted for a while now.@k@v03/20900018. Are you feeling ill?"'
8065: 'Shannon@r@v15/20500190."N-no.@k@v15/20500191. My apologies..."'
8066: '@rNatsuhi''s words "too distracted" were right on the mark.'
8067: '@r...Even Shannon couldn''t believe that she hadn''t noticed Natsuhi until she had been called.'
8068: '@rThis was supposed to be the time when she had to concentrate on the cleaning.'
8069: '@rBut she had just kept sighing and hadn''t accomplished anything...'
8070: 'Natsuhi@r@v03/20900019."Even if there aren''t any guests, you must always be alert.@k@v03/20900020. Acting like this is shameful as a servant working for the Ushiromiya family."'
8071: 'Shannon@r@v15/20500192."...Yes.@k@v15/20500193. I will take care from now on..."'
8072: 'Natsuhi@r@v03/20900021."The head and my husband will return very soon.@k@v03/20900022. Have you finished cleaning the study?@k @v03/20900023.Have you finished cleaning the staircase?"'
8073: 'Shannon@r@v15/20500194."My, my apologies...@k@v15/20500195. Not yet..."'
8074: 'Natsuhi@r@v03/20900024."Yes, I know.@k@v03/20900025. So I had Lunon do it.@k@v03/20900026. While you were plodding around cleaning the hallway, she finished cleaning the study and the staircase."'
8075: 'Shannon@r@v15/20500196."......That''s because, umm,@v15/20500197. ......I wanted to clean thoroughly, so it took some time......"'
8076: '@rShannon was simple and honest, so she would always carry out her tasks seriously and properly, without any omissions.'
8077: '@rSo she was always slow with her work.'
8078: '@rIn contrast, Lunon skillfully cut corners wherever they should be cut.@k@rSo she could complete her jobs with a result that looked similar to an outsider, but in a much shorter time.@k In other words, she was shrewd.'
8079: '@rCompared to her, we should say that Shannon, who had just talked back to Natsuhi when she was already in a bad mood, was not shrewd in the slightest...'
8080: '@rOf course, there was nothing that Natsuhi couldn''t stand more than a servant talking back.@k@rHer forehead creased, and she spoke sternly.'
8081: '@rAnd yet, her speech was slow and admonishing, which was terrifying beyond measure, and finally made Shannon realize she had said the wrong thing...'
8082: 'Natsuhi@r@v03/20900027."In that case, you shall clean as thoroughly as you desire.@k@v03/20900028. Shannon, I order you to clean the reception hall right now.@k@v03/20900029. It is an important hall, where several pictures treasured by the head are displayed, and where honored guests of the Ushiromiya family are invited."'
8083: 'Natsuhi@r@v03/20900030."Clean it thoroughly, so that not a speck of dust remains, and so that even you are satisfied.@k@v03/20900031. Of course, you will finish today.@k@v03/20900032. Until you finish and report to me, you will not be permitted any food or rest.@k@v03/20900033. Understood?"'
8084: 'Shannon@r@v15/20500198."Ye-.........yes, Madam."'
8085: 'Natsuhi@r@v03/20900034."That is good.@k@v03/20900035. Servants should endeavor to use only those words.@k@v03/20900036. The next time you talk back, I will give you an even more severe punishment, so keep that in mind.@k@v03/20900037. Engrave these words in your heart."'
8086: 'Shannon@r@v15/20500199."Yes, ...Madam.@k@v15/20500200. ...Thank you for your guidance."'
8087: 'Natsuhi@r@v03/20900038."You are welcome."'
8088: '@rNatsuhi headed off down the corridor, making a gesture as if her headache was troubling her...'
8089: '@rOnce Shannon couldn''t see her anymore, she hung her head and sighed.'
8090: '@r......This happened because I let my thoughts take me.'
8091: '@rI might be bad at everything I do, but I should at least be able to carry out the cleaning as well as an average person can, right?@k I can''t even do that properly - it''s so pathetic it makes me cry.'
8092: '@rAnd there''s something even more pathetic.'
8093: '@rNot only was I unable to perform a single bit of cleaning well,@k@rbut just now, when Natsuhi was scolding me...@k.........I was envisioning him appearing and rescuing me.'
8094: '@rIf only George-sama had been here,@k@rperhaps he would have casually stepped in and saved me.'
8095: '@rI''m sure he would show up cheerfully, intentionally acting like he doesn''t know what''s going on, nimbly change the subject, and make me forget I was ever reprimanded by Natsuhi...'
8096: '@rI kept envisioning him...@ksuddenly appearing from the other side of the door...@kor the other end of the hallway.'
8097: '@rI envisioned the kind of person that would be an appropriate partner for him in a marriage meeting.'
8098: '@rAnd I envisioned how unfitting I am for him.'
8099: '@rEva had told me that clearly.@k@rIt had repeated endlessly through my dreams...'
8100: 'Kanon@r@v16/20600001.".........You''re still as clumsy as always, Nee-san.@k@v16/20600002. Madam has been in a bad mood since this morning.@k@v16/20600003. You spoke out of turn when you should have hung your head in silence."'
8101: 'Shannon@r@v15/20500201."......Kanon-kun..."'
8102: '@rKanon was suddenly there.@k@r......His footsteps were always quieter than a cat''s, and he left no trace of his presence.'
8103: '@rShe probably wouldn''t have noticed him no matter how long he stood there...'
8104: '@rThe expression on Kanon''s face was...hatred.@k@rThat expression he was making, he surely made for Shannon, who didn''t know how to do so herself...'
8105: 'Kanon@r@v16/20600004."Madam and Lunon can go to hell.@k@v16/20600005. She knows where Madam checks, and only cleans those areas.@k@v16/20600006. Her cleaning just now was like that.@k@v16/20600007. I know because I was watching."'
8106: 'Kanon@r@v16/20600008.".........She wasn''t cleaning in any real sense of the word.@k@v16/20600009. ...She''s just the worst kind of parasite, leeching off of your thorough work."'
8107: 'Shannon@r@v15/20500202."You mustn''t use such dirty words...@k@v15/20500203. Dirty words pollute your clean soul, Kanon-kun.@k@v15/20500204. So don''t use those words in front of me at least.@k@v15/20500205. ......Alright?"'
8108: 'Kanon@r@v16/20600010."............Hmph."'
8109: '@rKanon faced away, acting sulky.'
8110: '@rIt was a dishonest reaction, very like Kanon-kun, ...but I was a little happy.'
8111: '@rHe got angry in my place.'
8112: 'Kanon@r@v16/20600011."......Cleaning the reception hall will be tough.@k@v16/20600012. I''ll help."'
8113: 'Shannon@r@v15/20500206."Thank you.@k@v15/20500207. But I was the one Madam ordered, so don''t worry.@k@v15/20500208. ......Don''t you also have your own work, Kanon-kun?"'
8114: 'Kanon@r@v16/20600013."...............It''s a filthy job.@k@v16/20600014. My soul was corrupted long ago."'
8115: '@rKanon then hung his head, and bit his lower lip...'
8116: 'Shannon@r@v15/20500209."Just saying that you''ll help is enough for me.@k@v15/20500210. ...If you don''t go back to your own job, even you will receive punishment.@k@v15/20500211. ...And that would make me sad."'
8117: '@rShannon knew Kanon''s character well.@k@r...Sometimes, he didn''t reflect on himself.'
8118: '@rIf I don''t refuse forcefully, he will help me even if it means neglecting his own job...'
8119: '@rKanon was a little sad that his favor had been rejected,@k but he realized that in the end, going too far would also cause her pain, and he gave a single, small sigh.'
8120: 'Kanon@r@v16/20600015."............@k@v16/20600016. ...Fine.@k@v16/20600017. ......Do your best, Nee-san."'
8121: 'Shannon@r@v15/20500212."Yes.@k@v15/20500213. .........Besides, I am also partly to blame."'
8122: 'Kanon@r@v16/20600018."You aren''t at fault at all, Nee-san...!"'
8123: 'Shannon@r@v15/20500214."...No.@k@v15/20500215. I am.@k@v15/20500216. ......So go now."'
8124: '@rKanon-kun''s face showed that he still hadn''t completely accepted it, but he stopped being persistent, and disappeared.'
8125: '@r......Even though Kanon-kun had given me words of comfort when I was down...'
8126: '@r...Even so, I was still dejected because it hadn''t been "him".@k@rThat was, simply, a sin.'
8127: '@rFar beyond any dream the likes of me could be permitted to see - know your place.'
8128: '@r...Shannon, who had neglected breakfast, was already starting to feel her thoughts attenuate.'
8129: '@r......But if she didn''t finish cleaning the reception hall, she couldn''t receive Natsuhi''s permission to eat.'
8130: '@rThat cruel Natsuhi had surely told the kitchen of that.'
8131: '@r...I have to respectfully receive Madam''s punishment.'
8132: '@rThat''s right.@k My position in the world is furniture, ...and I had been intoxicated by a dream that is beyond me...'
8133: '@rI finished cleaning the hallway and went to the reception hall.'
8134: '@rMaybe hunger makes a nose more sensitive.'
8135: '@rThe kitchen was far away, but somehow I could smell the delicious aroma wafting from there, stimulating my empty stomach all the more.'
8136: '@r...Until I finished up here, I could not get any soup.@k I just had to prepare myself.'
8137: '@rSeveral portraits were hung in the reception hall.'
8138: '@rOne of those portraits...was thought amongst the servants to hold a special meaning.'
8139: '@r......It was the portrait of the witch.@k@rThat wasn''t its true name, but everyone in the mansion called it that.'
8140: '@rThe name of the woman with elegant blonde hair, drawn as the subject of that portrait, was BEATRICE.'
8141: '@r...It was whispered that she might be the former mistress of the family head, Kinzo.@k@r......And also that she was the great witch who had given Kinzo his legendary gold.'
8142: '@rThe witch, BEATRICE, master of the night on Rokkenjima.@k@rShe was gracious to those who respected her, but she would always curse those who made light of her.'
8143: '@rIt was in Shannon''s character not to neglect rules and beliefs such as those.'
8144: '@r...So she thought of the portrait of her other master as that person herself, and always treated it carefully, treasuring it.'
8145: '@r...And it had become part of her daily routine to talk, inside her own head, to the witch who only existed inside the portrait.'
8146: '@r......She was furniture.@k Furniture doesn''t complain.@k Cannot complain.@k@rSo she had no right to speak her mind about her difficult days.@k@rNo right to open her mouth and say those words.'
8147: '@rSo, ......she at least spoke her mind inside her heart.@k@rThose words she couldn''t say aloud, she spoke inside her heart, ...and protested to the formless witch.'
8148: '@rOf course, the witch didn''t answer.@k@rShe never consoled, and she never laughed it off.@k@r......Shannon could only interpret that silence as she liked, as though the witch was at least listening attentively.'
8149: 'Shannon@r@v15/20500216_1....BEATRICE-sama.@k@r@v15/20500216_2.......Please listen to me, worthless as I am.'
8150: '@rAs Shannon wiped the dust from the witch''s portrait, she spoke inside her heart.'
8151: 'Shannon@r@v15/20500216_3..........Just as Eva-sama says, I truly am incompetent and uncultured furniture.'
8152: 'Shannon@r@v15/20500216_4.......I am not a person.@k@r@v15/20500216_5....So maybe I have no right to love...'
8153: 'Shannon@r@v15/20500216_6.......But in that case, why was I given a heart which can know love?'
8154: '@r...Shannon paused there, and held back her tears for a time.'
8155: '@rThe sound of the rain which had started falling, along with the chill air in the reception hall, made her feel as though her shabbiness had increased another level.'
8156: 'Shannon@r@v15/20500217."Real furniture...doesn''t have a silly thing like a heart.@k@v15/20500218. So they don''t have to love people, right?@k@v15/20500219. So they don''t feel pain.@k@v15/20500220. ......If I''m just another piece of furniture, ......why do I have a heart?"'
8157: 'Shannon@r@v15/20500221.".........If it''s going to be this hard and this painful, ............I wish I''d never been given this stupid heart............!"'
8158: '@r@v27/20700001.......I see.@k@v27/20700002. To have given a heart to furniture.@k@r@v27/20700003.Amusing games that one plays sometimes...@k@r@v27/20700004.*cackle*cackle*...!'
8159: 'Shannon@r@v15/20500222."e........................"'
8160: '@rThe witch who never answered or laughed...@w333....answered,@w500. and laughed.'
8161: '@rMy imagination?@k Hearing things?@k No.'
8162: '@r...After all, the next words became a "voice", and I could hear them, not with my heart, but with my ears...'
8163: '@r@v27/20700005."Humans have been continually searching for the elements that make up the world since before the Christian Era.@k@v27/20700006. It is said that the ancient Greeks tried explaining the world with the four elements of air, fire, water, and earth."'
8164: '@r@v27/20700007."And after that, over several millennia, humans added several elements to those four,@k@v27/20700008. trying to explain the world with a host of interpretations - the five elements, the six elements, the seven elements, the eight elements, the twelve elements - @k@v27/20700009.but they could never explain the one true "single element"."'
8165: '@r@v27/20700010.".........However, a single man appeared by the guidance of a star, and finally explained the single element that makes up the world.@k@v27/20700011. Do you know what it is......?"'
8166: 'Shannon@r@v15/20500223."...............e...@v15/20500224..........a...@v15/20500225..........wh-@v15/20500226.............wh-who........."'
8167: '@rShannon fearfully turned around...'
8168: '@rRight there, ......she "existed".'
8169: '@rNot as an illusion - in reality.@k The contrast made by the lightning made it clear that this was not just a daydream.'
8170: '@r@v27/20700012."......It is "love".@k@v27/20700013. *cackle*cackle*cackle*cackle*!"'
8171: '@rThe witch of the portrait elegantly held a golden pipe to her mouth, and giggled.'
8172: '@r...She laughed at the ignorance which caused mankind''s thoughts to stray far from the most simple answer.'
8173: '@r@v27/20700014."That man explained everything in the world with love.@k@v27/20700015. That is the single element.@k@v27/20700016. With the smallest possible number, that man fully explained how the world was constructed."'
8174: '@r@v27/20700017."......How simple and clear, how splendid, exhilarating, pleasant and thrilling.@k@v27/20700018. ...The year that man was born eventually came to be known as Anno Domini.@k@v27/20700019. ......*cackle*cackle*!"'
8175: '@rShannon lost any words to speak.@k She thought that when first meeting an unknown guest, her first words should ask that person''s name.'
8176: '@rBut without saying anything, ...Shannon knew this person''s name, so she refrained.'
8177: '@rNo, ......surely, as a person of this island, asking this person for her name would be the greatest disrespect.'
8178: '@rBecause...she was the other master of this island in addition to Kinzo.'
8179: 'Shannon@r@v15/20500227."B-.........BEATRICE-sama..............."'
8180: 'BEATRICE@r@v27/20700020."Indeed.@k@v27/20700021. I am BEATRICE.@k@v27/20700022. .........The face people make when they first see me hasn''t changed after one thousand years.@k@v27/20700023. ...*cackle*."'
8181: '@rThe witch giggled at how Shannon''s reaction didn''t betray her expectations.'
8182: '@rShannon realized that she had met with a being that mustn''t be met with, and she took a step backwards.'
8183: '@r......That''s where the wall and the portrait were, so even as she gazed at the witch, she supported the witch''s portrait on her back.'
8184: 'BEATRICE@r@v27/20700024."Your worries are due to love.@k@v27/20700025. ......Which is the single element of the world.@k@v27/20700026. In other words, everything of this world.@k@v27/20700027. ......When that is not whole, it means the world is not whole.@k@v27/20700028. It is like continually scooping water into a flask with a hole in it."'
8185: 'BEATRICE@r@v27/20700029."......Even if you scoop and scoop, it is never filled - an eternal desert of the heart.@k@v27/20700030. The original sin that humans are founded upon and everything is made of."'
8186: 'BEATRICE@r@v27/20700031."Understand?@k @v27/20700032.What Adam and Eve learned when they put the fruit of knowledge to their lips was love.@k@v27/20700033. ...Because of that, humans were chased out of Paradise and became "human".@k@v27/20700034. Which means that what makes one human is knowing love, and suffering."'
8187: 'BEATRICE@r@v27/20700035."......Girl of kind heart.@k@v27/20700036. You should be proud.@k@v27/20700037. Now that you have known it, you are no longer furniture.@k@v27/20700038. Now, you are "human".@k@v27/20700039. I recognize that upon my name."'
8188: 'Shannon@r@v15/20500228.".....................umm, .........u......"'
8189: 'BEATRICE@r@v27/20700040."Hmph.@k@v27/20700041. Is it hard for an inferior being to understand?@k@v27/20700042. ...Oh, well.@k@v27/20700043. *cackle*cackle*...@k@v27/20700044. Forgive me.@k@v27/20700045. It has been a long time since I have spoken with a human.@k@v27/20700046. I shall apologize for my talkativeness."'
8190: '@rWithout expecting a reply from Shannon, BEATRICE laughed pleasantly for a while.'
8191: 'BEATRICE@r@v27/20700047."I am not sure that this is sufficient for an apology,@k@v27/20700048. ......but I can use my power to grant that desire of yours, if you''d like?"'
8192: 'Shannon@r@v15/20500229."...Huh...?"'
8193: '@rThe meaning of those words surprised Shannon even more than the witch''s sudden appearance.'
8194: 'BEATRICE@r@v27/20700049."I am offering to bring you and the one you love together.@k@v27/20700050. ......Normally, I would demand something of equal value in return."'
8195: 'BEATRICE@r@v27/20700051."...*cackle*, I am in a good mood.@k@v27/20700052. And you have never failed to pay your respects to me in the past.@k@v27/20700053. That is something worth rewarding."'
8196: 'Shannon@r@v15/20500230."............Do, ............do you really mean it......?"'
8197: '@rNormally, Shannon would have been shocked by this guest who lacked realism, and wouldn''t have been able to speak.'
8198: '@r......However, as though she had already been caught in the witch''s trap,@k ...Shannon responded to the witch.'
8199: 'BEATRICE@r@v27/20700054."With my magic, it is no trouble at all to arrange for a pair of people with feelings for each other to be joined."'
8200: '@rYou do mean it, don''t you...@k ...Those words almost escaped Shannon''s lips, but she held herself back, with her final reserves of reason.'
8201: '@rA witch is a witch.@k A sinister being.'
8202: '@rThe witch BEATRICE is clearly trying to slip in through the cracks in my heart and take me prisoner......'
8203: '@rThat sort of temptation, which so many fairy tale picture books had warned me about when I was young, was right in front of me now.'
8204: 'BEATRICE@r@v27/20700055."Fear too is a form of respect.@k@v27/20700056. It may be pleasant for me, but we will make no progress this way."'
8205: 'BEATRICE@r@v27/20700057."......I may be no different from the image of a detestable witch that you humans hold in your minds.@k@v27/20700058. However, I respond with goodwill to those who respect me.@k@v27/20700059. Aren''t humans the same?@k @v27/20700060.Although, I doubt any human would respond with goodwill to a hostile attitude like that..."'
8206: 'Shannon@r@v15/20500231.".........My, ......my apologies...@k@v15/20500232. I didn''t mean..."'
8207: '@rShannon finally realized that her hostility was rude to this guest.'
8208: '@rAnd...she finally digested the words that had been spoken to her a short while ago.'
8209: '@r -  You are no longer furniture.@k Now, you are "human".'
8210: '@r......The more she reflected upon those words,@k .......the more Shannon felt as though BEATRICE could understand all of her suffering...'
8211: 'Shannon@r@v15/20500233."......You said something...um...@k@v15/20500234....about a reward...@v15/20500235. ......What did you mean?"'
8212: 'BEATRICE@r@v27/20700061."I say that I can arrange for you to be bound to the man who has captured your heart.@k@v27/20700062. You can think of it as a form of gratitude for diligently polishing my portrait all the time."'
8213: 'Shannon@r@v15/20500236."................................."'
8214: 'BEATRICE@r@v27/20700063."Calm yourself. I ask for nothing in return.@k@v27/20700064. I am generous.@k@|@y@v27/20700065. .........However, though I ask for nothing in return, I do have a request."'
8215: '@rLook, here it comes...'
8216: '@rThe other Shannon inside her heart sent her a warning.@k@rThis is what she had been so often warned of in all those scary picture books she had read when she was little......!'
8217: 'BEATRICE@r@v27/20700066."Do you know of the small torii and shrine that have been constructed on a reef in the ocean very near this island...?"'
8218: '@r...Shannon immediately remembered it.@k@rWhen you reached Rokkenjima by boat, there was a torii and a shrine on a reef which was too small to even be called an islet.'
8219: '@rShe had the feeling that Kumasawa had told her its history, but she couldn''t remember that very well.'
8220: '@r...A traveling mountaineering ascetic or someone had built it, or prayed at it, or something.'
8221: 'Shannon@r@v15/20500237."...Yes, I know about it, but...@k@v15/20500238....what does...that.........?"'
8222: 'BEATRICE@r@v27/20700067."I will not explain everything from square one to a person who does not know of demons.@k@v27/20700068. To make a long story short, ......it is causing problems for me.@k@|@y@v27/20700069. ...There is actually a certain mirror kept inside that shrine.@k@v27/20700070. I want you to break it."'
8223: '@rThat was a very suspicious request.'
8224: '@rShannon didn''t know its history, but anything that might be stored inside a shrine would have to be something sacred.'
8225: '@r......And she wants me to break it?@k@rWhy would someone as powerful as a witch be unable to do that herself, and be asking a human for help...?'
8226: '@rThere was no need for Shannon to speak her thoughts aloud.@k@rBEATRICE started talking about this reasonable question before Shannon could give her answer.'
8227: 'BEATRICE@r@v27/20700071."The magic power of that mirror opposes my own.@k@v27/20700072. ......I cannot explain it well with human words.@k@v27/20700073. ...By way of example, let us speak of the differences between utensils.@k@v27/20700074. That mirror is a fork, and my power is soup.@k@v27/20700075. You cannot drink soup with a fork, correct?"'
8228: 'BEATRICE@r@v27/20700076."If only the imposition of that mirror were gone, I could prepare a spoon perfect for drinking soup.@k@v27/20700077. ......If only I had that, I could drink soup, or even dig my way out of a rocky prison.@k@v27/20700078. ...I could even scoop eyeballs out, ......is that what it was?@k @v27/20700079.*cackle*cackle*!"'
8229: 'Shannon@r@v15/20500239."......I, .........I don''t know what you are talking about.@k@v15/20500240. ...If that is because I am uncultured, I apologize."'
8230: 'BEATRICE@r@v27/20700080."It comes down to this.@k@v27/20700081. If you spare the effort to break that most vexing of mirrors for me,@k@v27/20700082. as a reward, I will grant you your wish."'
8231: 'BEATRICE@r@v27/20700083."......I am in a very good mood today.@k@v27/20700084. If you desire, you may change your wish, and I can give you all of the gold I bestowed upon Kinzo...@k @v27/20700085.*cackle*cackle*!"'
8232: 'Shannon@r@v15/20500241."I, ...............I will have to decline........."'
8233: 'BEATRICE@r@v27/20700086."......What did you say?"'
8234: '@rWhen she heard Shannon''s words, BEATRICE realized for the first time that her expectations had been betrayed.'
8235: 'BEATRICE@r@v27/20700087."If there is a reason, tell me.@k@v27/20700088. If there is a misunderstanding, I shall resolve it."'
8236: 'Shannon@r@v15/20500242."......I, ...I don''t really know the reason.@k@v15/20500243. .........But, ...until today, the island has been at peace, and nothing bad has happened.@k@v15/20500244. ...So, even if I don''t break the mirror, the peace that has existed until today should continue into the future."'
8237: 'BEATRICE@r@v27/20700089."Hmm...@k@v27/20700090. I see, I see, that is quite right.@k@v27/20700091. It''s just as you say.@k@v27/20700092. If you don''t break it, the same unbreakable days that have passed until today will continue into tomorrow, and the day after.@k@v27/20700093. Why don''t I give you an absolute guarantee?"'
8238: 'BEATRICE@r@v27/20700094."Upon my name of BEATRICE, I say to you:@k@v27/20700095. The same unbreakable days that have passed until today will continue into tomorrow, and the day after.@k@v27/20700096. And so forever, in perpetuity."'
8239: '@rShannon was seized by an eerie illusion.'
8240: '@rThe mirror was most likely something to restrain the witch.@k@r...So breaking the mirror should have been something done for the witch''s sake.'
8241: '@r......And yet, it felt as though Shannon had to do it for her own sake.'
8242: '@rIt felt like some premise had been switched...'
8243: 'BEATRICE@r@v27/20700097."I have done nothing more than give you the opportunity to have your feelings fulfilled as a reward.@k@v27/20700098. ......It''s up to you whether you break it or not.@k@v27/20700099. If you break it, I will grant your wish."'
8244: 'BEATRICE@r@v27/20700100."If you do not break it, the tomorrows up until today will continue for all time.@k@v27/20700101. Your wish will not be granted for all eternity.@k@v27/20700102. ......Do you understand?@k @v27/20700103.What I am saying?@k@v27/20700104. *cackle*cackle*."'
8245: '@rThe witch was telling her.'
8246: '@rShe was pressing her, saying to break the mirror, if she wanted to be joined with George.@k@rAnd she was declaring that if she didn''t break it, then her feelings would definitely never be fulfilled......'
8247: 'Shannon@r@v15/20500245."...Please...stop it......@k@v15/20500246. I don''t...@v15/20500247....want to hear something like that.........!"'
8248: 'BEATRICE@r@v27/20700105."To cause you pain was not what I wanted.@k@v27/20700106. ......Well.@k@v27/20700107. Feeling madness from love is the best thing about humans.@k@v27/20700108. You should enjoy that emotion to your heart''s content."'
8249: 'BEATRICE@r@v27/20700109."However, if you wish to borrow my power, you can break that mirror at any time.@k@v27/20700110. And you can yell my name and awaken me.@k@v27/20700111. I will definitely keep my promise.@k@v27/20700112. ......This way, you should have no complaints, right?@k @v27/20700113.I won''t force you to decide right now.@k@v27/20700114. I take it that is easier for you?"'
8250: '@rWas this deal ultimately something she could feel at ease with?@k@r......Definitely not.'
8251: '@rTo Shannon, who was burning with love, tormented by passion, being tempted forever by a way of escape was far too cruel a trial...'
8252: 'BEATRICE@r@v27/20700115."I won''t set a time limit on that promise,@v27/20700116. ......but there is a time limit on the magic that can grant that wish.@k@v27/20700117. ...That limit is not mine to determine.@k@v27/20700118. It will be determined by your loved one himself.@k@v27/20700119. .........Do you understand what I mean?"'
8253: 'Shannon@r@v15/20500248."......I, I don''t know."'
8254: 'BEATRICE@r@v27/20700120."The limit is the time your loved one chooses the person he should pledge his love to.@k@v27/20700121. ......I am a witch, but I am not a demon.@k@v27/20700122. I possess no spell which can tear apart two who love each other, you see...?@k @v27/20700123.*cackle*cackle*cackle*cackle*!!"'
8255: 'BEATRICE@r@v27/20700124."I hear that your loved one will soon be attending a marriage meeting...?@k@r@v27/20700125. You may have stronger feelings for that man than anyone else in the world.@k@v27/20700126. However, that doesn''t mean that you are the most appropriate for him, does it...?"'
8256: 'BEATRICE@r@v27/20700127."I know who he will be having the marriage meeting with.@k@v27/20700128. That girl is the most suitable for Ushiromiya George in the entire world."'
8257: 'BEATRICE@r@v27/20700129."She came from a good school, achieved good grades, and has composure and prudence."'
8258: 'BEATRICE@r@v27/20700130."She is more beautiful than you, wiser than you, more suitable than you."'
8259: 'BEATRICE@r@v27/20700131_1."Why would an ignorant, incompetent, uncultured girl like you be suitable?@k @v27/20700132.You know better than anyone.@k@v27/20700133. You are the most unsuitable!"'
8260: 'BEATRICE@r@v27/20700134."Even imagining that you and Ushiromiya George could be joined is sinful, and foolish, foolish foolish know your place!!"'
8261: '@r@o75.@v05/21000087|27/20700134_1."Have you forgotten to be grateful for your schooling?@k@v05/21000088|27/20700134_2. Know your place."'
8262: '@r@o75.@v05/21000089|27/20700134_3."George is the eldest grandson carrying Father''s blood.@k@v05/21000090|27/20700134_4. He''s a person who may bear the burden of the Ushiromiya family someday in the future."'
8263: '@r@o75.@v05/21000091|27/20700134_5."To answer that expectation, he has studied tirelessly, entered a wonderful college, and is getting wonderful grades.@k@v05/21000092|27/20700134_6. Do you reeeally think you''re in his league, you incompetent, unqualified, uncultured seeerrrrvant?"'
8264: 'BEATRICE@r@v27/20700135."*giggle*giggle*, *cackle*cackle*cackle*ahahahahahahahahahahahahahahahahahahahahahahahahahahahahahahahahahahahaha!!!"'
8265: 'Kanon@r@v16/20600019."Sto-............stop it, don''t bully Shannon!!@k @v16/20600020.Who the hell are you?!!"'
8266: '@rAt that time, as Shannon held her head, trying to protect her heart from the blade of BEATRICE''s words, Kanon ran in front of her.'
8267: '@rKanon didn''t care who this woman was.@k@rAs long as he knew she was an enemy tormenting Shannon, who he loved and respected as a sister, nothing else mattered.'
8268: 'Shannon@r@v15/20500249.".........Kanon-kun - @v15/20500250.stay back...!@k @v15/20500251.This person is......!"'
8269: 'Kanon@r@v16/20600021."................................."'
8270: '@rIt seemed that Kanon also realized that the being standing before him was the witch of the portrait.'
8271: '@r...And also that she was a terrifying being.'
8272: 'BEATRICE@r@v27/20700136."......I just wanted to make Shannon take her reward, but it seems I said too much, and ended up tormenting her.@k@v27/20700137. I shall apologize."'
8273: 'BEATRICE@r@v27/20700138."......But I will leave that promise as a reward to you.@k@v27/20700139. If you need my power, call me at any time.@k@v27/20700140. I have already told you how."'
8274: 'BEATRICE@r@v27/20700141.".........Well then, with that, let us disperse for tonight.@k@v27/20700142. Hostile gazes may be pleasant, but they are bad for the figure, you see?@k @v27/20700143.*cackle*cackle*cackle*..."'
8275: 'Kanon@r@v16/20600022."Beat it...!!@k @v16/20600023.I don''t know who you are, but you''re threatening Shannon!@k @v16/20600024.Don''t ever show yourself again!!"'
8276: '@rIt seemed that Kanon''s words made the witch horribly displeased.'
8277: 'BEATRICE@r@v27/20700144."......So, you do not choose your words carefully, lowborn?@k@v27/20700145. ...I am gracious to those who respect me, but brutal to those who do not..."'
8278: '@rWhile she still smiled, the witch''s expression began to warp...'
8279: '@rAnd an oppressive feeling that couldn''t be described with any of the five senses gradually filled the room...'
8280: '@rEven though they couldn''t comprehend what it was, they immediately realized it to be something terrifying...'
8281: '@rIf you were swimming in the ocean, and something large went by in the water beneath you, you would want to escape to the land even before you learned what it was.@k ...This was the same as that!'
8282: 'Shannon@r@v15/20500252."Ple-......please stop, BEATRICE-sama!!@k @v15/20500253.Kanon-kun is still a child.@k@v15/20500254. I apologize for his language!"'
8283: 'BEATRICE@r@v27/20700146."..........................."'
8284: 'Kanon@r@v16/20600025."........................!"'
8285: '@rKanon blocked the way to Shannon at the risk of his life.@k@r...There was tense sweat on his forehead.'
8286: '@rIn that moment, the witch certainly had Kanon''s fate in her clutches.@k@r...She didn''t even need to move a finger.'
8287: '@rShe had Kanon''s fate so readily in her grasp that she could crush it completely with a single twist of her own smile...'
8288: '@rKanon also understood that.@k@rWhich is why he was sweating,@k and his knees felt weak...'
8289: '@rHowever, BEATRICE abruptly released that feeling of tension, and laughed.'
8290: 'BEATRICE@r@v27/20700147.".........Very well.@k@v27/20700148. At your request, I will grant him special pardon.@k@v27/20700149. ...Kanon, is it?@k@v27/20700150. In deference to her, I shall forgive you tonight and send you off.@k@v27/20700151. Be thankful.@k@v27/20700152. Well then, we will disperse for tonight."'
8291: 'BEATRICE@r@v27/20700153."............In parting, I shall leave a single souvenir.@k@v27/20700154. Hold out the palms of your left hands, you two."'
8292: '@rBEATRICE grinned broadly, and snapped her fingers,@k whereupon their left hands stretched out in front of them, and their palms opened, against their will.'
8293: '@rIt was a strange sensation, as though only their left hands had become someone else''s.'
8294: '@rIt felt like their left hands alone had become puppets,@k pulled by strings hanging down from the ceiling.'
8295: 'Kanon@r@v16/20600026."Wh-what......@v16/20600027.do you think you''re doing...?!"'
8296: '@rKanon resisted, but he couldn''t take back the freedom of his left hand.'
8297: 'BEATRICE@r@v27/20700155."Don''t struggle.@k@v27/20700156. It will not take long."'
8298: '@rBEATRICE held her pipe aloft, and from inside the smoke, gold-colored sparkling dust hovered in the air.'
8299: '@r......That glitter eventually became several gold butterflies.'
8300: '@rThe beautiful butterflies danced freely throughout the reception hall, creating a fantastical and beautiful world.'
8301: '@r...And two of those butterflies alighted on the palms of Shannon''s and Kanon''s hands.'
8302: 'Kanon@r@v16/20600028."?!"'
8303: 'Shannon@r@v15/20500255."Ouch...!"'
8304: '@rThere was a sharp pain, as though they had been burned.@k@rWhen the two of them tried to examine their palms, there was no trace left of that inability to move their bodies, which had been there until a second ago.'
8305: 'Shannon@r@v15/20500256.".........Ah, ......a bruise...?@k @v15/20500257.What is......"'
8306: '@rOn the palm of her hand, a small burn mark had been made, the size of a pea.'
8307: '@r...Furthermore, it was shaped like a butterfly...'
8308: 'Kanon@r@v16/20600029."Wha-...what is this supposed to be..."'
8309: '@rApparently, Kanon had the same bruise on his hand.@k He stared at the witch hatefully.'
8310: 'BEATRICE@r@v27/20700157."It is a simple greeting.@k@v27/20700158. I have no hidden motive.@k@v27/20700159. ...It is nothing more than a bruise, so it will heal in just a few days.@k@v27/20700160. It requires no treatment.@k@v27/20700161. That is a mark so that tomorrow, you will not forget that I truly was here, and that I made a promise with you."'
8311: 'BEATRICE@r@v27/20700162."............The impact of a meeting with me is strong.@k@v27/20700163. ...Sometimes, at the next morning, people try to think of their meeting with me as a dream or an illusion.@k@v27/20700164. ............You should think slowly and carefully, Shannon.@k@v27/20700165. ...And you should probably take a good rest, look at my mark tomorrow morning, and try thinking again."'
8312: 'BEATRICE@r@v27/20700166."I shall not force you into anything.@k@v27/20700167. You should freely decide your future, by your own will.@k@v27/20700168. .........However, to think that the object of your desire can be granted for such meager compensation...@k@v27/20700169. It would annoy the great artists who write plays about blighted love to no end.@k@v27/20700170. *cackle*cackle*cackle*!"'
8313: 'BEATRICE@r@v27/20700171."Well then, let us meet again when the chance arises.@k@v27/20700172. It truly was entertaining to have a conversation again after so much time.@k @v27/20700173.Farewell, furniture.@k@v27/20700174. Ahahahahahahahahahahahahahaha!"'
8314: '@rBEATRICE''s body crumbled like smoke and blew away.'
8315: '@r...It was golden smoke - no, a flight of golden butterflies.'
8316: '@rThey scattered in all directions inside the reception hall, ...leaving a golden mist behind as they disappeared into thin air.'
8317: '@r......After that, only the cold silence was left.'
8318: '@rThe extreme silence was enough to make both of them think that they might have been daydreaming until just a moment ago...'
8319: '@r...Which is why the witch had left it.@k@rShe had left a mark to make it impossible for them to think that this was a daydream.'
8320: '@rAs Shannon and Kanon thought back on the butterfly bruises on their hands, and the pain they had felt when those had been left,@k they stood there for some time, stunned and motionless...'
8321: '@rAnd from that day on...'
8322: '@r......Shannon was tormented by days of suffering and conflict.........'