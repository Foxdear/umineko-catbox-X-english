13235: 'Rosa@r@v12/21400704."There''s a good way to prove your innocence, isn''t there?@k @v12/21400705.For Doctor Nanjo''s and Kumasawa-san''s bodies to be found!!"'
13236: 'Rosa@r@v12/21400706."If we find them, then maybe I''ll start listening to your story.@k@v12/21400707. But until we do, you cannot deny that you are all wolves!!"'
13237: 'Rosa@r@v12/21400708."You too!@k @|@y@v12/21400709.And you!!@k @|@y@v12/21400710.You were probably bought by that witch, your eyes blinded with gold!!@k @v12/21400711.Do you really want money that much?!@k @v12/21400712.That''s right, isn''t it?!@k @v12/21400713.You want to play around for the rest of your life?!@k @v12/21400714.What is that kind of life worth?!!"'
13238: 'Shannon@r@v15/20500744."Rosa-sama...!!@k @v15/20500745.We...... We couldn''t!"'
13239: 'Rosa@r@v12/21400715."Silence!@k @v12/21400716.And Shannon, don''t get any closer!!@k @v12/21400717.I can''t believe that you would repay a ten-year-long debt of gratitude with betrayal!!@k @v12/21400718.I''ll pull the trigger without mercy!!"'
13240: 'Shannon@r@v15/20500746."How......@v15/20500747. .........How could you...@v15/20500748. .........It''s too......@v15/20500749.cruel......"'
13241: 'George@r@v07/20300600."......A-Auntie Rosa!!@k @v07/20300601.That''s horrible!!@k @v07/20300602.A murder occurred in this room!@k @v07/20300603.Then the culprit carried the corpses away!@k @v07/20300604.They are only honestly reporting that to us!!"'
13242: 'Shannon@r@v15/20500750.".........uuu, ......uuuUUuuUUuughhu!!!"'
