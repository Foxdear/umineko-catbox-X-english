13274: '@r...Then he set it on an adjacent table.'
13275: 'Genji@r@v14/21600156."......I believe that I hold this as a proof of trust.@k@v14/21600157. If that has been lost, I think it is only natural that I return it."'
13276: 'Rosa@r@v12/21400722."..................@k@v12/21400723. ......That''s good judgment.@k@v12/21400724_1. Those master keys are the greatest basis upon which you have been suspected several times today.@k@v12/21400725. Relinquishing them in order to clear away that suspicion may only be a first step,@k@v12/21400726. but, well, I think it isn''t a bad start."'
