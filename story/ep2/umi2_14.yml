13254: '@r......It''s because we seek an answer; ...that''s why everything keeps getting stranger...'
13255: '@rWe don''t need...an answer.@k These are all strange murders committed with bizarre magic by the 19th person, the witch BEATRICE, as she follows a creepy ritual.'
