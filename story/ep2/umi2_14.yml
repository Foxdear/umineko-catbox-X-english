13259: '@rGenji-san quietly stopped that.'
13260: 'Genji@r@v14/21600147."............Stop.@k@v14/21600148. ...What Rosa-sama says is quite right.@k@v14/21600149. ...Until we find the corpses,@v14/21600150. we cannot prove that Doctor Nanjo and Kumasawa are innocent."'
