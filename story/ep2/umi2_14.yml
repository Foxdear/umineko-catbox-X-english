13300: 'Battler@r@v10/20100961.".........Maria...@k@v10/20100962. I''m sorry for...@v10/20100963.......doubting.@k@v10/20100964. ......I''m sorry for...@v10/20100965.......not believing."'
13301: 'Maria@r@v13/20400433."...............Battler."'
13302: 'Battler@r@v10/20100966."It was all...@v10/20100967....the witch''s doing...@k@v10/20100968. ......The witch''s...@v10/20100969....doing......@k@v10/20100970. ...All that stuff about tricks and locked rooms never mattered..."'
13303: 'Battler@r@v10/20100971.".........It''s just, it''s just...@v10/20100972..........that the witch BEATRICE actually exists,@v10/20100973. .........and she really was a witch...@k@v10/20100974. ......Because I didn''t believe that,@v10/20100975. ............it was this painful,@v10/20100976. ............this sad............"'
13304: 'Maria@r@v13/20400434.".........Battler, ......you believe in BEATRICE......?"'
13305: 'Battler@r@v10/20100977."Yes...!@k @v10/20100978.I believe.@k@v10/20100979. ...BEATRICE "exists".@k@v10/20100980. And she''s a witch, who uses strange magic...!"'
13306: 'Maria@r@v13/20400435."Battler......"'
13307: '@rMaria let go of my hand, ...and then she was the one holding my head.'
13308: 'Maria@r@v13/20400436."......That''s the way, Battler.@k@v13/20400437. ............BEATRICE "existed".@k@v13/20400438. ......You just couldn''t believe that easily, so couldn''t see her.@k@v13/20400439. ............The witch "exists".@k@v13/20400440. "Exists".@k@v13/20400441. Will soon "come"."'
13309: 'Maria@r@v13/20400442.".........You believed in Beato, so I''m sure you''ll be invited to the Golden Land.@k@v13/20400443. ......Very soon.@k@v13/20400444. ......It''ll be very soon.@k@v13/20400445. Nothing to be afraid of anymore."'
13310: 'Maria@r@v13/20400446."............Not afraid, okay?@k @v13/20400447.Always be with me, holding hands, okay...?@k @v13/20400448.Let''s solve the epitaph''s riddle together.@k@v13/20400449. Let''s think about Beato''s problem.@k@v13/20400450. .........Beato has been saying it from the beginning.@k@v13/20400451. She hasn''t said anything other than let''s play and solve the problem."'
13311: 'Battler@r@v10/20100981."Right...... She did......@k@v10/20100982. Searching for the culprit was just a total waste of time...@k@v10/20100983. ......If only we had...@v10/20100984....just believed in...@v10/20100985....the witch........."'
13312: '@rAfter softly brushing my cheek as my tears kept dripping down,@k ......Maria kissed my forehead, as soft as a feather.'
13313: '@rFor just that instant, ......Maria''s smile, which I had once thought was creepy, looked like an angel...'
13314: 'Genji@r@v14/21600159."We have returned the master keys, ...but our loyalty to the Ushiromiya family will not change.@k@v14/21600160. .........From now on, we will not enter the parlor without permission.@k@v14/21600161. Rosa-sama, please lock the parlor from the inside."'
13315: 'Rosa@r@v12/21400739."......You truly are an admirable person.@k@v12/21400740. When the typhoon passes, ......if the cries of the seagulls return to this island again,@k@v12/21400741. .........I wonder if we will be able to trust each other once more."'
13316: 'Genji@r@v14/21600162."......If you were to grant us your trust once again, there would be no greater pleasure."'
13317: 'Rosa@r@v12/21400742."You''re right.@k@v12/21400743. ......We''ll definitely be able to understand each other.@k@v12/21400744. ......When the seagulls cry."'
13318: 'Genji@r@v14/21600163.".........It would probably be better if we left this room as it is until the police come.@k@v14/21600164. Rosa-sama, if you would please lock it.@k@v14/21600165. ......We will return to the kitchen.@k@v14/21600166. If you need anything, please command us at any time."'
13319: 'Rosa@r@v12/21400745."Thank you.@k@v12/21400746. ............If you are a wolf,@k@v12/21400747. how shamelessly you speak."'
13320: 'Rosa@r@v12/21400748."......And if you are a sheep,@k@v12/21400749. .........I''m sorry for throwing you into the wolf cage."'
13321: 'Genji@r@v14/21600167."......Furniture entrusts its fate to the family.@k@v14/21600168. ......Even if it comes to throwing away this life, if by that your trust could be regained,@k@v14/21600169. it would be a great honor."'
13322: 'Rosa@r@v12/21400750.".....................@k@v12/21400751. I hope that you all can remain healthy until the typhoon passes, if that is at all possible.@k@v12/21400752. This is all a rhapsody of blowing winds and pouring rain performed by the typhoon.@k@v12/21400753. ......When the performance ends, and the curtain closes,@v12/21400754. ......we will surely be able to grasp hands together again."'
13323: 'Rosa@r@v12/21400755."......When the seagulls...cry."'
13324: '@rAuntie Rosa nodded in response...'
13325: '@rGenji-san turned on his heels.@k@rHe left the servant room.'
13326: '@rGohda-san''s face was still streaked with tears,@k ......but as he had listened to Genji-san''s words, maybe he had managed to sort out his heart.'
13327: '@r......His face had been truly shameful,@w500. ......but it had returned to the face of the Gohda-san we knew well.'
13328: 'Gohda@r@v17/21700269.".........I will also be waiting in the kitchen.@k@v17/21700270. ......If you need anything, please command me at any time.@k@|@y@v17/21700271. .........If you wish for some warm food, I promise to have the very best prepared for you."'
13329: 'Rosa@r@v12/21400756."............Thank you.@k@v12/21400757. I would like to ask you for breakfast tomorrow.@k@|@y@v12/21400758. ......And the boat will probably come by midday tomorrow.@k@v12/21400759. ...Thanks for everything up until now.@k@v12/21400760. Your cooking was my only pleasure on Rokkenjima."'
13330: 'Gohda@r@v17/21700272."...Certainly.@k@v17/21700273. I promise you, I will prepare a supreme breakfast.@k@v17/21700274. Please, look forward to tomorrow morning."'
13331: 'Rosa@r@v12/21400761."Thank you.@k@v12/21400762. ............And Shannon-chan.@k@v12/21400763. Tomorrow morning, ...let''s make up while drinking some delicious coffee."'
13332: 'George@r@v07/20300607_1."............"'
13333: 'Rosa@r@v12/21400764."......?@k @v12/21400765.George-kun?"'
13334: 'George@r@v07/20300608."......I''m...going with them too."'
13335: 'Shannon@r@v15/20500751."...It''s alright, George-sama...@k@v15/20500752. Please, return to the parlor.@k@v15/20500753. There are no more master keys anymore.@k@v15/20500754. So if you are with Rosa-sama in the parlor, you won''t be threatened by anyone."'
13336: 'Rosa@r@v12/21400766."That''s right.@k@v12/21400767. ...That''s how things are.@k@v12/21400768. ...Objectively speaking, I think that being with me in the parlor would be the safest."'
13337: 'Rosa@r@v12/21400769."......But I won''t force you to stay with us.@k@v12/21400770. George-kun, you may stay in any place you feel is safe.@k@v12/21400771. .........You are already an adult.@k@v12/21400772. It''s up to you where and with whom you spend the time until tomorrow morning."'
13338: 'George@r@v07/20300609.".........Yes.@k@v07/20300610. I will decide, by myself...@k@v07/20300611.who I''ll spend the night with."'
13339: 'Battler@r@v10/20100986."A-.........Aniki......"'
13340: 'George@r@v07/20300612."Battler-kun, stay with Auntie Rosa in the parlor.@k@v07/20300613. I''m sure that''s safest.@k@v07/20300614. ......Compared to that, I think being outside the parlor isn''t as safe.@k@v07/20300615. ......So I can''t leave her in a place like that alone."'
13341: 'Battler@r@v10/20100987."......It''s......not like I suspect Shannon-chan and the other servants—@k@v10/20100988.no, anyone at all......@k@v10/20100989. I don''t want to suspect anyone..."'
13342: 'Battler@r@v10/20100990."The inheritance?@k @v10/20100991.The gold?@k @v10/20100992....That''s just stupid...@k@v10/20100993. ...There''s no way people are killing each other over that......"'
13343: 'George@r@v07/20300616."Yes.@k@v07/20300617. I know better than anyone how pure your heart is, Battler-kun.@k@v07/20300618. ......No one will blame you.@k@v07/20300619. No one."'
13344: 'Battler@r@v10/20100994."..................Anikii..."'
13345: 'Maria@r@v13/20400452."...It''s okay.@k@v13/20400453. I''ll protect you.@k@v13/20400454. ......If you''re with me, even BEATRICE can''t lay a hand on you.@k@v13/20400455. ''Cause even though I''m small, I''m a witch."'
13346: 'George@r@v07/20300620."Yeah.@k@v07/20300621. .........Maria-chan.@k@v07/20300622. I''m leaving Battler-kun in your care.@k@v07/20300623. .........Alright, Shannon.@k@v07/20300624. Let''s go."'
13347: 'Shannon@r@v15/20500755."Yes......@k@v15/20500756. ......Rosa-sama, if you would excuse me.@k@v15/20500757. If you have an order, please call me at any time."'
13348: 'Rosa@r@v12/21400773.".........I''m sorry for saying something so cruel just now.@k@v12/21400774. ............I don''t expect you to have forgiven me by tomorrow morning.@k@v12/21400775. But when tomorrow morning comes, let me apologize again."'
13349: 'Shannon@r@v15/20500758."Yes...@k@v15/20500759. ............Thank you very much."'
13350: '@rGeorge-aniki and Shannon-chan left the servant room together.'
13351: '@r.........Now, only Maria, Auntie Rosa and I were left in this disgusting, blood-stained room.'
13352: '@rUntil Genji-san disappeared—until Gohda-san disappeared—until George-aniki and Shannon-chan disappeared—we stood there, in a daze...'
13353: '@rAfter their presence and their footsteps had disappeared completely, Auntie Rosa giggled at them, as though she had just remembered something pleasant.'
13354: 'Rosa@r@v12/21400776.".........You can''t trust them at all.@k@v12/21400777. Goddamn furniture."'
13355: '@rThat one sentence...@w500....made me choke.'
13356: 'Battler@r@v10/20100995."...Wh-@v10/20100996..........why are you...@v10/20100997..........saying...@v10/20100998.something like that......?"'
13357: 'Rosa@r@v12/21400778."There are five master keys in all?@k @v12/21400779.Who would believe that?@k @v12/21400780.It''s obvious that some duplicate keys exist.@k@v12/21400781. ......As if we could trust them just because they pulled keys out of their pockets...!!"'
13358: 'Battler@r@v10/20100999."Th-......that''s not fair.........@k @v10/20101000.By, ......by setting down those keys, ......they weren''t just letting go of the keys..."'
13359: 'Battler@r@v10/20101001."......You''ve...made all their hard work count for nothing, disgraced it, trampled it,@k@v10/20101002. .........and caused them to give up the keys at the end of it all......"'
13360: 'Battler@r@v10/20101003."What''s with that parting line...@k@v10/20101004. They''ve shown that they''re willing to go this far, ......and you still can''t trust them?!@k @v10/20101005.Too much... That''s just too much......!"'
13361: 'Rosa@r@v12/21400782."It''s a Devil''s Proof!@|@y@k @v12/21400783.There are five master keys in all?!@k @v12/21400784.It''s impossible to prove something like that!!@k @v12/21400785.You can show that there are five master keys by placing them here!@k @v12/21400786.But you can''t prove that no more than five exist!!@k @v12/21400787.Only a demon or a witch could prove something like that, you know?!"'
13362: 'Battler@r@v10/20101006."Uwaaaaaaaaaaaaaaaaaaaaaaaaaaaa!!!@k @v10/20101007.Stop it already stop it already...!!"'
13363: 'Battler@r@v10/20101008."Please, BEATRICE, show yourself right now,@k@v10/20101009. and tell Auntie Rosa in red that "there are only five master keys"!!@k @v10/20101010.Please, I beg you, this can only be proved by devils, a witch like you could prove it!"'
13364: 'Battler@r@v10/20101011."Please, Beato, show yourself here and tell Auntie Rosa...@k@v10/20101012.that those are all of the master keys, and that there''s no need to suspect anyone anymore...!!!"'
13365: 'BEATRICE@r@v27/20701327."@|@y@c900.@[There are only five master keys.@]@c.@k@v27/20701328. @|@y@c900.@[There are only five master keys.@]@c."'
13366: 'BEATRICE@r@v27/20701329."...*cackle*, whatever could be wrong?@k@v27/20701330. It doesn''t reach Rosa''s ears no matter how often I say it.@k@v27/20701331. It seems there must still be someone who denies that I exist, isn''t that riiiight?@k @v27/20701332.Ushiromiya Battleeeeeeeer???"'
13367: 'Battler@r@v10/20101013."I accept it!!@k @v10/20101014.I accept it, you exist you exist you definitely exist!@k @v10/20101015.So, I beg you, stop this already!!@k@v10/20101016. Stop it already! Stop it already!!@k @v10/20101017.HiiiiIIIiiiiiIiiiiiiii!!"@|@y'
13368: 'BEATRICE@r@v27/20701333."Your words alone will not reach me; show it with your actions.@k@v27/20701334. Swear from your heart that you will become my furniture."'
13369: 'BEATRICE@r@v27/20701335."Can you do it?@k @v27/20701336.Take off your clothes, be naked, then put both your hands flat and crawl on the ground.@k@v27/20701337. Clothing is proof of one''s humanity.@k@v27/20701338. From now on, you will become furniture, so you will lose that right, it''s only natural!!"'
13370: 'BEATRICE@r@v27/20701339."Then kneel, make your tongue crawl on my shoes.@k@v27/20701340. Can you do it?@k @v27/20701341.You can do it, riiiiiiiight??@k @v27/20701342.Then I''ll appear, sure, I''ll say it in red, sure!@k @v27/20701343.@|@y@c900.@[There are only five master keys@]@c., I''ll tell Rosa just that!"'
13371: 'BEATRICE@r@v27/20701344."Oh, but I understand, there''s no way you could throw away your lordly pride.@k@v27/20701345. But that''s alright, that''s more than enough, you''re starting to waver a bit, aren''t youu?"'
13372: 'BEATRICE@r@v27/20701346."For just an instant, you thought maybe it would be alright to lick my shoes, didn''t youuu?@k@v27/20701347. And you immediately denied that and felt ashamed, riiiiight??@k@v27/20701348. Just looking at that expression makes me feel just wooonderful!!"'
13373: 'BEATRICE@r@v27/20701349."That face of yours is so pathetic, go look in a mirror,@k@v27/20701350. see how low you are there, naked and licking my shoooooes?@k@v27/20701351. Can you see it, Ushiromiya Battleeeeeeeeeeeeeeeeeeeeer???"'