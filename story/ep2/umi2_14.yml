13230: 'George@r@v07/20300596."......P-please wait, Auntie Rosa.@k@v07/20300597. What do you mean by that...?!"'
13231: 'Rosa@r@v12/21400698."Doctor Nanjo and Kumasawa-san aren''t dead, they''re alive!@k @v12/21400699.They made it seem like they were killed, and are hiding somewhere in this mansion.@k@|@y@v12/21400700. So that they can attack us!!"'
