13245: '@r.........And she had believed that she had built up a friendly relationship with Rosa, as well.'
13246: '@r...And this was how she was treated!!@k@rYou could kill a person without using a knife...'
13247: '@rIt wasn''t just George-aniki;@k ...even I could recognize that Shannon-chan had been stabbed deep into her heart, as blood by the name of tears flowed out...'
13248: 'Gohda@r@v17/21700263."Shannon-san, stay back...@k@v17/21700264. ......Rosa-sama, it is true that I have not served for many years, and I understand that I have not earned your trust..."'
