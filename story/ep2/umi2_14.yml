13270: 'Genji@r@v14/21600151."......Rosa-sama.@k@v14/21600152. We are furniture working for the Ushiromiya family.@k@v14/21600153. ......Whether we are trusted by you or not, that is not our concern.@k@v14/21600154. No matter what assessment you give us, we will only continue to serve until our final hour."'
