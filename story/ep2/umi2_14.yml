13197: 'BEATRICE@r@v27/20701300."Hey, Battler?@k @v27/20701301.Sorry for bullying you too much.@k@v27/20701302. I''ll "flip over the chessboard" from my side.@k@v27/20701303. I''ll teach your side the best move in your place.@k@|@y@v27/20701304. Want to heeeeeaar??"'
13198: 'Battler@r@v10/20100958."Screw you, I don''t wanna hear, I don''t wanna hear!!"'
13199: 'BEATRICE@r@v27/20701305."The case of Jessica''s room.@k@v27/20701306. You really struck on a good spot, you know...?@k @v27/20701307.Trying to hide and wait for you to pass by.@k@v27/20701308. That truly was a good observation."'
13200: 'BEATRICE@r@v27/20701309."...But why did you think that could only be Kanon or me, the 19th person......?@k @v27/20701310.I see, the "hide" part of "hide and wait for you to pass" must have gotten in the way, so you didn''t think that far."'
13201: 'BEATRICE@r@v27/20701311."...Loooook, now do you understand?@k @v27/20701312.It''s Jessica.@k@v27/20701313. Jeeeessicaaaaaa!!"'
