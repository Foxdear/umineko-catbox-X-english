13218: 'BEATRICE@r@v27/20701318."That is why I am here...!!@k @v27/20701319.@|@y@c900.@[Come on, Ushiromiya Battler, kneel.@]@c.@k@v27/20701320. Then swear your eternal loyalty and lick my shoes...!!"'
