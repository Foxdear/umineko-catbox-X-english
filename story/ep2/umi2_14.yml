12990: 'Rosa@r@v12/21400649."Doctor Nanjo and Kumasawa-san?!@k @v12/21400650.What in the world is going on?!"'
12991: 'George@r@v07/20300575."Aaah, Shannon!@k @v07/20300576.Thank goodness you''re safe...!@k @v07/20300577.If something had happened to you, I...!"'
12992: 'Shannon@r@v15/20500729."......George-sama......@k@v15/20500730. ......uuuuughh........."'
12993: 'Rosa@r@v12/21400651."George-kun, be quiet for a second!@k @v12/21400652.A murder occurred before your very eyes, right?!@k @v12/21400653.Did you see the culprit?!@k @v12/21400654.Or not?!!"'
12994: 'Gohda@r@v17/21700224."Tha-......that is, umm,@v17/21700225. ......how should I explain...?!@k @v17/21700226.G-Genji-san."'
12995: 'Genji@r@v14/21600140."..................Even we cannot explain what we saw very well."'
12996: 'Gohda@r@v17/21700227."It certainly, umm, ...happened right before our eyes!@k @v17/21700228.It was right in front of my eyes!@k @|@y@v17/21700229.But still,@v17/21700230. ......that, umm,@v17/21700231. .........what was that...@k@v17/21700232. Even I do not understand!"'
12997: 'Rosa@r@v12/21400655."What are you saying?!@k @v12/21400656.It''s impossible for you to have met anyone other than the witch, BEATRICE, whose location has been unknown since last night,@k@v12/21400657. or Kanon-kun, who has gone missing!@k @v12/21400658.Was it a man or a woman?!@k @v12/21400659.You should be able to tell me at least that much, right?!"'
12998: 'Battler@r@v10/20100869."Auntie Rosa, calm down a bit...!@k @v10/20100870.Anyone would be confused if two people were taken out right in front of them!@k @|@y@v10/20100871.Gohda-san, Genji-san.@k@v10/20100872. There''s no need to rush.@k@v10/20100873. Tell us what happened, one thing at a time."'
12999: 'Gohda@r@v17/21700233."...............About that... ...How should I say it......"'
13000: 'George@r@v07/20300578.".............................."'
13001: '@rDoctor Nanjo and Kumasawa-san had been killed.@k@rWe understood that much.'
13002: '@r...And it seemed that it had occurred in front of their eyes.@k@rBut even so, they spoke awkwardly.'
13003: '@rThey admitted that they had definitely seen the crime with their own two eyes.@k@rBut when asked to explain what they had seen, their mouths went suddenly shut.'
13004: '@rI could understand why Auntie Rosa was irritated and losing her patience...'
13005: 'George@r@v07/20300579."...Shannon.@k@v07/20300580. Did you see it?@k @v07/20300581.When Doctor Nanjo was attacked."'
13006: 'Shannon@r@v15/20500731."Ye-.........yes."'
13007: 'George@r@v07/20300582."Tell me.@k@v07/20300583. ...Just what you understand.@k@v07/20300584. What in the world happened?"'
13008: 'Shannon@r@v15/20500732."..................The back door............@k@v15/20500733. ......In through there."'
13009: 'Gohda@r@v17/21700234."...Tha-that''s right.@k@v17/21700235. Someone came up to the back door.@k@v17/21700236. Then, wondering who it was, I opened the door..."'
13010: 'Rosa@r@v12/21400660."Someone at the back door?@k @v12/21400661.Who was it?!"'
13011: 'Battler@r@v10/20100874."Let them finish!@k @v10/20100875.And after that?!"'
13012: 'Gohda@r@v17/21700237.".........That person was...stained with blood, and had a large wound.@k@v17/21700238. ...We carried them to the servant room, and Doctor Nanjo immediately began first aid.@k@v17/21700239. ......It was a...very deep wound."'
13013: 'Rosa@r@v12/21400662."For the last time, who are you talking about?!"'
13014: 'Gohda@r@v17/21700240."...I don''t know!@k @v17/21700241.Certainly, ...in the beginning, I thought I knew.@k@v17/21700242. No, I still think it was!@k@r@v17/21700243.But.........what in the world was that!!@k @v17/21700244....I don''t know... ...I don''t know!!"'
13015: '@rIn a manner that didn''t match his large body, Gohda held his head and scratched at it...'
13016: '@rI didn''t have a clue whether he was confused because he couldn''t remember,@k or whether he was confused because he had seen something terrifying, and couldn''t accept it.'
13017: '@rAnd Shannon looked the same way.'
13018: '@rIf she let her guard down, what she had seen just a short while ago would quickly melt away like a daydream,@k and she wouldn''t even be able to remember what she saw.'
13019: '@r......That''s what she looked like.'
13020: '@rOnly Genji looked composed as usual.'
13021: '@r...So the questions were naturally directed at Genji.'
13022: '@rBut even Genji had to take quite some time to gather his thoughts before he opened his mouth.'
13023: 'Rosa@r@v12/21400663."Genji-san.@k@v12/21400664. You saw it, right?@k @v12/21400665.Who was the person that came in through the back door?!"'
13024: 'Genji@r@v14/21600141."............At first, ...we believed that person...was Kanon."'
13025: 'Rosa@r@v12/21400666."You see!!@k @v12/21400667.He was alive after all!@k @v12/21400668.My reasoning was correct!!"'
13026: 'George@r@v07/20300585."......By "at first", you mean that your impression changed later, right......?"'
13027: 'Genji@r@v14/21600142."Yes.@k@v14/21600143. .........I cannot explain with words what happened after that.@k@|@y@v14/21600144. ......It killed Doctor Nanjo and Kumasawa, ......then disappeared.@k@v14/21600145. At that time, it was definitely not Kanon."'
13028: 'Gohda@r@v17/21700245."Yes!@k @v17/21700246.That''s right!@k @v17/21700247.It''s just as Genji-san says!!@k @v17/21700248.You really couldn''t explain it with words!"'
13029: 'George@r@v07/20300586."......Do you have the same opinion?"'
13030: 'Shannon@r@v15/20500734."...Yes............@k@v15/20500735. I......can only say the same thing as well......"'
13031: 'Battler@r@v10/20100876."..........................."'
13032: '@r...If we interpreted what they were saying favorably,@k ......it meant that Auntie Rosa''s conclusion had been correct from the beginning.'
13033: '@rKanon-kun had appeared from the back door in the kitchen with a serious injury.@k@rThen he had been taken to the servant room and cared for.'
13034: '@r......Then, something terrifying had happened.'
13035: '@rSince these people couldn''t imagine that Kanon-kun could have pulled that off, they had started to suspect whether that really had been Kanon-kun.@k Is that how things are?'
13036: '@rIn other words, this meant......Kanon-kun had appeared.@k@rNo matter how confused they were, no matter how they muddled their words, that''s what it meant in the end.'
13037: '@rSo had Kanon-kun indeed used some trick to escape that room while it was locked?!@k No, that doesn''t matter anymore.'
13038: '@rThe real problem is that Doctor Nanjo and Kumasawa-san were killed.'
13039: '@rAuntie Rosa had claimed that Kanon-kun was behind this from the very beginning.'
13040: '@rNo matter how confused they became and no matter how much they tried to deny it, ...they were halfway saying that it was the truth.'
13041: '@r......But even so, for some reason, I felt like their awkwardness couldn''t be explained just by confusion...'
13042: '@r......What had they seen?'
13043: '@rLike they said, had they really seen something unexplainable with words...?'
13044: '@rAuntie Rosa, having decided that she wouldn''t be able to get any more out of them, concluded her questioning,@k and said that she wanted to check the two bodies.'
13045: '@rI was also interested in that.'
13046: '@rEven if these people didn''t have a clue what was going on in their confusion,@k ...if those of us who hadn''t been at the scene calmly looked at the bodies, we might find something.'
13047: '@r.........But it was a little surprising that Auntie Rosa was also concerned about the bodies, just like I was.'
13048: '@rEven at this point, I still wanted to expose the culprit and the truth myself, if we could find any clues.'
13049: '@rBut Auntie Rosa should have been different.@k ......Hadn''t Auntie Rosa''s plan given a higher priority to staying safe than to finding the culprit?'
13050: '@rI couldn''t really see why Auntie Rosa wanted to check the bodies so badly that she would deliberately leave our fort in the parlor.'
13051: 'Rosa@r@v12/21400669."We will all go to the servant room together.@k@v12/21400670. If we all move together, it''ll be safe.@k@|@y@v12/21400671. Maria, stop that scribbling now!"'
13052: 'Maria@r@v13/20400419."Uu.@k@v13/20400420. Not scribbliiing.@k@v13/20400421. Solving BEATRICE''s probleeem.@k@v13/20400422. Uu..."'
13053: 'Battler@r@v10/20100877."BEATRICE''s problem?@k @v10/20100878.What''s that? Tell me too."'
13054: 'George@r@v07/20300587."...Auntie Rosa, are you...umm...bringing Maria-chan too?"'
13055: '@rIt seemed that George-aniki had some resistance to bringing Maria to the bloody crime scene.'
13056: '@r...But taking into consideration the fact that Maria would be left alone here, it would surely be much safer if we took Maria with us.'
13057: '@r......In the end, it was just Aniki''s irresponsible humanism.@k@rWe decided that all of us, including Maria, would go to the servant room.'
13058: '@rThe bed in the servant room was stained with bright-red blood.'
13059: '@r...No, not just the bed.@k The whole room was covered with a gruesome paint from countless blood stains.'
13060: '@rThat dreadful scene alone was enough to give us an idea of the repulsive sight they had been trying to describe...'
13061: 'Maria@r@v13/20400423."......Uu.@k@v13/20400424. Wanna look too!"'
13062: 'George@r@v07/20300588."You wait here with me, Maria-chan, okay?"'
13063: '@rGeorge-aniki was standing by the entrance, covering Maria''s eyes, with his back to the room.'
13064: '@r......He probably didn''t want to dirty an innocent girl''s retinas with the repulsive red in this room.'
13065: '@rThat was surely the correct decision.'
13066: '@r......I was acting tough right now, so I didn''t mind,@k ......but I would probably remember this room and start to vomit whenever I saw red paint scattered around,@k for the rest of my life.'
13067: '@r......My retinas already had this room burned into them.@k@r...In other words, it was too late for me...'
13068: 'Shannon@r@v15/20500736."...............Huh......"'
13069: 'Gohda@r@v17/21700249."Wh-...where did they...!"'
13070: '@rRight after they entered the servant room, Gohda-san and Shannon-chan appeared flustered.'
13071: '@r...We shook, wondering what horrible new situation had arisen to fluster them for a second time.'
13072: 'Rosa@r@v12/21400672."What happened?@k @v12/21400673.What is it?"'
13073: '@rAuntie Rosa also shuddered, raised her gun high, and searched for whatever it was that had them shaken.'
13074: '@r......But she couldn''t find it.@k ...Which wasn''t surprising.@k@r...They were shaken because they couldn''t find it.'
13075: 'Battler@r@v10/20100879."Hey, hey, what in the world''s going on..."'
13076: 'Genji@r@v14/21600146.".........The two bodies...aren''t here."'
13077: 'Rosa@r@v12/21400674."What do you mean?"'
13078: 'Shannon@r@v15/20500737."......Tha-that can''t be...!@k @v15/20500738.Those two were definitely...here......!"'
13079: 'Battler@r@v10/20100880."...Wait wait wait.@k@v10/20100881. What the hell—are you saying the corpses just walked off somewhere?@k @v10/20100882.How could that happen?@k @v10/20100883.I mean, wasn''t the servant room locked?@k @v10/20100884.Didn''t you unlock the door when you came in just now, Gohda-san?!"'
13080: 'Battler@r@v10/20100885."......So then, what?@k@v10/20100886. ...Isn''t this the same as Jessica''s room?!@k @v10/20100887.They''ve disappeared from inside a locked room again?!@k @v10/20100888.That''s ridiculous!!"'
13081: 'Gohda@r@v17/21700250."I don''t have a clue what happened either!!@k @v17/21700251.When we left this room, we definitely locked it, and......!!@k @v17/21700252.I don''t have a clue what''s going on anymore...!!"'
13082: '@rThere was a timid and pitiful smile on Gohda-san''s face that he definitely wouldn''t have let show normally.'
13083: '@rShannon was the same.'
13084: 'Battler@r@v10/20100889."Both their corpses disappeared!@k @v10/20100890.And furthermore, they disappeared while the door was locked!@k @v10/20100891.Even if the culprit was Kanon-kun, he shouldn''t be holding a master key anymore!!"'
13085: 'Shannon@r@v15/20500739."That''s wrong...!@k @v15/20500740.Kanon-kun is not the culprit...!!"'
13086: 'George@r@v07/20300589."......Shannon...@k@v07/20300590. I believe Shannon.@k@v07/20300591. Kanon-kun is not the culprit.@k@v07/20300592. This must be the doing of someone who looks a lot like him."'
13087: 'Rosa@r@v12/21400675."No.@k@v12/21400676. Kanon-kun could have gotten a master key.@k@|@y@v12/21400677. ......After all, his master key was found in the pocket of Jessica-chan''s body.@k@v12/21400678. ...And who took that key?"'
13088: 'George@r@v07/20300593."!!@k @v07/20300594.Th-that''s right!@k @v07/20300595.It was Doctor Nanjo......!!"'
13089: '@rThat''s right.@k Back then, it definitely had been Doctor Nanjo who searched through Jessica''s clothes and found the master key...!'
13090: '@rSo, if someone had the opportunity to search Doctor Nanjo''s corpse, it would have been easy for them to take the master key back...'
13091: '@rAuntie Rosa searched under the bed and in the locker.'
13092: '@r...By now, I also understood what that meant.@k@rIf you assume that there had been two culprits, it could be easily explained.'
13093: '@rThe first person was Kanon-kun, or maybe an impostor that looked like him.@k@rHe had finished off Doctor Nanjo and ran off somewhere.'
13094: '@rThe second person was......probably the 19th person, BEATRICE, whose location was unknown.'
13095: '@rShe had hidden under the bed in the servant room beforehand, and with Doctor Nanjo''s body still enshrined here, she had waited for Genji-san and the rest to leave.'
13096: '@rThen after that, she had crawled out, taken the master key back from Doctor Nanjo''s pocket, and carried the two bodies away for some reason.'
13097: '@rIf she had then locked the door with the master key, this locked room would be created.'
13098: 'BEATRICE@r@v27/20701233."*cackle*cackle*.@k@v27/20701234. You constructed that one pretty fast with your reasoning from Jessica''s room as a premise.@k@v27/20701235. With that method, you could indeed create a locked room even without magic.@k@v27/20701236. Should I give you passing marks?@k @v27/20701237.However, as truly fascinating as it was, ......there is something you must not forget."'
13099: 'BEATRICE@r@v27/20701238."...If the culprit had taken the master key back by the method you say,@k@v27/20701239. ......that culprit...@v27/20701240.would have to have known that Nanjo had taken the master key from Jessica''s body."'
13100: 'Battler@r@v10/20100892."......You don''t have to tell me that...@k@v10/20100893. You''re probably trying to say that it''s information only the people in that place, at that time, could know..."'
13101: 'Battler@r@v10/20100894."......Heh!@k @v10/20100895.This third locked room was crushed so fast that you can''t do anything but gripe.@k@v10/20100896. There''s no art in repeating the same content..."'
13102: '@rEven though I was acting tough, that move of the witch''s hurt bad...@k@r......I could feel cracks forming in the thing I most wanted to deny.'
13103: '@rShe''s trying to close in on me from two directions.'
13104: '@rOn the one hand, there''s the frontal attack, where she tries to force me to believe in witches, using locked room tricks that only a witch could do.'
13105: '@r......And on the other hand, there''s the rear attack, where she tries to lure me into thinking it would be better if there was a witch, by strengthening my suspicions of those close to me.'
13106: '@rIn the first locked room, the chapel, she had used the frontal attack, but it hadn''t worked on me.'
13107: '@rThat''s undoubtedly why, with the second locked room, and now the third, she''s started to change the direction of her attack...'
13108: '@rHowever, the fact that she was changing the direction of her attack also proved that my resistance was working a little.'
13109: '@r...And she had surely given up on the frontal attack because she couldn''t just win directly with it...'
13110: '@r.........I tried to force myself to accept my own position by thinking that.@k@rBut it seemed that the witch had seen through these thoughts of mine long ago.'
13111: 'BEATRICE@r@v27/20701241."*cackle*cackle*.@k@v27/20701242. The frontal attack is indispensable.@k@|@y@v27/20701243. ...The rear attack only has meaning because it advances at the same time as the frontal attack.@k@v27/20701244. If I were to degenerate into only using the rear attack, it would be nothing more than a foolish plan occurring when my means became my goal."'
13112: 'Battler@r@v10/20100897."...Ihihi, really?@k@v10/20100898. Well then, won''t you repeat "no one was hiding in the servant room" in that red you''re so proud of?"'
13113: 'BEATRICE@r@v27/20701245."There is no need.@k@v27/20701246. The premise of your reasoning is about to be destroyed."'
13114: 'Battler@r@v10/20100899."Oh, oh?!@k @v10/20100900.You decline?!@k @v10/20100901.So someone really is hiding?!"'
13115: 'BEATRICE@r@v27/20701247."Rosa will destroy your premise right now.@k@v27/20701248. ...*cackle*cackle*!@k @v27/20701249.Well, try listening in."'
13116: 'Gohda@r@v17/21700253."Please believe us, Rosa-sama...!!@k @v17/21700254.The two bodies were certainly lying here!@k @v17/21700255.The bright-red blood on the floor is theirs...!!"'
13117: '@rAuntie Rosa began to search through various objects around the room, her back to Gohda-san as he cried out in supplication.'
13118: '@r......Eventually, she found something, and for a while, stopped moving.'
13119: 'Gohda@r@v17/21700256."Rosa-sama, we definitely aren''t lying...!!@k @v17/21700257.The two bodies were definitely here!!"'
13120: 'Rosa@r@v12/21400679."Quiet down.@k@v12/21400680. .........The person who hid the corpses has confessed that they took them to another place.@k@|@y@v12/21400681. .........With this."'
13121: '@rRosa showed them a single sheet of paper over her shoulder.'
13122: 'Battler@r@v10/20100902."What on Earth is that?!@k @v10/20100903.It couldn''t be......a letter in a sealed envelope with crest, just like in the chapel?!"'
13123: 'Rosa@r@v12/21400682."......Yes, that''s right.@k@v12/21400683. It was set here, out in the open.@k@v12/21400684. I''ll read it."'
13124: '@r@v27/20701249_1.@z70.—People of the Ushiromiya family.@k@r@v27/20701249_2.I wonder if your attempts at solving the epitaph''s riddle for the gold are reaching a climax.@k@r@v27/20701249_3.Solving the riddle of the epitaph is the single method by which you all can stop me.'
13125: '@r@v27/20701249_4.@z70.You will not be able to stop me, or the ritual, by way of any other method of any kind.@k@r@v27/20701249_5.I ask all of you that you take care not to mistake your goal.'
13126: '@r@v27/20701249_6.@z70.Attempting to search for me is useless.@k@r@v27/20701249_7.Attempting to escape from me is useless.@k@r@v27/20701249_8.Attempting to deny me is also—useless.@k@r@r@v27/20701249_9.—BEATRICE the Golden.'
13127: 'Rosa@r@v12/21400685."......P.S.@k@v12/21400686. I borrowed the two bodies for the ritual.@k@v12/21400687. I will return them later, so please accept my apologies.@k@v12/21400688. ...Furthermore, since these keys belong to all of you, I shall return them."'
13128: '@rAs Rosa read that aloud, the contents of the envelope lay exposed on the palm of her hand.'
13129: '@rThey were two master keys.@k@rThe master key that Nanjo had found in Jessica''s pocket, which had originally been Kanon''s, and Kumasawa''s master key.'
13130: 'Battler@r@v10/20100904."What the helllllll......@k@v10/20100905. So what does that mean...@k@v10/20100906. Damn you, again?!@k @v10/20100907.You''re saying I can only suspect the servants holding keys again?!"'
13131: 'BEATRICE@r@v27/20701250."I haven''t said it in red, you know...?@k @|@y@v27/20701251.I haven''t denied the possibility that at the time they locked the door and left, someone was hiding in this room...@k @v27/20701252.*cackle*cackle*cackle*!"'
13132: 'Battler@r@v10/20100908."......If they were hiding under the bed, it wouldn''t have been impossible for them to have carried the corpses away somewhere.@k@v10/20100909. But that way they couldn''t lock the door!@k @v10/20100910.The master key they went to all that trouble to get their hands on was set down right here!"'
13133: 'Battler@r@v10/20100911."......That''s right, I''d forgotten.@k@v10/20100912. What about the keys specifically for this room, the servant room keys?!"'
13134: 'BEATRICE@r@v27/20701253."Mmhm.@k@v27/20701254.@|@y Those @c900.@[are in the key box in the center of the servant room.@]@c.@k@v27/20701255.@|@y There are several servant room keys, but @c900.@[all of those are inside the key box.@]@c."'
13135: 'Battler@r@v10/20100913."Which means that the situation isn''t any different from the time with the key to Jessica''s room...@k@v10/20100914. It''s not like the servants would walk around with an unnecessary key when they have those convenient master keys.@k@v10/20100915. I can accept that they were all still shut away in the key box..."'
13136: 'BEATRICE@r@v27/20701256."And nothing has changed in the other conditions.@k @v27/20701257.@|@y@c900.@[Entry and exit are impossible except for the single door and the single window.@]@c.@k@v27/20701258. Therefore, hidden doors and irregular methods of entry cannot exist.@k@v27/20701259. Rejoice, great detectives.@k@v27/20701260. *cackle*!"'
13137: 'BEATRICE@r@v27/20701261."@|@y@c900.@[And those were both locked.@]@c.@k @v27/20701262.@|@y@c900.@[The door and the window do not permit any kind of entry or exit when they are locked.@]@c.@k@v27/20701263. So it won''t work to remove the door, make a crack to slide in through, or anything like that while the lock is maintained.@k@v27/20701264.@|@y And obviously, @c900.@[it is impossible to unlock the door without the servant room key or a master key.@]@c."'
13138: 'BEATRICE@r@v27/20701265."...It''s a pain having to read all these aloud every time.@k@v27/20701266. Sooner or later, I should think of some word to abbreviate all this into a single phrase."'
13139: 'Battler@r@v10/20100916."But you can''t repeat that no one was hiding in this room!@k @v10/20100917.......However, that alone won''t break open the door of a locked room...@k@v10/20100918. Aaah, damn it, damn it!!@|@y@k @v10/20100919.It''s no good, no good, no goddamn good at all...!"'
13140: 'BEATRICE@r@v27/20701267."*cackle*cackle*!@k @v27/20701268.What happened to that flipping over the chessboard thing that you''re so proud of...?@k @v27/20701269.Please, announce your boastful strange theory."'
13141: 'Battler@r@v10/20100920."...............Flip over...the chessboard.@k@v10/20100921. ............What would I do if I were the culprit?@k@v10/20100922. I carry the corpses off somewhere.@k@v10/20100923. ......I leave a letter.@k@v10/20100924. .........I lock the door from the inside.@k@v10/20100925. ......Then I just have to escape this room by some means."'
13142: 'Battler@r@v10/20100926.".........Damn it, is that even possible?!@k @v10/20100927.I was told in red that you can''t get outside except by the door or the window...!"'
13143: 'Battler@r@v10/20100928."..................ah—"'
13144: '@r......At that moment, ......I got it.@k That''s right.'
13145: '@r......Carry the corpses, leave the letter.@k@r......And not rely on a "hidden door"—in other words, not even able to escape.'
13146: '@r... That''s right.@k This isn''t a question, it''s an answer......'
13147: 'Battler@r@v10/20100929."Beato.@k@v10/20100930. ......Before my repetition request, I want to check the definition of these hidden doors that you''re talking about."'
13148: 'BEATRICE@r@v27/20701270."What have you thought of?@k@v27/20701271. Very well, I''ll explain.@k@|@y@v27/20701272. A hidden door refers to an entrance or exit that cannot be recognized by those who do not know of it.@k@v27/20701273. Even children know that."'
13149: 'Battler@r@v10/20100931."......So in other words, if you can''t get outside the room with it, it isn''t a hidden door?"'
13150: 'BEATRICE@r@v27/20701274."Hoh.@k@v27/20701275. .........That angle."'
13151: 'Battler@r@v10/20100932."I kept thinking that the culprit had escaped the locked room."'
13152: 'Battler@r@v10/20100933."......That''s wrong.@k@v10/20100934. Even the culprit couldn''t escape the locked room!@k @v10/20100935.So the culprit decided to hide until we passed by!"'
13153: '@rI had used this theory for the second locked room, and reasoned that Kanon-kun might have done this.'
13154: '@r......But I had given up that reasoning when I was told "Kanon-kun was killed" in red.'
13155: '@rAnd next, I had reasoned that if there had been a third person in the room, it would have been possible for them to escape through a hidden door.'
13156: '@rAnd that was when, for the first time, the claim had been made in red that "no hidden doors exist".'
13157: '@rAnd what I''d learned just now.@k These "hidden doors" the witch was talking about referred to things that made it possible to get into or out of the room.'
13158: '@r......In other words, things that didn''t permit entry or exit to the outside, and also wouldn''t be noticed by people who didn''t know about them, wouldn''t fall under the definition of "hidden door".'
13159: '@rIn other words, if there were, for example, something like a "hidden shelf" or a "secret closet", they wouldn''t be defined as "hidden doors"!'
13160: '@rIn other words, the third person in Jessica''s room was hiding here, waiting for us to pass by!'
13161: '@rHeh, how pathetic, just a little playing around with words!@k@rWith this method, it looks like I can even manage the third locked room, the servant room.'
13162: '@rIf there''s a hidden shelf under the bed or anything like that, that would be enough.@k@rThe culprit''s hiding somewhere, waiting for us to leave.'
13163: '@r.........The culprit is also trapped in the locked room even now!!'
13164: '@rWhich means......at this very moment!'
13165: '@rThe culprit is still hiding in the servant room, holding their breath...!!!'
13166: '@rAnd that means......... What the hell...'
13167: '@rEven though we''ve been tortured with locked rooms three times,@k ......in this very moment, we''ve actually gotten the culprit in checkmate!!'
13168: 'Battler@r@v10/20100936."I''ve finally started to see it.@k@v10/20100937. ......Take this, Beato!!"'
13169: 'Battler@r@v10/20100938."Repetition requested!@k @v10/20100939."There is no one in this room other than us"!@k @v10/20100940.By us, I mean me, George-aniki, Maria, Auntie Rosa, Genji-san, Gohda-san, and Shannon-chan, alright?!@k@v10/20100941. Well?!! You can''t say it, can you?!"'
13170: 'BEATRICE@r@v27/20701276.".........Hoh......@k@v27/20701277. .........Hoh......!"'
13171: 'Battler@r@v10/20100942."I''ll bet I hit you where it hurts!!@k @v10/20100943.If you decline, then say you decline, damn it!!@k @v10/20100944.Here comes the next one!!@k @|@y@v10/20100945.Repetition requested!!"'
13172: '@rI don''t know how they''re hiding in this room.'
13173: '@rBut if that''s a fact, then this also resolves the second locked room, Jessica''s room, at the same time!!'
13174: '@rI''ve finally caught her by the tail!@k@rWith this, I can explain everything!@k@rWitches don''t exist, I don''t have to doubt anyone!!'
13175: '@rAlright, starting now, I''ll flip it over!@k The next thing I''ll request she repeat is -'
13176: 'BEATRICE@r@v27/20701278."@|@y@c900.@[No one exists in this room except your group.@]@c.@k @v27/20701279.@|@y@c900.@["Your group" refers to Battler, George, Maria, Rosa, Genji, Gohda, and Shannon.@]@c."'
13177: 'Battler@r@v10/20100946."......Wha-............"'
13178: 'BEATRICE@r@v27/20701280."Let''s go back to Jessica''s room.@k @v27/20701281.@|@y@c900.@[At the time of Jessica''s corpse discovery,@]@k@v27/20701282.@|@y@[ only Battler, George, Maria, Rosa, Genji, Gohda, Shannon, Kumasawa, and Nanjo were in Jessica''s room.@]@c."'
13179: 'BEATRICE@r@v27/20701283.@|@y"Whoops, the corpse of @c900.@[Jessica is also included, of course.@]@c.@k@v27/20701284.@|@y@c900. @[Therefore, both in the case of Jessica''s room and the case of this servant room, no humans exist that you were not aware of.@]@c.@k @v27/20701285.@|@y@c900.@[No one is hiding.@]@c."'
13180: 'BEATRICE@r@v27/20701286."And I''ll say more.@k @v27/20701287.@|@y@c900.@[No method exists by which the doors can be locked from the outside without using a key.@]@c.@k @v27/20701288.@|@y@c900.@[Regarding the windows, no method exists by which they could somehow be locked from the outside.@]@c."'
