13224: 'Rosa@r@v12/21400691."Those two that you kept saying were dead aren''t here.@k@v12/21400692. ...And now we have the letter from BEATRICE, where she was kind enough to confess that she carried the corpses off.@k@|@y@v12/21400693. ......That''s what it is."'
