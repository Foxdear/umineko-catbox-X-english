13193: '@rImpossible,@w500. ......this is impossible!!'
13194: 'BEATRICE@r@v27/20701292."What''s wrong, Ushiromiya Battlerr?@k @v27/20701293.Weren''t you so confident you could deny witchesss?@k@v27/20701294. Why are you groveling and wringing out bitter tears in a place like thaaat?"'
13195: 'BEATRICE@r@v27/20701295."Oh, yes, that''s a really wonderful method.@k@v27/20701296. Truly wonderful how you''re trying to make me fall over laughing and drown in a sea of the tears of my own laughter.@k@v27/20701297. That''s what you''re really trying to do, riight?@k @v27/20701298.You''re trying to make me laugh and laugh and laugh myself to death, riight,@v27/20701299. U@w416.shiro@w583.miya@w1333. Batt@w1083.le@w83.e@w833.rr@w416.???"'
