14600: 'Battler@r@v10/90100231."Sorry to keep you waiting, Auntie Rosa.@k@v10/90100232. I had forgotten.@k@v10/90100233. This was a one-on-one fight between me and this woman.@k@v10/90100234. I was never supposed to give in.@k@v10/90100235. ......Thanks to your persistence, I''ve regained my will to fight!!"'
