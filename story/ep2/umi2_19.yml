14428: 'Rosa@r@v12/91400001."................................."'
14429: '@rRosa woke up from her doze.'
14430: '@r......It must have been a very deep sleep.@k@rHer mind was fuzzy and she wasn''t thinking clearly.'
14431: '@rWhere was she...@k@rIt felt like some mansion, but at least it didn''t seem to be the Ushiromiya family mansion.'
14432: '@rShe was in a room that looked like a parlor.'
14433: '@r......And there was some tea that had been prepared.@k@rIt had almost certainly been prepared for her.'
14434: '@rSparkles like gold leaf were dancing around the room, and it looked very dreamlike.'
14435: '@r...She eventually realized that they were gold butterflies, which made that stand out even more.'
14436: '@rThere was someone across from her.'
14437: '@r......A woman.'
14438: '@r.........The witch...@w416.of the portrait.'
14439: '@rShe looked like she was having a one-sided conversation.'
14440: '@rShe was probably talking to Rosa,@k but Rosa''s mind was clouded up by a deep fog, and she didn''t have a clue what was being said...'
14441: 'BEATRICE@r@v27/90700122."......It can be anything.@k@v27/90700123. If there is anything you desire, I will give you it all.@k@v27/90700124. You may think of it as a reward for your good luck, or as a proper trade for my demands."'
14442: 'BEATRICE@r@v27/90700125."To you, it may not be that great a thing at all.@k@v27/90700126. But that is how significant this transaction is to me."'
14443: '@r............What is she...talking about.'
14444: '@r...I don''t know,@k ...I don''t know.'
14445: 'BEATRICE@r@v27/90700127."Only, ......considering that I am a witch,@k@v27/90700128. I think it would be wise to ask for something that only a witch can grant."'
14446: 'BEATRICE@r@v27/90700129."Isn''t this a rare chance.@k@v27/90700130. You can actually receive a favor from me, BEATRICE the Golden.@k@v27/90700131. *cackle*cackle*!"'
14447: 'Rosa@r@v12/91400002."........................u........."'
14448: '@rFinally, Rosa started to feel the blood flowing through her body.@k@r...Her movements were still sluggish, and she couldn''t even voice the words she was thinking.'
14449: 'BEATRICE@r@v27/90700132."I am commonly called the Golden Witch.@k@v27/90700133. Bestowing a mountain of gold, like I gave to Kinzo, is no problem for me.@k@v27/90700134. ......After all, every pleasure of the human world can be expressed in terms of cash.@k@v27/90700135. Put another way, gold is human pleasure itself."'
14450: 'BEATRICE@r@v27/90700136."Can you imagine?@k @v27/90700137.A mountain of gold that you couldn''t use up as long as you lived."'
14451: '@rThe witch blew on her pipe, and seven colors of smoke covered the area.'
14452: '@rWhen she did, the inside of the parlor...had suddenly become filled with stacks of gold ingots.'
14453: '@rIt looked like a shining gold-colored wall.'
14454: '@r...If each ingot was worth tens of millions of yen,@k how much would all of this be worth?'
14455: '@rIt seemed sinful to even think of that number.'
14456: 'BEATRICE@r@v27/90700138."......However, the human world is difficult.@k@v27/90700139. I know that there are some things that cannot be satisfied no matter how high into the sky you pile up gold.@k@v27/90700140. I know that there are cracks that can''t be filled."'
14457: 'BEATRICE@r@v27/90700141."I won''t make light of that, and in fact, I believe that is why this is a gift that only a witch such as I can give."'
14458: 'BEATRICE@r@v27/90700142."......Why don''t I fill those cracks in for you?@k@v27/90700143. Yes, how about this.@k@v27/90700144. It''s something that only I can give.@k@v27/90700145. You should be very happy."'
14459: 'BEATRICE@r@v27/90700146."......You don''t have to say it out loud.@k@v27/90700147. I can understand it right away, the cracks in your heart are written on your face, *cackle*cackle*!"'
14460: '@rRosa felt a touch of discomfort at this witch,@k who kept on talking even though she herself hadn''t uttered a single word,@k but since she still couldn''t speak well, and found it difficult even to move a finger, she could do nothing about it,@k and was unable to do anything but listen.'
14461: 'BEATRICE@r@v27/90700148."How far back must I trace the deep wounds in your heart in order to heal them?"'
14462: 'BEATRICE@r@v27/90700149."......This is...@v27/90700150....deep,@v27/90700151. deep.@k@v27/90700152. ......Sometimes, wounds close up while a fragment of something is still inside.@k@v27/90700153. ...Even when those wounds appear to have healed, they will continue to throb for all eternity.@k@v27/90700154. Sometimes you have to open the wound once to completely heal it."'
14463: '@rAs the witch spoke, she was staring deep into Rosa''s eyes.'
14464: '@r......What in the world...was she peering at?@k Rosa felt uncomfortable, but she couldn''t look away.'
14465: 'BEATRICE@r@v27/90700155."............So this pain of yours was preordained from your very birth.@k@v27/90700156. ...How heart-breaking.@k@v27/90700157. ...You don''t have to say it.@k@v27/90700158. I understand.@k@v27/90700159. ......I understand......"'
14466: '@rGradually, Rosa, in turn, was drawn into the witch''s eyes.'
14467: '@rGradually, the world grew dark, spinning round and round as she was sucked in...'
14468: 'Krauss@r@v02/90800001.Rosa, Rosa.@k@v02/90800002. Why are you such an idiot?'
14469: '@rOh, that''s Krauss nii-san''s voice.@k@rKrauss nii-san is very grown-up, so he''s very smart.@k@rSo he hated the stupid kid Rosa.'
14470: '@rAnd he was a very scary person, and I was often hit, and my toys were taken from me and broken.'
14471: '@rHe would say it was a punishment because I did something bad, but I didn''t really understand what that was, or why I was being punished.'
14472: '@rI was always punished suddenly, and then after the fact, I was told in a contrived manner that it was a punishment for something or other,@k but it was always something I didn''t remember doing.'
14473: '@r......So I really hated Krauss nii-san.'
14474: 'Eva@r@v05/91000001.Rosa, Rosa.@k@v05/91000002. Why are you such an idiot?'
14475: '@rOh, that''s Eva nee-san''s voice.@k@rEva nee-san is very grown-up, so she''s very smart.@k@rSo she hated the stupid kid Rosa.'
14476: '@rAnd she was a very sly person, and I was often lied to, tricked, and bullied a lot.'
14477: '@rShe would say it was because I was stupid, and that it was only natural for stupid people to be swindled by those smarter than them.'
14478: '@rSo I wanted to become a wise person like Eva nee-san, and listened to what she said, but when I obeyed her, for some reason, someone always got really mad at me.'
14479: '@r......So I really hated Eva nee-san.'
14480: 'Rudolf@r@v08/91200001.Rosa, Rosa.@k@v08/91200002. Why are you such an idiot?'
14481: '@rOh, that''s Rudolf nii-san''s voice.@k@rRudolf nii-san is very shrewd.@k@rSo he hated the stupid kid Rosa.'
14482: '@rWhen Krauss nii-san was around, he was friendly with Krauss nii-san.@k@rWhen Eva nee-san was around, he was friendly with Eva nee-san.'
14483: '@r...And when Krauss nii-san wasn''t around, he was violent like Krauss nii-san,@k and when Eva nee-san wasn''t around, he played dirty like Eva nee-san.'
14484: '@rAnd even though he too was bullied most of the time,@k when Krauss nii-san and Eva nee-san weren''t around, he gave me two people''s worth of bullying.'
14485: '@r......So I really hated Rudolf nii-san.'
14486: '@r......Oh, but these are my memories from when I was a kid.'
14487: '@rQuite a lot of unfair things happen when you''re a kid.@k@rAnd you can''t drag them out forever.'
14488: '@rIn time, you bury them away in the far reaches of memory, and forget them bit by bit; that is supposed to be what it means to grow up, and become an adult.'
14489: '@rSo becoming an adult is the same thing as separating yourself from all of those memories.'
14490: '@rAnd so.@k No matter how much time passed, Rosa couldn''t become an adult.'
14491: '@r......Even though she had been blessed with a daughter called Maria and was called a mother,@k ...she didn''t at all feel like she had become an adult.'
14492: '@rThe witch pitied that.'
14493: '@rAnd she smiled, saying that she could heal that pain herself.'
14494: 'BEATRICE@r@v27/90700160."......How to heal you.@k@v27/90700161. It''s possible, but not easy.@k@v27/90700162. ...I could even rewind time, and give you a world where you have no elder siblings."'
14495: 'BEATRICE@r@v27/90700163."But that way, your "memories of being hurt by your elder siblings" wouldn''t remain,@k@v27/90700164. and therefore, you would be unable to acknowledge it as a reward."'
14496: 'BEATRICE@r@v27/90700165."It is the relieving of hunger that brings satisfaction.@k@v27/90700166. If you erase hunger itself, no one will thank you.@k@v27/90700167. Just like how there are no young people who give thanks for their daily gluttony.@k@v27/90700168. ......Understand?"'
14497: '@rI think she just told me something really difficult.'
14498: '@r...In short, even if she makes it so that I never had elder siblings, the pain wouldn''t be removed,@w500. maybe that''s what she''s saying.'
14499: '@rStrictly speaking, it''s different.@k@rHealing isn''t the same thing as removing pain.@k@rIt''s the pleasure earned for withstanding pain.'
14500: '@rTherefore, there can be no healing without pain.@k@rTo know the joy of healing, you have to know the pain.'
14501: 'BEATRICE@r@v27/90700169."In that case, ......you will require joy that compensates for your pain.@k@v27/90700170. You can feel proud of the past you have suffered.@k@v27/90700171. Because you are qualified to know a kind of pleasure that those who have not known suffering cannot taste.@k@v27/90700172. ...Those that have known this pleasure cannot help but give the same joy to others...@k@v27/90700173. *cackle*cackle*..."'
14502: '@rThe witch snapped her fingers, and even though the room was still filled with a mountain of gold,@w500. and was already like something from another world, a fabulous tablecloth appeared on top of the table,@k and wonderful cooking was laid out, almost as though it was the opening of a banquet in a castle from some fairy tale.'
14503: '@rFor an instant, Rosa felt a pleasurable surprise at how fabulous it was,@w500. ...but at the same time, she felt a bit of anticlimax.'
14504: '@rBecause she found herself thinking that being bullied by her siblings...@kcouldn''t be wiped away by just one meal, no matter how delicious.'
14505: 'BEATRICE@r@v27/90700174."Food contains many of the human pleasures.@k@v27/90700175. You must eat like a pig as long as you live."'
14506: 'BEATRICE@r@v27/90700176."If one meal isn''t enough, then as many as you want.@k@v27/90700177. Let us continue this gourmet banquet until the pain of your heart is healed.@k@v27/90700178. ......Begin, furniture."'
14507: '@rAs the witch clapped twice,@k there were suddenly goat-head servants there, and they began to prepare the meal.'
14508: '@rFrom the beautiful food dishes adorning the table, they efficiently took some food and began to pile it up on Rosa''s plate.'
14509: '@rIt really did look delicious, but Rosa''s body still felt as heavy as lead,@k and there was no way she could eat.'
14510: '@rMaybe they also understood that.'
14511: '@rThe goat-head servants tied a napkin around Rosa''s collar,@k and gallantly brought a glass of before-dinner alcohol to her mouth, and even tilted it for her.'
14512: '@rShe remembered an old servant who had once carried rice porridge to her mouth when she was laid up with a high fever.'
14513: '@rShe couldn''t drink it well, and it dripped down from her mouth, but she felt the fragrant sweetness spread throughout her mouth.'
14514: 'BEATRICE@r@v27/90700179."It''s a sweet aperitif of noble rot German-made wine.@k@v27/90700180. A wine cocktail of white wine tinged with crimson golden drops."'
14515: 'BEATRICE@r@v27/90700181."If I had to give it a name, I''d call it a Bloody Krauss.@k@|@y@v27/90700182. The color comes solely from golden drops of your brother''s blood, obtained by placing him in a compressor."'
14516: 'Rosa@r@v12/91400002_1."Bghk......?! *cough*, *cough*......!!"'
14517: '@rRosa coughed violently.@k And the bright red that stained her face made it look as though she had coughed up blood.'
14518: 'BEATRICE@r@v27/90700183."You know a lot about black tea, so you should know what it means, right?@k @v27/90700184."Golden drop" refers to the last drop.@k@v27/90700185. It is called the most precious drop in black tea."'
14519: 'BEATRICE@r@v27/90700186.".........So a golden drop of blood is the same.@k@v27/90700187. The last and most precious drop of blood squeezed out of a human.@k@v27/90700188. It''s squeezed with that."'
14520: '@rAs the witch snapped her fingers, a bright red veil was pulled off something large which had not been there moments ago.'
14521: '@r......The solemn and massive machine there was just like...@w500.a coffin for a large-sized person, with many large bulb-like things stuck to it,@w500. and it looked like a sinister torture device.'
14522: '@rBy its unnerving shape,@k you could tell that it used manpower to tighten and compress something.'
14523: '@r...And it seemed that there were still some squeezed dregs remaining inside,@k because of the bright red remains that stained it.'
14524: 'BEATRICE@r@v27/90700189."But you can''t take more than one golden drop at once.@k@v27/90700190. No matter what kind of human you take it from, you can''t get more than one drop.@k@|@y@v27/90700191. But I am a witch.@k@v27/90700192. It is also easy to revive a person."'
14525: '@rWhen the witch snapped her fingers, suddenly, the human compressor began to shake.'
14526: '@r...No, you could also hear a groan.'
14527: '@r......It looked almost as though someone had been sleeping in that man-sized coffin,@k had woken up, and was now struggling to get out.'
14528: '@rBut that was wrong.@k@rWhat was inside had definitely been squeezed dregs.'
14529: '@rUsing her magic, the witch had once again revived the squeezed dregs to how they had been before they were squeezed.'
14530: '@rThree goat-head servants with muscular physiques approached the compressor, and forcefully started tightening the large bulbs.'
14531: '@r...As they did, an unearthly moan came from the inside of the coffin.@k@r...Rosa thought she knew the owner of that voice.'
14532: 'BEATRICE@r@v27/90700193."It is fitting for cooking to be done in the kitchen.@k@v27/90700194. That is enough, stand back."'
14533: 'BEATRICE@r@v27/90700195."......Do you understand now how precious a golden drop is?@k @v27/90700196.To have it stained this crimson requires that several dozen people''s worth be squeezed."'
14534: '@rThe witch had definitely said that only one golden drop could be taken from a single human.'
14535: '@rAnd yet, she had dozens of people''s worth of golden drops from a single human.@k@r......Only a witch could do this.'
14536: '@rThe Golden Witch BEATRICE could kill a single human "endlessly".'
14537: '@r......In other words, before BEATRICE, even death did not mean release.'
14538: 'BEATRICE@r@v27/90700197."Want a second sip?@k @v27/90700198.Have you forgotten the day this man hit you, and you swallowed the blood that ran into your mouth?"'
14539: 'BEATRICE@r@v27/90700199."That''s right, remember that taste.@k@v27/90700200. Remember the taste of the tears that you spilled until you were dry.@k@v27/90700201. I believe this aperitif will be sufficient to heal that regrettable memory.@k@v27/90700202. *cackle*cackle*!!"'
14540: '@rOnce again, the goat-head servants tilted the deep red glass against her mouth.'
14541: '@r...Rosa attempted to close her lips in resistance,@k but the deep red liquid was relentlessly poured into her mouth, which was hanging open with shock,@k and the inside of her mouth was filled with a ghastly sweetness...'
14542: '@rIt was definitely a fragrant sweetness.'
14543: '@rHer brother, who she had thought of so hatefully, and who had made her soak her pillow so many times,@w500. had died dozens of times over to tinge this wine crimson, so it must have tasted sweet.'
14544: '@rBut Rosa tried to spit it out.'
14545: '@rBecause of that, the deep red wine that spilled out of Rosa''s mouth made her look as if she was covered in blood.'
14546: '@r......If this ghastly substance was only the aperitif,@k Rosa couldn''t help but feel uncomfortable about what would happen if this banquet continued.'
14547: 'BEATRICE@r@v27/90700203."That is a forked-tongued salad made from vegetables in season.@k@v27/90700204. ...On your ninth birthday, you wished you could bite it off someday - so here is that salad you desired, made from Eva''s tongue."'
14548: 'Rosa@r@v12/91400003."........................!!!"'
14549: '@rWhen Rosa heard the true nature of the pink-colored meat piled up in the salad,@k she had a sudden impulse to vomit her guts out.'
14550: '@r...Furthermore, the goat servants stuck a fork in it, and carried it to Rosa''s mouth.'
14551: 'BEATRICE@r@v27/90700205."How does your sister''s forked tongue taste?@k @v27/90700206.It must be quite soft and enchanting, right?@k @v27/90700207.*cackle*cackle*!"'
14552: '@rHow sweet, soft and enchanting it must have tasted in her mouth.'
14553: '@rAfter all, Eva''s lies were always sweet, and young Rosa had always listened to them.'
14554: '@r...So you could say that the taste of the stimulating pepper seasoning that had been added expressed the details of those lies well.'
14555: 'Rosa@r@v12/91400004."......mnnnnnnnnnnn!!@|@y@k @v12/91400005.mnnnnnnnnnnnnnn!!"@|@y'
14556: '@rRosa spat out the tongue salad that kept being pushed into her mouth, covering it with saliva.'
14557: '@rBut the goat-head servants carefully returned it to the plate and carried it to Rosa''s mouth over and over again.'
14558: 'BEATRICE@r@v27/90700208."It goes without saying, but I made this salad generously using five of Eva''s tongues.@k@v27/90700209. You can''t steal more than one tongue out of one person.@k@v27/90700210. But I can steal it over and over.@k@v27/90700211. *cackle*cackle*!!"'
14559: 'Rosa@r@v12/91400006.".........nnnnnnnnnnnnnnn!!@|@y@k @v12/91400007.nnnnnnnnnnnnnnnnnnnnn!!"@|@y'
14560: '@rAs Rosa''s tears dripped down, she resisted, half-crazed.@k@rHowever, the only way she could resist was by refusing to swallow.'
14561: '@rEven if she didn''t swallow it,@k the taste of the french dressing increasingly violated Rosa''s mouth...'
14562: 'BEATRICE@r@v27/90700212."Is it not to your satisfaction...?@k @v27/90700213.There''s still much more food.@k@v27/90700214. Sea bass pie wrapped in the skin of Rudolf''s face.@k@v27/90700215. Soup with boiled brains, liver pate.@k@|@y@v27/90700216. And look forward to dessert, *cackle*cackle*!!"'
14563: 'BEATRICE@r@v27/90700217."It''s not just your siblings, see?@k @v27/90700218.I have lavishly arranged all of those who you have trusted and yet betrayed you.@k@v27/90700219. Why don''t we continue this banquet for all eternity, until your heart is satisfied.@k@|@y@v27/90700220. For all eternity."'
14564: 'BEATRICE@r@v27/90700221."......You''re happy, riiiight, Ushiromiya Rosaaaa?@k @v27/90700222.Don''t pretend that you hate it I know that you''re really happy alriiight?@k @v27/90700223.If you want to laugh, then laugh,@k@v27/90700224. if you won''t feel better until you''ve heard a live performance of your annoying elder siblings'' screams, then I''ll let you hear them as often as you want."'
14565: 'BEATRICE@r@v27/90700225."It''s alright that you are so unwilling.@k@v27/90700226. That''s your personality, isn''t it?@k @v27/90700227.You''re actually so happy that your skin is crawling all over.@k@|@y@v27/90700228. And yet, on the outside, you''re just pretending to act like you''re in pain, aren''t youuu?"'
14566: 'BEATRICE@r@v27/90700229."It''s alright, there is no need to worry about honor or your public image or anything here,@k@v27/90700230. so laugh as much as you want and chew it to bits.@k@v27/90700231. Isn''t this the bessst banquet, Ushiromiya Rosaaaaaaaaaaaaaaaaaaaaaaaaaaa???"@|@y'
14567: 'Rosa@r@v12/91400008.".........st-@v12/91400009. .........please,@v12/91400010. ......stop......@v12/91400011....*cough*, *hack*!!@k @v12/91400012.uweghhh..."'
14568: 'BEATRICE@r@v27/90700232."Oh, I''m sorry, I was keeping the dessert a secret to surprise you, but let me reveal it anyways.@k@v27/90700233. If I reveal it, maybe that will be enough incentive for you to eat up the full course."'
14569: 'BEATRICE@r@v27/90700234."The dessert is that beloved daughter that you had to keep pretending to love,@k@v27/90700235. oven-baked Maria and apples.@k@v27/90700236. Doesn''t that sound yummyyyy?"'
14570: 'BEATRICE@r@v27/90700237."If you eat this, you will be released from everything.@k@v27/90700238. Freedom, you see, freedom!@k @v27/90700239.Finally Rosa will gain freedom as an individual person, aren''t you happyyyyyyyyyyyyyyyyy?@k @v27/90700240.Of course you are, drool is hanging from your mouth, just try looking in a mirroooooooooooooooooor, hyahahaaahaahaahaha!!"@|@y'
14571: '@rSuddenly, a muscular goat-head cook was holding Maria under his arm.'
14572: '@rAnd Maria gazed at Rosa with a face that was just slightly sad.'
14573: 'Maria@r@v13/90400076."............Mama...@k@v13/90400077. ......Was I......a burden......?"'
14574: 'Rosa@r@v12/91400013."...nnnnnnn!@|@y@k @v12/91400014.You aren''t a burden!!@k @v12/91400015.nnnnnnnnnnnnnnnnnn!!"@|@y'
14575: '@rAs Rosa spat out the food that was continually being carried to her mouth,@k as she was covered with mess and saliva and blood, she resisted filthily and screamed.'
14576: 'Maria@r@v13/90400078."......If you...@v13/90400079.think I''m a burden, Mama,@k@v13/90400080. ......I''m fine being eaten."'
14577: 'Maria@r@v13/90400081.".........After all, I always do horrible things to you, Mama.@k@v13/90400082. Even when you brought a man over, I couldn''t stay quiet.@k@v13/90400083. When you stayed over with a man, I got lonely and unruly and made a mess of the room."'
14578: 'Maria@r@v13/90400084."When I went to search by myself, I got lost, the police had to pick me up and I brought shame on you, Mama.@k@v13/90400085. When you didn''t come home for days, I cried and had to be cheered up by the neighbors, and brought shame on you again, Mama."'
14579: 'Maria@r@v13/90400086."Because I''m like this, I cause trouble for you, Mama.@k@v13/90400087. I''m sorry for being born.@k@v13/90400088. So I''ll become delicious oven-baked apples for you, Mama."'
14580: 'Maria@r@v13/90400089."And then, maybe I can make you happy I exist for the first time.@k@v13/90400090. Maybe, if you eat me and you think I''m delicious."'
14581: 'BEATRICE@r@v27/90700243."She will be, riiiiiiiiiiiiiiiight?@k @v27/90700244. Be choked up with tears of gratitude your daughter is saying this much for you seeeeeee?@k @v27/90700245.Oven-baked apples and your beloved daughter make for the best dessert!@k @v27/90700246.You''ve managed to raise such delicious ingredients,@v27/90700247. aren''t you the best mother, Ushiromiya Rosaaaaaaaaaaaaaaaaaa???"@|@y'
14582: 'Maria@r@v13/90400091.".........Mama, thanks for everything.@k@v13/90400092. Bye bye."'
14583: 'Rosa@r@v12/91400016."Wait!!@|@y@k @v12/91400017.Wait, Maria, that''s wrong!!@k @v12/91400018.Stop it already, stop it already,@v12/91400019. nooooooooooooooooooooooo!!@|@y@k @v12/91400020.I didn''t want something like this!"'
14584: 'Rosa@r@v12/91400021."Please stop, please let me go!!@k @v12/91400022.No,@|@y@v12/91400023. stop it already,@|@y@v12/91400024. don''t put it...in my mouth...@|@y@v12/91400025. uuuuulg,@|@y@v12/91400026. gweeeeeeeeeeeeehh!!"@|@y'
14585: 'BEATRICE@r@v27/90700248."Have you found my hospitality to your satisfaction...?@k @v27/90700249.Then I''ll have you accept it.@k@v27/90700250. That I am a witch.@k@|@y@v27/90700251. Proclaim it.@k@v27/90700252. Proclaim that "Ushiromiya Rosa accepts that BEATRICE is a witch"!!"'
14586: 'Rosa@r@v12/91400027."......I accept it!!@|@y@k @v12/91400028.U-Ushiromiya Rosa...@v12/91400029....accepts that B-BEATRICE...@v12/91400030....is a witch!!@k @v12/91400031.So give Maria back!!@k @v12/91400032.Release meeeeeeeeeeeeee!!"'
