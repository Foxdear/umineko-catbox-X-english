13819: '@rAfter Genji finished taking his late meal, he went out to do the nighttime rounds inside the mansion.'
13820: '@rHe reheated the soup that Gohda had started making, and ate some random leftovers from the refrigerator.'
13821: '@rThey were all things Gohda had made himself, and were, of course, delicious.'
13822: '@rHe had half-heartedly gone to ask Rosa and the others what they would do for dinner, but he had been yelled at by a voice telling him that they had canned food so they were fine, and the door wasn''t even opened for him.'
13823: '@r......So, ironically, it was the servant Genji who was able to eat the more delicious meal...'
13824: '@rBut even though all of those crimes had been committed, and many people had already met a brutal end,@k ......why was it that Genji wasn''t afraid to do the rounds all by himself?'
13825: '@r...Judging by his appearance as he carried out his normal tasks without a trace of fear, as though everything was normal,@k you might think that all of the horrible events that had happened today were just a dream or an illusion.'
13826: '@rWas he taking a philosophic view, or was it simply resignation?'
13827: '@rGenji must have considered it a virtue to systematically carry out his duty until the last moment,@k since the fate that awaited him was unavoidable.'
13828: '@rIt would probably be eternally impossible to perceive the depths of his heart, unless he told of it himself......'
13829: '@rBecause he had given the master key back to Rosa, the places he could go to were extremely limited.'
13830: '@rAll he could do was walk around the hallways, checking to make sure that the windows were closed.@k@rSo he was able to go around that route far more quickly than usual.'
13831: 'Genji@r@v14/21600196.".......................................@k@|@y@v14/21600197. ......mgh."'
13832: '@rAfter the sound of a moderate knock,@k Auntie Rosa, who had been falling into a doze shortly before, jumped and woke up, pointing the barrel of the gun at the door as she yelled.'
13833: 'Rosa@r@v12/21400788."Who is it?!"'
13834: '@rI was napping on a sofa, and that voice also brought me back to reality.'
13835: 'Genji@r@v14/21600198."......Rosa-sama.@k@v14/21600199. It is Genji."'
13836: 'Rosa@r@v12/21400789."Do you have some business?@k @v12/21400790.We''ll be fine without opening the door.@k@v12/21400791. Tell us from there."'
13837: 'Genji@r@v14/21600200.".........Yes.@k@v14/21600201. Well then, forgive me for speaking in this fashion.@k@|@y@v14/21600202. ...I have found the bodies of Doctor Nanjo and Kumasawa."'
13838: 'Battler@r@v10/20101063."Wh-...what did you say...?!!"'
13839: 'Rosa@r@v12/21400792."............I see.@k@v12/21400793. Alright, let''s go and check them.@k@v12/21400794. ...Until I see the corpses, I won''t believe anybody."'
13840: 'Battler@r@v10/20101064."....................."'
13841: 'Maria@r@v13/20400485."......Uu.@k@v13/20400486. It''s alright, Battler.@k@v13/20400487. If you''re with me, it''ll definitely be alright."'
13842: '@rMaybe my face was shadowed with anxiety.@k@r...Maria grasped my hand with her small hand, and spoke softly, trying to give me courage.'
13843: '@rSince it was Auntie Rosa''s job to ready the gun and stand guard, it fell to me to remove the barricade of sofas.'
13844: '@rWhen I finished, I took a backward glance at Auntie Rosa, who was pointing the barrel of the gun over my shoulder, and opened the door.'
13845: 'Battler@r@v10/20101065."Genji-san, where are their corpses...?"'
13846: 'Genji@r@v14/21600203.".........In the courtyard.@k@v14/21600204. I shall guide you."'
13847: 'Rosa@r@v12/21400795."Battler-kun, wait!@k @v12/21400796.Just in case, I''m going to check the doors and windows of this room before we go.@k@v12/21400797. Wait a second."'
13848: '@rAuntie Rosa called me to a halt to prevent me from going on ahead, and began to carefully check the locks on each of the windows.'
13849: '@r......But those locks had already been checked once.'
13850: '@r......It felt kind of unpleasant, as though she suspected that I might have secretly unlocked them when she wasn''t looking.'
13851: '@r...No, maybe she was right to be this cautious...'
13852: '@rEven though it was called a courtyard, it wasn''t really a pretty place you could take a walk in like the rose garden.'
13853: '@rOn the contrary, since it was surrounded by the mansion on all sides,@k it made you feel a little discomfort, as though it was telling you that you couldn''t escape from the mansion even if you tried to escape to the outside.'
13854: '@rOn the other hand, thanks to that, even though the violent winds could be heard, the wind itself was blocked.'
13855: '@rGenji-san held out an umbrella, but Auntie Rosa ignored him.'
13856: '@r...She probably wanted to say that the gun took two hands, so taking the umbrella would be dangerous because she wouldn''t be able to fire the gun.'
13857: '@rEven without Genji-san pointing his finger, we could tell immediately.'
13858: '@rRight in the center of the courtyard, ......we could see where Doctor Nanjo and Kumasawa-san lay...'
13859: '@rAuntie Rosa entered the courtyard without even an umbrella.@k@r...So Genji-san and I also entered the courtyard without opening one.@k@rOnly Maria had one open like normal.'
13860: 'Battler@r@v10/20101066."..................Maria...@k@v10/20101067. ......Is this......you know?"'
13861: 'Maria@r@v13/20400488."......Uu.@k@|@y@v13/20400489. ......It''s the seventh twilight and the eighth twilight."'
13862: 'Rosa@r@v12/21400798."I, ......I see.@k@v12/21400799. Certainly, just as Genji-san and the others said, there are horrible wounds on their necks.@k@v12/21400800. ......Very sharp.@k@v12/21400801. Almost as though they''ve been sliced with a katana or something..."'
13863: '@rThat gaping wound on their necks definitely made me want to avert my eyes,@k but after seeing the Halloween party in the chapel, even though I thought it was horrible, it was no longer enough to make me feel sick.'
13864: '@rInstead, our gazes were directed to their legs.@k@rIn Doctor Nanjo''s knee.@k In Kumasawa-san''s ankle.'
13865: '@r......Driven into each of them was something like a knife or a stake with a demonic decoration.'
13866: '@r...They would surely be the same as the one that had pierced Jessica''s back.'
13867: 'Rosa@r@v12/21400802."......What is this?@k @v12/21400803....It''s the same as Jessica-chan.@k@v12/21400804. Is this supposed to be some kind of occult ritual, I wonder?"'
13868: 'Genji@r@v14/21600205.".........I do not know.@k@v14/21600206. The last time I saw their bodies, there was nothing like this.@k@v14/21600207. Maybe it was done after they were carried out of the servant room."'
13869: '@rThe one that had been stuck into Doctor Nanjo''s knee was still standing erect,@k but the one that had been thrust into Kumasawa-san''s ankle might have been a little shallower.@k It had come out and fallen over.'
13870: '@rSo, it was only when I saw that one that had fallen over, that for the first time, I realized that it wasn''t a knife,@k but something like a stake.'
13871: '@rIts full length was probably about thirty centimeters.@k@rIt was probably made out of bronze or iron or something of the sort.'
13872: '@rEven without touching it, I could tell that it had some weight to it.@k@rIt was composed of a grip and a cone-shaped part, and it was obviously made to be a piercing weapon.'
13873: '@rMaybe you could describe it like a miniature version of those lances Western knights used on horseback.'
13874: '@rThe grooves that had been carved in a spiral shape made it also look like a drill.'
13875: '@r......However, the grip had an occult-like design of a demon or something,@k so instead of a weapon used in war,@k it felt like something that would be used in a ritual to offer up a sacrifice.'
13876: 'Battler@r@v10/20101068."......There''s no mistake.@k@v10/20101069. ...They''re meant to be...sacrifices."'
13877: 'Maria@r@v13/20400490.".........On the seventh twilight, gouge the knee and kill.@k@v13/20400491. On the eighth twilight, gouge the leg and kill."'
13878: 'Battler@r@v10/20101070."Wait.@k@v10/20101071. Then, they''ve left out the fourth, fifth, and sixth twilights.@k@v10/20101072. ......D-......don''t tell me..."'
13879: '@rThat''s right.@k@rWhy is Genji-san alone?!'
13880: '@rIf something like this had happened, why wouldn''t George-aniki, Gohda-san, or Shannon-chan be here?!@k Why was Genji-san alone?!'
13881: 'Rosa@r@v12/21400805."What is this?@k @v12/21400806.Where did George-kun and the other two go?!"'
13882: 'Genji@r@v14/21600208.".........They told me that they wanted to go to Madam Natsuhi''s room to search for something, and left.@k@v14/21600209. They have not returned yet."'
13883: 'Battler@r@v10/20101073."What did you say...?@k@v10/20101074. Umm, you say they left, when was that?!"'
13884: 'Genji@r@v14/21600210."Two or three hours ago, I believe."'
13885: 'Battler@r@v10/20101075."N-no way...!!@k @v10/20101076.Why didn''t you say something that important - wait, no - why didn''t you think that was suspicious?!"'
13886: 'Genji@r@v14/21600211."......There must always be one servant awaiting orders.@k@v14/21600212. It was my duty to wait for orders until they returned."'
13887: '@rWas Genji-san really this much of a robot?!'
13888: '@rThis is bad, this is bad, it''s really bad...!!'
13889: '@rThe fact that Doctor Nanjo and Kumasawa-san had been killed in this way meant that three people had already been killed...!!'
13890: '@rWe ran towards Aunt Natsuhi''s room.@k@r.........With a touch of anxiety, and just as much resignation.'
13891: '@rBefore we even saw the inside of Aunt Natsuhi''s room,@w583. ...we were imprisoned by a certain resignation.'
13892: '@rOn that door was bizarre...@w250.graffiti - @w500.no, filth...?'
13893: '@rIn any case, the door wasn''t in a normal state, and we were able to imagine what was inside that room without opening it.'
13894: '@rOn the face of the door...... How should I say it?'
13895: '@r......Someone had heavily painted their hands with the same red paint that the magic circles from before had been drawn with,@k ...and had banged on the door, scratched it, dirtied it.'
13896: '@r......It was dirtied like the aftermath of a kindergartner playing in the mud.'
13897: '@rI didn''t know what it could mean.@k@r...The bright-red paint that had been slathered on was dripping down, and even though no one said it, it made us think of blood.'
13898: 'Rosa@r@v12/21400807."...G-...Genji-san, please open it."'
13899: '@rAuntie Rosa held her gun up high and ordered Genji-san to open it.'
13900: '@rGenji-san approached the door without being particularly troubled by that stuff on it, and turned the knob,@k but he immediately turned around, shaking his head.'
13901: '@rIt was locked.'
13902: '@rRight now, there was only one person in this mansion who could lock and unlock doors at will: Auntie Rosa.'
13903: '@rThis time, Genji-san asked Auntie Rosa to unlock the door, instead of the other way around.'
13904: '@rAfter making a slightly disgruntled face, Auntie Rosa handed me a master key, and told me to open the door.'
13905: 'Rosa@r@v12/21400808."......Battler-kun, would you open it for me with this?"'
13906: 'Battler@r@v10/20101077."Just trusting Genji-san with something like that wouldn''t..."'
13907: '@rAuntie Rosa glared at me with an intense gaze.@k@r......Getting into a fight here would only make the environment turn even more sour.'
13908: '@rWithout talking back any more, I approached that creepy door, and tried the knob.@k ......It didn''t open.'
13909: '@rIt was definitely the resistance of the lock.@k@rI stuck the master key into the keyhole.'
13910: '@rClunk.@k A light resistance.'
13911: '@rWhile listening to Auntie Rosa as she told me to be cautious, I opened the door without being particularly cautious at all.'
13912: '@rAnd there.........was the scene, laid out before us, not betraying our expectations in the slightest.'
13913: 'Rosa@r@v12/21400809."...........................!@k @v12/21400810.How...horrible......"'
13914: 'Maria@r@v13/20400492."....................."'
13915: 'Battler@r@v10/20101078."As I thought, ......it was a reproduction of the fourth, fifth, and sixth twilights."'
13916: 'Maria@r@v13/20400493.".........Uu."'
13917: '@rThe inside of the room looked as though a robber had just broken in.'
13918: '@rDrawers were flung open, pulled out, with their contents thrown all over the floor,@k the room devastated so that it looked nothing like the room of the methodical Aunt Natsuhi.'
13919: '@rBut the thing that caught the eye before that...@k......was Gohda-san''s body lying facedown right in front of the door...'
13920: '@rOne of those demon stakes had been rammed right into the center of his chest, almost as though it had been stuck there to finish off a vampire.'
13921: '@r......Exactly how far would it have reached after being stuck that deeply into his chest?'
13922: '@r...My own chest hurt just imagining it.'
13923: 'Battler@r@v10/20101079."...Gouge the chest was the fifth twilight?"'
13924: 'Maria@r@v13/20400494."............Uu."'
13925: '@rMaria grabbed my hand.'
13926: '@r......Her expression looked just like normal,@k ...but maybe she really was afraid of the aura in this room where three bodies lay.'
13927: '@rAnd, along the wall farthest into the room, George-aniki was dead.'
13928: '@r......This time, one of those stakes had been rammed right in the center of his stomach.@k@r...Gouging the stomach was the sixth twilight, I think.'
13929: '@rShannon-chan''s body was face down over the front of the dresser, lying in a sea of blood.'
13930: '@rIn its horribly broken mirror, sprayed with blood, had she seen her final worldly expression?'
13931: '@r...Because she was face down, I couldn''t see her face, but I could imagine even without seeing it.'
13932: '@rNearby, in the sea of blood she lay in, a demon''s stake had fallen...'
13933: '@r......Only the fourth twilight was left.@k@rGouge the head and kill...'
13934: '@rMaybe my heart was completely tired out and dead...'
13935: '@rEven though I knew what I was doing was wrong, ...I lifted her head, and checked.'
13936: '@r......And confirmed that my guess was right on the mark.'
13937: '@rThere was a gaping hole in Shannon-chan''s forehead, and her insides were dripping out.'
13938: '@rNot only that, ...you could even see...inside her.'
13939: '@rAfter seeing that, I finally noticed that what I was doing was wrong.'
13940: '@rI immediately averted my eyes, but by now, it was probably pointless.'
13941: 'Rosa@r@v12/21400811."Hey, Battler-kun!!@k @v12/21400812.We have to leave everything alone until the police come!!@k @v12/21400813.What do you think you''re doing, touching it?!@k @v12/21400814.What will you do if our precious evidence from the crime scene gets disturbed?!!"'
13942: '@rAuntie Rosa yelled furiously at me, and even yanked the back of my collar.'
13943: '@rI tottered limply and fell on my butt, ......and gazed dimly up at the ceiling...'
13944: 'Battler@r@v10/20101080."......Maria."'
13945: 'Maria@r@v13/20400495."Uu......?"'
13946: 'Battler@r@v10/20101081."......Now even the eighth twilight is over.@k@v10/20101082. ......What was the ninth twilight again?"'
13947: 'Maria@r@v13/20400496."...........................@k@v13/20400497. ...On the ninth twilight, the witch revives, and none shall be left alive."'
13948: 'Battler@r@v10/20101083."I see.@k@v10/20101084. ......So now, the Golden Witch BEATRICE will be revived.@k@v10/20101085. ......What then?@k@v10/20101086. ...On the final tenth twilight?"'
13949: 'Maria@r@v13/20400498."...On the tenth twilight, the journey ends, and you shall reach the Home of the Gold.@k@v13/20400499. .........Very soon, the door to the Golden Land will be opened.@k@v13/20400500. ...Very soon."'
13950: 'Battler@r@v10/20101087.".........The witch revives, and none shall be left alive, you say.@k@v10/20101088. .........We''re going to die?@k @v10/20101089.Or is the sacrificial ritual over now, ...and our journey will end, and we can make it to the Golden Land...?"'
13951: 'Maria@r@v13/20400501."................................."'
13952: 'Battler@r@v10/20101090."......Our journey, yeah right.@k@v10/20101091. ......We''ve spent the whole day trying to find the culprit, racking our brains as we tried to break out of this situation,@v10/20101092. ...and we haven''t gotten anywhere.@k@v10/20101093. It''s like they say - thinking stupid is no better than sleeping."'
13953: 'Battler@r@v10/20101094."That''s right, we''ve spent the whole day burning ourselves up with hatred and paranoia.@k@v10/20101095. ......We said we could only trust dead people,@v10/20101096. ...and we came all the way here just to check out their dead faces...@k@v10/20101097. ...If we''re like this,@v10/20101098. ......how...@v10/20101099.......can you say we can make it to the Golden Land......"'
13954: '@rThat''s right... ......If nothing could be solved, it would have been much better if we had locked ourselves up the whole time without thinking at all.'
13955: '@rGrandfather was the wisest of us.@k@rHe''s been shut up in his room since yesterday, without any contact with anyone.'
13956: '@r......That would have been fine.@k@rGrandfather was the most correct...'
13957: 'Maria@r@v13/20400502."......It''ll be alright, Battler.@k@v13/20400503. ......If you''re with me, it''ll be alright.@k@v13/20400504. .........Witches are very fickle, and they''re terrifying beings who maybe kill humans for fun sometimes."'
13958: 'Maria@r@v13/20400505."...But, if you''re together with me, it''ll definitely be alright.@k@v13/20400506. So, don''t be afraid."'
13959: 'Battler@r@v10/20101100.".........Thank you.@k@v10/20101101. ......Even if that''s just to comfort me, ...it makes me happy."'
13960: '@rAfter Auntie Rosa finished investigating their deaths, she proclaimed that she would seal this room again,@k chased the rest of us out, stole back the master key she had lent me, and locked the door again.'
13961: '@rIt seemed that George-aniki had been holding the original key to Aunt Natsuhi''s room.@k She had also collected that.'
13962: '@r............Wait a second.@k@rShe had all of the master keys in her hand.'
13963: '@rAnd if the original key had been shut up inside that room,@w500. ......wasn''t this another locked room?'
13964: '@rSo this is a fourth locked room......?'
13965: '@rNow that we had been released from our suspicion of those three, ......we once again returned to the parlor.'
13966: '@rI don''t have a clue what''s going on anymore.'
13967: '@r......If only the dead are safe, and everyone alive is a wolf,@k ......then all that''s left is me, Auntie Rosa, Maria, and Genji-san.'
13968: '@r......Only those, Grandfather, and that 19th person - the guest who I hadn''t even sensed -  BEATRICE.'
13969: '@rThirteen people had died, and six were left.@k ......With only six people, how would the wolves and sheep puzzle end...?'
13970: '@rEven though the puzzle which had had nineteen people in it had been reduced to a mere six,@w500. ......I couldn''t find any answer...'
13971: '@rWe returned to the parlor.'
13972: '@r......I felt a little anxious that, while we were gone,@k a creepy magic circle or something might have been drawn on the door to the parlor,@w500. but thankfully, there was none...'
13973: 'Rosa@r@v12/21400815."Thank you, Genji-san.@k@v12/21400816. This is far enough.@k@v12/21400817. Please rest for the day."'
13974: 'Genji@r@v14/21600213."......Certainly.@k@v14/21600214. ...Then, if you will allow me to rest."'
13975: 'Battler@r@v10/20101102."H-...hey, Auntie Rosa...@k@v10/20101103. ......Are you saying that you''ll leave Genji-san all alone in a situation like this...?"'
13976: 'Rosa@r@v12/21400818."......You are right.@k@v12/21400819. I do think it''s very dangerous."'
13977: 'Rosa@r@v12/21400820."......But, in that case, why is he safe?@k @v12/21400821.After those three headed to Natsuhi nee-san''s room, he was alone the whole time.@k@v12/21400822. And yet he''s safe."'
13978: 'Rosa@r@v12/21400823."......It''s the wolves and sheep puzzle.@k@v12/21400824. Why would an isolated sheep - a sheep in its weakest position - be safe?"'
13979: 'Battler@r@v10/20101104."...P-......probably because, by coincidence, there weren''t any wolves..."'
13980: 'Rosa@r@v12/21400825."Wrong.@k@v12/21400826. Because it wasn''t a sheep."'
13981: 'Battler@r@v10/20101105."Are you saying Genji-san''s...a wolf...?"'
13982: 'Rosa@r@v12/21400827."He said that he was alone in the kitchen, but that''s impossible to prove.@k@v12/21400828. The only ones who could have carried Doctor Nanjo and Kumasawa-san''s corpses, and who could have killed George and the rest, were him and BEATRICE, right?"'
13983: 'Battler@r@v10/20101106."W-wait, with that argument, anyone - "'
13984: 'Genji@r@v14/21600215."......Battler-sama.@k@v14/21600216. Thank you for your concern."'
13985: 'Genji@r@v14/21600217."...I believe that trust will be won not with a hundred excuses, but with a single unending faithfulness.@k@v14/21600218. ......Even if I am not able to gain your trust, I wish to be faithful until the end."'
13986: 'Battler@r@v10/20101107.".....................Genji-san..."'
13987: 'Rosa@r@v12/21400829."......Then it''s settled.@k@v12/21400830. ......If you are truly innocent, the police will prove that for us when they come tomorrow.@k@v12/21400831. So, until then, we cannot remove you from suspicion."'
13988: 'Rosa@r@v12/21400832.".........After your long years of service to the Ushiromiya family, I find it truly painful to treat you so poorly.@k@v12/21400833. ...But please understand for tonight.@k@v12/21400834. ...Then, when tomorrow comes, please let me make up with you again."'
13989: '@rGenji-san gave his head a small shake.'
13990: 'Genji@r@v14/21600219."......Whether today or tomorrow,@k@v14/21600220. I will continue to be a servant of the Ushiromiya family.@k@v14/21600221. ......If you have any business, please say so at any time.@k@v14/21600222. ......Then, if you will excuse me."'
13991: '@rAfter hearing all that, there was nothing left to say.@k@rGenji-san bowed deeply, and left down the hall...'
13992: '@rAnd we entered the room.'
13993: '@r...Even though Auntie Rosa still held all of the master keys herself, she began another thorough check of the inside of the parlor.'
13994: '@rShe opened the curtains, and checked again to make sure the windows were locked.@k@rAs I watched, ......how should I say it, I felt like it didn''t really matter anymore.'
13995: '@rIf I said anything unnecessary, it would turn into another fight.@k@rFor a while, I gazed at her from the corridor, figured I had waited just about long enough, and entered the parlor behind her.'
13996: '@r......If she can''t trust anyone but the dead, she should just go around killing everyone with the gun she''s got in her hand.'
13997: '@rAnd then in the end, she''ll realize that she herself was the wolf.@k@r...And then she can blast through the head of the final wolf, and the curtain will close on this insane murder theater...'
13998: '@rAs I thought that bitterly, I returned to the sofa where I had been encamped before,@k and rudely rested both of my feet on the table...'
13999: '@r......Or was about to, when I found something there and stopped my feet.'
14000: 'Battler@r@v10/20101108."........................@k@v10/20101109. .........What is...this...?"'
14001: '@rRight there, almost as though it was addressed to me, ...was a Western envelope.'
14002: '@rIt was that envelope from before, with the seal of the One-winged Eagle.@k@r...And it was unopened.'
14003: '@rW-@w583..........wait wait wait wait...'
14004: '@r...What is...this............?'
14005: '@rWhen, who, put it in a place like this......?'
14006: '@rI had been sitting here the whole time, until I went with everyone to check the corpses.'
14007: '@rAnd there hadn''t been anything.'
14008: '@r...And when I returned,@w333. it was...@w500.here.'
14009: 'Rosa@r@v12/21400835."......It''s alright.@k@v12/21400836. There was no problem with the locks on the windows.@k@v12/21400837. This room is safe."'
14010: '@rI heard Rosa muttering that...'
14011: '@r......Wait wait wait wait.@k@r...Wait wait wait wait wait wait wait wait.'
14012: '@rWe had made sure this room was safe when we exited it.@k@rWe had checked that the windows were all perfectly locked.@k@r...And we had locked it, come back, and the windows were still locked.'
14013: '@r......Then, wait, who had put this letter here and how......'
14014: '@rI opened the letter.@k@rTwo pieces of stationery came out.'
14015: '@rThe first page......had a magic circle drawn on it, in something like blood.'
14016: '@rIf I asked Maria, she''d probably know what it meant.'
14017: '@rAnd there was writing on the other page.'
14018: '@r@v27/20701486_1.@z70. -  Are you making progress solving the riddle of the epitaph?@k@r@v27/20701486_2.Very, very soon, you''ll run flat out of time.@k@r@v27/20701486_3.The ninth twilight will start very soon.'
14019: '@r......There was no mistake.@k@r...It was a letter...from BEATRICE...'
14020: 'Maria@r@v13/20400507."...Uu?@k @v13/20400508.......Battler,@v13/20400509. ......what is that?"'
14021: 'Battler@r@v10/20101110."Ah, ......right.@k@v10/20101111. When I came here just now,@v10/20101112. ...i-it was just placed here."'
