10717: '@r...Hideyoshi''s claim that advertising doubled the taste was apparently right.'
10718: '@rThe kids and Nanjo, who had been chased out to the guesthouse, had gathered in the cousins'' room,@k and were eating the cake that Kumasawa had brought there for dessert.'
10719: '@rIt was both wonderful and high-class, with lavish amounts of cream and decorated deliciously with fruits,@k but even though it was delicious, for some reason it didn''t taste quite as good...'
10720: 'Jessica@r@v04/20200441."Haha, without Gohda-san''s advertising, it doesn''t taste nearly as good."'
10721: 'Battler@r@v10/20100141."And good frickin'' luck asking Kumasawa baa-chan for advertising, she''ll just say it''s made out of mackerel."'
10722: 'Maria@r@v13/20400253."Uu?!@k @v13/20400254.Really?!@k @v13/20400255.You can make cake from mackerel?!"'
10723: 'Kumasawa@r@v18/21800038."Hoh-hoh-hoh-ho.@k@v18/21800039. Oh, goodness, yes, this cake too, if you mix the squeezed juice of a mackerel in with the flour and eggs and bake it up, it comes out all fluffy.@k@v18/21800040. Hoh-hoh-hoh-ho."'
10724: 'George@r@v07/20300294."That would be incredible if true.@k@v07/20300295. Maybe mackerel cake will show up on the new menu at Father''s stores."'
10725: 'Battler@r@v10/20100142."Wahahaha!@k @v10/20100143.Because mackerel is full of nutrients and has a healthy image.@k@v10/20100144. It could be really popular with women and old people!@k @v10/20100145.But I''m not gonna get anywhere near it!"'
10726: 'Jessica@r@v04/20200442."Girls won''t eat something that weird."'
10727: 'Nanjo@r@v19/21900061."Even old people would wish to decline."'
10728: 'Kumasawa@r@v18/21800041."Hoh-hoh-hoh-ho!@k @v18/21800042.But it''s delicious!"'
10729: '@rKumasawa was really raising the mood with the mackerel jokes that were her specialty.@k ...But the sound of the downpouring rain invariably focused their concern on the mystery guest.'
10730: '@rIn the end, they ended up showering Maria with questions again, since she was the only person here to have met BEATRICE.'
10731: 'George@r@v07/20300296.".........I never believed...that story was true."'
10732: 'Battler@r@v10/20100146."From the way you say that, it sounds like this wasn''t the first time you heard that Maria was meeting a witch, even if you didn''t believe it."'
10733: 'Jessica@r@v04/20200443."...Yeah.@k@v04/20200444. I thought it was a pretty typical fairy tale for people of that imaginative age."'
10734: 'Maria@r@v13/20400256."Exiiists!!@k @v13/20400257.BEATRICE "exiiists"!@k @v13/20400258.Every year when we come to the family conference, I see her and we play together!"'
10735: 'Kumasawa@r@v18/21800043."That''s right.@k@v18/21800044. Although BEATRICE-sama doesn''t usually show herself,@k@v18/21800045. I hear that she sometimes unexpectedly appears before honest people with clean hearts, to play pranks.@k@v18/21800046. Hoh-hoh-ho."'
10736: '@rBEATRICE was a name which referred to the being in that fairy tale about the Rokkenjima witch.'
10737: '@rBecause the family and the servants publicly accepted the image of the witch of Kinzo''s delusions to keep him in a good mood,@k it became established as Rokkenjima''s fairy tale, or maybe ghost story...'
10738: '@rTo the family members who knew that history, the fairy tale of the Golden Witch didn''t have much substance.@k ...However, they hadn''t been able to say that in front of Kinzo.'
10739: '@rSo to those who didn''t know the history,@k ...like young Maria, for example, it definitely wasn''t unsubstantial, ...but a real legend of a witch.'
10740: '@rSo Maria believed in the legend of the witch.@k She swallowed it whole.'
10741: '@r...That was natural for an imaginative girl who believed in witches.'
10742: '@rSo no one said anything to betray her dream.@k@r...On the contrary, they arranged things together to get her excited about her dreams.'
10743: 'George@r@v07/20300297."...So even on those times when Maria-chan showed off candy and said that BEATRICE had given it to her,@k@v07/20300298. ...I thought that somebody had probably slipped a candy into Maria-chan''s handbag or something to create that impression."'
10744: 'Nanjo@r@v19/21900062."............I have also put on such performances on a few occasions in the past,@k@v19/21900063. secretly placing sweets somewhere for her.@k@|@y@v19/21900063_1. ...Probably, Kumasawa-san too - no - I expect all of the servants and all of the Ushiromiya family have done it once or twice."'
10745: 'Battler@r@v10/20100147."......So, if it will make a small, innocent kid happy, you sometimes plan it together and place some sweets somewhere.@k@|@y@v10/20100148. ......In that case, I''ll bet you do that kind of thing all the time, right, George-aniki?"'
10746: 'George@r@v07/20300299."............Who knows."'
10747: '@rAdmitting that would probably be unrefined.'
10748: '@rGeorge admitted it while being extremely wary that Maria didn''t find out.'
10749: 'Battler@r@v10/20100149."In other words, ......it''s kinda like Santa Claus.@k@v10/20100150. To protect a kid''s dreams, the parents plot together and lie, setting presents at the bedside of a child fast asleep."'
10750: 'Jessica@r@v04/20200445."......I mean, you do want to protect kids'' dreams.@k@v04/20200446. ...As for me, I obviously found out that Santa didn''t exist a long time ago.@k@v04/20200447. ......But if it was okay not to wake from that dream, I''d have liked to have believed it my whole life."'
10751: 'Nanjo@r@v19/21900064."...Because they know that the world is tough,@k@v19/21900065. ...adults want to at least protect a child''s untainted dreams."'
10752: 'Maria@r@v13/20400259."Uu!!@k @v13/20400260.BEATRICE exists!@k @v13/20400261."Exiiiists"!!!"'
10753: 'Kumasawa@r@v18/21800047."Oh, goodness, certainly.@k@v18/21800048. BEATRICE-sama does exist, you know?@k @|@y@v18/21800049.Some time ago, when I was drying mackerel to make some black tea, all of a sudden - "'
10754: 'George@r@v07/20300300."......Well, that''s basically how it went.@k@v07/20300301. ...Or at least, how we thought it went."'
10755: 'Battler@r@v10/20100151."To sum up,@k@v10/20100152. ......she''s a witch that supposedly no one believed in, except for Maria."'
10756: 'George@r@v07/20300302."Those words don''t quite explain it.@k@v07/20300303. ......It''s not that we didn''t believe.@k@v07/20300304. ...We were trying to let her believe."'
10757: '@rSo this was about not betraying a child''s innocence.'
10758: '@rBut Santa doesn''t exist in reality.@k If you don''t want them to be all disappointed when they learn that, you should just not give them that dream in the first place.'
10759: '@r...Did I think like that because I was still a long way from becoming a full adult?'
10760: '@rBattler had finally attained a level of understanding about the true form of the Rokkenjima witch.'
10761: '@r.........But the current situation lay on an even higher level of understanding than that,@k and overturned all its premises...'
10762: 'Battler@r@v10/20100153."......That''s all we believed the witch BEATRICE-sama to be, but then she actually appeared.@k@v10/20100154. Right."'
10763: 'Battler@r@v10/20100155."Furthermore, judging from our parents'' uproar, it looks like she wasn''t an invited guest.@k@v10/20100156. ......That sounds kinda interesting."'
10764: 'George@r@v07/20300305."There actually is no basis to say that a woman called BEATRICE doesn''t exist.@k@v07/20300306. ......It''s what Uncle Rudolf called a Devil''s Proof.@k@v07/20300307. ......None of us knew that a woman calling herself BEATRICE existed."'
10765: 'George@r@v07/20300308."...But that doesn''t mean we can deny the possibility that BEATRICE exists."'
10766: 'Jessica@r@v04/20200448."......Doctor Nanjo, you''ve been friends with Grandfather for a long time, right?"'
10767: 'Nanjo@r@v19/21900066.".....................@k@v19/21900067. ...There was a period when I was questioned quite a lot on this topic at the family conferences, by Krauss-san and the others.@k@v19/21900068. ......The topic of whether Kinzo-san may have had a mistress long ago, and even a hidden child with her."'
10768: 'Battler@r@v10/20100157."I see.@k@v10/20100158. Our parents'' heads are full with the distribution of the inheritance.@k@v10/20100159. So it''s blindingly obvious that if the daughter of a mistress showed up, it''d mean trouble for them."'
10769: 'Nanjo@r@v19/21900069."Krauss-san and the rest probably asked Genji-san about it first.@k@v19/21900070. However, Genji-san has sworn loyalty to Kinzo-san as his right-hand man, ...and is probably a more trusted friend to Kinzo-san than myself."'
10770: 'Nanjo@r@v19/21900071." ......I imagine Genji-san didn''t tell them anything.@k@v19/21900072. ......And so they turned to me as his next-oldest friend, I suppose..."'
10771: 'Battler@r@v10/20100160."And?@k@v10/20100161. ......When all is said and done, Doctor Nanjo,@k@v10/20100162. ......did Grandfather have a mistress called BEATRICE?"'
10772: 'Nanjo@r@v19/21900073."...............He did.@k@v19/21900074. ...No, I have never met her.@k@v19/21900075. ...However, I have heard from Kinzo-san that he did have a relationship with a woman like that.@k@v19/21900076. .........He said that she passed away a very long time ago."'
10773: 'Battler@r@v10/20100163."......She''s dead.@k@v10/20100164. ......And did he have a child with her?"'
10774: 'Nanjo@r@v19/21900077."That, I do not know.@k@v19/21900078. ......But Kinzo-san always says that he is researching how to revive BEATRICE."'
10775: 'Nanjo@r@v19/21900079."...Usually, if one loses a lover and has a child left from them, they would pour all of that love on that child.@k@v19/21900080. ......Therefore, we naturally thought that there probably wasn''t a child between Kinzo-san and BEATRICE..."'
10776: 'Battler@r@v10/20100165."............Hm?@k @v10/20100166.....That makes that a Devil''s Proof as well."'
10777: 'Jessica@r@v04/20200449."......It does.@k@v04/20200450. ......It''s impossible to prove that he "didn''t" have a child with his mistress.@k@v04/20200451. ......So now that she''s actually appeared, we have to assume that he "did"."'
10778: 'George@r@v07/20300309."That''s a bit of a rushed argument.@k@v07/20300310. ......It''s more realistic that someone caught wind of the trouble over the Ushiromiya inheritance issue,@k@v07/20300311. found out about Grandfather''s relationship with a mistress long ago,@k@v07/20300312. and impersonated her, trying to work their way into the inheritance issue."'
10779: 'Battler@r@v10/20100167."......It is more realistic.@k@v10/20100168. ...However, we can''t deny the possibility that she really is a hidden child,@k@v10/20100169. who lived in isolation, forgotten by Grandfather, and who''s returned for revenge, right...?"'
10780: 'Jessica@r@v04/20200452."Revennnge?!@k @v04/20200453.The hell did that come from?!"'
10781: 'Battler@r@v10/20100170."Aaah, sorry, sorry...@k@|@y@v10/20100171. I''m a guy, we just like to embellish things to make them more interesting.@k@v10/20100172. I''ve seen too many weird dramas.@k@v10/20100173. Ihihihi!"'
10782: '@rNormally, that would have been a light joke.'
10783: '@r......But it had come when a mystery guest calling herself BEATRICE, who no one had invited,@k had marched in on the day of the family conference, the day of the inheritance distribution discussion, which even without the witch was threatening to become a bloodbath.'
10784: '@r.........There was no way that Battler''s joke would be welcomed with laughter.'
10785: '@rSo it was a really big help when Nanjo laughed energetically to calm everyone down.'
10786: 'Nanjo@r@v19/21900081."Hahahahaha...@k@v19/21900082. I see, I see, that does sound quite interesting.@k@v19/21900083. I should love to read a novel with a plot like that."'
10787: 'Battler@r@v10/20100174."Well, I don''t think that could happen in reality.@k@v10/20100175. ......After all, right now, on this island, there''s one, two, three... 18 people, right?"'
10788: 'Battler@r@v10/20100176."If she did something weird, we could immediately restrain her.@k@v10/20100177. And thanks to the typhoon, she can''t even leave the island.@k@v10/20100178. Basically, there''s just no way she could even begin to pull off a crazy crime like that."'
10789: 'George@r@v07/20300313."......I agree.@k@v07/20300314. In a dead-end without any way to escape, and in a situation where everyone is suspicious of her,@k@v07/20300315. I really don''t think she could pull off a terrifying revenge tragedy like that."'
10790: 'Nanjo@r@v19/21900084."I imagine not.@k@v19/21900085. ...If revenge was her aim, it would have been more realistic for her to come in secret, without showing herself.@k@v19/21900086. You don''t often hear about people appearing openly for revenge except in historical plays."'
10791: 'Jessica@r@v04/20200454."I wouldn''t be so sure about that?@k @v04/20200455.Revenge is based on emotion, not frickin'' logic.@k@v04/20200456. And if she wants revenge so badly she''s ready to give her life for it, she might not be much afraid of the police or the number of people or that there''s no way out."'
10792: 'George@r@v07/20300316."It''s alright, Jessica-chan.@k@v07/20300317. Nothing as horrible as we imagine will happen."'
10793: 'Battler@r@v10/20100179."Ihihi!@k @v10/20100180.Like the battle royale between our parents over the inheritance isn''t horrible."'
10794: 'Jessica@r@v04/20200457."......You''re right.@k@v04/20200458. ...Dad and Uncle Rudolf are pretty tough, and Auntie Eva''s even trained in the martial arts.@k@v04/20200459. ......We''ll be OK.@k@v04/20200460. Yeah..."'
10795: '@rJessica didn''t say it, but she had vaguely noticed that her own father opposed all of the other siblings regarding the inheritance.'
10796: '@rThey acted like everything was good in front of the children, but when that pretense was lifted away, like it had been at dinner, it would become a tumultuous uproar.'
10797: '@rIt was only natural that Jessica, realizing that,@k would be frightened that her father and mother had gotten into some kind of trouble,@k ...and were about to be sacrificed for something terrifying...'
10798: 'Battler@r@v10/20100181."Seriously.@k@v10/20100182. George-aniki''s right.@k@v10/20100183. ...Nothing''s gonna happen.@k@v10/20100184. Even if she pretends she''s a witch,@v10/20100185. what can a single human woman who can''t even use magic do?"'
10799: 'Maria@r@v13/20400262."Kihihihihihihihihihihihihihihihihihihi..."'
10800: '@rThe sudden, creepy laugh made all of us jump.'
10801: '@r......And when we realized that this strange laugh was coming from Maria, we were shocked again.'
10802: 'Maria@r@v13/20400263.".........So that''s how it is.@k@v13/20400264. ...That''s your perception, isn''t it, Battler?"'
10803: 'Battler@r@v10/20100186."Wha-.........what is?@k@v10/20100187. Don''t laugh all creepy like that."'
10804: 'Maria@r@v13/20400265."You accept BEATRICE''s existence for now.@k@v13/20400266. At least you accept her as the 19th person and a guest.@k@|@y@v13/20400267. ............But that''s all, right?@k @v13/20400268....You don''t accept that the 19th person, BEATRICE, is a witch, right...?"'
10805: 'Battler@r@v10/20100188."You surprised us all for that?@k@v10/20100189. ......Of course I don''t.@k@v10/20100190. There''s obviously no such thing as witches.@k@v10/20100191. It''s impossible for it to be anything other than a human woman pretending to be one."'
10806: 'Maria@r@v13/20400269."......Kihihihihihihihihihihihihihihi.@k@v13/20400270. Hmmm...?@k @v13/20400271.That makes no sense, Battler.@k@v13/20400272. ......That''s a Devil''s Proof, you know?@k @v13/20400273.......There''s obviously no such thing as witches?@k @v13/20400274.But that just means you''ve never met a witch,@k@v13/20400275. and doesn''t mean you can deny that witches exist, right...?"'
10807: 'Battler@r@v10/20100192."...............@k@v10/20100193. .........That''s right.@k@v10/20100194. ...That really is right.@k@v10/20100195. I can''t prove that witches don''t exist.@k@v10/20100196. ......However, even if I can''t prove it, I can claim it.@k@v10/20100197. I claim that witches don''t exist."'
10808: 'Maria@r@v13/20400276."How...?@k @v13/20400277.How can you claim that witches don''t exist even though you can''t prove it...?"'
10809: 'Battler@r@v10/20100198."''Cause stuff like that doesn''t exist."'
10810: 'Maria@r@v13/20400278."Kihihihihihihihihihihihihihihihi!@k @v13/20400279.And that''s your "QED"?@k @v13/20400280.Proof concluded without any evidence or basis?@k @v13/20400281_b.A classic example of how ignorance shelves its problems.@k@v13/20400282. A reckless suspension of thought.@k@v13/20400283. Kihihihihihihihi...!"'
10811: 'Battler@r@v10/20100199."In that case, I have one answer, Maria.@k@v10/20100200. ......The witch side has to show some proof themselves.@k@v10/20100201. This is also part of the Devil''s Proof.@k@v10/20100202. ......If you bring one, it''ll be over quickly."'
10812: 'Battler@r@v10/20100203."...In our case, this lady calling herself BEATRICE...@k@v10/20100204.just has to perform some magnificent magic, like sending out some sparkling stars with her wand or something,@v10/20100205. and show us something that''s impossible for Humans,@v10/20100206. right?"'
10813: 'Kumasawa@r@v18/21800050."......Come now, you two.@k@v18/21800051. Please settle down..."'
10814: '@rKumasawa noticed that the atmosphere between them was getting worse, and tried to calm them.'
10815: '@r...It seemed as though Battler quickly realized that he was acting immaturely.'
10816: '@rBut Maria''s expression didn''t loosen.@k ......She kept staring at Battler as she laughed creepily...'
10817: 'Jessica@r@v04/20200461."You quit it too, Maria.@k@v04/20200462. ...Let''s get back in a good mood, alright?"'
10818: 'Maria@r@v13/20400284."Kihihihihihihihihihihi, kihihihihihihihihihihihihi."'
10819: 'Battler@r@v10/20100207."....................."'
10820: 'Maria@r@v13/20400285."......If that''s what you want, BEATRICE will show you, I''m sure.@k@v13/20400286. Something impossible for Humans.@k@v13/20400287. And then you too will believe, right?@k @v13/20400288.In BEATRICE."'
10821: 'Battler@r@v10/20100208."............Sure.@k@v10/20100209. ......If she lets me have a look-see, I''ll believe."'
10822: 'Maria@r@v13/20400289."It''s a chess argument between the witch and you, Battler.@k@v13/20400290. .........If you get checkmated, you will believe in the witch."'
10823: 'Battler@r@v10/20100210."Oh, that''s a stylish analogy.@k@v10/20100211. ......The witch shows her magic.@k@v10/20100212. My king is put into check."'
10824: 'Battler@r@v10/20100213."I quibble, saying that it would be possible to reproduce that by measures even a human could take, and create an escape for my king.@k@v10/20100214. ...If I can''t do that, it''s checkmate - that''s a pretty good analogy."'
10825: 'Maria@r@v13/20400291."Battler.@k@v13/20400292. ......In chess, you and your opponent have pieces which move in the same way.@k@v13/20400293. That''s why you can read your opponent''s moves."'
10826: 'Maria@r@v13/20400294."............But you know what?@k @v13/20400295.You haven''t supposed that your opponent''s pieces might be able to move in much more strange ways than yours.@k@v13/20400296. You''ve simply assumed that, since witches shouldn''t exist, the movements of BEATRICE''s pieces will obviously be the same as your own."'
10827: 'Battler@r@v10/20100215."..........................."'
10828: 'Maria@r@v13/20400297."......But the thing is,@k @v13/20400298..........sorry, Battler, but your chess partner isn''t Human.@k@v13/20400299. She''s a witch.@k@v13/20400300. ......She can move her pieces in ways that Humans can''t.@k@v13/20400301. .........Right now, your perception of that is wrong.@k@v13/20400302. ...Battler, you like Auntie Kyrie''s chessboard thinking, right?"'
10829: 'Battler@r@v10/20100216.".........Yeah.@k@v10/20100217. I like that style of thinking where you stand in your opponent''s position."'
10830: 'Maria@r@v13/20400303."And that''s no good.@k@v13/20400304. Even though your opponent is a witch, you won''t accept that.@k@v13/20400305. .........So you can''t understand the moves a witch can make, and your chessboard thinking won''t work.@k@v13/20400306. Your perception of your opponent is wrong.@k@v13/20400307. The very first premise of chessboard thinking is broken down."'
10831: 'Battler@r@v10/20100218."........................Hoh,@k@v10/20100219. ...is that what you say?"'
10832: 'Maria@r@v13/20400308."You cannot win in chess against a witch...!@k @v13/20400309.Kihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihihi!"'
10833: 'Shannon@r@v15/20500564."...I do not know what happened after that.@k@v15/20500565. We servants were ordered not to approach the dining room..."'
10834: 'George@r@v07/20300318.".........I see.@k@v07/20300319. So, Shannon, have you, uh, ever met this person called BEATRICE before?"'
10835: 'Shannon@r@v15/20500566."...........................@k@v15/20500567. ......I have no idea."'
10836: '@rThat was a slightly odd way to say it.@k@rI thought it didn''t sound like she meant her memory was vague.'
10837: 'Shannon@r@v15/20500568."......For us servants, BEATRICE-sama is another master of this mansion.@k@v15/20500569. ......Some speak as if we spread that rumor due to having been influenced by the Master, but..."'
10838: 'Shannon@r@v15/20500570."......Since the time I started working here, the story of BEATRICE-sama was already whispered about."'
10839: 'George@r@v07/20300320."I heard about it before.@k@v07/20300321. ...How you''ll get cursed if you don''t respect her, and how there was a servant who actually had an accident this way."'
10840: 'Shannon@r@v15/20500571."Yes...@k@v15/20500572. ......But it''s true that some people believed more or less than others.@k@v15/20500573. ...I, umm, ...believe that respect for that sort of thing shouldn''t be forgotten, so I have never doubted that she exists."'
10841: 'Shannon@r@v15/20500574."......I dimly believed that a...@v15/20500575....umm......uncertain being called the Golden Witch surely existed."'
10842: 'George@r@v07/20300322."...And then that witch whose existence was uncertain actually showed herself and came in openly through the entrance hall... Is that what happened?"'
10843: 'Shannon@r@v15/20500576.".........I don''t know.@k@v15/20500577. ...............I don''t know...anything."'
10844: 'George@r@v07/20300323."............@k@v07/20300324. ...When you brought her dinner, did you talk about anything?"'
10845: 'Shannon@r@v15/20500578.".................................@k@v15/20500579. ......No, nothing."'
10846: 'George@r@v07/20300325."I see.@k@v07/20300326. ...Still, a witch that eats food...somehow doesn''t sound so realistic.@k@v07/20300327. Maybe it''s just someone who knows about the witch legend on this island taking on BEATRICE''s name after all."'
10847: 'George@r@v07/20300328.".........I think you''ve probably come to respect BEATRICE and think of her as something like a guardian goddess of the mansion.@k@v07/20300329. So when a person appeared actually calling themselves that, maybe you were a little disturbed."'
10848: 'Shannon@r@v15/20500580.".........@k@v15/20500581. .........Yes.@k@v15/20500582. I think that definitely could be it."'
10849: '@rGeorge was slightly at a loss at what to do about Shannon''s downcast appearance.'
10850: '@r......Possibly,@k not just Genji, but also the young servants, including Shannon,@k had been strictly questioned about whether they had a clue as to who this person called BEATRICE was...'
10851: '@rThinking that, he had tried to cheer her up somehow.'
10852: '@rLike Maria and Jessica, Shannon too must be unable to completely hide her agitation over the sudden visit of a person calling herself the Golden Witch.'
10853: '@rHe thought that must be the case.@k@r...But George had no way of knowing what was in Shannon''s heart.'
10854: '@rShannon was bitter and sad.'
10855: '@r......The door to the Golden Land...would be opened.@k@r......The witch had definitely told her that.'
10856: '@rThat meant...the demise of everything.'
10857: '@r.........Even if she accepted the ring from George,@w666. ............now, they could never be married.'
10858: '@rNo, .........in the first place...@k@r...Did furniture like her......have the right to be married?'
10859: '@rEven if the witch hadn''t come to tell of their demise, ......wasn''t it fated to fail sometime or another?'
10860: '@rHadn''t she turned her gaze towards the fun days with George, ...and purposefully closed her eyes to the sad reality?'
10861: 'George@r@v07/20300330."............What''s wrong?@k@v07/20300331. ...You''ve really been seeming down for a while now."'
10862: 'Shannon@r@v15/20500583."George-san.@k@v15/20500584. ......What does it mean...to be engaged?"'
10863: 'George@r@v07/20300332."Huh?!@k @v07/20300333.Ah, ......err!@k @|@y@v07/20300334.It means making a promise to marry.@k@v07/20300335. ...But the way I think of it, it means the same thing as marriage."'
10864: 'George@r@v07/20300336."......Honestly, I want to take you as my wife right now, and take you back home.@k@v07/20300337. ......But right now, I am in the middle of training, and I''m still a long way from gaining the ability needed to create my own castle.@k@v07/20300338. That''s why I want to become an independent man first, and only then, proudly take you home with me."'
10865: 'George@r@v07/20300339."I''m not talking about the distant future.@k@v07/20300340. I just want you to wait a short three years.@k@v07/20300341. ......But even so, I don''t want to lie about my feelings for the next three years."'
10866: 'George@r@v07/20300342."So, ......I decided to give you an engagement ring.@k@v07/20300343. ......That might be a shameful reason as a man.@k@v07/20300344. An engagement because I want you to wait, because I can''t balance a wife and a job, might be shameful.@k@|@y@v07/20300345. ......But I will never - "'
10867: 'Shannon@r@v15/20500585.".........Thank you very much.@k@v15/20500586. ...I now understand that to you, an engagement ring isn''t just another present you would give to a lover."'
10868: 'George@r@v07/20300346."O-of course not.@k@v07/20300347. An engagement ring isn''t a simple accessory.@k@v07/20300348. It''s an oath between lovers, a precious promise left in the form of a ring."'
10869: 'Shannon@r@v15/20500587.".........*giggle*.@k@v15/20500588. ...In that case, if we got married quickly, it would become unnecessary, right?"'
10870: 'George@r@v07/20300349."The-then it wouldn''t be an engagement ring I''d give you.@k@v07/20300350. I''d give it to you as a wedding ring.@k@v07/20300351. ......Either way, it won''t change the fact that I''ll give you a ring."'
10871: 'Shannon@r@v15/20500589."So it''s like a sales contract, saying "This woman is mine, nobody touch her"."'
10872: 'George@r@v07/20300352."Nn......no, umm, ......that''s not what I......@k@v07/20300353. ...............*cough*."'
10873: '@rGeorge knew about his shameful character.@k When he had fallen for Shannon, and sworn to become an excellent man, he had sworn to part ways with that shameful part of himself.'
10874: '@r......So, he chose to answer a little roughly on purpose.@k@r...Believing that Shannon would find it reassuring.'
10875: 'George@r@v07/20300354.".........No, ...that may be exactly it.@k@v07/20300355. .........Sayo.@k@|@y@v07/20300356. I''ll make you my wife.@k@v07/20300357. ...I won''t give you to anyone else.@k@v07/20300358. I''ll make you all mine.@k@v07/20300359. ...So no one better lay a hand on you.@k@v07/20300360. ......That''s what this ring is.@k@v07/20300361. ...Without a doubt."'
10876: 'Shannon@r@v15/20500590."Thank you very much, George-san.@k@v15/20500591. ............I''m truly...happy."'
10877: '@rThen, George-san.'
10878: '@r......If it was decided by fate that this engagement ring, ......that this promise would not be fulfilled, ......would you still give it to me...?'
10879: '@r...Shannon was about to ask that, ...but she swallowed her words.'
10880: '@rBecause George had already spoken the answer.'
10881: '@r......George had said it.@k He had said that to him, an engagement ring was infinitely similar to a wedding ring.'
10882: '@rTherefore, accepting George''s ring had a far more sacred significance than a promise to marry.'
10883: 'George@r@v07/20300362."Which is why...@k@v07/20300363....I will stop calling this an engagement ring.@k@|@y@v07/20300364. From now on, this isn''t an engagement.@k@v07/20300365. It''s a wedding ring."'
10884: 'Shannon@r@v15/20500592."Is, ...is that alright...?@k @v15/20500593.Is it alright to, umm, just proclaim that we''re married without God''s blessing......?"'
10885: 'George@r@v07/20300366."Yeah.@k@v07/20300367. It''s enough to tell God, Father, and Mother about it afterwards.@k@v07/20300368. We''ll declare that the two of us have been joined in marriage.@k@v07/20300369. ..........No one can overturn it."'
10886: 'Shannon@r@v15/20500594.".........George-san......"'
10887: 'George@r@v07/20300370."I''m not saying this because of a momentary emotion.@k@v07/20300371. I''m not just looking at how you are now.@k@v07/20300372. .........I''m looking at how you will be tomorrow, and the next day.@k@v07/20300373. ...I''m even gazing at you as you''ll be in old age, in the future, as I say this."'
10888: 'Shannon@r@v15/20500595."......You are always telling me about that, George-san.@k@v15/20500596. ...About how you want to spend your old age slowly, surrounded by sprightly children and grandchildren."'
10889: 'George@r@v07/20300374."Yeah.@k@v07/20300375. At that time, an older you will be beside me.@k@v07/20300376. That is what I predict - no - what I foresee.@k@v07/20300377. ...Yes.@k@v07/20300378. Because that day will surely come."'
10890: 'Shannon@r@v15/20500597.".....................Will it...@v15/20500598.surely come?@k@v15/20500578. ......Is it OK......for me to believe?"'
10891: 'George@r@v07/20300379."Yes.@k@v07/20300380. Surely.@k@v07/20300381. Definitely.@k@v07/20300382. ......And this ring proves it without words."'
10892: 'Shannon@r@v15/20500600."............Show it to me...@v15/20500601....please."'
10893: 'George@r@v07/20300383."Huh?@k @v07/20300384.Ah,@v07/20300385. ah,@v07/20300386. ah,@v07/20300387. .........h-he-here it is...!"'
10894: '@rGeorge, thinking he was being told to show her the ring, hurriedly took out the ring box.'
10895: '@r...Even though he had practiced so much, he hadn''t been able to look cool.'
10896: '@rBut Shannon wasn''t looking at that.'
10897: '@r......With a straight and direct gaze, with faint tears and a smile...'
10898: '@r.........She was staring right at George''s eyes - no, into something she could see beyond his eyes...'
10899: 'Shannon@r@v15/20500602."......Show me...@v15/20500603.......that future,@v15/20500604. .........please."'
10900: 'George@r@v07/20300388."Ah............yeah.@k@v07/20300389. ......I''ll show it to you.@k@v07/20300390. For sure.@k@v07/20300391. ......I promise.@k@v07/20300392. .........And not just until old age.@k@v07/20300393. ...After we die too.@k@v07/20300394. ...Even if we become spirits, we''ll always, always be together."'
10901: '@rShannon wiped away her tears and took the ring box.@k Inside was a diamond ring more than worthy of blessing the two of them.'
10902: '@rGeorge said the line that he had practiced over and over again inside his head.'
10903: 'George@r@v07/20300395."I, ......I want you to put that ring on whatever finger you like, and have that be your answer.@k@|@y@v07/20300396. Umm, so, by tomorrow morning......"'
10904: 'Shannon@r@v15/20500605."......*giggle*."'
10905: '@rShannon smiled, took the ring,@w583. ......and with a completely natural movement, put it on the ring finger of her left hand.'
10906: '@rIt really had looked, ......like a very, very natural movement,@k and for a while, George was stunned...'
10907: 'Shannon@r@v15/20500606."This...is my answer.@k@v15/20500607. ...George-san."'
10908: 'George@r@v07/20300397."Shannon......@k@v07/20300398. No,@v07/20300399. .........Sayo..............."'
10909: 'Shannon@r@v15/20500608."......Even if we become spirits,@v15/20500609. .........we''ll always,@v15/20500610. ............always......@v15/20500611.be together.@k@v15/20500612. .........George-san."'
10910: '@rThere was no blessing from God, no pastor to witness, nothing.@k@rBut the two to be married had proclaimed it.@k@r...Two souls were joined here today.........'
10911: 'Kanon@r@v16/20600345.".....................Nee-san, ............you''re an idiot."'
10912: 'Shannon@r@v15/20500613."......Am I really?"'
10913: 'Kanon@r@v16/20600346."Even though you''re furniture......@k@v16/20600347. ......Even though...you''re furniture......!"'
10914: 'Shannon@r@v15/20500614."I''m not furniture.@k@v15/20500615. Not anymore."'
10915: 'Kanon@r@v16/20600348."......Liar!!@k @v16/20600349.Why are you fooling yourself?!@k @v16/20600350.You know that you can never become human!@k @v16/20600351.You know that you can''t become human unless you go to the Golden Land!!"'
10916: 'Kanon@r@v16/20600352."......So why did you throw away the promise that enabled you to go to the Golden Land...?!!"'
10917: 'Shannon@r@v15/20500616."Oh yeah.@k@v15/20500617. By accepting the ring, ......that promise with BEATRICE-sama comes to nothing, doesn''t it?@k@v15/20500618. ......*giggle*, sorry."'
10918: 'Kanon@r@v16/20600353."............Now, me, you, George-sama, the Master, each and every one of us has the same conditions.@k@v16/20600354. Thirteen people will be made sacrifices.@k@v16/20600355. Only five will be invited to the Golden Land.@k@v16/20600356. ......And you......rejected one of those places,@v16/20600357. ......yourself......"'
10919: 'Shannon@r@v15/20500619."That''s odd.@k@v15/20500620. ......It looks like you''re the one with lingering regrets, Kanon-kun."'
10920: 'Kanon@r@v16/20600358."You''re the one with regrets, aren''t you, Nee-san!@k @v16/20600359.You got engaged, right?!@k @v16/20600360.Even though you knew it was a fate that would never be fulfilled!!"'
10921: 'Shannon@r@v15/20500621."Yep.@k@v15/20500622. ...I promised that we would always, always be together, for eternity."'
10922: 'Shannon@r@v15/20500623."......So you know what?@k @v15/20500624.......In that instant, our eternity was completed.@k@v15/20500625. Even if we become sacrifices, it''s already completed.@k@v15/20500626. So, it''s alright."'
10923: 'Shannon@r@v15/20500627.".........Kanon-kun, you''re the one who actually has regrets.@k@v15/20500628. ...We''re furniture, right?@k @v15/20500629.No matter what the result, we will be freed.@k@v15/20500630. ...In that case, it doesn''t matter whether we go to the Golden Land or not."'
10924: 'Shannon@r@v15/20500631."......And yet you''re set on going to the Golden Land.@k@v15/20500632. .........You want to become human no matter what, right?@k @v15/20500633....Why?"'
10925: 'Kanon@r@v16/20600361."Because I want to become human!!@k @v16/20600362.I''ve had enough of being furniture!!"'
10926: 'Shannon@r@v15/20500634."Why?"'
10927: 'Kanon@r@v16/20600363."I...wanted to fall in love as well...!!!"'
10928: '@rTears spilled from both of Kanon''s eyes.@k ...And he howled.'
10929: 'Kanon@r@v16/20600364."......I...liked Milady...!!@k @v16/20600365.And after seeing Milady on that day, I started liking her even more...!@k @v16/20600366.And when I heard that Milady also liked me, I was really happy...!!@k @v16/20600367.But I''m furniture, ......and I can''t accept Milady''s feelings!!"'
10930: 'Shannon@r@v15/20500635."...That''s where you''re wrong.@k@v15/20500636. .........We may be furniture.@k@v15/20500637. We may be less than human.@k@v15/20500638. ...But I learned that doesn''t mean we aren''t qualified to love."'
10931: 'Kanon@r@v16/20600368."I believed that if we couldn''t make those feelings eternal, we were better without them!!@k @v16/20600369.I just decided that someday, a day would come when I would disappear, and that would definitely hurt her, .........no, that''s wrong!!"'
10932: 'Kanon@r@v16/20600370."I was just frightened!!@k @v16/20600371.I......was just afraid, and thought that if love could not be eternal, I was better off not knowing it!!"'
10933: 'Shannon@r@v15/20500639."......Cicadas fall in love during a span of only a few weeks out of their whole lives, and then they disappear.@k@v15/20500640. .........I don''t think there are any cicadas that don''t fall in love because it will be over in a few weeks."'
10934: 'Kanon@r@v16/20600372."Uuuuuuuuuuughhh!!@k @v16/20600373.Uuuuuuuuuuuuuuuuuuuuughhh!!"'
10935: '@rIt seemed that Kanon was still speaking of his regrets, but by now it was all jumbled up in his crying voice...'
10936: 'Kanon@r@v16/20600374."......I hate that witch...!!@k @v16/20600375....Why did she plant these feelings in me...?!@k @v16/20600376.If only, if only she hadn''t pulled that weird prank, I wouldn''t have payed Milady any notice...!!!"'
10937: 'Shannon@r@v15/20500641."............BEATRICE-sama is so cruel, isn''t she.@k@v15/20500642. ...To make you cry bitter tears, she played games with your fate.@k@v15/20500643. .........But, the witch probably isn''t achieving what she plotted.@k@v15/20500644. ...After all - "'
10938: '@rKnowing love isn''t a lingering attachment that ties you to life.@k It is the place we should reach on our journey through life...'
10939: 'BEATRICE@r@v27/20700694.So there you have it, Kanon.@k@r@v27/20700695.That promise you worked so hard for has now come to nothing.@k@r@v27/20700696.*cackle*cackle*cackle*cackle*cackle*!'
10940: 'BEATRICE@r@v27/20700697.Well now.@k@v27/20700698. With this, the conditions for all of the pieces are the same.@k@r@v27/20700699.There are eighteen pieces! Thirteen will be sacrificed!@k@r@v27/20700700.Who will the five survivors be?'
10941: 'BEATRICE@r@v27/20700701.............Or.@k@r@v27/20700702.Will someone destroy this ritual?@k@r@v27/20700703.Who?!! How?!'
10942: 'BEATRICE@r@v27/20700704.Fuhahahahahahahahahahahahahahahahahaha!!'
10943: 'BEATRICE@r@v27/20700705.This isn''t a chess problem.@k@v27/20700706. It''s a game on equal footing.@k@r@v27/20700707.I won''t be closing in one-sidedly.'
10944: 'BEATRICE@r@v27/20700708.You can frantically run from my advances, and make it a tie, a result of no contest.'
10945: 'BEATRICE@r@v27/20700709.Well, the best you can do is have that repeat over and over.'
10946: 'BEATRICE@r@v27/20700710.And it probably won''t be that difficult for you.'
10947: 'BEATRICE@r@v27/20700711.However, these no contest results will continue forever, soon wearing down your mind, and eventually killing it.'
10948: 'BEATRICE@r@v27/20700712.At that time, you will accept your defeat and surrender to me!!'
10949: 'BEATRICE@r@v27/20700713.The reason I said it was a fair game.'
10950: 'BEATRICE@r@v27/20700714.......That is because the rules for my loss have also been established.@k@r@v27/20700715.There''s nothing so boring as a game you can''t lose, you see.'
10951: 'BEATRICE@r@v27/20700716.The way to defeat me.@k@r@v27/20700717.That is...the epitaph offered to my portrait.'
10952: 'BEATRICE@r@v27/20700718.That is both the way to open the door to the Golden Land and the key to destroying my ritual.'
10953: 'BEATRICE@r@v27/20700719.I complete the ritual according to the epitaph.@k@r@v27/20700720.You solve the epitaph''s riddle, destroy the ritual and overthrow me...!'
10954: 'BEATRICE@r@v27/20700721.Solve the riddle hidden in the epitaph, and expose the location of the vast gold I gave to Kinzo!!'
10955: 'BEATRICE@r@v27/20700722.What result will this game show us?!@k@r@v27/20700723.I''m expecting a good fight from you.'
10956: 'BEATRICE@r@v27/20700724.Entertain me, Ushiromiya Battleeeeeeeeeeeeeer!!'
10957: 'Natsuhi@r@v03/20900124."................................."'
10958: 'Krauss@r@v02/20800111."...............I have no objections.@k@v02/20800112. ...Natsuhi and I accept it."'
10959: 'Natsuhi@r@v03/20900125.".........Ggh......@k@v03/20900126. ...I can''t believe it, ...and I don''t want to, but...@k@v03/20900127.......that is......reality, isn''t it..."'
10960: 'Krauss@r@v02/20800113."...Natsuhi.@k@v02/20800114. Choose your words more carefully.@k@v02/20800115. .........She is this family''s most honored guest."'
10961: 'Hideyoshi@r@v06/21100073."............W-we accept it too.@k@v06/21100074. ...There''s nothin'' more to say."'
10962: 'Eva@r@v05/21000195."Yes.@k@v05/21000196. ...I accept it.@k@v05/21000197. .........I have absolutely no complaints.@k@v05/21000198. I can''t believe that you really......@k@v05/21000199. .........I have to honestly respect you."'
10963: 'Rosa@r@v12/21400236."Me too...@k@v12/21400237. ............Incredible.@k@v12/21400238. I genuinely respect you.@k@v12/21400239. ......So I have to accept it."'
10964: 'Rudolf@r@v08/21200176."I accept it too...@k@v08/21200177. .........Still can''t believe it.@k@v08/21200178. ...But, .........what can you do?@k@v08/21200179. You''ve proven devils!@k @v08/21200180.You win...!"'
10965: 'BEATRICE@r@v27/20700725."*cackle*cackle*cackle*...!@k @v27/20700726.The Devil''s Proof was a convenient excuse that you liked using to show that something was impossible to prove, ......but now it''s become your mortal enemy, has it not?"'
10966: 'Rudolf@r@v08/21200181."......Don''t torture me, great witch.@k@v08/21200182. .........I''ve already accepted you.@k@v08/21200183. I resign."'
10967: 'Kyrie@r@v09/21300131."................................."'
10968: 'BEATRICE@r@v27/20700727.".........Kyrie.@k@v27/20700728. Do you still have any objections...?@k @|@y@v27/20700729.I must have everyone in agreement.@k@v27/20700730. If you alone will not accept my existence..."'
10969: '@rAs the witch laughed boldly, the siblings started to panic.@k@r...They were afraid of displeasing the witch.'
10970: '@rKyrie lightly closed her eyes, ...and after keeping silent for a while, opened her mouth.'
10971: 'Kyrie@r@v09/21300132."...My apologies.@k@v09/21300133. ......I resign."'
10972: '@rOnly Kyrie had faced the witch with stern eyes until the end.'
10973: '@r......However, she had only been able to resist acknowledging the truth for a short time.'
10974: '@rThe reality - the being - that was before her eyes...couldn''t be denied.@k@rDevils had already been proven...!'
10975: 'Kyrie@r@v09/21300134.".........I also...accept it.@k@v09/21300135. ......You are BEATRICE.@k@v09/21300136. The Ushiromiya family alchemist.@k@v09/21300137. ...And a user of great magic.@k@v09/21300138. ..................I must accept the fact that you are a witch...!"'