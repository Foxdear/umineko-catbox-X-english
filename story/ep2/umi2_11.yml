11918: 'BEATRICE@r@v27/20700975."What is this naive move?@k @v27/20700976.@|@y@c900.@[It is impossible to unlock the lock to the chapel with anything but the chapel''s key!!@]@c.@k @v27/20700977.Although it can be opened with the power of magic, of course...?"'
11919: 'Battler@r@v10/20100425."Then what about this!!@k @v10/20100426.There''s something wrong with the door itself!@k @v10/20100427.Even while it was locked, there was some way to pass through it...!@k @v10/20100428.As to what that is, I can think of a few ways!"'
11920: 'Battler@r@v10/20100429."Maybe like on the big doors to a castle which have a smaller door on them, there was another door here!@k @v10/20100430.It''s also possible that they removed the hinges, and then removed the whole door before entering!!"'
11921: 'BEATRICE@r@v27/20700978."Wahahahahahahahahahaha!@k @v27/20700979.Is this the intelligence of a hundred years of humanity, Battleeeeeeer?!@k @v27/20700980.@|@y@c900.@[When the door to the chapel is locked, it prevents any and all methods of entry or exit!!@]@c."'
11922: 'BEATRICE@r@v27/20700981."As long as you can''t use magic, of course...?@k @v27/20700982.*cackle*!@k @v27/20700983.Is it about time for checkmate?!"'
