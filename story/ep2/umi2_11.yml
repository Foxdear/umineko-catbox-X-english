11913: 'Battler@r@v10/20100412."W-......well, that is true.@k@v10/20100413. ...If you were a witch,@v10/20100414. there''d be no need for you to show proof.@k@v10/20100415. ......Because you could do anything with magic... That''s nasty...@k@v10/20100416. What an unfair game...!"'
11914: 'BEATRICE@r@v27/20700969."So shall we resume once more?@k @v27/20700970.The six people definitely entered through the door.@k@v27/20700971. I unlocked it with magic.@k@v27/20700972. ......How will you defeat this magic, this locked room?!"'
11915: 'Battler@r@v10/20100417."......The, the key!@k @v10/20100418.Genji-san and the others said there was only one key, but that''s impossible to prove!@k @v10/20100419.The culprit secretly made a duplicate key...!"'
