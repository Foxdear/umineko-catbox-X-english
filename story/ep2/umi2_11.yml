11848: 'Rosa@r@v12/21400351."I''m positive!@k @v12/21400352.It was locked!!@k @v12/21400353.I unlocked it!!@k @v12/21400354.Definitely!!"'
11849: '@rAuntie Rosa kept closing the chapel door, locking it, pulling on it to check the lock, and opening it again.'
11850: '@rHer face was becoming pale again...'
11851: 'Rosa@r@v12/21400355."Until I took the key out of Maria''s envelope and opened this door,@k @v12/21400356.it was definitely locked!!@k @v12/21400357.But this key was in the envelope and in Maria''s care!@k @v12/21400358.And that happened yesterday before noon!!!"'
11852: 'Nanjo@r@v19/21900125.".........What did you say........."'
11853: 'Gohda@r@v17/21700111."But then that''s......strange......!"'
11854: 'Battler@r@v10/20100351."Yes, it is.@k@v10/20100352. .........Maria received the only key from a woman calling herself a witch midday yesterday.@k@v10/20100353. In other words, from midday yesterday until this morning, when Auntie Rosa unlocked the door, this chapel was a locked room."'
11855: 'Battler@r@v10/20100354.".........How did they get those six in here, and then how did they kill them?!"'
11856: '@rWe had been confused by the six deaths.@k We''d thought that we had figured something out after hearing about that weird magic circle and the history of the chapel.'
11857: '@r......That had all been a worthless problem!'
11858: '@rFrom midday yesterday until this morning, this chapel had been a locked room.@k@rBut our parents had been with us until last night.'
11859: '@rHow had the culprit opened this door?!@k@rAnd how had they locked it?!'
11860: 'Battler@r@v10/20100355."......What are you trying to pull.@k@v10/20100356. ...Again?@k@v10/20100357. A locked room again?!@k @v10/20100358.Are you trying to say that you unlocked it with the power of magic?!!@k @v10/20100359.I''m not that stupid!!"'
11861: 'BEATRICE@r@v27/20700875."If you tell me to show you how I open locks with my power, then I can show you.@k@v27/20700876. ......But that will not make you surrender."'
11862: 'BEATRICE@r@v27/20700877."These "explanations with humans" you talk about!@k @v27/20700878.The time I fully exhaust those theories of yours will be the time of my victory!!@k @v27/20700879.Come now, how will you destroy it?@k @v27/20700880.If it was a human, what trick could they have used to defeat it, hmm~?"'
11863: 'Battler@r@v10/20100360."It''s just like the locked rooms last time.@k@v10/20100361. ...Not enough information!!@k @v10/20100362.It''s impossible to reason like this!@k @v10/20100363.Any excuse could be made, any trick could work!!@k @v10/20100364.Guessing is useless!"'
11864: 'BEATRICE@r@v27/20700881."Ha!@k @v27/20700882.That again?@k @v27/20700883.There''s not enough information so you''ll wait and see?@k @v27/20700884.The information is uncertain so it''s impossible to reason...?@k @v27/20700885.Ha, those are always the excuses you humans use to stop thinking.@k@v27/20700886. What is this pretense, you lowly human?!"'
11865: 'BEATRICE@r@v27/20700887."Are you saying that unless you''re like Laplace''s demon, you can''t even think, you incompetent fool?!!@k @v27/20700888.......And you speak as though a lack of information is disadvantageous to you, when it''s actually the complete opposite, you see?"'
11866: 'BEATRICE@r@v27/20700889."The more information you''re given, the more it will pain you!@k @v27/20700890.It will only cause the strength of the compressor squeezing you to increase!@k @v27/20700891.*cackle*cackle*cackle*cackle*cackle*!!"'
11867: 'Battler@r@v10/20100365."Hoh, well, in that case, let me say this.@k@v10/20100366. It''s impossible to verify that this is even a "locked room" in the first place!!@k @v10/20100367.If we''re talking about demons, I''ve got one for you as well."'
11868: 'Battler@r@v10/20100368."......It''s possible to prove that this isn''t a locked room.@k@v10/20100369. You just have to show how someone could go in or out!"'
11869: 'Battler@r@v10/20100370."But it''s impossible to prove that it is a locked room!!@k @v10/20100371.You can''t deny the endless set of methods of getting in.@k@v10/20100372. In other words, this is one of those Devil''s Proofs!!@k @v10/20100373.The definition of a locked room is in fact impossible to prove!!"'
11870: 'BEATRICE@r@v27/20700892."So, after you stop thinking with a lack of information as an excuse, this is what comes next.@k@v27/20700893. ......Oh well.@k@v27/20700894. If that is your move, then I will accept it.@k@v27/20700895. Continue."'
11871: 'Battler@r@v10/20100374."First off, it looks like you''re trying to say that the chapel is a locked room.@k@v10/20100375. ...Just a short while ago, I spent some time looking around in there, and yeah, I really couldn''t find any way in or out except for the door."'
11872: 'Battler@r@v10/20100376."......But that just means I couldn''t find one - it doesn''t prove that it was a locked room!!"'
11873: 'Battler@r@v10/20100377."If there was a "hidden door" or something that I wasn''t able to find, all your premises are completely blown away!!@k @v10/20100378.In other words, whether I''m able to find a hidden door or not, you can never deny a method X by which the locked room could be entered!"'
11874: 'Battler@r@v10/20100379."And this method X could be carried out without magic.@k@v10/20100380. After all, it''s a "hidden door"!@k @v10/20100381.I''m sure that in this chapel, there''s some hidden door that''s impossible to find.@k@v10/20100382. So I don''t even need to start guessing, and I can say that magic is impossible!!"'
11875: 'BEATRICE@r@v27/20700896.".........Hohoh, so you use that reasoning.@k@v27/20700897. *cackle*cackle*, how naive."'
11876: 'BEATRICE@r@v27/20700898."An expected move.@k@v27/20700899. Let me make my move in response.@k@v27/20700900. ......I have always thought the "locked rooms" that feature in worthless human detective novels to be ridiculous."'
11877: 'BEATRICE@r@v27/20700901."Why?@k @v27/20700902.Because they''re used the wrong way.@k@v27/20700903. ......When a "locked room" appears in a detective novel, do you really think that is a locked room?@k @v27/20700904.You don''t, do you?!"'
11878: 'BEATRICE@r@v27/20700905."What trick did they use to make this look like a locked room!@k @v27/20700906.That''s what you think."'
11879: 'BEATRICE@r@v27/20700907."In other words, out of all the locked-room murders humanity has built up over a hundred years, not a single one has ever been made complete!!"'
11880: 'Battler@r@v10/20100383."Oooh!!@k @v10/20100384.That''s some talk - mystery fans are pretty scary, you know?!@k @v10/20100385.Christie is probably grinding her teeth in her grave!"'
11881: 'BEATRICE@r@v27/20700908."Hmph!!@k @v27/20700909.But I am different.@k@v27/20700910. I have given birth to a true locked room!@k @v27/20700911.And I can demonstrate that.@k@v27/20700912. Why?@k @v27/20700913.Because I am a witch!!"'
11882: 'BEATRICE@r@v27/20700914."For the Devil''s Proof, all you have to do is bring along a devil to prove it, yes?@k @v27/20700915.Well that''s convenient - as a witch, devils and demons are my good friends, I''ll bring as many as you like!!"'
11883: 'Battler@r@v10/20100386."Sounds great!!@k @v10/20100387."Dad and the rest entered the chapel using a hidden door, or were carried in through one"!@k @v10/20100388.How do you plan to beat this move?!"'
11884: 'BEATRICE@r@v27/20700916."With this.@k@v27/20700917. Regardless of whether they were alive or dead,@k@v27/20700918. the six definitely entered through the door!!"'
11885: 'Battler@r@v10/20100389."Huh?!?!@k @|@y@v10/20100390.Dumbass!!@k @v10/20100391.The door was locked, how''d they do it?!!"'
11886: 'BEATRICE@r@v27/20700919."I opened it with magic, and invited them inside!!"'
11887: 'Battler@r@v10/20100392."Like hell you did!!@|@y@k @v10/20100393.I can''t accept magic, so there''s no way in hell I''ll accept that!!@k @v10/20100394.You''re lying!!@k @v10/20100395.That door can open with some trick.@k@v10/20100396. Or maybe there''s a hidden door - I won''t accept any other way!!"'
11888: 'BEATRICE@r@v27/20700920."......<Perpetual>!!@k @v27/20700921.That''s what we call an endless repetition of moves in chess.@k@v27/20700922. In our game, both sides denying the basis of each other''s claims and failing to advance the discussion is the same as an endless repetition of moves."'
11889: 'BEATRICE@r@v27/20700923."......In most games, this would be decided as a draw, but that would terribly dampen the interest of this game!!@k @v27/20700924.We will have no draws.@k@v27/20700925. In short, you will either accept me and submit to me, or not!!"'
11890: 'Battler@r@v10/20100397."At least I agree with you there!!@k @v10/20100398.We''ll settle this without fail, just as you wish!!"'
11891: 'BEATRICE@r@v27/20700926."*cackle*cackle*!@k @v27/20700927.That disposition is good!@k @|@y@v27/20700928..........So I had a thought.@k@|@y@v27/20700929. I think I''ll add a new rule to this game between you and me."'
11892: 'Battler@r@v10/20100399."A new rule?!@k @v10/20100400....I''ll bet it''s a rule that''ll give you an advantage, right?!"'
11893: 'BEATRICE@r@v27/20700930."Would I do that?@k@v27/20700931. I''ll give you the thing that people like you never cease to demand.@k@v27/20700932. The reason you incompetent fools always stop thinking and then moan about it is "lack of information"!@k @v27/20700933.If you are then given information, you start doubting whether the information is true or not by "denying the basis"!"'
11894: 'BEATRICE@r@v27/20700934."Aren''t those convenient?@k @v27/20700935.What clever little words to hide your own incompetence.@k@v27/20700936. I shall eliminate those convenient excuses.@k@v27/20700937. You should thank me, *cackle*!"'
11895: 'Battler@r@v10/20100401."You said they entered through the door, and I denied it, saying that couldn''t happen.@k@v10/20100402. ......Are you saying that''s an evasive answer?"'
11896: 'BEATRICE@r@v27/20700938."That''s right.@k@v27/20700939. So from now on, @v27/20700940.@|@y@c900.@[when I speak the truth, I will use red@]@c.."'
11897: 'Battler@r@v10/20100403."Wh-what is this......?!@k @v10/20100404.Keep explaining!"'
11898: 'BEATRICE@r@v27/20700941."No matter what magic move I use,@k@v27/20700942. you can always keep running away by repeating "lack of information" and "denying the basis"."'
11899: 'BEATRICE@r@v27/20700943."...Even though I would still win in the end that way, it would be extremely boring.@k@v27/20700944. ......Because of that, I think I''ll give you that "information" and "basis" that you desire."'
11900: 'BEATRICE@r@v27/20700945."However, you would probably doubt each word I say.@k@v27/20700946. That isn''t bad in itself.@k@v27/20700947. I also will use every possible move to make you submit.@k@v27/20700948. I don''t dislike our posture of searching out the best moves against each other."'
11901: 'BEATRICE@r@v27/20700949."......But that won''t make a game.@k@v27/20700950. So I set up this rule."'
11902: 'BEATRICE@r@v27/20700951."@|@y@c900.@[Everything I speak in red is the truth@]@c.!@k @v27/20700952.There''s absolutely no need to doubt it!"'
11903: 'Battler@r@v10/20100405."Are you telling me to believe that...?!"'
11904: 'BEATRICE@r@v27/20700953."This is a game between you and me.@k@v27/20700954. In a game, the rules are sacred!!@k @v27/20700955.Those who take them lightly are not qualified to play!!"'
