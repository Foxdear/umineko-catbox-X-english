11931: 'BEATRICE@r@v27/20700995."That definitely will not happen...!@k @|@y@v27/20700996.Either I will surrender, or you will surrender!!@k @v27/20700997.There will be no resolution other than those!!@k @v27/20700998.What happened to that bravery when you said this would be torture for us both?!"'
