11909: 'BEATRICE@r@v27/20700959."<Stop>!!@k @v27/20700960.I will supplement the rule."'
11910: 'BEATRICE@r@v27/20700961."......When I speak the truth, I will use red,@v27/20700962. and when I do, I do not bear the responsibility of establishing that by showing proof!@k @v27/20700963.It is simply a fact and the truth!!"'
11911: 'BEATRICE@r@v27/20700964."The reason is simple.@k@v27/20700965. I carry out all of the crimes with magic.@k@v27/20700966. So for any impossible crime, all I have to do is wave my magic staff before your eyes."'
