11906: 'Battler@r@v10/20100408."Then let''s restart right now, and continue where we left off.@k@v10/20100409. I''ll repeat it again.@k@v10/20100410. "Dad and the rest entered the chapel using a hidden door, or were carried in through one"!"'
11907: 'BEATRICE@r@v27/20700956."Then I shall repeat what I said.@k @v27/20700957.@|@y@c900.@[Regardless of whether they were alive or dead,@]@c.@k@v27/20700958.@|@y@c900.@[ the six definitely entered through the door!@]@c."'
