11942: 'Battler@r@v10/20100439."......................................................"'
11943: 'BEATRICE@r@v27/20701001."......What''s wrong?@k @v27/20701002.You''ve gone silent all of a sudden.@k@v27/20701003. Don''t worry.@k@v27/20701004. Surrender is but a momentary shame.@k@v27/20701005. After that, there is only the pleasure of letting it all go..."'
11944: 'BEATRICE@r@v27/20701006."......*cackle*cackle*cackle*cackle*!!@k @v27/20701007.Come, cry out your resignation.@k@v27/20701008. .........I can''t hear you...@k @v27/20701009.Speak clearly in a loud voice."'
11945: 'Battler@r@v10/20100440.".............You oughta wake up, then.@k@v10/20100441. You just aren''t listening.@k@v10/20100442. ...So I''ll say it once more.@k@v10/20100443. ......I won''t resign.@k@v10/20100444. ......We''re continuing.@k@v10/20100445. I''m resuming the game."'
11946: 'BEATRICE@r@v27/20701010."...............Hoh.@k@v27/20701011. Very well.@k@v27/20701012. It is your turn.@k@v27/20701013. ...*cackle*cackle*."'
11947: 'Battler@r@v10/20100446."I was making the mistake of thinking that this rule you made was your own weapon.@k@v10/20100447. ......However, I''ve realized that it can also become a weapon for me.@k@|@y@v10/20100448. ............It all comes down to this."'
11948: 'BEATRICE@r@v27/20701014."Try it."'
11949: 'Battler@r@v10/20100449_b."I''ve spent the whole time focused on how they entered the locked room of the chapel...@k@v10/20100450. .........That way of thinking was no good."'
11950: 'Battler@r@v10/20100451."......Yeah, it''s no good, it''s no goddamn good at all.@k@|@y@v10/20100452. ......Flip over the chessboard."'
11951: 'Battler@r@v10/20100453.".........That''s right.@k@v10/20100454. The direction of my thinking was backwards.@k@v10/20100455. ......This is how I should think.@k@v10/20100456. ............How was the chapel, which wasn''t a locked room in the first place, made to look like a locked room?"'
11952: 'BEATRICE@r@v27/20701015."Here it is.@k@v27/20701016. ......The thinking technique that humans gave birth to a century ago.@k@v27/20701017. Give it a try, *cackle*cackle*!!"'
11953: 'Battler@r@v10/20100457."...Say this in red for me.@k@v10/20100458. If it''s impossible, then decline.@k@v10/20100459. ...Here I go."'
11954: '@r......This man, ......he thinks he has turned away from his defensive posture?@k@rImpudent...'
11955: 'Battler@r@v10/20100460."I understand that the only way to enter the chapel is through the door, and that there was only one key.@k@v10/20100461. .........But hold it right there.@k@v10/20100462. ...Was that key really handed over to Maria yesterday before noon?"'
11956: 'BEATRICE@r@v27/20701018.".........Long-winded.@k@v27/20701019. Summarize it."'
11957: 'Battler@r@v10/20100463."It''s something like this.@k@v10/20100464. ...We''ve been under the impression that since midday yesterday, the key was unusable.@k@v10/20100465. Therefore, we''ve been under the impression that this was a locked room from midday yesterday until this morning!"'
11958: 'Battler@r@v10/20100466."I want you to clearly state that this isn''t just an impression, but a fact."'
11959: 'BEATRICE@r@v27/20701020."Interesting.@k@v27/20701021. ......So you reason not about the door, but the key."'
