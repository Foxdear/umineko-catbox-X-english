11709: 'Kinzo@r@v01/21500133."............I see.@k@v01/21500134. So it has begun."'
11710: 'Genji@r@v14/21600080."...Yes."'
11711: 'Shannon@r@v15/20500658."................................."'
11712: '@rEven though Kinzo had heard of the six deaths, his emotions did not waver.'
11713: '@rThe expression on his face as he gazed out the window......was a smile, as though his opponent in a chess game had just made a spectacular move.'
11714: '@r...It was unimaginable that this expression could appear on a father who had lost many children at once.'
11715: 'Genji@r@v14/21600081."......Under Rosa-sama''s orders, Gohda and Kanon are calling the police.@k@v14/21600082. Also, she has ordered us to follow your orders, my lord...@k@v14/21600083. ......What shall we do?"'
11716: 'Kinzo@r@v01/21500135."...............This island has already been cut off from the real world.@k@v01/21500136. Phones and the like will be useless."'
11717: 'Genji@r@v14/21600084."Should I have them stop?"'
11718: 'Kinzo@r@v01/21500137."......Until the roulette is finished, what they do to pass the time is up to them.@k@v01/21500138. Let them do as they like."'
11719: 'Genji@r@v14/21600085."............Yes."'
11720: 'Shannon@r@v15/20500659."...Umm......@k@v15/20500660....what should I tell Rosa-sama?"'
11721: 'Kinzo@r@v01/21500139."I say again, what they do to pass the time is up to them!!@k @v01/21500140.They can sing if they want, dance if they want!@k @v01/21500141.They''re even free to hang themselves by the neck or jump into a boiling cauldron!!@k @v01/21500142.Until thirteen people die, they can spend their time as they like.@k@v01/21500143. If they are that bored, then they can spend their time wondering why six times nine is forty-two!!@k @v01/21500144.That''s the answer to the mystery of man and the universe!!"'
11722: 'Shannon@r@v15/20500661."Y-yes...!@k @v15/20500662.My, my apologies......!"'
11723: '@rShannon cowered in fright at this sudden rage.@k ...Genji made a gesture as though telling her not to say too much.'
11724: '@rShannon couldn''t help but regret speaking out of turn...'
11725: 'Kinzo@r@v01/21500145."However.@k@v01/21500146. ...You are also free to do as you wish.@k@|@y@v01/21500147. ......Genji.@k@v01/21500148. And Shannon.@k@v01/21500149. You have done well serving me until today."'
11726: 'Shannon@r@v15/20500663."Y-...your words are too good for me......@k@|@y@v15/20500664. ...But, umm........."'
11727: 'Genji@r@v14/21600086."...............We are furniture who have sworn to serve you, my lord.@k@|@y@v14/21600087. ......At any and all times, we will be waiting by your side.@k@v14/21600088. ......Until the very end."'
11728: 'Kinzo@r@v01/21500150."..................@k@v01/21500151. ............I want to tell the two of you...@v01/21500152.......about everything.@k@v01/21500153. ......Shannon.@k@v01/21500154. I shall be writing a will.@k@v01/21500155. Please copy what I say.@k@v01/21500156. ...Genji, please, my usual drink."'
11729: 'Shannon@r@v15/20500665."Huh...@k@v15/20500666. ...............Ye-............yes......!"'
11730: '@rNanjo had often recommended that Kinzo write a will because of his health, but each time, Kinzo had gone mad with rage.'
11731: '@r......Since that time, "will" had been the word Kinzo took most exception at.'
11732: '@rBecause that word had come out of his own mouth, Shannon couldn''t help doubting her ears for an instant.'
11733: '@rShannon hurriedly prepared the side table and some writing paper.@k Genji also began preparing his usual green devil, just as he was ordered...'
11734: 'Shannon@r@v15/20500667."I am ready."'
11735: 'Kinzo@r@v01/21500157.".........Hmm.@k@v01/21500158. .........Where should I start from?@k@v01/21500159. ...I suppose I could also speak of my life.@k@v01/21500160. ......It would be fun to leave a record of my memorable games."'
11736: 'Kinzo@r@v01/21500161.".........It truly is fun to read the records of old games from over a century ago, ...a journey searching for those players'' thoughts.@k@v01/21500162. .........Then will the score sheet of my life also beckon those in the future to go on a journey searching for my thoughts?@k@v01/21500163. ......Hmph."'
11737: '@rFor a while, Kinzo considered where he should start speaking from, striding all around the room with his hands behind his back...'
11738: 'Genji@r@v14/21600089."My lord.@k@v14/21600090. .........Here."'
11739: 'Kinzo@r@v01/21500164."Good.@k@v01/21500165. Thank you, my friend.@k@v01/21500166. ............Well then.@k@v01/21500167. If I am to speak of my life, I must begin writing from when I met that witch."'
11740: 'Kinzo@r@v01/21500168."...Shannon, copy this.@k@v01/21500169. ......My meeting with BEATRICE took place a long way back.@k@v01/21500170. What year of the Showa era was it...?@k@v01/21500171. ...I think it was toward the end of the war - "'
11741: '@rWe took enough time to regain our calm,@k .........and we each swore to our parents that we''d definitely catch the killer.'
11742: '@rIt would be a lie to say we weren''t still bitter.'
11743: '@r...Even now, if we gave in just a little, we''d feel like going on a rampage like Jessica, and resorting to some kind of violence.'
11744: '@rAccording to what Gohda-san said after he got back, right now, Kanon-kun was looking after Jessica.'
11745: '@r...Apparently, she was still very emotionally high-strung.'
11746: 'Rosa@r@v12/21400304."......I see.@k@v12/21400305. Thank you.@k@v12/21400306. ...Maybe a young kid would be better at understanding a young kid''s feelings.@k@v12/21400307. ......It would probably be better if we left them alone for now."'
11747: 'Nanjo@r@v19/21900099."Rosa-san...@k@v19/21900100. ......There is nothing more we can accomplish by remaining here.@k@v19/21900101. ......The telephones may not be working, but tomorrow the boat will come, and we should be able to reach the police.@k@v19/21900102. We should leave this place as it is for the police''s investigation."'
11748: 'Gohda@r@v17/21700086."...I agree with Doctor Nanjo.@k@v17/21700087. ......It is bad for your health to stay in a place like this for too long.@k@v17/21700088. ......Let us return and make some black tea..."'
11749: 'Rosa@r@v12/21400308.".........Yes.@k@v12/21400309. ...I''m all for that too.@k@v12/21400310. ......Battler-kun, George-kun, are you ready...?@k @v12/21400311.Let''s close this place up.@k@v12/21400312. We should leave this place as it is, for when the police come if nothing else."'
11750: 'George@r@v07/20300440."You''re right.@k@v07/20300441. .........Battler-kun, ...are you alright...?"'
11751: 'Battler@r@v10/20100287."......Yeah.@k@v10/20100288. ...I''ve cried all I can.@k@v10/20100289. .........I''m fine now."'
11752: '@rThe police would surely find some evidence from a thorough investigation.@k ...But we hadn''t been adult enough to wait for that.'
11753: '@r...I had investigated the chapel in my own way, trying to catch the culprit before the police got here.'
11754: '@r......And what I figured out was - frustratingly - nothing.@k@r......I hadn''t been able to find a single hint.'
11755: 'Rosa@r@v12/21400313."Come on, ......let''s go out.@k@v12/21400314. ...Maria, we''re going.@k@v12/21400315. ......Don''t keep staring at it...!"'
11756: 'Maria@r@v13/20400347."......Uu."'
11757: 'Gohda@r@v17/21700089."Come, come, Maria-sama.@k@v17/21700090. Let us return...@k@v17/21700091. It is cold here."'
11758: 'George@r@v07/20300442."............Mother, Father.@k@v07/20300443. ......Thank you for everything.@k@|@y@v07/20300444. ...I will definitely become a man who doesn''t betray your expectations..."'
11759: '@rGeorge spoke his last words of farewell to his parents.'
11760: '@r......After seeing that, Battler followed suit.'
11761: 'Battler@r@v10/20100290."...Dad, Kyrie-san."'
11762: '@rTaken on their own, their faces...made it look like they were sleeping, ......which made it all the more bitter......'
11763: 'Battler@r@v10/20100291.".........Forgive me for leaving you in such a chilly place.@k@v10/20100292. .........I''ll definitely get whoever did this...@k@v10/20100293. Definitely..."'
11764: 'George@r@v07/20300445."......What is......this?@k @v07/20300446.What disgusting graffiti...@k@v07/20300447. Did the killer draw it?"'
11765: 'Nanjo@r@v19/21900103."It is worse than vulgar......@k@v19/21900104. ......This is horrible..."'
11766: '@rWhen the door to the chapel was closed, we learned about that creepy graffiti for the first time.'
11767: 'Gohda@r@v17/21700092."It was like this when we first found it.@k@v17/21700093. ...No doubt it was drawn by the culprit..."'
11768: 'Battler@r@v10/20100294."...The culprit was a witch, so is this a magic circle to summon a demon or something......?"'
11769: 'Maria@r@v13/20400348."Kihihihihihihihihihihi...@k@v13/20400349. This is the seventh magic circle of the sun.@k@v13/20400350. You don''t even know that, huh...@k@v13/20400351. Kihihihihihihihihihihihihihihihi.@k@|@y@v13/20400352. Ouch."@|@y'
11770: 'Rosa@r@v12/21400316."Hey!!@k @v12/21400317.Don''t I always tell you not to make that creepy laugh!!"'
11771: 'Battler@r@v10/20100295."Maria, go on.@k@v10/20100296. ......What does it mean?"'
11772: 'Maria@r@v13/20400353."It''s a magic circle to escape from physical or mental bonds.@k@v13/20400354. ......And the Hebrew written around the circumference says, "The Lord has freed me from my chains.@k@v13/20400355. I will offer to you the sacrifice of thanksgiving, and will call on the name of the Lord"."'
11773: 'George@r@v07/20300448."......Sacrifice of thanksgiving...?@k @v07/20300449.Are you telling me that killing Father and the rest was so that they could be sacrifices for this magic circle...?!"'
11774: 'Rosa@r@v12/21400318."Calm yourself, George-kun...!@k @v12/21400319.This is the killer trying to provoke us.@k@v12/21400320. ...It doesn''t mean anything.@k@v12/21400321. Just thinking about it poisons the heart."'
11775: 'Battler@r@v10/20100297."......And there''s some English written.@k@v10/20100298. ...<Happy Halloween for>...<Maria>.@k@v10/20100299. ......I see.@k@v10/20100300. And the key to open this door was handed over to Maria, ...is that what this is?"'
11776: 'George@r@v07/20300450."...But this is the chapel.@k@v07/20300451. ...Maybe "Maria" doesn''t mean Maria-chan, but the Virgin Mary.@k@v07/20300452. ......In that case, you could read this as a blasphemy against God, in the name of Halloween."'
11777: 'George@r@v07/20300453."They say that witches who make contracts with demons swear to always defile God''s name.@k@v07/20300454. ......In that sense, this really is a witch-like crime."'
11778: 'Rosa@r@v12/21400322."...You sure know a lot.@k@v12/21400323. ......Did you hear that from Maria?"'
11779: 'George@r@v07/20300455."......Yeah, something like that."'
11780: 'Battler@r@v10/20100301."So, the chapel.@k@v10/20100302. ......They went to all the trouble of calling them out to the chapel before killing them...@k@v10/20100303. ............Auntie Rosa,@k@v10/20100304. does this chapel have some special meaning...?"'
11781: 'Rosa@r@v12/21400324."What do you mean, ......special meaning?"'
11782: 'Battler@r@v10/20100305."Well, umm,@k@v10/20100306. ............they carried six human corpses all the way over here, and made these elaborate decorations."'
11783: 'Battler@r@v10/20100307."...We can''t tell whether she called the six of them over here before killing them, or whether she killed them and then carried them over here,@k@v10/20100308. ...but either way, it would take a lot of effort.@k@v10/20100309. .........What reason did the culprit have...@v10/20100310. for wanting six people to die here......?"'
11784: 'Nanjo@r@v19/21900105."......Yes, that is something.@k@v19/21900106. In doing something that elaborate, there would be an extremely high chance that when the police came, some disadvantageous evidence would be found."'
11785: 'Nanjo@r@v19/21900107."......There is no way the culprit failed to notice that.@k@v19/21900108. ...Then, why did the culprit go to all the effort of doing this,@k@v19/21900109. is the question we face..."'
11786: 'Battler@r@v10/20100311."In that case, there''s one question that comes out at this point.@k@v10/20100312. ......What meaning does this place, where we found the six corpses, have?"'
11787: 'Rosa@r@v12/21400325."......This chapel......was important to Father.@k@v12/21400326. ......I''ve been strictly told not to enter it since I was a kid."'
11788: 'Maria@r@v13/20400356."Uu.@k@v13/20400357. ...I came here once too, got yelled at a lot...@k@v13/20400358. Uu..."'
11789: 'George@r@v07/20300456."An important chapel...?@k @v07/20300457.......Does it have some connection to the Ushiromiya main family...?"'
11790: 'Rosa@r@v12/21400327."I don''t know.@k@v12/21400328. ......Father viewed this chapel as very sacred, and he treasured it so much that he had it redecorated several times."'
11791: 'Rosa@r@v12/21400329."...But as you all know,@k@v12/21400330. Father simply has a love of black magic - it''s not that he was a devout believer.@k@v12/21400331. ......I''ve never heard of him coming here to offer his prayers to God."'
11792: 'Gohda@r@v17/21700094."......Even to the best of my knowledge, the Master has never come here.@k@v17/21700095. We even called this the "forbidden chapel", ...umm,@k@v17/21700096. and thought of it as quite eerie, like a haunted house."'
11793: 'Rosa@r@v12/21400332."Even though Father never approached it himself, for some reason, he made the servants clean it several times a year.@k@v12/21400333. ......It felt like he kept it clean all the time so that it could be used at any time."'
11794: 'Battler@r@v10/20100313."And even so, it''s called the "forbidden chapel"...@k@|@y@v10/20100314. ......Ihihi!@k @v10/20100315.This may be indiscreet, but doesn''t that have an interesting ring to it?@k@v10/20100316. Doctor Nanjo, you''re an old friend of Grandfather''s, right?@k @v10/20100317.Ever asked him anything about that?"'
11795: 'Nanjo@r@v19/21900110."............I asked about it long ago, but I forget what he said to evade the issue.@k@v19/21900111. ......That''s right, didn''t he say something like this?"'
11796: 'Nanjo@r@v19/21900112."......Someday, he too might be able to receive a blessing there.@k@v19/21900113. But unless a miracle occurred, that day would never come."'
11797: 'Battler@r@v10/20100318."What does that mean?@k@v10/20100319. .........What goes on in a chapel?@k @v10/20100320.He couldn''t mean his own funeral, right?"'
11798: 'Nanjo@r@v19/21900114."I wouldn''t believe that of Kinzo-san.@k@v19/21900115. ...He was a man much more focused on the now, while he still lives, rather than things after death.@k@v19/21900116. .........However, it does seem that this was the root of all the complexity in the inheritance problem."'
11799: 'Battler@r@v10/20100321."What else is there you do in a chapel?@k@v10/20100322. .........Pray?@k @v10/20100323.Aren''t confessions done in chapels as well?@k @v10/20100324...................Anyway, it sounds suspicious."'
11800: 'George@r@v07/20300458."......I don''t know the reason,@k@v07/20300459. ......but just as Doctor Nanjo said, it seems that in Grandfather''s eyes,@k@v07/20300460. ......the fact that he wouldn''t receive a blessing unless a miracle occurred was a fate set in stone from the time this chapel was constructed."'
11801: 'Rosa@r@v12/21400334."How can you tell that...?"'
11802: 'George@r@v07/20300461."See, ...it''s clearly written up there.@k@v07/20300462. ......Look, up there."'
11803: '@rGeorge-aniki pointed to a relief with rusted gold letters on the arch above the door.'
11804: '@rIt looked like some message was written there in English.@k ...The rust showed that the message had been there since construction.'
11805: 'Battler@r@v10/20100325.".........I''m bad at English.@k@v10/20100326. ......What''s it say...?@k @v10/20100327.......<This door is>...<opened>...<only at>...<probability of>??@k @v10/20100328.Sorry, my English sucks."'
11806: '@rI gave up after I was unable to finish reading the first of the two lines.@k@r...It looked like the others could read it properly.'
11807: 'George@r@v07/20300463."...Umm, I think it went "m", "b", "t", "q", so,@v07/20300464. ...umm, umm... How big was that again... I think...umm...umm,@v07/20300465. ..............."'
11808: 'George@r@v07/20300466."......In any case, this is incredible.@k@v07/20300467. You couldn''t even count close to that with all the fingers on both hands.@k@v07/20300468. It really would be impossible unless a miracle occurred."'
11809: 'Nanjo@r@v19/21900117."......Certainly.@k@v19/21900118. It is very much like how Kinzo-san used to talk, when he would tend to relate everything in terms of gambling."'
11810: 'Battler@r@v10/20100329."What, what, you could all read it?@k@v10/20100330. Someone tell me what it means too."'
11811: 'Maria@r@v13/20400359."Kihihihihihihi.@k@v13/20400360. ...At least learn English.@k@v13/20400361. How did you get into high school without even being able to read this much?@k @v13/20400362.Kihihihihihihihihihi,@k@|@y@v13/20400363. ouch.@k@v13/20400364. Ouch@|@y@v13/20400365.ouch@|@y@v13/20400366.ouch."@|@y'
11812: 'Battler@r@v10/20100331."Mind your own damn business.@k@v10/20100332. So what''s written there?"'
11813: 'Maria@r@v13/20400367."...Roughly it says:@k@v13/20400368. "This door is opened only when a miracle occurs.@k@v13/20400369. You will be blessed only when a miracle occurs"."'
11814: 'Maria@r@v13/20400370."......Grandfather''s sorcery is based on astronomically low probabilities.@k@v13/20400371. ...In other words, the miracle that would open this door......would probably require an incredibly vast magical power.@k@v13/20400372. ......Kihihihihihihihihihihihihihihihihihi.@k@|@y@v13/20400373. Ouch."'
11815: 'Battler@r@v10/20100333."Niiiice, you can shut up now.@k@v10/20100334. Auntie Rosa, you were sending Maria to English classes?@k @v10/20100335.I guess it''s true, you have to start learning English when you''re young."'
11816: 'George@r@v07/20300469.".........The forbidden chapel.@k@v07/20300470. ......Whether or not the witch BEATRICE really was a witch, she''s whispered to have actually existed several decades ago,@k@v07/20300471. ......and been Grandfather''s mistress."'
11817: 'Gohda@r@v17/21700097."This is, umm, just my imagination, but...@k@v17/21700098.......I imagine the Master really did truly love BEATRICE-sama.@k@v17/21700099. However, he was already married, so they couldn''t be united."'
11818: 'Battler@r@v10/20100336."...I see.@k@v10/20100337. .........If the dead BEATRICE could be revived with the magic of a miracle, then now that Grandmother is dead, he could marry her with his head held high.@k@v10/20100338. And he''d marry her in this chapel......... Could it be a fairy-tale story like that?"'
11819: 'Rosa@r@v12/21400335."......I don''t think that sounds so preposterous.@k@v12/21400336. ...It is a well known fact that Father still loves BEATRICE deeply."'
11820: 'Rosa@r@v12/21400337."......Also, even though I said it was creepy,@k@v12/21400338. I get the feeling that the interior of the chapel was quite magnificent.@k@v12/21400339. .........The thought that Father built this chapel in the hopes of having a wedding with his dead mistress actually might not be that unlikely."'
11821: 'George@r@v07/20300472."...By the time he built this chapel, Grandfather probably knew that he would never use it as a church as long as he lived."'
11822: 'George@r@v07/20300473." ......But he prayed for the witch to be revived by some miracle.@k@v07/20300474. And he thought that if that miracle occurred, they could be married here..."'
11823: 'Gohda@r@v17/21700100."......I see.@k@v17/21700101. ...If you think of it that way, this would be a place of utmost significance to BEATRICE-sama as well...@k@v17/21700102. All the while knowing it was a chapel that would never be opened.@k@v17/21700103. ......A story of sad love."'
11824: '@rEven though Gohda-san''s body was even bigger than mine, his words were touching.'
11825: '@r...Everyone was silent, but it seemed that they agreed with that view.'
11826: 'Nanjo@r@v19/21900119."Even though he knew it was a chapel never to be opened,@k@v19/21900120. ......he still probably dreamed of the day that a miracle would occur.@k@v19/21900121. .........Kinzo-san was a great romantic in his younger days.@k@v19/21900122. ...I feel as though I understand him."'
11827: 'Battler@r@v10/20100339."Ihihi.@k@v10/20100340. I wonder.@k@v10/20100341. ......But you all came in four times a year to clean it, right?"'
11828: 'Battler@r@v10/20100342."What do you mean, never opened?@k@v10/20100343. Didn''t we just go in ourselves?@k@v10/20100344. That wasn''t a miracle or anything.@k@v10/20100345. We brought the key, clunk, and we''re in.@k@v10/20100346. That''s all that happened, this is ridiculous."'
11829: 'Rosa@r@v12/21400340."..................Huh?@k @v12/21400341.............Wha?!@k @v12/21400342................Wait, .........what on Earth?"'
11830: 'Battler@r@v10/20100347."Wh-what do you mean "what on Earth"..."'
11831: '@rI thought all I''d done was mess around because I didn''t like the way the atmosphere had turned all sappy.@k ......But Auntie Rosa had suddenly jumped on me, with a really serious face.'
11832: '@rAuntie Rosa''s face grew increasingly pale.@k ...She looked at the magic circle on the door, then at her hand, back and forth, back and forth.'
11833: 'Gohda@r@v17/21700104."Wh-......what seems to be the matter, Rosa-sama...?"'
11834: 'Rosa@r@v12/21400343."Hey, Gohda-san!@k @v12/21400344.The key to this chapel!@k @v12/21400345.Didn''t Genji-san say it?@k @|@y@v12/21400346.He said there was only one!"'
11835: 'George@r@v07/20300475.".....................Huh?@k @v07/20300476............."'
11836: 'Maria@r@v13/20400374."...Kihihihihihihihihihihihihihihihihihihi.@k@v13/20400375. ...It took you all far too long to notice.@k@v13/20400376. Kihihihihihihihihihihihihihihihihi..."'
11837: '@r...When a kid pulls a prank, it sometimes goes unnoticed by the adults, and the kid who did it loses heart.'
11838: '@r......If one of those pranks catches someone later on, it makes that kid really happy.'
11839: '@r......Maria''s celebration just now looked a lot like that...'
11840: 'Gohda@r@v17/21700105."...Y-......yes, that''s right.@k@|@y@v17/21700106. There is only one of those keys.@k@v17/21700107. It is the key to the Master''s treasured chapel, so there is only one, with no duplicates.@k@v17/21700108. ...It is normally kept safe in the key box in the servant room, but..."'
11841: 'Rosa@r@v12/21400347."That''s right.@k@v12/21400348. And Genji-san said that it had gone missing.@k@|@y@v12/21400349. ......Someone stole it, ......put it in that envelope, and handed it to Maria!@k @v12/21400350.And that was yesterday!"'
11842: 'Battler@r@v10/20100348."............What...?@k @v10/20100349.Wait, but then,@v10/20100350. .........that makes no sense, doesn''t it?"'
11843: 'George@r@v07/20300477."...That''s absurd.@k@v07/20300478. .........This is getting strange."'
11844: 'Gohda@r@v17/21700109."Wh-what do you all mean...?@k @v17/21700110.I don''t have a clue what you''re talking about..."'
11845: 'Nanjo@r@v19/21900123."Me neither.@k@v19/21900124. ......Would someone be so kind as to explain it for us...?"'
