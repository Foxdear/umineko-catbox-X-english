11924: 'BEATRICE@r@v27/20700984."You talk too much, you incompetent fool.@k@v27/20700985. Then let me advance more on my earlier move.@k @v27/20700986.@|@y@c900.@[The six definitely entered through this front door!!@]@c."'
11925: 'Battler@r@v10/20100434."That''s screwed up!!@k @v10/20100435.The door was locked, it was impossible to unlock without using that single key, and yet six people entered through this door?!?!@k @v10/20100436.How did they do it?!!@k @v10/20100437.Magic, you say?!@k@v10/20100438. Damn it, damn it damn it damn it damn it damn it!!!"'
11926: 'BEATRICE@r@v27/20700987."Wahahahahahahaaah!!@k @v27/20700988.Have we already exposed a human''s limits?"'
11927: 'BEATRICE@r@v27/20700989."Then shout <resign>!!@k @v27/20700990.It is customary for the surrendering player to shout that and topple their king.@k@v27/20700991. Come on, do you give up?!@k @v27/20700992.Then proclaim your submission, and kneel, as if toppling your king!!"'
11928: 'BEATRICE@r@v27/20700993."And then you shall kiss my shoes!@k @v27/20700994.There''s no greater joy than forcing a man like you to lick my shoes, *cackle*cackle*cackle*cackle*kakakakakakakakakakaka!!"'
11929: '@r.........Damn iiiiiiiiit...@k It''s no good, no good, no good...@k@rSo I can''t win against the witch...?!'
