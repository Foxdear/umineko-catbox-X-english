10257: 'Jessica@r@v04/20200392."...Maria hasn''t come back.@k@v04/20200393. ......I wonder if she''s being scolded by Auntie Rosa again."'
10258: '@rEver since they had met Maria in the airport, she had constantly been making a huge fuss about Halloween.'
10259: '@r...But it seemed she had cut loose a little too much,@k and acted a little too boisterous on the plane, on the boat, and during lunch, because Rosa had warned her several times.'
10260: '@rIn times like that, Auntie Rosa would rarely scold her in front of people.@k@r...More commonly, she would call Maria into the shadows, and scold her when they were alone.'
10261: '@rSo since Maria had been called off somewhere, they thought she must be getting scolded.'
10262: '@rWhen they looked at the clock, they realized that it was almost six.@k@rThey couldn''t really imagine that Maria had been being scolded this whole time.'
10263: '@rPerhaps it had come time for some anime she watched every week to start, or something.@k She had probably just decided to stay in the mansion''s parlor.'
10264: 'Shannon@r@v15/20500441."It could be that Battler-sama has woken up and they are playing together."'
10265: 'George@r@v07/20300244."Well, Maria-chan must have thought of Battler-kun as sort of a new friend.@k@v07/20300245. ...I''m sure she had tons of fun when she played Halloween with Battler-kun at the airport."'
10266: 'Jessica@r@v04/20200394."Battler was messing around a lot himself.@k@v04/20200395. That dude''s gotten big, but he hasn''t changed a bit on the inside from how he used to be."'
10267: 'Shannon@r@v15/20500442."That''s true.@k@v15/20500443. ...I get the feeling that Battler-sama was gracious enough to remain as he was six years ago."'
10268: 'George@r@v07/20300246."Shannon, you remember how Battler-kun was six years ago?"'
10269: 'Shannon@r@v15/20500444."Yes.@k@v15/20500445. Because he was, well, very energetic.@k@v15/20500446. *giggle*."'
10270: 'George@r@v07/20300247."I also remember how the four of us used to play six years ago.@k@v07/20300248. Shannon acted a lot like a big sister."'
10271: 'Jessica@r@v04/20200396."Yeah.@k@v04/20200397. I get the feeling she was more level-headed back then.@k@v04/20200398. Ahahahaha!"'
10272: 'Shannon@r@v15/20500447."Ba-...back then I, umm, ......didn''t know my place, so...@k@v15/20500448. Umm, I must apologize for all my poor conduct..."'
10273: 'George@r@v07/20300249."......There''s no need for all those professional manners.@k@|@y@v07/20300250. Your work aside, when you''re taking your break like you are now, I''d like it if we could all be friendly together like we were back then."'
10274: 'Jessica@r@v04/20200399."Yeah, totally.@k@v04/20200400. ...There''s no reason why you can''t separate the servant Shannon from the off-duty Sayo.@k@v04/20200401. ......You aren''t a slave, you''re just working a job as a servant, right?"'
10275: 'Jessica@r@v04/20200402.".........I think of you, Shannon,@v04/20200403. ...no, Sayo, as my oldest friend."'
10276: 'Shannon@r@v15/20500449."............Thank you very much, Milady."'
10277: '@rIt seemed that Shannon understood what lurked under Jessica''s words.@k@r......Because she had heard a little bit from Jessica and Kanon about what had happened between them.'
10278: 'George@r@v07/20300251.".................."'
10279: '@rApparently, George had also been informed about that, more or less.'
10280: '@rGeorge approached the window, and looked up at the darkening rainy sky...'
10281: 'Shannon@r@v15/20500450."...Kanon-kun is still young, and I think in some ways he tries a little too hard to be mature in his way of thinking."'
10282: 'Jessica@r@v04/20200404."Uhh, hahahaha...@k@v04/20200405. C''mon, quit it already."'
10283: 'Jessica@r@v04/20200406."Well, umm, it''s my fault too, I think part of it was I got sucked in by the atmosphere...@k@v04/20200407. And, umm, ...maybe after looking at you two, umm, I got a little jealous, and started feeling a little rushed, there might have been a bit of that, too..."'
10284: 'Jessica@r@v04/20200408."......Who, who cares about me, anyway?@k@v04/20200409. More importantly, how''s it going between you two?@k@v04/20200410. Looks like it''s going pretty good, eh?@k @v04/20200411.Eheheh!"'
10285: 'Shannon@r@v15/20500451."Err, ......I, ...I wonder..."'
10286: 'George@r@v07/20300252."Yes.@k@v07/20300253. It''s going very well."'
10287: '@rShannon was lost for words, her face red, while George answered brightly and immediately.@k@rThat carefree attitude made it obvious that their relationship was proceeding so perfectly it would make anyone envious.'
10288: 'Jessica@r@v04/20200412."Tch, I''m jealous.@k@|@y@v04/20200413. ......Does that mean Shannon''s gonna be resigning and cutting up a cake pretty soon?"'
10289: 'Shannon@r@v15/20500452."I, I wonder...@k@v15/20500453. I don''t, umm......"'
10290: 'George@r@v07/20300254."I wonder, right?@k @v07/20300255.How could I know?"'
10291: '@rGeorge laughed like he was being mean and drew closer to Shannon.@k@r...It was probably the way they usually flirted when they were alone.@k@rJessica could only smile awkwardly and say "yes, yes, thank you, that''s enough".'
10292: 'George@r@v07/20300256."I have a dream.@k@v07/20300257. It isn''t only my ambition to become the leader of my own domain in business.@k@v07/20300258. I also have a dream to build a family together with a partner I can spend my life with."'
10293: 'George@r@v07/20300259."...I want two kids at the very least.@k@v07/20300260. And I''d like to do some sports that the whole family could do together.@k@v07/20300261. And many more things besides that.@k@v07/20300262. I often talk with Shannon about that kind of thing.@k@v07/20300263. .........Although every time I talk about that sort of thing, Shannon always laughs and says I''m getting ahead of myself."'
10294: 'George@r@v07/20300264."...For some reason, even at the age I am now, I already find myself thinking about my retirement and settling down.@k@v07/20300265. ......With my healthy grown kids, and grandchildren running around.@k@v07/20300266. About how nice it will be to spend my final years at a slow pace, surrounded by that, and together with Shannon forever."'
10295: 'Jessica@r@v04/20200414."You''re definitely getting ahead of yourself.@k@|@y@v04/20200415. ......But, how should I say it, it sounds like you, George nii-san."'
10296: 'Shannon@r@v15/20500454."Being surrounded by a family like that would probably be so wonderful.@k@v15/20500455. ......The ideal family that I painted in my mind when I was younger was something like that."'
10297: '@r...To Shannon, who had been raised in a welfare institute, that harmonious image of a family was probably something she yearned after.'
10298: '@r......And George, who promised that he would definitely grant that wish for her, was surely a fitting person for her to spend her life with...'
10299: '@rShannon was an important friend to Jessica.@k ......George was surely the one most fit to entrust that friend''s future to.'
10300: 'Jessica@r@v04/20200416."Well, I don''t want to throw cold water on you guys,@k@v04/20200417. ......but Uncle Hideyoshi aside, what''s gonna happen with Auntie Eva?@k @v04/20200418.Won''t it be tough to convince her?"'
10301: 'Shannon@r@v15/20500456."........................"'
10302: 'George@r@v07/20300267."Ahahahaha.@k@v07/20300268. There''s no reason for anyone to worry about something like that.@k@|@y@v07/20300269. ......No one can influence my choice of partner.@k@v07/20300270. I will make Shannon happy.@k@v07/20300271. Whose permission do I need?"'
10303: 'Jessica@r@v04/20200419."......Whooooa.@k@|@y@v04/20200420. George nii-san, that was cool...@k@v04/20200421. I can''t believe you can say something so embarrassing out loud.@k@v04/20200422. I thought you didn''t use to be that kind of character."'
10304: 'George@r@v07/20300272."Leave a boy for three days and you''ll hardly recognize him, after all.@k@|@y@v07/20300273. ......Even I grow up.@k@v07/20300274. ...I plan to study more and more, to grow to be a suitable man who can make Shannon happy."'
10305: '@rIt seemed that perhaps George had some kind of awareness of how embarrassing the words coming out of his mouth were.@k His face turned very slightly red, and he scratched his head.'
10306: 'Shannon@r@v15/20500457."............George-san."'
10307: 'George@r@v07/20300275."It''s alright.@k@v07/20300276. I''m sure Mother will be difficult, but you can leave that to me.@k@v07/20300277. I''ll show you that I can make the whole family accept you as my partner."'
10308: 'Jessica@r@v04/20200423."Awesome...@k@|@y@v04/20200424. I''m jealous of you Shannon, seriously!"'
10309: 'Shannon@r@v15/20500458."......I-if you will go so far,@v15/20500459. .........then I''m, I''m very grateful..."'
10310: 'Jessica@r@v04/20200425."Wait a sec, ...I''m starting to feel like a third wheel here.@k@v04/20200426. Maybe it''s better I leeeeave?"'
10311: '@rSmiling awkwardly, Jessica stood up from the bed she had been sitting on,@k and at that very moment, the phone rang.'
10312: '@rBefore Jessica picked up the receiver, wondering what they wanted, Shannon looked at the clock and was taken aback.@k ......It seemed that she had taken too long on her break.'
10313: 'Shannon@r@v15/20500460."I, I am sorry...!@k @v15/20500461.I forgot it was time for work...!@k @v15/20500462.I-if you will excuse me...!"'
10314: '@rAt the same time that Jessica picked up the phone, Shannon began dashing out of the room.'
10315: 'George@r@v07/20300278."Ah, Shannon!@k @v07/20300279..........Again, same time, same place."'
10316: 'Shannon@r@v15/20500463."Ye-.........yes.@k@|@y@v15/20500464. ...Ex-excuse me!"'
10317: 'Jessica@r@v04/20200427."Hello, it''s Jessica.@k@v04/20200428. .........Ah, Genji-san.@k@v04/20200429. Yes, Shannon is heading your way as we speak.@k@v04/20200430. We held her up, I''m afraid.@k@v04/20200431. Please don''t scold her.@k@v04/20200432. Yes, okay."'
10318: 'George@r@v07/20300280."I see.@k@v07/20300281. So it will be time for dinner to be prepared soon."'
10319: '@rMany plates were lined up on the counter in the kitchen, and preparations for dinner were proceeding steadily.'
10320: '@r......The number of plates that were lined up there...@k......was 19.@k@rThat number was one more than were lined up during the family conference every year.'
10321: 'Gohda@r@v17/21700015."I can''t accept it...!@k @v17/21700016.Why can''t I deliver it directly?!"'
10322: '@rGohda-san was flaring up at Genji, paying no heed to the pot that was boiling over.'
10323: '@rThe Master enjoys having his food alone in his study, so the food must be set out in the study.@k Of course, this is nothing new, you understand.'
10324: '@rGohda-san would really like to set the table for the Master with his own hands, as he puts his heart and soul into his cooking.'
10325: '@r......But the Master had imposed a strict rule that none but the servants bearing the crest of the Golden Eagle could enter his study.'
10326: '@r.........So while Gohda-san could greet the Master from outside the study,@k not once had he been granted the honor of carrying his cooking into the study.'
10327: '@rGohda-san was always unsatisfied with this.@k@r...Of course he knows he is a newcomer in terms of years of service.'
10328: '@rHowever, he has accumulated plenty of experience from his previous jobs, and he is strongly confident that he would be able to conduct himself properly, even in front of Kinzo, in a way that would not insult him.'
10329: '@rAnd yet, just because he is not permitted the Golden Eagle, he still hasn''t been blessed with this honor.'
10330: 'Kumasawa@r@v18/21800036_1.......You can probably imagine what damage that has done to his pride.@k@v18/21800036_2. You might think that tonight is a mere resurgence of that old argument, but it isn''t.'
10331: 'Kumasawa@r@v18/21800036_3.Because tonight, there is a person other than the Master who wants their food carried to their room.'
10332: 'Kumasawa@r@v18/21800036_4.Apparently, this person is a very rare and honored guest, and there has been a strict order to treat this person in the same manner as the Master, the family head.'
10333: 'Kumasawa@r@v18/21800036_5.Gohda-san must have wanted to earn some points by serving this honored guest with his own hands.'
10334: 'Kumasawa@r@v18/21800036_6.Because he is a person of strong vanity.@k@v18/21800036_7. If he isn''t qualified to serve the Master, then at least a guest of the same rank...'
10335: 'Kumasawa@r@v18/21800036_8.He simply couldn''t make time during lunch, so Kanon-san had gone for him.@k@v18/21800036_9. ...Therefore, he truly desired to serve tonight''s food personally - the best dinner of the year.'
10336: 'Kumasawa@r@v18/21800036_a.But Genji-san had had a problem with that.'
10337: 'Kumasawa@r@v18/21800036_b_b.......Something about how Gohda-san didn''t have the One-winged Eagle.'
10338: 'Kumasawa@r@v18/21800036_c..........After being once again scolded that he wasn''t qualified, Gohda-san had lost his patience.'
10339: 'Kumasawa@r@v18/21800036_d.Ahh, how heartrending, Gohda-san...'
10340: 'Kumasawa@r@v18/21800036_e.I cannot do anything more than watch like this from the shadows...'
10341: 'Gohda@r@v17/21700017."Kumasawa-san, if you have enough free time to dawdle around, please prepare the dining hall.@k@|@y@v17/21700018. Is the tablecloth ready?!"'
10342: 'Kumasawa@r@v18/21800037."Hoh-hoh-hoh-ho... Oh my, my apologies..."'
10343: '@rWhen it became her turn to bear the brunt, Kumasawa softly disappeared into the hall.'
10344: 'Genji@r@v14/21600044."BEATRICE-sama is of exactly the same rank as the Master.@k@v14/21600045. ......We must respect the same rules that we respect for the Master."'
10345: 'Genji@r@v14/21600046."......Gohda, you will devote your attention entirely towards the task you have been given, and attend to the family..."'
10346: 'Gohda@r@v17/21700019."I don''t mind if it''s you, Genji-san, but is it really alright to let a child like this go to such a guest?!@k @v17/21700020.If she made some blunder, it would be quite rude."'
10347: 'Gohda@r@v17/21700021."I know that they have served here for a long time, but it''s not as though they have undergone a proper apprenticeship.@k@v17/21700022. If you will allow me to speak freely, they do not have the proper grounding to entertain guests!"'
10348: 'Shannon@r@v15/20500465."........................"'
10349: '@rGohda spoke bluntly, even though Shannon was waiting right there in the kitchen.'
10350: '@rShannon was the one who Genji had ordered to carry the food to BEATRICE''s room.@k ......By the ranking system among the servants permitted the Golden Eagle, Shannon was indeed the second highest ranked.'
10351: '@r...If the highest ranked, Genji, went to set the table in Kinzo''s room, then it fell to Shannon to set the table in BEATRICE''s room.'
10352: '@rGohda''s pride was always horribly injured when he was confronted with this ranking system.@k ...In times like that, he would speak out bluntly and rudely about Shannon and Kanon.'
10353: '@rGohda kept raising example after example of Shannon''s past failures, making a ruckus about how this was wrong and that was wrong.'
10354: '@rAs Shannon listened to this with her head hung in shame, she heard Kanon''s voice from behind her.'
10355: '@r...Kanon had been listening from a blind spot, leaning against the hallway side of the wall near the entrance to the kitchen.@k ...He probably knew that if he entered the kitchen, sparks would start to fly his way.'
10356: 'Kanon@r@v16/20600267."............Let him rant.@k@v16/20600268. He''s a horrible man."'
10357: 'Shannon@r@v15/20500466."......B-but, this helps me to build up a grounding on how to entertain someone.@k@v15/20500467. ......Gohda-san has learned a lot, so what he has to say is very..."'
10358: 'Kanon@r@v16/20600269."Hmph.@k@v16/20600270. ......Nee-san, you sure are nice."'
10359: 'Shannon@r@v15/20500468."......More importantly,@k@v15/20500469. ............is the guest in the VIP room...@v15/20500470.really BEATRICE-sama, as they say?"'
10360: 'Kanon@r@v16/20600271."...Yes.@k@v16/20600272. .........I met her when I was sent to set the table for her during lunch.@k@v16/20600273. ...There''s no mistake - it''s her."'
10361: 'Shannon@r@v15/20500471."Re-really?@k@v15/20500472. Was she doing well?"'
10362: 'Kanon@r@v16/20600274."........................"'
10363: '@rKanon remembered that he and Shannon had different impressions of BEATRICE.@k To Shannon, BEATRICE was a cupid of love, who had granted her magic to create her relationship with George.'
10364: '@rJudging by her happy expression,@k ...it looked like she couldn''t wait to inform BEATRICE of how her relationship with George had progressed.'
10365: '@r......However, Kanon already knew.@k@rThat witch had come here with a terrifying goal in mind.'
10366: '@r......That vague witch, in the past only visible to them, had now walked in openly through the front door,@k and had revived enough that they could now carry food to her.'
10367: '@r...In the past, when she had disappeared from in front of Kanon...@k@r...the witch had said something about how her own power was still weak.'
10368: '@r.........Now that the witch could appear openly like this, did that mean that she had finally returned to her former power?'
10369: '@rAnd she had said.@k .........She had said clearly that she had sown the seeds of love with the knowledge that it would fail.'
10370: '@rShe had said also.@k .........She had said clearly that the day had finally come when the door to the Golden Land would be opened.'
10371: 'Kanon@r@v16/20600275.".........Shannon.@k@v16/20600276. ...She will perform some bizarre ritual with the Master, ...and will surely do something unimaginably horrible.@k@v16/20600277. ......And no one can resist that."'
10372: 'Shannon@r@v15/20500473."What are you talking about......?"'
10373: 'Kanon@r@v16/20600278."She came here...@k@|@y@v16/20600279.as the Master requested, so that the door to the Golden Land would open, and so that everything would be returned to the Golden Land.@k@|@y@v16/20600280. She said that to me clearly!"'
10374: 'Shannon@r@v15/20500474."................................."'
10375: '@rIn the past,@k ......the two of them, as furniture working for Kinzo, had been told what the opening of the door to the Golden Land meant.'
10376: '@rTherefore, even without asking a single question in response, Shannon understood everything.@k@r.........So, ...she grew deeply hopeless.'
10377: '@r...Something tore at Kanon''s heart as he saw her expression twist with grief...'
10378: 'Shannon@r@v15/20500475."............How could...@k@v15/20500476. .........Why, ...why now............"'
10379: 'Kanon@r@v16/20600281."......Didn''t I tell you?@k@v16/20600282. We are furniture!@k @v16/20600283.......Because you acted like a human, because you loved, .........you can''t obediently accept the day when our service is over...!"'
10380: 'Shannon@r@v15/20500477."..................At one time, I used to wish that this day would come.@k@v15/20500478. ......But it never came after so much time...@k@v15/20500479. ......I didn''t know how long we would have to be tormented as furniture...@k@v15/20500480. .........So I thought.@k@v15/20500481. ...I thought that day of rest wouldn''t come for all eternity."'
10381: 'Kanon@r@v16/20600284.".........I thought that too!@k @v16/20600285.But I believed that it would definitely come someday!@k @v16/20600286.So I never forgot that I am furniture!@k @v16/20600287.But Nee-san, you forgot that!"'
10382: 'Shannon@r@v15/20500482."..................It''s......my fault, isn''t it......@k@v15/20500483. .........Mine......"'
10383: 'Kanon@r@v16/20600288."Yeah, it''s your fault, Nee-san.@k@v16/20600289. ......If only you hadn''t known love...@k@v16/20600290. ......We would both be happy that this day has finally come!@k @v16/20600291.You built up meaningless attachments!@k@r@v16/20600292. Even though it was a world that you would definitely have to leave!!"'
10384: 'Shannon@r@v15/20500484."...............Will the ritual...begin tonight...?"'
10385: 'Kanon@r@v16/20600293."...Yes.@k@v16/20600294. ...............Also, she said this to me.@k@v16/20600295. ...Tonight, George-sama will probably give you an engagement ring, Nee-san."'
10386: 'Shannon@r@v15/20500485."........................"'
10387: '@rThat was a fact.@k ......George should have snuck in an engagement ring in his pocket today.@k ......And surely, he would hand it over tonight.'
10388: 'Kanon@r@v16/20600296."......She joined you together, planning to use you and George-sama as the sacrifices for the second twilight.@v16/20600297. ...Understand?@k @v16/20600298.Nee-san, she took advantage of you by tempting you!"'
10389: 'Shannon@r@v15/20500486."............So that was it.@k@v15/20500487. ......I never thought of that."'
10390: 'Kanon@r@v16/20600299."But she told me.@k@v16/20600300. ...She promised that if you don''t accept the engagement ring tonight, she won''t choose you as a sacrifice.@k@v16/20600301. ............I think that our chances of being able to go to the Golden Land together are very slim."'
10391: 'Kanon@r@v16/20600302."There will be thirteen people sacrificed.@k@v16/20600303. Only five will be left alive.@k@v16/20600304. ...The chances of us both being a part of that group are really slim.@k@v16/20600305. ......However, if you at least can take advantage of that promise, those chances rise higher!@k @v16/20600306.I want to take that bet!"'
10392: 'Kanon@r@v16/20600307."Our salvation is in the Golden Land.@k@v16/20600308. If we can make it that far, we can become human.@k@v16/20600309. And I want to walk through life as a human, together with you, Nee-san...!@k @v16/20600310.If we do that, we might even be able to achieve...@v16/20600311....true love!"'
10393: 'Shannon@r@v15/20500488."..............................@k@v15/20500489. ...We used to dream about being able to go to the Golden Land, didn''t we?@k@v15/20500490. .........If we go there, any wish will be granted.@k@v15/20500491. .........We will be saved from this pain.@k@v15/20500492. ............We believed that."'
10394: '@rHowever, in this ritual, only a few people, chosen by fate and chance, would be invited to the Golden Land.@k ......Everyone else would lose their life as a sacrifice midway through the ceremony.'
10395: '@rBut in the past, Shannon and Kanon had thought...@kthat whether they reached the Golden Land or were made sacrifices, it would be all the same, because they would be released from their duties as furniture either way.'
10396: '@r......So, in short, the ritual had been something that would definitely grant release to furniture like them.'
10397: 'Kanon@r@v16/20600312."I don''t like it.@k@v16/20600313. ......Together with you, I want to take back all the hard times we had.@k@v16/20600314. I won''t become a sacrifice.@k@v16/20600315. You and I will remain alive.@k@v16/20600316. And we''ll reach the Golden Land together."'
10398: 'Kanon@r@v16/20600317."............So I won''t let you become the sacrifice for the second twilight!@k @v16/20600318.Please, Nee-san!@k @v16/20600319.Don''t accept that man''s ring!@k @v16/20600320.If you don''t accept it, she promised not to select you as a sacrifice!!"'
10399: 'Shannon@r@v15/20500493.".....................That''s......something I can''t do.@k@v15/20500494. ......Tonight''s ring is very special.@k@v15/20500495. ......My heart...won''t permit me to not accept it."'
10400: 'Kanon@r@v16/20600321."Nee-san...!@k @v16/20600322.The witch decides the ritual sacrifices arbitrarily!@k @v16/20600323.That witch has promised to overlook you at least, Nee-san!!@k @v16/20600324.You at least will definitely be able to go to the Golden Land!"'
10401: 'Shannon@r@v15/20500496."......Me at least?@k @v15/20500497.What about you, Kanon-kun?"'
10402: 'Kanon@r@v16/20600325."The witch''s game......is enough for me.@k@v16/20600326. ...I''ll slip through her evil hand.@k@v16/20600327. .........I am not powerless.@k@v16/20600328. I''ll grab that small chance and I won''t let go..."'
10403: 'Shannon@r@v15/20500498."............................................."'
10404: 'Kanon@r@v16/20600329."After all, our lives are temporary, aren''t they?@k@v16/20600330. ...In order to begin our real lives,@v16/20600331. ......let''s make it to the Golden Land.@k@v16/20600332. And...@v16/20600333.let''s gain our humanity."'
10405: 'Kanon@r@v16/20600334."...............And then...@k@v16/20600335....maybe, like you, Nee-san,@v16/20600336. ......I''ll be able to know love.@k@v16/20600337. Maybe I won''t have to call myself furniture,@v16/20600338. .........and make people cry anymore......"'
10406: 'Shannon@r@v15/20500499.".........Kanon-kun............"'
10407: 'Kanon@r@v16/20600339."I...@v16/20600340....don''t want to be furniture anymore......!@k @v16/20600341.......I''m gonna...@v16/20600342....become human......@k@v16/20600343. ...No more pain,@v16/20600344. ......I''m gonna end it all.........!"'
10408: 'Shannon@r@v15/20500500."............................................."'
10409: '@rThere were tears in Kanon''s eyes...'
10410: '@rIt had taken Kanon until now to notice.@k@r......Shannon hadn''t been the only one to know and suffer the taste of love.'
10411: '@rHe had too.'
10412: '@rThe tears Jessica had shown him that day,@k ......and her painful smiles on all the days since as she tried to smooth things over and brighten her mood...@khad slowly wrought some kind of change on Kanon''s heart without him knowing it...'
10413: 'Genji@r@v14/21600047.".........Shannon!@k @v14/21600048.I have been calling you for ages."'
10414: '@rShannon snapped to reality at the sudden sound of Genji''s voice.@k@rApparently, she had been called for repeatedly.@k@rShe hurriedly answered.'
10415: '@r......When she turned around, Kanon had disappeared.@k@r......It seemed he didn''t feel like showing his tears to anybody...'
10416: 'Shannon@r@v15/20500501."Ye-yes.@k@v15/20500502. I''m sorry for being distracted..."'
10417: 'Genji@r@v14/21600049."I had Kanon handle lunch, but properly speaking, as the next in rank after me, you should have been the one to take it to her.@k@v14/21600050. .........BEATRICE-sama is the most honored guest of this house.@k@v14/21600051. There is no more honored guest than her.@k@v14/21600052. ......Please think of her as another master of the mansion and be polite."'
10418: 'Gohda@r@v17/21700023."...I must impress upon you once again - please be very careful not to make any blunders.@k@v17/21700024. It is quite painful for me to entrust this to someone inexperienced as yourself, but there''s nothing we can do about the house''s rules.@k@v17/21700025. ......I am sincerely counting on you."'
10419: '@rGohda had officially agreed, but he threatened Shannon with an expression that told her that he definitely wouldn''t forgive any mistakes.'
10420: '@rShannon, too, thought that Gohda should do it if he wanted to that much,@k ......but considering it as her responsibility as one who had been granted the Golden Eagle, she had to give up.'
10421: '@r......Besides.@k ...I wanted to meet BEATRICE.@k@rWhat will I talk about?@k What will I ask?@k ...I don''t know.'
10422: '@rWill I show gratitude?@k Or else, grief?@k@rOr else, ...what?@k ...I don''t know.'
10423: '@rShannon loaded the witch''s food onto the serving cart, and left the kitchen with a slow gait...'
10424: '@rThe person knocking was Krauss.'
10425: 'Krauss@r@v02/20800064."Father.@k@v02/20800065. Today is our annual family conference.@k@v02/20800066. Haven''t the siblings gathered here to get a glance of you, Father?"'
10426: 'Kinzo@r@v01/21500065."Aaah, be silent!!@k @v01/21500066.I have told you I won''t leave!@k @v01/21500067.I imagine that you are there, Genji!!@k @v01/21500068.Why haven''t you had my food brought here as I ordered you to?!!"'
10427: '@rKinzo screamed through the door.@k@r...Genji was waiting behind Krauss.'
10428: 'Genji@r@v14/21600053."......Your meal has been prepared so that it may be carried to the study.@k@v14/21600054. ...However, Krauss-sama wishes for you to go downstairs tonight..."'
10429: 'Krauss@r@v02/20800067."Father.@k@v02/20800068. I don''t mean every day.@k@v02/20800069. Even if it''s just for tonight, won''t you gather together with your family?"'
10430: 'Kinzo@r@v01/21500069."Who are you calling family!!@|@y@k @v01/21500070.When did you start calling those vultures who wait for me to collapse and die family?!@k @v01/21500071.When did you start calling rotting, gushing maggots FAMILY?!!"'
10431: 'Krauss@r@v02/20800070."...........................@k@v02/20800071. ...My, my."'
10432: '@rKrauss shrugged at this answer which he had half-expected.'
10433: 'Kinzo@r@v01/21500072."Genji, carry the meal here as you were told!!@k @v01/21500073.Why don''t you listen to what I say?!!@k @v01/21500074.Why?!@k @v01/21500075.WHY?!!"'
10434: 'Krauss@r@v02/20800072."......Genji-san.@k@v02/20800073. I will leave the rest to you.@k@v02/20800074. ...My voice will no longer reach him."'
10435: '@rKrauss gave his head a small shake, and quickly turned his back on the door to the study.'
10436: '@r......He had only called out for his siblings'' sake, knowing it was useless.'
10437: '@rAfter Genji watched Krauss go down the stairs, he called again through the door.'
10438: 'Genji@r@v14/21600055."...My lord.@k@v14/21600056. We have finished preparations for the meal to be carried here.@k@v14/21600057. .........What about the serving for Doctor Nanjo?"'
10439: '@rNanjo was also in the study.@k Because Kinzo had strongly pestered him about resolving their long-lasting chess game, Nanjo had been Kinzo''s opponent since before evening.'
10440: '@rNanjo had announced as a doctor that Kinzo''s days were numbered.@k@r...In that situation, if Kinzo pestered him about finishing a chess game while he was still alive, Nanjo couldn''t refuse.'
10441: '@rKinzo was thinking deeply about his move, concentrating more than usual.@k ......It had been Kinzo''s turn for quite some time, and Nanjo, who was tired of waiting, had started randomly pulling out grimoires that he couldn''t understand and skimming through them.'
10442: 'Nanjo@r@v19/21900026.".........Kinzo-san.@k@v19/21900027. You won''t think of a good move just by folding your arms and sitting in front of the board.@k@v19/21900028. I wonder if it wouldn''t be good to take a break and refresh our minds...?"'
10443: 'Kinzo@r@v01/21500076."Be silent.@k@v01/21500077. ......Hmmm.@k@v01/21500078. ......That should be good enough for defense.@k@v01/21500079. Will that hole be penetrated by the bishop or the knight...?@k@v01/21500080. ............nnnnnnnn..."'
10444: '@rToday, Kinzo was insistent on a strong defense.'
10445: '@r......Normally, Kinzo''s motto was that offense was the best defense.@k However, today was completely the opposite.'
10446: 'Nanjo@r@v19/21900029."............I am also hungry.@k@v19/21900030. Shall we suspend the game here?@k@v19/21900031. And I''ve used my head so much without a break that I''m already feeling dizzy.@k@v19/21900032. ......Any more of this might limit my ability to make my best moves."'
10447: 'Kinzo@r@v01/21500081."...That is a problem.@k@v01/21500082. ............In chess, both players must always make their best moves.@k@v01/21500083. ...Other moves are painful to understand, and ruin a game that is about reading thoughts.@k@v01/21500084. ...That considerably reduces our enjoyment."'
10448: '@rKinzo sighed deeply, and finally shifted his gaze away from the board.'
10449: '@rChess needs an opponent.@k ...That opponent was tired and suggesting to suspend the game, so what else could be done...'
10450: 'Nanjo@r@v19/21900033."It is true that the goal of chess is for both players to aim for victory and make the best moves possible in order to achieve that.@k@v19/21900034. ...It is an intellectual game of being able to read each other."'
10451: 'Nanjo@r@v19/21900035."......But Kinzo-san, are you forgetting that there is another goal separate from victory?"'
10452: 'Kinzo@r@v01/21500085."............What?@k@v01/21500086. What goal could there be other than victory?"'
10453: 'Nanjo@r@v19/21900036."Hahahaha......@k@v19/21900037. It surprises me you would forget even that.@k@v19/21900038. ...Through chess, you get to spend some fun time with your friend,@k@v19/21900039. you see."'
10454: 'Kinzo@r@v01/21500087."Ah,@k@v01/21500088. ......you got me.@k@v01/21500089. I believe those are words I said to you a long time ago.@k@v01/21500090. ............I shall have to concede that."'
10455: '@rKinzo, who normally wore a frown, surprisingly relaxed his face and laughed.@k ...Nanjo felt like he had been reunited with a close friend he hadn''t seen in a long time.'
10456: 'Nanjo@r@v19/21900040."That''s how it is.@k@v19/21900041. Now that I''ve taken a shot back at you, what do you think?@k@v19/21900042. Will you go down to eat with me?@k @v19/21900043.What do you say about discussing Kasparov''s middlegame over some coffee?"'
10457: 'Kinzo@r@v01/21500091.".................................@k@v01/21500092. ...A good plan, but I will refrain.@k@v01/21500093. ......I can no longer leave this room.@k@v01/21500094. ...Because the ritual has begun."'
10458: 'Nanjo@r@v19/21900044."............Is that so?@k@v19/21900045. Well, my stomach is growling.@k@v19/21900046. ...I will go downstairs.@k@v19/21900047. Any time you feel like it - "'
10459: 'Kinzo@r@v01/21500095."Nanjo.@k@v01/21500096. ............Thank you."'
10460: 'Nanjo@r@v19/21900048."......Oh, what could you be thanking me for?"'
10461: 'Kinzo@r@v01/21500097."...We didn''t resolve our chess match.@k@v01/21500098. ......However, it seems that I have succeeded in that goal of chess which I forgot.@k@v01/21500099. It seems that was just as important as checkmate."'
10462: 'Nanjo@r@v19/21900049."This isn''t like you.@k@v19/21900050. Why so sentimental?"'
10463: 'Kinzo@r@v01/21500100.".........You said it, didn''t you?@k@v01/21500101. My days are numbered.@k@|@y@v01/21500102. ......Now, go.@k@v01/21500103. And don''t come to this room again.@k@v01/21500104. ......We shall continue in the Golden Land."'
10464: 'Nanjo@r@v19/21900051."..............................@k@v19/21900052. ...That is fine, but it shall be a rematch.@k@v19/21900053. Losing that rook was a serious blow."'
10465: 'Nanjo@r@v19/21900054."......Well then, I will see you later."'
10466: 'Kinzo@r@v01/21500105."Yes, later.@k@v01/21500106. ............Maybe in the Golden Land, or in Purgatory.@k@v01/21500107. Or in the next world."'
10467: 'Nanjo@r@v19/21900055."..........................."'
10468: '@rNanjo didn''t say anything beyond that.@k And with a practiced hand, he pushed the button on the table that would release the auto-lock.'
10469: '@rThen, after looking at Kinzo''s back one last time, he left the study.'
10470: '@rAs he did, Genji''s voice came from the hall.'
10471: 'Genji@r@v14/21600058."......Well then, my lord.@k@v14/21600059. I will now carry in your dinner."'
10472: 'Kinzo@r@v01/21500108."It may be my last supper.@k@v01/21500109. I must savor it.@k@v01/21500110. ......Please, get it ready."'
10473: 'Genji@r@v14/21600060."Certainly.@k@v14/21600061. ............Are your own preparations in order, my lord?"'
10474: 'Kinzo@r@v01/21500111."...Indeed.@k@v01/21500112. I have spent my time until today wrapping this room in a multitude of rigorous barriers.@k@v01/21500113. .........Even if that roulette chooses me, I will definitely repel it.@k@v01/21500114. ...I will remain alive, and I will definitely become one of those who reach the Golden Land...!@k @v01/21500115.......I will reject the visitations of the gods of death who try to drag me off to Hades..."'
10475: 'Shannon@r@v15/20500503.".........Excuse me.@k@v15/20500504. ...I have come to prepare your meal."'
10476: '@rShannon entered the VIP room, bowing her head and pushing the serving cart.'
10477: '@rThe young woman by the window, apparently gazing out into the impenetrable darkness outside, was unmistakably that witch.'
10478: 'BEATRICE@r@v27/20700605."So it is Shannon this time.@k@v27/20700606. How nostalgic.@k@v27/20700607. .........Hoh.@k@v27/20700608. Your countenance has improved quite considerably, has it not?@k@v27/20700609. Unlike Kanon.@k@v27/20700610. Almost beyond recognition."'
10479: 'Shannon@r@v15/20500505.".........Thank you very much."'
10480: '@rShannon solemnly prepared dinner.'
10481: '@r...There were actually several things that she wanted to ask and talk with the witch about.@k ...But those things were all jumbled up, and she didn''t know where to start.'
10482: '@rHer heart was also jumbled up with various things, and she didn''t even understand her own emotions.@k ...Therefore, still remaining vague, all she could do was to carry out her work indifferently.'
10483: '@rHowever, the witch guessed what was in her heart.@k@rYou can''t hide things from a witch...'
10484: 'BEATRICE@r@v27/20700611."...............I won''t apologize.@k@v27/20700612. Because I am a witch."'
10485: 'Shannon@r@v15/20500506."......For what?"'
10486: 'BEATRICE@r@v27/20700613."Come.@k@v27/20700614. ...Kanon must have told you about it.@k@v27/20700615. Helping out your love life was simply my mischievous spirit.@k@v27/20700616. ......It was nothing more than a seed I sowed in order to enjoy witnessing in what manner things would get complicated, become twisted, and fail."'
10487: 'Shannon@r@v15/20500507.".........There are some who think it is more fun to hear about love than to have it."'
10488: 'BEATRICE@r@v27/20700617."Surely, .........you aren''t trying to thank me?"'
10489: 'Shannon@r@v15/20500508."...Yes, I am.@k@v15/20500509. ......No matter what kind of ulterior motive you had when you gave me the magic of love,@k@v15/20500510. ......it doesn''t change the fact that you gave it to me."'
10490: 'Shannon@r@v15/20500511.".........So even if you sowed that seed knowing that the two of us wouldn''t be able to stay together for life,@k@v15/20500512. ...I won''t hold a grudge against you."'
10491: 'BEATRICE@r@v27/20700618."............Hmmmm.@k@v27/20700619. ......Furniture truly is uninteresting.@k@|@y@v27/20700620. ...*cackle*cackle*cackle*cackle*.@k@v27/20700621. Cooking it into something interesting is where my skill shines."'
10492: 'Shannon@r@v15/20500513."......I don''t understand how you think, BEATRICE-sama.@k@v15/20500514. ......You are a Great Witch, and people like us don''t even reach your feet,@k@v15/20500515. ...nor can we even imagine your grand thoughts.@k@v15/20500516. But there is at least one thing I can say."'
10493: 'BEATRICE@r@v27/20700622."......What is it?"'
10494: 'Shannon@r@v15/20500517."Thank you for teaching me to be human.@k@v15/20500518. .........You said it yourself.@k@v15/20500519. ...I am no longer furniture."'
10495: 'BEATRICE@r@v27/20700623."...............Silence, furniture.@k@v27/20700624. ...If you were a true human, hearing the announcement of your death on the day that you were to receive an engagement ring should have you dancing around mad with grief."'
10496: 'BEATRICE@r@v27/20700625."But what of you?@k@v27/20700626. Your face looks enlightened, as though you have accepted everything!@k@v27/20700627. ......Truly an anticlimax. Furniture...!"'
10497: 'Shannon@r@v15/20500520."No.@k@v15/20500521. I am not furniture."'
10498: 'BEATRICE@r@v27/20700628."Silence, furniture."'
10499: 'Shannon@r@v15/20500522."I won''t be silent.@k@v15/20500523. Because I am not furniture."'
10500: 'BEATRICE@r@v27/20700629."Are you saying you won''t listen to my orders?"'
10501: 'Shannon@r@v15/20500524."Furniture obeys orders.@k@v15/20500525. ...But a human decides for herself whether to obey orders or not.@k@v15/20500526. So I won''t obey your orders."'
10502: 'BEATRICE@r@v27/20700630."Hmph.@k@v27/20700631. ...*cackle*cackle*cackle* hahahahahahahahahahahaha...!@k @v27/20700632.......I''ll take back what I said.@k@v27/20700633. You really are interesting."'
10503: 'BEATRICE@r@v27/20700634."......If I hadn''t sowed those seeds, you probably would have allowed the ritual to control your fate without any emotion at all.@k@v27/20700635. ......But now you have grown to be truly interesting, and you entertain me from the bottom of my heart.@k@v27/20700636. That is fine.@k@v27/20700637. Because I have no love for boredom.@k@v27/20700638. ......*cackle*cackle*cackle*cackle*cackle*!"'
10504: 'Shannon@r@v15/20500527.".........I have finished preparations for dinner.@k@v15/20500528. ...Here you go."'
10505: 'BEATRICE@r@v27/20700639."Hmm.@k@v27/20700640. ...Doesn''t this look delicious.@k@v27/20700641. .........If Gohda makes it to the Golden Land, it may be desirable to commission him as my chief cook."'
10506: 'Shannon@r@v15/20500529."......I heard from Kanon-kun.@k@v15/20500530. .........Something about, if I rejected George-san''s proposal, you promised not to make me a sacrifice."'
10507: 'BEATRICE@r@v27/20700642."Mm.@k@v27/20700643. I did.@k@v27/20700644. ......Although you were an ideal sacrifice for the second twilight.@k@v27/20700645. ...Kanon cried and screamed that I should pardon you of that, so I graciously listened to his words.@k@v27/20700646. With the condition that you give up your engagement.@k@v27/20700647. ......*cackle*cackle*, how gracious I am."'
10508: 'Shannon@r@v15/20500531."............What a foolish condition.@k@v15/20500532. And what a foolish threat.@k@v15/20500533. ......You bullied Kanon-kun thoroughly using that, I suppose?"'
10509: 'BEATRICE@r@v27/20700648."Hoh.@k@v27/20700649. So you can tell.@k@v27/20700650. ......*cackle*cackle*cackle*!"'
10510: '@rApparently, Shannon had seen through it.@k ......Apparently, she could imagine how much Kanon had been bullied and humiliated by the witch, with that horrible promise as bait.'
10511: 'BEATRICE@r@v27/20700651."I made him crawl on the carpet and kiss my shoes.@k@v27/20700652. *cackle*cackle*cackle*!@k @v27/20700653.And that''s not all.@k@v27/20700654. ......Do you want to hear the other ways in which I humiliated him...?"'
10512: '@rShannon silently shook her head.'
10513: 'Shannon@r@v15/20500534."I have finally come to understand you.@k@v15/20500535. You like to bully, confuse, and trouble people, and you do it to entertain yourself.@k@|@y@v15/20500535_1. .........So I''m now sure that this is the only way to resist you."'
10514: 'BEATRICE@r@v27/20700655."What is?"'
10515: 'Shannon@r@v15/20500536."I will have nothing to do with you.@k@v15/20500537. ...I will carry out the fate that has been given to me.@k@v15/20500538. So I won''t entertain you."'
10516: 'BEATRICE@r@v27/20700656."......Nothing to do with youuu...?"'
10517: '@rThe witch''s features twisted in hatred for just an instant.'
10518: '@r...It disappeared immediately,@k but that expression that rose to her face for only a brief time was unusual for the witch, who had never broken her malicious smile.'
10519: 'BEATRICE@r@v27/20700657."*cackle*cackle*cackle*cackle*!!@k @v27/20700658....I suppose that''s one way to resist?@k@|@y@v27/20700659. Interesting.@k@v27/20700660. I like it.@k@v27/20700661. I''ll kill you.@k@v27/20700662. Together with your lover...!"'
10520: 'Shannon@r@v15/20500539."...If that is the fate that you have decided, that is up to you.@k@|@y@v15/20500540. ......I won''t be afraid of that or go against that.@k@v15/20500541. Because I don''t believe that the grim fate that will start occurring now is something controlled by your will."'
10521: 'Shannon@r@v15/20500542."We humans don''t know anything about our possible future fates.@k@v15/20500543. That is how we live to the fullest, following our own beliefs and destinies until the last.@k@v15/20500544. Fate is just a roll of the dice.@k@v15/20500545. You can''t feel malice in it.@k@v15/20500546. Try as you might to inject some, I won''t believe you."'
10522: 'BEATRICE@r@v27/20700663."......Hoh.@k@v27/20700664. Even though you have stopped being furniture, you have no fear of death.@k@v27/20700665. ......It seems you think that will bore me, but that''s a huge misunderstanding.@k@v27/20700666. ...I am now all the more interested to see whether you really can stick to that until your last moments.@k@v27/20700667. *cackle*cackle*cackle*cackle*cackle*cackle*...!"'
10523: 'Shannon@r@v15/20500547."It''s so frustrating.@k@v15/20500548. ......Why did you take the form of a human, appear in front of us, speak with human words, and ridicule us?@k@v15/20500549. ...If you hadn''t appeared in front of us, if you hadn''t predicted the future,@v15/20500550. ......we would have been able to live life to the fullest until the last moment."'
10524: 'BEATRICE@r@v27/20700668."That''s what witches do.@k@v27/20700669. We live off your fates, reigning as a high-order being does over low-order beings.@k@v27/20700670. After all, your fates are merely fragments.@k@v27/20700671. If we cup our hands together, we can scoop out as many as we want."'
10525: 'BEATRICE@r@v27/20700672."......In the same way that the beef cattle I raise can babble what they will, and it won''t change the fact that they will add splendor to my dinner table.@k@v27/20700673. *cackle*cackle*...!"'
10526: 'Shannon@r@v15/20500551."......We are powerless, so we can''t go against your ritual or our fates.@k@v15/20500552. ...But I can do something that will make you unhappy right now."'
10527: 'BEATRICE@r@v27/20700674."Hoh.@k@v27/20700675. What would that be?"'
10528: 'Shannon@r@v15/20500553.".........I will walk away from this place right now.@k@v15/20500554. Answering your words only entertains you.@k@v15/20500555. Not answering your questions is the only way I can resist you."'
10529: 'BEATRICE@r@v27/20700676."I see, I see.@k@v27/20700677. You may be able to take a shot at me.@k@v27/20700678. ...But you cannot defeat me, you know?@k @v27/20700679.......I have the power to kill anyone for eternity."'
10530: 'BEATRICE@r@v27/20700680.".........I can''t wait to see how long you can keep up that resistance in an endlessly repeating cycle of death and rebirth.@k@v27/20700681. ......Don''t forget it, now.@k @v27/20700682.You spoke those words yourself.@k@v27/20700683. *cackle*cackle*cackle*."'
10531: 'Shannon@r@v15/20500556."Well then, if you will excuse me.@k@v15/20500557. If you have any business, please call me."'
10532: '@rShannon gave a reserved bow as she would to a stranger, and faced away.@k@r...With that gesture, maybe she really had taken a shot back at the witch, just as BEATRICE had mentioned.'
10533: '@r...Because when the witch called out again, she sounded a little more quick-tempered than she had before.'
10534: 'BEATRICE@r@v27/20700684."Kanon thanked me.@k@v27/20700685. ...Aren''t you going to?@k@v27/20700686. Not going to thank me for giving you your day of rest?"'
10535: 'Shannon@r@v15/20500558."Furniture will be happy about their day of rest.@k@v15/20500559. But I am a human, you see.@k@v15/20500560. So I have nothing to thank you for.@k@v15/20500561. ......Will that be all?"'
10536: 'BEATRICE@r@v27/20700687.".........You plan to receive the ring from George?@k @v27/20700688.Don''t forget that if you do, I will abandon the promise I made with Kanon, the promise that you would not be selected as a sacrifice."'
10537: 'Shannon@r@v15/20500562."If there is anything further, I''ll have someone else come for you.@k@v15/20500563. If you will excuse me."'
10538: '@rA flat-out interruption.@k@rShannon gave no more answers.'
10539: '@rAnd the sound of the door closing came instead of an answer.'
10540: '@rIt seemed that Shannon''s resistance had probably struck far more deeply into the witch than Shannon herself had thought.'
10541: '@r...Because an expression of hatred had once again risen to BEATRICE''s face.'
10542: '@rShe had made Kanon submit, even though he hadn''t been taken in until the end.@k ...Yet after that, now it was Shannon who refused to submit, when until now she had been easily taken in.'
10543: 'BEATRICE@r@v27/20700689."...............Oh?@k@v27/20700690. ...This is interesting after all!@k@v27/20700691. ......*cackle*cackle*cackle*cackle*.@k@v27/20700692. ...I suppose I''m not so old yet.@k@v27/20700693. This is why I''m still not tired of living after one thousand years..."'
10544: '@rThe most fabulous time in the family conference.@k@rThat was the dinner.'
10545: '@rBack when Kinzo had been serious about the family conference, he had placed extreme importance upon this dinner, for which everyone would gather just once a year.'
10546: '@rShould the dinner not meet standards, he would take it as the deepest shame for himself as the host,@k and he had strongly ordered Natsuhi to make absolutely sure that it was one to be proud of.'
10547: '@rBecause of that, she and Krauss had employed Gohda, who had confidence in his cooking abilities.'
10548: '@r......As a result, they could unveil a wonderful dinner they had confidence in,@k yet by that time, Kinzo had started closing himself up in his study and no longer appeared for dinner - maybe you could call that ironic...'
10549: '@rWhen the main dish for tonight, calf steak, was set out, Gohda began to brag about it, further exciting everyone''s appetite.'
10550: 'Gohda@r@v17/21700026."The sauce here is Bordelaise."'
10551: 'Gohda@r@v17/21700027."Of course, the red wine base I used was excellent even among those made in Bordeaux, but in addition, I prepared an original blend of this house,@k@v17/21700028. a blend of choice alcohols from around the world to further deepen the taste."'
10552: 'Gohda@r@v17/21700029."This sauce will be exclusive to this year.@k@v17/21700030. It would greatly please me if you were to enjoy yourselves."'
10553: 'Krauss@r@v02/20800075."...Isn''t that wonderful?@k@v02/20800076. However, isn''t Bordelaise sauce common to French cooking?@k @v02/20800077.It almost seems like using alcohol from outside France with that is heresy."'
10554: 'Gohda@r@v17/21700031."Krauss-sama.@k@v17/21700032. Today is the annual family conference."'
10555: 'Gohda@r@v17/21700033."As a dinner for those who normally live far away, and have traveled far from across the world to gather together,@k@v17/21700034. I realized that a sauce made from a blend of fine alcohols from across the world that would normally never meet would be most fitting,@k@v17/21700035. so I had it specially prepared."'
10556: 'Hideyoshi@r@v06/21100052."Wonderful!@k @v06/21100053.A truly wonderful cook, that''s what you are!@k @v06/21100054.Food and medicine work twice as well if you advertise it right!@k @v06/21100055.It''s twice as delicious as normal food, and the advertisin'' makes that twice as good again.@k@v06/21100056. The taste keeps doublin'' and doublin''!@k @v06/21100057.Wahahahahaha!"'
10557: 'Eva@r@v05/21000161."*giggle*.@k@v05/21000162. Come on, Nii-san.@k@v05/21000163. Didn''t he see that question coming?"'
10558: 'Rudolf@r@v08/21200145."No doubt.@k@v08/21200146. You let Gohda-san run right off with your moment."'
10559: 'Krauss@r@v02/20800078."Is that so?@k @v02/20800079.I just thought there might be some people here who didn''t notice that today''s food was in the French style."'
10560: 'Krauss@r@v02/20800080."......Just now, Eva said that not using butter was a virtue, but that''s the Spanish style.@k@v02/20800081. ...Well, I guess they do share a border, right?"'
10561: 'Eva@r@v05/21000164."...That''s not what I meant.@k@v05/21000165. Will you please not take a part of the conversation out of context and misquote me?"'
10562: 'Rosa@r@v12/21400214."...It''s a very delicious sauce.@k@v12/21400215. Gohda-san, you certainly are wonderful."'
10563: 'Gohda@r@v17/21700036."It is a great honor to receive your praise.@k@v17/21700037. And this is all thanks to Madam''s habitual guidance."'
10564: 'Natsuhi@r@v03/20900092."......No, it was all Gohda''s idea.@k@v03/20900093. I only listened to the recipe and approved of it."'
10565: '@rIt looked like the siblings quickly got into a loud argument about something as trivial as the sauce,@k ...but for the most part, dinner proceeded peacefully.'
10566: '@r......However, the thing that they all really wanted to ask about smoldered inside each of their hearts.'
10567: '@r......And that was the visitor, the 19th person.@k@r............The Golden Witch.'
10568: '@rIn actuality, Eva, Rudolf, and Kyrie were on alert during dinner.'
10569: '@rIf the mystery guest was to be introduced, this dinner table was the most appropriate place to do it.@k ...However, no plates had been prepared at the table for the witch.'
10570: '@rThe family conference would begin in earnest after the meal, and previous experiences told them that it could last until deep into the night.'
10571: '@r......But they couldn''t understand what meaning there could be in keeping this person, who should be introduced, hidden until late at night.'
10572: '@rSo Eva, Rudolf, and Kyrie had started to suspect something.'
10573: '@r......That the guest might actually be unknown to Krauss as well.'
10574: '@rIf she wasn''t a saboteur called by Krauss to give him an advantage in the inheritance problem,@k ...they should probably speak frankly to Krauss beforehand, and create a common front to resist anything disadvantageous to the four siblings.'
10575: '@r......If she was Kinzo''s saboteur,@k whose purpose was to keep the inheritance from being handed over to the four siblings,@k the enmity between Krauss and the other siblings could become nothing more than a weak point that benefitted the enemy...'
10576: 'Gohda@r@v17/21700038."Well then, please enjoy at your leisure..."'
10577: '@rWith the table set and the cuisine explained, Gohda tried to leave the room, but Kyrie called him to a stop with a small voice.'
10578: 'Gohda@r@v17/21700039."......Yes, Kyrie-sama.@k@v17/21700040. What is it?"'
10579: 'Kyrie@r@v09/21300111."Umm, I''m sorry.@k@v09/21300112. ......It seems one of our guests today still hasn''t joined us, will it be alright to hold dinner like that?"'
10580: '@rShe had thought she''d said it nonchalantly, but unfortunately, it reached the ears of Natsuhi, who was sitting in the next seat.'
10581: '@rIt seemed that Natsuhi had heard it to mean "even though there are guests here today, won''t the host be coming to dinner?"@k ......In other words, that Kyrie had asked whether Kinzo was going to come to dinner.'
10582: 'Natsuhi@r@v03/20900094."The head''s condition is not good, so he said that he will take his dinner in his study.@k@v03/20900095. ......My husband explained that in the beginning; is something...?"'
10583: 'Kyrie@r@v09/21300113."..................I''m sorry.@k@v09/21300114. That''s not what I meant."'
10584: '@r...In an instant, Kyrie realized from Natsuhi''s reaction that this unknown visitor was also unknown to Krauss and his wife.'
10585: '@r.........And what that meant...@k ......On the chessboard placed inside Kyrie''s mind, she could feel the arrangement of the pieces changing, making loud clattering sounds...'
10586: 'Battler@r@v10/20100120."A guessst?"'
10587: '@rIt seemed that Battler, who was sitting next to Natsuhi, had heard Kyrie''s words without misunderstanding them,@k and he let out a wild voice, questioning who else could have been invited to today''s family conference.'
10588: '@rThanks to that voice, the uncomfortable feeling in the siblings'' chests suddenly exploded...'
10589: '@rEveryone looked at Gohda at the same time.'
10590: '@r......Judging by their appearances, it was obvious that at least no one here had invited that mystery woman.'
10591: '@rFor an instant, Gohda was startled to find everyone''s gaze gathered on him, but because of his naturally vain personality, this actually gave him a feeling of superiority.'
10592: '@rTherefore, he answered in an extremely calm and graceful manner.'
10593: 'Gohda@r@v17/21700041."......Yes.@k@v17/21700042. She wanted to eat alone in the VIP room, so her food was carried over there."'
10594: '@rTherefore, Gohda''s extremely graceful and reasonable response made it obvious to everyone that a 19th person, a visitor, existed...'
10595: 'Natsuhi@r@v03/20900096."The VIP room? A guest?@k @v03/20900097.......What and who are you talking about?"'
10596: '@rNatsuhi''s words echoed the question that everyone who didn''t know about the visit of the Golden Witch was thinking.'
10597: '@rGohda was slightly disoriented, as though he hadn''t remotely expected to be questioned by Natsuhi.'
10598: '@r......That honored guest had been spoken of so stringently.@k@rHe hadn''t imagined that Krauss and his wife might not have known.'
10599: 'Gohda@r@v17/21700043."Umm, ......it is BEATRICE-sama."'
10600: 'Maria@r@v13/20400232."BEATRICE!!@k @v13/20400233.See, see!@k @v13/20400234.BEATRICE came, uu-uu-uu!!"'
10601: '@rMaria had been telling the other cousins over and over again that she had met BEATRICE today.'
10602: '@r......The cousins had answered, saying "Isn''t that nice", but they hadn''t believed.@k So, ...their eyes grew wide.'
10603: 'Battler@r@v10/20100121."S-sorry.@k@v10/20100122. I was sure you were just joking, Maria...@k@v10/20100123. S-so, she really does exist..."'
10604: 'Jessica@r@v04/20200433.".........By BEATRICE, ......you mean that BEATRICE of the gold...?!"'
10605: 'Maria@r@v13/20400235."Uu!!@k @v13/20400236.I''ve been saying she "exists" the whole time!@k @v13/20400237.No one believed!!"'
10606: 'George@r@v07/20300282."Sorry, Maria-chan...@k@v07/20300283. We didn''t mean to..."'
10607: '@rAfter learning that everyone had doubted BEATRICE''s existence, Maria, who had been in a good mood all day, completely lost her temper.'
10608: '@r...George, who was sitting next to her, tried frantically to calm her.'
10609: 'Krauss@r@v02/20800082."...Gohda.@k@v02/20800083. Is that another bit of dinner entertainment?@k @v02/20800084.*cackle*, quite a good performance."'
10610: 'Rudolf@r@v08/21200147.".........Aniki.@k@v08/21200148. Drop the act.@k@v08/21200149. ...You called her, right?"'
10611: 'Krauss@r@v02/20800085."Called?@k @v02/20800086.Called who?@k@v02/20800087. ...From where?!"'
10612: 'Eva@r@v05/21000166."Nii-san.@k@v05/21000167. Let''s have a clear answer.@k@v05/21000168. ......Who is that?@k@v05/21000169. Surely you aren''t going to tell us that it really is the BEATRICE from that portrait, right?"'
10613: 'Krauss@r@v02/20800088."I don''t have a clue what you people are talking about!@k @v02/20800089.Gohda, is this seriously not a joke?!"'
10614: 'Gohda@r@v17/21700044."I, I, umm......@k@v17/21700045. I was just ordered by Genji-san, umm...!"'
10615: 'Natsuhi@r@v03/20900098."Call Genji.@k@v03/20900099. Now!!"'
10616: '@rWhen Natsuhi yelled, Gohda shot out into the hallway.'
10617: '@rThe sound of the door being thrown open at that time triggered a sudden uproar around the dinner table.'
10618: 'Rudolf@r@v08/21200150."So you say you don''t know either, Aniki?@k @v08/21200151.Who called her?@k@v08/21200152. Was it Dad?!"'
10619: 'Krauss@r@v02/20800090."......I don''t know anything about this.@k@v02/20800091. It seems that you people believe that I have been pulling the strings behind the scenes, but that is a huge misunderstanding."'
10620: 'Hideyoshi@r@v06/21100058."Calm down, Krauss nii-san.@k@v06/21100059. We aren''t at the stage where we can sound each other out anymore.@k@v06/21100060. If you''re sayin'' that you don''t know this mystery person either, this situation becomes ridiculous...!"'
10621: 'Natsuhi@r@v03/20900100."Hideyoshi-san, won''t you be a little more discreet with your words?@k @v03/20900101.My husband would not invite unnecessary people to the family conference."'
10622: 'Krauss@r@v02/20800092."Honestly.@k@v02/20800093. What are you people talking about?@k@|@y@v02/20800094. Are you saying that the witch of the portrait has broken out of her frame and appeared?!@k @v02/20800095.......There''s no way anyone has actually met this witch."'
10623: 'Rosa@r@v12/21400216."I...met her...!"'
10624: '@rEva and Rudolf nodded at Rosa''s proclamation.'
10625: 'Maria@r@v13/20400238."Uu!@k @v13/20400239.I met her too!!@k @v13/20400240.Uncle Krauss, belieeeve!@k @v13/20400241.Believe Mama!@k @v13/20400242.Uu-uu!"'
10626: '@rThe brief tension was broken, and Maria also started to make a ruckus.@k@r...The room was by now chaotic.'
10627: 'Jessica@r@v04/20200434."I don''t have a clue what''s going on...@k@v04/20200435. So what''s going on?@k @v04/20200436.The witch who gave Grandfather the gold is appearing as a special guest in this year''s family conference...?!"'
10628: 'Battler@r@v10/20100124."But... Really...?@k @v10/20100125.Auntie Rosa didn''t see it wrong, did she...?"'
10629: 'Maria@r@v13/20400243."I met her toooooo!!@k @v13/20400244.Uu-uu-uu-uu-uu-uu-uu!!!"'
10630: 'George@r@v07/20300284."Auntie Rosa, ......are you...sure?"'
10631: 'Rosa@r@v12/21400217."............Yes.@k@v12/21400218. .........Maria and I met her, ......and even talked to her."'
10632: 'Rosa@r@v12/21400219."......I met her!!@k @v12/21400220.That was definitely a witch...!@k @v12/21400221.Believe me!!@k @v12/21400222.I definitely didn''t see it wrong or hallucinate or anything!@k @v12/21400223.What.........was that?!"'
10633: '@r...In the instant before the typhoon visited...@k@r......Rosa had definitely met with the witch in the rose garden.'
10634: '@rBut that scene had been so hard to accept as reality......@kand the more she spoke of it like this, the less she understood what it was she had met.'
10635: '@rIronically, because she had lost her composure when she said that she had definitely met the witch,@k the more desperate she became, the more vague the witch''s existence seemed.'
10636: '@rSo, it was a single composed sentence that affirmed her existence for certain.'
10637: 'Kyrie@r@v09/21300115.".........I met her as well.@k@v09/21300116. We exchanged greetings - well, they could hardly be called that - a few words, at least.@k@v09/21300117. .........It''s definitely not something that Rosa-san saw wrong."'
10638: 'Battler@r@v10/20100126."Kyrie-san, are you serious...?"'
10639: 'Kyrie@r@v09/21300118."Yes.@k@v09/21300119. .........But she didn''t tell me her name.@k@v09/21300120. So I can''t conclude that she was BEATRICE."'
10640: 'Kyrie@r@v09/21300121."......However, sorry if this is subjective,@k@v09/21300122. ......but since I met her in the entrance hall, I was able to compare her face with the portrait.@k@v09/21300123. ...My first impression was that she was undoubtedly the portrait''s subject.@k@v09/21300124. .........This is all just subjective, remember."'
10641: 'Natsuhi@r@v03/20900102."That isn''t possible!@k @v03/20900103.In the first place, where did that woman come from?@k@v03/20900104. The only boat today was the round-trip journey of the one that escorted you all here.@k@v03/20900105. Was she riding on that boat?!"'
10642: 'Rudolf@r@v08/21200153.".....................@k@v08/21200154. I admit, that''s a bit of a weak spot.@k@v08/21200155. Of course, I have no memory of such a woman getting off the boat with us."'
10643: 'Eva@r@v05/21000170."Ooh, is it really?@k @v05/21000171.How can you prove that there wasn''t a boat other than the one we rode on?@k @v05/21000172.You can''t!@k @v05/21000173.You can''t prove one "didn''t come"!"'
10644: 'Battler@r@v10/20100127."That''s right.@k@v10/20100128. ......You could prove that it "came".@k@v10/20100129. Someone who saw it just has to say so.@k@v10/20100130. But you can''t prove that it "didn''t come"."'
10645: 'Battler@r@v10/20100131."Even if everyone says that it didn''t come - that they didn''t see it - you can''t deny that it could have "come secretly".@k@v10/20100132. It''s that thing they call the "Devil''s Proof"."'
10646: '@rIt''s easy to prove that a devil "exists".@k@rAll you have to do is meet a devil.@k@rBut it is impossible to prove that devils "don''t exist".'
10647: '@rJust because no one has ever met a devil doesn''t mean that you can deny the possibility that they''re hiding away somewhere that humans cannot go.'
10648: '@r......You can''t deny the existence of aliens for exactly the same reasons.'
10649: '@rUntil humanity searches the whole of space and can show perfectly that aliens don''t exist, you can''t be sure that they don''t.'
10650: '@rAnd it''s definitely impossible for us to ever check the entirety of space for the existence of aliens.'
10651: '@r...Therefore, while there may be a number of ways to prove that aliens do exist, it is impossible to show proof that denies their existence.'
10652: 'George@r@v07/20300285."......In that case, we would just be wasting our time discussing whether or not a boat separate from the one we rode on came to the island.@k@v07/20300286. ......She wasn''t on the boat with us.@k@v07/20300287. That much is a fact, and she must have visited this island through some other means."'
10653: 'Kyrie@r@v09/21300125."That''s right.@k@v09/21300126. There may be no need to discuss how she came here.@k@v09/21300127. The essential point is the fact that she actually is in this mansion now, and doesn''t feel like having dinner with us."'
10654: 'Rudolf@r@v08/21200156."Let''s review.@k@v08/21200157. ...Right now, there is another guest on this island other than the 18 of the Ushiromiya family.@k@v08/21200158. And that is a guest that even Aniki and Natsuhi nee-san don''t know about, right?"'
10655: 'Natsuhi@r@v03/20900106."I don''t know...!@k @v03/20900107.I don''t know what you''re talking about...!"'
10656: 'Krauss@r@v02/20800096."Be silent for a while.@k@v02/20800097. Your headache will get worse.@k@|@y@v02/20800098. ......It is as my wife says.@k@v02/20800099. I have no idea what you people have been talking about up until now."'
10657: 'Eva@r@v05/21000174."Then there can be only one answer.@k@v05/21000175. ......Father called her.@k@v05/21000176. For today''s family conference!"'
10658: 'Krauss@r@v02/20800100."For the family conference?!@k @v02/20800101.Then for what reason?!"'
10659: 'Eva@r@v05/21000177."I don''t know that!@k @v05/21000178.I thought you knew, Nii-san, that''s why I thought I''d question you!"'
10660: 'Hideyoshi@r@v06/21100061."Eva, could you give it a rest?!@k @v06/21100062.Krauss nii-san said that he doesn''t know!@k @|@y@v06/21100063.......So this is what we''ve got.@k@v06/21100064. Father stealthily invited the witch of the portrait as a secret guest.@k@v06/21100065. And Rosa-san met her, Maria-chan met her, and Kyrie-san met her too."'
10661: 'Hideyoshi@r@v06/21100066.".........That''s all we know for now!@k @v06/21100067.If she has something to say to us, she could just quickly show herself!@k @v06/21100068.So what I want to know is why in blazes she''s shut herself up without greetin'' us."'
10662: 'Rudolf@r@v08/21200159."You think maybe Dad never had any interest in the family conference from the beginning, and just secretly called a new mistress here?@k @v08/21200160.And had her dress up as his ideal witch?@k @|@y@v08/21200161.............Nah, this day holds too much significance to come to that conclusion."'
10663: 'Eva@r@v05/21000179."There can be only one reason.@k@v05/21000180. To join in on the family conference.@k@v05/21000181. ...She wants to claim some right to Father''s inheritance!"'
10664: 'Natsuhi@r@v03/20900108."Preposterous!!@k @v03/20900109.The head would never have something as filthy as a mistress!"'
10665: 'Krauss@r@v02/20800102."I told you to be silent!@k @|@y@v02/20800103.I''ve been in this mansion with Father for considerable time, and I haven''t heard about this once."'
10666: 'Krauss@r@v02/20800104.".........Let me humor you as best as I can...@k@v02/20800105. ......You say Father had a hidden child with a mistress of several decades past,@k@v02/20800106. ......and Father searched her out and called her here today.@k@v02/20800107. ...Is that what you want to say?"'
10667: 'Natsuhi@r@v03/20900110."Dear!@k @v03/20900111.Father would never have something like that!@k @v03/20900112.To waste the noble blood of the Ushiromiya family on a mistress...!@k @v03/20900113.This is nothing more than a few people saying that they saw something!@k @v03/20900114.It''s obviously a fantasy, a delusion, a daydream!@k @v03/20900115.Or are you all taking part in some kind of act to entrap my husband?!"'
10668: 'Eva@r@v05/21000182."What act?!!@k @v05/21000183.If anyone is acting, it''s you!!"'
10669: 'Rudolf@r@v08/21200162."Quit it, Aneki.@k@v08/21200163. ......She said it in a slightly reckless way, but Natsuhi-san is correct.@k@v08/21200164. Kyrie saw her, but I did not.@k@v08/21200165. Neither did you, Aneki.@k@v08/21200166. But Rosa did."'
10670: 'Rudolf@r@v08/21200167."......However, that means that she "exists".@k@v08/21200168. Because there is someone who can prove that she "exists", we directly conclude that she exists.@k@v08/21200169. It''s the opposite pattern of the Devil''s Proof."'
10671: 'Rudolf@r@v08/21200170.".........And I want to meet her too.@k@v08/21200171. And I want to ask her directly what kind of business she has with the Ushiromiya family."'
10672: 'Krauss@r@v02/20800108."I agree with you on that.@k@v02/20800109. I truly wish to enquire as to what business she has on Rokkenjima."'
10673: 'Eva@r@v05/21000184."Don''t act like you don''t know!@k @v05/21000185.She is after one thing.@k@v05/21000186. It''s Father''s inheritance!@k @v05/21000187.We should form a forward-looking strategy with a lawyer knowledgeable about inheritance issues.@k@v05/21000188. If the mistress claims the same rights as Mother, then our shares will be cut right in half!"'
10674: 'Rosa@r@v12/21400224.".........Wai-wait a second, everybody!@k @v12/21400225.Genji-san will come very soon.@k@v12/21400226. He knows everything.@k@v12/21400227. I''m sure he will answer our questions!@k @v12/21400228.Until then, let''s stop talking about this!!"'
10675: 'Rosa@r@v12/21400229."Come on now, kids!@k @v12/21400230.Sorry, but we adults have to start talking about something a little complicated!@k @v12/21400231.Go back to the guesthouse!!"'
10676: '@rRosa yelled at the children, slightly emotionally.'
10677: '@rThe children didn''t understand why they were suddenly being yelled at now, but Eva and the rest came to the same realization as Rosa after a delay.'
10678: '@rThey were talking so grandly about the filthy topic of the inheritance in front of the children.'
10679: '@r...There was no way that they''d want their children to remain here.@k@rSo they all immediately agreed with Rosa''s plan.'
10680: 'Hideyoshi@r@v06/21100069."Tha-that''s right, just as Rosa-san says!@k @v06/21100070.George!@k @v06/21100071.Take all the cousins and go back to the guesthouse!@k @v06/21100072.You all play nice together, you hear?!"'
10681: 'Eva@r@v05/21000189."George, do as you''re told.@k@v05/21000190. Take all of the cousins, and leave right now!"'
10682: 'George@r@v07/20300288."Wa-...wait a second, Mother...!@k @v07/20300289.We haven''t even finished eating yet...!"'
10683: 'Maria@r@v13/20400245."Uu!@k @v13/20400246.And we still haven''t had desserrrrt!!@k @v13/20400247.Uuu!!"'
10684: 'Rosa@r@v12/21400232."We will have Gohda-san carry dessert to the guesthouse!@k @v12/21400233.So leave!!"'
10685: 'Natsuhi@r@v03/20900116."Jessica.@k@v03/20900117. From here on, the adults will be talking together.@k@v03/20900118. Go."'
10686: 'Jessica@r@v04/20200437.".........Fi-...fine.@k@v04/20200438. .........Even though it''s only half-eaten..."'
10687: 'Battler@r@v10/20100133."...So I guess I''m not going to be the only exception."'
10688: 'Kyrie@r@v09/21300128."Thank you for understanding, Battler-kun.@k@|@y@v09/21300129. ...But you''re lucky, you know."'
10689: 'Battler@r@v10/20100134."Huh?@k@v10/20100135. Why?"'
