9891: 'BEATRICE@r@v27/20700477.".........Who is it?"'
9892: 'Kanon@r@v16/20600231."Excuse me...@k@v16/20600232. I have brought lunch."'
9893: 'BEATRICE@r@v27/20700478."Enter."'
9894: 'Kanon@r@v16/20600233."......Excuse me."'
9895: '@rAfter receiving approval, Kanon entered the VIP room, pushing the lunch serving cart.'
9896: '@r...The servants called this room the witch''s VIP room.'
9897: '@rThat was because they had been strictly ordered by Kinzo to always keep it cleaned so that it could be used at any time.'
9898: '@r...And yet, guests were never allowed into this room, no matter who they were.'
9899: '@r...That''s why, at some point, the servants had started calling it the witch''s VIP room,@k supposed to be set aside only to welcome the special person Kinzo was waiting for—the witch from that portrait.'
9900: '@rAnd today, Kanon learned that this was entirely correct...'
9901: '@rWhen he entered the room, .........the witch with golden hair was gazing out the window.'
9902: '@rOutside, the rain had already started to gather strength.'
9903: '@r...As she looked out at the beautiful rose garden, which had taken several days'' work to make ready for today, and saw the winds and rain ravage it,@k was she lost in some sentimental feelings?'
9904: '@rKanon was not able to infer anything more from her back that faced him.'
9905: 'Kanon@r@v16/20600234."...I will prepare your meal.@k@v16/20600235. ...BEATRICE-sama."'
9906: '@rSo Kanon went out of his way to call out the witch''s name, ......because he wanted to make her turn around.'
9907: '@rHe wanted to know.@k ......He wanted to know whether the witch who had tempted him and Shannon in the past......really had appeared again.'
9908: '@r...When he did, ......the witch whose name had been called kept her back to him, ......and laughed.@k Laughed, in a subdued voice.'
9909: '@rKanon was startled...@k@rIt was almost as though she had read his mind, and knew that he had called to her out of a desire to make her turn around...'
9910: 'BEATRICE@r@v27/20700479.".........It smells good.@k@v27/20700480. It appears that Krauss has employed a good cook."'
9911: 'Kanon@r@v16/20600236."........................@k@v16/20600237. ......Yes.@k@v16/20600238. ...He is a cook called Gohda, who was employed in recent years."'
9912: 'BEATRICE@r@v27/20700481."...There''s nothing better than being skilled at cooking.@k@v27/20700482. ...Gourmet food forms one of the three pillars of the pleasure of life in the human world.@k@v27/20700483. The secret to not tiring of a thousand years is to have it in sufficience.@k@v27/20700484. ...*cackle*cackle*cackle*cackle*."'
9913: '@rKanon and the witch''s eyes met.'
9914: '@r...And she grinned...'
9915: '@rThere could be no doubt.@k Not even the slightest...@k@rThis was without a doubt the witch from that day, BEATRICE...'
9916: '@rThe witch that was once visible only to him and Shannon now finally held a form, and had arrived openly through the entrance hall as a guest...'
9917: 'Kanon@r@v16/20600239.".........BEAT...RICE......@k@v16/20600240.......sama."'
9918: 'BEATRICE@r@v27/20700485."It has been a long time.@k@v27/20700486. .........Furniture called Kanon.@k@v27/20700487. ...*cackle*cackle*cackle*cackle*cackle*!"'
9919: 'Kanon@r@v16/20600240_b."...............It has...@v16/20600240_c....been a long time..."'
9920: '@rKanon tried not to forget a modicum of courtesy towards the guest.@k@r...But dark clouds had begun to enshroud his heart because of the visit of this suspicious witch, and on the day of the family conference at that...'
9921: 'BEATRICE@r@v27/20700488."It looks to me that you are dying to know my purpose in appearing here.@k@v27/20700489. ......Isn''t that so...?"'
9922: 'Kanon@r@v16/20600241."................................."'
9923: '@rKanon didn''t force himself to answer.@k ...This witch probably reads minds.@k@r...So it would be pointless to go to all the trouble of saying it out loud.'
9924: '@r.........Of course, even that rebellious spirit of his would be read.'
9925: '@rSo the witch snickered at Kanon''s childish resistance.'
9926: 'BEATRICE@r@v27/20700490."......I came to resolve my final promise with Kinzo."'
9927: 'Kanon@r@v16/20600242."Your final promise with......the Master...?"'
9928: 'BEATRICE@r@v27/20700491."......I lent Kinzo a mountain of gold.@k@v27/20700492. ...When Kinzo gives that up, it will be returned to me with interest.@k@v27/20700493. .........I came here tonight to receive that."'
9929: 'Kanon@r@v16/20600243."...............I don''t know what you are talking about."'
9930: '@rHowever, anxiety began to gather in his heart.@k@r......This witch never had anything good to say.'
9931: 'BEATRICE@r@v27/20700494."......*cackle*cackle*cackle*cackle*!@k @v27/20700495.You are not wrong!@k @v27/20700496.Witches have nothing good to say.@k@v27/20700497. You are correct."'
9932: 'BEATRICE@r@v27/20700498."Be that as it may, witches, like blunt scissors, can be put to use.@k@v27/20700499. ...Sometimes, there are people like King Solomon who succeed in great exploits."'
9933: 'BEATRICE@r@v27/20700500.".........In most cases, one does not meet with a good fate such as those described in fairy tales, of course?@k @v27/20700501.*cackle*cackle*...!@k @v27/20700502..........But Kinzo is crafty.@k@v27/20700503. He has incorporated even my collection of interest into his own ritual."'
9934: 'BEATRICE@r@v27/20700504."Is he a tremendous mage, surpassing even me?@k@v27/20700505. ......Or else a fool possessed by madness?@k@v27/20700506. ...Interesting.@k@v27/20700507. Truly interesting...!"'
9935: '@rKanon couldn''t guess what the witch was muttering and laughing about.'
9936: '@r...All he knew was...@k...that anything this witch deemed worthy of laughter...@kmust have the exact opposite meaning to the rest of them.'
9937: '@r......And rising to the back of his mind were the horrifying words the witch had spat at him in the past.'
9938: '@rDid you think I would lend them that power without any compensation?@k@rI''ll lend a hand in love.@k And my compensation shall be one ticket to watch the cruel fate that the two of them will eventually meet.'
9939: '@rEven after one thousand years, no better show exists...!'
9940: 'Kanon@r@v16/20600244.".................................@k@v16/20600245. ...Could it be... ...You......"'
9941: 'BEATRICE@r@v27/20700508."*cackle*cackle*cackle*cackle*!@k @v27/20700509.Gehehehhahahahahahahahaha...!!"'
9942: 'BEATRICE@r@v27/20700510.".........Behold the sweetfish river, running through my beloved home of old.@k@v27/20700511. You who seek the Golden Land, follow its path downstream in search of the key."'
9943: '@rThe witch suddenly began to recite a bizarre poem...@k@rIt was something he remembered hearing.'
9944: 'Kanon@r@v16/20600246."Could that be............the witch''s epitaph..."'
9945: '@rThere was no doubt.@k@r...It was the epitaph accompanying the portrait of the witch that had been hung by Kinzo.'
9946: '@rThe relatives imagined that it almost certainly pointed to the location of the hidden gold,@k but no one knew what it meant.'
9947: '@rThe witch had suddenly begun reciting that epitaph.'
9948: 'BEATRICE@r@v27/20700512."...Kanon.@k@v27/20700513. As furniture, you must have heard about this from Kinzo.@k@v27/20700514. .........The day when everything will be returned to the Golden Land...has come."'
9949: 'BEATRICE@r@v27/20700515."Rejoice.@k@v27/20700516. ...The time has finally come for your shameful days as furniture to end."'
9950: 'Kanon@r@v16/20600247."........................hh."'
9951: 'BEATRICE@r@v27/20700517."I believe you have been wanting that for a long time.@k@v27/20700518. ...To furniture, whose existence has no value, just existing day to day must be nothing but agony."'
9952: 'BEATRICE@r@v27/20700519."......For those with souls, the world of the living is worth clinging onto, but those without find it to be nothing but suffering.@k@v27/20700520. *cackle*cackle*...!"'
9953: '@rComplicated expressions flitted across Kanon''s face.'
9954: '@r......It was the day of release that he had been looking forward to.@k@r...However, the coming of this day had been mercilessly sudden.'
9955: '@rAnd the hateful tone of the witch, who had proclaimed this day of rest, made it somehow difficult to accept.'
9956: '@r...Kanon wasn''t even able to decide what emotion he should feel...'
9957: 'BEATRICE@r@v27/20700521."......Why are you not happy?@k @v27/20700522.Could you actually still have some attachments to this world?@k@v27/20700523. ......As furniture?"'
9958: 'Kanon@r@v16/20600248."............I have no...@v16/20600249....attachments.@k@v16/20600250. Because I am...@v16/20600251..........furniture."'
9959: 'BEATRICE@r@v27/20700524."*cackle*cackle*cackle*cackle*.@k@v27/20700525. ...You truly are a model piece of furniture.@k@v27/20700526. ......Very good, very good.@k@v27/20700527. ......However, to have no lingering regrets at all... How deeply uninteresting this is."'
9960: 'Kanon@r@v16/20600252."......Are you saying that regrets are your pleasure?"'
9961: 'BEATRICE@r@v27/20700528."Precisely!@k @v27/20700529.Most witches who live for a thousand years get tired of life!@k @v27/20700530.In order to escape boredom, I adorn people''s fates with fruit and brandy and cook them like cakes.@k@v27/20700531. I find humans dancing through oppressive fates inside an oven to be so very entertaining...!"'
9962: 'BEATRICE@r@v27/20700532."*cackle*cackle*!@k @v27/20700533.I''ve made somewhat of a name for myself in this field, you know?@k @v27/20700534.......So much so that unexpected guests occasionally come from afar to witness my culinary skills.@k@v27/20700535. ...Heheheheh, mere furniture can''t understand this—I am wasting my time."'
9963: '@rKanon wasn''t able to understand what the witch was saying.'
9964: '@rHowever, he realized well enough that this was a terrifying being who treated the fates of humans as a show,@k and was getting enjoyment out of doing them some kind of harm.'
9965: '@r......However, furniture had no soul or life, much less a fate.@k Pitiful "furniture" did nothing but serve until the day they would be released from the world.'
9966: '@r...To furniture like that, the witch, who had come to release them from everything, was also a being overflowing with mercy...'
9967: '@rEven though the day that Kanon had been waiting impatiently for had come, he was unable to readily accept it, and this greatly bewildered him.'
9968: '@r...Why was that...?@k@r.........The face of Shannon, the person he loved as a sister, rose to his mind.@k@r......And for some reason, Jessica''s face did too.'
9969: 'Kanon@r@v16/20600253.".....................kh."'
9970: '@rKanon bit his lower lip painfully.'
9971: '@r......Thinking of Jessica was not permitted for furniture.@k@rHe had been aware of that, and had found fault with Shannon''s relationship, ...so how could he remember Jessica at a time like this?'
9972: '@r......He felt a little ashamed by how weak he was.@k@rAnd to forget about Jessica, he turned his thoughts to Shannon.'
9973: '@rShannon is also furniture.@k@r......On the day everything returns to nothing, there was no reason she shouldn''t be happy.'
9974: '@r......But Shannon,@w416. .........through her relationship with George, had come to know an emotion that shouldn''t be known by furniture.'
9975: '@rEven though she wasn''t qualified to be bound with him, she was still wallowing in a dream that she wasn''t permitted to have.'
9976: '@rCould Shannon...@k......accept something like this, now, with open arms?'
9977: '@r......Impossible.@k ...Shannon would have lingering regrets.@k@r......That would probably become a great source of pain and torture for Shannon.'
9978: '@rAnd those regrets.........had been planted by none other than this witch.'
9979: '@rWhy?@k Just because that would be "more interesting"......!'
9980: 'Kanon@r@v16/20600254."......Shannon......should have been waiting impatiently for this day, but now she will have emotions that she must not know,@k@v16/20600255. ......and will probably have a very hard time forced upon her.@k@|@y@v16/20600256. .........I...thank you for gifting us furniture the day of our release."'
9981: 'Kanon@r@v16/20600257."......And...I hate you for making this day difficult for Shannon to accept...!"'
9982: 'BEATRICE@r@v27/20700536."I wanted to make you feel pain from your regrets as well, just like Shannon.@k@v27/20700537. ......However, with stubborn simplicity you continued to remain furniture, and never allowed me to lead you on."'
9983: 'BEATRICE@r@v27/20700538."............However, it looks like you loved Shannon too dearly, didn''t you?@k @v27/20700539.*cackle*cackle*cackle*cackle*!@k @v27/20700540.Shannon''s regrets became your regrets.@k@v27/20700540_1. ......Will that turn into hatred for me...?"'
9984: 'Kanon@r@v16/20600258."................................."'
9985: 'BEATRICE@r@v27/20700541."If you want to kill me, you can try.@k@v27/20700542. ......*cackle*cackle*cackle*cackle*!@k @v27/20700543.As Kinzo''s furniture, you should have that much power, at least?@k @v27/20700544.However, if you kill me, the day of rest for you furniture will not come for all eternity."'
9986: 'BEATRICE@r@v27/20700545."......Could you withstand that......?@k @v27/20700546.Can you really reject your release by me......?@k @v27/20700547.*cackle*cackle*cackle*!!@k @|@y@v27/20700548..........Kneel!!"'
9987: 'Kanon@r@v16/20600259."Wh-......what...?!"'
9988: 'BEATRICE@r@v27/20700549."Kneel and kiss my shoes.@k@v27/20700550. .........Otherwise, I will leave this place.@k@v27/20700551. ...I will go back and never show myself again for all eternity."'
9989: 'BEATRICE@r@v27/20700552."............So, Kanon?@k @v27/20700553.Could you withstand that...?"'
9990: 'Kanon@r@v16/20600260.".....................khh......"'
9991: 'BEATRICE@r@v27/20700554."If the door to the Golden Land is opened, your life as furniture, that has been full of hardship, will end.@k@v27/20700555. ......If you desire, I will even give you life as a human.@k@v27/20700556. After that, you will be on the same level as Jessica!@k @v27/20700557.Surely you want to know of it, the taste of love...!"'
9992: 'BEATRICE@r@v27/20700558.".........I know even if you try to hide it, you see...?@k @v27/20700559.You grew jealous seeing Shannon wallow in the swamp of sweet love.@k@v27/20700560. ...You are sorely tempted to know the taste of love...@k@v27/20700561. *cackle*cackle*!!"'
9993: 'Kanon@r@v16/20600261."......Stop it...... Stop it...!@k @v16/20600262.Are you trying to lead me on again......?!@k @v16/20600263.I won''t be reduced to a toy to please you...!"'
9994: 'BEATRICE@r@v27/20700562."Hoh.@k@v27/20700563. Then I will make do with Shannon.@k@v27/20700564. You weren''t the only seed I sowed.@k@v27/20700565. There are sometimes those that don''t bear fruit."'
9995: 'BEATRICE@r@v27/20700566.".........You who laid hand upon the key must journey as follows to the Golden Land.@k@v27/20700567. On the first twilight, sacrifice the six chosen by the key.@k@v27/20700568. On the second twilight, those who remain shall tear apart the two who are close..."'
9996: '@rThe witch recited the epitaph again.@k@rIt was so sudden, and diverged so strongly from the current topic.'
9997: '@rHowever, her challenging smile made it seem almost as though she were using that epitaph as a threat to Kanon.'
9998: 'BEATRICE@r@v27/20700569.".........Do you not understand?@k@v27/20700570. ...For the ritual of the epitaph to succeed, on the "second twilight", two who are close must be sacrificed."'
9999: 'BEATRICE@r@v27/20700571."............It could be any two who are close.@k@v27/20700572. A husband and wife, ......or even a pair of lovers.@k@v27/20700573. ......Who will be selected is up to me to decide on a whim, following the rules of the ritual."'
10000: 'BEATRICE@r@v27/20700574."......Don''t you think that there is no one more fitting to be a sacrifice for the second twilight than Shannon as she is now...?@k @v27/20700575.*cackle*cackle*cackle*cackle*cackle*!!"'
10001: 'Kanon@r@v16/20600264.".........Wh-......what a dirty........."'
10002: '@rKanon learned, then.@k ...He had thought that he had given up everything, and lived until today as furniture, like furniture should.'
10003: '@r...But in reality, that wasn''t true.'
10004: '@rHe had loved Shannon too dearly.@k ...And so, when Shannon was in pain, Kanon shared in that.'
10005: '@rIf only Shannon had continued to exist as furniture,@k living indifferently like Kanon, without any attachments to this world, they wouldn''t have had to be in so much pain...!'
10006: '@rThe witch planned to toy with Shannon, who had learned the taste of love—@w500.no, who she had taught the taste of love—as she killed her.'
10007: '@rShe would not invite her to the Golden Land as a merciful release,@k but would make her a sacrifice for that evil ritual, after dealing her the limits of torture and pain...!'
10008: '@rAnd this witch would probably actually make Shannon meet this horrible fate, for no other reason than it would be interesting for her.'
10009: '@r......Furthermore, she was threatening to do that so that she could make Kanon, who hadn''t submitted to the witch even once until now, finally surrender......'
10010: '@rIt was that simple.@k ...In the end, though he had tried resisting the witch to avoid pleasing her, he had only made things interesting for her.'
10011: '@r......After all, he was furniture.@k No, a toy.@k ......They were nothing but toys meant only to distract her from her boredom...!'
10012: 'Kanon@r@v16/20600265."...............Damn......it.................."'
10013: 'BEATRICE@r@v27/20700576."What will you do, Kanon...?@k @v27/20700577.If you kneel, I may even hold back from choosing Shannon as a sacrifice...@k @v27/20700578.*cackle*cackle*cackle*cackle*cackle*!@k @v27/20700579.I always wanted the chance to break a toy like you.@k@|@y@v27/20700580. *cackle*cackle*cackle*cackle*cackle*, kuhihihihihihihihi!!"'
10014: '@rWithout even a fragment of elegance, the witch sneered at Kanon with a vulgar laugh.'
10015: '@r...Yes, even before Kanon had made up his mind, she had seen through to his surrender...'
10016: 'Kanon@r@v16/20600266.".................................kh..."'
10017: '@r......Kanon...............got down on one knee, and chose to genuflect before the witch...'
10018: '@rHe didn''t care what happened to himself.'
10019: '@r...However, ......just the fact that Shannon,@k who during his days as furniture had given him his only reason to live, was being toyed with,@k ......that alone was something that he couldn''t overlook...'
10020: '@rTherefore,@k ......something like kissing the shoes of the witch...was an easy oath for Kanon to make.'
10021: '@r......At the time that his quivering lips actually touched the witch''s shoe...'
10022: '@r...BEATRICE, after allowing a look of ecstasy to rise to her face, ...let out an ear-splitting laugh.'
10023: '@rIn that moment, the witch who had tired of a thousand years of life was completely filled with the evil emotion that was her only raison d''etre......'
10024: '@rLunch had ended, and the relatives had moved to the parlor.'
10025: '@rRosa had bought a high-class brand of black tea from a famous store in Ginza.@k That had been served, and the inside of the parlor was filled with a very nice aroma...'
10026: '@rSince the children were together with the adults,@k the adults were, at least on the surface, interacting like relatives, talking peacefully about recent events and how their children were growing up.'
10027: '@rIt had started raining outside, so the children were unable to go out,@k and had no choice but to sit here like this, watching TV.'
10028: '@rLike a true TV-kid,@k Maria was watching vapid daytime programs one after another without getting bored, and was giggling all to herself.'
10029: '@rIt seemed that Battler had joined in at first, deepening his relationship with Maria,@k but he had gotten up early that morning, and so was gradually attacked by waves of drowsiness...'
10030: 'Battler@r@v10/20100072."......fuaaaaaah..."'
10031: 'George@r@v07/20300232."Oh, that''s a big yawn.@k@v07/20300233. Did you get up really early this morning?"'
10032: 'Battler@r@v10/20100073."...Well, something like that.@k@v10/20100074. I started to relax and release all my tension, and then I got sleepy while I was listening to the sound of the rain."'
10033: 'Jessica@r@v04/20200370."Tension?@k @|@y@v04/20200371.Heheh, you go around making yourself the center of attention and now you''re saying you were tense?"'
10034: 'Battler@r@v10/20100075."That''s me, I guess.@k@|@y@v10/20100076. ......fuaaaaaaaaaaaaaaaaah......"'
10035: '@rBattler gave a great yawn once again, and slowly lay down on the sofa.'
10036: '@rHe really did look tired.'
10037: '@rGeorge and the others had started talking to him, taking his yawns as a sign of boredom, but when they realized he really was sleepy, they decided to let him be.'
10038: 'Kumasawa@r@v18/21800032."My, my.@k@v18/21800033. They say that if you lie down right after eating, you''ll become a mackerel.@k@v18/21800034. Hoh-hoh-ho...!"'
10039: 'Battler@r@v10/20100077."......Stop kidding around.@k@v10/20100078. Gohda-san said that tonight would be calf steak.@k@v10/20100079. In a minute it''s gonna end up as mackerel steak."'
10040: 'Jessica@r@v04/20200372."Kumasawa-san.@k@v04/20200373. The guy really does look tired.@k@v04/20200374. You think you could bring him a blanket?"'
10041: 'Kumasawa@r@v18/21800035."Hoh-hoh-ho.@k@v18/21800036. Here you go."'
10042: '@rKumasawa brought a blanket over from the shelf.@k@r...The spacious parlor wasn''t cold, but the air had gotten a little chilly.'
10043: '@rSo when the blanket was placed over Battler, he immediately wrapped himself up in it, and curled up like a turtle retreating into its shell.'
10044: 'George@r@v07/20300234."...You really were sleepy.@k@v07/20300235. When do you want to wake up?@k @v07/20300236.I''ll take care of it."'
10045: 'Battler@r@v10/20100080."......Nah, I don''t care when.@k@v10/20100081. ......You can wake me up if there''s something you want,@k@v10/20100082. ...and if there''s nothing, you can let me sleep forever.@k@v10/20100083. ......Good night..."'
10046: 'Maria@r@v13/20400173."Uu?@k @v13/20400174.Battler sleeping?@k @|@y@v13/20400175.Naptime?@k @v13/20400176.Naptime?@k @v13/20400177.Uu-uu, me too!"'
10047: 'Jessica@r@v04/20200375."H-hey, Maria.@k@v04/20200376. Battler''s sleepy, so you gotta leave him alone.@k@v04/20200377. Kumasawa-san, could we get another blanket?"'
10048: '@rIt was doubtful that Maria really wanted to take a nap.@k@rShe probably just saw Battler wrapped up in a blanket and wanted to do the same.'
10049: '@rWhen she received the blanket from Kumasawa, she joyfully wrapped herself up in it and set up camp again in front of the TV.'
10050: 'Jessica@r@v04/20200378."Sheesh.@k@v04/20200379. ...Even though all us cousins are finally together after six years.@k@v04/20200380. Dude doesn''t have a clue that he''s the main guest of this family conference, does he?"'
10051: 'Battler@r@v10/20100084."......I can hear youuu...@k@v10/20100085. ...I''ve had a nice peaceful lunch, and there''s even a typhoon and rain outside.@k@v10/20100086. ......There''s nothing to do, and what that means is: it''s not my turn yet."'
10052: 'George@r@v07/20300237."I wonder about that.@k@v07/20300238. If you have a passive attitude like that, and don''t do anything unless something happens, your life will be pretty boring, you know?"'
10053: 'Battler@r@v10/20100087."......No, that''s not what I mean.@k@v10/20100088. ...How should I say it?@k@v10/20100089. ...In times like this, I''ve decided to think this way.@k@v10/20100090. ......It isn''t my turn."'
10054: 'Battler@r@v10/20100091."If this were a play, it wouldn''t be my turn to go on stage.@k@v10/20100092. ......So the best thing to do is stay on the wings."'
10055: 'Jessica@r@v04/20200381."You''re always the main character of your own life, right?@k @v04/20200382.Why are you acting like a supporting actor?@k@v04/20200383. ...You have to get up on the stage yourself without being pushed."'
10056: 'Battler@r@v10/20100093.".........That''s not what I mean.@k@v10/20100094. I''m just saying it''s not my turn right now...@k@v10/20100095. kuaaaaaaaaaaah......@k@v10/20100096. Sorry, I''m sleepy and my mind''s a mess.@k@v10/20100097. Just let me be......@k@v10/20100098. *mumble*......"'
10057: 'George@r@v07/20300239."So it seems.@k@v07/20300240. You''re so sleepy that you aren''t making any sense.@k@v07/20300241. ...Let''s leave him alone now."'
10058: 'Jessica@r@v04/20200384."I can''t let that one slide.@k@v04/20200385. ...You are always the main character in your own life.@k@v04/20200386. I kinda want to have a serious argument with Battler about that!"'
10059: 'George@r@v07/20300242."He''s just half-asleep.@k@v07/20300243. Don''t take him too seriously."'
10060: 'Jessica@r@v04/20200387.".........I dunno why, but...@k@v04/20200388. That kind of personality, saying you don''t want to get up on the stage because you can''t be the main character.@k@v04/20200389. ......Something about that really pissed me off..."'
10061: '@rWith distant eyes, Jessica gazed out the window at the gray rose garden obscured by rain...'
10062: '@rWhen she put her forehead up against the glass, it felt as though the pleasantly cool sensation would chase away memories that she didn''t want to remember...'
10063: 'Jessica@r@v04/20200390."............It wasn''t your turn yet, was that it?@k@v04/20200391. ...Then, ......when will you get up on the stage......"'
10064: '@rIn that case, who is the main character on this stage...?'
10065: 'Battler@r@v10/20100099.".........You''re just doing whatever you goddamn want!@k@v10/20100100. ...What the shit is this?@k@v10/20100101. ......This is just demented...!!"'
10066: 'BEATRICE@r@v27/20700581."*cackle*cackle*cackle*cackle*...!@k @v27/20700582.Your argument regarding 18 or 19 people, which you use as a basis to deny me, was truly ludicrous, you see.@k@v27/20700583. So I merely tried a different move."'
10067: 'BEATRICE@r@v27/20700584."...The greatest basis upon which you deny me is simply that I was not laid out as a piece on the game board.@k@v27/20700585. In that case, I can simply play the queen first like this, can I not?@k@v27/20700586. ...Isn''t opening the path for the queen in the first move one of the classic plays in chess?"'
10068: 'Battler@r@v10/20100102.".........Real fucking funny...@k@v10/20100103. How the hell...can I accept something like this?!@k @v10/20100104.A witch just came walking in right through the entrance hall?!@k @|@y@v10/20100105.What a royal load of bullshit!!"@|@y'
10069: 'BEATRICE@r@v27/20700587."What''s this...?@k@v27/20700588. In the last game, I let you make moves as and when you pleased, you know...?@k @v27/20700589.All I have done on this occasion is to move a piece to match your moves.@k@v27/20700590. .........Are you resigning already on the very first turn...?"'
10070: 'Battler@r@v10/20100106."......U-.........up yours...@k@v10/20100107. Like hell I am!@k @v10/20100108.Who''s gonna resign?!@k @v10/20100109.Great move, why don''t you just keep on playing however you like."'
10071: 'Battler@r@v10/20100109_1."I get it, your turn is far from over.@k@v10/20100109_2. ...Move however you like!@k @v10/20100109_3.Form a huge battle formation while you can."'
10072: 'Battler@r@v10/20100110."I will definitely endure.@k@v10/20100111. I will definitely corner you!!@k @v10/20100112.Come at me as best you can—I don''t want you to have any excuses."'
10073: 'Battler@r@v10/20100113."......This much isn''t even close to enough to make me accept something like a witch."'
10074: 'Battler@r@v10/20100114."...That''s right, just now, it looked like you fixed Maria''s candy with magic,@k@v10/20100115. but you might have actually had another one of the same candy hidden in your pocket, and switched them with some fancy showmanship, making it only look like you had fixed it with magic!@k @v10/20100116.Yeah, that''s right, that has to be it, and it''s no good, it''s no goddamn good...!"'
10075: 'BEATRICE@r@v27/20700594."......Hohoh?@k @v27/20700595.Rosa saw the moment when the candy split into butterflies, did she not?"'
10076: 'Battler@r@v10/20100117."Whatever, I don''t care!!@k @v10/20100118.That was a hallucination or a trick, or...otherwise, she just saw it wrong!!@k @v10/20100119.That isn''t a big problem!!"'
10077: 'BEATRICE@r@v27/20700596."*cackle*cackle*cackle*cackle*!@k @v27/20700597.So you throw out the part you can''t explain as trivial?@k@v27/20700598. ......I see, is that your move in response to mine...?"'
10078: 'BEATRICE@r@v27/20700599."*cackle*cackle*cackle*cackle*... You''ve dug your own grave.@k@v27/20700600. ...Ushiromiya Battler...@k@v27/20700601. Fuhahahahahahahahahahaha...!!@k @v27/20700602.It still isn''t your turn yet.@k@v27/20700603. Allow me to continue my move for a little longer.@k@v27/20700604. It has barely begun, the Turn of the Witch!!"'
10079: '@rWhen they started hearing Battler''s snores, the relatives went their separate ways, leaving the parlor and letting Battler sleep in silence.'
10080: '@rEven though it had been so lively in the parlor with so many people gathered there,@k ......when all of them scattered at once and were sucked into the vast mansion, it created an eerie silence, with no sound except that of the rain...'
10081: 'Rudolf@r@v08/21200108."Nope.@k@v08/21200109. I''ve never once met a person like that.@k@v08/21200110. ...Aneki?"'
10082: 'Eva@r@v05/21000119."...I''ve never met her.@k@v05/21000120. ......Kyrie-san, is that true?"'
10083: 'Kyrie@r@v09/21300074."......Even I only greeted her quickly when she came into the entrance hall.@k@v09/21300075. She looked like she was a little over twenty.@k@v09/21300076. I told her my name, but she didn''t tell me hers.@k@v09/21300077. ...She was being guided by Genji-san, and I saw her go up to the second floor."'
10084: 'Hideyoshi@r@v06/21100036."So it''d probably be faster to find Genji-san and hear the story from him directly.@k@v06/21100037. ......Still, what a strange turn of affairs..."'
10085: '@rThe mystery woman had spoken to Kyrie.@k@rWithout naming herself, she had sneered that Kyrie already had a vague idea of who she was.'
10086: '@r......And the person that brought to mind...@k@r...was her look-alike, the witch of the portrait...'
10087: 'Rudolf@r@v08/21200111."Was she trying to say that she''s...@v08/21200112....the witch of the portrait?"'
10088: 'Kyrie@r@v09/21300078."That''s what I understood her to be laughing at.@k@v09/21300079. ......Even though it was our first meeting, she spoke as though she knew I''m your second wife."'
10089: 'Rudolf@r@v08/21200113."......Aneki.@k@v08/21200114. You really don''t know someone like that?"'
10090: 'Eva@r@v05/21000121."Stop asking me that.@k@v05/21000122. I have never seen a blonde woman like that go in or out of this mansion!"'
10091: 'Hideyoshi@r@v06/21100038."None of that matters.@k@v06/21100039. ...The problem is what happens if that woman starts callin'' herself BEATRICE, if she starts callin'' herself the manager of Father''s assets."'
10092: 'Eva@r@v05/21000123."Or, ...maybe she plans to call herself his mistress''s daughter, and demand a portion of the inheritance.@k@v05/21000124. ......Either way, an outrageous joker has been slipped into the deck.@k@|@y@v05/21000125. .........Did Nii-san call her?@k @v05/21000126....Or did Father...?"'
10093: 'Rudolf@r@v08/21200115."This is bad.@k@v08/21200116. ...We''ve been thinking that if we did a good enough job cornering Aniki in our discussion, we might be able to work things out.@k@v08/21200117. ......But this takes us back to square one."'
10094: 'Kyrie@r@v09/21300080."............@k@v09/21300081. ...I don''t know what kind of schemes you''ve been plotting when I''m not around, baby,@k@v09/21300082. ......but it looks like we''ve been given a little time to form a counter-strategy."'
10095: 'Rudolf@r@v08/21200118."...Yeah.@k@v08/21200119. Thinking about what would have happened if Miss Blondie had suddenly appeared at the dinner table and scared the shit out of us,@k@v08/21200120. we should be glad we''ve at least been given a little time to discuss a counter-strategy."'
10096: 'Hideyoshi@r@v06/21100040."...There''s only so many counter-strategies we can use if we don''t know what she came to do.@k@v06/21100041. ......What could she be after...?"'
10097: 'Eva@r@v05/21000127."Isn''t it obvious!@k @v05/21000128.It''s to claim that she''s the rightful heir to Father''s inheritance!@k @v05/21000129.Father is still captivated by BEATRICE.@k@v05/21000130. If the two of them had a daughter, he''d be bound to say he wants to hand her all of his assets!@k @v05/21000131.She might even thrust some strange will before us!"'
10098: 'Eva@r@v05/21000132."...Sure, if we took it to court, we might be able to claim a quarter of a half of it...@k@v05/21000133. ......But we probably wouldn''t be able to split the inheritance until that was resolved."'
10099: 'Eva@r@v05/21000134."...That''s a problem.@k@v05/21000135. For me and for Rudolf!@k @v05/21000136.And of course, for Rosa too, right?"'
10100: 'Rudolf@r@v08/21200121."......For all of our various situations, we need a large sum of money urgently.@k@v08/21200122. ...It''s our biggest weak point.@k@|@y@v08/21200123. Then, ......what are they after?@k@v08/21200124. Kyrie, ...can you tell?"'
10101: 'Kyrie@r@v09/21300083.".................................@k@v09/21300084. ......It''s the first I''ve heard of it, but one of the premises here is that we have an urgent need for a large sum of money, right?"'
10102: 'Rudolf@r@v08/21200125.".....................nn......"'
10103: 'Hideyoshi@r@v06/21100042."......Kyrie-san.@k@v06/21100043. When you''re on the offensive in a man''s business, that''s the time you need funding.@k@v06/21100044. Please understand that."'
10104: 'Eva@r@v05/21000137.".........What''s thiiis, Rudolf?@k@v05/21000138. You hadn''t told Kyrie-san about it?"'
10105: 'Rudolf@r@v08/21200126."...Sorry.@k@v08/21200127. I wasn''t really hiding it.@k@v08/21200128. ......The truth is, we''ve been having a bit of a—"'
10106: 'Kyrie@r@v09/21300085."It''s alright.@k@v09/21300086. You decided it wasn''t necessary to tell me about it,@k@v09/21300087. so I won''t press you about it here."'
10107: 'Kyrie@r@v09/21300088."......What''s more important is finding out what the Golden Witch is after, right?"'
10108: 'Rudolf@r@v08/21200129."Yes...@k@v08/21200130. .........Putting together everything we''ve said, can you see what move the enemy will make against us?"'
10109: '@rRudolf had a certain measure of trust in Kyrie''s unique thinking technique, "chessboard thinking".'
10110: '@rOf course, it didn''t give him any more peace of mind than fortune telling,@k but every time Rudolf was concocting some important strategy, he would give a great deal of thought to Kyrie''s advice...'
10111: '@rFor a while, Kyrie pressed her finger against her forehead, considering...'
10112: 'Kyrie@r@v09/21300089.".........Judging by the fact that her coming here was kept hidden until today,@k@v09/21300090. one of her goals is some kind of surprise that she wants to give us."'
10113: 'Kyrie@r@v09/21300091.".........We can''t know whether that has something to do with assets or being recognized as a relative."'
10114: 'Kyrie@r@v09/21300092."However, because her visit was kept hidden until today,@k@v09/21300093. maybe we can say that she didn''t want to get hit with a countermeasure by notifying us in advance.@k@v09/21300094. Which means that it seems her goal is one where it would be disadvantageous to her if we did take some countermeasure.@k@v09/21300095. ...Understand?"'
10115: 'Rudolf@r@v08/21200131."I get it...@k@v08/21200132. For example, if it was something like a will which Dad had written previously, or acknowledgement as a blood relative plus accompanying proof,@k@v08/21200133. if we assume she''s brought something like that..."'
10116: 'Rudolf@r@v08/21200134."......then if it was completely unshakeable—if it was rock-solid proof—you''d think she''d actually have announced it beforehand."'
10117: 'Eva@r@v05/21000139."...That''s right.@k@v05/21000140. Since we are in a position to doubt her, she should have made us bring our lawyers and experts,@k@v05/21000141. and thrust some completely undeniable proof before us.@k@v05/21000142. If she could."'
10118: 'Hideyoshi@r@v06/21100045."Hmmmm.@k@v06/21100046. ...So just given that the enemy''s aimin'' for a surprise attack, that alone tells us she couldn''t beat us with an honest attack from the front.@k@|@y@v06/21100047. Makes sense.@k@v06/21100048. If you''ve got a trump card that''ll win for sure, you gotta play it out boldly.@k@v06/21100049. Play it in a roundabout way, and odds are you''re goin'' to tarnish its impact."'
10119: 'Kyrie@r@v09/21300096."......To skip to the conclusion,@k@v09/21300097. ...we should probably expect that some huge surprise will be thrust in front of us,@k@v09/21300098. something related either directly or indirectly to the inheritance problem that everyone is so infatuated with.@k@v09/21300099. ...The other party is probably under the impression that they will be able to overpower us with the impact of this alone."'
10120: 'Kyrie@r@v09/21300100."......However, even if this carries with it a significant impact, it is not absolute."'
10121: 'Eva@r@v05/21000143."In other words, ......we have enough leeway to take advantage of this."'
10122: 'Hideyoshi@r@v06/21100049_1."You''ve really got brains!@k @v06/21100049_2.Even understandin'' just this much is really reassurin''!@k @|@y@v06/21100049_3.So you''re tellin'' us not to get sucked into our opponent''s pace."'
10123: 'Kyrie@r@v09/21300104."...In the end, it''s an extremely simple conclusion.@k@v09/21300105. No matter what the opponent brings up, interact calmly, without panicking.@k@|@y@v09/21300106. ......That''s Negotiation 101.@k@v09/21300107. I really can''t call that predicting our opponent''s thoughts."'
10124: 'Rudolf@r@v08/21200135."Come on.@k@v08/21200136. ...Just like usual, that was pretty good.@k@v08/21200137. .........Now that we know that we have a little leeway to attack, it gives us a little more room to relax."'
10125: 'Kyrie@r@v09/21300108."What we don''t know is how she is connected to Krauss nii-san.@k@v09/21300109. ......Is it a surprise for Krauss nii-san too, or was the person who called her here none other than Krauss nii-san himself?"'
10126: 'Kyrie@r@v09/21300110."......If it''s the latter, it might make things very troublesome."'
10127: 'Eva@r@v05/21000144."............Yes.@k@v05/21000145. ...Secretly calling a mystery woman on the day of the family conference.@k@v05/21000146. ...That detestable style somehow feels like Nii-san."'
10128: 'Rudolf@r@v08/21200138."Aneki, let''s handle it like this.@k@v08/21200139. ...As long as she can''t clearly prove her identity, we won''t acknowledge her as having any status whatsoever."'
10129: 'Eva@r@v05/21000147."That would be best.@k@v05/21000148. ......In point of fact, she hasn''t even named herself to Kyrie-san.@k@v05/21000149. ...We can''t let our conference be disturbed by the statements of some unknown woman."'
10130: 'Hideyoshi@r@v06/21100050."......She might show us proof that she''s a blood relative or something.@k@v06/21100051. If she can show that Father''s blood runs through her veins, like with a maternity record document, there''s nothin'' we can do."'
10131: 'Rudolf@r@v08/21200140."We can suspect any proof of being fake.@k@v08/21200141. Even if it is the real thing, in order to prove that she is the person mentioned, we would need to involve a hospital.@k@|@y@v08/21200142. ...At the very least, it will be impossible to prove that now, on Rokkenjima."'
10132: 'Eva@r@v05/21000150.".........Yes, that''s it exactly.@k@v05/21000151. In other words, what it boils down to is this:@k@v05/21000152. No matter what is shown to us now on Rokkenjima, it can''t be accepted as truth."'
10133: 'Eva@r@v05/21000153."So we can''t believe anything until the typhoon passes and they prove it to us at the proper place.@k@v05/21000154. ...*giggle*."'
10134: 'Rudolf@r@v08/21200143."Constantly finding fault like that is your speciality, Aneki.@k@v08/21200144. This is gonna be all down to you."'
10135: 'Eva@r@v05/21000155."Are you an idiot?@k@v05/21000156. You''ll be helping too.@k@v05/21000157. ......We need money.@k@v05/21000158. And quickly, and a large sum!@k @v05/21000159.We''re all in this together."'
10136: 'Eva@r@v05/21000160.".........There''s no way I''m having my prospects of an inheritance destroyed now by some mystery woman who popped out of nowhere...!"'
10137: '@rIt was only at a time like this that Rudolf and Eva united as siblings,@k sickened by the idea that their own inheritance might be snatched away by an outsider.'
10138: '@rKyrie noticed how indomitable they looked, shook her head slightly, and gave a small sigh as she looked out the window.'
10139: '@rOutside, there was still a strong rain falling, and everything was gray, having lost all vibrance.'
10140: '@rIt felt like the lush garden that the sun had shone on earlier had never existed.'
10141: '@rFor some reason, the words Eva had said just a short while ago kept repeating in Kyrie''s head.'
10142: '@r.........It boils down to this.@k No matter what is shown to us now on Rokkenjima, it can''t be accepted as truth.'
10143: '@rThere was an odd nuance to those words.'
10144: '@rRight now, this island was closed off by the typhoon and isolated.@k@rThere were no official institutions here, and no hospital.'
10145: '@rSo, no matter what institution had issued what kind of documentation, on this island, one could claim that it was all fiction.@k It was impossible to prove that something was the truth.'
10146: '@rThey were cut off from the outside world, and all truths proven in the outside world would be called "fiction"...'
10147: '@rSo did that mean...@k...that now, on this Rokkenjima, there was nothing that was truthful?'
10148: '@r......That everything would be controlled by "fiction"?'
10149: '@rIt almost gave the illusion...@k...that separate from the human world made from truth...@kwas another world called fiction, in which they had been shut away.'
10150: '@r......Kyrie remembered what that woman had looked like one more time.'
10151: '@rAnd she remembered the woman''s figure, and the witch of the portrait.'
10152: '@rOn this island, which had been isolated from the world of humans, and shut away in the world of nonhumans, ......a nonhuman being had visited.'
10153: '@rNo matter what she did, Kyrie couldn''t help think of the smile that had appeared on that woman''s face as anything other than ominous......'
10154: '@rIn trying to understand that ominous smile,@k ...it feels like my chessboard thinking mistook a vital premise.'
10155: '@r...That''s right,@k that smile seemed like that of something nonhuman looking down on me.@k I had reasoned based on the assumption that our opponent was a "human" like us.'
10156: '@r......However,@k just like this island now, she may be a being that is not human, and human values may not apply to her.'
10157: '@rIn that case...@k......all reasoning is useless.@k@rFor what reason was the witch invited here today?'
10158: '@r.........Only one thing is certain.@k ...Right this very moment, she is staying somewhere in this vast mansion...'
10159: 'Rosa@r@v12/21400161."......Maria.@k@v12/21400162. ......Around lunchtime today, we.........met someone outside, right?@k @v12/21400163.A woman.@k@v12/21400164. Who......was she?"'
10160: 'Maria@r@v13/20400178."...Uu.@k@v13/20400179. Said it a lot.@k@v13/20400180. ...BEATRICE."'
10161: 'Rosa@r@v12/21400165."Maria, have you ever met BEATRICE before...?"'
10162: 'Maria@r@v13/20400181."Uu.@k@|@y@v13/20400182. See her every year."'
10163: 'Rosa@r@v12/21400166."Every year...?@k @v12/21400167.In this mansion on Rokkenjima?"'
10164: 'Maria@r@v13/20400183."Uu."'
10165: 'Rosa@r@v12/21400168."...I don''t know what "uu" means!@k @v12/21400169.Is that true?!"'
10166: 'Maria@r@v13/20400184."......Yeah."'
10167: 'Rosa@r@v12/21400170."How long have you been seeing her?@k @v12/21400171.How many years ago did it start?!"'
10168: 'Maria@r@v13/20400185."...Uu.@k@v13/20400186. ......Dunno."'
10169: 'Rosa@r@v12/21400172."You don''t know?!@k @v12/21400173.Why?!@k @v12/21400174.Last year?@k @v12/21400175.Two years ago?!"'
10170: 'Maria@r@v13/20400187."......Longer.@k@v13/20400188. ......Uu."'
10171: '@rRosa was aghast.@k ...Only the Ushiromiya mansion existed on this island.@k So there was no way that there were any humans other than themselves on this island.'
10172: '@rAnd yet, Maria said that she had been meeting with that suspicious woman every year during the family conference......'
10173: '@rIf what Maria said was the truth,@k ......then that strange woman called BEATRICE had been at the family conference every year.'
10174: '@r......That''s insane.'
10175: '@rIs she saying that some eerie woman was at the family conference every year, and none of us ever noticed it...?!'
10176: '@rEven though Rosa had just met her herself a couple of hours ago in the rose garden,@k she was overcome with a strange emotion which told her not to accept her existence...'
10177: '@r"What" in the world did I meet with earlier today in the rose garden, as the typhoon grew close and the winds blew strong......?'
10178: 'Rosa@r@v12/21400176."......Maria.@k@v12/21400177. So, you said that you see her every year.@k@v12/21400178. ...What do you do together?"'
10179: 'Maria@r@v13/20400189."Uu.@k@v13/20400190. Sing songs, learn magic.@k@v13/20400191. Learn how to draw magic circles."'
10180: 'Rosa@r@v12/21400179."Re-...really?@k@v12/21400180. That''s incredible.@k@|@y@v12/21400181. ......Maria, you often scribble—@v12/21400182.sorry, draw magic circles, in your notebook, right?@k @v12/21400183.Did she teach you that?"'
10181: 'Maria@r@v13/20400192."Uu!@k @v13/20400193.BEATRICE draws what they should look like!@k@v13/20400194. Here, look! Look!"'
10182: '@rMaria joyfully fished around in her handbag.'
10183: '@r......Then, she took out a notebook and started opening its pages.'
10184: '@rMost of the pages were covered with drawings that were literally scribbles.'
10185: '@rAll of them were occult-like things,@k and while it might sound rude to Maria who was joyfully flipping through the pages, they were all creepy.'
10186: 'Maria@r@v13/20400195."Look! Here!@k @v13/20400196.BEATRICE drew these for me!!@k @v13/20400197.Uu!!"'
10187: '@rOn each page Maria opened to, there was another eerie magic circle that had been drawn.'
10188: '@r......Furthermore, at a glance, Rosa realized that Maria hadn''t drawn them.'
10189: '@rThe strength of the strokes, the thickness of the lines, how clean the shape was.@k@r......This by itself wasn''t enough to guess the background of the person who had drawn it,@k but it was enough for Rosa to understand that it was definitely someone older than Maria.'
10190: '@rRosa had to accept it now.'
10191: '@r...There really was a person on this Rokkenjima who she hadn''t even known existed,@k and this person had been playing with Maria during the family conference every year.'
10192: 'Rosa@r@v12/21400184.".........Maria.@k@v12/21400185. Umm, does this witch BEATRICE live here...?@k @v12/21400186.Or does she live outside the island like us...?"'
10193: 'Maria@r@v13/20400198."Uu.@k@v13/20400199. ......BEATRICE is the witch of Rokkenjima, so she lives on this island."'
10194: 'Rosa@r@v12/21400187.".........So, you''re saying that she''s on the island even when it isn''t the family conference, ...right......?"'
10195: 'Maria@r@v13/20400200."Uu."'
10196: 'Rosa@r@v12/21400188."I don''t know what "uu" means!!@k @v12/21400189.Well?!"'
