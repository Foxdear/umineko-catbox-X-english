11134: '@rIt was an eerie scene, ...as though a small, fun-looking Halloween party had been stopped in time...'
11135: 'Rosa@r@v12/21400273."......They''re all......@k@v12/21400274.......sleeping...?@k @v12/21400275.............?"'
