11075: 'Rosa@r@v12/21400263."...There''s no way I can give you approval to do that.@k@v12/21400264. It''s Father''s precious chapel, I can''t do something like that.@k@v12/21400265. ....................."'
11076: '@rThen the events of the previous day swirled around in the back of Rosa''s mind...'
11077: '@r......That''s right,@w500. ......when I met that witch in the rose garden,@w583. ...didn''t she hand Maria an envelope?'
