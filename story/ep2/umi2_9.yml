11156: '@rWhen she had put the knife in, ......from the inside, her very favorite—but because no one had told her about it at all—@kbright-red—bright-red—ketchup omelet-rice had...poured out like blood-stained maggots,@k buwaa,@w250. dripping,@|@y@w166. slimy,@|@y@w166. pulpy,@w250. sticky!!@|@y'
