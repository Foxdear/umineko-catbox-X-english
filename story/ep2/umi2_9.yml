11097: 'Rosa@r@v12/21400268."......Genji-san.@k@v12/21400269. ......Could this key......be the key to the chapel?"'
11098: 'Genji@r@v14/21600077."Where did you......@k@v14/21600078. ...Yes, this is the key to the chapel."'
