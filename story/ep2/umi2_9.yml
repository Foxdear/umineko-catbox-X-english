11183: 'Rosa@r@v12/21400285."Ge-...Genji-san, Shannon-chan, please ask Father for instructions.@k@v12/21400286. Gohda-san, go together with Kanon-kun and call the police.@k@v12/21400287. ...Then, have Doctor Nanjo come here and..."'
