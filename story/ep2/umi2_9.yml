11057: '@rThe symbols matched.@k ......The Golden Witch, BEATRICE...!'
11058: 'Rosa@r@v12/21400254."Wh-what about Maria?!@k @v12/21400255.That kid should be sleeping with her cousins, right?@k @v12/21400256.Did you check?!"'
11059: 'Genji@r@v14/21600071."......My apologies.@k@v14/21600072. We just now realized that Maria-sama''s name was written here.@k@v14/21600073. ...We still have not checked.@k@v14/21600074. I shall—"'
11060: 'Rosa@r@v12/21400257."What are you doing?!!@k @v12/21400258.I''ll go check on Maria and come back!@k @v12/21400259.Also, inform Krauss nii-san and the rest.@k@v12/21400260. Receive their instructions on how to proceed!"'
