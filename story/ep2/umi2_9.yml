11045: 'Rosa@r@v12/21400247."Then, who was the first person to find it?!"'
11046: 'Shannon@r@v15/20500649."Tha-...that was me.@k@v15/20500650. ......When I went to the dining hall to clean away the tea set, ......there was a memo with "chapel" written on it..."'
11047: '@rShannon held out the memo with a shaking hand.'
11048: 'Rosa@r@v12/21400248."......Whose handwriting?@k @v12/21400249.It isn''t Nii-san''s or Nee-san''s handwriting.@k@v12/21400250. ...And then you came here and found this, right?"'
11049: 'Shannon@r@v15/20500651."Yes......"'
11050: 'Kanon@r@v16/20600377."...Rosa-sama, .........look at this."'
11051: 'Rosa@r@v12/21400251."What?@k @v12/21400252................<Happy Halloween>...<for>...@k@|@y@v12/21400253.......wha—?!"'
