11039: '@rProbably, all of the servants gathered there were the same.'
11040: '@r......Without seeing it with their own eyes, they couldn''t understand what was going on.'
11041: '@rBecause, on the door that was the entrance to the chapel,@k ......drawn very large, ......with a creepy, sticky paint-like substance that made one think of blood, ...was something like a creepy magic circle.'
11042: 'Rosa@r@v12/21400243."Wh-@v12/21400244..........what is...@v12/21400245....this............?@k@v12/21400246. When was it drawn here?!"'
