11185: '@rThe servants accepted their orders and dashed outside.'
11186: '@rAfter watching them leave, ...............Rosa once again fixedly cast her eyes upon her siblings, who had been through life''s joys and sorrows with her, and their partners.@k ......Even though there could be nothing more tragic, ...for some reason, their fantastical deaths tempted her...@kto describe them as beautiful.........'
11187: 'Battler@r@v10/20100220."...They''re not here.@k@v10/20100221. Where''d they go?"'
11188: 'Jessica@r@v04/20200463."The servant room and the kitchen are both empty, too.@k@v04/20200464. ...What the hell happened?"'
11189: 'Maria@r@v13/20400310."Uu-uu-uu!!@k @v13/20400311.Mamaaa!!@k @v13/20400312.Mamaaa, where are youuu?!!@k @v13/20400313.My letter!@k @v13/20400314.My letter I got from Beato!@k @v13/20400315.Give it back!@k @v13/20400316.Give it baaaack!!@k @v13/20400317.Wau-aau-auu!!"'
11190: 'George@r@v07/20300400."Perplexing.@k@v07/20300401. ...Battler-kun, are you sure it was Auntie Rosa?"'
11191: 'Battler@r@v10/20100222."......Well, I was half-asleep so I''m not too confident.@k@v10/20100223. But I get the feeling that, at dawn, Auntie Rosa came in and fished around in Maria''s handbag."'
11192: 'Battler@r@v10/20100224."...I was just half-asleep, and assumed that there was a tube of toothpaste or something in Maria''s handbag."'
11193: 'Jessica@r@v04/20200465."Why would there be a tube of toothpaste in Maria''s handbag?@k@v04/20200466. I''d bet my ass you dreamed the whole thing."'
11194: '@rBattler vaguely remembered Rosa entering the cousins'' room.@k And Maria, who had woken up first, had started rampaging around, saying that someone had opened the envelope that she had been keeping safe.'
11195: '@r...And so they had started wondering whether Rosa might have come and opened it.'
11196: 'Jessica@r@v04/20200467."......A letter from the Golden Witch...@k@v04/20200468. I wonder what was inside."'
11197: 'George@r@v07/20300402."Who knows.@k@v07/20300403. ...But that envelope was one with the Ushiromiya family crest on it, for Grandfather''s personal use.@k@v07/20300404. ............It''s hard to believe that what was in there doesn''t have anything to do with the family conference."'
11198: '@rShe hadn''t let anyone touch it, but yesterday, Maria had bragged a lot about the envelope to Battler and the rest.@k ...So they remembered it well.'
11199: 'Maria@r@v13/20400318."Uu-uu-uu!!@k @v13/20400319.Mama, give it back!@k @v13/20400320.Mama, give it back!!@k @v13/20400321.Uu-uu-uu!@k @v13/20400322.Waauuuuuuuuuuuuu!!"'
11200: 'Battler@r@v10/20100225."......If you''re right, George-aniki, it sounds pretty important.@k@v10/20100226. ...But if it was so important, why did the witch give it to Maria?@k @v10/20100227....I don''t have a clue."'
11201: '@rThe refreshing morning atmosphere had been completely wiped out by the occasional sounds of thunder.'
11202: '@r...It was only natural.@k Since the time they had woken up, they hadn''t met anyone other than themselves.'
11203: '@rIt felt like the mansion had become an empty husk, leaving only them behind.'
11204: 'Jessica@r@v04/20200469."......Heeeeey!@k @v04/20200470.Anyone theeeere?!@k @v04/20200471.Answer mee!"'
11205: '@rAfter Jessica called out into the hallway, an answer finally came back.@k It was from the entrance hall.'
11206: 'Nanjo@r@v19/21900087."I can hear youu.@k@v19/21900088. ...Has something happened?"'
11207: 'George@r@v07/20300405."It''s Doctor Nanjo.@k@v07/20300406. ...Great.@k@v07/20300407. It looks like everyone hasn''t disappeared from this island but us."'
11208: 'Jessica@r@v04/20200472."Doctor Nanjo, good morning.@k@|@y@v04/20200473. ...Umm, sorry, but do you know where our parents went...?"'
11209: 'Nanjo@r@v19/21900089."Dear me.@k@v19/21900090. ...I have only just come here after waking up, you see.@k@v19/21900091. I have no idea, I''m afraid."'
11210: '@rIt was only natural.@k Nanjo was a guest like the rest of them.@k He had just now come to pass the time in the parlor until breakfast.'
11211: 'Maria@r@v13/20400323."Uu-uu-uu!!@k @v13/20400324.Doctor Nanjo, Mama took it, Mama took my letter!!@k @v13/20400325.Give it back, give it back, uu-uu-uu!!!"'
11212: '@rMaria buried her face in Nanjo''s well-built stomach, sobbing and crying.'
11213: '@r...Nanjo could do nothing but be bewildered at what was going on so early in the morning.'
11214: 'Battler@r@v10/20100228.".........nn.@k@v10/20100229. Someone''s running this way.@k@v10/20100230. Jessica!@k @v10/20100231.Someone''s coming!"'
11215: '@rFrom down the hall, they could sense people running hurriedly.'
11216: '@rWhen they looked, they saw that it was Gohda and Kanon.'
11217: '@r......Running inside the mansion should have been immodest for a servant.@k@rAnd yet, Battler and the rest didn''t even think to question that now.'
11218: '@rMaria''s sobbing had become so unmanageable, they wanted to ask someone, anyone, where Rosa was.'
11219: '@rBut the two servants ignored Jessica as she waved her hand.'
11220: '@rGohda flew into the servant room, and Kanon, noticing that Nanjo was here, bowed and approached him at a quick pace, and whispered something into his ear.'
11221: 'Nanjo@r@v19/21900092."...............What did you say?@k @v19/21900093.Rosa-san is?"'
11222: 'Kanon@r@v16/20600387."Yes.@k@v16/20600388. I will guide you, so please accompany me."'
11223: 'Nanjo@r@v19/21900094."Alright..."'
11224: 'Kanon@r@v16/20600389."This way."'
11225: '@rWithout saying anything more than that, Kanon finally noticed Jessica and bowed to her.'
11226: '@r...But he wasn''t calm.'
11227: '@rHe dashed back down the corridor by which he had come, followed by Nanjo.'
11228: '@rBy looking at how hurried they were, Battler and the rest realized that something bad really had happened.'
11229: '@rThey saw Gohda through the door to the servant room, which had been flung open.'
11230: '@r...He had the telephone receiver in hand and was violently pressing the hook.'
11231: '@rFrom that, they realized that he was trying to call a hospital, or the police, or in any event he was trying to call someone because a serious emergency had occurred.'
11232: 'Battler@r@v10/20100232."Let''s go see what''s going on...!"'
11233: 'George@r@v07/20300408."Yeah...!"'
11234: 'Maria@r@v13/20400326."Mamaaa, give it baaack!!@k @v13/20400327.Give back my letterrr!!@k @v13/20400328.It''s an invitation to the Golden Land!!"'
11235: '@rThey didn''t know what, ...but something was happening.@k@rBattler and the rest chased after Kanon and Nanjo...'
11236: '@rAaah......and then we realized.@k Kanon-kun had called Doctor Nanjo, but he hadn''t called us.'
11237: '@r...So we should never have followed.'
11238: '@rI wonder if Alice regretted her excess curiosity when she chased after the rabbit holding a watch......'
11239: 'Rosa@r@v12/21400288."No, you mustn''t come in!!@k @v12/21400289.You mustn''t look!!@k @v12/21400290.Jessica-chan!@k @v12/21400291.No!!"'
11240: 'Jessica@r@v04/20200474."Hii...@v04/20200475.......n...@v04/20200476.nooooooooooooooooooooooooooooooo!!!"@|@y'
11241: 'George@r@v07/20300409."Mom, Dad!!@k @v07/20300410.What, ......what happened!!@k @v07/20300411.Uuuuuuuuuuuughhh!!"'
11242: 'Battler@r@v10/20100233."......What the hell is this...@k@v10/20100234. ......There''s a limit to how degenerate you can be...@k@v10/20100235. Isn''t taking someone''s life enough...@k@v10/20100236. ......What the hell is this!!"'
11243: 'Battler@r@v10/20100237."After you''d killed them you actually bothered to sit them on chairs, slice their stomachs!!@k @v10/20100238.And stuff a ton of sweets inside?!!@k @v10/20100239.Why, ......why the fuck would you do something so sick?!!@k @v10/20100240.Fuck this, fuck this!@k @v10/20100241.Great work, shithead, looks awesome, looks fucking awesome!!@k @v10/20100242.Uwoooooooooooooohhh!!"'
11244: 'Nanjo@r@v19/21900095.".........It would be better if you all went outside...!@k @v19/21900096.There is no way they would want you all to see them this way..."'
11245: '@rNanjo told the children to go outside, but no one lent him an ear.'
11246: 'Nanjo@r@v19/21900097."Rosa-san, please tell them.@k@v19/21900098. If they keep looking at something like this...it will do nothing but harm...!"'
11247: 'Rosa@r@v12/21400292.".................."'
11248: '@rRosa regretted her own carelessness.@k ......She should have been able to anticipate that the children would eventually come here.'
11249: '@r...She should have quickly locked it instead of standing around.'
11250: '@rSo now the children had come.@k@rThey had seen it...!'
11251: '@rSurely, in this very moment, they were having a sight burned into their eyes...@kwhich was far more grotesque than the gross-out food Rosa had seen in her youth...'
11252: '@rWhile she hugged Maria, who seemed to have forgotten her emotions as she stared dumbfounded at the horrible scene,@k Rosa shed copious tears for them and their parents.'
11253: '@rThe four groaning and crying voices, their sadness, ...continued to echo in a place which should have known God''s love......'
11254: 'Battler@r@v10/20100243."You piece of shit!!@k @v10/20100244.Again, another one of these murders!!@k @v10/20100245.And yet again, you made it all elaborate, killing them like it''s a perfect joke!!"'
11255: 'BEATRICE@r@v27/20700731."*cackle*cackle*cackle*cackle*.@k@v27/20700732. I was hoping I''d hear words of gratitude rather than grief from you."'
11256: 'Battler@r@v10/20100246."Gratitude?!!@k @v10/20100247.Did you say gratitude, you old bitch?!@k @v10/20100248.Damn it, if there''s something wrong with your ears, I''ll cut them both off so you can hear better!!"'
11257: 'Battler@r@v10/20100249."Why should I have to say oh, thank you very much BEATRICE-sama~, about this supremely fucked-up way of killing?! I''ll beat you to death!!!"'
11258: 'BEATRICE@r@v27/20700733."In the last game,@k@v27/20700734. you were grieving that you couldn''t see your parents'' faces when they died, I believe?@k @v27/20700735.So I left them.@k@v27/20700736. Didn''t touch them!!"'
11259: 'BEATRICE@r@v27/20700737."Take a good long look and see, that without a doubt, your father and the others have been killed!!"'
11260: 'Battler@r@v10/20100250."R......eally, wow, you deserve full marks for top service, I''m so happy!!@k @|@y@v10/20100250_1.I swore that if I choked the life out of you, I''d plow your face, but I''ll take that back, I''ll drag out your guts!!!"'
11261: 'BEATRICE@r@v27/20700738."Don''t give in to emotion and stop thinking.@k@v27/20700739. My game has already begun, you know?@k @v27/20700740.*cackle*cackle*cackle*.@k@v27/20700741. I decided to leave the corpses clean this time."'
11262: 'BEATRICE@r@v27/20700742."Do you know why?@k @v27/20700743.When you denied my existence in the last game, you denied me by thinking in the following way."'
11263: 'BEATRICE@r@v27/20700744."That is:@k@v27/20700745.@|@y "Their faces are crushed, so the identities of the corpses cannot be confirmed";@k@v27/20700746.@|@y "therefore, the possibility that fake corpses had been prepared to create an alibi cannot be eliminated";@k@v27/20700747.@|@y "as long as that possibility cannot be excluded, the human culprit theory can be maintained"!!"'
11264: 'Battler@r@v10/20100251."What did you saaaaaay......?!!"'
11265: 'BEATRICE@r@v27/20700748."*cackle*cackle*cackle*kikikikikikikikikikikikikikikikikikikiki!!@k @v27/20700749.Come, Battler, are you sure you wish to leave the examination of the corpses to Nanjo?@k @v27/20700750.Isn''t it traditional in mystery novels for the doctor who performs such examinations to be an accomplice?"'
11266: 'BEATRICE@r@v27/20700751."Then don''t leave the examination to Nanjo; do it yourself.@k@v27/20700752. Make completely sure that without a doubt, the six corpses are the people claimed, that they aren''t pretending to be dead, that they really, really are dead!!"'
11267: 'BEATRICE@r@v27/20700753."To make sure that your father and mother really have been killed by having their stomachs cut open and their entrails pulled out,@k@v27/20700754. I suggest you stick your hand inside their stomachs and feel around inside!!!@k @|@y@v27/20700755.Kuhahahahahahahahahahahahahahahahahahahaha, kiiihahahahahahahahahahahahahahaha!!"'
11268: 'Battler@r@v10/20100252."I WON''T cry!!!@|@y@k @v10/20100253.Damn it, damn it, ...I won''t cry...!!"'
11269: '@rBattler suddenly yelled.'
11270: '@rHis tears were still dripping down, but as though scolding himself for being emotional, he slapped his face hard several times with both hands.'
11271: '@rEven so, the tears still wouldn''t stop.@k@r......However, he felt a hot blaze ignite in both his eyes.'
11272: 'Battler@r@v10/20100254."Whoever the bastard is who pulled this detestable bullshit, I''ll make him pay back his debt completely!!@k @v10/20100255.So this isn''t the time to cry, think about what you''re gonna do!!"'
11273: 'Battler@r@v10/20100256."Aaaah, this is no good, it''s no goddamn good at all!!@k @v10/20100257.If you have enough spare time to cry, then think!@k @v10/20100258.This is not the time to be working your lacrimal glands!!"'
11274: '@rRather than pure hatred, maybe it was more of an evasive hatred to blot out his sadness.'
11275: '@r......However, it gave a little courage to George and Jessica, who were being crushed by sadness.'
11276: 'George@r@v07/20300412."......That''s right.@k@v07/20300413. ...Even if we cry,@v07/20300414. ......the reality of what''s happened here...@v07/20300415.won''t change."'
11277: 'Jessica@r@v04/20200477."Damn it... Damn it damn it damn it, ......damn it damn it damn it!!@k @v04/20200478.What am I supposed to do then?!@k @v04/20200479.What am I supposed to do...for Mom and Dad?!!"'
11278: 'Gohda@r@v17/21700060."......Rosa-sama...@k@v17/21700061. I have returned..."'
11279: 'Rosa@r@v12/21400293."Gohda-san, what happened with the police?@k@v12/21400294. What did they say to do?@k @v12/21400295.Did they say when they think they''ll be able to get here?"'
11280: 'Gohda@r@v17/21700062."...Regarding that, ......it seems the telephones are out of order...@k@v17/21700063. I also tried the emergency wireless, but...umm, perhaps it''s the weather, but that isn''t working either..."'
11281: 'Rosa@r@v12/21400296."What did you say...?!@k @v12/21400297.So, you''re saying we can''t contact the police?!"'
11282: 'Jessica@r@v04/20200480."It''s her!@k @v04/20200481.She did something to the phone line, and made it so we can''t contact the police!!"'
11283: '@rWhen she heard that the telephones were out of order, Jessica immediately decided that it was the work of that mysterious guest.'
11284: '@rHer eyes were bright-red after so much crying, and they began to grow even more red with rage.'
11285: 'Jessica@r@v04/20200482."...Yeah, there''s not even any room for debate anymore!@k @v04/20200483.I understand everything, I know the truth!@k @v04/20200484.Who killed Mom and Dad?!"'
11286: 'Jessica@r@v04/20200485."It''s obvious, it''s her!!@k @v04/20200486.It has to be that witch or whatever who came yesterday!!!@k @v04/20200487.I''ll grab her by the collar!!@k @v04/20200488.Damn it damn it damn iiiiiiiiiiiit!!"'
11287: 'Rosa@r@v12/21400298."Jessica-chan...!@k @v12/21400299.Wait!@k @v12/21400300.Gohda-san, Kanon-kun, go!"'
11288: 'Kanon@r@v16/20600390."Ye-yes...!"'
11289: 'Gohda@r@v17/21700064."Milady, wait...!!"'
11290: '@rCovering her unfocused sadness with anger, Jessica ran outside, torn apart by emotion.'
11291: '@r...Thinking about it hastily, maybe the mystery guest, BEATRICE, who had arrived yesterday, was suspicious.@k However, at the current time, there was absolutely no proof that she was the culprit.'
11292: '@r...At this moment, she was nothing more than a simple guest, and only one of many.'
11293: '@rSo Rosa had to make an adult decision, and stop Jessica in her hasty rampage.@k Gohda and Kanon realized that immediately, and chased after her.'
11294: 'George@r@v07/20300416."......Could BEATRICE, the guest that no one invited, be the culprit...?"'
11295: 'Battler@r@v10/20100259."I understand how Jessica feels.@k@v10/20100260. ...I also want to make myself think that.@k@v10/20100261. It doesn''t matter who, I want to make someone the culprit and bash them right in the face!!"'
11296: 'Battler@r@v10/20100262."......But before that, we have to understand things clearly.@k@v10/20100263. ...Who is this BEATRICE?@k@|@y@v10/20100264. I haven''t even seen her face!!"'
11297: 'Maria@r@v13/20400329."......Kihihihihihihihihihihihihihihihi.@k@v13/20400330. If you''re looking for her face, it decorates the big portrait in the mansion.@k@v13/20400331. You still don''t remember after looking at it for so long?@k@v13/20400332. Kihihihihihi."'
11298: 'Battler@r@v10/20100265."...Come on, Maria.@k@v10/20100266. ...What''s so funny in a situation like this?!"'
11299: 'Maria@r@v13/20400333."BEATRICE is a witch.@k@v13/20400334. And the ritual to open the door to the Golden Land has finally begun.@k@v13/20400335. These six people are sacrifices.@k@v13/20400336. ......Kihihihihihihihihihihihihihihihihi!"'
11300: 'Maria@r@v13/20400337."Now, the witch''s banquet shall begin.@k@v13/20400338. Tonight is Halloween; the witches gather now in celebration.@k@v13/20400339. Kiiihi-hi-hi-hi-hihihihihihihihihihihihihihihihihihihihihihihi!!"'
11301: 'Rosa@r@v12/21400301."Maria, how many times have I told you to stop laughing in that creepy voice!"@|@y'
11302: '@rThe crisp sound of Rosa slapping Maria''s cheek echoed through the high-ceilinged chapel...'
11303: '@rIt kinda feels like, ever since the rain started yesterday—@kno, ...ever since the island had become wrapped up in the typhoon, something has gone crazy.'
11304: '@rI had arrived in Rokkenjima while it was clear, and taken a nap because I had gotten up early.'
11305: '@r......When I woke up, it had already started raining.'
11306: '@rAnd after I got up, that''s when it all started.'
11307: '@rSuddenly a mysterious visitor had arrived, calling herself the Golden Witch BEATRICE, and it feels like the world had started skewing bit by bit into something insane.'
11308: '@rWhat happened while I was taking that nap?@k During that time, had this island been cut off, trapped in a different world where common sense doesn''t apply...?!'
11309: '@rWho is this person called BEATRICE?@k@rIs she some unknown person trying to involve themselves with the inheritance problem, like our parents were freaking out about at dinner last night?'
11310: '@r......Or is the culprit the witch from the Legend of the Gold, like Maria says?!'
11311: '@rEven if Jessica hadn''t let her short temper get the better of her, in this situation, the visitor was probably the most suspicious.'
11312: '@rBut we mustn''t jump to conclusions just like that.@k@rYeah, that''s no good, no good, no goddamn good at all...!!'
11313: '@rI smacked my face with both hands again, cooling off my brain before it overheated.@k Even though it might have been a waste of effort.'
11314: 'George@r@v07/20300417."......This is.........one of Grandfather''s envelopes."'
11315: '@rOn a tray piled up with sweets that decorated the table, George-aniki found a Western envelope which had the Ushiromiya family crest done on it in gold leaf.'
11316: '@rAnd it was unopened.'
11317: 'Battler@r@v10/20100267."So, ......doesn''t this mean it was sent to us?@k@v10/20100268. If it was something Dad and the rest read, it should be open."'
11318: 'George@r@v07/20300418."......It seems your reasoning is correct.@k@v07/20300419. ......Look what''s written here.@k@v07/20300420. It says "to those who remain"."'
11319: 'Rosa@r@v12/21400302."Is that...a letter the culprit left...?!@k @v12/21400303.Wha-what''s inside...?"'
11320: 'Battler@r@v10/20100269."Aniki, let''s open it...!"'
11321: '@rAfter nodding silently, George-aniki opened it.@k@r......A folded letter came out.'
11322: 'George@r@v07/20300421.".........I''ll read it.@k@|@y@v07/20300422. .........Welcome to Rokkenjima, ladies and gentlemen of the Ushiromiya family.@k@v07/20300423. I am BEATRICE, the alchemist for this family, under the employ of Kinzo-sama..."'
11323: '@rThat letter really was a joke.'
11324: '@rThis BEATRICE, who called herself the family alchemist, had announced that she was collecting the gold she had lent Grandfather, along with the interest.'
11325: '@rAnd that interest was everything that Grandfather had created.'
11326: '@rSince this tragedy was right before our eyes as this paragraph was read aloud, it clearly wasn''t referring just to the wealth that Grandfather had built up.'
11327: '@r......It was literal.@k Everything that Grandfather had given birth to—@kin other words, ...all of Grandfather''s descendants, were included in the interest!'
11328: 'Battler@r@v10/20100270."Batshit insanity!!@|@y@k @v10/20100271.What a screwed up contract!@k @v10/20100272.So lives are the interest for gold, are they?!@k @v10/20100273.That''s like a deal with the devil!@k @v10/20100274.Is that how you pretend to be a witch?!@k @v10/20100275.Ha, real goddamn funny!!"'
11329: 'George@r@v07/20300424."......Special clause.@k@v07/20300425. .........However, if someone is able to discover the hidden gold of this contract, BEATRICE must abandon these rights for all time."'
11330: 'George@r@v07/20300426.".........Mmhm......@k@v07/20300427. ......Kinzo-sama has already publicly displayed the location of the hidden gold within the epitaph under my portrait..."'
11331: 'George@r@v07/20300428."......So it''s something like this.@k@v07/20300429. If the motive for these murders was collection of the interest,@k@v07/20300430. the condition for stopping them is to find the hidden gold she gave to Grandfather, ...is what it''s saying.@k@v07/20300431. And it also says that the secret to this is hidden in the epitaph from that portrait."'
11332: 'Battler@r@v10/20100276."So......this is a letter of challenge from the witch?@k @v10/20100277.Break the ciphertext describing the location of the hidden gold, if you can?!@k @v10/20100278.And it''s saying that if we can''t, the collection of the interest will continue as planned?"'
11333: 'Battler@r@v10/20100279."I''ll beat you to death, no problem!!!"@|@y'
11334: 'George@r@v07/20300432."...Ba-Battler-kun!@k @v07/20300433.Look...... Look here!!!"'
11335: '@rThe table had been full of sweets,@k ...so even though they had been right in the open, we had assumed they were just sweets.'
11336: '@r......I mean, come on, you find stuff like this a lot, right?'
11337: '@r......You know, boxes of chocolate, shaped like golden ingots...!'
11338: 'Battler@r@v10/20100280."The-......these are...not boxes of candy...@k@v10/20100281. They''re the real thing...!@k @v10/20100282.......These are real goddamned gold bars...!!"'
11339: 'George@r@v07/20300434."...It''s inscribed with the crest of the One-winged Eagle...@k@v07/20300435. ...I''ve heard Mother talking about this before.@k@v07/20300436. ......This is a gold bar from the legend of Grandfather''s gold...!!"'
11340: '@rGold ingots, ...three of them, weighing a full ten kilograms each, were piled up in the very center of the table!@k It was where the cake would be placed if it was a birthday party.'
11341: '@r...In other words, this was without a doubt the birthday cake of the party known as the family conference!'
