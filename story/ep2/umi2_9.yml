11163: '@rLots and lots of sweets had been stuffed in there, pulpy,@|@y@w166. pugyurubugyu.'
11164: '@rBlood and guts and sweets were overflowing onto the floor,@k ......blood-stained,@|@y sticky,@w250. sticky,@|@y@w250. sloppy,@w166. pulpy,@w166. sweet candy stuck to each finger,@|@y@w166. gummy,@w166. gummy,@k aaah, but it''s stained with their entrails,@|@y sloppy,@w250. pulpy!@k What was that I stepped on just now, that didn''t feel like a candy or a cookie or a fizzy lemon sweet or a chocolate!'
11165: '@rAaaaaaaaaaaaaah, I''m so scared I can''t even look at the bottom of my foot to see what I stepped on!!'
11166: '@rAaaaaawaaaakiiiyaaaaaaaaaaaaaaaaaaaaaaa!!!'
11167: '@r...What a, what a gruesome Halloween party...!!!'
