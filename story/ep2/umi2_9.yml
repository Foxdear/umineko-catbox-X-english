11054: '@rWritten there in English were the words@r"Happy HALLOWEEN for MARIA."'
11055: '@rHappy Halloween...for Maria.@k@rA wish for an enjoyable Halloween.@k For Maria.@k@rA creepy magic circle.@k For Maria.@k@rHappy Halloween.'
