10976: '@r......What was the sound that always filled the ears?@k@rThe sound of the rain, the sound of a waterfall, or was it radio static?'
10977: '@rIn that case, I want it to be the sound of blood flowing through the body.@k ......I want it to be the sound of the blood circulating throughout my body, telling me that I am still alive...'
10978: 'Kinzo@r@v01/21500116.".....................Hmm...@k@v01/21500117. ......Is it...morning...?"'
10979: '@rThe light entering through a crack in the curtain was faint, but it at least told him that dawn had broken.'
10980: '@rKinzo, still in the same pose he had when he awoke, ...still sitting in his chair and looking up at the ceiling, ...felt the blood slowly travel throughout his body...'
10981: '@r...Judging by the clock, it was early morning, six on the dot.@k ......No matter how tired he was, no matter how deeply he slept, he woke up at exactly this time, as though he had measured it with an hourglass.'
10982: '@rHe didn''t think that something like this was worthy of boasting of, but he told himself that while he could still do something like this, he was still in robust health.'
10983: 'Kinzo@r@v01/21500118.".........Morning has come, which means...@k@v01/21500119. ...............Hmmm.@k@v01/21500120. ......It seems that I''ve escaped being one of the first sacrifices.@k@v01/21500121. ......Was the result of the roulette fortunate, ...or is this the fruit of my efforts?@k@v01/21500122. It is irritating that I cannot tell the difference, but I will not say that."'
10984: '@rKinzo was very slightly driven by a temptation to look at the other side of the study door.'
10985: '@rBecause he thought that maybe he might find the traces of a vain struggle to break the door,@k made by something trying to select him as one of the first six sacrifices.'
10986: 'Kinzo@r@v01/21500123."...Hmph.@k@v01/21500124. .........Humans are cheap creatures.@k@v01/21500125. ......They claim to do their best and leave the rest to Providence, yet when they are given good fortune, they desire to flatter themselves that it arose not from simple luck, but from their own ability."'
10987: '@rSo he wanted to check whether there was a wretched mark on the door.@k@r...That is only human.'
10988: '@rTherefore, Kinzo did not check.@k He repressed the things that he wanted to do because he was human.@k By that, Kinzo could immerse himself in a feeling of sufficiency, as though he had become a being that surpassed humans...'
10989: '@rHe became aware of human desire, and forbade it.@k@rThings that a human wanted to do, he resisted.'
10990: '@r......This eccentric and rebellious sense had surely given him a rare genius,@k which must have allowed him to succeed in his exploits as he revived the Ushiromiya family in one generation...'
10991: 'Kinzo@r@v01/21500126."Well then, BEATRICE.@k@v01/21500127. What were the six pieces you took?@k@v01/21500128. ......And what will your next move be?@k@v01/21500129. ...Entertain me.@k@v01/21500130. .........My defense is perfect.@k@v01/21500131. I will not shame myself like last time.@k@v01/21500132. ......Heh, ......heheheh."'
10992: '@rThe servants woke early.@k They had to open the curtains, prepare breakfast, and complete various other tasks to welcome the guests to a new day.'
10993: '@rGohda was the most enthusiastic.'
10994: '@rHe had been told to concentrate his efforts in particular on his work as a chef for the duration of the family conference,@k and he had been specially exempted from several tasks that servants normally must do.'
10995: '@r...It seemed that Gohda, who was a show off, had a particular feeling of supremacy about that.@k He left the preparations of the inside of the mansion to Genji and the rest, and worked on preparing breakfast in the kitchen.'
10996: '@rGenji split the work with Shannon and Kanon, and they carried out various tasks.'
10997: '@rShannon headed to the dining hall and knocked.'
10998: '@r...Last year, the family conference had continued into the small hours of the night.@k It wouldn''t have been odd for this year''s conference to continue all the way into the next morning.'
10999: '@rSo she had knocked out of consideration for the possibility that they were still having a discussion inside.'
11000: '@rBut there was no response, so she opened the door and said good morning.'
11001: 'Shannon@r@v15/20500645."...Good morning.@k@v15/20500646. ...............Is anyone there?"'
11002: '@rThe room was cold, and it seemed that the conference had ended a long time before.'
11003: '@rOn top of the table, there was a tea set, from which they had probably been drinking, arranged in a way that would make it easy to clean them up.'
11004: '@rCleaning away the tea was a servant''s job.@k So if the family was too caring and cleaned it up themselves, the servants would lose face.'
11005: '@rTherefore, just doing this much for the servants truly was a pleasing act of kindness.'
11006: '@rAs she approached the table to clean it away, she noticed that something like a memo had been left along with the cups.'
11007: '@rIt had been placed together with the tea set, so, naturally thinking it was a memo for the servant cleaning up, Shannon took it.'
11008: '@rWritten on it was not a request, nor thanks for preparing the tea, but just a single word.'
11009: '@rShannon looked at it blankly, and read it out loud...'
11010: 'Shannon@r@v15/20500647."............Chapel.@k@v15/20500648. ...............?"'
11011: '@rA small sound kept repeating over and over.@k@rIt was a sound that would ordinarily have been trivial and insignificant.'
11012: '@rI hope I stop hearing it soon, then I could return to my doze, someone thought vaguely.'
11013: '@r...But no matter how much time passed, the sound did not end.@k@rIt repeated over and over.'
11014: '@rAaah, shut up.@k@rWho is that?@k Banging on the door constantly.'
11015: '@rAs soon as she realized this, she woke up.@k@r......Someone was knocking.'
11016: '@rThen she noticed that there wasn''t just a knock, but a voice too.'
11017: 'Genji@r@v14/21600065.".........Rosa-sama, ...Rosa-sama.@k@v14/21600066. ......Good morning."'
11018: 'Rosa@r@v12/21400240."Wa-......wait.@k@v12/21400241. I''m coming now."'
11019: '@rIt had been Genji''s voice.@k@rLooking at the clock, it was still before seven.'
11020: '@r......It was clearly too early to wake the guests.@k@r...Did something happen that was bad enough to cause this?'
11021: '@rShe felt her sleepiness increasingly fade thanks to this ominous premonition.'
11022: '@rBecause Genji had been a familiar servant to Rosa since her childhood days, she opened the door a crack and answered, even though she was slightly defenseless in her pajamas.'
11023: 'Genji@r@v14/21600067."Good morning.@k@v14/21600068. I apologize for waking you this early."'
11024: 'Rosa@r@v12/21400242."......Did something happen?"'
11025: 'Genji@r@v14/21600069."Yes...@k@v14/21600070. .........Actually, at the chapel,..."'
11026: '@rGenji spoke into Rosa''s ear, and told her something in a small voice.'
11027: '@rIt seemed that Rosa couldn''t understand what she was being told after only hearing it once,@k and after repeating the words back to him several times, she finally realized that apparently, something strange had happened.'
11028: '@rRosa closed her door for a second, and after changing her clothes, she immediately accompanied Genji and they headed to the mansion...'
11029: '@rThe chapel requires some explanation.@k It wasn''t in the mansion, but in a grove behind the mansion, which could be reached after a short walk.'
11030: '@rIt had been built at the same time that the mansion had been constructed on Rokkenjima,@k so while its outside walls had been repaired many times, making it look new from the outside, it was a very old building.'
11031: '@rRosa and Genji dashed through the rain together.@k@rJust like the previous night, the rain was falling in earnest.'
11032: '@rEventually, they began to see the chapel beyond a sparse grove...'
11033: '@rIf all she knew of it was its appearance from the outside, it might have felt like a place of dazzling beauty, where a pair of young lovers might want to hold a ceremony.'
11034: '@rHowever, it seemed that in Kinzo''s eyes, this was a very sacred place,@k and Rosa and her siblings had been harshly told not to approach it unnecessarily.'
11035: '@rSo even at this age, and no matter what the reason for it, she felt some guilt in approaching the chapel,@k and was gripped by the fear that this would surely make her father so angry he would slap her across the face...'
