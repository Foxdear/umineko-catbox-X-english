14122: '@rBattler could be found in the dining hall.'
14123: '@rUnable to summon the will to return to the guesthouse in the middle of this rain,@k he had wandered halfheartedly around the mansion in search of a random place to sit, ...and had stationed himself in the dining hall.'
14124: '@rHe hadn''t bothered to lock it.'
14125: '@rHe did think that maybe the shapeless murderer, or the Golden Witch, might come to kill him now that he was isolated,@k but he no longer thought about resisting that.'
14126: '@rOn the contrary, he had no intention of blocking the culprit with a lock.@k@rHe wanted that person to come at him openly, from the front.'
14127: '@r...If it was a murderer, he thought he''d ask them to tell about some of those wonderful locked room tricks as a parting souvenir.'
14128: '@rAnd if it was a witch, he thought he''d ask her to at least take his life with some wonderful magic.'
14129: '@r......However, ironically, neither of these two came to meet Battler...'
14130: '@rBattler opened the liquor cabinet on his own and enjoyed the liquor to his heart''s content.@k@rNo longer was there anybody anywhere who would have a problem with him drinking alcohol.'
14131: '@rHe boldly set both of his legs on the extravagant tablecloth and savored the high-quality liquor, which probably had a mind-boggling price, straight from the neck of the bottle....'
14132: '@rAt that time, ......someone knocked.@|@y'
14133: '@rBattler realized that he was about to meet his maker...'
14134: 'Battler@r@v10/20101206."Heee~yy, it''s not locked.@k@v10/20101207. Come in, whoever you are.@k@v10/20101208. And please introduce yourself.@k@v10/20101209. If you''re human, gimme your name.@k@v10/20101210. And if you''re BEATRICE, gimme your three sizes."'
14135: 'Battler@r@v10/20101211."You might not believe this, but I''m a pretty well-known breast-sommelier, y''sheee?"'
14136: 'Genji@r@v14/21600223.".........It is Genji, Battler-sama."'
14137: 'Battler@r@v10/20101213."...Genji-san, huh.@k@v10/20101214. ......Sorry, but I''m not interested in your bust size.@k@v10/20101215. Please, come in. It''s open."'
14138: 'Genji@r@v14/21600224.".........Excuse me."'
14139: '@rGenji-san opened the door and bowed.'
14140: '@r.........So Genji-san was the culprit after all, ...or maybe an accomplice?@k ......That theory would probably explain most of the tricks...'
14141: 'Battler@r@v10/20101216."Did you come to give me my last rites?"'
14142: 'Genji@r@v14/21600225.".........Nothing of the sort.@k@v14/21600226. ......I shall excuse myself if I am disturbing you."'
14143: 'Battler@r@v10/20101217."...Wait, wait, excusing yourself without even telling me what you wanted would actually just be creepy.@k@v10/20101218. ...What do you want?@k@v10/20101221. ...Please, let me do as I wish, at least in the very end."'
14144: 'Genji@r@v14/21600227_1.".........Battler-sama, is it truly your wish...@k@v14/21600228_1.to spend the little time you have left in such an indolent fashion?"'
14145: '@rThose words...stung...@k@r......Of course it wasn''t.'
14146: 'Battler@r@v10/20101222."...............................@k@v10/20101223. What can I do at this point?@k@v10/20101224. ......I''m ready to die at any time..."'
14147: 'Genji@r@v14/21600229."......You are just like the Master.@k@v14/21600230. Indeed, you inherited the Master''s blood strongly...."'
14148: 'Battler@r@v10/20101225."You mean to tell me that Grandfather, that larger-than-life man, was actually willing to die at any moment...?@k @v10/20101226.First I''ve heard of that."'
14149: 'Genji@r@v14/21600231.".........The Master''s life,@v14/21600232. ......after a number of sad incidents,@v14/21600233. ......was completely reduced to atonement."'
14150: 'Battler@r@v10/20101227."...What do you know?"'
14151: 'Genji@r@v14/21600234."............BEATRICE-sama''s ritual has been entirely completed up to the eighth twilight.@k@|@y@v14/21600235. ...I believe...that I can now tell you everything."'
14152: 'Battler@r@v10/20101228."Wha-......what did you say...?"'
14153: '@rMy drunkenness was completely blown away.@k I lowered my feet from the table and listened carefully to hear what kind of words Genji-san would say next...'
14154: 'Genji@r@v14/21600236."Battler-sama.@k@v14/21600237. ......I shall guide you to the Master''s study.@k@v14/21600238. ......It would probably be better to hear it directly from them."'
14155: 'Battler@r@v10/20101229."From......@{them@}...?@k @v10/20101230.H-hey, what in the world do you mean by that...!!"'
14156: 'Genji@r@v14/21600239."......Come, this way.@k@v14/21600240. I shall guide you.@k@v14/21600241. Battler-sama."'
14157: '@rAfter Genji-san told me to follow him, he started to walk down the corridor.'
14158: '@rI sobered up completely and went after him...'
14159: '@rWe climbed the big staircase, .........towards the third floor.@k@rGenji-san stopped walking halfway.@k@rHe then turned back and spoke.'
14160: 'Genji@r@v14/21600242.".........Battler-sama.@k@v14/21600243. ......From here on, you will...@v14/21600244.......probably see things you will not be able to understand."'
14161: 'Battler@r@v10/20101231."Don''t try to intimidate me.@k@v10/20101232. .........I''ve already seen plenty of things I can''t understand today."'
14162: 'Genji@r@v14/21600245.".........Please accept what you see as you see it,@k@v14/21600246. and what you hear as you hear it."'
14163: 'Genji@r@v14/21600247."Questions like "Why?",@k@v14/21600248. or "What?",@k@v14/21600249. ...there is no need for such things.@k@v14/21600250. ...Battler-sama, you will probably simply learn the truth.@k@v14/21600251. Whether to accept it, believe it,@k@v14/21600252. or even deny it, are all choices I leave to you."'
14164: 'Battler@r@v10/20101233."....................................."'
14165: '@rGenji-san checked one last time to see whether I was prepared to learn the truth.'
14166: '@rThe eighth twilight had already ended.@k And on the ninth twilight, the witch revives, ......and none shall be left alive.'
14167: '@rIt meant that BEATRICE had already revived.@k@r...And probably, none of us would be allowed to return alive.'
14168: '@rIf I was going lose my life anyway, ......I wanted to know the truth in the end.@k@r...It didn''t matter how hard it might be to accept.'
14169: 'Battler@r@v10/20101234."..................Yeah.@k@v10/20101235. ......Even if a demon or a witch shows up, ...I''m prepared."'
14170: 'Genji@r@v14/21600253.".........You really are just like the Master in his youth.@k@v14/21600254. ......Battler-sama, please be diligent in your studies.@k@v14/21600255. In the future, you will surely have great aspirations.@k@v14/21600256. And make sure that at that time, you are not forced into a lifetime of regret by a lack of academic knowledge."'
14171: 'Battler@r@v10/20101236.".........If I have a chance to work hard in my studies, then no problem."'
14172: 'Genji@r@v14/21600257.".............................."'
14173: '@rGenji-san''s silence forced me to consider that resignation of mine more deeply...'
14174: '@rAnd, .........we could see the door of Grandfather''s study, impregnated with a sweet smell.'
14175: '@rFrom his pocket, Genji-san withdrew a gold key with an elegant design.'
14176: '@rThe master keys had been confiscated by Auntie Rosa, but the key to this study alone, he had kept with him.'
14177: '@rHe put it in the keyhole, .........and it made a heavy clunking sound.'
14178: 'Genji@r@v14/21600258.".........My lord.@k@v14/21600259. It is Genji.@k@v14/21600260. I have brought Battler-sama with me."'
14179: '@rThere was no reply, but it seemed that permission to go in had been given...'
14180: 'Genji@r@v14/21600261."Come, Battler-sama.@k@v14/21600262. ......Please enter."'
14181: 'Battler@r@v10/20101237."..................Yeah.@k@v10/20101238. ......In I go."'
14182: '@rI readied myself, ......and threw the door open...'
14183: '@rAt that moment, ...I got slightly disoriented by the dazzling golden glow..........'
14184: '@rIt was, .........somehow,@w583. ......a swarm of butterflies, shining gold.'
14185: '@rThe golden butterflies that were completely filling the inside of the study poured out all at once.......'
14186: 'Battler@r@v10/20101239."Wha-............@v10/20101240. ......What the heck...@v10/20101241.......is thiiiss.................."'
14187: '@rIt was almost like golden leaf confetti.@k@rThe interior of Grandfather''s study was filled with a golden glow...'
14188: '@rAnd......there were reception sofas and a table for guests placed in front of the study desk,@k .........and I could see Grandfather''s back.'
14189: '@rThere was someone on the side opposite from Grandfather.@k@r...It was in shadow, so I couldn''t see it well...'
14190: 'Genji@r@v14/21600263."......My lord.@k@v14/21600264. I have brought Battler-sama."'
14191: 'Kinzo@r@v01/21500232."............Battler, is it?@k@v01/21500233. I''m busy thinking now...@k@v01/21500234. Be silent for a while......"'
14192: '@rKinzo declared that in displeasure, his back still turned.'
14193: '@rIt seemed that he was enjoying playing chess with a visitor...'
14194: '@rApparently, the opponent had counterattacked with a superb move.@k@rKinzo seemed to be enjoying himself as he thought deeply, while occasionally laughing and groaning...'
14195: 'BEATRICE@r@v27/20701498."I thought for thirty years.@k@v27/20701499. ......I thought for thirty years about how to counterattack this move...@k@v27/20701500. Have fun, have fun with the move I fermented for thirty years."'
14196: 'Kinzo@r@v01/21500235."......Heheheheheheheh.@k@v01/21500235_1. Indeed, this is a deeply matured move.@k@|@y@v01/21500236. ......Such fun, such fun... *cackle*cackle*cackle*cackle*, hahahahahahaha...!!@k @v01/21500237.Unbeatable, unbeatable."'
14197: 'Battler@r@v10/20101242."......Wha-@v10/20101243.............what is...@v10/20101244.......this........."'
14198: 'BEATRICE@r@v27/20701501."So you came, Battler.@k@v27/20701502. Wait just a moment.@k@v27/20701503. Be silent for Kinzo''s sake.@k@|@y@v27/20701504. ...Isn''t it too early to <resign>, Kinzo?@k @v27/20701505.I can already counterattack for several moves.@k@v27/20701506. *cackle*cackle*cackle*...!"'
14199: '@rIt should have been...@w250....my first meeting with that witch.'
14200: '@rHowever, ...I knew this witch.@k@rEven though it was our first meeting,@w500. ...I knew her,@w500. ......from the portrait......!'
14201: 'BEATRICE@r@v27/20701507."Genji.@k@v27/20701508. Serve something for Battler.@k@v27/20701509. What would be the most appropriate for this man...?"'
14202: 'Genji@r@v14/21600265."......The same which the Master has loved since the days of his youth."'
14203: 'BEATRICE@r@v27/20701510."That is ideal; serve it to him.@k@v27/20701511. ......You did well coming here, Ushiromiya Battler.@k@v27/20701512. First, take a seat."'
14204: 'BEATRICE@r@v27/20701513.".........You called my name many times, did you not?@k @v27/20701514.In deference to that, I allowed you to meet me.@k@v27/20701515. ...So, what will you ask me?@k @v27/20701516.What will you inquire?"'
14205: 'BEATRICE@r@v27/20701517."......The door to the Golden Land will soon be opened.@k@v27/20701518. Soon, we will have a banquet to celebrate my revival, to which I will be welcoming the witches.@k@v27/20701519. ...In the meantime, I''ll be answering your questions, as many as you like."'
14206: 'Battler@r@v10/20101245."I, ......I have a bunch of things I want to ask about!!@k @v10/20101246.What happened on this island?!@k @v10/20101247.And why did these incidents happen?!"'
14207: 'Battler@r@v10/20101248."I want to ask about the locked rooms too!!@k @v10/20101249.What about the chapel?!@k @v10/20101250.What about Jessica''s room?!@k @v10/20101251.And the servant room?!@k @v10/20101252.And Aunt Natsuhi''s room?!@k @v10/20101253.And the parlor?!"'
14208: 'Battler@r@v10/20101254."There''s more still I want to ask about!!@|@y@k @v10/20101255.About the witch''s true nature!!@k @v10/20101256.Are you really a witch?!!@k @v10/20101257.What is your purpose, what do you want to make us do and why did you call me here?!!@k @v10/20101258.Answer me, about everything!!!"@|@y'
14209: 'Kinzo@r@v01/21500238."Arrrrghhh, be quiet!!@|@y@k @v01/21500239.You think merely asking will get you answers?!?!"'
14210: 'BEATRICE@r@v27/20701520."Don''t say that, Kinzo.@k@v27/20701521. A fragile and fleeting spider web did protect from King Herod once.@k@v27/20701522. ......Just as there are no useless things in this world, there are also no useless questions."'
14211: 'BEATRICE@r@v27/20701523."Very well, I''ll answer all your questions.@k@v27/20701524. ......But, I do have one condition."'
14212: 'Battler@r@v10/20101259."What is it?"'
14213: 'BEATRICE@r@v27/20701525."Once you have heard everything, if you are satisfied of my existence,@k@v27/20701526. ............kneel, and kiss my shoes.@k@v27/20701527. I called you here because I wanted to make you submit to me."'
14214: 'BEATRICE@r@v27/20701528."...Kinzo and I made a bet.@k@v27/20701529. We bet on which would come first, Kinzo thinking of a new move, or me forcing you to submit.@k@v27/20701530. I don''t see myself losing.@k@v27/20701531. *cackle*cackle*cackle*cackle*...!"'
14215: 'Battler@r@v10/20101260."...D-............Damn you, talking so tough!!@k @v10/20101261.Yeah, alright.@k@v10/20101262. Try to make me admit it.@k@v10/20101263. ...Try to make me admit that you''re a witch and that you can use weird, awesome, and great magic!!"'
14216: 'Battler@r@v10/20101264."If I submit, I''ll kiss your shoes or do whatever else you want!!!"'
14217: '@rThe witch cackled gloatingly.@k@rThen, she glared at him unpleasantly with eyes that said a man can''t go back on his word...'
14218: 'BEATRICE@r@v27/20701532."Well said!!@k @v27/20701533.So, from what question shall I begin?!@k @v27/20701534.I''ll answer everything!!@k @v27/20701535.Come, what will the first one be?!?!"'