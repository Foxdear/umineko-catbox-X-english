9473: '@rEvery year, the relatives who visit Rokkenjima let out a sigh of admiration at the rose garden which first greets them...'
9474: '@rThey stood there talking with each other about the roses'' beauty and the state of their blooming this year.'
9475: '@rThere was a single unhealthy rose among them, and Maria became overwhelmed with dejection at its state.'
9476: '@rBut George used his quick wits,@k and saying she should look after it if she felt that sorry for it, he marked it with a candy wrapper, and immediately restored Maria''s good mood.'
9477: '@rAnd once Battler, with whom she had been getting along well all morning, raised the subject of Halloween that Maria loved so much, she began playing around energetically again.'
9478: '@rTo Maria,@k those marshmallow jack-o''-lantern candies that her mother had bought for her were probably a treasure greater than any other.'
9479: '@r...It seemed that several of them had been bought for her, and she demanded trick-or-treat from every person she met, giving them candy instead of the other way around.'
9480: 'Battler@r@v10/20100047."I wonder why Maria likes Halloween so much.@k@v10/20100048. I thought that event was pretty difficult for Japanese people to get used to."'
9481: 'Jessica@r@v04/20200363."Isn''t that because it''s a kid''s festival where they get to parade around in costumes?@k @v04/20200364.It''s fun to play around in an outfit that''s different than usual."'
9482: 'George@r@v07/20300226."No, ...I think there''s probably a slightly deeper reason.@k@v07/20300227. After all, she is Maria-chan "the witch"."'
9483: 'Battler@r@v10/20100049."Come to think of it, when we were at the airport, didn''t Maria say that if she was going to wear a costume, it would be a witch?@k@v10/20100050. Does Maria like witches?"'
9484: 'Rosa@r@v12/21400061."......Yes, she loves them.@k@v12/21400062. So much that it becomes a problem."'
9485: 'Jessica@r@v04/20200365."Well,@k@v04/20200366. admiring fantastical stuff like that is to be expected at that age."'
9486: 'Rosa@r@v12/21400063."If she''d at least chosen a heroine of some TV anime to admire, that would''ve been cute...@k@v12/21400064. ...haah."'
9487: '@rJudging by Rosa''s reactions, it seemed that, as a mother, she did not find her daughter''s love for witches pleasant.'
9488: '@rSeemingly all the cousins other than Battler were able to understand this, and they shrugged their shoulders, smiling awkwardly.'
9489: 'Battler@r@v10/20100051."Hmmmm?@k @v10/20100052.So if you like witches, you also like Halloween, is that how it works?"'
9490: 'Battler@r@v10/20100053."I guess I should just ask her myself if I don''t know.@k@v10/20100054. Hey, Maria.@k@v10/20100055. What kind of relationship do Halloween and witches have with each other?"'
9491: '@rAs Battler asked that, George and Jessica let out a small "ah—" noise.'
9492: '@r...It seemed they were too late.'
9493: '@rIt almost looked as though Maria had been waiting for that question.'
9494: '@rAfter looking happy for an instant, her expression turned a little mean, as if to say "You don''t know anything, do you?"'
9495: '@rIt was the expression of an enthusiast who has been enraged by the ignorant statement of an outsider with a wrong impression.'
9496: 'Maria@r@v13/20400069."Uu.@k@v13/20400070. ...The Celts thought of the changing strength of the sun over the course of a year...@k@v13/20400071.as its birth, its growing-up period, its aging and death, and then its revival."'
9497: 'Battler@r@v10/20100056."I get it.@k@v10/20100057. The sun, weak and warm in spring, starts to grow up and become hot,@k@v10/20100058. and then it gradually gets weaker and worn out... Yeah, I can see how you could think of that as the passing of the sun''s life."'
9498: 'Maria@r@v13/20400072."Yep.@k@v13/20400073. So they thought that at the end of October, the sun died, rested its body in the land of the dead, and then revived again at the winter solstice.@k@v13/20400074. And so, they celebrated the day that the sun ends its one-year lifespan and dies, calling it New Year''s Eve, or Samhain."'
9499: 'George@r@v07/20300228."That way of thinking is very interesting, to say that the sun is "revived" on the day of the winter solstice, when the daylight hours start to grow longer again.@k@v07/20300229. It''s an episode that makes you understand how much ancient people deified the sun."'
9500: 'Battler@r@v10/20100059."...I seeee.@k@v10/20100060. And? What do witches have to do with this?"'
9501: '@rIt seemed that my casual urging forward had slightly infuriated Maria.'
9502: '@rShe glared at me with eyes that told me to let her explain without interrupting.'
9503: '@r......Maria looked like she was having fun telling me, so I decided not to interrupt...'
9504: 'Maria@r@v13/20400075."In the interval between October and November, life and death become the closest they ever will.@k@v13/20400076. ...The Celts believed that this was the time when the world of the living was at its closest to that of the dead and those not of this world,@k@v13/20400077. and when they would be visited by many inhabitants of the other world."'
9505: 'Maria@r@v13/20400078."......It was like the Bon festival in Japan.@k@v13/20400079. Kihihihihi."'
9506: '@rAt the time, the people believed that the souls returning to the physical world would go into people''s houses or possess people to do bad things.'
9507: '@rSo in order to avoid harm from them, the people invented protective rituals.'
9508: '@rOne of those was to imitate creepy monsters and scare the souls instead, which was apparently a way to avoid being possessed.'
9509: 'Jessica@r@v04/20200367."So that part became a festival, which turned into a costume parade.@k@v04/20200368. ...Maria''s really knowledgeable!"'
9510: 'Hideyoshi@r@v06/21100021."......Ain''t it the truth.@k@v06/21100022. Even I never knew Halloween had such a history."'
9511: 'Rudolf@r@v08/21200089."But where did the whole "trick or treat" thing come from?"'
9512: '@rHer knowledge was so extensive that the adults had started listening in too at some point.@k Maria, who was normally always treated like the youngest, puffed out her chest in pride.'
9513: '@rRosa tried to say this was just a kid''s story, and that she wanted to quickly break up the circle and set the luggage down in the guesthouse,@k but nobody else agreed, and she let out a heavy sigh.'
9514: 'Maria@r@v13/20400080."Uu.@k@v13/20400081. Trick or treat is just for fun.@k@v13/20400082. It has nothing to do with what was originally a Celtic ceremony.@k@v13/20400083. That was created later when Christian customs were mixed in.@k@v13/20400084. ...But I think that Halloween should be that way."'
9515: '@rAccording to Maria, the souls of the dead weren''t the only ones who visited from the world of the nonhuman;@k there were also spirits that had an intimate connection to how people lived.'
9516: '@rIt was because humans received the favors of those spirits that they were able to earn a wonderful blessing,@k and a year''s worth of good crops.'
9517: 'Jessica@r@v04/20200369."So in other words, Halloween was also a bit of a harvest festival?"'
9518: 'Battler@r@v10/20100061."I see.@k@v10/20100062. ...Now you mention it, I get the feeling that October is a turning point in various ways, seasonally too.@k@v10/20100063. I mean, it''s exactly on the other side of the year to Japan''s April.@k@v10/20100064. ......Yeah, that might be a good place to mark it."'
9519: 'Maria@r@v13/20400085."Uu!@k @v13/20400086.And you know, the witches, they held a coven during that time, called a Sabbat.@k@v13/20400087. The witches would thank the spirits that gave out blessings of prosperity, and reward them."'
9520: 'George@r@v07/20300230."Halloween costumes are an imitation of the visitors from the other side.@k@v07/20300231. ......So, then, the reason we give candy to them must be because of a feeling that they should be thanked for the yearly harvest."'
9521: 'Maria@r@v13/20400088."Uu!@k @v13/20400089.Just like George onii-chan says!"'
9522: 'Battler@r@v10/20100065."So Halloween is a time when this world and that world intermingle?@k @v10/20100066.So, in other words, it''s a precious opportunity for witches to interact with visitors from that world.@k@v10/20100067. Is that what you want to say?"'
9523: 'Maria@r@v13/20400090."Uu!!@k @v13/20400091.Just like Battler says!"'
9524: 'Maria@r@v13/20400092."So you know what?@k @v13/20400093.You know what?!@k @v13/20400094.October is the time when the power of witches and demons is at its most vigorous and prosperous!@k @v13/20400095.Kihihihihihihihi, I''m sure BEATRICE will come too!"'
9525: 'Maria@r@v13/20400096."And then, we''ll eat the marshmallow candies together, and she''ll take me to the Golden Land with her!@k @v13/20400097.We''ll sing magical songs together, learn magic spells together, learn how to draw magic circles together!@k @v13/20400098.And then I''m going to learn the secrets of runes, and become a great witch really, really quickly!"'
9526: 'Eva@r@v05/21000096."My, my, isn''t that wonderful.@k@v05/21000097. It''s best for kids to have dreams.@k@|@y@v05/21000098. By the way, Rosa,@k@v05/21000099. how old did Maria-chan turn this year again...?"'
9527: 'Rosa@r@v12/21400065."Ma-...Maria...@k@v12/21400066. That''s enough of that topic!"'
9528: 'Kyrie@r@v09/21300019."Don''t worry about it, Rosa-san.@k@v09/21300020. It''s a dream that any girl has at one time or another."'
9529: 'Rosa@r@v12/21400067."Tha-thank you very much.@k@v12/21400068. ...But Maria has already outgrown that age.@k@|@y@v12/21400069. ...Hey, I''m telling you to stop!"'
9530: '@rRosa scolded Maria, trying to shut her up before her cheery discussion about black magic earned her the snickers of the relatives.'
9531: 'Battler@r@v10/20100068."Wow...@k@v10/20100069. That''s a pretty large-scale dream.@k@|@y@v10/20100070. ......By the way, who was BEATRICE again?@k @v10/20100071.......What was it, umm, umm, I''ve heard that before..."'
9532: '@rBattler had been gone for six years, and had completely forgotten about the legend of the Rokkenjima witch.'
9533: '@rHowever, when he said that he didn''t know BEATRICE''s name, Maria''s mood, which had been so bright until just now, became sour in an instant.'
9534: '@rWhen he saw that, Battler immediately remembered that it was the name of the witch of this island, but the damage had been done.'
9535: '@r...Until Maria''s mood improved, many mysterious and fabulous episodes regarding the Golden Witch were drilled into his brain...'
9536: 'Rosa@r@v12/21400070."That is enough, Maria.@k@|@y@v12/21400071. Thank you, Battler-kun, for going along with her stories."'
9537: 'Rosa@r@v12/21400072."...Kanon-kun, don''t you have work to do?@k @v12/21400073.Please leave now.@k@v12/21400074. Gohda-san, I think everyone wants to set down their bags for the time being.@k@v12/21400075. Sorry, but could you guide everyone to the guesthouse?"'
9538: 'Gohda@r@v17/21700011."Certainly.@k@v17/21700012. ...Well then, everyone, I will guide you to the guesthouse."'
9539: 'Kanon@r@v16/20600218."......Then if you will excuse me."'
9540: '@rLed by Gohda, the relatives headed off in the direction of the guesthouse.'
9541: '@rTheir minds on setting down their luggage and taking a quick rest, they didn''t notice that Rosa and Maria had stayed in the same spot.'
9542: '@rAfter watching them leave towards the guesthouse, Rosa''s features changed suddenly.'
9543: '@rShe let go with the hand that had been gripping Maria''s arm the whole time.'
9544: '@r...There was a bright red mark there, making it clear how much excessive force she had been gripping Maria''s slender arm with.'
9545: '@rThat hand then smacked Maria over the head, and pulled her left ear up into the air, pinching it sharply...'
9546: 'Rosa@r@v12/21400076."I''m always telling you not to talk about witches......@k@v12/21400077. ...Haven''t I always said that was our promise together......?"'
9547: 'Maria@r@v13/20400099."Mama, it hurts, Mama, it hurts... It hurts it hurts it hurts......"'
9548: 'Rosa@r@v12/21400078."Halloween, Halloween, do you ever stop...?@k@v12/21400079. A witch festival...?@k @v12/21400080.Who cares about the Celts, who cares about black magic, are you an idiot......?@k @v12/21400081.You are nine years old, nine..."'
9549: 'Rosa@r@v12/21400082."Because you made that ruckus in the train, I had to go to all the trouble of getting off and buying you those disgusting monster marshmallows that look they have fluorescent paint on them...@k@v12/21400083. We were even late because I bought them for you.@k@v12/21400084. How much more will you have to embarrass me before you''re satisfied......?!"'
9550: '@rAs Rosa cursed, she twisted Maria''s ear up, making it seem like it was going to snap off...'
9551: '@rAn expression of anguish spread across Maria''s face, and she stood on her tiptoes as though her life depended on it, trying to soften the pain on the ear that was being pulled...'
9552: '@rRosa suddenly stole the candy that Maria had been holding in her hand.'
9553: '@rThen she threw it on the ground and stepped on it over and over.'
9554: '@rTo Maria, it was supposed to be proof of her memory of that span of time, however brief, when she had enjoyed going shopping with her mother...'
9555: '@rBut it was being trampled by that very same mother.@k@r...It was as though a brand was being pushed against Maria''s eyes, leaving a mark that couldn''t be erased...'
9556: 'Rosa@r@v12/21400085."Who cares about this disgusting candy,@|@y@v12/21400086. disgusting, disgusting...!!"@|@y'
9557: 'Rosa@r@v12/21400087."This is why, you see?! This is why!!@|@y@k @v12/21400088.Disgusting disgusting disgusting!!!"@|@y'
9558: '@rShe struck Maria''s head over and over again with her palm as she spoke.@k@r...She didn''t hit Maria''s face. Because the red swelling would stand out.'
9559: '@rMaria closed her eyes tightly, patiently bearing her mother''s violence...@k ...No, that wasn''t quite it.'
9560: 'Maria@r@v13/20400100.".......Come back, Mama, come back, Mama...@k@v13/20400101. Save me, Mama, save me, Mama...@k@v13/20400102. Beat the bad witch......"'
9561: '@rShe kept bearing it, muttering that over and over...'
9562: 'Rosa@r@v12/21400089."Will you LISTEN!!@k @v12/21400090.I TOLD you...@|@y@v12/21400091.to STOP...@|@y@v12/21400092.saying...@|@y@v12/21400093.witch!!@|@y@k @v12/21400094.You little...@|@y@v12/21400095. You... You...!!!"@|@y'
9563: '@rRosa''s shoulders shook as she breathed, tired from hitting.'
9564: '@r...Maria grasped her hands together, withstanding it, hoping her "mother" would come back quickly...'
9565: 'Maria@r@v13/20400103."......Mama, Mama...@k@v13/20400104. Come back quickly...@k@v13/20400105. Save me, Mama......@k@v13/20400106. Finish off the bad witch......"'
9566: 'Rosa@r@v12/21400096."Why don''t you, ...why don''t you just stay there doing that forever!!@k @v12/21400097.And then you can just stand there, mumbling about witches and Halloween forever!!"'
9567: '@rAfter throwing those words at Maria, Rosa went off towards the guesthouse, leaving Maria behind.'
9568: '@r...Maria, unable even to remember that it was alright to cry,@k kept staring down at the trampled, unrecognizable jack-o''-lantern candy...'
9569: 'Eva@r@v05/21000100."Oh, Rosa.@k@v05/21000101. Where did you go?"'
9570: 'Rosa@r@v12/21400098."I''m sorry.@k@v12/21400099. The roses were so wonderful, I got a bit carried away."'
9571: 'Rudolf@r@v08/21200090."Rosa, go set your luggage down, quickly.@k@v08/21200091. We''re going to greet Aniki."'
9572: 'Hideyoshi@r@v06/21100023."Hmm?@k @v06/21100024.What happened to Maria-chan?@k@v06/21100025. Is she still by the flower beds?"'
9573: 'Rosa@r@v12/21400100."...Yes.@k@v12/21400101. It looks like there was a rose she liked, and she said she wanted to look after it and wouldn''t listen.@k@v12/21400102. I decided to let her do what she wants for a while."'
9574: 'Kyrie@r@v09/21300021."............We sometimes forget that girls have their own little world.@k@v09/21300022. Sometimes, we have to respect that, right?"'
9575: 'Rosa@r@v12/21400103."......That''s right.@k@v12/21400104. ...Thank you for caring, Kyrie nee-san."'
9576: 'Rosa@r@v12/21400105."...Gohda-san.@k@v12/21400106. Where is our room?"'
9577: 'Gohda@r@v17/21700013."I will guide you. This way.@k@v17/21700014. Allow me to hold your luggage."'
9578: 'Rosa@r@v12/21400107."I''m fine, I can carry it myself. Thank you."'
9579: '@rRosa went into the room that Gohda had guided her to.'
9580: '@rClosing the door somewhat violently, she threw her luggage on top of the bed.'
9581: 'Rosa@r@v12/21400108.".................................@k@v12/21400109. ............"'
9582: '@rShe got down on her knees in front of the bed, ......and buried her face in it.'
9583: '@rFor a while, Rosa made as if to shred the sheets with her fingernails, sobbing continually...'
9584: 'Kanon@r@v16/20600219.".........Maria-sama.@k@v16/20600220. ...Are you alright?"'
9585: '@rKanon, who had been hiding behind a thicket, appeared after watching Rosa leave.'
9586: 'Maria@r@v13/20400107."...Kihi......kihihihihihihihihihi...@k@v13/20400108. ...I''m fine.@k@v13/20400109. ...Kihihihihi."'
9587: '@rMaria laughed unpleasantly, but to Kanon, who had seen the whole thing, it looked like she was enduring as best she could...'
9588: 'Kanon@r@v16/20600221."She''s a horrible person.@k@v16/20600222. I can''t believe that was a mother......"'
9589: 'Maria@r@v13/20400110."......It can''t be helped.@k@v13/20400111. Such pitiful things enter such pitiful vessels.@k@v13/20400112. ...I am just fine.@k@v13/20400113. Kihihihihihihihihihi......"'
9590: '@rKanon got down on his knees and picked up the trampled candy.'
9591: '@r......It was tragic just looking at it.'
9592: '@rHe thought about dusting it off and returning it to her, but really couldn''t do so with it in that condition.'
9593: '@rAs he was at a loss at what to do, he met eyes with Maria.@k@r......No, they didn''t meet.@k@rMaria was looking at the candy that Kanon had picked up.'
9594: '@r...Right now, Maria''s heart was surely the same as that trampled candy which had been crushed into a pulp...'
9595: '@rKanon realized this, but he didn''t know what he should do...'
9596: 'Kanon@r@v16/20600223."...I know...@k@v16/20600224. ......I''ll exchange it for the one I received earlier."'
9597: '@rKanon remembered that an identical candy which he had received from Maria was in his pocket.'
9598: '@rMaria stuck out her hand.'
9599: '@r......Kanon thought she was trying to accept it, so he held out the candy, but Maria didn''t try to grasp it.'
9600: '@r......Then Kanon realized.@k ...She was asking him to give it back.'
9601: '@r......No matter how tragic it was, the trampled candy was Maria''s.'
9602: '@r...Her mother had bought it for her.'
9603: '@rNo matter how tragic, it had to be this candy...@k@rIf only it could be made pretty again by dusting it off...'
9604: '@r...Kanon hung his head.'
9605: 'Kanon@r@v16/20600225.".........I can''t do anything except dust it off.@k@v16/20600226. .........Sorry."'
9606: '@rKanon held out the miserable candy she wanted.@k@rMaria took it, and spoke.'
9607: 'Maria@r@v13/20400114."...Thank you.@k@v13/20400115. A Human can''t do anything except dust it off, but a witch can repair it to how it was.@k@|@y@v13/20400116. It would be easy for BEATRICE.@k@v13/20400117. Kihihihihihi."'
9608: 'Kanon@r@v16/20600227."............Maria-sama,@v16/20600228. ...do you...@v16/20600229.know about BEATRICE-sama?"'
9609: '@rThere couldn''t be anyone related to the Ushiromiya family who didn''t know BEATRICE''s name, with Battler as an exception.'
9610: '@r...But just now, Maria had told Battler about her proudly.@k@rShe had spoken almost as though she had been meeting with BEATRICE regularly.'
9611: '@rThe inside of the fist Kanon made with his left hand hurt sharply.@k@r......In the past, a witch called BEATRICE had appeared, and had tempted him and Shannon.'
9612: '@rHe had always tried to make himself think it had been a bad dream.@k ......However, Shannon insisted that it had definitely been a real witch.'
9613: '@rAnd then, this summer.'
9614: '@r......The shrine to the local Shinto god had been hit by lightning and had disappeared without a trace in the span of a single night.'
9615: '@r...He had known that Shannon had broken the mirror.@k@r......And he remembered too that upon the witch''s departure, she had left him with the words that she would eventually be revived.'
9616: '@rAnd now, .........this girl who had no end of faith in BEATRICE spoke as though she had met her.'
9617: '@r...Kanon couldn''t suppress a sense of something ominous welling up in his heart.'
9618: '@rFor a while, Maria remained silent, as though she could see into Kanon''s heart.'
9619: '@r...As though she was waiting for his memory of BEATRICE to come back to him.'
9620: '@rThen, she spoke matter-of-factly.'
9621: 'Maria@r@v13/20400118."Kihihihihi...@k@v13/20400119. You know, I am friends with BEATRICE.@k@v13/20400120. I''m meeting her today too, to play.@k @v13/20400121.Kihihihihihihihihi..."'
9622: 'Kanon@r@v16/20600230."Pla-...play?"'
9623: 'Maria@r@v13/20400122."...Yep.@k@v13/20400123. Play.@k @v13/20400124.We''re going to study magic together.@k@v13/20400125. Kihihihihihihihi..."'
9624: '@r......The face of the witch, who Kanon had tried to pretend was a bad dream,@k ......began to slowly creep into the back of his mind......'
9625: 'Natsuhi@r@v03/20900076."Father said he was extremely busy with his research.@k@v03/20900077. He said that, unfortunately, he will be unable to make an appearance."'
9626: 'Rudolf@r@v08/21200092."......Come on.@k@v08/21200093. We''ve put this conference in our schedules and come all the way out to Rokkenjima during the very busy fall season.@k@v08/21200094. I wish Dad would act a little more sociable."'
9627: 'Eva@r@v05/21000102."So true.@k@v05/21000103. ......Doctor Nanjo.@k@v05/21000104. Is it really a problem with his research and his mood?@k @v05/21000105.He isn''t already bedridden, and unable to get up, right?"'
9628: 'Nanjo@r@v19/21900021."......Well, ......I wonder.@k@|@y@v19/21900022. There is not much I can say..."'
9629: '@rNanjo glanced at Natsuhi.@k@rAs though he wasn''t qualified to disregard Natsuhi when he spoke on this topic.'
9630: 'Natsuhi@r@v03/20900078."Father is healthier than ever.@k@v03/20900079. Calling him bedridden is the height of rudeness...!"'
9631: 'Eva@r@v05/21000106."But he only has three months left to live, right?@k @v05/21000107.Normally, wouldn''t that mean that he''d be wasting away, unable to get out of his bed?@k@v05/21000108. Right, Doctor Nanjo?"'
9632: 'Nanjo@r@v19/21900023.".........For a normal patient, that would probably be the case.@k@v19/21900024. But Kinzo-san has extraordinary willpower.@k@v19/21900025. ...The force of his will may have even the Grim Reaper too terrified to approach..."'
9633: 'Kyrie@r@v09/21300023."If he''s that energetic, then we can be at least a little reassured, right?"'
9634: 'Rudolf@r@v08/21200095."...Although if he''s that energetic, I wish he''d at least allow us to greet him.@k@v08/21200096. ...Isn''t the point of the family conference to come and see Dad''s face?@k @v08/21200097.Now I don''t know why the hell we came."'
9635: 'Krauss@r@v02/20800054."Don''t say that.@k@v02/20800055. If he were here, you would complain the whole time about how you couldn''t relax.@k@|@y@v02/20800056. I say we should celebrate that all of us siblings are here together as a family again this year, as we were the last, without even one of us missing."'
9636: 'Eva@r@v05/21000109."You realize we couldn''t meet him at last year''s family conference either?@k @|@y@v05/21000110.I wonder why we can''t get him to understand that his children by blood want to see him after two years."'
9637: 'Natsuhi@r@v03/20900080."......If you have words of greeting for him, I will tell him for you.@k@|@y@v03/20900081. Or, Eva-san,@k@v03/20900082. ......perhaps you had something other than a greeting you wanted to discuss with Father...?"'
9638: 'Eva@r@v05/21000111."..................nn.@k@v05/21000112. ...Come on, what are you talking about, sheesh."'
9639: 'Hideyoshi@r@v06/21100026."Give it a rest, Eva.@k@|@y@v06/21100027. Natsuhi-san, forgive us.@k@v06/21100028. Eva''s just concerned about Father''s condition, as his daughter.@k@v06/21100029. Please understand her feelings a bit."'
9640: 'Krauss@r@v02/20800057."That''s right.@k@v02/20800058. Eva, how suddenly you''ve become respectful to Father since he was told how long he has left.@k@v02/20800059. ...Yes, I can just about understand why you might be desperate to see him.@k@|@y@v02/20800060. ......Hmph."'
9641: 'Eva@r@v05/21000113.".........What exactly are you implying?"'
9642: 'Rudolf@r@v08/21200098."Quit it, Aneki.@k@v08/21200099. Why don''t we pray that his mood will improve by dinner?@k@|@y@v08/21200100. ...And we''ve just arrived.@k@v08/21200101. And anyway, we only came to give a light greeting.@k@v08/21200102. We can hold the family conference even without Dad."'
9643: 'Rudolf@r@v08/21200103."...No, there should even be a few things that we can''t talk to him about until we form a unified opinion.@k @v08/21200104.Right, Hideyoshi nii-san?"'
9644: 'Hideyoshi@r@v06/21100030."Yep!@k @v06/21100031.Just as Rudolf-kun says.@k@|@y@v06/21100032. ......We can only gather our faces here once a year.@k@v06/21100033. We''ve gotta value this precious time we''ve got, and talk together frankly."'
9645: '@rEven though the tea hadn''t even come yet, ...they were very strong-minded.'
9646: 'Kyrie@r@v09/21300024."But before that, I wonder if we have enough leeway to enjoy some black tea at our leisure,@k@v09/21300025. surrounded by the wonderful furnishings of the mansion''s parlor..."'
9647: '@rKyrie''s words seemed to hold some slight admonishment towards all of the people gathered in that place.'
9648: '@rThey all understood, and as they cleared their throats and straightened their neckties, the atmosphere in the room returned to normal for a moment.'
9649: 'Shannon@r@v15/20500437."......Excuse me.@k@v15/20500438. I have brought some tea."'
9650: 'Hideyoshi@r@v06/21100034."Hey, Shannon-chan.@k@v06/21100035. You just keep gettin'' prettier and prettier!"'
9651: '@rShannon entered the parlor, pushing the serving cart.'
9652: '@rEveryone decided to slowly enjoy some black tea for the time being...'
9653: '@rA wonderful aroma began to spread throughout the parlor.'
9654: '@rLooking at that scene, it would have been impossible to guess the strained atmosphere which had been there until right before Shannon had entered.'
9655: '@r...Of course, Shannon, who was setting out the tea, probably didn''t even notice.'
9656: '@r......Kyrie made a gesture that seemed to laugh at everyone''s adult appearance.'
9657: '@rRudolf didn''t like it when Kyrie took the initiative and spoke at the family conference.'
9658: '@r...It was his worthless male pride.'
9659: '@rHe probably didn''t want to look like a weak man taking his wife''s advice.'
9660: '@rShe understood that, and was doing her best to refrain from saying anything unnecessary.'
9661: '@rSo she separated herself from the circle of siblings, which was good-natured only in appearance, and slowly enjoyed her tea near the window.'
9662: 'Kyrie@r@v09/21300026."Oh, Rosa-san.@k@v09/21300027. I thought all you siblings were having a friendly discussion together...?"'
9663: 'Rosa@r@v12/21400110."......You are joking."'
9664: 'Kyrie@r@v09/21300028."Sorry, don''t take it the wrong way.@k@v09/21300029. I''m just rolling my eyes at my husband."'
9665: '@rIt seemed that Rosa hadn''t been able to keep up the charade of amicability.'
9666: '@r...They had come here to fight bloodily and dirtily, each trying to steal the inheritance from the others.'
9667: '@rShe probably didn''t want to pretend to be fellow conspirators at this stage.'
9668: '@r......Or maybe she was still much too inexperienced for that.'
9669: 'Kyrie@r@v09/21300030."...It looks like the wind has started blowing hard out there.@k@v09/21300031. ...The plants are all shaking so much."'
9670: 'Rosa@r@v12/21400111."The typhoon has probably already come fairly close.@k@v12/21400112. ......I wonder if it will rain a lot tonight."'
9671: 'Kyrie@r@v09/21300032."...............Maria-chan really has grown a lot this past year."'
9672: 'Rosa@r@v12/21400113.".........Does it look that way...?@k @v12/21400114.She still can''t even fold her own clothing yet."'
9673: 'Kyrie@r@v09/21300033."Yes.@k@v09/21300034. It''s because she has such an affectionate mother.@k@v09/21300035. She''ll grow into a girl who''s rich in heart."'
9674: '@rRosa was silent.@k@r.........Maybe she was unsure as to how Kyrie meant that...'
9675: 'Rosa@r@v12/21400115."...Me...?@k@v12/21400116. .........I''m not fit to be a mother.@k@v12/21400117. ...............Children can''t choose their parents.@k@v12/21400118. That poor girl..."'
9676: 'Kyrie@r@v09/21300036."Doesn''t that go both ways?@k@v09/21300037. ......A parent can''t choose what kind of child is born, either."'
9677: 'Rosa@r@v12/21400119.".............................."'
9678: '@rRosa bit her lower lip...'
9679: 'Kyrie@r@v09/21300038."It isn''t a matter of who''s at fault.@k@v09/21300039. You just need to have the mindset of going through life together with her, and slowly watch over her as she grows up."'
9680: 'Kyrie@r@v09/21300040."Rosa-san, you spend every day with Maria-chan, so you probably don''t notice the gradual changes.@k@v09/21300041. But the rest of us, who have been reunited with her after a year, really understand that she''s grown up a lot..."'
9681: 'Rosa@r@v12/21400120_1."......If you mean that sincerely, then thank you very much."'
9682: 'Shannon@r@v15/20500439."Then, if you will excuse me.@k@v15/20500440. If there is anything you desire, please call for it at any time."'
9683: '@rShannon bowed politely and left the room.'
9684: '@rAfter Hideyoshi and Rudolf watched her go with turned heads,@k@|@y ...the atmosphere in the room began to revert back to what it had been right before Shannon had visited.'
9685: 'Eva@r@v05/21000114.".........If Father is unable to be here, that in itself opens up the opportunity for some certain topics.@k@v05/21000115. Right, Rudolf?"'
9686: 'Rudolf@r@v08/21200105."Yes, that''s right.@k@v08/21200106. ...We didn''t come all the way out here just to drink some dusty tea, you know."'
9687: 'Krauss@r@v02/20800061."......Very well.@k@v02/20800062. Why don''t we hear this topic that you''re scrambling to get to?"'
9688: 'Kyrie@r@v09/21300042.".........My, my.@k@v09/21300043. Those people sure are strong-minded.@k@v09/21300044. They really started fast."'
9689: 'Rosa@r@v12/21400121."I must join in as well.@k@v12/21400122. ......If I don''t assert myself, they''ll quickly forget that there are four of us siblings."'
9690: 'Kyrie@r@v09/21300045."...It can''t be easy for you, either.@k@v09/21300046. ......Maybe I didn''t choose my words well.@k@v09/21300047. I''m sorry."'
9691: 'Rosa@r@v12/21400123."No, I don''t mind.@k@v12/21400124. ...I''m the one who should be apologizing.@k@v12/21400125. We''re both mothers with daughters, so really, we should have more of these conversations.@k@v12/21400126. But every time we meet, we talk about something strange..."'
9692: 'Kyrie@r@v09/21300048."......That''s the fault of the atmosphere in this mansion.@k@v09/21300049. Once we breathe in this air, everyone gets so strained.@k@v09/21300050. ......Just once, I want to drink a nice, long cup of tea with you, Rosa-san, when we aren''t attending a family conference.@k@v09/21300051. There''s a wonderful coffee shop in Ginza which is a favorite of mine.@k@v09/21300052. Please let me invite you sometime soon."'
9693: 'Rosa@r@v12/21400127."Thank you, Kyrie-san.@k@v12/21400128. That sounds good..."'
9694: 'Kyrie@r@v09/21300053."How horrible.@k@v09/21300054. The sky''s suddenly gotten dark.@k@v09/21300055. It''s almost as though the people in this room have made the weather worse.@k@v09/21300056. ......There''s already thunder."'
9695: 'Kyrie@r@v09/21300057."Oh?@k @v09/21300058.Do I see the first signs of rain...?"'
9696: 'Rosa@r@v12/21400129."...Huh?"'
9697: '@rThere really were small splashes of rain on the glass of the parlor window.@k@r...It seemed that the weather had gotten worse faster than they had expected.'
9698: '@r......Just then, a silent thunderbolt struck inside Rosa''s head, and she remembered that her beloved child was in the rose garden.'
9699: '@rA normal girl would think about going into the house if the weather got bad.@k@r......But Maria was different.@k She would sometimes become stubborn, and wouldn''t move no matter whether rain or even spears fell from the sky.'
9700: '@r......That''s right, I...@k......told that kid "just stay there doing that forever", didn''t I...?'
9701: 'Rosa@r@v12/21400130."Oh, ......oh no...!@k @v12/21400131.Maria...!!"'
9702: '@rAt this small exclamation, everyone turned to look at Rosa.'
9703: 'Krauss@r@v02/20800063."...What, what happened?"'
9704: 'Rosa@r@v12/21400132."I, I''m sorry, I''m going outside for a second.@k@|@y@v12/21400133. I''ll be right back!"'
9705: 'Rudolf@r@v08/21200107."......What what what? What''s going on with her, seriously..."'
9706: 'Kyrie@r@v09/21300059."Does it matter? She''ll be right back.@k@|@y@v09/21300060. ......Why don''t we just get started?@k @v09/21300061.With our main topic."'
9707: 'Eva@r@v05/21000116."Good idea.@k@v05/21000117. We can move that on even without Rosa.@k@v05/21000118. Let''s return to the matter at hand."'
9708: 'Kyrie@r@v09/21300062.".................."'
9709: '@rRosa dashed from the entrance hall into the rose garden.'
9710: '@rWhen she opened the door, the wind that hit her was too strong to be called a breeze, and told her that the typhoon was approaching faster than she had thought.'
9711: '@rJust as Kyrie had said, small droplets of rain were mixed in with the wind.@k There was also the low rumble of thunder.'
9712: '@r......It could start raining anytime.'
9713: '@rRosa headed for the rose garden.@k@rShe headed for the place where she had scolded Maria a short while ago.'
9714: '@r...It was almost lunchtime.'
9715: '@rThe children had been told that they could just come to the mansion at lunchtime,@k so they were probably in the guesthouse, waiting to be called.'
9716: '@r...Even if Maria didn''t come, they would surely think that I had taken her to the mansion with me, and wouldn''t worry much.'
9717: '@r......After all, she was with her mother, so there shouldn''t have been anything to worry about.'
9718: '@rExcept I was here, and had thrown my daughter into the worsening weather outside, all alone...!'
9719: 'Rosa@r@v12/21400134."Mariaaa!!@k @v12/21400135.Are you here?!!@k @v12/21400136.If you''re here, answer me!!"'
9720: 'Maria@r@v13/20400126.".........Uu."'
9721: '@rIt really was as I''d thought.'
9722: '@rShe was standing stock still, ...exactly the same way she had been, in the place where I had scolded her.'
9723: '@rHeld in her hand......was the candy that I had bought, given her, and then stepped on and crushed.'
9724: '@rWith that gripped in her hand, she had been standing there, as the strong wind whipped her hair about, tormenting her...'
9725: 'Rosa@r@v12/21400137."I''m sorry, I''m sorry!!@k @v12/21400138.Sorry, Maria...!!@k @v12/21400139.Forgive Mama...!"'
9726: 'Maria@r@v13/20400127."...Uu.@k@v13/20400128. Mama, welcome back...@k@v13/20400129. ......I waited a long time for you to come back, Mama.@k@v13/20400130. ...Got pinched by the scary witch, but held out and waited for Mama to come back, without crying..."'
9727: 'Rosa@r@v12/21400140."......Maria...@k@v12/21400141. ......Forgive Mama... Forgive Mama......"'
9728: 'Maria@r@v13/20400131."It''s not your fault, Mama...@k@v13/20400132. You were just possessed by a bad witch again......@k@|@y@v13/20400133. So I''m fine.@k@v13/20400134. Love you, Mama.@k@v13/20400135. I love you......"'
9729: 'Rosa@r@v12/21400142."UuuuuuUUuuuUUUuughhh!!@k @v12/21400143.I''m sorry, I''m sorry...@k@v12/21400144. ......Mama......lost to the bad witch...@v12/21400145. .........Forgive me............"'
9730: '@rRosa buried her face in Maria''s small chest, crying and begging forgiveness.'
9731: '@r...And those tears dripped down again, as they had countless times before.'
9732: '@rIf only the brilliant sun had been shining on the two of them,@k all of their cares would have evaporated, and they would have felt like they could begin anew.'
9733: '@r...However, what surrounded the two of them was the worsening weather.@k@rThe strong winds mixed in with the sound of thunder were saddening.'
9734: '@rRosa noticed the sound of Maria sniffling.@k@r...If she stood exposed to the wind for too long, she would probably catch a cold.'
9735: 'Rosa@r@v12/21400146."......So, Maria.@k@v12/21400147. It will be lunch very soon.@k@v12/21400148. Come back to the mansion with Mama."'
9736: 'Maria@r@v13/20400136."Uu.@k@v13/20400137. I''m not coming."'
9737: 'Rosa@r@v12/21400149."Wh-...why...?"'
9738: '@rRosa thought that Maria had already forgiven her, so she never imagined she would refuse.'
9739: '@rBut that expression on Maria''s face didn''t look like that of a child resisting her mother.@k ...So Rosa wasn''t able to understand why Maria wanted to stand still in the rose garden, pointlessly, as the weather grew even worse.'
9740: '@rMaria answered that question...'
9741: 'Maria@r@v13/20400138."It''s BEATRICE.@k@v13/20400139. She''ll come really soon.@k@v13/20400140. So I''m waiting."'
9742: 'Rosa@r@v12/21400150.".........Maria..."'
9743: '@rRosa started to say something, faltered, and then fell silent.'
9744: '@r...They had just gone to great lengths to make up with each other.@k@rShe chose her words carefully, trying to get Maria to come with her to the mansion without denying the witch outright.'
9745: 'Rosa@r@v12/21400151."......BEATRICE is...@v12/21400152.coming?"'
9746: 'Maria@r@v13/20400141."Uu!"'
9747: 'Rosa@r@v12/21400153."Really...@k@v12/21400154. Then instead of waiting here, why don''t we wait in the mansion?@k @v12/21400155.If you stay in this wind too long, you''ll catch a cold..."'
9748: 'Maria@r@v13/20400142."She''ll come!@k @v13/20400143.BEATRICE will come!!!"'
9749: 'Maria@r@v13/20400144."And when she does, I''ll give a candy to her.@k@v13/20400145. I''ll do trick-or-treat!@k @v13/20400146.I''ll give her a jack-o''-lantern marshmallow candy and say Happy Halloween!!!@k @v13/20400147.Uu!!"'
9750: '@rMaria pulled yet another sweet out of her handbag, moaning "uu-uu".'
9751: '@rRosa was bewildered, not knowing what to do as Maria started being difficult again...'
9752: '@rJust then, there was a sudden and massive roar of thunder.'
9753: '@rIt was probably...a sign.@k ......A sign that indicated this island had become closed off by the storm, and detached from common sense and reality.'
9754: '@rTherefore, as of this moment, all common sense would no doubt be useless.'
9755: '@rThe wind blew even stronger, and in the middle of a blizzard of scattered rose petals,@k ......a figure appeared, leaving Rosa momentarily unable to imagine that this was a scene from reality.'
9756: '@r...No, probably, it was—it had to be—fantastical.'
9757: '@rBecause that figure was shaped like...............'
9758: 'Maria@r@v13/20400148."BEATRICE!!"'
9759: '@rMaria dashed over to the figure.'
9760: '@r......Normally, Rosa would scold her daughter if she dashed over to a complete stranger.'
9761: '@r...But Rosa forgot about that, unable to do anything but stand there, shocked.'
9762: 'BEATRICE@r@v27/20700395."......It''s been a while.@k@v27/20700396. Have you been in good health?"'
9763: 'Maria@r@v13/20400149."Uu!@k @v13/20400150.I''m in good health!@k @v13/20400151.Witches don''t catch colds!@k @v13/20400152.Uu!!"'
9764: 'BEATRICE@r@v27/20700397."*cackle*cackle*!@k @v27/20700398.Witches make people catch colds with curses, but how foolish would it be if they caught one themselves.@k@v27/20700399. You should focus your energies on ensuring that you do not catch a cold yourself."'
9765: '@rShe patted Maria''s head as she said this, smiling roguishly...'
9766: '@rRosa couldn''t have known the name of the woman who was happily spoiling Maria.@k ...However, Maria had called to her in the beginning when she had appeared.'
9767: '@rTherefore, even though Rosa had never met her, and even though she hadn''t named herself, Rosa was able to learn her name.'
9768: '@r......However, that name held a special meaning on Rokkenjima and in the Ushiromiya family.'
9769: '@r......There''s no way something so stupid could......!'
9770: 'Maria@r@v13/20400153."BEATRICE!@k @v13/20400154.Happy Halloween!@k @v13/20400155.Look, bought these!@k @v13/20400156.You can have one too.@k@v13/20400157. Uu!"'
9771: 'BEATRICE@r@v27/20700400."Mm, Happy Halloween.@k@|@y@v27/20700401. Hoh, for me, you say?@k @v27/20700402.Even the single and only light given to a man lost in the darkness of purgatory, unable to go to heaven or hell, looks truly charming when made into a candy like this."'
9772: 'BEATRICE@r@v27/20700403."......Right now, on this island that has been cut off both from the world of humans and the world of nonhumans,@k@v27/20700404. there may be no sweet more suitable.@k@v27/20700405. *cackle*cackle*...!"'
9773: 'BEATRICE@r@v27/20700406.".........Hm?@k @v27/20700407.Maria, what has happened here?"'
9774: '@rThe witch noticed the sweet that Maria was grasping.@k ...It was Maria''s candy, which had been stomped on by Rosa, and had taken on a pitiful shape.'
9775: 'Maria@r@v13/20400158."......Uu.@k@v13/20400159. Stepped on and smashed.@k@v13/20400160. ......Can you return it to normal, Beato...?"'
9776: '@rMaria deliberately didn''t say that it was her mother who had stepped on it.@k@rHowever, when the witch saw the candy, for some reason, she looked at Rosa and grinned.'
9777: '@r...A chill went down Rosa''s spine, as though she felt that this gaze could see through every part of her.'
9778: 'BEATRICE@r@v27/20700408."It will be easy.@k@v27/20700409. Give it to me."'
9779: 'Maria@r@v13/20400161."Uu!"'
9780: '@rMaria held out the candy gleefully.'
9781: '@r......Rosa could do nothing but watch this unfold, stunned.@k@r...How could this person gloss over the fact that the candy was pitifully trampled, in a way that could satisfy Maria...?'
9782: '@rMaria looked as though she believed that it could be fixed as good as new.'
9783: '@r...There was no way that could be done without real "magic"...!'
9784: 'BEATRICE@r@v27/20700410."My, my, it is quite crushed, isn''t it.@k@|@y@v27/20700411. ......Come, Maria.@k@v27/20700412. Close your eyes and try to remember."'
9785: 'BEATRICE@r@v27/20700413."Because it really was that wonderful a candy.@k@v27/20700414. The candies in our memories are always full and fluffy.@k@v27/20700415. So you too must close your eyes and try to remember.@k@v27/20700416. What kind of candy was it really♪"'
9786: '@r...Along with those strange words, spoken as though singing an improvised folk song, the witch threw the sweet into the air.'
9787: '@rMaria had her eyes closed, just as the witch had told her, and was focused on remembering.@k@r...The shape that the crushed candy had really been.'
9788: '@rTherefore, only Rosa saw that scene.'
9789: '@rThe sweet which had been thrown into the air......burst into a gold color—no,@k those were golden butterflies.'
9790: '@rIt scattered into several golden butterflies, ...and they began to assemble in the witch''s hand, held up to the sky.'
9791: '@rAnd when they had, .........unbelievably, .........the candy had returned to its beautiful original form, just like the time it had been bought...'
9792: '@rOnly Rosa and the witch had watched that scene.'
9793: '@rUnable to understand the event that was occurring right in front of her eyes, Rosa stood with her mouth open, forgetting to shut it...'
9794: 'BEATRICE@r@v27/20700417."You may now open your eyes.@k@v27/20700418. ...Take it.@k@v27/20700419. Now your sweet has returned to normal."'
9795: 'Maria@r@v13/20400162."Uu!!@k @v13/20400163.BEATRICE, you''re always awesome awesome, *giggle*!!"'
9796: 'Rosa@r@v12/21400156."................................."'
9797: '@rThere was a very bold contrast between Rosa''s shocked appearance and Maria''s innocently joyful one.'
9798: '@r......Was that what the witch was laughing at?@k@rA smile floated to BEATRICE''s face, different from the one that she had shown Maria.'
9799: 'BEATRICE@r@v27/20700420."......Does my face look familiar?@k @v27/20700421.If you stare so fixedly, you might burn a hole through it."'
9800: 'Rosa@r@v12/21400157."Huh, ......ah, I, I''m sorry...!"'
9801: '@rAt those words, it hit Rosa strongly.'
9802: '@r......Rosa knew her face.@k@r......She knew it from the portrait of the witch.'
9803: '@rBut, no, wait, ......was this mystery woman really......?!'
9804: 'BEATRICE@r@v27/20700422."......Maria.@k@v27/20700423. I will give this to you in exchange for that sweet."'
9805: 'Maria@r@v13/20400164."Uu...?@k @v13/20400165.Letter?"'
9806: '@rThe witch pulled a Western envelope from her pocket and gave it to Maria.@k However, when Maria made to open it, the witch stopped her.'
9807: 'BEATRICE@r@v27/20700424."You must not.@k@v27/20700425. The time will come soon to open it, but until then, you must not open it under any circumstances.@k@v27/20700426. Take good care of it.@k@v27/20700427. It will become an invitation calling you to the Golden Land."'
9808: 'Maria@r@v13/20400166."The Golden Land!!@k @v13/20400167.You''re finally going to take me there!!@k @v13/20400168.*giggle*!@k @v13/20400169.*giggle*!!"'
9809: 'BEATRICE@r@v27/20700428."Take it and tuck it away safely.@k@v27/20700429. You must not show it to anyone."'
9810: 'Maria@r@v13/20400170."Uu!@k @v13/20400171.Promise!@k @v13/20400172.I always keep my promises with witches!"'
9811: 'BEATRICE@r@v27/20700430."......And this is for you."'
9812: 'Rosa@r@v12/21400158."Huh.........?@k @v12/21400159.M-......me......?!"'
9813: '@rShe probably hadn''t imagined that the witch would speak to her, too.'
9814: '@rRosa was bewildered by this second Western envelope which had been thrust before her.'
9815: '@rShe remembered having seen that Western envelope before.'
9816: '@r......There could be no mistake.@k It was Kinzo''s special envelope, used when he wrote with his own hand, and bearing the Ushiromiya crest.'
9817: '@rMoreover, it was sealed with red sealing wax,@k ...and further still, it had an imprint which seemed to have been made by the Head''s Ring.'
9818: '@rIn other words, irrespective of what was written inside,@k ...this woman, who Maria called BEATRICE,@k was trusted enough that she was in charge of a personal letter from the current Ushiromiya head...!'
9819: 'BEATRICE@r@v27/20700431."It could have been any of the four siblings.@k@v27/20700432. However, the fact that I have met you here probably means that you were chosen by Kinzo''s roulette."'
9820: 'BEATRICE@r@v27/20700433."...So take it.@k@v27/20700434. And read its contents aloud while seated at the dinner table, when all of the siblings are gathered."'
9821: 'Rosa@r@v12/21400160.".........What did you say......"'
9822: '@rRosa looked back and forth several times between the witch''s face and the envelope she had been handed.'
9823: '@rToday was the family conference, and the biggest object of discussion was the inheritance problem.@k ......So, she had joined together with Eva and Rudolf,@k and they had planned to force certain conditions upon Krauss to try to extort a prompt payment of several hundred million yen out of him.'
9824: '@rIt was as if the witch could see through all of that.@k@r......And when all of the siblings are gathered, ....what is she planning on announcing to us?'
9825: '@rWith a personal envelope that no one but the Ushiromiya head can use...!'
9826: 'BEATRICE@r@v27/20700435."......Maria,@k@v27/20700436. the weather is getting worse.@k@v27/20700437. Return to the guesthouse and wait for lunchtime."'
9827: 'BEATRICE@r@v27/20700438.".........Well then, Rosa, let us meet later.@k@v27/20700439. Allow me to name myself there.@k@v27/20700440. ...*cackle*cackle*cackle*."'
9828: '@rThe witch turned her back to her, laughing.@k@r...And headed off towards the mansion with an air of composure.'
9829: '@rMaria saw her off with an energetic reply, and then dashed off towards the guesthouse, leaving Rosa where she was.'
9830: '@r......As though she didn''t want to waste a second in informing the other cousins of her good fortune at meeting the witch.'
9831: '@rUltimately, Rosa was left alone in the rose garden as the winds grew stronger,@k ......unable to do anything except pray that what had happened was just a daydream...'
9832: '@rWhen the witch entered the entrance hall, ......Genji was there.@k@rWith a respectful bow, Genji welcomed the "guest" who approached from the entrance hall...'
9833: 'Genji@r@v14/21600033."We have been awaiting you.@k@|@y@v14/21600034. .........BEATRICE-sama."'
9834: 'BEATRICE@r@v27/20700441."...It''s been a while, Genji.@k@v27/20700442. .........Hmph.@k@v27/20700443. You''ve gotten old."'
9835: 'Genji@r@v14/21600035."......No matter how old it is, furniture will only carry out its work like furniture, until the end."'
9836: 'BEATRICE@r@v27/20700444.".........I remember how his wife used to be jealous of you.@k@|@y@v27/20700445. ...Is Kinzo well?"'
9837: 'Genji@r@v14/21600036."He is full of life."'
9838: 'BEATRICE@r@v27/20700446."......Hmph.@k@v27/20700447. *cackle*cackle*cackle*cackle*!"'
9839: '@rThe witch''s laugh was probably because she knew that Kinzo''s own doctor had told him that he would not live much longer.'
9840: '@r...However, if anyone actually looked at Kinzo,@k his energy and vigor, which made it extremely difficult to imagine that his remaining life really was slim, might make it natural to call him "full of life".'
9841: '@r...Maybe the witch had laughed at that.'
9842: 'BEATRICE@r@v27/20700448."Then let us greet him.@k@v27/20700449. It will be good to hurl curses at each other after thirty years."'
9843: '@rAs the witch grinned, she started walking, leaving Genji behind.@k@r......Her gait was like that of a family member who knew the inside of the mansion well.'
9844: '@rGenji followed her, as though he served her.'
9845: '@rAt that very moment, Kyrie came out of the parlor.@k@r...She had probably come out to fix her makeup or something.'
9846: '@rAnd when she saw Genji following the witch, she was surprised, although her expression did not change.'
9847: '@rThere was a visitor for Kinzo, whose remaining life was not long, on the day of the family conference when the fate of the inheritance was to be decided,@k ...and furthermore, this person was well enough acquainted with the Ushiromiya family that Genji was following behind her.'
9848: '@r......Kyrie immediately realized that this person who she had never met before was someone deeply important.'
9849: '@rKyrie met eyes with the witch.@k@r......Realizing that it would be rude to pretend not to notice, she greeted the witch.'
9850: 'Kyrie@r@v09/21300063."............Pleased to meet you."'
9851: 'BEATRICE@r@v27/20700450."Rudolf''s second wife?"'
9852: 'Genji@r@v14/21600037."That is correct.@k@v14/21600038. This is Kyrie-sama, Rudolf-sama''s current wife."'
9853: '@rFrom this exchange, Kyrie realized that this woman was a guest of considerably high rank within the Ushiromiya family.'
9854: '@r.........And, the fact she was a guest of that level,@k ......coupled with the face of the entrance hall portrait behind her, ......made Kyrie''s eyes open wide in an instant...'
9855: 'Kyrie@r@v09/21300064."......Pleased to meet you.@k@v09/21300065. My name is Kyrie.@k@v09/21300066. I wonder if this is our first meeting.@k@v09/21300067. If we did greet each other before, I apologize for forgetting your name."'
9856: 'BEATRICE@r@v27/20700451."...You already have a vague idea, yet you expect me to waste my breath?"'
9857: 'Kyrie@r@v09/21300068."..........................."'
9858: '@rKyrie had thought she had given her a sociable and humble greeting.@k@rHer expression grew slightly cloudy at that openly oppressive response.'
9859: '@r......It didn''t seem like this was a person she could grow to like.'
9860: '@r...But if Kyrie''s imagination was correct, ......this "witch" likely held a huge key to what her own husband was most interested in,@k and one that stood a great chance of influencing tonight''s family conference...'
9861: '@rSo she did not shoot back a retort, and could only watch in silence as the woman went up the stairs to the second floor, with Genji following behind.'
9862: '@rSo when someone tapped her shoulder from behind, she was so surprised, she almost choked.'
9863: '@rIt was Natsuhi...'
9864: 'Natsuhi@r@v03/20900083.".........Kyrie-san.@k@v03/20900084. Standing still in a place like this,@k@v03/20900085. is something the matter...?"'
9865: 'Kyrie@r@v09/21300069."I, I''m sorry.@k@v09/21300070. ......I was just a little fascinated by the portrait of the witch."'
9866: 'Natsuhi@r@v03/20900086."......The Golden Witch, BEATRICE, was it?@k@v03/20900087. Something like—the revival of the Ushiromiya family to what it is today would never have been possible without the gold she gave...@k@v03/20900088. ......A fantastical story, very much like Father."'
9867: '@rNatsuhi spoke of her in her usual way.@k@r...She spoke from the position that the idea of a witch was just foolish, and that in the end, it was nothing more than Kinzo''s ramblings.'
9868: '@r...However, for some reason, that no longer felt right to Kyrie.'
9869: '@rJust now, she herself had seen the Golden Witch come in from the entrance hall and climb up the stairs.'
9870: '@rSo Natsuhi''s choice of words seemed almost like a refusal to accept her existence,@k or as if she was leading her to think that she did not exist...'
9871: 'Kyrie@r@v09/21300071."...I''m sorry.@k@v09/21300072. I think I''m feeling a bit of a headache.@k@v09/21300073. ...I think I''ll rest for a little while."'
9872: 'Natsuhi@r@v03/20900089."Oh, is that so...?@k @v03/20900090.Then I have some good headache medicine.@k@v03/20900091. Allow me to prepare it for you..."'
9873: '@rThe hallway in front of Kinzo''s study was filled with the scent of sweet poison particular to that green liquor...'
9874: '@rGenji, who was completely used to it, did not grimace.@k@r...And the Golden Witch didn''t grimace either.'
9875: 'BEATRICE@r@v27/20700452."......When was the last time he left this room?"'
9876: 'Genji@r@v14/21600039."I believe it has already been several years."'
9877: 'BEATRICE@r@v27/20700453."............He is that intent on making me a bird in a cage?@k@v27/20700454. ...Alas.@k@v27/20700455. ......Now you, who made that wish, are the bird in a cage.@k@v27/20700456. ...The ghost of the study, are you not.@k@v27/20700457. ......What a pitiful man to not recognize that."'
9878: 'Genji@r@v14/21600040."......He would probably continue his research until the day he could meet you again, even if he literally became a ghost."'
9879: 'BEATRICE@r@v27/20700458."Is it love or madness or obsession?@k@v27/20700459. ...I suppose they too will become magic if well enough developed.@k@v27/20700460. ......You sad mage."'
9880: '@rThe witch grasped the doorknob to the study.'
9881: '@r......When she did, there was a sound like that of flesh burning and splitting open.'
9882: '@r...It was the sound of the doorknob literally burning the witch''s hand.'
9883: 'Genji@r@v14/21600041."......BEATRICE-sama..."'
9884: 'BEATRICE@r@v27/20700461."What is this?@k@|@y@v27/20700462. .........A magic ward!@k @v27/20700463....That fool, is he unable to get by without relying on something like this...?"'
9885: 'Genji@r@v14/21600042."...I have heard that this door is painful for you, BEATRICE-sama.@k@v14/21600043. Shall I open it...?"'
9886: 'BEATRICE@r@v27/20700464."No, ...it is fine.@k@v27/20700465. If he wins, I will be a bird in a cage for all eternity.@k@v27/20700466. ...If he loses, only the life of a laughingstock will be left, the life of a pitiful mage who went mad with love and lost everything."'
9887: 'BEATRICE@r@v27/20700467."......Already, Kinzo and even I are nothing more than pieces laid out on the game board.@k@v27/20700468. ...All that is left is for the result of the roulette to decide who wins and who loses.@k@v27/20700469. .........Until the roulette shows its result, there is no need for me to be reunited with Kinzo."'
9888: '@rThe witch looked at her hand, which, although horribly burned, was beginning to heal bit by bit.'
9889: 'BEATRICE@r@v27/20700470."......And so the ward, perhaps.@k@v27/20700471. .........Hmph.@k@v27/20700472. ...I see, that is also honorable.@k@v27/20700473. ......Now, everything is on top of Kinzo''s game board."'
9890: 'BEATRICE@r@v27/20700474."I like it, Kinzo.@k@v27/20700475. Allow me to enjoy my game with you.@k@v27/20700476. ......Allow me to enjoy the final gamble and fall of an aged mage, who fell in love with me and threw away all his life...!!"'