11346: 'Kanon@r@v16/20600391."Milady, please, calm yourself...!"'
11347: 'Gohda@r@v17/21700065."We still don''t know who the culprit is!@k @v17/21700066.And BEATRICE-sama is an important honored guest to the Master...!"'
11348: 'Jessica@r@v04/20200489."So what?!!@k @v04/20200490.If we grab her by the collar, she''ll definitely confess!!@k @v04/20200491.If we can look her in the eye, we''ll know!!@k @v04/20200492.I''ll see through her!!@k @v04/20200493.A witch?! BEATRICE?!!@k @v04/20200494.I''ll expose her for who she is!!"'
11349: '@rJessica never stopped moving.@k@rGohda and Kanon chased after her, doing their best to convince her, but Jessica never lent them an ear.'
11350: '@rEventually, the "Witch''s VIP Room" came into view.@k@rThis VIP room was always sealed and never used.'
11351: '@r...No matter what kind of guest came, Kinzo wouldn''t let them in this room.'
11352: '@r......And yet, the servants were always made to clean this room, so that it could be used at any time.'
11353: '@rSo the servants had started calling this room the "Witch''s VIP Room", after their other shapeless master.'
11354: '@rJessica also knew this.@k And she couldn''t stand that woman''s arrogance in calling herself a witch, by staying in that room.'
11355: '@r......The Golden Witch was just a fairy tale.@k Come on, a witch?!@k To Jessica, she was nothing more or less than the murderer who had brutally killed her parents!'
11356: '@rQuestion her, make her give painful excuses, make her spit at the ground painfully, make her breathe painfully.'
11357: '@r...No matter how hard she pretends to be a witch, I''ll teach her that she''s just a stinking, sweaty Human!!'
11358: '@rJessica hit the door to the VIP room while yelling with all of her strength.'
11359: '@rIt definitely wasn''t a knock.@k ...That sound was the beating of her anger''s hammer, whose message was clear: if the woman didn''t open the door, she''d break it down.'
11360: 'Jessica@r@v04/20200495."Open it, BEATRICE!!@k @v04/20200496.Come out!!@k @v04/20200497.You hear me, right?!@k @v04/20200498.Open up!!!"'
11361: '@rThere was no answer.@k ...Jessica twisted the doorknob without any reservation, but she felt the resistance of the lock.'
11362: '@rJessica turned to the two servants, and spat out at them demandingly.'
11363: 'Jessica@r@v04/20200499."The master key opens this, right?!@k @v04/20200500.Open it!!"'
11364: 'Gohda@r@v17/21700067."Milady...!@k @v17/21700068.That would be horribly rude...!!"'
11365: '@rAlthough Gohda was flustered, he still tried to somehow calm Jessica''s anger.'
11366: '@r......After hanging his head silently for a while, Kanon pulled a master key from his jacket pocket.'
11367: 'Gohda@r@v17/21700069."Kanon-san...!@k @v17/21700070.Is that alright?!"'
11368: 'Kanon@r@v16/20600392."......I am aware that this will be rude if she is there.@k@v16/20600393. .........And in any case,@k@v16/20600394. ...if BEATRICE-sama has nothing to do with this, she just has to explain herself so that we can believe her."'
11369: 'Jessica@r@v04/20200501."Tha-......that''s right, exactly!!@k @v04/20200502.Give it here!"'
11370: '@rJessica snatched the master key from Kanon''s hand, and violently shoved it into the keyhole.'
11371: '@r...Immediately, there was a light sound and she felt it unlock.'
11372: '@rAnd without excusing herself, she flung open the door.'
11373: 'Jessica@r@v04/20200503."BEATRICE!!@k @v04/20200504.Where are you?!@k @v04/20200505.Show yourself!!"'
11374: '@rJessica rudely barged into the room.@k@r...The witch wasn''t anywhere to be seen.'
11375: 'Jessica@r@v04/20200506."...Bitch!!@k @v04/20200507.She''s not here!!@k @v04/20200508.Where the hell did she go?!"'
11376: 'Gohda@r@v17/21700071.".........She, she doesn''t appear to be here, does she..."'
11377: '@rJessica, thinking that she might be hiding somewhere inside the room, peeked behind the curtains and under the bed, but she couldn''t find anyone.'
11378: '@rHowever, there definitely were signs that the bed had been used,@k ......and although it''s an odd way to say it, the atmosphere in the room had grown a little softer.'
11379: '@rIt wasn''t the hard atmosphere of a place normally devoid of people, like the chapel.@k@rYou could definitely tell that someone had spent the night in this room.'
11380: '@rBut she could not be seen.'
11381: '@rIn reality, neither Jessica nor Gohda had met BEATRICE yet.'
11382: '@r...They had only been told by those who had met her that she was the spitting image of the person in the portrait.'
11383: '@r...So they were doubtful about what her face really looked like.'
11384: '@r...However, Kanon alone had met her.@k And he understood what kind of being that witch was, ......and what kind of character she had.'
11385: '@rSo he knew that if they were to force their way in here searching for her, she wouldn''t let things go as they planned.'
11386: '@r......She must be watching us bitterly flail about in vain from somewhere, sneering at us.@k ......She''s that kind of person.'
11387: '@rBecause he was looking at things that way, Kanon was the first to find it.@k ...The other two were concentrating on finding the shape of a person, so they hadn''t noticed.'
11388: '@rNear a water jug on the side table, there was a single sheet of writing paper.@k It was accompanied by a short message and a fountain pen which had probably been used to write it...'
11389: '@rKanon understood the witch.@k The witch would definitely ridicule them, as they found the six corpses, forced their way in here in rage, and were unable to find her.'
11390: '@r......Ridicule has no meaning unless it is communicated.@k@rSo in other words, ...this was definitely...that...!'
11391: 'Kanon@r@v16/20600395."......Milady.@k@v16/20600396. .........There''s something written here."'
11392: 'Jessica@r@v04/20200509."Written, what?!"'
11393: '@rJessica quickly dashed over and violently stole the piece of paper.'
11394: '@r......She probably wasn''t trying to be violent.@k@r...She just couldn''t control her strength now.'
11395: 'Jessica@r@v04/20200510.".........What...?!@k @v04/20200511.She''s, she''s mocking me?!!"'
11396: '@rAs soon as she read the message, Jessica went into a wild rage, crumpled the paper up, and threw it.'
11397: '@rThen, she grabbed a table lamp that was by the side of the bed and violently swung it around, mercilessly hitting the walls and furniture with it.'
11398: '@r...The lightbulb shattered at once, and scattered its shards across the room.'
11399: 'Gohda@r@v17/21700072."Milady, please calm yourself...!@k @v17/21700073.You''ll hurt yourself!!"'
11400: 'Jessica@r@v04/20200512."Let go!!@k @v04/20200513.Damn it, damn it!@|@y@k @v04/20200514.Show yourself, BEATRICE!!@k @v04/20200515.How could you do that to Mom and Dad!!@k @v04/20200516.Are you that damn scared of me?!@|@y@k @v04/20200517.I''ll kill you, I''ll kill you!!@k @v04/20200518.Come out so I can beat you to death!!!@k @v04/20200519.@rI told you to let go of me, damn iiiiiiiiiiiiiiiiiiit!!"@|@y'
11401: '@rThis was written on the paper...'
11402: 'BEATRICE@r@v27/20700756.@z70.Did you think I''d waste my time waiting comfortably in this place for you to barge in here?@k@r@v27/20700757. You''re too wild to be suitable for this intellectual night.@k@r@v27/20700758. What kind of faces must your parents have had after raising you to be such a hapless fool?@k@r@v27/20700759. Yeah, I saw them, they had perfectly stupid faces just like you.@k@r@|@y@v27/20700760. Now they are in Candyland with their bellies all full!'
11403: '@r......It sounded like something that witch would write...@k ......It meant that she had predicted that one of the children who had lost their parents would come running in here.'
11404: '@r...If she was hiding somewhere in this room, she would surely be rolling around with laughter...'
11405: '@rThe witch was that kind of person.@k@r...She sneered at people''s misfortune, using it to stave off the boredom of a thousand years...!'
11406: 'Gohda@r@v17/21700074."Hand it over...!@k @v17/21700075.I am telling you that you will hurt yourself...!@|@y@k @v17/21700076..........nnnnn, ......nnnn!!"'
11407: 'Jessica@r@v04/20200520."I said let go!!@k @v04/20200521.Damn iiiiiit, damn iiiiiiit!!@k @|@y@v04/20200522.......au!"'
11408: '@rGohda grabbed the table lamp Jessica had been swinging around and took it from her.'
11409: '@r...Because if she kept swinging it around, she might hit something and get injured.'
11410: '@r...To Gohda''s eyes, Jessica probably looked mad with rage, burning with the flames of anger.'
11411: '@r......But Kanon''s eyes saw it differently.'
11412: '@rThose were probably...tears of sadness...hidden by rage...'
11413: '@rTherefore.'
11414: '@rWhen, at the moment the table lamp was taken from her,@k Jessica dropped to the floor almost as if groveling, and started crying and scratching at the carpet...'
11415: '@r......Gohda was surprised, but Kanon was not.'
11416: '@r......Her way of crying by brandishing her anger had been stolen from her, ...so this was inevitable.'
11417: 'Jessica@r@v04/20200523."Uuuuuuuuuuughhh, waaaaaaaaaaaaaaaaaaaaaaaaaaaaaa!!@k@r@v04/20200524.Mom...Dad...@ruwaaaaaaaaaaaaaaaaaaaaaaaaaauuuuuuuuu!!"'
11418: '@r...Considering that she was a daughter of the Ushiromiya main family, ...she was in a very shabby state.'
11419: '@r......She scratched at the carpet with her fingernails, and even her feet writhed and scratched at it.'
11420: '@rJessica cried very, very hard.@k ...Because if she didn''t, her rage would start building up again, and swallow her up.'
11421: '@rBut over and over again, she remembered that letter''s humiliating message...'
11422: '@r......What kind of faces must your parents have had after raising you to be such a hapless fool?'
11423: 'Jessica@r@v04/20200525."They aren''t stupid!!@k @v04/20200526.Both Mom and Dad were smart!!@k @v04/20200527.They weren''t like me, they were really smart!!@k @v04/20200528.They aren''t stupid!@k @v04/20200529.Take it back,@|@y@k@v04/20200530. take it back!!"@|@y'
11424: '@rYeah, I saw them, they had perfectly stupid faces just like you.@k@rNow they are in Candyland with their bellies all full!!'
11425: 'Jessica@r@v04/20200531."Ooooooooooooooohhh, damn iiiiiit!!@|@y@k @v04/20200532.I''ll kill her I''ll kill her, I''ll slice her stomach and make her meet the same end!!@k @v04/20200533.Uuuuaaaaaaaaaaaa, waaaaaaaaaaaaaa......!!!@k @v04/20200534.Hic, *cough*cough*, *cough*cough*cough*!!!"'
11426: '@rAs Jessica cried and screamed, she triggered an asthma attack...@k The servants watching over her ran up to her hurriedly and rubbed her back, but that only provoked Jessica''s wrath...'
11427: 'Jessica@r@v04/20200535."*cough*cough*!!@k @v04/20200536.''the hell!!@k @v04/20200537.If you have the time to do that, search for that bitch!!@k @v04/20200538.Find her and bring her to me!!"'
11428: 'Jessica@r@v04/20200539."If you won''t go, then I will!!@k @v04/20200540.And I''ll kill her with my own hands, I''ll slice her stomach!!"'
11429: 'Jessica@r@v04/20200541."*cough*cough*cough*cough*!!@k @v04/20200542.*cough*, *cough*!!@k @v04/20200543.Don''t touch me!!!@k @v04/20200544.Fucker...fucker, *cough*cough*!!@k @|@y@v04/20200545.*cough*cough*!!"'
11430: '@rJessica got up unsteadily, and as her asthma continued, she went out into the hallway...'
11431: 'Gohda@r@v17/21700077."Milady, your medicine, quickly...!@k @v17/21700078.I will call Doctor Nanjo!"'
11432: 'Kanon@r@v16/20600397."...............Gohda-san.@k@v16/20600398. .........Would you...leave this to me?"'
11433: '@rKanon had noticed.@k .........Gohda, who was much older, ...probably couldn''t feel the tears in Jessica''s heart.'
11434: '@r......Kanon, who had noticed that himself, had to support her.'
11435: 'Gohda@r@v17/21700079."K-Kanon-san.@k@v17/21700080. ............Is that alright...?"'
11436: 'Kanon@r@v16/20600399.".........I believe that Milady needs some time to cry for now.@k@v16/20600400. ............After seeing her parents, when they were killed like that..."'
11437: 'Gohda@r@v17/21700081.".................................@k@v17/21700082. ...You''re right."'
11438: '@rGohda also understood.@k ......And he also knew of the modest relationship that Jessica and Kanon shared.'
11439: '@rSo he understood everything, and left it to Kanon.'
11440: 'Gohda@r@v17/21700083.".........I understand.@k@v17/21700084. ......I will go back to Rosa-sama.@k@v17/21700085. ...Please, take care of Milady."'
11441: 'Kanon@r@v16/20600401."Yes.@k@v16/20600402. ......Leave it to me."'
11442: '@rKanon''s voice was frail, ......but he nodded forcefully.@k@rAfter looking at his eyes, Gohda also nodded forcefully.'
11443: '@r...Gohda was a veteran with many years behind him.@k He had seen a great number of people in his life.@k ...So he knew of the vigorous sparkle that could be found in the eyes of those who had self-control.'
11444: '@rHe had seen that clearly in Kanon''s eyes.@k@r......Therefore, he would leave this to Kanon.'
11445: '@r...Thinking about it, this may have been the first moment that Gohda had trusted Kanon and relied on him for a job...'
11446: '@rIt seemed Jessica was heading towards her room, ...leaning against the wall as she suffered from her asthma.'
11447: '@r......Kanon followed after her wordlessly.'
11448: '@rIf she had asked for a hand, he would have jumped over and supported her.@k ...But as long as Jessica didn''t ask for that, he hid himself, watching over her from a distance where he could come to her rescue at any time.'
11449: '@r......As Kanon remained in that spot where ten billion people would hope for someone else to be when their hearts felt like they would explode from sadness,@k he silently watched Jessica''s back...'
11450: '@rThen, finally, she was crouching in front of the door to her own room.'
11451: '@r......The asthma attack had stolen all of her strength.@k......The asthma attack had stolen all of her strength.'
11452: '@r......But right now, Jessica wasn''t thinking that she wanted someone to lend a hand.@k Because she still hadn''t been able to overcome the flames of anger.'
11453: '@r...Because even if someone had offered her a hand with good intentions, right now, Jessica would start wanting to grab it and lacerate it.'
11454: '@r...And she understood how unreasonable that would be.@k ...Until she could overcome the flames of her anger, she definitely wouldn''t ask for help.'
11455: '@rProbably, Jessica no longer even had the willpower to call for help.'
11456: '@r......But Kanon heard it.@k ...He definitely heard it.'
11457: '@r......Kanon definitely heard that voiceless call for help, which is shared by those from across the world who are grieving, and which, though they scream and scream, cannot be heard by anyone.'
11458: '@rKanon softly knelt by Jessica''s side, and wordlessly offered her a shoulder.'
11459: '@r......Even as Jessica kept coughing painfully, she accepted it,@w500. .........unlocked her room, and entered...'
11460: 'Kanon@r@v16/20600403."............This way.@k@v16/20600404. ...............I''ll prepare your medicine right away."'
11461: 'Jessica@r@v04/20200546."..................*cough*cough*cough*...!@k @|@y@v04/20200547..........*co.........*cough*cough*cough*...!!"'
11462: '@rJessica had often said that when she let her asthma run its course, it hurt so badly that it felt like she would vomit her whole stomach.'
11463: '@rHer face was pale, and her gaze wavered.@k@rAnd yet, the coughing continued...'
11464: '@r......Even so, ...her sadness was probably even stronger...'
11465: '@rAfter having her sit on the bed, Kanon took an inhaler from a cute basket on a side table by the bed, and handed it to her.'
11466: '@r......Jessica sometimes forgot to walk around with her medicine.'
11467: '@rWhen it seemed that this was the case, Kanon would take notice and secretly carry around the inhaler from the first-aid kit in the servant room, but he hadn''t done so today.'
11468: '@r......He scolded himself, as though wondering how, after failing to bring it with him on a day like this, he could call himself furniture.'
11469: '@r.........Then he remembered the day when he had spoken that word, and somehow betrayed Jessica''s feelings, ...which jarred Kanon''s heart,@k ......but compared to Jessica''s current sadness, he thought of that as a far more shameless emotion, and he suppressed it to the depths of his heart...'
11470: 'Jessica@r@v04/20200548.".........haah.........haah...@k@v04/20200549. .....................haah..."'
11471: '@rWhen she inhaled her medicine, Jessica''s wild breathing calmed down bit by bit, ...and she was finally able to regain her composure.'
11472: '@r.........But the strength and willpower she had lost wouldn''t allow her to rise up from the bed.'
11473: 'Kanon@r@v16/20600405.".....................Are you alright?@k@v16/20600406. ......Milady."'
11474: 'Jessica@r@v04/20200550."............I''m...@v04/20200551.......alright...@k@|@y@v04/20200552. .........I''m all messed up over Mom and Dad,@v04/20200553. .........but,@v04/20200554. ......after I cry a little longer,@v04/20200555. .........I''ll be alright............"'
11475: 'Kanon@r@v16/20600407."........................"'
11476: '@rKanon regretted misspeaking.'
11477: '@r......He had said "Are you alright", to her?@k@r...Was he really unable to notice the pain in her heart?'
11478: '@r............This was why he was, ultimately, mere furniture.@k@rThis was why he couldn''t become human...'
11479: 'Kanon@r@v16/20600408."..................I will be in the corridor.@k@v16/20600409. ...If you need anything, please call me immediately."'
11480: '@rKanon understood that she still needed some time to cry alone.'
11481: '@rHe told her to call him at any time, bowed, and made to leave the room.'
11482: 'Jessica@r@v04/20200556."......ah, ..............."'
11483: 'Kanon@r@v16/20600410."......Is there something?"'
11484: '@rJessica had spoken as though she wanted him to stop, so Kanon had stopped.'
11485: '@r.........If she asks it, I''ll do anything to help her.'
11486: '@r...If it could heal the pain in her heart, right now, I would even become a cane or a chair.'
11487: '@r.........If by doing that, ......I can repair the pain in her heart I gave her that day...'
11488: 'Jessica@r@v04/20200557.".........................................."'
11489: '@r...For a while, Jessica stared into Kanon''s eyes.@k@r......As though, despite stopping him, she had nothing to say.'
11490: 'Kanon@r@v16/20600411."................................."'
11491: 'Jessica@r@v04/20200558."..........................."'
11492: '@rFor a while, neither spoke.@k ............Jessica broke that silence.@k ...With a small voice.'
11493: 'Jessica@r@v04/20200559.".........Sorry.@k@v04/20200560. .........It''s nothing.@k@v04/20200561. ...............Could you tell Auntie Rosa that I want to be alone for a while...?"'
11494: 'Kanon@r@v16/20600412."I won''t...let you be alone."'
11495: 'Jessica@r@v04/20200562."........................huh..."'
11496: 'Kanon@r@v16/20600413."I won''t let you...be alone.@k@|@y@v16/20600414. ..................So, I will be in the corridor.@k@v16/20600415. ...At any time,@v16/20600416. ......call me."'
11497: '@rFor just an instant, it looked like some kind of hope flew to Jessica''s eyes.'
11498: '@r...But it was very faint, ...and disappeared like the first snow does on the surface of a river.'
11499: 'Jessica@r@v04/20200563."......Thanks.@k@v04/20200564. ..................For just a while, let me cry alone..."'
11500: 'Kanon@r@v16/20600417."............Yes.@k@v16/20600418. ...............Excuse me."'
11501: '@rKanon bowed once again, and closed the door...'
11502: '@r.........He thought he had said something to give her some courage.@k@r............But for some reason, it felt like that had actually hurt her.'
11503: '@r...Why?@k .........He didn''t know.@k@r......Surely, that was because...@w583................he was furniture.'
11504: '@rSo even now, ...he couldn''t grasp human sadness.'
11505: '@rAs Kanon repeatedly questioned himself, he walked down the corridor.@k .........He felt like the window at the end was coolly calling to him.'
11506: 'Kanon@r@v16/20600419."..............................@k@v16/20600420. ......In the end, .........am I nothing more than furniture after all......?"'
11507: '@rIt was still pouring outside—a dark, gray world.'
11508: '@r...Even on days like this, Shannon would surely look at the ocean and know it was blue.'
11509: '@r......But to my eyes, even if it cleared up, I would only see gray...'
11510: '@rAs long as I cannot tell the blueness of the ocean,@w500. ......I am nothing but furniture imitating a person.........'
11511: 'BEATRICE@r@v27/20700761.".....................You really don''t understand a woman''s heart.@k@|@y@v27/20700762. ...In times like that, you should silently remain by her side.@k@v27/20700763. ...*cackle*cackle*, that''s why you''re furniture."'
11512: 'Kanon@r@v16/20600421."Y-............you—"'
11513: '@rThere shouldn''t have been a trace of anyone in this corridor.@k@rIt had been empty and cold.@k@r.........But those scoffing words approached Kanon from behind.'
11514: '@rWhen he turned around, ......he saw that witch.@k@rThat witch, who hadn''t shown herself when Jessica had searched for her with a rage bordering on madness—who had left that sneering letter to toy with her...!'
11515: 'BEATRICE@r@v27/20700764."There are three ways to hurt a woman.@k@v27/20700765. ...Let me teach them, just for you.@k@v27/20700766. One is to hurt them with a knife.@k@v27/20700767. Another is to hurt them in their heart."'
11516: 'BEATRICE@r@v27/20700768."...And the last one is the most difficult, and the most effective way of hurting them.@k@v27/20700769. And yet it can hurt them without you even realizing it.@k@v27/20700770. Do you know what it is...?"'
11517: 'Kanon@r@v16/20600422."How, ......how could I know, I don''t even want to know!!"'
11518: 'BEATRICE@r@v27/20700771."It is to betray their hopes.@k@|@y@v27/20700772. ......No living being is more of a dreamer than a woman!@k @v27/20700773.They dream by themselves, and hurt by themselves.@k@v27/20700774. ......A distant man like you hurts women the most!@k @v27/20700775.You couldn''t understand.@k@v27/20700776. You don''t have a clue how much you have injured Jessica."'
11519: 'BEATRICE@r@v27/20700777."......Because you''re furniture!@k @v27/20700778.*cackle*cackle*cackle*cackle*cackle*!"'
11520: 'Kanon@r@v16/20600423."I, I have no intention of going along with your nonsense!@k @v16/20600424.......Did you appear only to sneer at me?!!"'
11521: 'BEATRICE@r@v27/20700779."Don''t be so full of yourself, furniture.@k@v27/20700780. You aren''t worth sneering at!"'
11522: 'BEATRICE@r@v27/20700781."*cackle*cackle*!@k @v27/20700782.Still, even though you may not be worth it alone, if the two of you are gathered, that''s more than enough.@k@v27/20700783. ......I never get tired of the pleasure that comes from laughing at the fate of a young couple."'
11523: 'Kanon@r@v16/20600425."What did you say...@k@v16/20600426. .........Y-@v16/20600427....you aren''t thinking...@v16/20600428. ......Not Milady......"'
11524: 'BEATRICE@r@v27/20700784."I need "two who are close" as sacrifices for the second twilight.@k@v27/20700785. ...The two of you truly are convenient...!!"'
11525: 'Kanon@r@v16/20600429."W-......wait...!@k @v16/20600430.Don''t misunderstand......!@k @v16/20600431.Milady and I...@v16/20600432....don''t have that kind of relationship...!@k @v16/20600433.We can''t become the sacrifices for the second twilight!"'
11526: 'BEATRICE@r@v27/20700786."*cackle*cackle*cackle*cackle*hahahahahahahahahahahahahahahaha!!@k @v27/20700787.That''s why you hurt Jessica.@k@v27/20700788. That''s why you cannot become human...!!"'
11527: 'BEATRICE@r@v27/20700789."Very well, then, if you won''t admit that you have feelings for Jessica, I can accept that.@k@|@y@v27/20700790. ......But I''ll kill Jessica!!"'
11528: 'Kanon@r@v16/20600434."Why?!"'
11529: 'BEATRICE@r@v27/20700791."You idiot!!@k @v27/20700792.Isn''t it obvious?!!"'
11530: 'BEATRICE@r@v27/20700793."It''ll be fun to kill her and see the pained look on your face, why else?!!"'
11531: 'BEATRICE@r@v27/20700794."Following the rules of the ritual, I will arbitrarily select thirteen people as sacrifices.@k@v27/20700795. However, there''s no rule saying that I can''t kill any more."'
