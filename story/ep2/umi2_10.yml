11538: '@r...The person he wanted to protect was there, and asking for help.@k .........So, in that moment, he genuinely felt that he wanted to be the person who was there with her.'
11539: '@rWhen he flew into Jessica''s room, his eyes latched on to a bizarre scene.'
11540: '@rThe room was a fantastical world, where a blizzard of golden powder danced, almost as though gold leaf had been scattered inside a snow globe.'
11541: '@r.........No, that''s not it.@k@rI''ve seen this spectacle before.@k@rThis isn''t gold leaf.'
