11585: 'BEATRICE@r@v27/20700808."Don''t get it wrong again... Understand?@k @v27/20700809.......Don''t forget that you''re furniture...@k @v27/20700810.If you continue acting like a human even now, this won''t be settled by your death alone.@k@v27/20700811. Kukikikikikikikikikikikikiki!"'
