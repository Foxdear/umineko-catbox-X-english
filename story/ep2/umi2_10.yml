11605: 'Kanon@r@v16/20600453."If you throw a rock at the surface of the water, you might be able to disturb the moon for some time.@k@v16/20600454. ...But that doesn''t mean the moon has been smashed.@k@|@y@v16/20600455. So."'
11606: 'Kanon@r@v16/20600456."......Until this life of mine is over,@v16/20600457. ......I''ll keep on striking your reflection......!"'
