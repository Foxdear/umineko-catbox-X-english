11533: '@rAt that time, Kanon definitely heard Jessica''s scream.'
11534: '@rThe instant he blinked and looked down the corridor, the witch, who had been there making a perfectly ordinary face until a second ago, had disappeared.'
11535: '@r...Right now, it was just him, standing alone in the corridor.'
