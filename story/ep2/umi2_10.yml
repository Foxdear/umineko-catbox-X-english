11643: 'Jessica@r@v04/20200599.".........Self-sacrifice is part of the noble spirit that only humans have!!@k @v04/20200600.So Kanon-kun is human!!@k @v04/20200601.So take it back!@k @v04/20200602.Don''t ever call Kanon-kun furniture again!!"'
