11581: '@r......She faced him with a provocative gaze filled with expectation, as though asking him how he planned to protect this maiden!'
11582: '@rThe attendant had looked especially like a beast when it had been crawling up, but in its composure,@k you could see that it had more than enough dignity to be worthy of serving the Golden Witch.'
11583: '@r......And you could tell that it was overflowing with the joy of furniture wanting to meet its master''s expectations.'
