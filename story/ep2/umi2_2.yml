8323: 'Jessica@r@v04/20200079."Eeeeeeeeeh?!@k @v04/20200080.What do you mean "separate rooms"?!@k @v04/20200081.Then, Shannon, you and George nii-san stayed in different rooms on purpose?!"'
8324: 'Shannon@r@v15/20500258."Ye-......yes...@k@v15/20500259. umm, ......was it that strange a thing to do......?"'
8325: '@rSince Jessica''s cheeks had been stuffed with chocolate-coated chinsukou biscuit that Shannon had brought as a souvenir from Okinawa,@k it all flew out at Shannon when Jessica cried out...'
8326: 'Jessica@r@v04/20200082."...Sha-Shannon, why did you even go on a trip up to Okinawa then...?@k@v04/20200083. And even alone with George nii-san!"'
8327: 'Shannon@r@v15/20500260."That''s because... I mean... Since there''s a very big aquarium in Okinawa, I was invited to go and...@k@v15/20500261.I...like fish and stuff..."'
8328: 'Jessica@r@v04/20200084."No, I mean, like...!!@k @v04/20200085.This is a young couple going on an overnight trip, right?!@k @v04/20200086.And you''re saying there weren''t even any hugs and kisses?!@k @v04/20200087.To say nothing of the fact that the guy and girl were staying in different rooms!!"'
8329: 'Shannon@r@v15/20500262."As for ki-kisses, no comment.@k@v15/20500263. ...ah, but we did hug, though...?@k @v15/20500264.George-san''s chest was warm..."'
8330: 'Jessica@r@v04/20200088."That''s not the point!!@k @v04/20200089.Aah, geez!@k @v04/20200090.Why do couples like this exist?!@k @v04/20200091.Aaah, geez!!@k @v04/20200092.It''s so damn irritating!"'
8331: '@rFrom Shannon''s perspective, a lot of things had happened and it seemed to have been a very happy trip,@k but it looked like the missed opportunity had left Jessica feeling greatly unfulfilled.'
8332: '@rFor a while, Jessica chewed on her souvenir,@k writhing on her bed as she complained about their romance.'
8333: '@rShannon and George had chosen to go to Okinawa because there was a huge aquarium there.'
8334: '@rThat was because their first meeting had revolved around an aquarium.'
8335: '@rSince they had started at an aquarium, having their first overnight trip also be to an aquarium must have held some commemorative value.'
8336: 'Jessica@r@v04/20200093."This was your special commemorative trip, your turning point!@k @v04/20200094.Your first overnight trip!!@k @v04/20200095.Shouldn''t there have been all kinds of progress?!"'
8337: 'Jessica@r@v04/20200096."And yet!@k @v04/20200097.Separate rooms for the guy and girl?!@k @v04/20200098.A couple taking two single rooms?!@k @|@y@v04/20200099.Aah, geez, really, what''s wrong with you?!"'
8338: 'Shannon@r@v15/20500265."...Err, umm, ......but we''re both single...@k@v15/20500266. ...George-san says that respecting boundaries is good manners between men and women......."'
8339: 'Jessica@r@v04/20200100."For hell''s sake, this overnight trip was so you could overcome that, wasn''t it?!@k @v04/20200101.You''re not at the stage of mere hugs and kisses any more!"'
8340: 'Shannon@r@v15/20500267."Mi-Milady, I don''t know what you mean by that, but...@k@v15/20500268. Geor-...George-sama was a real gentleman with me until the end."'
8341: 'Shannon@r@v15/20500269."That is, I mean,@v15/20500270. ......I also...@v15/20500271.wondered if those things would happen, you know,@v15/20500272. ...but we, we may be going out, but...@v15/20500273.I mean, it, it''s not as if we are married or anything..."'
8342: 'Shannon@r@v15/20500274."The kind of things you seem to be expecting, Milady,@v15/20500275. ......I mean, we must do so only after we properly make a vow in front of God, and, umm,@v15/20500276. ......ww...we mustn''t...@v15/20500277. au."'
8343: '@rShannon''s face was bright red.@k@rShe was restlessly fidgeting, making a circle with both hands, then a chain link, continually intertwining, separating and making heart shapes with them.'
8344: '@rApparently, the dramatic progress Jessica had looked forward to hadn''t happened,@k but it seemed that it had been a very important experience for Shannon in her own way.'
8345: '@r...So in the end, no matter how much Jessica envied Shannon or made fun of her, it didn''t change the fact that Shannon had a huge lead on her.'
8346: 'Jessica@r@v04/20200102."Aah, I want a boyfriend toooo!!@|@y@k @v04/20200103.I can''t believe you beat me to it!!@|@y@k @v04/20200104.We promised we''d get boyfriends at the same time but you snuck ahead and beat meeee,@v04/20200105. aarrrrrrgh!"@|@y'
8347: 'Shannon@r@v15/20500278."U-umm...@k@v15/20500279. Milady, you are a wonderful person, so I''m sure you''ll find someone even more wonderful than I did, before long..."'
8348: 'Jessica@r@v04/20200106."Don''t try to console me!!@k @v04/20200107.Shannon, you traitor, get outta here, you suuuuck!!@k @|@y@v04/20200108.*cough*cough*, *cough*cough*cough*!!"'
8349: '@rJessica threw several cushions at her.@k@rBut midway, she had an asthma attack and started to cough pretty badly.'
8350: '@rShannon hurriedly ran over to her and took a look on top of the nearby side table.'
8351: '@rAn adorable basket was placed there, and inside of it was Jessica''s inhaler.'
8352: '@rShannon picked it up and handed it over to Jessica.'
8353: '@rJessica''s asthma attacks always came suddenly.@k Because of this, she had to carry this medicine around with her at all times.'
8354: '@rShe breathed in the medicine, and after some time spent holding back her coughing, her asthma finally settled down.'
8355: '@rShannon thought this a good chance to leave, bowed courteously, and made to exit the room...'
8356: '@rAs she did, one more small cushion came flying and hit Shannon on the head.'
8357: '@rShe looked around, and saw that Jessica was on the verge of crying, half of her face buried in her last and favorite cushion.@k That face was red and meek...'
8358: 'Shannon@r@v15/20500280."......Mi-Milady......?"'
8359: 'Jessica@r@v04/20200109."Sha-......Shannon...@k@v04/20200110. ...Be honest with me...@k@v04/20200111. .........Is my...@k@v04/20200112..........hairdo and stuff...strange...?"'
8360: 'Shannon@r@v15/20500281."What are you saying...@k@v15/20500282. I think that your hair is very beautiful."'
8361: 'Jessica@r@v04/20200113."Then, ...then then, are my eyes strange, or maybe my nose?@k@v04/20200114. ...Or is it the way I talk after all......?@k@v04/20200115. Is that why I can''t get a boyfriend......?"'
8362: 'Shannon@r@v15/20500283."Of course not.@k@v15/20500284. Milady, you are wonderful enough as you are.@k@v15/20500285. And I think that your charm will keep on increasing more and more."'
8363: 'Jessica@r@v04/20200116."......But, it''s only me who can''t get a boyfriend...@k@v04/20200117. Saku and Hina managed to find one, but I can''t, I''m the only one......@k@v04/20200118. Is it because I don''t have any charm after all......?@k@v04/20200119. You know, everyone''s gonna be bringing their boyfriend along to the cultural festival......"'
8364: 'Jessica@r@v04/20200120."I was so sure I''d have a boyfriend by then, I''ve been grandstanding about it...@k@v04/20200121. .........But I can''t get a boyfriend to save my life.@k@v04/20200122. I''m the only one, the only one......."'
8365: '@rBefore she realized it, Jessica was shedding huge tears.'
8366: '@rJessica hadn''t really planned on crying, and of course, she felt like supporting Shannon''s progress in love as a friend.'
8367: '@r...However, as she had made fun of Shannon, her true feelings had suddenly gotten mixed in, and the tears had just poured out on their own...'
8368: '@r...Shannon understood Jessica''s innocent and easily injured heart.'
8369: '@rJessica''s usual rough style of speech...@kwas all just an attempt to protect her own easily injured heart.'
8370: '@r......As a daughter and successor to the Ushiromiya family, and as a girl isolated on Rokkenjima, the only person she could expose her true feelings to was Shannon.'
8371: '@rShannon understood that.@k@rSo, ...she strongly regretted feeling a little too self-satisfied.'
8372: 'Jessica@r@v04/20200123."...S-.........sorry...@k@v04/20200124. Crying like this, I''m weird.@k@v04/20200125. Sorry......*sniffle*."'
8373: 'Shannon@r@v15/20500286."You are a wonderful person, Milady.@k@v15/20500287. There is no way that a nice man won''t appear for you..."'
8374: 'Jessica@r@v04/20200126.".........Sha-Shannon, it''s about time for you, right?@k @v04/20200127.If you don''t go soon, Genji-san and Mom are gonna yell at you.@k@v04/20200128. I''m totally fine, so get going...!@k @v04/20200129.Heheh, sorry for crying like this.@k@v04/20200130. ......I''m such a moron."'
8375: '@rJessica faced away as if to show she wasn''t looking for attention,@k and waved her hand as though to drive Shannon away.'
8376: '@rShannon took that as a sign that she didn''t want to be badgered any more,@k bowed her head, and left the room...'
8377: '@rWhen her footsteps disappeared into the distance, Jessica lay down on her bed, still hugging the cushion.'
8378: '@r...Her expression was still a little meek, with tears in her eyes,@k ...but for the first time in a long time, she had a very, very quiet and honest conversation with her heart.'
8379: 'Jessica@r@v04/20200131."I also...@v04/20200132..........want to fall...@v04/20200133.in love..."'
8380: '@rAs Shannon watered the flower beds in the garden in high spirits, she sensed someone''s presence.'
8381: '@rShe turned around, thinking that if one of the family had come to visit, she must greet them,@k ......and what she saw was that witch.'
8382: 'Shannon@r@v15/20500288."B-......BEATRICE-sama........."'
8383: 'BEATRICE@r@v27/20700175."It''s been quite some time.@k@v27/20700176. How are you?@k @v27/20700177.Has your relationship with your special person progressed since last time?"'
8384: '@rAs BEATRICE sat on the rose arch, she happily blew on her pipe.'
8385: '@rSitting in a place like that would crush the roses,@k and it might have been dangerous if you fell off the arch, ...but after all, this was a witch.'
8386: '@rThat was surely an unnecessary concern.'
8387: 'Shannon@r@v15/20500289."...Ye-yes.@k@v15/20500290. Thanks to you, ...it''s going smoothly."'
8388: 'BEATRICE@r@v27/20700178."Naturally; my magic is instantaneous.@k@v27/20700179. ...You may even be feeling as if your meeting was a predetermined fate.@k@v27/20700180. But that isn''t correct; don''t think for a moment this has anything to do with fate."'
8389: 'Shannon@r@v15/20500291."......I, ......I understand that."'
8390: '@rThe witch was calling attention to something.@k Two things, actually.'
8391: '@rThat originally, her relationship with George had been completely impossible.@k@r......And that her magic power was so great, it could manipulate that fate.'
8392: '@rShannon had become swept up in these sweet days, and had started to fall under the illusion that all fate was revolving around her.'
8393: '@r...But the witch''s words made her remember.'
8394: '@rHer relationship with George had originally been impossible,@k .........no, might also be impossible in the future as well...'
8395: 'BEATRICE@r@v27/20700181."...*cackle*cackle*, sorry, sorry.@k@|@y@v27/20700182. It''s just like a doctor.@k@v27/20700183. Even though you rely on them when you worry about your health, after you''re healed, you forget even to thank them.@k@v27/20700184. ......Witches have never known thanks, so I couldn''t help acting a little rudely.@k@v27/20700185. Forgive me."'
8396: 'Shannon@r@v15/20500292.".........I have never forgotten my feelings of gratitude.@k@v15/20500293. ...I was able to achieve happiness thanks to your power, BEATRICE-sama.@k@v15/20500294. ......And without that power, George-sama and I would have had no fate together.@k@v15/20500295. ...I have never forgotten that."'
8397: 'BEATRICE@r@v27/20700186."Sorry, sorry.@k@v27/20700187. This was not my intent; I didn''t come here to bully you.@k@v27/20700188. Talking rudely is just my personality.@k@v27/20700189. Do forgive me."'
8398: 'BEATRICE@r@v27/20700190."...More importantly, I heard it through the grapevine...!@k @v27/20700191.You two went on a little private trip.@k@v27/20700192. I''m sure it was quite fun."'
8399: 'Shannon@r@v15/20500296."Y-yes!@k @v15/20500297.It was very, umm, ...fun."'
8400: '@rShannon''s face suddenly grew bright.@k@rThe witch laughed lightly, as though that transformation was worth money.'
8401: 'BEATRICE@r@v27/20700193."Already the person of your thoughts is no longer an object of one-sided love.@k@v27/20700194. You are a pair of lovers now.@k@v27/20700195. ......To a pair filled with love, that alone is all they need in the world.@k@v27/20700196. A wonderful, ideal world, so to speak?@k@v27/20700197. Huhuhuhuhu!@k @v27/20700198.Even witches would be jealous."'
8402: '@rBEATRICE laughed pleasantly.@k@rThat smile was without a trace of malice, making her look as though she blessed the lovers'' secret meeting from the bottom of her heart.'
8403: '@rAfter that day, BEATRICE had shown herself before Shannon every once in a while.'
8404: '@rEven now, Shannon still thought of her as a creepy being.'
8405: '@r...However, she was also hugely indebted to this person for bestowing the magic that had given her the relationship she had with George.'
8406: '@rSo Shannon was trying with all her might not to be surprised or scared.'
8407: 'Shannon@r@v15/20500298."Oh, ...oh, yes.@k@|@y@v15/20500299. ......Umm, BEATRICE-sama.@k@v15/20500300. I bought some confectionery as a souvenir from our trip.@k@v15/20500301. ...Would you, umm, ......like some?"'
8408: 'BEATRICE@r@v27/20700199."Hoh???@k @v27/20700200.A souvenir for a witch.........?"'
8409: '@rIt seemed that even the witch who boasted of living for one thousand years hadn''t been able to predict that she would receive a souvenir from a pair of sweet lovers.'
8410: '@rWhen she saw that surprised expression, Shannon thought of the witch as a friend for the first time.'
8411: 'BEATRICE@r@v27/20700201."Hohoh, Oriental cookies made from wheat flour and lard.@k@v27/20700202. To wrap that in chocolate in the Western fashion is truly a blending of Japanese and Western style—the Silk Road of confectionery."'
8412: 'BEATRICE@r@v27/20700203.".........What?@k@v27/20700204. What''s so funny?"'
8413: 'Shannon@r@v15/20500302."N-...nothing.@k@v15/20500303. My apologies."'
8414: '@rThis mysterious witch, who surely held a terrifying power,@k was chomping down on the treats one after another, making a sound like a squirrel stuffing walnuts into its mouth.@k After a while, Shannon couldn''t conceal her laughter.'
8415: 'BEATRICE@r@v27/20700205."Hmm, a fine treat.@k@v27/20700206. ......I should serve you some Dolce Vita from Nero one of these days.@k@v27/20700207. Roses are the symbol of eternal love.@k@v27/20700208. I believe a rose dolce would be appropriate for you now."'
8416: '@rThe witch was in a great mood, having enjoyed the modern treats to the full.'
8417: 'Shannon@r@v15/20500304."Umm, .........here.@k@v15/20500305. I truly can''t thank you enough.@k@v15/20500306. I believe you have done more than enough for me already, so I''m returning this."'
8418: '@rThe thing that Shannon had softly set on the table was a gold-colored butterfly brooch.'
8419: 'BEATRICE@r@v27/20700209."There is no need to return it.@k@v27/20700210. If you continue holding that, your relationship should remain firm in perpetuity."'
8420: 'Shannon@r@v15/20500307."......I may have been given the chance to meet him through the power of magic.@k@v15/20500308. But I think the effort that will make that encounter eternal should come from the two of us cooperating together."'
8421: 'BEATRICE@r@v27/20700211."Hmm.@k@v27/20700212. ......So love, too, is like a rose.@k@v27/20700213. Too much fertilizer causes the roots to rot.@k@v27/20700214. Some flowers cannot be raised without hard work.@k@v27/20700215. In that case, do as you wish.@k@v27/20700216. You may keep it in a box, rather than on your person.@k@v27/20700217. That is my goodwill, given to you.@k@v27/20700218. It would not please me to have it returned."'
8422: 'Shannon@r@v15/20500309."Ah, ......my, my apologies...!@k @v15/20500310.That''s not what I..."'
8423: 'BEATRICE@r@v27/20700219."*cackle*cackle*.@k@v27/20700220. No harm has been done.@k@v27/20700221. That brooch is already yours.@k@v27/20700222. If you treasure that as proof of our friendship, that would comfort me a little."'
8424: 'BEATRICE@r@v27/20700223."You may hold on to it, and gain its benefits.@k@v27/20700224. You may also keep it in a box.@k@v27/20700225. If you wish, you are even free to give it to another who is worrying about love.@k@v27/20700226. ......But you should regard it as important.@k@v27/20700227. It would certainly pain my heart if you did not take care of it."'
8425: '@rAccording to BEATRICE, she had appeared several times in the past in response to a person''s summons so that she could give them an item imbued with some kind of magical power.'
8426: '@r...However, most of them, after they used that power to resolve their worries,@k would quickly come to think of that power as creepy, and, forgetting their feelings of thanks, they would throw away the items they had been given with disgust.'
8427: 'BEATRICE@r@v27/20700228."Which is why I haven''t often received thanks for my good will.@k@v27/20700229. ......Let''s see, is this the first time?@k@v27/20700230. *cackle*cackle*cackle*cackle*."'
8428: '@rThe witch laughed heartily, but it looked like a sad laugh to Shannon''s eyes.'
8429: '@rShe herself had been like that in the past—no, maybe she was still like that now.'
8430: '@rBEATRICE was definitely a witch, with a strange and terrifying power.'
8431: '@rMost likely, no one would go along with her if they could help it.'
8432: '@rAnd even though on occasion they had relied on her strange power, it had undoubtedly resulted in fear more often than gratitude.'
8433: '@r.........It must have deeply hurt the witch when that repeated over and over.'
8434: '@rFrom the moment that she realized this,@k ...Shannon decided to stop being frightened of BEATRICE.'
8435: '@rThat had surely tormented her for over a thousand years...'
8436: '@rMaybe she really liked the treats.@k BEATRICE, who normally spoke abusively, praised the black tea that Shannon served her, and looked to be in remarkably high spirits.'
8437: '@rOn such terms, the witch and the servant grew animated talking about the trip with George.'
8438: '@rShannon didn''t know much about BEATRICE.'
8439: '@rFirst off, she was a ghost-like being who appeared in unexpected places at unexpected times.@k@rAnd it seemed that not everyone could perceive that she was there.'
8440: '@rIt seemed that each person had something called a wavelength, and that there was a great amount of individual variation in people''s ability to perceive the witch.'
8441: '@rOnly Shannon and Kanon could interact with her enough to exchange words like this.'
8442: '@r...There were a few people who could sense her presence, but most people couldn''t even feel that much.'
8443: '@rFrom what BEATRICE said, Krauss and his wife in particular had zero magical talent.@k And no matter how much she followed them around, they would never notice her.'
8444: '@rPreviously, when Shannon had messed up and Natsuhi had gotten really mad at her, BEATRICE had started playing around, hitting Natsuhi on the head with her pipe.'
8445: '@r...Indeed, Natsuhi seems completely oblivious.@k@rBut Shannon, watching that, had burst out laughing without thinking, and had gotten scolded even more.'
8446: 'Shannon@r@v15/20500311."Then, ......what about the Master?@k@v15/20500312. I hear that he has been doing research in magic, so I''m sure he would be able to notice you, BEATRICE-sama."'
8447: 'BEATRICE@r@v27/20700231."............Kinzo is the same.@k@v27/20700232. There is no one with a more pitiful lack of magical talent.@k@v27/20700233. ...It''s the blood.@k@v27/20700234. He has so little talent, he is worthy of sympathy."'
8448: 'Shannon@r@v15/20500313."..................?"'
8449: '@rAs soon as they started talking about Kinzo, it felt like the atmosphere around BEATRICE changed.'
8450: '@rShe had spoken about Krauss and the rest''s lack of magic talent as though she looked down on them, but she spoke of Kinzo in a different way.'
8451: '@rAnyone connected to the Ushiromiya family would know about Kinzo''s Legend of the Gold.@k@r...According to the legend, Kinzo had summoned the witch BEATRICE, and had been conferred gold.'
8452: '@r...In short, that implied she had some kind of relationship with Kinzo.'
8453: 'BEATRICE@r@v27/20700235."So, you see, ......he attained that level despite not having a single scrap of talent.@k@v27/20700236. ...It was through frenzied solitary study that he reached the tier of mage."'
8454: 'Shannon@r@v15/20500314."That''s.........something really incredible, right......?"'
8455: 'BEATRICE@r@v27/20700237."......Mmhm."'
8456: '@rThe witch, who usually looked down on people, was unexpectedly praising someone.'
8457: '@r...While she lambasted Kinzo, calling him talentless, she praised his efforts.'
8458: 'Shannon@r@v15/20500315."And then, .........the Master summoned you with the power of magic......"'
8459: 'BEATRICE@r@v27/20700238."Mmhm.@k@v27/20700239. ......Well, I only answered the summons on a whim.@k@v27/20700240. In this period where magic has long been denied, there I saw a being, without a scrap of talent, giving it his all.@k@v27/20700241. It was just my luck that I''d decide to come and laugh at him.@k@v27/20700242. *cackle*cackle*cackle*."'
8460: '@rThe words "just my luck"...showed that this had been a disaster for her.'
8461: '@rShannon hesitated over whether it would be alright to encourage her to continue, but BEATRICE continued on her own, ignoring Shannon.'
8462: 'BEATRICE@r@v27/20700243."The format and rules were all there, at least.@k@v27/20700244. He''d mixed up a few of the procedures, but, well, in deference to his enthusiasm, I generously responded to his contract.@k@v27/20700245. ......And I gave him a mountain of gold."'
8463: 'Shannon@r@v15/20500316."Then the Master...used that gold and succeeded in business, and grew his wealth into what it is today."'
8464: 'BEATRICE@r@v27/20700246."Mm. His talent in magic was nothing, but it seems he had talent in business and gambling.@k@v27/20700247. ...Or was it because of his bravery and madness to stake everything on irrational bets?@k@v27/20700248. ......Madness sometimes brings about magic.@k@v27/20700249. Yes, if I look at it that way, maybe I can''t really say that Kinzo had absolutely no magical talent.@k@v27/20700250. *cackle*cackle*..."'
8465: '@rShannon felt like she was daydreaming.'
8466: '@rWhile everyone in the Ushiromiya family knew of the story that Kinzo had delved into sorcery, summoned a witch, and been given gold, in actuality, it was all rambling that no one believed in.'
8467: '@rAnd now the witch herself was telling her that it was true...@k@rShannon felt a little flustered at this insane secret that only she knew.'
8468: 'BEATRICE@r@v27/20700251."Then Kinzo, who had obtained a vast fortune, satisfied his every dream that could be granted in the human world.@k@v27/20700252. .........And finally, he sought the truth of the world."'
8469: 'Shannon@r@v15/20500317."The truth...of the world?"'
8470: 'BEATRICE@r@v27/20700253."...The single element that makes up the world.@k@v27/20700254. Kinzo, who had achieved everything one can obtain in the human world, wanted that, the final desire humans seek."'
8471: '@rThe single element.@k .........She felt like she had heard the witch say those words before.'
8472: '@rWhen BEATRICE saw Shannon trying to remember what that was, she smiled awkwardly, waving her hand and saying there was no need to remember.'
8473: 'BEATRICE@r@v27/20700255."......I underestimated Kinzo a trifle.@k@v27/20700256. I truly hadn''t thought that he would display such power."'
8474: 'BEATRICE@r@v27/20700257."......And thanks to that, I''m in this state.@k@v27/20700258. I''ve been sewn in place on this island for several decades now, without even a friend to drink tea with.@k@v27/20700259. ...My voice reaches none I call out to, and I cannot go anywhere.@k@v27/20700260. Such boring decades."'
8475: '@rAs she laughed in self-derision, she tapped her teacup with her finger.@k It made the clear sound of porcelain.'
8476: '@r...Shannon didn''t know whether the word "self-derision" was really an accurate expression to describe the look on the witch''s face.'
8477: '@rShannon didn''t understand everything, but she could more or less figure out the situation.@k@r...And it was surely a topic that she should not press the witch on lightly, unless the witch started talking about it herself.'
8478: '@rTo sum up everything she had said up until now...'
8479: '@rBEATRICE, who had been summoned by Kinzo''s magic, could not leave this island for some reason.@k And she had lost her power and her form, living her days in boredom.'
8480: '@rDuring that time, her words had reached Shannon, who never forgot to strongly respect the witch.@k And she had made Shannon help her to regain her power, even if only a little bit of it.'
8481: '@r...As a result, she had become able to drink tea with Shannon like this...'
8482: 'Shannon@r@v15/20500318."......BEATRICE-sama, what in the world was that mirror you told me to break?"'
8483: 'BEATRICE@r@v27/20700261."Aaah, that topic.@k@|@y@v27/20700262. .........It seems that a lot of things happened on the islands around this area, in the distant past.@k@v27/20700263. Bad things gathered due to that, attracting bad distortions.@k@v27/20700264. It seems that a traveling Eastern mage or someone built a shrine for the repose of souls and sealed them in there."'
8484: 'BEATRICE@r@v27/20700265."...That in itself had nothing to do with me, but unfortunately the foundation of that magical power was different.@k@v27/20700266. It created a strong interference with my own magic, and was extremely bothersome."'
8485: 'Shannon@r@v15/20500319."Is that how it was...?@k@v15/20500320. I just assumed that it had been sealing you, BEATRICE-sama..."'
8486: 'BEATRICE@r@v27/20700267."I was not its target.@k@v27/20700268. But it was a divine mirror.@k@v27/20700269. As a result, my power was sealed away."'
8487: 'BEATRICE@r@v27/20700270."......If I were to use food as an example, maybe it would go something like this.@k@v27/20700271. Let''s say that I have ordered some Western cuisine, which is being made in the kitchen.@k@v27/20700272. However, when it comes time for it to be served, the seating is in the Japanese style, and Japanese tableware has been laid out."'
8488: 'BEATRICE@r@v27/20700273."So the kitchen is unable to take out the plate which would be out of place, and no matter how long I wait, my Western food won''t arrive—something like that."'
8489: 'BEATRICE@r@v27/20700274."So I had you destroy that Japanese-style seating, and return the area to a blank slate for a time.@k@v27/20700275. Thanks to that, the meal I had ordered was finally delivered, and my power came back, you could say.@k@v27/20700276. However, so far, only the aperitif has arrived."'
8490: 'BEATRICE@r@v27/20700277."It will still be quite some time before the main dish.@k@v27/20700278. As I am now, I''m even more faint than a fairy in a shoe store."'
8491: 'Shannon@r@v15/20500321.".........pf...@v15/20500322....ahahahahahahaha."'
8492: 'BEATRICE@r@v27/20700279."Mh.@k@v27/20700280. What''s so funny?"'
8493: 'Shannon@r@v15/20500323."Nothing...@k@v15/20500324. I was just thinking witches'' analogies are so interesting.@k@v15/20500325. I never thought you could use food as an analogy to talk about magic."'
8494: 'BEATRICE@r@v27/20700281."I had thought it to be a skillful description, if I do say so myself, and I certainly did not imagine it would be laughed at.@k@v27/20700282. I feel a little offended."'
8495: '@rA slightly sulky expression rose to the witch''s face.@k@r...It would not have been a strange expression at all to see appear on the face of two friends as they enjoyed their tea.'
8496: 'BEATRICE@r@v27/20700283."......Although I may not look it, I was known for doing extremely brutal things in the past.@k@v27/20700284. ...I''ve gotten soft.@k@v27/20700285. Now I can even have a foolish discussion while drinking tea with a human."'
8497: '@rShe was probably talking to herself.@k@rAs BEATRICE gazed at the sea birds tracing the horizon, she put her tea to her lips again.'
8498: 'BEATRICE@r@v27/20700286."...The clouds have come out.@k@v27/20700287. When the ocean loses its brilliance, it''s nothing more than a gray puddle."'
8499: 'Shannon@r@v15/20500326."You think so?@k@v15/20500327. ......I think the ocean is a beautiful deep blue, even if it gets cloudy."'
8500: 'BEATRICE@r@v27/20700288."............Hmph."'
8501: '@rMaybe the witch had noticed the deep meaning behind Shannon''s words.'
8502: '@r...She laughed lightly and set down her empty teacup.'
8503: 'BEATRICE@r@v27/20700289."......It seems that those things buried in your eyes aren''t black pebbles anymore.@k@v27/20700290. So?@k @v27/20700291.......Do you understand the feeling of furniture being reborn as a human?"'
8504: 'Shannon@r@v15/20500328."...............Yes.@k@|@y@v15/20500329. ...I didn''t know that the world was this kind."'
8505: '@rSince her relationship with George had begun, Shannon''s face had grown brighter more often.'
8506: '@rHer smile had made everything go smoothly, and had even changed her luck.'
8507: '@r......Shannon made fewer mistakes in her work than she had before, and the family members'' opinion of her was starting to change slightly.'
8508: '@rJust the other day, Krauss, who rarely exchanged words with her, had suddenly started talking to her, surprising her.'
8509: 'Krauss@r@v02/20800017."You''ve been making a good smile more often lately, haven''t you?@k@v02/20800018. Has something good happened?"'
8510: 'Shannon@r@v15/20500330."N-no...@k@v15/20500331. But......every day is fun, yes."'
8511: 'Krauss@r@v02/20800019."Hmph.@k@v02/20800020. Isn''t that good to hear.@k@v02/20800021. Coffee is obviously more delicious if it''s poured with a smile.@k@v02/20800022. ......Could I ask for another cup, with that smile again?"'
8512: 'Shannon@r@v15/20500332."Ye-......yes!"'
8513: '@rThat had become a chance for Shannon to gain confidence in herself.'
8514: '@rOf course, it didn''t go beyond her own heart, and it wasn''t so big a change that everyone could see it.'
8515: '@r...But she had begun to change, bit by bit.'
8516: '@rShannon understood it clearly.@k To know love was to gain a soul.@k ...And therefore, to be born again from furniture to a human.'
8517: '@rThere was absolutely nothing mistaken in BEATRICE''s words.@k@r......By knowing love, Shannon had learned what it was to be human.'
8518: 'BEATRICE@r@v27/20700292."......These have been unusual snacks.@k@v27/20700293. It was time well spent.@k@v27/20700294. It''s probably about time for you to return to your work.@k@v27/20700295. Let us end our tea party now."'
8519: 'BEATRICE@r@v27/20700296."......After all, it seems there are some who dislike your drinking tea with me, you see?"'
8520: 'Shannon@r@v15/20500333."Huh?"'
8521: '@rThe witch gripped a teaspoon and flipped it with her fingers, sending it up in the air.'
8522: '@r...Then, it was flicked by the fingers of some invisible person in empty space, and flew straight into a bush close nearby.'
8523: '@rThe bush moved violently, and Kanon came out.@k@r......It seemed that he had been there for some time, and had been watching their tea party.'
8524: '@rThe spoon was gripped in his hand.@k@r...If he had not been able to catch it by reflex, it might have hit him hard in the forehead and caused him to start oozing blood.'
8525: 'Kanon@r@v16/20600030."..........................."'
8526: 'BEATRICE@r@v27/20700297."Calm yourself.@k@v27/20700298. Our tea party is over now, Kanon."'
8527: 'Shannon@r@v15/20500334."How long were you there?@k @v15/20500335.If you had called to us, I''d have poured you some tea too..."'
8528: 'BEATRICE@r@v27/20700299."I imagine that you didn''t want to interrupt a pair of women talking, right?@k @v27/20700300.*cackle*cackle*!"'
8529: 'Kanon@r@v16/20600031.".................."'
8530: '@rKanon kept silent, but it seemed that there was a slightly hostile look in his eyes.'
8531: '@r...On the outside, he acted respectfully.@k But unlike Shannon, Kanon did not trust the witch.'
8532: '@rBEATRICE rapped the table with her pipe, and the tea set turned into gold butterflies, which flew upwards in unison.'
8533: '@rThey scattered in every direction, and the cleanup was already done.'
8534: 'BEATRICE@r@v27/20700301."It was fun, Shannon.@k@v27/20700302. ...Let us meet again if the chance arises.@k@v27/20700303. ......My magical power is still quite lacking.@k@v27/20700304. It''s tiring even to show myself."'
8535: 'Kanon@r@v16/20600032."......If it tires you that much, never appear again."'
8536: '@rKanon had said it in a small voice, but it seemed the witch had heard it perfectly.'
8537: '@rShe giggled, but did not reply.'
8538: 'BEATRICE@r@v27/20700305."Shannon.@k@v27/20700306. Tell me more about George at our next tea party.@k@v27/20700307. There are no snacks sweeter than a person''s love life.@k@v27/20700308. *cackle*cackle*cackle*.@k@|@y@v27/20700309. I bid you farewell."'
8539: '@rBEATRICE''s body also became gold butterflies, which scattered in all directions and disappeared.'
8540: '@r...It was a very fantastical and beautiful scene, like a blizzard of gold leaf.'
8541: '@rFor a while, Shannon quietly watched the witch''s exit...@k@rKanon approached her from behind, and spoke with a very different expression on his face than his sister''s.'
8542: 'Kanon@r@v16/20600033.".........Nee-san, didn''t I tell you that you shouldn''t hang around with her?"'
8543: 'Shannon@r@v15/20500336."BEATRICE-sama isn''t that bad of a person.@k@v15/20500337. ...Yes, she might be a little strange, but—"'
8544: 'Kanon@r@v16/20600034."The fact that only we can see her is suspicious enough...@k@v16/20600035. She isn''t human.@k@v16/20600036. Who knows what she''s planning."'
8545: 'Shannon@r@v15/20500338."Kanon-kun, I think that''s a little rude."'
8546: '@rShannon spoke seriously, which was unusual for her.@k@r...To Kanon, who knew her well, it must have seemed extremely serious.'
8547: '@rKanon showed almost excessive surprise at Shannon''s style of speech, and remained silent.'
8548: 'Shannon@r@v15/20500339."It''s true that BEATRICE-sama is different from humans.@k@v15/20500340. She has a terrifying power, so I think she is to be feared and respected.@k@v15/20500341. ...But I think it''s really rude to loathe her just for the single reason that she''s different from a human."'
8549: 'Kanon@r@v16/20600037."............I know what you''re trying to say, Nee-san.@k@v16/20600038. ...You''ve changed since she gave you that brooch.@k@|@y@v16/20600039. It''s like you''re the witch''s prisoner.@k@v16/20600040. She mediated your relationship with George-sama, and now you''re indebted to her."'
8550: 'Shannon@r@v15/20500342."...Don''t say things like that."'
8551: 'Kanon@r@v16/20600041."She isn''t human.@k@v16/20600042. We don''t know what she''s thinking.@k@v16/20600043. You mustn''t trust her.@k@|@y@v16/20600044. .........And we aren''t humans either,@k@v16/20600045. Nee-san."'
8552: '@rKanon''s words became more serious.@k ...Those words probably gouged at Shannon''s heart.@k Shannon bit her lower lip and hung her head.'
8553: 'Kanon@r@v16/20600046."We are furniture.@k@v16/20600047. ...Even if we receive names and are treated as humans, that won''t change how we were born."'
8554: '@rYou are no longer furniture...'
8555: '@rThose words BEATRICE had given her, which had made her happiest of all, floated through Shannon''s mind...'
8556: 'Shannon@r@v15/20500343."I am not...@v15/20500344.......furniture."'
8557: 'Kanon@r@v16/20600048."No, you are.@k@v16/20600049. We are less than human.@k@v16/20600050. ......Nee-san, you''re acting like you''ve forgotten that, ...and you''re just pretending to be human.@k@v16/20600051. You should understand that yourself."'
8558: 'Shannon@r@v15/20500345."I''m......not furniture.@k@v15/20500346. ...I''m human...!"'
8559: 'Kanon@r@v16/20600052."No, you aren''t human.@k@v16/20600053. From the beginning, we have been unqualified to love or be loved."'
8560: '@rIt seemed that Kanon''s criticisms had shifted focus from Shannon''s interactions with the witch.'
8561: '@r...Shannon also noticed that quickly.'
8562: 'Kanon@r@v16/20600054."I heard from Milady.@k@v16/20600055. Seriously, what were you thinking?@k@v16/20600056_b. I can''t believe that you would go on a trip with George-sama...!@k @v16/20600057.You''ve forgotten your place as furniture.@k@v16/20600058. You''ve just been tempted by that witch, and mistakenly believe that you became human!"'
8563: 'Shannon@r@v15/20500347."Listen, Kanon-kun.@k@v15/20500348. ............We certainly are furniture.@k@v15/20500349. Lesser beings, inferior to humans."'
8564: 'Shannon@r@v15/20500350."...But if we were to gain the missing remainder...@k@v15/20500351....wouldn''t that mean we''d have become human?"'
8565: 'Kanon@r@v16/20600059."......That couldn''t happen."'
8566: 'Shannon@r@v15/20500352."No, it could.@k@v15/20500353. If we can gain that, we won''t be furniture.@k@v15/20500354. We can become human."'
8567: 'Kanon@r@v16/20600060."..................@k@v16/20600061. .........Ridiculous.@k@v16/20600062. ...As if we......could."'
8568: '@rKanon spat that out, ...but weakly, and turned away.'
8569: '@rThat was probably...resignation.@k ......The baptism of days upon days of suffering being furniture had firmly sealed his heart...'
8570: 'Shannon@r@v15/20500355."...You can too, Kanon-kun.@k@v15/20500356. ......You can become a normal human."'
8571: 'Kanon@r@v16/20600063."...........................@k@v16/20600064. Stop it, that''s the witch talking."'
8572: 'Shannon@r@v15/20500357."That''s right.@k@v15/20500358. BEATRICE-sama taught me.@k@v15/20500359. ......By gaining the single element of the world, we can become human."'
8573: 'Shannon@r@v15/20500360."No—nobody''s human without that.@k@v15/20500361. ......That''s why people spend their entire lives trying to gain that single element."'
8574: 'Kanon@r@v16/20600065."I have no idea what you''re talking about, Nee-san.@k@v16/20600066. I don''t want to listen to rambling."'
8575: 'Shannon@r@v15/20500362."Then I''ll teach you in a way you can understand.@k@v15/20500363. .........Look, see what I''m pointing at?"'
8576: 'Kanon@r@v16/20600067."......?"'
8577: '@rShannon pointed straight at the sea, at the horizon.'
8578: '@rKanon didn''t understand what she was actually pointing at, and couldn''t do anything except look between the horizon and Shannon''s expression, which looked like it was posing a riddle.'
8579: 'Shannon@r@v15/20500364."The ocean.@k@v15/20500365. ......Kanon-kun, what color does the ocean look to you?"'
8580: '@rIt was an all too simple question.'
8581: '@rKanon tried to guess the meaning behind that question for a while,@k but since he couldn''t think of anything, he gave his answer straightforwardly.'
8582: 'Kanon@r@v16/20600068."...It''s an uninspiring dark gray.@k@v16/20600069. So what?"'
8583: '@rObjectively speaking, the sea, laid out beneath a cloudy sky, could probably be described best by Kanon''s words.'
8584: '@r......But as Shannon closed her eyes and smiled, she shook her head slightly.'
8585: 'Shannon@r@v15/20500366."It looks deep blue to me."'
8586: 'Kanon@r@v16/20600070."......Is that what you mean?@k @v16/20600071.Like using the word "@bao.@<blue@>" for a green traffic light?"'
8587: 'Shannon@r@v15/20500367."No.@k@v15/20500368. ......The ocean is deep blue.@k@v15/20500369. If I can see that, and you can''t,@k@v15/20500370. ...then...that''s exactly the reason..."'
8588: '@rKanon bit his lower lip and was silent for a while.'
8589: 'Kanon@r@v16/20600072."........................@k@v16/20600073. .........I.........can''t see it."'
8590: 'Shannon@r@v15/20500371."Kanon-kun,@k@v15/20500372. ......stick out your hand?"'
8591: '@rAs Kanon stood bewildered, unable to understand what she was saying, she took his arm, and opened the palm of his hand.'
8592: '@rShannon softly set something there.'
8593: '@rIt was that magic brooch, which she had received from BEATRICE.@k@rThe magic charm, shaped like a gold butterfly, which could fulfill love.'
8594: 'Kanon@r@v16/20600074."This is...@v16/20600075..........her......"'
8595: 'Shannon@r@v15/20500373."No, this is mine.@k@v15/20500374. ...So think of it as me and treat it with respect, okay?"'
8596: 'Kanon@r@v16/20600076."....................."'
8597: '@rAfter being told that, he couldn''t just throw it away.@k@rKanon didn''t know what he should do, and he stood there confused for a while, the brooch still on the palm of his hand.'
8598: '@rShannon put the palm of her hand on top of Kanon''s, and the brooch was warmed by both of their hands.'
8599: 'Shannon@r@v15/20500375."This charm holds true magical power.@k@v15/20500376. ......I''m sure that it will teach you an important emotion, Kanon-kun."'
8600: 'Kanon@r@v16/20600077."...There is nothing her magic can teach me."'
8601: 'Shannon@r@v15/20500377."No, there is.@k@v15/20500378. ......So wear it.@k@v15/20500379. If that''s embarrassing, I hear it''s okay if you just hide it in your pocket."'
8602: 'Kanon@r@v16/20600078."............Ridiculous...@k@v16/20600079. As if I''d be led astray by her magic."'
8603: '@rEven as he said that, Kanon couldn''t be cold-hearted towards something Shannon was pressing on him.'
8604: '@rIn the end, Kanon agreed reluctantly to take it,@k saying he''d prove that he wouldn''t surrender to the witch''s power.@k Shannon smiled and nodded back.'
8605: 'Shannon@r@v15/20500380."I''m sure you can learn something important from it.@k@v15/20500381. ......And I''m sure you can become human.@k@v15/20500382. And when you do, I''m sure that this ocean will look a beautiful blue to you as well."'
8606: 'Kanon@r@v16/20600080."...Gray is gray no matter how many times you look."'
8607: 'Shannon@r@v15/20500383."That''s wrong, Kanon-kun.@k@v15/20500384. ......It only looks like that because you have no ———."'
8608: 'Kanon@r@v16/20600081."Huh...?"'
8609: '@rBecause of the howling wind, he hadn''t been able to catch the critical part of what she''d just said.'
8610: '@rSo Shannon said it once more.'
8611: '@r...The single element of the world.@k She spoke once more of a world full of that element, where the sea was deep blue.'
8612: 'Shannon@r@v15/20500385."I''m sure you''ll be able to see a deep blue ocean.@k@v15/20500386. After all—"'
8613: '@rWithout love, it cannot be ''seen''.'
8614: 'Kinzo@r@v01/21500001.".........Who is there?"'
8615: 'Kanon@r@v16/20600082."......It is Kanon, my lord."'
8616: '@rIt was rare for Kinzo to leave his study.@k@r......However, that in itself didn''t mean his noble research had been suspended.'
8617: '@rHe may have left the study for a change of mood,@k but the thoughts filling his head were no different from those he had inside the study.'
8618: '@rSo Kanon knew that no matter what the time, speaking to Kinzo when he didn''t want to be spoken to would always be a disturbance to his research.'
8619: 'Kinzo@r@v01/21500002."The weather is heavy.@k@v01/21500003. Will it get worse?"'
8620: 'Kanon@r@v16/20600083."Yes.@k@v16/20600084. According to the weather report, it could rain at any time.@k@v16/20600085. ......Shall I bring you an umbrella, my lord?"'
8621: 'Kinzo@r@v01/21500004."That won''t be necessary.@k@v01/21500005. ......You should leave me alone for a while.@k@v01/21500006. If my children ask, say that you do not know where I am.@k@v01/21500007. I am busy on a journey through my own thoughts."'
8622: 'Kanon@r@v16/20600086."......Certainly.@k@v16/20600087. Then, if you would excuse me."'
8623: '@rDuring the time that Kanon bowed to him, Kinzo had already returned to his own world, and had forgotten that Kanon was there.'
8624: '@rAnd once again, he began rambling to himself.@k@rAmidst those words, ...the name of that witch was repeated many times.'
8625: 'Kinzo@r@v01/21500008."......Ooohh, BEATRICE...@k@v01/21500009. My hand does not reach your smile...@k@v01/21500010. What should I do to revive you—what should I do so that you smile at me once again...?@k@v01/21500011. ......What is lacking?@k@v01/21500012. My research? My materials? A catalyst?@k@v01/21500013. Or is it magical power or luck or an oracle...?!"'
8626: 'Kinzo@r@v01/21500014."Ooohhh, BEATRICE, what must I do to see your face one more time...?@k@v01/21500015. Ooooooooohhhhhhh......"'
8627: '@rAs Kanon listened to his master''s weeping voice over his shoulder, he turned around just once.'
8628: '@rWhen he did,@w583. ............right behind his isolated old master,@w666. ......was the silhouette of a person that shouldn''t have been there.'
8629: '@rIt was......the witch.'
8630: '@rAt once, Kanon, thinking that the witch must be plotting to do Kinzo some harm,@k quickly ran back to Kinzo, trying to become a shield himself.'
8631: '@rBut when he saw the expression on the witch''s face,@w583. ...that emotion of his vanished.'
8632: '@rBecause BEATRICE''s expression was one of...@w500....sorrow,@w500. ......or maybe pity.'
8633: 'BEATRICE@r@v27/20700310."You fool, Kinzo......@k@v27/20700311. ......I am right here, can you not ''see'' me?"'
8634: '@rRight behind Kinzo, as he repeated the witch''s name over and over, desiring to be reunited with her more than anything else, was the witch herself.'
8635: '@rAnd yet, Kinzo couldn''t notice a thing.@k@r......Even when BEATRICE tried to rest her hand on his shoulder, he didn''t notice a thing.'
8636: 'Kinzo@r@v01/21500016."...Why, why does my hand not reach BEATRICE''s smile?!@k @v01/21500017.Is it the phase of the moon,@k@v01/21500018. the period of the comets,@k@v01/21500019. the alignment of the planets?!@k @v01/21500020.What is lacking, what, what?!!"'
8637: 'BEATRICE@r@v27/20700312.".........It''s useless, Kinzo.@k@v27/20700313. ...Without love,@v27/20700314. it cannot be ''seen''."'
8638: '@rKanon took the brooch he had received from Shannon out of his pocket.'
8639: '@r......Could he learn something that would enable him, too, to ''see'' what he currently could not?'
8640: 'Kanon@r@v16/20600088.".................................@k@v16/20600089. Without love, it cannot be ''seen''."'
8641: '@rHe looked at Kinzo''s back once more.@k@r......The witch was no longer there.'